<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>My Ads — ZYNIX</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{background:#090d16;color:#f8fafc;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;min-height:100vh;}
  a{color:inherit;text-decoration:none;}

  #adv-login{position:fixed;inset:0;z-index:5000;background:#090d16;display:flex;align-items:center;justify-content:center;padding:20px;}
  #adv-login .card{background:#111827;border:1px solid #1e293b;border-radius:18px;padding:28px 22px;width:100%;max-width:380px;text-align:center;}
  #adv-login .logo{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#10b981,#3b82f6);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#000;margin:0 auto 18px;}
  #adv-login h1{font-size:20px;font-weight:900;color:#fff;margin-bottom:6px;}
  #adv-login p{font-size:12px;color:#94a3b8;line-height:1.6;margin-bottom:20px;}
  #adv-login .field{margin-bottom:12px;text-align:left;}
  #adv-login label{display:block;font-size:11px;color:#94a3b8;font-weight:800;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;}
  #adv-login input{width:100%;padding:12px;border-radius:10px;border:1px solid #1e293b;background:#0f172a;color:#fff;font-size:14px;outline:none;box-sizing:border-box;font-family:inherit;}
  #adv-login input:focus{border-color:#10b981;}
  #adv-login button.primary{width:100%;padding:13px;border-radius:10px;border:none;background:linear-gradient(135deg,#10b981,#3b82f6);color:#000;font-weight:900;font-size:13px;cursor:pointer;margin-top:8px;}
  #adv-login button.back{width:100%;padding:10px;border-radius:10px;border:1px solid #1e293b;background:transparent;color:#94a3b8;font-weight:700;font-size:12px;cursor:pointer;margin-top:8px;}

  #adv-shell{display:none;min-height:100vh;}
  #adv-shell.active{display:block;}

  .adv-header{position:fixed;top:0;left:0;right:0;height:56px;z-index:1000;background:rgba(9,13,22,.95);backdrop-filter:blur(12px);border-bottom:1px solid #1e293b;display:flex;align-items:center;justify-content:space-between;padding:0 16px;}
  .adv-header .brand{display:flex;align-items:center;gap:10px;}
  .adv-header .logo{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#10b981,#3b82f6);display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;font-size:13px;}
  .adv-header .title{font-size:15px;font-weight:900;color:#fff;}
  .adv-header .badge{font-size:9px;font-weight:900;color:#fbbf24;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.4);padding:3px 8px;border-radius:20px;letter-spacing:.4px;}
  .adv-header .right{display:flex;align-items:center;gap:8px;}
  .adv-header .user-chip{padding:5px 10px;border-radius:20px;background:#0f172a;border:1px solid #1e293b;font-size:11px;color:#cbd5e1;font-weight:700;}
  .adv-header .icon-btn{width:32px;height:32px;border-radius:50%;background:#0f172a;border:1px solid #1e293b;color:#cbd5e1;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;padding:0;}
  .adv-header .icon-btn:hover{border-color:#10b981;color:#10b981;}

  .adv-main{max-width:900px;margin:0 auto;padding:80px 20px 40px;}
  .adv-page-title{font-size:22px;font-weight:900;color:#fff;margin-bottom:6px;}
  .adv-page-sub{font-size:13px;color:#94a3b8;margin-bottom:20px;line-height:1.6;}

  .adv-btn{padding:11px 18px;border-radius:10px;border:none;font-size:13px;font-weight:900;cursor:pointer;font-family:inherit;}
  .adv-btn.primary{background:linear-gradient(135deg,#10b981,#3b82f6);color:#000;}
  .adv-btn.ghost{background:transparent;border:1px solid #1e293b;color:#cbd5e1;}
  .adv-btn.danger{background:rgba(161,98,98,.15);border:1px solid rgba(161,98,98,.5);color:#c9a5a5;}

  .adv-card{background:#131c30;border:1px solid #1e293b;border-radius:14px;padding:16px;margin-bottom:12px;}
  .adv-row{display:flex;gap:12px;align-items:flex-start;}
  .adv-thumb{width:80px;height:80px;border-radius:10px;background:#0f172a;overflow:hidden;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
  .adv-thumb img,.adv-thumb video{width:100%;height:100%;object-fit:cover;}
  .adv-thumb i{color:#334155;font-size:22px;}

  .adv-form-row{margin-bottom:12px;}
  .adv-form-row label{display:block;font-size:11px;color:#94a3b8;font-weight:800;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;}
  .adv-form-row input,.adv-form-row select,.adv-form-row textarea{width:100%;padding:11px;border-radius:10px;border:1px solid #1e293b;background:#0f172a;color:#fff;font-size:13px;outline:none;font-family:inherit;box-sizing:border-box;}
  .adv-form-row input:focus,.adv-form-row select:focus,.adv-form-row textarea:focus{border-color:#10b981;}
  .adv-form-row textarea{resize:vertical;min-height:70px;}

  .adv-modal-overlay{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.85);display:flex;align-items:flex-end;padding:0;}
  .adv-modal{background:#111827;border-top-left-radius:20px;border-top-right-radius:20px;border-top:1px solid #1e293b;max-height:92vh;overflow-y:auto;padding:20px;width:100%;animation:slideUp .25s ease;}
  @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
  .adv-modal h3{font-size:15px;font-weight:900;color:#fff;margin-bottom:14px;}

  .adv-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111827;border:1px solid #1e293b;border-radius:12px;padding:11px 16px;font-size:12.5px;color:#e2e8f0;font-weight:700;box-shadow:0 8px 28px rgba(0,0,0,.7);z-index:99999;opacity:0;transition:opacity .25s;pointer-events:none;}
  .adv-toast.show{opacity:1;}
  .adv-toast.error{border-color:rgba(161,98,98,.5);color:#fca5a5;}

  @media(min-width:641px){
    .adv-modal-overlay{align-items:center;padding:16px;}
    .adv-modal{border-radius:14px;max-width:520px;border:1px solid #1e293b;}
  }
</style>
</head>
<body>

<div id="adv-login">
  <div class="card">
    <div class="logo">Z</div>
    <h1>ZYNIX Ads</h1>
    <p>Sign in with your ZYNIX account to submit and manage your ads.</p>
    <div class="field"><label>Email</label><input id="adv-email" type="email" placeholder="you@example.com" autocomplete="email"></div>
    <div class="field"><label>Password</label><input id="adv-pass" type="password" placeholder="••••••••" autocomplete="current-password"></div>
    <button id="adv-signin" class="primary">Sign In</button>
    <button class="back" onclick="window.location.href='/'">← Back to ZYNIX</button>
  </div>
</div>

<div id="adv-shell">
  <header class="adv-header">
    <div class="brand">
      <div class="logo">Z</div>
      <div class="title">ZYNIX</div>
      <div class="badge">MY ADS</div>
    </div>
    <div class="right">
      <div class="user-chip" id="adv-user-name">…</div>
      <button class="icon-btn" title="Back to ZYNIX" onclick="window.location.href='/'">
        <i class="fa-solid fa-arrow-up-right-from-square"></i>
      </button>
      <button class="icon-btn" title="Sign out" id="adv-signout">
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>
    </div>
  </header>

  <main class="adv-main" id="adv-main"></main>
</div>

<div class="adv-toast" id="adv-toast"></div>

<script>
(function(){
'use strict';

var SUPABASE_URL = 'https://ipypwqajsfxrdzlxfnlr.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlweXB3cWFqc2Z4cmR6bHhmbmxyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2OTEzODUsImV4cCI6MjEwNDI2NzM4NX0.QW6tzaMxlNg9EYuRq0tCOlGipBlrjBuiV6lZuSr1Jj4';

var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});

var State = {
  user: null,
  profile: null,
  myAds: [],
  editingAd: null,
  mediaFile: null,
  adDraft: null
};

function $(id){ return document.getElementById(id); }
function esc(s){
  if(s == null) return '';
  return String(s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}
function money(n){ return '$' + (Number(n)||0).toFixed(2); }
function timeAgo(ts){
  if(!ts) return '';
  var s = Math.floor((Date.now() - new Date(ts).getTime())/1000);
  if(s < 60) return s + 's ago';
  if(s < 3600) return Math.floor(s/60) + 'm ago';
  if(s < 86400) return Math.floor(s/3600) + 'h ago';
  if(s < 2592000) return Math.floor(s/86400) + 'd ago';
  return new Date(ts).toLocaleDateString();
}
function toast(m, isErr){
  var t = $('adv-toast');
  t.textContent = m;
  t.className = 'adv-toast show' + (isErr ? ' error' : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.className = 'adv-toast'; }, 3000);
}

/* ============================================================
   AUTH
   ============================================================ */
async function trySession(){
  try {
    var s = await sb.auth.getSession();
    var session = s && s.data ? s.data.session : null;
    if(!session || !session.user) return false;
    State.user = session.user;
    var pr = await sb.from('profiles').select('id,name,username,avatar').eq('id', State.user.id).maybeSingle();
    State.profile = pr.data || { name: State.user.email };
    return true;
  } catch(e){ return false; }
}

async function signIn(email, pass){
  var btn = $('adv-signin');
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    var r = await sb.auth.signInWithPassword({ email: email, password: pass });
    if(r.error) throw r.error;
    State.user = r.data.user;
    var pr = await sb.from('profiles').select('id,name,username,avatar').eq('id', State.user.id).maybeSingle();
    State.profile = pr.data || { name: State.user.email };
    enterShell();
  } catch(e){
    toast((e && e.message) || 'Sign in failed.', true);
  } finally {
    btn.disabled = false; btn.textContent = 'Sign In';
  }
}

async function signOut(){
  try { await sb.auth.signOut(); } catch(e){}
  State.user = null; State.profile = null; State.myAds = [];
  $('adv-shell').classList.remove('active');
  $('adv-login').style.display = 'flex';
  $('adv-pass').value = '';
}

function enterShell(){
  $('adv-login').style.display = 'none';
  $('adv-shell').classList.add('active');
  $('adv-user-name').textContent = State.profile.name || State.profile.username || 'User';
  renderDashboard();
}

/* ============================================================
   DASHBOARD
   ============================================================ */
async function renderDashboard(){
  var main = $('adv-main');
  main.innerHTML =
    '<div class="adv-page-title">My Ads</div>' +
    '<div class="adv-page-sub">Submit ads to Ad TV. Rate: $0.02 per 10-second view. Budget held from your wallet; refunded if you delete an ad.</div>' +
    '<div style="display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;">' +
      '<button class="adv-btn primary" id="adv-new"><i class="fa-solid fa-plus"></i> New ad</button>' +
      '<button class="adv-btn ghost" id="adv-refresh"><i class="fa-solid fa-rotate"></i> Refresh</button>' +
    '</div>' +
    '<div id="adv-list"><div style="text-align:center;padding:40px;color:#64748b;"><i class="fa-solid fa-circle-notch fa-spin;"></i></div></div>';

  $('adv-new').addEventListener('click', function(){ openAdEditor(null); });
  $('adv-refresh').addEventListener('click', loadAds);
  loadAds();
}

async function loadAds(){
  var host = $('adv-list');
  host.innerHTML = '<div style="text-align:center;padding:40px;color:#64748b;"><i class="fa-solid fa-circle-notch fa-spin;"></i></div>';

  try {
    var r = await sb.rpc('advertiser_my_ads');
    if(r.error) throw r.error;
    var list = r.data || [];
    State.myAds = list;

    if(!list.length){
      host.innerHTML = '<div style="padding:60px 20px;text-align:center;border-radius:14px;background:#131c30;border:1px dashed #1e293b;color:#94a3b8;font-size:13px;line-height:1.7;">' +
        '<i class="fa-solid fa-tv" style="font-size:40px;color:#334155;display:block;margin-bottom:14px;"></i>' +
        'No ads yet.<br><span style="font-size:11.5px;color:#64748b;">Click "New ad" to submit your first campaign.</span>' +
      '</div>';
      return;
    }

    var h = '';
    list.forEach(function(a){
      var spent = Number(a.total_spent) || 0;
      var budget = Number(a.monthly_budget) || 0;
      var remaining = Math.max(0, budget - spent);
      var pct = budget > 0 ? Math.min(100, (spent / budget) * 100) : 0;
      var isExhausted = remaining <= 0.01;

      h += '<div class="adv-card">';
      h += '<div class="adv-row">';
      var thumbHtml = a.media_url
        ? (a.media_type === 'video'
            ? '<video src="' + esc(a.media_url) + '" muted></video>'
            : '<img src="' + esc(a.media_url) + '">')
        : '<i class="fa-solid fa-image"></i>';
      h += '<div class="adv-thumb">' + thumbHtml + '</div>';
      h += '<div style="flex:1;min-width:0;">';
      h += '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">';
      h += '<span style="font-size:13.5px;font-weight:900;color:#fff;">' + esc(a.internal_title || a.heading || 'Untitled') + '</span>';
      if(!a.is_active) h += '<span style="font-size:9.5px;font-weight:900;padding:3px 8px;border-radius:10px;background:rgba(148,163,184,.15);color:#94a3b8;">PAUSED</span>';
      else if(isExhausted) h += '<span style="font-size:9.5px;font-weight:900;padding:3px 8px;border-radius:10px;background:rgba(161,98,98,.15);color:#a16262;">EXHAUSTED</span>';
      else h += '<span style="font-size:9.5px;font-weight:900;padding:3px 8px;border-radius:10px;background:rgba(16,185,129,.15);color:#10b981;">ACTIVE</span>';
      h += '</div>';
      if(a.heading) h += '<div style="font-size:11.5px;color:#cbd5e1;margin-top:4px;">' + esc(a.heading) + '</div>';
      h += '<div style="font-size:10.5px;color:#94a3b8;margin-top:6px;">' + (a.total_views||0) + ' views · ' + timeAgo(a.created_at) + '</div>';
      h += '</div></div>';

      h += '<div style="margin-top:12px;">';
      h += '<div style="display:flex;justify-content:space-between;font-size:11px;color:#94a3b8;margin-bottom:6px;">';
      h += '<span>Budget used</span><span style="font-weight:900;color:#fff;">' + money(spent) + ' / ' + money(budget) + '</span>';
      h += '</div>';
      h += '<div style="height:6px;border-radius:3px;background:rgba(0,0,0,.35);overflow:hidden;margin-bottom:6px;">';
      h += '<div style="height:100%;width:' + pct + '%;background:' + (isExhausted ? '#a16262' : 'linear-gradient(90deg,#10b981,#3b82f6)') + ';"></div>';
      h += '</div>';
      h += '<div style="display:flex;justify-content:space-between;font-size:10.5px;">';
      h += '<span style="color:#64748b;">Remaining: <b style="color:#10b981;">' + money(remaining) + '</b></span>';
      h += '<span style="color:#64748b;">~' + Math.floor(remaining / 0.02) + ' views left</span>';
      h += '</div></div>';

      h += '<div style="display:flex;gap:8px;margin-top:14px;">';
      h += '<button class="adv-btn ghost" data-a-edit="' + esc(a.id) + '" style="flex:1;font-size:11.5px;padding:9px;"><i class="fa-solid fa-pen"></i> Edit</button>';
      if(!isExhausted){
        h += '<button class="adv-btn ghost" data-a-toggle="' + esc(a.id) + '" data-a-active="' + (a.is_active ? '1' : '0') + '" style="flex:1;font-size:11.5px;padding:9px;"><i class="fa-solid fa-' + (a.is_active ? 'pause' : 'play') + '"></i> ' + (a.is_active ? 'Pause' : 'Resume') + '</button>';
      }
      h += '<button class="adv-btn danger" data-a-del="' + esc(a.id) + '" data-a-title="' + esc(a.internal_title || 'Untitled') + '" style="padding:9px 14px;font-size:11.5px;"><i class="fa-solid fa-trash"></i></button>';
      h += '</div>';
      h += '</div>';
    });
    host.innerHTML = h;

    host.querySelectorAll('[data-a-edit]').forEach(function(b){
      b.addEventListener('click', function(){
        var id = this.getAttribute('data-a-edit');
        var ad = State.myAds.find(function(x){ return x.id === id; });
        if(ad) openAdEditor(ad);
      });
    });
    host.querySelectorAll('[data-a-toggle]').forEach(function(b){
      b.addEventListener('click', function(){
        toggleAd(this.getAttribute('data-a-toggle'), this.getAttribute('data-a-active') === '1');
      });
    });
    host.querySelectorAll('[data-a-del]').forEach(function(b){
      b.addEventListener('click', function(){
        deleteAd(this.getAttribute('data-a-del'), this.getAttribute('data-a-title'));
      });
    });
  } catch(e){
    console.error('[my ads]', e);
    host.innerHTML = '<div style="padding:40px;text-align:center;color:#a16262;font-size:12px;">Failed: ' + esc(e.message || 'unknown') + '</div>';
  }
}

/* ============================================================
   AD EDITOR (create + edit)
   ============================================================ */
function openAdEditor(ad){
  var isEdit = !!ad;
  State.editingAd = ad;

  var draft = (!isEdit && State.adDraft) ? State.adDraft : null;
  var d = ad || draft || {
    internal_title:'', heading:'', subtitle:'', cta:'',
    media_type:'', media_url:'', monthly_budget:''
  };

  if(!isEdit && draft && draft.mediaFile){
    State.mediaFile = draft.mediaFile;
  } else {
    State.mediaFile = null;
  }

  var shell = document.createElement('div');
  shell.className = 'adv-modal-overlay';
  shell.id = 'adv-editor';

  var inner = document.createElement('div');
  inner.className = 'adv-modal';

  var h = '';
  h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">';
  h += '<h3 style="margin:0;">' + (isEdit ? 'Edit ad' : 'New ad') + '</h3>';
  h += '<button id="adv-ed-close" style="background:transparent;border:none;color:#94a3b8;font-size:22px;cursor:pointer;padding:0;">&times;</button>';
  h += '</div>';

  if(!isEdit){
    h += '<div style="padding:12px;border-radius:10px;background:rgba(59,130,246,.06);border:1px solid rgba(59,130,246,.28);font-size:11.5px;color:#cbd5e1;line-height:1.65;margin-bottom:14px;">';
    h += '<b style="color:#60a5fa;">Ad Rules & Terms</b><br>';
    h += '• Video ads: max <b style="color:#fff;">10 seconds</b><br>';
    h += '• Image ads: displayed for <b style="color:#fff;">3 seconds</b><br>';
    h += '• Rate: $0.02 per completed view<br>';
    h += '• <b style="color:#fbbf24;">No external links allowed.</b> Only ZYNIX internal links (shop, circle, SPACE) are permitted.<br>';
    h += '• Budget held from your wallet at submit<br>';
    h += '• Delete ad → unspent budget refunded<br>';
    h += '• One device = one earning viewer (anti-fraud)';
    h += '</div>';
  }

  h += '<div class="adv-form-row"><label>Internal title (only you see)</label>';
  h += '<input id="adv-f-title" maxlength="80" value="' + esc(d.internal_title) + '" placeholder="e.g. Summer promo Sep 2026"></div>';

  h += '<div class="adv-form-row"><label>Heading (shown on ad)</label>';
  h += '<input id="adv-f-heading" maxlength="60" value="' + esc(d.heading || '') + '" placeholder="Short bold text"></div>';

  h += '<div class="adv-form-row"><label>Subtitle</label>';
  h += '<input id="adv-f-sub" maxlength="100" value="' + esc(d.subtitle || '') + '" placeholder="Supporting line"></div>';

  h += '<div class="adv-form-row"><label>CTA label (optional)</label>';
  h += '<input id="adv-f-cta" maxlength="30" value="' + esc(d.cta || '') + '" placeholder="e.g. Shop now"></div>';

  h += '<div class="adv-form-row"><label>Media (image · 3s display · OR video · max 10s)</label>';
  h += '<input type="file" id="adv-f-file" accept="image/*,video/*" style="display:none;">';
  h += '<div style="display:flex;gap:8px;">';
  h += '<button type="button" id="adv-f-pick" class="adv-btn ghost" style="flex:1;font-size:12px;"><i class="fa-solid fa-cloud-arrow-up"></i> Choose file</button>';
  h += '</div>';
  h += '<div id="adv-f-preview" style="margin-top:10px;height:140px;border-radius:10px;background:#0f172a;border:1px solid #1e293b;overflow:hidden;display:flex;align-items:center;justify-content:center;background-size:cover;background-position:center;"></div>';
  h += '<div id="adv-f-note" style="font-size:10.5px;color:#94a3b8;margin-top:6px;line-height:1.5;"></div>';
  h += '</div>';

  if(!isEdit){
    h += '<div class="adv-form-row"><label>Budget (USD, min $1, max $5,000)</label>';
    h += '<input id="adv-f-budget" type="number" min="1" max="5000" step="1" value="' + esc(d.monthly_budget || '') + '" placeholder="e.g. 50"></div>';
    h += '<div id="adv-f-budget-info" style="padding:10px 12px;border-radius:8px;background:rgba(0,0,0,.25);font-size:11px;color:#cbd5e1;line-height:1.55;margin-bottom:12px;"></div>';
  }

  h += '<div style="display:flex;gap:8px;margin-top:16px;">';
  h += '<button id="adv-ed-save" class="adv-btn primary" style="flex:1;">' + (isEdit ? 'Save changes' : 'Submit ad') + '</button>';
  h += '<button id="adv-ed-cancel" class="adv-btn ghost">Cancel</button>';
  h += '</div>';

  inner.innerHTML = h;
  shell.appendChild(inner);
  document.body.appendChild(shell);

  var preview = $('adv-f-preview');
  var noteEl = $('adv-f-note');

  /* Restore preview if draft/edit had media */
  if(State.mediaFile){
    var url0 = URL.createObjectURL(State.mediaFile);
    var isVid0 = State.mediaFile.type && State.mediaFile.type.indexOf('video/') === 0;
    if(isVid0){
      preview.innerHTML = '<video src="' + url0 + '" controls muted style="width:100%;height:100%;object-fit:cover;background:#000;"></video>';
      noteEl.textContent = 'Video ad · will play for up to 10 seconds on Ad TV';
    } else {
      preview.style.backgroundImage = 'url(' + url0 + ')';
      noteEl.textContent = 'Image ad · will display for 3 seconds on Ad TV';
    }
    addRemoveBtn();
  } else if(d.media_url){
    if(d.media_type === 'video'){
      preview.innerHTML = '<video src="' + esc(d.media_url) + '" controls muted style="width:100%;height:100%;object-fit:cover;background:#000;"></video>';
      noteEl.textContent = 'Video ad · will play for up to 10 seconds on Ad TV';
    } else {
      preview.style.backgroundImage = 'url(' + esc(d.media_url) + ')';
      noteEl.textContent = 'Image ad · will display for 3 seconds on Ad TV';
    }
    if(isEdit) addRemoveBtn();
  } else {
    preview.innerHTML = '<i class="fa-solid fa-image" style="color:#334155;font-size:28px;"></i>';
    noteEl.textContent = '';
  }

  function addRemoveBtn(){
    if($('adv-f-rm')) return;
    var b = document.createElement('button');
    b.id = 'adv-f-rm';
    b.type = 'button';
    b.className = 'adv-btn danger';
    b.style.fontSize = '12px';
    b.innerHTML = '<i class="fa-solid fa-xmark"></i>';
    b.addEventListener('click', function(){
      State.mediaFile = null;
      d.media_url = '';
      $('adv-f-file').value = '';
      preview.style.backgroundImage = 'none';
      preview.innerHTML = '<i class="fa-solid fa-image" style="color:#334155;font-size:28px;"></i>';
      noteEl.textContent = '';
      b.remove();
    });
    $('adv-f-pick').parentNode.appendChild(b);
  }

  function updateBudgetInfo(){
    if(!$('adv-f-budget')) return;
    var v = parseFloat($('adv-f-budget').value) || 0;
    var views = Math.floor(v / 0.02);
    var info = $('adv-f-budget-info');
    if(v <= 0){
      info.innerHTML = 'Budget held from your wallet. Example: <b style="color:#fff;">$50</b> = up to <b style="color:#10b981;">2,500 views</b>.';
    } else {
      info.innerHTML = 'Budget: <b style="color:#fff;">' + money(v) + '</b> → up to <b style="color:#10b981;">' + views.toLocaleString() + ' views</b>';
    }
  }
  updateBudgetInfo();

  function saveDraftNow(){
    if(isEdit) return;
    State.adDraft = {
      internal_title: ($('adv-f-title')||{}).value || '',
      heading: ($('adv-f-heading')||{}).value || '',
      subtitle: ($('adv-f-sub')||{}).value || '',
      cta: ($('adv-f-cta')||{}).value || '',
      media_type: d.media_type || '',
      media_url: d.media_url || '',
      monthly_budget: ($('adv-f-budget')||{}).value || '',
      mediaFile: State.mediaFile
    };
  }

  ['adv-f-title','adv-f-heading','adv-f-sub','adv-f-cta'].forEach(function(id){
    var el = $(id); if(el) el.addEventListener('input', saveDraftNow);
  });
  var bEl = $('adv-f-budget');
  if(bEl){ bEl.addEventListener('input', function(){ saveDraftNow(); updateBudgetInfo(); }); }

  function acceptFile(f, isVid){
    State.mediaFile = f;
    var url = URL.createObjectURL(f);
    if(isVid){
      preview.style.backgroundImage = 'none';
      preview.innerHTML = '<video src="' + url + '" controls muted style="width:100%;height:100%;object-fit:cover;background:#000;"></video>';
      noteEl.textContent = 'Video ad · will play for up to 10 seconds on Ad TV';
    } else {
      preview.innerHTML = '';
      preview.style.backgroundImage = 'url(' + url + ')';
      noteEl.textContent = 'Image ad · will display for 3 seconds on Ad TV';
    }
    addRemoveBtn();
    saveDraftNow();
  }

  $('adv-f-pick').addEventListener('click', function(){ $('adv-f-file').click(); });

  $('adv-f-file').addEventListener('change', function(){
    var f = this.files && this.files[0];
    if(!f) return;
    if(f.size > 100 * 1024 * 1024){ toast('Under 100 MB.', true); this.value = ''; return; }

    var isVid = f.type && f.type.indexOf('video/') === 0;
    if(isVid){
      var urlProbe = URL.createObjectURL(f);
      var probe = document.createElement('video');
      probe.preload = 'metadata';
      probe.onloadedmetadata = function(){
        var dur = probe.duration || 0;
        URL.revokeObjectURL(urlProbe);
        if(dur > 10.5){
          toast('Video ad max 10 seconds. Yours is ' + Math.round(dur) + 's.', true);
          $('adv-f-file').value = '';
          return;
        }
        acceptFile(f, true);
      };
      probe.onerror = function(){
        URL.revokeObjectURL(urlProbe);
        toast('Could not read video file.', true);
        $('adv-f-file').value = '';
      };
      probe.src = urlProbe;
      return;
    }
    acceptFile(f, false);
  });

  function closeAndKeepDraft(){
    saveDraftNow();
    shell.remove();
  }
  $('adv-ed-close').addEventListener('click', closeAndKeepDraft);
  $('adv-ed-cancel').addEventListener('click', closeAndKeepDraft);

  $('adv-ed-save').addEventListener('click', async function(){
    var btn = this;
    var title = ($('adv-f-title').value || '').trim();
    var heading = ($('adv-f-heading').value || '').trim();
    var subtitle = ($('adv-f-sub').value || '').trim();
    var cta = ($('adv-f-cta').value || '').trim();

    if(title.length < 2){ toast('Internal title required.', true); return; }

    var mediaUrl = d.media_url || '';
    var mediaType = d.media_type || '';
    var file = State.mediaFile;

    if(!isEdit){
      var budget = parseFloat($('adv-f-budget').value || '0');
      if(!budget || budget < 1){ toast('Budget min $1.', true); return; }
      if(budget > 5000){ toast('Budget max $5,000.', true); return; }
      if(!file && !mediaUrl){ toast('Upload an image or video.', true); return; }
    }

    btn.disabled = true;
    btn.textContent = file ? 'Uploading…' : 'Saving…';

    try {
      if(file){
        btn.textContent = 'Uploading media…';
        var uploadUrl = await uploadMedia(file);
        if(!uploadUrl) throw new Error('upload failed');
        mediaUrl = uploadUrl;
        mediaType = file.type.indexOf('video/') === 0 ? 'video' : 'image';
      }

      if(isEdit){
        var r = await sb.rpc('advertiser_update_ad', {
          p_ad_id: ad.id,
          p_internal_title: title,
          p_heading: heading,
          p_subtitle: subtitle,
          p_cta: cta,
          p_media_type: mediaType,
          p_media_url: mediaUrl,
          p_budget: null
        });
        if(r.error) throw r.error;
        toast('Ad updated.');
      } else {
        var budget2 = parseFloat($('adv-f-budget').value || '0');
        var r2 = await sb.rpc('advertiser_submit_ad', {
          p_internal_title: title,
          p_heading: heading,
          p_subtitle: subtitle,
          p_cta: cta,
          p_media_type: mediaType,
          p_media_url: mediaUrl,
          p_bg_id: 'deep-blue',
          p_wp_id: '',
          p_font_id: 'display',
          p_budget: budget2
        });
        if(r2.error) throw r2.error;
        var d2 = r2.data || {};
        toast('Ad submitted · ' + money(d2.amount) + ' held from ' + d2.paid_from + '.');
        State.adDraft = null;
        State.mediaFile = null;
      }

      shell.remove();
      loadAds();
    } catch(e){
      var msg = (e && e.message) || 'unknown';
      if(msg.indexOf('insufficient_funds') !== -1) toast('Not enough wallet balance.', true);
      else if(msg.indexOf('min_budget_1') !== -1) toast('Minimum budget is $1.', true);
      else if(msg.indexOf('max_budget_5000') !== -1) toast('Maximum budget is $5,000.', true);
      else toast('Failed: ' + msg, true);
      btn.disabled = false;
      btn.textContent = isEdit ? 'Save changes' : 'Submit ad';
    }
  });
}

/* ============================================================
   MEDIA UPLOAD — same /api/r2-presign used by main site
   ============================================================ */
async function uploadMedia(file){
  try {
    var s = await sb.auth.getSession();
    var session = s && s.data ? s.data.session : null;
    if(!session) throw new Error('not logged in');

    var ext = 'bin';
    if(file.name && file.name.indexOf('.') > -1) ext = file.name.split('.').pop().toLowerCase();
    var path = State.user.id + '/ads/' + Date.now() + '_' + Math.random().toString(36).slice(2,8) + '.' + ext;

    var presignRes = await fetch('/api/r2-presign', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + session.access_token
      },
      body: JSON.stringify({
        action: 'put',
        path: path,
        contentType: file.type || ''
      })
    });
    if(!presignRes.ok) throw new Error('presign failed');
    var presignData = await presignRes.json();
    if(!presignData.url) throw new Error('no url');

    var putRes = await fetch(presignData.url, {
      method: 'PUT',
      body: file,
      headers: {
        'Content-Type': presignData.contentType || file.type || 'application/octet-stream',
        'Cache-Control': 'public, max-age=31536000'
      }
    });
    if(!putRes.ok) throw new Error('upload failed');

    var base = 'https://pub-cd1b1d46d6d2450283f494cb457ca83e.r2.dev';
    return base + '/' + path;
  } catch(e){
    console.error('[upload]', e);
    return null;
  }
}

/* ============================================================
   TOGGLE / DELETE
   ============================================================ */
async function toggleAd(id, wasActive){
  try {
    var r = await sb.rpc('advertiser_toggle_ad', { p_ad_id: id, p_active: !wasActive });
    if(r.error) throw r.error;
    toast(!wasActive ? 'Ad resumed.' : 'Ad paused.');
    loadAds();
  } catch(e){ toast('Failed: ' + ((e && e.message) || 'unknown'), true); }
}

async function deleteAd(id, title){
  if(!confirm('Delete ad "' + title + '"?\n\nUnspent budget will be refunded to your wallet.')) return;
  try {
    var r = await sb.rpc('advertiser_delete_ad', { p_ad_id: id });
    if(r.error) throw r.error;
    var d = r.data || {};
    toast('Ad deleted · ' + money(d.refunded) + ' refunded.');
    loadAds();
  } catch(e){ toast('Failed: ' + ((e && e.message) || 'unknown'), true); }
}

/* ============================================================
   BOOT
   ============================================================ */
async function boot(){
  $('adv-signin').addEventListener('click', function(){
    var email = ($('adv-email').value || '').trim();
    var pass = $('adv-pass').value || '';
    if(!email || !pass){ toast('Enter email and password.', true); return; }
    signIn(email, pass);
  });
  $('adv-pass').addEventListener('keydown', function(e){ if(e.key === 'Enter') $('adv-signin').click(); });
  $('adv-signout').addEventListener('click', signOut);

  var ok = await trySession();
  if(ok) enterShell();
  else $('adv-login').style.display = 'flex';
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

console.log('[Advertiser Portal] ready');
})();
</script>

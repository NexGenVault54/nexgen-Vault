<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ZYNIX Circles</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#090d16; color:#f8fafc; font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif; min-height:100vh; display:flex; flex-direction:column; }
  .zynix-header { position:fixed; top:0; left:0; right:0; z-index:1000; background:rgba(9,13,22,.92); backdrop-filter:blur(12px); border-bottom:1px solid #1e293b; padding:10px 16px; display:flex; align-items:center; justify-content:space-between; min-height:56px; }
  .header-logo { width:30px; height:30px; border-radius:50%; background:linear-gradient(135deg,#10b981,#3b82f6); display:flex; align-items:center; justify-content:center; font-weight:900; color:#000; font-size:14px; }
  .header-title { font-size:18px; font-weight:900; background:linear-gradient(90deg,#10b981,#3b82f6,#8b5cf6); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .page-main { flex:1; max-width:600px; width:100%; margin:0 auto; padding:80px 20px 40px; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .page-icon { width:80px; height:80px; border-radius:22px; background:linear-gradient(135deg,rgba(16,185,129,.20),rgba(59,130,246,.15)); border:1px solid rgba(16,185,129,.40); display:flex; align-items:center; justify-content:center; margin:0 auto 22px; }
  .page-icon i { font-size:34px; color:#10b981; }
  .page-title { font-size:26px; font-weight:900; color:#fff; margin-bottom:10px; letter-spacing:.2px; }
  .page-sub { font-size:13px; color:#94a3b8; line-height:1.65; max-width:420px; margin:0 auto 22px; }
  .page-tag { display:inline-flex; align-items:center; gap:6px; padding:5px 14px; border-radius:20px; background:rgba(16,185,129,.10); border:1px solid rgba(16,185,129,.35); color:#10b981; font-size:11px; font-weight:900; letter-spacing:.4px; text-transform:uppercase; margin-bottom:22px; }
  .page-cta { display:inline-flex; align-items:center; gap:8px; padding:13px 26px; border-radius:12px; border:none; background:linear-gradient(135deg,#10b981,#3b82f6); color:#000; font-weight:900; font-size:13px; text-decoration:none; cursor:pointer; }
  .page-cta i { font-size:12px; }
</style>
</head>
<body>

<header class="zynix-header">
  <a href="/" style="display:flex;align-items:center;gap:8px;background:transparent;border:none;cursor:pointer;text-decoration:none;">
    <div class="header-logo">Z</div>
    <span class="header-title">ZYNIX</span>
  </a>
  <div style="font-size:11px;color:#64748b;font-weight:700;">CIRCLES</div>
</header>

<main class="page-main">
  <div class="page-icon"><i class="fa-solid fa-circle-nodes"></i></div>
  <span class="page-tag"><i class="fa-solid fa-hammer"></i> Building</span>
  <h1 class="page-title">ZYNIX Circles</h1>
  <p class="page-sub">
    Communities for creators, shops, and learning groups — being rebuilt here.
    In the meantime, the Circles feed lives inside the main ZYNIX app.
  </p>
  <a href="/" class="page-cta">
    <i class="fa-solid fa-arrow-left"></i> Back to ZYNIX
  </a>
</main>

</body>
</html>

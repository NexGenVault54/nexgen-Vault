<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ZYNIX Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{background:#090d16;color:#f8fafc;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;min-height:100vh;overflow-x:hidden;}
  a{color:inherit;text-decoration:none;}

  /* ---------- Login screen ---------- */
  #adm-login{position:fixed;inset:0;z-index:5000;background:#090d16;display:flex;align-items:center;justify-content:center;padding:20px;}
  #adm-login .card{background:#111827;border:1px solid #1e293b;border-radius:18px;padding:28px 22px;width:100%;max-width:380px;text-align:center;}
  #adm-login .logo{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#10b981,#3b82f6);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#000;margin:0 auto 18px;}
  #adm-login h1{font-size:20px;font-weight:900;color:#fff;margin-bottom:6px;}
  #adm-login p{font-size:12px;color:#94a3b8;line-height:1.6;margin-bottom:20px;}
  #adm-login .field{margin-bottom:12px;text-align:left;}
  #adm-login label{display:block;font-size:11px;color:#94a3b8;font-weight:800;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;}
  #adm-login input{width:100%;padding:12px;border-radius:10px;border:1px solid #1e293b;background:#0f172a;color:#fff;font-size:14px;outline:none;font-family:inherit;box-sizing:border-box;}
  #adm-login input:focus{border-color:#10b981;}
  #adm-login button.primary{width:100%;padding:13px;border-radius:10px;border:none;background:linear-gradient(135deg,#10b981,#3b82f6);color:#000;font-weight:900;font-size:13px;cursor:pointer;margin-top:8px;}
  #adm-login button.primary:disabled{opacity:.5;cursor:not-allowed;}
  #adm-login button.back{width:100%;padding:10px;border-radius:10px;border:1px solid #1e293b;background:transparent;color:#94a3b8;font-weight:700;font-size:12px;cursor:pointer;margin-top:8px;}

  /* ---------- Access denied ---------- */
  #adm-denied{position:fixed;inset:0;z-index:5000;background:#090d16;display:none;align-items:center;justify-content:center;padding:20px;}
  #adm-denied .card{background:#111827;border:1px solid rgba(161,98,98,.4);border-radius:18px;padding:28px 22px;width:100%;max-width:380px;text-align:center;}
  #adm-denied .icon{width:60px;height:60px;border-radius:50%;background:rgba(161,98,98,.15);border:1px solid rgba(161,98,98,.5);display:flex;align-items:center;justify-content:center;font-size:24px;color:#a16262;margin:0 auto 16px;}
  #adm-denied h2{font-size:18px;font-weight:900;color:#fff;margin-bottom:8px;}
  #adm-denied p{font-size:12.5px;color:#cbd5e1;line-height:1.6;margin-bottom:18px;}

  /* ---------- Shell ---------- */
  #adm-shell{display:none;min-height:100vh;}
  #adm-shell.active{display:block;}

  .adm-header{position:fixed;top:0;left:0;right:0;height:56px;z-index:1000;background:rgba(9,13,22,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid #1e293b;display:flex;align-items:center;justify-content:space-between;padding:0 16px;}
  .adm-header .brand{display:flex;align-items:center;gap:10px;}
  .adm-header .logo{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#10b981,#3b82f6);display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;font-size:13px;}
  .adm-header .title{font-size:15px;font-weight:900;background:linear-gradient(90deg,#10b981,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .adm-header .badge{font-size:9px;font-weight:900;color:#fbbf24;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.4);padding:3px 8px;border-radius:20px;letter-spacing:.4px;}
  .adm-header .right{display:flex;align-items:center;gap:8px;}
  .adm-header .user-chip{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:20px;background:#0f172a;border:1px solid #1e293b;font-size:11px;color:#cbd5e1;font-weight:700;}
  .adm-header .user-chip .role{color:#fbbf24;font-size:9.5px;}
  .adm-header .icon-btn{width:32px;height:32px;border-radius:50%;background:#0f172a;border:1px solid #1e293b;color:#cbd5e1;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;padding:0;}
  .adm-header .icon-btn:hover{border-color:#10b981;color:#10b981;}

  .adm-body{display:flex;padding-top:56px;min-height:100vh;}

  .adm-sidebar{width:220px;background:#0b1220;border-right:1px solid #1e293b;padding:14px 10px;flex-shrink:0;position:fixed;top:56px;bottom:0;left:0;overflow-y:auto;z-index:500;}
  .adm-sidebar .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#94a3b8;font-size:12.5px;font-weight:700;cursor:pointer;margin-bottom:2px;border:1px solid transparent;background:transparent;width:100%;text-align:left;font-family:inherit;}
  .adm-sidebar .nav-item:hover{background:rgba(16,185,129,.06);color:#e2e8f0;}
  .adm-sidebar .nav-item.active{background:rgba(16,185,129,.10);border-color:rgba(16,185,129,.4);color:#10b981;}
  .adm-sidebar .nav-item i{width:16px;text-align:center;font-size:13px;}
  .adm-sidebar .nav-item .badge{margin-left:auto;font-size:9px;font-weight:900;background:#ef4444;color:#fff;padding:1px 6px;border-radius:8px;display:none;}
  .adm-sidebar .divider{height:1px;background:#1e293b;margin:8px 6px;}
  .adm-sidebar .nav-section{font-size:9.5px;color:#475569;font-weight:900;text-transform:uppercase;letter-spacing:.6px;padding:10px 12px 4px;}

  .adm-main{flex:1;padding:20px 22px 40px;margin-left:220px;min-width:0;}
  @media(max-width:768px){
    .adm-sidebar{display:none;}
    .adm-main{margin-left:0;padding:16px 14px 40px;}
  }

  .adm-page-title{font-size:20px;font-weight:900;color:#fff;margin-bottom:6px;}
  .adm-page-sub{font-size:12px;color:#94a3b8;margin-bottom:20px;line-height:1.55;}

  .adm-placeholder{background:#111827;border:1px dashed #334155;border-radius:14px;padding:40px 20px;text-align:center;}
  .adm-placeholder .icon{width:56px;height:56px;border-radius:16px;background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.3);display:flex;align-items:center;justify-content:center;font-size:22px;color:#10b981;margin:0 auto 14px;}
  .adm-placeholder h3{font-size:15px;font-weight:800;color:#e2e8f0;margin-bottom:6px;}
  .adm-placeholder p{font-size:12px;color:#64748b;line-height:1.6;}

  .adm-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111827;border:1px solid #1e293b;border-radius:12px;padding:11px 16px;font-size:12.5px;color:#e2e8f0;font-weight:700;box-shadow:0 8px 28px rgba(0,0,0,.7);z-index:99999;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;}
  .adm-toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .adm-toast.error{border-color:rgba(161,98,98,.5);color:#fca5a5;}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="adm-login">
  <div class="card">
    <div class="logo">Z</div>
    <h1>ZYNIX Admin</h1>
    <p>Sign in with your ZYNIX account.<br>Only approved admins can access this panel.</p>
    <div class="field">
      <label>Email</label>
      <input id="adm-email" type="email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="field">
      <label>Password</label>
      <input id="adm-pass" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button id="adm-signin" class="primary">Sign In</button>
    <button class="back" onclick="window.location.href='/'">← Back to ZYNIX</button>
  </div>
</div>

<!-- ============ ACCESS DENIED ============ -->
<div id="adm-denied">
  <div class="card">
    <div class="icon"><i class="fa-solid fa-user-lock"></i></div>
    <h2>Access Denied</h2>
    <p>Your account is not listed as an active admin.<br>Contact the platform owner if you believe this is an error.</p>
    <button class="primary" style="width:100%;padding:13px;border-radius:10px;border:none;background:linear-gradient(135deg,#10b981,#3b82f6);color:#000;font-weight:900;font-size:13px;cursor:pointer;" onclick="window.location.href='/'">Back to ZYNIX</button>
    <button class="back" id="adm-signout-denied" style="width:100%;padding:10px;border-radius:10px;border:1px solid #1e293b;background:transparent;color:#94a3b8;font-weight:700;font-size:12px;cursor:pointer;margin-top:8px;">Sign out</button>
  </div>
</div>

<!-- ============ SHELL ============ -->
<div id="adm-shell">
  <header class="adm-header">
    <div class="brand">
      <div class="logo">Z</div>
      <div class="title">ZYNIX</div>
      <div class="badge">ADMIN</div>
    </div>
    <div class="right">
      <div class="user-chip">
        <span id="adm-user-name">…</span>
        <span class="role" id="adm-user-role">…</span>
      </div>
      <button class="icon-btn" title="Back to ZYNIX" onclick="window.location.href='/'">
        <i class="fa-solid fa-arrow-up-right-from-square"></i>
      </button>
      <button class="icon-btn" title="Sign out" id="adm-signout-btn">
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>
    </div>
  </header>

  <div class="adm-body">
    <nav class="adm-sidebar" id="adm-sidebar">
      <div class="nav-section">Overview</div>
      <button class="nav-item" data-nav="dashboard"><i class="fa-solid fa-gauge-high"></i> Dashboard</button>
      <button class="nav-item" data-nav="analytics"><i class="fa-solid fa-chart-line"></i> Analytics</button>

      <div class="divider"></div>
      <div class="nav-section">Moderation</div>
      <button class="nav-item" data-nav="content-queue"><i class="fa-solid fa-layer-group"></i> Content Queue <span class="badge" id="adm-nav-badge-content"></span></button>
      <button class="nav-item" data-nav="reports"><i class="fa-solid fa-flag"></i> Reports <span class="badge" id="adm-nav-badge-reports"></span></button>
      <button class="nav-item" data-nav="appeals"><i class="fa-solid fa-scale-balanced"></i> Appeals <span class="badge" id="adm-nav-badge-appeals"></span></button>

      <div class="divider"></div>
      <div class="nav-section">Operations</div>
      <button class="nav-item" data-nav="users"><i class="fa-solid fa-users"></i> Users</button>
      <button class="nav-item" data-nav="admins"><i class="fa-solid fa-user-shield"></i> Admin Team</button>
      <button class="nav-item" data-nav="ads"><i class="fa-solid fa-tv"></i> Ads Manager</button>
      <button class="nav-item" data-nav="notifications"><i class="fa-solid fa-bell"></i> Notifications</button>

      <div class="divider"></div>
      <div class="nav-section">Finance</div>
      <button class="nav-item" data-nav="ledger"><i class="fa-solid fa-book"></i> Ledger</button>
      <button class="nav-item" data-nav="pools"><i class="fa-solid fa-water"></i> Pools</button>
      <button class="nav-item" data-nav="payouts"><i class="fa-solid fa-money-bill-transfer"></i> Payouts</button>

      <div class="divider"></div>
      <div class="nav-section">System</div>
      <button class="nav-item" data-nav="admin-log"><i class="fa-solid fa-clipboard-list"></i> Admin Log</button>
      <button class="nav-item" data-nav="settings"><i class="fa-solid fa-gear"></i> Settings</button>
    </nav>

    <main class="adm-main" id="adm-main">
      <div class="adm-page-title">Loading…</div>
    </main>
  </div>
</div>

<div class="adm-toast" id="adm-toast"></div>

<script>
(function(){
'use strict';

/* ============================================================
   CONFIG — same Supabase as main app
   ============================================================ */
var SUPABASE_URL = 'https://ipypwqajsfxrdzlxfnlr.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlweXB3cWFqc2Z4cmR6bHhmbmxyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2OTEzODUsImV4cCI6MjEwNDI2NzM4NX0.QW6tzaMxlNg9EYuRq0tCOlGipBlrjBuiV6lZuSr1Jj4';

var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});

/* ============================================================
   STATE
   ============================================================ */
var Admin = {
  user: null,
  profile: null,
  role: null,       /* super_admin / admin / moderator */
  currentView: 'dashboard',
  counts: { content:0, reports:0, appeals:0 }
};
window.Admin = Admin;

/* ============================================================
   HELPERS
   ============================================================ */
function $(id){ return document.getElementById(id); }
function esc(s){
  if(s == null) return '';
  return String(s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}
function toast(msg, isErr){
  var t = $('adm-toast');
  if(!t) return;
  t.textContent = msg;
  t.className = 'adm-toast show' + (isErr ? ' error' : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.className = 'adm-toast'; }, 2800);
}
function show(el){ el.style.display = 'flex'; }
function hide(el){ el.style.display = 'none'; }
function setShell(on){ $('adm-shell').classList.toggle('active', !!on); }

/* ============================================================
   AUTH FLOW
   ============================================================ */
async function trySession(){
  try {
    var s = await sb.auth.getSession();
    var session = s && s.data ? s.data.session : null;
    if(!session || !session.user) return false;
    Admin.user = session.user;
    return await loadProfileAndRole();
  } catch(e){ return false; }
}

async function loadProfileAndRole(){
  if(!Admin.user) return false;
  try {
    var pr = await sb.from('profiles').select('id,name,username,avatar').eq('id', Admin.user.id).maybeSingle();
    if(pr.error || !pr.data){ toast('Profile not found.', true); return false; }
    Admin.profile = pr.data;

    var rr = await sb.rpc('my_admin_role');
    if(rr.error){ toast('Role check failed.', true); return false; }
    if(!rr.data){ return false; }  /* not admin */
    Admin.role = rr.data;

    /* Update UI */
    var nameEl = $('adm-user-name');
    var roleEl = $('adm-user-role');
    if(nameEl) nameEl.textContent = Admin.profile.name || Admin.profile.username || 'Admin';
    if(roleEl) roleEl.textContent = Admin.role.replace('_',' ');
    return true;
  } catch(e){
    console.error('[admin] loadProfileAndRole', e);
    return false;
  }
}

async function signIn(email, pass){
  var btn = $('adm-signin');
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    var r = await sb.auth.signInWithPassword({ email: email, password: pass });
    if(r.error) throw r.error;
    Admin.user = r.data.user;
    var ok = await loadProfileAndRole();
    if(!ok){
      /* Not an admin */
      hide($('adm-login'));
      show($('adm-denied'));
      return;
    }
    /* Admin — enter shell */
    hide($('adm-login'));
    hide($('adm-denied'));
    setShell(true);
    renderSidebar();
    navigate('dashboard');
    loadBadges();
  } catch(e){
    toast((e && e.message) ? e.message : 'Sign in failed.', true);
  } finally {
    btn.disabled = false; btn.textContent = 'Sign In';
  }
}

async function signOut(){
  try { await sb.auth.signOut(); } catch(e){}
  Admin.user = null; Admin.profile = null; Admin.role = null;
  setShell(false);
  show($('adm-login'));
  hide($('adm-denied'));
  $('adm-pass').value = '';
}

/* ============================================================
   SIDEBAR + NAVIGATION
   ============================================================ */
var PAGES = {
  'dashboard':     { title:'Dashboard',       sub:'Platform pulse at a glance', icon:'fa-solid fa-gauge-high' },
  'analytics':     { title:'Analytics',       sub:'Growth, engagement, revenue trends', icon:'fa-solid fa-chart-line' },
  'content-queue': { title:'Content Queue',   sub:'Pending market lots awaiting review', icon:'fa-solid fa-layer-group' },
  'reports':       { title:'Reports',         sub:'User and content reports', icon:'fa-solid fa-flag' },
  'appeals':       { title:'Appeals',         sub:'Ban appeals from users', icon:'fa-solid fa-scale-balanced' },
  'users':         { title:'Users',           sub:'Search, view, and manage user accounts', icon:'fa-solid fa-users' },
  'admins':        { title:'Admin Team',      sub:'Manage admin roles', icon:'fa-solid fa-user-shield' },
  'ads':           { title:'Ads Manager',     sub:'Create, edit, budget, and toggle ads', icon:'fa-solid fa-tv' },
  'notifications': { title:'Notifications',   sub:'Broadcast messages to users', icon:'fa-solid fa-bell' },
  'ledger':        { title:'Ledger',          sub:'Income, expenses, rebates, transfers', icon:'fa-solid fa-book' },
  'pools':         { title:'Pools',           sub:'Bounty, CSF, Peer Support, Ad Wallet', icon:'fa-solid fa-water' },
  'payouts':       { title:'Payouts',         sub:'Wise / Payoneer batch processing', icon:'fa-solid fa-money-bill-transfer' },
  'admin-log':     { title:'Admin Log',       sub:'Every admin action, timestamped', icon:'fa-solid fa-clipboard-list' },
  'settings':      { title:'Settings',        sub:'Platform configuration', icon:'fa-solid fa-gear' }
};

function renderSidebar(){
  document.querySelectorAll('#adm-sidebar .nav-item').forEach(function(btn){
    btn.addEventListener('click', function(){
      var nav = this.getAttribute('data-nav');
      navigate(nav);
    });
  });
}

function navigate(view){
  if(!PAGES[view]) view = 'dashboard';
  Admin.currentView = view;
  document.querySelectorAll('#adm-sidebar .nav-item').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-nav') === view);
  });
  var main = $('adm-main');
  var p = PAGES[view];
  main.innerHTML =
    '<div class="adm-page-title">' + esc(p.title) + '</div>' +
    '<div class="adm-page-sub">' + esc(p.sub) + '</div>' +
    '<div class="adm-placeholder">' +
      '<div class="icon"><i class="' + p.icon + '"></i></div>' +
      '<h3>' + esc(p.title) + '</h3>' +
      '<p>This section will be built in Chunk 2+. Foundation and access system are live.</p>' +
    '</div>';
}

/* Badge counts placeholder — fetched in Chunk 2/3 */
async function loadBadges(){
  /* No-op for chunk 1 */
}

/* ============================================================
   BIND UI
   ============================================================ */
function bindUI(){
  $('adm-signin').addEventListener('click', function(){
    var email = ($('adm-email').value || '').trim();
    var pass  = $('adm-pass').value || '';
    if(!email || !pass){ toast('Enter email and password.', true); return; }
    signIn(email, pass);
  });
  $('adm-pass').addEventListener('keydown', function(e){
    if(e.key === 'Enter') $('adm-signin').click();
  });
  $('adm-signout-btn').addEventListener('click', signOut);
  $('adm-signout-denied').addEventListener('click', signOut);
}

/* ============================================================
   BOOT
   ============================================================ */
async function boot(){
  bindUI();
  var ok = await trySession();
  if(ok){
    hide($('adm-login'));
    hide($('adm-denied'));
    setShell(true);
    renderSidebar();
    navigate('dashboard');
    loadBadges();
  } else {
    /* If there is a signed-in session but not admin → show denied */
    try {
      var s = await sb.auth.getSession();
      if(s && s.data && s.data.session && s.data.session.user){
        hide($('adm-login'));
        show($('adm-denied'));
      }
    } catch(e){}
  }
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

console.log('[ZYNIX Admin — Chunk 1] foundation · access · layout ready');
})();
</script>

<!-- ============================================================
     ZYNIX Admin — Chunk 2
     Dashboard + Users + Admin Log
     ============================================================ -->
<script>
(function(){
'use strict';
var Admin = window.Admin;
if(!Admin) return;
if(Admin.__chunk2) return; Admin.__chunk2 = true;

var sb = window.supabase.createClient(
  'https://ipypwqajsfxrdzlxfnlr.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlweXB3cWFqc2Z4cmR6bHhmbmxyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2OTEzODUsImV4cCI6MjEwNDI2NzM4NX0.QW6tzaMxlNg9EYuRq0tCOlGipBlrjBuiV6lZuSr1Jj4',
  { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }
);

function $(id){ return document.getElementById(id); }
function esc(s){
  if(s == null) return '';
  return String(s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}
function money(n){ return '$' + (Number(n)||0).toFixed(2); }
function timeAgo(ts){
  if(!ts) return '';
  var s = Math.floor((Date.now() - new Date(ts).getTime())/1000);
  if(s < 60) return s + 's ago';
  if(s < 3600) return Math.floor(s/60) + 'm ago';
  if(s < 86400) return Math.floor(s/3600) + 'h ago';
  if(s < 2592000) return Math.floor(s/86400) + 'd ago';
  return new Date(ts).toLocaleDateString();
}
function toast(m, e){
  var t = $('adm-toast'); if(!t) return;
  t.textContent = m;
  t.className = 'adm-toast show' + (e ? ' error' : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.className = 'adm-toast'; }, 2800);
}
window.AdminToaster = toast;

/* ============================================================
   CSS additions for Chunk 2
   ============================================================ */
if(!document.getElementById('zynix-adm-c2-css')){
  var st = document.createElement('style');
  st.id = 'zynix-adm-c2-css';

async function banUser(userId){
  var reason = prompt('Reason for ban (min 3 characters):', '');
  if(reason === null) return;
  if(!reason.trim() || reason.trim().length < 3){ toast('Reason required.', true); return; }
  try {
    var r = await sb.rpc('admin_ban_user', { p_user_id: userId, p_reason: reason.trim() });
    if(r.error) throw r.error;
    toast('User banned.');
    var modal = $('adm-user-modal'); if(modal) modal.remove();
    loadUsers();
  } catch(e){
    toast('Ban failed: ' + ((e && e.message) || 'unknown'), true);
  }
}

async function unbanUser(userId){
  if(!confirm('Unban this user?')) return;
  try {
    var r = await sb.rpc('admin_unban_user', { p_user_id: userId });
    if(r.error) throw r.error;
    toast('User unbanned.');
    var modal = $('adm-user-modal'); if(modal) modal.remove();
    loadUsers();
  } catch(e){
    toast('Unban failed: ' + ((e && e.message) || 'unknown'), true);
  }
}

   ============================================================ */
/* Wait for Chunk 1's Admin object to be ready, then override navigate */
function attachNav(){
  if(!Admin || !Admin.__chunk1Ready){
    /* Chunk 1 doesn't expose a ready flag, so just override navigate now. */
  }
  var _prevNavigate = Admin.navigate;
  Admin.navigate = function(view){
    if(view === 'dashboard'){ return renderDashboard($('adm-main')); }
    if(view === 'users'){ return renderUsers($('adm-main')); }
    if(view === 'admin-log'){ return renderAdminLog($('adm-main')); }
    if(typeof _prevNavigate === 'function') return _prevNavigate.call(Admin, view);
    /* fallback: default placeholder */
    var main = $('adm-main');
    main.innerHTML = '<div class="adm-page-title">' + view + '</div><div class="adm-placeholder"><h3>Coming in later chunk</h3></div>';
  };
  /* Re-navigate to refresh current view */
  Admin.navigate(Admin.currentView || 'dashboard');
}

/* The Chunk 1 navigate function lives as a closure, but it's exported
   on the Admin object? No — it's a local function. So we replace
   the click handlers on sidebar buttons. */
function rewireSidebar(){
  document.querySelectorAll('#adm-sidebar .nav-item').forEach(function(btn){
    var nav = btn.getAttribute('data-nav');
    /* Clone to strip old listeners */
    var clone = btn.cloneNode(true);
    btn.parentNode.replaceChild(clone, btn);
    clone.addEventListener('click', function(){
      Admin.currentView = nav;
      document.querySelectorAll('#adm-sidebar .nav-item').forEach(function(b){
        b.classList.toggle('active', b.getAttribute('data-nav') === nav);
      });
      var main = $('adm-main');
      if(nav === 'dashboard') return renderDashboard(main);
      if(nav === 'users') return renderUsers(main);
      if(nav === 'admin-log') return renderAdminLog(main);
      /* placeholder for others */
      var titles = {
        'analytics':'Analytics','content-queue':'Content Queue','reports':'Reports',
        'appeals':'Appeals','admins':'Admin Team','ads':'Ads Manager',
        'notifications':'Notifications','ledger':'Ledger','pools':'Pools',
        'payouts':'Payouts','settings':'Settings'
      };
      main.innerHTML =
        '<div class="adm-page-title">' + (titles[nav] || nav) + '</div>' +
        '<div class="adm-placeholder">' +
          '<div class="icon"><i class="fa-solid fa-hammer"></i></div>' +
          '<h3>Coming in later chunk</h3>' +
          '<p>Chunk 1+2 delivered Dashboard, Users, and Admin Log. This page arrives in Chunk 3+.</p>' +
        '</div>';
    });
  });
}

/* Also wire the boot flow: after login, Chunk 1 calls navigate('dashboard')
   on the internal closure, which won't hit our override. So we re-render
   dashboard ourselves once the shell appears. */
function watchForShell(){
  var shell = $('adm-shell');
  if(!shell) return;
  var interval = setInterval(function(){
    if(shell.classList.contains('active')){
      clearInterval(interval);
      setTimeout(function(){
        rewireSidebar();
        /* Force-render dashboard since Chunk 1 rendered the old placeholder */
        renderDashboard($('adm-main'));
      }, 250);
    }
  }, 300);
  /* Safety: stop after 60s if never logged in */
  setTimeout(function(){ clearInterval(interval); }, 60000);
}

/* Also re-fire if user signs out and back in */
var _origSignOut = null;
document.addEventListener('click', function(e){
  var btn = e.target.closest('#adm-signout-btn, #adm-signout-denied');
  if(!btn) return;
  setTimeout(function(){ watchForShell(); }, 400);
}, true);

if(document.readyState === 'loading'){

    var groups = { income: {}, expense: {} };
    heads.forEach(function(h){
      var c = h.category || 'Uncategorized';
      if(!groups[h.entry_type][c]) groups[h.entry_type][c] = [];
      groups[h.entry_type][c].push(h);
    });

    var html = '';
    html += renderGroup4('income', 'Income', '#10b981', groups.income, totalMap);
    html += renderGroup4('expense', 'Expense', '#a16262', groups.expense, totalMap);
    body.innerHTML = html;

    wireLedgerHeads();

    Object.keys(ledgerState4.expanded).forEach(function(k){
      if(ledgerState4.expanded[k]){
        var panel = document.querySelector('[data-ldg4-panel="' + k + '"]');
        if(panel) panel.style.display = 'block';
        loadSubs4(k);
      }
    });
  } catch(e){ console.error('[ledger4]', e); }
  requestAnimationFrame(function(){ window.scrollTo(0, savedY); });
}

function renderGroup4(et, title, color, cats, totalMap){
  if(!cats || !Object.keys(cats).length) return '';
  var ks = Object.keys(cats).sort();
  var groupTotal = 0;
  ks.forEach(function(k){ cats[k].forEach(function(h){ var t = totalMap[h.head_key]; if(t) groupTotal += Number(t.total); }); });

  var h = '<div style="margin-bottom:22px;">';
  h += '<div style="display:flex;justify-content:space-between;padding:8px 4px;border-bottom:2px solid ' + color + '33;margin-bottom:12px;">';
  h += '<div style="font-size:14px;font-weight:900;color:' + color + ';letter-spacing:.4px;text-transform:uppercase;">' + title + '</div>';
  h += '<div style="font-size:16px;font-weight:900;color:' + color + ';">' + money(groupTotal) + '</div>';
  h += '</div>';

  ks.forEach(function(cat){
    var items = cats[cat].sort(function(a,b){ return (a.display_order||0) - (b.display_order||0); });
    var catTotal = 0;
    items.forEach(function(h2){ var t = totalMap[h2.head_key]; if(t) catTotal += Number(t.total); });

    h += '<div style="margin-bottom:14px;">';
    h += '<div style="display:flex;justify-content:space-between;padding:6px 4px;font-size:11px;color:#94a3b8;font-weight:900;letter-spacing:.4px;text-transform:uppercase;">';
    h += '<span>' + esc(cat) + '</span><span>' + money(catTotal) + '</span></div>';

    items.forEach(function(h2){
      var t = totalMap[h2.head_key];
      var amt = t ? Number(t.total) : 0;
      var cnt = t ? t.entry_count : 0;
      var isOpen = !!ledgerState4.expanded[h2.head_key];
      var tag = h2.auto_wired
        ? '<span style="font-size:8.5px;color:#60a5fa;background:rgba(59,130,246,.12);padding:1px 6px;border-radius:5px;">AUTO</span>'
        : '<span style="font-size:8.5px;color:#94a3b8;background:rgba(148,163,184,.10);padding:1px 6px;border-radius:5px;">MANUAL</span>';

      h += '<div style="background:#131c30;border:1px solid #1e293b;border-radius:9px;margin-bottom:4px;overflow:hidden;">';
      h += '<div data-ldg4-head="' + esc(h2.head_key) + '" style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;' + (amt === 0 ? 'opacity:.75;' : '') + '">';
      h += '<div style="flex:1;min-width:0;">';
      h += '<div style="font-weight:800;color:#fff;font-size:12.5px;display:flex;align-items:center;gap:6px;">';
      h += '<i data-ldg4-chev="' + esc(h2.head_key) + '" class="fa-solid ' + (isOpen ? 'fa-chevron-down' : 'fa-chevron-right') + '" style="color:' + (isOpen ? '#10b981' : '#64748b') + ';font-size:10px;"></i>';
      h += esc(h2.display_name) + ' ' + tag + '</div>';
      h += '<div style="font-size:10px;color:#64748b;margin-top:2px;padding-left:16px;">' + cnt + ' entr' + (cnt === 1 ? 'y' : 'ies') + (h2.description ? ' · ' + esc(h2.description) : '') + '</div>';
      h += '</div>';
      h += '<div style="font-weight:900;color:' + color + ';white-space:nowrap;">' + money(amt) + '</div>';
      h += '</div>';
      h += '<div data-ldg4-panel="' + esc(h2.head_key) + '" style="display:' + (isOpen ? 'block' : 'none') + ';padding:0 12px 12px;border-top:1px solid #1e293b;">';
      h += '<div data-ldg4-subs="' + esc(h2.head_key) + '" style="margin-top:10px;">Loading…</div>';
      h += '</div>';
      h += '</div>';
    });
    h += '</div>';
  });
  h += '</div>';
  return h;
}

function wireLedgerHeads(){
  document.querySelectorAll('[data-ldg4-head]').forEach(function(el){
    el.addEventListener('click', function(){
      var key = this.getAttribute('data-ldg4-head');
      ledgerState4.expanded[key] = !ledgerState4.expanded[key];
      var panel = document.querySelector('[data-ldg4-panel="' + key + '"]');
      var chev = document.querySelector('[data-ldg4-chev="' + key + '"]');
      if(panel){
        if(ledgerState4.expanded[key]){
          panel.style.display = 'block';
          if(chev){ chev.className = 'fa-solid fa-chevron-down'; chev.style.color = '#10b981'; }
          loadSubs4(key);
        } else {
          panel.style.display = 'none';
          if(chev){ chev.className = 'fa-solid fa-chevron-right'; chev.style.color = '#64748b'; }
          if(ledgerState4.addSubForm === key) ledgerState4.addSubForm = null;
        }
      }
    });
  });
}

async function loadSubs4(headKey){
  var host = document.querySelector('[data-ldg4-subs="' + headKey + '"]');
  if(!host) return;
  host.innerHTML = '<div style="text-align:center;padding:12px;color:#64748b;font-size:11px;">Loading…</div>';

  try {
    var r = await sb.rpc('admin_ledger_entries_for_head', { p_head: headKey, p_subhead: null, p_limit: 500 });
    var entries = (!r.error && r.data) ? r.data : [];

    var h = '';
    h += '<div style="display:flex;justify-content:flex-end;margin-bottom:10px;">';
    h += '<button data-ldg4-add-item="' + esc(headKey) + '" class="adm-btn primary" style="font-size:11.5px;padding:7px 14px;"><i class="fa-solid fa-plus"></i> Add</button>';
    h += '</div>';

    if(!entries.length){
      h += '<div style="padding:14px;text-align:center;color:#64748b;font-size:11.5px;background:rgba(0,0,0,.2);border-radius:8px;">No items yet. Click "Add" above.</div>';
    } else {
      entries.forEach(function(e){
        var name = e.subhead_name || '(no name)';
        var isInc = e.entry_type === 'income';
        var color = isInc ? '#10b981' : '#a16262';
        h += '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 11px;background:rgba(0,0,0,.25);border-radius:8px;margin-bottom:5px;">';
        h += '<div style="flex:1;min-width:0;">';
        h += '<div style="font-size:12.5px;color:#e2e8f0;font-weight:700;">' + esc(name) + '</div>';
        if(e.description) h += '<div style="font-size:10px;color:#64748b;margin-top:2px;">' + esc(e.description) + '</div>';
        h += '</div>';
        h += '<div style="font-size:12.5px;font-weight:900;color:' + color + ';white-space:nowrap;margin-right:6px;">' + (isInc ? '+' : '−') + money(e.amount) + '</div>';
        h += '<button data-ldg4-edit-item="' + e.id + '" data-ldg4-edit-name="' + esc(name) + '" data-ldg4-edit-amt="' + e.amount + '" data-ldg4-edit-desc="' + esc(e.description || '') + '" data-ldg4-edit-head="' + esc(headKey) + '" data-ldg4-edit-type="' + esc(e.entry_type) + '" title="Edit" style="background:transparent;border:none;color:#60a5fa;font-size:12px;cursor:pointer;padding:5px;"><i class="fa-solid fa-pen"></i></button>';
        h += '<button data-ldg4-del-item="' + e.id + '" data-ldg4-del-name="' + esc(name) + '" title="Delete" style="background:transparent;border:none;color:#a16262;font-size:12px;cursor:pointer;padding:5px;"><i class="fa-solid fa-trash"></i></button>';
        h += '</div>';
      });
    }

    host.innerHTML = h;
    wireSubs4(headKey);
  } catch(e){
    console.error('[ledger subs]', e);
    host.innerHTML = '<div style="color:#a16262;font-size:11px;">Failed.</div>';
  }
}

function wireSubs4(headKey){
  var addBtn = document.querySelector('[data-ldg4-add-item="' + headKey + '"]');
  if(addBtn) addBtn.addEventListener('click', function(e){
    e.stopPropagation();
    openItemModal(headKey, null);
  });

  document.querySelectorAll('[data-ldg4-edit-item]').forEach(function(b){
    b.addEventListener('click', function(e){
      e.stopPropagation();
      openItemModal(headKey, {
        id: this.getAttribute('data-ldg4-edit-item'),
        name: this.getAttribute('data-ldg4-edit-name'),
        amount: this.getAttribute('data-ldg4-edit-amt'),
        description: this.getAttribute('data-ldg4-edit-desc'),
        head: this.getAttribute('data-ldg4-edit-head'),
        type: this.getAttribute('data-ldg4-edit-type')
      });
    });
  });

  document.querySelectorAll('[data-ldg4-del-item]').forEach(function(b){
    b.addEventListener('click', function(e){
      e.stopPropagation();
      var id = this.getAttribute('data-ldg4-del-item');
      var name = this.getAttribute('data-ldg4-del-name');
      if(!confirm('Delete "' + name + '"?')) return;
      sb.rpc('admin_ledger_delete_entry', { p_id: id }).then(function(r){
        if(r.error){
          if(r.error.message.indexOf('super_admin_only') !== -1) toast('Only super_admin.', true);
          else toast('Failed: ' + r.error.message, true);
          return;
        }
        toast('Deleted.');
        loadSubs4(headKey);
        var totEl = document.querySelector('[data-ldg4-head="' + headKey + '"]');
        if(totEl) setTimeout(function(){ loadLedger4(); }, 300);
      });
    });
  });
}

function openItemModal(headKey, existing){
  var shell = document.createElement('div');
  shell.className = 'adm-modal-overlay';
  shell.id = 'adm-l4-item';
  shell.addEventListener('click', function(e){ if(e.target === shell) shell.remove(); });

  var inner = document.createElement('div');
  inner.className = 'adm-modal';
  inner.style.maxWidth = '480px';

  var isEdit = !!existing;
  var headType = existing && existing.type ? existing.type : null;

  inner.innerHTML =
    '<h3>' + (isEdit ? 'Edit item' : 'Add item') + '</h3>' +
    '<div class="adm-form-row">' +
      '<label>Name</label>' +
      '<input id="adm-it-name" type="text" maxlength="80" value="' + (existing ? esc(existing.name) : '') + '" placeholder="e.g. Admin Salary, Web Developer">' +
    '</div>' +
    '<div class="adm-form-row">' +
      '<label>Amount (USD)</label>' +
      '<input id="adm-it-amt" type="number" step="0.01" min="0.01" value="' + (existing ? esc(existing.amount) : '') + '" placeholder="0.00">' +
    '</div>' +
    '<div class="adm-form-row">' +
      '<label>Description (optional)</label>' +
      '<input id="adm-it-desc" type="text" maxlength="200" value="' + (existing ? esc(existing.description) : '') + '" placeholder="Short note">' +
    '</div>' +
    '<div class="row">' +
      '<button class="adm-btn primary" id="adm-it-save" style="flex:1;">' + (isEdit ? 'Save' : 'Add') + '</button>' +
      '<button class="adm-btn ghost" id="adm-it-cancel">Cancel</button>' +
    '</div>';

  shell.appendChild(inner);
  document.body.appendChild(shell);

  setTimeout(function(){ var i = document.getElementById('adm-it-name'); if(i){ i.focus(); if(isEdit) i.select(); } }, 50);
  document.getElementById('adm-it-cancel').addEventListener('click', function(){ shell.remove(); });

  document.getElementById('adm-it-save').addEventListener('click', async function(){
    var btn = this;
    var name = (document.getElementById('adm-it-name').value || '').trim();
    var amt = parseFloat(document.getElementById('adm-it-amt').value || '0');
    var desc = (document.getElementById('adm-it-desc').value || '').trim();
    if(name.length < 2){ toast('Name too short.', true); return; }
    if(!amt || amt <= 0){ toast('Amount required.', true); return; }

    btn.disabled = true;
    btn.textContent = isEdit ? 'Saving…' : 'Adding…';
    try {
      var r;
      if(isEdit){
        r = await sb.rpc('admin_ledger_update_entry', {
          p_id: existing.id, p_subhead: name, p_amount: amt,
          p_desc: desc || null, p_head: headKey
        });
      } else {
        /* Get head type first */
        var hh = await sb.rpc('admin_ledger_heads');
        var entryType = 'expense';
        if(!hh.error && hh.data){
          var found = hh.data.find(function(x){ return x.head_key === headKey; });
          if(found) entryType = found.entry_type;
        }
        r = await sb.rpc('admin_ledger_add', {
          p_entry_type: entryType, p_head: headKey, p_amount: amt,
          p_description: desc || null, p_subhead: name
        });
      }
      if(r.error) throw r.error;
      toast(isEdit ? 'Saved.' : 'Added.');
      shell.remove();
      loadSubs4(headKey);
      setTimeout(function(){ loadLedger4(); }, 250);
    } catch(e){
      toast('Failed: ' + ((e && e.message) || 'unknown'), true);
      btn.disabled = false;
      btn.textContent = isEdit ? 'Save' : 'Add';
    }
  });
}

function route(nav){
  var main = document.getElementById('adm-main');

  var C2 = window.AdminChunk2 || {};

  var C4 = window.AdminChunk4 || {};

    if(nav === 'users'         && C2.renderUsers)         return C2.renderUsers(main);

    if(nav === 'content-queue' && C3.renderContentQueue)  return C3.renderContentQueue(main);
    if(nav === 'reports'       && C3.renderReports)       return C3.renderReports(main);
    if(nav === 'appeals'       && C3.renderAppeals)       return C3.renderAppeals(main);

    if(nav === 'pools'         && C4.renderPools)         return C4.renderPools(main);
    if(nav === 'payouts'       && C4.renderPayouts)       return C4.renderPayouts(main);
    if(nav === 'ads'           && C5.renderAds)           return C5.renderAds(main);
    if(nav === 'analytics'     && C5.renderAnalytics)     return C5.renderAnalytics(main);
    if(nav === 'notifications' && C5.renderNotifications) return C5.renderNotifications(main);
    if(nav === 'settings'      && C5.renderSettings)      return C5.renderSettings(main);
  } catch(e){ console.error('[admin route]', nav, e); }
  main.innerHTML = '<div class="adm-page-title">' + nav + '</div>' +
    '<div style="text-align:center;padding:40px;color:#94a3b8;font-size:12px;">' +
      'This page is being built. Coming in a later update.' +
    '</div>';
}

function wireSidebar(){
  var items = document.querySelectorAll('#adm-sidebar .nav-item');
  if(!items.length) return;
  var didWire = false;
  items.forEach(function(btn){
    if(btn._admFinalHooked) return;
    didWire = true;
    var nav = btn.getAttribute('data-nav');
    /* Clone to strip ALL previous listeners (Chunk 1 + old nav wiring) */
    var clone = btn.cloneNode(true);
    clone._admFinalHooked = true;
    btn.parentNode.replaceChild(clone, btn);
    clone.addEventListener('click', function(){
      Admin.currentView = nav;
      document.querySelectorAll('#adm-sidebar .nav-item').forEach(function(b){
        b.classList.toggle('active', b.getAttribute('data-nav') === nav);
      });
      route(nav);
    });
  });
  return didWire;
}

/* Poll for sidebar every second — wires it the moment it appears after login */
setInterval(wireSidebar, 1000);
setTimeout(wireSidebar, 300);

/* If a page currently shows the old placeholder, auto-render the current view */
setInterval(function(){
  var main = document.getElementById('adm-main');
  if(!main) return;
  if(main.innerHTML.indexOf('Coming in a later update') === -1 &&
     main.innerHTML.indexOf('will be built in Chunk') === -1) return;
  /* On old placeholder — force re-render */
  var nav = Admin.currentView || 'dashboard';
  route(nav);
}, 2000);

console.log('[Admin Final Dispatcher] active');
})();
</script>

<!-- ============================================================
     Global Scroll Guard — prevents page-top jump on any admin click
     ============================================================ -->
<script>
(function(){
'use strict';
var Admin = window.Admin;
if(!Admin) return;
if(Admin.__scrollGuard) return; Admin.__scrollGuard = true;

var _savedY = 0;
var _restoring = false;

/* Save scroll before any click inside admin */
document.addEventListener('mousedown', function(){
  try { _savedY = window.scrollY || document.documentElement.scrollTop || 0; } catch(e){}
}, true);

document.addEventListener('touchstart', function(){
  try { _savedY = window.scrollY || document.documentElement.scrollTop || 0; } catch(e){}
}, {passive:true, capture:true});

/* After any DOM change inside admin-main, restore scroll (idempotent) */
function restore(){
  if(_restoring) return;
  _restoring = true;
  requestAnimationFrame(function(){
    try { if(window.scrollY !== _savedY) window.scrollTo(0, _savedY); } catch(e){}
    _restoring = false;
  });
}

var main = document.getElementById('adm-main');
if(main){
  var obs = new MutationObserver(function(){
    /* Small debounce to survive multi-phase renders */
    restore();
    setTimeout(restore, 30);
    setTimeout(restore, 80);
    setTimeout(restore, 200);
  });
  obs.observe(main, { childList: true, subtree: true });

  /* Also observe sub-tree additions that might reflow */
  document.addEventListener('click', function(e){
    if(!e.target.closest('#adm-main')) return;
    /* Capture scroll position before any handler runs */
    try { _savedY = window.scrollY || document.documentElement.scrollTop || 0; } catch(err){}
    /* Re-apply on next frames after handlers complete */
    setTimeout(restore, 10);
    setTimeout(restore, 50);
    setTimeout(restore, 150);
    setTimeout(restore, 350);
  }, true);
}

console.log('[Admin Scroll Guard] active');
})();
</script>

function recalcTotals(){
  var m = financeState.computed;
  if(!m) return;
  var net = Number(m.net_profit) || 0;
  var subRev = Number(m.subscription_revenue) || 0;
  var totalOut = 0;
  DEFAULT_TRANSFERS.forEach(function(t){
    var cb = document.getElementById('fh-cb-' + t.pool);
    var pct = document.getElementById('fh-pct-' + t.pool);
    var amtEl = document.getElementById('fh-amt-' + t.pool);
    if(!cb || !pct || !amtEl) return;
    var base = (t.base === 'subscription_revenue') ? subRev : net;
    var val = cb.checked ? (Number(pct.value) || 0) : 0;
    var amt = base * val / 100;
    amtEl.textContent = money(amt);
    amtEl.style.opacity = cb.checked ? '1' : '.35';
    totalOut += amt;
  });
  var btn = $('fh-transfer-btn');
  if(btn){
    var baseTotal = (Number(m.net_profit) || 0) + (Number(m.subscription_revenue) || 0);
    var pctOfBase = baseTotal > 0 ? (totalOut / baseTotal * 100) : 0;
    btn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket"></i> Transfer · ' + money(totalOut) + ' to selected pools';
  }
}

async function doTransfer(){
  var m = financeState.computed;
  if(!m){ toast('Compute the month first.', true); return; }

  var payload = [];
  DEFAULT_TRANSFERS.forEach(function(t){
    var cb = document.getElementById('fh-cb-' + t.pool);
    var pct = document.getElementById('fh-pct-' + t.pool);
    if(!cb || !pct) return;
    payload.push({
      pool: t.pool,
      pct: Number(pct.value) || 0,
      enabled: cb.checked
    });
  });

  var enabled = payload.filter(function(x){ return x.enabled; });
  if(!enabled.length){ toast('Select at least one pool.', true); return; }

  var totalAmount = 0;
  var net = Number(m.net_profit) || 0;
  var subRev = Number(m.subscription_revenue) || 0;
  enabled.forEach(function(t){
    var base = (['marketing','cfar'].indexOf(t.pool) !== -1) ? subRev : net;
    totalAmount += base * t.pct / 100;
  });

  if(!confirm('Transfer ' + money(totalAmount) + ' across ' + enabled.length + ' pool(s)?\n\nThis closes the month. Cannot be undone.')) return;

  var btn = $('fh-transfer-btn');
  btn.disabled = true;
  btn.textContent = 'Transferring…';

  try {
    var r = await sb.rpc('admin_transfer_to_pools', {
      p_month_key: m.month_key,
      p_transfers: payload
    });
    if(r.error) throw r.error;
    var d = r.data || {};
    toast('Transferred ' + money(d.total_transferred) + ' to ' + enabled.length + ' pool(s).');
    loadFinanceState();
  } catch(e){
    var msg = (e && e.message) || 'unknown';
    if(msg.indexOf('month_already_closed') !== -1) toast('This month is already closed.', true);
    else if(msg.indexOf('month_not_computed') !== -1) toast('Compute the month first.', true);
    else if(msg.indexOf('super_admin_only') !== -1) toast('Only super_admin can transfer.', true);
    else toast('Failed: ' + msg, true);
    btn.disabled = false;
  }
}

async function computeMonth(){
  var btn = $('fh-compute');
  var month = financeState.month;
  if(!month){ toast('Pick a month.', true); return; }
  btn.disabled = true;
  btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Computing…';
  try {
    var r = await sb.rpc('admin_compute_month_revenue', { p_month_key: month });
    if(r.error) throw r.error;
    toast('Computed for ' + month + '.');

    var msg = (e && e.message) || 'unknown';
    if(msg.indexOf('invalid_month') !== -1) toast('Invalid month format.', true);
    else if(msg.indexOf('super_admin_only') !== -1) toast('Only super_admin.', true);
    else toast('Failed: ' + msg, true);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fa-solid fa-calculator"></i> Compute month revenue';
  }
}

        if(cnt <= 0) return;
        var w = (cnt / total) * 100;
        h += '<div style="flex:' + w + ';background:' + t.color + ';display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:#000;min-width:0;overflow:hidden;" title="' + t.label + ' · ' + cnt + '">' +
          (w > 8 ? cnt : '') +
        '</div>';
      });
      h += '</div>';
    }

    /* Tier rows */
    h += '<div style="display:flex;flex-direction:column;gap:8px;">';
    TIER_META.forEach(function(t){
      var cnt = d[t.key] || 0;
      var pc = pct(cnt, total);
      h += '<div style="display:flex;align-items:center;gap:12px;padding:10px 12px;background:rgba(0,0,0,.22);border-radius:9px;">' +
        '<span style="width:10px;height:10px;border-radius:50%;background:' + t.color + ';flex-shrink:0;"></span>' +
        '<span style="font-size:12.5px;color:#e2e8f0;font-weight:800;min-width:70px;">' + t.label + '</span>' +
        '<span style="font-size:11px;color:#94a3b8;min-width:60px;">' + (t.price > 0 ? '$' + t.price + '/mo' : 'Free') + '</span>' +
        '<span style="font-size:13px;font-weight:900;color:#fff;min-width:50px;text-align:right;">' + cnt + '</span>' +
        '<span style="font-size:11px;color:#64748b;min-width:50px;text-align:right;">' + pc + '</span>' +
        '<span style="font-size:12px;font-weight:900;color:' + t.color + ';margin-left:auto;">' + money(cnt * t.price) + '</span>' +
      '</div>';
    });
    h += '</div>';
    h += '</div>';
    host.innerHTML = h;
  } catch(e){
    console.error('[tier dist]', e);
    host.innerHTML = '<div style="text-align:center;padding:40px;color:#a16262;font-size:12px;">Failed: ' + esc(e.message || 'unknown') + '</div>';
  }
}

/* ---------- ACTIVE USER STATS ---------- */
async function loadActiveStats(){
  var host = $('an-active'); if(!host) return;
  try {
    var r = await sb.rpc('admin_active_user_stats');
    if(r.error) throw r.error;
    var d = r.data || {};
    var compPct = Number(d.completion_pct) || 0;

    var h = '<div style="padding:16px;border-radius:12px;background:#131c30;border:1px solid #1e293b;margin-bottom:16px;">';
    h += '<div style="font-size:11px;font-weight:900;color:#e2e8f0;letter-spacing:.5px;text-transform:uppercase;margin-bottom:12px;">Active User · ' + esc(d.month_key) + '</div>';
    h += '<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;">';
    h += '<div class="adm-kpi green"><div class="lbl">Active</div><div class="val" style="color:#10b981;">' + (d.active_this_month || 0) + '</div></div>';
    h += '<div class="adm-kpi blue"><div class="lbl">Eligible</div><div class="val" style="color:#60a5fa;">' + (d.total_eligible || 0) + '</div></div>';
    h += '<div class="adm-kpi amber"><div class="lbl">Completion</div><div class="val" style="color:#fbbf24;">' + compPct + '%</div></div>';
    h += '</div>';
    h += '</div>';
    host.innerHTML = h;
  } catch(e){ host.innerHTML = ''; }
}

/* ---------- SIGNUP COHORTS ---------- */
async function loadCohorts(){
  var host = $('an-cohort'); if(!host) return;
  try {
    var r = await sb.rpc('admin_signup_cohorts', { p_weeks: 12 });
    if(r.error) throw r.error;
    var list = r.data || [];
    if(!list.length){
      host.innerHTML = '<div style="padding:24px;text-align:center;color:#94a3b8;font-size:12px;border-radius:12px;background:#111827;border:1px dashed #1e293b;">No signup data yet.</div>';
      return;
    }
    var maxNew = Math.max.apply(null, list.map(function(x){ return Number(x.new_users) || 0; }).concat([1]));

    var h = '<div style="padding:16px;border-radius:12px;background:#131c30;border:1px solid #1e293b;">';
    h += '<div style="font-size:11px;font-weight:900;color:#e2e8f0;letter-spacing:.5px;text-transform:uppercase;margin-bottom:12px;">Signup Cohorts · Last 12 Weeks</div>';

    h += '<div style="display:grid;grid-template-columns:110px 1fr 60px 60px;gap:8px;padding:6px 4px;font-size:10px;color:#94a3b8;font-weight:900;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid #1e293b;margin-bottom:8px;">';
    h += '<span>Week of</span><span>New users</span><span style="text-align:right;">Paid</span><span style="text-align:right;">Active</span>';
    h += '</div>';

    list.forEach(function(c){
      var cnt = Number(c.new_users) || 0;
      var barW = maxNew > 0 ? (cnt / maxNew) * 100 : 0;
      var dayLabel = new Date(c.week_start).toLocaleDateString(undefined, { month:'short', day:'numeric' });
      h += '<div style="display:grid;grid-template-columns:110px 1fr 60px 60px;gap:8px;padding:8px 4px;align-items:center;border-bottom:1px solid rgba(255,255,255,.04);">';
      h += '<span style="font-size:11px;color:#cbd5e1;font-weight:800;">' + esc(dayLabel) + '</span>';
      h += '<div style="display:flex;align-items:center;gap:6px;">';
      h += '<div style="flex:1;height:16px;background:rgba(0,0,0,.3);border-radius:4px;overflow:hidden;">';
      h += '<div style="height:100%;width:' + barW + '%;background:linear-gradient(90deg,#10b981,#3b82f6);border-radius:4px;"></div>';
      h += '</div>';
      h += '<span style="font-size:11px;color:#fff;font-weight:900;min-width:26px;text-align:right;">' + cnt + '</span>';
      h += '</div>';
      h += '<span style="font-size:11px;color:#10b981;font-weight:800;text-align:right;">' + (c.paid_users || 0) + '</span>';
      h += '<span style="font-size:11px;color:#60a5fa;font-weight:800;text-align:right;">' + (c.active_users || 0) + '</span>';
      h += '</div>';
    });

    h += '</div>';
    host.innerHTML = h;
  } catch(e){
    console.error('[cohorts]', e);
    host.innerHTML = '<div style="padding:24px;text-align:center;color:#a16262;font-size:12px;">Failed to load cohorts.</div>';
  }
}

<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ZYNIX Admin</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{background:#090d16;color:#f8fafc;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;min-height:100vh;overflow-x:hidden;}
  a{color:inherit;text-decoration:none;}

  /* ---------- Login screen ---------- */
  #adm-login{position:fixed;inset:0;z-index:5000;background:#090d16;display:flex;align-items:center;justify-content:center;padding:20px;}
  #adm-login .card{background:#111827;border:1px solid #1e293b;border-radius:18px;padding:28px 22px;width:100%;max-width:380px;text-align:center;}
  #adm-login .logo{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#10b981,#3b82f6);display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#000;margin:0 auto 18px;}
  #adm-login h1{font-size:20px;font-weight:900;color:#fff;margin-bottom:6px;}
  #adm-login p{font-size:12px;color:#94a3b8;line-height:1.6;margin-bottom:20px;}
  #adm-login .field{margin-bottom:12px;text-align:left;}
  #adm-login label{display:block;font-size:11px;color:#94a3b8;font-weight:800;text-transform:uppercase;letter-spacing:.4px;margin-bottom:6px;}
  #adm-login input{width:100%;padding:12px;border-radius:10px;border:1px solid #1e293b;background:#0f172a;color:#fff;font-size:14px;outline:none;font-family:inherit;box-sizing:border-box;}
  #adm-login input:focus{border-color:#10b981;}
  #adm-login button.primary{width:100%;padding:13px;border-radius:10px;border:none;background:linear-gradient(135deg,#10b981,#3b82f6);color:#000;font-weight:900;font-size:13px;cursor:pointer;margin-top:8px;}
  #adm-login button.primary:disabled{opacity:.5;cursor:not-allowed;}
  #adm-login button.back{width:100%;padding:10px;border-radius:10px;border:1px solid #1e293b;background:transparent;color:#94a3b8;font-weight:700;font-size:12px;cursor:pointer;margin-top:8px;}

  /* ---------- Access denied ---------- */
  #adm-denied{position:fixed;inset:0;z-index:5000;background:#090d16;display:none;align-items:center;justify-content:center;padding:20px;}
  #adm-denied .card{background:#111827;border:1px solid rgba(161,98,98,.4);border-radius:18px;padding:28px 22px;width:100%;max-width:380px;text-align:center;}
  #adm-denied .icon{width:60px;height:60px;border-radius:50%;background:rgba(161,98,98,.15);border:1px solid rgba(161,98,98,.5);display:flex;align-items:center;justify-content:center;font-size:24px;color:#a16262;margin:0 auto 16px;}
  #adm-denied h2{font-size:18px;font-weight:900;color:#fff;margin-bottom:8px;}
  #adm-denied p{font-size:12.5px;color:#cbd5e1;line-height:1.6;margin-bottom:18px;}

  /* ---------- Shell ---------- */
  #adm-shell{display:none;min-height:100vh;}
  #adm-shell.active{display:block;}

  .adm-header{position:fixed;top:0;left:0;right:0;height:56px;z-index:1000;background:rgba(9,13,22,.95);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid #1e293b;display:flex;align-items:center;justify-content:space-between;padding:0 16px;}
  .adm-header .brand{display:flex;align-items:center;gap:10px;}
  .adm-header .logo{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#10b981,#3b82f6);display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;font-size:13px;}
  .adm-header .title{font-size:15px;font-weight:900;background:linear-gradient(90deg,#10b981,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .adm-header .badge{font-size:9px;font-weight:900;color:#fbbf24;background:rgba(251,191,36,.12);border:1px solid rgba(251,191,36,.4);padding:3px 8px;border-radius:20px;letter-spacing:.4px;}
  .adm-header .right{display:flex;align-items:center;gap:8px;}
  .adm-header .user-chip{display:flex;align-items:center;gap:6px;padding:5px 10px;border-radius:20px;background:#0f172a;border:1px solid #1e293b;font-size:11px;color:#cbd5e1;font-weight:700;}
  .adm-header .user-chip .role{color:#fbbf24;font-size:9.5px;}
  .adm-header .icon-btn{width:32px;height:32px;border-radius:50%;background:#0f172a;border:1px solid #1e293b;color:#cbd5e1;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;padding:0;}
  .adm-header .icon-btn:hover{border-color:#10b981;color:#10b981;}

  .adm-body{display:flex;padding-top:56px;min-height:100vh;}

  .adm-sidebar{width:220px;background:#0b1220;border-right:1px solid #1e293b;padding:14px 10px;flex-shrink:0;position:fixed;top:56px;bottom:0;left:0;overflow-y:auto;z-index:500;}
  .adm-sidebar .nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:#94a3b8;font-size:12.5px;font-weight:700;cursor:pointer;margin-bottom:2px;border:1px solid transparent;background:transparent;width:100%;text-align:left;font-family:inherit;}
  .adm-sidebar .nav-item:hover{background:rgba(16,185,129,.06);color:#e2e8f0;}
  .adm-sidebar .nav-item.active{background:rgba(16,185,129,.10);border-color:rgba(16,185,129,.4);color:#10b981;}
  .adm-sidebar .nav-item i{width:16px;text-align:center;font-size:13px;}
  .adm-sidebar .nav-item .badge{margin-left:auto;font-size:9px;font-weight:900;background:#ef4444;color:#fff;padding:1px 6px;border-radius:8px;display:none;}
  .adm-sidebar .divider{height:1px;background:#1e293b;margin:8px 6px;}
  .adm-sidebar .nav-section{font-size:9.5px;color:#475569;font-weight:900;text-transform:uppercase;letter-spacing:.6px;padding:10px 12px 4px;}

  .adm-main{flex:1;padding:20px 22px 40px;margin-left:220px;min-width:0;}
  @media(max-width:768px){
    .adm-sidebar{display:none;}
    .adm-main{margin-left:0;padding:16px 14px 40px;}
  }

  .adm-page-title{font-size:20px;font-weight:900;color:#fff;margin-bottom:6px;}
  .adm-page-sub{font-size:12px;color:#94a3b8;margin-bottom:20px;line-height:1.55;}

  .adm-placeholder{background:#111827;border:1px dashed #334155;border-radius:14px;padding:40px 20px;text-align:center;}
  .adm-placeholder .icon{width:56px;height:56px;border-radius:16px;background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.3);display:flex;align-items:center;justify-content:center;font-size:22px;color:#10b981;margin:0 auto 14px;}
  .adm-placeholder h3{font-size:15px;font-weight:800;color:#e2e8f0;margin-bottom:6px;}
  .adm-placeholder p{font-size:12px;color:#64748b;line-height:1.6;}

  .adm-toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#111827;border:1px solid #1e293b;border-radius:12px;padding:11px 16px;font-size:12.5px;color:#e2e8f0;font-weight:700;box-shadow:0 8px 28px rgba(0,0,0,.7);z-index:99999;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;}
  .adm-toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
  .adm-toast.error{border-color:rgba(161,98,98,.5);color:#fca5a5;}
</style>
</head>
<body>

<!-- ============ LOGIN ============ -->
<div id="adm-login">
  <div class="card">
    <div class="logo">Z</div>
    <h1>ZYNIX Admin</h1>
    <p>Sign in with your ZYNIX account.<br>Only approved admins can access this panel.</p>
    <div class="field">
      <label>Email</label>
      <input id="adm-email" type="email" placeholder="you@example.com" autocomplete="email">
    </div>
    <div class="field">
      <label>Password</label>
      <input id="adm-pass" type="password" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button id="adm-signin" class="primary">Sign In</button>
    <button class="back" onclick="window.location.href='/'">← Back to ZYNIX</button>
  </div>
</div>

<!-- ============ ACCESS DENIED ============ -->
<div id="adm-denied">
  <div class="card">
    <div class="icon"><i class="fa-solid fa-user-lock"></i></div>
    <h2>Access Denied</h2>
    <p>Your account is not listed as an active admin.<br>Contact the platform owner if you believe this is an error.</p>
    <button class="primary" style="width:100%;padding:13px;border-radius:10px;border:none;background:linear-gradient(135deg,#10b981,#3b82f6);color:#000;font-weight:900;font-size:13px;cursor:pointer;" onclick="window.location.href='/'">Back to ZYNIX</button>
    <button class="back" id="adm-signout-denied" style="width:100%;padding:10px;border-radius:10px;border:1px solid #1e293b;background:transparent;color:#94a3b8;font-weight:700;font-size:12px;cursor:pointer;margin-top:8px;">Sign out</button>
  </div>
</div>

<!-- ============ SHELL ============ -->
<div id="adm-shell">
  <header class="adm-header">
    <div class="brand">
      <div class="logo">Z</div>
      <div class="title">ZYNIX</div>
      <div class="badge">ADMIN</div>
    </div>
    <div class="right">
      <div class="user-chip">
        <span id="adm-user-name">…</span>
        <span class="role" id="adm-user-role">…</span>
      </div>
      <button class="icon-btn" title="Back to ZYNIX" onclick="window.location.href='/'">
        <i class="fa-solid fa-arrow-up-right-from-square"></i>
      </button>
      <button class="icon-btn" title="Sign out" id="adm-signout-btn">
        <i class="fa-solid fa-right-from-bracket"></i>
      </button>
    </div>
  </header>

  <div class="adm-body">
    <nav class="adm-sidebar" id="adm-sidebar">
      <div class="nav-section">Overview</div>
      <button class="nav-item" data-nav="dashboard"><i class="fa-solid fa-gauge-high"></i> Dashboard</button>
      <button class="nav-item" data-nav="analytics"><i class="fa-solid fa-chart-line"></i> Analytics</button>

      <div class="divider"></div>
      <div class="nav-section">Moderation</div>
      <button class="nav-item" data-nav="content-queue"><i class="fa-solid fa-layer-group"></i> Content Queue <span class="badge" id="adm-nav-badge-content"></span></button>
      <button class="nav-item" data-nav="reports"><i class="fa-solid fa-flag"></i> Reports <span class="badge" id="adm-nav-badge-reports"></span></button>
      <button class="nav-item" data-nav="appeals"><i class="fa-solid fa-scale-balanced"></i> Appeals <span class="badge" id="adm-nav-badge-appeals"></span></button>

      <div class="divider"></div>
      <div class="nav-section">Operations</div>
      <button class="nav-item" data-nav="users"><i class="fa-solid fa-users"></i> Users</button>
      <button class="nav-item" data-nav="admins"><i class="fa-solid fa-user-shield"></i> Admin Team</button>
      <button class="nav-item" data-nav="ads"><i class="fa-solid fa-tv"></i> Ads Manager</button>
      <button class="nav-item" data-nav="notifications"><i class="fa-solid fa-bell"></i> Notifications</button>

      <div class="divider"></div>
      <div class="nav-section">Finance</div>
      <button class="nav-item" data-nav="ledger"><i class="fa-solid fa-book"></i> Ledger</button>
      <button class="nav-item" data-nav="pools"><i class="fa-solid fa-water"></i> Pools</button>
      <button class="nav-item" data-nav="payouts"><i class="fa-solid fa-money-bill-transfer"></i> Payouts</button>

      <div class="divider"></div>
      <div class="nav-section">System</div>
      <button class="nav-item" data-nav="admin-log"><i class="fa-solid fa-clipboard-list"></i> Admin Log</button>
      <button class="nav-item" data-nav="settings"><i class="fa-solid fa-gear"></i> Settings</button>
    </nav>

    <main class="adm-main" id="adm-main">
      <div class="adm-page-title">Loading…</div>
    </main>
  </div>
</div>

<div class="adm-toast" id="adm-toast"></div>

<script>
(function(){
'use strict';

/* ============================================================
   CONFIG — same Supabase as main app
   ============================================================ */
var SUPABASE_URL = 'https://ipypwqajsfxrdzlxfnlr.supabase.co';
var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlweXB3cWFqc2Z4cmR6bHhmbmxyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2OTA5ODUsImV4cCI6MjEwNDI2NzM4NX0.QW6tzaMxlNg9EYuRq0tCOlGipBlrjBuiV6lZuSr1Jj4';

var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});

/* ============================================================
   STATE
   ============================================================ */
var Admin = {
  user: null,
  profile: null,
  role: null,       /* super_admin / admin / moderator */
  currentView: 'dashboard',
  counts: { content:0, reports:0, appeals:0 }
};
window.Admin = Admin;

/* ============================================================
   HELPERS
   ============================================================ */
function $(id){ return document.getElementById(id); }
function esc(s){
  if(s == null) return '';
  return String(s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}
function toast(msg, isErr){
  var t = $('adm-toast');
  if(!t) return;
  t.textContent = msg;
  t.className = 'adm-toast show' + (isErr ? ' error' : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.className = 'adm-toast'; }, 2800);
}
function show(el){ el.style.display = 'flex'; }
function hide(el){ el.style.display = 'none'; }
function setShell(on){ $('adm-shell').classList.toggle('active', !!on); }

/* ============================================================
   AUTH FLOW
   ============================================================ */
async function trySession(){
  try {
    var s = await sb.auth.getSession();
    var session = s && s.data ? s.data.session : null;
    if(!session || !session.user) return false;
    Admin.user = session.user;
    return await loadProfileAndRole();
  } catch(e){ return false; }
}

async function loadProfileAndRole(){
  if(!Admin.user) return false;
  try {
    var pr = await sb.from('profiles').select('id,name,username,avatar').eq('id', Admin.user.id).maybeSingle();
    if(pr.error || !pr.data){ toast('Profile not found.', true); return false; }
    Admin.profile = pr.data;

    var rr = await sb.rpc('my_admin_role');
    if(rr.error){ toast('Role check failed.', true); return false; }
    if(!rr.data){ return false; }  /* not admin */
    Admin.role = rr.data;

    /* Update UI */
    var nameEl = $('adm-user-name');
    var roleEl = $('adm-user-role');
    if(nameEl) nameEl.textContent = Admin.profile.name || Admin.profile.username || 'Admin';
    if(roleEl) roleEl.textContent = Admin.role.replace('_',' ');
    return true;
  } catch(e){
    console.error('[admin] loadProfileAndRole', e);
    return false;
  }
}

async function signIn(email, pass){
  var btn = $('adm-signin');
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    var r = await sb.auth.signInWithPassword({ email: email, password: pass });
    if(r.error) throw r.error;
    Admin.user = r.data.user;
    var ok = await loadProfileAndRole();
    if(!ok){
      /* Not an admin */
      hide($('adm-login'));
      show($('adm-denied'));
      return;
    }
    /* Admin — enter shell */
    hide($('adm-login'));
    hide($('adm-denied'));
    setShell(true);
    renderSidebar();
    navigate('dashboard');
    loadBadges();
  } catch(e){
    toast((e && e.message) ? e.message : 'Sign in failed.', true);
  } finally {
    btn.disabled = false; btn.textContent = 'Sign In';
  }
}

async function signOut(){
  try { await sb.auth.signOut(); } catch(e){}
  Admin.user = null; Admin.profile = null; Admin.role = null;
  setShell(false);
  show($('adm-login'));
  hide($('adm-denied'));
  $('adm-pass').value = '';
}

/* ============================================================
   SIDEBAR + NAVIGATION
   ============================================================ */
var PAGES = {
  'dashboard':     { title:'Dashboard',       sub:'Platform pulse at a glance', icon:'fa-solid fa-gauge-high' },
  'analytics':     { title:'Analytics',       sub:'Growth, engagement, revenue trends', icon:'fa-solid fa-chart-line' },
  'content-queue': { title:'Content Queue',   sub:'Pending market lots awaiting review', icon:'fa-solid fa-layer-group' },
  'reports':       { title:'Reports',         sub:'User and content reports', icon:'fa-solid fa-flag' },
  'appeals':       { title:'Appeals',         sub:'Ban appeals from users', icon:'fa-solid fa-scale-balanced' },
  'users':         { title:'Users',           sub:'Search, view, and manage user accounts', icon:'fa-solid fa-users' },
  'admins':        { title:'Admin Team',      sub:'Manage admin roles', icon:'fa-solid fa-user-shield' },
  'ads':           { title:'Ads Manager',     sub:'Create, edit, budget, and toggle ads', icon:'fa-solid fa-tv' },
  'notifications': { title:'Notifications',   sub:'Broadcast messages to users', icon:'fa-solid fa-bell' },
  'ledger':        { title:'Ledger',          sub:'Income, expenses, rebates, transfers', icon:'fa-solid fa-book' },
  'pools':         { title:'Pools',           sub:'Bounty, CSF, Peer Support, Ad Wallet', icon:'fa-solid fa-water' },
  'payouts':       { title:'Payouts',         sub:'Wise / Payoneer batch processing', icon:'fa-solid fa-money-bill-transfer' },
  'admin-log':     { title:'Admin Log',       sub:'Every admin action, timestamped', icon:'fa-solid fa-clipboard-list' },
  'settings':      { title:'Settings',        sub:'Platform configuration', icon:'fa-solid fa-gear' }
};

function renderSidebar(){
  document.querySelectorAll('#adm-sidebar .nav-item').forEach(function(btn){
    btn.addEventListener('click', function(){
      var nav = this.getAttribute('data-nav');
      navigate(nav);
    });
  });
}

function navigate(view){
  if(!PAGES[view]) view = 'dashboard';
  Admin.currentView = view;
  document.querySelectorAll('#adm-sidebar .nav-item').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-nav') === view);
  });
  var main = $('adm-main');
  var p = PAGES[view];
  main.innerHTML =
    '<div class="adm-page-title">' + esc(p.title) + '</div>' +
    '<div class="adm-page-sub">' + esc(p.sub) + '</div>' +
    '<div class="adm-placeholder">' +
      '<div class="icon"><i class="' + p.icon + '"></i></div>' +
      '<h3>' + esc(p.title) + '</h3>' +
      '<p>This section will be built in Chunk 2+. Foundation and access system are live.</p>' +
    '</div>';
}

/* Badge counts placeholder — fetched in Chunk 2/3 */
async function loadBadges(){
  /* No-op for chunk 1 */
}

/* ============================================================
   BIND UI
   ============================================================ */
function bindUI(){
  $('adm-signin').addEventListener('click', function(){
    var email = ($('adm-email').value || '').trim();
    var pass  = $('adm-pass').value || '';
    if(!email || !pass){ toast('Enter email and password.', true); return; }
    signIn(email, pass);
  });
  $('adm-pass').addEventListener('keydown', function(e){
    if(e.key === 'Enter') $('adm-signin').click();
  });
  $('adm-signout-btn').addEventListener('click', signOut);
  $('adm-signout-denied').addEventListener('click', signOut);
}

/* ============================================================
   BOOT
   ============================================================ */
async function boot(){
  bindUI();
  var ok = await trySession();
  if(ok){
    hide($('adm-login'));
    hide($('adm-denied'));
    setShell(true);
    renderSidebar();
    navigate('dashboard');
    loadBadges();
  } else {
    /* If there is a signed-in session but not admin → show denied */
    try {
      var s = await sb.auth.getSession();
      if(s && s.data && s.data.session && s.data.session.user){
        hide($('adm-login'));
        show($('adm-denied'));
      }
    } catch(e){}
  }
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

console.log('[ZYNIX Admin — Chunk 1] foundation · access · layout ready');
})();
</script>

<!-- ============================================================
     ZYNIX Admin — Chunk 2
     Dashboard + Users + Admin Log
     ============================================================ -->
<script>
(function(){
'use strict';
var Admin = window.Admin;
if(!Admin) return;
if(Admin.__chunk2) return; Admin.__chunk2 = true;

var sb = window.supabase.createClient(
  'https://ipypwqajsfxrdzlxfnlr.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlweXB3cWFqc2Z4cmR6bHhmbmxyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2OTA5ODUsImV4cCI6MjEwNDI2NzM4NX0.QW6tzaMxlNg9EYuRq0tCOlGipBlrjBuiV6lZuSr1Jj4',
  { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }
);

function $(id){ return document.getElementById(id); }
function esc(s){
  if(s == null) return '';
  return String(s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}
function money(n){ return '$' + (Number(n)||0).toFixed(2); }
function timeAgo(ts){
  if(!ts) return '';
  var s = Math.floor((Date.now() - new Date(ts).getTime())/1000);
  if(s < 60) return s + 's ago';
  if(s < 3600) return Math.floor(s/60) + 'm ago';
  if(s < 86400) return Math.floor(s/3600) + 'h ago';
  if(s < 2592000) return Math.floor(s/86400) + 'd ago';
  return new Date(ts).toLocaleDateString();
}
function toast(m, e){
  var t = $('adm-toast'); if(!t) return;
  t.textContent = m;
  t.className = 'adm-toast show' + (e ? ' error' : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(function(){ t.className = 'adm-toast'; }, 2800);
}
window.AdminToaster = toast;

/* ============================================================
   CSS additions for Chunk 2
   ============================================================ */
if(!document.getElementById('zynix-adm-c2-css')){
  var st = document.createElement('style');
  st.id = 'zynix-adm-c2-css';

async function banUser(userId){
  var reason = prompt('Reason for ban (min 3 characters):', '');
  if(reason === null) return;
  if(!reason.trim() || reason.trim().length < 3){ toast('Reason required.', true); return; }
  try {
    var r = await sb.rpc('admin_ban_user', { p_user_id: userId, p_reason: reason.trim() });
    if(r.error) throw r.error;
    toast('User banned.');
    var modal = $('adm-user-modal'); if(modal) modal.remove();
    loadUsers();
  } catch(e){
    toast('Ban failed: ' + ((e && e.message) || 'unknown'), true);
  }
}

async function unbanUser(userId){
  if(!confirm('Unban this user?')) return;
  try {
    var r = await sb.rpc('admin_unban_user', { p_user_id: userId });
    if(r.error) throw r.error;
    toast('User unbanned.');
    var modal = $('adm-user-modal'); if(modal) modal.remove();
    loadUsers();
  } catch(e){
    toast('Unban failed: ' + ((e && e.message) || 'unknown'), true);
  }
}

   ============================================================ */
/* Wait for Chunk 1's Admin object to be ready, then override navigate */
function attachNav(){
  if(!Admin || !Admin.__chunk1Ready){
    /* Chunk 1 doesn't expose a ready flag, so just override navigate now. */
  }
  var _prevNavigate = Admin.navigate;
  Admin.navigate = function(view){
    if(view === 'dashboard'){ return renderDashboard($('adm-main')); }
    if(view === 'users'){ return renderUsers($('adm-main')); }
    if(view === 'admin-log'){ return renderAdminLog($('adm-main')); }
    if(typeof _prevNavigate === 'function') return _prevNavigate.call(Admin, view);
    /* fallback: default placeholder */
    var main = $('adm-main');
    main.innerHTML = '<div class="adm-page-title">' + view + '</div><div class="adm-placeholder"><h3>Coming in later chunk</h3></div>';
  };
  /* Re-navigate to refresh current view */
  Admin.navigate(Admin.currentView || 'dashboard');
}

/* The Chunk 1 navigate function lives as a closure, but it's exported
   on the Admin object? No — it's a local function. So we replace
   the click handlers on sidebar buttons. */
function rewireSidebar(){
  document.querySelectorAll('#adm-sidebar .nav-item').forEach(function(btn){
    var nav = btn.getAttribute('data-nav');
    /* Clone to strip old listeners */
    var clone = btn.cloneNode(true);
    btn.parentNode.replaceChild(clone, btn);
    clone.addEventListener('click', function(){
      Admin.currentView = nav;
      document.querySelectorAll('#adm-sidebar .nav-item').forEach(function(b){
        b.classList.toggle('active', b.getAttribute('data-nav') === nav);
      });
      var main = $('adm-main');
      if(nav === 'dashboard') return renderDashboard(main);
      if(nav === 'users') return renderUsers(main);
      if(nav === 'admin-log') return renderAdminLog(main);
      /* placeholder for others */
      var titles = {
        'analytics':'Analytics','content-queue':'Content Queue','reports':'Reports',
        'appeals':'Appeals','admins':'Admin Team','ads':'Ads Manager',
        'notifications':'Notifications','ledger':'Ledger','pools':'Pools',
        'payouts':'Payouts','settings':'Settings'
      };
      main.innerHTML =
        '<div class="adm-page-title">' + (titles[nav] || nav) + '</div>' +
        '<div class="adm-placeholder">' +
          '<div class="icon"><i class="fa-solid fa-hammer"></i></div>' +
          '<h3>Coming in later chunk</h3>' +
          '<p>Chunk 1+2 delivered Dashboard, Users, and Admin Log. This page arrives in Chunk 3+.</p>' +
        '</div>';
    });
  });
}

/* Also wire the boot flow: after login, Chunk 1 calls navigate('dashboard')
   on the internal closure, which won't hit our override. So we re-render
   dashboard ourselves once the shell appears. */
function watchForShell(){
  var shell = $('adm-shell');
  if(!shell) return;
  var interval = setInterval(function(){
    if(shell.classList.contains('active')){
      clearInterval(interval);
      setTimeout(function(){
        rewireSidebar();
        /* Force-render dashboard since Chunk 1 rendered the old placeholder */
        renderDashboard($('adm-main'));
      }, 250);
    }
  }, 300);
  /* Safety: stop after 60s if never logged in */
  setTimeout(function(){ clearInterval(interval); }, 60000);
}

/* Also re-fire if user signs out and back in */
var _origSignOut = null;
document.addEventListener('click', function(e){
  var btn = e.target.closest('#adm-signout-btn, #adm-signout-denied');
  if(!btn) return;
  setTimeout(function(){ watchForShell(); }, 400);
}, true);

if(document.readyState === 'loading'){

  } catch(e){ toast('Failed: ' + (e.message || 'unknown'), true); }
}

    '<h3>' + (isNew?'New Ad':'Edit Ad') + '</h3>' +
    '<div class="adm-form-row"><label>Internal title (admin only)</label><input id="ad-t" value="' + esc(d.internal_title) + '" maxlength="80" placeholder="e.g. Ramadan promo Sep 2026"></div>' +
    '<div class="adm-form-row"><label>Heading (shown to users)</label><input id="ad-h" value="' + esc(d.heading||'') + '" maxlength="60"></div>' +
    '<div class="adm-form-row"><label>Subtitle</label><input id="ad-s" value="' + esc(d.subtitle||'') + '" maxlength="100"></div>' +
    '<div class="adm-form-row"><label>CTA label (optional)</label><input id="ad-c" value="' + esc(d.cta||'') + '" maxlength="30" placeholder="e.g. Shop now"></div>' +
    '<div class="adm-form-row"><label>Media URL (video or image)</label><input id="ad-u" value="' + esc(d.media_url||'') + '" placeholder="https://pub-....r2.dev/..."></div>' +
    '<div class="adm-form-row"><label>Media type</label><select id="ad-mt"><option value="">None</option><option value="video"' + (d.media_type==='video'?' selected':'') + '>Video</option><option value="image"' + (d.media_type==='image'?' selected':'') + '>Image</option></select></div>' +
    '<div class="adm-form-row"><label>Monthly budget (USD, optional)</label><input id="ad-b" type="number" step="0.01" min="0" value="' + esc(d.monthly_budget||'') + '" placeholder="e.g. 50"></div>' +
    '<div class="adm-form-row"><label style="display:flex;gap:8px;align-items:center;"><input type="checkbox" id="ad-a" ' + (d.is_active!==false?'checked':'') + ' style="width:auto;"> Active</label></div>' +
    '<div class="row"><button class="adm-btn primary" id="ad-save" style="flex:1;">' + (isNew?'Create':'Save') + '</button><button class="adm-btn ghost" onclick="document.getElementById(\'adm-ad-modal\').remove()">Cancel</button></div>' +
  '</div></div>';
  document.body.insertAdjacentHTML('beforeend', h);
  $('ad-save').addEventListener('click', async function(){
    var payload = {
      p_internal_title: ($('ad-t').value||'').trim(),
      p_heading: ($('ad-h').value||'').trim(),
      p_subtitle: ($('ad-s').value||'').trim(),
      p_cta: ($('ad-c').value||'').trim(),
      p_media_type: $('ad-mt').value,
      p_media_url: ($('ad-u').value||'').trim(),
      p_bg_id: 'deep-blue', p_wp_id: '', p_font_id: 'display',
      p_monthly_budget: parseFloat($('ad-b').value)||null,
      p_is_active: $('ad-a').checked
    };
    if(payload.p_internal_title.length < 2){ toast('Internal title required.', true); return; }
    this.disabled = true; this.textContent = 'Saving…';
    try {
      var r;
      if(isNew){ r = await sb.rpc('admin_ad_create', payload); }
      else { r = await sb.rpc('admin_ad_update', Object.assign({ p_ad_id: ad.id }, payload)); }
      if(r.error) throw r.error;
      toast(isNew ? 'Ad created.' : 'Ad updated.');
      $('adm-ad-modal').remove();
      loadAds();
    } catch(e){ toast('Failed: ' + ((e&&e.message)||'unknown'), true); this.disabled = false; this.textContent = 'Save'; }
  });
}
async function toggleAd(id, wasActive, list){
  var a = list.find(function(x){return x.id===id;}); if(!a) return;
  var payload = { p_ad_id: id, p_internal_title: a.internal_title||'', p_heading: a.heading||'', p_subtitle: a.subtitle||'', p_cta: a.cta||'', p_media_type: a.media_type||'', p_media_url: a.media_url||'', p_bg_id:'deep-blue', p_wp_id:'', p_font_id:'display', p_monthly_budget: a.monthly_budget, p_is_active: !wasActive };
  try { var r = await sb.rpc('admin_ad_update', payload); if(r.error) throw r.error; toast(!wasActive?'Activated.':'Paused.'); loadAds(); }
  catch(e){ toast('Failed.', true); }
}
async function deleteAd(id){
  if(!confirm('Delete this ad? Cannot be undone.')) return;
  try { var r = await sb.rpc('admin_ad_delete', { p_ad_id: id }); if(r.error) throw r.error; toast('Ad deleted.'); loadAds(); }
  catch(e){ toast('Failed: ' + ((e&&e.message)||'unknown'), true); }
}

/* ---- ANALYTICS ---- */
async function renderAnalytics(main){
  main.innerHTML = '<div class="adm-page-title">Analytics</div><div class="adm-page-sub">Last 30 days overview.</div><div id="adm-an-host"><div style="text-align:center;padding:30px;color:#64748b;"><i class="fa-solid fa-circle-notch fa-spin"></i></div></div>';
  var host = $('adm-an-host');
  try {
    var [u, rev, c] = await Promise.all([
      sb.rpc('admin_analytics_users', { p_days: 30 }),
      sb.rpc('admin_analytics_revenue', { p_days: 30 }),
      sb.rpc('admin_analytics_content', { p_days: 30 })
    ]);
    function chart(title, data, keys, colors){
      var max = 0;
      data.forEach(function(d){ keys.forEach(function(k){ if(Number(d[k]) > max) max = Number(d[k]); }); });
      if(max <= 0) max = 1;
      var bars = '';
      data.forEach(function(d){
        keys.forEach(function(k, ki){
          var h2 = Math.max(2, Math.round((Number(d[k])/max)*60));
          bars += '<div style="flex:1;height:' + h2 + 'px;background:' + colors[ki] + ';border-radius:2px;margin:0 0.5px;"></div>';
        });
      });
      var total = data.reduce(function(s,d){ return s + keys.reduce(function(s2,k){ return s2 + (Number(d[k])||0); }, 0); }, 0);
      return '<div style="padding:14px;border-radius:12px;background:#131c30;border:1px solid #1e293b;margin-bottom:12px;">' +
        '<div style="font-size:11px;font-weight:900;color:#e2e8f0;letter-spacing:.4px;margin-bottom:10px;">' + title + ' · <span style="color:#10b981;">' + total.toFixed(0) + '</span></div>' +
        '<div style="display:flex;align-items:flex-end;height:64px;gap:0;">' + bars + '</div>' +
        '<div style="display:flex;justify-content:space-between;margin-top:6px;font-size:9px;color:#64748b;"><span>' + (data[0] ? data[0].day : '') + '</span><span>' + (data[data.length-1] ? data[data.length-1].day : '') + '</span></div>' +
      '</div>';
    }
    var h = '';
    if(!u.error) h += chart('New Users', u.data || [], ['new_users'], ['#10b981']);
    if(!rev.error) h += chart('Revenue (income + expense)', rev.data || [], ['income','expense'], ['#10b981','#a16262']);
    if(!c.error) h += chart('Content (posts + sparks)', c.data || [], ['posts','sparks'], ['#60a5fa','#8b5cf6']);
    host.innerHTML = h || '<div style="text-align:center;padding:30px;color:#94a3b8;font-size:12px;">No data.</div>';
  } catch(e){ host.innerHTML = '<div style="text-align:center;padding:30px;color:#a16262;font-size:12px;">Failed.</div>'; }
}

/* ---- NOTIFICATIONS ---- */
async function renderNotifications(main){
  main.innerHTML = '<div class="adm-page-title">Notifications</div><div class="adm-page-sub">Broadcast to users. Use carefully.</div>' +
    '<div style="padding:14px;border-radius:12px;background:#131c30;border:1px solid #1e293b;">' +
      '<div class="adm-form-row"><label>Title</label><input id="adm-bc-title" maxlength="80" placeholder="e.g. Ad TV is live"></div>' +
      '<div class="adm-form-row"><label>Message</label><textarea id="adm-bc-body" maxlength="600" placeholder="Write the announcement"></textarea></div>' +
      '<div class="adm-form-row"><label>Segment</label><select id="adm-bc-seg"><option value="all">All users</option><option value="paid">Paid tier users</option><option value="active">Active (30d) users</option></select></div>' +
      '<button class="adm-btn primary" id="adm-bc-send">Send broadcast</button>' +
    '</div>';
  $('adm-bc-send').addEventListener('click', async function(){
    var title = ($('adm-bc-title').value||'').trim();
    var body = ($('adm-bc-body').value||'').trim();
    var seg = $('adm-bc-seg').value;
    if(body.length < 3){ toast('Message too short.', true); return; }
    if(!confirm('Send to ' + seg + ' users?\n\nThis will notify everyone in the segment.')) return;
    this.disabled = true; this.textContent = 'Sending…';
    try {
      var r = await sb.rpc('admin_broadcast', { p_title: title, p_body: body, p_segment: seg });
      if(r.error) throw r.error;
      toast('Sent to ' + (r.data.count||0) + ' users.');
      $('adm-bc-title').value = ''; $('adm-bc-body').value = '';
    } catch(e){ toast('Failed: ' + ((e&&e.message)||'unknown'), true); }
    this.disabled = false; this.textContent = 'Send broadcast';
  });
}

/* ---- SETTINGS ---- */
async function renderSettings(main){
  main.innerHTML = '<div class="adm-page-title">Settings</div><div class="adm-page-sub">Platform configuration (super_admin only for edits).</div><div id="adm-set-host"><div style="text-align:center;padding:30px;color:#64748b;"><i class="fa-solid fa-circle-notch fa-spin"></i></div></div>';
  try {
    var r = await sb.rpc('admin_settings_list');
    if(r.error){ $('adm-set-host').innerHTML = '<div style="text-align:center;padding:20px;color:#a16262;font-size:12px;">Failed: ' + esc(r.error.message) + '</div>'; return; }
    var list = r.data || [];
    if(!list.length){ $('adm-set-host').innerHTML = '<div style="text-align:center;padding:30px;color:#94a3b8;font-size:12px;">No settings.</div>'; return; }
    var h = '';
    list.forEach(function(s){
      h += '<div style="padding:12px;border-radius:10px;background:#131c30;border:1px solid #1e293b;margin-bottom:8px;">' +
        '<div style="font-size:11px;color:#94a3b8;font-weight:800;text-transform:uppercase;letter-spacing:.4px;">' + esc(s.key) + '</div>' +
        '<div style="display:flex;gap:8px;align-items:center;margin-top:6px;">' +
          '<input id="set-' + esc(s.key) + '" value="' + esc(s.value||'') + '" style="flex:1;padding:9px;border-radius:8px;border:1px solid #1e293b;background:#0f172a;color:#fff;font-size:13px;outline:none;">' +
          '<button class="adm-btn primary" data-set-save="' + esc(s.key) + '" style="padding:9px 14px;font-size:11px;">Save</button>' +
        '</div>' +
        (s.notes ? '<div style="font-size:10px;color:#64748b;margin-top:4px;">' + esc(s.notes) + '</div>' : '') +
      '</div>';
    });
    $('adm-set-host').innerHTML = h;
    document.querySelectorAll('[data-set-save]').forEach(function(b){
      b.addEventListener('click', async function(){
        var key = this.getAttribute('data-set-save');
        var val = ($('set-' + key).value || '').trim();
        this.disabled = true; this.textContent = '…';
        try {
          var r2 = await sb.rpc('admin_settings_set', { p_key: key, p_value: val, p_notes: null });
          if(r2.error) throw r2.error;
          toast('Saved.');
        } catch(e){ toast('Failed: ' + ((e&&e.message)||'unknown'), true); }
        this.disabled = false; this.textContent = 'Save';
      });
    });
  } catch(e){}
}

window.AdminChunk5 = { renderAds, renderAnalytics, renderNotifications, renderSettings };
console.log('[ZYNIX Admin — Chunk 5] ads · analytics · notifications · settings ready');
})();
</script>

<!-- Chunk 5 — nav wiring (attach new pages to sidebar) -->
<script>
(function(){
'use strict';
var Admin = window.Admin; if(!Admin) return;
if(Admin.__chunk5Nav) return; Admin.__chunk5Nav = true;

/* Re-wire sidebar to include Chunk 4 + Chunk 5 pages */
function rewire(){
  document.querySelectorAll('#adm-sidebar .nav-item').forEach(function(btn){
    var nav = btn.getAttribute('data-nav');
    var clone = btn.cloneNode(true);
    btn.parentNode.replaceChild(clone, btn);
    clone.addEventListener('click', function(){
      Admin.currentView = nav;
      document.querySelectorAll('#adm-sidebar .nav-item').forEach(function(b){
        b.classList.toggle('active', b.getAttribute('data-nav') === nav);
      });
      var main = document.getElementById('adm-main');
      var C3 = window.AdminChunk3 || {};
      var C4 = window.AdminChunk4 || {};
      var C5 = window.AdminChunk5 || {};
      if(nav === 'dashboard' && Admin.__renderDashboard) return Admin.__renderDashboard(main);
      if(nav === 'content-queue' && C3.renderContentQueue) return C3.renderContentQueue(main);
      if(nav === 'reports' && C3.renderReports) return C3.renderReports(main);
      if(nav === 'appeals' && C3.renderAppeals) return C3.renderAppeals(main);
      if(nav === 'ledger' && C4.renderLedger) return C4.renderLedger(main);
      if(nav === 'pools' && C4.renderPools) return C4.renderPools(main);
      if(nav === 'payouts' && C4.renderPayouts) return C4.renderPayouts(main);
      if(nav === 'ads' && C5.renderAds) return C5.renderAds(main);
      if(nav === 'analytics' && C5.renderAnalytics) return C5.renderAnalytics(main);
      if(nav === 'notifications' && C5.renderNotifications) return C5.renderNotifications(main);
      if(nav === 'settings' && C5.renderSettings) return C5.renderSettings(main);
      /* Chunk 2 pages */
      if(nav === 'users' && window.AdminChunk2 && window.AdminChunk2.renderUsers) return window.AdminChunk2.renderUsers(main);
      if(nav === 'admin-log' && window.AdminChunk2 && window.AdminChunk2.renderAdminLog) return window.AdminChunk2.renderAdminLog(main);
      main.innerHTML = '<div class="adm-page-title">' + nav + '</div><div class="adm-placeholder"><h3>Coming soon</h3></div>';
    });
  });
}
window.__rewireAdminSidebar = rewire;
rewire();
})();
</script>

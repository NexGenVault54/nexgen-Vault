<!DOCTYPE html>
<!-- ZYNIX SCHOOL — Section 19 Starter v1.0 -->
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ZYNIX School</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* ============================================================
   BASE — same as main ZYNIX
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#090d16;color:#f8fafc;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding-bottom:80px;overflow-x:hidden}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:#090d16}
::-webkit-scrollbar-thumb{background:#1e293b;border-radius:4px}

/* ============================================================
   HEADER — school-specific (NOT the main ZYNIX header)
   ============================================================ */
.zs-header{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(9,13,22,.92);backdrop-filter:blur(12px);border-bottom:1px solid #1e293b;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;min-height:56px}
.zs-header-left{display:flex;align-items:center;gap:10px}
.zs-logo{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#10b981,#3b82f6);display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;font-size:14px}
.zs-title{font-size:16px;font-weight:900;background:linear-gradient(90deg,#10b981,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent}
.zs-back-btn{background:rgba(30,41,59,.7);border:1px solid #1e293b;color:#cbd5e1;padding:7px 12px;border-radius:20px;font-size:11px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .2s}
.zs-back-btn:hover{border-color:#10b981;color:#10b981}

/* ============================================================
   BOTTOM NAV — school-specific tabs
   ============================================================ */
.zs-footer{position:fixed;bottom:0;left:0;right:0;z-index:1000;background:rgba(9,13,22,.95);backdrop-filter:blur(12px);border-top:1px solid #1e293b;padding:8px 0;display:flex;align-items:center;justify-content:space-around;max-width:600px;margin:0 auto}
.zs-footer button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 0;color:#64748b;transition:color .2s;background:transparent;border:none;font-size:9px;cursor:pointer;font-weight:500;position:relative}
.zs-footer button i{font-size:18px;margin-bottom:2px}
.zs-footer button.active{color:#10b981}
@media(hover:hover){.zs-footer button:hover{color:#10b981}}

#zs-app{max-width:600px;margin:0 auto;padding:76px 14px 20px;min-height:calc(100vh - 80px)}

/* ============================================================
   WELCOME OVERLAY
   ============================================================ */
#zs-welcome{position:fixed;inset:0;z-index:20000;background:#090d16;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;opacity:1;transition:opacity .28s ease;pointer-events:auto}
#zs-welcome.fadeout{opacity:0;pointer-events:none}
.zs-welcome-logo{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,#10b981,#3b82f6);display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;font-size:38px;box-shadow:0 10px 40px rgba(16,185,129,.35)}
.zs-welcome-wordmark{margin-top:20px;font-size:28px;font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,#10b981,#3b82f6,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
.zs-welcome-tagline{margin-top:8px;font-size:11px;font-weight:600;letter-spacing:3px;color:#64748b;text-transform:uppercase}

/* ============================================================
   CARDS
   ============================================================ */
.zs-card{background:#111827;border:1px solid #1e293b;border-radius:16px;padding:16px;margin-bottom:12px}
.zs-empty{text-align:center;padding:40px 20px;color:#64748b}
.zs-empty i{font-size:32px;display:block;margin-bottom:12px;color:#334155}
.zs-empty p{font-size:12px;margin-bottom:14px}

/* ============================================================
   TOAST
   ============================================================ */
#zs-toast-container{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:2147483647;width:90%;max-width:380px;pointer-events:none}
.zs-toast{background:rgba(17,24,39,.95);border:1px solid rgba(16,185,129,.3);color:#f8fafc;padding:10px 14px;border-radius:12px;font-size:12px;margin-bottom:6px;backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;opacity:0;transform:translateY(10px);transition:all .3s ease;pointer-events:auto}
.zs-toast.show{opacity:1;transform:translateY(0)}
.zs-toast i{color:#10b981;font-size:16px}
</style>
</head>
<body>

<!-- ============ HEADER ============ -->
<header class="zs-header">
  <div class="zs-header-left">
    <div class="zs-logo">S</div>
    <span class="zs-title">ZYNIX SCHOOL</span>
  </div>
  <button class="zs-back-btn" onclick="ZS.goBackToPlatform()">
    <i class="fa-solid fa-arrow-left"></i> Back to ZYNIX
  </button>
</header>

<!-- ============ MAIN APP CONTAINER ============ -->
<main id="zs-app"></main>

<!-- ============ BOTTOM NAV ============ -->
<nav class="zs-footer" id="zs-bottom-nav">
  <button onclick="ZS.showView('home')" id="zs-nav-home" class="active"><i class="fa-solid fa-house"></i><span>Home</span></button>
  <button onclick="ZS.showView('classes')" id="zs-nav-classes"><i class="fa-solid fa-chalkboard-user"></i><span>Classes</span></button>
  <button onclick="ZS.showView('notices')" id="zs-nav-notices"><i class="fa-solid fa-bullhorn"></i><span>Notices</span></button>
  <button onclick="ZS.showView('messages')" id="zs-nav-messages"><i class="fa-solid fa-comments"></i><span>Messages</span></button>
  <button onclick="ZS.showView('profile')" id="zs-nav-profile"><i class="fa-solid fa-user"></i><span>Profile</span></button>
</nav>

<!-- ============ WELCOME SCREEN ============ -->
<div id="zs-welcome">
  <div class="zs-welcome-logo">S</div>
  <div class="zs-welcome-wordmark">ZYNIX SCHOOL</div>
  <div class="zs-welcome-tagline">Learn · Teach · Connect</div>
</div>

<!-- ============ TOASTS ============ -->
<div id="zs-toast-container"></div>

<script>
/* ============================================================
   ZYNIX SCHOOL — BOOT
   Same Supabase project as main ZYNIX
   ============================================================ */
(function(){
'use strict';

window.ZS = {};
var ZS = window.ZS;

/* ---- SAME keys as main index.html ---- */
ZS.SUPABASE_URL = 'https://ipypwqajsfxrdzlxfnlr.supabase.co';
ZS.SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlweXB3cWFqc2Z4cmR6bHhmbmxyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2OTEzODUsImV4cCI6MjEwNDI2NzM4NX0.QW6tzaMxlNg9EYuRq0tCOlGipBlrjBuiV6lZuSr1Jj4';

var _sb = null;
function sb(){
  if(_sb) return _sb;
  if(!window.supabase) return null;
  _sb = window.supabase.createClient(ZS.SUPABASE_URL, ZS.SUPABASE_ANON_KEY, {
    auth:{persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}
  });
  return _sb;
}
ZS.sb = sb;

ZS.State = {
  currentUser: null,
  currentView: 'home',
  mySchool: null,
  myRoles: []
};

/* ---- TOAST ---- */
ZS.toast = function(msg, type){
  var c = document.getElementById('zs-toast-container');
  if(!c) return;
  var t = document.createElement('div');
  var isError = (type === 'error');
  t.className = 'zs-toast';
  var icon = isError ? 'fa-solid fa-triangle-exclamation' : 'fa-solid fa-circle-check';
  if(isError) t.style.borderColor = 'rgba(161,98,98,.55)';
  t.innerHTML = '<i class="' + icon + '"' + (isError ? ' style="color:#a16262;"' : '') + '></i> ' + msg;
  c.appendChild(t);
  requestAnimationFrame(function(){ t.classList.add('show'); });
  setTimeout(function(){
    t.classList.remove('show');
    setTimeout(function(){ t.remove(); }, 300);
  }, 2600);
};

/* ---- BACK TO PLATFORM ---- */
ZS.goBackToPlatform = function(){
  var u = ZS.State.currentUser;
  /* Soft gate: only confirm if user is teacher or student */
  var roles = ZS.State.myRoles || [];
  var needsConfirm = roles.indexOf('teacher') !== -1 || roles.indexOf('student') !== -1;

  if(!needsConfirm){
    window.location.href = 'index.html';
    return;
  }

  /* Confirmation popup */
  if(confirm('You are leaving School mode.\nYour students and pending tasks will not be visible until you return.\n\nLeave to ZYNIX?')){
    window.location.href = 'index.html';
  }
};

/* ---- VIEWS (placeholder for now) ---- */
ZS.showView = function(view){
  ZS.State.currentView = view;
  document.querySelectorAll('#zs-bottom-nav button').forEach(function(b){ b.classList.remove('active'); });
  var navMap = {home:'zs-nav-home', classes:'zs-nav-classes', notices:'zs-nav-notices', messages:'zs-nav-messages', profile:'zs-nav-profile'};
  if(navMap[view]){
    var b = document.getElementById(navMap[view]);
    if(b) b.classList.add('active');
  }
  var container = document.getElementById('zs-app');
  if(!container) return;

  var html = '';
  if(view === 'home')         html = ZS.renderHome();
  else if(view === 'classes') html = ZS.renderPlaceholder('Classes', 'fa-solid fa-chalkboard-user', 'Your classes will appear here.');
  else if(view === 'notices') html = ZS.renderPlaceholder('Notices', 'fa-solid fa-bullhorn', 'School notices will appear here.');
  else if(view === 'messages')html = ZS.renderPlaceholder('Messages', 'fa-solid fa-comments', 'Parent-teacher chat will appear here.');
  else if(view === 'profile') html = ZS.renderPlaceholder('Profile', 'fa-solid fa-user', 'Your profile and settings.');
  container.innerHTML = html;
  window.scrollTo(0,0);
};

ZS.renderPlaceholder = function(title, icon, message){
  return '<div class="zs-card">' +
    '<div style="display:flex;align-items:center;gap:10px;margin-bottom:14px;">' +
      '<div style="width:40px;height:40px;border-radius:12px;background:rgba(16,185,129,.1);display:flex;align-items:center;justify-content:center;">' +
        '<i class="' + icon + '" style="color:#10b981;font-size:17px;"></i>' +
      '</div>' +
      '<div style="font-size:16px;font-weight:900;color:#fff;">' + title + '</div>' +
    '</div>' +
    '<div class="zs-empty" style="padding:20px;">' +
      '<i class="' + icon + '"></i>' +
      '<p>' + message + '</p>' +
    '</div>' +
  '</div>';
};

ZS.renderHome = function(){
  var u = ZS.State.currentUser;
  var school = ZS.State.mySchool;
  var roles = ZS.State.myRoles || [];

  if(!u){
    return '<div class="zs-card" style="text-align:center;padding:32px 20px;">' +
      '<div style="width:64px;height:64px;border-radius:50%;background:rgba(161,133,84,.15);border:1px solid rgba(161,133,84,.4);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;">' +
        '<i class="fa-solid fa-user-lock" style="font-size:26px;color:#a18554;"></i>' +
      '</div>' +
      '<div style="font-size:16px;font-weight:900;color:#fff;margin-bottom:8px;">Please login first</div>' +
      '<div style="font-size:12px;color:#cbd5e1;line-height:1.6;margin-bottom:16px;">ZYNIX School uses the same account as ZYNIX.</div>' +
      '<a href="index.html" style="display:inline-block;background:linear-gradient(135deg,#10b981,#3b82f6);color:#000;font-weight:900;padding:12px 24px;border-radius:10px;text-decoration:none;font-size:13px;">' +
        '<i class="fa-solid fa-arrow-right-to-bracket"></i> Go to ZYNIX' +
      '</a>' +
    '</div>';
  }

  var greeting = 'Welcome to ZYNIX School';
  if(school){
    greeting = 'Welcome to ' + (school.name || 'your school');
  }

  var rolesHtml = '';
  if(roles.length){
    rolesHtml = roles.map(function(r){
      var label = r.charAt(0).toUpperCase() + r.slice(1);
      var col = r === 'admin' ? '#3b82f6' : r === 'teacher' ? '#10b981' : r === 'student' ? '#8b5cf6' : r === 'parent' ? '#a18554' : '#94a3b8';
      return '<span style="display:inline-block;background:' + col + '22;color:' + col + ';border:1px solid ' + col + '66;font-size:10px;font-weight:800;padding:4px 10px;border-radius:14px;margin-right:6px;">' + label + '</span>';
    }).join('');
  } else {
    rolesHtml = '<span style="font-size:11px;color:#94a3b8;">No role assigned yet. Contact your school admin.</span>';
  }

  return '<div class="zs-card">' +
    '<div style="font-size:10px;color:#94a3b8;font-weight:900;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;">ZYNIX SCHOOL</div>' +
    '<div style="font-size:22px;font-weight:900;color:#fff;line-height:1.2;margin-bottom:12px;">' + greeting + '</div>' +
    '<div style="font-size:12px;color:#cbd5e1;line-height:1.6;margin-bottom:6px;">' +
      '<i class="fa-solid fa-user" style="color:#10b981;margin-right:6px;"></i> ' + (u.name || u.username || u.email || 'User') +
    '</div>' +
    '<div style="font-size:12px;color:#cbd5e1;line-height:1.6;margin-bottom:12px;">' +
      '<i class="fa-solid fa-id-badge" style="color:#3b82f6;margin-right:6px;"></i> ' + (u.email || '') +
    '</div>' +
    '<div style="padding-top:10px;border-top:1px solid #1e293b;">' +
      '<div style="font-size:10px;color:#94a3b8;font-weight:900;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;">Your Roles</div>' +
      '<div>' + rolesHtml + '</div>' +
    '</div>' +
  '</div>' +
  '<div class="zs-card" style="background:rgba(16,185,129,.06);border-color:rgba(16,185,129,.28);">' +
    '<div style="font-size:12px;color:#cbd5e1;line-height:1.7;">' +
      '<b style="color:#10b981;">ZYNIX School is being built.</b><br>' +
      'Yeh sirf starter file hai. Home page chal raha hai, aur baaki sections (Classes, Notices, Messages, Attendance, Notes) hum aagey add karenge.' +
    '</div>' +
  '</div>';
};

/* ---- BOOT ---- */
async function boot(){
  var c = sb();
  try {
    if(c){
      var s = await c.auth.getSession();
      var user = s && s.data && s.data.session ? s.data.session.user : null;
      if(user){
        var pr = await c.from('profiles').select('*').eq('id', user.id).maybeSingle();
        ZS.State.currentUser = pr.data || { id: user.id, name: user.email, email: user.email };

        /* Load school + roles */
        var su = await c.from('school_users').select('role, school_id, schools(name, slug)').eq('user_id', user.id).eq('is_active', true);
        if(su.data && su.data.length){
          ZS.State.mySchool = su.data[0].schools || null;
          ZS.State.myRoles = su.data.map(function(x){ return x.role; });
        }
      }
    }
  } catch(e){ console.warn('Boot error', e); }

  /* Hide welcome */
  setTimeout(function(){
    var w = document.getElementById('zs-welcome');
    if(w) w.classList.add('fadeout');
  }, 500);

  ZS.showView('home');
  console.log('[ZYNIX School] ready');
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

})();
</script>
</body>
</html>

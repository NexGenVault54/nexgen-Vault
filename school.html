.zs-search{position:relative;margin-bottom:14px}
.zs-search input{width:100%;padding:12px 40px 12px 14px;border-radius:12px;border:1px solid #1e293b;background:#0f172a;color:#fff;font-size:13px;outline:none;box-sizing:border-box}

.zs-draft-indicator{position:fixed;top:64px;left:50%;transform:translateX(-50%);background:rgba(161,133,84,.95);color:#000;font-weight:800;font-size:11px;padding:6px 14px;border-radius:20px;z-index:10001;display:none;align-items:center;gap:6px;box-shadow:0 4px 12px rgba(0,0,0,.5);pointer-events:none}
.zs-draft-indicator.show{display:inline-flex;animation:zsFadeIn .25s ease}

.zs-skel{background:linear-gradient(90deg,#111827 25%,#1a2233 50%,#111827 75%);background-size:200% 100%;animation:zsSkel 1.4s linear infinite;border-radius:10px}

.zs-skel-card{background:#111827;border:1px solid #1e293b;border-radius:16px;padding:14px;margin-bottom:12px}
.zs-skel-line{height:10px;border-radius:6px;margin-bottom:8px}
.zs-pull-indicator{position:fixed;top:56px;left:50%;transform:translate(-50%,-60px);z-index:950;background:rgba(15,23,42,.95);border:1px solid #1e293b;color:#10b981;font-size:11px;font-weight:700;padding:6px 14px;border-radius:20px;transition:transform .25s ease,opacity .25s ease;opacity:0;pointer-events:none}
.zs-pull-indicator.visible{transform:translate(-50%,4px);opacity:1}
.zs-chip{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;padding:3px 8px;border-radius:12px;letter-spacing:.02em}
.zs-chip.green{background:rgba(16,185,129,.12);color:#10b981;border:1px solid rgba(16,185,129,.3)}
.zs-chip.blue{background:rgba(59,130,246,.12);color:#60a5fa;border:1px solid rgba(59,130,246,.3)}
.zs-chip.amber{background:rgba(161,133,84,.12);color:#a18554;border:1px solid rgba(161,133,84,.3)}
.zs-chip.red{background:rgba(161,98,98,.12);color:#a16262;border:1px solid rgba(161,98,98,.3)}
.zs-chip.purple{background:rgba(139,92,246,.12);color:#a78bfa;border:1px solid rgba(139,92,246,.3)}
</style>
</head>
<body>

<header class="zs-header">
  <button id="zs-header-logo" style="display:flex;align-items:center;gap:8px;background:transparent;border:none;cursor:pointer;" onclick="ZS.goHome()">
    <div class="zs-logo">S</div>
    <span class="zs-title">ZYNIX SCHOOL</span>
  </button>
  <div style="display:flex;align-items:center;gap:8px;">
    <button class="zs-header-btn" id="zs-bell-btn" onclick="ZS.goNotifications()" title="Notifications">
      <i class="fa-solid fa-bell"></i>
      <span class="zs-badge" id="zs-notif-badge" style="display:none;">0</span>
    </button>
    <button class="zs-header-btn" onclick="ZS.goBackToPlatform()" title="Back to ZYNIX">
      <i class="fa-solid fa-arrow-right-from-bracket"></i>
    </button>
  </div>
</header>

<main id="zs-app"></main>

<nav class="zs-footer" id="zs-footer">
  <button onclick="ZS.showView('home')" data-nav="home"><i class="fa-solid fa-house"></i><span>Home</span></button>
  <button onclick="ZS.showView('people')" data-nav="people"><i class="fa-solid fa-users"></i><span>People</span></button>
  <button onclick="ZS.showView('attendance')" data-nav="attendance"><i class="fa-solid fa-clipboard-user"></i><span>Attendance</span></button>
  <button onclick="ZS.showView('notices')" data-nav="notices"><i class="fa-solid fa-bullhorn"></i><span>Notices</span></button>
  <button onclick="ZS.showView('directory')" data-nav="directory"><i class="fa-solid fa-school"></i><span>Schools</span></button>
</nav>

<div id="zs-welcome">
  <div class="zs-welcome-logo">S</div>
  <div class="zs-welcome-wordmark">ZYNIX SCHOOL</div>
  <div class="zs-welcome-tagline">Learn · Teach · Connect</div>
</div>

<div class="zs-toast-container" id="zs-toasts"></div>
<div class="zs-draft-indicator" id="zs-draft-indicator"><i class="fa-solid fa-floppy-disk"></i> Draft saved</div>
<div class="zs-pull-indicator" id="zs-pull"><i class="fa-solid fa-rotate"></i><span>Release to refresh</span></div>
<div id="zs-modal-host"></div>

<script>
(function(){
'use strict';
window.ZS = {};
var ZS = window.ZS;
ZS.SUPABASE_URL = 'https://ipypwqajsfxrdzlxfnlr.supabase.co';
ZS.SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlweXB3cWFqc2Z4cmR6bHhmbmxyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2OTEzODUsImV4cCI6MjEwNDI2NzM4NX0.QW6tzaMxlNg9EYuRq0tCOlGipBlrjBuiV6lZuSr1Jj4';
var _sb = null;
function sb(){
  if(_sb) return _sb;
  if(!window.supabase) return null;
  _sb = window.supabase.createClient(ZS.SUPABASE_URL, ZS.SUPABASE_ANON_KEY, {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  return _sb;
}
ZS.sb = sb;
ZS.State = {
  currentUser:null, currentView:'home', currentParam:null, navStack:[],
  mySchoolId:null, mySchool:null, mySchoolUserId:null, myRoles:[], activeRole:null,
  data:{classes:[], students:[], teachers:[], attendance:{}, notices:[], messages:[], lessons:[], notifications:[], dashboard:null, directory:[], studentFull:null},
  _loading:false, _scrollMemory:{}, _selectedClassId:null
};
ZS.escape = function(s){ if(s==null) return ''; return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); };
ZS.timeAgo = function(ts){ if(!ts) return ''; var s=Math.floor((Date.now()-new Date(ts).getTime())/1000); if(s<60) return 'just now'; if(s<3600) return Math.floor(s/60)+'m ago'; if(s<86400) return Math.floor(s/3600)+'h ago'; if(s<604800) return Math.floor(s/86400)+'d ago'; return new Date(ts).toLocaleDateString(); };
ZS.todayStr = function(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
ZS.fmtDate = function(d){ try { return new Date(d).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}); } catch(e){ return ''; } };
ZS.haptic = function(ms){ try { if(navigator.vibrate) navigator.vibrate(ms||8); } catch(e){} };

ZS.toast = function(msg,type){
  type = type || 'success';
  var c = document.getElementById('zs-toasts'); if(!c) return;
  var t = document.createElement('div');
  t.className = 'zs-toast ' + type;
  var icon = type==='error'?'fa-triangle-exclamation':type==='warning'?'fa-clock':type==='info'?'fa-circle-info':'fa-circle-check';
  t.innerHTML = '<i class="fa-solid '+icon+'"></i> <span>'+ZS.escape(msg)+'</span>';
  c.appendChild(t);
  requestAnimationFrame(function(){ t.classList.add('show'); });
  setTimeout(function(){ t.classList.remove('show'); setTimeout(function(){ t.remove(); },300); }, type==='error'?3500:2400);
};

ZS.Modal = (function(){
  var _open = null;
  return {
    open: function(opts){
      var host = document.getElementById('zs-modal-host'); if(!host) return;
      var h = '<div class="zs-modal-overlay">';
      h += '<div class="zs-modal">';
      h += '<div class="zs-modal-header">';
      h += '<div class="zs-modal-title"><i class="'+(opts.icon||'fa-solid fa-circle-info')+'" style="color:#10b981;"></i> '+ZS.escape(opts.title||'')+'</div>';
      h += '<button class="zs-modal-close" onclick="ZS.Modal.close()" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>';
      h += '</div>';
      h += '<div id="zs-modal-body">'+(opts.body||'')+'</div>';
      if(opts.footer !== false){
        h += '<div class="zs-modal-footer">';
        h += '<button class="zs-btn secondary" onclick="ZS.Modal.close(true)" style="flex:0 0 auto;">Cancel</button>';
        if(opts.onSubmit){
          h += '<button class="zs-btn" id="zs-modal-submit" onclick="ZS.Modal.submit()" style="flex:1;">';
          h += '<i class="'+(opts.submitIcon||'fa-solid fa-check')+'"></i> '+ZS.escape(opts.submitLabel||'Save')+'</button>';
        }
        h += '</div>';
      }
      h += '</div></div>';
      host.innerHTML = h;
      _open = opts;
      if(opts.onOpen) setTimeout(opts.onOpen, 30);
    },
    close: function(force){
      var host = document.getElementById('zs-modal-host');
      if(host) host.innerHTML = '';
      _open = null;
    },
    submit: async function(){
      var opts = _open; if(!opts || !opts.onSubmit) return;
      var btn = document.getElementById('zs-modal-submit'); if(!btn) return;
      if(btn.disabled) return;
      btn.disabled = true;
      var orig = btn.innerHTML;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Saving…';
      try {
        var result = await opts.onSubmit();
        if(result === false){ btn.disabled = false; btn.innerHTML = orig; return; }
        var host = document.getElementById('zs-modal-host');
        if(host) host.innerHTML = '';
        _open = null;
        if(opts.onSuccess) opts.onSuccess(result);
      } catch(e){
        ZS.toast((e && e.message) || 'Save failed.', 'error');
        btn.disabled = false; btn.innerHTML = orig;
      }
    }
  };
})();

function saveScroll(){ try { var k = ZS.State.currentView + '|' + (ZS.State.currentParam||''); ZS.State._scrollMemory[k] = window.scrollY||0; } catch(e){} }
function restoreScroll(view,param){ var k = view + '|' + (param||''); var y = ZS.State._scrollMemory[k]; if(typeof y === 'number' && y > 0) setTimeout(function(){ window.scrollTo(0,y); },40); else window.scrollTo(0,0); }

ZS.showView = async function(view,param,force){
  var prevView = ZS.State.currentView;
  var prevParam = ZS.State.currentParam;
  if(!force && view === prevView && param === prevParam) return;
  if(prevView){
    saveScroll();
    if(prevView !== view){ ZS.State.navStack.push({view:prevView,param:prevParam}); if(ZS.State.navStack.length>30) ZS.State.navStack.shift(); }
  }
  ZS.State.currentView = view;
  ZS.State.currentParam = param || null;
  try { localStorage.setItem('zs_last_view', view); } catch(e){}
  document.querySelectorAll('#zs-footer button').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-nav')===view); });
  var container = document.getElementById('zs-app'); if(!container) return;
  container.innerHTML = '<div class="zs-skel-card"><div class="zs-skel-line zs-skel" style="width:40%"></div><div class="zs-skel-line zs-skel" style="width:80%"></div><div class="zs-skel-line zs-skel" style="width:60%"></div></div>';
  try {
    var html = await ZS.renderView(view,param);
    container.innerHTML = html || '<div class="zs-empty"><i class="fa-solid fa-inbox"></i><p>Nothing to show.</p></div>';
    restoreScroll(view,param);
    ZS.updateBadge();
  } catch(e){
    console.error(e);
    container.innerHTML = '<div class="zs-empty"><i class="fa-solid fa-triangle-exclamation"></i><p>Something went wrong.</p><button class="zs-btn" style="max-width:200px;margin:0 auto;" onclick="ZS.showView(\''+view+'\',null,true)">Try again</button></div>';
  }
};

ZS.goBack = function(){
  var stack = ZS.State.navStack || [];
  var current = ZS.State.currentView;
  var target = null;
  while(stack.length){ var top = stack.pop(); if(top.view !== current){ target = top; break; } }
  if(!target) target = {view:'home',param:null};
  ZS.showView(target.view,target.param);
};
ZS.goHome = function(){ ZS.showView('home'); };
ZS.goNotifications = function(){ ZS.showView('notifications'); };
ZS.goBackToPlatform = function(){
  var roles = ZS.State.myRoles || [];
  var needsConfirm = roles.indexOf('teacher')!==-1 || roles.indexOf('student')!==-1;
  if(!needsConfirm){ window.location.href = 'index.html'; return; }
  if(confirm('You are leaving School mode.\nLeave to ZYNIX?')) window.location.href = 'index.html';
};
ZS.updateBadge = function(){
  var n = (ZS.State.data.notifications||[]).filter(function(x){ return !x.read; }).length;
  var b = document.getElementById('zs-notif-badge');
  if(b){ if(n>0){ b.textContent = n>9?'9+':n; b.style.display='flex'; } else b.style.display='none'; }
};

/* ---------------- DATA ---------------- */
ZS.loadDirectory = async function(){
  var c = sb(); if(!c) return;
  try { var r = await c.rpc('school_directory',{p_search:null,p_limit:100}); ZS.State.data.directory = r.data || []; }
  catch(e){ ZS.State.data.directory = []; }
};

ZS.loadSchool = async function(){
  var c = sb(); if(!c) return; var u = ZS.State.currentUser; if(!u) return;
  try {
    var su = await c.from('school_users').select('id,role,is_active,school_id,schools(id,name,slug,logo_url,subscription_tier)').eq('user_id',u.id).eq('is_active',true);
    if(su.data && su.data.length){
      ZS.State.mySchoolId = su.data[0].school_id;
      ZS.State.mySchool = su.data[0].schools || null;
      ZS.State.mySchoolUserId = su.data[0].id;
      ZS.State.myRoles = su.data.map(function(x){ return x.role; });
      var order = ['admin','teacher','student','parent','staff'];
      for(var i=0;i<order.length;i++){ if(ZS.State.myRoles.indexOf(order[i])!==-1){ ZS.State.activeRole = order[i]; break; } }
    } else {
      ZS.State.mySchoolId = null; ZS.State.mySchool = null; ZS.State.mySchoolUserId = null; ZS.State.myRoles = []; ZS.State.activeRole = null;
    }
  } catch(e){ console.warn(e); }
};

ZS.loadDashboard = async function(){
  var c = sb(); if(!c || !ZS.State.mySchoolId) return;
  var r = ZS.State.activeRole;
  try {
    var fn = r==='admin'?'school_admin_dashboard':r==='teacher'?'school_teacher_dashboard':r==='student'?'school_student_dashboard':r==='parent'?'school_parent_dashboard':null;
    if(!fn) return;
    var arg = r==='admin' ? ZS.State.mySchoolId : ZS.State.mySchoolUserId;
    var res = await c.rpc(fn, r==='admin'?{p_school_id:arg}:(r==='teacher'?{p_school_user_id:arg}:(r==='student'?{p_student_school_user_id:arg}:{p_parent_school_user_id:arg})));
    if(!res.error) ZS.State.data.dashboard = res.data || null;
  } catch(e){}
};

ZS.loadClasses = async function(){
  var c = sb(); if(!c || !ZS.State.mySchoolId) return;
  try { var r = await c.from('school_classes').select('*').order('sort_order',{ascending:true}).order('name',{ascending:true}); ZS.State.data.classes = r.data || []; }
  catch(e){ ZS.State.data.classes = []; }
};

ZS.loadStudents = async function(){
  var c = sb(); if(!c || !ZS.State.mySchoolId) return;
  try {
    var r = await c.from('school_students').select('id,class_id,roll_number,admission_number,is_active,full_name,gender,date_of_birth,photo_url,address,phone,school_user_id,blood_group').eq('is_active',true);
    ZS.State.data.students = r.data || [];
  } catch(e){ ZS.State.data.students = []; }
};

ZS.loadAttendance = async function(dateStr){
  var c = sb(); if(!c || !ZS.State.mySchoolId) return;
  dateStr = dateStr || ZS.todayStr();
  try {
    var r = await c.from('school_attendance').select('*').eq('attendance_date',dateStr);
    var map = {};
    (r.data||[]).forEach(function(a){ map[a.student_id] = a; });
    ZS.State.data.attendance[dateStr] = map;
  } catch(e){ ZS.State.data.attendance[dateStr] = {}; }
};

ZS.loadNotices = async function(){
  var c = sb(); if(!c || !ZS.State.mySchoolId) return;
  try { var r = await c.from('school_notices').select('*').order('created_at',{ascending:false}).limit(50); ZS.State.data.notices = r.data || []; }
  catch(e){ ZS.State.data.notices = []; }
};

ZS.loadNotifications = async function(){
  var c = sb(); if(!c) return; var u = ZS.State.currentUser; if(!u) return;
  try { var r = await c.from('notifications').select('*').eq('user_id',u.id).order('created_at',{ascending:false}).limit(50); ZS.State.data.notifications = r.data || []; }
  catch(e){ ZS.State.data.notifications = []; }
};

ZS.loadStudentFull = async function(studentId){

/* ---------------- VIEWS ---------------- */
ZS.renderView = async function(view,param){
  switch(view){
    case 'home':        return await ZS.viewHome();
    case 'directory':   return await ZS.viewDirectory();
    case 'school':      return await ZS.viewSchoolLanding(param);
    case 'people':      return await ZS.viewPeople();
    case 'student':     return await ZS.viewStudentProfile(param);
    case 'attendance':  return await ZS.viewAttendance();
    case 'notices':     return await ZS.viewNotices();
    case 'notifications': return await ZS.viewNotifications();
    case 'create-school': return await ZS.viewCreateSchool();
    case 'admit':       return await ZS.viewAdmitStudent();
    default:            return await ZS.viewHome();
  }
};

/* ---------- DIRECTORY ---------- */
ZS.viewDirectory = async function(){
  await ZS.loadDirectory();

  var h = '';
  h += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">';
  h += '<button class="zs-header-btn" onclick="ZS.goBack()" title="Back"><i class="fa-solid fa-arrow-left"></i></button>';
  h += '<div style="flex:1;"><div style="font-size:18px;font-weight:900;color:#fff;">Schools</div>';

ZS.filterDirectory = function(q){
  var schools = ZS.State.data.directory || [];
  q = (q||'').toLowerCase();
  var filtered = q ? schools.filter(function(s){ return (s.name||'').toLowerCase().indexOf(q)!==-1 || (s.city||'').toLowerCase().indexOf(q)!==-1; }) : schools;
  document.getElementById('zs-dir-list').innerHTML = ZS.renderDirectoryList(filtered);
};

ZS.renderDirectoryList = function(schools){
  if(!schools.length){
    return '<div class="zs-empty"><i class="fa-solid fa-school"></i><p>No schools yet. Be the first!</p><button class="zs-btn" style="max-width:240px;margin:14px auto 0;" onclick="ZS.showView(\'create-school\')"><i class="fa-solid fa-plus"></i> Create your school</button></div>';
  }
  var h = '';
  schools.forEach(function(s){
    var bannerClass = 'zs-banner gradient-emerald';
    h += '<div class="zs-banner '+bannerClass+'" onclick="ZS.showView(\'school\',\''+ZS.escape(s.id)+'\')" style="cursor:pointer;">';
    h += '<div class="zs-banner-meta">'+(s.visit_count||0)+' visits</div>';
    h += '<div class="zs-banner-title">'+ZS.escape(s.name)+'</div>';
    if(s.tagline) h += '<div class="zs-banner-subtitle">'+ZS.escape(s.tagline)+'</div>';
    if(s.city) h += '<div class="zs-banner-desc"><i class="fa-solid fa-location-dot"></i> '+ZS.escape(s.city)+(s.country?', '+ZS.escape(s.country):'')+'</div>';
    h += '</div>';
  });
  return h;
};

/* ---------- SCHOOL LANDING ---------- */
ZS.viewSchoolLanding = async function(schoolId){
  if(!schoolId) return '<div class="zs-empty"><p>School not found.</p></div>';

  var r = await c.rpc('school_get_public',{p_school_id:schoolId});

  if(!school){ return '<div class="zs-empty"><i class="fa-solid fa-school"></i><p>School not found.</p></div>'; }
  try { await c.rpc('school_visit',{p_school_id:schoolId}); } catch(e){}
  var h = '';
  h += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">';
  h += '<button class="zs-header-btn" onclick="ZS.goBack()" title="Back"><i class="fa-solid fa-arrow-left"></i></button>';
  h += '<div style="flex:1;"><div style="font-size:18px;font-weight:900;color:#fff;">'+ZS.escape(school.name)+'</div></div></div>';
  h += '<div class="zs-banner gradient-emerald" style="padding:32px 24px;">';
  h += '<div class="zs-banner-title" style="font-size:28px;">'+ZS.escape(school.name)+'</div>';
  if(school.tagline) h += '<div class="zs-banner-subtitle">'+ZS.escape(school.tagline)+'</div>';
  h += '</div>';
  if(school.description){ h += '<div class="zs-card"><div style="font-size:12px;color:#cbd5e1;line-height:1.7;white-space:pre-wrap;">'+ZS.escape(school.description)+'</div></div>'; }
  h += '<div class="zs-card">';
  if(school.city) h += '<div style="font-size:12px;color:#cbd5e1;margin-bottom:6px;"><i class="fa-solid fa-location-dot" style="color:#10b981;width:16px;"></i> '+ZS.escape(school.city)+(school.country?', '+ZS.escape(school.country):'')+'</div>';
  if(school.founded_year) h += '<div style="font-size:12px;color:#cbd5e1;margin-bottom:6px;"><i class="fa-solid fa-calendar" style="color:#3b82f6;width:16px;"></i> Founded '+ZS.escape(String(school.founded_year))+'</div>';
  if(school.website) h += '<div style="font-size:12px;color:#cbd5e1;margin-bottom:6px;"><i class="fa-solid fa-globe" style="color:#8b5cf6;width:16px;"></i> '+ZS.escape(school.website)+'</div>';
  h += '<div style="font-size:12px;color:#cbd5e1;"><i class="fa-solid fa-eye" style="color:#a18554;width:16px;"></i> '+ (school.visit_count||0) +' visits</div>';
  h += '</div>';
  var roles = ZS.State.myRoles || [];
  var isMember = ZS.State.mySchoolId === schoolId;
  if(isMember){
    h += '<button class="zs-btn" onclick="ZS.goHome()"><i class="fa-solid fa-arrow-right-to-bracket"></i> Enter School Dashboard</button>';
  } else {
    h += '<div class="zs-card" style="text-align:center;">';
    h += '<div style="font-size:12px;color:#94a3b8;margin-bottom:12px;">Already a member? Log in to your ZYNIX account and ask your admin to add you.</div>';
    h += '<button class="zs-btn" onclick="ZS.goBackToPlatform()"><i class="fa-solid fa-arrow-right-to-bracket"></i> Log in to ZYNIX</button>';
    h += '</div>';
  }
  return h;
};

ZS.submitCreateSchool = async function(){
  var name = (document.getElementById('cs-name')||{}).value.trim();
  if(!name){ ZS.toast('School name required.', 'error'); return; }
  var tagline = (document.getElementById('cs-tagline')||{}).value.trim();
  var desc = (document.getElementById('cs-desc')||{}).value.trim();
  var city = (document.getElementById('cs-city')||{}).value.trim();
  var country = (document.getElementById('cs-country')||{}).value.trim();
  var c = sb(); if(!c) return;
  var btn = document.querySelector('.zs-card .zs-btn');
  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Creating...'; }
  try {
    var r = await c.rpc('school_create_self',{p_name:name,p_slug:null,p_tagline:tagline||null,p_description:desc||null,p_city:city||null,p_country:country||null,p_logo_url:null});
    if(r.error) throw r.error;
    ZS.toast('School created! You are now super admin.');
    await ZS.loadSchool();
    ZS.showView('home');
  } catch(e){
    ZS.toast('Failed: ' + (e.message||'unknown'), 'error');
    if(btn){ btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-school-circle-check"></i> Create school'; }
  }
};

ZS.viewHome = async function(){
  var u = ZS.State.currentUser;
  if(!u){ return '<div class="zs-empty"><i class="fa-solid fa-user-lock"></i><p>Please log in to ZYNIX.</p><button class="zs-btn" style="max-width:240px;margin:0 auto;" onclick="ZS.goBackToPlatform()">Go to ZYNIX</button></div>'; }
  if(!ZS.State.mySchoolId){

  }
  await ZS.loadDashboard();
  var d = ZS.State.data.dashboard || {};
  var school = ZS.State.mySchool || {};
  var role = ZS.State.activeRole;
  var roles = ZS.State.myRoles || [];
  var h = '';
  h += '<div class="zs-card highlight">';
  h += '<div style="font-size:10px;color:#94a3b8;font-weight:900;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;">'+ZS.escape(school.name||'Welcome')+'</div>';

  h += '</div>';
  if(role==='admin') h += ZS.homeAdmin(d);
  else if(role==='teacher') h += ZS.homeTeacher(d);
  else if(role==='student') h += ZS.homeStudent(d);
  else if(role==='parent') h += ZS.homeParent(d);

ZS.filterStudents = function(q){
  var students = ZS.State.data.students || [];
  q = (q||'').toLowerCase();
  var filtered = q ? students.filter(function(s){ return (s.full_name||'').toLowerCase().indexOf(q)!==-1 || (s.roll_number||'').toLowerCase().indexOf(q)!==-1; }) : students;
  document.getElementById('zs-people-list').innerHTML = ZS.renderPeopleList(filtered);
};

ZS.renderPeopleList = function(students){
  if(!students.length){ return '<div class="zs-empty"><i class="fa-solid fa-users"></i><p>No students yet.</p></div>'; }
  var h = '';
  students.forEach(function(s){
    var initials = (s.full_name||'S').charAt(0).toUpperCase();
    h += '<div class="zs-student-row" onclick="ZS.showView(\'student\',\''+ZS.escape(s.id)+'\')">';
    h += '<div style="display:flex;align-items:center;gap:10px;min-width:0;flex:1;">';
    h += '<div style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#10b981,#3b82f6);display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;font-size:15px;flex-shrink:0;">'+initials+'</div>';
    h += '<div style="min-width:0;"><div style="font-size:13px;font-weight:800;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">'+ZS.escape(s.full_name||'Student')+'</div>';
    h += '<div style="font-size:10px;color:#94a3b8;">Roll '+ZS.escape(s.roll_number||'-')+' · '+ZS.escape(s.admission_number||'')+'</div></div></div>';

};

ZS.viewStudentProfile = async function(studentId){
  if(!studentId){ return '<div class="zs-empty"><p>Student not found.</p></div>'; }
  var full = await ZS.loadStudentFull(studentId);
  if(!full){ return '<div class="zs-empty"><i class="fa-solid fa-triangle-exclamation"></i><p>Could not load student.</p></div>'; }
  var s = full.student || {};
  var parents = full.parents || [];
  var h = '';
  h += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">';
  h += '<button class="zs-header-btn" onclick="ZS.goBack()" title="Back"><i class="fa-solid fa-arrow-left"></i></button>';
  h += '<div style="flex:1;"><div style="font-size:16px;font-weight:900;color:#fff;">'+ZS.escape(s.full_name||'Student')+'</div>';
  h += '<div style="font-size:11px;color:#94a3b8;">Roll '+ZS.escape(s.roll_number||'-')+' · '+ZS.escape(s.admission_number||'')+'</div></div></div>';
  // Personal
  h += '<div class="zs-card"><div class="zs-section-title" style="margin-top:0;">Personal</div>';
  if(s.date_of_birth) h += '<div style="font-size:12px;color:#cbd5e1;margin-bottom:6px;">DOB: '+ZS.fmtDate(s.date_of_birth)+'</div>';
  if(s.gender) h += '<div style="font-size:12px;color:#cbd5e1;margin-bottom:6px;">Gender: '+ZS.escape(s.gender)+'</div>';
  if(s.bform_number) h += '<div style="font-size:12px;color:#cbd5e1;margin-bottom:6px;">B-Form: '+ZS.escape(s.bform_number)+'</div>';
  if(s.address) h += '<div style="font-size:12px;color:#cbd5e1;margin-bottom:6px;">Address: '+ZS.escape(s.address)+'</div>';
  if(s.phone) h += '<div style="font-size:12px;color:#cbd5e1;margin-bottom:6px;">Phone: '+ZS.escape(s.phone)+'</div>';
  h += '</div>';
  // Parents
  if(parents.length){
    h += '<div class="zs-card"><div class="zs-section-title" style="margin-top:0;">Guardians</div>';
    parents.forEach(function(p){
      h += '<div style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);">';
      h += '<div style="font-size:12px;font-weight:800;color:#fff;">'+ZS.escape(p.full_name||p.relationship||'Guardian')+'</div>';
      h += '<div style="font-size:11px;color:#94a3b8;">'+ZS.escape(p.relationship||'')+' '+(p.mobile?'· '+ZS.escape(p.mobile):'')+'</div>';
      h += '</div>';
    });
    h += '</div>';
  }
  // Points
  h += '<div class="zs-card"><div class="zs-section-title" style="margin-top:0;">Points</div>';
  h += '<div style="font-size:28px;font-weight:900;color:#10b981;">'+(full.total_points||0)+'</div>';
  h += '</div>';
  // Attendance
  var att = full.attendance_summary || [];
  if(att.length){
    h += '<div class="zs-card"><div class="zs-section-title" style="margin-top:0;">Attendance</div>';
    att.slice(0,3).forEach(function(a){
      var pct = Number(a.attendance_percent)||0;
      var col = pct>=85?'#10b981':pct>=70?'#a18554':'#a16262';
      h += '<div style="display:flex;justify-content:space-between;margin-bottom:6px;">';
      h += '<div style="font-size:12px;color:#cbd5e1;">'+ZS.escape(a.month_key)+'</div>';
      h += '<div style="font-size:12px;font-weight:900;color:'+col+';">'+pct.toFixed(1)+'%</div>';
      h += '</div>';
    });
    h += '</div>';
  }
  // Recent activity
  var reports = full.reports || [];
  if(reports.length){
    h += '<div class="zs-card"><div class="zs-section-title" style="margin-top:0;">Recent reports</div>';
    reports.slice(0,5).forEach(function(r){
      var col = r.severity==='positive'?'green':r.severity==='serious'?'red':r.severity==='warning'?'amber':'blue';
      h += '<div style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);">';
      h += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">';
      h += '<div style="font-size:12px;font-weight:700;color:#fff;">'+ZS.escape(r.title)+'</div>';
      h += '<span class="zs-chip '+col+'">'+ZS.escape(r.report_type)+'</span></div>';
      h += '<div style="font-size:10px;color:#64748b;margin-top:3px;">'+ZS.timeAgo(r.created_at)+'</div>';
      h += '</div>';
    });
    h += '</div>';
  }
  return h;
};

ZS.submitAdmit = async function(){
  var name = (document.getElementById('ad-name')||{}).value.trim();
  var dob = (document.getElementById('ad-dob')||{}).value;
  var gender = (document.getElementById('ad-gender')||{}).value;
  var classId = (document.getElementById('ad-class')||{}).value;
  if(!name || !dob || !classId){ ZS.toast('Name, DOB and class required.', 'error'); return; }
  var c = sb(); if(!c) return;
  var btn = document.querySelector('.zs-card .zs-btn');
  if(btn){ btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Admitting...'; }
  try {
    var r = await c.rpc('school_admit_student',{
      p_school_id: ZS.State.mySchoolId,
      p_class_id: classId,
      p_full_name: name,
      p_dob: dob,
      p_gender: gender,
      p_roll_number: (document.getElementById('ad-roll')||{}).value.trim() || null,
      p_bform: (document.getElementById('ad-bform')||{}).value.trim() || null,
      p_address: (document.getElementById('ad-address')||{}).value.trim() || null,
      p_father_name: (document.getElementById('ad-fname')||{}).value.trim() || null,
      p_father_cnic: (document.getElementById('ad-fcnic')||{}).value.trim() || null,
      p_father_mobile: (document.getElementById('ad-fmobile')||{}).value.trim() || null,
      p_mother_name: (document.getElementById('ad-mname')||{}).value.trim() || null,
      p_mother_cnic: (document.getElementById('ad-mcnic')||{}).value.trim() || null,
      p_mother_mobile: (document.getElementById('ad-mmobil')||{}).value.trim() || null,
      p_emergency_name: null, p_emergency_relation: null, p_emergency_phone: null
    });
    if(r.error) throw r.error;
    ZS.toast('Student admitted! Admission #: ' + (r.data && r.data.admission_number || ''));
    ZS.showView('people', null, true);
  } catch(e){
    ZS.toast('Failed: ' + (e.message||'unknown'), 'error');
    if(btn){ btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Admit student'; }
  }
};

ZS.viewAttendanceMark = async function(){
  await ZS.loadClasses();
  await ZS.loadStudents();
  var today = ZS.todayStr();
  await ZS.loadAttendance(today);
  var classes = ZS.State.data.classes || [];
  if(!classes.length){ return '<div class="zs-empty"><i class="fa-solid fa-chalkboard"></i><p>No classes set up yet.</p></div>'; }
  var selectedClass = ZS.State._selectedClassId || classes[0].id;
  ZS.State._selectedClassId = selectedClass;
  var students = (ZS.State.data.students||[]).filter(function(s){ return s.class_id === selectedClass; });
  var attMap = ZS.State.data.attendance[today] || {};
  var h = '';
  h += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">';
  h += '<button class="zs-header-btn" onclick="ZS.goBack()" title="Back"><i class="fa-solid fa-arrow-left"></i></button>';
  h += '<div style="flex:1;"><div style="font-size:16px;font-weight:900;color:#fff;">Attendance</div>';
  h += '<div style="font-size:11px;color:#94a3b8;">'+ZS.fmtDate(today)+'</div></div></div>';
  h += '<div class="zs-role-switcher">';
  classes.forEach(function(c){
    h += '<button class="'+(c.id===selectedClass?'active':'')+'" onclick="ZS.State._selectedClassId=\''+ZS.escape(c.id)+'\';ZS.showView(\'attendance\',null,true);">'+ZS.escape(c.name+(c.section?(' - '+c.section):''))+'</button>';
  });
  h += '</div>';
  if(!students.length){ return h + '<div class="zs-empty"><i class="fa-solid fa-user-slash"></i><p>No students in this class.</p></div>'; }
  h += '<div style="display:flex;gap:8px;margin-bottom:12px;">';
  h += '<button class="zs-btn secondary small" style="flex:1;" onclick="ZS.markAll(\'present\')"><i class="fa-solid fa-check"></i> All present</button>';
  h += '<button class="zs-btn secondary small" style="flex:1;" onclick="ZS.markAll(\'absent\')"><i class="fa-solid fa-xmark"></i> All absent</button>';
  h += '</div>';
  students.forEach(function(s){
    var cur = attMap[s.id] ? attMap[s.id].status : null;
    h += '<div class="zs-student-row">';
    h += '<div style="min-width:0;flex:1;"><div style="font-size:13px;font-weight:700;color:#fff;">'+ZS.escape(s.full_name||'Student')+'</div>';
    h += '<div style="font-size:10px;color:#64748b;">Roll '+ZS.escape(s.roll_number||'-')+'</div></div>';
    h += '<div style="display:flex;gap:4px;">';
    ['present','absent','late','leave'].forEach(function(st){
      var short = st==='present'?'P':st==='absent'?'A':st==='late'?'L':'Lv';
      var act = cur===st?' active':'';
      var bg = cur===st?(st==='present'?'rgba(16,185,129,.2)':st==='absent'?'rgba(161,98,98,.2)':st==='late'?'rgba(161,133,84,.2)':'rgba(59,130,246,.2)'):'transparent';
      var col = cur===st?(st==='present'?'#10b981':st==='absent'?'#a16262':st==='late'?'#a18554':'#60a5fa'):'#94a3b8';
      h += '<button onclick="ZS.setAttendance(\''+ZS.escape(s.id)+'\',\''+st+'\')" style="padding:6px 10px;border-radius:8px;border:1px solid '+(cur===st?col:'#1e293b')+';background:'+bg+';color:'+col+';font-size:11px;font-weight:800;cursor:pointer;min-width:36px;">'+short+'</button>';
    });
    h += '</div></div>';
  });
  return h;
};

ZS.setAttendance = async function(studentId,status){
  ZS.haptic(8);
  var today = ZS.todayStr();
  var s = (ZS.State.data.students||[]).find(function(x){ return x.id === studentId; });
  if(!s) return;
  var existing = (ZS.State.data.attendance[today]||{})[studentId];
  if(!ZS.State.data.attendance[today]) ZS.State.data.attendance[today] = {};
  ZS.State.data.attendance[today][studentId] = { student_id:studentId, status:status, attendance_date:today };
  var c = sb(); if(!c) return;
  try {
    if(existing){
      await c.from('school_attendance').update({status:status}).eq('student_id',studentId).eq('attendance_date',today);
    } else {
      var ins = await c.from('school_attendance').insert({student_id:studentId,class_id:s.class_id,attendance_date:today,status:status,marked_by:ZS.State.mySchoolUserId});
      if(ins.error && ins.error.code !== '23505'){ ZS.toast('Save failed.','error'); return; }
    }
    ZS.toast((s.full_name||'Student')+' — '+status, status==='present'?'success':status==='absent'?'error':'warning');
    ZS.showView('attendance',null,true);
  } catch(e){ ZS.toast('Failed.','error'); }
};

ZS.markAll = async function(status){
  var cls = ZS.State._selectedClassId;
  var students = (ZS.State.data.students||[]).filter(function(s){ return s.class_id === cls; });
  if(!students.length) return;
  if(!confirm('Mark all '+students.length+' students as '+status+'?')) return;
  var today = ZS.todayStr();
  var c = sb(); if(!c) return;
  var rows = students.map(function(s){ return { student_id:s.id, class_id:cls, attendance_date:today, status:status, marked_by:ZS.State.mySchoolUserId }; });
  try { await c.from('school_attendance').upsert(rows,{onConflict:'student_id,attendance_date'}); ZS.toast('Marked all as '+status+'.'); ZS.showView('attendance',null,true); }
  catch(e){ ZS.toast('Bulk save failed.','error'); }
};

ZS.openCreateNotice = function(){
  var body = '';
  body += '<div class="zs-field"><label class="zs-label">Title</label><input id="nn-title" class="zs-input" placeholder="Notice title"></div>';
  body += '<div class="zs-field"><label class="zs-label">Message</label><textarea id="nn-body" class="zs-textarea" placeholder="Write notice..." style="min-height:140px;"></textarea></div>';
  body += '<div class="zs-field"><label class="zs-label">Audience</label><select id="nn-aud" class="zs-select"><option value="all">Everyone</option><option value="parents">Parents</option><option value="teachers">Teachers</option><option value="students">Students</option></select></div>';
  body += '<div class="zs-field"><label class="zs-label">Urgency</label><select id="nn-urg" class="zs-select"><option value="info">Info (blue)</option><option value="positive">Positive (green)</option><option value="warning">Warning (amber)</option><option value="serious">Serious (red)</option></select></div>';
  ZS.Modal.open({
    title:'Publish notice', icon:'fa-solid fa-bullhorn', body: body,
    submitLabel:'Publish', submitIcon:'fa-solid fa-paper-plane',
    onSubmit: async function(){
      var title = (document.getElementById('nn-title')||{}).value.trim();
      var body_ = (document.getElementById('nn-body')||{}).value.trim();
      if(!title || !body_){ ZS.toast('Title and message required.','error'); return false; }
      var c = sb(); if(!c) return false;
      var ins = await c.from('school_notices').insert({school_id:ZS.State.mySchoolId,author_id:ZS.State.mySchoolUserId,title:title,body:body_,audience:(document.getElementById('nn-aud')||{}).value||'all',urgency:(document.getElementById('nn-urg')||{}).value||'info',auto_notified:true});
      if(ins.error){ ZS.toast('Failed: '+ins.error.message,'error'); return false; }
      ZS.toast('Notice published.');
      ZS.showView('notices',null,true);
      return true;
    }
  });
};

ZS.deleteNotice = async function(id){
  if(!confirm('Delete this notice?')) return;
  var c = sb(); if(!c) return;
  await c.from('school_notices').delete().eq('id',id);
  ZS.toast('Deleted.'); ZS.showView('notices',null,true);
};

/* ---------- NOTIFICATIONS ---------- */
ZS.viewNotifications = async function(){
  await ZS.loadNotifications();
  var notifs = ZS.State.data.notifications || [];
  var h = '';
  h += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">';
  h += '<button class="zs-header-btn" onclick="ZS.goBack()" title="Back"><i class="fa-solid fa-arrow-left"></i></button>';
  h += '<div style="flex:1;"><div style="font-size:16px;font-weight:900;color:#fff;">Notifications</div>';
  h += '<div style="font-size:11px;color:#94a3b8;">'+notifs.length+' total</div></div></div>';
  if(!notifs.length){ return h + '<div class="zs-empty"><i class="fa-solid fa-bell"></i><p>All caught up.</p></div>'; }
  notifs.forEach(function(n){
    var kind = n.kind||'';
    var urg = kind.indexOf('absent')!==-1||kind.indexOf('serious')!==-1?'serious':kind.indexOf('late')!==-1||kind.indexOf('warning')!==-1?'warning':kind.indexOf('birthday')!==-1||kind.indexOf('positive')!==-1?'positive':'info';
    var col = urg==='positive'?'green':urg==='serious'?'red':urg==='warning'?'amber':'blue';
    h += '<div class="zs-card">';
    h += '<div style="font-size:13px;font-weight:700;color:#fff;">'+ZS.escape(n.message||'')+'</div>';
    h += '<div style="display:flex;gap:8px;align-items:center;margin-top:6px;">';
    h += '<span class="zs-chip '+col+'">'+ZS.escape(kind||'info')+'</span>';
    h += '<span style="font-size:10px;color:#64748b;">'+ZS.timeAgo(n.created_at)+'</span>';
    if(!n.read) h += '<span class="zs-chip red">NEW</span>';
    h += '</div></div>';
  });
  return h;
};

/* ---------- PULL TO REFRESH ---------- */
(function(){
  var startY = 0, active = false, threshold = 80;
  document.addEventListener('touchstart', function(e){ if(window.scrollY>5) return; startY = e.touches[0].clientY; active = true; }, {passive:true});
  document.addEventListener('touchmove', function(e){ if(!active) return; var dy = e.touches[0].clientY - startY; var ind = document.getElementById('zs-pull'); if(ind && dy>40) ind.classList.add('visible'); }, {passive:true});
  document.addEventListener('touchend', function(e){
    if(!active) return; active = false;
    var dy = e.changedTouches[0].clientY - startY;
    var ind = document.getElementById('zs-pull');
    if(dy>threshold){ if(ind) ind.querySelector('span').textContent = 'Refreshing...'; ZS.showView(ZS.State.currentView,ZS.State.currentParam,true); setTimeout(function(){ if(ind){ ind.classList.remove('visible'); ind.querySelector('span').textContent = 'Release to refresh'; } },600); }
    else { if(ind) ind.classList.remove('visible'); }
  }, {passive:true});
})();

/* ---------- BOOT ---------- */
async function boot(){
  var c = sb();
  if(!c){ setTimeout(boot,300); return; }
  try {
    var s = await c.auth.getSession();
    var user = s && s.data && s.data.session ? s.data.session.user : null;
    if(user){
      var pr = await c.from('profiles').select('*').eq('id',user.id).maybeSingle();
      ZS.State.currentUser = pr.data || {id:user.id,name:user.email,email:user.email};
      await ZS.loadSchool();
      await ZS.loadNotifications();
    }
  } catch(e){ console.warn(e); }
  setTimeout(function(){ var w = document.getElementById('zs-welcome'); if(w) w.classList.add('fadeout'); },400);
  var lastView = 'home';
  try { lastView = localStorage.getItem('zs_last_view')||'home'; } catch(e){}
  ZS.showView(lastView);
  try {
    c.auth.onAuthStateChange(async function(evt){
      if(evt==='SIGNED_IN'||evt==='SIGNED_OUT'){
        var s2 = await c.auth.getSession();
        var u2 = s2 && s2.data && s2.data.session ? s2.data.session.user : null;
        if(u2){ var pr2 = await c.from('profiles').select('*').eq('id',u2.id).maybeSingle(); ZS.State.currentUser = pr2.data || {id:u2.id,email:u2.email}; await ZS.loadSchool(); await ZS.loadNotifications(); }
        else { ZS.State.currentUser = null; ZS.State.mySchoolId = null; ZS.State.myRoles = []; ZS.State.activeRole = null; }
        ZS.showView(ZS.State.currentView,ZS.State.currentParam,true);
      }
    });
  } catch(e){}
  console.log('[ZYNIX School v2] ready');
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded',boot);
else boot();
})();
</script>

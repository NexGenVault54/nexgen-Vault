</style>

<script>
/* ============================================================
   ZYNIX SCHOOL — CORE
   ============================================================ */
(function(){
'use strict';

window.ZS = {};
var ZS = window.ZS;

ZS.SUPABASE_URL = 'https://ipypwqajsfxrdzlxfnlr.supabase.co';
ZS.SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlweXB3cWFqc2Z4cmR6bHhmbmxyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2OTEzODUsImV4cCI6MjEwNDI2NzM4NX0.QW6tzaMxlNg9EYuRq0tCOlGipBlrjBuiV6lZuSr1Jj4';

var _sb = null;
function sb(){
  if(_sb) return _sb;
  if(!window.supabase) return null;
  _sb = window.supabase.createClient(ZS.SUPABASE_URL, ZS.SUPABASE_ANON_KEY, {
    auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
  });
  return _sb;
}
ZS.sb = sb;

/* ---------------- STATE ---------------- */
ZS.State = {
  currentUser: null,
  currentView: 'home',
  currentParam: null,
  navStack: [],
  mySchoolId: null,
  mySchool: null,
  mySchoolUserId: null,
  myRoles: [],
  activeRole: null,
  data: {
    classes: [],
    subjects: [],
    students: [],
    teachers: [],
    attendance: {},
    notices: [],
    messages: [],
    lessons: [],
    notifications: [],
    dashboard: null
  },
  _loading: false,
  _scrollMemory: {},
  _lastRenderHash: {}
};

/* ---------------- UTILS ---------------- */
ZS.escape = function(s){
  if(s == null) return '';
  return String(s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
};
ZS.uid = function(){
  if(window.crypto && window.crypto.randomUUID) return window.crypto.randomUUID();
  return 'xxxx-xxxx-4xxx-yxxx'.replace(/[xy]/g,function(c){
    var r=Math.random()*16|0;return (c==='x'?r:(r&0x3|0x8)).toString(16);
  });
};
ZS.timeAgo = function(ts){
  if(!ts) return '';
  var s = Math.floor((Date.now()-new Date(ts).getTime())/1000);
  if(s < 60) return 'just now';
  if(s < 3600) return Math.floor(s/60)+'m ago';
  if(s < 86400) return Math.floor(s/3600)+'h ago';
  if(s < 604800) return Math.floor(s/86400)+'d ago';
  return new Date(ts).toLocaleDateString();
};
ZS.todayStr = function(){
  var d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
};
ZS.fmtDate = function(d){
  try { return new Date(d).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}); }
  catch(e){ return ''; }
};
ZS.haptic = function(ms){
  try { if(navigator.vibrate) navigator.vibrate(ms||8); } catch(e){}
};

/* ---------------- TOAST ---------------- */
ZS.toast = function(msg, type){
  type = type || 'success';
  var c = document.getElementById('zs-toasts');
  if(!c) return;
  var t = document.createElement('div');
  t.className = 'zs-toast ' + type;
  var icon = type === 'error' ? 'fa-triangle-exclamation'
           : type === 'warning' ? 'fa-clock'
           : type === 'info' ? 'fa-circle-info'
           : 'fa-circle-check';
  t.innerHTML = '<i class="fa-solid ' + icon + '"></i> <span>' + ZS.escape(msg) + '</span>';
  c.appendChild(t);
  requestAnimationFrame(function(){ t.classList.add('show'); });
  setTimeout(function(){
    t.classList.remove('show');
    setTimeout(function(){ t.remove(); }, 300);
  }, type === 'error' ? 3500 : 2400);
};

/* ---------------- DRAFT SYSTEM ----------------
   Auto-saves form state to localStorage every 800ms.
   Restores when modal opens. Clears on successful submit.
   Never loses work on refresh / back / close / network drop. */
ZS.Draft = (function(){
  var _timers = {};
  function _key(formId){ return 'zs_draft_' + ((ZS.State.currentUser||{}).id||'anon') + '_' + formId; }
  return {
    save: function(formId, data){
      try { localStorage.setItem(_key(formId), JSON.stringify({data:data, ts:Date.now()})); } catch(e){}
    },
    load: function(formId){
      try {
        var raw = localStorage.getItem(_key(formId));
        if(!raw) return null;
        var p = JSON.parse(raw);
        if(!p || !p.data) return null;
        // expire after 7 days
        if(Date.now() - (p.ts||0) > 7*24*60*60*1000){ this.clear(formId); return null; }
        return p.data;
      } catch(e){ return null; }
    },
    clear: function(formId){
      try { localStorage.removeItem(_key(formId)); } catch(e){}
    },
    attach: function(formId, getDataFn){
      var self = this;
      if(_timers[formId]) clearInterval(_timers[formId]);
      _timers[formId] = setInterval(function(){
        try {
          var data = getDataFn();
          if(data && Object.keys(data).length){
            self.save(formId, data);
            _flash();
          }
        } catch(e){}
      }, 1200);
    },
    detach: function(formId){
      if(_timers[formId]){ clearInterval(_timers[formId]); delete _timers[formId]; }
    }
  };
  function _flash(){
    var el = document.getElementById('zs-draft-indicator');
    if(!el) return;
    el.classList.add('show');
    clearTimeout(_flash._t);
    _flash._t = setTimeout(function(){ el.classList.remove('show'); }, 900);
  }
})();

/* ---------------- MODAL SYSTEM ----------------
   Rules:
   - Never closes on outside click
   - Only X or Cancel closes
   - Warns if unsaved changes
   - Restores draft on reopen
   - Escape key closes with confirm */
ZS.Modal = (function(){
  var _open = null;
  function _render(opts){
    var host = document.getElementById('zs-modal-host');
    if(!host) return;
    var hasDraft = opts.draftKey ? !!ZS.Draft.load(opts.draftKey) : false;
    var h = '<div class="zs-modal-overlay" data-modal="1">';
    h += '<div class="zs-modal" role="dialog" aria-modal="true">';
    h += '<div class="zs-modal-header">';
    h += '<div class="zs-modal-title"><i class="' + (opts.icon||'fa-solid fa-circle-info') + '" style="color:#10b981;"></i> ' + ZS.escape(opts.title||'') + '</div>';
    h += '<button class="zs-modal-close" onclick="ZS.Modal.close()" aria-label="Close"><i class="fa-solid fa-xmark"></i></button>';
    h += '</div>';
    if(hasDraft){
      h += '<div style="background:rgba(161,133,84,.1);border:1px solid rgba(161,133,84,.35);border-radius:10px;padding:10px 12px;margin-bottom:14px;font-size:11px;color:#cbd5e1;display:flex;align-items:center;gap:8px;">';
      h += '<i class="fa-solid fa-floppy-disk" style="color:#a18554;"></i> Restored your unsaved draft. Continue where you left off.';
      h += '<button onclick="ZS.Modal.clearDraft()" style="margin-left:auto;background:transparent;border:none;color:#a16262;font-size:10px;font-weight:800;cursor:pointer;text-decoration:underline;">DISCARD</button>';
      h += '</div>';
    }
    h += '<div id="zs-modal-body">' + (opts.body||'') + '</div>';
    if(opts.footer !== false){
      h += '<div class="zs-modal-footer">';
      h += '<button class="zs-btn secondary" onclick="ZS.Modal.close(true)" style="flex:0 0 auto;">Cancel</button>';
      if(opts.onSubmit){
        h += '<button class="zs-btn" id="zs-modal-submit" onclick="ZS.Modal.submit()" style="flex:1;"' + (opts.submitDisabled?' disabled':'') + '>' +
             '<i class="' + (opts.submitIcon||'fa-solid fa-check') + '"></i> ' + ZS.escape(opts.submitLabel||'Save') + '</button>';
      }
      h += '</div>';
    }
    h += '</div></div>';
    host.innerHTML = h;
    _open = opts;
    if(opts.onOpen) setTimeout(opts.onOpen, 30);
    if(opts.draftKey && opts.getDataFn){
      ZS.Draft.attach(opts.draftKey, opts.getDataFn);
    }
  }
  return {
    open: _render,
    close: function(force){
      var opts = _open;
      if(!opts) return;
      if(!force){
        // Save draft before closing
        if(opts.draftKey && opts.getDataFn){
          try { ZS.Draft.save(opts.draftKey, opts.getDataFn()); } catch(e){}
        }
      } else {
        // Cancel was pressed — confirm if there are unsaved changes
        if(opts.draftKey && opts.getDataFn){
          try {
            var d = opts.getDataFn();
            if(d && Object.keys(d).some(function(k){
              var v = d[k]; return v !== '' && v != null && v !== 0;
            })){
              if(!confirm('Discard unsaved changes?')) return;
            }
          } catch(e){}
        }
      }
      if(opts.draftKey) ZS.Draft.detach(opts.draftKey);
      var host = document.getElementById('zs-modal-host');
      if(host) host.innerHTML = '';
      _open = null;
    },
    clearDraft: function(){
      if(_open && _open.draftKey){
        ZS.Draft.clear(_open.draftKey);
        var host = document.getElementById('zs-modal-host');
        if(host){
          var banner = host.querySelector('div[style*="161,133,84"]');
          if(banner) banner.remove();
        }
        ZS.toast('Draft discarded.', 'info');
      }
    },
    submit: async function(){
      var opts = _open;
      if(!opts || !opts.onSubmit) return;
      var btn = document.getElementById('zs-modal-submit');
      if(!btn) return;
      if(btn.disabled) return; // prevent double-submit
      btn.disabled = true;
      var orig = btn.innerHTML;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Saving…';
      try {
        var result = await opts.onSubmit();
        if(result === false){
          // Failed — leave open, restore button
          btn.disabled = false;
          btn.innerHTML = orig;
          return;
        }
        // Success — clear draft, close silently
        if(opts.draftKey){
          ZS.Draft.clear(opts.draftKey);
          ZS.Draft.detach(opts.draftKey);
        }
        var host = document.getElementById('zs-modal-host');
        if(host) host.innerHTML = '';
        _open = null;
        if(opts.onSuccess) opts.onSuccess(result);
      } catch(e){
        ZS.toast((e && e.message) || 'Save failed.', 'error');
        btn.disabled = false;
        btn.innerHTML = orig;
      }
    }
  };
})();

/* Escape closes modal with confirm */
document.addEventListener('keydown', function(e){
  if(e.key === 'Escape'){
    var host = document.getElementById('zs-modal-host');
    if(host && host.innerHTML) ZS.Modal.close(true);
  }
});
/* Outside click NEVER closes modal — remove any default handler */
document.addEventListener('click', function(e){
  var overlay = e.target.closest('.zs-modal-overlay');
  if(overlay && e.target === overlay){
    e.stopPropagation();
    // Do nothing — modal stays open
  }
}, true);

/* ============================================================
   SCROLL POSITION MEMORY
   Preserves scroll per view+param so back nav restores position.
   ============================================================ */
function saveScroll(){
  try {
    var key = ZS.State.currentView + '|' + (ZS.State.currentParam||'');
    ZS.State._scrollMemory[key] = window.scrollY || 0;
  } catch(e){}
}
function restoreScroll(view, param){
  var key = view + '|' + (param||'');
  var y = ZS.State._scrollMemory[key];
  if(typeof y === 'number' && y > 0){
    setTimeout(function(){ window.scrollTo(0, y); }, 40);
  } else {
    window.scrollTo(0, 0);
  }
}
window.addEventListener('scroll', function(){
  var key = ZS.State.currentView + '|' + (ZS.State.currentParam||'');
  ZS.State._scrollMemory[key] = window.scrollY || 0;
}, {passive:true});

/* ============================================================
   ROUTER
   ============================================================ */
ZS.showView = async function(view, param){
  var prevView = ZS.State.currentView;
  var prevParam = ZS.State.currentParam;
  if(view === prevView && param === prevParam && !ZS.State._forceReload) return;
  ZS.State._forceReload = false;

  if(prevView){
    saveScroll();
    if(prevView !== view){
      ZS.State.navStack.push({view:prevView, param:prevParam});
      if(ZS.State.navStack.length > 30) ZS.State.navStack.shift();
    }
  }

  ZS.State.currentView = view;
  ZS.State.currentParam = param || null;

  // update footer active
  document.querySelectorAll('#zs-footer button').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-nav') === view);
  });

  var container = document.getElementById('zs-app');
  if(!container) return;

  // Loading skeleton
  container.innerHTML = '<div class="zs-skel-card"><div class="zs-skel-line zs-skeleton" style="width:40%"></div><div class="zs-skel-line zs-skeleton" style="width:80%"></div><div class="zs-skel-line zs-skeleton" style="width:60%"></div></div>';

  try {
    var html = await ZS.renderView(view, param);
    container.innerHTML = html || '<div class="zs-empty"><i class="fa-solid fa-inbox"></i><p>Nothing to show.</p></div>';
    restoreScroll(view, param);
    if(ZS.afterRender) ZS.afterRender(view, param);
    ZS.updateBadge();
  } catch(e){
    console.error('render error', e);
    container.innerHTML = '<div class="zs-empty"><i class="fa-solid fa-triangle-exclamation"></i><p>Something went wrong.</p><button class="zs-btn" style="max-width:200px;margin:0 auto;" onclick="ZS.showView(\'' + view + '\')">Try again</button></div>';
  }
};

ZS.goBack = function(){
  var stack = ZS.State.navStack || [];
  var current = ZS.State.currentView;
  var target = null;
  while(stack.length){
    var top = stack.pop();
    if(top.view !== current){ target = top; break; }
  }
  if(!target) target = {view:'home', param:null};
  ZS.showView(target.view, target.param);
};

ZS.goHome = function(){ ZS.showView('home'); };
ZS.goNotifications = function(){ ZS.showView('notifications'); };

ZS.goBackToPlatform = function(){
  var roles = ZS.State.myRoles || [];
  var needsConfirm = roles.indexOf('teacher') !== -1 || roles.indexOf('student') !== -1;
  if(!needsConfirm){
    window.location.href = 'index.html';
    return;
  }
  if(confirm('You are leaving School mode.\nYour students and pending tasks will not be visible until you return.\n\nLeave to ZYNIX?')){
    window.location.href = 'index.html';
  }
};

ZS.updateBadge = function(){
  var n = (ZS.State.data.notifications||[]).filter(function(x){ return !x.read_at; }).length;
  var b = document.getElementById('zs-notif-badge');
  if(b){
    if(n > 0){ b.textContent = n > 9 ? '9+' : n; b.style.display = 'flex'; }
    else b.style.display = 'none';
  }
};

/* ============================================================
   DATA LAYER — all queries
   ============================================================ */
ZS.loadSchool = async function(){
  var c = sb(); if(!c) return;
  var u = ZS.State.currentUser; if(!u) return;
  try {
    var su = await c.from('school_users')
      .select('id, role, is_active, school_id, schools(id, name, slug, logo_url, subscription_tier)')
      .eq('user_id', u.id)
      .eq('is_active', true);
    if(su.data && su.data.length){
      ZS.State.mySchoolId = su.data[0].school_id;
      ZS.State.mySchool = su.data[0].schools || null;
      ZS.State.mySchoolUserId = su.data[0].id;
      ZS.State.myRoles = su.data.map(function(x){ return x.role; });
      // active role: prefer admin > teacher > student > parent > staff
      var order = ['admin','teacher','student','parent','staff'];
      for(var i=0;i<order.length;i++){
        if(ZS.State.myRoles.indexOf(order[i]) !== -1){ ZS.State.activeRole = order[i]; break; }
      }
    }
  } catch(e){ console.warn('loadSchool', e); }
};

ZS.loadDashboard = async function(){
  var c = sb(); if(!c) return;
  var r = ZS.State.activeRole;
  try {
    var fn = r === 'admin' ? 'school_admin_dashboard'
           : r === 'teacher' ? 'school_teacher_dashboard'
           : r === 'student' ? 'school_student_dashboard'
           : r === 'parent' ? 'school_parent_dashboard'
           : null;
    if(!fn) return;
    var arg = r === 'admin' ? ZS.State.mySchoolId : ZS.State.mySchoolUserId;
    var res = await c.rpc(fn, r === 'admin' ? {p_school_id: arg} : (r === 'teacher' ? {p_school_user_id: arg} : (r === 'student' ? {p_student_school_user_id: arg} : {p_parent_school_user_id: arg})));
    if(res.error){ console.warn('dashboard', res.error); return; }
    ZS.State.data.dashboard = res.data || null;
  } catch(e){ console.warn('loadDashboard', e); }
};

ZS.loadClasses = async function(){
  var c = sb(); if(!c) return;
  try {
    var r = await c.from('school_classes').select('*').order('sort_order',{ascending:true}).order('name',{ascending:true});
    ZS.State.data.classes = r.data || [];
  } catch(e){ ZS.State.data.classes = []; }
};

ZS.loadStudents = async function(){
  var c = sb(); if(!c) return;
  try {
    var r = await c.from('school_students')
      .select('id, class_id, roll_number, admission_number, is_active, school_user_id, date_of_birth, blood_group, school_users!inner(user_id, profiles!inner(id, name, username, avatar))')
      .eq('is_active', true);
    ZS.State.data.students = (r.data || []).map(function(s){
      var p = s.school_users && s.school_users.profiles ? s.school_users.profiles : {};
      return {
        id: s.id,
        class_id: s.class_id,
        roll_number: s.roll_number,
        admission_number: s.admission_number,
        school_user_id: s.school_user_id,
        date_of_birth: s.date_of_birth,
        blood_group: s.blood_group,
        name: p.name || p.username || 'Student',
        avatar: p.avatar || null
      };
    });
  } catch(e){ ZS.State.data.students = []; }
};

ZS.loadAttendance = async function(dateStr){
  var c = sb(); if(!c) return;
  dateStr = dateStr || ZS.todayStr();
  try {
    var r = await c.from('school_attendance').select('*').eq('attendance_date', dateStr);
    var map = {};
    (r.data||[]).forEach(function(a){ map[a.student_id] = a; });
    ZS.State.data.attendance[dateStr] = map;
  } catch(e){ ZS.State.data.attendance[dateStr] = {}; }
};

ZS.loadNotices = async function(){
  var c = sb(); if(!c) return;
  try {
    var r = await c.from('school_notices').select('*').order('created_at',{ascending:false}).limit(50);
    ZS.State.data.notices = r.data || [];
  } catch(e){ ZS.State.data.notices = []; }
};

ZS.loadMessages = async function(){
  var c = sb(); if(!c) return;
  var myId = ZS.State.mySchoolUserId;
  if(!myId){ ZS.State.data.messages = []; return; }
  try {
    var r = await c.from('school_messages')
      .select('*')
      .or('sender_id.eq.' + myId + ',recipient_id.eq.' + myId)
      .order('created_at',{ascending:true})
      .limit(200);
    ZS.State.data.messages = r.data || [];
  } catch(e){ ZS.State.data.messages = []; }
};

ZS.loadLessons = async function(){
  var c = sb(); if(!c) return;
  try {
    var r = await c.from('school_lessons')
      .select('*')
      .eq('is_published', true)
      .order('published_at',{ascending:false})
      .limit(50);
    ZS.State.data.lessons = r.data || [];
  } catch(e){ ZS.State.data.lessons = []; }
};

ZS.loadNotifications = async function(){
  var c = sb(); if(!c) return;
  var u = ZS.State.currentUser; if(!u) return;
  try {
    var r = await c.from('notifications')
      .select('*')
      .eq('user_id', u.id)
      .lte('deliver_at', new Date().toISOString())
      .order('created_at',{ascending:false})
      .limit(50);
    ZS.State.data.notifications = r.data || [];
  } catch(e){ ZS.State.data.notifications = []; }
};

ZS.renderView = async function(view, param){
  if(!ZS.State.mySchoolId && view !== 'join'){
    return '<div class="zs-empty">' +
      '<i class="fa-solid fa-school-flag"></i>' +
      '<p>You are not part of any school yet.<br>Ask your school admin to add you.</p>' +
      '<button class="zs-btn" style="max-width:200px;margin:0 auto;" onclick="ZS.goBackToPlatform()"><i class="fa-solid fa-arrow-right-from-bracket"></i> Back to ZYNIX</button>' +
    '</div>';
  }
  switch(view){
    case 'home':        return await ZS.viewHome();
    case 'attendance':  return await ZS.viewAttendance();
    case 'lessons':     return await ZS.viewLessons();
    case 'notices':     return await ZS.viewNotices();
    case 'messages':    return await ZS.viewMessages(param);
    case 'notifications': return await ZS.viewNotifications();
    case 'lesson-view': return await ZS.viewLessonDetail(param);
    case 'notice-view': return await ZS.viewNoticeDetail(param);
    default:            return await ZS.viewHome();
  }
};

  var role = ZS.State.activeRole;

  var h = '';
  // Greeting
  h += '<div class="zs-card highlight">';

ZS.viewAttendanceMark = async function(){

  var cls = ZS.State.data.classes.find(function(c){ return c.id === selectedClass; });
  var students = ZS.State.data.students.filter(function(s){ return s.class_id === selectedClass; });
  var attMap = ZS.State.data.attendance[today] || {};

  var h = '';
  h += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">';
  h += '<button class="zs-header-btn" onclick="ZS.goBack()" title="Back"><i class="fa-solid fa-arrow-left"></i></button>';

  h += '</div>';

  // Class picker
  h += '<div class="zs-role-switcher">';
  ZS.State.data.classes.forEach(function(c){
    var active = c.id === selectedClass;
    h += '<button class="' + (active?'active':'') + '" onclick="ZS.State._selectedClassId=\'' + ZS.escape(c.id) + '\';ZS.showView(\'attendance\',null,true);">' + ZS.escape(c.name + (c.section?(' - ' + c.section):'')) + '</button>';
  });
  h += '</div>';

  if(!students.length){
    h += '<div class="zs-empty"><i class="fa-solid fa-user-slash"></i><p>No students in this class.</p></div>';
    return h;
  }

  // Bulk actions
  h += '<div style="display:flex;gap:8px;margin-bottom:12px;">';
  h += '<button class="zs-btn secondary small" style="flex:1;" onclick="ZS.markAll(\'present\')"><i class="fa-solid fa-check"></i> All present</button>';
  h += '<button class="zs-btn secondary small" style="flex:1;" onclick="ZS.markAll(\'absent\')"><i class="fa-solid fa-xmark"></i> All absent</button>';
  h += '</div>';

  h += '<div class="zs-section-title">Students (' + students.length + ')</div>';
  students.forEach(function(s){
    var cur = attMap[s.id] ? attMap[s.id].status : null;
    h += '<div class="zs-att-item">';
    h += '<div style="min-width:0;flex:1;"><div class="zs-att-name">' + ZS.escape(s.name) + '</div>';
    h += '<div class="zs-att-roll">Roll ' + ZS.escape(s.roll_number||'-') + '</div></div>';
    h += '<div class="zs-att-status">';
    ['present','absent','late','leave'].forEach(function(st){
      var short = st === 'present' ? 'P' : st === 'absent' ? 'A' : st === 'late' ? 'L' : 'Lv';
      var act = cur === st ? ' active' : '';
      h += '<button class="' + st + act + '" onclick="ZS.setAttendance(\'' + ZS.escape(s.id) + '\',\'' + st + '\')" title="' + st + '">' + short + '</button>';
    });
    h += '</div>';
    h += '</div>';
  });

  return h;
};

ZS.setAttendance = async function(studentId, status){
  ZS.haptic(8);
  var today = ZS.todayStr();
  var cls = ZS.State.data.students.find(function(s){ return s.id === studentId; });
  if(!cls) return;
  var existing = (ZS.State.data.attendance[today] || {})[studentId];

  // Optimistic update
  if(!ZS.State.data.attendance[today]) ZS.State.data.attendance[today] = {};
  ZS.State.data.attendance[today][studentId] = { student_id: studentId, status: status, attendance_date: today };

  // Update DOM
  var btns = document.querySelectorAll('.zs-att-item');
  // Find matching button by onclick attr (simple and safe)
  document.querySelectorAll('[onclick*="' + studentId + '"]').forEach(function(b){
    var m = b.getAttribute('onclick').match(/'([a-z]+)'\)/);
    if(!m) return;
    b.classList.toggle('active', m[1] === status);
  });

  var c = sb();
  if(!c) return;
  try {
    if(existing){
      // Update
      var u = await c.from('school_attendance')
        .update({status: status})
        .eq('student_id', studentId)
        .eq('attendance_date', today);
      if(u.error) console.warn('att update', u.error);
    } else {
      // Insert
      var payload = {
        student_id: studentId,
        class_id: cls.class_id,
        attendance_date: today,
        status: status,
        marked_by: ZS.State.mySchoolUserId
      };
      var ins = await c.from('school_attendance').insert(payload);
      if(ins.error && ins.error.code !== '23505'){
        console.warn('att insert', ins.error);
        ZS.toast('Failed to save attendance.', 'error');
      }
    }
    // Toast feedback
    ZS.toast(cls.name + ' — ' + status, status === 'present' ? 'success' : (status === 'absent' ? 'error' : 'warning'));
  } catch(e){ console.warn('setAttendance', e); }
};

ZS.markAll = async function(status){
  var cls = ZS.State._selectedClassId;
  var students = ZS.State.data.students.filter(function(s){ return s.class_id === cls; });
  if(!students.length) return;
  if(!confirm('Mark all ' + students.length + ' students as ' + status + '?')) return;
  var today = ZS.todayStr();
  var c = sb(); if(!c) return;
  var rows = students.map(function(s){
    return { student_id: s.id, class_id: cls, attendance_date: today, status: status, marked_by: ZS.State.mySchoolUserId };
  });
  try {
    await c.from('school_attendance').upsert(rows, {onConflict:'student_id,attendance_date'});
    ZS.toast('Marked all as ' + status + '.');
    ZS.showView('attendance', null, true);
  } catch(e){ ZS.toast('Bulk save failed.', 'error'); }
};

ZS.viewLessonDetail = async function(lessonId){
  if(!lessonId){
    return '<div class="zs-empty"><i class="fa-solid fa-triangle-exclamation"></i><p>Lesson not found.</p></div>';
  }
  var c = sb(); if(!c) return '<div class="zs-empty"><p>Not connected.</p></div>';

  var r = await c.from('school_lessons').select('*').eq('id', lessonId).maybeSingle();
  if(!r.data) return '<div class="zs-empty"><i class="fa-solid fa-triangle-exclamation"></i><p>Lesson not found.</p></div>';
  var lesson = r.data;

  var slidesR = await c.from('school_lesson_slides').select('*').eq('lesson_id', lessonId).order('slide_order',{ascending:true});
  var slides = slidesR.data || [];

  var h = '';
  h += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">';
  h += '<button class="zs-header-btn" onclick="ZS.goBack()" title="Back"><i class="fa-solid fa-arrow-left"></i></button>';
  h += '<div style="flex:1;"><div style="font-size:16px;font-weight:900;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + ZS.escape(lesson.title) + '</div>';
  if(lesson.chapter) h += '<div style="font-size:11px;color:#94a3b8;">' + ZS.escape(lesson.chapter) + '</div>';
  h += '</div></div>';

  if(lesson.description){
    h += '<div class="zs-card">';
    h += '<div style="font-size:12px;color:#cbd5e1;line-height:1.6;white-space:pre-wrap;">' + ZS.escape(lesson.description) + '</div>';
    h += '</div>';
  }

  if(slides.length){
    h += '<div class="zs-section-title">' + slides.length + ' slide' + (slides.length===1?'':'s') + '</div>';
    slides.forEach(function(s, i){
      h += '<div class="zs-card" style="padding:12px;">';
      h += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">';
      h += '<span class="zs-chip blue">Slide ' + s.slide_order + '</span>';
      if(s.auto_advance) h += '<span class="zs-chip green">Auto</span>';
      if(s.audio_url) h += '<span class="zs-chip purple">Audio</span>';
      h += '</div>';
      if(s.text_content){
        h += '<div style="font-size:13px;color:#e2e8f0;line-height:1.6;white-space:pre-wrap;margin-bottom:8px;">' + ZS.escape(s.text_content) + '</div>';
      }
      if(s.image_url){
        h += '<img src="' + ZS.escape(s.image_url) + '" style="width:100%;border-radius:10px;margin-bottom:8px;background:#000;" onerror="this.style.display=\'none\'">';
      }
      if(s.audio_url){
        h += '<audio controls src="' + ZS.escape(s.audio_url) + '" style="width:100%;"></audio>';
      }
      h += '</div>';
    });
  } else if(lesson.lesson_type === 'video' && lesson.cover_image_url){
    h += '<div class="zs-card" style="padding:0;overflow:hidden;"><video controls src="' + ZS.escape(lesson.cover_image_url) + '" style="width:100%;display:block;background:#000;"></video></div>';
  } else {
    h += '<div class="zs-empty"><i class="fa-solid fa-folder-open"></i><p>No slides yet.</p></div>';
  }

  return h;
};

ZS.openCreateLesson = async function(){
  await ZS.loadClasses();
  var cls = ZS.State.data.classes;
  if(!cls.length){
    ZS.toast('No classes set up yet. Create a class first.', 'warning');
    return;
  }
  var draftKey = 'new-lesson';
  var saved = ZS.Draft.load(draftKey) || {};
  var classOpts = cls.map(function(c){
    var sel = saved.class_id === c.id ? ' selected' : '';
    return '<option value="' + ZS.escape(c.id) + '"' + sel + '>' + ZS.escape(c.name + (c.section?(' - ' + c.section):'')) + '</option>';
  }).join('');

  var body = '';
  body += '<div class="zs-field"><label class="zs-label">Class</label><select id="zs-lesson-class" class="zs-select">' + classOpts + '</select></div>';
  body += '<div class="zs-field"><label class="zs-label">Title</label><input id="zs-lesson-title" class="zs-input" placeholder="e.g. Photosynthesis — Intro" value="' + ZS.escape(saved.title||'') + '"></div>';
  body += '<div class="zs-field"><label class="zs-label">Chapter (optional)</label><input id="zs-lesson-chapter" class="zs-input" placeholder="e.g. Chapter 3" value="' + ZS.escape(saved.chapter||'') + '"></div>';
  body += '<div class="zs-field"><label class="zs-label">Description</label><textarea id="zs-lesson-desc" class="zs-textarea" placeholder="What will students learn?">' + ZS.escape(saved.description||'') + '</textarea></div>';
  body += '<div class="zs-field"><label class="zs-label">Type</label><select id="zs-lesson-type" class="zs-select"><option value="slides_audio">Slides + Audio</option><option value="video">Video</option><option value="pdf">PDF</option></select></div>';

  ZS.Modal.open({
    title:'Create lesson',
    icon:'fa-solid fa-chalkboard',
    body: body,
    draftKey: draftKey,
    getDataFn: function(){
      return {
        class_id: (document.getElementById('zs-lesson-class')||{}).value||'',
        title: (document.getElementById('zs-lesson-title')||{}).value||'',
        chapter: (document.getElementById('zs-lesson-chapter')||{}).value||'',
        description: (document.getElementById('zs-lesson-desc')||{}).value||'',
        lesson_type: (document.getElementById('zs-lesson-type')||{}).value||'slides_audio'
      };
    },
    submitLabel:'Publish lesson',
    submitIcon:'fa-solid fa-cloud-arrow-up',
    onSubmit: async function(){
      var d = this.getDataFn ? this.getDataFn() : null;
      var cls_ = (document.getElementById('zs-lesson-class')||{}).value;
      var title = (document.getElementById('zs-lesson-title')||{}).value.trim();
      var chapter = (document.getElementById('zs-lesson-chapter')||{}).value.trim();
      var desc = (document.getElementById('zs-lesson-desc')||{}).value.trim();
      var type = (document.getElementById('zs-lesson-type')||{}).value || 'slides_audio';
      if(!cls_ || !title){ ZS.toast('Class and title required.', 'error'); return false; }
      var c = sb(); if(!c){ ZS.toast('Not connected.', 'error'); return false; }
      var ins = await c.from('school_lessons').insert({
        school_id: ZS.State.mySchoolId,
        class_id: cls_,
        subject_id: null,
        teacher_id: ZS.State.mySchoolUserId,
        author_user_id: (ZS.State.currentUser||{}).id,
        title: title,
        chapter: chapter || null,
        description: desc || null,
        lesson_type: type,
        is_published: true,
        published_at: new Date().toISOString()
      });
      if(ins.error){ ZS.toast('Save failed: ' + ins.error.message, 'error'); return false; }
      ZS.toast('Lesson published!');
      ZS.showView('lessons', null, true);
      return true;
    }
  });
};

  body += '<div class="zs-field"><label class="zs-label">Title</label><input id="zs-notice-title" class="zs-input" placeholder="Short title" value="' + ZS.escape(saved.title||'') + '"></div>';
  body += '<div class="zs-field"><label class="zs-label">Message</label><textarea id="zs-notice-body" class="zs-textarea" placeholder="Write the notice..." style="min-height:140px;">' + ZS.escape(saved.body||'') + '</textarea></div>';
  body += '<div class="zs-field"><label class="zs-label">Audience</label><select id="zs-notice-aud" class="zs-select"><option value="all">Everyone</option><option value="parents">Parents only</option><option value="teachers">Teachers only</option><option value="students">Students only</option></select></div>';
  body += '<div class="zs-field"><label class="zs-label">Urgency</label><select id="zs-notice-urgency" class="zs-select"><option value="info">Info (blue)</option><option value="positive">Positive (green)</option><option value="warning">Warning (amber)</option><option value="serious">Serious (red)</option></select></div>';

  ZS.Modal.open({
    title:'Publish notice',
    icon:'fa-solid fa-bullhorn',
    body: body,
    draftKey: draftKey,
    getDataFn: function(){
      return {
        title: (document.getElementById('zs-notice-title')||{}).value||'',
        body: (document.getElementById('zs-notice-body')||{}).value||'',
        audience: (document.getElementById('zs-notice-aud')||{}).value||'all',
        urgency: (document.getElementById('zs-notice-urgency')||{}).value||'info'
      };
    },
    submitLabel:'Publish',
    submitIcon:'fa-solid fa-paper-plane',
    onSubmit: async function(){
      var title = (document.getElementById('zs-notice-title')||{}).value.trim();
      var body_ = (document.getElementById('zs-notice-body')||{}).value.trim();
      var aud = (document.getElementById('zs-notice-aud')||{}).value||'all';
      var urg = (document.getElementById('zs-notice-urgency')||{}).value||'info';
      if(!title || !body_){ ZS.toast('Title and message required.', 'error'); return false; }
      var c = sb(); if(!c) return false;
      var ins = await c.from('school_notices').insert({
        school_id: ZS.State.mySchoolId,
        author_id: ZS.State.mySchoolUserId,
        title: title,
        body: body_,
        audience: aud,
        urgency: urg,
        auto_notified: true
      });
      if(ins.error){ ZS.toast('Failed: ' + ins.error.message, 'error'); return false; }
      ZS.toast('Notice published. Parents will be notified.');
      ZS.showView('notices', null, true);
      return true;
    }
  });
};

ZS.deleteNotice = async function(id){
  if(!confirm('Delete this notice?')) return;
  var c = sb(); if(!c) return;
  var r = await c.from('school_notices').delete().eq('id', id);
  if(r.error){ ZS.toast('Delete failed.', 'error'); return; }
  ZS.toast('Deleted.');
  ZS.showView('notices', null, true);
};

ZS.viewNoticeDetail = async function(id){
  // placeholder — notice detail is inline already
  ZS.showView('notices');
};

/* ---------- MESSAGES ---------- */
ZS.viewMessages = async function(peerId){
  await ZS.loadMessages();
  var myId = ZS.State.mySchoolUserId;
  var msgs = ZS.State.data.messages || [];

  var h = '';
  h += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">';
  h += '<button class="zs-header-btn" onclick="ZS.goBack()" title="Back"><i class="fa-solid fa-arrow-left"></i></button>';
  h += '<div style="flex:1;"><div style="font-size:16px;font-weight:900;color:#fff;">Messages</div>';
  h += '<div style="font-size:11px;color:#94a3b8;">' + msgs.length + ' total</div></div></div>';

  if(!msgs.length){
    h += '<div class="zs-empty"><i class="fa-solid fa-comments"></i><p>No messages yet.</p></div>';
    return h;
  }

  // Group by thread (other party)
  var threads = {};
  msgs.forEach(function(m){
    var other = m.sender_id === myId ? m.recipient_id : m.sender_id;
    if(!threads[other]) threads[other] = [];
    threads[other].push(m);
  });

  var peers = Object.keys(threads);
  h += '<div class="zs-section-title">Conversations</div>';
  peers.forEach(function(peer){
    var list = threads[peer];
    var last = list[list.length-1];
    var unread = list.filter(function(x){ return x.recipient_id === myId && !x.read_at; }).length;
    h += '<button class="zs-tile" onclick="ZS.openChat(\'' + ZS.escape(peer) + '\')">';
    h += '<div class="zs-tile-icon" style="background:rgba(59,130,246,.1);"><i class="fa-solid fa-user" style="color:#60a5fa;"></i></div>';
    h += '<div style="flex:1;min-width:0;">';
    h += '<div class="zs-tile-title">' + ZS.escape(peer.substring(0,8)) + '…</div>';
    h += '<div class="zs-tile-sub">' + ZS.escape((last.body||'').substring(0,60)) + '</div>';
    h += '<div style="font-size:9px;color:#64748b;margin-top:4px;">' + ZS.timeAgo(last.created_at) + '</div>';
    h += '</div>';
    if(unread > 0) h += '<span class="zs-chip red">' + unread + '</span>';
    h += '<i class="fa-solid fa-chevron-right" style="color:#475569;"></i>';
    h += '</button>';
  });

  return h;
};

ZS.openChat = function(peerId){
  ZS.toast('Chat thread — coming in next build.', 'info');
};

/* ---------- NOTIFICATIONS ---------- */
ZS.viewNotifications = async function(){
  await ZS.loadNotifications();
  var notifs = ZS.State.data.notifications || [];

  var h = '';
  h += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;">';
  h += '<button class="zs-header-btn" onclick="ZS.goBack()" title="Back"><i class="fa-solid fa-arrow-left"></i></button>';
  h += '<div style="flex:1;"><div style="font-size:16px;font-weight:900;color:#fff;">Notifications</div>';
  h += '<div style="font-size:11px;color:#94a3b8;">' + notifs.length + ' total</div></div></div>';

  if(!notifs.length){
    h += '<div class="zs-empty"><i class="fa-solid fa-bell"></i><p>You are all caught up.</p></div>';
    return h;
  }

  notifs.forEach(function(n){
    var kind = n.kind || '';
    var urgency = 'info';
    if(kind.indexOf('absent') !== -1 || kind.indexOf('disciplinary') !== -1 || kind.indexOf('overdue') !== -1) urgency = 'serious';
    else if(kind.indexOf('late') !== -1 || kind.indexOf('due') !== -1 || kind.indexOf('concern') !== -1) urgency = 'warning';
    else if(kind.indexOf('birthday') !== -1 || kind.indexOf('praise') !== -1 || kind.indexOf('great') !== -1) urgency = 'positive';
    var chipCol = urgency === 'positive' ? 'green' : urgency === 'serious' ? 'red' : urgency === 'warning' ? 'amber' : 'blue';

    h += '<div class="zs-notice ' + urgency + '">';
    h += '<div class="zs-urgency-strip"></div>';
    h += '<div class="zs-notice-title">' + ZS.escape(n.message||'') + '</div>';
    h += '<div class="zs-notice-meta">';
    h += '<span class="zs-chip ' + chipCol + '">' + ZS.escape(kind || 'info') + '</span>';
    h += '<span>' + ZS.timeAgo(n.created_at) + '</span>';
    if(!n.read) h += '<span class="zs-chip red">NEW</span>';
    h += '</div></div>';
  });

  return h;
};

/* ============================================================
   PULL TO REFRESH
   ============================================================ */
(function(){
  var startY = 0, active = false, threshold = 80;
  document.addEventListener('touchstart', function(e){
    if(window.scrollY > 5) return;
    startY = e.touches[0].clientY;
    active = true;
  }, {passive:true});
  document.addEventListener('touchmove', function(e){
    if(!active) return;
    var dy = e.touches[0].clientY - startY;
    var ind = document.getElementById('zs-pull');
    if(!ind) return;
    if(dy > 40) ind.classList.add('visible');
  }, {passive:true});
  document.addEventListener('touchend', function(e){
    if(!active) return;
    active = false;
    var dy = e.changedTouches[0].clientY - startY;
    var ind = document.getElementById('zs-pull');
    if(dy > threshold){
      if(ind) ind.querySelector('span').textContent = 'Refreshing...';
      ZS.showView(ZS.State.currentView, ZS.State.currentParam, true);
      setTimeout(function(){
        if(ind){ ind.classList.remove('visible'); ind.querySelector('span').textContent = 'Release to refresh'; }
      }, 600);
    } else {
      if(ind) ind.classList.remove('visible');
    }
  }, {passive:true});
})();

/* ============================================================
   BOOT
   ============================================================ */
async function boot(){
  var c = sb();
  if(!c){
    console.warn('Supabase not loaded');
    setTimeout(boot, 300);
    return;
  }
  try {
    var s = await c.auth.getSession();
    var user = s && s.data && s.data.session ? s.data.session.user : null;
    if(user){
      var pr = await c.from('profiles').select('*').eq('id', user.id).maybeSingle();
      ZS.State.currentUser = pr.data || { id:user.id, name:user.email, email:user.email };
      await ZS.loadSchool();
    }
  } catch(e){ console.warn('boot', e); }

  // hide welcome
  setTimeout(function(){
    var w = document.getElementById('zs-welcome');
    if(w) w.classList.add('fadeout');
  }, 400);

  // initial view: use last saved
  var lastView = 'home';
  try { lastView = localStorage.getItem('zs_last_view') || 'home'; } catch(e){}
  ZS.showView(lastView);

  // Watch auth changes
  try {
    c.auth.onAuthStateChange(async function(evt){
      if(evt === 'SIGNED_IN' || evt === 'SIGNED_OUT'){
        var s2 = await c.auth.getSession();
        var u2 = s2 && s2.data && s2.data.session ? s2.data.session.user : null;
        if(u2){
          var pr2 = await c.from('profiles').select('*').eq('id', u2.id).maybeSingle();
          ZS.State.currentUser = pr2.data || { id:u2.id, email:u2.email };
          await ZS.loadSchool();
        } else {
          ZS.State.currentUser = null;
          ZS.State.mySchoolId = null;
          ZS.State.myRoles = [];
        }
        ZS.showView(ZS.State.currentView, ZS.State.currentParam, true);
      }
    });
  } catch(e){}

  console.log('[ZYNIX School] ready');
}

// Persist last view for restoration
var _origShow = ZS.showView;
ZS.showView = function(v, p, force){
  try { localStorage.setItem('zs_last_view', v); } catch(e){}
  return _origShow.call(ZS, v, p, force);
};

if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
</script>

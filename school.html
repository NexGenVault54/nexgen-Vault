<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#090d16;color:#f8fafc;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding-bottom:80px;overflow-x:hidden}

.zs-badge{position:absolute;top:-4px;right:-4px;background:#a16262;color:#fff;font-size:9px;font-weight:900;min-width:16px;height:16px;border-radius:8px;padding:0 4px;display:flex;align-items:center;justify-content:center;border:2px solid #090d16}
.zs-footer{position:fixed;bottom:0;left:0;right:0;z-index:1000;background:rgba(9,13,22,.95);backdrop-filter:blur(12px);border-top:1px solid #1e293b;padding:8px 0;display:flex;align-items:center;justify-content:space-around;max-width:600px;margin:0 auto}
.zs-footer button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 0;color:#64748b;transition:color .2s;background:transparent;border:none;font-size:9px;cursor:pointer;font-weight:500;position:relative}
.zs-footer button i{font-size:18px;margin-bottom:2px}
.zs-footer button.active{color:#10b981}
#zs-app{max-width:600px;margin:0 auto;padding:76px 14px 20px;min-height:calc(100vh - 80px)}
#zs-welcome{position:fixed;inset:0;z-index:20000;background:#090d16;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;opacity:1;transition:opacity .28s ease;pointer-events:auto}

.zs-wl{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,#10b981,#3b82f6);display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;font-size:38px;box-shadow:0 10px 40px rgba(16,185,129,.35)}
.zs-ww{margin-top:20px;font-size:26px;font-weight:900;letter-spacing:2px;background:linear-gradient(90deg,#10b981,#3b82f6,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
.zs-wt{margin-top:8px;font-size:11px;font-weight:600;letter-spacing:3px;color:#64748b;text-transform:uppercase}
.zs-card{background:#111827;border:1px solid #1e293b;border-radius:16px;padding:16px;margin-bottom:12px}

.zs-btn.danger{background:rgba(161,98,98,.15);border:1px solid rgba(161,98,98,.5);color:#a16262}

.zs-textarea{min-height:90px;resize:vertical}
.zs-label{display:block;font-size:11px;font-weight:800;color:#94a3b8;margin-bottom:5px}
.zs-field{margin-bottom:14px}
.zs-row{display:flex;gap:10px;align-items:center}
.zs-tile{width:100%;padding:14px;border-radius:14px;background:#111827;border:1px solid #1e293b;display:flex;gap:12px;align-items:center;text-align:left;cursor:pointer;transition:border-color .2s;margin-bottom:10px}

.zs-banner{border-radius:16px;padding:24px 20px;margin-bottom:12px;position:relative;overflow:hidden;color:#fff;cursor:pointer}
.zs-banner.emerald{background:linear-gradient(135deg,#10b981,#3b82f6)}
.zs-banner.purple{background:linear-gradient(135deg,#8b5cf6,#ec4899)}
.zs-banner.amber{background:linear-gradient(135deg,#a18554,#7a6140)}
.zs-banner.navy{background:linear-gradient(135deg,#1e3a8a,#312e81)}
.zs-bt{font-size:24px;font-weight:900;letter-spacing:.2px;line-height:1.2}
.zs-bs{font-size:13px;font-weight:600;opacity:.95;margin-top:4px}
.zs-bd{font-size:12px;opacity:.85;margin-top:8px;line-height:1.5}
.zs-bm{position:absolute;top:12px;right:14px;font-size:10px;font-weight:800;background:rgba(0,0,0,.35);padding:4px 10px;border-radius:12px}
.zs-overlay{position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.85);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.zs-modal{background:#111827;border:1px solid #1e293b;border-radius:16px;padding:20px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;animation:zsIn .22s ease}
@keyframes zsIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.zs-mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #1e293b}
.zs-mtitle{font-size:16px;font-weight:900;color:#fff;display:flex;align-items:center;gap:8px}
.zs-mclose{background:transparent;border:none;color:#94a3b8;font-size:22px;cursor:pointer;padding:0;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px}

.zs-mfoot{display:flex;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid #1e293b}
.zs-mfoot .zs-btn{flex:1}
.zs-mfoot .zs-btn.secondary{flex:0 0 auto;min-width:100px}
.zs-submit{background:#10b981 !important;color:#000 !important;font-weight:900;font-size:14px;padding:14px;border:none;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.zs-submit:hover{background:#059669}
.zs-submit:disabled{opacity:.5;cursor:not-allowed}
.zs-toastc{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:2147483647;width:90%;max-width:380px;pointer-events:none}
.zs-toast{background:rgba(17,24,39,.96);border:1px solid rgba(16,185,129,.3);color:#f8fafc;padding:12px 14px;border-radius:12px;font-size:12px;margin-bottom:6px;backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;opacity:0;transform:translateY(10px);transition:all .25s;pointer-events:auto;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.zs-toast.show{opacity:1;transform:translateY(0)}
.zs-toast i{font-size:15px;flex-shrink:0}
.zs-toast.success i{color:#10b981}
.zs-toast.error i{color:#a16262}
.zs-toast.warning i{color:#a18554}
.zs-toast.info i{color:#3b82f6}
.zs-sg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.zs-sg.g3{grid-template-columns:1fr 1fr 1fr}
.zs-stat{background:rgba(0,0,0,.25);border:1px solid #1e293b;border-radius:12px;padding:12px}
.zs-slabel{font-size:9.5px;color:#94a3b8;font-weight:900;letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}
.zs-svalue{font-size:20px;font-weight:900;color:#fff}
.zs-ri{display:flex;justify-content:space-between;align-items:center;padding:12px;border-radius:12px;background:#111827;border:1px solid #1e293b;margin-bottom:8px;gap:10px;transition:border-color .2s}
.zs-ri:hover{border-color:#334155}
.zs-av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,#10b981,#3b82f6);display:flex;align-items:center;justify-content:center;color:#000;font-weight:900;font-size:15px;flex-shrink:0;object-fit:cover}
.zs-tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding:2px 0;scrollbar-width:none}
.zs-tabs::-webkit-scrollbar{display:none}
.zs-tabs button{flex-shrink:0;padding:9px 16px;border-radius:20px;border:1px solid #1e293b;background:rgba(255,255,255,0.03);color:#94a3b8;font-size:12px;font-weight:800;cursor:pointer;transition:all .15s}
.zs-tabs button.active{background:rgba(16,185,129,.15);border-color:#10b981;color:#10b981}
.zs-search{position:relative;margin-bottom:14px}
.zs-search input{width:100%;padding:12px 40px 12px 14px;border-radius:12px;border:1px solid #1e293b;background:#0f172a;color:#fff;font-size:13px;outline:none;box-sizing:border-box}
.zs-search input:focus{border-color:#10b981}
.zs-search i{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#64748b;font-size:13px;pointer-events:none}
.zs-skel{background:linear-gradient(90deg,#111827 25%,#1a2233 50%,#111827 75%);background-size:200% 100%;animation:zsS 1.4s linear infinite;border-radius:10px}
@keyframes zsS{from{background-position:200% 0}to{background-position:-200% 0}}
.zs-sk{background:#111827;border:1px solid #1e293b;border-radius:16px;padding:14px;margin-bottom:12px}
.zs-sl{height:10px;border-radius:6px;margin-bottom:8px}
.zs-chip{display:inline-flex;align-items:center;gap:4px;font-size:10px;font-weight:800;padding:3px 9px;border-radius:12px;letter-spacing:.02em}
.zs-chip.green{background:rgba(16,185,129,.12);color:#10b981;border:1px solid rgba(16,185,129,.3)}
.zs-chip.blue{background:rgba(59,130,246,.12);color:#60a5fa;border:1px solid rgba(59,130,246,.3)}
.zs-chip.amber{background:rgba(161,133,84,.12);color:#a18554;border:1px solid rgba(161,133,84,.3)}
.zs-chip.red{background:rgba(161,98,98,.12);color:#a16262;border:1px solid rgba(161,98,98,.3)}
.zs-chip.purple{background:rgba(139,92,246,.12);color:#a78bfa;border:1px solid rgba(139,92,246,.3)}
.zs-chip.gray{background:rgba(148,163,184,.12);color:#94a3b8;border:1px solid rgba(148,163,184,.3)}
.zs-actions{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.zs-actions button{padding:7px 12px;border-radius:8px;border:1px solid #1e293b;background:transparent;color:#94a3b8;font-size:11px;font-weight:700;cursor:pointer}
.zs-actions button:hover{border-color:#a16262;color:#a16262}
.zs-menu{position:fixed;bottom:0;left:0;right:0;z-index:99998;background:rgba(0,0,0,.85);display:flex;align-items:flex-end;justify-content:center}
.zs-menu-inner{background:#111827;border-top-left-radius:20px;border-top-right-radius:20px;border-top:1px solid #1e293b;width:100%;max-width:600px;max-height:85vh;overflow-y:auto;animation:zsUp .25s ease}
@keyframes zsUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.zs-handle{width:40px;height:4px;background:#334155;border-radius:2px;margin:10px auto 0}
.zs-mhead2{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1e293b}
</style>
</head>
<body>

<header class="zs-header">
  <button style="display:flex;align-items:center;gap:8px;background:transparent;border:none;cursor:pointer;" onclick="ZS.goHome()">
    <div class="zs-logo">S</div>
    <span class="zs-title">ZYNIX SCHOOL</span>
  </button>
  <div style="display:flex;align-items:center;gap:8px;">
    <button class="zs-hbtn" onclick="ZS.goNotifications()"><i class="fa-solid fa-bell"></i><span class="zs-badge" id="zs-nb" style="display:none;">0</span></button>
    <button class="zs-hbtn" onclick="ZS.goBackToPlatform()"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
  </div>
</header>

<main id="zs-app"></main>

<nav class="zs-footer" id="zs-footer">
  <button onclick="ZS.showView('home')" data-nav="home"><i class="fa-solid fa-house"></i><span>Home</span></button>
  <button onclick="ZS.showView('people')" data-nav="people"><i class="fa-solid fa-users"></i><span>People</span></button>
  <button onclick="ZS.showView('operations')" data-nav="operations"><i class="fa-solid fa-gears"></i><span>Operations</span></button>
  <button onclick="ZS.showView('admin')" data-nav="admin"><i class="fa-solid fa-shield-halved"></i><span>Admin</span></button>
  <button onclick="ZS.openMore()" data-nav="more"><i class="fa-solid fa-ellipsis"></i><span>More</span></button>
</nav>

<div id="zs-welcome">
  <div class="zs-wl">S</div>
  <div class="zs-ww">ZYNIX SCHOOL</div>
  <div class="zs-wt">Learn · Teach · Connect</div>
</div>

<div class="zs-toastc" id="zs-toasts"></div>
<div id="zs-modal-host"></div>

<script>
(function(){
'use strict';
window.ZS = {};
var ZS = window.ZS;

ZS.SUPABASE_URL = 'https://ipypwqajsfxrdzlxfnlr.supabase.co';
ZS.SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlweXB3cWFqc2Z4cmR6bHhmbmxyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2OTEzODUsImV4cCI6MjEwNDI2NzM4NX0.QW6tzaMxlNg9EYuRq0tCOlGipBlrjBuiV6lZuSr1Jj4';

var _sb = null;
function sb(){ if(_sb) return _sb; if(!window.supabase) return null; _sb = window.supabase.createClient(ZS.SUPABASE_URL,ZS.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}); return _sb; }
ZS.sb = sb;

ZS.State = {
  currentUser:null, currentView:'home', currentParam:null, navStack:[],
  mySchoolId:null, mySchool:null, mySchoolUserId:null, myRoles:[], activeRole:null, myPermissions:[],
  isOwner:false,
  data:{classes:[],students:[],teachers:[],staff:[],parents:[],attendance:{},notices:[],notifications:[],dashboard:null,directory:[],fees:[],exams:[]},
  _scroll:{}, _selectedClassId:null
};

ZS.escape = function(s){ if(s==null) return ''; return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); };
ZS.todayStr = function(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
ZS.fmtDate = function(d){ try { return new Date(d).toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}); } catch(e){ return ''; } };
ZS.money = function(n,c){ var s = c==='PKR'?'₨':c==='USD'?'$':c==='EUR'?'€':c==='GBP'?'£':(c||'$')+' '; return s+(Number(n)||0).toFixed(2); };
ZS.timeAgo = function(ts){ if(!ts) return ''; var s=Math.floor((Date.now()-new Date(ts).getTime())/1000); if(s<60) return 'just now'; if(s<3600) return Math.floor(s/60)+'m ago'; if(s<86400) return Math.floor(s/3600)+'h ago'; return new Date(ts).toLocaleDateString(); };
ZS.haptic = function(ms){ try { if(navigator.vibrate) navigator.vibrate(ms||8); } catch(e){} };

ZS.toast = function(msg,type){
  type = type || 'success';
  var c = document.getElementById('zs-toasts'); if(!c) return;
  var t = document.createElement('div');
  t.className = 'zs-toast ' + type;
  var icon = type==='error'?'fa-triangle-exclamation':type==='warning'?'fa-clock':type==='info'?'fa-circle-info':'fa-circle-check';
  t.innerHTML = '<i class="fa-solid '+icon+'"></i> <span>'+ZS.escape(msg)+'</span>';
  c.appendChild(t);
  requestAnimationFrame(function(){ t.classList.add('show'); });
  setTimeout(function(){ t.classList.remove('show'); setTimeout(function(){ t.remove(); },300); }, type==='error'?3500:2400);
};

ZS.Modal = (function(){
  var _open = null;
  return {
    open: function(opts){
      var host = document.getElementById('zs-modal-host'); if(!host) return;
      var h = '<div class="zs-overlay">';
      h += '<div class="zs-modal">';
      h += '<div class="zs-mhead">';
      h += '<div class="zs-mtitle"><i class="'+(opts.icon||'fa-solid fa-circle-info')+'" style="color:#10b981;"></i> '+ZS.escape(opts.title||'')+'</div>';
      h += '<button class="zs-mclose" onclick="ZS.Modal.close()"><i class="fa-solid fa-xmark"></i></button>';
      h += '</div>';
      h += '<div id="zs-modal-body">'+(opts.body||'')+'</div>';
      if(opts.footer !== false){
        h += '<div class="zs-mfoot">';
        h += '<button class="zs-btn secondary" onclick="ZS.Modal.close(true)">Cancel</button>';
        if(opts.onSubmit){
          h += '<button class="zs-submit" id="zs-modal-submit" onclick="ZS.Modal.submit()">';
          h += '<i class="'+(opts.submitIcon||'fa-solid fa-check')+'"></i> '+ZS.escape(opts.submitLabel||'Save')+'</button>';
        }
        h += '</div>';
      }
      h += '</div></div>';
      host.innerHTML = h;
      _open = opts;
      if(opts.onOpen) setTimeout(opts.onOpen,30);
    },
    close: function(){ var host = document.getElementById('zs-modal-host'); if(host) host.innerHTML = ''; _open = null; },
    submit: async function(){
      var opts = _open; if(!opts || !opts.onSubmit) return;
      var btn = document.getElementById('zs-modal-submit'); if(!btn) return;
      if(btn.disabled) return;
      btn.disabled = true;
      var orig = btn.innerHTML;
      btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Saving…';
      try {
        var result = await opts.onSubmit();
        if(result === false){ btn.disabled = false; btn.innerHTML = orig; return; }
        var host = document.getElementById('zs-modal-host'); if(host) host.innerHTML = '';
        _open = null;
        if(opts.onSuccess) opts.onSuccess(result);
      } catch(e){
        ZS.toast((e && e.message) || 'Save failed.', 'error');
        btn.disabled = false; btn.innerHTML = orig;
      }
    }
  };
})();

function saveScroll(){ try { var k = ZS.State.currentView + '|' + (ZS.State.currentParam||''); ZS.State._scroll[k] = window.scrollY||0; } catch(e){} }
function restoreScroll(view,param){ var k = view + '|' + (param||''); var y = ZS.State._scroll[k]; if(typeof y === 'number' && y > 0) setTimeout(function(){ window.scrollTo(0,y); },40); else window.scrollTo(0,0); }

ZS.showView = async function(view,param,force){
  var pv = ZS.State.currentView, pp = ZS.State.currentParam;
  if(!force && view === pv && param === pp) return;
  if(pv){ saveScroll(); if(pv !== view){ ZS.State.navStack.push({view:pv,param:pp}); if(ZS.State.navStack.length>30) ZS.State.navStack.shift(); } }
  ZS.State.currentView = view; ZS.State.currentParam = param || null;
  try { localStorage.setItem('zs_last_view', view); } catch(e){}
  document.querySelectorAll('#zs-footer button').forEach(function(b){ b.classList.toggle('active', b.getAttribute('data-nav')===view); });
  var container = document.getElementById('zs-app'); if(!container) return;
  container.innerHTML = '<div class="zs-sk"><div class="zs-sl zs-skel" style="width:40%"></div><div class="zs-sl zs-skel" style="width:80%"></div><div class="zs-sl zs-skel" style="width:60%"></div></div>';
  try {
    var html = await ZS.renderView(view,param);
    container.innerHTML = html || '<div class="zs-empty"><i class="fa-solid fa-inbox"></i><p>Nothing to show.</p></div>';
    restoreScroll(view,param);
    ZS.updateBadge();
  } catch(e){
    console.error(e);
    container.innerHTML = '<div class="zs-empty"><i class="fa-solid fa-triangle-exclamation"></i><p>Something went wrong.</p><button class="zs-btn" style="max-width:200px;margin:0 auto;" onclick="ZS.showView(\''+view+'\',null,true)">Try again</button></div>';
  }
};

ZS.goBack = function(){

  while(st.length){ var t = st.pop(); if(t.view !== cur){ target = t; break; } }
  if(!target) target = {view:'home',param:null};
  ZS.showView(target.view,target.param);
};
ZS.goHome = function(){ ZS.showView('home'); };
ZS.goNotifications = function(){ ZS.showView('notifications'); };

/* ================= DATA LOADERS ================= */
ZS.loadDirectory = async function(){
  var c = sb(); if(!c) return;
  try { var r = await c.rpc('school_directory',{p_search:null,p_limit:100}); ZS.State.data.directory = r.data || []; }
  catch(e){ ZS.State.data.directory = []; }
};

ZS.loadSchool = async function(){
  var c = sb(); if(!c) return; var u = ZS.State.currentUser; if(!u) return;
  try {
    var su = await c.from('school_users').select('id,role,is_active,school_id,schools(id,name,slug,logo_url,tagline,city,country,owner_user_id,subscription_tier)').eq('user_id',u.id).eq('is_active',true);
    if(su.data && su.data.length){
      var row = su.data[0];
      ZS.State.mySchoolId = row.school_id;
      ZS.State.mySchool = row.schools || null;
      ZS.State.mySchoolUserId = row.id;
      ZS.State.myRoles = su.data.map(function(x){ return x.role; });
      var order = ['owner','super_admin','admin','principal','teacher','accountant','staff','student','parent'];
      for(var i=0;i<order.length;i++){ if(ZS.State.myRoles.indexOf(order[i])!==-1){ ZS.State.activeRole = order[i]; break; } }
      ZS.State.isOwner = !!(row.schools && row.schools.owner_user_id === u.id) || ZS.State.myRoles.indexOf('owner')!==-1 || ZS.State.myRoles.indexOf('admin')!==-1;
    } else {
      ZS.State.mySchoolId = null; ZS.State.mySchool = null; ZS.State.mySchoolUserId = null;
      ZS.State.myRoles = []; ZS.State.activeRole = null; ZS.State.isOwner = false;
    }
  } catch(e){}
};

ZS.loadDashboard = async function(){
  var c = sb(); if(!c || !ZS.State.mySchoolId) return;
  var r = ZS.State.activeRole;
  try {
    var fn = (r==='owner'||r==='super_admin'||r==='admin')?'school_admin_dashboard':r==='teacher'?'school_teacher_dashboard':r==='student'?'school_student_dashboard':r==='parent'?'school_parent_dashboard':null;
    if(!fn) return;
    var arg = (r==='owner'||r==='super_admin'||r==='admin') ? ZS.State.mySchoolId : ZS.State.mySchoolUserId;
    var params = (r==='owner'||r==='super_admin'||r==='admin') ? {p_school_id:arg} : (r==='teacher'?{p_school_user_id:arg}:(r==='student'?{p_student_school_user_id:arg}:{p_parent_school_user_id:arg}));
    var res = await c.rpc(fn, params);
    if(!res.error) ZS.State.data.dashboard = res.data || null;
  } catch(e){}
};

ZS.loadClasses = async function(){
  var c = sb(); if(!c || !ZS.State.mySchoolId){ ZS.State.data.classes = []; return; }
  try { var r = await c.from('school_classes').select('*').order('sort_order',{ascending:true}).order('name',{ascending:true}); ZS.State.data.classes = r.data || []; }
  catch(e){ ZS.State.data.classes = []; }
};

ZS.loadStudents = async function(){
  var c = sb(); if(!c || !ZS.State.mySchoolId){ ZS.State.data.students = []; return; }
  try {
    var r = await c.from('school_students').select('id,class_id,roll_number,admission_number,is_active,full_name,gender,date_of_birth,photo_url,address,phone,school_user_id,blood_group,bform_number').eq('is_active',true).order('roll_number',{ascending:true});
    ZS.State.data.students = r.data || [];
  } catch(e){ ZS.State.data.students = []; }
};

ZS.loadTeachers = async function(){
  var c = sb(); if(!c || !ZS.State.mySchoolId){ ZS.State.data.teachers = []; return; }
  try {
    var r = await c.from('school_teachers').select('id,school_user_id,qualification,joining_date,subjects_can_teach,is_active').eq('is_active',true);
    var rows = r.data || [];
    if(rows.length){
      var ids = rows.map(function(t){ return t.school_user_id; });
      var su = await c.from('school_users').select('id,user_id,profiles!inner(id,name,username,email,avatar,phone)').in('id',ids);
      var map = {}; (su.data||[]).forEach(function(x){ map[x.id] = x; });
      rows.forEach(function(t){ t._su = map[t.school_user_id] || {}; });
    }
    ZS.State.data.teachers = rows;
  } catch(e){ ZS.State.data.teachers = []; }
};

ZS.loadStaff = async function(){

    var r = await c.from('school_users')

  await ZS.loadDashboard();
  var d = ZS.State.data.dashboard || {};
  var s = ZS.State.mySchool || {};
  var roles = ZS.State.myRoles || [];
  var role = ZS.State.activeRole;
  var h = '';
  h += '<div class="zs-card highlight">';
  h += '<div style="font-size:10px;color:#94a3b8;font-weight:900;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px;">'+ZS.escape(s.name||'')+'</div>';

ZS.filterDir = function(q){

};
ZS.renderDirList = function(schools){

    h += '</div>';
  });

};

/* ============ SCHOOL LANDING ============ */
ZS.viewSchoolLanding = async function(schoolId){
  if(!schoolId) return '<div class="zs-empty"><p>School not found.</p></div>';
  var c = sb(); if(!c) return '<div class="zs-empty"><p>Not connected.</p></div>';
  var r = await c.rpc('school_get_public',{p_school_id:schoolId});
  var s = r.data && r.data[0] ? r.data[0] : null;
  if(!s){ return '<div class="zs-empty"><i class="fa-solid fa-school"></i><p>School not found.</p></div>'; }

/* ============ PEOPLE HUB ============ */
ZS.viewPeople = async function(tab){
  if(!ZS.State.mySchoolId) return '<div class="zs-empty"><p>Join a school first.</p></div>';
  tab = tab || 'students';
  ZS.State._peopleTab = tab;
  await Promise.all([ZS.loadClasses(),ZS.loadStudents(),ZS.loadTeachers(),ZS.loadStaff(),ZS.loadParents()]);
  var counts = {
    students:(ZS.State.data.students||[]).length,
    teachers:(ZS.State.data.teachers||[]).length,
    staff:(ZS.State.data.staff||[]).length,
    parents:(ZS.State.data.parents||[]).length
  };
  var total = counts.students+counts.teachers+counts.staff+counts.parents;
  var h = ZS.head('People', total+' people in school');
  h += '<div class="zs-tabs">';
  ['students','teachers','staff','parents'].forEach(function(t){
    h += '<button class="'+(t===tab?'active':'')+'" onclick="ZS.State._peopleTab=\''+t+'\';ZS.showView(\'people\',\''+t+'\',true)">'+t.charAt(0).toUpperCase()+t.slice(1)+' ('+counts[t]+')</button>';
  });
  h += '</div>';
  if(tab === 'students'){
    h += '<button class="zs-btn" style="margin-bottom:12px;" onclick="ZS.showView(\'admit\')"><i class="fa-solid fa-user-plus"></i> Admit New Student</button>';

    h += '<div id="zs-people-list">'+ZS.renderStudents()+'</div>';
  } else if(tab === 'teachers'){
    h += '<button class="zs-btn" style="margin-bottom:12px;" onclick="ZS.showView(\'add-teacher\')"><i class="fa-solid fa-user-plus"></i> Add New Teacher</button>';

  } else if(tab === 'parents'){
    h += '<div id="zs-people-list">'+ZS.renderParents()+'</div>';
  }
  return h;
};

ZS.filterPeople = function(q,tab){
  q = (q||'').toLowerCase();
  var arr = ZS.State.data[tab] || [];
  var f = q ? arr.filter(function(x){ return ((x.full_name||'')+(x.name||'')+(x.username||'')).toLowerCase().indexOf(q)!==-1; }) : arr;
  var host = document.getElementById('zs-people-list');
  if(!host) return;
  if(tab==='students') host.innerHTML = ZS.renderStudents(f);
  else if(tab==='teachers') host.innerHTML = ZS.renderTeachers(f);
  else if(tab==='staff') host.innerHTML = ZS.renderStaff(f);
  else host.innerHTML = ZS.renderParents(f);
};

ZS.submitAddTeacher = async function(){
  var email = (document.getElementById('at-email')||{}).value.trim().toLowerCase();
  if(!email){ ZS.toast('Email required.','error'); return; }
  var c = sb(); if(!c) return;
  var btn = document.getElementById('at-sub'); if(btn){ btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Adding...'; }
  try {
    var addR = await c.rpc('school_admin_add_person',{p_school_id:ZS.State.mySchoolId,p_email:email,p_role:'teacher',p_full_name:null});
    if(addR.error) throw addR.error;
    var d = addR.data;
    if(!d || !d.ok){
      if(d && d.reason==='user_not_found') throw new Error('This email has no ZYNIX account. Ask them to sign up first.');
      if(d && d.reason==='already_member') throw new Error('Already a member of your school.');
      throw new Error('Could not add.');
    }
    var subs = ((document.getElementById('at-subs')||{}).value||'').split(',').map(function(s){ return s.trim(); }).filter(Boolean);
    await c.from('school_teachers').insert({
      school_id: ZS.State.mySchoolId,
      school_user_id: d.school_user_id,
      qualification: (document.getElementById('at-qual')||{}).value.trim()||null,
      subjects_can_teach: subs,
      joining_date: (document.getElementById('at-join')||{}).value||ZS.todayStr()
    });
    ZS.toast('Teacher added!');
    ZS.showView('people','teachers',true);
  } catch(e){
    ZS.toast(e.message||'Failed','error');
    if(btn){ btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Add Teacher'; }
  }
};

    var addR = await c.rpc('school_admin_add_person',{p_school_id:ZS.State.mySchoolId,p_email:email,p_role:role,p_full_name:null});
    if(addR.error) throw addR.error;
    var d = addR.data;
    if(!d || !d.ok){
      if(d && d.reason==='user_not_found') throw new Error('This email has no ZYNIX account.');
      if(d && d.reason==='already_member') throw new Error('Already a member.');
      throw new Error('Could not add.');
    }
    ZS.toast('Staff added!');
    ZS.showView('people','staff',true);
  } catch(e){
    ZS.toast(e.message||'Failed','error');
    if(btn){ btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-user-shield"></i> Add to School'; }
  }
};

ZS.viewStudentProfile = async function(studentId){

  h += '</div>';

    h += '<div class="zs-card"><div class="zs-st" style="margin-top:0;">Guardians</div>';
    parents.forEach(function(p){
      h += '<div style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);">';
      h += '<div style="font-size:12px;font-weight:800;color:#fff;">'+ZS.escape(p.full_name||p.relationship||'Guardian')+'</div>';
      h += '<div style="font-size:11px;color:#94a3b8;">'+ZS.escape((p.relationship||'')+' '+(p.mobile?'· '+p.mobile:''))+'</div>';
      h += '</div>';
    });
    h += '</div>';
  }
  h += '<div class="zs-card highlight"><div class="zs-slabel">Total points</div><div style="font-size:28px;font-weight:900;color:#10b981;margin-top:4px;">'+(full.total_points||0)+'</div></div>';
  var att = full.attendance_summary || [];
  if(att.length){
    h += '<div class="zs-card"><div class="zs-st" style="margin-top:0;">Attendance</div>';
    att.slice(0,4).forEach(function(a){
      var pct = Number(a.attendance_percent)||0;
      var col = pct>=85?'#10b981':pct>=70?'#a18554':'#a16262';
      h += '<div style="display:flex;justify-content:space-between;margin-bottom:6px;">';
      h += '<div style="font-size:12px;color:#cbd5e1;">'+ZS.escape(a.month_key)+'</div>';
      h += '<div style="font-size:12px;font-weight:900;color:'+col+';">'+pct.toFixed(1)+'%</div>';
      h += '</div>';
    });

  }
  var reports = full.reports || [];
  if(reports.length){

      var col = r.severity==='positive'?'green':r.severity==='serious'?'red':r.severity==='warning'?'amber':'blue';
      h += '<div style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);">';
      h += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">';
      h += '<div style="font-size:12px;font-weight:700;color:#fff;">'+ZS.escape(r.title)+'</div>';
      h += '<span class="zs-chip '+col+'">'+ZS.escape(r.report_type)+'</span></div>';
      h += '<div style="font-size:10px;color:#64748b;margin-top:3px;">'+ZS.timeAgo(r.created_at)+'</div></div>';
    });
    h += '</div>';
  }
  if(ZS.State.isOwner || ZS.State.activeRole==='admin' || ZS.State.activeRole==='super_admin'){
    h += '<div class="zs-actions"><button onclick="ZS.openBehaviourReport(\''+ZS.escape(studentId)+'\')"><i class="fa-solid fa-flag"></i> Add Report</button>';
    h += '<button onclick="ZS.editStudent(\''+ZS.escape(studentId)+'\')"><i class="fa-solid fa-pen"></i> Edit</button>';
    h += '<button onclick="ZS.deleteStudent(\''+ZS.escape(studentId)+'\')" style="border-color:rgba(161,98,98,.5);color:#a16262;"><i class="fa-solid fa-trash"></i> Delete</button></div>';
  }
  return h;
};

/* ============ ATTENDANCE ============ */
ZS.viewAttendance = async function(){
  if(!ZS.State.mySchoolId) return '<div class="zs-empty"><p>Join a school first.</p></div>';
  if(!ZS.State.isOwner && ZS.State.activeRole!=='admin' && ZS.State.activeRole!=='super_admin' && ZS.State.activeRole!=='teacher' && ZS.State.activeRole!=='principal'){
    return '<div class="zs-empty"><i class="fa-solid fa-clipboard-user"></i><p>Your attendance will show here.</p></div>';
  }
  await ZS.loadClasses(); await ZS.loadStudents();
  var today = ZS.todayStr();
  await ZS.loadAttendance(today);
  var classes = ZS.State.data.classes || [];
  if(!classes.length) return ZS.head('Attendance')+'<div class="zs-empty"><i class="fa-solid fa-chalkboard"></i><p>No classes set up. Go to Admin → Classes.</p></div>';
  var sel = ZS.State._selectedClassId || classes[0].id;
  ZS.State._selectedClassId = sel;
  var students = (ZS.State.data.students||[]).filter(function(s){ return s.class_id === sel; });
  var attMap = ZS.State.data.attendance[today] || {};
  var h = ZS.head('Attendance', ZS.fmtDate(today));
  h += '<div class="zs-tabs">';
  classes.forEach(function(c){
    h += '<button class="'+(c.id===sel?'active':'')+'" onclick="ZS.State._selectedClassId=\''+ZS.escape(c.id)+'\';ZS.showView(\'attendance\',null,true)">'+ZS.escape(c.name+(c.section?'-'+c.section:''))+'</button>';
  });
  h += '</div>';
  if(!students.length) return h + '<div class="zs-empty"><i class="fa-solid fa-user-slash"></i><p>No students in this class.</p></div>';
  h += '<div style="display:flex;gap:8px;margin-bottom:12px;">';
  h += '<button class="zs-btn secondary small" style="flex:1;" onclick="ZS.markAll(\'present\')">All Present</button>';
  h += '<button class="zs-btn secondary small" style="flex:1;" onclick="ZS.markAll(\'absent\')">All Absent</button>';
  h += '</div>';
  students.forEach(function(s){
    var cur = attMap[s.id] ? attMap[s.id].status : null;
    h += '<div class="zs-ri">';
    h += '<div style="flex:1;min-width:0;"><div style="font-size:13px;font-weight:700;color:#fff;">'+ZS.escape(s.full_name||'Student')+'</div>';
    h += '<div style="font-size:10px;color:#64748b;">Roll '+ZS.escape(s.roll_number||'-')+'</div></div>';
    h += '<div style="display:flex;gap:4px;">';
    ['present','absent','late','leave'].forEach(function(st){
      var short = st==='present'?'P':st==='absent'?'A':st==='late'?'L':'Lv';
      var bg = cur===st?(st==='present'?'rgba(16,185,129,.2)':st==='absent'?'rgba(161,98,98,.2)':st==='late'?'rgba(161,133,84,.2)':'rgba(59,130,246,.2)'):'transparent';
      var col = cur===st?(st==='present'?'#10b981':st==='absent'?'#a16262':st==='late'?'#a18554':'#60a5fa'):'#94a3b8';
      h += '<button onclick="ZS.setAtt(\''+ZS.escape(s.id)+'\',\''+st+'\')" style="padding:7px 11px;border-radius:8px;border:1px solid '+(cur===st?col:'#1e293b')+';background:'+bg+';color:'+col+';font-size:11px;font-weight:800;cursor:pointer;min-width:38px;">'+short+'</button>';
    });
    h += '</div></div>';
  });
  return h;
};

ZS.setAtt = async function(sid,status){
  ZS.haptic(8);
  var today = ZS.todayStr();
  var s = (ZS.State.data.students||[]).find(function(x){ return x.id === sid; });
  if(!s) return;
  if(!ZS.State.data.attendance[today]) ZS.State.data.attendance[today] = {};
  var exists = ZS.State.data.attendance[today][sid];
  ZS.State.data.attendance[today][sid] = { student_id:sid, status:status, attendance_date:today };
  var c = sb(); if(!c) return;
  try {
    if(exists) await c.from('school_attendance').update({status:status}).eq('student_id',sid).eq('attendance_date',today);
    else {
      var ins = await c.from('school_attendance').insert({student_id:sid,class_id:s.class_id,attendance_date:today,status:status,marked_by:ZS.State.mySchoolUserId});
      if(ins.error && ins.error.code !== '23505'){ ZS.toast('Save failed.','error'); return; }
    }
    ZS.toast((s.full_name||'Student')+' → '+status, status==='present'?'success':status==='absent'?'error':'warning');
    ZS.showView('attendance',null,true);
  } catch(e){ ZS.toast('Failed.','error'); }
};

ZS.markAll = async function(status){
  var cls = ZS.State._selectedClassId;
  var students = (ZS.State.data.students||[]).filter(function(s){ return s.class_id === cls; });
  if(!students.length) return;
  if(!confirm('Mark all '+students.length+' students as '+status+'?')) return;
  var today = ZS.todayStr();
  var c = sb(); if(!c) return;
  var rows = students.map(function(s){ return { student_id:s.id, class_id:cls, attendance_date:today, status:status, marked_by:ZS.State.mySchoolUserId }; });
  try { await c.from('school_attendance').upsert(rows,{onConflict:'student_id,attendance_date'}); ZS.toast('Marked.'); ZS.showView('attendance',null,true); }
  catch(e){ ZS.toast('Failed.','error'); }
};

  });

/* ============ NOTIFICATIONS ============ */
ZS.viewNotifications = async function(){
  await ZS.loadNotifications();
  var list = ZS.State.data.notifications || [];
  var h = ZS.head('Notifications', list.length+' total');
  if(!list.length) return h + '<div class="zs-empty"><i class="fa-solid fa-bell"></i><p>All caught up.</p></div>';
  list.forEach(function(n){
    var kind = n.kind||'';
    var urg = kind.indexOf('absent')!==-1||kind.indexOf('serious')!==-1?'serious':kind.indexOf('late')!==-1?'warning':kind.indexOf('birthday')!==-1?'positive':'info';
    var col = urg==='positive'?'green':urg==='serious'?'red':urg==='warning'?'amber':'blue';
    h += '<div class="zs-card"><div style="font-size:13px;font-weight:700;color:#fff;">'+ZS.escape(n.message||'')+'</div>';
    h += '<div style="display:flex;gap:8px;align-items:center;margin-top:6px;"><span class="zs-chip '+col+'">'+ZS.escape(kind||'info')+'</span><span style="font-size:10px;color:#64748b;">'+ZS.timeAgo(n.created_at)+'</span></div></div>';
  });
  return h;
};

/* ============ FINANCE ============ */
ZS.viewFinance = async function(){
  if(!ZS.State.mySchoolId) return '<div class="zs-empty"><p>Join a school first.</p></div>';
  await ZS.loadFees();
  var fees = ZS.State.data.fees || [];
  var due=0, paid=0;
  fees.forEach(function(f){ var a=Number(f.amount)||0,p=Number(f.paid_amount)||0; paid+=p; due+=Math.max(0,a-p); });
  var h = ZS.head('Finance','Fees & ledger');
  h += '<div class="zs-sg" style="margin-bottom:12px;">';
  h += '<div class="zs-stat"><div class="zs-slabel">Collected</div><div class="zs-svalue" style="color:#10b981;">'+ZS.money(paid)+'</div></div>';
  h += '<div class="zs-stat"><div class="zs-slabel">Outstanding</div><div class="zs-svalue" style="color:#a16262;">'+ZS.money(due)+'</div></div>';
  h += '</div>';
  if(ZS.State.isOwner || ZS.State.activeRole==='admin' || ZS.State.activeRole==='accountant'){
    h += '<button class="zs-btn" onclick="ZS.openCreateFee()"><i class="fa-solid fa-plus"></i> Create Fee Invoice</button>';
  }
  if(!fees.length) return h + '<div class="zs-empty"><i class="fa-solid fa-file-invoice"></i><p>No invoices yet.</p></div>';
  await ZS.loadStudents();
  var sMap = {}; (ZS.State.data.students||[]).forEach(function(s){ sMap[s.id]=s; });
  fees.slice(0,50).forEach(function(f){
    var s = sMap[f.student_id] || {};
    var bal = Math.max(0, (Number(f.amount)||0)-(Number(f.paid_amount)||0));
    var col = f.status==='paid'?'green':f.status==='partial'?'amber':'red';
    h += '<div class="zs-ri">';
    h += '<div style="flex:1;min-width:0;"><div style="font-size:13px;font-weight:800;color:#fff;">'+ZS.escape(s.full_name||'Student')+'</div>';
    h += '<div style="font-size:10px;color:#94a3b8;margin-top:2px;">Due '+ZS.fmtDate(f.due_date)+'</div></div>';
    h += '<div style="text-align:right;"><div style="font-size:13px;font-weight:900;color:'+(bal>0?'#a16262':'#10b981')+';">'+ZS.money(bal,f.currency)+'</div>';
    h += '<span class="zs-chip '+col+'">'+ZS.escape(f.status)+'</span></div></div>';
  });
  return h;
};

ZS.saveProfile = async function(){

    var upd = await c.from('schools').update({
      name: (document.getElementById('ap-name')||{}).value.trim(),
      tagline: (document.getElementById('ap-tag')||{}).value.trim()||null,
      city: (document.getElementById('ap-city')||{}).value.trim()||null,
      country: (document.getElementById('ap-country')||{}).value.trim()||null
    }).eq('id',ZS.State.mySchoolId);
    if(upd.error) throw upd.error;
    ZS.toast('Saved.');
    await ZS.loadSchool();
    ZS.showView('admin',null,true);
  } catch(e){
    ZS.toast('Failed.','error');
    if(btn){ btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-save"></i> Save Profile'; }

};

/* ============ PULL TO REFRESH ============ */
(function(){
  var startY = 0, active = false, threshold = 80;
  document.addEventListener('touchstart', function(e){ if(window.scrollY>5) return; startY = e.touches[0].clientY; active = true; }, {passive:true});
  document.addEventListener('touchend', function(e){
    if(!active) return; active = false;
    var dy = e.changedTouches[0].clientY - startY;
    if(dy > threshold){ ZS.showView(ZS.State.currentView, ZS.State.currentParam, true); }
  }, {passive:true});
})();

/* ============ BOOT ============ */
async function boot(){
  var c = sb();
  if(!c){ setTimeout(boot,300); return; }
  try {
    var s = await c.auth.getSession();
    var user = s && s.data && s.data.session ? s.data.session.user : null;
    if(user){
      var pr = await c.from('profiles').select('*').eq('id',user.id).maybeSingle();
      ZS.State.currentUser = pr.data || {id:user.id,name:user.email,email:user.email};
      await ZS.loadSchool();
      await ZS.loadNotifications();
    }
  } catch(e){}
  setTimeout(function(){ var w = document.getElementById('zs-welcome'); if(w) w.classList.add('fadeout'); },400);
  var lv = 'home';
  try { lv = localStorage.getItem('zs_last_view')||'home'; } catch(e){}
  // ALWAYS start on home — if not in school it will fall through to directory
  ZS.showView('home');
  try {
    c.auth.onAuthStateChange(async function(evt){
      if(evt==='SIGNED_IN'||evt==='SIGNED_OUT'){
        var s2 = await c.auth.getSession();
        var u2 = s2 && s2.data && s2.data.session ? s2.data.session.user : null;
        if(u2){ var pr2 = await c.from('profiles').select('*').eq('id',u2.id).maybeSingle(); ZS.State.currentUser = pr2.data || {id:u2.id,email:u2.email}; await ZS.loadSchool(); await ZS.loadNotifications(); }
        else { ZS.State.currentUser = null; ZS.State.mySchoolId = null; ZS.State.myRoles = []; ZS.State.activeRole = null; ZS.State.isOwner = false; }
        ZS.showView('home', null, true);
      }
    });
  } catch(e){}
  console.log('[ZYNIX School v4] ready');
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded',boot);
else boot();
})();

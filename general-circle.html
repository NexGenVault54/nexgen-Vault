<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>General Room — ZYNIX</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#090d16;color:#f8fafc;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding-bottom:80px;overflow-x:hidden}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:#090d16}
::-webkit-scrollbar-thumb{background:#1e293b;border-radius:4px}

/* Header */
.gr-header{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(9,13,22,.92);backdrop-filter:blur(12px);border-bottom:1px solid #1e293b;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;height:56px;max-width:600px;margin:0 auto}
.gr-logo{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#10b981,#3b82f6);display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;font-size:14px}
.gr-title{font-size:15px;font-weight:900;background:linear-gradient(90deg,#10b981,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent}
.gr-hbtn{background:rgba(30,41,59,.7);border:1px solid #1e293b;color:#cbd5e1;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;justify-content:center}

/* Main */
#app{max-width:600px;margin:0 auto;padding:76px 14px 24px}

/* Banner */
.gr-banner{position:relative;border-radius:16px;overflow:hidden;margin-bottom:14px;min-height:180px;background:linear-gradient(135deg,#10b981,#3b82f6);display:flex;align-items:flex-end;padding:16px}
.gr-banner-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.15) 0%,rgba(0,0,0,.7) 100%);pointer-events:none}
.gr-banner-content{position:relative;z-index:2;display:flex;align-items:center;gap:12px;width:100%}
.gr-banner-av{width:60px;height:60px;border-radius:50%;border:3px solid rgba(255,255,255,.9);object-fit:cover;flex-shrink:0;background:#0f172a}
.gr-banner-info{flex:1;min-width:0}
.gr-banner-name{font-size:17px;font-weight:900;color:#fff;line-height:1.2;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.gr-banner-meta{font-size:11px;color:rgba(255,255,255,.9);margin-top:3px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.gr-banner-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);padding:4px 10px;border-radius:14px;font-size:9.5px;font-weight:900;color:#fff;letter-spacing:.5px;margin-right:6px}
.gr-verify{color:#10b981;font-size:12px}

/* Action row */
.gr-actions{display:flex;gap:8px;margin-bottom:14px}
.gr-join-btn{flex:1;padding:12px;border-radius:12px;border:none;background:linear-gradient(135deg,#10b981,#3b82f6);color:#000;font-weight:900;font-size:13px;cursor:pointer}
.gr-join-btn.joined{background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.4);color:#10b981;cursor:default}
.gr-icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid #1e293b;background:#111827;color:#cbd5e1;cursor:pointer;font-size:15px;flex-shrink:0}

/* Tabs */
.gr-tabs{display:flex;gap:4px;background:#0f172a;border:1px solid #1e293b;border-radius:14px;padding:4px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.gr-tabs::-webkit-scrollbar{display:none}
.gr-tab{flex:1;min-width:70px;padding:10px 8px;border-radius:10px;border:none;background:transparent;color:#94a3b8;font-weight:900;font-size:11px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.gr-tab.active{background:rgba(16,185,129,.15);color:#10b981;border:1px solid rgba(16,185,129,.4)}

/* Cards */
.gr-card{background:#111827;border:1px solid #1e293b;border-radius:16px;padding:14px;margin-bottom:12px}

/* Feed */
.gr-post{background:#111827;border:1px solid #1e293b;border-radius:16px;padding:14px;margin-bottom:12px}
.gr-post-head{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.gr-post-head img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:1px solid #1e293b}
.gr-post-name{font-weight:800;font-size:13px;color:#fff}
.gr-post-handle{font-size:10px;color:#64748b}
.gr-post-content{font-size:13.5px;color:#e2e8f0;line-height:1.7;margin-bottom:10px;white-space:pre-wrap;padding:12px 16px;border-radius:10px;background:rgba(15,23,42,.35)}
.gr-post-reactions{display:flex;flex-wrap:wrap;gap:4px;padding:8px 0;border-top:1px solid #1e293b;align-items:center}
.gr-react{padding:4px 8px;border-radius:14px;font-size:14px;background:transparent;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:3px;color:#fff}
.gr-react:hover{background:#1e293b}
.gr-react.active{background:rgba(16,185,129,.15);border-color:rgba(16,185,129,.3)}
.gr-react .count{font-size:10px;color:#64748b;font-weight:700}
.gr-post-actions{display:flex;gap:16px;padding-top:8px;border-top:1px solid #1e293b;font-size:12px;color:#64748b}
.gr-post-actions button{background:transparent;border:none;color:#64748b;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:5px;font-weight:700}
.gr-pinned{font-size:8.5px;font-weight:900;padding:2px 8px;border-radius:10px;background:rgba(161,133,84,.15);color:#a18554;border:1px solid rgba(161,133,84,.4);margin-left:6px}

/* Members */
.gr-members{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gr-member{background:#111827;border:1px solid #1e293b;border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px}
.gr-member img{width:38px;height:38px;border-radius:50%;object-fit:cover;flex-shrink:0}
.gr-member-name{font-size:12.5px;font-weight:800;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gr-member-role{font-size:10px;color:#94a3b8;margin-top:2px}

/* Media */
.gr-media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gr-media-tile{aspect-ratio:1;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,#1e293b,#0f172a);display:flex;align-items:center;justify-content:center;color:#334155;font-size:22px;cursor:pointer}

/* Events */
.gr-event{background:#111827;border:1px solid #1e293b;border-radius:14px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center}
.gr-event-date{width:52px;height:52px;border-radius:12px;background:linear-gradient(135deg,#10b981,#3b82f6);color:#000;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;line-height:1.1}
.gr-event-day{font-size:18px}
.gr-event-info{flex:1;min-width:0}
.gr-event-title{font-size:13.5px;font-weight:800;color:#fff;margin-bottom:3px}
.gr-event-meta{font-size:11px;color:#94a3b8}

/* Live */
.gr-live-card{background:linear-gradient(135deg,rgba(16,185,129,.10),rgba(59,130,246,.06));border:1px solid rgba(16,185,129,.35);border-radius:16px;padding:20px;text-align:center;margin-bottom:12px}
.gr-live-icon{width:64px;height:64px;border-radius:50%;background:rgba(16,185,129,.15);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;color:#10b981;font-size:26px}
.gr-live-title{font-size:16px;font-weight:900;color:#fff;margin-bottom:6px}
.gr-live-desc{font-size:12px;color:#cbd5e1;line-height:1.6;margin-bottom:14px}
.gr-live-btn{width:100%;padding:12px;border-radius:12px;border:none;background:linear-gradient(135deg,#10b981,#3b82f6);color:#000;font-weight:900;font-size:13px;cursor:pointer;margin-top:8px}
.gr-live-btn.secondary{background:rgba(59,130,246,.10);border:1px solid rgba(59,130,246,.4);color:#60a5fa}
.gr-live-locked{opacity:.5;pointer-events:none}
.gr-locked-tag{font-size:9.5px;color:#fbbf24;font-weight:900;margin-top:6px;letter-spacing:.5px}

/* About */
.gr-about-row{padding:12px 0;border-bottom:1px solid #1e293b}
.gr-about-row:last-child{border-bottom:none}
.gr-about-lbl{font-size:10px;color:#94a3b8;font-weight:900;letter-spacing:.5px;margin-bottom:6px;text-transform:uppercase}
.gr-about-val{font-size:12.5px;color:#e2e8f0;line-height:1.6}
.gr-rules{font-size:12px;color:#cbd5e1;line-height:1.8;white-space:pre-wrap}

/* Composer */
.gr-composer{background:#111827;border:1px solid #1e293b;border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center;cursor:pointer;margin-bottom:14px}
.gr-composer img{width:38px;height:38px;border-radius:50%;object-fit:cover}
.gr-composer-input{flex:1;background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:10px 14px;font-size:12px;color:#94a3b8}

/* Empty */
.gr-empty{text-align:center;padding:60px 20px;color:#64748b}
.gr-empty i{font-size:40px;color:#334155;display:block;margin-bottom:14px}
.gr-empty p{font-size:13px}

/* Bottom nav */
.gr-footer{position:fixed;bottom:0;left:0;right:0;z-index:1000;background:rgba(9,13,22,.95);backdrop-filter:blur(12px);border-top:1px solid #1e293b;padding:8px 0;display:flex;align-items:center;justify-content:space-around;max-width:600px;margin:0 auto}
.gr-footer button{flex:1;display:flex;flex-direction:column;align-items:center;padding:6px 0;color:#64748b;background:transparent;border:none;font-size:9px;cursor:pointer;font-weight:600;gap:3px}
.gr-footer button i{font-size:18px}
.gr-footer button.active{color:#10b981}

@media(max-width:400px){
  .gr-banner-name{font-size:15px}
  .gr-tab{font-size:10px;padding:8px 6px;min-width:60px}
}
</style>
</head>
<body>

<!-- Header -->
<header class="gr-header">
  <div style="display:flex;align-items:center;gap:8px;background:transparent;border:none;">
    <div class="gr-logo">Z</div>
    <span class="gr-title">ZYNIX ROOMS</span>
  </div>
  <div style="display:flex;align-items:center;gap:8px;">
    <button class="gr-hbtn"><i class="fa-solid fa-bell"></i></button>
    <img src="https://ui-avatars.com/api/?name=Ahmed&background=111827&color=34d399" class="gr-banner-av" style="width:28px;height:28px;border:1px solid rgba(16,185,129,.5);">
  </div>
</header>

<main id="app">

  <!-- Banner -->
  <div class="gr-banner">
    <div class="gr-banner-overlay"></div>
    <div class="gr-banner-content">
      <img src="https://ui-avatars.com/api/?name=Karachi+Entrepreneurs&background=0f172a&color=34d399&size=200" class="gr-banner-av">
      <div class="gr-banner-info">
        <div style="margin-bottom:4px;">
          <span class="gr-banner-badge"><i class="fa-solid fa-handshake"></i> MEET · Networking</span>
        </div>
        <div class="gr-banner-name">Karachi Entrepreneurs <i class="fa-solid fa-circle-check gr-verify"></i></div>
        <div class="gr-banner-meta">🌐 Public · 12.4K members · 340 posts this week</div>
      </div>
    </div>
  </div>

  <!-- Actions -->
  <div class="gr-actions">
    <button class="gr-join-btn joined"><i class="fa-solid fa-check"></i> Joined</button>
    <button class="gr-icon-btn"><i class="fa-solid fa-bell"></i></button>
    <button class="gr-icon-btn"><i class="fa-solid fa-share-nodes"></i></button>
    <button class="gr-icon-btn"><i class="fa-solid fa-ellipsis-vertical"></i></button>
  </div>

  <!-- Tabs -->
  <div class="gr-tabs" id="tabs">
    <button class="gr-tab active" data-tab="feed"><i class="fa-solid fa-house"></i> Feed</button>
    <button class="gr-tab" data-tab="members"><i class="fa-solid fa-users"></i> Members</button>
    <button class="gr-tab" data-tab="media"><i class="fa-solid fa-images"></i> Media</button>
    <button class="gr-tab" data-tab="events"><i class="fa-solid fa-calendar-check"></i> Events</button>
    <button class="gr-tab" data-tab="live"><i class="fa-solid fa-video"></i> Live</button>
    <button class="gr-tab" data-tab="about"><i class="fa-solid fa-circle-info"></i> About</button>
  </div>

  <!-- Content -->
  <div id="content"></div>

</main>

<!-- Bottom nav -->
<nav class="gr-footer">
  <button><i class="fa-solid fa-house"></i><span>Home</span></button>
  <button><i class="fa-solid fa-user"></i><span>Profile</span></button>
  <button class="active"><i class="fa-solid fa-users"></i><span>Rooms</span></button>
  <button><i class="fa-solid fa-store"></i><span>Market</span></button>
  <button><i class="fa-solid fa-wallet"></i><span>Wallet</span></button>
</nav>

<script>
/* ============================================================
   SAMPLE DATA — for demo only
   ============================================================ */
var SAMPLE = {
  feed: [
    { name:'Sara Ahmed', handle:'@sara', time:'2m ago', pinned:true,
      content:'Welcome everyone to the Karachi Entrepreneurs Room! 🎉\n\nThis is our space to share opportunities, ask questions, and grow together. Introduce yourself below 👇',
      reactions:{love:42,flower:18,spark:23,clap:12,star:8} },
    { name:'Bilal Khan', handle:'@bilal', time:'15m ago', pinned:false,
      content:'Just closed a $50K deal with a client from Dubai. AMA about how I found them and what worked.',
      reactions:{love:88,flower:34,spark:56,clap:24,star:12} },
    { name:'Ayesha Malik', handle:'@ayesha', time:'1h ago', pinned:false,
      content:'Reminder: Weekly networking meetup is this Friday 7 PM at Dolmen Mall food court. Open to all members. Bring your business cards!',
      reactions:{love:34,flower:12,spark:19,clap:8,star:5} },
    { name:'Hassan Raza', handle:'@hassan', time:'3h ago', pinned:false,
      content:'Question for the group: What is the best way to register a private limited company in Pakistan? Any recommended lawyers?',
      reactions:{love:8,flower:3,spark:14,clap:2,star:6} }
  ],
  members: [
    { name:'Sara Ahmed', handle:'@sara', role:'Owner', avatar:'SA', color:'#10b981' },
    { name:'Bilal Khan', handle:'@bilal', role:'Moderator', avatar:'BK', color:'#3b82f6' },
    { name:'Ayesha Malik', handle:'@ayesha', role:'Member', avatar:'AM', color:'#8b5cf6' },
    { name:'Hassan Raza', handle:'@hassan', role:'Member', avatar:'HR', color:'#f59e0b' },
    { name:'Fatima Ali', handle:'@fatima', role:'Member', avatar:'FA', color:'#ec4899' },
    { name:'Usman Tariq', handle:'@usman', role:'Member', avatar:'UT', color:'#06b6d4' },
    { name:'Zara Sheikh', handle:'@zara', role:'Member', avatar:'ZS', color:'#a855f7' },
    { name:'Omar Javed', handle:'@omar', role:'Member', avatar:'OJ', color:'#22c55e' }
  ],
  events: [
    { day:'18', month:'OCT', title:'Weekly Networking Meetup', meta:'Friday, 7:00 PM · Dolmen Mall Food Court', attendees:45 },
    { day:'25', month:'OCT', title:'Startup Pitch Night', meta:'Friday, 8:00 PM · Online (Zoom)', attendees:120 },
    { day:'02', month:'NOV', title:'Q4 Business Planning Workshop', meta:'Saturday, 3:00 PM · Regus, Clifton', attendees:32 }
  ],
  about: {
    description: 'A community of entrepreneurs, freelancers, and business owners based in Karachi. We share opportunities, help each other grow, and meet up regularly.',
    rules: '1. Be respectful. No personal attacks.\n2. No spam or self-promotion without admin approval.\n3. Keep discussions relevant to business and entrepreneurship.\n4. No political or religious debates.\n5. Report issues to moderators.'
  }
};

/* ============================================================
   TAB RENDERING
   ============================================================ */
function renderFeed(){
  var h = '';
  h += '<div class="gr-composer"><img src="https://ui-avatars.com/api/?name=You&background=111827&color=34d399"><div class="gr-composer-input">Share something with the room…</div><i class="fa-solid fa-pen-to-square" style="color:#10b981;font-size:15px;"></i></div>';
  SAMPLE.feed.forEach(function(p){
    var initials = p.name.split(' ').map(function(x){return x[0];}).join('');
    var avatarUrl = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(p.name) + '&background=111827&color=34d399';
    h += '<div class="gr-post">';
    h += '<div class="gr-post-head">';
    h += '<img src="' + avatarUrl + '">';
    h += '<div style="flex:1;min-width:0;">';
    h += '<div class="gr-post-name">' + p.name + (p.pinned ? '<span class="gr-pinned"><i class="fa-solid fa-thumbtack"></i> PINNED</span>' : '') + '</div>';
    h += '<div class="gr-post-handle">' + p.handle + ' · ' + p.time + '</div>';
    h += '</div>';
    h += '</div>';
    h += '<div class="gr-post-content">' + p.content.replace(/\n/g,'<br>') + '</div>';
    h += '<div class="gr-post-reactions">';
    var symbols = {love:'❤️',flower:'🌹',spark:'🔥',clap:'👏',star:'⭐'};
    Object.keys(p.reactions).forEach(function(k){
      h += '<button class="gr-react"><span>' + symbols[k] + '</span><span class="count">' + p.reactions[k] + '</span></button>';
    });
    h += '</div>';
    h += '<div class="gr-post-actions">';
    h += '<button><i class="fa-regular fa-comment"></i> Comment</button>';
    h += '<button><i class="fa-solid fa-share-nodes"></i> Share</button>';
    h += '</div>';
    h += '</div>';
  });
  return h;
}

function renderMembers(){
  var h = '<div class="gr-members">';
  SAMPLE.members.forEach(function(m){
    h += '<div class="gr-member">';
    h += '<div style="width:38px;height:38px;border-radius:50%;background:' + m.color + '22;color:' + m.color + ';display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex-shrink:0;">' + m.avatar + '</div>';
    h += '<div style="flex:1;min-width:0;">';
    h += '<div class="gr-member-name">' + m.name + '</div>';
    h += '<div class="gr-member-role">' + m.role + '</div>';
    h += '</div>';
    h += '</div>';
  });
  h += '</div>';
  return h;
}

function renderMedia(){
  var h = '<div class="gr-media-grid">';
  for(var i = 0; i < 12; i++){
    h += '<div class="gr-media-tile"><i class="fa-solid fa-image"></i></div>';
  }
  h += '</div>';
  return h;
}

function renderEvents(){
  var h = '';
  SAMPLE.events.forEach(function(e){
    h += '<div class="gr-event">';
    h += '<div class="gr-event-date"><span class="gr-event-day">' + e.day + '</span><span>' + e.month + '</span></div>';
    h += '<div class="gr-event-info">';
    h += '<div class="gr-event-title">' + e.title + '</div>';
    h += '<div class="gr-event-meta">' + e.meta + '</div>';
    h += '<div class="gr-event-meta" style="margin-top:4px;color:#10b981;font-weight:800;">' + e.attendees + ' going</div>';
    h += '</div>';
    h += '<i class="fa-solid fa-chevron-right" style="color:#475569;"></i>';
    h += '</div>';
  });
  return h;
}

function renderLive(){
  var h = '';
  /* Free Live Stream */
  h += '<div class="gr-live-card">';
  h += '<div class="gr-live-icon"><i class="fa-solid fa-satellite-dish"></i></div>';
  h += '<div class="gr-live-title">🎥 Live Stream</div>';
  h += '<div class="gr-live-desc">Broadcast to your members. They watch and chat in real time.<br>Free for all owners. Unlimited viewers.</div>';
  h += '<button class="gr-live-btn"><i class="fa-solid fa-video"></i> Start Live Stream</button>';
  h += '</div>';

  /* Interactive Conference */
  h += '<div class="gr-live-card">';
  h += '<div class="gr-live-icon" style="background:rgba(59,130,246,.15);color:#60a5fa;"><i class="fa-solid fa-people-group"></i></div>';
  h += '<div class="gr-live-title">🎤 Interactive Conference</div>';
  h += '<div class="gr-live-desc">Multi-speaker meeting with hand raise, screen share, and camera.<br>For business meetings, panels, workshops.</div>';
  h += '<button class="gr-live-btn secondary gr-live-locked"><i class="fa-solid fa-lock"></i> Pro tier only</button>';
  h += '<div class="gr-locked-tag">Upgrade to Pro ($25/mo) to unlock</div>';
  h += '</div>';

  /* Recordings */
  h += '<div class="gr-live-card" style="background:#111827;border-color:#1e293b;">';
  h += '<div class="gr-live-icon" style="background:rgba(139,92,246,.15);color:#a78bfa;width:44px;height:44px;font-size:18px;"><i class="fa-solid fa-film"></i></div>';
  h += '<div class="gr-live-title" style="font-size:14px;margin-top:8px;">Past Recordings</div>';
  h += '<div class="gr-live-desc" style="font-size:11px;">No recordings yet. Streams are saved automatically.</div>';
  h += '</div>';

  return h;
}

function renderAbout(){
  var h = '';
  h += '<div class="gr-card">';
  h += '<div class="gr-about-row">';
  h += '<div class="gr-about-lbl">Description</div>';
  h += '<div class="gr-about-val">' + SAMPLE.about.description + '</div>';
  h += '</div>';
  h += '<div class="gr-about-row">';
  h += '<div class="gr-about-lbl">Owner</div>';
  h += '<div style="display:flex;align-items:center;gap:10px;">';
  h += '<img src="https://ui-avatars.com/api/?name=Sara+Ahmed&background=111827&color=34d399" style="width:38px;height:38px;border-radius:50%;">';
  h += '<div><div style="font-size:13px;font-weight:800;color:#fff;">Sara Ahmed</div><div style="font-size:10.5px;color:#94a3b8;">@sara · Owner</div></div>';
  h += '</div>';
  h += '</div>';
  h += '<div class="gr-about-row">';
  h += '<div class="gr-about-lbl">Category</div>';
  h += '<div class="gr-about-val"><i class="fa-solid fa-handshake" style="color:#10b981;"></i> Meet · Networking</div>';
  h += '</div>';
  h += '<div class="gr-about-row">';
  h += '<div class="gr-about-lbl">Room Rules</div>';
  h += '<div class="gr-rules">' + SAMPLE.about.rules.replace(/\n/g,'<br>') + '</div>';
  h += '</div>';
  h += '<div class="gr-about-row">';
  h += '<div class="gr-about-lbl">Created</div>';
  h += '<div class="gr-about-val">15 September 2024 · Public Room</div>';
  h += '</div>';
  h += '</div>';
  return h;
}

/* ============================================================
   TAB SWITCHING
   ============================================================ */
function paint(tab){
  var content = document.getElementById('content');
  if(tab === 'feed') content.innerHTML = renderFeed();
  else if(tab === 'members') content.innerHTML = renderMembers();
  else if(tab === 'media') content.innerHTML = renderMedia();
  else if(tab === 'events') content.innerHTML = renderEvents();
  else if(tab === 'live') content.innerHTML = renderLive();
  else if(tab === 'about') content.innerHTML = renderAbout();

  document.querySelectorAll('.gr-tab').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-tab') === tab);
  });
}

document.querySelectorAll('.gr-tab').forEach(function(b){
  b.addEventListener('click', function(){
    paint(this.getAttribute('data-tab'));
  });
});

/* Initial paint */
paint('feed');
</script>

<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ZYNIX Rooms</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#090d16;color:#f8fafc;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding-bottom:80px;overflow-x:hidden}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:#090d16}
::-webkit-scrollbar-thumb{background:#1e293b;border-radius:4px}

.gr-header{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(9,13,22,.92);backdrop-filter:blur(12px);border-bottom:1px solid #1e293b;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;height:56px;max-width:600px;margin:0 auto}
.gr-logo{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#10b981,#3b82f6);display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;font-size:14px}
.gr-title{font-size:15px;font-weight:900;background:linear-gradient(90deg,#10b981,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent}
.gr-hbtn{background:rgba(30,41,59,.7);border:1px solid #1e293b;color:#cbd5e1;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;justify-content:center;position:relative}
#app{max-width:600px;margin:0 auto;padding:76px 14px 24px}

/* DEMO room type switcher */
.gr-type-switch{display:flex;gap:4px;background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:4px;margin-bottom:12px}
.gr-type-btn{flex:1;padding:8px 6px;border-radius:8px;border:none;background:transparent;color:#94a3b8;font-weight:900;font-size:11px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px}
.gr-type-btn.active{background:rgba(16,185,129,.15);color:#10b981}

/* Banner */
.gr-banner{position:relative;border-radius:16px;overflow:hidden;margin-bottom:12px;min-height:200px;background:linear-gradient(135deg,#10b981,#3b82f6);display:flex;align-items:flex-end;padding:16px}
.gr-banner-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.1) 0%,rgba(0,0,0,.7) 100%);pointer-events:none}
.gr-banner-content{position:relative;z-index:2;display:flex;align-items:center;gap:12px;width:100%}
.gr-banner-av{width:64px;height:64px;border-radius:50%;border:3px solid rgba(255,255,255,.9);object-fit:cover;flex-shrink:0;background:#0f172a}
.gr-banner-info{flex:1;min-width:0}
.gr-banner-name{font-size:18px;font-weight:900;color:#fff;line-height:1.2;text-shadow:0 2px 8px rgba(0,0,0,.7)}
.gr-banner-meta{font-size:11px;color:rgba(255,255,255,.92);margin-top:3px;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.gr-banner-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);padding:4px 10px;border-radius:14px;font-size:9.5px;font-weight:900;color:#fff;letter-spacing:.5px}
.gr-verify{color:#10b981}

.gr-actions{display:flex;gap:8px;margin-bottom:12px}
.gr-join-btn{flex:1;padding:12px;border-radius:12px;border:none;background:linear-gradient(135deg,#10b981,#3b82f6);color:#000;font-weight:900;font-size:13px;cursor:pointer}
.gr-join-btn.joined{background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.4);color:#10b981}
.gr-icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid #1e293b;background:#111827;color:#cbd5e1;cursor:pointer;font-size:15px;flex-shrink:0}

.gr-tabs{display:flex;gap:4px;background:#0f172a;border:1px solid #1e293b;border-radius:14px;padding:4px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.gr-tabs::-webkit-scrollbar{display:none}
.gr-tab{flex:1;min-width:72px;padding:10px 8px;border-radius:10px;border:none;background:transparent;color:#94a3b8;font-weight:900;font-size:11px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
.gr-tab.active{background:rgba(16,185,129,.15);color:#10b981;border:1px solid rgba(16,185,129,.4)}

/* Composer */
.gr-composer{background:#111827;border:1px solid #1e293b;border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center;cursor:pointer;margin-bottom:14px}
.gr-composer img{width:38px;height:38px;border-radius:50%;object-fit:cover;flex-shrink:0}
.gr-composer-input{flex:1;background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:10px 14px;font-size:12px;color:#94a3b8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Post */
.gr-post{background:#111827;border:1px solid #1e293b;border-radius:16px;padding:14px;margin-bottom:12px}
.gr-post-head{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.gr-post-head img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:1px solid #1e293b}
.gr-post-name{font-weight:800;font-size:13px;color:#fff;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.gr-post-handle{font-size:10px;color:#64748b}
.gr-badge-author{font-size:8.5px;font-weight:900;padding:2px 7px;border-radius:10px;background:linear-gradient(135deg,#10b981,#3b82f6);color:#000}
.gr-pinned{font-size:8.5px;font-weight:900;padding:2px 7px;border-radius:10px;background:rgba(161,133,84,.15);color:#a18554;border:1px solid rgba(161,133,84,.4)}
.gr-post-content{font-size:13.5px;color:#e2e8f0;line-height:1.7;margin-bottom:10px;white-space:pre-wrap;padding:12px 16px;border-radius:10px;background:rgba(15,23,42,.35)}
.gr-post-media{border-radius:12px;overflow:hidden;margin-bottom:10px;background:#000}
.gr-post-media img,.gr-post-media video{width:100%;height:auto;max-height:400px;object-fit:contain;display:block;background:#000}
.gr-post-reactions{display:flex;flex-wrap:wrap;gap:4px;padding:8px 0;border-top:1px solid #1e293b;align-items:center}
.gr-react{padding:4px 8px;border-radius:14px;font-size:14px;background:transparent;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:3px;color:#fff}
.gr-react:hover{background:#1e293b}
.gr-react.active{background:rgba(16,185,129,.15);border-color:rgba(16,185,129,.3)}
.gr-react .count{font-size:10px;color:#64748b;font-weight:700}
.gr-react.active .count{color:#10b981}
.gr-react .bounty{font-size:9px;color:#10b981;font-weight:700;margin-left:1px}
.gr-post-actions{display:flex;gap:16px;padding-top:8px;border-top:1px solid #1e293b;font-size:12px;color:#64748b;flex-wrap:wrap}
.gr-post-actions button{background:transparent;border:none;color:#64748b;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:5px;font-weight:700}

/* Comments */
.gr-comments{margin-top:10px;padding-top:10px;border-top:1px solid #1e293b;display:none}
.gr-comments.open{display:block}
.gr-comment{padding:10px 12px;border-radius:12px;margin-bottom:6px;font-size:12px;word-break:break-word}
.gr-comment.light-green{background:#dcfce7;color:#052e16}
.gr-comment.light-blue{background:#dbeafe;color:#172554}
.gr-comment.light-yellow{background:#fef3c7;color:#451a03}
.gr-comment.light-pink{background:#fce7f3;color:#500724}
.gr-comment.light-purple{background:#ede9fe;color:#2e1065}
.gr-comment .cname{font-weight:700;margin-right:6px;opacity:.9;cursor:pointer}
.gr-comment-input{display:flex;gap:8px;margin-top:8px;align-items:flex-end}
.gr-comment-input textarea{flex:1;background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:10px 12px;font-size:12px;color:#fff;outline:none;resize:none;max-height:150px;font-family:inherit;min-height:38px}
.gr-comment-input button{background:#10b981;border:none;color:#000;font-weight:700;padding:8px 16px;border-radius:8px;font-size:11px;cursor:pointer;height:38px}

/* Members */
.gr-search{width:100%;background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:11px 14px;font-size:13px;color:#fff;outline:none;box-sizing:border-box;margin-bottom:12px}
.gr-members{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gr-member{background:#111827;border:1px solid #1e293b;border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px}
.gr-member-av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex-shrink:0;position:relative}
.gr-member-av .online{position:absolute;bottom:0;right:0;width:10px;height:10px;border-radius:50%;background:#10b981;border:2px solid #111827}
.gr-member-name{font-size:12.5px;font-weight:800;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gr-member-role{font-size:10px;color:#94a3b8;margin-top:2px}

/* Media */
.gr-media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gr-media-tile{aspect-ratio:1;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,#1e293b,#0f172a);display:flex;align-items:center;justify-content:center;color:#334155;font-size:22px;cursor:pointer}
.gr-media-tile img{width:100%;height:100%;object-fit:cover}

/* Events */
.gr-event{background:#111827;border:1px solid #1e293b;border-radius:14px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;position:relative}
.gr-event-date{width:54px;height:54px;border-radius:12px;background:linear-gradient(135deg,#10b981,#3b82f6);color:#000;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;line-height:1.1}
.gr-event-day{font-size:19px;line-height:1}
.gr-event-info{flex:1;min-width:0}
.gr-event-title{font-size:13.5px;font-weight:800;color:#fff;margin-bottom:3px}
.gr-event-meta{font-size:11px;color:#94a3b8}
.gr-event-going{font-size:11px;color:#10b981;font-weight:800;margin-top:4px}
.gr-event-del{position:absolute;top:10px;right:10px;background:transparent;border:none;color:#a16262;cursor:pointer;font-size:12px;padding:4px}

/* Live */
.gr-live-card{background:linear-gradient(135deg,rgba(16,185,129,.10),rgba(59,130,246,.06));border:1px solid rgba(16,185,129,.35);border-radius:16px;padding:20px;text-align:center;margin-bottom:12px}
.gr-live-card.locked{background:linear-gradient(135deg,rgba(251,191,36,.08),rgba(236,72,153,.06));border-color:rgba(251,191,36,.35)}
.gr-live-icon{width:64px;height:64px;border-radius:50%;background:rgba(16,185,129,.15);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;color:#10b981;font-size:26px}
.gr-live-card.locked .gr-live-icon{background:rgba(251,191,36,.15);color:#fbbf24}
.gr-live-title{font-size:16px;font-weight:900;color:#fff;margin-bottom:6px}
.gr-live-desc{font-size:12px;color:#cbd5e1;line-height:1.65;margin-bottom:14px}
.gr-live-btn{width:100%;padding:13px;border-radius:12px;border:none;background:linear-gradient(135deg,#10b981,#3b82f6);color:#000;font-weight:900;font-size:13px;cursor:pointer;margin-top:8px}
.gr-live-btn.secondary{background:rgba(59,130,246,.10);border:1px solid rgba(59,130,246,.4);color:#60a5fa}
.gr-live-btn.gold{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#000}
.gr-live-btn.danger{background:linear-gradient(135deg,#a16262,#7f1d1d);color:#fff}
.gr-locked-tag{font-size:10px;color:#fbbf24;font-weight:900;margin-top:8px;letter-spacing:.5px}

/* Video call UI (Meet + Live) */
.gr-call{position:fixed;inset:0;z-index:9999;background:#000;display:flex;flex-direction:column}
.gr-call-head{padding:14px 16px;background:rgba(0,0,0,.75);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid rgba(255,255,255,.08);flex-shrink:0}
.gr-call-head-title{font-size:13px;font-weight:900;color:#fff;display:flex;align-items:center;gap:8px}
.gr-call-live{display:inline-flex;align-items:center;gap:5px;background:#a16262;padding:3px 9px;border-radius:12px;font-size:9.5px;font-weight:900;color:#fff}
.gr-call-live::before{content:'';width:6px;height:6px;border-radius:50%;background:#fff;animation:grPulse 1.2s infinite}
@keyframes grPulse{0%,100%{opacity:1}50%{opacity:.3}}
.gr-call-grid{flex:1;display:grid;grid-template-columns:repeat(2,1fr);grid-auto-rows:min-content;gap:8px;padding:12px;overflow-y:auto;align-content:start}
.gr-call-tile{position:relative;aspect-ratio:3/4;background:linear-gradient(135deg,#1e293b,#0f172a);border-radius:14px;overflow:hidden;display:flex;align-items:center;justify-content:center;border:2px solid #1e293b}
.gr-call-tile.speaking{border-color:#10b981;box-shadow:0 0 20px rgba(16,185,129,.4)}
.gr-call-tile.mine{border-color:rgba(59,130,246,.5)}
.gr-call-tile .av{width:72px;height:72px;border-radius:50%;background:linear-gradient(135deg,#10b981,#3b82f6);display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;font-size:26px}
.gr-call-tile .lbl{position:absolute;bottom:8px;left:8px;right:8px;background:rgba(0,0,0,.65);backdrop-filter:blur(8px);padding:5px 10px;border-radius:10px;font-size:10.5px;font-weight:800;color:#fff;display:flex;align-items:center;gap:5px;justify-content:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gr-call-tile .hand{position:absolute;top:8px;right:8px;background:rgba(251,191,36,.9);color:#000;padding:3px 8px;border-radius:10px;font-size:11px;font-weight:900}
.gr-call-tile .mute{position:absolute;top:8px;left:8px;background:rgba(161,98,98,.9);color:#fff;padding:3px 8px;border-radius:10px;font-size:10px}
.gr-call-controls{padding:14px 16px 22px;background:rgba(0,0,0,.85);backdrop-filter:blur(12px);border-top:1px solid rgba(255,255,255,.08);display:flex;justify-content:center;gap:10px;flex-shrink:0}
.gr-call-btn{width:52px;height:52px;border-radius:50%;border:1px solid rgba(255,255,255,.15);background:rgba(30,41,59,.9);color:#cbd5e1;cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.gr-call-btn:hover{background:rgba(51,65,85,.9)}
.gr-call-btn.active{background:rgba(16,185,129,.2);border-color:#10b981;color:#10b981}
.gr-call-btn.danger{background:rgba(161,98,98,.2);border-color:rgba(161,98,98,.5);color:#c9a5a5;width:auto;padding:0 24px;border-radius:26px;font-weight:900;font-size:12px;gap:8px}
.gr-call-btn.danger:hover{background:rgba(161,98,98,.35)}

/* Meet room layout */
.gr-meet-hero{background:linear-gradient(135deg,rgba(16,185,129,.12),rgba(59,130,246,.08));border:1px solid rgba(16,185,129,.35);border-radius:16px;padding:24px;text-align:center;margin-bottom:14px}
.gr-meet-icon{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#10b981,#3b82f6);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:#000;font-size:32px}
.gr-meet-title{font-size:18px;font-weight:900;color:#fff;margin-bottom:6px}
.gr-meet-sub{font-size:12px;color:#cbd5e1;line-height:1.6;margin-bottom:16px}
.gr-meet-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.gr-meet-btn{flex:1;min-width:140px;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#10b981,#3b82f6);color:#000;font-weight:900;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.gr-meet-btn.secondary{background:#111827;border:1px solid #1e293b;color:#cbd5e1}
.gr-meet-btn.gold{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#000}

/* About */
.gr-card{background:#111827;border:1px solid #1e293b;border-radius:16px;padding:14px;margin-bottom:12px}
.gr-about-row{padding:12px 0;border-bottom:1px solid #1e293b}
.gr-about-row:last-child{border-bottom:none}
.gr-about-lbl{font-size:10px;color:#94a3b8;font-weight:900;letter-spacing:.5px;margin-bottom:6px;text-transform:uppercase}
.gr-about-val{font-size:12.5px;color:#e2e8f0;line-height:1.65}
.gr-rules{font-size:12px;color:#cbd5e1;line-height:1.85;white-space:pre-wrap}

/* Sheet */
.gr-sheet-overlay{position:fixed;inset:0;z-index:10002;background:rgba(0,0,0,.85);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center}
.gr-sheet{background:#111827;border-top-left-radius:20px;border-top-right-radius:20px;border-top:1px solid #1e293b;width:100%;max-width:600px;max-height:92vh;display:flex;flex-direction:column;animation:grSheetUp .25s ease}
@keyframes grSheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.gr-sheet-handle{width:40px;height:4px;background:#334155;border-radius:2px;margin:8px auto 0;flex-shrink:0}
.gr-sheet-header{padding:12px 16px;border-bottom:1px solid #1e293b;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.gr-sheet-header h3{font-size:14px;font-weight:900;color:#fff}
.gr-sheet-close{background:transparent;border:none;color:#94a3b8;font-size:20px;cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.gr-sheet-body{padding:14px 16px;overflow-y:auto;flex:1}

/* Form */
.gr-label{display:block;font-size:11px;color:#94a3b8;font-weight:800;margin-bottom:5px;margin-top:12px}
.gr-input,.gr-textarea{width:100%;background:#0f172a;border:1px solid #1e293b;border-radius:10px;padding:12px;font-size:13px;color:#fff;outline:none;font-family:inherit;box-sizing:border-box}
.gr-input:focus,.gr-textarea:focus{border-color:#10b981}
.gr-textarea{min-height:90px;resize:vertical}
.gr-banner-picker{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.gr-banner-picker::-webkit-scrollbar{display:none}
.gr-banner-swatch{flex-shrink:0;width:56px;height:56px;border-radius:12px;cursor:pointer;border:2px solid rgba(255,255,255,.06)}
.gr-banner-swatch.active{border-color:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.22)}

/* Media preview in composer */
.gr-media-preview{position:relative;border-radius:12px;overflow:hidden;margin-top:10px;background:#000;display:none}
.gr-media-preview.show{display:block}
.gr-media-preview img,.gr-media-preview video{width:100%;max-height:240px;object-fit:contain;display:block;background:#000}
.gr-media-remove{position:absolute;top:8px;right:8px;background:rgba(161,98,98,.95);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:20px;padding:6px 14px;font-size:11px;font-weight:800;cursor:pointer}

/* Toast */
.gr-toastc{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);z-index:2147483647;width:90%;max-width:380px;pointer-events:none}
.gr-toast{background:rgba(17,24,39,.96);border:1px solid rgba(16,185,129,.3);color:#f8fafc;padding:12px 14px;border-radius:12px;font-size:12px;margin-bottom:6px;backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;opacity:0;transform:translateY(10px);transition:all .25s}
.gr-toast.show{opacity:1;transform:translateY(0)}
.gr-toast i{color:#10b981}

/* Footer */
.gr-footer{position:fixed;bottom:0;left:0;right:0;z-index:1000;background:rgba(9,13,22,.95);backdrop-filter:blur(12px);border-top:1px solid #1e293b;padding:8px 0;display:flex;align-items:center;justify-content:space-around;max-width:600px;margin:0 auto}
.gr-footer button{flex:1;display:flex;flex-direction:column;align-items:center;padding:6px 0;color:#64748b;background:transparent;border:none;font-size:9px;cursor:pointer;font-weight:600;gap:3px;position:relative}
.gr-footer button i{font-size:18px}
.gr-footer button.active{color:#10b981}
.gr-footer button.active::after{content:'';position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:24px;height:3px;background:linear-gradient(90deg,#10b981,#3b82f6);border-radius:2px}

/* Heart burst */
.gr-heart{position:fixed;pointer-events:none;z-index:99999;font-size:48px;animation:grHeartRise .8s ease forwards}
@keyframes grHeartRise{0%{opacity:0;transform:scale(.4) translateY(0)}20%{opacity:1;transform:scale(1.2) translateY(-20px)}100%{opacity:0;transform:scale(.6) translateY(-180px)}}
.gr-amt{position:fixed;pointer-events:none;z-index:99999;font-size:13px;font-weight:900;color:#10b981;text-shadow:0 0 8px rgba(16,185,129,.9),0 2px 4px rgba(0,0,0,.95);animation:grHeartRise .8s ease forwards}

@media(max-width:400px){
  .gr-banner-name{font-size:15px}

/* ═══════════════════════════════════════════════════════════
   TOAST
   ═══════════════════════════════════════════════════════════ */
function toast(msg, type){
  var c = document.getElementById('toasts');
  var t = document.createElement('div');
  t.className = 'gr-toast';
  var icon = type === 'error' ? 'fa-triangle-exclamation' : 'fa-circle-check';
  if(type === 'error') t.style.borderColor = 'rgba(239,68,68,.55)';
  t.innerHTML = '<i class="fa-solid ' + icon + '"></i> ' + msg;
  c.appendChild(t);
  requestAnimationFrame(function(){ t.classList.add('show'); });
  setTimeout(function(){
    t.classList.remove('show');
    setTimeout(function(){ t.remove(); }, 300);
  }, 2600);
}

function escapeHtml(s){
  if(s == null) return '';
  return String(s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}

function renderRoom(){
  var cfg = ROOM_CONFIG[S.roomType];
  var h = '';

  /* Banner */
  h += '<div class="gr-banner">';
  h += '<div class="gr-banner-overlay"></div>';

  h += '<div class="gr-banner-name">' + escapeHtml(cfg.bannerName) + ' <i class="fa-solid fa-circle-check gr-verify"></i></div>';
  h += '<div class="gr-banner-meta">' + cfg.bannerMeta + '</div>';
  h += '</div>';
  h += '</div>';
  h += '</div>';

  /* Actions */
  h += '<div class="gr-actions">';
  h += '<button class="gr-join-btn joined" id="joinBtn"><i class="fa-solid fa-check"></i> Joined</button>';
  h += '<button class="gr-icon-btn" onclick="toast(\'Notifications enabled\')"><i class="fa-solid fa-bell"></i></button>';
  h += '<button class="gr-icon-btn" onclick="toast(\'Share link copied\')"><i class="fa-solid fa-share-nodes"></i></button>';
  h += '<button class="gr-icon-btn" onclick="toast(\'More options\')"><i class="fa-solid fa-ellipsis-vertical"></i></button>';
  h += '</div>';

  /* Tabs */
  h += '<div class="gr-tabs" id="tabs">';
  cfg.tabs.forEach(function(t){
    h += '<button class="gr-tab' + (S.currentTab === t.key ? ' active' : '') + '" data-tab="' + t.key + '"><i class="' + t.icon + '"></i> ' + t.label + '</button>';
  });
  h += '</div>';

  /* Content */
  h += '<div id="content"></div>';

  document.getElementById('roomView').innerHTML = h;

  /* Wire tabs */
  document.querySelectorAll('.gr-tab').forEach(function(b){
    b.addEventListener('click', function(){
      S.currentTab = this.getAttribute('data-tab');
      paintTab();
    });
  });

  /* Wire join */
  var jb = document.getElementById('joinBtn');
  if(jb) jb.addEventListener('click', function(){
    var isJoined = this.classList.contains('joined');
    if(isJoined){
      this.classList.remove('joined');
      this.innerHTML = '<i class="fa-solid fa-plus"></i> Join Room';
      toast('Left the room.');
    } else {
      this.classList.add('joined');
      this.innerHTML = '<i class="fa-solid fa-check"></i> Joined';
      toast('Welcome!');
    }
  });

  paintTab();
}

function paintTab(){
  var content = document.getElementById('content');
  if(!content) return;
  var k = S.currentTab;

  if(k === 'feed')         content.innerHTML = renderFeed();
  else if(k === 'members') content.innerHTML = renderMembers();
  else if(k === 'students')content.innerHTML = renderMembers(true);
  else if(k === 'classes') content.innerHTML = renderClasses();
  else if(k === 'media')   content.innerHTML = renderMedia();
  else if(k === 'files')   content.innerHTML = renderFiles();
  else if(k === 'events')  content.innerHTML = renderEvents();
  else if(k === 'live')    content.innerHTML = renderLive();
  else if(k === 'meeting') content.innerHTML = renderMeetRoom();
  else if(k === 'chat')    content.innerHTML = renderMeetChat();
  else if(k === 'about')   content.innerHTML = renderAbout();

  /* tab visual */
  document.querySelectorAll('.gr-tab').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-tab') === k);
  });

  wireInteractions();
}

function renderFeed(){
  var h = '';
  h += '<div class="gr-composer" onclick="openComposerSheet()">';
  h += '<img src="https://ui-avatars.com/api/?name=You&background=111827&color=34d399">';

  h += '</div>';

  if(!S.posts.length){
    h += '<div style="text-align:center;padding:60px 20px;color:#64748b;font-size:13px;">No posts yet. Be the first!</div>';
  } else {
    S.posts.forEach(function(p){ h += renderPost(p); });
  }
  return h;
}

function renderPost(p){
  var avatarUrl = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(p.name) + '&background=111827&color=34d399';
  var h = '';
  h += '<div class="gr-post" data-post-id="' + p.id + '">';
  h += '<div class="gr-post-head">';
  h += '<img src="' + avatarUrl + '">';
  h += '<div style="flex:1;min-width:0;">';
  h += '<div class="gr-post-name">' + escapeHtml(p.name);
  if(p.isOwner) h += '<span class="gr-badge-author">OWNER</span>';
  if(p.pinned) h += '<span class="gr-pinned"><i class="fa-solid fa-thumbtack"></i> PINNED</span>';
  h += '</div>';
  h += '<div class="gr-post-handle">' + escapeHtml(p.handle) + ' · ' + escapeHtml(p.time) + ' ago</div>';
  h += '</div></div>';

  if(p.content){
    h += '<div class="gr-post-content">' + escapeHtml(p.content).replace(/\n/g,'<br>') + '</div>';
  }

  if(p.media && p.media.url){
    h += '<div class="gr-post-media">';
    if(p.media.type === 'video'){
      h += '<video src="' + escapeHtml(p.media.url) + '" controls></video>';
    } else {
      h += '<img src="' + escapeHtml(p.media.url) + '">';
    }
    h += '</div>';
  }

  /* Reactions */
  h += '<div class="gr-post-reactions">';
  ['love','flower','spark','clap','star','dislike'].forEach(function(k){
    var cnt = (p.reactions && p.reactions[k]) || 0;
    var act = S.myReactions[p.id] && S.myReactions[p.id][k];
    var bounty = BOUNTIES[k] > 0 ? '<span class="bounty">$' + BOUNTIES[k].toFixed(2) + '</span>' : '<span class="bounty" style="color:#64748b;">—</span>';
    h += '<button class="gr-react' + (act ? ' active' : '') + '" data-post="' + p.id + '" data-react="' + k + '">' +
         '<span>' + SYMBOLS[k] + '</span>' +
         '<span class="count">' + cnt + '</span>' +
         bounty +
         '</button>';
  });
  h += '</div>';

  var comments = S.comments[p.id] || [];
  h += '<div class="gr-post-actions">';
  h += '<button data-comment-toggle="' + p.id + '"><i class="fa-regular fa-comment"></i> ' + comments.length + ' Comments</button>';
  h += '<button data-share="' + p.id + '"><i class="fa-solid fa-share-nodes"></i> Share</button>';
  h += '</div>';

  h += '<div class="gr-comments" id="comments-' + p.id + '">';
  comments.forEach(function(c){ h += renderComment(c); });
  h += '<div class="gr-comment-input">';
  h += '<textarea rows="1" id="ci-' + p.id + '" placeholder="Write a comment..."></textarea>';
  h += '<button data-add-comment="' + p.id + '">Send</button>';
  h += '</div>';
  h += '</div>';
  h += '</div>';
  return h;
}

function renderComment(c){
  var color = c.color || COMMENT_COLORS[Math.floor(Math.random()*5)];
  return '<div class="gr-comment ' + color + '">' +
    '<span class="cname">' + escapeHtml(c.name) + '</span>' +
    '<span>' + escapeHtml(c.text) + '</span>' +
    '</div>';
}

function toggleComposerBanner(){
  _compBanner.active = !_compBanner.active;

  if(p) p.style.display = _compBanner.active ? 'block' : 'none';
  if(t){
    t.style.background = _compBanner.active ? 'rgba(16,185,129,.15)' : '';
    t.style.borderColor = _compBanner.active ? '#10b981' : '';
    t.style.color = _compBanner.active ? '#10b981' : '';
  }
}
window.toggleComposerBanner = toggleComposerBanner;

function pickCompBannerBg(id){
  _compBanner.bg = id;
  document.querySelectorAll('.comp-bg-swatch').forEach(function(el){
    el.classList.toggle('active', el.getAttribute('data-bg') === id);
    el.style.borderColor = el.getAttribute('data-bg') === id ? '#10b981' : 'transparent';
  });
}
window.pickCompBannerBg = pickCompBannerBg;

function pickCompBannerFont(btn, id){
  _compBanner.font = id;
  document.querySelectorAll('.comp-font-btn').forEach(function(b){
    b.classList.remove('active');

  });

  btn.style.color = '#10b981';
}
window.pickCompBannerFont = pickCompBannerFont;

function pickCompVis(btn, k){
  if(k === 'public'){
    _compVis = { public:true, connections:false, family:false };
  } else {
    _compVis = { public:false, connections:true, family:false };
  }
  document.querySelectorAll('.comp-vis-btn').forEach(function(b){
    var active = _compVis[b.getAttribute('data-vis')];
    b.style.background = active ? 'rgba(16,185,129,.15)' : 'rgba(255,255,255,.03)';
    b.style.borderColor = active ? '#10b981' : '#1e293b';
    b.style.color = active ? '#10b981' : '#94a3b8';
  });
}
window.pickCompVis = pickCompVis;

function toggleCompSchedule(){
  var cb = document.getElementById('compScheduleToggle');
  var wrap = document.getElementById('compScheduleWrap');
  if(!cb || !wrap) return;
  if(cb.checked){
    wrap.style.display = 'block';
    var inp = document.getElementById('compScheduleAt');
    if(inp && !inp.value){
      var d = new Date(Date.now() + 60*60*1000);
      inp.value = new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,16);
    }
  } else {
    wrap.style.display = 'none';
  }
}
window.toggleCompSchedule = toggleCompSchedule;

function handleCompTextInput(ta){
  if(_compBanner.active){
    var len = ta.value.length;
    var fs = 28;
    if(len > 60) fs = 24;
    if(len > 120) fs = 20;
    if(len > 220) fs = 17;
    ta.style.fontFamily = _compBanner.font === 'editorial' ? 'Georgia,serif' : (window.ZT_FONTS || 'system-ui');
    ta.style.fontSize = fs + 'px';
    ta.style.fontWeight = _compBanner.font === 'display' ? '900' : (_compBanner.font === 'editorial' ? '800' : '700');
  } else {
    ta.style.fontSize = '13px';
    ta.style.fontFamily = 'inherit';
    ta.style.fontWeight = 'normal';
  }
}
window.handleCompTextInput = handleCompTextInput;

function handleCompMedia(e, type){
  var f = e.target.files && e.target.files[0];
  if(!f) return;
  if(f.size > 50 * 1024 * 1024){ toast('Max 50 MB', 'error'); e.target.value=''; return; }
  var reader = new FileReader();
  reader.onload = function(ev){
    _compMedia = { type: type, url: ev.target.result, file: f };
    var prev = document.getElementById('compPreview');
    var html = '';
    if(type === 'video') html = '<video src="' + ev.target.result + '" controls></video>';
    else html = '<img src="' + ev.target.result + '">';
    html += '<button class="gr-media-remove" onclick="removeCompMedia()"><i class="fa-solid fa-xmark"></i> Remove</button>';
    prev.innerHTML = html;
    prev.classList.add('show');
  };
  reader.readAsDataURL(f);
}
window.handleCompMedia = handleCompMedia;

function removeCompMedia(){
  _compMedia = null;
  var prev = document.getElementById('compPreview');
  prev.innerHTML = '';
  prev.classList.remove('show');
  document.getElementById('compPhoto').value = '';
  document.getElementById('compVideo').value = '';
}
window.removeCompMedia = removeCompMedia;

function submitPost(){
  var text = (document.getElementById('compText').value || '').trim();
  if(!text && !_compMedia){ toast('Write something or add media.', 'error'); return; }

  var bounty = parseFloat((document.getElementById('compBounty')||{}).value || '0') || 0;
  var budget = parseFloat((document.getElementById('compBudget')||{}).value || '0') || 0;
  var cfarRate = parseFloat((document.getElementById('compCfarRate')||{}).value || '0') || 0;
  var cfarBudget = parseFloat((document.getElementById('compCfarBudget')||{}).value || '0') || 0;
  var ageGate = !!(document.getElementById('compAgeGate')||{}).checked;
  var warning = ((document.getElementById('compWarning')||{}).value || '').trim() || null;

  var newPost = {
    id: 'p' + Date.now(),
    name: 'You',
    handle: '@you',
    time: 'now',
    pinned: false,
    isOwner: false,
    content: text,
    media: _compMedia ? { type: _compMedia.type, url: _compMedia.url } : null,
    reactions: { love:0, flower:0, spark:0, clap:0, star:0, dislike:0 },
    share_bounty: bounty,
    share_budget: budget,
    cfar_rate: cfarRate,
    cfar_budget: cfarBudget,
    age_gated: ageGate,
    content_warning: warning,
    banner_style: _compBanner.active ? _compBanner.bg : null
  };

  S.posts.unshift(newPost);

  if(_compMedia && _compMedia.type === 'image'){
    S.mediaItems.unshift({ type:'image', url:_compMedia.url });
  }

  _compMedia = null;
  closeSheet();
  toast('Post published.');
  paintTab();
}
window.submitPost = submitPost;

function renderMembers(isStudents){
  var title = isStudents ? 'Students' : 'Members';
  var h = '<input class="gr-search" id="memSearch" placeholder="Search ' + title.toLowerCase() + '..." oninput="filterMembers(this.value)">';
  h += '<div class="gr-members" id="memList">';
  S.members.forEach(function(m){ h += renderMemberRow(m); });
  h += '</div>';

}

function renderMemberRow(m){
  return '<div class="gr-member">' +
    '<div class="gr-member-av" style="background:' + m.color + '22;color:' + m.color + ';">' +
    m.initials + (m.online ? '<span class="online"></span>' : '') +
    '</div>' +
    '<div style="flex:1;min-width:0;">' +
    '<div class="gr-member-name">' + escapeHtml(m.name) + '</div>' +
    '<div class="gr-member-role">' + escapeHtml(m.role) + '</div>' +
    '</div></div>';
}

function filterMembers(q){
  q = (q || '').toLowerCase();
  var filtered = S.members.filter(function(m){
    return m.name.toLowerCase().indexOf(q) !== -1 || m.handle.toLowerCase().indexOf(q) !== -1;
  });
  var host = document.getElementById('memList');
  if(!host) return;
  if(!filtered.length){
    host.innerHTML = '<div style="grid-column:span 2;text-align:center;padding:40px;color:#94a3b8;font-size:12px;">No matches.</div>';
    return;
  }
  host.innerHTML = filtered.map(renderMemberRow).join('');
}
window.filterMembers = filterMembers;

function submitEvent(){
  var title = (document.getElementById('evTitle').value || '').trim();
  var dateVal = document.getElementById('evDate').value;
  var loc = (document.getElementById('evLoc').value || '').trim();
  if(!title){ toast('Title required.', 'error'); return; }
  if(!dateVal){ toast('Date required.', 'error'); return; }
  var d = new Date(dateVal);
  S.events.push({
    day: String(d.getDate()).padStart(2,'0'),
    month: d.toLocaleString('en', {month:'short'}).toUpperCase(),
    title: title,
    meta: d.toLocaleString('en', {weekday:'short', hour:'2-digit', minute:'2-digit'}) + (loc ? (' · ' + loc) : ''),
    going: 1
  });
  closeSheet();
  toast('Event created.');
  paintTab();
}

function deleteEvent(i){
  if(!confirm('Delete this event?')) return;
  S.events.splice(i, 1);
  toast('Event deleted.');
  paintTab();
}

/* ═══════════════════════════════════════════════════════════
   LIVE CALL UI — used by both Live Stream and Meet
   ═══════════════════════════════════════════════════════════ */
function startLiveCall(mode){
  S.recordingCall = true;
  var participants = [
    { name:'Sara Ahmed (Host)', initials:'SA', color:'#10b981', speaking:true, muted:false, hand:false },
    { name:'Bilal Khan', initials:'BK', color:'#3b82f6', speaking:false, muted:false, hand:false },
    { name:'Ayesha Malik', initials:'AM', color:'#8b5cf6', speaking:false, muted:true, hand:true },
    { name:'Hassan Raza', initials:'HR', color:'#f59e0b', speaking:false, muted:false, hand:false }
  ];

  var title = mode === 'stream' ? 'Live Stream' : 'Meeting — Q4 Strategy';

  var h = '';
  h += '<div class="gr-call" id="liveCall">';
  h += '<div class="gr-call-head">';
  h += '<div class="gr-call-head-title">';
  if(mode === 'stream') h += '<span class="gr-call-live">LIVE</span>';
  h += escapeHtml(title);
  h += '</div>';
  h += '<div style="font-size:11px;color:#94a3b8;">' + (mode === 'stream' ? '8 viewers' : participants.length + ' participants') + '</div>';
  h += '</div>';

  h += '<div class="gr-call-grid">';
  participants.forEach(function(p, i){
    var cls = 'gr-call-tile';
    if(p.speaking) cls += ' speaking';
    if(i === 0) cls += ' mine';
    h += '<div class="' + cls + '">';
    h += '<div class="av" style="background:' + p.color + '22;color:' + p.color + ';">' + p.initials + '</div>';
    if(p.muted) h += '<div class="mute"><i class="fa-solid fa-microphone-slash"></i></div>';
    if(p.hand) h += '<div class="hand">🙋</div>';
    h += '<div class="lbl">' + escapeHtml(p.name) + '</div>';
    h += '</div>';
  });
  h += '</div>';

  h += '<div class="gr-call-controls">';
  h += '<button class="gr-call-btn active" id="micBtn" onclick="toggleCallMic(this)"><i class="fa-solid fa-microphone"></i></button>';
  h += '<button class="gr-call-btn active" id="camBtn" onclick="toggleCallCam(this)"><i class="fa-solid fa-video"></i></button>';
  h += '<button class="gr-call-btn" onclick="toast(\'Screen share — coming soon\')"><i class="fa-solid fa-desktop"></i></button>';
  h += '<button class="gr-call-btn danger" onclick="endLiveCall()"><i class="fa-solid fa-phone-slash"></i> Leave</button>';
  h += '</div>';
  h += '</div>';

  document.body.insertAdjacentHTML('beforeend', h);
}
window.startLiveCall = startLiveCall;

function toggleCallMic(btn){
  btn.classList.toggle('active');
  var on = btn.classList.contains('active');
  btn.innerHTML = '<i class="fa-solid fa-microphone' + (on ? '' : '-slash') + '"></i>';
}
window.toggleCallMic = toggleCallMic;

function toggleCallCam(btn){
  btn.classList.toggle('active');
  var on = btn.classList.contains('active');
  btn.innerHTML = '<i class="fa-solid fa-video' + (on ? '' : '-slash') + '"></i>';
}
window.toggleCallCam = toggleCallCam;

function endLiveCall(){
  var el = document.getElementById('liveCall');
  if(el) el.remove();
  S.recordingCall = false;
  toast('Call ended.');
}
window.endLiveCall = endLiveCall;

/* ═══════════════════════════════════════════════════════════
   WIRE INTERACTIONS — reactions, comments, shares
   ═══════════════════════════════════════════════════════════ */
function wireInteractions(){
  var content = document.getElementById('content');
  if(!content) return;

  content.querySelectorAll('.gr-react').forEach(function(b){
    b.addEventListener('click', function(){
      handleReact(this.getAttribute('data-post'), this.getAttribute('data-react'), this);
    });
  });

  content.querySelectorAll('[data-comment-toggle]').forEach(function(b){
    b.addEventListener('click', function(){
      var pid = this.getAttribute('data-comment-toggle');
      var box = document.getElementById('comments-' + pid);
      if(box) box.classList.toggle('open');
    });
  });

  content.querySelectorAll('[data-add-comment]').forEach(function(b){
    b.addEventListener('click', function(){
      var pid = this.getAttribute('data-add-comment');
      var ta = document.getElementById('ci-' + pid);
      if(!ta) return;
      var txt = (ta.value || '').trim();
      if(!txt) return;
      if(!S.comments[pid]) S.comments[pid] = [];
      S.comments[pid].push({
        id: 'c' + Date.now(),
        name: 'You',
        text: txt,
        color: COMMENT_COLORS[Math.floor(Math.random()*5)]
      });
      ta.value = '';
      toast('Comment added.');
      paintTab();
      var box = document.getElementById('comments-' + pid);
      if(box) box.classList.add('open');
    });
  });

  content.querySelectorAll('[data-share]').forEach(function(b){
    b.addEventListener('click', function(){ toast('Shared.'); });
  });
}

function handleReact(postId, k, btn){
  var post = S.posts.find(function(p){ return p.id === postId; });
  if(!post) return;

  if(k === 'dislike'){
    post.reactions.dislike = (post.reactions.dislike || 0) + 1;
    paintTab();
    toast('Dislike added.');
    return;
  }

  if(!S.myReactions[postId]) S.myReactions[postId] = {};
  if(S.myReactions[postId][k]){
    toast('Already reacted.');
    return;
  }

  S.myReactions[postId][k] = true;
  post.reactions[k] = (post.reactions[k] || 0) + 1;

  playReactionAnimation(btn, k);
  paintTab();

  var bounty = BOUNTIES[k];
  if(bounty > 0){
    toast('+$' + bounty.toFixed(2) + ' bounty earned');
  }
}

function playReactionAnimation(btn, k){
  if(!btn) return;
  var rect = btn.getBoundingClientRect();
  var cx = rect.left + rect.width / 2;
  var cy = rect.top + rect.height / 2;
  var heart = document.createElement('div');
  heart.className = 'gr-heart';
  heart.textContent = SYMBOLS[k];
  heart.style.left = (cx - 24) + 'px';
  heart.style.top = (cy - 24) + 'px';
  document.body.appendChild(heart);
  setTimeout(function(){ heart.remove(); }, 850);

  var amt = document.createElement('div');
  amt.className = 'gr-amt';
  amt.textContent = '+$' + BOUNTIES[k].toFixed(2);
  amt.style.left = cx + 'px';
  amt.style.top = (cy - 30) + 'px';
  amt.style.transform = 'translateX(-50%)';
  document.body.appendChild(amt);
  setTimeout(function(){ amt.remove(); }, 850);
}

<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ZYNIX Rooms — General</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#090d16;color:#f8fafc;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding-bottom:80px;overflow-x:hidden;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:#090d16}
::-webkit-scrollbar-thumb{background:#1e293b;border-radius:4px}

.gr-header{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(9,13,22,.92);backdrop-filter:blur(12px);border-bottom:1px solid #1e293b;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;height:56px;max-width:600px;margin:0 auto}
.gr-logo{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#10b981,#3b82f6);display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;font-size:14px}
.gr-title{font-size:15px;font-weight:900;background:linear-gradient(90deg,#10b981,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent}
.gr-hbtn{background:rgba(30,41,59,.7);border:1px solid #1e293b;color:#cbd5e1;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;justify-content:center;position:relative}
#app{max-width:600px;margin:0 auto;padding:76px 14px 24px}

/* Banner */
.gr-banner{position:relative;border-radius:16px;overflow:hidden;margin-bottom:12px;min-height:200px;background:linear-gradient(135deg,#10b981,#3b82f6);display:flex;align-items:flex-end;padding:16px}
.gr-banner-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.1) 0%,rgba(0,0,0,.7) 100%);pointer-events:none}
.gr-banner-content{position:relative;z-index:2;display:flex;align-items:center;gap:12px;width:100%}
.gr-banner-av{width:64px;height:64px;border-radius:50%;border:3px solid rgba(255,255,255,.9);object-fit:cover;flex-shrink:0;background:#0f172a}
.gr-banner-info{flex:1;min-width:0}
.gr-banner-name{font-size:18px;font-weight:900;color:#fff;line-height:1.2;text-shadow:0 2px 8px rgba(0,0,0,.7)}
.gr-banner-meta{font-size:11px;color:rgba(255,255,255,.92);margin-top:3px;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.gr-banner-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.2);padding:4px 10px;border-radius:14px;font-size:9.5px;font-weight:900;color:#fff;letter-spacing:.5px}
.gr-verify{color:#10b981}

/* Actions */
.gr-actions{display:flex;gap:8px;margin-bottom:12px}
.gr-join-btn{flex:1;padding:12px;border-radius:12px;border:none;background:linear-gradient(135deg,#10b981,#3b82f6);color:#000;font-weight:900;font-size:13px;cursor:pointer}
.gr-join-btn.joined{background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.4);color:#10b981}
.gr-icon-btn{width:44px;height:44px;border-radius:12px;border:1px solid #1e293b;background:#111827;color:#cbd5e1;cursor:pointer;font-size:15px;flex-shrink:0}

/* Tabs */
.gr-tabs{display:flex;gap:4px;background:#0f172a;border:1px solid #1e293b;border-radius:14px;padding:4px;margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.gr-tabs::-webkit-scrollbar{display:none}
.gr-tab{flex:1;min-width:72px;padding:10px 8px;border-radius:10px;border:none;background:transparent;color:#94a3b8;font-weight:900;font-size:11px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;transition:all .15s}
.gr-tab.active{background:rgba(16,185,129,.15);color:#10b981;border:1px solid rgba(16,185,129,.4)}

/* Feed - full style like index.html */
.gr-composer{background:#111827;border:1px solid #1e293b;border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center;cursor:pointer;margin-bottom:14px;transition:border-color .2s}
.gr-composer:hover{border-color:#334155}
.gr-composer img{width:38px;height:38px;border-radius:50%;object-fit:cover;flex-shrink:0}
.gr-composer-input{flex:1;background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:10px 14px;font-size:12px;color:#94a3b8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.gr-post{background:#111827;border:1px solid #1e293b;border-radius:16px;padding:14px;margin-bottom:12px}
.gr-post-head{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.gr-post-head img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:1px solid #1e293b;cursor:pointer}
.gr-post-name{font-weight:800;font-size:13px;color:#fff;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.gr-post-handle{font-size:10px;color:#64748b}
.gr-badge-author{font-size:8.5px;font-weight:900;padding:2px 7px;border-radius:10px;background:linear-gradient(135deg,#10b981,#3b82f6);color:#000}
.gr-pinned{font-size:8.5px;font-weight:900;padding:2px 7px;border-radius:10px;background:rgba(161,133,84,.15);color:#a18554;border:1px solid rgba(161,133,84,.4)}
.gr-post-content{font-size:13.5px;color:#e2e8f0;line-height:1.7;margin-bottom:10px;white-space:pre-wrap;padding:12px 16px;border-radius:10px;background:rgba(15,23,42,.35)}
.gr-post-media{border-radius:12px;overflow:hidden;margin-bottom:10px;background:#0f172a}
.gr-post-media img{width:100%;height:auto;display:block}

/* Reactions - FULL like index.html */
.gr-post-reactions{display:flex;flex-wrap:wrap;gap:4px;padding:8px 0;border-top:1px solid #1e293b;align-items:center}
.gr-react{padding:4px 8px;border-radius:14px;font-size:14px;background:transparent;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:3px;color:#fff;transition:all .15s;position:relative}
.gr-react:hover{background:#1e293b}
.gr-react.active{background:rgba(16,185,129,.15);border-color:rgba(16,185,129,.3);cursor:default}
.gr-react .count{font-size:10px;color:#64748b;font-weight:700;line-height:1}
.gr-react.active .count{color:#10b981}
.gr-react .bounty{font-size:9px;color:#10b981;font-weight:700;line-height:1;margin-left:1px}

/* Reaction picker - appears on long-press */
.gr-reaction-picker{position:fixed;z-index:10050;background:#111827;border:1px solid #1e293b;border-radius:14px;padding:8px;display:flex;gap:6px;box-shadow:0 8px 32px rgba(0,0,0,.7)}
.gr-reaction-picker button{width:40px;height:40px;border-radius:50%;background:transparent;border:none;cursor:pointer;font-size:22px;display:flex;align-items:center;justify-content:center}
.gr-reaction-picker button:hover{background:#1e293b}

.gr-post-actions{display:flex;gap:16px;padding-top:8px;border-top:1px solid #1e293b;font-size:12px;color:#64748b;flex-wrap:wrap}
.gr-post-actions button{background:transparent;border:none;color:#64748b;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:5px;font-weight:700}
.gr-post-actions button:hover{color:#e2e8f0}

/* Comments */
.gr-comments{margin-top:10px;padding-top:10px;border-top:1px solid #1e293b;display:none}
.gr-comments.open{display:block}
.gr-comment{padding:10px 12px;border-radius:12px;margin-bottom:6px;font-size:12px;word-break:break-word;position:relative}
.gr-comment.light-green{background:#dcfce7;color:#052e16}
.gr-comment.light-blue{background:#dbeafe;color:#172554}
.gr-comment.light-yellow{background:#fef3c7;color:#451a03}
.gr-comment.light-pink{background:#fce7f3;color:#500724}
.gr-comment.light-purple{background:#ede9fe;color:#2e1065}
.gr-comment .cname{font-weight:700;margin-right:6px;opacity:.9;text-decoration:underline;text-decoration-color:rgba(0,0,0,.15);cursor:pointer}
.gr-comment-reactions{display:flex;flex-wrap:wrap;gap:2px;margin-top:6px;align-items:center}
.gr-comment-react{background:rgba(0,0,0,.06);border:none;padding:2px 6px;border-radius:10px;font-size:11px;cursor:pointer;display:inline-flex;align-items:center;gap:2px;color:inherit;opacity:.75}
.gr-comment-react:hover{opacity:1}
.gr-comment-react.active{background:rgba(16,185,129,.25);opacity:1;font-weight:700}
.gr-comment-actions{display:flex;gap:12px;margin-top:4px;font-size:10px;opacity:.75}
.gr-comment-actions button{background:transparent;border:none;color:inherit;cursor:pointer;font-size:10px;padding:0;font-weight:600;text-decoration:underline}
.gr-comment-replies{margin-top:6px;padding-left:10px;border-left:2px solid rgba(0,0,0,.15)}
.gr-comment-input{display:flex;gap:8px;margin-top:8px;align-items:flex-end}
.gr-comment-input textarea{flex:1;background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:10px 12px;font-size:12px;color:#fff;outline:none;resize:none;max-height:150px;font-family:inherit;min-height:38px}
.gr-comment-input button{background:#10b981;border:none;color:#000;font-weight:700;padding:8px 16px;border-radius:8px;font-size:11px;cursor:pointer;height:38px}

/* Members */
.gr-search{width:100%;background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:11px 14px;font-size:13px;color:#fff;outline:none;box-sizing:border-box;margin-bottom:12px}
.gr-members{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gr-member{background:#111827;border:1px solid #1e293b;border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px;cursor:pointer}
.gr-member-av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;flex-shrink:0;position:relative}
.gr-member-av .online{position:absolute;bottom:0;right:0;width:10px;height:10px;border-radius:50%;background:#10b981;border:2px solid #111827}
.gr-member-name{font-size:12.5px;font-weight:800;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gr-member-role{font-size:10px;color:#94a3b8;margin-top:2px}

/* Media */
.gr-media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.gr-media-tile{aspect-ratio:1;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,#1e293b,#0f172a);display:flex;align-items:center;justify-content:center;color:#334155;font-size:22px;cursor:pointer}
.gr-media-tile:hover{border:2px solid #10b981}

/* Events */
.gr-event{background:#111827;border:1px solid #1e293b;border-radius:14px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;cursor:pointer;transition:border-color .2s}
.gr-event:hover{border-color:rgba(16,185,129,.5)}
.gr-event-date{width:54px;height:54px;border-radius:12px;background:linear-gradient(135deg,#10b981,#3b82f6);color:#000;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;line-height:1.1}
.gr-event-day{font-size:19px;line-height:1}
.gr-event-info{flex:1;min-width:0}
.gr-event-title{font-size:13.5px;font-weight:800;color:#fff;margin-bottom:3px}
.gr-event-meta{font-size:11px;color:#94a3b8}
.gr-event-going{font-size:11px;color:#10b981;font-weight:800;margin-top:4px}

/* Live */
.gr-live-card{background:linear-gradient(135deg,rgba(16,185,129,.10),rgba(59,130,246,.06));border:1px solid rgba(16,185,129,.35);border-radius:16px;padding:20px;text-align:center;margin-bottom:12px}
.gr-live-card.locked{background:linear-gradient(135deg,rgba(251,191,36,.08),rgba(236,72,153,.06));border-color:rgba(251,191,36,.35)}
.gr-live-icon{width:64px;height:64px;border-radius:50%;background:rgba(16,185,129,.15);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;color:#10b981;font-size:26px}
.gr-live-card.locked .gr-live-icon{background:rgba(251,191,36,.15);color:#fbbf24}
.gr-live-title{font-size:16px;font-weight:900;color:#fff;margin-bottom:6px}
.gr-live-desc{font-size:12px;color:#cbd5e1;line-height:1.65;margin-bottom:14px}
.gr-live-btn{width:100%;padding:13px;border-radius:12px;border:none;background:linear-gradient(135deg,#10b981,#3b82f6);color:#000;font-weight:900;font-size:13px;cursor:pointer;margin-top:8px}
.gr-live-btn.secondary{background:rgba(59,130,246,.10);border:1px solid rgba(59,130,246,.4);color:#60a5fa}
.gr-live-btn.gold{background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#000}
.gr-locked-tag{font-size:10px;color:#fbbf24;font-weight:900;margin-top:8px;letter-spacing:.5px}

/* About */
.gr-card{background:#111827;border:1px solid #1e293b;border-radius:16px;padding:14px;margin-bottom:12px}
.gr-about-row{padding:12px 0;border-bottom:1px solid #1e293b}
.gr-about-row:last-child{border-bottom:none}
.gr-about-lbl{font-size:10px;color:#94a3b8;font-weight:900;letter-spacing:.5px;margin-bottom:6px;text-transform:uppercase}
.gr-about-val{font-size:12.5px;color:#e2e8f0;line-height:1.65}
.gr-rules{font-size:12px;color:#cbd5e1;line-height:1.85;white-space:pre-wrap}

/* Sheet / Modal */
.gr-sheet-overlay{position:fixed;inset:0;z-index:10002;background:rgba(0,0,0,.85);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center}
.gr-sheet{background:#111827;border-top-left-radius:20px;border-top-right-radius:20px;border-top:1px solid #1e293b;width:100%;max-width:600px;max-height:92vh;display:flex;flex-direction:column;animation:grSheetUp .25s ease}
@keyframes grSheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.gr-sheet-handle{width:40px;height:4px;background:#334155;border-radius:2px;margin:8px auto 0;flex-shrink:0}
.gr-sheet-header{padding:12px 16px;border-bottom:1px solid #1e293b;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.gr-sheet-header h3{font-size:14px;font-weight:900;color:#fff}
.gr-sheet-close{background:transparent;border:none;color:#94a3b8;font-size:20px;cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center}
.gr-sheet-body{padding:14px 16px;overflow-y:auto;flex:1}

/* Composer */
.gr-label{display:block;font-size:11px;color:#94a3b8;font-weight:800;margin-bottom:5px;margin-top:12px}
.gr-input,.gr-textarea{width:100%;background:#0f172a;border:1px solid #1e293b;border-radius:10px;padding:12px;font-size:13px;color:#fff;outline:none;font-family:inherit;box-sizing:border-box}
.gr-input:focus,.gr-textarea:focus{border-color:#10b981}
.gr-textarea{min-height:90px;resize:vertical}
.gr-banner-picker{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.gr-banner-picker::-webkit-scrollbar{display:none}
.gr-banner-swatch{flex-shrink:0;width:56px;height:56px;border-radius:12px;cursor:pointer;border:2px solid rgba(255,255,255,.06)}
.gr-banner-swatch.active{border-color:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.22)}

/* Toast */
.gr-toastc{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);z-index:2147483647;width:90%;max-width:380px;pointer-events:none}
.gr-toast{background:rgba(17,24,39,.96);border:1px solid rgba(16,185,129,.3);color:#f8fafc;padding:12px 14px;border-radius:12px;font-size:12px;margin-bottom:6px;backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;opacity:0;transform:translateY(10px);transition:all .25s;pointer-events:auto}
.gr-toast.show{opacity:1;transform:translateY(0)}
.gr-toast i{color:#10b981}

/* Footer */
.gr-footer{position:fixed;bottom:0;left:0;right:0;z-index:1000;background:rgba(9,13,22,.95);backdrop-filter:blur(12px);border-top:1px solid #1e293b;padding:8px 0;display:flex;align-items:center;justify-content:space-around;max-width:600px;margin:0 auto}
.gr-footer button{flex:1;display:flex;flex-direction:column;align-items:center;padding:6px 0;color:#64748b;background:transparent;border:none;font-size:9px;cursor:pointer;font-weight:600;gap:3px;position:relative}
.gr-footer button i{font-size:18px}
.gr-footer button.active{color:#10b981}
.gr-footer button.active::after{content:'';position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:24px;height:3px;background:linear-gradient(90deg,#10b981,#3b82f6);border-radius:2px}

/* Heart burst */
.gr-heart{position:fixed;pointer-events:none;z-index:99999;font-size:48px;animation:grHeartRise .8s ease forwards}
@keyframes grHeartRise{0%{opacity:0;transform:scale(.4) translateY(0)}20%{opacity:1;transform:scale(1.2) translateY(-20px)}100%{opacity:0;transform:scale(.6) translateY(-180px)}}
.gr-amt{position:fixed;pointer-events:none;z-index:99999;font-size:13px;font-weight:900;color:#10b981;text-shadow:0 0 8px rgba(16,185,129,.9),0 2px 4px rgba(0,0,0,.95);animation:grHeartRise .8s ease forwards}

@media(max-width:400px){
  .gr-banner-name{font-size:15px}
  .gr-tab{font-size:10px;padding:8px 6px;min-width:62px}
  .gr-banner-av{width:54px;height:54px}
}
</style>
</head>
<body>

<header class="gr-header">
  <div style="display:flex;align-items:center;gap:8px;">
    <div class="gr-logo">Z</div>
    <span class="gr-title">ZYNIX ROOMS</span>
  </div>
  <div style="display:flex;align-items:center;gap:8px;">
    <button class="gr-hbtn"><i class="fa-solid fa-bell"></i><span style="position:absolute;top:-4px;right:-4px;background:#ef4444;color:#fff;font-size:9px;font-weight:900;min-width:16px;height:16px;border-radius:8px;padding:0 4px;display:flex;align-items:center;justify-content:center;border:2px solid #090d16;">3</span></button>
    <img src="https://ui-avatars.com/api/?name=You&background=111827&color=34d399" style="width:28px;height:28px;border-radius:50%;object-fit:cover;border:1px solid rgba(16,185,129,.5);">
  </div>
</header>

<main id="app">
  <div class="gr-banner">
    <div class="gr-banner-overlay"></div>
    <div class="gr-banner-content">
      <img src="https://ui-avatars.com/api/?name=Karachi+Entrepreneurs&background=0f172a&color=34d399&size=200" class="gr-banner-av">
      <div class="gr-banner-info">
        <div style="margin-bottom:5px;">
          <span class="gr-banner-badge"><i class="fa-solid fa-handshake"></i> BUSINESS · Networking</span>
        </div>
        <div class="gr-banner-name">Karachi Entrepreneurs <i class="fa-solid fa-circle-check gr-verify"></i></div>
        <div class="gr-banner-meta">🌐 Public · 12,432 members · 340 posts this week</div>
      </div>
    </div>
  </div>

  <div class="gr-actions">
    <button class="gr-join-btn joined" id="joinBtn"><i class="fa-solid fa-check"></i> Joined</button>
    <button class="gr-icon-btn"><i class="fa-solid fa-bell"></i></button>
    <button class="gr-icon-btn"><i class="fa-solid fa-share-nodes"></i></button>
    <button class="gr-icon-btn"><i class="fa-solid fa-ellipsis-vertical"></i></button>
  </div>

  <div class="gr-tabs" id="tabs">
    <button class="gr-tab active" data-tab="feed"><i class="fa-solid fa-house"></i> Feed</button>
    <button class="gr-tab" data-tab="members"><i class="fa-solid fa-users"></i> Members</button>
    <button class="gr-tab" data-tab="media"><i class="fa-solid fa-images"></i> Media</button>
    <button class="gr-tab" data-tab="events"><i class="fa-solid fa-calendar-check"></i> Events</button>
    <button class="gr-tab" data-tab="live"><i class="fa-solid fa-video"></i> Live</button>
    <button class="gr-tab" data-tab="about"><i class="fa-solid fa-circle-info"></i> About</button>
  </div>

  <div id="content"></div>
</main>

<nav class="gr-footer">
  <button><i class="fa-solid fa-house"></i><span>Home</span></button>
  <button><i class="fa-solid fa-user"></i><span>Profile</span></button>
  <button class="active"><i class="fa-solid fa-users"></i><span>Rooms</span></button>
  <button><i class="fa-solid fa-store"></i><span>Market</span></button>
  <button><i class="fa-solid fa-wallet"></i><span>Wallet</span></button>
</nav>

<div class="gr-toastc" id="toasts"></div>
<div id="sheetHost"></div>

<script>
/* ═══════════════════════════════════════════════════════════
   STATE
   ═══════════════════════════════════════════════════════════ */
var S = {
  currentTab: 'feed',
  posts: [],
  members: [],
  events: [],
  comments: {},
  myReactions: {},
  reactionCounts: {},
  sheetOpen: false
};

/* Reaction bounties — same as index.html */
var BOUNTIES = { love:0.05, flower:0.04, spark:0.03, clap:0.02, star:0.01, dislike:0 };
var SYMBOLS = { love:'❤️', flower:'🌹', spark:'🔥', clap:'👏', star:'⭐', dislike:'👎' };

/* ═══════════════════════════════════════════════════════════
   TOAST
   ═══════════════════════════════════════════════════════════ */
function toast(msg, type){
  var c = document.getElementById('toasts');
  var t = document.createElement('div');
  t.className = 'gr-toast';
  var icon = type === 'error' ? 'fa-triangle-exclamation' : 'fa-circle-check';
  if(type === 'error') t.style.borderColor = 'rgba(239,68,68,.55)';
  t.innerHTML = '<i class="fa-solid ' + icon + '"></i> ' + msg;
  c.appendChild(t);
  requestAnimationFrame(function(){ t.classList.add('show'); });
  setTimeout(function(){
    t.classList.remove('show');
    setTimeout(function(){ t.remove(); }, 300);
  }, 2600);
}

/* ═══════════════════════════════════════════════════════════
   REACTION HANDLER — with heart animation + bounty display
   ═══════════════════════════════════════════════════════════ */
function handleReact(postId, k, btn){
  var post = S.posts.find(function(p){ return p.id === postId; });
  if(!post) return;

  if(k === 'dislike'){
    toast('Dislike added.');
    return;
  }

  if(!S.myReactions[postId]) S.myReactions[postId] = {};
  if(S.myReactions[postId][k]){
    toast('Already reacted.');
    return;
  }

  S.myReactions[postId][k] = true;
  post.reactions[k] = (post.reactions[k] || 0) + 1;

  /* Animation */
  playReactionAnimation(btn, k);

  /* Repaint */
  paint('feed');

  var bounty = BOUNTIES[k];
  if(bounty > 0){
    toast('+' + '$' + bounty.toFixed(2) + ' bounty earned');
  }
}

function playReactionAnimation(btn, k){
  if(!btn) return;
  var rect = btn.getBoundingClientRect();
  var cx = rect.left + rect.width / 2;
  var cy = rect.top + rect.height / 2;
  var heart = document.createElement('div');
  heart.className = 'gr-heart';
  heart.textContent = SYMBOLS[k];
  heart.style.left = (cx - 24) + 'px';
  heart.style.top = (cy - 24) + 'px';
  document.body.appendChild(heart);
  setTimeout(function(){ heart.remove(); }, 850);

  var amt = document.createElement('div');
  amt.className = 'gr-amt';
  amt.textContent = '+$' + BOUNTIES[k].toFixed(2);
  amt.style.left = cx + 'px';
  amt.style.top = (cy - 30) + 'px';
  amt.style.transform = 'translateX(-50%)';
  document.body.appendChild(amt);
  setTimeout(function(){ amt.remove(); }, 850);
}

/* ═══════════════════════════════════════════════════════════
   TAB PAINT
   ═══════════════════════════════════════════════════════════ */
function paint(tab){
  S.currentTab = tab || S.currentTab;
  var content = document.getElementById('content');
  if(S.currentTab === 'feed') content.innerHTML = renderFeed();
  else if(S.currentTab === 'members') content.innerHTML = renderMembers();
  else if(S.currentTab === 'media') content.innerHTML = renderMedia();
  else if(S.currentTab === 'events') content.innerHTML = renderEvents();
  else if(S.currentTab === 'live') content.innerHTML = renderLive();
  else if(S.currentTab === 'about') content.innerHTML = renderAbout();

  document.querySelectorAll('.gr-tab').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-tab') === S.currentTab);
  });

  wirePostInteractions();
}
window.paint = paint;

/* ═══════════════════════════════════════════════════════════
   WIRE POST INTERACTIONS
   ═══════════════════════════════════════════════════════════ */
function wirePostInteractions(){
  var content = document.getElementById('content');
  if(!content) return;

  /* Reactions */
  content.querySelectorAll('.gr-react').forEach(function(b){
    b.addEventListener('click', function(){
      handleReact(this.getAttribute('data-post'), this.getAttribute('data-react'), this);
    });
  });

  /* Comment toggle */
  content.querySelectorAll('[data-comment-toggle]').forEach(function(b){
    b.addEventListener('click', function(){
      var pid = this.getAttribute('data-comment-toggle');
      var box = document.getElementById('comments-' + pid);
      if(box) box.classList.toggle('open');
    });
  });

  /* Add comment */
  content.querySelectorAll('[data-add-comment]').forEach(function(b){
    b.addEventListener('click', function(){
      var pid = this.getAttribute('data-add-comment');
      var ta = document.getElementById('ci-' + pid);
      var txt = (ta.value || '').trim();
      if(!txt) return;
      if(!S.comments[pid]) S.comments[pid] = [];
      S.comments[pid].push({
        id: 'c' + Date.now(),
        name: 'You',
        text: txt,
        color: 'light-green',
        reactions: {}
      });
      ta.value = '';
      toast('Comment added.');
      paint('feed');
      var box = document.getElementById('comments-' + pid);
      if(box) box.classList.add('open');
    });
  });

  /* Share */
  content.querySelectorAll('[data-share]').forEach(function(b){
    b.addEventListener('click', function(){ toast('Shared.'); });
  });
}

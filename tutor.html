ZT.loadChatMessages = async function(){
  var host = document.getElementById('zt-chat-body'); if(!host) return;
  var c = sb(); if(!c) return;
  var tid = ZT.State.chatThreadId; if(!tid) return;
  try {
    var r = await c.from('tutor_chat_messages').select('*').eq('thread_id', tid).order('created_at', { ascending: true }).limit(200);
    if(r.error){ console.warn(r.error); return; }
    var msgs = r.data || [];
    /* fetch missing profiles */
    var ids = Array.from(new Set(msgs.map(function(m){ return m.sender_id; })));
    var missing = ids.filter(function(id){ return !ZT.State.profileCache[id]; });
    if(missing.length){
      var pr = await c.from('profiles').select('id,name,username,avatar').in('id', missing);
      (pr.data || []).forEach(function(p){ ZT.State.profileCache[p.id] = p; });
    }
    ZT.State.chatMessages = msgs;
    ZT.paintChatMessages();
  } catch(e){}
};

ZT.paintChatMessages = function(){
  var host = document.getElementById('zt-chat-body'); if(!host) return;
  var me = ZT.State.currentUser;
  var msgs = ZT.State.chatMessages || [];
  if(!msgs.length){
    host.innerHTML = '<div style="text-align:center;color:#64748b;font-size:12px;padding:20px;">No messages yet. Say hi! 👋</div>';
    return;
  }
  var wasAtBottom = (host.scrollTop + host.clientHeight) >= (host.scrollHeight - 40);
  var h = '';
  var lastSender = null;
  var lastDate = null;

  msgs.forEach(function(m){
    var mine = m.sender_id === me.id;
    var sender = ZT.profileOf(m.sender_id);

    /* Date divider */
    var mDate = new Date(m.created_at);
    var dateKey = mDate.toDateString();
    if(dateKey !== lastDate){
      var today = new Date().toDateString();
      var yest = new Date(Date.now() - 86400000).toDateString();
      var label = dateKey === today ? 'Today' : (dateKey === yest ? 'Yesterday' : mDate.toLocaleDateString(undefined, { day:'numeric', month:'short' }));
      h += '<div style="text-align:center;margin:10px 0 6px;"><span style="background:#1e293b;color:#94a3b8;font-size:10px;font-weight:800;padding:3px 10px;border-radius:10px;">' + label + '</span></div>';
      lastSender = null;
      lastDate = dateKey;
    }

    /* Sender name for group chat */
    if(!mine && lastSender !== m.sender_id){
      h += '<div style="display:flex;gap:6px;align-items:center;padding:2px 4px;margin-top:2px;">';
      h += '<img src="' + ZT.escape(ZT.safeAvatar(sender)) + '" style="width:20px;height:20px;border-radius:50%;object-fit:cover;">';
      h += '<div style="font-size:10.5px;color:#94a3b8;font-weight:800;">' + ZT.escape(sender.name || 'User') + '</div>';
      h += '</div>';
    }

    h += '<div class="zt-msg ' + (mine ? 'out' : 'in') + '" data-msg-id="' + ZT.escape(m.id) + '">';
    if(m.audio_url){
      h += '<audio controls src="' + ZT.escape(m.audio_url) + '"></audio>';
      if(m.audio_seconds) h += '<span style="font-size:10px;opacity:.7;margin-left:6px;">' + m.audio_seconds + 's</span>';
    } else {
      h += ZT.escape(m.body || '');
    }
    h += '<span class="t">' + ZT.timeAgo(m.created_at) + (mine ? ' <i class="fa-solid fa-check" style="color:#10b981;font-size:9px;"></i>' : '') + '</span></div>';
    lastSender = m.sender_id;
  });
  host.innerHTML = h;
  if(wasAtBottom) host.scrollTop = host.scrollHeight;
};

/* Pause chat polling globally when Live active */
ZT._isLiveActive = false;

ZT.startChatPoll = function(){
  if(ZT.State.chatTimer) clearInterval(ZT.State.chatTimer);
  ZT.State.chatTimer = setInterval(function(){
    if(ZT.State.currentView !== 'chat'){ clearInterval(ZT.State.chatTimer); ZT.State.chatTimer = null; return; }
    if(document.hidden) return;
    if(ZT._isLiveActive) return; /* ← NEW: skip when live */
    ZT.loadChatMessages();
  }, 15000); /* ← 8s → 15s */
};

ZT.sendChatText = async function(){
  var me = ZT.State.currentUser; if(!me) return;

  if(ZT.State.currentCircle && ZT.State.currentCircle.chat_locked && !(ZT.State.myRoleInCircle === 'tutor' || ZT.State.myRoleInCircle === 'admin' || ZT.State.myRoleInCircle === 'owner')){
    ZT.toast('Chat is locked.', 'warning');
    return;
  }

  var inp = document.getElementById('zt-chat-input'); if(!inp) return;
  var body = (inp.value || '').trim(); if(!body) return;
  inp.value = ''; inp.style.height = 'auto';
  var tid = ZT.State.chatThreadId; if(!tid) return;
  /* Optimistic */
  var tmpId = ZT.uuid();
  var row = { id: tmpId, thread_id: tid, sender_id: me.id, body: body, created_at: new Date().toISOString() };
  ZT.State.chatMessages.push(row);
  if(!ZT.State.profileCache[me.id]) ZT.State.profileCache[me.id] = me;
  ZT.paintChatMessages();
  var bodyEl = document.getElementById('zt-chat-body'); if(bodyEl) bodyEl.scrollTop = bodyEl.scrollHeight;
  try {
    var c = sb();
    var r = await c.from('tutor_chat_messages').insert({ thread_id: tid, sender_id: me.id, body: body }).select().maybeSingle();
    if(r.error) throw r.error;
    /* replace optimistic row */
    var idx = ZT.State.chatMessages.findIndex(function(x){ return x.id === tmpId; });
    if(idx >= 0 && r.data) ZT.State.chatMessages[idx] = r.data;
  } catch(e){
    ZT.State.chatMessages = ZT.State.chatMessages.filter(function(x){ return x.id !== tmpId; });
    ZT.paintChatMessages();
    ZT.toast('Send failed.', 'error');
  }
};

  ZT._pauseAllBackgroundActivity();

  var cir = ZT.State.currentCircle;
  var me = ZT.State.currentUser;
  var role = ZT.State.myRoleInCircle;
  var isTutor = role === 'tutor' || role === 'admin' || role === 'owner';

  if(!role){
    ZT.toast('Join this circle first to attend live classes.', 'warning');
    ZT._resumeBackgroundActivity();
    return;
  }
  if(!window.LivekitClient){ ZT.toast('LiveKit SDK not loaded. Refresh.', 'error'); ZT._resumeBackgroundActivity(); return; }
  if(!ZT.TOKEN_SERVER){ ZT.toast('Token server missing.', 'error'); ZT._resumeBackgroundActivity(); return; }

  ZT.toast('Connecting to live class…');
  ZT._lk.isTutor = isTutor;
  ZT._lk.approved = isTutor ? true : false;
  ZT._lk.pendingJoins = [];
  ZT._lk.raisedHands = [];
  ZT._lk.handLog = [];
  ZT._lk.speakers = {};

  try {
    var res = await fetch(ZT.TOKEN_SERVER, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        room: 'circle-' + cir.id,
        user: (me.name || 'User') + '-' + me.id.slice(0, 6),
        role: isTutor ? 'tutor' : 'listener'
      })
    });
    var data = await res.json();
    if(!data.token){ throw new Error(data.error || 'No token'); }

    var Room = window.LivekitClient.Room;
    var room = new Room({
      adaptiveStream: true,
      dynacast: true,
      videoCaptureDefaults: {
        resolution: { width: 1280, height: 720, frameRate: 30 },
        facingMode: 'user'
      },
      audioCaptureDefaults: {
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true,
        sampleRate: 48000,
        channelCount: 1
      },
      publishDefaults: {
        videoSimulcastLayers: [
          { width: 320, height: 180, encoding: { maxBitrate: 150000, maxFramerate: 15 } },
          { width: 640, height: 360, encoding: { maxBitrate: 500000, maxFramerate: 20 } },
          { width: 1280, height: 720, encoding: { maxBitrate: 1700000, maxFramerate: 30 } }
        ],
        videoCodec: 'vp9',
        dtx: true,
        red: true,
        stopMicTrackOnMute: false
      }
    });
    ZT._lk.room = room;

    room.on('participantConnected', function(p){
      ZT.schedulePaintLiveGrid(); ZT.paintLiveParticipants();
    });
    room.on('participantDisconnected', function(p){
      ZT._lk.raisedHands = (ZT._lk.raisedHands || []).filter(function(x){ return x.identity !== p.identity; });
      ZT._lk.pendingJoins = (ZT._lk.pendingJoins || []).filter(function(x){ return x.identity !== p.identity; });
      ZT.paintRaisedHandBadge(); ZT.paintPendingBadge();
      ZT.schedulePaintLiveGrid(); ZT.paintLiveParticipants();
    });
    room.on('trackSubscribed', function(){ ZT.schedulePaintLiveGrid(); });
    room.on('trackUnsubscribed', function(){ ZT.schedulePaintLiveGrid(); });
    room.on('localTrackPublished', function(){ ZT.schedulePaintLiveGrid(); });
    room.on('localTrackUnpublished', function(){ ZT.schedulePaintLiveGrid(); });

    room.on('dataReceived', async function(payload, participant){
      try {
        var msg = new TextDecoder().decode(payload);
        var fromId = participant && participant.identity ? participant.identity : '';

        if(msg === '__END_CLASS__'){
          ZT.toast('Host ended the class.', 'warning');
          ZT.leaveLiveRoom();
          return;
        }

        if(msg.startsWith('__JOIN_REQUEST__:')){
          var parts = msg.split(':');
          var idJ = parts[1] || 'User';
          var nmJ = parts[2] || idJ.split('-')[0];
          if(!ZT._lk.pendingJoins) ZT._lk.pendingJoins = [];
          if(!ZT._lk.pendingJoins.find(function(x){ return x.identity === idJ; })){
            ZT._lk.pendingJoins.push({ identity: idJ, name: nmJ, at: Date.now() });
          }
          if(ZT._lk.isTutor){
            ZT.paintPendingBadge();
            ZT.toast('👤 ' + nmJ + ' wants to join', 'info');
          }
          return;
        }

        if(msg === '__JOIN_APPROVED__'){
          ZT._lk.approved = true;
          var banner = document.getElementById('zt-pending-banner');
          if(banner) banner.remove();
          ZT.toast('✅ Host approved! You can now interact.', 'success');
          ZT.haptic(20);
          ZT._recordLiveAttendance();
          return;
        }

        if(msg === '__JOIN_DENIED__'){
          ZT.toast('Host denied your request.', 'error');
          setTimeout(function(){ ZT.leaveLiveRoom(); }, 800);
          return;
        }

        if(msg === '__KICKED__'){
          ZT.toast('You were removed from the class.', 'error');
          setTimeout(function(){ ZT.leaveLiveRoom(); }, 800);
          return;
        }

        if(msg.startsWith('__HAND_RAISE__:')){
          var parts2 = msg.split(':');
          var idH = parts2[1] || 'User';
          var nmH = parts2[2] || idH.split('-')[0];
          if(!ZT._lk.raisedHands) ZT._lk.raisedHands = [];
          if(!ZT._lk.raisedHands.find(function(x){ return x.identity === idH; })){
            ZT._lk.raisedHands.push({ identity: idH, name: nmH, at: Date.now() });
          }
          if(ZT._lk.isTutor){
            ZT.paintRaisedHandBadge();
            ZT.toast('🙋 ' + nmH + ' raised hand', 'info');
          }
          return;
        }

        if(msg.startsWith('__HAND_LOWER__:')){
          var idL = msg.split(':')[1];
          ZT._lk.raisedHands = (ZT._lk.raisedHands || []).filter(function(x){ return x.identity !== idL; });
          if(ZT._lk.isTutor) ZT.paintRaisedHandBadge();
          return;
        }

        if(msg === '__PROMOTE_ME__'){
          ZT._lk.speakers[fromId] = true;
          ZT._lk.approved = true;
          ZT.toast('🎤 Host allowed you to speak. Camera ON', 'success');
          ZT.haptic(20);
          ZT._recordLiveAttendance();
          try {
           
          if(ZT._lk.room && ZT._lk.room.localParticipant){
            await ZT._lk.room.localParticipant.enableCameraAndMicrophone({
              resolution: { width: 1280, height: 720, frameRate: 30 }
            });
          }
          } catch(e){ console.warn('[promote cam]', e); }
          var micBtn = document.getElementById('zt-live-mic');
          if(micBtn){ micBtn.style.animation = ''; micBtn.style.color = '#10b981'; micBtn.style.borderColor = '#10b981'; }
          var camBtn = document.getElementById('zt-live-cam');
          if(camBtn){ camBtn.style.color = '#10b981'; camBtn.style.borderColor = '#10b981'; }
          setTimeout(ZT.paintLiveGrid, 300);
          return;
        }

        if(msg === '__DEMOTED__'){
          ZT._lk.speakers[fromId] = false;
          ZT.toast('You were moved to listener.', 'info');
          try {
            if(ZT._lk.room && ZT._lk.room.localParticipant){
              await ZT._lk.room.localParticipant.setCameraEnabled(false);
              await ZT._lk.room.localParticipant.setMicrophoneEnabled(false);
            }
          } catch(e){}
          var micBtn2 = document.getElementById('zt-live-mic');
          if(micBtn2){ micBtn2.style.animation = ''; micBtn2.style.color = ''; micBtn2.style.borderColor = ''; }
          var camBtn2 = document.getElementById('zt-live-cam');
          if(camBtn2){ camBtn2.style.color = ''; camBtn2.style.borderColor = ''; }
          setTimeout(ZT.paintLiveGrid, 300);
          return;
        }

        if(msg === '__DISMISS_HAND__'){
          var btn = document.getElementById('zt-live-hand');
          if(btn){ btn.style.color = ''; btn.style.borderColor = ''; }
          ZT._lk.handRaised = false;
          ZT.toast('Host dismissed your hand', 'info');
          return;
        }

        var el = document.getElementById('zt-live-chat');
        if(el){
          el.innerHTML += '<div style="margin-bottom:5px;line-height:1.5;">' + ZT.escape(msg) + '</div>';
          el.scrollTop = el.scrollHeight;
        }
      } catch(e){ console.warn('[data]', e); }
    });

    room.on('disconnected', function(){
      ZT._lk.connected = false;
      ZT._lk.room = null;
      ZT._resumeBackgroundActivity();
      ZT._routeToLiveTab();
    });

    await room.connect(ZT.LIVEKIT_URL, data.token);
    ZT._lk.connected = true;

    if(isTutor){
      try {
        await room.localParticipant.enableCameraAndMicrophone({
          resolution: { width: 1280, height: 720, frameRate: 30 }
        });
      } catch(e){ console.warn('[live]', e); }
    } else {
      /* Student: send join request after connecting */
      try {
        var myIdentity = (me.name || 'User') + '-' + me.id.slice(0, 6);
        await room.localParticipant.publishData(
          new TextEncoder().encode('__JOIN_REQUEST__:' + myIdentity + ':' + (me.name || 'User'))
        );
      } catch(e){ console.warn('[join req]', e); }
    }

    ZT.toast(isTutor ? 'Connected as host ✓' : 'Request sent. Waiting for approval…');
    ZT.haptic(15);
    ZT._routeToLiveTab();

  } catch(e){
    console.error('[live join]', e);
    ZT._lk.connected = false;
    ZT._lk.room = null;
    ZT._resumeBackgroundActivity();
    ZT.toast('Join failed: ' + ((e && e.message) || 'unknown'), 'error');
  }
};

/* Debounced paint — prevents multiple re-renders per event */
ZT._paintTimer = null;
ZT.schedulePaintLiveGrid = function(){
  if(ZT._paintTimer) clearTimeout(ZT._paintTimer);
  ZT._paintTimer = setTimeout(function(){
    ZT._paintTimer = null;
    ZT.paintLiveGrid();
  }, 250);
};

ZT.paintLiveGrid = function(){
  var grid = document.getElementById('zt-video-grid');
  var pip = document.getElementById('zt-video-pip');
  if(!grid || !ZT._lk.room) return;

  ZT._lk.audioEls.forEach(function(a){ try { a.remove(); } catch(e){} });
  ZT._lk.audioEls = [];

  var room = ZT._lk.room;
  var remote = [];
  room.remoteParticipants.forEach(function(p){ remote.push(p); });
  var local = room.localParticipant;

  function hasVideo(p){
    if(!p || !p.trackPublications) return false;
    var f = false;
    p.trackPublications.forEach(function(pub){ if(pub.kind === 'video' && pub.track) f = true; });
    return f;
  }
  function hasAudio(p){
    if(!p || !p.trackPublications) return false;
    var f = false;
    p.trackPublications.forEach(function(pub){ if(pub.kind === 'audio' && pub.track) f = true; });
    return f;
  }
  function sidOf(p){ return (p.sid || p.identity || '').replace(/[^a-zA-Z0-9-]/g, ''); }
  function shortName(p){ return (p.identity || 'User').split('-')[0]; }
  function userIdOf(p){
    var parts = (p.identity || '').split('-');
    return parts.length > 1 ? parts[1] : '';
  }

  /* DISCUSSION MODE — equal grid for all speakers (INCLUDING local host) */
  if(ZT._lk.discussionMode){
    /* Build speakers list from remote AND local */
    var speakers = remote.filter(function(p){ return hasVideo(p) || hasAudio(p); });
    /* Local host ko bhi add karo agar camera/mic on hai */
    if(hasVideo(local) || hasAudio(local)){
      speakers = [local].concat(speakers);
    }
    var listeners = remote.filter(function(p){ return !hasVideo(p) && !hasAudio(p); });

    if(speakers.length === 0){
      pip.style.display = 'none';
      grid.style.gridTemplateColumns = '1fr';
      var h0 = '';
      h0 += '<div style="position:relative;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;background:#0f172a;border-radius:10px;">';
      h0 += '<div style="text-align:center;">';
      h0 += '<i class="fa-solid fa-people-group" style="font-size:40px;color:#10b981;margin-bottom:8px;"></i>';
      h0 += '<div style="font-size:12px;color:#94a3b8;font-weight:700;">Group discussion ready</div>';
      h0 += '<div style="font-size:10px;color:#64748b;margin-top:4px;">Tap participants to add speakers</div>';
      h0 += '</div></div>';
      grid.innerHTML = h0;
      return;
    }

    pip.style.display = 'block';
    var total = speakers.length + 1;
    var cols = total <= 1 ? 1 : (total <= 2 ? 2 : (total <= 4 ? 2 : (total <= 6 ? 3 : 3)));
    grid.style.gridTemplateColumns = 'repeat(' + cols + ', 1fr)';

    var gh = '';
    speakers.forEach(function(p){
      var isLocalInSpeakers = (p === local);
      gh += '<div style="position:relative;aspect-ratio:4/3;background:#0f172a;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;border:2px solid ' + (isLocalInSpeakers ? 'rgba(59,130,246,.6)' : 'rgba(16,185,129,.4)') + ';">';
      if(hasVideo(p)){
        gh += '<video id="zt-vid-' + sidOf(p) + '" autoplay playsinline ' + (isLocalInSpeakers ? 'muted ' : '') + 'style="width:100%;height:100%;object-fit:cover;transform:scaleX(-1);"></video>';
      } else {
        gh += '<div style="text-align:center;"><div style="width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#10b981,#3b82f6);display:flex;align-items:center;justify-content:center;margin:0 auto 6px;font-weight:900;color:#000;font-size:20px;">' + ZT.escape(shortName(p).charAt(0).toUpperCase()) + '</div><div style="font-size:10px;color:#94a3b8;font-weight:700;">' + ZT.escape(shortName(p)) + '</div></div>';
      }
      gh += '<button onclick="ZT.openUserProfile(\'' + ZT.escape(userIdOf(p)) + '\')" style="position:absolute;bottom:6px;left:6px;font-size:9px;background:rgba(0,0,0,.75);padding:2px 6px;border-radius:6px;color:#fff;font-weight:700;cursor:pointer;border:none;">' + ZT.escape(shortName(p)) + (hasAudio(p) ? ' 🎤' : ' 🔇') + '</button>';
      gh += '</div>';
    });
    grid.innerHTML = gh;

    /* Local PiP — hide in discussion mode (local is now in the grid) */
    var ph = '';
    if(false && hasVideo(local)){
      ph += '<video id="zt-vid-pip" autoplay playsinline muted style="width:100%;height:100%;object-fit:cover;"></video>';
    } else {
      ph += '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#0f172a;"><div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#10b981,#3b82f6);display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;font-size:16px;">' + ZT.escape(shortName(local).charAt(0).toUpperCase()) + '</div></div>';
    }
    pip.innerHTML = ph;

    /* Attach */
    speakers.forEach(function(p){
      p.trackPublications.forEach(function(pub){
        if(pub.kind === 'video' && pub.track && pub.track.attach){
          var el = document.getElementById('zt-vid-' + sidOf(p));
          if(el){ try { pub.track.attach(el); el.play().catch(function(){}); } catch(e){} }
        }
        if(pub.kind === 'audio' && pub.track && pub.track.attach){
          try { var a = pub.track.attach(); a.autoplay = true; document.body.appendChild(a); ZT._lk.audioEls.push(a); } catch(e){}
        }
      });
    });
    local.trackPublications.forEach(function(pub){
      if(pub.kind === 'video' && pub.track && pub.track.attach){
        var el = document.getElementById('zt-vid-pip');
        if(el){ try { pub.track.attach(el); el.muted = true; el.play().catch(function(){}); } catch(e){} }
      }
    });
    return;
  }

  /* SINGLE-SPEAKER MODE (default) */
  if(remote.length === 0){
    pip.style.display = 'none';
    var h1 = '';
    h1 += '<div style="position:relative;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;background:#0f172a;">';
    if(hasVideo(local)){
      h1 += '<video id="zt-vid-' + sidOf(local) + '" autoplay playsinline muted style="width:100%;height:100%;object-fit:cover;"></video>';
    } else {
      h1 += '<div style="text-align:center;"><div style="width:70px;height:70px;border-radius:50%;background:linear-gradient(135deg,#10b981,#3b82f6);display:flex;align-items:center;justify-content:center;margin:0 auto 10px;font-weight:900;color:#000;font-size:28px;">' + ZT.escape(shortName(local).charAt(0).toUpperCase()) + '</div><div style="font-size:12px;color:#94a3b8;font-weight:700;">' + ZT.escape(shortName(local)) + ' (You)</div></div>';
    }
    h1 += '<div style="position:absolute;bottom:8px;left:8px;font-size:10px;background:rgba(0,0,0,.75);padding:3px 8px;border-radius:8px;color:#fff;font-weight:700;">You' + (hasAudio(local) ? ' 🎤' : ' 🔇') + '</div>';
    h1 += '</div>';
    grid.innerHTML = h1;
    grid.style.gridTemplateColumns = '1fr';
    local.trackPublications.forEach(function(pub){
      if(pub.kind === 'video' && pub.track && pub.track.attach){
        var el = document.getElementById('zt-vid-' + sidOf(local));
        if(el){ try { pub.track.attach(el); el.muted = true; el.play().catch(function(){}); } catch(e){} }
      }
    });
    return;
  }

  pip.style.display = 'block';
  grid.style.gridTemplateColumns = '1fr';
  var bigPeer = remote[0];
  var others = remote.filter(function(p){ return p !== bigPeer; });

  var gh2 = '';
  gh2 += '<div style="position:relative;aspect-ratio:16/9;background:#0f172a;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center;">';
  if(hasVideo(bigPeer)){
    gh2 += '<video id="zt-vid-' + sidOf(bigPeer) + '" autoplay playsinline style="width:100%;height:100%;object-fit:cover;transform:scaleX(-1);"></video>';
  } else {
    gh2 += '<div style="text-align:center;"><div style="width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#10b981,#3b82f6);display:flex;align-items:center;justify-content:center;margin:0 auto 8px;font-weight:900;color:#000;font-size:24px;">' + ZT.escape(shortName(bigPeer).charAt(0).toUpperCase()) + '</div><div style="font-size:11px;color:#94a3b8;font-weight:700;">' + ZT.escape(shortName(bigPeer)) + '</div></div>';
  }
  gh2 += '<button onclick="ZT.openUserProfile(\'' + ZT.escape(userIdOf(bigPeer)) + '\')" style="position:absolute;bottom:8px;left:8px;font-size:10px;background:rgba(0,0,0,.75);padding:3px 8px;border-radius:8px;color:#fff;font-weight:700;cursor:pointer;border:none;">' + ZT.escape(shortName(bigPeer)) + (hasAudio(bigPeer) ? ' 🎤' : ' 🔇') + '</button>';
  gh2 += '</div>';

  if(others.length){
    gh2 += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:6px;margin-top:6px;">';
    others.forEach(function(p){
      gh2 += '<div style="position:relative;aspect-ratio:16/9;background:#0f172a;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;">';
      if(hasVideo(p)){
        gh2 += '<video id="zt-vid-' + sidOf(p) + '" autoplay playsinline style="width:100%;height:100%;object-fit:cover;transform:scaleX(-1);"></video>';
      } else {
        gh2 += '<div style="width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#10b981,#3b82f6);display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;font-size:14px;">' + ZT.escape(shortName(p).charAt(0).toUpperCase()) + '</div>';
      }
      gh2 += '<button onclick="ZT.openUserProfile(\'' + ZT.escape(userIdOf(p)) + '\')" style="position:absolute;bottom:4px;left:4px;font-size:8.5px;background:rgba(0,0,0,.7);padding:2px 5px;border-radius:5px;color:#fff;font-weight:700;cursor:pointer;border:none;">' + ZT.escape(shortName(p)) + '</button>';
      gh2 += '</div>';
    });
    gh2 += '</div>';
  }
  grid.innerHTML = gh2;

  var ph2 = '';
  if(hasVideo(local)){
    ph2 += '<video id="zt-vid-pip" autoplay playsinline muted style="width:100%;height:100%;object-fit:cover;"></video>';
  } else {
    ph2 += '<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#0f172a;"><div style="width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#10b981,#3b82f6);display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;font-size:16px;">' + ZT.escape(shortName(local).charAt(0).toUpperCase()) + '</div></div>';
  }
  pip.innerHTML = ph2;

  remote.forEach(function(p){
    p.trackPublications.forEach(function(pub){
      if(pub.kind === 'video' && pub.track && pub.track.attach){
        var el = document.getElementById('zt-vid-' + sidOf(p));
        if(el){ try { pub.track.attach(el); el.play().catch(function(){}); } catch(e){} }
      }
      if(pub.kind === 'audio' && pub.track && pub.track.attach){
        try { var a = pub.track.attach(); a.autoplay = true; document.body.appendChild(a); ZT._lk.audioEls.push(a); } catch(e){}
      }
    });
  });
  local.trackPublications.forEach(function(pub){
    if(pub.kind === 'video' && pub.track && pub.track.attach){
      var el = document.getElementById('zt-vid-pip');
      if(el){ try { pub.track.attach(el); el.muted = true; el.play().catch(function(){}); } catch(e){} }
    }
  });
};

/* ============================================================
   LIVE RECORDING (Pro tutor only)
   ============================================================ */
ZT.toggleLiveRecording = async function(){
  if(!ZT._lk.room || !ZT._lk.isTutor) return;
  var me = ZT.State.currentUser;
  /* Recording: only paid Pro/Elite/Business — NOT trial */
  var _plan = (me && me.pro_plan) || 'free';
  var _hasPro = !!( _plan === 'pro' || _plan === 'elite' || _plan === 'business' );
  if(!_hasPro){
    ZT.toast('Recording is a Pro feature. Trial includes Live Cam only.', 'warning');
    return;
  }
  /* Soft cap: 500 GB per month per tutor */
  try {
    var _monthStart = new Date();
    _monthStart.setDate(1); _monthStart.setHours(0,0,0,0);
    var _usageR = await ZT.sb().from('tutor_r2_usage')
      .select('size_bytes')
      .eq('user_id', me.id)
      .gte('created_at', _monthStart.toISOString());
    var _totalBytes = 0;
    (_usageR.data || []).forEach(function(row){ _totalBytes += Number(row.size_bytes) || 0; });
    var _totalGB = _totalBytes / (1024*1024*1024);
    if(_totalGB >= 500){
      ZT.toast('Monthly 500 GB storage cap reached. Oldest recordings will be deleted automatically.', 'warning');
      return;
    }
  } catch(e){ /* continue anyway */ }

  if(ZT._lk.recording){
    ZT._lk.recording = false;
    var btn = document.getElementById('zt-live-rec');
    if(btn){ btn.style.color = ''; btn.style.borderColor = ''; }
    if(ZT._lk.egressTimer){ clearInterval(ZT._lk.egressTimer); ZT._lk.egressTimer = null; }
    var durSec = ZT._lk.recStart ? Math.floor((Date.now() - ZT._lk.recStart) / 1000) : 0;
    ZT.toast('Stopping recording…');
    try {
      var res = await fetch(ZT.TOKEN_SERVER + 'record/stop', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ egress_id: ZT._lk.egressId })
      });
      var data = await res.json();
      if(!res.ok){ throw new Error(data.error || 'stop failed'); }
      setTimeout(function(){ ZT.saveRecordingEntry(durSec); }, 20000);
      ZT.toast('Recording saved — processing (' + durSec + 's)');
    } catch(e){
      console.error('[rec stop]', e);
      ZT.toast('Stop failed: ' + ((e && e.message) || ''), 'error');
    }
    return;
  }

  var cir = ZT.State.currentCircle;
  var filename = 'recordings/circle-' + cir.id + '/' + Date.now() + '.mp4';
  ZT.toast('Starting recording…');
  try {
    var res2 = await fetch(ZT.TOKEN_SERVER + 'record/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ room: 'circle-' + cir.id, filepath: filename })
    });
    var data2 = await res2.json();
    if(!res2.ok){ throw new Error(data2.error || 'start failed'); }
    var eid = data2.egress_id || data2.egressId;
    if(!eid) throw new Error('Worker did not return egress_id: ' + JSON.stringify(data2));
    ZT._lk.egressId = eid;
    ZT._lk.recFilepath = data2.filepath || filename;
    ZT._lk.recording = true;
    ZT._lk.recStart = Date.now();
    var btn2 = document.getElementById('zt-live-rec');
    if(btn2){ btn2.style.color = '#a16262'; btn2.style.borderColor = '#a16262'; }
    ZT.toast('🔴 Recording started');
    ZT.haptic(15);
    ZT._lk.egressTimer = setInterval(function(){
      if(!ZT._lk.recStart) return;
      var s = Math.floor((Date.now() - ZT._lk.recStart) / 1000);
      var mm = String(Math.floor(s / 60)).padStart(2, '0');
      var ss = String(s % 60).padStart(2, '0');
      var b = document.getElementById('zt-live-rec');
      if(b) b.innerHTML = '<i class="fa-solid fa-circle"></i><span style="position:absolute;bottom:1px;left:50%;transform:translateX(-50%);font-size:8px;font-weight:900;color:#fff;white-space:nowrap;">' + mm + ':' + ss + '</span>';
      /* Storage cap check — every hour (no time cap, unlimited recording) */
      if(s > 0 && s % 3600 === 0){
        ZT._checkStorageCapAsync();
      }
    }, 1000);
  } catch(e){
    console.error('[rec start]', e);
    ZT.toast('Start failed: ' + ((e && e.message) || ''), 'error');
  }
};
ZT._checkStorageCapAsync = async function(){
  var me = ZT.State.currentUser;
  if(!me) return;
  try {
    var monthStart = new Date();
    monthStart.setDate(1); monthStart.setHours(0,0,0,0);
    var r = await ZT.sb().from('tutor_r2_usage')
      .select('size_bytes')
      .eq('user_id', me.id)
      .gte('created_at', monthStart.toISOString());
    var total = 0;
    (r.data || []).forEach(function(row){ total += Number(row.size_bytes) || 0; });
    var totalGB = total / (1024*1024*1024);
    
    if(totalGB >= 1024){
      /* Hard cap reached */
      ZT.toast('Monthly 1 TB storage cap reached. Recording stopped. Resets on 1st of month.', 'error');
      ZT.toggleLiveRecording();
      return;
    }
    if(totalGB >= 500){
      /* Soft cap — warn */
      ZT.toast('Storage at ' + totalGB.toFixed(0) + ' GB. Old recordings (30+ days) will be auto-deleted.', 'warning');
    }
  } catch(e){}
};

ZT.saveRecordingEntry = async function(durSec){
  var cir = ZT.State.currentCircle; if(!cir) return;
  var me = ZT.State.currentUser; if(!me) return;
  var c = sb(); if(!c) return;
  var path = ZT._lk.recFilepath || '';
  var url = ZT.R2_PUBLIC_BASE + '/' + path;
  try {
    await c.from('tutor_recordings').insert({
      circle_id: cir.id,
      egress_id: ZT._lk.egressId,
      room_name: 'circle-' + cir.id,
      title: 'Recording ' + new Date().toLocaleString(),
      file_path: path,
      file_url: url,
      duration_sec: durSec,
      recorded_by: me.id,
      status: 'ready',
      ended_at: new Date().toISOString()
    });
    ZT.toast('Recording saved to library ✓');
    ZT._lk.recFilepath = null;
    ZT._lk.egressId = null;
    ZT._lk.recStart = null;
  } catch(e){

  }
};

ZT.loadSlidesList = async function(){
  var host = document.getElementById('zt-slides-host'); if(!host) return;
  var cir = ZT.State.currentCircle; if(!cir) return;
  var role = ZT.State.myRoleInCircle || 'student';
  var me = ZT.State.currentUser;
  var c = sb(); if(!c) return;
  /* Load completion status once */
  ZT.State.completedSlides = ZT.State.completedSlides || {};
  if(me && !ZT._slidesStatusLoaded){
    try {
      var prog = await c.from('tutor_slide_progress').select('slide_id').eq('user_id', me.id);
      (prog.data || []).forEach(function(p){ ZT.State.completedSlides[p.slide_id] = true; });
      ZT._slidesStatusLoaded = true;
    } catch(e){}
  }
  try {
    var r = await c.from('tutor_slides').select('*').eq('circle_id', cir.id).order('created_at', { ascending: false }).limit(60);
    if(r.error){ host.innerHTML = '<div class="zt-empty"><p>Could not load.</p></div>'; return; }
    var list = r.data || [];
    ZT.State.slides = list;
    /* Filter by search query */
    var q = (ZT._slideSearch || '').trim().toLowerCase();
    if(q){
      list = list.filter(function(s){
        var t = (s.title || '').toLowerCase();
        var d = (s.description || '').toLowerCase();
        return t.indexOf(q) !== -1 || d.indexOf(q) !== -1;
      });
    }
    var pendingSlides = (ZT.State.pendingAIGens || []).filter(function(j){ return j.kind === 'slide'; });
    if(!list.length && !pendingSlides.length){ host.innerHTML = '<div class="zt-empty"><i class="fa-solid fa-images"></i><p>No slide lessons yet.</p></div>'; return; }
    var h = '';
    list.forEach(function(s){
      var slideBg = s.banner_style ? ZT.gradientCss(s.banner_style) : '#111827';
      h += '<div style="position:relative;margin-bottom:10px;">';
      h += '<button class="zt-tile" style="background:' + slideBg + ';border-color:rgba(255,255,255,.08);margin-bottom:0;width:100%;" onclick="ZT.openSlidePlayer(\'' + ZT.escape(s.id) + '\')">';
       var isDone = !!ZT.State.completedSlides[s.id];
      h += '<div class="zt-tile-icon" style="background:rgba(16,185,129,.12);color:#6ee7b7;"><i class="fa-solid fa-images"></i></div>';
      h += '<div style="flex:1;min-width:0;padding-right:36px;"><div class="zt-tile-title">' + ZT.escape(s.title) + '</div>';
      h += '<div class="zt-tile-sub">' + ZT.timeAgo(s.created_at) + '</div></div>';
      if(isDone) h += '<i class="fa-solid fa-circle-check" style="color:#10b981;font-size:16px;margin-right:6px;"></i>';
      h += '<i class="fa-solid fa-chevron-right" style="color:#475569;"></i>';
      h += '</button>';
      if(role === 'tutor' || role === 'admin' || role === 'owner'){
        h += '<button onclick="ZT.openSlideMenu(\'' + ZT.escape(s.id) + '\',event)" style="position:absolute;top:8px;right:8px;background:rgba(0,0,0,.35);border:none;color:#fff;width:30px;height:30px;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2;"><i class="fa-solid fa-ellipsis-vertical"></i></button>';
      }
      h += '</div>';
    });
    var pendingHtml = '';
    pendingSlides.forEach(function(job){
      if(job.status === 'generating'){
        pendingHtml += '<div style="background:linear-gradient(135deg,rgba(16,185,129,.12),rgba(59,130,246,.08));border:1px solid rgba(16,185,129,.4);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;">';
        pendingHtml += '<div style="width:42px;height:42px;border-radius:12px;background:rgba(16,185,129,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="fa-solid fa-circle-notch fa-spin" style="color:#6ee7b7;font-size:16px;"></i></div>';
        pendingHtml += '<div style="flex:1;min-width:0;"><div style="font-size:14px;font-weight:800;color:#fff;">' + ZT.escape(job.title) + '</div>';
        pendingHtml += '<div style="font-size:11px;color:#6ee7b7;margin-top:2px;">⏳ AI is generating slides…</div></div></div>';
      } else if(job.status === 'error'){
        pendingHtml += '<div style="background:rgba(161,98,98,.10);border:1px solid rgba(161,98,98,.4);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;">';
        pendingHtml += '<div style="width:42px;height:42px;border-radius:12px;background:rgba(161,98,98,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="fa-solid fa-triangle-exclamation" style="color:#a16262;font-size:16px;"></i></div>';
        pendingHtml += '<div style="flex:1;min-width:0;"><div style="font-size:13px;font-weight:800;color:#c9a5a5;">' + ZT.escape(job.title) + ' — failed</div>';
        pendingHtml += '<div style="font-size:11px;color:#94a3b8;margin-top:2px;word-break:break-word;">' + ZT.escape(job.error || 'Unknown') + '</div></div>';
        pendingHtml += '<button onclick="ZT.dismissSlideAI(\'' + job.id + '\')" style="background:rgba(161,98,98,.2);border:1px solid rgba(161,98,98,.4);color:#c9a5a5;width:32px;height:32px;border-radius:8px;cursor:pointer;flex-shrink:0;"><i class="fa-solid fa-xmark"></i></button></div>';
      }
    });
    host.innerHTML = pendingHtml + h;
  } catch(e){ host.innerHTML = '<div class="zt-empty"><p>Error.</p></div>'; }
};

ZT.editSlide = async function(slideId){
  var c = sb(); if(!c) return;

  /* Load slide */
  var r = await c.from('tutor_slides').select('*').eq('id', slideId).maybeSingle();
  if(r.error || !r.data){ ZT.toast('Not found.', 'error'); return; }
  var data = r.data;

  /* Load existing items */
  var ir = await c.from('tutor_slide_items').select('*').eq('slide_id', slideId).order('order', { ascending: true });
  var items = (ir.data || []).map(function(x){
    return {
      text: x.text_content || '',
      image_url: x.image_url || '',
      audio_url: x.audio_url || ''
    };
  });

  /* Populate same state used by builder */
  ZT._editSlideId = slideId;
  ZT._newSlide = {
    items: items,
    banner: data.banner_style || 'classic',
    template: 'classic'
  };

  /* Same banner picker HTML as builder */
  var bannerHtml = '<div class="zt-st" style="margin:0;padding:0 4px;">Slide theme</div><div style="display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;">';
  ZT.SLIDE_TEMPLATES.forEach(function(t){
    var isActive = t.id === ZT._newSlide.banner;
    bannerHtml += '<div onclick="ZT.pickSlideTheme(\'' + t.id + '\')" data-slide-theme="' + t.id + '" style="flex-shrink:0;width:64px;height:56px;border-radius:12px;cursor:pointer;' + (t.css ? 'background:' + t.css + ';' : 'background:#0f172a;border:1px dashed #334155;') + 'border:' + (isActive ? '2px solid #10b981' : '2px solid rgba(255,255,255,.06)') + ';display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:' + (t.css ? '#fff' : '#64748b') + ';">';
    bannerHtml += '<i class="fa-solid ' + t.icon + '" style="font-size:14px;"></i>';
    bannerHtml += '<div style="font-size:8.5px;font-weight:900;letter-spacing:.3px;">' + ZT.escape(t.name) + '</div>';
    bannerHtml += '</div>';
  });
  bannerHtml += '</div>';

  var h = '';
  h += '<div class="zt-field"><label class="zt-label">Lesson title *</label><input id="zt-sl-title" class="zt-input" value="' + ZT.escape(data.title) + '"></div>';
  h += '<div class="zt-field"><label class="zt-label">Description</label><textarea id="zt-sl-desc" class="zt-textarea" style="min-height:60px;">' + ZT.escape(data.description || '') + '</textarea></div>';
  h += bannerHtml;
  h += '<div class="zt-st" style="margin-top:6px;">Slides</div>';
  h += '<div id="zt-sl-items-host"></div>';
  h += '<button class="zt-btn secondary" id="zt-sl-add" type="button" style="margin-top:6px;"><i class="fa-solid fa-plus"></i> Add slide</button>';

  ZT.Modal.open({
    title:'Edit Slide Lesson', icon:'fa-solid fa-images', submitLabel:'Save Changes',
    body: h,
    onOpen: function(){
      ZT.paintSlideBuilderItems();
      document.getElementById('zt-sl-add').onclick = function(){
        ZT._newSlide.items.push({ text:'', image_url:'', audio_url:'' });
        ZT.paintSlideBuilderItems();
      };
    },
    onSubmit: async function(){
      var title = (document.getElementById('zt-sl-title').value || '').trim();
      var desc = (document.getElementById('zt-sl-desc').value || '').trim();
      if(title.length < 2){ ZT.toast('Title required.', 'error'); return false; }
      if(!ZT._newSlide.items.length){ ZT.toast('Add at least one slide.', 'error'); return false; }

      var c = sb();

      var ur = await c.from('tutor_slides').update({
        title: title,
        description: desc || null,
        banner_style: ZT._newSlide.banner !== 'classic' ? ZT._newSlide.banner : null,
        updated_at: new Date().toISOString()
      }).eq('id', slideId);
      if(ur.error){ ZT.toast('Failed: ' + ur.error.message, 'error'); return false; }

      await c.from('tutor_slide_items').delete().eq('slide_id', slideId);

      for(var i = 0; i < ZT._newSlide.items.length; i++){

ZT.startSlideAIGeneration = async function(data){
  var jobId = ZT.uuid();
  ZT.State.pendingAIGens = ZT.State.pendingAIGens || [];
  ZT.State.pendingAIGens.push({ id: jobId, kind: 'slide', title: data.title, status: 'generating', error: null });
  ZT.loadSlidesList();

  try {
    var res = await fetch(ZT.TOKEN_SERVER + 'ai/generate-slides', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: data.text, count: data.count })
    });
    var out = await res.json();
    if(!res.ok || !out.ok){
      var m = out.error || 'AI failed';
      if(out.detail) m += ' — ' + String(out.detail).slice(0, 120);
      throw new Error(m);
    }

    var c = sb();
    var sr = await c.from('tutor_slides').insert({
      circle_id: ZT.State.currentCircle.id,
      author_id: ZT.State.currentUser.id,
      title: data.title,
      description: null,
      banner_style: null
    }).select().maybeSingle();
    if(sr.error) throw sr.error;

    var slideId = sr.data.id;
    for(var i = 0; i < out.slides.length; i++){
      var s = out.slides[i];
      await c.from('tutor_slide_items').insert({
        slide_id: slideId,
        order: i,
        text_content: (s.title ? s.title + '\n\n' : '') + (s.content || ''),
        image_url: null,
        audio_url: null
      });
    }

    ZT.State.pendingAIGens = ZT.State.pendingAIGens.filter(function(j){ return j.id !== jobId; });
    ZT.toast('✅ Lesson "' + data.title + '" created!');
    ZT.haptic(20);
    ZT.loadSlidesList();
  } catch(e){
    var j = ZT.State.pendingAIGens.find(function(x){ return x.id === jobId; });
    if(j){ j.status = 'error'; j.error = (e && e.message) || 'Failed'; }
    ZT.loadSlidesList();
  }
};

/* Slide audio recording — FIXED: force video/webm */
ZT.recordSlideAudio = async function(i){
  var btn = (typeof event !== 'undefined' && event) ? event.target : null;
  if(!navigator.mediaDevices || !window.MediaRecorder){ ZT.toast('Not supported.', 'error'); return; }
  try {
    var stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    var chunks = [];
    var recMime = '';
    var candidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
    for(var x = 0; x < candidates.length; x++){
      try { if(MediaRecorder.isTypeSupported(candidates[x])){ recMime = candidates[x]; break; } } catch(e){}
    }
    if(!recMime){ ZT.toast('No audio format.', 'error'); return; }

    var rec = new MediaRecorder(stream, { mimeType: recMime });
    rec.ondataavailable = function(e){ if(e.data && e.data.size > 0) chunks.push(e.data); };

    var stopped = false;
    var stopRec = function(){ if(stopped) return; stopped = true; try { rec.stop(); } catch(e){} };

    rec.onstop = async function(){
      try { stream.getTracks().forEach(function(t){ t.stop(); }); } catch(e){}
      if(!chunks.length){ ZT.toast('No audio.', 'warning'); ZT.paintSlideBuilderItems(); return; }

      var baseMime = (rec.mimeType || recMime).split(';')[0].trim();
      var sendMime = 'video/webm';
      if(baseMime.indexOf('mp4') !== -1) sendMime = 'video/mp4';
      var ext = sendMime === 'video/mp4' ? 'mp4' : 'webm';

      var blob = new Blob(chunks, { type: sendMime });
      if(blob.size < 500){ ZT.toast('Too short.', 'warning'); ZT.paintSlideBuilderItems(); return; }

      ZT.toast('Uploading slide audio…');

      try {
        var file = new File([blob], 'slide_' + i + '_' + Date.now() + '.' + ext, { type: sendMime });
        var url = await ZT.storeMedia(file);
        if(!url){ ZT.toast('Upload empty.', 'error'); ZT.paintSlideBuilderItems(); return; }
        if(ZT._newSlide && ZT._newSlide.items[i]){
          ZT._newSlide.items[i].audio_url = url;
          ZT.paintSlideBuilderItems();
          ZT.toast('Audio recorded ✓');
        }
      } catch(e){
        console.error('[slide-audio upload]', e);
        ZT.toast('Audio failed: ' + ((e && e.message) || 'unknown'), 'error');
        ZT.paintSlideBuilderItems();
      }
    };

    rec.start(500);
    var secs = 0;
    var t = setInterval(function(){ secs++; if(secs >= 60){ clearInterval(t); stopRec(); } }, 1000);

    setTimeout(function(){
      if(btn && btn.parentNode){
        var stopBtn = document.createElement('button');
        stopBtn.type = 'button';
        stopBtn.className = 'zt-media-btn';
        stopBtn.style.background = '#a16262';
        stopBtn.style.borderColor = '#a16262';
        stopBtn.style.color = '#fff';
        stopBtn.innerHTML = '<i class="fa-solid fa-stop"></i> STOP (' + secs + 's)';
        stopBtn.onclick = function(){
          clearInterval(t);
          stopRec();
          stopBtn.remove();
        };
        btn.parentNode.replaceChild(stopBtn, btn);
      }
    }, 60);
  } catch(e){ ZT.toast('Mic denied.', 'error'); }
};

ZT.paintSlidePlayer = function(){
  var stage = document.getElementById('zt-slide-stage'); if(!stage) return;
  var items = ZT.State.slideItems;
  var idx = ZT.State.slideIndex;
  var it = items[idx];
  if(!it){ stage.innerHTML = ''; return; }
  var h = '';
  if(it.image_url) h += '<img src="' + ZT.escape(it.image_url) + '">';
  else if(it.text_content) h += '<div style="padding:24px;color:#fff;font-size:18px;line-height:1.6;background:#0f172a;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;">' + ZT.escape(it.text_content) + '</div>';
  else h += '<div style="padding:24px;color:#94a3b8;text-align:center;">Empty slide</div>';
  stage.innerHTML = h;
  /* progress */
  var p = document.getElementById('zt-slide-progress');
  if(p){
    var ph = '';
    items.forEach(function(_, i){
      ph += '<div class="zt-slide-dot ' + (i < idx ? 'done' : (i === idx ? 'active' : '')) + '"></div>';
    });
    p.innerHTML = ph;
  }
  /* audio */
  var ah = document.getElementById('zt-slide-audio-host');
  if(ah){
    if(it.audio_url){
      ah.innerHTML = '<audio id="zt-slide-audio" controls src="' + ZT.escape(it.audio_url) + '" style="width:100%;"></audio>';
      ZT.State.slideAudio = document.getElementById('zt-slide-audio');
      ZT.State.slideAudio.addEventListener('ended', function(){ ZT.nextSlide(); });
    } else {
      ah.innerHTML = '';
      ZT.State.slideAudio = null;
    }
  }
  /* wire buttons */
  var pb = document.getElementById('zt-slide-prev');
  var nb = document.getElementById('zt-slide-next');
  if(pb) pb.onclick = ZT.prevSlide;
  if(nb) nb.onclick = ZT.nextSlide;
};

ZT._backToSlidesTab = function(){
  var cir = ZT.State.currentCircle;
  var rhost = document.getElementById('zt-room-content');
  if(cir && rhost){
    ZT.switchRoomTab('slides');
  } else {
    ZT.showView('slides');
  }
};

ZT.nextSlide = function(){
  if(ZT.State.slideIndex < ZT.State.slideItems.length - 1){
    ZT.State.slideIndex++;
    ZT.paintSlidePlayer();
    setTimeout(function(){ if(ZT.State.slideAudio) try { ZT.State.slideAudio.play(); } catch(e){} }, 100);
  }
};
ZT.prevSlide = function(){
  if(ZT.State.slideIndex > 0){
    ZT.State.slideIndex--;
    ZT.paintSlidePlayer();
  }
};

/* ────────────────────────────────────────────────────────────
   Async loaders for Owner Dashboard
   ──────────────────────────────────────────────────────────── */
ZT._dashLoadMoneyBar = async function(){
  var cir = ZT.State.currentCircle;
  var me  = ZT.State.currentUser;
  if(!cir || !me) return;
  var c = sb(); if(!c) return;

  try {
    var monthStart = new Date();
    monthStart.setDate(1);
    monthStart.setHours(0,0,0,0);
    var monthISO = monthStart.toISOString();

    /* This month: SUM(amount_paid) * 0.25 (owner share) */
    var r1 = await c.from('tutor_student_join_fees')
      .select('amount_paid')
      .eq('circle_id', cir.id)
      .gte('paid_at', monthISO);
    var monthSum = 0;
    (r1.data || []).forEach(function(x){ monthSum += Number(x.amount_paid) || 0; });
    var el1 = document.getElementById('zt-dash-rev-month');
    if(el1) el1.textContent = '$' + (monthSum * 0.25).toFixed(2);

    /* All time: SUM(amount_paid) * 0.25 */
    var r2 = await c.from('tutor_student_join_fees')
      .select('amount_paid')
      .eq('circle_id', cir.id);
    var allSum = 0;
    (r2.data || []).forEach(function(x){ allSum += Number(x.amount_paid) || 0; });
    var el2 = document.getElementById('zt-dash-rev-all');
    if(el2) el2.textContent = '$' + (allSum * 0.25).toFixed(2);

    /* Active members */
    var r3 = await c.from('tutor_members')
      .select('id', { count: 'exact', head: true })
      .eq('circle_id', cir.id)
      .eq('is_active', true);
    var el3 = document.getElementById('zt-dash-members');
    if(el3) el3.textContent = String(r3.count || 0);

    /* Growth — last 30d vs previous 30d */
    var now = Date.now();
    var d30 = new Date(now - 30*24*60*60*1000).toISOString();
    var d60 = new Date(now - 60*24*60*60*1000).toISOString();

    var g1 = await c.from('tutor_members')
      .select('id', { count: 'exact', head: true })
      .eq('circle_id', cir.id)
      .gte('joined_at', d30);
    var curr30 = g1.count || 0;

    var g2 = await c.from('tutor_members')
      .select('id', { count: 'exact', head: true })
      .eq('circle_id', cir.id)
      .gte('joined_at', d60)
      .lt('joined_at', d30);
    var prev30 = g2.count || 0;

    var pct;
    if(prev30 === 0){ pct = curr30 > 0 ? 100 : 0; }
    else { pct = Math.round(((curr30 - prev30) / prev30) * 100); }

    var el4 = document.getElementById('zt-dash-growth');
    if(el4){
      var sign = pct > 0 ? '+' : '';
      el4.textContent = sign + pct + '%';
      el4.style.color = pct > 0 ? '#10b981' : (pct < 0 ? '#a16262' : '#fff');
    }
  } catch(e){
    console.warn('[dash money]', e);
    ['zt-dash-rev-month','zt-dash-rev-all','zt-dash-members','zt-dash-growth'].forEach(function(id){
      var el = document.getElementById(id);
      if(el && el.textContent === '—') el.textContent = '$0.00';
    });
  }
};

ZT._dashLoadPendingCount = async function(){
  var cir = ZT.State.currentCircle;
  if(!cir) return;
  var c = sb(); if(!c) return;

  try {
    var r1 = await c.from('tutor_members')
      .select('id', { count: 'exact', head: true })
      .eq('circle_id', cir.id)
      .eq('is_active', true)
      .eq('payment_status', 'pending_payment');
    var pending = r1.count || 0;

    var nowISO = new Date().toISOString();
    var in3ISO = new Date(Date.now() + 3*24*60*60*1000).toISOString();
    var r2 = await c.from('tutor_members')
      .select('id', { count: 'exact', head: true })
      .eq('circle_id', cir.id)
      .eq('is_active', true)
      .eq('payment_status', 'trial')
      .gte('trial_ends_at', nowISO)
      .lte('trial_ends_at', in3ISO);
    var trialEnding = r2.count || 0;

    var el = document.getElementById('zt-dash-pending');
    if(el){
      if(pending === 0 && trialEnding === 0){
        el.textContent = 'All paid · no pending';
        el.style.color = '#10b981';
      } else {
        var parts = [];
        if(pending > 0)      parts.push(pending + ' pending');
        if(trialEnding > 0)  parts.push(trialEnding + ' trial ending');
        el.textContent = parts.join(' · ');
        el.style.color = pending > 0 ? '#a18554' : '#fbbf24';
      }
    }
  } catch(e){
    console.warn('[dash pending]', e);
  }
};

ZT._dashLoadGmf = async function(){
  var cir = ZT.State.currentCircle;
  if(!cir) return;
  var c = sb(); if(!c) return;
  var el1 = document.getElementById('zt-dash-gmf-month');
  var el2 = document.getElementById('zt-dash-gmf-members');
  if(!el1 && !el2) return;

  try {
    var monthStart = new Date();
    monthStart.setDate(1);
    monthStart.setHours(0,0,0,0);

      .select('gmf_share, student_id')
      .eq('circle_id', cir.id)
      .gte('paid_at', monthStart.toISOString());

      if(x.student_id) uniq[x.student_id] = true;
    });

    if(el1) el1.textContent = '$' + sum.toFixed(2);
    if(el2) el2.textContent = String(Object.keys(uniq).length);
  } catch(e){
    console.warn('[dash gmf]', e);
    if(el1) el1.textContent = '$0.00';
    if(el2) el2.textContent = '0';
  }
};

/* ────────────────────────────────────────────────────────────
   Loader — Recent Activity feed
   Merges joins, payments, posts, live sessions
   ──────────────────────────────────────────────────────────── */
ZT._dashLoadActivity = async function(){
  var cir = ZT.State.currentCircle;
  if(!cir) return;
  var c = sb(); if(!c) return;
  var host = document.getElementById('zt-dash-activity');
  if(!host) return;

  var events = [];

  function pushEvent(ts, icon, color, text){
    if(!ts) return;
    events.push({ ts: new Date(ts).getTime(), icon: icon, color: color, text: text });
  }

  function timeAgoShort(ms){
    var s = Math.floor((Date.now() - ms) / 1000);
    if(s < 60) return s + 's';
    if(s < 3600) return Math.floor(s/60) + 'm';
    if(s < 86400) return Math.floor(s/3600) + 'h';
    return Math.floor(s/86400) + 'd';
  }

  try {
    var r1 = await c.from('tutor_members')
      .select('user_id, joined_at, payment_status')
      .eq('circle_id', cir.id)
      .order('joined_at', { ascending: false })
      .limit(8);
    (r1.data || []).forEach(function(m){
      var p = ZT.State.profileCache[m.user_id] || ZT.profileOf(m.user_id);
      var name = p ? (p.name || p.username || 'Member') : 'Member';
      pushEvent(m.joined_at, 'fa-solid fa-user-plus', '#10b981', name + ' joined the circle');
    });
  } catch(e){}

  try {
    var r2 = await c.from('tutor_posts')
      .select('author_id, created_at, content')
      .eq('circle_id', cir.id)
      .order('created_at', { ascending: false })
      .limit(5);
    (r2.data || []).forEach(function(p){
      var author = ZT.State.profileCache[p.author_id] || ZT.profileOf(p.author_id);
      var name = author ? (author.name || author.username || 'Owner') : 'Owner';
      var snippet = (p.content || '').substring(0, 40);
      if(p.content && p.content.length > 40) snippet += '…';
      pushEvent(p.created_at, 'fa-solid fa-pen', '#60a5fa',
        name + ' posted: "' + snippet + '"');
    });
  } catch(e){}

  try {
    var r3 = await c.from('tutor_live_attendance')
      .select('user_id, joined_at')
      .eq('circle_id', cir.id)
      .order('joined_at', { ascending: false })
      .limit(5);
    (r3.data || []).forEach(function(l){
      var p = ZT.State.profileCache[l.user_id] || ZT.profileOf(l.user_id);
      var name = p ? (p.name || p.username || 'Member') : 'Member';
      pushEvent(l.joined_at, 'fa-solid fa-video', '#a78bfa', name + ' joined live class');
    });
  } catch(e){}

  events.sort(function(a, b){ return b.ts - a.ts; });
  events = events.slice(0, 10);

  if(!events.length){
    host.innerHTML = '<div style="text-align:center;color:#64748b;font-size:11.5px;padding:14px 0;">No recent activity yet.</div>';
    return;
  }

  var h = '';
  events.forEach(function(e){
    h += '<div style="display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04);">';
    h += '<div style="width:28px;height:28px;border-radius:8px;background:' + e.color + '1a;color:' + e.color + ';display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;">';
    h += '<i class="' + e.icon + '"></i></div>';
    h += '<div style="flex:1;min-width:0;">';
    h += '<div style="font-size:11.5px;color:#cbd5e1;line-height:1.4;word-break:break-word;">' + ZT.escape(e.text) + '</div>';
    h += '<div style="font-size:9.5px;color:#64748b;margin-top:2px;font-weight:700;">' + timeAgoShort(e.ts) + ' ago</div>';
    h += '</div></div>';
  });
  host.innerHTML = h;
};

          this.value = '';
          return;

        ZT._ownerImageFile = f;
        ZT._ownerImageRemove = false;

          var prev = document.getElementById('zi-image-preview');
          if(prev){ prev.src = url; prev.style.display = 'block'; }

          if(empty) empty.style.display = 'none';

      rmBtn.addEventListener('click', function(){
        ZT._ownerImageFile = null;
        ZT._ownerImageRemove = true;
        var prev = document.getElementById('zi-image-preview');
        if(prev){ prev.src = ''; prev.style.display = 'none'; }
        var empty = document.getElementById('zi-image-empty');
        if(empty) empty.style.display = 'flex';
        rmBtn.style.display = 'none';
      });
    }

    /* Delete all */
    var delBtn = document.getElementById('zi-delete-btn');
    if(delBtn) delBtn.addEventListener('click', async function(){

        var c2 = ZT.sb();

          p_circle_id: cir.id,
          p_metadata: { avatar: null, banner_gradient: null, qualification: null, experience: null, bio: null, philosophy: null, expertise: [] }
        });
        if(r.error) throw r.error;
        ZT.State.circleOwnerMeta = {};
        ZT.closeSheet();
        ZT.toast('Owner About cleared.');
        if(ZT.State.currentView === 'feed'){ ZT.showView('feed'); }
        else if(ZT.State.currentView === 'owner-about'){ ZT.showView('owner-about', cir.owner_id); }
      } catch(e){
        ZT.toast('Failed: ' + ((e && e.message) || 'unknown'), 'error');
      }
    });

    var saveBtn = document.getElementById('zi-save-btn');
    if(saveBtn) saveBtn.addEventListener('click', async function(){
      var qv = (document.getElementById('zi-qual').value || '').trim();
      var ev = (document.getElementById('zi-exp').value || '').trim();
      var bv = (document.getElementById('zi-bio').value || '').trim();
      var cv = (document.getElementById('zi-chips').value || '').trim();
      var pv = (document.getElementById('zi-phil').value || '').trim();

      saveBtn.disabled = true;
      saveBtn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Saving…';

      var imageUrl = ZT._ownerImageRemove ? null : (meta.avatar || null);
      if(ZT._ownerImageFile){
        try {
          imageUrl = await ZT.storeMedia(ZT._ownerImageFile);
        } catch(e){
          ZT.toast('Image upload failed: ' + ((e && e.message) || 'unknown'), 'error');
          saveBtn.disabled = false;
          saveBtn.innerHTML = 'Save Changes';
          return;
        }
      }

      var newMeta = {
        avatar: imageUrl,
        banner_gradient: ZT._ownerBannerGradient || null,
        qualification: qv || null,
        experience: ev || null,
        bio: bv || null,
        philosophy: pv || null,
        expertise: cv ? cv.split(',').map(function(s){ return s.trim(); }).filter(Boolean) : []
      };

      try {
        var c2 = ZT.sb();
        var r = await c2.rpc('tutor_save_circle_identity', {
          p_circle_id: cir.id,
          p_metadata: newMeta
        });
        if(r.error) throw r.error;
        if(r.data && r.data.ok === false){ throw new Error(r.data.error || 'unknown'); }
        ZT._ownerImageFile = null;
        ZT._ownerImageRemove = false;
        ZT.State.circleOwnerMeta = newMeta;
        ZT.closeSheet();
        ZT.toast('Owner About saved.');
        if(ZT.State.currentView === 'feed'){ ZT.showView('feed'); }
        else if(ZT.State.currentView === 'circle-about'){ ZT.showView('circle-about', cir.id); }
        else if(ZT.State.currentView === 'owner-about'){ ZT.showView('owner-about', cir.owner_id); }
      } catch(e){
        ZT.toast('Failed: ' + ((e && e.message) || 'unknown'), 'error');
        saveBtn.disabled = false;
        saveBtn.innerHTML = 'Save Changes';
      }
    });
  }, 60);
};

/* Points + rank via tutor_get_my_points RPC (Block 2 SQL) */
ZT._memLoadPoints = async function(){
  var cir = ZT.State.currentCircle;
  if(!cir) return;
  var c = sb(); if(!c) return;

  try {
    var r = await c.rpc('tutor_get_my_points', { p_circle_id: cir.id });
    if(r.error){
      console.warn('[mem points]', r.error);
      var el0 = document.getElementById('zt-mem-points');
      if(el0) el0.textContent = '0';
      return;
    }
    var d = Array.isArray(r.data) ? r.data[0] : r.data;
    d = d || {};

    var totalPts = Number(d.monthly_points) || 0;
    var myRank   = Number(d.my_rank) || 0;
    var totalMem = Number(d.total_members) || 0;

    var elP = document.getElementById('zt-mem-points');
    if(elP) elP.textContent = String(totalPts);

    var elR = document.getElementById('zt-mem-rank');
    if(elR){
      elR.textContent = myRank > 0 ? ('#' + myRank) : '—';
      elR.style.color = myRank === 1 ? '#fbbf24' :
                        myRank === 2 ? '#cbd5e1' :
                        myRank === 3 ? '#a18554' : '#60a5fa';
    }
    var elS = document.getElementById('zt-mem-rank-sub');
    if(elS) elS.textContent = totalMem > 0 ? ('of ' + totalMem) : 'of —';

    /* Breakdown */
    var bdHost = document.getElementById('zt-mem-breakdown');
    if(!bdHost) return;

    var cats = [
      { key:'attendance_points',  label:'Attendance',   icon:'fa-solid fa-calendar-check', color:'#10b981' },
      { key:'quiz_points',        label:'Quizzes',      icon:'fa-solid fa-list-check',     color:'#60a5fa' },
      { key:'helpfulness_points', label:'Helpfulness',  icon:'fa-solid fa-heart',          color:'#ec4899' },
      { key:'content_points',     label:'Content',      icon:'fa-solid fa-pen',            color:'#a78bfa' },
      { key:'rating_points',      label:'Owner Rating', icon:'fa-solid fa-star',           color:'#fbbf24' }
    ];
    var maxVal = 1;
    cats.forEach(function(cc){ maxVal = Math.max(maxVal, Number(d[cc.key]) || 0); });

    var bh = '';
    cats.forEach(function(cc){
      var v = Number(d[cc.key]) || 0;
      var pct = Math.min(100, Math.round((v / maxVal) * 100));
      bh += '<div>';
      bh += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;">';
      bh += '<span style="font-size:11px;color:#cbd5e1;font-weight:800;display:inline-flex;align-items:center;gap:6px;">';
      bh += '<i class="' + cc.icon + '" style="color:' + cc.color + ';font-size:10px;"></i> ' + cc.label + '</span>';
      bh += '<span style="font-size:12px;font-weight:900;color:' + cc.color + ';">' + v + '</span>';
      bh += '</div>';
      bh += '<div style="height:6px;border-radius:3px;background:rgba(0,0,0,.35);overflow:hidden;">';
      bh += '<div style="height:100%;width:' + pct + '%;background:' + cc.color + ';transition:width .6s;"></div>';
      bh += '</div>';
      bh += '</div>';
    });
    bdHost.innerHTML = bh;
  } catch(e){
    console.warn('[mem points]', e);
  }
};

/* Share link — unique per member + circle */
ZT._memLoadShareLink = async function(){
  var cir = ZT.State.currentCircle;
  var me  = ZT.State.currentUser;
  if(!cir || !me) return;
  var input = document.getElementById('zt-mem-share');
  var btn   = document.getElementById('zt-mem-copy');
  if(!input || !btn) return;

  var link = location.origin + location.pathname + '?join=' + cir.id + '&ref=' + me.id;
  input.value = link;

  btn.onclick = function(){
    try {
      navigator.clipboard.writeText(link);
      ZT.toast('Link copied');
    } catch(e){
      input.select();
      try { document.execCommand('copy'); ZT.toast('Link copied'); }
      catch(e2){ ZT.toast('Copy failed — select manually', 'error'); }
    }
  };
};

/* Ratings received from owner */
ZT._memLoadRatings = async function(){
  var cir = ZT.State.currentCircle;
  var me  = ZT.State.currentUser;
  if(!cir || !me) return;
  var c = sb(); if(!c) return;
  var host = document.getElementById('zt-mem-ratings');
  if(!host) return;

  try {
    var r = await c.from('tutor_member_ratings')
      .select('rating, comment, month, rater_role, created_at')
      .eq('circle_id', cir.id)
      .eq('member_id', me.id)
      .order('created_at', { ascending: false })
      .limit(5);

    var rows = r.data || [];
    if(!rows.length){
      host.innerHTML = '<div style="text-align:center;color:#64748b;font-size:11.5px;padding:14px 0;">No ratings yet.</div>';
      return;
    }

    var h = '';
    rows.forEach(function(x){
      var rating = Number(x.rating) || 0;
      var color = rating >= 8 ? '#10b981' : rating >= 5 ? '#fbbf24' : '#a16262';
      h += '<div style="padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04);">';
      h += '<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">';
      h += '<div style="display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:10px;background:' + color + '22;color:' + color + ';font-size:12px;font-weight:900;">';
      h += '<i class="fa-solid fa-star" style="font-size:10px;"></i> ' + rating + ' / 10';
      h += '</div>';
      h += '<div style="font-size:9.5px;color:#64748b;font-weight:800;text-transform:uppercase;letter-spacing:.4px;">';
      h += x.rater_role === 'owner' ? 'From Owner' : 'From Member';
      h += ' · ' + ZT.escape(x.month || '');
      h += '</div>';
      h += '</div>';
      if(x.comment){
        h += '<div style="font-size:11.5px;color:#cbd5e1;margin-top:8px;line-height:1.55;font-style:italic;">"' + ZT.escape(x.comment) + '"</div>';
      }
      h += '</div>';
    });
    host.innerHTML = h;
  } catch(e){
    console.warn('[mem ratings]', e);
    host.innerHTML = '<div style="text-align:center;color:#64748b;font-size:11.5px;padding:14px 0;">Could not load ratings.</div>';
  }
};


/* ============================================================
   P8 Block 6 — MEMBER PROFILE PAGE
   Opens when tapping a member in the directory.
   Includes rating chip + rating sheet for the owner.
   ============================================================ */
ZT.renderMemberProfile = async function(){
  var cir = ZT.State.currentCircle;
  if(!cir){ return ZT.renderNoCircleMessage('Member Profile'); }

  var memberId = ZT.State.currentParam;
  if(!memberId){ return ZT.renderNoCircleMessage('Member Profile'); }

  var me    = ZT.State.currentUser;
  var role  = ZT.State.myRoleInCircle || 'student';
  var isOwner = (role === 'tutor' || role === 'admin' || role === 'owner');

  /* Fetch member row + profile */
  var c = sb(); if(!c){ return ZT.renderNoCircleMessage('Member Profile'); }

  var memRow = null;
  try {
    var r1 = await c.from('tutor_members')
      .select('id, user_id, role, is_active, payment_status, trial_ends_at, joined_at')
      .eq('circle_id', cir.id)
      .eq('user_id', memberId)
      .maybeSingle();
    memRow = r1.data || null;
  } catch(e){}

  var profile = ZT.State.profileCache[memberId];
  if(!profile){
    try {
      var r2 = await c.from('profiles')
        .select('id, name, username, avatar, profession, bio, last_seen_at')
        .eq('id', memberId)
        .maybeSingle();
      if(r2.data){
        profile = r2.data;
        ZT.State.profileCache[memberId] = r2.data;
      }
    } catch(e){}
  }
  if(!profile){
    profile = { id: memberId, name: 'Member', username: 'user' };
  }

  /* Fetch owner's latest rating of this member (for this month) */
  var myRating = null;
  try {
    var month = (function(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); })();
    var r3 = await c.from('tutor_member_ratings')
      .select('id, rating, comment, month')
      .eq('circle_id', cir.id)
      .eq('member_id', memberId)
      .eq('rater_id', me.id)
      .eq('month', month)
      .maybeSingle();
    myRating = r3.data || null;
  } catch(e){}

  var online = profile.last_seen_at && (Date.now() - new Date(profile.last_seen_at).getTime() < 5*60*1000);
  var av = ZT.safeAvatar(profile);

  var h = '';

/* ────────────────────────────────────────────────────────────
   Load community ratings for member profile
   ──────────────────────────────────────────────────────────── */
ZT._loadCommunityRatings = async function(memberId){
  var cir = ZT.State.currentCircle;
  if(!cir) return;
  var c = sb(); if(!c) return;
  var host = document.getElementById('zt-mp-community-ratings');
  if(!host) return;

  try {
    var r = await c.from('tutor_member_ratings')
      .select('rating, comment, month, rater_role, created_at')
      .eq('circle_id', cir.id)
      .eq('member_id', memberId)
      .order('created_at', { ascending: false })
      .limit(10);

    var rows = r.data || [];

    /* Locked rule #6 — Member → Member ratings NOT shown. Owner ratings only. */
    rows = rows.filter(function(x){ return x.rater_role === 'owner'; });

    if(!rows.length){
      host.innerHTML = '<div style="text-align:center;color:#64748b;font-size:11.5px;padding:14px 0;">No ratings from owner yet.</div>';
      return;
    }

    /* All remaining rows are owner ratings */
    var ownerRows = rows;
    var avg = 0;
    if(ownerRows.length){
      var sum = 0;
      ownerRows.forEach(function(x){ sum += Number(x.rating) || 0; });
      avg = sum / ownerRows.length;
    }

    var h = '';
    if(ownerRows.length){
      h += '<div style="display:flex;align-items:baseline;gap:8px;margin-bottom:10px;">';
      h += '<div style="font-size:24px;font-weight:900;color:#fbbf24;">' + avg.toFixed(1) + '</div>';
      h += '<div style="font-size:12px;color:#94a3b8;font-weight:700;">/ 10 · ' + ownerRows.length + ' rating' + (ownerRows.length === 1 ? '' : 's') + ' from owner</div>';
      h += '</div>';
    }

    var shown = rows.slice(0, 5);
    shown.forEach(function(x){
      var rating = Number(x.rating) || 0;
      var color = rating >= 8 ? '#10b981' : rating >= 5 ? '#fbbf24' : '#a16262';
      h += '<div style="padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04);">';
      h += '<div style="display:flex;justify-content:space-between;align-items:center;">';
      h += '<div style="display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:10px;background:' + color + '22;color:' + color + ';font-size:12px;font-weight:900;">';
      h += '<i class="fa-solid fa-star" style="font-size:10px;"></i> ' + rating + ' / 10';
      h += '</div>';
      h += '<div style="font-size:9.5px;color:#64748b;font-weight:800;">' + ZT.escape(x.month || '') + '</div>';
      h += '</div>';
      if(x.comment){
        h += '<div style="font-size:11.5px;color:#cbd5e1;margin-top:6px;line-height:1.5;font-style:italic;">"' + ZT.escape(x.comment) + '"</div>';
      }
      h += '</div>';
    });

    host.innerHTML = h;
  } catch(e){
    console.warn('[community ratings]', e);
    host.innerHTML = '<div style="text-align:center;color:#64748b;font-size:11.5px;padding:14px 0;">Could not load.</div>';
  }
};

/* ────────────────────────────────────────────────────────────
   Rating sheet — owner gives rating (1-10) + comment
   Saves to tutor_member_ratings, SQL trigger awards points
   ──────────────────────────────────────────────────────────── */
ZT.openMemberRatingSheet = async function(memberId){
  var cir = ZT.State.currentCircle;
  var me  = ZT.State.currentUser;
  if(!cir || !me){ ZT.toast('Not ready.', 'error'); return; }
  var role = ZT.State.myRoleInCircle || 'student';
  if(!(role === 'tutor' || role === 'admin' || role === 'owner')){
    ZT.toast('Only the owner can rate members.', 'error');
    return;
  }

  var c = sb(); if(!c) return;
  var profile = ZT.State.profileCache[memberId] || { name: 'Member', username: 'user' };

  /* Fetch existing rating for pre-fill */
  var existing = null;
  var month = (function(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); })();
  try {
    var r = await c.from('tutor_member_ratings')
      .select('rating, comment')
      .eq('circle_id', cir.id)
      .eq('member_id', memberId)
      .eq('rater_id', me.id)
      .eq('month', month)
      .maybeSingle();
    existing = r.data || null;
  } catch(e){}

  var h = '';
  h += '<div class="zt-overlay" onclick="if(event.target===this)ZT.Modal.close()">';
  h += '<div class="zt-modal" style="max-width:460px;">';
  h += '<div class="zt-mhead">';
  h += '<div class="zt-mtitle"><i class="fa-solid fa-star" style="color:#fbbf24;"></i> Rate ' + ZT.escape(profile.name || profile.username || 'Member') + '</div>';
  h += '<button class="zt-mclose" onclick="ZT.Modal.close()"><i class="fa-solid fa-xmark"></i></button>';
  h += '</div>';

  h += '<div style="padding:10px 0 6px;text-align:center;font-size:11.5px;color:#94a3b8;line-height:1.5;">';
  h += 'Rating gives points to this member — up to <b style="color:#fbbf24;">50 points</b> at 10/10.';
  h += '</div>';

  /* Star buttons 1-10 */
  h += '<div class="zt-star-row" id="zt-rate-stars">';
  for(var i = 1; i <= 10; i++){
    var active = existing && existing.rating >= i ? ' active' : '';
    h += '<button type="button" class="zt-star-btn' + active + '" data-rate="' + i + '">' + i + '</button>';
  }
  h += '</div>';

  /* Comment */
  h += '<label class="zt-label" style="margin-top:14px;">Comment (optional)</label>';
  h += '<textarea id="zt-rate-comment" class="zt-textarea" maxlength="300" placeholder="Brief note about this member\'s contribution.">' + ZT.escape(existing && existing.comment ? existing.comment : '') + '</textarea>';

  /* Submit */
  h += '<div style="display:flex;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid #1e293b;">';
  h += '<button type="button" onclick="ZT.Modal.close()" style="flex:0 0 auto;min-width:100px;padding:13px 18px;border-radius:10px;font-size:12.5px;font-weight:900;background:rgba(30,41,59,.9);border:1px solid #334155;color:#cbd5e1;cursor:pointer;">Cancel</button>';
  h += '<button type="button" id="zt-rate-submit" style="flex:1;padding:13px 18px;border-radius:10px;font-size:13px;font-weight:900;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#000;border:none;cursor:pointer;">';
  h += '<i class="fa-solid fa-check"></i> ' + (existing ? 'Update Rating' : 'Save Rating');
  h += '</button>';
  h += '</div>';

  h += '</div></div>';

  ZT.Modal.open({ title:'', icon:'fa-solid fa-star', body: h, footer: false });

  /* Wire star buttons */
  setTimeout(function(){
    var selected = existing ? existing.rating : 0;
    var stars = document.querySelectorAll('#zt-rate-stars .zt-star-btn');
    stars.forEach(function(btn){
      btn.addEventListener('click', function(){
        selected = parseInt(this.getAttribute('data-rate'), 10);
        stars.forEach(function(s){
          var v = parseInt(s.getAttribute('data-rate'), 10);
          if(v <= selected) s.classList.add('active');
          else s.classList.remove('active');
        });
      });
    });

    var submit = document.getElementById('zt-rate-submit');
    if(!submit) return;
    submit.addEventListener('click', async function(){
      if(!selected || selected < 1 || selected > 10){
        ZT.toast('Please pick a rating 1-10.', 'error');
        return;
      }
      var comment = (document.getElementById('zt-rate-comment') || {}).value || '';
      comment = comment.trim();

      submit.disabled = true;
      submit.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Saving…';

      try {
        if(existing){
          /* Update */
          var upd = await c.from('tutor_member_ratings')
            .update({
              rating: selected,
              comment: comment || null,
              updated_at: new Date().toISOString()
            })
            .eq('circle_id', cir.id)
            .eq('member_id', memberId)
            .eq('rater_id', me.id)
            .eq('month', month);
          if(upd.error) throw upd.error;
        } else {
          /* Insert */
          var ins = await c.from('tutor_member_ratings')
            .insert({
              circle_id: cir.id,
              member_id: memberId,
              rater_id: me.id,
              rater_role: 'owner',
              rating: selected,
              comment: comment || null,
              month: month
            });
          if(ins.error) throw ins.error;
        }

        ZT.toast('Rating saved · ' + (selected * 5) + ' points awarded');
        ZT.Modal.close();

        /* Re-render page */
        ZT.showView('member-profile', memberId);

        /* Refresh leaderboard if open elsewhere */
        if(ZT.State.currentView === 'leaderboard'){
          setTimeout(function(){ ZT.showView('leaderboard'); }, 300);
        }
      } catch(e){
        console.warn('[rate submit]', e);
        ZT.toast('Failed: ' + ((e && e.message) || 'unknown'), 'error');
        submit.disabled = false;
        submit.innerHTML = '<i class="fa-solid fa-check"></i> ' + (existing ? 'Update Rating' : 'Save Rating');
      }
    });
  }, 60);
};

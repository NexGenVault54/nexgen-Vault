  }
  h += '</div>';
  h += '</div>';

  h += '<div style="display:flex;justify-content:center;gap:20px;font-size:12px;color:#94a3b8;font-weight:700;">';
  h += '<span><i class="fa-solid fa-users"></i> ' + (cir.member_count||0) + ' members</span>';
  h += '<span><i class="fa-regular fa-newspaper"></i> ' + (cir.post_count||0) + ' posts</span>';
  h += '</div>';

  h += '<div class="zt-st" style="margin-top:8px;">Ratings</div>';
  h += '<div id="co-ratings-host" style="padding:14px;border-radius:14px;background:#131c30;border:1px solid #1e293b;">';

  if(rc === 0){
    h += '<div style="text-align:center;color:#64748b;font-size:12px;padding:14px 0;">No ratings yet.</div>';
    h += '<button onclick="ZT.openOwnerRatingSheet(\'' + ZT.escape(cir.owner_id) + '\')" style="width:100%;margin-top:14px;padding:12px;border-radius:10px;border:none;background:linear-gradient(135deg,#10b981,#3b82f6);color:#000;font-weight:900;font-size:12px;cursor:pointer;"><i class="fa-solid fa-star"></i> Be the first to rate</button>';
  } else {
    var tot = Math.max(1, (Number(rating.band_top)||0) + (Number(rating.band_high)||0) + (Number(rating.band_mid)||0) + (Number(rating.band_low)||0));
    h += '<div style="display:flex;align-items:baseline;gap:10px;margin-bottom:12px;">';
    h += '<div style="font-size:32px;font-weight:900;color:' + scoreCol + ';">' + avg.toFixed(1) + '</div>';
    h += '<div style="font-size:13px;color:#94a3b8;font-weight:700;">/ 10</div>';
    h += '<div style="margin-left:auto;font-size:11px;color:#64748b;">' + rc + ' rating' + (rc === 1 ? '' : 's') + '</div>';
    h += '</div>';
    var bandRow = function(key, label, cnt, color){
      var pct = tot > 0 ? Math.round((cnt / tot) * 100) : 0;
      return '<button class="co-band" data-co-band="' + key + '">' +
        '<div class="co-band-lbl">' + label + '</div>' +
        '<div class="co-band-bar"><div class="co-band-fill" style="width:' + pct + '%;background:' + color + ';"></div></div>' +
        '<div class="co-band-cnt" style="color:' + color + ';">' + cnt + '</div></button>';
    };
    h += bandRow('top',  '9 – 10', Number(rating.band_top)||0,  '#10b981');
    h += bandRow('high', '7 – 8',  Number(rating.band_high)||0, '#a18554');
    h += bandRow('mid',  '4 – 6',  Number(rating.band_mid)||0,  '#a18554');
    h += bandRow('low',  '1 – 3',  Number(rating.band_low)||0,  '#a16262');
    h += '<div id="co-band-clear"></div>';
    h += '<div id="co-comments-host" style="margin-top:14px;padding-top:10px;border-top:1px solid #1e293b;min-height:40px;">';
    h += '<div style="text-align:center;color:#64748b;font-size:11.5px;padding:10px 0;">Loading reviews…</div>';
    h += '</div>';
  }

  h += '</div>';
  h += '</div>';

  if(rc > 0){
    setTimeout(function(){ ZT._loadOwnerRatings(cir.owner_id, null); }, 100);
    setTimeout(function(){ ZT._wireOwnerBandFilters(cir.owner_id); }, 200);
  }

  return h;
};


/* ────────────────────────────────────────────────────────────
   Load owner ratings list (with optional band filter)
   ──────────────────────────────────────────────────────────── */
ZT._loadOwnerRatings = async function(ownerId, band){
  var cir = ZT.State.currentCircle;
  if(!cir) return;
  var c = sb(); if(!c) return;
  var host = document.getElementById('co-comments-host');
  if(!host) return;

  try {
    var r = await c.rpc('tutor_list_owner_ratings', {
      p_circle_id: cir.id,
      p_band: band || null,
      p_limit: 50,
      p_offset: 0
    });
    var rows = r.data || [];
    if(!rows.length){
      host.innerHTML = '<div style="text-align:center;color:#64748b;font-size:11.5px;padding:10px 0;">' +
        (band ? 'No reviews in this band.' : 'No reviews yet.') + '</div>';
      return;
    }
    var h = '';
    rows.forEach(function(x){
      var rating = Number(x.rating) || 0;
      var color = rating >= 8 ? '#10b981' : rating >= 4 ? '#a18554' : '#a16262';
      h += '<div class="co-review">';
      h += '<div class="co-review-head">';
      h += '<span class="co-review-score" style="background:' + color + '22;color:' + color + ';">';
      h += '<i class="fa-solid fa-star" style="font-size:10px;"></i> ' + rating + ' / 10</span>';
      h += '<span class="co-review-time">' + ZT.timeAgo(new Date(x.created_at).getTime()) + '</span>';
      h += '</div>';
      if(x.comment){
        h += '<div class="co-review-cmt">"' + ZT.escape(x.comment) + '"</div>';
      }
      h += '</div>';
    });
    h += '<div style="text-align:center;padding:10px 0;font-size:10px;color:#64748b;line-height:1.5;">All ratings are anonymous.</div>';
    host.innerHTML = h;
  } catch(e){
    console.warn('[co ratings]', e);
    host.innerHTML = '<div style="text-align:center;color:#64748b;font-size:11.5px;padding:10px 0;">Could not load reviews.</div>';
  }
};

/* ────────────────────────────────────────────────────────────
   Wire band filters on the owner profile
   ──────────────────────────────────────────────────────────── */
ZT._wireOwnerBandFilters = function(ownerId){
  var bands = document.querySelectorAll('[data-co-band]');
  bands.forEach(function(b){
    if(b._coHooked) return; b._coHooked = true;
    b.addEventListener('click', function(){
      var key = this.getAttribute('data-co-band');
      var isActive = this.getAttribute('data-active') === '1';
      bands.forEach(function(x){ x.removeAttribute('data-active'); });
      var newBand = isActive ? null : key;
      if(newBand) this.setAttribute('data-active', '1');
      var clearHost = document.getElementById('co-band-clear');
      if(clearHost){
        if(newBand){
          var lbl = newBand === 'top' ? '9 – 10' : newBand === 'high' ? '7 – 8' : newBand === 'mid' ? '4 – 6' : '1 – 3';
          clearHost.innerHTML = '<button id="co-band-clear-btn" style="width:100%;padding:8px;border-radius:8px;border:1px solid #1e293b;background:#0f172a;color:#94a3b8;font-weight:800;font-size:11px;cursor:pointer;margin-top:8px;">Showing ' + lbl + ' only · Clear filter</button>';
          setTimeout(function(){
            var cb = document.getElementById('co-band-clear-btn');
            if(cb) cb.addEventListener('click', function(){
              bands.forEach(function(x){ x.removeAttribute('data-active'); });
              clearHost.innerHTML = '';
              ZT._loadOwnerRatings(ownerId, null);
            });
          }, 20);
        } else {
          clearHost.innerHTML = '';
        }
      }
      ZT._loadOwnerRatings(ownerId, newBand);
    });
  });
};

/* ────────────────────────────────────────────────────────────
   Owner Rating Sheet — member rates owner (no points)
   ──────────────────────────────────────────────────────────── */
ZT.openOwnerRatingSheet = async function(ownerId){
  var cir = ZT.State.currentCircle;
  var me  = ZT.State.currentUser;
  if(!cir || !me){ ZT.toast('Not ready.', 'error'); return; }
  if(me.id === ownerId){ ZT.toast('You cannot rate yourself.', 'error'); return; }

  var c = sb(); if(!c) return;
  var profile = ZT.State.profileCache[ownerId] || { name: 'Owner', username: 'user' };

  /* Pre-fill */
  var existing = null;
  try {
    var r = await c.rpc('tutor_my_owner_rating', { p_circle_id: cir.id });
    if(!r.error && r.data && r.data[0]) existing = r.data[0];
  } catch(e){}

  var h = '';
  h += '<div class="zt-overlay" onclick="if(event.target===this)ZT.Modal.close()">';
  h += '<div class="zt-modal" style="max-width:460px;">';
  h += '<div class="zt-mhead">';
  h += '<div class="zt-mtitle"><i class="fa-solid fa-star" style="color:#fbbf24;"></i> Rate ' + ZT.escape(profile.name || profile.username || 'Owner') + '</div>';
  h += '<button class="zt-mclose" onclick="ZT.Modal.close()"><i class="fa-solid fa-xmark"></i></button>';
  h += '</div>';

  h += '<div style="padding:10px 0 6px;text-align:center;font-size:11.5px;color:#94a3b8;line-height:1.5;">';
  h += 'Your rating is <b style="color:#fff;">anonymous</b>. The owner will not know who rated them.';
  h += '</div>';

  h += '<div class="zt-star-row" id="zt-owner-stars">';
  for(var i = 1; i <= 10; i++){
    var active = existing && existing.rating >= i ? ' active' : '';
    h += '<button type="button" class="zt-star-btn' + active + '" data-rate="' + i + '">' + i + '</button>';
  }
  h += '</div>';

  h += '<label class="zt-label" style="margin-top:14px;">Comment (optional)</label>';
  h += '<textarea id="zt-owner-comment" class="zt-textarea" maxlength="300" placeholder="Brief note about this owner.">' + ZT.escape(existing && existing.comment ? existing.comment : '') + '</textarea>';

  h += '<div style="display:flex;gap:10px;margin-top:18px;padding-top:16px;border-top:1px solid #1e293b;">';
  h += '<button type="button" onclick="ZT.Modal.close()" style="flex:0 0 auto;min-width:100px;padding:13px 18px;border-radius:10px;font-size:12.5px;font-weight:900;background:rgba(30,41,59,.9);border:1px solid #334155;color:#cbd5e1;cursor:pointer;">Cancel</button>';
  h += '<button type="button" id="zt-owner-submit" style="flex:1;padding:13px 18px;border-radius:10px;font-size:13px;font-weight:900;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:#000;border:none;cursor:pointer;">';
  h += '<i class="fa-solid fa-check"></i> ' + (existing ? 'Update Rating' : 'Submit Rating');
  h += '</button>';
  h += '</div>';

  h += '</div></div>';

  ZT.Modal.open({ title:'', icon:'fa-solid fa-star', body: h, footer: false });

  setTimeout(function(){
    var selected = existing ? existing.rating : 0;
    var stars = document.querySelectorAll('#zt-owner-stars .zt-star-btn');
    stars.forEach(function(btn){
      btn.addEventListener('click', function(){
        selected = parseInt(this.getAttribute('data-rate'), 10);
        stars.forEach(function(s){
          var v = parseInt(s.getAttribute('data-rate'), 10);
          if(v <= selected) s.classList.add('active');
          else s.classList.remove('active');
        });
      });
    });

    var submit = document.getElementById('zt-owner-submit');
    if(!submit) return;
    submit.addEventListener('click', async function(){
      if(!selected || selected < 1 || selected > 10){
        ZT.toast('Please pick a rating 1-10.', 'error');
        return;
      }
      var comment = (document.getElementById('zt-owner-comment') || {}).value || '';
      submit.disabled = true;
      submit.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Saving…';

      try {
        var r = await c.rpc('tutor_submit_owner_rating', {
          p_circle_id: cir.id,
          p_rating: selected,
          p_comment: comment.trim() || null
        });
        if(r.error) throw r.error;
        if(r.data && r.data.ok === false){
          var errCode = r.data.error;
          if(errCode === 'invalid_rating') ZT.toast('Invalid rating.', 'error');
          else if(errCode === 'cannot_rate_self') ZT.toast('Cannot rate yourself.', 'error');
          else if(errCode === 'not_a_member') ZT.toast('You must be a member of this circle.', 'error');
          else ZT.toast('Failed: ' + errCode, 'error');
          submit.disabled = false;
          submit.innerHTML = '<i class="fa-solid fa-check"></i> ' + (existing ? 'Update Rating' : 'Submit Rating');
          return;
        }
        ZT.toast('Rating submitted anonymously.');
        ZT.Modal.close();
        ZT.showView('circle-owner-profile', ownerId);
      } catch(e){
        console.warn('[owner rate]', e);
        ZT.toast('Failed: ' + ((e && e.message) || 'unknown'), 'error');
        submit.disabled = false;
        submit.innerHTML = '<i class="fa-solid fa-check"></i> ' + (existing ? 'Update Rating' : 'Submit Rating');
      }
    });
  }, 60);
};

  if(!cir) return ZT.renderNoCircleMessage('Leaderboard');
  var role = ZT.State.myRoleInCircle || 'student';
  var isTutor = (role === 'tutor' || role === 'admin' || role === 'owner');
  var c = ZT.sb();
  if(!c) return '<div class="zt-empty"><p>Not connected.</p></div>';

  var h = '<div style="display:flex;flex-direction:column;gap:14px;padding-bottom:20px;">';

  h += '<div class="zt-circle-head">';
  h += '<button class="back" onclick="ZT.goBack()"><i class="fa-solid fa-arrow-left"></i></button>';
  h += '<div style="flex:1;min-width:0;">';
  h += '<div class="nm">Monthly Leaderboard</div>';
  h += '<div class="sub">' + ZT.escape(cir.name) + '</div>';
  h += '</div></div>';

  /* Share link card — single link for the circle */
  var shareLink = location.origin + location.pathname + '?join=' + cir.id;
  h += '<div style="padding:14px;border-radius:14px;background:linear-gradient(135deg,rgba(16,185,129,.12),rgba(59,130,246,.08));border:1px solid rgba(16,185,129,.35);">';
  h += '<div style="font-size:10px;color:#94a3b8;font-weight:900;letter-spacing:1px;">SHARE THIS LINK</div>';
  h += '<div style="font-size:11px;color:#cbd5e1;margin-top:6px;line-height:1.6;">' + (isTutor ? 'Share this link with your members. Every join counts toward your leaderboard.' : 'Share this circle with friends. Every join counts toward the leaderboard.') + '</div>';
  h += '<div style="display:flex;gap:8px;margin-top:10px;">';
  h += '<div style="flex:1;min-width:0;background:rgba(0,0,0,.3);border:1px solid #1e293b;border-radius:8px;padding:10px;font-size:11px;color:#6ee7b7;font-family:monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + ZT.escape(shareLink) + '</div>';
  h += '<button onclick="navigator.clipboard.writeText(\'' + ZT.escape(shareLink) + '\');ZT.toast(\'Link copied\');" style="background:#10b981;border:none;color:#000;font-weight:900;padding:10px 14px;border-radius:8px;font-size:11px;cursor:pointer;flex-shrink:0;"><i class="fa-solid fa-copy"></i> Copy</button>';
  h += '</div></div>';

  /* Rules card */
  h += '<div style="padding:14px;border-radius:14px;background:#111827;border:1px solid #1e293b;">';
  h += '<div style="font-size:12px;font-weight:900;color:#fff;margin-bottom:8px;">How GMF Works</div>';
  h += '<div style="font-size:11.5px;color:#cbd5e1;line-height:1.7;">';
  h += '• Monthly points from attendance, quiz scores, and helpfulness<br>';
  h += '• <b style="color:#10b981;">50%+ of top scorer = GMF eligible</b><br>';
  h += '• Pool funded from 20% of every joining fee<br>';
  h += '• Split proportional to points among eligible members<br>';
  h += '• Below 50% = no GMF payout this month';
  h += '</div></div>';

  /* Leaderboard data host */
  h += '<div style="font-size:11px;font-weight:900;color:#e2e8f0;padding:0 4px;">THIS MONTH</div>';
  h += '<div id="zt-leaderboard-host"><div style="padding:30px;text-align:center;color:#64748b;"><i class="fa-solid fa-circle-notch fa-spin"></i></div></div>';
  h += '</div>';

  setTimeout(async function(){
    var host = document.getElementById('zt-leaderboard-host');
    if(!host) return;
    try {
      var r = await c.rpc('tutor_get_monthly_leaderboard', { p_circle_id: cir.id });
      if(r.error || !r.data || !r.data.length){
        host.innerHTML = '<div class="zt-empty"><p>No leaderboard data yet this month.</p></div>';
        return;
      }
      var rows = r.data;
      var maxScore = 0;
      rows.forEach(function(row){ maxScore = Math.max(maxScore, Number(row.total_score) || 0); });
      var threshold = maxScore * 0.5;
      var lh = '';
      rows.forEach(function(row, i){
        var isEligible = Number(row.total_score) >= threshold;
        var color = isEligible ? '#10b981' : '#64748b';
        lh += '<div style="padding:12px;border-radius:10px;background:#111827;border:1px solid ' + (isEligible ? 'rgba(16,185,129,.4)' : '#1e293b') + ';margin-bottom:8px;display:flex;gap:12px;align-items:center;">';

        lh += '<div style="flex:1;min-width:0;">';
        lh += '<div style="font-size:13px;font-weight:800;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + ZT.escape(row.student_name || 'Member') + '</div>';
        lh += '<div style="font-size:10.5px;color:' + color + ';margin-top:2px;font-weight:800;">' + (row.total_score || 0) + ' pts · ' + (isEligible ? '✓ GMF eligible' : '✗ Below 50%') + '</div>';
        lh += '</div>';
        lh += '<div style="font-size:13px;font-weight:900;color:' + color + ';">$' + Number(row.payout || 0).toFixed(2) + '</div>';
        lh += '</div>';
      });
      host.innerHTML = lh;
    } catch(e){
      host.innerHTML = '<div class="zt-empty"><p>Could not load leaderboard.</p></div>';
    }
  }, 40);

  return h;
};

/* Remove with Reason — min 9 words, live counter, server validation */
ZT._pendingRemoveWithReason = function(memberId, circleId){
  var body = '';

  body += '<div style="padding:12px;border-radius:10px;background:rgba(161,133,84,.10);border:1px solid rgba(161,133,84,.4);margin-bottom:14px;">';
  body += '<div style="font-size:11.5px;font-weight:900;color:#a18554;margin-bottom:6px;"><i class="fa-solid fa-triangle-exclamation"></i> Removal is permanent</div>';
  body += '<div style="font-size:11.5px;color:#cbd5e1;line-height:1.6;">';
  body += 'The member will be removed and notified with your reason.<br>';
  body += '<b style="color:#a16262;">Do NOT use this for non-payment.</b> System auto-handles unpaid members.';
  body += '</div></div>';

  body += '<label class="zt-label">Reason (min 9 words)</label>';
  body += '<textarea id="zt-remove-reason" class="zt-textarea" placeholder="Explain briefly why this member is being removed. Example: Repeated violation of circle rules after two warnings from the tutor." style="min-height:90px;"></textarea>';
  body += '<div id="zt-remove-word-count" style="font-size:10.5px;color:#64748b;margin-top:6px;font-weight:800;">0 words · 9 minimum</div>';

  ZT.Modal.open({
    title: 'Remove Member',
    icon: 'fa-solid fa-user-minus',
    submitLabel: 'Remove',
    body: body,
    onOpen: function(){
      setTimeout(function(){
        var ta = document.getElementById('zt-remove-reason');
        var cnt = document.getElementById('zt-remove-word-count');
        if(!ta || !cnt) return;
        ta.addEventListener('input', function(){
          var words = ta.value.trim().split(/\s+/).filter(function(w){ return w.length > 0; });
          var n = words.length;
          cnt.textContent = n + ' word' + (n === 1 ? '' : 's') + ' · ' + (n >= 9 ? 'OK ✓' : (9 - n) + ' more needed');
          cnt.style.color = n >= 9 ? '#10b981' : '#64748b';
        });
        ta.focus();
      }, 20);
    },
    onSubmit: async function(){
      var ta = document.getElementById('zt-remove-reason');
      var reason = (ta && ta.value || '').trim();
      var words = reason.split(/\s+/).filter(function(w){ return w.length > 0; });
      if(words.length < 9){
        ZT.toast('Reason must be at least 9 words.', 'error');
        return false;
      }
      var c = sb(); if(!c){ ZT.toast('Not connected.', 'error'); return false; }
      try {
        var r = await c.rpc('tutor_remove_member', {
          p_member_id: memberId,
          p_circle_id: circleId,
          p_reason: reason
        });
        if(r.error) throw r.error;
        if(r.data && r.data.ok === false){
          var errCode = r.data.error;
          if(errCode === 'reason_too_short') ZT.toast('Reason must be at least 9 words.', 'error');
          else if(errCode === 'not_owner') ZT.toast('Only the tutor can remove.', 'error');
          else if(errCode === 'reason_required') ZT.toast('Reason required.', 'error');
          else if(errCode === 'member_not_found') ZT.toast('Member not found.', 'error');
          else ZT.toast('Failed: ' + errCode, 'error');
          return false;
        }
        ZT.toast('Member removed.');
        ZT.haptic(15);
        setTimeout(function(){ ZT.showView('members'); }, 200);
        return true;
      } catch(e){
        ZT.toast('Failed: ' + ((e && e.message) || 'unknown'), 'error');
        return false;
      }
    }
  });
};

/* ============================================================
   Payment Mode change — protected confirmation (B3)
   Requires typed confirmation: 'free' or 'paid'
   ============================================================ */
ZT._confirmPaymentModeChange = function(cir, oldMode, newMode, pendingFields){
  var oldLabel = { free:'Free', pay_first:'Pay First' }[oldMode] || oldMode;
  var newLabel = { free:'Free', pay_first:'Pay First' }[newMode] || newMode;
  var isFree = (newMode === 'free');
  var requiredWord = isFree ? 'free' : 'paid';
  var effectText = isFree
    ? 'New members will join for <b style="color:#10b981;">free</b>. No payment will be required from them — ever.'
    : 'New members will be charged <b style="color:#10b981;">$4 on the 1st of every month</b>. Payment required immediately on join.';

  var body = '';
  body += '<div style="padding:14px;border-radius:10px;background:rgba(161,133,84,.10);border:1px solid rgba(161,133,84,.4);margin-bottom:14px;">';
  body += '<div style="font-size:12px;font-weight:900;color:#a18554;margin-bottom:6px;">';
  body += '<i class="fa-solid fa-triangle-exclamation"></i> Confirm mode change</div>';
  body += '<div style="font-size:11.5px;color:#cbd5e1;line-height:1.6;">';
  body += 'You are switching from <b>' + ZT.escape(oldLabel) + '</b> to <b style="color:#fff;">' + ZT.escape(newLabel) + '</b>.';
  body += '</div></div>';

  body += '<div style="padding:12px;border-radius:10px;background:#0f172a;border:1px solid #1e293b;margin-bottom:14px;">';
  body += '<div style="font-size:11px;color:#94a3b8;font-weight:900;letter-spacing:.5px;margin-bottom:6px;">WHAT THIS MEANS</div>';
  body += '<div style="font-size:12px;color:#cbd5e1;line-height:1.65;">' + effectText + '</div>';
  body += '<div style="font-size:11px;color:#94a3b8;margin-top:10px;line-height:1.55;">';
  body += '<b style="color:#fff;">Existing members are not affected.</b> Their current status and payments continue unchanged.';
  body += '</div></div>';

  body += '<div style="padding:12px;border-radius:10px;background:rgba(161,98,98,.06);border:1px solid rgba(161,98,98,.35);margin-bottom:14px;">';
  body += '<div style="font-size:11px;color:#c9a5a5;font-weight:900;letter-spacing:.5px;margin-bottom:6px;">TYPE TO CONFIRM</div>';
  body += '<div style="font-size:11.5px;color:#cbd5e1;line-height:1.55;margin-bottom:10px;">';
  body += 'Type <b style="color:#fff;font-family:monospace;background:rgba(255,255,255,.06);padding:1px 8px;border-radius:6px;">' + requiredWord + '</b> below to confirm:';
  body += '</div>';
  body += '<input id="zt-pm-protect" type="text" placeholder="Type here..." autocomplete="off" ';
  body += 'style="width:100%;background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:11px 12px;color:#fff;font-size:13px;outline:none;box-sizing:border-box;font-family:monospace;">';
  body += '</div>';

  body += '<div style="display:flex;gap:8px;">';
  body += '<button id="zt-pm-cancel" type="button" style="flex:1;padding:13px;border-radius:10px;border:1px solid #1e293b;background:transparent;color:#cbd5e1;font-weight:800;font-size:13px;cursor:pointer;">Cancel</button>';
  body += '<button id="zt-pm-confirm" type="button" disabled style="flex:1;padding:13px;border-radius:10px;border:none;background:linear-gradient(135deg,#10b981,#3b82f6);color:#000;font-weight:900;font-size:13px;cursor:not-allowed;opacity:.5;">Change Mode</button>';
  body += '</div>';

  ZT.Modal.open({
    title: 'Payment Mode Change',
    icon: 'fa-solid fa-lock',
    footer: false,
    body: body
  });

  setTimeout(function(){
    var input = document.getElementById('zt-pm-protect');
    var btn = document.getElementById('zt-pm-confirm');
    var cancel = document.getElementById('zt-pm-cancel');
    if(!input || !btn || !cancel) return;

    input.addEventListener('input', function(){
      var match = input.value.trim().toLowerCase() === requiredWord;
      btn.disabled = !match;
      btn.style.opacity = match ? '1' : '.5';
      btn.style.cursor = match ? 'pointer' : 'not-allowed';
    });

    input.addEventListener('keydown', function(e){
      if(e.key === 'Enter' && !btn.disabled){
        btn.click();
      }
    });

    cancel.addEventListener('click', function(){
      ZT.Modal.close();
      ZT.toast('Mode change cancelled.', 'warning');
      setTimeout(function(){ ZT.openCircleSettings(); }, 200);
    });

    btn.addEventListener('click', async function(){
      if(btn.disabled) return;
      btn.disabled = true;
      btn.textContent = 'Saving...';

      var c = sb(); if(!c){
        ZT.toast('Not connected.', 'error');
        btn.disabled = false;
        btn.textContent = 'Change Mode';
        return;
      }

      try {
        var payload = Object.assign({}, pendingFields, {
          payment_mode: newMode,
          trial_days: 7,
          join_fee: 4.00
        });

        var r = await c.from('tutor_circles').update(payload)
          .eq('id', cir.id).select().maybeSingle();

ZT.loadMembersList = async function(){
  var host = document.getElementById('zt-members-host');
  if(!host) return;
  var c = sb(); if(!c) return;
  var cir = ZT.State.currentCircle; if(!cir) return;

  /* Repaint filter chips */
  document.querySelectorAll('[data-mem-filter]').forEach(function(b){
    var active = b.getAttribute('data-mem-filter') === ZT._memFilter;
    b.style.borderColor = active ? '#10b981' : '#1e293b';
    b.style.background  = active ? 'rgba(16,185,129,.12)' : '#0f172a';
    b.style.color       = active ? '#10b981' : '#cbd5e1';
  });

  try {
    var r = await c.from('tutor_members')
      .select('id, user_id, role, is_active, payment_status, trial_ends_at, grace_started_at, joined_at')
      .eq('circle_id', cir.id)
      .order('joined_at', { ascending: true })
      .limit(500);

    var rows = r.data || [];
    var ids = rows.map(function(x){ return x.user_id; });
    var profiles = {};
    if(ids.length){
      var pr = await c.from('profiles').select('id, name, username, avatar, last_seen_at').in('id', ids);
      (pr.data || []).forEach(function(p){ profiles[p.id] = p; });
    }
    rows.forEach(function(m){
      m._profile = profiles[m.user_id] || { id: m.user_id, name:'User', username:'user', avatar:null, last_seen_at:null };
    });

    var circleMode = cir.payment_mode || 'trial';
    var isFreeCircle = (circleMode === 'free');

    rows.forEach(function(m){
      if(isFreeCircle){
        /* Free circle: only 'removed' shows an icon, everything else is silent */
        m._display_status = (m.payment_status === 'removed') ? 'removed' : null;
      } else {
        m._display_status = m.payment_status || 'trial';
      }
    });

    var filter = ZT._memFilter || 'all';
    var filtered = rows.filter(function(m){
      var st = m._display_status;
      if(filter === 'unpaid'){
        if(isFreeCircle) return false;
        return (st === 'trial' || st === 'pending_payment' || st === 'removed');
      }
      if(filter === 'paid'){
        if(isFreeCircle) return (st !== 'removed');
        return (st === 'paid');
      }
      if(filter === 'online'){
        var ls = m._profile.last_seen_at;
        return ls && (Date.now() - new Date(ls).getTime() < 5*60*1000);
      }
      if(filter === 'recent'){
        return m.joined_at && (Date.now() - new Date(m.joined_at).getTime() < 30*24*60*60*1000);
      }
      return true;
    });

    filtered.sort(function(a, b){
      if(!isFreeCircle){
        var aUnpaid = (a._display_status === 'trial' || a._display_status === 'pending_payment' || a._display_status === 'removed') ? 0 : 1;
        var bUnpaid = (b._display_status === 'trial' || b._display_status === 'pending_payment' || b._display_status === 'removed') ? 0 : 1;
        if(aUnpaid !== bUnpaid) return aUnpaid - bUnpaid;
      }
      var an = (a._profile.name || a._profile.username || '').toLowerCase();
      var bn = (b._profile.name || b._profile.username || '').toLowerCase();
      return an.localeCompare(bn);
    });

    if(!filtered.length){
      host.innerHTML = '<div class="zt-empty"><i class="fa-solid fa-users"></i><p>No members to show.</p></div>';
      return;
    }

    function statusIcon(st){
      if(!st)                      return '';
      if(st === 'paid')            return '<i class="fa-solid fa-circle-check" style="color:#10b981;font-size:13px;"></i>';
      if(st === 'trial')           return '<i class="fa-solid fa-hourglass-half" style="color:#a18554;font-size:13px;"></i>';
      if(st === 'pending_payment') return '<i class="fa-solid fa-triangle-exclamation" style="color:#a18554;font-size:13px;"></i>';
      if(st === 'removed')         return '<i class="fa-solid fa-circle-xmark" style="color:#a16262;font-size:13px;"></i>';
      return '<i class="fa-solid fa-circle" style="color:#64748b;font-size:13px;"></i>';
    }

    var role = ZT.State.myRoleInCircle || 'student';
    var isOwner = (role === 'tutor' || role === 'admin' || role === 'owner');

    var h = '<div style="font-size:11px;color:#64748b;font-weight:800;padding:0 4px;text-transform:uppercase;letter-spacing:.5px;">' + filtered.length + ' member' + (filtered.length === 1 ? '' : 's') + '</div>';
    h += '<div style="display:flex;flex-direction:column;gap:8px;margin-top:8px;">';

    filtered.forEach(function(m){
      var p = m._profile;
      var online = p.last_seen_at && (Date.now() - new Date(p.last_seen_at).getTime() < 5*60*1000);
      var dot = online ? '<span style="position:absolute;bottom:2px;right:2px;width:11px;height:11px;border-radius:50%;background:#10b981;border:2px solid #0f172a;"></span>' : '';
      var av = p.avatar || ('https://ui-avatars.com/api/?name=' + encodeURIComponent(p.name || 'U') + '&background=111827&color=34d399');

      h += '<div style="padding:12px;border-radius:12px;background:#111827;border:1px solid #1e293b;display:flex;align-items:center;gap:12px;">';
      h += '<div onclick="ZT.showView(\'member-profile\',\'' + ZT.escape(m.user_id) + '\')" style="position:relative;width:44px;height:44px;flex-shrink:0;cursor:pointer;">';
      h += '<img src="' + ZT.escape(av) + '" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">';
      h += dot + '</div>';
      h += '<div onclick="ZT.showView(\'member-profile\',\'' + ZT.escape(m.user_id) + '\')" style="flex:1;min-width:0;cursor:pointer;">';
      h += '<div style="display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + ZT.escape(p.name || 'User') + ' ' + statusIcon(m._display_status) + '</div>';
      h += '<div style="font-size:10.5px;color:#94a3b8;margin-top:2px;">@' + ZT.escape(p.username || 'user') + ' · ' + ZT.escape(m.role || 'student') + '</div>';
      h += '</div>';
      if(isOwner){
        h += '<button onclick="ZT._memberMenu(\'' + ZT.escape(m.id) + '\',\'' + ZT.escape(m.user_id) + '\')" ' +
             'style="background:transparent;border:none;color:#64748b;cursor:pointer;width:32px;height:32px;border-radius:8px;font-size:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;">' +
             '<i class="fa-solid fa-ellipsis-vertical"></i></button>';
      }
      h += '</div>';
    });

    h += '</div>';
    host.innerHTML = h;
  } catch(e){
    host.innerHTML = '<div class="zt-empty"><p>Could not load members.</p></div>';
  }
};

      var matches = (this.value || '').trim() === cir.name;
      btn.disabled = !matches;
      btn.style.opacity = matches ? '1' : '.5';
      btn.style.cursor = matches ? 'pointer' : 'not-allowed';
      btn.style.background = matches ? 'rgba(161,98,98,.4)' : 'rgba(161,98,98,.2)';
      btn.style.color = matches ? '#fff' : '#c9a5a5';
    });
    btn.addEventListener('click', async function(){
      if(this.disabled) return;
      this.disabled = true;
      this.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Deleting…';
      var c = ZT.sb(); if(!c) return;
      var r = await c.from('tutor_circles').delete().eq('id', cir.id);
      if(r.error){
        ZT.toast('Delete failed.', 'error');
        this.disabled = false;
        this.textContent = 'Delete Forever';
        return;
      }
      ZT.Modal.close();
      ZT.toast('Circle deleted.');
      ZT.haptic(20);
      ZT.State.currentCircle = null;
      ZT.State.myRoleInCircle = null;
      ZT.showView('feed');
    });
  }, 60);
};

ZT.loadAssignments = async function(){
  var host = document.getElementById('zt-assign-host'); if(!host) return;
  var cir = ZT.State.currentCircle; if(!cir) return;
  var me = ZT.State.currentUser;
  var role = ZT.State.myRoleInCircle || 'student';
  var isTutor = role === 'tutor' || role === 'admin' || role === 'owner';
  var c = sb(); if(!c) return;
  try {
    var r = await c.from('tutor_assignments').select('*').eq('circle_id', cir.id).order('created_at', { ascending: false }).limit(60);
    if(r.error){ host.innerHTML = '<div class="zt-empty"><p>Error.</p></div>'; return; }
    var list = r.data || [];
    var _q = (ZT._assignSearch || '').trim().toLowerCase();
    if(_q){
      list = list.filter(function(a){
        var title = (a.title || '').toLowerCase();
        var desc = (a.description || '').toLowerCase();
        var dueStr = a.due_date ? new Date(a.due_date).toLocaleDateString().toLowerCase() : '';
        var iso = a.due_date ? String(a.due_date).toLowerCase() : '';
        return title.indexOf(_q) !== -1 || desc.indexOf(_q) !== -1 || dueStr.indexOf(_q) !== -1 || iso.indexOf(_q) !== -1;
      });
    }
    ZT.State.assignments = list;
    var pendingAssigns = (ZT.State.pendingAIGens || []).filter(function(j){ return j.kind === 'assignment'; });
    if(!list.length && !pendingAssigns.length){ host.innerHTML = '<div class="zt-empty"><i class="fa-solid fa-clipboard-check"></i><p>No assignments yet.</p></div>'; return; }
    var mySubs = {};
    var sr = await c.from('tutor_submissions').select('assignment_id').eq('student_id', me.id);
    (sr.data || []).forEach(function(x){ mySubs[x.assignment_id] = true; });

    var h = '';
    list.forEach(function(a){
      var submitted = !!mySubs[a.id];
      var bg = a.banner_style ? ZT.gradientCss(a.banner_style) : '#111827';
      var isBg = !!a.banner_style;
      h += '<div style="background:' + bg + ';border:1px solid #1e293b;border-radius:14px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;">';
      h += '<button onclick="ZT.openAssignment(\'' + ZT.escape(a.id) + '\')" style="flex:1;background:transparent;border:none;padding:0;display:flex;gap:12px;align-items:center;text-align:left;cursor:pointer;min-width:0;">';
      h += '<div style="width:42px;height:42px;border-radius:12px;background:' + (isBg ? 'rgba(0,0,0,.25)' : 'rgba(16,185,129,.12)') + ';color:' + (isBg ? '#fff' : '#10b981') + ';display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;"><i class="fa-solid fa-clipboard-check"></i></div>';
      h += '<div style="flex:1;min-width:0;">';
      h += '<div style="font-size:14px;font-weight:800;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;' + (isBg ? 'text-shadow:0 1px 3px rgba(0,0,0,.5);' : '') + '">' + ZT.escape(a.title) + '</div>';
      h += '<div style="font-size:11px;color:' + (isBg ? 'rgba(255,255,255,.85)' : '#94a3b8') + ';margin-top:2px;">' + (a.due_date ? 'Due ' + new Date(a.due_date).toLocaleDateString() : 'No due date') + ' · Max ' + (a.max_marks||100) + (submitted && !isTutor ? ' · ✓ Submitted' : '') + '</div>';
      h += '</div></button>';
      if(isTutor){
        h += '<button onclick="ZT.openAssignmentMenu(\'' + ZT.escape(a.id) + '\',event)" style="background:rgba(0,0,0,.25);border:none;color:#fff;width:32px;height:32px;border-radius:8px;cursor:pointer;flex-shrink:0;"><i class="fa-solid fa-ellipsis-vertical"></i></button>';
      }
      h += '</div>';
    });
    var pendingHtmlA = '';
    pendingAssigns.forEach(function(job){
      if(job.status === 'generating'){
        pendingHtmlA += '<div style="background:linear-gradient(135deg,rgba(16,185,129,.12),rgba(59,130,246,.08));border:1px solid rgba(16,185,129,.4);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;">';
        pendingHtmlA += '<div style="width:42px;height:42px;border-radius:12px;background:rgba(16,185,129,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="fa-solid fa-circle-notch fa-spin" style="color:#6ee7b7;font-size:16px;"></i></div>';
        pendingHtmlA += '<div style="flex:1;min-width:0;"><div style="font-size:14px;font-weight:800;color:#fff;">' + ZT.escape(job.title) + '</div>';
        pendingHtmlA += '<div style="font-size:11px;color:#6ee7b7;margin-top:2px;">⏳ AI is generating assignment…</div></div></div>';
      } else if(job.status === 'error'){
        pendingHtmlA += '<div style="background:rgba(161,98,98,.10);border:1px solid rgba(161,98,98,.4);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;">';
        pendingHtmlA += '<div style="width:42px;height:42px;border-radius:12px;background:rgba(161,98,98,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="fa-solid fa-triangle-exclamation" style="color:#a16262;font-size:16px;"></i></div>';
        pendingHtmlA += '<div style="flex:1;min-width:0;"><div style="font-size:13px;font-weight:800;color:#c9a5a5;">' + ZT.escape(job.title) + ' — failed</div>';
        pendingHtmlA += '<div style="font-size:11px;color:#94a3b8;margin-top:2px;word-break:break-word;">' + ZT.escape(job.error || 'Unknown') + '</div></div>';
        pendingHtmlA += '<button onclick="ZT.dismissAssignmentAI(\'' + job.id + '\')" style="background:rgba(161,98,98,.2);border:1px solid rgba(161,98,98,.4);color:#c9a5a5;width:32px;height:32px;border-radius:8px;cursor:pointer;flex-shrink:0;"><i class="fa-solid fa-xmark"></i></button></div>';
      }
    });
    host.innerHTML = pendingHtmlA + h;
  } catch(e){ host.innerHTML = '<div class="zt-empty"><p>Error.</p></div>'; }
};

ZT.startAssignmentAIGeneration = async function(data){
  var jobId = ZT.uuid();
  ZT.State.pendingAIGens = ZT.State.pendingAIGens || [];
  ZT.State.pendingAIGens.push({ id: jobId, kind: 'assignment', title: data.topic, status: 'generating', error: null });
  ZT.loadAssignments();

  try {
    var res = await fetch(ZT.TOKEN_SERVER + 'ai/generate-assignment', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ topic: data.topic, className: data.className })
    });
    var out = await res.json();
    if(!res.ok || !out.ok){
      var m = out.error || 'AI failed';
      if(out.detail) m += ' — ' + String(out.detail).slice(0, 120);
      throw new Error(m);
    }

    var a = out.assignment;
    var c = sb();
    var dueDate = new Date(Date.now() + (parseInt(a.days) || 7) * 86400000).toISOString();
    var r = await c.from('tutor_assignments').insert({
      circle_id: ZT.State.currentCircle.id,
      author_id: ZT.State.currentUser.id,
      title: a.title,
      description: a.description || null,
      due_date: dueDate,
      max_marks: data.marks,
      banner_style: null
    }).select().maybeSingle();
    if(r.error) throw r.error;

    ZT.State.pendingAIGens = ZT.State.pendingAIGens.filter(function(j){ return j.id !== jobId; });
    ZT.toast('✅ Assignment "' + a.title + '" created!');
    ZT.haptic(20);
    ZT.loadAssignments();
  } catch(e){
    var j = ZT.State.pendingAIGens.find(function(x){ return x.id === jobId; });
    if(j){ j.status = 'error'; j.error = (e && e.message) || 'Failed'; }
    ZT.loadAssignments();
  }
};

ZT.dismissAssignmentAI = function(jobId){
  ZT.State.pendingAIGens = (ZT.State.pendingAIGens || []).filter(function(j){ return j.id !== jobId; });
  ZT.loadAssignments();
};

ZT.State.pendingAIGens = ZT.State.pendingAIGens || [];

ZT.startAIGeneration = async function(quizData){
  var jobId = ZT.uuid();
  ZT.State.pendingAIGens.push({
    id: jobId,
    title: quizData.title,
    status: 'generating',
    error: null
  });
  ZT.loadQuizzes();

  try {
    var res = await fetch(ZT.TOKEN_SERVER + 'ai/generate-quiz', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text: quizData.text, count: quizData.count })
    });
    var data = await res.json();
    if(!res.ok || !data.ok){
      var errMsg = data.error || 'AI failed';
      if(data.detail) errMsg += ' — ' + String(data.detail).slice(0, 120);
      throw new Error(errMsg);
    }

    var c = sb();
    var qr = await c.from('tutor_quizzes').insert({
      circle_id: ZT.State.currentCircle.id,
      author_id: ZT.State.currentUser.id,
      title: quizData.title,
      time_limit_min: quizData.timeLimit,
      banner_style: quizData.banner && quizData.banner !== 'none' ? quizData.banner : null
    }).select().maybeSingle();
    if(qr.error) throw qr.error;

    var qid = qr.data.id;
    for(var i = 0; i < data.questions.length; i++){
      var q = data.questions[i];
      var correct = parseInt(q.correct);
      if(isNaN(correct) || correct < 0 || correct >= q.options.length) correct = 0;
      await c.from('tutor_quiz_questions').insert({
        quiz_id: qid,
        order: i,
        question: q.q,
        options: q.options,
        correct_index: correct
      });
    }

    ZT.State.pendingAIGens = ZT.State.pendingAIGens.filter(function(j){ return j.id !== jobId; });
    ZT.toast('✅ Quiz "' + quizData.title + '" created!');
    ZT.haptic(20);
    ZT.loadQuizzes();
  } catch(e){
    var j = ZT.State.pendingAIGens.find(function(x){ return x.id === jobId; });
    if(j){
      j.status = 'error';
      j.error = (e && e.message) || 'Failed';
    }
    ZT.loadQuizzes();
  }
};

ZT.dismissPendingAI = function(jobId){
  ZT.State.pendingAIGens = ZT.State.pendingAIGens.filter(function(j){ return j.id !== jobId; });
  ZT.loadQuizzes();
};

      h += '<div style="width:42px;height:42px;border-radius:12px;background:' + (q.banner_style ? 'rgba(0,0,0,.25)' : 'rgba(96,165,250,.12)') + ';color:' + (q.banner_style ? '#fff' : '#60a5fa') + ';display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;"><i class="fa-solid fa-list-check"></i></div>';

      h += '</div></div>';

      }
      h += '</div>';

    var pendingHtml = '';
    (ZT.State.pendingAIGens || []).forEach(function(job){
      if(job.status === 'generating'){
        pendingHtml += '<div style="background:linear-gradient(135deg,rgba(16,185,129,.12),rgba(59,130,246,.08));border:1px solid rgba(16,185,129,.4);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;">';
        pendingHtml += '<div style="width:42px;height:42px;border-radius:12px;background:rgba(16,185,129,.2);display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="fa-solid fa-circle-notch fa-spin" style="color:#6ee7b7;font-size:16px;"></i></div>';
        pendingHtml += '<div style="flex:1;min-width:0;">';
        pendingHtml += '<div style="font-size:14px;font-weight:800;color:#fff;">' + ZT.escape(job.title) + '</div>';
        pendingHtml += '<div style="font-size:11px;color:#6ee7b7;margin-top:2px;">⏳ AI is generating questions…</div>';
        pendingHtml += '</div></div>';
      } else if(job.status === 'error'){
        pendingHtml += '<div style="background:rgba(161,98,98,.10);border:1px solid rgba(161,98,98,.4);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;gap:12px;align-items:center;">';

ZT.editQuiz = async function(quizId){
  var c = sb(); if(!c) return;
  var q = await c.from('tutor_quizzes').select('*').eq('id', quizId).maybeSingle();
  if(q.error || !q.data){ ZT.toast('Not found.', 'error'); return; }
  var qs = await c.from('tutor_quiz_questions').select('*').eq('quiz_id', quizId).order('order', { ascending: true });
  var questions = (qs.data || []).map(function(x){
    return { question: x.question, options: x.options || ['','','',''], correct_index: x.correct_index || 0 };
  });
  ZT._editQuizId = quizId;
  ZT._newQuiz = { questions: questions };
  ZT._composerBanner = q.data.banner_style || 'none';

  var bannersHtml = '<div class="zt-st" style="margin:0;padding:0 4px;">Banner</div><div id="zt-banner-picker" style="display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;">';
  ZT.COMPOSER_BANNERS.forEach(function(b){
    var isActive = b.id === ZT._composerBanner;
    bannersHtml += '<div onclick="ZT.pickBanner(\'' + b.id + '\')" data-banner="' + b.id + '" style="flex-shrink:0;width:52px;height:52px;border-radius:12px;cursor:pointer;' + (b.css ? 'background:' + b.css + ';' : 'background:#0f172a;border:1px dashed #334155;') + 'border:' + (isActive ? '2px solid #10b981' : '2px solid rgba(255,255,255,.06)') + ';display:flex;align-items:center;justify-content:center;">' + (b.id === 'none' ? '<i class="fa-solid fa-font" style="color:#64748b;font-size:14px;"></i>' : '') + '</div>';
  });
  bannersHtml += '</div>';

  var h = '';
  h += '<div class="zt-field"><label class="zt-label">Quiz title *</label><input id="zt-qz-title" class="zt-input" value="' + ZT.escape(q.data.title) + '"></div>';
  h += '<div class="zt-field"><label class="zt-label">Time limit (min)</label><input id="zt-qz-time" type="number" class="zt-input" value="' + (q.data.time_limit_min||15) + '" min="1"></div>';
  h += bannersHtml;
  h += '<div class="zt-st">Questions (' + ZT._newQuiz.questions.length + ')</div>';
  h += '<div id="zt-qz-host"></div>';
  h += '<button class="zt-btn secondary" id="zt-qz-add" style="margin-top:6px;"><i class="fa-solid fa-plus"></i> Add MCQ</button>';
  h += '<button class="zt-btn" id="zt-qz-ai" style="margin-top:6px;background:linear-gradient(135deg,#10b981,#3b82f6);color:#fff;"><i class="fa-solid fa-wand-magic-sparkles"></i> AI Generate Questions</button>';

  ZT.Modal.open({
    title:'Edit Quiz', icon:'fa-solid fa-list-check', submitLabel:'Save Changes',
    body:h,
    onOpen:function(){
      ZT.paintQuizBuilder();
      document.getElementById('zt-qz-add').addEventListener('click', function(){
        ZT._newQuiz.questions.push({ question:'', options:['','','',''], correct_index:0 });
        ZT.paintQuizBuilder();
      });
      document.getElementById('zt-qz-ai').addEventListener('click', ZT.openAIGenerator);
    },
    onSubmit: async function(){
      var title = (document.getElementById('zt-qz-title').value || '').trim();
      if(title.length < 2){ ZT.toast('Title required.', 'error'); return false; }
      for(var i=0;i<ZT._newQuiz.questions.length;i++){
        var qq = ZT._newQuiz.questions[i];
        if(!qq.question.trim()){ ZT.toast('Q'+(i+1)+' empty.', 'error'); return false; }
        var filled = qq.options.filter(function(o){ return (o||'').trim(); });
        if(filled.length < 2){ ZT.toast('Q'+(i+1)+': 2 options needed.', 'error'); return false; }
      }
      var c = sb();
      await c.from('tutor_quizzes').update({
        title:title,
        time_limit_min: parseInt(document.getElementById('zt-qz-time').value)||15,
        banner_style: (ZT._composerBanner && ZT._composerBanner !== 'none') ? ZT._composerBanner : null
      }).eq('id', quizId);
      await c.from('tutor_quiz_questions').delete().eq('quiz_id', quizId);
      for(var j=0;j<ZT._newQuiz.questions.length;j++){
        var qq2 = ZT._newQuiz.questions[j];
        var opts = qq2.options.filter(function(o){ return (o||'').trim(); });
        var nonEmptyBefore = 0;
        for(var k = 0; k < qq2.correct_index; k++){
          if((qq2.options[k]||'').trim()) nonEmptyBefore++;
        }
        var correctIdx = Math.max(0, Math.min(nonEmptyBefore, opts.length-1));
        await c.from('tutor_quiz_questions').insert({ quiz_id:quizId, order:j, question:qq2.question, options:opts, correct_index:correctIdx });
      }
      ZT.toast('Quiz updated.');
      ZT.loadQuizzes();
      return true;
    }
  });
};

      for(var i = 0; i < ZT._newQuiz.questions.length; i++){
        var q = ZT._newQuiz.questions[i];
        if(!q.question.trim()){ ZT.toast('Question ' + (i+1) + ' empty.', 'error'); return false; }
        var filled = q.options.filter(function(o){ return (o||'').trim(); });
        if(filled.length < 2){ ZT.toast('Q' + (i+1) + ': at least 2 options.', 'error'); return false; }
      }
      var c = sb();
      var qr = await c.from('tutor_quizzes').insert({
        circle_id: cir.id,
        author_id: me.id,
        title: title,
        time_limit_min: parseInt(document.getElementById('zt-qz-time').value)||15,
        banner_style: (ZT._composerBanner && ZT._composerBanner !== 'none') ? ZT._composerBanner : null
      }).select().maybeSingle();
      if(qr.error){ ZT.toast('Failed.', 'error'); return false; }
      var qid = qr.data.id;
      for(var j = 0; j < ZT._newQuiz.questions.length; j++){
        var qq = ZT._newQuiz.questions[j];
        var opts = qq.options.filter(function(o){ return (o||'').trim(); });
        var nonEmptyBefore = 0;
        for(var k = 0; k < qq.correct_index; k++){
          if((qq.options[k]||'').trim()) nonEmptyBefore++;
        }
        var correctIdx = Math.max(0, Math.min(nonEmptyBefore, opts.length-1));
        await c.from('tutor_quiz_questions').insert({ quiz_id: qid, order: j, question: qq.question, options: opts, correct_index: correctIdx });
      }
      ZT.toast('Quiz saved.');
      ZT.loadQuizzes();
      return true;
    }
  });
};

ZT.renderQuizDetail = function(){
  var q = ZT.State.currentQuiz; if(!q) return '<div class="zt-empty"><p>Not found.</p></div>';
  var role = ZT.State.myRoleInCircle || 'student';
  var isTutor = role === 'tutor' || role === 'admin' || role === 'owner';
  var att = ZT.State.currentQuizAttempt;
  var attemptCount = ZT.State.quizAttemptCount || 0;
  var questions = ZT.State.currentQuizQuestions;
  var bannerCss = q.banner_style ? ZT.gradientCss(q.banner_style) : '';

  var h = '';
  h += '<div style="' + (bannerCss ? 'background:' + bannerCss + ';border-radius:14px;padding:20px 14px;margin-bottom:14px;' : '') + 'display:flex;align-items:center;gap:10px;">';
  h += '<button onclick="ZT.goBack()" style="background:' + (bannerCss ? 'rgba(0,0,0,.25)' : 'rgba(16,185,129,.1)') + ';border:1px solid ' + (bannerCss ? 'rgba(255,255,255,.3)' : 'rgba(16,185,129,.4)') + ';color:' + (bannerCss ? '#fff' : '#6ee7b7') + ';width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:13px;flex-shrink:0;"><i class="fa-solid fa-arrow-left"></i></button>';
  h += '<div style="flex:1;min-width:0;">';
  h += '<div style="font-size:16px;font-weight:900;color:#fff;' + (bannerCss ? 'text-shadow:0 1px 4px rgba(0,0,0,.5);' : '') + '">' + ZT.escape(q.title) + '</div>';
  h += '<div style="font-size:11px;color:' + (bannerCss ? 'rgba(255,255,255,.85)' : '#94a3b8') + ';margin-top:2px;">' + questions.length + ' questions · ' + (q.time_limit_min||15) + ' min</div>';
  h += '</div></div>';

  if(isTutor){
    h += '<div class="zt-st">Answer key</div>';
    questions.forEach(function(qq, i){
      h += '<div class="zt-card" style="padding:12px;">';
      h += '<div style="font-size:12px;font-weight:800;color:#fff;margin-bottom:6px;">Q' + (i+1) + '. ' + ZT.escape(qq.question) + '</div>';
      (qq.options || []).forEach(function(opt, j){
        var cls = j === qq.correct_index ? 'correct' : '';
        h += '<div class="zt-q-opt ' + cls + '" style="cursor:default;">' + ZT.escape(opt) + '</div>';
      });
      h += '</div>';
    });

    /* Student attempts summary */
    h += '<div class="zt-st" style="margin-top:14px;">Student attempts</div>';
    var c = sb();
    c.from('tutor_quiz_attempts').select('student_id,score,total,attempt_number').eq('quiz_id', q.id).then(async function(res){
      var list = res.data || [];
      var byStudent = {};
      list.forEach(function(x){
        if(!byStudent[x.student_id]) byStudent[x.student_id] = { count: 0, best: 0, total: x.total, final: null };
        byStudent[x.student_id].count++;
        if(x.score > byStudent[x.student_id].best) byStudent[x.student_id].best = x.score;
        if(x.attempt_number === 3 || x.is_final) byStudent[x.student_id].final = x;
      });
      var ids = Object.keys(byStudent);
      var host = document.getElementById('zt-quiz-attempts-host');
      if(!host) return;
      if(!ids.length){ host.innerHTML = '<div class="zt-card" style="text-align:center;color:#94a3b8;font-size:12px;">No attempts yet.</div>'; return; }
      var pr = await c.from('profiles').select('id,name,username,avatar').in('id', ids);
      (pr.data || []).forEach(function(p){ ZT.State.profileCache[p.id] = p; });
      var ih = '';
      ids.forEach(function(sid){
        var info = byStudent[sid];
        var p = ZT.profileOf(sid);
        ih += '<div class="zt-card" style="padding:12px;display:flex;gap:10px;align-items:center;">';
        ih += '<img src="' + ZT.escape(ZT.safeAvatar(p)) + '" style="width:38px;height:38px;border-radius:50%;object-fit:cover;flex-shrink:0;">';
        ih += '<div style="flex:1;min-width:0;">';
        
          ih += '<div style="font-size:13px;font-weight:800;color:#fff;">' + ZT.escape(p.name || 'Member') + '</div>';
        ih += '<div style="font-size:10.5px;color:#94a3b8;">Attempts: ' + info.count + '/3' + (info.final ? ' · Final: ' + info.final.score + '/' + info.final.total : ' · In progress') + '</div>';
        ih += '</div></div>';
      });
      host.innerHTML = ih;
    });
    h += '<div id="zt-quiz-attempts-host"><div style="text-align:center;color:#64748b;padding:10px;font-size:12px;">Loading…</div></div>';
    return h;
  }

  /* STUDENT */
  var maxAttempts = 3;
  var canRetry = attemptCount < maxAttempts;
  var showAnswers = attemptCount >= maxAttempts;

  if(attemptCount > 0){
    h += '<div class="zt-card" style="text-align:center;">';
    h += '<div style="font-size:11px;color:#94a3b8;font-weight:900;letter-spacing:.5px;">ATTEMPT ' + attemptCount + '/' + maxAttempts + '</div>';
    h += '<div style="font-size:42px;font-weight:900;color:#10b981;margin-top:6px;">' + att.score + ' / ' + att.total + '</div>';
    if(attemptCount < maxAttempts){
      h += '<div style="font-size:11px;color:#94a3b8;margin-top:8px;">You have ' + (maxAttempts - attemptCount) + ' attempt' + ((maxAttempts - attemptCount) > 1 ? 's' : '') + ' left. Real answers unlock after 3rd attempt.</div>';
    } else {
      h += '<div style="font-size:11px;color:#10b981;margin-top:8px;font-weight:800;">All attempts used. Real answers below.</div>';
    }
    h += '</div>';

    if(canRetry){
      h += '<button class="zt-btn" onclick="ZT.startNewQuizAttempt()" style="margin-bottom:12px;"><i class="fa-solid fa-rotate-right"></i> Retry Quiz</button>';
    }

    if(showAnswers){
      h += '<div class="zt-st">Correct answers</div>';
      questions.forEach(function(qq, i){
        h += '<div class="zt-card" style="padding:12px;">';
        h += '<div style="font-size:12px;font-weight:800;color:#fff;margin-bottom:8px;">Q' + (i+1) + '. ' + ZT.escape(qq.question) + '</div>';
        (qq.options || []).forEach(function(opt, j){
          var cls = j === qq.correct_index ? 'correct' : '';
          h += '<div class="zt-q-opt ' + cls + '" style="cursor:default;">' + ZT.escape(opt) + '</div>';
        });
        h += '</div>';
      });
    }
    return h;
  }

  h += '<div id="zt-quiz-take-host"></div>';
  setTimeout(ZT.paintQuizTake, 30);
  return h;
};

ZT.startNewQuizAttempt = function(){
  ZT.State.quizAnswers = {};
  ZT.State.quizIndex = 0;
  ZT.State.currentQuizAttempt = null;
  var h = '<div id="zt-quiz-take-host"></div>';
  var host = document.querySelector('.zt-circle-head');
  var container = document.getElementById('zt-app');
  container.innerHTML = '<div class="zt-circle-head"><button class="back" onclick="ZT.showView(\'quizzes\')"><i class="fa-solid fa-arrow-left"></i></button><div style="flex:1;min-width:0;"><div class="nm">Quiz</div><div class="sub">Attempt ' + ((ZT.State.quizAttemptCount||0) + 1) + '/3</div></div></div><div id="zt-quiz-take-host"></div>';
  ZT.paintQuizTake();
};

ZT.paintQuizTake = function(){
  var host = document.getElementById('zt-quiz-take-host'); if(!host) return;
  var qs = ZT.State.currentQuizQuestions;
  var idx = ZT.State.quizIndex || 0;
  var q = qs[idx];
  if(!q){ host.innerHTML = ''; return; }
  var h = '';
  h += '<div style="font-size:11px;color:#94a3b8;font-weight:900;letter-spacing:.5px;margin-bottom:8px;">QUESTION ' + (idx+1) + ' / ' + qs.length + '</div>';
  h += '<div class="zt-card" style="font-size:14px;color:#fff;font-weight:800;line-height:1.5;">' + ZT.escape(q.question) + '</div>';
  (q.options || []).forEach(function(opt, j){
    var sel = ZT.State.quizAnswers[idx] === j;
    h += '<div class="zt-q-opt ' + (sel ? 'sel' : '') + '" data-quiz-opt="' + j + '">' + ZT.escape(opt) + '</div>';
  });
  h += '<div style="display:flex;gap:8px;margin-top:14px;">';
  if(idx > 0) h += '<button class="zt-btn secondary" id="zt-q-prev" style="flex:1;">‹ Prev</button>';
  if(idx < qs.length - 1) h += '<button class="zt-btn" id="zt-q-next" style="flex:1;">Next ›</button>';
  else h += '<button class="zt-btn" id="zt-q-submit" style="flex:1;">Submit Quiz</button>';
  h += '</div>';
  host.innerHTML = h;
  host.querySelectorAll('[data-quiz-opt]').forEach(function(el){
    el.addEventListener('click', function(){
      ZT.State.quizAnswers[idx] = parseInt(this.getAttribute('data-quiz-opt'));
      ZT.paintQuizTake();
    });
  });
  var pb = document.getElementById('zt-q-prev'); if(pb) pb.onclick = function(){ ZT.State.quizIndex--; ZT.paintQuizTake(); };
  var nb = document.getElementById('zt-q-next'); if(nb) nb.onclick = function(){ ZT.State.quizIndex++; ZT.paintQuizTake(); };
  var sb2 = document.getElementById('zt-q-submit'); if(sb2) sb2.onclick = ZT.submitQuizAttempt;
};

ZT.submitQuizAttempt = async function(){
  var qs = ZT.State.currentQuizQuestions;
  for(var i=0;i<qs.length;i++){
    if(ZT.State.quizAnswers[i] == null){ ZT.toast('Answer Q' + (i+1) + ' first.', 'warning'); return; }
  }
  var score = 0;
  qs.forEach(function(q, i){ if(ZT.State.quizAnswers[i] === q.correct_index) score++; });
  var c = sb();
  var nextAttempt = (ZT.State.quizAttemptCount || 0) + 1;
  try {
    var r = await c.from('tutor_quiz_attempts').insert({
      quiz_id: ZT.State.currentQuiz.id,
      student_id: ZT.State.currentUser.id,
      score: score,
      total: qs.length,
      attempt_number: nextAttempt,
      is_final: nextAttempt >= 3
    }).select().maybeSingle();
    if(r.error) throw r.error;
    ZT.State.currentQuizAttempt = r.data;
    ZT.State.quizAttemptCount = nextAttempt;
    ZT.toast('Submitted! Score: ' + score + '/' + qs.length + ' (Attempt ' + nextAttempt + '/3)');
    ZT.haptic(15);
    ZT.showView('quiz-detail', ZT.State.currentQuiz.id);
  } catch(e){ ZT.toast('Submit failed.', 'error'); }
};

/* ============================================================
   BOOT
   ============================================================ */
async function boot(){
  var c = sb();
  var user = null;

  if(c){
    /* Retry getSession up to 3 times — SDK sometimes returns null right after page load */
    for(var attempt = 0; attempt < 3; attempt++){
      try {
        var s = await c.auth.getSession();
        if(s && s.data && s.data.session && s.data.session.user){
          user = s.data.session.user;
          break;
        }
      } catch(e){ console.warn('[boot] session attempt ' + attempt, e); }
      if(!user) await new Promise(function(r){ setTimeout(r, 400); });
    }
    /* Fallback: getUser uses cached session in localStorage */
    if(!user){
      try {
        var gu = await c.auth.getUser();
        if(gu && gu.data && gu.data.user) user = gu.data.user;
      } catch(e){ console.warn('[boot] getUser', e); }
    }
    /* Load profile */
    if(user){
      try {
        var pr = await c.from('profiles').select('*').eq('id', user.id).maybeSingle();
        if(pr.data){
          ZT.State.currentUser = pr.data;
        } else {
          ZT.State.currentUser = {
            id: user.id,
            name: (user.user_metadata && user.user_metadata.name) || 'User',
            username: (user.email||'').split('@')[0],
            email: user.email,
            avatar: 'https://ui-avatars.com/api/?name=' + encodeURIComponent(user.email||'U') + '&background=8b5cf6&color=000'
          };
        }
        ZT.State.profileCache[ZT.State.currentUser.id] = ZT.State.currentUser;
        if(ZT.State.currentUser.is_tutor_approved === undefined){
          ZT.State.currentUser.is_tutor_approved = false;
        }
      } catch(e){
        console.warn('[boot] profile fetch', e);
        /* Fallback — still set currentUser so UI doesn't appear logged out */
        ZT.State.currentUser = {
          id: user.id,
          name: (user.user_metadata && user.user_metadata.name) || 'User',
          username: (user.email||'').split('@')[0],
          email: user.email,
          avatar: 'https://ui-avatars.com/api/?name=' + encodeURIComponent(user.email||'U') + '&background=8b5cf6&color=000'
        };
      }
    }
  }

  setTimeout(function(){ var w = document.getElementById('zt-welcome'); if(w) w.classList.add('fadeout'); }, 400);
  ZT._loadTutorTheme();
  ZT._paintHeaderWallet();
  setInterval(ZT._paintHeaderWallet, 30000);

  var _lastCircleId = null;
  try { _lastCircleId = localStorage.getItem('zynix_tutor_last_circle'); } catch(e){}
  if(_lastCircleId && ZT.State.currentUser){
    ZT.enterCircle(_lastCircleId);
  } else {
    ZT.showView('feed');
  }

  /* Watchdog — agar 5 sec me blank reh gaya, force landing */
  setTimeout(function(){
    var app = document.getElementById('zt-app');
    if(app && (!app.innerHTML || app.innerHTML.trim() === '')){
      try { ZT.showView('feed'); } catch(e){}
    }
  }, 5000);

  console.log('[ZYNIX Tutor v3] booted · user=' + (ZT.State.currentUser ? ZT.State.currentUser.name : 'guest'));

  setTimeout(function(){
    try {
      if(ZT.State.currentUser && sb()){
        sb().rpc('tutor_auto_check_trials').catch(function(){});
      }
    } catch(e){}
  }, 3000);
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

ZT.showPendingJoins = function(){

    list.forEach(function(h){
      html += '<div style="display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #1e293b;">';
      html += '<div style="width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#10b981,#3b82f6);display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;font-size:15px;">' + ZT.escape((h.name || 'U').charAt(0).toUpperCase()) + '</div>';
      html += '<div style="flex:1;min-width:0;">';
      html += '<div style="font-size:13px;font-weight:800;color:#fff;">' + ZT.escape(h.name || 'User') + '</div>';
      html += '<div style="font-size:10px;color:#94a3b8;">requested ' + ZT.timeAgo(h.at) + '</div>';
      html += '</div>';
      html += '<button onclick="ZT.approveJoin(\'' + ZT.escape(h.identity) + '\')" style="background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.45);color:#10b981;padding:6px 12px;border-radius:8px;font-size:10px;font-weight:900;cursor:pointer;margin-right:4px;">Allow</button>';
      html += '<button onclick="ZT.denyJoin(\'' + ZT.escape(h.identity) + '\')" style="background:rgba(161,98,98,.15);border:1px solid rgba(161,98,98,.4);color:#c9a5a5;padding:6px 12px;border-radius:8px;font-size:10px;font-weight:900;cursor:pointer;">Deny</button>';
      html += '</div>';
    });
  }
  ZT.Modal.open({ title:'Join Requests (' + list.length + ')', icon:'fa-solid fa-user-clock', body:html, footer:false });
};

ZT.approveJoin = async function(identity){
  if(!ZT._lk.room || !ZT._lk.isTutor) return;
  try {
    await ZT._lk.room.localParticipant.publishData(
      new TextEncoder().encode('__JOIN_APPROVED__'),
      { destinationIdentities: [identity] }
    );
    ZT._lk.pendingJoins = (ZT._lk.pendingJoins || []).filter(function(x){ return x.identity !== identity; });
    ZT.paintPendingBadge();
    ZT.toast('Approved.');
    ZT.Modal.close();
  } catch(e){ ZT.toast('Failed.', 'error'); }
};

ZT.denyJoin = async function(identity){
  if(!ZT._lk.room || !ZT._lk.isTutor) return;
  try {
    await ZT._lk.room.localParticipant.publishData(
      new TextEncoder().encode('__JOIN_DENIED__'),
      { destinationIdentities: [identity] }
    );
    ZT._lk.pendingJoins = (ZT._lk.pendingJoins || []).filter(function(x){ return x.identity !== identity; });
    ZT.paintPendingBadge();
    ZT.toast('Denied.');
    ZT.Modal.close();
  } catch(e){ ZT.toast('Failed.', 'error'); }
};

/* ============================================================
   PARTICIPANTS PANEL (Tutor controls)
   ============================================================ */
ZT.showParticipantsPanel = function(){
  if(!ZT._lk.room){ ZT.toast('Not connected.', 'error'); return; }
  var room = ZT._lk.room;
  var me = ZT.State.currentUser;
  var role = ZT.State.myRoleInCircle || 'student';
  var isTutor = role === 'tutor' || role === 'admin' || role === 'owner';

  var list = [];
  /* Local first */
  list.push({
    identity: room.localParticipant.identity,
    isLocal: true,
    name: (me.name || 'You') + ' (You)',
    isSpeaker: ZT._lk.isTutor || (room.localParticipant.isMicrophoneEnabled && ZT._lk.speakers[room.localParticipant.identity])
  });
  /* Remotes */
  room.remoteParticipants.forEach(function(p){
    var nm = (p.identity || 'User').split('-')[0];
    var isSpk = p.trackPublications.size > 0 && Array.from(p.trackPublications.values()).some(function(pub){ return pub.kind === 'audio' && pub.track; });
    list.push({ identity: p.identity, name: nm, isLocal: false, isSpeaker: isSpk });
  });

  var html = '';
  html += '<div style="font-size:11px;color:#94a3b8;margin-bottom:10px;font-weight:800;">' + list.length + ' in room</div>';

  list.forEach(function(x){
    var isHost = x.identity === room.localParticipant.identity && isTutor;
    var roleLabel = isHost ? 'HOST' : (x.isSpeaker ? 'SPEAKER' : 'LISTENER');
    var roleColor = isHost ? '#a18554' : (x.isSpeaker ? '#10b981' : '#64748b');

    html += '<div style="display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #1e293b;">';
    html += '<div style="width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#10b981,#3b82f6);display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;font-size:16px;flex-shrink:0;">' + ZT.escape((x.name || 'U').charAt(0).toUpperCase()) + '</div>';
    html += '<div style="flex:1;min-width:0;">';
    html += '<div style="font-size:13px;font-weight:800;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + ZT.escape(x.name) + '</div>';
    html += '<div style="font-size:9px;color:' + roleColor + ';font-weight:900;letter-spacing:.5px;">' + roleLabel + '</div>';
    html += '</div>';

    if(isTutor && !x.isLocal && !isHost){
      if(x.isSpeaker){
        html += '<button onclick="ZT.demoteSpeaker(\'' + ZT.escape(x.identity) + '\')" title="Demote to listener" style="background:rgba(161,98,98,.15);border:1px solid rgba(161,98,98,.4);color:#c9a5a5;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:11px;margin-right:4px;"><i class="fa-solid fa-microphone-slash"></i></button>';
      } else {
        html += '<button onclick="ZT.promoteSpeaker(\'' + ZT.escape(x.identity) + '\')" title="Promote to speaker" style="background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.45);color:#10b981;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:11px;margin-right:4px;"><i class="fa-solid fa-microphone"></i></button>';
      }
      html += '<button onclick="ZT.kickParticipant(\'' + ZT.escape(x.identity) + '\')" title="Remove" style="background:rgba(161,98,98,.15);border:1px solid rgba(161,98,98,.4);color:#c9a5a5;width:32px;height:32px;border-radius:8px;cursor:pointer;font-size:11px;"><i class="fa-solid fa-user-xmark"></i></button>';
    }
    html += '</div>';
  });

  ZT.Modal.open({ title:'Participants', icon:'fa-solid fa-users', body:html, footer:false });
};

ZT.promoteSpeaker = async function(identity){
  if(!ZT._lk.room || !ZT._lk.isTutor) return;
  try {
    ZT._lk.speakers[identity] = true;
    await ZT._lk.room.localParticipant.publishData(
      new TextEncoder().encode('__PROMOTE_ME__'),
      { destinationIdentities: [identity] }
    );
    ZT.toast('Promoted to speaker.');
    ZT.Modal.close();
    setTimeout(ZT.showParticipantsPanel, 200);
  } catch(e){ ZT.toast('Failed.', 'error'); }
};

ZT.demoteSpeaker = async function(identity){
  if(!ZT._lk.room || !ZT._lk.isTutor) return;
  try {
    ZT._lk.speakers[identity] = false;
    await ZT._lk.room.localParticipant.publishData(
      new TextEncoder().encode('__DEMOTED__'),
      { destinationIdentities: [identity] }
    );
    ZT.toast('Demoted to listener.');
    ZT.Modal.close();
    setTimeout(ZT.showParticipantsPanel, 200);
  } catch(e){ ZT.toast('Failed.', 'error'); }
};

ZT.kickParticipant = async function(identity){
  if(!ZT._lk.room || !ZT._lk.isTutor) return;
  if(!confirm('Remove this participant from the class?')) return;
  try {
    await ZT._lk.room.localParticipant.publishData(
      new TextEncoder().encode('__KICKED__'),
      { destinationIdentities: [identity] }
    );
    ZT.toast('Removed.');
    ZT.Modal.close();
  } catch(e){ ZT.toast('Failed.', 'error'); }
};

/* ============================================================
   RAISED HAND QUEUE (Tutor-side)
   ============================================================ */
ZT.paintRaisedHandBadge = function(){
  var badge = document.getElementById('zt-hands-badge');
  if(!badge) return;
  var count = (ZT._lk.raisedHands || []).length;
  if(count > 0){
    badge.style.display = 'inline-block';
    badge.textContent = count;
  } else {
    badge.style.display = 'none';
  }
};

ZT.showRaisedHands = function(){
  if(!ZT._lk.isTutor) return;
  var list = ZT._lk.raisedHands || [];
  var html = '';

  if(!list.length){
    html = '<div style="text-align:center;color:#64748b;padding:20px;font-size:12px;">No raised hands yet.</div>';
  } else {
    list.forEach(function(h){
      html += '<div style="display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #1e293b;">';
      html += '<div style="width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#10b981,#3b82f6);display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;font-size:15px;">' + ZT.escape((h.name || 'U').charAt(0).toUpperCase()) + '</div>';
      html += '<div style="flex:1;min-width:0;">';
      html += '<div style="font-size:13px;font-weight:800;color:#fff;">' + ZT.escape(h.name || 'User') + '</div>';
      html += '<div style="font-size:10px;color:#94a3b8;">🙋 raised ' + ZT.timeAgo(h.at) + '</div>';
      html += '</div>';
      html += '<button onclick="ZT.allowSpeak(\'' + ZT.escape(h.identity) + '\')" style="background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.45);color:#10b981;padding:6px 10px;border-radius:8px;font-size:10px;font-weight:900;cursor:pointer;margin-right:4px;">Allow</button>';
      html += '<button onclick="ZT.dismissHand(\'' + ZT.escape(h.identity) + '\')" style="background:rgba(161,98,98,.15);border:1px solid rgba(161,98,98,.4);color:#c9a5a5;padding:6px 10px;border-radius:8px;font-size:10px;font-weight:900;cursor:pointer;">Dismiss</button>';
      html += '</div>';
    });
  }

  ZT.Modal.open({ title:'Raised Hands (' + list.length + ')', icon:'fa-solid fa-hand', body:html, footer:false });
};

ZT.allowSpeak = async function(identity){
  if(!ZT._lk.room || !ZT._lk.isTutor) return;
  try {
    ZT._lk.speakers[identity] = true;
    await ZT._lk.room.localParticipant.publishData(
      new TextEncoder().encode('__PROMOTE_ME__'),
      { destinationIdentities: [identity] }
    );
    var rec = (ZT._lk.raisedHands || []).find(function(x){ return x.identity === identity; });
    if(rec){
      if(!ZT._lk.handLog) ZT._lk.handLog = [];
      ZT._lk.handLog.push({ name: rec.name, identity: identity, action: 'allowed', at: Date.now() });
    }
    ZT._lk.raisedHands = (ZT._lk.raisedHands || []).filter(function(x){ return x.identity !== identity; });
    ZT.paintRaisedHandBadge();
    ZT.toast('Promoted. They can now unmute themselves.');
    ZT.Modal.close();
  } catch(e){ console.warn('[promote]', e); ZT.toast('Failed.', 'error'); }
};

ZT.dismissHand = async function(identity){
  if(!ZT._lk.room || !ZT._lk.isTutor) return;
  try {
    await ZT._lk.room.localParticipant.publishData(
      new TextEncoder().encode('__DISMISS_HAND__'),
      { destinationIdentities: [identity] }
    );
    var rec = (ZT._lk.raisedHands || []).find(function(x){ return x.identity === identity; });
    if(rec){
      if(!ZT._lk.handLog) ZT._lk.handLog = [];
      ZT._lk.handLog.push({ name: rec.name, identity: identity, action: 'dismissed', at: Date.now() });
    }
    ZT._lk.raisedHands = (ZT._lk.raisedHands || []).filter(function(x){ return x.identity !== identity; });
    ZT.paintRaisedHandBadge();
    ZT.toast('Dismissed.');
    ZT.Modal.close();
  } catch(e){ ZT.toast('Failed.', 'error'); }
};

})();
</script>
</body>
</html>

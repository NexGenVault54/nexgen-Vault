<!DOCTYPE html>
<html lang="en" class="dark">
<!--
  ════════════════════════════════════════════════════════════
  DEVELOPER TERMINOLOGY NOTE — ZYNIX CIRCLES
  ════════════════════════════════════════════════════════════
  Historically this file used "Tutor" and "Student". Those words
  are DEPRECATED in the user-facing product. The platform now
  uses "Owner" and "Member" for all display purposes.

  • "tutor" in code/tables/functions = Owner in the product
  • "student" in code/tables/functions = Member in the product
  • "tutor_circles", "tutor_members", etc. = internal names only,
    do NOT rename (they carry production data).
  • "TSF" / "SPF" are OBSOLETE. New terms: GAF (Global Owner Fund)
    and GMF (Global Member Fund).

  When editing, ONLY change words that appear on screen.
  Internal identifiers stay untouched to preserve stability.
  ════════════════════════════════════════════════════════════
-->
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ZYNIX Circles</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#090d16;color:#f8fafc;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding-bottom:80px;overflow-x:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select,.zt-post-content,.zt-post-banner-content,.zt-comment,.zt-msg,.zt-circle-banner-desc{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
button,a,input,textarea,select,[onclick]{touch-action:manipulation}
.zt-hbtn,.zt-footer button,.zt-sidebar button,.zt-hamburger{-webkit-user-select:none;user-select:none}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:#090d16}
::-webkit-scrollbar-thumb{background:#1e293b;border-radius:4px}
.zt-header{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(9,13,22,.92);backdrop-filter:blur(12px);border-bottom:1px solid #1e293b;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;min-height:56px;max-width:600px;margin:0 auto;gap:8px}
.zt-logo{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#10b981,#3b82f6);display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;font-size:14px}
.zt-title{font-size:15px;font-weight:900;background:linear-gradient(90deg,#10b981,#3b82f6,#10b981);-webkit-background-clip:text;background-clip:text;color:transparent}
.zt-hbtn{background:rgba(30,41,59,.7);border:1px solid #1e293b;color:#cbd5e1;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;justify-content:center;transition:all .2s;position:relative}
.zt-hbtn:hover{border-color:#10b981;color:#6ee7b7}
.zt-hbtn.active{border-color:#10b981;color:#10b981}
.zt-wallet-pill{background:rgba(15,23,42,.9);border:1px solid #1e293b;border-radius:20px;padding:4px 10px;font-size:10px;display:inline-flex;align-items:center;gap:5px;cursor:pointer;color:#cbd5e1;transition:border-color .2s;text-decoration:none;font-weight:700}
.zt-wallet-pill:hover{border-color:#10b981}
.zt-wallet-pill .amt{color:#10b981}
.zt-wallet-pill .amt-b{color:#3b82f6}
.zt-badge-dot{position:absolute;top:0;right:0;min-width:14px;height:14px;border-radius:8px;background:#ef4444;color:#fff;font-size:8px;font-weight:900;padding:0 3px;display:none;align-items:center;justify-content:center;border:2px solid #090d16}
.zt-hbtn.active{border-color:#10b981;color:#10b981}
.zt-wallet-pill{background:rgba(15,23,42,.9);border:1px solid #1e293b;border-radius:20px;padding:4px 10px;font-size:10px;display:inline-flex;align-items:center;gap:6px;cursor:pointer;color:#cbd5e1;transition:border-color .2s}
.zt-wallet-pill:hover{border-color:#10b981}
.zt-wallet-pill .amt{color:#10b981;font-weight:700}
.zt-avatar-btn{width:28px;height:28px;border-radius:50%;object-fit:cover;border:1px solid rgba(16,185,129,.5);cursor:pointer}
.zt-header-left{display:flex;align-items:center;gap:8px;background:transparent;border:none;cursor:pointer;padding:0}
.zt-header-right{display:flex;align-items:center;gap:8px}

/* ============================================================
   RESPONSIVE LAYOUT
   - Mobile (<=640px): App look, centered 600px
   - Tablet (641-1024px): Full width
   - Desktop (>=1025px): Full width
   ============================================================ */

/* Hamburger (tablet/laptop/desktop) */
.zt-hamburger{display:none;position:fixed;top:68px;left:16px;z-index:1100;width:44px;height:44px;border-radius:12px;background:rgba(15,23,42,.95);border:1px solid #1e293b;color:#10b981;cursor:pointer;font-size:18px;align-items:center;justify-content:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 4px 12px rgba(0,0,0,.3);transition:all .15s}
.zt-hamburger:hover{border-color:#10b981;background:rgba(16,185,129,.1)}
.zt-hamburger:active{transform:scale(.94)}

.zt-hamburger-drawer{display:none;position:fixed;top:56px;left:0;bottom:0;width:260px;z-index:1200;background:#0f172a;border-right:1px solid #1e293b;transform:translateX(-100%);transition:transform .25s ease;overflow-y:auto;padding-top:20px}
.zt-hamburger-drawer.open{transform:translateX(0)}
.zt-hamburger-drawer button{display:flex;align-items:center;gap:14px;width:100%;padding:15px 24px;background:transparent;border:none;color:#cbd5e1;font-size:14px;font-weight:800;cursor:pointer;text-align:left;border-left:3px solid transparent;transition:all .15s}
.zt-hamburger-drawer button:hover{background:rgba(16,185,129,.06);color:#10b981}
.zt-hamburger-drawer button.active{background:rgba(16,185,129,.10);color:#10b981;border-left-color:#10b981}
.zt-hamburger-drawer button i{width:20px;text-align:center;font-size:16px}

.zt-hamburger-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1150;opacity:0;pointer-events:none;transition:opacity .25s ease}
.zt-hamburger-overlay.open{opacity:1;pointer-events:auto}

/* Mobile overflow dropdown (3-dot) */
.zt-room-overflow{position:fixed;z-index:10000;background:#111827;border:1px solid #1e293b;border-radius:12px;padding:6px;min-width:150px;box-shadow:0 10px 30px rgba(0,0,0,.55)}
.zt-room-overflow button{width:100%;text-align:left;background:transparent;border:none;padding:12px 14px;color:#cbd5e1;font-size:13px;font-weight:800;cursor:pointer;border-radius:8px;display:flex;align-items:center;gap:10px;transition:background .15s}
.zt-room-overflow button:hover{background:rgba(16,185,129,.1);color:#10b981}

@media (max-width:640px){
  #zt-app{padding:76px 14px 100px;max-width:600px;margin:0 auto}
  body:not(.zt-in-circle) #zt-app{padding-bottom:24px}
  .zt-hamburger{display:none !important}
  .zt-hamburger-drawer{display:none !important}
  .zt-hamburger-overlay{display:none !important}
  .zt-room-nav-side{display:none !important}
  body.zt-in-circle .zt-room-nav-bottom{display:flex}
}

@media (min-width:641px){
  .zt-header{max-width:100% !important;margin:0}
  .zt-hamburger{display:none !important}
  .zt-hamburger-drawer{display:none !important}
  .zt-hamburger-overlay{display:none !important}
  .zt-room-nav-bottom{display:none !important}
  body.zt-in-circle .zt-room-nav-side{display:flex}
}

@media (min-width:641px) and (max-width:1024px){
  #zt-app{padding:76px 20px 24px 80px;max-width:100%;margin:0}
}

@media (min-width:1025px){
  #zt-app{padding:76px 40px 24px 80px;max-width:100%;margin:0}
}

#zt-app{min-height:calc(100vh - 80px)}
#zt-welcome{position:fixed;inset:0;z-index:20000;background:#090d16;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;opacity:1;transition:opacity .28s ease}
#zt-welcome.fadeout{opacity:0;pointer-events:none}
.zt-wl{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,#10b981,#3b82f6);display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;font-size:38px;box-shadow:0 10px 40px rgba(16,185,129,.35)}
.zt-ww{margin-top:20px;font-size:26px;font-weight:900;letter-spacing:3px;background:linear-gradient(90deg,#10b981,#3b82f6,#10b981);-webkit-background-clip:text;background-clip:text;color:transparent}
.zt-wt{margin-top:8px;font-size:11px;font-weight:600;letter-spacing:3px;color:#64748b;text-transform:uppercase}
.zt-card{background:#111827;border:1px solid #1e293b;border-radius:16px;padding:16px;margin-bottom:12px}
.zt-st{font-size:11px;font-weight:900;color:#94a3b8;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px;padding:0 4px}
.zt-btn{background:linear-gradient(135deg,#10b981,#3b82f6);border:none;color:#000;font-weight:900;padding:13px 20px;border-radius:10px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%}
.zt-btn:active{opacity:.85}
.zt-btn:disabled{opacity:.5;cursor:not-allowed}
.zt-btn.secondary{background:rgba(30,41,59,.9);border:1px solid #334155;color:#cbd5e1;font-weight:800}
.zt-btn.danger{background:rgba(161,98,98,.15);border:1px solid rgba(161,98,98,.5);color:#c9a5a5}
.zt-btn.small{padding:9px 16px;font-size:11px;width:auto}
.zt-input,.zt-textarea,.zt-select{width:100%;background:#0f172a;border:1px solid #1e293b;border-radius:10px;padding:12px;font-size:13px;color:#fff;outline:none;font-family:inherit;transition:border-color .2s;box-sizing:border-box}
.zt-input:focus,.zt-textarea:focus,.zt-select:focus{border-color:#10b981}
.zt-textarea{min-height:90px;resize:vertical}
.zt-label{display:block;font-size:11px;font-weight:800;color:#94a3b8;margin-bottom:5px}
.zt-field{margin-bottom:14px}
.zt-landing-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.zt-back-btn{background:rgba(16,185,129,.10);border:1px solid rgba(16,185,129,.4);color:#6ee7b7;border-radius:10px;padding:8px 14px;font-size:11px;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.zt-back-btn:hover{background:rgba(16,185,129,.20);border-color:#10b981}
.zt-landing-title{font-size:20px;font-weight:900;color:#fff}
.zt-landing-sub{font-size:11.5px;color:#94a3b8;margin-top:2px}
.zt-search{position:relative;margin-bottom:16px}
.zt-search input{width:100%;background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:12px 42px 12px 14px;color:#fff;font-size:13px;outline:none;box-sizing:border-box}
.zt-search input:focus{border-color:#10b981}
.zt-search i{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#64748b;font-size:13px;pointer-events:none}
.zt-lcm-tabs{display:flex;gap:6px;padding:4px;background:#0f172a;border:1px solid #1e293b;border-radius:12px;margin-bottom:14px}
.zt-lcm-tab{flex:1;padding:11px 6px;border-radius:9px;border:none;background:transparent;color:#94a3b8;font-weight:900;font-size:11.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:all .18s}
.zt-lcm-tab:hover{color:#cbd5e1}
.zt-lcm-tab.active[data-type="learn"]{background:rgba(16,185,129,.15);color:#10b981}
.zt-lcm-tab.active[data-type="connect"]{background:rgba(59,130,246,.15);color:#3b82f6}
.zt-lcm-tab.active[data-type="meet"]{background:rgba(240,201,117,.15);color:#f0c975}

/* ─── ROOM NAV — Bottom bar (mobile) + Left column (tablet/desktop) ─── */
.zt-room-nav-bottom{display:none;position:fixed;bottom:0;left:0;right:0;z-index:900;background:transparent;padding:14px 4px calc(14px + env(safe-area-inset-bottom,0px));justify-content:space-around;align-items:center;max-width:600px;margin:0 auto;pointer-events:none}
body.zt-in-circle .zt-room-nav-bottom{display:flex}
.zt-room-nav-bottom .zt-room-nav-item{pointer-events:auto}
.zt-room-nav-item{flex:1;background:transparent;border:none;color:#64748b;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:8px 4px;transition:color .15s;position:relative}
.zt-room-nav-item span{display:none}
.zt-room-nav-item i{font-size:22px}
.zt-room-nav-item:hover{color:#cbd5e1}
.zt-room-nav-item.active{color:#10b981;filter:drop-shadow(0 0 8px rgba(16,185,129,.45))}

.zt-room-nav-side{display:none;position:fixed;top:56px;left:0;bottom:0;width:64px;z-index:900;background:transparent;flex-direction:column;align-items:center;padding:20px 0;gap:8px;pointer-events:none}
body.zt-in-circle .zt-room-nav-side{display:flex}
.zt-room-nav-side .zt-room-nav-item{width:48px;height:48px;flex:none;padding:0;pointer-events:auto}
.zt-room-nav-side .zt-room-nav-item i{font-size:19px}
.zt-cta-create{width:100%;padding:16px;border-radius:16px;background:linear-gradient(135deg,rgba(16,185,129,.18),rgba(16,185,129,.12));border:1px solid rgba(16,185,129,.45);display:flex;align-items:center;gap:14px;cursor:pointer;margin-bottom:18px;text-align:left}
.zt-cta-create .ico{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#10b981,#3b82f6);display:flex;align-items:center;justify-content:center;color:#000;font-size:22px;flex-shrink:0}
.zt-cta-create .ttl{font-size:15px;font-weight:900;color:#fff}
.zt-cta-create .sub{font-size:11.5px;color:#cbd5e1;margin-top:3px;line-height:1.5}
.zt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.zt-circle-card{background:#111827;border:1px solid #1e293b;border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column;position:relative}
.zt-circle-card:hover{border-color:rgba(16,185,129,.55)}
.zt-circle-banner{min-height:130px;position:relative;overflow:hidden;padding:16px 14px;display:flex;flex-direction:column;justify-content:center;border-radius:14px 14px 0 0}
.zt-circle-banner-title{font-size:15px;font-weight:900;color:#fff;line-height:1.3;text-shadow:0 2px 8px rgba(0,0,0,.55);word-break:break-word;text-align:center}
.zt-circle-banner-desc{font-size:11px;color:rgba(255,255,255,.88);line-height:1.5;margin-top:6px;text-shadow:0 1px 6px rgba(0,0,0,.5);word-break:break-word;text-align:center;display:-webkit-box;-webkit-line-clamp:3;line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}

.zt-circle-body{padding:30px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.zt-circle-name{font-size:13px;font-weight:900;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;line-height:1.2}
.zt-circle-meta{font-size:10px;color:#94a3b8;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.zt-circle-meta span{display:inline-flex;align-items:center;gap:3px}
.zt-circle-action{margin-top:auto;padding:7px 12px;border-radius:9px;background:linear-gradient(135deg,#10b981,#3b82f6);color:#000;font-weight:900;font-size:11px;text-align:center}
.zt-circle-action.enter{background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.45);color:#10b981}
.zt-circle-action.owner{background:rgba(161,133,84,.14);border:1px solid rgba(161,133,84,.45);color:#a18554}
.zt-owner-badge{position:absolute;top:8px;right:8px;font-size:8.5px;font-weight:900;padding:2px 7px;border-radius:8px;background:rgba(0,0,0,.65);color:#a18554;border:1px solid rgba(161,133,84,.5)}
.zt-circle-head{padding:14px;border-radius:14px;background:linear-gradient(135deg,rgba(16,185,129,.10),rgba(16,185,129,.06));border:1px solid rgba(16,185,129,.35);display:flex;align-items:center;gap:12px;margin-bottom:14px}
.zt-circle-head .av{width:44px;height:44px;border-radius:12px;object-fit:cover;flex-shrink:0;background:#0f172a;border:1px solid rgba(16,185,129,.4)}
.zt-circle-head .nm{font-size:15px;font-weight:900;color:#fff}
.zt-circle-head .sub{font-size:10.5px;color:#94a3b8;margin-top:2px}
.zt-circle-head .back{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.4);color:#6ee7b7;width:36px;height:36px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px}
.zt-post{background:#111827;border:1px solid #1e293b;border-radius:16px;padding:14px;margin-bottom:12px}
.zt-post-author{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.zt-post-author img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:1px solid #1e293b}
.zt-post-author .pname{font-weight:800;font-size:13px;color:#fff;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.zt-post-author .phandle{font-size:10px;color:#64748b;margin-top:1px}
.zt-badge-author{font-size:8.5px;font-weight:900;padding:2px 7px;border-radius:10px;background:linear-gradient(135deg,#10b981,#3b82f6);color:#000}
.zt-badge-pinned{font-size:8.5px;font-weight:900;padding:2px 7px;border-radius:10px;background:rgba(161,133,84,.15);color:#a18554;border:1px solid rgba(161,133,84,.4)}
.zt-post-content{font-size:13.5px;color:#e2e8f0;line-height:1.7;margin-bottom:10px;white-space:pre-wrap;word-break:break-word;padding:12px 16px;border-radius:10px;background:rgba(15,23,42,.35);box-sizing:border-box;}
.zt-post-content.folded{max-height:130px;overflow:hidden;position:relative}
.zt-post-content.folded::after{content:'';position:absolute;bottom:0;left:0;right:0;height:50px;background:linear-gradient(to bottom,rgba(17,24,39,0),rgba(17,24,39,1));pointer-events:none}
.zt-see-more{background:transparent;border:none;color:#6ee7b7;font-size:12px;font-weight:800;cursor:pointer;padding:4px 0;margin-bottom:8px;display:inline-block}
.zt-post-banner-content{position:relative;overflow:hidden}
.zt-post-banner-content::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 30% 20%, rgba(255,255,255,.08), transparent 60%);pointer-events:none}
.zt-post-banner .zt-post-reactions,.zt-post-banner .zt-post-actions{background:rgba(0,0,0,.22);border-radius:10px;padding:6px 10px;margin-top:8px;border-top:none}
.zt-post-banner .zt-post-actions button{color:rgba(255,255,255,.9)}

.zt-post-media{border-radius:12px;overflow:hidden;margin-bottom:10px;background:#000}
.zt-post-media img,.zt-post-media video{width:100%;height:auto;max-height:400px;object-fit:contain;display:block;background:#000}
@media (min-width:641px){
  .zt-post-media img,.zt-post-media video{max-height:75vh}
}
.zt-post-reactions{display:flex;flex-wrap:wrap;gap:4px;padding:8px 0;border-top:1px solid #1e293b;align-items:center}
.zt-react-btn{padding:4px 8px;border-radius:14px;font-size:14px;background:transparent;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:3px;color:#fff}
.zt-react-btn:hover{background:#1e293b}
.zt-react-btn.active{background:rgba(16,185,129,.15);border-color:rgba(16,185,129,.3)}
.zt-react-btn .count{font-size:10px;color:#64748b;font-weight:700}
.zt-react-btn.active .count{color:#10b981}
.zt-post-actions{display:flex;gap:16px;padding-top:8px;border-top:1px solid #1e293b;font-size:12px;color:#64748b;flex-wrap:wrap}
.zt-post-actions button{background:transparent;border:none;color:#64748b;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:5px;font-weight:700}
.zt-post-actions button:hover{color:#e2e8f0}
.zt-comments{margin-top:10px;padding-top:10px;border-top:1px solid #1e293b;display:none}
.zt-comments.open{display:block}
.zt-comment{padding:10px 12px;border-radius:12px;margin-bottom:6px;font-size:12px;word-break:break-word}
.zt-comment:nth-of-type(5n+1){background:#dcfce7;color:#052e16}
.zt-comment:nth-of-type(5n+2){background:#dbeafe;color:#172554}
.zt-comment:nth-of-type(5n+3){background:#fef3c7;color:#451a03}
.zt-comment:nth-of-type(5n+4){background:#fce7f3;color:#500724}
.zt-comment:nth-of-type(5n+5){background:#ede9fe;color:#2e1065}
.zt-comment .cname{font-weight:700;margin-right:6px;opacity:.9;cursor:pointer}
.zt-comment-input{display:flex;gap:8px;margin-top:8px;align-items:flex-end}

    pres = await fetch('/api/r2-presign', {
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer ' + session.access_token},
      body: JSON.stringify({ action:'put', path:path, contentType:file.type||'' })
    });

    throw new Error('Upload server unreachable — check network or /api/r2-presign endpoint.');
  }
  if(!pres.ok){

    try { errTxt = await pres.text(); } catch(e){}
    console.error('[r2-presign ' + pres.status + ']', errTxt);
    throw new Error('Presign failed (' + pres.status + ') — endpoint /api/r2-presign may be missing on server.');
  }
  var pd;
  try { pd = await pres.json(); } catch(e){ throw new Error('Presign response invalid JSON.'); }
  if(!pd || !pd.url) throw new Error('No upload URL returned from server.');
  var put;
  try {
    put = await fetch(pd.url, {
      method:'PUT', body: file,
      headers: {'Content-Type': pd.contentType || file.type || 'application/octet-stream'}
    });
  } catch(e){
    console.error('[r2 PUT network]', e);
    throw new Error('Upload to storage failed — check CORS on R2 bucket.');
  }
  if(!put.ok){
    throw new Error('R2 upload failed (' + put.status + ').');
  }
  return ZT.R2_PUBLIC_BASE + '/' + path;
};

/* ────────────────────────────────────────────────────────────
   NAVIGATION — navStack tracking + ZT.goBack (universal)
   Wraps showView to push previous state on every nav.
   Every back button in the app uses ZT.goBack() — this
   makes them all work: feed banner, owner profile, member
   profile, dashboard sub-pages, analytics, wallet, etc.
   ──────────────────────────────────────────────────────────── */
ZT.State.navStack = ZT.State.navStack || [];
(function(){
  var _origShowView = ZT.showView;
  var _goingBack = false;
  ZT.showView = function(view, param){
    var prevView  = ZT.State.currentView;
    var prevParam = ZT.State.currentParam;
    if(!_goingBack && prevView && prevView !== view){
      ZT.State.navStack.push({ view: prevView, param: prevParam });
      if(ZT.State.navStack.length > 40) ZT.State.navStack.shift();
    }
    _goingBack = false;
    return _origShowView.apply(this, arguments);
  };
  ZT._markGoingBack = function(){ _goingBack = true; };
})();

ZT.goBack = function(){
  var current = ZT.State.currentView;
  var stack = ZT.State.navStack || [];
  var target = null;
  while(stack.length){
    var top = stack.pop();
    if(top && top.view !== current){ target = top; break; }
  }
  if(!target){
    target = { view: 'feed', param: null };
  }
  ZT.State.navStack = stack;
  if(ZT._markGoingBack) ZT._markGoingBack();
  ZT.showView(target.view, target.param);
};

ZT.renderView = async function(view){
  if(view === 'feed')          return ZT.State.currentCircle ? await ZT.renderCircleFeed() : await ZT.renderLanding();
  if(view === 'chat')          return ZT.State.currentCircle ? await ZT.renderChat() : ZT.renderNoCircleMessage('Chat');
  if(view === 'live')          return ZT.State.currentCircle ? ZT.renderLive() : ZT.renderNoCircleMessage('Live');
  if(view === 'slides')        return ZT.State.currentCircle ? await ZT.renderSlidesList() : ZT.renderNoCircleMessage('Slides');
  if(view === 'dashboard' || view === 'more') return ZT.renderCircleDashboard();
  if(view === 'member-profile')                return await ZT.renderMemberProfile();
  if(view === 'circle-owner-profile')          return await ZT.renderOwnerAboutPage();
  if(view === 'circle-about')                  return await ZT.renderCircleAboutPage();
  if(view === 'owner-about')                   return await ZT.renderOwnerAboutPage();
  if(view === 'gaf-gmf-guide') return ZT.renderGAFGMFGuide();
  if(view === 'leaderboard')   return await ZT.renderLeaderboard();
  if(view === 'members')       return ZT.renderMembersPage();
  return await ZT.renderLanding();
};

ZT._renderConnectPost = function(p){
  var avatarUrl = 'https://ui-avatars.com/api/?name=' + encodeURIComponent(p.name) + '&background=111827&color=34d399';
  var myRx = (ZT.State.connectMyReactions && ZT.State.connectMyReactions[p.id]) || {};
  var BOUNTIES = { love:0.05, flower:0.04, spark:0.03, clap:0.02, star:0.01, dislike:0 };
  var SYMBOLS = { love:'❤️', flower:'🌹', spark:'🔥', clap:'👏', star:'⭐', dislike:'👎' };

  var h = '';
  h += '<div class="zt-post" data-post-id="' + p.id + '">';
  h += '<div class="zt-post-author">';
  h += '<img src="' + avatarUrl + '">';
  h += '<div style="flex:1;min-width:0;">';
  h += '<div class="pname">' + ZT.escape(p.name);
  if(p.isOwner) h += ' <span class="zt-badge-author">OWNER</span>';
  if(p.pinned) h += ' <span class="zt-badge-pinned"><i class="fa-solid fa-thumbtack"></i> PINNED</span>';
  h += '</div>';
  h += '<div class="phandle">' + ZT.escape(p.handle) + ' · ' + ZT.escape(p.time) + ' ago</div>';
  h += '</div></div>';

  h += '<div class="zt-post-content">' + ZT.escape(p.content) + '</div>';

  h += '<div class="zt-post-reactions">';
  ZT.ALL_REACTIONS.forEach(function(k){
    var symbol = SYMBOLS[k];
    var bounty = BOUNTIES[k];
    var cnt = p.reactions[k] || 0;
    var active = !!myRx[k];
    var bountyStr = bounty > 0 ? '<span style="font-size:9px;color:#10b981;font-weight:700;margin-left:1px;">$' + bounty.toFixed(2) + '</span>' : '';
    h += '<button class="zt-react-btn ' + (active ? 'active' : '') + '" onclick="ZT._connectToggleReaction(\'' + p.id + '\',\'' + k + '\')">' + symbol + ' <span class="count">' + cnt + '</span> ' + bountyStr + '</button>';
  });
  h += '</div>';

  h += '<div class="zt-post-actions">';
  h += '<button onclick="ZT._connectToggleComments(\'' + p.id + '\')"><i class="fa-regular fa-comment"></i> Comments</button>';
  h += '<button onclick="ZT.toast(\'Share link copied\')"><i class="fa-solid fa-share-nodes"></i> Share</button>';
  h += '</div>';

  h += '<div class="zt-comments" id="zt-connect-comments-' + p.id + '">';
  h += '<div style="text-align:center;color:#64748b;font-size:11.5px;padding:10px;">Comments coming soon</div>';
  h += '</div>';

  h += '</div>';
  return h;
};

ZT._connectToggleReaction = function(postId, key){
  if(!ZT.State.connectMyReactions) ZT.State.connectMyReactions = {};
  if(!ZT.State.connectMyReactions[postId]) ZT.State.connectMyReactions[postId] = {};
  var p = ZT.State.connectPosts.find(function(x){ return x.id === postId; });
  if(!p) return;
  var wasActive = !!ZT.State.connectMyReactions[postId][key];
  if(wasActive){
    ZT.State.connectMyReactions[postId][key] = false;
    p.reactions[key] = Math.max(0, (p.reactions[key]||1) - 1);
  } else {
    ZT.State.connectMyReactions[postId][key] = true;
    p.reactions[key] = (p.reactions[key]||0) + 1;
  }
  ZT.switchRoomTab('feed');
};

ZT._connectSubmitEvent = function(){

  if(!title){ ZT.toast('Title required.', 'error'); return; }
  if(!dateVal){ ZT.toast('Date required.', 'error'); return; }
  var d = new Date(dateVal);
  ZT._initConnectSampleEvents();
  ZT.State.connectEvents.push({
    id: 'ce' + Date.now(),
    day: String(d.getDate()).padStart(2,'0'),
    month: d.toLocaleString('en', {month:'short'}).toUpperCase(),
    title: title,
    meta: d.toLocaleString('en', {weekday:'short', hour:'2-digit', minute:'2-digit'}) + (loc ? (' · ' + loc) : ''),
    going: 1
  });
  ZT.Modal.close();
  ZT.toast('Event created.');
  ZT.switchRoomTab('events');
};

ZT._openRoomOverflow = function(ev){
  if(ev) ev.preventDefault();
  var existing = document.getElementById('zt-room-overflow-menu');
  if(existing){ ZT._closeRoomOverflow(); return; }
  var btn = ev ? ev.currentTarget : null;
  var rect = btn ? btn.getBoundingClientRect() : {bottom: 200, right: window.innerWidth - 16};
  var menu = document.createElement('div');
  menu.id = 'zt-room-overflow-menu';
  menu.className = 'zt-room-overflow';
  menu.style.top = (rect.bottom + 6) + 'px';
  menu.style.right = (window.innerWidth - rect.right) + 'px';
  menu.innerHTML = '<button onclick="ZT.switchRoomTab(\'chat\');ZT._closeRoomOverflow();"><i class="fa-solid fa-comment-dots"></i> Chat</button>';
  document.body.appendChild(menu);
  setTimeout(function(){ document.addEventListener('click', ZT._closeRoomOverflowOnce); }, 10);
};
ZT._closeRoomOverflow = function(){
  var m = document.getElementById('zt-room-overflow-menu');
  if(m) m.remove();
  document.removeEventListener('click', ZT._closeRoomOverflowOnce);
};
ZT._closeRoomOverflowOnce = function(e){
  var m = document.getElementById('zt-room-overflow-menu');
  if(m && !m.contains(e.target)) ZT._closeRoomOverflow();
};
ZT.renderRoomTab = function(key){
  var cir = ZT.State.currentCircle;
  var type = (cir && cir.room_type) || 'learn';
  if(type === 'connect') return ZT.renderConnectTab(key);
  if(type === 'meet') return ZT.renderMeetTab(key);
  if(key === 'feed')      return ZT.renderRoomTabFeed();
  if(key === 'classes')   return ZT.renderRoomTabClasses();
  if(key === 'chat')      return ZT.renderRoomTabChat();
  if(key === 'live')      return ZT.renderRoomTabLive();
  if(key === 'slides')    return ZT.renderRoomTabSlides();
  if(key === 'dashboard') return ZT.renderRoomTabDashboard();
  return '';
};

ZT.reloadCircles = async function(){
  var host = document.getElementById('zt-circles-host');
  if(!host) return;
  var c = sb(); if(!c){ host.innerHTML = '<div class="zt-empty"><p>Not connected.</p></div>'; return; }
  try {
    var r = await c.rpc('tutor_search_circles', { p_query: ZT.State.searchQuery || null, p_limit: 60, p_offset: 0 });
    if(r.error){ host.innerHTML = '<div class="zt-empty"><p>Could not load.</p></div>'; return; }
    var list = r.data || [];
    var _rtype = ZT.State.roomType || 'learn';
    list = list.filter(function(cir){ return (cir.room_type || 'learn') === _rtype; });
    ZT.State.circles = list;
    if(!list.length){
      var q = (ZT.State.searchQuery || '').trim();
      host.innerHTML = '<div class="zt-empty"><i class="fa-solid fa-chalkboard-user"></i><p>' +
        (q ? ('No circles match "' + ZT.escape(q) + '".') : 'No circles yet. Be the first owner to create one.') + '</p>' +
        (ZT.State.currentUser ? '<button class="zt-btn small" style="width:auto;margin:0 auto;" onclick="ZT.openCreateCircle()">Create a Circle</button>' : '') +
        '</div>';
      return;
    }
    var h = '<div class="zt-grid">';
    list.forEach(function(cir){
      var grad = ZT.gradientCss(cir.banner_gradient);

      var label = cir.is_owner ? 'Owner' : (cir.is_member ? 'Enter' : 'Join');
      var cls = cir.is_owner ? 'owner' : (cir.is_member ? 'enter' : '');
      h += '<div class="zt-circle-card" onclick="ZT.enterCircle(\'' + ZT.escape(cir.id) + '\')">';
      if(cir.is_owner) h += '<span class="zt-owner-badge"><i class="fa-solid fa-crown"></i> YOURS</span>';
      /* FULL BANNER — title + description inside */
      h += '<div class="zt-circle-banner" style="background:' + grad + ';">';
      h += '<div class="zt-circle-banner-title">' + ZT.escape(cir.name) + '</div>';
      if(cir.description){
        h += '<div class="zt-circle-banner-desc">' + ZT.escape(cir.description) + '</div>';
      }
      h += '</div>';
      /* Card body — only meta + action button (no avatar, no plain name) */
      h += '<div class="zt-circle-body" style="padding:12px 12px 12px;text-align:center;">';
      h += '<div class="zt-circle-meta" style="justify-content:center;"><span><i class="fa-solid fa-users"></i> ' + (cir.member_count||0) + '</span>';
      h += '<span><i class="fa-regular fa-newspaper"></i> ' + (cir.post_count||0) + '</span></div>';
      h += '<div class="zt-circle-action ' + cls + '" style="margin-top:8px;">' + label + '</div>';
      h += '</div></div>';
    });
    h += '</div>';
    host.innerHTML = h;
  } catch(e){ console.warn(e); host.innerHTML = '<div class="zt-empty"><p>Error.</p></div>'; }
};

ZT._openCreateCircleModal = function(){
  var gradients = ['emerald','ocean','violet','teal','slate','forest','midnight','deep'];
  var gradHtml = '<div class="zt-gradient-pick">';
  gradients.forEach(function(g, i){
    gradHtml += '<div class="zt-gradient-swatch ' + (i === 0 ? 'active' : '') + '" data-grad="' + g + '" style="background:' + ZT.gradientCss(g) + '" onclick="ZT.pickGradient(\'' + g + '\')"></div>';
  });
  gradHtml += '</div>';
  ZT._createGradient = 'emerald';
  ZT.Modal.open({
    title:'Create Circle', icon:'fa-solid fa-plus',
    submitLabel:'Create Circle',
    body:'<div class="zt-field"><label class="zt-label">Circle name *</label><input id="zt-cc-name" class="zt-input" placeholder="e.g. Physics with Sir Ahmed" maxlength="60"></div>' +
      '<div class="zt-field"><label class="zt-label">Subtitle</label><input id="zt-cc-subtitle" class="zt-input" placeholder="e.g. Learn physics the easy way" maxlength="120"></div>' +
      '<div class="zt-field"><label class="zt-label">Description</label><textarea id="zt-cc-desc" class="zt-textarea" placeholder="What will you teach? Who is this for?" maxlength="300" style="min-height:80px;"></textarea></div>' +
      '<div class="zt-field"><label class="zt-label">Banner color</label>' + gradHtml + '</div>',
    onSubmit: async function(){
      var name = (document.getElementById('zt-cc-name').value || '').trim();
      var subtitle = (document.getElementById('zt-cc-subtitle').value || '').trim();
      var desc = (document.getElementById('zt-cc-desc').value || '').trim();
      if(name.length < 2){ ZT.toast('Name required.', 'error'); return false; }
      var c = ZT.sb(); if(!c) return false;
      try {
        var r = await c.rpc('tutor_create_circle', {
          p_name: name, p_description: desc || null,
          p_banner_gradient: ZT._createGradient || 'emerald',
          p_is_public: true
        });
        if(r.error) throw r.error;
        var _rtype = ZT.State.roomType || 'learn';
        try {
          var _upd = { room_type: _rtype };
          if(subtitle) _upd.subtitle = subtitle;
          await c.from('tutor_circles').update(_upd).eq('id', r.data.id);
        } catch(e){ console.warn('post-create update failed', e); }
        ZT.toast('Circle created!');
        ZT.haptic(15);
        await ZT.enterCircle(r.data.id);
        return true;
      } catch(e){ ZT.toast('Failed: ' + ((e&&e.message)||''), 'error'); return false; }
    }
  });
};

/* ============================================================
   TRIAL + CIRCLE LIMIT CHECK
   Returns { allowed: bool, reason: string, max: number, current: number }
   ============================================================ */
ZT.checkCircleLimit = async function(){
  var me = ZT.State.currentUser;
  if(!me) return { allowed: false, reason: 'Not logged in', max: 0, current: 0 };

  var c = ZT.sb();
  if(!c) return { allowed: false, reason: 'Not connected', max: 0, current: 0 };

  /* Count how many circles user owns */
  var current = 0;
  try {
    var r = await c.from('tutor_circles')
      .select('id', { count: 'exact', head: true })
      .eq('owner_id', me.id);
    current = r.count || 0;
  } catch(e){
    return { allowed: false, reason: 'Could not verify', max: 0, current: 0 };
  }

  /* Determine tier / trial status */
  var plan = me.pro_plan || 'free';
  var isBusiness = plan === 'business';
  var isPro = plan === 'pro' || plan === 'elite' || isBusiness;
  var trialEnds = me.trial_ends_at ? new Date(me.trial_ends_at) : null;
  var inTrial = trialEnds && trialEnds > new Date();

  /* Free trial = 15 days after signup if not paid */
  if(!trialEnds && me.created_at){
    var signupMs = new Date(me.created_at).getTime();
    var fifteenDaysMs = 15 * 24 * 60 * 60 * 1000;
    var trialEndsMs = signupMs + fifteenDaysMs;
    if(Date.now() < trialEndsMs){
      inTrial = true;
      trialEnds = new Date(trialEndsMs);
    }
  }

  if(isBusiness){
    return { allowed: true, reason: 'Business unlimited', max: 999, current: current };
  }
  if(isPro){
    return { allowed: true, reason: 'Pro unlimited', max: 999, current: current };
  }
  if(inTrial){
    var trialMax = 2;
    return {
      allowed: current < trialMax,
      reason: current < trialMax ? 'Trial: ' + current + '/' + trialMax : 'Trial limit: 2 Circles max',
      max: trialMax,
      current: current,
      trial: true
    };
  }
  /* Free tier */
  var freeMax = 1;
  return {
    allowed: current < freeMax,
    reason: current < freeMax ? 'Free: ' + current + '/' + freeMax : 'Free tier: 1 Circle max',
    max: freeMax,
    current: current,
    free: true
  };
};

/* Helper: join + set payment state (reactivates if previously removed) */
async function _tutorDoJoin(circleId, status, trialEndsAt){
  var c = sb(); if(!c) return;
  var me = ZT.State.currentUser; if(!me) return;
  try { localStorage.setItem('zynix_tutor_last_circle', circleId); } catch(e){}
  try {
    var existing = await c.from('tutor_members')
      .select('id, is_active')
      .eq('circle_id', circleId).eq('user_id', me.id).maybeSingle();

    /* 'free' mode has no payment_status value in DB — use 'paid' (user owes nothing) */
    var _dbStatus = (status === 'free') ? 'paid' : status;

    if(existing.data){
      var patch = { is_active: true, payment_status: _dbStatus };
      if(trialEndsAt) patch.trial_ends_at = trialEndsAt;
      if(_dbStatus === 'paid'){
        patch.trial_ends_at = null;
        patch.last_payment_at = new Date().toISOString();
        patch.grace_started_at = null;
        patch.removal_reason = null;
        patch.removed_by = null;
      }
      await c.from('tutor_members').update(patch).eq('id', existing.data.id);
    } else {
      var j = await c.rpc('tutor_join_circle', { p_circle_id: circleId });
      if(j.error){
        var m = j.error.message || '';
        if(m.indexOf('circle_full') !== -1) ZT.toast('Circle is full.', 'error');
        else ZT.toast('Could not join.', 'error');
        ZT.Modal.close();
        return;
      }
      var patch2 = { payment_status: _dbStatus };
      if(trialEndsAt) patch2.trial_ends_at = trialEndsAt;
      if(_dbStatus === 'paid') patch2.last_payment_at = new Date().toISOString();
      try {
        await c.from('tutor_members').update(patch2)
          .eq('circle_id', circleId).eq('user_id', me.id);
      } catch(e){}
    }

    /* Refresh wallet */
    try {
      var profR = await c.from('profiles')
        .select('wallet_cash,wallet_bounty')
        .eq('id', me.id).maybeSingle();
      if(profR.data){
        ZT.State.currentUser.wallet_cash = profR.data.wallet_cash;
        ZT.State.currentUser.wallet_bounty = profR.data.wallet_bounty;
      }
    } catch(e){}

    /* Enter circle */
    var cr = await c.from('tutor_circles').select('*').eq('id', circleId).maybeSingle();
    if(cr.data) ZT.State.currentCircle = cr.data;
    var role = await c.rpc('tutor_my_role', { p_circle_id: circleId });
    ZT.State.myRoleInCircle = (!role.error && role.data) ? role.data : 'student';

    ZT.Modal.close();
    ZT.haptic(20);
    if(status === 'trial') ZT.toast('Trial started.');
    else if(status === 'free') ZT.toast('Joined!');
    else ZT.toast('Joined! Payment confirmed.');
    ZT.showView('feed');
  } catch(e){
    ZT.toast('Failed.', 'error');
    ZT.Modal.close();
  }
}

    var html = ZT.renderRoomTab(_tab);
    var rhost = document.getElementById('zt-room-content');

      if(html && typeof html === 'string') rhost.innerHTML = html;
      else if(html && typeof html.then === 'function'){ html.then(function(h2){ if(rhost) rhost.innerHTML = h2; }); }
    }
    ZT._initCurrentRoomTab(_tab);
    ZT._paintRoomNavActive(_tab);

        var btn = document.getElementById('zt-scroll-top');

};

      if(th.error){ console.warn('thread', th.error); ZT.toast('Chat unavailable.', 'error'); return; }

/* ────────────────────────────────────────────────────────────
   Feed banner — load owner rating chip
   ──────────────────────────────────────────────────────────── */
ZT._feedLoadRatingChip = async function(ownerId){
  var cir = ZT.State.currentCircle;
  if(!cir) return;
  var chip = document.getElementById('zt-feed-rating-chip');
  if(!chip) return;
  var c = sb(); if(!c) return;
  try {
    var r = await c.rpc('tutor_get_owner_rating', { p_circle_id: cir.id });
    if(r.error || !r.data || !r.data[0]) return;
    var d = r.data[0];
    var avg = Number(d.avg_score) || 0;
    var cnt = Number(d.rating_count) || 0;
    if(cnt > 0){
      var col = avg >= 8 ? '#10b981' : avg >= 5 ? '#fbbf24' : '#a16262';
      chip.style.borderColor = col + '88';
      chip.style.color = col;
      chip.innerHTML = '<i class="fa-solid fa-star"></i> ' + avg.toFixed(1) +
        ' <span style="opacity:.75;font-weight:700;">· ' + cnt + ' rating' + (cnt === 1 ? '' : 's') + '</span>';
      chip.style.display = 'inline-flex';
    } else {
      chip.classList.add('empty');
      chip.innerHTML = '<i class="fa-regular fa-star"></i> Be the first to rate';
      chip.style.display = 'inline-flex';
    }
  } catch(e){
    console.warn('[feed rating chip]', e);
  }
};


/* ────────────────────────────────────────────────────────────
   Owner ratings bottom-sheet (main index SPACE rating jaisa)
   ──────────────────────────────────────────────────────────── */
ZT.openOwnerRatingsSheet = async function(ownerId){
  var cir = ZT.State.currentCircle;
  if(!cir) return;
  var c = sb(); if(!c) return;

  /* Fetch aggregate */
  var agg = { avg_score:0, rating_count:0, band_top:0, band_high:0, band_mid:0, band_low:0 };
  try {
    var r = await c.rpc('tutor_get_owner_rating', { p_circle_id: cir.id });
    if(!r.error && r.data && r.data[0]) agg = r.data[0];
  } catch(e){}

  var rc = Number(agg.rating_count) || 0;
  var avg = Number(agg.avg_score) || 0;
  var col = avg >= 8 ? '#10b981' : avg >= 5 ? '#fbbf24' : '#a16262';

  var h = '<div class="zt-bsheet-overlay" onclick="if(event.target===this)ZT.closeSheet()">';
  h += '<div class="zt-bsheet" onclick="event.stopPropagation()">';
  h += '<div class="zt-bsheet-handle"></div>';
  h += '<div class="zt-bsheet-header"><h3>Owner Ratings</h3>';
  h += '<button class="zt-bsheet-close" onclick="ZT.closeSheet()"><i class="fa-solid fa-xmark"></i></button></div>';
  h += '<div class="zt-bsheet-body">';

  if(rc === 0){
    h += '<div style="text-align:center;padding:30px 20px;color:#94a3b8;font-size:12px;">No ratings yet.</div>';
  } else {
    /* Big avg */
    h += '<div style="display:flex;align-items:baseline;gap:10px;margin-bottom:14px;">';
    h += '<div style="font-size:36px;font-weight:900;color:' + col + ';">' + avg.toFixed(1) + '</div>';
    h += '<div style="font-size:13px;color:#94a3b8;font-weight:700;">/ 10</div>';
    h += '<div style="margin-left:auto;font-size:11px;color:#64748b;">' + rc + ' rating' + (rc === 1 ? '' : 's') + '</div>';
    h += '</div>';

    /* Bands */
    var tot = Math.max(1, (Number(agg.band_top)||0) + (Number(agg.band_high)||0) + (Number(agg.band_mid)||0) + (Number(agg.band_low)||0));
    function bandRow(key, label, cnt, color){
      var pct = tot > 0 ? Math.round((cnt / tot) * 100) : 0;
      return '<button class="co-band" data-ors-band="' + key + '">' +
        '<div class="co-band-lbl">' + label + '</div>' +
        '<div class="co-band-bar"><div class="co-band-fill" style="width:' + pct + '%;background:' + color + ';"></div></div>' +
        '<div class="co-band-cnt" style="color:' + color + ';">' + cnt + '</div></button>';
    }
    h += bandRow('top',  '9 – 10', Number(agg.band_top)||0,  '#10b981');
    h += bandRow('high', '7 – 8',  Number(agg.band_high)||0, '#a18554');
    h += bandRow('mid',  '4 – 6',  Number(agg.band_mid)||0,  '#a18554');
    h += bandRow('low',  '1 – 3',  Number(agg.band_low)||0,  '#a16262');
    h += '<div id="ors-clear"></div>';
    h += '<div id="ors-list" style="margin-top:14px;padding-top:10px;border-top:1px solid #1e293b;"><div style="text-align:center;color:#64748b;font-size:11.5px;padding:10px 0;">Loading reviews…</div></div>';
  }

  h += '</div></div></div>';
  ZT.openSheet(h);

  if(rc > 0){
    setTimeout(function(){
      ZT._orsLoad(ownerId, null);
      ZT._orsWireBands(ownerId);
    }, 40);
  }
};

ZT._orsLoad = async function(ownerId, band){
  var cir = ZT.State.currentCircle;
  if(!cir) return;
  var c = sb(); if(!c) return;
  var host = document.getElementById('ors-list');
  if(!host) return;
  try {
    var r = await c.rpc('tutor_list_owner_ratings', {
      p_circle_id: cir.id,
      p_band: band || null,
      p_limit: 50,
      p_offset: 0
    });
    var rows = r.data || [];
    if(!rows.length){
      host.innerHTML = '<div style="text-align:center;color:#64748b;font-size:11.5px;padding:10px 0;">' +
        (band ? 'No reviews in this band.' : 'No reviews yet.') + '</div>';
      return;
    }
    var h = '';
    rows.forEach(function(x){
      var rating = Number(x.rating) || 0;
      var color = rating >= 8 ? '#10b981' : rating >= 4 ? '#a18554' : '#a16262';
      h += '<div class="co-review">';
      h += '<div class="co-review-head">';
      h += '<span class="co-review-score" style="background:' + color + '22;color:' + color + ';">';
      h += '<i class="fa-solid fa-star" style="font-size:10px;"></i> ' + rating + ' / 10</span>';
      h += '<span class="co-review-time">' + ZT.timeAgo(new Date(x.created_at).getTime()) + '</span>';
      h += '</div>';
      if(x.comment) h += '<div class="co-review-cmt">"' + ZT.escape(x.comment) + '"</div>';
      h += '</div>';
    });
    h += '<div style="text-align:center;padding:10px 0;font-size:10px;color:#64748b;line-height:1.5;">All ratings are anonymous.</div>';
    host.innerHTML = h;
  } catch(e){
    host.innerHTML = '<div style="text-align:center;color:#64748b;font-size:11.5px;padding:10px 0;">Could not load.</div>';
  }
};

ZT._orsWireBands = function(ownerId){
  var bands = document.querySelectorAll('[data-ors-band]');
  bands.forEach(function(b){
    if(b._orsHooked) return; b._orsHooked = true;
    b.addEventListener('click', function(){
      var key = this.getAttribute('data-ors-band');
      var isActive = this.getAttribute('data-active') === '1';
      bands.forEach(function(x){ x.removeAttribute('data-active'); });
      var newBand = isActive ? null : key;
      if(newBand) this.setAttribute('data-active','1');
      var clearHost = document.getElementById('ors-clear');
      if(clearHost){
        if(newBand){
          var lbl = newBand === 'top' ? '9 – 10' : newBand === 'high' ? '7 – 8' : newBand === 'mid' ? '4 – 6' : '1 – 3';
          clearHost.innerHTML = '<button id="ors-clear-btn" style="width:100%;padding:8px;border-radius:8px;border:1px solid #1e293b;background:#0f172a;color:#94a3b8;font-weight:800;font-size:11px;cursor:pointer;margin-top:8px;">Showing ' + lbl + ' only · Clear filter</button>';
          setTimeout(function(){
            var cb = document.getElementById('ors-clear-btn');
            if(cb) cb.addEventListener('click', function(){
              bands.forEach(function(x){ x.removeAttribute('data-active'); });
              clearHost.innerHTML = '';
              ZT._orsLoad(ownerId, null);
            });
          }, 20);
        } else {
          clearHost.innerHTML = '';
        }
      }
      ZT._orsLoad(ownerId, newBand);
    });
  });
};

/* ============================================================
   Trial / Pending banner painter (D2)
   Free circles: never shows. Owner: never shows.
   ============================================================ */
ZT._paintTrialBanner = function(){
  var host = document.getElementById('zt-trial-banner-host');
  if(!host) return;
  var cir = ZT.State.currentCircle;
  var mem = ZT.State.memberRow;
  if(!cir || !mem){ host.innerHTML = ''; return; }
  if(cir.payment_mode === 'free'){ host.innerHTML = ''; return; }
  if(mem.payment_status === 'paid'){ host.innerHTML = ''; return; }

  var joinFee = Number(cir.join_fee) || 4.00;
  var h = '';

  if(mem.payment_status === 'trial' && mem.trial_ends_at){
    var msLeft = new Date(mem.trial_ends_at).getTime() - Date.now();
    if(msLeft > 0){
      var col = '#10b981';
      var msg = 'Trial active';
      h += '<div id="zt-trial-banner" style="padding:12px 14px;border-radius:12px;background:' + col + '18;border:1px solid ' + col + '55;margin-bottom:12px;display:flex;align-items:center;gap:10px;">';
      h += '<i class="fa-solid fa-hourglass-half" style="color:' + col + ';font-size:16px;"></i>';
      h += '<div style="flex:1;min-width:0;">';
      h += '<div style="font-size:12.5px;font-weight:900;color:' + col + ';">' + msg + '</div>';
      h += '</div>';
      h += '<button onclick="ZT._payAfterTrial(\'' + ZT.escape(cir.id) + '\')" style="padding:8px 14px;border-radius:10px;border:none;background:linear-gradient(135deg,#10b981,#3b82f6);color:#000;font-weight:900;font-size:11.5px;cursor:pointer;flex-shrink:0;">Pay Now</button>';
      h += '</div>';
    } else {
      /* Trial ended but still marked trial (cron hasn't run yet) */
      h += '<div id="zt-trial-banner" style="padding:12px 14px;border-radius:12px;background:rgba(161,98,98,.10);border:1px solid rgba(161,98,98,.45);margin-bottom:12px;display:flex;align-items:center;gap:10px;">';
      h += '<i class="fa-solid fa-triangle-exclamation" style="color:#a16262;font-size:16px;"></i>';
      h += '<div style="flex:1;min-width:0;">';
      h += '<div style="font-size:12.5px;font-weight:900;color:#a16262;">Trial ended · Pay now or access ends</div>';
      h += '<div style="font-size:10.5px;color:#94a3b8;margin-top:2px;">System will auto-deduct $' + joinFee.toFixed(2) + ' within 24 hours</div>';
      h += '</div>';
      h += '<button onclick="ZT._payAfterTrial(\'' + ZT.escape(cir.id) + '\')" style="padding:8px 14px;border-radius:10px;border:none;background:linear-gradient(135deg,#10b981,#3b82f6);color:#000;font-weight:900;font-size:11.5px;cursor:pointer;flex-shrink:0;">Pay Now</button>';
      h += '</div>';
    }
  } else if(mem.payment_status === 'pending_payment' && mem.grace_started_at){
    var graceMs = new Date(mem.grace_started_at).getTime() + (10 * 24 * 60 * 60 * 1000);
    var graceLeft = Math.max(0, Math.ceil((graceMs - Date.now()) / (24*60*60*1000)));
    h += '<div id="zt-trial-banner" style="padding:12px 14px;border-radius:12px;background:rgba(161,98,98,.10);border:1px solid rgba(161,98,98,.45);margin-bottom:12px;display:flex;align-items:center;gap:10px;">';
    h += '<i class="fa-solid fa-triangle-exclamation" style="color:#a16262;font-size:16px;"></i>';
    h += '<div style="flex:1;min-width:0;">';
    h += '<div style="font-size:12.5px;font-weight:900;color:#a16262;">Monthly payment pending</div>';
    h += '<div style="font-size:10.5px;color:#94a3b8;margin-top:2px;">' + (graceLeft > 0 ? ('Pay within ' + graceLeft + ' day' + (graceLeft === 1 ? '' : 's') + ' or access ends') : 'Access ends today') + '</div>';
    h += '</div>';
    h += '<button onclick="ZT._payAfterTrial(\'' + ZT.escape(cir.id) + '\')" style="padding:8px 14px;border-radius:10px;border:none;background:linear-gradient(135deg,#10b981,#3b82f6);color:#000;font-weight:900;font-size:11.5px;cursor:pointer;flex-shrink:0;">Pay $' + joinFee.toFixed(2) + '</button>';
    h += '</div>';
  }

  host.innerHTML = h;
};

/* Student clicks banner's "Pay Now" (D2) */
ZT._payAfterTrial = async function(circleId){
  var c = sb(); if(!c) return;
  var me = ZT.State.currentUser; if(!me) return;
  try {
    var r = await c.rpc('tutor_pay_after_trial', { p_circle_id: circleId });
    if(r.error) throw r.error;
    if(r.data && r.data.ok === false){
      var code = r.data.error;
      if(code === 'insufficient_funds') ZT.toast('Not enough balance. Top up wallet first.', 'error');
      else if(code === 'already_paid') ZT.toast('Already paid.', 'info');
      else if(code === 'owner_no_pay') ZT.toast('Owner does not pay.', 'info');
      else ZT.toast('Payment failed.', 'error');
      return;
    }
    ZT.toast('Paid! Full access confirmed.');
    ZT.haptic(15);
    ZT.State.memberRow = null;
    try {
      var p = await c.from('profiles')
        .select('wallet_cash,wallet_bounty')
        .eq('id', me.id).maybeSingle();
      if(p.data){
        ZT.State.currentUser.wallet_cash = p.data.wallet_cash;
        ZT.State.currentUser.wallet_bounty = p.data.wallet_bounty;
      }
    } catch(e){}
    ZT.showView('feed');
  } catch(e){
    ZT.toast('Failed: ' + ((e && e.message) || 'unknown'), 'error');
  }
};

/* loadPostViewCounts removed — view counter UI gone. Backend view tracking still works via recordPostViews. */


ZT.loadCirclePosts = async function(){
  var host = document.getElementById('zt-posts-host');
  if(!host) return;
  var cir = ZT.State.currentCircle; if(!cir) return;
  var c = sb(); if(!c) return;
  try {
    var r = await c.from('tutor_posts').select('*').eq('circle_id', cir.id).order('is_pinned', { ascending: false }).order('created_at', { ascending: false }).limit(50);
    if(r.error){ host.innerHTML = '<div class="zt-empty"><p>Could not load posts.</p></div>'; return; }
    var posts = r.data || [];
    ZT.State.posts = posts;
    var authorIds = Array.from(new Set(posts.map(function(p){ return p.author_id; })));
    if(authorIds.length){
      var pr = await c.from('profiles').select('id,name,username,avatar').in('id', authorIds);
      (pr.data || []).forEach(function(p){ ZT.State.profileCache[p.id] = p; });
    }
    ZT.State.reactions = {}; ZT.State.myReactions = {}; ZT.State.comments = {};
    if(posts.length){
      var ids = posts.map(function(p){ return p.id; });
      var rx = await c.from('tutor_post_reactions').select('post_id,user_id,reaction').in('post_id', ids);
      (rx.data || []).forEach(function(x){
        if(!ZT.State.reactions[x.post_id]) ZT.State.reactions[x.post_id] = {};
        ZT.State.reactions[x.post_id][x.reaction] = (ZT.State.reactions[x.post_id][x.reaction] || 0) + 1;
        if(ZT.State.currentUser && x.user_id === ZT.State.currentUser.id){
          if(!ZT.State.myReactions[x.post_id]) ZT.State.myReactions[x.post_id] = {};
          ZT.State.myReactions[x.post_id][x.reaction] = true;
        }
      });
      var cm = await c.from('tutor_post_comments').select('*').in('post_id', ids).order('created_at', { ascending: true });
      (cm.data || []).forEach(function(x){
        if(!ZT.State.comments[x.post_id]) ZT.State.comments[x.post_id] = [];
        ZT.State.comments[x.post_id].push(x);
      });
      var cAuthorIds = Array.from(new Set((cm.data || []).map(function(x){ return x.author_id; })));
      var toFetch = cAuthorIds.filter(function(id){ return !ZT.State.profileCache[id]; });
      if(toFetch.length){
        var pr2 = await c.from('profiles').select('id,name,username,avatar').in('id', toFetch);
        (pr2.data || []).forEach(function(p){ ZT.State.profileCache[p.id] = p; });
      }
    }
    if(!posts.length){ host.innerHTML = '<div class="zt-empty"><i class="fa-solid fa-newspaper"></i><p>No posts yet in this circle.</p></div>'; return; }
    var h = '';
    posts.forEach(function(p){ h += ZT.renderPostCard(p); });
    host.innerHTML = h;
    ZT.attachPostInteractions();
    /* Record views silently — non-blocking */
    setTimeout(function(){ ZT.recordPostViews(posts); }, 800);
    /* Show views count for tutor posts */
    /* view-count UI removed */

  } catch(e){ console.warn(e); host.innerHTML = '<div class="zt-empty"><p>Error.</p></div>'; }
};

ZT.renderPostCard = function(p){
  var me = ZT.State.currentUser;
  var a = ZT.profileOf(p.author_id);
  var reactions = ZT.State.reactions[p.id] || {};
  var myRx = ZT.State.myReactions[p.id] || {};
  var comments = ZT.State.comments[p.id] || [];
  var role = ZT.State.myRoleInCircle || 'student';
  var isTutor = role === 'tutor' || role === 'admin' || role === 'owner';
  var isMyPost = me && me.id === p.author_id;
  var pinned = !!p.is_pinned;
  var learned = !!ZT.State.markedLearned[p.id];
  var banner = p.banner_style;
  var contentText = p.content || '';
  var contentLines = contentText.split('\n').length;
  var tooLong = contentText.length > 350 || contentLines > 8;
  var folded = !!ZT.State.foldedPosts[p.id];
  if(folded === undefined) folded = false;

  var h = '<div class="zt-post" data-post-id="' + ZT.escape(p.id) + '">';
  h += '<div class="zt-post-author" style="position:relative;">';

h += '<img src="' + ZT.escape(ZT.safeAvatar(a)) + '" style="cursor:pointer;" onclick="(function(ev){ev.stopPropagation();if(\'' + ZT.escape(a.id) + '\'===ZT.State.currentCircle.owner_id){ZT.showView(\'circle-owner-profile\',\'' + ZT.escape(a.id) + '\');}else{ZT.openUserProfile(\'' + ZT.escape(a.id) + '\');}})(event)">';
h += '<div style="flex:1;min-width:0;cursor:pointer;" onclick="if(\'' + ZT.escape(a.id) + '\'===ZT.State.currentCircle.owner_id){ZT.showView(\'circle-owner-profile\',\'' + ZT.escape(a.id) + '\');}else{ZT.openUserProfile(\'' + ZT.escape(a.id) + '\');}"><div class="pname">' + ZT.escape(a.name || 'User');
    if(a.id === ZT.State.currentCircle.owner_id) h += ' <span class="zt-badge-author">OWNER</span>';
  if(pinned) h += ' <span class="zt-badge-pinned"><i class="fa-solid fa-thumbtack"></i> PINNED</span>';
  h += '</div><div class="phandle">@' + ZT.escape(a.username || 'user') + ' · ' + ZT.timeAgo(p.created_at) + '</div></div>';

  if(isMyPost || isTutor){
    h += '<button onclick="ZT.openPostMenu(\'' + ZT.escape(p.id) + '\', event)" style="background:transparent;border:none;color:#64748b;cursor:pointer;width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="fa-solid fa-ellipsis-vertical"></i></button>';
  }
  h += '</div>';

  if(contentText){
    if(banner){
      var bannerCss = ZT.gradientCss(banner);
      /* Banner text only — author/avatar/menu untouched */
      h += '<div class="zt-post-banner-content" style="background:' + bannerCss + ';border-radius:14px;padding:28px 20px;margin-bottom:10px;min-height:120px;display:flex;align-items:center;justify-content:center;text-align:center;">';
      h += '<div style="font-size:clamp(16px,2vw,20px);font-weight:900;color:#fff;line-height:1.55;text-shadow:0 2px 6px rgba(0,0,0,.5);white-space:pre-wrap;word-break:break-word;max-width:100%;">' + ZT.escape(contentText) + '</div>';
      h += '</div>';
    } else {
      h += '<div class="zt-post-content' + ((tooLong && !folded) ? ' folded' : '') + '" data-post-content="' + ZT.escape(p.id) + '">' + ZT.escape(contentText) + '</div>';
      if(tooLong){
        h += '<button class="zt-see-more" onclick="ZT.togglePostFold(\'' + ZT.escape(p.id) + '\')" data-fold-btn="' + ZT.escape(p.id) + '">' + (folded ? 'Show less' : 'See more') + '</button>';
      }
    }
  }

  if(p.media_url){
    if(p.media_type === 'video') h += '<div class="zt-post-media"><video src="' + ZT.escape(p.media_url) + '" controls playsinline preload="metadata"></video></div>';
    else h += '<div class="zt-post-media"><img src="' + ZT.escape(p.media_url) + '" loading="lazy"></div>';
  }

  h += '<div class="zt-post-reactions">';
  ZT.ALL_REACTIONS.forEach(function(k){
    var r = ZT.Reactions[k];
    var cnt = reactions[k] || 0;
    var active = !!myRx[k];
    var bounty = r.bounty > 0 ? '<span style="font-size:9px;color:#10b981;font-weight:700;margin-left:1px;">$' + r.bounty.toFixed(2) + '</span>' : '<span style="font-size:9px;color:#64748b;font-weight:700;margin-left:1px;">—</span>';
    h += '<button class="zt-react-btn ' + (active ? 'active' : '') + '" data-react-post="' + ZT.escape(p.id) + '" data-react-key="' + k + '">' + r.symbol + ' <span class="count">' + cnt + '</span> ' + bounty + '</button>';
  });
  h += '</div>';

  h += '<div class="zt-post-actions">';
  h += '<button data-toggle-comments="' + ZT.escape(p.id) + '"><i class="fa-regular fa-comment"></i> ' + comments.length + ' Comments</button>';
  h += '<button onclick="ZT.sharePost(\'' + ZT.escape(p.id) + '\',event)"><i class="fa-solid fa-share-nodes"></i> Share</button>';
  if(!isTutor){
    h += '<button data-learned-post="' + ZT.escape(p.id) + '" style="margin-left:auto;' + (learned ? 'color:#10b981;font-weight:900;' : '') + '">';
    h += '<i class="' + (learned ? 'fa-solid' : 'fa-regular') + ' fa-circle-check"></i> ' + (learned ? 'Learned' : 'Mark as Learned') + '</button>';
  }
  h += '</div>';

  h += '<div class="zt-comments" id="zt-comments-' + ZT.escape(p.id) + '">';
  var listHtml = comments.length
    ? comments.map(function(cm){
        var ca = ZT.profileOf(cm.author_id);
        return '<div class="zt-comment"><span class="cname">' + ZT.escape(ca.name || 'User') + '</span>' + ZT.escape(cm.text) + '</div>';
      }).join('')
    : '<div style="text-align:center;color:#64748b;font-size:11.5px;padding:10px;">No comments yet.</div>';
  h += listHtml;
  h += '<div class="zt-comment-input"><textarea id="zt-ci-' + ZT.escape(p.id) + '" rows="1" placeholder="Write a comment..."></textarea>';
  h += '<button data-add-comment="' + ZT.escape(p.id) + '">Send</button></div>';
  h += '</div></div>';
  return h;
};

ZT.attachPostInteractions = function(){
  var host = document.getElementById('zt-posts-host');
  if(!host || host._wired) return;
  host._wired = true;
  host.addEventListener('click', function(e){
    var rx = e.target.closest('[data-react-post]');
    if(rx){ ZT.toggleReaction(rx.getAttribute('data-react-post'), rx.getAttribute('data-react-key')); return; }
    var tc = e.target.closest('[data-toggle-comments]');
    if(tc){ var el = document.getElementById('zt-comments-' + tc.getAttribute('data-toggle-comments')); if(el) el.classList.toggle('open'); return; }
    var ac = e.target.closest('[data-add-comment]');
    if(ac){ ZT.addComment(ac.getAttribute('data-add-comment')); return; }
    var lp = e.target.closest('[data-learned-post]');
    if(lp){ var id = lp.getAttribute('data-learned-post'); ZT.State.markedLearned[id] = !ZT.State.markedLearned[id]; ZT.haptic(8); ZT.repaintPost(id); return; }
    var fb = e.target.closest('[data-fold-btn]');
    if(fb){ ZT.togglePostFold(fb.getAttribute('data-fold-btn')); return; }
  });
};

ZT.foldedPosts = ZT.State.foldedPosts = ZT.State.foldedPosts || {};

ZT.togglePostFold = function(postId){
  if(!ZT.State.foldedPosts) ZT.State.foldedPosts = {};
  ZT.State.foldedPosts[postId] = !ZT.State.foldedPosts[postId];
  var content = document.querySelector('[data-post-content="' + postId + '"]');
  var btn = document.querySelector('[data-fold-btn="' + postId + '"]');
  if(content) content.classList.toggle('folded', !ZT.State.foldedPosts[postId]);
  if(btn) btn.textContent = ZT.State.foldedPosts[postId] ? 'See more' : 'Show less';
};

ZT.openPostMenu = function(postId, ev){
  if(ev) ev.stopPropagation();
  var post = ZT.State.posts.find(function(x){ return x.id === postId; });
  if(!post) return;
  var role = ZT.State.myRoleInCircle || 'student';
  var isTutor = role === 'tutor' || role === 'admin' || role === 'owner';
  var isMyPost = ZT.State.currentUser && post.author_id === ZT.State.currentUser.id;
  var pinned = !!post.is_pinned;

  var items = [];
  if(isMyPost || isTutor){
    items.push({ icon: pinned ? 'fa-thumbtack' : 'fa-thumbtack', label: pinned ? 'Unpin post' : 'Pin to top', color: '#a18554', fn: 'ZT.togglePin(\'' + postId + '\')' });
  }
  if(isMyPost || isTutor){
    items.push({ icon: 'fa-trash', label: 'Delete post', color: '#a16262', fn: 'ZT.deletePost(\'' + postId + '\')' });
  }
  if(isTutor){
    items.push({ icon: 'fa-eye', label: 'Who viewed this', color: '#60a5fa', fn: 'ZT.showPostViews(\'' + postId + '\')' });
  }

  var html = '';
  items.forEach(function(it){
    html += '<button onclick="' + it.fn + '; ZT.Modal.close();" style="width:100%;text-align:left;background:transparent;border:none;padding:14px 12px;display:flex;align-items:center;gap:12px;color:#cbd5e1;font-size:13px;font-weight:700;cursor:pointer;border-radius:10px;margin-bottom:2px;">';
    html += '<i class="fa-solid ' + it.icon + '" style="color:' + it.color + ';font-size:15px;width:22px;text-align:center;"></i>';
    html += '<span>' + ZT.escape(it.label) + '</span>';
    html += '</button>';
  });
  if(!items.length){ html = '<div style="text-align:center;color:#64748b;padding:20px;font-size:12px;">No actions available.</div>'; }

  ZT.Modal.open({ title:'Post options', icon:'fa-solid fa-ellipsis', body:html, footer:false });
};

ZT.recordPostViews = async function(posts){
  var me = ZT.State.currentUser;
  if(!me || !posts || !posts.length) return;
  var c = sb(); if(!c) return;
  for(var i = 0; i < posts.length; i++){
    try {
      await c.from('tutor_post_views').insert({
        post_id: posts[i].id,
        viewer_id: me.id
      });
    } catch(e){ /* unique constraint — already viewed, ignore */ }
  }
};

ZT.showPostViews = async function(postId){
  var c = sb(); if(!c) return;
  try {
    var r = await c.from('tutor_post_views')
      .select('viewer_id, viewed_at')
      .eq('post_id', postId)
      .order('viewed_at', { ascending: false })
      .limit(200);
    if(r.error) throw r.error;
    var list = r.data || [];
    if(!list.length){
      ZT.Modal.open({ title:'Post views (0)', icon:'fa-solid fa-eye', body:'<div style="text-align:center;color:#64748b;padding:20px;font-size:12px;">No views yet.</div>', footer:false });
      return;
    }
    var ids = list.map(function(x){ return x.viewer_id; });
    var pr = await c.from('profiles').select('id,name,username,avatar').in('id', ids);
    (pr.data || []).forEach(function(p){ ZT.State.profileCache[p.id] = p; });

    var html = '';
    html += '<div style="font-size:11px;color:#94a3b8;margin-bottom:10px;font-weight:800;">' + list.length + ' people viewed this post</div>';
    list.forEach(function(v){
      var p = ZT.profileOf(v.viewer_id);
      html += '<div style="display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #1e293b;">';
      html += '<img src="' + ZT.escape(ZT.safeAvatar(p)) + '" style="width:38px;height:38px;border-radius:50%;object-fit:cover;flex-shrink:0;">';
      html += '<div style="flex:1;min-width:0;">';
      html += '<div style="font-size:13px;font-weight:800;color:#fff;">' + ZT.escape(p.name || 'User') + '</div>';
      html += '<div style="font-size:10px;color:#94a3b8;">@' + ZT.escape(p.username || 'user') + ' · ' + ZT.timeAgo(v.viewed_at) + '</div>';
      html += '</div></div>';
    });
    ZT.Modal.open({ title:'Post views (' + list.length + ')', icon:'fa-solid fa-eye', body:html, footer:false });
  } catch(e){
    console.warn('[views]', e);
    ZT.Modal.open({ title:'Post views', icon:'fa-solid fa-eye', body:'<div style="text-align:center;color:#94a3b8;padding:20px;font-size:12px;">Could not load views.</div>', footer:false });

ZT.sharePost = function(postId, ev){
  if(ev) ev.stopPropagation();
  var cir = ZT.State.currentCircle;
  if(!cir){ ZT.toast('Not in a circle.', 'error'); return; }
  var url = location.origin + location.pathname + '?post=' + postId + '&circle=' + cir.id;
  try {
    navigator.clipboard.writeText(url);
    ZT.toast('Post link copied');
  } catch(e){
    ZT.toast('Copy failed — link: ' + url, 'error');
  }
};

ZT.toggleReaction = async function(postId, key){
  var me = ZT.State.currentUser;
  if(!me){ ZT.toast('Login required.', 'error'); return; }
  var c = sb(); if(!c) return;
  if(!ZT.State.myReactions[postId]) ZT.State.myReactions[postId] = {};
  if(!ZT.State.reactions[postId]) ZT.State.reactions[postId] = {};
  var already = !!ZT.State.myReactions[postId][key];
  if(already){
    ZT.State.myReactions[postId][key] = false;
    ZT.State.reactions[postId][key] = Math.max(0, (ZT.State.reactions[postId][key] || 1) - 1);
  } else {
    ZT.State.myReactions[postId][key] = true;
    ZT.State.reactions[postId][key] = (ZT.State.reactions[postId][key] || 0) + 1;
  }
  ZT.repaintPost(postId);
  try {
    if(already) await c.from('tutor_post_reactions').delete().eq('post_id', postId).eq('user_id', me.id).eq('reaction', key);
    else { var ins = await c.from('tutor_post_reactions').insert({ post_id: postId, user_id: me.id, reaction: key }); if(ins.error && ins.error.code !== '23505') throw ins.error; }
  } catch(e){
    if(already){ ZT.State.myReactions[postId][key] = true; ZT.State.reactions[postId][key] = (ZT.State.reactions[postId][key] || 0) + 1; }
    else { ZT.State.myReactions[postId][key] = false; ZT.State.reactions[postId][key] = Math.max(0, (ZT.State.reactions[postId][key] || 1) - 1); }
    ZT.repaintPost(postId);
    ZT.toast('Failed.', 'error');
  }
};

ZT.repaintPost = function(postId){
  var post = ZT.State.posts.find(function(x){ return x.id === postId; });
  if(!post) return;
  var card = document.querySelector('[data-post-id="' + postId + '"]');
  if(!card) return;
  var tmp = document.createElement('div');
  tmp.innerHTML = ZT.renderPostCard(post);
  card.parentNode.replaceChild(tmp.firstChild, card);
  /* Note: no need to re-wire — host listener already exists */
};

ZT.togglePin = async function(postId){
  var c = sb(); if(!c) return;
  var post = ZT.State.posts.find(function(x){ return x.id === postId; }); if(!post) return;
  var newPin = !post.is_pinned;
  var r = await c.from('tutor_posts').update({ is_pinned: newPin }).eq('id', postId);
  if(r.error){ ZT.toast('Failed.', 'error'); return; }
  ZT.toast(newPin ? 'Pinned.' : 'Unpinned.');
  ZT.loadCirclePosts();
};

ZT.deletePost = async function(postId){
  if(!confirm('Delete this post?')) return;
  var c = sb(); if(!c) return;
  var r = await c.from('tutor_posts').delete().eq('id', postId);
  if(r.error){ ZT.toast('Failed.', 'error'); return; }
  ZT.toast('Deleted.');
  ZT.loadCirclePosts();
};

ZT.addComment = async function(postId){
  var me = ZT.State.currentUser; if(!me) return;
  var inp = document.getElementById('zt-ci-' + postId); if(!inp) return;
  var text = (inp.value || '').trim(); if(!text) return;
  var c = sb(); if(!c) return;
  var newId = ZT.uuid();
  var row = { id: newId, post_id: postId, author_id: me.id, text: text, created_at: new Date().toISOString() };
  if(!ZT.State.comments[postId]) ZT.State.comments[postId] = [];
  ZT.State.comments[postId].push(row);
  inp.value = '';
  if(!ZT.State.profileCache[me.id]) ZT.State.profileCache[me.id] = me;
  ZT.repaintPost(postId);
  var cbox = document.getElementById('zt-comments-' + postId); if(cbox) cbox.classList.add('open');
  try { var r = await c.from('tutor_post_comments').insert(row); if(r.error) throw r.error; }
  catch(e){ ZT.State.comments[postId] = ZT.State.comments[postId].filter(function(x){ return x.id !== newId; }); ZT.repaintPost(postId); ZT.toast('Failed.', 'error'); }
};

ZT.pickBanner = function(id){

  document.querySelectorAll('[data-banner]').forEach(function(el){
    var isActive = el.getAttribute('data-banner') === id;
    el.style.border = isActive ? '2px solid #10b981' : '2px solid rgba(255,255,255,.06)';
  });
};

ZT.composerType = function(type){
  ZT._composerType = type;
  document.querySelectorAll('.zt-chip').forEach(function(c){ c.classList.toggle('active', c.getAttribute('data-type') === type); });
};
ZT.cancelComposer = function(){ var host = document.getElementById('zt-composer-host'); if(host) host.innerHTML = ''; ZT._composerFile = null; ZT._composerKind = null; };

ZT.previewMedia = function(input, kind){
  var f = input && input.files && input.files[0]; if(!f) return;
  if(f.size > 100*1024*1024){ ZT.toast('Max 100 MB.', 'error'); input.value=''; return; }
  ZT._composerFile = f; ZT._composerKind = kind;
  var box = document.getElementById('zt-preview'); if(!box) return;
  var url = URL.createObjectURL(f);
  var inner = kind === 'photo' ? '<img src="' + url + '">' : '<video src="' + url + '" controls></video>';
  inner += '<button class="rm" onclick="ZT.removeMedia()"><i class="fa-solid fa-xmark"></i> Remove</button>';
  box.innerHTML = inner; box.classList.add('show');
  ['zt-file-photo','zt-file-video'].forEach(function(id){ var el = document.getElementById(id); if(el && el !== input) el.value = ''; });
};
ZT.removeMedia = function(){
  ZT._composerFile = null; ZT._composerKind = null;
  ['zt-file-photo','zt-file-video'].forEach(function(id){ var el = document.getElementById(id); if(el) el.value = ''; });
  var box = document.getElementById('zt-preview'); if(box){ box.innerHTML = ''; box.classList.remove('show'); }
};

ZT.toggleComposerBanner = function(){
  var p = document.getElementById('zt-banner-picker');
  var t = document.getElementById('zt-banner-toggle');
  if(!p) return;
  var open = p.style.display !== 'block';
  p.style.display = open ? 'block' : 'none';
  if(t){
    t.style.background = open ? 'rgba(16,185,129,.15)' : '';
    t.style.borderColor = open ? '#10b981' : '';
    t.style.color = open ? '#10b981' : '';
  }
};

ZT.pickComposerVis = function(btn, k){
  ZT._composerVis = k;
  document.querySelectorAll('[data-vis]').forEach(function(b){
    var active = b.getAttribute('data-vis') === k;
    b.classList.toggle('active', active);
  });
};

ZT.toggleComposerSchedule = function(){
  var cb = document.getElementById('zt-comp-schedule-toggle');
  var wrap = document.getElementById('zt-comp-schedule-wrap');
  if(!cb || !wrap) return;
  if(cb.checked){
    wrap.style.display = 'block';
    var inp = document.getElementById('zt-comp-schedule-at');
    if(inp && !inp.value){
      var d = new Date(Date.now() + 60*60*1000);
      inp.value = new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,16);
    }
  } else {
    wrap.style.display = 'none';
  }
};

ZT.publishPost = async function(){
  var me = ZT.State.currentUser; if(!me) return;
  var cir = ZT.State.currentCircle; if(!cir) return;
  var textEl = document.getElementById('zt-composer-text');
  var text = (textEl && textEl.value || '').trim();
  var file = ZT._composerFile;
  if(!text && !file){ ZT.toast('Add text or media.', 'error'); return; }
  var btn = document.getElementById('zt-publish-btn'); if(btn){ btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Publishing…'; }
  var mediaUrl = null, mediaType = null;
  if(file){
    try { mediaUrl = await ZT.storeMedia(file); mediaType = (ZT._composerKind === 'video') ? 'video' : 'image'; }
    catch(e){ ZT.toast('Upload failed.', 'error'); if(btn){ btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Publish'; } return; }
  }
  try {
    var c = sb();
    var r = await c.from('tutor_posts').insert({
      circle_id: cir.id, author_id: me.id, content: text || null,
      media_url: mediaUrl, media_type: mediaType,
      post_type: ZT._composerType || 'text', is_pinned: false,
      banner_style: (ZT._composerBanner && ZT._composerBanner !== 'none') ? ZT._composerBanner : null
    }).select().maybeSingle();
    if(r.error) throw r.error;
    ZT.toast('Post published.'); ZT.haptic(12);
    ZT._composerFile = null; ZT._composerKind = null; ZT.cancelComposer();
    ZT.loadCirclePosts();
  } catch(e){ ZT.toast('Failed: ' + ((e&&e.message)||''), 'error'); if(btn){ btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Publish'; } }
};

ZT.renderChat = async function(){
  var cir = ZT.State.currentCircle;
  var me = ZT.State.currentUser;
  var role = ZT.State.myRoleInCircle || 'student';
  var isTutor = role === 'tutor' || role === 'admin' || role === 'owner';
  var locked = !!cir.chat_locked;

  var h = '';
  h += '<div class="zt-circle-head">';
  h += '<button class="back" onclick="ZT.goBack()"><i class="fa-solid fa-arrow-left"></i></button>';
  h += '<div style="flex:1;min-width:0;"><div class="nm">Group Chat</div><div class="sub">' + ZT.escape(cir.name) + '</div></div>';
  if(isTutor){
    h += '<button onclick="ZT.toggleChatLock()" title="' + (locked ? 'Unlock chat' : 'Lock chat') + '" style="background:' + (locked ? 'rgba(161,98,98,.2)' : 'rgba(16,185,129,.1)') + ';border:1px solid ' + (locked ? 'rgba(161,98,98,.5)' : 'rgba(16,185,129,.4)') + ';color:' + (locked ? '#c9a5a5' : '#6ee7b7') + ';width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="fa-solid fa-' + (locked ? 'lock' : 'lock-open') + '"></i></button>';
  }
  h += '</div>';

  if(locked){
    h += '<div style="background:rgba(161,98,98,.10);border:1px solid rgba(161,98,98,.4);border-radius:12px;padding:10px 14px;margin-bottom:10px;display:flex;align-items:center;gap:8px;">';
    h += '<i class="fa-solid fa-lock" style="color:#c9a5a5;font-size:14px;"></i>';
    h += '<div style="font-size:12px;color:#c9a5a5;font-weight:800;">Chat is locked by owner</div>';
    h += '</div>';
  }

  h += '<div class="zt-chat-wrap" id="zt-chat-wrap">';
  h += '<div class="zt-chat-body" id="zt-chat-body"><div style="text-align:center;color:#64748b;"><i class="fa-solid fa-circle-notch fa-spin"></i></div></div>';
  h += '<div class="zt-chat-input">';
  if(locked && !isTutor){
    h += '<div style="flex:1;text-align:center;color:#64748b;font-size:12px;padding:10px;">Chat locked — you cannot send messages</div>';
  } else {
    h += '<textarea id="zt-chat-input" rows="1" placeholder="Type a message..."></textarea>';
    h += '<button class="send" id="zt-send-btn">Send</button>';
  }
  h += '</div></div>';

  setTimeout(async function(){
    var c = sb(); if(!c) return;
    try {
      var th = await c.rpc('tutor_get_group_thread', { p_circle_id: cir.id });
      if(th.error){ console.warn('thread', th.error); ZT.toast('Chat unavailable.', 'error'); return; }
      ZT.State.chatThreadId = th.data;
      await ZT.loadChatMessages();
      ZT.startChatPoll();
      var inp = document.getElementById('zt-chat-input');
      if(inp){
        inp.addEventListener('input', function(){ this.style.height='auto'; this.style.height = Math.min(110, this.scrollHeight) + 'px'; });
        inp.addEventListener('keydown', function(e){ if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); ZT.sendChatText(); } });
      }
      var sb2 = document.getElementById('zt-send-btn');
      if(sb2) sb2.addEventListener('click', ZT.sendChatText);
    } catch(e){ console.warn(e); }
  }, 30);
  return h;
};

ZT.toggleChatLock = async function(){
  var cir = ZT.State.currentCircle; if(!cir) return;
  var role = ZT.State.myRoleInCircle || 'student';
  if(!(role === 'tutor' || role === 'admin' || role === 'owner')){ ZT.toast('Only the owner can lock chat.', 'error'); return; }
  var newVal = !cir.chat_locked;
  var c = sb(); if(!c) return;
  try {
    var r = await c.from('tutor_circles').update({ chat_locked: newVal }).eq('id', cir.id);
    if(r.error) throw r.error;
    cir.chat_locked = newVal;
    ZT.State.currentCircle = cir;
    ZT.toast(newVal ? 'Chat locked 🔒' : 'Chat unlocked 🔓');
    ZT.haptic(12);
    var cir2 = ZT.State.currentCircle;
    if(cir2 && document.getElementById('zt-room-content')){
      if(cir2.room_type === 'connect'){
        /* Connect has no chat — no-op */
      } else {
        ZT.switchRoomTab('chat');
      }
    } else {
      ZT.showView('chat');
    }
  } catch(e){
    console.warn('[chat lock]', e);

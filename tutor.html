<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ZYNIX Tutor</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#090d16;color:#f8fafc;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding-bottom:80px;overflow-x:hidden}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:#090d16}
::-webkit-scrollbar-thumb{background:#1e293b;border-radius:4px}
.zt-header{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(9,13,22,.92);backdrop-filter:blur(12px);border-bottom:1px solid #1e293b;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;min-height:56px;max-width:600px;margin:0 auto}
.zt-logo{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#10b981);display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;font-size:14px}
.zt-title{font-size:15px;font-weight:900;background:linear-gradient(90deg,#8b5cf6,#10b981,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent}
.zt-hbtn{background:rgba(30,41,59,.7);border:1px solid #1e293b;color:#cbd5e1;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:13px;display:inline-flex;align-items:center;justify-content:center;transition:all .2s;position:relative}
.zt-hbtn:hover{border-color:#8b5cf6;color:#a78bfa}
.zt-footer{position:fixed;bottom:0;left:0;right:0;z-index:1000;background:rgba(9,13,22,.95);backdrop-filter:blur(12px);border-top:1px solid #1e293b;padding:8px 0;display:flex;align-items:center;justify-content:space-around;max-width:600px;margin:0 auto}
.zt-footer button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 0;color:#64748b;transition:color .2s;background:transparent;border:none;font-size:9px;cursor:pointer;font-weight:600;position:relative}
.zt-footer button i{font-size:18px;margin-bottom:3px}
.zt-footer button.active{color:#8b5cf6}
.zt-footer button.active::after{content:'';position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:24px;height:3px;background:linear-gradient(90deg,#8b5cf6,#10b981);border-radius:2px}
#zt-app{max-width:600px;margin:0 auto;padding:76px 14px 20px;min-height:calc(100vh - 80px)}
#zt-welcome{position:fixed;inset:0;z-index:20000;background:#090d16;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;opacity:1;transition:opacity .28s ease}
#zt-welcome.fadeout{opacity:0;pointer-events:none}
.zt-wl{width:84px;height:84px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#10b981);display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;font-size:38px;box-shadow:0 10px 40px rgba(139,92,246,.35)}
.zt-ww{margin-top:20px;font-size:26px;font-weight:900;letter-spacing:3px;background:linear-gradient(90deg,#8b5cf6,#10b981,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent}
.zt-wt{margin-top:8px;font-size:11px;font-weight:600;letter-spacing:3px;color:#64748b;text-transform:uppercase}
.zt-card{background:#111827;border:1px solid #1e293b;border-radius:16px;padding:16px;margin-bottom:12px}
.zt-st{font-size:11px;font-weight:900;color:#94a3b8;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px;padding:0 4px}
.zt-btn{background:linear-gradient(135deg,#8b5cf6,#10b981);border:none;color:#000;font-weight:900;padding:13px 20px;border-radius:10px;font-size:13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;width:100%}
.zt-btn:active{opacity:.85}
.zt-btn:disabled{opacity:.5;cursor:not-allowed}
.zt-btn.secondary{background:rgba(30,41,59,.9);border:1px solid #334155;color:#cbd5e1;font-weight:800}
.zt-btn.danger{background:rgba(161,98,98,.15);border:1px solid rgba(161,98,98,.5);color:#c9a5a5}
.zt-btn.small{padding:9px 16px;font-size:11px;width:auto}
.zt-input,.zt-textarea,.zt-select{width:100%;background:#0f172a;border:1px solid #1e293b;border-radius:10px;padding:12px;font-size:13px;color:#fff;outline:none;font-family:inherit;transition:border-color .2s;box-sizing:border-box}
.zt-input:focus,.zt-textarea:focus,.zt-select:focus{border-color:#8b5cf6}
.zt-textarea{min-height:90px;resize:vertical}
.zt-label{display:block;font-size:11px;font-weight:800;color:#94a3b8;margin-bottom:5px}
.zt-field{margin-bottom:14px}
.zt-landing-head{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.zt-back-btn{background:rgba(139,92,246,.10);border:1px solid rgba(139,92,246,.4);color:#a78bfa;border-radius:10px;padding:8px 14px;font-size:11px;font-weight:900;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.zt-back-btn:hover{background:rgba(139,92,246,.20);border-color:#8b5cf6}
.zt-landing-title{font-size:20px;font-weight:900;color:#fff}
.zt-landing-sub{font-size:11.5px;color:#94a3b8;margin-top:2px}
.zt-search{position:relative;margin-bottom:16px}
.zt-search input{width:100%;background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:12px 42px 12px 14px;color:#fff;font-size:13px;outline:none;box-sizing:border-box}
.zt-search input:focus{border-color:#8b5cf6}
.zt-search i{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:#64748b;font-size:13px;pointer-events:none}
.zt-cta-create{width:100%;padding:16px;border-radius:16px;background:linear-gradient(135deg,rgba(139,92,246,.18),rgba(16,185,129,.12));border:1px solid rgba(139,92,246,.45);display:flex;align-items:center;gap:14px;cursor:pointer;margin-bottom:18px;text-align:left}
.zt-cta-create .ico{width:48px;height:48px;border-radius:14px;background:linear-gradient(135deg,#8b5cf6,#10b981);display:flex;align-items:center;justify-content:center;color:#000;font-size:22px;flex-shrink:0}
.zt-cta-create .ttl{font-size:15px;font-weight:900;color:#fff}
.zt-cta-create .sub{font-size:11.5px;color:#cbd5e1;margin-top:3px;line-height:1.5}
.zt-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.zt-circle-card{background:#111827;border:1px solid #1e293b;border-radius:14px;overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column;position:relative}
.zt-circle-card:hover{border-color:rgba(139,92,246,.55)}
.zt-circle-banner{height:56px;position:relative;overflow:hidden}
.zt-circle-av{width:52px;height:52px;border-radius:50%;object-fit:cover;border:3px solid #111827;position:absolute;left:50%;bottom:-24px;transform:translateX(-50%);background:#0f172a}
.zt-circle-body{padding:30px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.zt-circle-name{font-size:13px;font-weight:900;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;line-height:1.2}
.zt-circle-meta{font-size:10px;color:#94a3b8;text-align:center;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap}
.zt-circle-meta span{display:inline-flex;align-items:center;gap:3px}
.zt-circle-action{margin-top:auto;padding:7px 12px;border-radius:9px;background:linear-gradient(135deg,#8b5cf6,#10b981);color:#000;font-weight:900;font-size:11px;text-align:center}
.zt-circle-action.enter{background:rgba(16,185,129,.15);border:1px solid rgba(16,185,129,.45);color:#10b981}
.zt-circle-action.owner{background:rgba(161,133,84,.14);border:1px solid rgba(161,133,84,.45);color:#a18554}
.zt-owner-badge{position:absolute;top:8px;right:8px;font-size:8.5px;font-weight:900;padding:2px 7px;border-radius:8px;background:rgba(0,0,0,.65);color:#a18554;border:1px solid rgba(161,133,84,.5)}
.zt-circle-head{padding:14px;border-radius:14px;background:linear-gradient(135deg,rgba(139,92,246,.10),rgba(16,185,129,.06));border:1px solid rgba(139,92,246,.35);display:flex;align-items:center;gap:12px;margin-bottom:14px}
.zt-circle-head .av{width:44px;height:44px;border-radius:12px;object-fit:cover;flex-shrink:0;background:#0f172a;border:1px solid rgba(139,92,246,.4)}
.zt-circle-head .nm{font-size:15px;font-weight:900;color:#fff}
.zt-circle-head .sub{font-size:10.5px;color:#94a3b8;margin-top:2px}
.zt-circle-head .back{background:rgba(139,92,246,.1);border:1px solid rgba(139,92,246,.4);color:#a78bfa;width:36px;height:36px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px}
.zt-post{background:#111827;border:1px solid #1e293b;border-radius:16px;padding:14px;margin-bottom:12px}
.zt-post-author{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.zt-post-author img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:1px solid #1e293b}
.zt-post-author .pname{font-weight:800;font-size:13px;color:#fff;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.zt-post-author .phandle{font-size:10px;color:#64748b;margin-top:1px}
.zt-badge-author{font-size:8.5px;font-weight:900;padding:2px 7px;border-radius:10px;background:linear-gradient(135deg,#8b5cf6,#10b981);color:#000}
.zt-badge-pinned{font-size:8.5px;font-weight:900;padding:2px 7px;border-radius:10px;background:rgba(161,133,84,.15);color:#a18554;border:1px solid rgba(161,133,84,.4)}
.zt-post-content{font-size:13px;color:#e2e8f0;line-height:1.65;margin-bottom:10px;white-space:pre-wrap;word-break:break-word}
.zt-post-media{border-radius:12px;overflow:hidden;margin-bottom:10px;background:#0f172a;max-height:500px}
.zt-post-media img,.zt-post-media video{width:100%;height:auto;max-height:500px;object-fit:contain;display:block;background:#000}
.zt-post-reactions{display:flex;flex-wrap:wrap;gap:4px;padding:10px 0;border-top:1px solid #1e293b;align-items:center;min-height:44px}
.zt-react-btn{padding:5px 10px;border-radius:14px;font-size:14px;background:transparent;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:4px;color:#fff}
.zt-react-btn:hover{background:#1e293b}
.zt-react-btn.active{background:rgba(139,92,246,.18);border-color:rgba(139,92,246,.4)}
.zt-react-btn .count{font-size:10px;color:#64748b;font-weight:800}
.zt-react-btn.active .count{color:#a78bfa}
.zt-post-actions{display:flex;align-items:center;gap:12px;padding-top:8px;border-top:1px solid #1e293b;font-size:12px;color:#64748b;flex-wrap:wrap}
.zt-post-actions button{background:transparent;border:none;color:#64748b;cursor:pointer;font-size:12px;display:inline-flex;align-items:center;gap:5px;padding:5px 0;font-weight:700}
.zt-post-actions button:hover{color:#e2e8f0}
.zt-comments{margin-top:10px;padding-top:10px;border-top:1px solid #1e293b;display:none}
.zt-comments.open{display:block}
.zt-comment{padding:10px 12px;border-radius:12px;margin-bottom:6px;font-size:12px;background:#0f172a;color:#cbd5e1;word-break:break-word;border:1px solid #1e293b}
.zt-comment .cname{font-weight:800;color:#a78bfa;margin-right:6px}
.zt-comment-input{display:flex;gap:8px;margin-top:8px;align-items:flex-end}
.zt-comment-input textarea{flex:1;background:#0f172a;border:1px solid #1e293b;border-radius:10px;padding:10px 12px;font-size:12px;color:#fff;outline:none;resize:none;max-height:120px;min-height:38px;font-family:inherit}
.zt-comment-input button{background:linear-gradient(135deg,#8b5cf6,#10b981);border:none;color:#000;font-weight:900;padding:9px 18px;border-radius:8px;font-size:11px;cursor:pointer;height:38px}
.zt-composer{background:#111827;border:1px solid #1e293b;border-radius:16px;padding:12px;display:flex;align-items:center;gap:10px;cursor:pointer;margin-bottom:14px}
.zt-composer:hover{border-color:#334155}
.zt-composer img{width:38px;height:38px;border-radius:50%;object-fit:cover;flex-shrink:0}
.zt-composer-input{flex:1;background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:9px 14px;font-size:12px;color:#94a3b8}
.zt-composer-expanded{background:#111827;border:1px solid rgba(139,92,246,.4);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;margin-bottom:14px}
.zt-composer-chips{display:flex;gap:6px;flex-wrap:wrap}
.zt-chip{padding:6px 12px;border-radius:20px;border:1px solid #1e293b;background:#0f172a;color:#94a3b8;font-size:11px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.zt-chip.active{background:rgba(139,92,246,.12);border-color:#8b5cf6;color:#a78bfa}
.zt-media-row{display:flex;gap:8px;flex-wrap:wrap}
.zt-media-btn{background:#1e293b;border:1px solid #1e293b;color:#94a3b8;padding:8px 14px;border-radius:8px;font-size:11px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.zt-media-btn:hover{background:#0f172a;border-color:#8b5cf6;color:#a78bfa}
.zt-preview{margin-top:10px;border-radius:10px;overflow:hidden;border:1px solid #1e293b;background:#0f172a;position:relative;display:none}
.zt-preview.show{display:block}
.zt-preview img,.zt-preview video{width:100%;max-height:240px;object-fit:contain;display:block;background:#000}
.zt-preview .rm{position:absolute;top:8px;right:8px;background:rgba(161,98,98,.95);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:15px;padding:5px 12px;font-size:11px;font-weight:800;cursor:pointer}
.zt-overlay{position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.85);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.zt-modal{background:#111827;border:1px solid #1e293b;border-radius:16px;padding:20px;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;animation:ztIn .22s ease}
@keyframes ztIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.zt-mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #1e293b}
.zt-mtitle{font-size:16px;font-weight:900;color:#fff;display:flex;align-items:center;gap:8px}
.zt-mclose{background:transparent;border:none;color:#94a3b8;font-size:22px;cursor:pointer;padding:0;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:8px}
.zt-mclose:hover{background:rgba(161,98,98,.15);color:#c9a5a5}
.zt-toastc{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:2147483647;width:90%;max-width:380px;pointer-events:none}
.zt-toast{background:rgba(17,24,39,.96);border:1px solid rgba(139,92,246,.3);color:#f8fafc;padding:12px 14px;border-radius:12px;font-size:12px;margin-bottom:6px;backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;opacity:0;transform:translateY(10px);transition:all .25s;pointer-events:auto}
.zt-toast.show{opacity:1;transform:translateY(0)}
.zt-toast i{font-size:15px;flex-shrink:0}
.zt-toast.success i{color:#10b981}
.zt-toast.error i{color:#a16262}
.zt-toast.warning i{color:#a18554}
.zt-toast.info i{color:#3b82f6}
.zt-empty{text-align:center;padding:40px 20px;color:#64748b}
.zt-empty i{font-size:36px;display:block;margin-bottom:14px;color:#334155}
.zt-empty p{font-size:12.5px;margin-bottom:16px;line-height:1.6}
.zt-placeholder{padding:50px 24px;text-align:center;border-radius:16px;background:linear-gradient(135deg,rgba(139,92,246,.08),rgba(16,185,129,.06));border:1px dashed rgba(139,92,246,.4)}
.zt-placeholder .pi{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#8b5cf6,#10b981);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:#000;font-size:26px}
.zt-placeholder h3{font-size:18px;font-weight:900;color:#fff;margin-bottom:8px}
.zt-placeholder p{font-size:12.5px;color:#94a3b8;line-height:1.7;margin-bottom:20px;max-width:360px;margin-left:auto;margin-right:auto}
.zt-hero{border-radius:16px;padding:18px;margin-bottom:14px;background:linear-gradient(135deg,rgba(139,92,246,.18),rgba(16,185,129,.10));border:1px solid rgba(139,92,246,.35)}
.zt-hero h2{font-size:18px;font-weight:900;color:#fff;margin-bottom:6px}
.zt-hero p{font-size:12px;color:#cbd5e1;line-height:1.6}
.zt-skel{background:linear-gradient(90deg,#111827 25%,#1a2233 50%,#111827 75%);background-size:200% 100%;animation:ztS 1.4s linear infinite;border-radius:10px}
@keyframes ztS{from{background-position:200% 0}to{background-position:-200% 0}}
.zt-gradient-pick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.zt-gradient-swatch{aspect-ratio:1;border-radius:12px;cursor:pointer;border:2px solid rgba(255,255,255,.06);transition:all .18s;position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35)}
.zt-gradient-swatch:hover{border-color:rgba(255,255,255,.18)}
.zt-gradient-swatch.active{border-color:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.22),inset 0 0 0 1px rgba(0,0,0,.35)}
.zt-gradient-swatch.active::after{content:'';position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:#10b981;box-shadow:0 0 8px rgba(16,185,129,.9)}
/* Chat */
.zt-chat-wrap{display:flex;flex-direction:column;height:calc(100vh - 172px)}
.zt-chat-head{padding:12px 14px;border-bottom:1px solid #1e293b;display:flex;align-items:center;gap:10px;flex-shrink:0;background:#0f172a;border-radius:12px 12px 0 0}
.zt-chat-body{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:6px;background:#090d16}
.zt-msg{max-width:75%;padding:9px 13px;border-radius:16px;font-size:13px;line-height:1.4;word-break:break-word;position:relative}
.zt-msg.in{background:#1e293b;color:#f1f5f9;align-self:flex-start;border-bottom-left-radius:4px}
.zt-msg.out{background:linear-gradient(135deg,#8b5cf6,#10b981);color:#000;align-self:flex-end;border-bottom-right-radius:4px}
.zt-msg .t{font-size:9.5px;opacity:.7;display:block;margin-top:3px;font-weight:700}
.zt-msg audio{max-width:220px;height:34px}
.zt-chat-input{display:flex;gap:8px;padding:10px 12px;border-top:1px solid #1e293b;background:#0f172a;flex-shrink:0;border-radius:0 0 12px 12px;align-items:center}
.zt-chat-input textarea{flex:1;background:#111827;border:1px solid #1e293b;border-radius:20px;padding:10px 14px;font-size:13px;color:#fff;outline:none;resize:none;max-height:110px;min-height:40px;font-family:inherit}
.zt-chat-input button.voice{background:#111827;border:1px solid #1e293b;color:#a78bfa;width:42px;height:42px;border-radius:50%;cursor:pointer;flex-shrink:0}
.zt-chat-input button.voice.rec{background:#a16262;border-color:#a16262;color:#fff;animation:ztPulse 1s infinite}
@keyframes ztPulse{0%,100%{opacity:1}50%{opacity:.6}}
.zt-chat-input button.send{padding:0 18px;border-radius:20px;border:none;background:linear-gradient(135deg,#8b5cf6,#10b981);color:#000;font-weight:900;font-size:12px;cursor:pointer;height:42px}
/* Menu tiles */
.zt-tile{background:#111827;border:1px solid #1e293b;border-radius:14px;padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer;text-align:left;width:100%;margin-bottom:10px}
.zt-tile:hover{border-color:#334155}
.zt-tile-icon{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.zt-tile-title{font-size:14px;font-weight:800;color:#fff;margin-bottom:2px}
.zt-tile-sub{font-size:11px;color:#94a3b8}
/* Slide player */
.zt-slide-player{background:#000;border-radius:12px;overflow:hidden;aspect-ratio:16/9;position:relative;margin-bottom:12px}
.zt-slide-player img{width:100%;height:100%;object-fit:contain;background:#000}
.zt-slide-progress{display:flex;gap:4px;margin-bottom:12px}
.zt-slide-dot{flex:1;height:4px;background:#1e293b;border-radius:2px}
.zt-slide-dot.done{background:#10b981}
.zt-slide-dot.active{background:#8b5cf6}
/* Quiz */
.zt-q-opt{padding:12px 14px;border-radius:10px;border:1px solid #1e293b;background:#0f172a;color:#cbd5e1;font-size:13px;font-weight:700;cursor:pointer;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.zt-q-opt.sel{border-color:#8b5cf6;background:rgba(139,92,246,.12);color:#fff}
.zt-q-opt.correct{border-color:#10b981;background:rgba(16,185,129,.12);color:#fff}

ZT.escape = function(s){
  if(s == null) return '';
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
};
ZT.timeAgo = function(ts){
  if(!ts) return '';
  var d = Date.now() - new Date(ts).getTime();
  var m = Math.floor(d/60000);
  if(m < 1) return 'just now';
  if(m < 60) return m + 'm';
  var h = Math.floor(m/60);
  if(h < 24) return h + 'h';
  var days = Math.floor(h/24);
  if(days < 7) return days + 'd';
  return new Date(ts).toLocaleDateString();
};
ZT.uuid = function(){

};

  var t = document.createElement('div');
  t.className = 'zt-toast ' + type;
  var icon = type==='error'?'fa-triangle-exclamation':type==='warning'?'fa-clock':type==='info'?'fa-circle-info':'fa-circle-check';

};

ZT.storeMedia = async function(file){
  if(!file) throw new Error('No file.');
  var me = ZT.State.currentUser;
  if(!me) throw new Error('Login required.');
  if(file.size > 100*1024*1024) throw new Error('Max 100 MB.');
  var ext = 'bin';
  if(file.name && file.name.indexOf('.') > -1) ext = file.name.split('.').pop().toLowerCase();
  var path = me.id + '/tutor/' + Date.now() + '_' + Math.random().toString(36).slice(2,8) + '.' + ext;
  var c = sb(); if(!c) throw new Error('Not connected.');
  var sess = await c.auth.getSession();
  var session = sess && sess.data ? sess.data.session : null;
  if(!session || !session.access_token) throw new Error('Not logged in.');
  var pres = await fetch('/api/r2-presign', {
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer ' + session.access_token},
    body: JSON.stringify({ action:'put', path:path, contentType:file.type||'' })
  });
  if(!pres.ok) throw new Error('Presign failed.');
  var pd = await pres.json();
  if(!pd || !pd.url) throw new Error('No upload URL.');
  var put = await fetch(pd.url, {
    method:'PUT', body: file,
    headers: {'Content-Type': pd.contentType || file.type || 'application/octet-stream'}
  });
  if(!put.ok) throw new Error('Upload failed.');
  return ZT.R2_PUBLIC_BASE + '/' + path;
};

ZT.showView = function(view, param){
  ZT.State.currentView = view;
  ZT.State.currentParam = param || null;
  /* clear chat timer when leaving chat */
  if(view !== 'chat' && ZT.State.chatTimer){ clearInterval(ZT.State.chatTimer); ZT.State.chatTimer = null; }
  document.querySelectorAll('#zt-footer button').forEach(function(b){
    b.classList.toggle('active', b.getAttribute('data-nav') === view);
  });
  var container = document.getElementById('zt-app');
  if(!container) return;
  container.innerHTML = '<div style="padding:40px;text-align:center;color:#64748b;"><i class="fa-solid fa-circle-notch fa-spin" style="font-size:22px;color:#8b5cf6;"></i></div>';
  setTimeout(async function(){
    try {
      var html = await ZT.renderView(view, param);
      container.innerHTML = html || '';
      if(view === 'feed' && ZT.State.currentCircle) setTimeout(function(){ ZT.attachPostInteractions(); }, 30);
    } catch(e){
      console.error('render error', e);
      container.innerHTML = '<div class="zt-empty"><i class="fa-solid fa-triangle-exclamation"></i><p>Something went wrong.</p><button class="zt-btn small" style="width:auto;margin:0 auto;" onclick="ZT.showView(\'' + view + '\')">Retry</button></div>';
    }
  }, 20);
  window.scrollTo(0,0);
};

ZT.renderView = async function(view){
  if(view === 'feed')   return ZT.State.currentCircle ? await ZT.renderCircleFeed() : await ZT.renderLanding();
  if(view === 'chat')   return ZT.State.currentCircle ? await ZT.renderChat() : ZT.renderNoCircleMessage('Chat');
  if(view === 'live')   return ZT.State.currentCircle ? ZT.renderLive() : ZT.renderNoCircleMessage('Live');
  if(view === 'slides') return ZT.State.currentCircle ? await ZT.renderSlidesList() : ZT.renderNoCircleMessage('Slides');
  if(view === 'more')   return ZT.renderMore();
  return await ZT.renderLanding();
};

};

ZT.reloadCircles = async function(){
  var host = document.getElementById('zt-circles-host');
  if(!host) return;
  var c = sb(); if(!c){ host.innerHTML = '<div class="zt-empty"><p>Not connected.</p></div>'; return; }
  try {
    var r = await c.rpc('tutor_search_circles', { p_query: ZT.State.searchQuery || null, p_limit: 60, p_offset: 0 });
    if(r.error){ host.innerHTML = '<div class="zt-empty"><p>Could not load.</p></div>'; return; }
    var list = r.data || [];
    ZT.State.circles = list;
    if(!list.length){
      var q = (ZT.State.searchQuery || '').trim();
      host.innerHTML = '<div class="zt-empty"><i class="fa-solid fa-chalkboard-user"></i><p>' +
        (q ? ('No circles match "' + ZT.escape(q) + '".') : 'No circles yet. Be the first tutor to create one.') + '</p>' +
        (ZT.State.currentUser ? '<button class="zt-btn small" style="width:auto;margin:0 auto;" onclick="ZT.openCreateCircle()">Create a Circle</button>' : '') +
        '</div>';
      return;
    }
    var h = '<div class="zt-grid">';
    list.forEach(function(cir){
      var grad = ZT.gradientCss(cir.banner_gradient);
      var av = cir.avatar_url || ('https://ui-avatars.com/api/?name=' + encodeURIComponent(cir.name) + '&background=111827&color=a78bfa&bold=true');
      var label = cir.is_owner ? 'Owner' : (cir.is_member ? 'Enter' : 'Join');
      var cls = cir.is_owner ? 'owner' : (cir.is_member ? 'enter' : '');
      h += '<div class="zt-circle-card" onclick="ZT.enterCircle(\'' + ZT.escape(cir.id) + '\')">';
      if(cir.is_owner) h += '<span class="zt-owner-badge"><i class="fa-solid fa-crown"></i> YOURS</span>';
      h += '<div class="zt-circle-banner" style="background:' + grad + ';">';
      h += '<img class="zt-circle-av" src="' + ZT.escape(av) + '" alt=""></div>';
      h += '<div class="zt-circle-body">';
      h += '<div class="zt-circle-name" title="' + ZT.escape(cir.name) + '">' + ZT.escape(cir.name) + '</div>';
      h += '<div class="zt-circle-meta"><span><i class="fa-solid fa-users"></i> ' + (cir.member_count||0) + '</span>';
      h += '<span><i class="fa-regular fa-newspaper"></i> ' + (cir.post_count||0) + '</span></div>';
      h += '<div class="zt-circle-action ' + cls + '">' + label + '</div>';
      h += '</div></div>';
    });
    h += '</div>';
    host.innerHTML = h;
  } catch(e){ console.warn(e); host.innerHTML = '<div class="zt-empty"><p>Error.</p></div>'; }
};

ZT.openCreateCircle = function(){
  var me = ZT.State.currentUser;
  if(!me){ ZT.toast('Please log in.', 'error'); return; }
  var gradients = ['emerald','ocean','violet','teal','slate','forest','midnight','deep'];
  var gradHtml = '<div class="zt-gradient-pick">';
  gradients.forEach(function(g, i){
    gradHtml += '<div class="zt-gradient-swatch ' + (i === 0 ? 'active' : '') + '" data-grad="' + g + '" style="background:' + ZT.gradientCss(g) + '" onclick="ZT.pickGradient(\'' + g + '\')"></div>';
  });
  gradHtml += '</div>';
  ZT._createGradient = 'emerald';
  ZT.Modal.open({
    title:'Create Tutor Circle', icon:'fa-solid fa-plus',
    submitLabel:'Create Circle',
    body:'<div class="zt-field"><label class="zt-label">Circle name *</label><input id="zt-cc-name" class="zt-input" placeholder="e.g. Physics with Sir Ahmed" maxlength="60"></div>' +
      '<div class="zt-field"><label class="zt-label">Description</label><textarea id="zt-cc-desc" class="zt-textarea" placeholder="What will you teach? Who is this for?" maxlength="300" style="min-height:80px;"></textarea></div>' +
      '<div class="zt-field"><label class="zt-label">Banner color</label>' + gradHtml + '</div>',
    onSubmit: async function(){
      var name = (document.getElementById('zt-cc-name').value || '').trim();
      var desc = (document.getElementById('zt-cc-desc').value || '').trim();
      if(name.length < 2){ ZT.toast('Name required.', 'error'); return false; }
      var c = sb(); if(!c) return false;
      try {
        var r = await c.rpc('tutor_create_circle', {
          p_name: name, p_description: desc || null,
          p_banner_gradient: ZT._createGradient || 'emerald',
          p_is_public: true
        });
        if(r.error) throw r.error;
        ZT.toast('Circle created!');
        ZT.haptic(15);
        await ZT.enterCircle(r.data.id);
        return true;
      } catch(e){ ZT.toast('Failed: ' + ((e&&e.message)||''), 'error'); return false; }
    }
  });
};

ZT.pickGradient = function(g){
  ZT._createGradient = g;
  document.querySelectorAll('.zt-gradient-swatch').forEach(function(el){
    el.classList.toggle('active', el.getAttribute('data-grad') === g);
  });
};

ZT.enterCircle = async function(circleId){
  var c = sb(); if(!c) return;
  try {
    var mem = await c.from('tutor_members').select('role').eq('circle_id', circleId).eq('user_id', ZT.State.currentUser.id).maybeSingle();
    if(!mem.data){
      var j = await c.rpc('tutor_join_circle', { p_circle_id: circleId });
      if(j.error){
        var m = j.error.message || '';
        if(m.indexOf('circle_full') !== -1) ZT.toast('Circle is full.', 'error');
        else ZT.toast('Could not join.', 'error');
        return;
      }
      ZT.toast('Joined circle!');
    }
    var cr = await c.from('tutor_circles').select('*').eq('id', circleId).maybeSingle();
    if(cr.error || !cr.data){ ZT.toast('Not found.', 'error'); return; }
    ZT.State.currentCircle = cr.data;
    var role = await c.rpc('tutor_my_role', { p_circle_id: circleId });
    ZT.State.myRoleInCircle = (!role.error && role.data) ? role.data : 'student';
    ZT.haptic(12);
    ZT.showView('feed');
  } catch(e){ ZT.toast('Failed.', 'error'); }
};

ZT.exitCircle = function(){
  ZT.State.currentCircle = null;
  ZT.State.myRoleInCircle = null;
  ZT.State.posts = []; ZT.State.reactions = {}; ZT.State.myReactions = {}; ZT.State.comments = {};
  ZT.State.chatThreadId = null; ZT.State.chatMessages = [];
  ZT.showView('feed');
};

  var av = cir.avatar_url || ('https://ui-avatars.com/api/?name=' + encodeURIComponent(cir.name) + '&background=111827&color=a78bfa&bold=true');
  var h = '';
  h += '<div class="zt-circle-head">';
  h += '<button class="back" onclick="ZT.exitCircle()"><i class="fa-solid fa-arrow-left"></i></button>';
  h += '<img class="av" src="' + ZT.escape(av) + '" alt="">';
  h += '<div style="flex:1;min-width:0;"><div class="nm">' + ZT.escape(cir.name) + '</div>';
  h += '<div class="sub">' + (cir.member_count||0) + ' members · ' + (cir.post_count||0) + ' posts</div></div>';
  h += '</div>';
  if(isTutor && me){
    h += '<div class="zt-composer" onclick="ZT.openComposer()">';
    h += '<img src="' + ZT.escape(ZT.safeAvatar(me)) + '">';
    h += '<div class="zt-composer-input">Share a post with your students…</div>';
    h += '<i class="fa-solid fa-pen-to-square" style="color:#8b5cf6;font-size:15px;"></i></div>';
    h += '<div id="zt-composer-host"></div>';
  }
  h += '<div id="zt-posts-host" style="margin-top:14px;"><div style="padding:30px;text-align:center;color:#64748b;"><i class="fa-solid fa-circle-notch fa-spin" style="font-size:20px;color:#8b5cf6;"></i></div></div>';
  setTimeout(function(){ ZT.loadCirclePosts(); }, 30);
  return h;
};

ZT.loadCirclePosts = async function(){
  var host = document.getElementById('zt-posts-host');
  if(!host) return;
  var cir = ZT.State.currentCircle; if(!cir) return;
  var c = sb(); if(!c) return;
  try {
    var r = await c.from('tutor_posts').select('*').eq('circle_id', cir.id).order('is_pinned', { ascending: false }).order('created_at', { ascending: false }).limit(50);
    if(r.error){ host.innerHTML = '<div class="zt-empty"><p>Could not load posts.</p></div>'; return; }
    var posts = r.data || [];
    ZT.State.posts = posts;
    var authorIds = Array.from(new Set(posts.map(function(p){ return p.author_id; })));
    if(authorIds.length){
      var pr = await c.from('profiles').select('id,name,username,avatar').in('id', authorIds);
      (pr.data || []).forEach(function(p){ ZT.State.profileCache[p.id] = p; });
    }
    ZT.State.reactions = {}; ZT.State.myReactions = {}; ZT.State.comments = {};
    if(posts.length){
      var ids = posts.map(function(p){ return p.id; });
      var rx = await c.from('tutor_post_reactions').select('post_id,user_id,reaction').in('post_id', ids);
      (rx.data || []).forEach(function(x){
        if(!ZT.State.reactions[x.post_id]) ZT.State.reactions[x.post_id] = {};
        ZT.State.reactions[x.post_id][x.reaction] = (ZT.State.reactions[x.post_id][x.reaction] || 0) + 1;
        if(ZT.State.currentUser && x.user_id === ZT.State.currentUser.id){
          if(!ZT.State.myReactions[x.post_id]) ZT.State.myReactions[x.post_id] = {};
          ZT.State.myReactions[x.post_id][x.reaction] = true;
        }
      });
      var cm = await c.from('tutor_post_comments').select('*').in('post_id', ids).order('created_at', { ascending: true });
      (cm.data || []).forEach(function(x){
        if(!ZT.State.comments[x.post_id]) ZT.State.comments[x.post_id] = [];
        ZT.State.comments[x.post_id].push(x);
      });
      var cAuthorIds = Array.from(new Set((cm.data || []).map(function(x){ return x.author_id; })));
      var toFetch = cAuthorIds.filter(function(id){ return !ZT.State.profileCache[id]; });
      if(toFetch.length){
        var pr2 = await c.from('profiles').select('id,name,username,avatar').in('id', toFetch);
        (pr2.data || []).forEach(function(p){ ZT.State.profileCache[p.id] = p; });
      }
    }
    if(!posts.length){ host.innerHTML = '<div class="zt-empty"><i class="fa-solid fa-newspaper"></i><p>No posts yet in this circle.</p></div>'; return; }
    var h = '';
    posts.forEach(function(p){ h += ZT.renderPostCard(p); });
    host.innerHTML = h;
    ZT.attachPostInteractions();
  } catch(e){ console.warn(e); host.innerHTML = '<div class="zt-empty"><p>Error.</p></div>'; }
};

ZT.renderPostCard = function(p){
  var me = ZT.State.currentUser;
  var a = ZT.profileOf(p.author_id);
  var reactions = ZT.State.reactions[p.id] || {};
  var myRx = ZT.State.myReactions[p.id] || {};
  var comments = ZT.State.comments[p.id] || [];
  var role = ZT.State.myRoleInCircle || 'student';
  var isTutor = role === 'tutor' || role === 'admin';
  var isMyPost = me && me.id === p.author_id;
  var pinned = !!p.is_pinned;
  var learned = !!ZT.State.markedLearned[p.id];
  var h = '<div class="zt-post" data-post-id="' + ZT.escape(p.id) + '">';
  h += '<div class="zt-post-author"><img src="' + ZT.escape(ZT.safeAvatar(a)) + '">';
  h += '<div style="flex:1;min-width:0;"><div class="pname">' + ZT.escape(a.name || 'User');
  if(a.id === ZT.State.currentCircle.owner_id) h += ' <span class="zt-badge-author">TUTOR</span>';
  if(pinned) h += ' <span class="zt-badge-pinned"><i class="fa-solid fa-thumbtack"></i> PINNED</span>';
  h += '</div><div class="phandle">@' + ZT.escape(a.username || 'user') + ' · ' + ZT.timeAgo(p.created_at) + '</div></div></div>';
  if(p.content) h += '<div class="zt-post-content">' + ZT.escape(p.content) + '</div>';
  if(p.media_url){
    if(p.media_type === 'video') h += '<div class="zt-post-media"><video src="' + ZT.escape(p.media_url) + '" controls playsinline preload="metadata"></video></div>';
    else h += '<div class="zt-post-media"><img src="' + ZT.escape(p.media_url) + '" loading="lazy"></div>';
  }
  h += '<div class="zt-post-reactions">';
  ZT.ALL_REACTIONS.forEach(function(k){
    var r = ZT.Reactions[k];
    var cnt = reactions[k] || 0;
    var active = !!myRx[k];
    h += '<button class="zt-react-btn ' + (active ? 'active' : '') + '" data-react-post="' + ZT.escape(p.id) + '" data-react-key="' + k + '">' + r.symbol + ' <span class="count">' + cnt + '</span></button>';
  });
  h += '</div>';
  h += '<div class="zt-post-actions">';
  h += '<button data-toggle-comments="' + ZT.escape(p.id) + '"><i class="fa-regular fa-comment"></i> ' + comments.length + ' Comments</button>';
  if(isTutor && isMyPost){
    h += '<button data-pin-post="' + ZT.escape(p.id) + '" style="margin-left:auto;"><i class="fa-solid fa-thumbtack"></i> ' + (pinned ? 'Unpin' : 'Pin') + '</button>';
    h += '<button data-del-post="' + ZT.escape(p.id) + '" style="color:#a16262;"><i class="fa-solid fa-trash"></i></button>';
  } else if(!isTutor){
    h += '<button data-learned-post="' + ZT.escape(p.id) + '" style="margin-left:auto;' + (learned ? 'color:#10b981;font-weight:900;' : '') + '">';
    h += '<i class="' + (learned ? 'fa-solid' : 'fa-regular') + ' fa-circle-check"></i> ' + (learned ? 'Learned' : 'Mark as Learned') + '</button>';
  }
  h += '</div>';
  h += '<div class="zt-comments" id="zt-comments-' + ZT.escape(p.id) + '">';
  var listHtml = comments.length
    ? comments.map(function(cm){
        var ca = ZT.profileOf(cm.author_id);
        return '<div class="zt-comment"><span class="cname">' + ZT.escape(ca.name || 'User') + '</span>' + ZT.escape(cm.text) + '</div>';
      }).join('')
    : '<div style="text-align:center;color:#64748b;font-size:11.5px;padding:10px;">No comments yet.</div>';
  h += listHtml;
  h += '<div class="zt-comment-input"><textarea id="zt-ci-' + ZT.escape(p.id) + '" rows="1" placeholder="Write a comment..."></textarea>';
  h += '<button data-add-comment="' + ZT.escape(p.id) + '">Send</button></div>';
  h += '</div></div>';
  return h;
};

ZT.attachPostInteractions = function(){
  var host = document.getElementById('zt-posts-host');
  if(!host || host._wired) return;
  host._wired = true;
  host.addEventListener('click', function(e){
    var rx = e.target.closest('[data-react-post]');
    if(rx){ ZT.toggleReaction(rx.getAttribute('data-react-post'), rx.getAttribute('data-react-key')); return; }
    var tc = e.target.closest('[data-toggle-comments]');
    if(tc){ var el = document.getElementById('zt-comments-' + tc.getAttribute('data-toggle-comments')); if(el) el.classList.toggle('open'); return; }
    var ac = e.target.closest('[data-add-comment]');
    if(ac){ ZT.addComment(ac.getAttribute('data-add-comment')); return; }
    var lp = e.target.closest('[data-learned-post]');
    if(lp){ var id = lp.getAttribute('data-learned-post'); ZT.State.markedLearned[id] = !ZT.State.markedLearned[id]; ZT.haptic(8); ZT.repaintPost(id); return; }
    var pp = e.target.closest('[data-pin-post]');
    if(pp){ ZT.togglePin(pp.getAttribute('data-pin-post')); return; }
    var dp = e.target.closest('[data-del-post]');
    if(dp){ ZT.deletePost(dp.getAttribute('data-del-post')); return; }
  });
};

ZT.toggleReaction = async function(postId, key){
  var me = ZT.State.currentUser;
  if(!me){ ZT.toast('Login required.', 'error'); return; }
  var c = sb(); if(!c) return;
  if(!ZT.State.myReactions[postId]) ZT.State.myReactions[postId] = {};
  if(!ZT.State.reactions[postId]) ZT.State.reactions[postId] = {};
  var already = !!ZT.State.myReactions[postId][key];
  if(already){
    ZT.State.myReactions[postId][key] = false;
    ZT.State.reactions[postId][key] = Math.max(0, (ZT.State.reactions[postId][key] || 1) - 1);
  } else {
    ZT.State.myReactions[postId][key] = true;
    ZT.State.reactions[postId][key] = (ZT.State.reactions[postId][key] || 0) + 1;
  }
  ZT.repaintPost(postId);
  try {
    if(already) await c.from('tutor_post_reactions').delete().eq('post_id', postId).eq('user_id', me.id).eq('reaction', key);
    else { var ins = await c.from('tutor_post_reactions').insert({ post_id: postId, user_id: me.id, reaction: key }); if(ins.error && ins.error.code !== '23505') throw ins.error; }
  } catch(e){
    if(already){ ZT.State.myReactions[postId][key] = true; ZT.State.reactions[postId][key] = (ZT.State.reactions[postId][key] || 0) + 1; }
    else { ZT.State.myReactions[postId][key] = false; ZT.State.reactions[postId][key] = Math.max(0, (ZT.State.reactions[postId][key] || 1) - 1); }
    ZT.repaintPost(postId);
    ZT.toast('Failed.', 'error');
  }
};

ZT.repaintPost = function(postId){
  var post = ZT.State.posts.find(function(x){ return x.id === postId; });
  if(!post) return;
  var card = document.querySelector('[data-post-id="' + postId + '"]');
  if(!card) return;
  var tmp = document.createElement('div');
  tmp.innerHTML = ZT.renderPostCard(post);
  card.parentNode.replaceChild(tmp.firstChild, card);
  var host = document.getElementById('zt-posts-host');
  if(host) host._wired = false;
  ZT.attachPostInteractions();
};

ZT.togglePin = async function(postId){
  var c = sb(); if(!c) return;
  var post = ZT.State.posts.find(function(x){ return x.id === postId; }); if(!post) return;
  var newPin = !post.is_pinned;
  var r = await c.from('tutor_posts').update({ is_pinned: newPin }).eq('id', postId);
  if(r.error){ ZT.toast('Failed.', 'error'); return; }
  ZT.toast(newPin ? 'Pinned.' : 'Unpinned.');
  ZT.loadCirclePosts();
};

ZT.deletePost = async function(postId){
  if(!confirm('Delete this post?')) return;
  var c = sb(); if(!c) return;
  var r = await c.from('tutor_posts').delete().eq('id', postId);
  if(r.error){ ZT.toast('Failed.', 'error'); return; }
  ZT.toast('Deleted.');
  ZT.loadCirclePosts();
};

ZT.addComment = async function(postId){
  var me = ZT.State.currentUser; if(!me) return;
  var inp = document.getElementById('zt-ci-' + postId); if(!inp) return;
  var text = (inp.value || '').trim(); if(!text) return;
  var c = sb(); if(!c) return;
  var newId = ZT.uuid();
  var row = { id: newId, post_id: postId, author_id: me.id, text: text, created_at: new Date().toISOString() };
  if(!ZT.State.comments[postId]) ZT.State.comments[postId] = [];
  ZT.State.comments[postId].push(row);
  inp.value = '';
  if(!ZT.State.profileCache[me.id]) ZT.State.profileCache[me.id] = me;
  ZT.repaintPost(postId);
  var cbox = document.getElementById('zt-comments-' + postId); if(cbox) cbox.classList.add('open');
  try { var r = await c.from('tutor_post_comments').insert(row); if(r.error) throw r.error; }
  catch(e){ ZT.State.comments[postId] = ZT.State.comments[postId].filter(function(x){ return x.id !== newId; }); ZT.repaintPost(postId); ZT.toast('Failed.', 'error'); }
};

ZT.openComposer = function(){
  var host = document.getElementById('zt-composer-host'); if(!host) return;
  var me = ZT.State.currentUser; if(!me) return;
  var avatar = ZT.safeAvatar(me);
  var h = '';
  h += '<div class="zt-composer-expanded" style="margin-top:10px;">';
  h += '<div style="display:flex;gap:10px;align-items:center;"><img src="' + ZT.escape(avatar) + '" style="width:34px;height:34px;border-radius:50%;object-fit:cover;">';
  h += '<div style="font-size:12px;font-weight:800;color:#fff;">Posting as ' + ZT.escape(me.name || 'Tutor') + '</div></div>';
  h += '<div class="zt-composer-chips">';
  h += '<button class="zt-chip active" data-type="text" onclick="ZT.composerType(\'text\')"><i class="fa-solid fa-align-left"></i> Post</button>';
  h += '<button class="zt-chip" data-type="announcement" onclick="ZT.composerType(\'announcement\')"><i class="fa-solid fa-bullhorn"></i> Announcement</button>';
  h += '</div>';
  h += '<textarea id="zt-composer-text" class="zt-textarea" placeholder="Share something with your students…" style="min-height:110px;"></textarea>';
  h += '<div class="zt-media-row">';
  h += '<button class="zt-media-btn" onclick="document.getElementById(\'zt-file-photo\').click()"><i class="fa-solid fa-camera"></i> Photo</button>';
  h += '<button class="zt-media-btn" onclick="document.getElementById(\'zt-file-video\').click()"><i class="fa-solid fa-video"></i> Video</button>';
  h += '</div>';
  h += '<input type="file" id="zt-file-photo" accept="image/*" style="display:none;" onchange="ZT.previewMedia(this,\'photo\')">';
  h += '<input type="file" id="zt-file-video" accept="video/*" style="display:none;" onchange="ZT.previewMedia(this,\'video\')">';
  h += '<div class="zt-preview" id="zt-preview"></div>';
  h += '<div style="display:flex;gap:8px;justify-content:flex-end;">';
  h += '<button class="zt-btn secondary small" onclick="ZT.cancelComposer()">Cancel</button>';
  h += '<button class="zt-btn small" id="zt-publish-btn" onclick="ZT.publishPost()" style="width:auto;"><i class="fa-solid fa-paper-plane"></i> Publish</button>';
  h += '</div></div>';
  host.innerHTML = h;
  ZT._composerType = 'text'; ZT._composerFile = null; ZT._composerKind = null;
};

ZT.composerType = function(type){
  ZT._composerType = type;
  document.querySelectorAll('.zt-chip').forEach(function(c){ c.classList.toggle('active', c.getAttribute('data-type') === type); });
};
ZT.cancelComposer = function(){ var host = document.getElementById('zt-composer-host'); if(host) host.innerHTML = ''; ZT._composerFile = null; ZT._composerKind = null; };

ZT.previewMedia = function(input, kind){
  var f = input && input.files && input.files[0]; if(!f) return;
  if(f.size > 100*1024*1024){ ZT.toast('Max 100 MB.', 'error'); input.value=''; return; }
  ZT._composerFile = f; ZT._composerKind = kind;
  var box = document.getElementById('zt-preview'); if(!box) return;
  var url = URL.createObjectURL(f);
  var inner = kind === 'photo' ? '<img src="' + url + '">' : '<video src="' + url + '" controls></video>';
  inner += '<button class="rm" onclick="ZT.removeMedia()"><i class="fa-solid fa-xmark"></i> Remove</button>';
  box.innerHTML = inner; box.classList.add('show');
  ['zt-file-photo','zt-file-video'].forEach(function(id){ var el = document.getElementById(id); if(el && el !== input) el.value = ''; });
};
ZT.removeMedia = function(){
  ZT._composerFile = null; ZT._composerKind = null;
  ['zt-file-photo','zt-file-video'].forEach(function(id){ var el = document.getElementById(id); if(el) el.value = ''; });
  var box = document.getElementById('zt-preview'); if(box){ box.innerHTML = ''; box.classList.remove('show'); }
};

ZT.publishPost = async function(){
  var me = ZT.State.currentUser; if(!me) return;
  var cir = ZT.State.currentCircle; if(!cir) return;
  var textEl = document.getElementById('zt-composer-text');
  var text = (textEl && textEl.value || '').trim();
  var file = ZT._composerFile;
  if(!text && !file){ ZT.toast('Add text or media.', 'error'); return; }
  var btn = document.getElementById('zt-publish-btn'); if(btn){ btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Publishing…'; }
  var mediaUrl = null, mediaType = null;
  if(file){
    try { mediaUrl = await ZT.storeMedia(file); mediaType = (ZT._composerKind === 'video') ? 'video' : 'image'; }
    catch(e){ ZT.toast('Upload failed.', 'error'); if(btn){ btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Publish'; } return; }
  }
  try {
    var c = sb();
    var r = await c.from('tutor_posts').insert({
      circle_id: cir.id, author_id: me.id, content: text || null,
      media_url: mediaUrl, media_type: mediaType,
      post_type: ZT._composerType || 'text', is_pinned: false
    }).select().maybeSingle();
    if(r.error) throw r.error;
    ZT.toast('Post published.'); ZT.haptic(12);
    ZT._composerFile = null; ZT._composerKind = null; ZT.cancelComposer();
    ZT.loadCirclePosts();
  } catch(e){ ZT.toast('Failed: ' + ((e&&e.message)||''), 'error'); if(btn){ btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Publish'; } }
};

   CHAT
   ============================================================ */
ZT.renderChat = async function(){
  var cir = ZT.State.currentCircle;
  var h = '';
  h += '<div class="zt-circle-head">';
  h += '<button class="back" onclick="ZT.showView(\'feed\')"><i class="fa-solid fa-arrow-left"></i></button>';
  h += '<div style="flex:1;min-width:0;"><div class="nm">Group Chat</div><div class="sub">' + ZT.escape(cir.name) + '</div></div>';
  h += '</div>';
  h += '<div class="zt-chat-wrap" id="zt-chat-wrap">';
  h += '<div class="zt-chat-body" id="zt-chat-body"><div style="text-align:center;color:#64748b;"><i class="fa-solid fa-circle-notch fa-spin"></i></div></div>';
  h += '<div class="zt-chat-input">';
  h += '<textarea id="zt-chat-input" rows="1" placeholder="Type a message..."></textarea>';
  h += '<button class="voice" id="zt-voice-btn" title="Voice note"><i class="fa-solid fa-microphone"></i></button>';
  h += '<button class="send" id="zt-send-btn">Send</button>';
  h += '</div></div>';
  setTimeout(async function(){
    /* Ensure group thread exists */
    var c = sb(); if(!c) return;
    try {
      var th = await c.rpc('tutor_get_group_thread', { p_circle_id: cir.id });
      if(th.error){ console.warn('thread', th.error); ZT.toast('Chat unavailable.', 'error'); return; }
      ZT.State.chatThreadId = th.data;
      await ZT.loadChatMessages();
      ZT.startChatPoll();
      /* Wire input */
      var inp = document.getElementById('zt-chat-input');
      if(inp){
        inp.addEventListener('input', function(){ this.style.height='auto'; this.style.height = Math.min(110, this.scrollHeight) + 'px'; });
        inp.addEventListener('keydown', function(e){ if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); ZT.sendChatText(); } });
      }
      var sb2 = document.getElementById('zt-send-btn');
      if(sb2) sb2.addEventListener('click', ZT.sendChatText);
      var vb = document.getElementById('zt-voice-btn');
      if(vb) vb.addEventListener('click', ZT.toggleVoiceRecording);
    } catch(e){ console.warn(e); }
  }, 30);
  return h;
};

ZT.loadChatMessages = async function(){
  var host = document.getElementById('zt-chat-body'); if(!host) return;
  var c = sb(); if(!c) return;
  var tid = ZT.State.chatThreadId; if(!tid) return;
  try {
    var r = await c.from('tutor_chat_messages').select('*').eq('thread_id', tid).order('created_at', { ascending: true }).limit(200);
    if(r.error){ console.warn(r.error); return; }
    var msgs = r.data || [];
    /* fetch missing profiles */
    var ids = Array.from(new Set(msgs.map(function(m){ return m.sender_id; })));
    var missing = ids.filter(function(id){ return !ZT.State.profileCache[id]; });
    if(missing.length){
      var pr = await c.from('profiles').select('id,name,username,avatar').in('id', missing);
      (pr.data || []).forEach(function(p){ ZT.State.profileCache[p.id] = p; });
    }
    ZT.State.chatMessages = msgs;
    ZT.paintChatMessages();
  } catch(e){}
};

ZT.paintChatMessages = function(){
  var host = document.getElementById('zt-chat-body'); if(!host) return;
  var me = ZT.State.currentUser;
  var msgs = ZT.State.chatMessages || [];
  if(!msgs.length){
    host.innerHTML = '<div style="text-align:center;color:#64748b;font-size:12px;padding:20px;">No messages yet. Say hi!</div>';
    return;
  }
  var wasAtBottom = (host.scrollTop + host.clientHeight) >= (host.scrollHeight - 40);
  var h = '';
  var lastSender = null;
  msgs.forEach(function(m){
    var mine = m.sender_id === me.id;
    var sender = ZT.profileOf(m.sender_id);
    if(!mine && lastSender !== m.sender_id){
      h += '<div style="font-size:10px;color:#94a3b8;font-weight:800;padding:2px 4px;">' + ZT.escape(sender.name || 'User') + '</div>';
    }
    h += '<div class="zt-msg ' + (mine ? 'out' : 'in') + '">';
    if(m.audio_url){
      h += '<audio controls src="' + ZT.escape(m.audio_url) + '"></audio>';
      if(m.audio_seconds) h += '<span style="font-size:10px;opacity:.7;margin-left:6px;">' + m.audio_seconds + 's</span>';
    } else {
      h += ZT.escape(m.body || '');
    }
    h += '<span class="t">' + ZT.timeAgo(m.created_at) + '</span></div>';
    lastSender = m.sender_id;
  });
  host.innerHTML = h;
  if(wasAtBottom) host.scrollTop = host.scrollHeight;
};

ZT.startChatPoll = function(){
  if(ZT.State.chatTimer) clearInterval(ZT.State.chatTimer);
  ZT.State.chatTimer = setInterval(function(){
    if(ZT.State.currentView !== 'chat'){ clearInterval(ZT.State.chatTimer); ZT.State.chatTimer = null; return; }
    if(document.hidden) return;
    ZT.loadChatMessages();
  }, 8000);
};

ZT.sendChatText = async function(){
  var me = ZT.State.currentUser; if(!me) return;
  var inp = document.getElementById('zt-chat-input'); if(!inp) return;
  var body = (inp.value || '').trim(); if(!body) return;
  inp.value = ''; inp.style.height = 'auto';
  var tid = ZT.State.chatThreadId; if(!tid) return;
  /* Optimistic */
  var tmpId = ZT.uuid();

  ZT.State.chatMessages.push(row);

  ZT.paintChatMessages();
  var bodyEl = document.getElementById('zt-chat-body'); if(bodyEl) bodyEl.scrollTop = bodyEl.scrollHeight;
  try {
    var c = sb();
    var r = await c.from('tutor_chat_messages').insert({ thread_id: tid, sender_id: me.id, body: body }).select().maybeSingle();
    if(r.error) throw r.error;
    /* replace optimistic row */
    var idx = ZT.State.chatMessages.findIndex(function(x){ return x.id === tmpId; });
    if(idx >= 0 && r.data) ZT.State.chatMessages[idx] = r.data;
  } catch(e){
    ZT.State.chatMessages = ZT.State.chatMessages.filter(function(x){ return x.id !== tmpId; });
    ZT.paintChatMessages();
    ZT.toast('Send failed.', 'error');
  }
};

ZT._rec = null; ZT._recChunks = []; ZT._recSecs = 0; ZT._recTimer = null;

ZT.toggleVoiceRecording = async function(){
  var btn = document.getElementById('zt-voice-btn'); if(!btn) return;
  if(ZT._rec && ZT._rec.state === 'recording'){ try { ZT._rec.stop(); } catch(e){} return; }
  if(!navigator.mediaDevices || !window.MediaRecorder){ ZT.toast('Voice not supported.', 'error'); return; }
  try {
    var stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    ZT._recChunks = []; ZT._recSecs = 0;

    /* Pick best supported mimetype */
    var mime = '';
    var candidates = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
    for(var i = 0; i < candidates.length; i++){
      try { if(MediaRecorder.isTypeSupported(candidates[i])){ mime = candidates[i]; break; } } catch(e){}
    }
    if(!mime){ ZT.toast('No supported audio format on this browser.', 'error'); return; }

    var rec = new MediaRecorder(stream, { mimeType: mime });
    ZT._rec = rec;

    rec.ondataavailable = function(e){ if(e.data && e.data.size > 0) ZT._recChunks.push(e.data); };

    rec.onstop = async function(){
      try { stream.getTracks().forEach(function(t){ t.stop(); }); } catch(e){}
      if(ZT._recTimer){ clearInterval(ZT._recTimer); ZT._recTimer = null; }
      btn.classList.remove('rec'); btn.innerHTML = '<i class="fa-solid fa-microphone"></i>';
      var secs = ZT._recSecs; var chunks = ZT._recChunks.slice();
      ZT._rec = null; ZT._recChunks = [];
      if(!chunks.length){ ZT.toast('Recording empty.', 'warning'); return; }

      /* Base mimetype only — strip codec suffix for storage */
      var baseMime = (rec.mimeType || mime).split(';')[0].trim();

      var ext = 'webm';
      if(baseMime.indexOf('mp4') !== -1) ext = 'mp4';
      if(baseMime.indexOf('ogg') !== -1) ext = 'ogg';

      var blob = new Blob(chunks, { type: baseMime });
      if(blob.size < 500){ ZT.toast('Recording too short.', 'warning'); return; }

      ZT.toast('Sending voice…');
      try {
        var file = new File([blob], 'voice_' + Date.now() + '.' + ext, { type: baseMime });
        var url = await ZT.storeMedia(file);
        var tid = ZT.State.chatThreadId; if(!tid) return;
        var me = ZT.State.currentUser;
        var c = sb();
        var r = await c.from('tutor_chat_messages').insert({
          thread_id: tid, sender_id: me.id,
          audio_url: url, audio_seconds: secs, body: '🎤 Voice note'
        }).select().maybeSingle();
        if(r.error) throw r.error;
        ZT.State.chatMessages.push(r.data);
        ZT.paintChatMessages();
        var bodyEl = document.getElementById('zt-chat-body'); if(bodyEl) bodyEl.scrollTop = bodyEl.scrollHeight;
      } catch(e){ ZT.toast('Voice send failed: ' + ((e&&e.message)||''), 'error'); }
    };

    rec.start(500);
    btn.classList.add('rec'); btn.innerHTML = '<i class="fa-solid fa-stop"></i>';
    ZT._recTimer = setInterval(function(){
      ZT._recSecs++;
      if(ZT._recSecs >= 60){ try { rec.stop(); } catch(e){} }
    }, 1000);
  } catch(e){ ZT.toast('Mic permission denied.', 'error'); }
};

ZT.recordSlideAudio = async function(i){
  var btn = (typeof event !== 'undefined' && event) ? event.target : null;
  if(!navigator.mediaDevices || !window.MediaRecorder){ ZT.toast('Not supported.', 'error'); return; }
  try {

      try { if(MediaRecorder.isTypeSupported(candidates[x])){ mime = candidates[x]; break; } } catch(e){}
    }

    var rec = new MediaRecorder(stream, { mimeType: mime });
    rec.ondataavailable = function(e){ if(e.data && e.data.size > 0) chunks.push(e.data); };

    var stopped = false;
    var stopRec = function(){
      if(stopped) return; stopped = true;
      try { rec.stop(); } catch(e){}
    };

    rec.onstop = async function(){

      var baseMime = (rec.mimeType || mime).split(';')[0].trim();

ZT.renderSlidePlayer = function(){
  var s = ZT.State.currentSlide;
  if(!s) return '<div class="zt-empty"><p>Not found.</p></div>';
  var items = ZT.State.slideItems;
  var h = '';
  h += '<div class="zt-circle-head"><button class="back" onclick="ZT.showView(\'slides\')"><i class="fa-solid fa-arrow-left"></i></button>';
  h += '<div style="flex:1;min-width:0;"><div class="nm">' + ZT.escape(s.title) + '</div><div class="sub">' + items.length + ' slides</div></div></div>';
  if(!items.length) return h + '<div class="zt-empty"><p>No slides in this lesson.</p></div>';
  h += '<div class="zt-slide-progress" id="zt-slide-progress"></div>';
  h += '<div class="zt-slide-player" id="zt-slide-stage"></div>';

  h += '<button class="zt-btn secondary" id="zt-slide-prev" style="flex:1;">‹ Prev</button>';

  setTimeout(function(){ ZT.paintSlidePlayer(); }, 30);

ZT.paintSlidePlayer = function(){
  var stage = document.getElementById('zt-slide-stage'); if(!stage) return;
  var items = ZT.State.slideItems;
  var idx = ZT.State.slideIndex;
  var it = items[idx];
  if(!it){ stage.innerHTML = ''; return; }
  var h = '';
  if(it.image_url) h += '<img src="' + ZT.escape(it.image_url) + '">';
  else if(it.text_content) h += '<div style="padding:24px;color:#fff;font-size:18px;line-height:1.6;background:#0f172a;height:100%;display:flex;align-items:center;justify-content:center;text-align:center;">' + ZT.escape(it.text_content) + '</div>';
  else h += '<div style="padding:24px;color:#94a3b8;text-align:center;">Empty slide</div>';
  stage.innerHTML = h;
  /* progress */
  var p = document.getElementById('zt-slide-progress');
  if(p){
    var ph = '';
    items.forEach(function(_, i){
      ph += '<div class="zt-slide-dot ' + (i < idx ? 'done' : (i === idx ? 'active' : '')) + '"></div>';
    });
    p.innerHTML = ph;
  }
  /* audio */
  var ah = document.getElementById('zt-slide-audio-host');
  if(ah){
    if(it.audio_url){
      ah.innerHTML = '<audio id="zt-slide-audio" controls src="' + ZT.escape(it.audio_url) + '" style="width:100%;"></audio>';
      ZT.State.slideAudio = document.getElementById('zt-slide-audio');
      ZT.State.slideAudio.addEventListener('ended', function(){ ZT.nextSlide(); });
    } else {
      ah.innerHTML = '';
      ZT.State.slideAudio = null;
    }
  }
  /* wire buttons */
  var pb = document.getElementById('zt-slide-prev');
  var nb = document.getElementById('zt-slide-next');
  if(pb) pb.onclick = ZT.prevSlide;
  if(nb) nb.onclick = ZT.nextSlide;
};

ZT.nextSlide = function(){
  if(ZT.State.slideIndex < ZT.State.slideItems.length - 1){
    ZT.State.slideIndex++;
    ZT.paintSlidePlayer();
    setTimeout(function(){ if(ZT.State.slideAudio) try { ZT.State.slideAudio.play(); } catch(e){} }, 100);
  }
};
ZT.prevSlide = function(){
  if(ZT.State.slideIndex > 0){
    ZT.State.slideIndex--;
    ZT.paintSlidePlayer();
  }
};

ZT.openSubmitAssignment = function(isResubmit){
  var a = ZT.State.currentAssignment;
  var h = '';
  h += '<div class="zt-field"><label class="zt-label">Answer / Notes</label><textarea id="zt-sub-text" class="zt-textarea" placeholder="Type your answer or notes"></textarea></div>';
  h += '<div class="zt-field"><label class="zt-label">File (optional)</label>';
  h += '<button class="zt-media-btn" onclick="document.getElementById(\'zt-sub-file\').click()"><i class="fa-solid fa-cloud-arrow-up"></i> Choose file</button>';
  h += '<input type="file" id="zt-sub-file" accept="image/*,application/pdf" style="display:none;" onchange="ZT.previewSubFile(this)">';
  h += '<div id="zt-sub-preview" style="margin-top:8px;font-size:11px;color:#10b981;"></div></div>';
  ZT._subFile = null;
  ZT.Modal.open({
    title: isResubmit ? 'Resubmit Assignment' : 'Submit Assignment', icon:'fa-solid fa-paper-plane', submitLabel:'Submit',
    body: h,
    onSubmit: async function(){
      var me = ZT.State.currentUser;
      var c = sb(); if(!c) return false;
      var text = (document.getElementById('zt-sub-text').value || '').trim();
      var fileUrl = null;
      if(ZT._subFile){
        try { fileUrl = await ZT.storeMedia(ZT._subFile); }
        catch(e){ ZT.toast('Upload failed.', 'error'); return false; }
      }
      var payload = { assignment_id: a.id, student_id: me.id, text_content: text || null, file_url: fileUrl };
      if(isResubmit){
        var r = await c.from('tutor_submissions').update(payload).eq('assignment_id', a.id).eq('student_id', me.id);
        if(r.error){ ZT.toast('Failed.', 'error'); return false; }
      } else {
        var r2 = await c.from('tutor_submissions').insert(payload);
        if(r2.error){ ZT.toast('Failed.', 'error'); return false; }
      }
      ZT.toast('Submitted!');
      ZT.showView('assignments');
      return true;
    }
  });
};

  if(box) box.innerHTML = '<i class="fa-solid fa-check"></i> ' + ZT.escape(f.name);
};

ZT.openCreateQuiz = function(){
  var cir = ZT.State.currentCircle;
  var me = ZT.State.currentUser;
  ZT._newQuiz = { questions: [] };
  var h = '';
  h += '<div class="zt-field"><label class="zt-label">Quiz title *</label><input id="zt-qz-title" class="zt-input" placeholder="e.g. Chapter 5 Quiz"></div>';
  h += '<div class="zt-field"><label class="zt-label">Time limit (min)</label><input id="zt-qz-time" type="number" class="zt-input" value="15" min="1"></div>';
  h += '<div class="zt-st">Questions (' + ZT._newQuiz.questions.length + ')</div>';
  h += '<div id="zt-qz-host"></div>';
  h += '<button class="zt-btn secondary" id="zt-qz-add" style="margin-top:6px;"><i class="fa-solid fa-plus"></i> Add MCQ</button>';
  ZT.Modal.open({
    title:'New Quiz (MCQ)', icon:'fa-solid fa-list-check', submitLabel:'Save Quiz',
    body: h,
    onOpen: function(){
      ZT.paintQuizBuilder();
      document.getElementById('zt-qz-add').addEventListener('click', function(){
        ZT._newQuiz.questions.push({ question:'', options:['','','',''], correct_index:0 });
        ZT.paintQuizBuilder();
      });
    },
    onSubmit: async function(){
      var title = (document.getElementById('zt-qz-title').value || '').trim();
      if(title.length < 2){ ZT.toast('Title required.', 'error'); return false; }
      if(!ZT._newQuiz.questions.length){ ZT.toast('Add at least one question.', 'error'); return false; }
      for(var i = 0; i < ZT._newQuiz.questions.length; i++){
        var q = ZT._newQuiz.questions[i];
        if(!q.question.trim()){ ZT.toast('Question ' + (i+1) + ' empty.', 'error'); return false; }
        var filled = q.options.filter(function(o){ return (o||'').trim(); });
        if(filled.length < 2){ ZT.toast('Q' + (i+1) + ': at least 2 options.', 'error'); return false; }
      }
      var c = sb();
      var qr = await c.from('tutor_quizzes').insert({ circle_id: cir.id, author_id: me.id, title: title, time_limit_min: parseInt(document.getElementById('zt-qz-time').value)||15 }).select().maybeSingle();
      if(qr.error){ ZT.toast('Failed.', 'error'); return false; }
      var qid = qr.data.id;
      for(var j = 0; j < ZT._newQuiz.questions.length; j++){
        var qq = ZT._newQuiz.questions[j];
        var opts = qq.options.filter(function(o){ return (o||'').trim(); });
        var correctIdx = 0;
        var original = qq.correct_index;
        for(var k = 0; k < original; k++){ if(!(qq.options[k]||'').trim()) correctIdx--; }
        correctIdx = Math.max(0, Math.min(correctIdx, opts.length-1));
        await c.from('tutor_quiz_questions').insert({ quiz_id: qid, order: j, question: qq.question, options: opts, correct_index: correctIdx });
      }
      ZT.toast('Quiz saved.');
      ZT.loadQuizzes();
      return true;
    }
  });
};

ZT.paintQuizBuilder = function(){
  var host = document.getElementById('zt-qz-host'); if(!host) return;
  if(!ZT._newQuiz.questions.length){ host.innerHTML = '<div style="text-align:center;padding:16px;color:#64748b;font-size:12px;">No questions yet.</div>'; return; }
  var h = '';
  ZT._newQuiz.questions.forEach(function(q, i){
    h += '<div style="padding:12px;border-radius:12px;background:#0f172a;border:1px solid #1e293b;margin-bottom:8px;">';
    h += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">';
    h += '<div style="font-size:11px;font-weight:900;color:#94a3b8;">Q' + (i+1) + '</div>';
    h += '<button style="background:transparent;border:none;color:#a16262;cursor:pointer;" onclick="ZT.removeQuizQuestion(' + i + ')"><i class="fa-solid fa-trash"></i></button></div>';
    h += '<textarea class="zt-textarea" style="min-height:44px;font-size:12px;" placeholder="Question" onchange="ZT.setQText(' + i + ', this.value)">' + ZT.escape(q.question) + '</textarea>';
    for(var j = 0; j < 4; j++){
      h += '<div style="display:flex;gap:6px;margin-top:6px;align-items:center;">';
      h += '<input type="radio" name="qz-c-' + i + '" ' + (q.correct_index === j ? 'checked' : '') + ' onchange="ZT.setQCorrect(' + i + ',' + j + ')" style="flex-shrink:0;">';
      h += '<input class="zt-input" style="font-size:12px;padding:8px;" placeholder="Option ' + (j+1) + '" value="' + ZT.escape(q.options[j] || '') + '" onchange="ZT.setQOpt(' + i + ',' + j + ', this.value)">';
      h += '</div>';
    }
    h += '</div>';
  });
  host.innerHTML = h;
};

ZT.removeQuizQuestion = function(i){ ZT._newQuiz.questions.splice(i, 1); ZT.paintQuizBuilder(); };
ZT.setQText = function(i, v){ if(ZT._newQuiz.questions[i]) ZT._newQuiz.questions[i].question = v; };
ZT.setQOpt = function(i, j, v){ if(ZT._newQuiz.questions[i]) ZT._newQuiz.questions[i].options[j] = v; };
ZT.setQCorrect = function(i, j){ if(ZT._newQuiz.questions[i]) ZT._newQuiz.questions[i].correct_index = j; };

ZT.openQuiz = async function(quizId){
  var c = sb(); if(!c) return;
  var q = await c.from('tutor_quizzes').select('*').eq('id', quizId).maybeSingle();
  if(q.error || !q.data){ ZT.toast('Not found.', 'error'); return; }
  ZT.State.currentQuiz = q.data;
  var qq = await c.from('tutor_quiz_questions').select('*').eq('quiz_id', quizId).order('order', { ascending: true });
  ZT.State.currentQuizQuestions = qq.data || [];
  ZT.State.quizAnswers = {};
  ZT.State.quizIndex = 0;
  /* check attempt */
  var att = await c.from('tutor_quiz_attempts').select('*').eq('quiz_id', quizId).eq('student_id', ZT.State.currentUser.id).maybeSingle();
  ZT.State.currentQuizAttempt = att.data || null;
  ZT.showView('quiz-detail', quizId);
};

ZT.renderQuizDetail = function(){
  var q = ZT.State.currentQuiz; if(!q) return '<div class="zt-empty"><p>Not found.</p></div>';
  var role = ZT.State.myRoleInCircle || 'student';
  var isTutor = role === 'tutor' || role === 'admin';
  var att = ZT.State.currentQuizAttempt;
  var questions = ZT.State.currentQuizQuestions;
  var h = '';
  h += '<div class="zt-circle-head"><button class="back" onclick="ZT.showView(\'quizzes\')"><i class="fa-solid fa-arrow-left"></i></button>';
  h += '<div style="flex:1;min-width:0;"><div class="nm">' + ZT.escape(q.title) + '</div>';
  h += '<div class="sub">' + questions.length + ' questions · ' + (q.time_limit_min||15) + ' min</div></div></div>';
  if(isTutor){
    h += '<div class="zt-card"><div class="zt-st" style="margin-top:0;">Answer key</div>';
    questions.forEach(function(qq, i){
      h += '<div style="padding:10px 0;border-bottom:1px solid #1e293b;font-size:12px;color:#cbd5e1;"><b style="color:#a78bfa;">Q' + (i+1) + '.</b> ' + ZT.escape(qq.question) + '<br>';
      h += '<span style="color:#10b981;">✓ ' + ZT.escape((qq.options||[])[qq.correct_index] || '') + '</span></div>';
    });
    h += '</div>';
    return h;
  }
  if(att){
    h += '<div class="zt-card" style="text-align:center;">';
    h += '<div style="font-size:12px;color:#94a3b8;font-weight:900;letter-spacing:.5px;">YOUR SCORE</div>';
    h += '<div style="font-size:42px;font-weight:900;color:#10b981;margin-top:6px;">' + att.score + ' / ' + att.total + '</div>';
    h += '<div style="font-size:11px;color:#64748b;margin-top:6px;">Submitted ' + ZT.timeAgo(att.submitted_at) + '</div></div>';
    h += '<div class="zt-st">Answers</div>';
    questions.forEach(function(qq, i){
      h += '<div class="zt-card" style="padding:12px;">';
      h += '<div style="font-size:12px;font-weight:800;color:#fff;margin-bottom:8px;">Q' + (i+1) + '. ' + ZT.escape(qq.question) + '</div>';
      (qq.options||[]).forEach(function(opt, j){
        var cls = '';
        if(j === qq.correct_index) cls = 'correct';
        h += '<div class="zt-q-opt ' + cls + '" style="cursor:default;">' + ZT.escape(opt) + '</div>';
      });
      h += '</div>';
    });
    return h;
  }
  /* Quiz take flow */
  h += '<div id="zt-quiz-take-host"></div>';
  setTimeout(ZT.paintQuizTake, 30);
  return h;
};

ZT.paintQuizTake = function(){
  var host = document.getElementById('zt-quiz-take-host'); if(!host) return;
  var qs = ZT.State.currentQuizQuestions;
  var idx = ZT.State.quizIndex || 0;
  var q = qs[idx];
  if(!q){ host.innerHTML = ''; return; }
  var h = '';
  h += '<div style="font-size:11px;color:#94a3b8;font-weight:900;letter-spacing:.5px;margin-bottom:8px;">QUESTION ' + (idx+1) + ' / ' + qs.length + '</div>';
  h += '<div class="zt-card" style="font-size:14px;color:#fff;font-weight:800;line-height:1.5;">' + ZT.escape(q.question) + '</div>';
  (q.options || []).forEach(function(opt, j){
    var sel = ZT.State.quizAnswers[idx] === j;
    h += '<div class="zt-q-opt ' + (sel ? 'sel' : '') + '" data-quiz-opt="' + j + '">' + ZT.escape(opt) + '</div>';
  });
  h += '<div style="display:flex;gap:8px;margin-top:14px;">';
  if(idx > 0) h += '<button class="zt-btn secondary" id="zt-q-prev" style="flex:1;">‹ Prev</button>';
  if(idx < qs.length - 1) h += '<button class="zt-btn" id="zt-q-next" style="flex:1;">Next ›</button>';
  else h += '<button class="zt-btn" id="zt-q-submit" style="flex:1;">Submit Quiz</button>';
  h += '</div>';
  host.innerHTML = h;
  host.querySelectorAll('[data-quiz-opt]').forEach(function(el){
    el.addEventListener('click', function(){
      ZT.State.quizAnswers[idx] = parseInt(this.getAttribute('data-quiz-opt'));
      ZT.paintQuizTake();
    });
  });
  var pb = document.getElementById('zt-q-prev'); if(pb) pb.onclick = function(){ ZT.State.quizIndex--; ZT.paintQuizTake(); };
  var nb = document.getElementById('zt-q-next'); if(nb) nb.onclick = function(){ ZT.State.quizIndex++; ZT.paintQuizTake(); };
  var sb2 = document.getElementById('zt-q-submit'); if(sb2) sb2.onclick = ZT.submitQuizAttempt;
};

ZT.submitQuizAttempt = async function(){
  var qs = ZT.State.currentQuizQuestions;
  for(var i = 0; i < qs.length; i++){
    if(ZT.State.quizAnswers[i] == null){ ZT.toast('Answer Q' + (i+1) + ' first.', 'warning'); return; }
  }
  var score = 0;
  qs.forEach(function(q, i){ if(ZT.State.quizAnswers[i] === q.correct_index) score++; });
  var c = sb();
  try {
    var r = await c.from('tutor_quiz_attempts').insert({
      quiz_id: ZT.State.currentQuiz.id, student_id: ZT.State.currentUser.id,
      score: score, total: qs.length
    }).select().maybeSingle();
    if(r.error) throw r.error;
    ZT.State.currentQuizAttempt = r.data;
    ZT.toast('Submitted! Score: ' + score + '/' + qs.length);
    ZT.haptic(15);
    ZT.showView('quiz-detail', ZT.State.currentQuiz.id);
  } catch(e){ ZT.toast('Submit failed.', 'error'); }
};

/* ============================================================
   ROUTER EXTENSIONS
   ============================================================ */
var _origRenderView = ZT.renderView;
ZT.renderView = async function(view, param){
  if(view === 'slide-player') return ZT.renderSlidePlayer();
  if(view === 'assignments') return await ZT.renderAssignments();
  if(view === 'assignment-detail') return await ZT.renderAssignmentDetail();
  if(view === 'quizzes') return await ZT.renderQuizzes();
  if(view === 'quiz-detail') return ZT.renderQuizDetail();
  return await _origRenderView.call(this, view, param);
};

/* ============================================================
   BOOT
   ============================================================ */
async function boot(){
  try {
    var c = sb();
    if(c){
      var s = await c.auth.getSession();
      var user = s && s.data && s.data.session ? s.data.session.user : null;
      if(user){
        var pr = await c.from('profiles').select('*').eq('id', user.id).maybeSingle();
        ZT.State.currentUser = pr.data || {
          id: user.id,
          name: (user.user_metadata && user.user_metadata.name) || 'User',
          username: (user.email||'').split('@')[0],
          email: user.email,
          avatar: 'https://ui-avatars.com/api/?name=' + encodeURIComponent(user.email||'U') + '&background=8b5cf6&color=000'
        };
        ZT.State.profileCache[ZT.State.currentUser.id] = ZT.State.currentUser;
      }
    }
  } catch(e){ console.warn('session', e); }
  setTimeout(function(){ var w = document.getElementById('zt-welcome'); if(w) w.classList.add('fadeout'); }, 400);
  ZT.showView('feed');
  console.log('[ZYNIX Tutor v3] booted · user=' + (ZT.State.currentUser ? ZT.State.currentUser.name : 'guest'));
}
if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
</script>

<!DOCTYPE html> 
<!-- By the name of the Lord — ZYNIX production build v3.4 -->
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>ZYNIX — Social Platform</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* ============================================================
   1. BASE / RESET
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#090d16;color:#f8fafc;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding-bottom:80px;overflow-x:hidden}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:#090d16}
::-webkit-scrollbar-thumb{background:#1e293b;border-radius:4px}

/* ============================================================
   2. HEADER + BOTTOM NAV
   ============================================================ */
.zynix-header{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(9,13,22,.92);backdrop-filter:blur(12px);border-bottom:1px solid #1e293b;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;min-height:56px}
.header-logo{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#10b981,#3b82f6);display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;font-size:14px}
.header-title{font-size:18px;font-weight:900;background:linear-gradient(90deg,#10b981,#3b82f6,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
.header-btn{background:transparent;border:none;color:#3b82f6;cursor:pointer;padding:6px;position:relative;transition:color .2s}
.header-btn.active{color:#10b981}
@media(hover:hover){.header-btn:hover{color:#10b981}}
.wallet-pill{background:rgba(15,23,42,.9);border:1px solid #1e293b;border-radius:20px;padding:4px 10px;font-size:10px;display:flex;align-items:center;gap:6px;transition:box-shadow .3s, border-color .2s;position:relative;cursor:pointer}
.wallet-pill.active{border-color:#10b981;color:#10b981}
.wallet-pill.pulse{box-shadow:0 0 24px rgba(16,185,129,.6)}
.wallet-pill .wallet-badge{position:absolute;top:-6px;right:-6px;background:#3b82f6;color:#fff;font-size:9px;font-weight:900;min-width:16px;height:16px;border-radius:8px;padding:0 4px;display:none;align-items:center;justify-content:center;box-shadow:0 0 8px rgba(59,130,246,.6);z-index:2}
.zynix-footer{position:fixed;bottom:0;left:0;right:0;z-index:1000;background:rgba(9,13,22,.95);backdrop-filter:blur(12px);border-top:1px solid #1e293b;padding:8px 0;display:flex;align-items:center;justify-content:space-around;max-width:600px;margin:0 auto}
.zynix-footer button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 0;color:#64748b;transition:color .2s;background:transparent;border:none;font-size:9px;cursor:pointer;font-weight:500;position:relative}
.zynix-footer button i{font-size:18px;margin-bottom:2px}
.zynix-footer button.active{color:#10b981}
@media(hover:hover){.zynix-footer button:hover{color:#10b981}}
.zynix-footer .create-btn{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#10b981,#3b82f6);color:#000;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:-16px;box-shadow:0 4px 20px rgba(16,185,129,.3);flex:none}
.zynix-footer .create-btn i{font-size:20px;margin:0}
#scroll-top-btn{position:fixed;bottom:96px;right:16px;z-index:900;width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,#10b981,#3b82f6);color:#000;border:none;cursor:pointer;box-shadow:0 4px 20px rgba(16,185,129,.45);align-items:center;justify-content:center;font-size:16px;font-weight:900;display:none;transition:transform .15s,opacity .2s}
#scroll-top-btn:active{transform:scale(.9)}
#app-container{max-width:600px;margin:0 auto;padding:76px 14px 20px;min-height:calc(100vh - 80px)}

/* ============================================================
   3. PULL-TO-REFRESH INDICATOR
   ============================================================ */
.zynix-pull-indicator{position:fixed;top:56px;left:50%;transform:translate(-50%,-60px);z-index:950;background:rgba(15,23,42,.95);border:1px solid #1e293b;color:#10b981;font-size:11px;font-weight:700;padding:6px 14px;border-radius:20px;display:flex;align-items:center;gap:6px;transition:transform .25s ease,opacity .25s ease;opacity:0;pointer-events:none}
.zynix-pull-indicator.visible{transform:translate(-50%,4px);opacity:1}
.zynix-pull-indicator.spinning i{animation:zynixSpin .8s linear infinite}
@keyframes zynixSpin{to{transform:rotate(360deg)}}

/* ============================================================
   4. STATUS STRIP + VIEWER
   ============================================================ */
.status-row-wrap{background:#111827;border:1px solid #1e293b;border-radius:16px;padding:12px;margin-bottom:14px}
.status-scroll{display:flex;gap:10px;overflow-x:auto;padding:4px 0;scrollbar-width:none;-ms-overflow-style:none}
.status-scroll::-webkit-scrollbar{display:none}
.status-item{flex-shrink:0;width:68px;text-align:center;background:transparent;border:none;cursor:pointer;padding:0}
.status-ring-unseen{background:linear-gradient(135deg,#10b981,#3b82f6,#8b5cf6);padding:3px;border-radius:50%;width:58px;height:58px;margin:0 auto}
.status-ring-seen{background:#1e293b;padding:3px;border-radius:50%;width:58px;height:58px;margin:0 auto}
.status-ring-inner{width:100%;height:100%;border-radius:50%;background:#090d16;padding:2px}
.status-ring-inner img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.status-label{font-size:9px;font-weight:600;color:#94a3b8;display:block;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.status-home-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:8px 0}
.status-home-card{text-align:center;background:transparent;border:none;cursor:pointer;padding:8px 4px;border-radius:12px}
.status-home-card:hover{background:#111827}
.status-home-ring-unseen{background:linear-gradient(135deg,#10b981,#3b82f6,#8b5cf6);padding:4px;border-radius:50%;width:88px;height:88px;margin:0 auto}
.status-home-ring-seen{background:#1e293b;padding:4px;border-radius:50%;width:88px;height:88px;margin:0 auto}
.status-home-ring-inner{width:100%;height:100%;border-radius:50%;background:#090d16;padding:3px}
.status-home-ring-inner img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.status-home-name{font-size:11px;font-weight:600;color:#e2e8f0;display:block;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status-home-count{font-size:9px;color:#64748b;display:block;margin-top:2px}
.status-bg-deep-blue{background:linear-gradient(135deg,#1e3a8a,#312e81);color:#fff}
.status-bg-navy{background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff}
.status-bg-purple{background:linear-gradient(135deg,#4c1d95,#5b21b6);color:#fff}
.status-bg-teal{background:linear-gradient(135deg,#0d9488,#0f766e);color:#fff}
.status-bg-green{background:linear-gradient(135deg,#065f46,#047857);color:#fff}
.status-bg-burgundy{background:linear-gradient(135deg,#7f1d1d,#991b1b);color:#fff}
.status-bg-rose{background:linear-gradient(135deg,#9f1239,#be123c);color:#fff}
.status-bg-plum{background:linear-gradient(135deg,#581c87,#701a75);color:#fff}
.status-bg-slate{background:linear-gradient(135deg,#334155,#475569);color:#fff}
.status-viewer-overlay{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.98);display:flex;flex-direction:column;color:#fff}
.status-viewer-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.05);flex-shrink:0}
.status-viewer-body{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0;overflow:hidden;touch-action:none}
.status-stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#000;height:clamp(320px,58vh,620px);position:relative;border-radius:12px;overflow:hidden}
.status-stage img,.status-stage video{width:100%;height:100%;object-fit:contain;max-width:100%;max-height:100%}
.status-nav-btn{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1);color:#fff;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;z-index:10}
.status-nav-btn.left{left:10px}
.status-nav-btn.right{right:10px}
.status-viewer-footer{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid rgba(255,255,255,.05);flex-shrink:0;height:68px}
.status-viewer-footer button{padding:8px 20px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#fff;font-size:12px;cursor:pointer;font-weight:600}
.status-progress-bar{position:absolute;top:0;left:0;height:3px;background:#10b981;z-index:20;transition:width .1s linear}
.status-progress-track{position:absolute;top:0;left:0;right:0;height:3px;background:rgba(255,255,255,.1);z-index:19}
.circle-x-btn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.circle-x-btn:hover{background:rgba(239,68,68,.25);border-color:rgba(239,68,68,.5);color:#fca5a5}
.colored-back-btn{background:#10b981;color:#000;border:none;padding:8px 16px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}

/* ============================================================
   5. POST CARD
   ============================================================ */
.post-card{background:#111827;border:1px solid #1e293b;border-radius:16px;padding:14px;margin-bottom:12px;position:relative;transition:border-color .4s ease}
.post-card.zynix-new-item{border-color:rgba(16,185,129,.55);box-shadow:0 0 0 1px rgba(16,185,129,.18)}
.post-author{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.post-author img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:1px solid #1e293b}
.post-author .pname{font-weight:700;font-size:13px;color:#fff}
.post-author .phandle{font-size:10px;color:#64748b}
.post-content{font-size:13px;color:#e2e8f0;line-height:1.6;margin-bottom:10px;white-space:pre-wrap;word-break:break-word}
.post-media{border-radius:12px;overflow:hidden;margin-bottom:10px;background:#0f172a;position:relative;aspect-ratio:4/5;min-height:0;max-height:none}
.post-media.has-image{aspect-ratio:auto;background:transparent}
.post-media img,.post-media video{width:100%;height:100%;min-height:0;max-height:none;color:transparent;font-size:0;line-height:0}
.post-media img{object-fit:contain;background:#0f172a;display:block}
.post-media.has-image img{height:auto;max-height:600px}
.post-media video{object-fit:contain;background:#000;display:block}
@media(min-width:900px){
  .post-media.has-video{aspect-ratio:16/10}
}
.post-heart-burst{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:70px;pointer-events:none;opacity:0}
.post-heart-burst.animate{animation:zynixHeartBurst 1s ease forwards}
@keyframes zynixHeartBurst{0%{transform:translate(-50%,-50%) scale(.2);opacity:0}25%{transform:translate(-50%,-50%) scale(1.15);opacity:1}60%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(1.4);opacity:0}}

/* ============================================================
   6. REACTIONS
   ============================================================ */
.post-reactions{display:flex;flex-wrap:wrap;gap:4px;padding:8px 0;border-top:1px solid #1e293b;align-items:center;min-height:44px}
.react-btn{padding:4px 8px;border-radius:14px;font-size:14px;background:transparent;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:3px;color:#fff;transition:all .15s;position:relative}
.react-btn:hover{background:#1e293b}
.react-btn.active{background:rgba(16,185,129,.15);border-color:rgba(16,185,129,.3);cursor:default}
.react-btn.active:hover{background:rgba(16,185,129,.15)}
.react-btn.disabled-reaction{opacity:.35;cursor:not-allowed}
.react-btn.disabled-reaction:hover{background:transparent}
.react-btn.frozen-reaction{cursor:pointer;opacity:.55}
.react-btn.frozen-reaction:hover{background:#1e293b;opacity:.85}
.react-btn .count{font-size:10px;color:#64748b;font-weight:700;line-height:1}
.react-btn.active .count{color:#10b981}
.react-btn .bounty{font-size:9px;color:#10b981;font-weight:700;line-height:1;margin-left:1px}
.react-star{filter:drop-shadow(0 0 6px rgba(96,165,250,.9)) drop-shadow(0 0 12px rgba(147,197,253,.5))}
.zynix-reaction-picker{position:fixed;z-index:10050;background:#111827;border:1px solid #1e293b;border-radius:14px;padding:8px;display:flex;gap:6px;box-shadow:0 8px 32px rgba(0,0,0,.7);animation:zynixFadeIn .15s ease}
.zynix-reaction-picker button{width:40px;height:40px;border-radius:50%;background:transparent;border:none;cursor:pointer;font-size:22px;display:flex;align-items:center;justify-content:center}
.zynix-reaction-picker button:hover{background:#1e293b}
.post-actions{display:flex;gap:16px;padding-top:8px;border-top:1px solid #1e293b;font-size:12px;color:#64748b}
.post-actions button{background:transparent;border:none;color:#64748b;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:4px;padding:4px 0}
.post-actions button:hover{color:#e2e8f0}

/* ============================================================
   7. FREEZE DOT
   ============================================================ */
.freeze-dot{position:relative;width:18px;height:18px;border-radius:50%;flex-shrink:0;margin-left:auto;cursor:pointer;padding:0;transition:all .2s ease;border:1.5px solid rgba(255,255,255,.25);background:#3b82f6;box-shadow:0 0 8px rgba(59,130,246,.55)}
.freeze-dot.unfrozen{background:#10b981;box-shadow:0 0 8px rgba(16,185,129,.65);border-color:rgba(16,185,129,.55)}
.freeze-dot:hover{transform:scale(1.2)}
.freeze-dot:active{transform:scale(.9)}
.freeze-dot.lg{width:24px;height:24px;margin-left:0}
.freeze-dot.blink{animation:freezeBlink .35s ease 3}
@keyframes freezeBlink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(1.35)}}
.freeze-dot::after{content:attr(data-tip);position:absolute;right:calc(100% + 8px);top:50%;transform:translateY(-50%);background:rgba(15,23,42,.96);color:#f8fafc;font-size:10px;font-weight:700;padding:4px 8px;border-radius:6px;white-space:nowrap;border:1px solid #1e293b;opacity:0;pointer-events:none;transition:opacity .15s;z-index:100}
.freeze-dot:hover::after{opacity:1}
.freeze-tooltip-top{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:rgba(15,23,42,.98);color:#fca5a5;font-size:10px;font-weight:700;padding:5px 10px;border-radius:8px;white-space:nowrap;border:1px solid rgba(239,68,68,.5);box-shadow:0 4px 14px rgba(0,0,0,.6);z-index:200;pointer-events:none;animation:freezeTipFade 2s ease forwards}
.freeze-tooltip-top::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:rgba(15,23,42,.98)}
@keyframes freezeTipFade{0%{opacity:0;transform:translateX(-50%) translateY(4px)}15%{opacity:1;transform:translateX(-50%) translateY(0)}85%{opacity:1;transform:translateX(-50%) translateY(0)}100%{opacity:0;transform:translateX(-50%) translateY(-4px)}}

/* ============================================================
   8. COMMENTS
   ============================================================ */
.post-comments{margin-top:10px;padding-top:10px;border-top:1px solid #1e293b;display:none}
.post-comments.open{display:block}
.comment-item{padding:10px 12px;border-radius:12px;margin-bottom:6px;font-size:12px;word-break:break-word;position:relative}
.comment-item.light-green{background:#dcfce7;color:#052e16}
.comment-item.light-blue{background:#dbeafe;color:#172554}
.comment-item.light-yellow{background:#fef3c7;color:#451a03}
.comment-item.light-pink{background:#fce7f3;color:#500724}
.comment-item.light-purple{background:#ede9fe;color:#2e1065}
.comment-item.hidden-comment{opacity:.55;font-style:italic;border:1px dashed rgba(0,0,0,.2)}
.comment-item .cname{font-weight:700;margin-right:6px;opacity:.9}
.comment-item .ctext{white-space:pre-wrap}
.comment-reactions{display:flex;flex-wrap:wrap;gap:2px;margin-top:6px;align-items:center}
.comment-react{background:rgba(0,0,0,.06);border:none;padding:2px 6px;border-radius:10px;font-size:11px;cursor:pointer;display:inline-flex;align-items:center;gap:2px;color:inherit;opacity:.75}
.comment-react:hover{opacity:1}
.comment-react.active{background:rgba(16,185,129,.25);opacity:1;font-weight:700;cursor:default}
.comment-react.disabled-reaction{opacity:.35;cursor:not-allowed}
.comment-react.frozen-reaction{cursor:pointer;opacity:.55}
.comment-react .cb{font-size:8px;color:#059669;font-weight:700}
.comment-actions{display:flex;gap:12px;margin-top:4px;font-size:10px;opacity:.75;align-items:center;flex-wrap:wrap}
.comment-actions button{background:transparent;border:none;color:inherit;cursor:pointer;font-size:10px;padding:0;font-weight:600;text-decoration:underline;opacity:.85}
.comment-actions button:hover{opacity:1}
.comment-replies{margin-top:6px;padding-left:10px;border-left:2px solid rgba(0,0,0,.15)}
.comment-replies .comment-item{padding:8px 10px;font-size:11px;margin-bottom:6px}
.comment-replies .comment-replies{padding-left:8px}
.comment-color-picker{display:flex;gap:6px;margin-top:6px;margin-bottom:4px}
.comment-color-dot{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.comment-color-dot.selected{border-color:#10b981}
.comment-color-dot.c-green{background:#dcfce7}
.comment-color-dot.c-blue{background:#dbeafe}
.comment-color-dot.c-yellow{background:#fef3c7}
.comment-color-dot.c-pink{background:#fce7f3}
.comment-color-dot.c-purple{background:#ede9fe}
.comment-input-wrap{display:flex;gap:8px;margin-top:8px;align-items:flex-end}
.comment-input-wrap textarea{flex:1;background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:10px 12px;font-size:12px;color:#fff;outline:none;resize:none;max-height:150px;font-family:inherit;min-height:38px}
.comment-input-wrap textarea:focus{border-color:#10b981}
.comment-input-wrap button{background:#10b981;border:none;color:#000;font-weight:700;padding:8px 16px;border-radius:8px;font-size:11px;cursor:pointer;height:38px}
.reply-editor{margin-top:6px;display:flex;gap:6px;align-items:flex-end}
.reply-editor textarea{flex:1;background:rgba(15,23,42,.9);border:1px solid #1e293b;border-radius:8px;padding:8px 10px;font-size:11px;color:#fff;outline:none;resize:none;max-height:100px;font-family:inherit;min-height:34px}
.reply-editor textarea:focus{border-color:#10b981}
.reply-editor button{padding:8px 12px;border-radius:8px;border:none;font-size:11px;font-weight:700;cursor:pointer;height:34px}
.reply-editor .save{background:#10b981;color:#000}
.reply-editor .cancel{background:transparent;color:#64748b}

/* ============================================================
   9. MODALS / SHEETS / FORMS
   ============================================================ */
.modal-overlay{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:#111827;border:1px solid #1e293b;border-radius:16px;max-width:440px;width:100%;max-height:90vh;overflow-y:auto;padding:20px}
.modal-header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1e293b;padding-bottom:12px;margin-bottom:16px}
.modal-header h3{font-size:16px;font-weight:700;color:#fff}
.modal-close{width:36px;height:36px;border-radius:50%;background:#1e293b;border:none;color:#94a3b8;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.form-label{display:block;font-size:11px;font-weight:600;color:#64748b;margin-bottom:4px}
.form-input,.form-select,.form-textarea{width:100%;background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:10px 12px;font-size:12px;color:#fff;outline:none;margin-bottom:12px;font-family:inherit}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:#10b981}
.form-textarea{min-height:90px;resize:vertical}
.btn-primary{width:100%;background:#10b981;border:none;color:#000;font-weight:700;padding:12px;border-radius:10px;font-size:13px;cursor:pointer}
.btn-secondary{width:100%;background:#1e293b;border:none;color:#fff;font-weight:600;padding:10px;border-radius:8px;font-size:12px;cursor:pointer;margin-top:8px}
.bottom-sheet{position:fixed;left:0;right:0;bottom:0;z-index:10001;background:#111827;border-top-left-radius:20px;border-top-right-radius:20px;border-top:1px solid #1e293b;max-height:70vh;display:flex;flex-direction:column;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes zynixFadeIn{from{opacity:0}to{opacity:1}}
.sheet-handle{width:40px;height:4px;background:#334155;border-radius:2px;margin:8px auto 0}
.sheet-header{padding:12px 16px;border-bottom:1px solid #1e293b;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.sheet-body{padding:12px 16px;overflow-y:auto;flex:1}

/* ============================================================
   MEDIA UPLOAD — R2 via /api/r2-presign (server-signed).
   The browser requests a presigned PUT URL from the Vercel
   serverless function, then PUTs the file directly to R2.
   The R2 secret never leaves the server.
   Client-side allowlist rejects unsupported extensions before
   any network call. The server enforces its own list too.
   ============================================================ */
Z._ALLOWED_MEDIA_EXT = ['jpg','jpeg','png','webp','gif','mp4','webm','mov','m4v','3gp'];

Z.storeMedia = async function(file){
  if(!file) throw new Error('No file provided.');
  var me = Z.State.currentUser;
  if(!me) throw new Error('Not logged in.');
  if(file.size > 100*1024*1024) throw new Error('File too large (max 100 MB).');

  var ext = 'bin';
  if(file.name && file.name.indexOf('.') > -1) ext = file.name.split('.').pop().toLowerCase();
  else if(file.type){
    var mm = {'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif',
              'video/mp4':'mp4','video/webm':'webm','video/quicktime':'mov','video/3gpp':'3gp'};
    ext = mm[file.type] || 'bin';
  }

  /* Client-side allowlist — reject unsupported extensions before we
     ever contact the server. The server also enforces this list. */
  if(Z._ALLOWED_MEDIA_EXT.indexOf(ext) === -1){
    var eType = 'Unsupported file type. Allowed: jpg, png, webp, gif, mp4, webm, mov, 3gp.';
    try { Z.toast(eType, 'error'); } catch(_){}
    throw new Error(eType);
  }

  var path = me.id + '/upload/' + Date.now() + '_' + Math.random().toString(36).slice(2,8) + '.' + ext;

  var c = Z.sb();
  if(!c) throw new Error('Not connected.');
  var sessionRes = await c.auth.getSession();
  var session = sessionRes && sessionRes.data ? sessionRes.data.session : null;
  if(!session || !session.access_token) throw new Error('Not logged in.');

  var presignRes;
  try {
    presignRes = await fetch('/api/r2-presign', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + session.access_token
      },
      body: JSON.stringify({
        action: 'put',
        path: path,
        contentType: file.type || ''
      })
    });
  } catch(netErr){
    var e1 = 'Presign request failed: ' + (netErr && netErr.message ? netErr.message : 'unknown');
    try { Z.toast(e1, 'error'); } catch(_){}
    throw new Error(e1);
  }

  if(!presignRes.ok){
    var errText = '';
    try { errText = await presignRes.text(); } catch(_){}
    var e2 = 'Presign rejected HTTP ' + presignRes.status + (errText ? ' — ' + errText.slice(0,180) : '');
    try { Z.toast(e2, 'error'); } catch(_){}
    throw new Error(e2);
  }

  var presignData = await presignRes.json();
  if(!presignData || !presignData.url){
    var e3 = 'Presign returned no URL.';
    try { Z.toast(e3, 'error'); } catch(_){}
    throw new Error(e3);
  }

  /* PUT must use the exact content-type the server signed, otherwise
     R2 rejects with a signature mismatch. The server echoes the signed
     content-type in the response. */
  var signedContentType = presignData.contentType || (file.type || 'application/octet-stream');

  var res;
  try {
    res = await fetch(presignData.url, {
      method: 'PUT',
      body: file,
      headers: {
        'Content-Type': signedContentType,
        'Cache-Control': 'public, max-age=31536000'
      }
    });
  } catch(netErr){
    var e4 = 'R2 network/CORS error: ' + (netErr && netErr.message ? netErr.message : 'unknown');
    try { Z.toast(e4, 'error'); } catch(_){}
    throw new Error(e4);
  }

  if(!res.ok){
    var bodyText = '';
    try { bodyText = await res.text(); } catch(_){}
    var e5 = 'R2 rejected HTTP ' + res.status + (bodyText ? ' — ' + bodyText.slice(0,180) : '');
    try { Z.toast(e5, 'error'); } catch(_){}
    throw new Error(e5);
  }

  var fullUrl = Z.R2_PUBLIC_BASE + '/' + path;
  Z._registerPendingUpload(fullUrl);
  return fullUrl;
};

Z._pathFromUrl = function(url){
  if(!url) return null;
  var m = String(url).match(/\/storage\/v1\/object\/public\/media\/(.+?)(?:\?|$)/);
  if(m) return decodeURIComponent(m[1]);
  var m2 = String(url).match(/r2\.dev\/(.+?)(?:\?|$)/);
  if(m2) return decodeURIComponent(m2[1]);
  return null;
};
Z._cleanupOrphanUpload = function(url){

   Z._pendingUploadsKey = function(){
  var me = Z.State.currentUser;
  return me ? ('zynix_pending_uploads_' + me.id) : '';
};
Z._getPendingUploads = function(){
  var key = Z._pendingUploadsKey();
  if(!key) return [];
  try {
    var raw = localStorage.getItem(key);
    var list = raw ? JSON.parse(raw) : [];
    return Array.isArray(list) ? list : [];
  } catch(e){ return []; }
};
Z._setPendingUploads = function(list){
  var key = Z._pendingUploadsKey();
  if(!key) return;
  try { localStorage.setItem(key, JSON.stringify(list || [])); } catch(e){}
};
Z._registerPendingUpload = function(url){
  if(!url || typeof url !== 'string') return;
  if(url.indexOf('r2.dev') === -1) return;
  var list = Z._getPendingUploads();
  if(list.indexOf(url) === -1){ list.push(url); Z._setPendingUploads(list); }
};
Z._reconcilePendingUploads = async function(){
  var me = Z.State.currentUser;
  if(!me) return;
  var list = Z._getPendingUploads();
  if(!list.length) return;
  var c = sb();
  if(!c) return;
  var remaining = [];
  for(var i = 0; i < list.length; i++){
    var url = list[i];
    try {
      var inDb = false;
      var rp  = await c.from('posts').select('id').eq('media_url', url).limit(1);
      if(rp.data && rp.data.length) inDb = true;
      if(!inDb){
        var rs  = await c.from('sparks').select('id').eq('video_url', url).limit(1);
        if(rs.data && rs.data.length) inDb = true;
      }
      if(!inDb){
        var rSt = await c.from('statuses').select('id').eq('media_url', url).limit(1);
        if(rSt.data && rSt.data.length) inDb = true;
      }
      if(inDb){ continue; }
      try {
        await Z.deleteStorageIfOrphan(url, null, null);
      } catch(e){
        remaining.push(url);
      }
    } catch(e){
      remaining.push(url);
    }
  }
  Z._setPendingUploads(remaining);
};
Z.deleteStorageIfOrphan = async function(url, excludePostId, excludeSparkId){
  if(!url) return;
  var path = Z._pathFromUrl(url);
  if(!path) return;
  var c = sb(); if(!c) return;

  if(url.indexOf('r2.dev') === -1){
    /* Legacy Supabase Storage path — keep old behavior for safety. */
    try {
      var still = 0;
      var rp = await c.from('posts').select('id').eq('media_url', url);
      (rp.data||[]).forEach(function(x){ if(x.id !== excludePostId) still++; });
      if(still) return;
      var rs = await c.from('sparks').select('id').eq('video_url', url);
      (rs.data||[]).forEach(function(x){ if(x.id !== excludeSparkId) still++; });
      if(still) return;
      var rSt = await c.from('statuses').select('id').eq('media_url', url);
      (rSt.data||[]).forEach(function(x){ still++; });
      if(still) return;
      var rAd = await c.from('ads').select('id').eq('media_url', url);
      (rAd.data||[]).forEach(function(x){ still++; });
      if(still) return;
      await c.storage.from('media').remove([path]);
    } catch(e){}
    return;
  }

  /* R2 path — the server decides whether the file is still referenced.
     A 409 means some other row still points at this URL; the client
     does nothing in that case. */
  var me = Z.State.currentUser;
  if(!me) return;
  var sessionRes = await c.auth.getSession();
  var session = sessionRes && sessionRes.data ? sessionRes.data.session : null;
  if(!session || !session.access_token) return;

  try {
    var presignRes = await fetch('/api/r2-presign', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + session.access_token
      },
      body: JSON.stringify({
        action: 'delete',
        path: path,
        excludeId: excludePostId || excludeSparkId || null
      })
    });
    if(!presignRes.ok) return;
    var presignData = await presignRes.json();
    if(!presignData || !presignData.url) return;
    await fetch(presignData.url, { method: 'DELETE' });
  } catch(e){}
};

    if(old) old.remove();
    el.classList.remove('blink');
    void el.offsetWidth;
    el.classList.add('blink');
    setTimeout(function(){ el.classList.remove('blink'); }, 1200);
    var tip = document.createElement('div');
    tip.className = 'freeze-tooltip-top';
    tip.textContent = 'Unfreeze Reactions';
    el.appendChild(tip);
    setTimeout(function(){ if(tip.parentNode) tip.parentNode.removeChild(tip); }, 2000);
  });
};
Z._autoFreezeDelays = {};
Z._freezeObserver = null;
Z._freezeObserved = new WeakSet();
Z.initFreezeObserver = function(){
  if(Z._freezeObserver) return;
  if(typeof IntersectionObserver === 'undefined') return;
  Z._freezeObserver = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      var dot = entry.target;
      if(!dot.isConnected) return;
      var id = dot.getAttribute('data-freeze-id');
      if(!id) return;
      if(!Z.isUnfrozen(id)){
        if(Z._autoFreezeDelays[id]){ clearTimeout(Z._autoFreezeDelays[id]); delete Z._autoFreezeDelays[id]; }
        return;
      }
      if(entry.isIntersecting){
        if(Z._autoFreezeDelays[id]){ clearTimeout(Z._autoFreezeDelays[id]); delete Z._autoFreezeDelays[id]; }
      } else {
        if(Z._autoFreezeDelays[id]) clearTimeout(Z._autoFreezeDelays[id]);
        Z._autoFreezeDelays[id] = setTimeout(function(){
          delete Z._autoFreezeDelays[id];
          if(!Z.isUnfrozen(id)) return;
          Z.setUnfrozen(id, false);
          document.querySelectorAll('[data-freeze-id="' + id + '"]').forEach(function(el){
            el.classList.remove('unfrozen'); el.setAttribute('data-tip','Frozen');
          });
          if(Z.State.currentView === 'home'  && Z.updatePostReactionUI)   Z.updatePostReactionUI(id);
          if(Z.State.currentView === 'spark' && Z.updateSparkReactionsUI) Z.updateSparkReactionsUI(id);
        }, 3000);
      }
    });
  }, {threshold:[0, 0.01], rootMargin:'0px'});
};
Z.observeFreezeDots = function(){
  Z.initFreezeObserver();
  if(!Z._freezeObserver) return;
  document.querySelectorAll('.freeze-dot[data-freeze-id]').forEach(function(dot){
    if(Z._freezeObserved.has(dot)) return;
    Z._freezeObserved.add(dot);
    try { Z._freezeObserver.observe(dot); } catch(e){}
  });
};
Z.hasBountyReactionGiven = function(myR){
  if(!myR) return false;
  for(var i=0;i<Z.BOUNTY_REACTIONS.length;i++) if(myR[Z.BOUNTY_REACTIONS[i]]) return true;

};

/* Single source of truth for reaction-button CSS classes.
   Used by the four reaction renderers (post / comment / spark /
   spark-comment) so the same rules apply everywhere.
   - frozenApplies is true only for the top-level post & spark rows
     (which have the freeze-dot). Comments have no freeze logic. */
Z._reactionClassFor = function(baseClass, opts){
  var cls = baseClass;
  if(opts.active) cls += ' active';
  if(opts.isDislike){
    if(opts.hasBounty && !opts.active) cls += ' disabled-reaction';
  } else {
    if(opts.hasDislike && !opts.active) cls += ' disabled-reaction';
    else if(opts.isOwner) cls += ' disabled-reaction';
    else if(opts.frozenApplies && !opts.unfrozen) cls += ' frozen-reaction';
  }
  return cls;
};

Z.updateScrollTopBtn = function(isScrollEvent){
  var btn = document.getElementById('scroll-top-btn');
  if(!btn) return;
  var view = Z.State.currentView;
  var y = 0;
  if(view === 'spark'){
    var feed = document.getElementById('spark-feed');
    if(feed) y = feed.scrollTop || 0;
  } else {
    y = window.scrollY || document.documentElement.scrollTop || 0;
  }
  if(isScrollEvent){
    var prev = (view === 'spark') ? (Z.State._lastSparkScrollY || 0) : (Z.State._lastScrollY || 0);
    if(y > prev + 1) Z.State.arrowVisible = false;
    else if(y < prev - 1) Z.State.arrowVisible = (y > 60);
    if(view === 'spark') Z.State._lastSparkScrollY = y;
    else Z.State._lastScrollY = y;
  } else {
    if(view === 'spark') Z.State._lastSparkScrollY = y;
    else Z.State._lastScrollY = y;
    if(y <= 60) Z.State.arrowVisible = false;
  }
  btn.style.display = Z.State.arrowVisible ? 'flex' : 'none';
};

Z.saveHomeAnchor = function(){
  try {
    var posts = document.querySelectorAll('.post-card[data-post-id]');
    if(!posts.length) return;
    var best = null, bestDist = Infinity;
    posts.forEach(function(p){
      var r = p.getBoundingClientRect();
      if(r.bottom > 0){
        var d = Math.abs(r.top);
        if(d < bestDist){ bestDist = d; best = {id: p.getAttribute('data-post-id'), top: r.top}; }
      }
    });
    if(best){ Z.State.homeAnchorPost = best.id; Z.State.homeAnchorOffset = best.top; }
  } catch(e){}
};

  try {
    if(Z.State.homeAnchorPost){
      var el = document.querySelector('.post-card[data-post-id="' + Z.State.homeAnchorPost + '"]');
      if(el){
        var r = el.getBoundingClientRect();
        var targetY = (window.scrollY || 0) + r.top - Z.State.homeAnchorOffset;
        if(targetY < 0) targetY = 0;
        window.scrollTo(0, targetY);
        return;
      }
    }

    if(y > 0) window.scrollTo(0, y);
  } catch(e){}
};

var SNAPSHOT_VERSION = 'v2';
Z._snapshotKey = function(){
  var me = Z.State.currentUser;
  return me ? ('zynix_snapshot_' + SNAPSHOT_VERSION + '_' + me.id) : '';
};
Z.saveSnapshot = function(){
  var me = Z.State.currentUser;
  if(!me) return;
  var key = Z._snapshotKey();
  if(!key) return;
  try {
    /* Never persist blob:/data: URLs — they die on page reload and
       produce ERR_FILE_NOT_FOUND on the next load. */
    var safeUrl = function(u){
      if(!u || typeof u !== 'string') return null;
      if(u.indexOf('blob:') === 0) return null;
      if(u.indexOf('data:') === 0) return null;
      return u;
    };
    var snap = {
      ts: Date.now(),
      posts: (Z.State.allPosts||[]).slice(0,30).map(function(p){
        var safeMedia = safeUrl(p.media_url);
        return { id:p.id, author_id:p.author_id, content:p.content,
                 media_url: safeMedia,
                 media_type: safeMedia ? p.media_type : null,
                 created_at:p.created_at, views:p.views, shares:p.shares, reactions:p.reactions||{} };
      }),
      sparks: (Z.State.allSparks||[]).slice(0,30).map(function(s){
        return { id:s.id, author_id:s.author_id, caption:s.caption, title:s.title,
                 video_url: safeUrl(s.video_url),
                 tags:s.tags||[], type:s.type, created_at:s.created_at, views:s.views, shares:s.shares };
      }),
      profiles: (Z.State.allProfiles||[]).slice(0,50).map(function(p){
        return { id:p.id, name:p.name, username:p.username, avatar:p.avatar, profession:p.profession,
                 bio:p.bio, package:p.package, bounty_settings:p.bounty_settings };
      }),
      circles: (Z.State.allCircles||[]).slice(0,30)
    };
    localStorage.setItem(key, JSON.stringify(snap));
  } catch(e){}
};
Z.loadSnapshot = function(){
  var me = Z.State.currentUser;
  if(!me) return false;
  var key = Z._snapshotKey();
  if(!key) return false;
  try {
    var raw = localStorage.getItem(key);
    if(!raw) return false;
    var snap = JSON.parse(raw);
    if(!snap || !snap.ts) return false;
    if(Date.now() - snap.ts > 24*60*60*1000) return false;
        Z.State.allPosts   = (snap.posts||[]).map(function(p){
      if(p.media_url && (p.media_url.indexOf('blob:') === 0 || p.media_url.indexOf('data:') === 0)){
        p.media_url = null; p.media_type = null;
      }
      p.reactions = p.reactions||{}; p._myReactions = {}; p._comments = []; return p;
    });
    Z.State.allSparks  = (snap.sparks||[]).map(function(s){
      if(s.video_url && (s.video_url.indexOf('blob:') === 0 || s.video_url.indexOf('data:') === 0)){
        s.video_url = null;
      }
      s._reactions = {}; s._myReactions = {}; s._comments = []; s._commentsCount = 0; return s;
    });
    var existing = Z.State.allProfiles || [];
    var byId = {};
    (snap.profiles||[]).forEach(function(p){ byId[p.id] = p; });
    existing.forEach(function(p){ if(byId[p.id]) byId[p.id] = Object.assign({}, p, byId[p.id]); });
    if(!byId[me.id]) byId[me.id] = { id:me.id, name:me.name, username:me.username, avatar:me.avatar, profession:me.profession, bio:me.bio, package:me.package, bounty_settings:me.bounty_settings };
    Z.State.allProfiles = Object.keys(byId).map(function(k){ return byId[k]; });
    if(snap.circles && snap.circles.length) Z.State.allCircles = snap.circles;
    return true;
  } catch(e){ return false; }
};
Z.clearSnapshot = function(){
  try {
    var keys = [];
    for(var i=0;i<localStorage.length;i++){
      var k = localStorage.key(i);
      if(k && k.indexOf('zynix_snapshot_') === 0) keys.push(k);
    }
    keys.forEach(function(k){ localStorage.removeItem(k); });
  } catch(e){}
};

function mediaMapKey(){
  var me = Z.State.currentUser;
  return me ? ('zynix_media_map_' + me.id) : 'zynix_media_map_guest';
}
Z._loadMediaMap = function(){
  try { var raw = localStorage.getItem(mediaMapKey()); return raw ? (JSON.parse(raw) || {}) : {}; }
  catch(e){ return {}; }
};
Z._saveMediaMap = function(m){
  try { localStorage.setItem(mediaMapKey(), JSON.stringify(m || {})); } catch(e){}
};
Z.recordMediaUrl = function(id, url){
  if(!id || !url || typeof url !== 'string') return;
  if(url.indexOf('blob:') === 0 || url.indexOf('data:') === 0) return;
  var m = Z._loadMediaMap();
  m[id] = { url: url, ts: Date.now() };
  var keys = Object.keys(m);
  if(keys.length > 500){
    keys.sort(function(a,b){ return (m[a].ts||0) - (m[b].ts||0); });
    while(keys.length > 500) delete m[keys.shift()];
  }
  Z._saveMediaMap(m);
};
Z._backfillItem = function(item, isVideo){
  if(!item || !item.id) return;
  var key = isVideo ? 'video_url' : 'media_url';
  var cur = item[key];
  if(cur && typeof cur === 'string' && cur.indexOf('http') === 0) return;
  var rec = Z._loadMediaMap()[item.id];
  if(!rec || !rec.url) return;
  item[key] = rec.url;
  if(!isVideo && !item.media_type) item.media_type = Z.isVideoUrl(rec.url) ? 'video' : 'image';
};
Z._backfillAllMedia = function(){
  try { (Z.State.allPosts||[]).forEach(function(p){ Z._backfillItem(p, false); }); } catch(e){}
  try { (Z.State.allSparks||[]).forEach(function(s){ Z._backfillItem(s, true); }); } catch(e){}
  try { (Z.State.allStatuses||[]).forEach(function(s){ Z._backfillItem(s, false); }); } catch(e){}
};

  try {

    if(!phasesRes.error && Array.isArray(phasesRes.data)) Z.State.buildTimeline.phases = phasesRes.data;
    var pctRes = await c.from('app_settings').select('value').eq('key', 'loading_millionaires_percent').maybeSingle();
    var fromSettings = pctRes && pctRes.data && pctRes.data.value ? parseInt(pctRes.data.value, 10) : null;
    var computed = 0;
    (Z.State.buildTimeline.phases||[]).forEach(function(p){
      var w = Number(p.weight) || 0;
      var pr = Number(p.progress) || 0;
      computed += (w * pr / 100);
    });
    computed = Math.round(computed);
    Z.State.buildTimeline.percent = (fromSettings != null && !isNaN(fromSettings)) ? fromSettings : (computed || 41);
    var current = (Z.State.buildTimeline.phases||[]).filter(function(p){ return p.status === 'in_progress'; })[0];
    Z.State.buildTimeline.currentPhaseLabel = current ? current.title : 'Building Core Features';

  } catch(e){}
};

Z.migrateLocalCirclesOnce = function(){
  var me = Z.State.currentUser;
  if(!me) return;
  var marker = 'zynix_circles_migrated_v1_' + me.id;
  if(localStorage.getItem(marker)) return;
  var c = sb();
  if(!c) return;
  var raw = localStorage.getItem('zynix_circles');
  if(!raw){ localStorage.setItem(marker, '1'); return; }
  var localCircles;
  try { localCircles = JSON.parse(raw); }
  catch(e){ localStorage.setItem(marker, '1'); return; }
  if(!Array.isArray(localCircles) || !localCircles.length){ localStorage.setItem(marker, '1'); return; }
  var toMigrate = localCircles.filter(function(x){
    return x && x.creatorId && x.creatorId !== 'seed' && String(x.creatorId) === me.id && String(x.id).indexOf('cir_') === 0;
  });
  if(!toMigrate.length){ localStorage.setItem(marker, '1'); return; }
  (async function(){
    try {
      for(var i=0;i<toMigrate.length;i++){
        var lc = toMigrate[i];
        var payload = {
          name: lc.name || 'Untitled Circle',
          description: lc.description || '',
          type: (['social','services','goods','office','education','events'].indexOf(lc.type) >= 0) ? lc.type : 'social',
          avatar: lc.avatar || null,
          creator_id: me.id,
          member_count: 1
        };
        var ins = await c.from('circles').insert(payload).select().maybeSingle();
        if(ins.data && ins.data.id){
          try { await c.from('circle_members').insert({ circle_id: ins.data.id, user_id: me.id, role: 'admin' }); } catch(e){}
        }
      }
      localStorage.setItem(marker, '1');
      localStorage.removeItem('zynix_circles');
    } catch(e){}
  })();
};

        '<label class="form-label">Password</label>' +
        '<input type="password" id="auth-password" class="form-input" placeholder="••••••••" autocomplete="' + (isLogin?'current-password':'new-password') + '">' +
        (!isLogin ? '<label class="form-label">Referral Code (Optional)</label><input type="text" id="auth-refcode" class="form-input" placeholder="ZYNIX-XXXXXX">' : '') +
        '<button class="btn-primary" id="auth-submit" onclick="Z.handleAuth(\'' + mode + '\')">' + (isLogin?'Login':'Sign Up') + '</button>' +
        '<button class="btn-secondary" onclick="Z.openAuthModal(\'' + (isLogin?'signup':'login') + '\')">' + (isLogin?"Don't have account? Sign Up":"Have account? Login") + '</button>' +
      '</div>' +
    '</div>'
  );
};

Z.handleAuth = async function(mode){
  var email = ((document.getElementById('auth-email')||{}).value || '').trim();
  var pass  = ((document.getElementById('auth-password')||{}).value || '');
  if(!email || !pass){ Z.toast('Please enter email and password.'); return; }
  var btn = document.getElementById('auth-submit');
  if(btn){ btn.disabled = true; btn.textContent = 'Please wait...'; }
  var c = Z.sb();
  if(!c){
    if(btn){ btn.disabled = false; btn.textContent = mode==='login'?'Login':'Sign Up'; }
    Z.toast('Supabase not ready.');
    return;
  }
  Z.State.manualAuthInProgress = true;
  var authSucceeded = false;
  try {
    if(mode === 'login'){
      var r = await c.auth.signInWithPassword({email: email, password: pass});
      if(r.error) throw r.error;
      Z.toast('Logged in!');
    } else {
      var name = ((document.getElementById('auth-name')||{}).value || 'New User').trim() || 'New User';
      var ref  = ((document.getElementById('auth-refcode')||{}).value || '').trim();
      var refId = null;
      if(ref){
        var pr = await c.from('profiles').select('id').eq('referral_code', ref.toUpperCase()).maybeSingle();
        if(pr.data) refId = pr.data.id;
      }
      var sr = await c.auth.signUp({
        email: email, password: pass,
        options:{data:{name: name, referred_by: refId}}
      });
      if(sr.error) throw sr.error;
      Z.toast('Account created!');
    }
    authSucceeded = true;

    /* ---- Post-login handoff (no flash of previous page) ----
       1. Close the auth modal.
       2. Show the welcome screen on top of whatever was behind.
       3. Load session + data while welcome masks the screen.
       4. Land on public-home (Ad TV page).
       5. Hide the welcome screen a beat later.
       Failsafe: if anything below hangs (Supabase stall), the
       welcome screen is force-hidden so the user is never trapped. */
    Z.closeModal();
    Z.State.navStack = [];
    Z.showWelcome(Z.getWelcomeGreeting('login-load'));
    var _welcomeToken = Date.now();
    Z._latestLoginWelcomeToken = _welcomeToken;
    var _welcomeFailsafe = setTimeout(function(){
      if(Z._latestLoginWelcomeToken !== _welcomeToken) return;
       try { Z.hideWelcome(); } catch(e){}
    }, 8000);

    await Z.refreshSession();

    try {
      await Promise.race([
        Z.reloadData(),
        new Promise(function(resolve){ setTimeout(resolve, 6000); })
      ]);
    } catch(e){
      console.error('Post-login load', e);
    }

    Z.showView('public-home');

    /* Small delay so the Ad TV / timeline paint before the fade. */
    setTimeout(function(){
      clearTimeout(_welcomeFailsafe);
            if(Z._latestLoginWelcomeToken !== _welcomeToken) return;
       Z.hideWelcome();
    }, 250);

    /* Realtime must be (re)connected after a fresh manual login. */
    setTimeout(function(){
      try { Z.setupRealtime(); } catch(e){}
    }, 100);
  } catch(e){
    Z.toast((e && e.message) ? e.message : 'Authentication failed.', 'error');
  } finally {
    Z.State.manualAuthInProgress = false;
    Z.State._manualAuthCompletedAt = Date.now();
    if(btn){ btn.disabled = false; btn.textContent = mode==='login'?'Login':'Sign Up'; }
    /* Safety: if the welcome screen is still up 4 seconds after a
       failed attempt, take it down — nothing should ever trap the
       user behind a loading overlay. */
    if(!authSucceeded){
      setTimeout(function(){
        var w = document.getElementById('zynix-welcome');
        if(w && !w.classList.contains('zynix-welcome-fadeout')) Z.hideWelcome();
      }, 4000);
    }
  }
};

Z.refreshSession = async function(){
  var c = Z.sb();
  if(!c){ Z.renderHeaderAuth(); return; }
  try {
    var s = await c.auth.getSession();
    var user = s.data && s.data.session ? s.data.session.user : null;
    if(!user){
      Z.State.currentUser = null;
      Z.renderHeaderAuth();
      Z.updateHeader();
      return;
    }
    var pr = await c.from('profiles').select('*').eq('id', user.id).maybeSingle();
    var profile = pr.data || {
      id: user.id,
      name: (user.user_metadata && user.user_metadata.name) || 'New User',
      email: user.email,
      referral_code: '',
      wallet_cash: 0, wallet_bounty: 0, wallet_total: 0,
      reactions_locked: false
    };
    Z.State.currentUser = profile;
    Z.renderHeaderAuth();
    Z.updateHeader();
  } catch(e){}

  /* Reconcile any uploads that were registered but never confirmed
     by a DB row. Runs in background; failures are swallowed so they
     never block login. Handles the case where a page was refreshed
     between R2 upload and DB insert. */
  if(Z.State.currentUser && typeof Z._reconcilePendingUploads === 'function'){
    try { Z._reconcilePendingUploads(); } catch(e){}
  }
};
Z.logout = async function(){
  var c = Z.sb();
  /* Tear down realtime channels BEFORE signOut so no ghost events
     fire against a logged-out user. */
  try {
    if(c && c.getChannels){
      c.getChannels().forEach(function(ch){
        var nm = ch && (ch.topic || ch.name || '');
        if(typeof nm === 'string' && nm.indexOf('zynix-') === 0){
          try { c.removeChannel(ch); } catch(e){}
        }
      });
    }
    (Z.State.realtimeChannels||[]).forEach(function(ch){ try { c.removeChannel(ch); } catch(e){} });
    Z.State.realtimeChannels = [];
  } catch(e){}

  if(c){ try { await c.auth.signOut(); } catch(e){} }
  Z.clearSnapshot();
  Z.State.currentUser = null;
  Z.State.allProfiles = [];
  Z.State.allConnections = [];
  Z.State.allNotifications = [];
  Z.State.unfrozenContent = {};
  Z.State.allPosts = [];
  Z.State.allSparks = [];
  Z.State.allStatuses = [];
  Z.State.allCircles = [];
  Z.State.navStack = [];
  Z.State.savedPosts = [];
  Z.State.savedSparks = [];

  /* Session-scoped state reset — prevents data surviving a sign-out
     on a shared device (e.g. a stray spaceUserId or viewed-post
     cache leaking into the next user's session). */
  Z.State.spaceUserId = null;
  Z.State.spacePosts = [];
  Z.State.spaceSparks = [];
  Z.State.spaceVideos = [];
  Z.State._viewedPostsThisSession = {};
  Z.State.homeAnchorPost = null;
  Z.State.homeAnchorOffset = 0;
  Z.State.sparkSlideIndex = 0;

  try { localStorage.setItem('zynix_last_view','public-home'); localStorage.removeItem('zynix_last_param'); } catch(e){}
  Z.renderHeaderAuth();
  Z.updateHeader();
  Z.toast('Logged out.');
  Z.showView('public-home');
};

Z.goPublicHome = function(){
  if(!Z.showView) return;
  if(Z.State.currentView === 'public-home') Z.showView('home');
  else Z.showView('public-home');
};

})();
</script>

<script>
(function(){
'use strict';
var Z = window.Z;
if(!Z) return;

Z.renderView = function(view, param){
  var fn = {
    'home':            Z.renderHome,
    'spark':           Z.renderSpark,
    'galleria':        Z.renderGalleria,
    'circles':         Z.renderCircles,
    'lounge':          Z.renderLounge,
    'profile':         Z.renderProfile,
    'wallet':          Z.renderWallet,
    'bounty':          Z.renderBounty,
    'packages':        Z.renderPackages,
    'referrals':       Z.renderReferrals,
    'people':          Z.renderPeople,
    'notifications':   Z.renderNotifications,
    'public-profile':  Z.renderPublicProfile,
    'space-posts-all': Z.renderSpacePostsAll,
    'space-sparks-all':Z.renderSpaceSparksAll,
    'space-videos-all':Z.renderSpaceVideosAll,
    'status-home':     Z.renderStatusHome,
    'public-home':     Z.renderPublicHome
  }[view];
  if(typeof fn === 'function'){
    try { return fn.call(Z, param); }
    catch(e){ console.error('render ' + view, e); return '<div class="empty-state"><p>Could not load view.</p></div>'; }
  }
  return '<div class="empty-state"><p>View not available.</p></div>';
};

function updateBellColor(){
  var b = document.getElementById('bell-btn');
  if(!b) return;
  if(Z.State.currentView === 'notifications') b.classList.add('active');
  else b.classList.remove('active');
}
function updateWalletPillState(){
  var w = document.getElementById('wallet-pill');
  if(!w) return;
  if(Z.State.currentView === 'wallet') w.classList.add('active');
  else w.classList.remove('active');
}

var _isGoingBack = false;

function _dedupeStack(stack){
  if(!stack || stack.length < 2) return stack || [];
  var out = [];
  for(var i = 0; i < stack.length; i++){
    var top = out[out.length - 1];
    if(!top || top.view !== stack[i].view || top.param !== stack[i].param){
      out.push(stack[i]);
    }
  }
  return out;
}

Z.showView = async function(view, param){
  var prevView  = Z.State.currentView;
  var prevParam = Z.State.currentParam;

  if(!_isGoingBack && prevView && prevView !== view){
    Z.State.navStack.push({ view: prevView, param: prevParam });
    if(Z.State.navStack.length > 40) Z.State.navStack.shift();
    Z.State.navStack = _dedupeStack(Z.State.navStack);
  }

  if(prevView === 'home' && view !== 'home'){
    try { Z.saveScroll(window.scrollY); } catch(e){}
    try { Z.saveHomeAnchor(); } catch(e){}
  }
  if(prevView === 'spark' && view !== 'spark'){
    try { Z.saveSparkSlideIndex(); } catch(e){}
  }

  if(prevView && prevView !== view){
    try { Z.pauseAllBackgroundVideos(); } catch(e){}
    try { Z.closeSparkCaptionOverlay(); } catch(e){}
  }

  /* Stop the Ad TV auto-advance interval the moment we leave
     public-home. The interval lives in Z._adTVTimer (Section 4B). */
  if(prevView === 'public-home' && view !== 'public-home'){
    if(Z._adTVTimer){ clearInterval(Z._adTVTimer); Z._adTVTimer = null; }
  }

  Z.State.currentView = view;
  Z.State.currentParam = param || null;

  if(view !== 'notifications' && view !== 'wallet'){
    Z.saveCurrentView(view, param);
  }

  window.scrollTo(0,0);
  Z.State.arrowVisible = false;
  Z.State._lastScrollY = 0;
  Z.State._lastSparkScrollY = 0;
  var _stb = document.getElementById('scroll-top-btn');
  if(_stb) _stb.style.display = 'none';

  document.querySelectorAll('#bottom-nav button:not(.create-btn)').forEach(function(b){
    b.classList.remove('active');
    try { b.blur(); } catch(e){}
  });
   var navMap = {home:'nav-home', spark:'nav-spark', galleria:'nav-galleria', lounge:'nav-lounge'};
  if(navMap[view]){
    var nb = document.getElementById(navMap[view]);
    if(nb) nb.classList.add('active');
  }
  var me = Z.State.currentUser;
  if(view === 'public-profile' && me && param === me.id){
    var sb = document.getElementById('nav-space');
    if(sb) sb.classList.add('active');
  }

  var container = document.getElementById('app-container');
  if(!container) return;
  try { container.innerHTML = Z.renderView(view, param); }
  catch(e){
    console.error('render err', e);
    container.innerHTML = '<div class="empty-state"><p>Something went wrong.</p>' +
      '<button onclick="Z.showView(\'home\')" style="background:#10b981;border:none;color:#000;font-weight:700;padding:8px 20px;border-radius:8px;margin-top:12px;cursor:pointer;">Home</button></div>';
  }

 if(view === 'home'){
    setTimeout(function(){ if(typeof Z.renderDiscoverStrip === 'function') Z.renderDiscoverStrip(); }, 80);
    setTimeout(function(){
      if(typeof Z.setupFeedVideoAutoplay === 'function') Z.setupFeedVideoAutoplay();
      Z.observeFreezeDots();
      Z.restoreHomeAnchorOrScroll();
      Z.detectCaptionOverflow();
      Z.resolveIdbRefs(container);
      Z._tagMediaContainers();
      if(typeof Z.attachHomeInteractions === 'function') Z.attachHomeInteractions();
    }, 150);
    setTimeout(function(){
      Z.restoreHomeAnchorOrScroll();
      Z.detectCaptionOverflow();
      Z.resolveIdbRefs(container);
      Z._tagMediaContainers();
    }, 500);
  }
  if(view === 'spark'){
    setTimeout(function(){
      if(typeof Z.setupSparkFeed === 'function') Z.setupSparkFeed(Z.State.allSparks);
      Z.observeFreezeDots();
      Z.restoreSparkSlideIndex();
      Z.detectCaptionOverflow();
      Z.resolveIdbRefs(container);
    }, 150);
    setTimeout(function(){ Z.resolveIdbRefs(container); }, 600);
  }
  if(view === 'people'){ setTimeout(function(){ if(typeof Z.refreshPeopleList === 'function') Z.refreshPeopleList(); }, 60); }
  if(view === 'circles'){ setTimeout(function(){ if(typeof Z.refreshCirclesList === 'function') Z.refreshCirclesList(); }, 60); }
  if(view === 'public-profile'){ setTimeout(function(){ Z.detectCaptionOverflow(); Z.resolveIdbRefs(container); Z._tagMediaContainers(); }, 150); }
  if(view !== 'spark' && view !== 'home'){ setTimeout(function(){ Z.detectCaptionOverflow(); Z._tagMediaContainers(); }, 100); }

  updateBellColor();
  updateWalletPillState();
  Z.updateHeader();
  Z.updateScrollTopBtn();
};

Z.goBack = function(){
  var stack = Z.State.navStack || [];
  var current = Z.State.currentView;
  var target = null;
  while(stack.length){
    var top = stack.pop();
    if(top.view !== current){ target = top; break; }
  }
  if(!target) target = { view: 'home', param: null };
  _isGoingBack = true;
  try { Z.showView(target.view, target.param); }
  finally { setTimeout(function(){ _isGoingBack = false; }, 80); }
};

Z.toggleNotifications = function(){
  if(Z.State.currentView === 'notifications') Z.goBack();
  else Z.showView('notifications');
};
Z.toggleWallet = function(){
  if(Z.State.currentView === 'wallet') Z.goBack();
  else Z.showView('wallet');
};
Z.closeWallet = function(){ Z.goBack(); };
Z.spaceBack = function(){ Z.goBack(); };
Z.spaceBackToSpace = function(){
  var uid = Z.State.spaceUserId || Z.State.currentParam;
  if(!uid){ Z.goBack(); return; }
  Z.showView('public-profile', uid);
};

Z.softRefresh = function(){
  var container = document.getElementById('app-container');
  if(!container) return;
  var savedY = window.scrollY || document.documentElement.scrollTop || 0;
  var view = Z.State.currentView;
  var param = Z.State.currentParam;
  var openComments = {};
  document.querySelectorAll('.post-comments.open').forEach(function(el){
    if(el.id) openComments[el.id] = true;
  });
  try { container.innerHTML = Z.renderView(view, param); }
  catch(e){}
 if(view === 'home'){
    if(typeof Z.renderDiscoverStrip === 'function') Z.renderDiscoverStrip();
    setTimeout(function(){ if(typeof Z.setupFeedVideoAutoplay === 'function') Z.setupFeedVideoAutoplay(); }, 60);
    setTimeout(function(){ if(typeof Z.attachHomeInteractions === 'function') Z.attachHomeInteractions(); }, 100);
  }
  Object.keys(openComments).forEach(function(id){
    var el = document.getElementById(id);
    if(el) el.classList.add('open');
  });
  window.scrollTo(0, savedY);
  requestAnimationFrame(function(){ window.scrollTo(0, savedY); });
  setTimeout(function(){ window.scrollTo(0, savedY); }, 20);
  Z.updateHeader();
  Z.observeFreezeDots();
  Z.updateScrollTopBtn();
  Z._tagMediaContainers();
  setTimeout(function(){ Z.detectCaptionOverflow(); Z._tagMediaContainers(); }, 40);
  setTimeout(function(){ Z.resolveIdbRefs(container); Z._tagMediaContainers(); }, 50);
};

Z.detectCaptionOverflow = function(){
  try {
    document.querySelectorAll('.post-caption, .status-caption-overlay, .spark-info-caption').forEach(function(el){
      var txt = el.querySelector('.pc-text, .sc-text');
      if(!txt) return;
      el.classList.remove('has-overflow');
      void txt.offsetHeight;
      if(txt.scrollHeight > txt.clientHeight + 2) el.classList.add('has-overflow');
    });
  } catch(e){}
};

Z.toggleCaptionEl = function(ev, el){
  if(!el) return;
  if(!el.classList.contains('has-overflow') && !el.classList.contains('expanded')) return;
  var isStatus = el.classList.contains('status-caption-overlay');
  var isSpark  = el.classList.contains('spark-info-caption');
  if(isSpark){ if(ev) ev.stopPropagation(); Z._openSparkCaptionOverlay(el); return; }
  if(el.classList.contains('expanded')){
    el.classList.remove('expanded');
    if(ev) ev.stopPropagation();
    if(isStatus){
      if(Z.State.captionWasPaused){
        Z.State.captionWasPaused = false;
        if(typeof Z.resumeStatusTimer === 'function') Z.resumeStatusTimer();
      }
      var stage = document.getElementById('status-stage');
      if(stage){
        var v = stage.querySelector('video');
        if(v){ try { if(v.paused && v.currentTime < ((v.duration||0) - 0.2)) v.play().catch(function(){}); } catch(e){} }
      }
    }
    return;
  }
  var t = ev && ev.target;
  if(!t) return;
  if(t.classList && (
      t.classList.contains('pc-see-more') ||
      t.classList.contains('sc-see-more') ||
      t.classList.contains('pc-text') ||
      t.classList.contains('sc-text'))){
    el.classList.add('expanded');
    if(ev) ev.stopPropagation();
    if(isStatus){
      Z.State.captionWasPaused = true;
      if(typeof Z.pauseStatusTimer === 'function') Z.pauseStatusTimer();
      var stage2 = document.getElementById('status-stage');
      if(stage2){
        var v2 = stage2.querySelector('video');
        if(v2 && !v2.paused){ try { v2.pause(); } catch(e){} }
      }
    }
  }
};

Z.openCreateModal = function(){
  if(!Z.State.currentUser){ Z.openAuthModal('login'); return; }
  Z.openModal(
    '<div class="modal-overlay" onclick="if(event.target===this)Z.closeModal()">' +
      '<div class="modal-box">' +
        '<div class="modal-header"><h3>Create</h3>' +
          '<button class="modal-close" onclick="Z.closeModal()"><i class="fa-solid fa-xmark"></i></button>' +
        '</div>' +
        '<button class="btn-primary" style="margin-bottom:10px;" onclick="Z.closeModal();Z.openCreateSparkModal();"><i class="fa-solid fa-bolt"></i> Create Spark</button>' +
        '<button class="btn-primary" style="margin-bottom:10px;background:linear-gradient(135deg,#ec4899,#8b5cf6);color:#fff;" onclick="Z.closeModal();Z.openCreateFullVideoModal();"><i class="fa-solid fa-film"></i> Create Full Video</button>' +
        '<button class="btn-primary" style="background:linear-gradient(135deg,#8b5cf6,#3b82f6);color:#fff;" onclick="Z.closeModal();Z.openCreateCircleModal();"><i class="fa-solid fa-shop"></i> Create Circle</button>' +
      '</div>' +
    '</div>'
  );
};

})();
</script>

<script>
(function(){
'use strict';
var Z = window.Z;
if(!Z) return;

Z.findPostInState = function(postId){
  var p = (Z.State.allPosts||[]).find(function(x){ return x.id === postId; });
  if(p) return p;
  if(Z.State.spacePosts) return Z.State.spacePosts.find(function(x){ return x.id === postId; }) || null;
  return null;
};

Z.renderHome = function(){
  var me = Z.State.currentUser;
  var posts = Z.State.allPosts || [];
  var profiles = Z.State.allProfiles || [];
  var lastVisit = Z.getLastVisit('home');

   var html = '<div style="display:flex;flex-direction:column;gap:14px;">';
  html += '<div id="home-discover-host"></div>';
  if(me){
    html +=
      '<div style="background:#111827;border:1px solid #1e293b;border-radius:16px;padding:12px;display:flex;align-items:center;gap:10px;">' +
        '<img src="' + Z.escape(Z.displayAvatar(me)) + '" onclick="Z.goMySpace()" style="width:36px;height:36px;border-radius:50%;object-fit:cover;cursor:pointer;flex-shrink:0;">' +
        '<input type="text" id="composer-input" placeholder="' + Z.escape(Z.pickGreeting()) + '" style="flex:1;background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:9px 14px;font-size:12px;color:#fff;outline:none;" onfocus="Z.expandComposer()">' +
      '</div>';
  } else {
    html +=
      '<div style="background:#111827;border:1px solid #1e293b;border-radius:16px;padding:12px;text-align:center;">' +
        '<button onclick="Z.openAuthModal(\'login\')" style="background:#10b981;border:none;color:#000;font-weight:700;padding:8px 20px;border-radius:10px;font-size:12px;cursor:pointer;">Login to post</button>' +
      '</div>';
  }
  html += '<div id="composer-expanded"></div>';

  if(posts.length){
    posts.forEach(function(p){
      var isNew = lastVisit > 0 && new Date(p.created_at).getTime() > lastVisit;
      html += Z.renderPostCard(p, profiles, me, isNew);
    });
  } else {
    html += Z.emptyState({
      icon: 'fa-regular fa-newspaper',
      title: 'No posts yet. Connect with people to see their posts.',
      cta: me ? { label: 'Find People', onclick: "Z.showView('people')" } : { label: 'Login', onclick: "Z.openAuthModal('login')" }
    });
  }
  html += '</div>';

  setTimeout(function(){ Z.recordVisit('home'); }, 2500);
  setTimeout(function(){ attachPostViewObservers(); }, 250);
  return html;
};
Z.renderDiscoverStrip = async function(){
  var host = document.getElementById('home-discover-host');
  if(!host) return;
  var me = Z.State.currentUser;
  if(!me){
    host.innerHTML = '';
    return;
  }

  /* Paint a lightweight loading skeleton immediately, so the strip
     does not push the feed down when it fills. */
  host.innerHTML = '<div style="background:#111827;border:1px solid #1e293b;border-radius:16px;padding:14px;">' +
    '<div style="font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;">' +
      '<i class="fa-solid fa-users" style="color:#10b981;margin-right:6px;"></i>Discover People' +
    '</div>' +
    '<div style="display:flex;gap:10px;overflow:hidden;">' +
      Z.skeletonRow() + Z.skeletonRow() + Z.skeletonRow() +
    '</div>' +
  '</div>';

  var data = [];
  try {
    data = await Z.DB.getPeopleFeed(12, 0, Date.now());
  } catch(e){ data = []; }
  if(!data || !data.length){
    data = (Z.State.allProfiles || [])
      .filter(function(u){ return u.id !== me.id; })
      .slice(0, 12);
  }

  /* Cache these profiles so the Connect button can resolve them */
  data.forEach(function(p){
    var arr = Z.State.allProfiles || [];
    var idx = -1;
    for(var i=0;i<arr.length;i++){ if(arr[i].id === p.id){ idx = i; break; } }
    if(idx === -1) arr.push(p);

/* Post 3-dot menu — opens fixed, closes on outside click, scroll,
   or Escape. Ignores clicks that land on another menu button. */
Z.togglePostMenu = function(postId, ev){
  if(ev) ev.stopPropagation();
  var menu = document.getElementById('post-menu-' + postId);
  if(!menu) return;
  var btn = ev && ev.target ? ev.target.closest('.post-menu-btn') : null;
  if(!btn){
    var wrap = menu.closest('.post-menu-wrap');
    if(wrap) btn = wrap.querySelector('.post-menu-btn');
  }
  if(!btn) return;

  var isOpen = menu.style.display === 'block';
  document.querySelectorAll('.post-menu').forEach(function(m){
    m.style.display = 'none';
    m.style.position = '';
    m.style.top = '';
    m.style.left = '';
    m.style.right = '';
  });
  if(isOpen) return;

  var rect = btn.getBoundingClientRect();
  var menuW = 210;
  var left = Math.max(8, Math.min(rect.right - menuW, window.innerWidth - menuW - 8));

  menu.style.position = 'fixed';
  menu.style.top = (rect.bottom + 4) + 'px';
  menu.style.left = left + 'px';
  menu.style.right = 'auto';
  menu.style.zIndex = '9999';
  menu.style.display = 'block';
};

document.addEventListener('click', function(e){
  if(!e.target.closest('.post-menu-wrap') && !e.target.closest('.post-menu')){
    document.querySelectorAll('.post-menu').forEach(function(m){
      m.style.display = 'none';
      m.style.position = '';
      m.style.top = '';
      m.style.left = '';
      m.style.right = '';
    });
  }
}, true);

window.addEventListener('scroll', function(){

    if(m.style.display === 'block'){
      m.style.display = 'none';
      m.style.position = '';

}, {passive:true});

document.addEventListener('keydown', function(e){

});

Z._mediaCache = { composer:null, status:null, spark:null, fv:null };

Z._cacheFile = function(file){
  return new Promise(function(resolve){
    if(!file){ resolve(null); return; }
    var reader = new FileReader();
    reader.onload = function(e){
      try {
        var blob = new Blob([e.target.result], { type: file.type || 'application/octet-stream' });
        resolve({ blob: blob, name: file.name || 'upload.bin', type: file.type || 'application/octet-stream', size: file.size || 0 });
      } catch(err){ resolve(null); }
    };
    reader.onerror = function(){ resolve(null); };
    try { reader.readAsArrayBuffer(file); }
    catch(e){ resolve(null); }
  });
};

/* Shared media preview + removal. Used by composer, status, spark,
   and full-video flows so all four behave identically. */
Z._previewMediaFile = function(input, opts){
  var f = input && input.files && input.files[0];
  if(!f) return null;
  var maxMB = opts.maxSizeMB || 100;
  if(f.size > maxMB*1024*1024){ Z.toast('Media under ' + maxMB + ' MB.'); input.value = ''; return null; }
  var box = document.getElementById(opts.previewId);
  if(!box) return null;
  var isVid = (f.type && f.type.indexOf('video/') === 0) || Z.isVideoUrl(f.name);
  var url;
  try { url = URL.createObjectURL(f); }
  catch(e){ Z.toast('Could not open file.', 'error'); return null; }
  box.innerHTML = (isVid
      ? '<video src="' + url + '" controls muted playsinline style="width:100%;max-height:220px;object-fit:contain;background:#000;"></video>'
      : '<img src="' + url + '" style="width:100%;max-height:220px;object-fit:contain;background:#000;">') +
    '<button class="media-preview-remove" type="button" onclick="Z.' + opts.removeFn + '()"><i class="fa-solid fa-xmark"></i> Remove</button>';
  box.classList.add('show');
  Z._mediaCache[opts.cacheKey] = { blob: f, name: f.name, type: f.type, size: f.size };
  Z._cacheFile(f).then(function(c){ if(c) Z._mediaCache[opts.cacheKey] = c; });
  var rr = document.getElementById(opts.removeRowId); if(rr) rr.style.display = 'flex';
  if(opts.clearInputIds) opts.clearInputIds.forEach(function(id){
    var el = document.getElementById(id);
    if(el && el !== input) el.value = '';
  });
  if(opts.urlFieldId){ var uf = document.getElementById(opts.urlFieldId); if(uf) uf.value = ''; }
  return f;
};

Z._removeMediaFile = function(opts){
  Z._mediaCache[opts.cacheKey] = null;
  if(opts.fileInputIds) opts.fileInputIds.forEach(function(id){
    var el = document.getElementById(id);
    if(el) el.value = '';
  });
  var p = document.getElementById(opts.previewId);
  if(p){ p.innerHTML = ''; p.classList.remove('show'); }
  var rr = document.getElementById(opts.removeRowId);
  if(rr) rr.style.display = 'none';
};

Z.previewComposerFile = function(input){
  Z._previewMediaFile(input, {
    cacheKey: 'composer',
    previewId: 'composer-preview',
    removeRowId: 'composer-remove-row',
    removeFn: 'removeComposerFile',
    clearInputIds: ['composer-file-photo','composer-file-video'],
    maxSizeMB: 100
  });
};

Z.removeComposerFile = function(){
  Z._removeMediaFile({
    cacheKey: 'composer',
    previewId: 'composer-preview',
    removeRowId: 'composer-remove-row',

  });
};

Z._getComposerFile = function(){
  if(Z._mediaCache.composer && Z._mediaCache.composer.blob) return Z._mediaCache.composer.blob;

  var pi = document.getElementById('composer-file-photo');

};

Z.submitComposer = async function(forceNoCaption){
  var me = Z.State.currentUser;
  if(!me) return;
  var text = ((document.getElementById('composer-text')||{}).value||'').trim();
  var fileObj = Z._getComposerFile();
  var hasFile = !!fileObj;
  var shareBounty = parseFloat((document.getElementById('composer-share-bounty')||{}).value || '0') || 0;
  if(!text && !hasFile){ Z.toast('Add text or media.'); return; }
  if(!text && hasFile && !forceNoCaption){
    Z.confirmNoCaption('Z.submitComposer(true)');
    return;
  }
  if(fileObj && fileObj.size > 100*1024*1024){ Z.toast('Media under 100 MB.'); return; }
  var mt = fileObj
    ? ((fileObj.type && fileObj.type.indexOf('video/')===0) || Z.isVideoUrl(fileObj.name) ? 'video' : 'image')
    : null;
  var localUrl = fileObj ? URL.createObjectURL(fileObj) : null;
  var tempId = 'temp_' + Z.uuid();
  var optimistic = {
    id: tempId, author_id: me.id, content: text, media_url: localUrl,
    media_type: mt, share_bounty: shareBounty,
    created_at: new Date().toISOString(), views: 0, shares: 0,
    reactions: {}, _myReactions: {}, _comments: [], _optimistic: true
  };
  Z.State.allPosts = [optimistic].concat(Z.State.allPosts || []);
  Z.cancelComposer();
  Z.toast('Post published!');
  Z.haptic(12);
  Z.showView('home');
  Z.saveSnapshot();

  (async function(){
    var mu = '';
    try {
      if(fileObj) mu = await Z.storeMedia(fileObj);
    } catch(err){
      Z.State.allPosts = (Z.State.allPosts || []).filter(function(x){ return x.id !== tempId; });
      if(localUrl && localUrl.indexOf('blob:') === 0){ try { URL.revokeObjectURL(localUrl); } catch(e){} }
      Z.toast('Upload failed — post not published.', 'error');
      if(Z.State.currentView === 'home') Z.softRefresh();
      return;
    }
    var row = await Z.DB.createPost({
      author_id: me.id, content: text, media_url: mu||null,
      media_type: mt||null, share_bounty: shareBounty
    });
    var arr = Z.State.allPosts || [];
    var idx = -1;
    for(var i=0;i<arr.length;i++){ if(arr[i].id === tempId){ idx = i; break; } }
    if(row){
      if(idx >= 0){
        var real = Object.assign({}, row, {reactions:{}, _myReactions:{}, _comments:[]});
        arr[idx] = real;
      }
      if(localUrl && localUrl.indexOf('blob:') === 0){ try { URL.revokeObjectURL(localUrl); } catch(e){} }
      Z.saveSnapshot();
    } else {
      Z.State.allPosts = arr.filter(function(x){ return x.id !== tempId; });
      if(localUrl && localUrl.indexOf('blob:') === 0){ try { URL.revokeObjectURL(localUrl); } catch(e){} }             
       Z._cleanupOrphanUpload(mu);
       Z.toast('Publish failed. Try again.', 'error');
      if(Z.State.currentView === 'home') Z.softRefresh();
    }
  })();
};

async function refetchSharesForContent(table, id, stateKey){
  try {
    var c = Z.sb();

    var r = await c.from(table).select('shares').eq('id', id).maybeSingle();
    if(r.error || !r.data || r.data.shares == null) return;
    var item = null;
    if(stateKey === 'post') item = Z.findPostInState(id);
    else if(stateKey === 'spark') item = (Z.State.allSparks||[]).find(function(x){ return x.id === id; });
    if(!item) return;
    item.shares = Number(r.data.shares) || 0;

      var card = document.querySelector('.post-card[data-post-id="' + id + '"]');
      if(card){
        card.querySelectorAll('.post-actions button').forEach(function(b){
          if(b.innerHTML.indexOf('fa-share-nodes') >= 0){

        });
      }
    } else {
      var vid = document.querySelector('video[data-spark-id="' + id + '"]');
      if(vid){
        var slide = vid.closest('.spark-slide');
        if(slide){
          slide.querySelectorAll('.spark-action-btn').forEach(function(b){
            if(b.innerHTML.indexOf('fa-share-nodes') >= 0){
              var cEl = b.querySelector('.spark-action-count');
              if(cEl) cEl.textContent = item.shares;
            }
          });
        }
      }
    }
  } catch(e){}
}

var _postViewObs = null;
function attachPostViewObservers(){
  if(!_postViewObs){
    _postViewObs = new IntersectionObserver(function(entries){
      entries.forEach(function(en){
        if(en.isIntersecting){
          var card = en.target;
          var pid = card.getAttribute('data-post-id');
          if(!pid) return;
          setTimeout(function(){
            if(card.isConnected) Z.recordPostView(pid);
          }, 1500);
          _postViewObs.unobserve(card);
        }
      });
    }, { threshold: 0.6 });
  }
  document.querySelectorAll('.post-card[data-post-id]').forEach(function(card){
    try { _postViewObs.observe(card); } catch(e){}
  });
}

/* Feed video autoplay — respects user's mute choice.
   Only one video plays at a time. First-visible wins at ≥75%. */
Z._feedPlayingVideo = null;
Z._feedScrollRaf = null;

Z.recomputeFeedVideoPlayback = function(){
  if(Z.State.currentView !== 'home') return;
  var vids = document.querySelectorAll('#app-container video:not([data-spark-id]):not([data-space-spark])');
  if(!vids.length){ Z._feedPlayingVideo = null; return; }

  var vh = window.innerHeight, best = null, bestRatio = 0;
  vids.forEach(function(v){
    var r = v.getBoundingClientRect();
    var visible = Math.max(0, Math.min(vh, r.bottom) - Math.max(0, r.top));
    var ratio = r.height > 0 ? visible / r.height : 0;
    if(ratio > bestRatio){ bestRatio = ratio; best = v; }
  });

  var current = Z._feedPlayingVideo;
  if(current && current.isConnected && best === current && bestRatio >= 0.75){
    if(current.paused){
      try { current.play().catch(function(){}); } catch(e){}
    }
    return;
  }

  vids.forEach(function(v){
    if(v === best) return;
    if(!v.paused){ try { v.pause(); } catch(e){} }
  });
  if(best && bestRatio >= 0.75){
    try {
      best.play().catch(function(){
        try { best.muted = true; best.play().catch(function(){}); } catch(e){}
      });
      Z._feedPlayingVideo = best;
    } catch(e){}
  } else {
    Z._feedPlayingVideo = null;
  }
};

function _scheduleFeedRecompute(){
  if(Z._feedScrollRaf) return;
  Z._feedScrollRaf = requestAnimationFrame(function(){
    Z._feedScrollRaf = null;
    Z.recomputeFeedVideoPlayback();
  });
}

Z.setupFeedVideoAutoplay = function(){
  if(!Z._feedVideoHooked){
    Z._feedVideoHooked = true;
    window.addEventListener('scroll', _scheduleFeedRecompute, {passive:true});
    window.addEventListener('resize', _scheduleFeedRecompute, {passive:true});
  }
  var vids = document.querySelectorAll('#app-container video:not([data-spark-id]):not([data-space-spark])');
  if(!vids.length) return;
  vids.forEach(function(v){
    v.setAttribute('playsinline','');
    v.setAttribute('loop','');
    if(!v._feedHooked){
      v._feedHooked = true;
      v.addEventListener('loadeddata', _scheduleFeedRecompute);
      v.addEventListener('canplay', _scheduleFeedRecompute);
    }
  });
  setTimeout(_scheduleFeedRecompute, 200);
};

/* Double-tap heart on post images. Coexists with Part 1 lightbox:
   single tap opens lightbox after 320ms; double tap cancels it. */
Z.attachHomeInteractions = function(){
  document.querySelectorAll('.post-media[data-post-media] img').forEach(function(img){
    if(img._dtHooked) return;
    img._dtHooked = true;
    var lastTap = 0;
    img.addEventListener('click', function(){
      var now = Date.now();
      if(now - lastTap < 300){
        var media = img.closest('[data-post-media]');
        var postId = media ? media.getAttribute('data-post-media') : null;
        if(!postId) return;
        var burst = media.querySelector('.post-heart-burst');
        if(burst){
          burst.classList.remove('animate');
          void burst.offsetWidth;
          burst.classList.add('animate');
        }
        if(Z.reactToPost) Z.reactToPost(postId, 'love');
        Z.haptic(15);
        lastTap = 0;
      } else {
        lastTap = now;
      }
    });
  });

  if(!Z._pullHooked){
    Z._pullHooked = true;
    var startY = 0, active = false;
    var threshold = 80;
    document.addEventListener('touchstart', function(e){
      if(Z.State.currentView !== 'home') return;
      if((window.scrollY || 0) > 5) return;
      startY = e.touches[0].clientY;
      active = true;
    }, {passive:true});
    document.addEventListener('touchmove', function(e){
      if(!active) return;
      var dy = e.touches[0].clientY - startY;
      var ind = document.getElementById('zynix-pull-indicator');
      if(!ind) return;
      if(dy > 40){ ind.classList.add('visible'); }
    }, {passive:true});
    document.addEventListener('touchend', function(e){
      if(!active) return;
      active = false;
      var ind = document.getElementById('zynix-pull-indicator');
      var dy = e.changedTouches[0].clientY - startY;
      if(dy > threshold && Z.State.currentView === 'home'){
        if(ind){ ind.classList.add('spinning'); ind.querySelector('span').textContent = 'Refreshing...'; }
        Z.reloadData().then(function(){
          if(Z.State.currentView === 'home') Z.softRefresh();
          setTimeout(function(){
            if(ind){
              ind.classList.remove('visible','spinning');
              ind.querySelector('span').textContent = 'Release to refresh';
            }
          }, 400);
        }).catch(function(){
          if(ind) ind.classList.remove('visible','spinning');
        });
      } else {
        if(ind) ind.classList.remove('visible');
      }
    }, {passive:true});
  }
};

})();

function _stopAdAutoAdvance(){

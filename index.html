<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZYNIX - Creator & Social Ecosystem</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        zynix: {
                            bg: "#090d16",
                            card: "#111827",
                            cardHover: "#1f2937",
                            border: "#1e293b",
                            emerald: "#10b981",
                            blue: "#3b82f6",
                            pink: "#ec4899",
                            purple: "#8b5cf6",
                            amber: "#f59e0b"
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom Scrollbar & Animations */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #090d16; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
        
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8); opacity: 0; }
            20% { opacity: 1; transform: translateY(-10px) scale(1); }
            100% { transform: translateY(-120px) scale(1.1); opacity: 0; }
        }
        .dollar-anim {
            animation: floatUp 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        @keyframes pulseWallet {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); box-shadow: 0 0 20px rgba(16, 185, 129, 0.6); }
            100% { transform: scale(1); }
        }
        .wallet-pulse {
            animation: pulseWallet 0.5s ease-in-out;
        }
        body { background-color: #090d16; color: #f8fafc; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
    </style>
</head>
<body class="min-h-screen pb-20 selection:bg-emerald-500 selection:text-black">

    <!-- Top Sticky Header -->
    <header class="sticky top-0 z-40 bg-[#090d16]/90 backdrop-blur-md border-b border-slate-800 px-4 py-2.5 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <button type="button" onclick="Z.openAdminWall()" class="flex items-center space-x-2 text-left focus:outline-none group">
                <span class="text-xl font-black tracking-wider bg-gradient-to-r from-emerald-400 via-blue-500 to-indigo-500 bg-clip-text text-transparent group-hover:opacity-90">
                    ZYNIX
                </span>
                <span class="text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-1.5 py-0.5 rounded font-bold uppercase tracking-widest hidden sm:inline-block">Hub</span>
            </button>
        </div>

        <div class="flex items-center space-x-2.5">
            <!-- Wallet Compact Pill -->
            <button type="button" onclick="Z.showView('wallet')" class="bg-slate-900/90 border border-slate-800 hover:border-slate-700 px-3 py-1 rounded-full text-xs flex items-center space-x-2 shadow-inner transition">
                <div class="flex items-center space-x-1" title="Cash Balance">
                    <i class="fa-solid fa-wallet text-emerald-400 text-[10px]"></i>
                    <span id="header-cash" class="text-emerald-400 font-bold">$0.00</span>
                </div>
                <span class="text-slate-700">|</span>
                <div class="flex items-center space-x-1" title="Bounty Balance">
                    <i class="fa-solid fa-gift text-blue-400 text-[10px]"></i>
                    <span id="header-bounty" class="text-blue-400 font-bold">$0.00</span>
                </div>
            </button>

            <!-- User Auth / Profile Access -->
            <div id="header-auth-container">
                <button type="button" onclick="Z.openAuthModal('login')" class="bg-emerald-600 hover:bg-emerald-500 text-black font-bold text-xs px-3 py-1.5 rounded-full transition shadow-md">
                    Login
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container App -->
    <main id="app-container" class="max-w-xl mx-auto px-3 py-3 min-h-[calc(100vh-120px)] relative">
        <!-- Dynamic Views Will Render Here -->
    </main>

    <!-- Fixed Bottom Navigation (Mobile First) -->
    <nav class="fixed bottom-0 left-0 right-0 z-40 bg-[#090d16]/95 backdrop-blur-lg border-t border-slate-800 px-4 py-2 max-w-xl mx-auto flex items-center justify-between shadow-2xl">
        <button type="button" onclick="Z.showView('home')" id="nav-btn-home" class="flex flex-col items-center justify-center text-slate-400 hover:text-emerald-400 transition w-1/5 py-1">
            <i class="fa-solid fa-house text-lg"></i>
            <span class="text-[10px] font-medium mt-0.5">Home</span>
        </button>
        <button type="button" onclick="Z.showView('spark')" id="nav-btn-spark" class="flex flex-col items-center justify-center text-slate-400 hover:text-emerald-400 transition w-1/5 py-1">
            <i class="fa-solid fa-bolt text-lg"></i>
            <span class="text-[10px] font-medium mt-0.5">Spark</span>
        </button>
        <button type="button" onclick="Z.openCreateModal()" class="flex items-center justify-center w-11 h-11 bg-gradient-to-tr from-emerald-500 to-blue-600 rounded-full text-black hover:scale-105 transition shadow-lg shadow-emerald-500/20 -mt-3">
            <i class="fa-solid fa-plus text-base font-black"></i>
        </button>
        <button type="button" onclick="Z.showView('people')" id="nav-btn-people" class="flex flex-col items-center justify-center text-slate-400 hover:text-emerald-400 transition w-1/5 py-1">
            <i class="fa-solid fa-users text-lg"></i>
            <span class="text-[10px] font-medium mt-0.5">People</span>
        </button>
        <button type="button" onclick="Z.showView('profile')" id="nav-btn-profile" class="flex flex-col items-center justify-center text-slate-400 hover:text-emerald-400 transition w-1/5 py-1">
            <i class="fa-solid fa-user text-lg"></i>
            <span class="text-[10px] font-medium mt-0.5">Profile</span>
        </button>
    </nav>

    <!-- Floating AI Assistant -->
    <div class="fixed bottom-16 right-4 z-50">
        <button type="button" onclick="Z.toggleAiAssistant()" class="w-12 h-12 bg-indigo-600 hover:bg-indigo-500 text-white rounded-full flex items-center justify-center shadow-xl border border-indigo-400/30 transition transform hover:scale-105">
            <i class="fa-solid fa-robot text-lg"></i>
        </button>
    </div>

    <!-- AI Assistant Modal/Drawer -->
    <div id="ai-modal" class="hidden fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-t-3xl sm:rounded-2xl w-full max-w-md p-4 space-y-4 max-h-[85vh] flex flex-col shadow-2xl">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <div class="flex items-center space-x-2">
                    <div class="w-8 h-8 rounded-full bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center text-indigo-400 font-bold">
                        <i class="fa-solid fa-robot text-sm"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-sm text-white">ZYNIX AI Guide</h3>
                        <p class="text-[10px] text-slate-400">Your intelligent platform assistant</p>
                    </div>
                </div>
                <button type="button" onclick="Z.toggleAiAssistant()" class="text-slate-400 hover:text-white p-2">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div id="ai-chat-body" class="flex-1 overflow-y-auto space-y-3 p-2 text-xs text-slate-300 max-h-60">
                <div class="bg-slate-800/80 border border-slate-700/50 p-2.5 rounded-xl">
                    Hello! I am your ZYNIX Assistant. How can I guide you through the wallet, bounty settings, Sparks, or packages today?
                </div>
            </div>
            <div class="flex items-center space-x-2 pt-2 border-t border-slate-800">
                <input type="text" id="ai-input" placeholder="Ask about wallet, packages, sparks..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500" onkeydown="if(event.key==='Enter')Z.sendAiQuery()">
                <button type="button" onclick="Z.sendAiQuery()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3.5 py-2 rounded-xl text-xs font-bold transition">
                    <i class="fa-solid fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Auth Modal -->
    <dialog id="auth-dialog" class="bg-transparent p-0 max-w-md w-full backdrop:bg-black/80 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4 shadow-2xl">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <h3 id="auth-title" class="font-bold text-white text-base">Welcome to ZYNIX</h3>
                <button type="button" onclick="Z.closeAuthModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <div class="flex bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs font-bold">
                <button type="button" id="auth-tab-login" onclick="Z.switchAuthTab('login')" class="flex-1 py-2 rounded-lg bg-emerald-600 text-black transition">Login</button>
                <button type="button" id="auth-tab-signup" onclick="Z.switchAuthTab('signup')" class="flex-1 py-2 rounded-lg text-slate-400 hover:text-white transition">Sign Up</button>
            </div>

            <form id="auth-form" onsubmit="Z.handleAuthSubmit(event)" class="space-y-3">
                <div id="signup-fields" class="space-y-3 hidden">
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1">Full Name</label>
                        <input type="text" id="auth-name" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500" placeholder="Abdullah Abbas">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1">Username</label>
                        <input type="text" id="auth-username" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500" placeholder="abdullah_abbas">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-slate-400 mb-1">Profession</label>
                        <input type="text" id="auth-profession" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500" placeholder="Creator & Medical Student">
                    </div>
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 mb-1">Email</label>
                    <input type="email" id="auth-email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500" placeholder="user@zynix.io">
                </div>
                <div>
                    <label class="block text-[11px] font-semibold text-slate-400 mb-1">Password</label>
                    <input type="password" id="auth-password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500" placeholder="••••••••">
                </div>
                <div id="signup-confirm-field" class="hidden">
                    <label class="block text-[11px] font-semibold text-slate-400 mb-1">Confirm Password</label>
                    <input type="password" id="auth-confirm-password" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500" placeholder="••••••••">
                </div>
                <button type="submit" id="auth-submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-black font-bold py-2.5 rounded-xl text-xs transition shadow-lg mt-2">
                    Login to ZYNIX
                </button>
            </form>
        </div>
    </dialog>

    <!-- Create Selection Modal -->
    <dialog id="create-dialog" class="bg-transparent p-0 max-w-sm w-full backdrop:bg-black/80 z-50">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3 shadow-2xl">
            <div class="flex items-center justify-between border-b border-slate-800 pb-2">
                <h3 class="font-bold text-white text-sm">Create on ZYNIX</h3>
                <button type="button" onclick="document.getElementById('create-dialog').close()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="space-y-2">
                <button type="button" onclick="document.getElementById('create-dialog').close(); Z.showView('create-post')" class="w-full flex items-center space-x-3 bg-slate-950 hover:bg-slate-800 border border-slate-800 p-3 rounded-xl text-left transition">
                    <div class="w-9 h-9 rounded-xl bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 flex items-center justify-center"><i class="fa-solid fa-pen-to-square"></i></div>
                    <div>
                        <h4 class="font-bold text-xs text-white">Create Post</h4>
                        <p class="text-[10px] text-slate-400">Share your thoughts with the community</p>
                    </div>
                </button>
                <button type="button" onclick="document.getElementById('create-dialog').close(); Z.showView('create-spark')" class="w-full flex items-center space-x-3 bg-slate-950 hover:bg-slate-800 border border-slate-800 p-3 rounded-xl text-left transition">
                    <div class="w-9 h-9 rounded-xl bg-blue-500/10 border border-blue-500/20 text-blue-400 flex items-center justify-center"><i class="fa-solid fa-bolt"></i></div>
                    <div>
                        <h4 class="font-bold text-xs text-white">Create Spark</h4>
                        <p class="text-[10px] text-slate-400">Publish a short-form video & tags</p>
                    </div>
                </button>
                <button type="button" onclick="document.getElementById('create-dialog').close(); Z.showView('status-creator')" class="w-full flex items-center space-x-3 bg-slate-950 hover:bg-slate-800 border border-slate-800 p-3 rounded-xl text-left transition">
                    <div class="w-9 h-9 rounded-xl bg-pink-500/10 border border-pink-500/20 text-pink-400 flex items-center justify-center"><i class="fa-solid fa-circle-notch"></i></div>
                    <div>
                        <h4 class="font-bold text-xs text-white">Create Status</h4>
                        <p class="text-[10px] text-slate-400">Publish a 24h temporary status update</p>
                    </div>
                </button>
            </div>
        </div>
    </dialog>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-14 right-4 z-50 space-y-2 pointer-events-none"></div>

    <!-- Application JavaScript Engine & Data Layer -->
    <script>
        window.Z = {};

        // Local Storage & State Management
        Z.State = {
            currentUser: null, // if null, guest mode
            currentView: 'home',
            activeProfileUser: null,
            activeCircle: null,
            activeSpark: null
        };

        // Core Reward Engine (60% Cash, 40% Bounty Split)
        Z.RewardEngine = {
            calculateSplit: function(grossAmount) {
                const cash = Number((grossAmount * 0.60).toFixed(4));
                const bounty = Number((grossAmount * 0.40).toFixed(4));
                return { cash, bounty, gross: grossAmount };
            },
            creditReward: function(user, grossAmount, reason, postOrActionId) {
                if (!user) return false;
                const split = this.calculateSplit(grossAmount);
                
                // Initialize wallet if missing
                if (!user.wallet) {
                    user.wallet = { cash: 1.26, bounty: 0.84, totalEarned: 2.10 };
                }
                if (!user.walletTransactions) user.walletTransactions = [];

                user.wallet.cash += split.cash;
                user.wallet.bounty += split.bounty;
                user.wallet.totalEarned += grossAmount;

                user.walletTransactions.unshift({
                    id: 'tx_' + Date.now(),
                    date: new Date().toISOString(),
                    type: reason,
                    amount: grossAmount,
                    cash: split.cash,
                    bounty: split.bounty,
                    status: 'Completed'
                });

                Z.DB.saveUsers();
                Z.updateHeaderWallet();
                Z.triggerRewardAnimation(grossAmount);
                Z.showToast(`Reward received: +$${grossAmount.toFixed(2)} (+$${split.cash.toFixed(3)} Cash, +$${split.bounty.toFixed(3)} Bounty)`);
                return true;
            },
            processInteraction: function(contentOwner, interactionType, post) {
                if (!Z.State.currentUser) {
                    Z.openAuthModal('login');
                    Z.showToast('Please log in to continue.');
                    return false;
                }
                if (contentOwner.id === Z.State.currentUser.id) {
                    Z.showToast('You cannot earn rewards from your own content.');
                    return false;
                }

                // Check creator bounty settings
                const bountySettings = contentOwner.bountySettings || { view: 0.00, like: 0.01, share: 0.03, follow: 0.03 };
                const rewardAmount = bountySettings[interactionType] || 0.00;

                if (rewardAmount <= 0) return true; // No bounty configured for this action, proceed normally

                // Check if creator has sufficient bounty balance
                if (!contentOwner.wallet) contentOwner.wallet = { cash: 5.00, bounty: 5.00, totalEarned: 10.00 };
                if (contentOwner.wallet.bounty < rewardAmount) {
                    Z.showToast('Creator bounty balance is insufficient for this reward.');
                    return false;
                }

                // Deduct from creator bounty balance
                contentOwner.wallet.bounty -= rewardAmount;
                if (!contentOwner.bountySpentHistory) contentOwner.bountySpentHistory = [];
                contentOwner.bountySpentHistory.unshift({
                    id: 'bspend_' + Date.now(),
                    date: new Date().toISOString(),
                    recipient: Z.State.currentUser.name,
                    action: interactionType,
                    amount: rewardAmount,
                    postId: post ? post.id : null
                });

                // Credit recipient user
                this.creditReward(Z.State.currentUser, rewardAmount, `${interactionType.toUpperCase()} Reward`);
                Z.DB.saveUsers();
                return true;
            }
        };

        // Dollar Reward Animation & Toast System
        Z.triggerRewardAnimation = function(amount) {
            const walletEl = document.querySelector('header');
            if (walletEl) {
                walletEl.classList.add('wallet-pulse');
                setTimeout(() => walletEl.classList.remove('wallet-pulse'), 500);
            }
            const floatingNote = document.createElement('div');
            floatingNote.className = 'fixed z-50 bg-emerald-500 text-black font-black px-3 py-1 rounded-full text-xs shadow-xl dollar-anim border border-emerald-300';
            floatingNote.style.left = (window.innerWidth / 2 - 30) + 'px';
            floatingNote.style.top = (window.innerHeight - 150) + 'px';
            floatingNote.innerHTML = `<i class="fa-solid fa-dollar-sign mr-1"></i>+$${amount.toFixed(2)}`;
            document.body.appendChild(floatingNote);
            setTimeout(() => floatingNote.remove(), 1200);
        };

        Z.showToast = function(message) {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = 'bg-slate-900 border border-slate-700 text-slate-100 px-4 py-2.5 rounded-xl text-xs shadow-2xl flex items-center space-x-2 pointer-events-auto transition transform translate-y-2 opacity-0 animate-fade';
            toast.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'transition', 'duration-300');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };

        // Local Database / Abstraction Layer (Prepared for Supabase)
        Z.DB = {
            getUsers: function() {
                const data = localStorage.getItem('zynix_users');
                if (!data) return Z.SeedData.users;
                return JSON.parse(data);
            },
            saveUsers: function(users) {
                if (users) localStorage.setItem('zynix_users', JSON.stringify(users));
                else localStorage.setItem('zynix_users', JSON.stringify(Z.SeedData.users));
            },
            getCurrentUser: function() {
                const id = localStorage.getItem('zynix_current_user_id');
                if (!id) return null;
                const users = this.getUsers();
                return users.find(u => u.id === id) || null;
            },
            setCurrentUser: function(user) {
                if (user) localStorage.setItem('zynix_current_user_id', user.id);
                else localStorage.removeItem('zynix_current_user_id');
                Z.State.currentUser = user;
                Z.renderHeaderAuth();
            },
            getPosts: function() {
                const data = localStorage.getItem('zynix_posts');
                if (!data) return Z.SeedData.posts;
                return JSON.parse(data);
            },
            savePosts: function(posts) {
                localStorage.setItem('zynix_posts', JSON.stringify(posts));
            },
            getSparks: function() {
                const data = localStorage.getItem('zynix_sparks');
                if (!data) return Z.SeedData.sparks;
                return JSON.parse(data);
            },
            saveSparks: function(sparks) {
                localStorage.setItem('zynix_sparks', JSON.stringify(sparks));
            },
            getStatuses: function() {
                const data = localStorage.getItem('zynix_statuses');
                if (!data) return Z.SeedData.statuses;
                return JSON.parse(data);
            },
            saveStatuses: function(statuses) {
                localStorage.setItem('zynix_statuses', JSON.stringify(statuses));
            },
            getCircles: function() {
                const data = localStorage.getItem('zynix_circles');
                if (!data) return Z.SeedData.circles;
                return JSON.parse(data);
            },
            saveCircles: function(circles) {
                localStorage.setItem('zynix_circles', JSON.stringify(circles));
            },
            getAdminPosts: function() {
                const data = localStorage.getItem('zynix_admin_posts');
                if (!data) return Z.SeedData.adminPosts;
                return JSON.parse(data);
            },
            saveAdminPosts: function(adminPosts) {
                localStorage.setItem('zynix_admin_posts', JSON.stringify(adminPosts));
            }
        };

        // Seed Data for First-Time Launch
        Z.SeedData = {
            users: [
                {
                    id: 'usr_1',
                    name: 'Abdullah Abbas',
                    username: 'abdullah_abbas',
                    profession: 'Creator & Medical Student',
                    dob: '2006-05-12',
                    bio: 'Building ZYNIX and exploring organic chemistry, design assets, and digital growth.',
                    role: 'Creator',
                    avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80',
                    cover: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=800&q=80',
                    followers: 1420,
                    package: '$100',
                    bountySettings: { view: 0.00, like: 0.01, share: 0.03, follow: 0.03 },
                    wallet: { cash: 45.50, bounty: 28.20, totalEarned: 120.50 },
                    walletTransactions: [
                        { id: 'tx_01', date: '2026-09-06T10:00:00Z', type: 'Like Reward', amount: 0.01, cash: 0.006, bounty: 0.004, status: 'Completed' }
                    ],
                    bountySpentHistory: [],
                    packageHistory: [{ name: '$100 Package', date: '2026-08-01', price: '$100', status: 'Active' }],
                    referrals: { code: 'ZYNIX-ABD2026', level1Count: 12, level2Count: 34, level3Count: 8, earnings: 184.00 },
                    email: 'abdullah@zynix.io',
                    password: 'password123'
                },
                {
                    id: 'usr_2',
                    name: 'Ayesha Khan',
                    username: 'ayesha_creatives',

            if (!localStorage.getItem('zynix_sparks')) Z.DB.saveSparks(Z.SeedData.sparks);

        Z.updateHeaderWallet = function() {
            const user = Z.State.currentUser || Z.DB.getUsers()[0];
            const cashEl = document.getElementById('header-cash');
            const bountyEl = document.getElementById('header-bounty');
            if (cashEl && user.wallet) cashEl.innerText = '$' + user.wallet.cash.toFixed(2);
            if (bountyEl && user.wallet) bountyEl.innerText = '$' + user.wallet.bounty.toFixed(2);

        // Authentication Modal Handler
        Z.openAuthModal = function(mode) {
            const dialog = document.getElementById('auth-dialog');
            Z.switchAuthTab(mode);
            if (dialog) dialog.showModal();
        };
        Z.closeAuthModal = function() {
            const dialog = document.getElementById('auth-dialog');
            if (dialog) dialog.close();
        };
        Z.switchAuthTab = function(mode) {
            const loginBtn = document.getElementById('auth-tab-login');
            const signupBtn = document.getElementById('auth-tab-signup');
            const signupFields = document.getElementById('signup-fields');
            const confirmField = document.getElementById('signup-confirm-field');
            const submitBtn = document.getElementById('auth-submit-btn');
            const title = document.getElementById('auth-title');

            if (mode === 'login') {
                loginBtn.className = "flex-1 py-2 rounded-lg bg-emerald-600 text-black transition font-bold";
                signupBtn.className = "flex-1 py-2 rounded-lg text-slate-400 hover:text-white transition font-bold";
                signupFields.classList.add('hidden');
                confirmField.classList.add('hidden');
                submitBtn.innerText = "Login to ZYNIX";
                title.innerText = "Welcome Back to ZYNIX";
                document.getElementById('auth-form').dataset.mode = 'login';
            } else {
                signupBtn.className = "flex-1 py-2 rounded-lg bg-emerald-600 text-black transition font-bold";
                loginBtn.className = "flex-1 py-2 rounded-lg text-slate-400 hover:text-white transition font-bold";
                signupFields.classList.remove('hidden');
                confirmField.classList.remove('hidden');
                submitBtn.innerText = "Create Account";
                title.innerText = "Join ZYNIX Platform";
                document.getElementById('auth-form').dataset.mode = 'signup';
            }
        };

        Z.handleAuthSubmit = function(e) {
            e.preventDefault();
            const mode = document.getElementById('auth-form').dataset.mode || 'login';
            const email = document.getElementById('auth-email').value.trim();
            const password = document.getElementById('auth-password').value.trim();
            const users = Z.DB.getUsers();

            if (mode === 'login') {
                const user = users.find(u => u.email === email && u.password === password);
                if (user) {
                    Z.DB.setCurrentUser(user);
                    Z.closeAuthModal();
                    Z.showToast('Successfully logged in!');
                    Z.showView(Z.State.currentView);
                } else {
                    Z.showToast('Invalid email or password.');
                }
            } else {
                const name = document.getElementById('auth-name').value.trim();
                const username = document.getElementById('auth-username').value.trim();
                const profession = document.getElementById('auth-profession').value.trim() || 'Creator';
                const confirmPassword = document.getElementById('auth-confirm-password').value.trim();

                if (!name || !username || !email || !password) {
                    Z.showToast('Please fill in all required fields.');
                    return;
                }
                if (password !== confirmPassword) {
                    Z.showToast('Passwords do not match.');
                    return;
                }
                if (users.some(u => u.username === username)) {
                    Z.showToast('Username already exists.');
                    return;
                }

                const newUser = {
                    id: 'usr_' + Date.now(),
                    name,
                    username,
                    profession,
                    dob: '2005-01-01',
                    bio: 'New ZYNIX Creator & Community Member.',
                    role: 'Viewer',
                    avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80',
                    cover: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=800&q=80',
                    followers: 0,
                    package: 'FREE',
                    bountySettings: { view: 0.00, like: 0.01, share: 0.03, follow: 0.03 },
                    wallet: { cash: 0.00, bounty: 1.00, totalEarned: 0.00 },
                    walletTransactions: [],
                    bountySpentHistory: [],
                    packageHistory: [],
                    referrals: { code: 'ZYNIX-' + username.toUpperCase(), level1Count: 0, level2Count: 0, level3Count: 0, earnings: 0 },
                    email,
                    password
                };

                users.push(newUser);
                Z.DB.saveUsers(users);
                Z.DB.setCurrentUser(newUser);
                Z.closeAuthModal();
                Z.showToast('Account created successfully!');
                Z.showView('home');
            }
        };

        Z.sendAiQuery = function() {
            const input = document.getElementById('ai-input');
            const body = document.getElementById('ai-chat-body');
            if (!input || !input.value.trim()) return;
            const query = input.value.trim();
            
            const userMsg = document.createElement('div');
            userMsg.className = 'bg-slate-800 text-white p-2.5 rounded-xl ml-6 text-right';
            userMsg.innerText = query;
            body.appendChild(userMsg);
            input.value = '';
            body.scrollTop = body.scrollHeight;

            setTimeout(() => {
                const aiMsg = document.createElement('div');
                aiMsg.className = 'bg-indigo-950/60 border border-indigo-500/30 text-indigo-200 p-2.5 rounded-xl mr-6';
                let reply = "ZYNIX is your independent creator ecosystem. You can explore Sparks, share posts, earn cash and bounty rewards, and upgrade packages.";
                const q = query.toLowerCase();
                if (q.includes('wallet') || q.includes('earn')) {
                    reply = "Your ZYNIX Wallet separates Cash Balance (withdrawable) and Bounty Balance (used to fund creator rewards). Every reward splits 60% to Cash and 40% to Bounty.";
                } else if (q.includes('package') || q.includes('upgrade')) {
                    reply = "Packages range from FREE up to $100. Higher packages unlock higher daily interaction limits, referral levels up to 3 tiers, and increased creator reach.";
                } else if (q.includes('spark')) {
                    reply = "Sparks are ZYNIX short-form videos. You can browse the Spark Stream, create short videos with hashtags, and search by tags.";
                }
                aiMsg.innerText = reply;
                body.appendChild(aiMsg);
                body.scrollTop = body.scrollHeight;
            }, 600);
        };

        // Navigation & Router Engine
        Z.showView = function(viewName, param) {
            Z.State.currentView = viewName;
            window.scrollTo({ top: 0, behavior: 'smooth' });

            // Highlight bottom nav items
            ['home', 'spark', 'people', 'profile'].forEach(nav => {
                const btn = document.getElementById(`nav-btn-${nav}`);
                if (btn) {
                    if (nav === viewName) btn.classList.add('text-emerald-400');
                    else btn.classList.remove('text-emerald-400');
                }
            });

            const container = document.getElementById('app-container');
            if (!container) return;

            if (viewName === 'home') container.innerHTML = Z.Views.renderHome();
            else if (viewName === 'spark') container.innerHTML = Z.Views.renderSparkStream();
            else if (viewName === 'create-post') container.innerHTML = Z.Views.renderCreatePost();
            else if (viewName === 'create-spark') container.innerHTML = Z.Views.renderCreateSpark();
            else if (viewName === 'status-creator') container.innerHTML = Z.Views.renderStatusCreator();
            else if (viewName === 'people') container.innerHTML = Z.Views.renderPeople();
            else if (viewName === 'profile') container.innerHTML = Z.Views.renderProfileDashboard();
            else if (viewName === 'public-profile') container.innerHTML = Z.Views.renderPublicProfile(param);
            else if (viewName === 'wallet') container.innerHTML = Z.Views.renderWallet();
            else if (viewName === 'packages') container.innerHTML = Z.Views.renderPackages();
            else if (viewName === 'calculator') container.innerHTML = Z.Views.renderCalculator();
            else if (viewName === 'referrals') container.innerHTML = Z.Views.renderReferrals();
            else if (viewName === 'analytics') container.innerHTML = Z.Views.renderAnalytics();
            else if (viewName === 'circles') container.innerHTML = Z.Views.renderCircles();
            else if (viewName === 'admin-wall') container.innerHTML = Z.Views.renderAdminWall();
            else if (viewName === 'bounty-settings') container.innerHTML = Z.Views.renderBountySettings();
            else container.innerHTML = Z.Views.renderHome();
        };

                if (!Z.State.currentUser) {
                    Z.openAuthModal('login');
                    Z.showToast('Please log in to react.');
                    return;
                }
                const posts = Z.DB.getPosts();
                const post = posts.find(p => p.id === postId);
                if (post) {
                    post.reactions[reactionType] = (post.reactions[reactionType] || 0) + 1;
                    Z.DB.savePosts(posts);
                    const author = Z.DB.getUsers().find(u => u.id === post.authorId);

                                ${user.walletTransactions && user.walletTransactions.length > 0 ? user.walletTransactions.map(tx => `
                                    <div class="bg-slate-950 border border-slate-800 p-2.5 rounded-xl flex items-center justify-between text-xs">
                                        <div>
                                            <div class="font-bold text-white">${tx.type}</div>
                                            <span class="text-[10px] text-slate-400">${new Date(tx.date).toLocaleDateString()}</span>
                                        </div>
                                        <div class="text-right">
                                            <div class="font-bold text-emerald-400">+$${tx.amount.toFixed(2)}</div>
                                            <span class="text-[9px] text-slate-500">Cash: +$${tx.cash.toFixed(3)} | Bounty: +$${tx.bounty.toFixed(3)}</span>
                                        </div>
                                    </div>
                                `).join('') : '<p class="text-xs text-slate-500 text-center py-4">No transactions yet.</p>'}
                            </div>
                        </div>
                    </div>
                `;
            },

            // Bounty Settings View
            renderBountySettings: function() {
                const user = Z.State.currentUser || Z.DB.getUsers()[0];
                return `
                    <div class="bg-[#111827] border border-slate-800 rounded-2xl p-4 space-y-4 shadow-2xl">
                        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                            <h3 class="font-bold text-sm text-white">Account-Level Bounty Settings</h3>
                            <button type="button" onclick="Z.showView('profile')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <p class="text-xs text-slate-400">Configure rewards funded from your creator bounty balance when users interact with your eligible content.</p>
                        
                        <div class="space-y-3">
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-400 mb-1">View Bounty ($)</label>
                                <input type="number" step="0.01" id="bounty-view" value="${user.bountySettings.view}" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-400 mb-1">Like Bounty ($)</label>
                                <input type="number" step="0.01" id="bounty-like" value="${user.bountySettings.like}" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-400 mb-1">Share Bounty ($)</label>
                                <input type="number" step="0.01" id="bounty-share" value="${user.bountySettings.share}" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
                            </div>
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-400 mb-1">Follow Bounty ($)</label>
                                <input type="number" step="0.01" id="bounty-follow" value="${user.bountySettings.follow}" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500">
                            </div>
                            <button type="button" onclick="Z.Views.saveBountySettings()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-black font-bold py-2.5 rounded-xl text-xs transition shadow-lg mt-2">
                                Save Bounty Settings
                            </button>
                        </div>
                    </div>
                `;
            },
            saveBountySettings: function() {
                const user = Z.State.currentUser;
                if (!user) return;
                user.bountySettings.view = parseFloat(document.getElementById('bounty-view').value) || 0;
                user.bountySettings.like = parseFloat(document.getElementById('bounty-like').value) || 0;
                user.bountySettings.share = parseFloat(document.getElementById('bounty-share').value) || 0;
                user.bountySettings.follow = parseFloat(document.getElementById('bounty-follow').value) || 0;
                Z.DB.saveUsers(Z.DB.getUsers());
                Z.showToast('Bounty settings updated successfully!');
                Z.showView('profile');
            },

            // Packages View
            renderPackages: function() {
                const user = Z.State.currentUser || Z.DB.getUsers()[0];
                const packages = [
                    { name: 'FREE', price: '$0', limit: 'No earning from likes', comm: 'Browse & post' },
                    { name: 'STARTER $3', price: '$3', limit: '3 daily limit', comm: '2 referral levels ($1+$1)' },
                    { name: '$10', price: '$10', limit: '5 daily limit', comm: 'Standard rewards' },
                    { name: '$20', price: '$20', limit: '10 daily limit', comm: 'Standard rewards' },
                    { name: '$40', price: '$40', limit: '20 daily limit', comm: 'Standard rewards' },
                    { name: '$100', price: '$100', limit: 'Unlimited daily limit', comm: '3 referral levels ($10, $8, $6)' }
                ];

                let pkgsHtml = '';
                packages.forEach(p => {
                    const isCurrent = user.package === p.name;
                    pkgsHtml += `
                        <div class="bg-slate-950 border ${isCurrent ? 'border-emerald-500 ring-1 ring-emerald-500/50' : 'border-slate-800'} rounded-2xl p-4 space-y-2">
                            <div class="flex items-center justify-between">
                                <h4 class="font-bold text-sm text-white">${p.name}</h4>
                                <span class="text-xs font-bold text-emerald-400">${p.price}</span>
                            </div>
                            <p class="text-[11px] text-slate-400">${p.limit} • ${p.comm}</p>
                            <button type="button" onclick="Z.Views.upgradePackage('${p.name}')" class="w-full ${isCurrent ? 'bg-slate-800 text-slate-400 cursor-default' : 'bg-emerald-600 hover:bg-emerald-500 text-black font-bold'} py-2 rounded-xl text-xs transition shadow-md">
                                ${isCurrent ? 'Current Package' : 'Upgrade Package'}
                            </button>
                        </div>
                    `;
                });

                return `
                    <div class="bg-[#111827] border border-slate-800 rounded-2xl p-4 space-y-4 shadow-2xl">
                        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                            <h3 class="font-bold text-sm text-white">ZYNIX Account Packages</h3>
                            <button type="button" onclick="Z.showView('profile')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <div class="space-y-3">
                            ${pkgsHtml}
                        </div>
                    </div>
                `;
            },
            upgradePackage: function(packageName) {
                const user = Z.State.currentUser;
                if (!user) {
                    Z.openAuthModal('login');
                    return;
                }
                user.package = packageName;
                Z.DB.saveUsers(Z.DB.getUsers());
                Z.showToast(`Package upgraded to ${packageName}!`);
                Z.showView('packages');
            },

            // Calculator View
            renderCalculator: function() {
                return `
                    <div class="bg-[#111827] border border-slate-800 rounded-2xl p-4 space-y-4 shadow-2xl">
                        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                            <h3 class="font-bold text-sm text-white">Reward & Earnings Calculator</h3>
                            <button type="button" onclick="Z.showView('profile')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <div class="space-y-3">
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-400 mb-1">Expected Daily Eligible Interactions</label>
                                <input type="number" id="calc-interactions" value="50" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500" oninput="Z.Views.calculateEarnings()">
                            </div>
                            <div class="bg-slate-950 border border-slate-800 p-3 rounded-xl space-y-2">
                                <div class="flex justify-between text-xs text-slate-300">
                                    <span>Estimated Gross Reward:</span>
                                    <span id="calc-gross" class="font-bold text-white">$0.50</span>
                                </div>
                                <div class="flex justify-between text-xs text-slate-300">
                                    <span>Cash Portion (60%):</span>
                                    <span id="calc-cash" class="font-bold text-emerald-400">$0.30</span>
                                </div>
                                <div class="flex justify-between text-xs text-slate-300">
                                    <span>Bounty Portion (40%):</span>
                                    <span id="calc-bounty" class="font-bold text-blue-400">$0.20</span>
                                </div>
                            </div>
                            <p class="text-[10px] text-slate-500 italic">Estimate only — actual rewards depend on platform rules, eligibility and available bounty.</p>
                        </div>
                    </div>
                `;
            },
            calculateEarnings: function() {
                const count = parseFloat(document.getElementById('calc-interactions').value) || 0;
                const gross = count * 0.01;
                const split = Z.RewardEngine.calculateSplit(gross);
                document.getElementById('calc-gross').innerText = '$' + gross.toFixed(2);
                document.getElementById('calc-cash').innerText = '$' + split.cash.toFixed(2);
                document.getElementById('calc-bounty').innerText = '$' + split.bounty.toFixed(2);
            },

            // Referrals View
            renderReferrals: function() {
                const user = Z.State.currentUser || Z.DB.getUsers()[0];
                return `
                    <div class="bg-[#111827] border border-slate-800 rounded-2xl p-4 space-y-4 shadow-2xl">
                        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                            <h3 class="font-bold text-sm text-white">Referral Ecosystem</h3>
                            <button type="button" onclick="Z.showView('profile')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <div class="space-y-3">
                            <div>
                                <label class="block text-[11px] font-semibold text-slate-400 mb-1">Your Referral Code</label>
                                <div class="flex space-x-2">
                                    <input type="text" readonly value="${user.referrals.code}" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-emerald-400 font-bold focus:outline-none">
                                    <button type="button" onclick="navigator.clipboard.writeText('${user.referrals.code}'); Z.showToast('Referral code copied!');" class="bg-emerald-600 hover:bg-emerald-500 text-black font-bold px-4 py-2 rounded-xl text-xs transition">Copy</button>
                                </div>
                            </div>
                            <div class="grid grid-cols-3 gap-2 pt-2">
                                <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800 text-center">
                                    <span class="text-[10px] text-slate-400">Level 1</span>
                                    <div class="font-bold text-white text-sm">${user.referrals.level1Count}</div>
                                </div>
                                <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800 text-center">
                                    <span class="text-[10px] text-slate-400">Level 2</span>
                                    <div class="font-bold text-white text-sm">${user.referrals.level2Count}</div>
                                </div>
                                <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800 text-center">
                                    <span class="text-[10px] text-slate-400">Earnings</span>
                                    <div class="font-bold text-emerald-400 text-sm">$${user.referrals.earnings.toFixed(2)}</div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            },

            // Analytics View
            renderAnalytics: function() {
                return `
                    <div class="bg-[#111827] border border-slate-800 rounded-2xl p-4 space-y-4 shadow-2xl">
                        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                            <h3 class="font-bold text-sm text-white">Creator Analytics</h3>
                            <button type="button" onclick="Z.showView('profile')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div class="bg-slate-950 border border-slate-800 p-3 rounded-xl space-y-1">
                                <span class="text-[10px] text-slate-400 uppercase font-semibold">Profile Views</span>
                                <div class="text-lg font-black text-white">1,420</div>
                            </div>
                            <div class="bg-slate-950 border border-slate-800 p-3 rounded-xl space-y-1">
                                <span class="text-[10px] text-slate-400 uppercase font-semibold">Spark Engagement</span>
                                <div class="text-lg font-black text-emerald-400">98.4%</div>
                            </div>
                            <div class="bg-slate-950 border border-slate-800 p-3 rounded-xl space-y-1">
                                <span class="text-[10px] text-slate-400 uppercase font-semibold">Total Post Likes</span>
                                <div class="text-lg font-black text-blue-400">342</div>
                            </div>
                            <div class="bg-slate-950 border border-slate-800 p-3 rounded-xl space-y-1">
                                <span class="text-[10px] text-slate-400 uppercase font-semibold">Bounty Distributed</span>
                                <div class="text-lg font-black text-indigo-400">$12.40</div>
                            </div>
                        </div>
                    </div>
                `;
            },

            // Circles View
            renderCircles: function() {
                const circles = Z.DB.getCircles();
                let circlesHtml = '';
                circles.forEach(c => {
                    circlesHtml += `
                        <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 space-y-2">
                            <div class="flex items-center justify-between">
                                <h4 class="font-bold text-xs text-white">${c.name}</h4>
                                <span class="text-[9px] bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-2 py-0.5 rounded font-bold">${c.category}</span>
                            </div>
                            <p class="text-[11px] text-slate-400">${c.description}</p>
                            <div class="flex items-center justify-between pt-1">
                                <span class="text-[10px] text-slate-500">${c.membersCount} Members</span>
                                <button type="button" onclick="Z.showToast('Joined circle successfully!')" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs px-3 py-1 rounded-lg transition">Join Circle</button>
                            </div>
                        </div>
                    `;
                });

                return `
                    <div class="bg-[#111827] border border-slate-800 rounded-2xl p-4 space-y-4 shadow-2xl">
                        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                            <h3 class="font-bold text-sm text-white">Professional Circles</h3>
                            <button type="button" onclick="Z.showView('profile')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <div class="space-y-3">
                            ${circlesHtml}
                        </div>
                    </div>
                `;
            },

            // Admin Wall View
            renderAdminWall: function() {
                const adminPosts = Z.DB.getAdminPosts();
                let adminHtml = '';
                adminPosts.forEach(ap => {
                    adminHtml += `
                        <div class="bg-[#111827] border border-emerald-500/30 rounded-2xl p-4 space-y-3 shadow-2xl">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center space-x-2">
                                    <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded font-bold">Official ZYNIX Notice</span>
                                    <span class="text-[10px] text-slate-400">${ap.createdAt}</span>
                                </div>
                            </div>
                            <h3 class="font-bold text-sm text-white">${ap.title}</h3>
                            <p class="text-xs text-slate-300 leading-relaxed">${ap.body}</p>
                            ${ap.media ? `<div class="rounded-xl overflow-hidden border border-slate-800 max-h-60"><img src="${ap.media}" class="w-full h-full object-cover"></div>` : ''}
                        </div>
                    `;
                });

                return `
                    <div class="space-y-4">
                        <div class="flex items-center justify-between bg-[#111827] border border-slate-800 rounded-2xl p-3 shadow-lg">
                            <div class="flex items-center space-x-2">
                                <span class="text-lg font-black bg-gradient-to-r from-emerald-400 to-blue-500 bg-clip-text text-transparent">ZYNIX</span>
                                <span class="text-xs font-bold text-white">Official Admin Wall</span>
                            </div>
                            <button type="button" onclick="Z.showView('home')" class="bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs px-3 py-1.5 rounded-xl font-bold transition">Back to Home</button>
                        </div>
                        <div class="space-y-4">
                            ${adminHtml}
                        </div>
                    </div>
                `;
            }
        };
    </script>
</body>
</html>

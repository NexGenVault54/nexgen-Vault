        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
        
        @keyframes flyToWalletPure {
            0% { transform: scale(0.6) translateX(0) rotate(0deg); opacity: 0; }
            20% { transform: scale(1.2) translateX(-20px) rotate(-10deg); opacity: 1; }
            80% { transform: scale(0.9) translateY(-160px) translateX(90px) rotate(20deg); opacity: 1; }
            100% { transform: scale(0.3) translateY(-250px) translateX(160px) rotate(45deg); opacity: 0; }
        }
        .dollar-note-pure {
            animation: flyToWalletPure 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            background: transparent !important;
            box-shadow: none !important;
            border: none !important;
        }
        @keyframes pulseWallet {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); box-shadow: 0 0 25px rgba(16, 185, 129, 0.7); }
            100% { transform: scale(1); }
        }
        .wallet-pulse {
            animation: pulseWallet 0.5s ease-in-out;
        }
        body { background-color: #090d16; color: #f8fafc; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }

    <script>
        window.Z = {};

        // XSS Sanitization Helper (BUG #33 FIX)
        Z.escapeHtml = function(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        };

        Z.State = {
            currentUser: null, // Default set strictly to null (BUG #25 FIX)
            currentView: 'home',
            circleSearchQuery: '',
            sparkTagFilter: ''
        };

        // Package Rule System Specification (BUG #3 & #17 & #19 FIX)
        Z.Packages = {
            'Free': { name: 'Free', price: 0, dailyLimit: 0, canEarn: false, likeRewardRate: 0 },
            'Starter $3': { name: 'Starter $3', price: 3, dailyLimit: 10, canEarn: true, likeRewardRate: 0.01 },
            'Growth $10': { name: 'Growth $10', price: 10, dailyLimit: 25, canEarn: true, likeRewardRate: 0.015 },
            'Creator $20': { name: 'Creator $20', price: 20, dailyLimit: 50, canEarn: true, likeRewardRate: 0.02 },
            'Pro $40': { name: 'Pro $40', price: 40, dailyLimit: 100, canEarn: true, likeRewardRate: 0.02 },
            'Enterprise $100': { name: 'Enterprise $100', price: 100, dailyLimit: 500, canEarn: true, likeRewardRate: 0.025 }
        };

        // Central Reward & Bounty Engine
        Z.RewardEngine = {
            calculateSplit: function(grossAmount) {
                const cash = Number((grossAmount * 0.60).toFixed(4));
                const bounty = Number((grossAmount * 0.40).toFixed(4));
                return { cash, bounty, gross: grossAmount };
            },
            
            // Check Daily Limits (BUG #19 FIX)
            checkDailyLimit: function(user) {
                const today = new Date().toISOString().split('T')[0];
                if (!user.dailyTracker || user.dailyTracker.date !== today) {
                    user.dailyTracker = { date: today, count: 0 };
                }
                const pkg = Z.Packages[user.package || 'Free'] || Z.Packages['Free'];
                return {
                    allowed: user.dailyTracker.count < pkg.dailyLimit,
                    current: user.dailyTracker.count,
                    limit: pkg.dailyLimit
                };
            },

            creditReward: function(user, grossAmount, reason) {
                if (!user) return false;
                const split = this.calculateSplit(grossAmount);
                
                if (!user.wallet) user.wallet = { cash: 0.00, bounty: 0.00, totalEarned: 0.00 };
                if (!user.walletTransactions) user.walletTransactions = [];
                
                user.wallet.cash += split.cash;
                user.wallet.bounty += split.bounty;
                user.wallet.totalEarned += grossAmount;
                
                user.walletTransactions.unshift({
                    id: 'tx_' + Date.now(),
                    date: new Date().toISOString(),
                    type: reason,
                    amount: grossAmount,
                    cash: split.cash,
                    bounty: split.bounty,
                    status: 'Completed'
                });
                
                Z.DB.saveUsers();
                Z.updateHeaderWallet();
                Z.triggerRewardAnimation(grossAmount);
                Z.showToast(`Reward: +$${grossAmount.toFixed(2)} (+$${split.cash.toFixed(3)} Cash, +$${split.bounty.toFixed(3)} Bounty)`);
                return true;
            },

            processInteraction: function(contentOwnerId, interactionType, targetId) {
                // Check Authentication
                if (!Z.State.currentUser) {
                    Z.openAuthModal('login');
                    Z.showToast('Please log in to participate and earn rewards.');
                    return false;
                }

                const currentUser = Z.DB.getUserById(Z.State.currentUser.id);
                const pkg = Z.Packages[currentUser.package || 'Free'] || Z.Packages['Free'];

                // Package Eligibility Check (BUG #3 FIX)
                if (!pkg.canEarn) {
                    Z.showToast('Free Package users cannot earn interaction rewards. Please upgrade package!');
                    return false;
                }

                // Daily Limit Check (BUG #19 FIX)
                const limitStatus = this.checkDailyLimit(currentUser);
                if (!limitStatus.allowed) {
                    Z.showToast(`Daily limit reached (${limitStatus.limit}/${limitStatus.limit}). Upgrade package for more!`);
                    return false;
                }

                const contentOwner = Z.DB.getUserById(contentOwnerId);
                if (!contentOwner) return false;

                if (contentOwner.id === currentUser.id) {
                    Z.showToast('You cannot earn rewards from your own content or profile.');
                    return false;
                }

                // Anti-Duplicate Protection (BUG #4, #5, #6, #7, #8 FIX)
                if (!currentUser.interactionHistory) currentUser.interactionHistory = {};
                const actionKey = `${interactionType}_${targetId || contentOwnerId}`;
                if (currentUser.interactionHistory[actionKey]) {
                    Z.showToast(`You have already received a reward for this ${interactionType}.`);
                    return false;
                }

                // Creator Bounty Calculation & Bounds ($0.00 to $0.05)
                const bountySettings = contentOwner.bountySettings || { like: 0.01, share: 0.03, follow: 0.03, subscribe: 0.02, circleJoin: 0.03 };
                let rewardAmount = bountySettings[interactionType] || 0.01;
                if (rewardAmount > 0.05) rewardAmount = 0.05;

                if (!contentOwner.wallet) contentOwner.wallet = { cash: 0.00, bounty: 0.00, totalEarned: 0.00 };
                if (contentOwner.wallet.bounty < rewardAmount) {
                    Z.showToast('Creator bounty balance is insufficient for this reward.');
                    return false;
                }

                // Deduct Creator Bounty
                contentOwner.wallet.bounty -= rewardAmount;
                if (!contentOwner.bountySpentHistory) contentOwner.bountySpentHistory = [];
                contentOwner.bountySpentHistory.unshift({
                    id: 'bspend_' + Date.now(),
                    date: new Date().toISOString(),
                    recipient: currentUser.name,
                    action: interactionType,
                    amount: rewardAmount
                });

                // Update Interaction Real Data Counters (BUG #4, #5, #6, #8 FIX)
                if (interactionType === 'like') {
                    const post = Z.DB.getPosts().find(p => p.id === targetId);
                    if (post) {
                        if (!post.reactions) post.reactions = { heart: 0 };
                        post.reactions.heart++;
                        Z.DB.savePosts();
                    }
                } else if (interactionType === 'share') {
                    const post = Z.DB.getPosts().find(p => p.id === targetId);
                    if (post) {
                        post.shares = (post.shares || 0) + 1;
                        Z.DB.savePosts();
                    }
                } else if (interactionType === 'spark_like') {
                    const spark = Z.DB.getSparks().find(s => s.id === targetId);
                    if (spark) {
                        spark.likes = (spark.likes || 0) + 1;
                        Z.DB.saveSparks();
                    }
                } else if (interactionType === 'follow') {
                    contentOwner.followers = (contentOwner.followers || 0) + 1;
                    if (!currentUser.following) currentUser.following = [];
                    if (!currentUser.following.includes(contentOwner.id)) currentUser.following.push(contentOwner.id);
                }

                // Record Interaction Key & Increment Daily Limit Counter
                currentUser.interactionHistory[actionKey] = new Date().toISOString();
                currentUser.dailyTracker.count++;

                Z.DB.saveUsers();
                this.creditReward(currentUser, rewardAmount, `${interactionType.toUpperCase()} Reward`);
                
                // Refresh View if active
                if (['home', 'spark', 'people', 'circles'].includes(Z.State.currentView)) {
                    Z.showView(Z.State.currentView);
                }
                return true;
            }
        };

        Z.triggerRewardAnimation = function(amount) {
            const walletEl = document.querySelector('header');
            if (walletEl) {
                walletEl.classList.add('wallet-pulse');
                setTimeout(() => walletEl.classList.remove('wallet-pulse'), 500);
            }
            const floatingNote = document.createElement('div');
            floatingNote.className = 'fixed z-50 text-emerald-400 font-black text-2xl dollar-note-pure pointer-events-none flex items-center space-x-1';
            floatingNote.style.right = '50px';
            floatingNote.style.top = '70px';
            floatingNote.innerHTML = `<i class="fa-solid fa-money-bill-wave text-emerald-400 drop-shadow-[0_4px_12px_rgba(16,185,129,0.8)]"></i><span class="text-xs font-bold text-emerald-300 drop-shadow">+$${amount.toFixed(2)}</span>`;
            document.body.appendChild(floatingNote);
            setTimeout(() => floatingNote.remove(), 1200);
        };

        Z.showToast = function(message) {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = 'bg-slate-900/95 border border-emerald-500/40 text-slate-100 px-4 py-2.5 rounded-xl text-xs shadow-2xl flex items-center space-x-2.5 pointer-events-auto transition transform translate-y-4 opacity-0 max-w-md w-full backdrop-blur-md';
            toast.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400 text-sm shrink-0"></i><span class="font-medium">${Z.escapeHtml(message)}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-4', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'transition', 'duration-300');
                setTimeout(() => toast.remove(), 300);
            }, 3200);
        };

        // Unified Data Layer (BUG #24 & Single Source of Truth FIX)
        Z.DB = {
            getUsers: function() {
                const data = localStorage.getItem('zynix_users');
                if (!data) return Z.SeedData.users;
                return JSON.parse(data);
            },
            getUserById: function(id) {
                const users = this.getUsers();
                return users.find(u => u.id === id) || null;
            },
            saveUsers: function(usersArray) {
                if (usersArray) {
                    localStorage.setItem('zynix_users', JSON.stringify(usersArray));
                } else {
                    // Update state if current user exists in array
                    const currentUsers = this.getUsers();
                    if (Z.State.currentUser) {
                        const idx = currentUsers.findIndex(u => u.id === Z.State.currentUser.id);
                        if (idx !== -1) {
                            currentUsers[idx] = Z.State.currentUser;
                        }
                    }
                    localStorage.setItem('zynix_users', JSON.stringify(currentUsers));
                }
                // Sync current state
                if (Z.State.currentUser) {
                    const fresh = this.getUserById(Z.State.currentUser.id);
                    if (fresh) Z.State.currentUser = fresh;
                }
            },
            getCurrentUser: function() {
                const id = localStorage.getItem('zynix_current_user_id');
                if (!id) return null; // No default forced login (BUG #25 FIX)
                return this.getUserById(id);
            },
            setCurrentUser: function(user) {
                if (user) {
                    localStorage.setItem('zynix_current_user_id', user.id);
                    Z.State.currentUser = user;
                } else {
                    localStorage.removeItem('zynix_current_user_id');
                    Z.State.currentUser = null;
                }
                Z.renderHeaderAuth();
                Z.updateHeaderWallet();
            },
            getPosts: function() {
                const data = localStorage.getItem('zynix_posts');
                if (!data) return Z.SeedData.posts;
                return JSON.parse(data);
            },
            savePosts: function(posts) {
                localStorage.setItem('zynix_posts', JSON.stringify(posts));
            },
            getSparks: function() {
                const data = localStorage.getItem('zynix_sparks');
                if (!data) return Z.SeedData.sparks;
                return JSON.parse(data);
            },
            saveSparks: function(sparks) {
                localStorage.setItem('zynix_sparks', JSON.stringify(sparks));
            },
            getStatuses: function() {
                const data = localStorage.getItem('zynix_statuses');
                let list = data ? JSON.parse(data) : Z.SeedData.statuses;
                // 24-Hour Expiry Logic Filter (BUG #10 FIX)
                const now = Date.now();
                return list.filter(st => !st.timestamp || (now - st.timestamp < 86400000));
            },
            saveStatuses: function(statuses) {
                localStorage.setItem('zynix_statuses', JSON.stringify(statuses));
            },
            getCircles: function() {
                const data = localStorage.getItem('zynix_circles');
                if (!data) return Z.SeedData.circles;
                return JSON.parse(data);
            },
            saveCircles: function(circles) {
                localStorage.setItem('zynix_circles', JSON.stringify(circles));
            }
        };

        Z.handleAuthSubmit = function(mode) {
            const emailInput = document.getElementById('auth-email');
            const passInput = document.getElementById('auth-password');
            const email = emailInput ? emailInput.value.trim() : '';
            const password = passInput ? passInput.value.trim() : '';

            if (!email || !password) {
                Z.showToast('Please fill in all required fields.');
                return;
            }

            if (mode === 'login') {
                const users = Z.DB.getUsers();
                const user = users.find(u => (u.email === email || u.username === email) && u.password === password);
                if (user) {
                    Z.DB.setCurrentUser(user);
                    Z.closeModal();
                    Z.showToast(`Welcome back, ${user.name}!`);
                    Z.showView(Z.State.currentView);
                } else {
                    Z.showToast('Invalid credentials. Try demo login or check details.');
                }
            } else {
                const nameInput = document.getElementById('auth-name');
                const name = nameInput ? nameInput.value.trim() : 'New Creator';
                const newUser = {
                    id: 'usr_' + Date.now(),
                    name: name,
                    username: email.split('@')[0] || 'user_' + Date.now(),
                    profession: 'ZYNIX Member',
                    bio: 'New member in the ZYNIX ecosystem.',
                    role: 'Creator',
                    avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80',

                    followers: 0,

                    wallet: { cash: 0.00, bounty: 0.00, totalEarned: 0.00 },
                    walletTransactions: [],
                    bountySpentHistory: [],
                    referrals: { code: 'ZYNIX-' + Math.floor(1000 + Math.random() * 9000), earnings: 0, referredBy: null },
                    email: email,
                    password: password,
                    interactionHistory: {}
                };
                const users = Z.DB.getUsers();
                users.push(newUser);
                Z.DB.saveUsers(users);
                Z.DB.setCurrentUser(newUser);
                Z.closeModal();
                Z.showToast('Account created successfully!');
                Z.showView('home');

            switch (viewName) {
                case 'home':
                    Z.renderHomeView(main);
                    break;
                case 'spark':
                    Z.renderSparkView(main);
                    break;
                case 'circles':
                    Z.renderCirclesView(main);
                    break;

                    Z.renderPeopleView(main);

        // Render Wallet View
        Z.renderWalletView = function(container) {
            const user = Z.State.currentUser;
            if (!user) {
                container.innerHTML = `
                    <div class="bg-[#111827] border border-slate-800 rounded-2xl p-8 text-center space-y-4">
                        <i class="fa-solid fa-wallet text-4xl text-emerald-400"></i>
                        <h3 class="font-bold text-base text-white">Wallet Protected</h3>
                        <p class="text-xs text-slate-400">Log in to view transactions and manage ecosystem payouts.</p>
                        <button type="button" onclick="Z.openAuthModal('login')" class="bg-emerald-600 text-black font-bold text-xs px-6 py-2.5 rounded-xl">Login</button>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="space-y-4">
                    <div class="bg-[#111827] border border-slate-800 rounded-2xl p-5 space-y-4 shadow-xl">
                        <div class="flex justify-between items-center">
                            <h3 class="font-bold text-sm text-white"><i class="fa-solid fa-wallet text-emerald-400 mr-2"></i>Ecosystem Wallet</h3>
                            <span class="text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded font-bold">Verified</span>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div class="bg-slate-950 border border-slate-800 p-3 rounded-xl space-y-1">
                                <span class="text-[10px] text-slate-400">Available Cash (60%)</span>
                                <h4 class="text-lg font-black text-emerald-400">$${user.wallet ? user.wallet.cash.toFixed(2) : '0.00'}</h4>
                            </div>
                            <div class="bg-slate-950 border border-slate-800 p-3 rounded-xl space-y-1">
                                <span class="text-[10px] text-slate-400">Bounty Balance (40%)</span>
                                <h4 class="text-lg font-black text-blue-400">$${user.wallet ? user.wallet.bounty.toFixed(2) : '0.00'}</h4>
                            </div>
                        </div>
                    </div>

                    <div class="bg-[#111827] border border-slate-800 rounded-2xl p-4 space-y-3">
                        <h4 class="font-bold text-xs text-white">Transaction History</h4>
                        <div class="space-y-2">
                            ${(user.walletTransactions && user.walletTransactions.length > 0) ? user.walletTransactions.map(tx => `
                                <div class="bg-slate-950 border border-slate-800/80 p-2.5 rounded-xl flex items-center justify-between text-xs">
                                    <div>
                                        <p class="font-bold text-white">${Z.escapeHtml(tx.type)}</p>
                                        <span class="text-[9px] text-slate-400">${new Date(tx.date).toLocaleDateString()}</span>
                                    </div>
                                    <span class="font-black text-emerald-400">+$${tx.amount.toFixed(2)}</span>
                                </div>
                            `).join('') : '<p class="text-xs text-slate-500 text-center py-4">No recent wallet transactions.</p>'}
                        </div>
                    </div>
                </div>
            `;
        };

        // Render Admin Wall View
        Z.renderAdminWallView = function(container) {
            container.innerHTML = `
                <div class="space-y-4">
                    <div class="bg-[#111827] border border-slate-800 rounded-2xl p-5 space-y-2 shadow-xl">
                        <div class="flex items-center space-x-2">
                            <span class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></span>
                            <h3 class="font-bold text-base text-white">Official ZYNIX Admin Wall</h3>
                        </div>
                        <p class="text-xs text-slate-300 leading-relaxed">
                            Welcome to ZYNIX, the next-generation independent social ecosystem designed to reward engagement fairly with automated cash & bounty distribution.
                        </p>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-[#111827] border border-slate-800 p-4 rounded-2xl space-y-1">
                            <span class="text-[10px] text-slate-400">Total Ecosystem Users</span>
                            <h4 class="text-lg font-black text-white">${Z.DB.getUsers().length}</h4>
                        </div>
                        <div class="bg-[#111827] border border-slate-800 p-4 rounded-2xl space-y-1">
                            <span class="text-[10px] text-slate-400">Active Circles</span>
                            <h4 class="text-lg font-black text-emerald-400">${Z.DB.getCircles().length}</h4>
                        </div>
                    </div>
                </div>
            `;
        };

        // Create Modal Selector
        Z.openCreateSelectionModal = function() {
            if (!Z.State.currentUser) {
                Z.openAuthModal('login');
                Z.showToast('Please login to create posts or status updates.');
                return;
            }
            Z.openCreatePostModal();
        };

        // Create Post Modal
        Z.openCreatePostModal = function() {
            const modalContainer = document.getElementById('modal-container');
            if (!modalContainer) return;
            modalContainer.innerHTML = `
                <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                    <div class="bg-[#111827] border border-slate-800 rounded-2xl w-full max-w-md p-5 space-y-4 shadow-2xl">
                        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                            <h3 class="font-bold text-sm text-white">Create New Post</h3>
                            <button type="button" onclick="Z.closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <textarea id="create-post-content" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-emerald-500 h-28" placeholder="What's happening in your network?"></textarea>
                        <input type="text" id="create-post-media" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500" placeholder="Optional Image URL">
                        <button type="button" onclick="Z.submitPost()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-black font-bold py-2 rounded-xl text-xs transition">
                            Publish Post
                        </button>
                    </div>
                </div>
            `;
        };

        Z.submitPost = function() {
            const content = document.getElementById('create-post-content').value.trim();
            const media = document.getElementById('create-post-media').value.trim();
            if (!content) {
                Z.showToast('Post content cannot be empty.');
                return;
            }
            const posts = Z.DB.getPosts();
            posts.unshift({
                id: 'post_' + Date.now(),
                authorId: Z.State.currentUser.id,
                content: content,
                media: media,
                createdAt: 'Just now',
                reactions: { heart: 0 },
                comments: [],
                shares: 0
            });
            Z.DB.savePosts(posts);
            Z.closeModal();
            Z.showToast('Post published successfully!');
            Z.showView('home');
        };

        // Open AI Assistant Modal
        Z.openAiModal = function() {
            const modalContainer = document.getElementById('modal-container');
            if (!modalContainer) return;
            modalContainer.innerHTML = `
                <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                    <div class="bg-[#111827] border border-slate-800 rounded-2xl w-full max-w-md p-5 space-y-4 shadow-2xl">
                        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                            <h3 class="font-bold text-sm text-white flex items-center"><i class="fa-solid fa-wand-magic-sparkles text-emerald-400 mr-2"></i>ZYNIX AI Guide</h3>
                            <button type="button" onclick="Z.closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <div id="ai-messages" class="h-48 overflow-y-auto bg-slate-950 border border-slate-800 rounded-xl p-3 space-y-2 text-xs">
                            <div class="text-emerald-400 font-medium">Hello! How can I assist you with ZYNIX features today?</div>
                        </div>
                        <div class="flex space-x-2">
                            <input type="text" id="ai-input" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none" placeholder="Ask anything about packages, bounties...">
                            <button type="button" onclick="Z.sendAiQuery()" class="bg-emerald-600 text-black font-bold text-xs px-4 py-2 rounded-xl">Send</button>
                        </div>
                    </div>
                </div>
            `;
        };

        Z.sendAiQuery = function() {
            const input = document.getElementById('ai-input');
            const box = document.getElementById('ai-messages');
            if (!input || !box || !input.value.trim()) return;
            const query = input.value.trim();
            box.innerHTML += `<div class="text-white font-semibold text-right">You: ${Z.escapeHtml(query)}</div>`;
            input.value = '';
            setTimeout(() => {
                box.innerHTML += `<div class="text-emerald-400">ZYNIX AI: Rewards are split 60% Cash and 40% Bounty. Upgrade your package in Profile to earn more!</div>`;
                box.scrollTop = box.scrollHeight;
            }, 500);
        };
    </script>
</body>
</html>

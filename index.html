Z._renderSpaceIdentity = function(data, me){
  var isMe = me && me.id === data.id;
  var coverUrl = data.cover || 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=800&q=80';
  var avatarUrl = data.avatar || ('https://ui-avatars.com/api/?name=' + encodeURIComponent(data.name || 'U') + '&background=111827&color=34d399');
  var handle = data.username ? ('@' + data.username) : '@user';
  var pkg = data.package || 'Free';

  var avgRating = Number(data.avg_rating) || 0;
  var reviewCount = Number(data.rating_count) || 0;
  var tier = trustTier(avgRating, reviewCount);
  var circumference = 2 * Math.PI * 42;
  var trustPct = reviewCount >= 3 ? Math.min(1, Math.max(0, (avgRating - 1) / 9)) : 0;
  var offset = circumference * (1 - trustPct);
  var ringHtml =
    '<div class="trust-ring-wrap" style="width:88px;height:88px;">' +
      '<svg class="trust-ring-svg" width="88" height="88" viewBox="0 0 88 88">' +
        '<circle class="trust-ring-bg" cx="44" cy="44" r="42"></circle>' +
        '<circle class="trust-ring-fg ' + tier.cls + '" cx="44" cy="44" r="42" ' +
          'stroke-dasharray="' + circumference.toFixed(1) + '" ' +
          'stroke-dashoffset="' + offset.toFixed(1) + '"></circle>' +
      '</svg>' +
      '<img src="' + Z.escape(avatarUrl) + '" style="width:88px;height:88px;border-radius:50%;object-fit:cover;background:#0f172a;display:block;position:relative;z-index:1;">' +
      (reviewCount >= 3 ? '<div class="trust-score-badge ' + tier.cls + '">' + avgRating.toFixed(1) + '</div>' : '') +
    '</div>';

  var valueChip = data.profession
    ? '<span class="value-chip"><i class="fa-solid fa-certificate"></i> ' + Z.escape(data.profession) + '</span>'
    : '';

  var whyHtml = '';
  if(!isMe && me){
    var reason = 'Suggested for you';
    if(data.mutual_connections && data.mutual_connections > 0){
      reason = data.mutual_connections + ' mutual connection' + (data.mutual_connections > 1 ? 's' : '');
    } else if(data.shared_circles && data.shared_circles > 0){
      reason = 'You share ' + data.shared_circles + ' circle' + (data.shared_circles > 1 ? 's' : '');
    }
    whyHtml = '<div class="why-see-me"><i class="fa-solid fa-wand-magic-sparkles"></i> ' + Z.escape(reason) + '</div>';
  }

  var connCount    = Number(data.connection_count) || 0;
  var postsCount   = Number(data.posts_count) || 0;
  var sparksCount  = Number(data.sparks_count) || 0;
  var videosCount  = Number(data.videos_count) || 0;
  var circlesCount = Number(data.circles_count) || 0;

  var statCell = function(value, label, clickable, onclickAttr){
    var inner =
      '<div style="font-size:16px;font-weight:900;color:#fff;">' + value + '</div>' +
      '<div style="font-size:9px;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-top:2px;">' + label + '</div>';
    if(clickable){
      return '<button ' + onclickAttr + ' style="flex:1;background:transparent;border:none;cursor:pointer;text-align:center;padding:0;">' + inner + '</button>';
    }
    return '<div style="flex:1;text-align:center;">' + inner + '</div>';
  };

  var statsRow = '<div style="display:flex;align-items:center;gap:8px;padding:14px 0 4px;margin-top:14px;border-top:1px solid #1e293b;">' +
    statCell(connCount, 'Connections', isMe, 'onclick="Z.openConnectionsList()"') +
    statCell(postsCount, 'Posts', true, 'onclick="Z.showView(\'space-posts-all\',\'' + Z.escape(data.id) + '\')"') +
    statCell(sparksCount, 'Sparks', false, '') +
    statCell(videosCount, 'Videos', false, '') +
    statCell(circlesCount, 'Circles', true, 'onclick="Z.toast(\'Circles coming soon\')"') +
  '</div>';

  var completionHtml = '';
  if(isMe){
    var pctDone = Z.profileCompletion(data);
    var cR = 15, cCirc = 2 * Math.PI * cR;
    var cOffset = cCirc * (1 - (pctDone / 100));
    var msg = pctDone === 100
      ? 'Your SPACE is complete.'
      : 'Complete your profile to unlock more trust.';
    completionHtml = '<div class="completion-ring">' +
      '<svg class="cr-svg" viewBox="0 0 34 34">' +
        '<circle class="cr-bg" cx="17" cy="17" r="' + cR + '"></circle>' +
        '<circle class="cr-fg" cx="17" cy="17" r="' + cR + '" ' +
          'stroke-dasharray="' + cCirc.toFixed(1) + '" ' +
          'stroke-dashoffset="' + cOffset.toFixed(1) + '"></circle>' +
      '</svg>' +
      '<div class="cr-body">' +
        '<div class="cr-title">Profile ' + pctDone + '% complete</div>' +
        '<div class="cr-sub">' + msg + '</div>' +
      '</div>' +
      (pctDone < 100 ? '<button class="cr-btn" onclick="Z.openEditProfileModal()">Finish</button>' : '') +
    '</div>';
  }

  var actionRow = '';
  if(!isMe){
    var connState = Z.getConnectionState(data.id);
    var bondBtn;
    if(connState === 'connected'){
      bondBtn = '<button class="bond-btn bonded"><i class="fa-solid fa-check"></i> Bonded</button>';
    } else if(connState === 'connecting_out'){
      bondBtn = '<button class="bond-btn bonded" style="cursor:default;"><i class="fa-solid fa-hourglass-half"></i> Pending</button>';
    } else if(connState === 'connecting_in'){
      bondBtn = '<button class="bond-btn" onclick="Z.acceptIncomingBond(\'' + Z.escape(data.id) + '\')"><i class="fa-solid fa-handshake"></i> Accept Bond</button>';
    } else {
      bondBtn = '<button class="bond-btn" onclick="Z.sendConnectRequest(\'' + Z.escape(data.id) + '\')"><i class="fa-solid fa-handshake"></i> Bond</button>';
    }
    actionRow =
      '<div class="space-channel-row">' +
        bondBtn +
        '<button class="icon-btn" title="Ping" onclick="Z.pingUser(\'' + Z.escape(data.id) + '\')"><i class="fa-solid fa-comment-dots"></i></button>' +
        '<button class="icon-btn" title="Share SPACE" onclick="Z.shareSpace(\'' + Z.escape(data.id) + '\')"><i class="fa-solid fa-share-nodes"></i></button>' +
        '<button class="icon-btn" title="More" onclick="Z.toast(\'More coming soon\')"><i class="fa-solid fa-ellipsis"></i></button>' +
      '</div>';
  } else {
    actionRow =
      '<button onclick="Z.showView(\'profile\')" style="width:100%;background:#1e293b;border:none;color:#fff;font-weight:700;padding:10px;border-radius:10px;font-size:12px;cursor:pointer;margin-top:12px;">' +
        '<i class="fa-solid fa-gear"></i> Manage Profile' +
      '</button>';
  }

  return '<div style="background:#111827;border:1px solid #1e293b;border-radius:16px;overflow:hidden;">' +
    '<div style="height:130px;background:#0f172a;position:relative;overflow:hidden;">' +
      '<img src="' + Z.escape(coverUrl) + '" style="width:100%;height:100%;object-fit:cover;" alt="Cover">' +
      '<div style="position:absolute;inset:0;background:linear-gradient(to bottom,rgba(9,13,22,0) 40%,rgba(17,24,39,.95));"></div>' +
    '</div>' +
    '<div style="padding:0 16px 18px;margin-top:-40px;position:relative;">' +
      ringHtml +
      '<div style="margin-top:10px;">' +
        '<div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">' +
          '<div style="font-weight:900;font-size:18px;color:#fff;">' + Z.escape(data.name || 'User') + '</div>' +
          '<i class="fa-solid fa-circle-check" style="color:#10b981;font-size:14px;" title="Verified profile"></i>' +
        '</div>' +
        '<div style="font-size:11px;color:#64748b;margin-top:2px;">' + Z.escape(handle) + '</div>' +
        (valueChip ? '<div style="margin-top:8px;">' + valueChip + '</div>' : '') +
        (data.bio ? '<div style="font-size:12px;color:#cbd5e1;margin-top:10px;line-height:1.55;white-space:pre-wrap;word-break:break-word;">' + Z.escape(data.bio) + '</div>' : '') +
        '<div style="display:flex;gap:6px;margin-top:12px;flex-wrap:wrap;"><span style="background:rgba(16,185,129,.12);color:#10b981;font-size:10px;font-weight:700;padding:4px 10px;border-radius:20px;border:1px solid rgba(16,185,129,.28);">' + Z.escape(pkg) + '</span></div>' +
        whyHtml +
        completionHtml +
      '</div>' +
      statsRow +
      actionRow +
    '</div>' +
  '</div>';
};

Z._renderSpaceAboutBlock = function(data, me){
  var isMe = me && me.id === data.id;
  var sd = data.space_data || {};
  var aboutText = sd.about || '';
  var aboutBg = sd.about_bg || 'status-bg-deep-blue';
  if(!aboutText && !isMe) return '';
  if(!aboutText && isMe){
    return '<div style="background:#111827;border:1px dashed #1e293b;border-radius:16px;padding:14px;text-align:center;">' +
      '<button onclick="Z.editSpaceAbout()" style="background:transparent;border:none;color:#10b981;font-weight:700;font-size:12px;cursor:pointer;"><i class="fa-solid fa-plus"></i> Add an "About" for your SPACE</button>' +
    '</div>';
  }
  return '<div class="' + Z.escape(aboutBg) + '" style="border-radius:16px;padding:16px;position:relative;">' +

Z.getConnectionState = function(otherId){
  var me = Z.State.currentUser;
  if(!me) return 'guest';
  if(!otherId || me.id === otherId) return 'self';
  var list = Z.State.allConnections || [];
  for(var i=0;i<list.length;i++){
    var c = list[i];
    var pairOk = (c.requester_id === me.id && c.recipient_id === otherId) ||
                 (c.requester_id === otherId && c.recipient_id === me.id);
    if(!pairOk) continue;
    if(c.status === 'accepted') return 'connected';
    if(c.status === 'pending')  return c.requester_id === me.id ? 'connecting_out' : 'connecting_in';
  }
  return 'none';
};
Z.getConnectBounty = function(p){
  if(!p) return 0;
  var bs = p.bounty_settings || {};
  var v = bs.connect;
  if(v == null) return 0;
  return Number(v) || 0;
};
Z.renderConnectButton = function(otherId){
  var other = Z.getProfileById(otherId);
  if(!other) return '';
  var state = Z.getConnectionState(otherId);
  var bounty = Z.getConnectBounty(other);
  var tag = '<span class="bounty-tag">$' + bounty.toFixed(2) + '</span>';
  if(state === 'guest') return '<button class="connect-btn" onclick="Z.openAuthModal(\'login\')">Connect ' + tag + '</button>';
  if(state === 'self')  return '<span style="font-size:10px;color:#64748b;padding:4px 12px;background:#0f172a;border-radius:8px;">You</span>';
  if(state === 'connected') return '<button class="connect-btn connected">Connected ' + tag + '</button>';
  if(state === 'connecting_out') return '<button class="connect-btn connecting">Connecting ' + tag + '</button>';
  if(state === 'connecting_in'){
    var req = null;
    var me = Z.State.currentUser;
    (Z.State.allConnections||[]).forEach(function(c){
      if(c.requester_id === otherId && c.recipient_id === me.id && c.status === 'pending') req = c;
    });
    if(!req) return '<button class="connect-btn" onclick="Z.sendConnectRequest(\'' + Z.escape(otherId) + '\')">Connect ' + tag + '</button>';
    return '<div class="connect-actions">' +
      '<button class="approve" onclick="Z.acceptConnection(\'' + Z.escape(req.id) + '\')">Accept</button>' +
      '<button class="reject" onclick="Z.rejectConnection(\'' + Z.escape(req.id) + '\')">Reject</button>' +
    '</div>';
  }
  return '<button class="connect-btn" onclick="Z.sendConnectRequest(\'' + Z.escape(otherId) + '\')">Connect ' + tag + '</button>';
};
Z.sendConnectRequest = async function(userId){
  var me = Z.State.currentUser;
  if(!me){ Z.openAuthModal('login'); return; }
  if(me.id === userId){ Z.toast('Cannot connect to yourself.'); return; }
  try {
    await Z.DB.sendConnectRequest(userId);
    Z.toast('Connection request sent.');
    Z.haptic(10);
    await Z.reloadData();
    Z.softRefresh();
  } catch(e){
    var msg = e && e.message ? e.message : 'Could not send request.';
    if(msg.indexOf('Already connected') !== -1) Z.toast('Already connected.');
    else if(msg.indexOf('pending') !== -1) Z.toast('Request already pending.');
    else Z.toast(msg);
  }
};
Z.acceptConnection = async function(requestId){
  try {
    await Z.DB.acceptConnectionRequest(requestId);
    var bountyWarn = false;
    try {
      var c = Z.sb();
      if(c){
        var r = await c.from('connection_requests').select('bounty_status').eq('id', requestId).maybeSingle();
        if(r.data && r.data.bounty_status === 'insufficient') bountyWarn = true;
      }
    } catch(e){}
    if(bountyWarn) Z.toast('Connected — bounty could not be paid (insufficient balance).');
    else Z.toast('Connected!');
    Z.haptic(15);
    await Z.reloadData();
    Z.softRefresh();
  } catch(e){ Z.toast((e && e.message) ? e.message : 'Could not accept.'); }
};
Z.rejectConnection = async function(requestId){
  try {
    await Z.DB.rejectConnectionRequest(requestId);
    Z.toast('Request rejected.');
    await Z.reloadData();
    Z.softRefresh();
  } catch(e){ Z.toast((e && e.message) ? e.message : 'Could not reject.'); }
};
Z.connectTo = function(userId){ Z.sendConnectRequest(userId); };

Z.openConnectionsList = function(){
  var me = Z.State.currentUser;
  if(!me) return;
  var accepted = (Z.State.allConnections||[]).filter(function(c){
    return c.status === 'accepted' && (c.requester_id === me.id || c.recipient_id === me.id);

    html += Z.emptyState({
      icon: 'fa-solid fa-users',

      cta: { label: 'Discover People', onclick: "Z.showView('people')" }
    });
  } else {
    accepted.forEach(function(c){

        '<img src="' + Z.escape(Z.displayAvatar(other)) + '" onclick="Z.showView(\'public-profile\',\'' + Z.escape(otherId) + '\')" style="width:44px;height:44px;border-radius:50%;object-fit:cover;cursor:pointer;">' +
        '<div style="flex:1;cursor:pointer;" onclick="Z.showView(\'public-profile\',\'' + Z.escape(otherId) + '\')">' +
          '<div style="font-weight:700;font-size:13px;color:#fff;">' + Z.escape(Z.displayName(other)) + '</div>' +
          '<div style="font-size:10px;color:#64748b;">@' + Z.escape(other.username||'user') + '</div>' +
        '</div>' +
        '<button class="icon-btn" title="Ping" onclick="Z.pingUser(\'' + Z.escape(otherId) + '\')" style="width:auto;padding:0 12px;height:36px;"><i class="fa-solid fa-comment-dots"></i></button>' +
      '</div>';
    });
  }
  html += '</div>';
  var container = document.getElementById('app-container');
  if(container){ container.innerHTML = html; }
};

})();

<script>

Z.renderCircles = function(){

  html += '<div id="circles-list-container">' + Z.skeletonRows(4) + '</div>';

  html += '</div>';
  setTimeout(Z.refreshCirclesList, 30);
  return html;
};

Z.refreshCirclesList = async function(){
  var container = document.getElementById('circles-list-container');
  if(!container) return;
  var seed = Date.now();
  var data = [];
  try { data = await Z.DB.getCirclesFeed(40, 0, seed); }
  catch(e){ data = []; }
  if(!data || !data.length){
    data = (Z.DB.getCircles()||[]).map(function(c){
      return {
        id:c.id, name:c.name, description:c.description, type:c.type, avatar:c.avatar,
        creator_id:c.creatorId || c.creator_id,
        member_count:c.member_count || c.members || 0,
        is_member:false, is_creator:false, friend_in_count:0
      };
    });
  }
  var q = (Z.State.circleSearch||'').toLowerCase();
  if(q){
    data = data.filter(function(c){
      return String(c.name||'').toLowerCase().indexOf(q) !== -1 ||
             String(c.description||'').toLowerCase().indexOf(q) !== -1;
    });
  }
  var html = '';
  data.forEach(function(c){
    var labels = {social:'Social', services:'Services', goods:'Goods', office:'Office', education:'Education', events:'Events'};
    var label = labels[c.type] || 'Social';
    var cls = c.type==='services'?'type-services':c.type==='goods'?'type-goods':'type-social';
    var isMember = c.is_member || false;
    var avatarUrl = c.avatar || 'https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=150&q=80';
    html += '<div class="circle-card">' +
      '<div class="circle-head">' +
        '<div class="circle-head-left">' +
          '<img src="' + Z.escape(avatarUrl) + '">' +
          '<div>' +
            '<div class="circle-name">' + Z.escape(c.name) + '</div>' +
            '<div class="circle-meta">' + (c.member_count||0) + ' · <span class="circle-type-badge ' + cls + '">' + label + '</span></div>' +
          '</div>' +
        '</div>' +
        (isMember
          ? '<button class="circle-join-btn" style="background:rgba(16,185,129,.15);color:#10b981;" onclick="Z.toast(\'Already a member\')">Joined</button>'
          : '<button class="circle-join-btn" onclick="Z.joinCircle(\'' + Z.escape(c.id) + '\')">Join</button>') +
      '</div>' +
      '<div class="circle-desc">' + Z.escape(c.description||'') + '</div>' +
    '</div>';
  });
  if(!html){
    html = Z.emptyState({
      icon: 'fa-solid fa-circle-nodes',
      title: q ? 'No circles match your search.' : 'No circles yet. Start one.',
      cta: { label: 'Create Circle', onclick: "Z.openCreateCircleModal()" }
    });
  }

<script>
(function(){
'use strict';
var Z = window.Z;
if(!Z) return;

Z.renderWalletNotification = function(t){
  var meta = t.metadata || {};
  var isIncome = (t.amount > 0);
  var cp = t.counterparty_id ? Z.getProfileById(t.counterparty_id) : null;
  var who = cp ? Z.displayName(cp) : 'System';
  var avatar = cp ? Z.displayAvatar(cp)
                  : 'https://ui-avatars.com/api/?name=Z&background=111827&color=34d399';
  var actionText = '';
  var typeLabel = t.reason || t.type || '';
  var link = '';
  if(typeLabel.indexOf('REACTION_') === 0){
    var rk = typeLabel.replace('REACTION_','').toLowerCase();
    var r = Z.Reactions[rk];
    var ctype = meta.content_type || 'content';
    actionText = r ? (r.symbol + ' ' + r.label + ' on your ' + ctype) : 'Reaction';
    if(meta.content_type === 'post' && meta.content_id)  link = '#post-'  + meta.content_id;
    if(meta.content_type === 'spark' && meta.content_id) link = '#spark-' + meta.content_id;
  } else if(typeLabel === 'SHARE_BOUNTY' || typeLabel === 'share_bounty_received' || typeLabel === 'share_bounty_sent'){
    actionText = isIncome ? 'Earned bounty from sharing' : 'Paid bounty for share';
    if(meta.content_id){
      link = (meta.content_type === 'spark' ? '#spark-' : '#post-') + meta.content_id;
    }
  } else if(typeLabel.indexOf('connection_bounty') === 0 || typeLabel === 'connection_bounty'){
    actionText = isIncome ? 'Connection bounty received' : 'Connection bounty sent';
  } else {
    actionText = typeLabel || 'Transaction';
  }
  var amtCls = isIncome ? 'plus' : 'minus';
  var amtSign = isIncome ? '+' : '-';
  var imgHtml = cp
    ? '<img src="' + Z.escape(avatar) + '" onclick="Z.showView(\'public-profile\',\'' + Z.escape(cp.id) + '\')" style="cursor:pointer;">'
    : '<img src="' + Z.escape(avatar) + '">';
  return '<div class="wallet-notif-card">' +
    imgHtml +
    '<div class="info">' +
      '<div class="who">' + Z.escape(who) + '</div>' +
      '<div class="what">' + Z.escape(actionText) + ' · ' + Z.fmtDate(t.created_at) + '</div>' +
    '</div>' +
    '<div class="amt ' + amtCls + '">' + amtSign + '$' + Math.abs(t.amount).toFixed(4) + '</div>' +
    (link ? '<i class="fa-solid fa-arrow-up-right-from-square link-icon" onclick="Z.jumpToContent(\'' + Z.escape(link) + '\')"></i>' : '') +
  '</div>';
};

Z.jumpToContent = function(hash){
  if(!hash) return;
  if(hash.indexOf('#post-') === 0 || hash.indexOf('#spark-') === 0){
    var isSpark = hash.indexOf('#spark-') === 0;
    if(isSpark) Z.showView('spark');
    else Z.showView('home');
    setTimeout(function(){
      var el = document.querySelector(hash);
      if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
    }, 400);
  }
};

Z.renderWallet = function(){
  var u = Z.State.currentUser;
  if(!u) return Z.emptyState({ icon: 'fa-solid fa-wallet', title: 'Login first.' });
  Z.clearWalletBadge();

  var txHtml = tx.length
    ? tx.map(function(t){ return Z.renderWalletNotification(t); }).join('')

      '<button class="colored-back-btn" onclick="Z.goBack()"><i class="fa-solid fa-arrow-left"></i> Back</button>' +
      '<h2 class="view-title"><i class="fa-solid fa-wallet" style="color:#10b981;margin-right:8px;"></i>Wallet</h2>' +
      '<button class="circle-x-btn" onclick="Z.goBack()" title="Close wallet"><i class="fa-solid fa-xmark"></i></button>' +
    '</div>' +

        '<div class="stat-card"><div class="stat-label">Cash</div><div class="stat-value" style="color:#10b981;">$' + Number(u.wallet_cash||0).toFixed(2) + '</div></div>' +

      '</div>' +
      '<div style="margin-top:16px;padding-top:14px;border-top:1px solid #1e293b;">' +
        '<div class="section-title">Activity</div>' + txHtml +

        }).join('') +

        }).join('') +

  return '<div style="display:flex;flex-direction:column;gap:12px;">' +

    '</div>' +
    '<div style="background:#111827;border:1px solid #1e293b;border-radius:16px;padding:16px;">' +
      '<div class="section-title" style="margin-top:0;">Reaction Bounties</div>' +
      '<p style="font-size:11px;color:#64748b;margin-bottom:14px;">Reactions: ❤️ $0.05 · 🌹 $0.04 · 🔥 $0.03 · 👏 $0.02 · ⭐ $0.01 · 👎 —</p>' +
      '<div class="section-title">Action Bounties</div>' +
      actionInputs +
    '</div>' +
    '<div style="background:#111827;border:1px solid #1e293b;border-radius:16px;padding:16px;">' +
      '<div class="section-title" style="margin-top:0;">Active User Rewards</div>' +
      '<p style="font-size:11px;color:#64748b;margin-bottom:14px;">Reward users who complete the daily and weekly Active User checklist. Tracking ships in the next phase.</p>' +
      activeInputs +
    '</div>' +
    '<button onclick="Z.saveBounty()" style="width:100%;background:#10b981;border:none;color:#000;font-weight:700;padding:12px;border-radius:10px;font-size:12px;cursor:pointer;">Save</button>' +

};
Z.saveBounty = async function(){
  var me = Z.State.currentUser;
  if(!me) return;
  var s = {};
  ['connect','subscribe','comment','share','circleJoin','dailyReward','weeklyReward'].forEach(function(k){
    var el = document.getElementById('bounty-' + k);

  });

  Z.haptic(12);

};

<script>
(function(){
'use strict';
var Z = window.Z;
if(!Z) return;

Z.renderProfile = function(){
  var u = Z.State.currentUser;
  if(!u){
    return Z.emptyState({
      icon: 'fa-regular fa-user',
      title: 'Please log in.',
      cta: { label: 'Login', onclick: "Z.openAuthModal('login')" }
    });
  }
  var connCount = (Z.State.allConnections||[]).filter(function(c){
    return c.status === 'accepted' && (c.requester_id === u.id || c.recipient_id === u.id);
  }).length;
  return '<div style="display:flex;flex-direction:column;gap:14px;">' +
    '<div class="view-header">' +
      '<button class="colored-back-btn" onclick="Z.goBack()"><i class="fa-solid fa-arrow-left"></i> Back</button>' +
      '<h2 class="view-title" style="margin-left:6px;">Settings</h2>' +
    '</div>' +
    '<div class="profile-card">' +
      '<div class="profile-cover"><img src="' + Z.escape(u.cover||'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=800&q=80') + '"></div>' +
      '<div class="profile-body">' +
        '<img class="profile-avatar" src="' + Z.escape(Z.displayAvatar(u)) + '">' +
        '<div style="margin-top:6px;">' +
          '<div class="profile-name">' + Z.escape(Z.displayName(u)) + ' <i class="fa-solid fa-circle-check" style="color:#10b981;font-size:14px;"></i></div>' +
          '<div class="profile-handle">@' + Z.escape(u.username || u.email || 'user') + (u.profession?' · ' + Z.escape(u.profession):'') + '</div>' +
          '<div class="profile-bio">' + Z.escape(u.bio || '') + '</div>' +
          '<div class="profile-stats">' +
            '<span><strong>' + connCount + '</strong> Connections</span>' +
            '<span><strong>' + Z.escape(u.package||'Free') + '</strong> Package</span>' +
          '</div>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">' +
      '<button onclick="Z.openEditProfileModal()" style="background:#10b981;border:none;color:#000;font-weight:700;padding:14px;border-radius:12px;font-size:13px;cursor:pointer;"><i class="fa-solid fa-pen"></i> Edit Profile</button>' +
      '<button onclick="Z.showView(\'bounty\')" style="background:linear-gradient(135deg,#f59e0b,#ef4444);border:none;color:#fff;font-weight:700;padding:14px;border-radius:12px;font-size:13px;cursor:pointer;"><i class="fa-solid fa-gear"></i> Bounty</button>' +
    '</div>' +
    '<div class="media-grid-2" style="gap:10px;">' +
      '<button onclick="Z.showView(\'wallet\')" style="background:#111827;border:1px solid #1e293b;border-radius:12px;padding:14px;text-align:left;cursor:pointer;"><div style="font-weight:700;font-size:12px;color:#fff;"><i class="fa-solid fa-wallet" style="color:#10b981;"></i> Wallet</div></button>' +
      '<button onclick="Z.showView(\'packages\')" style="background:#111827;border:1px solid #1e293b;border-radius:12px;padding:14px;text-align:left;cursor:pointer;"><div style="font-weight:700;font-size:12px;color:#fff;"><i class="fa-solid fa-box" style="color:#3b82f6;"></i> Packages</div></button>' +
      '<button onclick="Z.showView(\'referrals\')" style="background:#111827;border:1px solid #1e293b;border-radius:12px;padding:14px;text-align:left;cursor:pointer;"><div style="font-weight:700;font-size:12px;color:#fff;"><i class="fa-solid fa-users-rays" style="color:#8b5cf6;"></i> Referrals</div></button>' +
      '<button onclick="Z.showView(\'people\')" style="background:#111827;border:1px solid #1e293b;border-radius:12px;padding:14px;text-align:left;cursor:pointer;"><div style="font-weight:700;font-size:12px;color:#fff;"><i class="fa-solid fa-users" style="color:#6366f1;"></i> Discover People</div></button>' +
    '</div>' +
  '</div>';
};

Z._editImages = {avatar:null, cover:null};
Z.openEditProfileModal = function(){
  var u = Z.State.currentUser;
  if(!u){ Z.openAuthModal('login'); return; }
  Z._editImages = {avatar:null, cover:null};
  Z.openModal(
    '<div class="modal-overlay" onclick="if(event.target===this)Z.closeModal()">' +
      '<div class="modal-box">' +
        '<div class="modal-header"><h3>Edit Profile</h3>' +
          '<button class="modal-close" onclick="Z.closeModal()"><i class="fa-solid fa-xmark"></i></button>' +
        '</div>' +
        '<label class="form-label">Name</label>' +
        '<input type="text" id="edit-name" class="form-input" value="' + Z.escape(u.name||'') + '">' +
        '<label class="form-label">Username</label>' +
        '<input type="text" id="edit-username" class="form-input" value="' + Z.escape(u.username||'') + '">' +
        '<label class="form-label">Profession</label>' +
        '<input type="text" id="edit-profession" class="form-input" value="' + Z.escape(u.profession||'') + '">' +
        '<label class="form-label">Bio</label>' +
        '<textarea id="edit-bio" class="form-textarea" maxlength="200">' + Z.escape(u.bio||'') + '</textarea>' +
        '<label class="form-label">Avatar Photo</label>' +
        '<input type="file" id="edit-avatar" accept="image/*" class="form-input" onchange="Z.previewEditImage(this,\'avatar\')">' +
        '<div id="edit-avatar-preview" style="margin-bottom:10px;"></div>' +
        '<label class="form-label">Cover Photo</label>' +
        '<input type="file" id="edit-cover" accept="image/*" class="form-input" onchange="Z.previewEditImage(this,\'cover\')">' +
        '<div id="edit-cover-preview" style="margin-bottom:10px;"></div>' +
        '<button class="btn-primary" onclick="Z.saveProfile()">Save Changes</button>' +
      '</div>' +
    '</div>'
  );
};
Z.previewEditImage = function(input, type){
  var f = input && input.files && input.files[0];
  if(!f) return;
  if(f.size > 5*1024*1024){ Z.toast('Image under 5 MB.'); input.value=''; return; }
  Z._editImages[type] = f;
  var box = document.getElementById('edit-' + type + '-preview');
  if(!box) return;
  var url = URL.createObjectURL(f);
  box.innerHTML = '<img src="' + url + '" style="width:100%;max-height:140px;object-fit:cover;border-radius:8px;border:1px solid #1e293b;">';
};
Z.saveProfile = async function(){
  var me = Z.State.currentUser;
  if(!me) return;
  var patch = {};
  var nm = ((document.getElementById('edit-name')||{}).value||'').trim();
  var un = ((document.getElementById('edit-username')||{}).value||'').trim();
  var pr = ((document.getElementById('edit-profession')||{}).value||'').trim();
  var bi = ((document.getElementById('edit-bio')||{}).value||'').trim();
  if(nm) patch.name = nm;
  if(un) patch.username = un;
  if(pr) patch.profession = pr;
  patch.bio = bi;
  if(Z._editImages.avatar){
    Z.toast('Uploading avatar...');
    try { patch.avatar = await Z.storeMedia(Z._editImages.avatar); }
    catch(err){ Z.toast('Avatar upload failed.', 'error'); return; }
  }
  if(Z._editImages.cover){
    Z.toast('Uploading cover...');
    try { patch.cover = await Z.storeMedia(Z._editImages.cover); }
    catch(err){ Z.toast('Cover upload failed.', 'error'); return; }
  }
  var result = await Z.DB.updateProfile(me.id, patch);
  if(!result){ Z.toast('Save failed.', 'error'); return; }
  Z._editImages = {avatar:null, cover:null};
  Z.closeModal();
  Z.toast('Profile updated!');
  Z.haptic(12);

    container.innerHTML = Z.emptyState({
      icon: 'fa-solid fa-users',

      cta: { label: 'Login', onclick: "Z.openAuthModal('login')" }

  var data = [];
  try { data = await Z.DB.getPeopleFeed(30, 0, seed); }

    data = (Z.State.allProfiles||[])
      .filter(function(u){ return u.id !== me.id; })
      .slice(0, 30)
      .map(function(u){

          id:u.id, name:u.name, username:u.username, avatar:u.avatar,

          bounty_settings:u.bounty_settings, connection_count:0,
          mutual_count:0, rank_score:0
        };
      });
  }
  data.forEach(function(p){
    var arr = Z.State.allProfiles || [];
    var idx = -1;
    for(var i=0;i<arr.length;i++){ if(arr[i].id === p.id){ idx = i; break; } }
    if(idx === -1) arr.push(p);
    else arr[idx] = Object.assign({}, arr[idx], {
      bounty_settings: p.bounty_settings || arr[idx].bounty_settings,
      name: p.name || arr[idx].name,
      username: p.username || arr[idx].username,
      avatar: p.avatar || arr[idx].avatar,
      profession: p.profession || arr[idx].profession,
      bio: p.bio || arr[idx].bio,
      package: p.package || arr[idx].package
    });
  });
  var q = (Z.State.peopleSearch||'').toLowerCase();
  if(q){
    data = data.filter(function(u){
      return String(u.name||'').toLowerCase().indexOf(q) !== -1 ||
             String(u.username||'').toLowerCase().indexOf(q) !== -1;
    });
  }
  var html = '';
  data.forEach(function(u){
    html += '<div style="background:#111827;border:1px solid #1e293b;border-radius:16px;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;">' +
      '<button onclick="Z.showView(\'public-profile\',\'' + Z.escape(u.id) + '\')" style="display:flex;align-items:center;gap:10px;background:transparent;border:none;cursor:pointer;flex:1;text-align:left;min-width:0;">' +
        '<img src="' + Z.escape(Z.displayAvatar(u)) + '" style="width:42px;height:42px;border-radius:50%;object-fit:cover;flex-shrink:0;">' +
        '<div style="min-width:0;">' +
          '<div style="font-weight:700;font-size:13px;color:#fff;">' + Z.escape(Z.displayName(u)) + '</div>' +
          '<div style="font-size:10px;color:#64748b;">@' + Z.escape(u.username||'user') + (u.mutual_count > 0 ? ' · ' + u.mutual_count + ' mutual' : '') + '</div>' +
        '</div>' +
      '</button>' +
      Z.renderConnectButton(u.id) +
    '</div>';
  });
  if(!html){
    html = Z.emptyState({
      icon: 'fa-solid fa-users',
      title: q ? 'No people match your search.' : 'No people to discover yet.'
    });
  }
  container.innerHTML = html;
};
Z.onPeopleSearch = function(v){ Z.State.peopleSearch = v; Z.refreshPeopleList(); };

})();

   <!-- ============================================================

<script>
(function(){
'use strict';
var Z = window.Z;
if(!Z) return;

var _pendingReactionRefetch = null;
function scheduleReactionRefetch(){
  if(_pendingReactionRefetch) return;
  _pendingReactionRefetch = setTimeout(async function(){
    _pendingReactionRefetch = null;
    var c = Z.sb && Z.sb();
    if(!c) return;
    var posts = (Z.State.allPosts || []).filter(function(p){ return !p._optimistic; }).slice(0, 30);
    var sparks = (Z.State.allSparks || []).filter(function(s){ return !s._optimistic; }).slice(0, 15);
    try {
      if(posts.length){
        var pids = posts.map(function(p){ return p.id; });
        var r1 = await c.from('post_reactions').select('post_id, reaction').in('post_id', pids);
        var pm = {};
        (r1.data||[]).forEach(function(x){
          pm[x.post_id] = pm[x.post_id] || {};
          pm[x.post_id][x.reaction] = (pm[x.post_id][x.reaction]||0)+1;
        });
        posts.forEach(function(p){
          var newCounts = pm[p.id] || {};
          var changed = false;
          Z.ALL_REACTIONS.forEach(function(k){
            var nv = newCounts[k] || 0;
            if((p.reactions||{})[k] !== nv) changed = true;
          });
          if(changed){
            var merged = {};
            Z.ALL_REACTIONS.forEach(function(k){ merged[k] = newCounts[k] || 0; });
            p.reactions = merged;
            Z.updatePostReactionUI(p.id);
          }
        });
      }
      if(sparks.length){
        var sids = sparks.map(function(s){ return s.id; });
        var r2 = await c.from('spark_reactions').select('spark_id, reaction').in('spark_id', sids);
        var sm = {};
        (r2.data||[]).forEach(function(x){
          sm[x.spark_id] = sm[x.spark_id] || {};
          sm[x.spark_id][x.reaction] = (sm[x.spark_id][x.reaction]||0)+1;
        });
        sparks.forEach(function(s){
          var newCounts = sm[s.id] || {};
          var changed = false;
          Z.ALL_REACTIONS.forEach(function(k){
            var nv = newCounts[k] || 0;
            if((s._reactions||{})[k] !== nv) changed = true;
          });
          if(changed){
            var merged2 = {};
            Z.ALL_REACTIONS.forEach(function(k){ merged2[k] = newCounts[k] || 0; });
            s._reactions = merged2;
            Z.updateSparkReactionsUI(s.id);
          }
        });
      }
    } catch(e){}
  }, 400);
}

/* Debounced snapshot save — realtime bursts shouldn't thrash localStorage */
var _snapDebounce = null;
function scheduleSnapshotSave(){
  if(_snapDebounce) clearTimeout(_snapDebounce);
  _snapDebounce = setTimeout(function(){
    _snapDebounce = null;
    try { Z.saveSnapshot(); } catch(e){}
  }, 800);
}

/* Remove a post card from the DOM without a full soft refresh */
function _removePostCard(postId){
  var card = document.querySelector('.post-card[data-post-id="' + postId + '"]');
  if(card && card.parentNode) card.parentNode.removeChild(card);
}

/* Remove a spark slide from the DOM without a full re-render */
function _removeSparkSlide(sparkId){
  var vid = document.querySelector('.spark-slide video[data-spark-id="' + sparkId + '"]');
  if(!vid) return;
  var slide = vid.closest('.spark-slide');
  if(!slide || !slide.parentNode) return;
  var feed = slide.parentNode;
  slide.parentNode.removeChild(slide);
  /* If nothing left, show empty state */
  var remaining = feed.querySelectorAll('.spark-slide');
  if(!remaining.length){
    Z.State.allSparks = [];
    Z.showView('spark');
  } else if(feed.scrollTop >= feed.scrollHeight - feed.clientHeight - 4){
    /* We were on the last slide — scroll up a bit */
    feed.scrollTop = Math.max(0, feed.scrollTop - feed.clientHeight);
  }
}

/* Apply a notification to state, honoring deliver_at. If it's a
   future-delivery notification, schedule a retry instead of dropping. */
function _applyNotification(n){
  if(!n) return;
  var me = Z.State.currentUser;
  if(!me || n.user_id !== me.id) return;
  var existing = (Z.State.allNotifications||[]).some(function(x){ return x.id === n.id; });
  if(existing) return;
  Z.State.allNotifications.unshift(n);
  Z.updateNotifBadge();
  if(Z.State.currentView === 'notifications'){ Z.softRefresh(); }
}

Z.setupRealtime = function(){
  var c = Z.sb();
  if(!c) return;
  var me = Z.State.currentUser;
  if(!me) return;

  /* Remove any old channels before opening new ones */
  try {
    if(c.getChannels){
      c.getChannels().forEach(function(ch){
        var nm = ch && (ch.topic || ch.name || '');
        if(typeof nm === 'string' && nm.indexOf('zynix-') === 0){
          try { c.removeChannel(ch); } catch(e){}
        }
      });
    }
  } catch(e){}
  (Z.State.realtimeChannels||[]).forEach(function(ch){ try { c.removeChannel(ch); } catch(e){} });
  Z.State.realtimeChannels = [];

  /* ---------- 1. COMMENTS (INSERT + DELETE) ---------- */
  try {
    var ch1 = c.channel('zynix-comments')
      .on('postgres_changes',
        { event: 'INSERT', schema: 'public', table: 'comments' },
        function(payload){
          var cm = payload.new;
          if(!cm) return;
          var meNow = Z.State.currentUser;
          if(meNow && cm.author_id === meNow.id) return;

          if(cm.spark_id){
            var sp = (Z.State.allSparks||[]).find(function(x){ return x.id === cm.spark_id; });
            if(sp){
              sp._commentsCount = (sp._commentsCount||0)+1;
              Z.refreshSparkCommentCount(cm.spark_id);
            }
            if(Z._openSparkCommentsId === cm.spark_id && sp){
              cm._reactionCounts = {}; cm._myReactions = {}; cm._replies = [];
              if(!sp._comments) sp._comments = [];
              if(cm.parent_id){
                (function walk(arr){
                  for(var i=0;i<arr.length;i++){
                    if(arr[i].id === cm.parent_id){ if(!arr[i]._replies) arr[i]._replies = []; arr[i]._replies.push(cm); return true; }
                    if(arr[i]._replies && walk(arr[i]._replies)) return true;
                  }
                  return false;
                })(sp._comments) || sp._comments.push(cm);
              } else {
                sp._comments.push(cm);
              }
              Z.rerenderSparkCommentsBody(cm.spark_id);
            }
            return;
          }

          if(!cm.post_id) return;
          var post = Z.findPostInState(cm.post_id);
          if(!post) return;
          var exists = false;
          (function scan(arr){
            for(var i=0;i<arr.length;i++){
              if(arr[i].id === cm.id){ exists = true; return; }
              if(arr[i]._replies) scan(arr[i]._replies);
            }
          })(post._comments || []);
          if(exists) return;
          cm._reactionCounts = {}; cm._myReactions = {}; cm._replies = [];
          if(!post._comments) post._comments = [];
          if(cm.parent_id){
            var parent = Z.findCommentInState(cm.parent_id);
            if(parent){ if(!parent._replies) parent._replies = []; parent._replies.push(cm); }
            else post._comments.push(cm);
          } else {
            post._comments.push(cm);
          }
          var container = document.getElementById('comments-' + cm.post_id);
          if(container){
            try {
              var temp = document.createElement('div');
              temp.innerHTML = Z.renderComment(cm, post, Z.State.allProfiles);
              var newEl = temp.firstChild;
              if(cm.parent_id){
                var parentEl = container.querySelector('[data-comment-id="' + cm.parent_id + '"]');
                if(parentEl){
                  var rc = parentEl.querySelector('.comment-replies');
                  if(!rc){ rc = document.createElement('div'); rc.className = 'comment-replies'; parentEl.appendChild(rc); }
                  rc.appendChild(newEl);
                } else container.appendChild(newEl);
              } else {
                var cp = container.querySelector('.comment-color-picker');
                if(cp && cp.parentNode === container) container.insertBefore(newEl, cp);
                else container.appendChild(newEl);
              }
            } catch(err){}
          }
          var card = document.querySelector('.post-card[data-post-id="' + cm.post_id + '"]');
          if(card && post){
            var btn = card.querySelector('.post-actions button');
            if(btn) btn.innerHTML = '<i class="fa-regular fa-comment"></i> Comment ' + Z.countAllComments(post._comments || []);
          }
        })
      .on('postgres_changes',
        { event: 'DELETE', schema: 'public', table: 'comments' },
        function(payload){
          var old = payload.old;
          if(!old || !old.id) return;
          var id = old.id;

          /* Recursively remove a comment (and any of its replies) from
             a nested comment tree. Returns true when it found + removed. */
          function removeRecFromList(arr){
            if(!arr) return false;
            for(var i=0;i<arr.length;i++){
              if(arr[i].id === id){ arr.splice(i,1); return true; }
              if(arr[i]._replies && removeRecFromList(arr[i]._replies)) return true;
            }
            return false;
          }

          /* Post comments */
          (Z.State.allPosts||[]).forEach(function(p){
            if(!p._comments) return;
            if(removeRecFromList(p._comments)){
              var card = document.querySelector('.post-card[data-post-id="' + p.id + '"]');
              if(card){
                var b = card.querySelector('.post-actions button');
                if(b) b.innerHTML = '<i class="fa-regular fa-comment"></i> Comment ' + Z.countAllComments(p._comments || []);
              }
            }
          });

          /* Space posts (same shape, no live card update needed) */
          (Z.State.spacePosts||[]).forEach(function(p){
            if(p._comments) removeRecFromList(p._comments);
          });

          /* Spark comments */
          (Z.State.allSparks||[]).forEach(function(sp){
            if(!sp._comments) return;
            if(removeRecFromList(sp._comments)){
              sp._commentsCount = Math.max(0, (sp._commentsCount||1) - 1);
              Z.refreshSparkCommentCount(sp.id);
              if(Z._openSparkCommentsId === sp.id){
                Z.rerenderSparkCommentsBody(sp.id);
              }
            }
          });

          /* Detach from DOM if still present */
          var domEl = document.querySelector('[data-comment-id="' + id + '"]');
          if(domEl && domEl.parentNode) domEl.parentNode.remove();
          var domSparkEl = document.querySelector('[data-spark-comment-id="' + id + '"]');
          if(domSparkEl && domSparkEl.parentNode) domSparkEl.parentNode.remove();
        })
      .subscribe();
    Z.State.realtimeChannels.push(ch1);
  } catch(e){}

  /* ---------- 2. REACTIONS (INSERT + DELETE) ---------- */
  try {
    var ch2 = c.channel('zynix-reactions')
      .on('postgres_changes', { event:'INSERT', schema:'public', table:'post_reactions' }, function(payload){
        var r = payload.new;
        if(!r) return;
        var meNow = Z.State.currentUser;
        if(meNow && r.user_id === meNow.id) return;
        if(Z._isRecentSelfReaction && Z._isRecentSelfReaction(r.post_id, r.reaction)) return;
        var post = Z.findPostInState(r.post_id);
        if(!post) return;
        if(!post.reactions) post.reactions = {};
        post.reactions[r.reaction] = (post.reactions[r.reaction]||0) + 1;
        Z.updatePostReactionUI(r.post_id);
      })
      .on('postgres_changes', { event:'INSERT', schema:'public', table:'spark_reactions' }, function(payload){
        var r = payload.new;
        if(!r) return;
        var meNow = Z.State.currentUser;
        if(meNow && r.user_id === meNow.id) return;
        if(Z._isRecentSelfReaction && Z._isRecentSelfReaction(r.spark_id, r.reaction)) return;
        var sp = (Z.State.allSparks||[]).find(function(x){ return x.id === r.spark_id; });
        if(!sp) return;
        if(!sp._reactions) sp._reactions = {};
        sp._reactions[r.reaction] = (sp._reactions[r.reaction]||0) + 1;

        if(meNow && r.user_id === meNow.id) return;

        var cm = Z.findCommentInState(r.comment_id);
        if(cm){
          if(!cm._reactionCounts) cm._reactionCounts = {};
          cm._reactionCounts[r.reaction] = (cm._reactionCounts[r.reaction]||0)+1;
          Z.updateCommentReactionUI(r.comment_id);

        if(sc && sc.cm){

  /* ---------- 3. WALLET (refetch, not blind math) ---------- */
  try {

  /* ---------- 4. NOTIFICATIONS (INSERT + UPDATE, respects deliver_at) ---------- */
  try {
    var notifFilter = 'user_id=eq.' + me.id;

    /* Long delays can exceed setTimeout's safe range and can also be
       rescheduled by the server (e.g. a dislike that gets reversed
       before it fires). This helper keeps re-checking until the row
       is either due or gone. */
    function _scheduleNotificationDelivery(n, attempt){
      attempt = attempt || 0;
      if(!n || !n.id) return;

      var meNow = Z.State.currentUser;
      if(!meNow || n.user_id !== meNow.id) return;

      var due = n.deliver_at ? new Date(n.deliver_at).getTime() : 0;
      var now = Date.now();
      var delay = due - now;

      /* If no deliver_at, or the time has passed, apply immediately. */
      if(!due || delay <= 0){
        _applyNotification(n);
        return;
      }

      /* Cap each hop at 5 minutes to avoid setTimeout overflow on
         very distant timestamps. We re-check on each hop. */
      var hop = Math.min(delay + 50, 5 * 60 * 1000);

      setTimeout(async function(){
        try {
          var c2 = Z.sb && Z.sb();
          if(!c2){ _scheduleNotificationDelivery(n, attempt + 1); return; }

          /* Re-fetch the notification row. If it no longer exists,
             the server deleted it (e.g. dislike was reversed) — do
             NOT show anything. */
          var row = await c2.from('notifications').select('*').eq('id', n.id).maybeSingle();
          if(row.error){ _scheduleNotificationDelivery(n, attempt + 1); return; }
          if(!row.data){ return; }

          /* If the deliver_at has changed (server updated it),
             reschedule with the new time. */
          if(row.data.deliver_at && row.data.deliver_at !== n.deliver_at){
            _scheduleNotificationDelivery(row.data, attempt + 1);
            return;
          }

          /* Still in the future? Loop again. */
          var newDelay = new Date(row.data.deliver_at || 0).getTime() - Date.now();
          if(newDelay > 0){
            _scheduleNotificationDelivery(row.data, attempt + 1);
            return;
          }

          /* Due now — apply. */
          _applyNotification(row.data);
        } catch(err){
          _scheduleNotificationDelivery(n, attempt + 1);
        }
      }, hop);
    }

    var ch4 = c.channel('zynix-notifications-' + me.id)
      .on('postgres_changes',
        { event:'INSERT', schema:'public', table:'notifications', filter: notifFilter },
        function(payload){
          var n = payload.new;
          if(!n) return;
          _scheduleNotificationDelivery(n, 0);
        })
      .on('postgres_changes',
        { event:'UPDATE', schema:'public', table:'notifications', filter: notifFilter },
        function(payload){
          var n = payload.new;
          if(!n) return;
          /* Update may move deliver_at forward (reversal) or rewrite
             the message. The scheduling loop re-fetches each hop, so
             re-running it here picks up the new state. */
          _scheduleNotificationDelivery(n, 0);
        })
      .subscribe();
    Z.State.realtimeChannels.push(ch4);

      .on('postgres_changes', { event:'UPDATE', schema:'public', table:'posts' }, function(payload){

        if(post.views  !== nw.views) { post.views  = nw.views;  changed = true; }
        if(!changed) return;
        var card = document.querySelector('.post-card[data-post-id="' + nw.id + '"]');
        if(!card) return;
        card.querySelectorAll('.post-actions button').forEach(function(b){
          if(b.innerHTML.indexOf('fa-share-nodes') >= 0){
            b.innerHTML = '<i class="fa-solid fa-share-nodes"></i> Share ' + (nw.shares||0);
          }
          if(b.innerHTML.indexOf('fa-eye') >= 0){
            b.innerHTML = '<i class="fa-regular fa-eye"></i> Views ' + (nw.views||0);
          }
        });
      })
     .on('postgres_changes', { event:'DELETE', schema:'public', table:'posts' }, async function(payload){
  var old = payload.old;
  if(!old || !old.id) return;

   if(check.error){

        if(check.data){

      .subscribe();

  /* ---------- 6. STATUSES (INSERT + DELETE) ---------- */
  try {

      function(payload){

  /* ---------- 7. SPARKS (INSERT + UPDATE + DELETE) ---------- */
  try {
    var ch7 = c.channel('zynix-sparks-stream')
      .on('postgres_changes', { event:'INSERT', schema:'public', table:'sparks' }, function(payload){
        var s = payload.new;

        if(exists) return;

        try { Z._backfillItem(s, true); } catch(e){}

      })
      .on('postgres_changes', { event:'UPDATE', schema:'public', table:'sparks' }, function(payload){

     .on('postgres_changes', { event:'DELETE', schema:'public', table:'sparks' }, async function(payload){

      try {
        var keys = Object.keys(Z._selfReaction || {});

Z.reloadData = async function(){
  var c = Z.sb();
  var me = Z.State.currentUser;

  var topLevel = [
    Z.DB.loadAllProfiles(),
    Z.DB.loadHomeFeed(),
    Z.DB.loadConnections(),
    Z.DB.loadNotifications(),
    Z.DB.loadStatuses(),
    Z.DB.loadSparks(),
    Z.DB.loadCirclesFromDB()
  ];
  if(me && c){
    topLevel.push(Z.DB.loadWalletTx(me.id).then(function(tx){ me._walletTx = tx || []; return tx; }));
    topLevel.push(Z.DB.loadStatusViews());
  }
  var results = await Promise.all(topLevel);
  var statusViews = (me && c) ? (results[results.length - 1] || []) : [];
  if(me){
    (Z.State.allStatuses||[]).forEach(function(s){
      if(s.author_id === me.id) return;
      var seen = statusViews.find(function(v){ return v.status_id === s.id && v.viewer_id === me.id; });
      if(seen) s._viewedByMe = true;
    });
  }

  Z.loadUnfrozen();
  Z.loadSavedSparks();
  if(me) Z.State.savedPosts = Z.getSavedPosts();
  Z._backfillAllMedia();

  /* If we're on Home and the status strip was painted empty before
     statuses arrived, repaint it now that data is here. This is why
     the row appeared blank after refresh / login until you navigated
     away and back. */
  if(Z.State.currentView === 'home'){
    try { if(typeof Z.renderStatusRow === 'function') Z.renderStatusRow(); } catch(e){}
  }

  if(me && c){
    var posts = Z.State.allPosts || [];
    var sparks = Z.State.allSparks || [];
    var postIds  = posts.map(function(p){ return p.id; });
    var sparkIds = sparks.map(function(s){ return s.id; });

    var jobs = [];

    jobs.push((async function(){
      var r = await c.from('post_reactions').select('post_id, reaction').eq('user_id', me.id);
      var myPostR = {};
      (r.data||[]).forEach(function(x){
        if(!myPostR[x.post_id]) myPostR[x.post_id] = {};
        myPostR[x.post_id][x.reaction] = true;
      });
      posts.forEach(function(p){ p._myReactions = myPostR[p.id] || {}; });
    })());

    if(postIds.length){
      jobs.push((async function(){
        var r = await c.from('post_reactions').select('post_id, reaction').in('post_id', postIds);
        var pm = {};
        (r.data||[]).forEach(function(x){
          pm[x.post_id] = pm[x.post_id] || {};
          pm[x.post_id][x.reaction] = (pm[x.post_id][x.reaction]||0)+1;
        });
        posts.forEach(function(p){ p.reactions = pm[p.id] || {}; });
      })());
    }

    if(sparkIds.length){
      jobs.push((async function(){
        var r = await c.from('spark_reactions').select('spark_id, reaction, user_id').in('spark_id', sparkIds);
        var sc = {}, mySR = {};
        (r.data||[]).forEach(function(x){
          sc[x.spark_id] = sc[x.spark_id] || {};
          sc[x.spark_id][x.reaction] = (sc[x.spark_id][x.reaction]||0)+1;
          if(x.user_id === me.id){
            if(!mySR[x.spark_id]) mySR[x.spark_id] = {};
            mySR[x.spark_id][x.reaction] = true;
          }
        });
        sparks.forEach(function(s){ s._reactions = sc[s.id] || {}; s._myReactions = mySR[s.id] || {}; });
      })());
    }

    if(sparkIds.length){
      jobs.push((async function(){
        var r = await c.from('comments').select('spark_id').in('spark_id', sparkIds);
        var counts = {};
        (r.data||[]).forEach(function(x){ counts[x.spark_id] = (counts[x.spark_id]||0)+1; });
        sparks.forEach(function(s){ s._commentsCount = counts[s.id] || 0; });
      })());
    }

    if(postIds.length){
      jobs.push((async function(){
        var r = await c.from('comments').select('*').in('post_id', postIds).order('created_at', {ascending:true});
        var cmts = r.data || [];
        var cIds = cmts.map(function(x){ return x.id; });
        var crMap = {}, myCrMap = {};
        if(cIds.length){
          var cr = await c.from('comment_reactions').select('comment_id, reaction, user_id').in('comment_id', cIds);
          (cr.data||[]).forEach(function(x){
            crMap[x.comment_id] = crMap[x.comment_id] || {};
            crMap[x.comment_id][x.reaction] = (crMap[x.comment_id][x.reaction]||0)+1;
            if(x.user_id === me.id){
              myCrMap[x.comment_id] = myCrMap[x.comment_id] || {};
              myCrMap[x.comment_id][x.reaction] = true;
            }
          });
        }
        var byPost = {};
        cmts.forEach(function(cm){ if(!byPost[cm.post_id]) byPost[cm.post_id] = []; byPost[cm.post_id].push(cm); });
        posts.forEach(function(p){
          var list = byPost[p.id] || [];
          list.forEach(function(cm){
            cm._reactionCounts = crMap[cm.id] || {};
            cm._myReactions = myCrMap[cm.id] || {};
            cm._replies = [];
          });
          var byId = {};
          list.forEach(function(x){ byId[x.id] = x; });
          list.forEach(function(x){ if(x.parent_id && byId[x.parent_id]) byId[x.parent_id]._replies.push(x); });
          p._comments = list.filter(function(x){ return !x.parent_id; });
        });
      })());
    }

    await Promise.all(jobs);
  }

  Z.loadWalletBadge();
  Z.updateNotifBadge();
  Z.saveSnapshot();
};

})();

<script>
(function(){

function readCachedUserIdSync(){
  try {
    if(!window.localStorage) return null;
    var projRef = null;
    try {
      var u = Z.SUPABASE_URL || '';
      var m = u.match(/^https:\/\/([^.]+)\.supabase\.co/);
      if(m && m[1]) projRef = m[1];
    } catch(e){}
    if(!projRef) return null;
    var key = 'sb-' + projRef + '-auth-token';
    var raw = localStorage.getItem(key);
    if(!raw) return null;
    var parsed = JSON.parse(raw);
    if(!parsed) return null;
    var user = null;
    if(parsed.user && parsed.user.id) user = parsed.user;
    else if(parsed.currentSession && parsed.currentSession.user && parsed.currentSession.user.id) user = parsed.currentSession.user;
    else if(parsed.session && parsed.session.user && parsed.session.user.id) user = parsed.session.user;
    if(!user || !user.id) return null;
    return {
      id: user.id,
      email: user.email || null,
      user_metadata: user.user_metadata || {}
    };
  } catch(e){ return null; }
}

var _authBootDone = false;
function hookAuthChanges(){
  try {
    var c = Z.sb();
    if(!c) return;
    c.auth.onAuthStateChange(async function(event){
      if(event === 'TOKEN_REFRESHED' || event === 'INITIAL_SESSION' || event === 'USER_UPDATED'){
        if(event === 'TOKEN_REFRESHED') await Z.refreshSession();
        return;
      }
      if(!_authBootDone) return;
      if(event === 'SIGNED_OUT'){
        Z.State.currentUser = null;
        Z.renderHeaderAuth();
        Z.updateHeader();
        Z.State.navStack = [];
        Z.showView('public-home');
        return;
      }
      if(event === 'SIGNED_IN'){
        if(Z.State.manualAuthInProgress) return;
        if(Date.now() - (Z.State._manualAuthCompletedAt || 0) < 5000) return;

        var fresh = Z.State.currentUser;
        if(fresh && fresh.id){
          return;
        }

        await Z.refreshSession();
        await Z.reloadData();
        Z.State.navStack = [];
        Z.showView('home');
        Z.setupRealtime();
      }
    });
  } catch(e){}
}

async function boot(){
  Z.checkAdminParam();
  Z.showWelcome(Z.getWelcomeGreeting('home'));

  var cached = readCachedUserIdSync();

  if(!cached || !cached.id){
    Z.State.currentUser = null;
    Z.renderHeaderAuth();
    Z.updateHeader();
    Z.showView('public-home');
    setTimeout(function(){ Z.hideWelcome(); }, 350);

    (async function(){
      try {
        var cc = Z.sb();
        if(!cc) return;
        var sres = await cc.auth.getSession();
        var sessionUser = sres && sres.data && sres.data.session ? sres.data.session.user : null;
        if(!sessionUser) return;
        await Z.refreshSession();
        Z.loadSnapshot();
        var restored0 = Z.restoreView();
        Z.showView(restored0.view || 'home', restored0.param);
        Z.hideWelcome();
        try { await Z.reloadData(); } catch(e){}
        /* Refresh the DOM from the freshly loaded data. Without this
           the snapshot would stay on screen until the user navigates. */
        if(Z.State.currentView === 'home'){ try { Z.softRefresh(); } catch(e){} }
        Z.setupRealtime();
      } catch(e){}
    })();

    try { Z.loadBuildTimeline(); } catch(e){}

    Z.State.bootCompleted = true;
    _authBootDone = true;
    hookAuthChanges();
    return;
  }

  Z.State.currentUser = {
    id: cached.id,
    email: cached.email,
    name: (cached.user_metadata && cached.user_metadata.name) || 'You',
    wallet_cash: 0,
    wallet_bounty: 0
  };
  Z.renderHeaderAuth();
  Z.updateHeader();

  var hadSnapshot = Z.loadSnapshot();
  var restored = Z.restoreView();

  Z.showView(restored.view, restored.param);
  if(hadSnapshot){
    Z.hideWelcome();
  } else {
    setTimeout(function(){ Z.hideWelcome(); }, 350);
  }

  (async function(){
    try {
      var cc2 = Z.sb();
      if(cc2){
        var sres2 = await cc2.auth.getSession();
        var sessionUser2 = sres2 && sres2.data && sres2.data.session ? sres2.data.session.user : null;
        if(!sessionUser2){
          Z.State.currentUser = null;
          Z.State.allPosts = [];
          Z.State.allSparks = [];
          Z.State.allProfiles = [];
          Z.State.allCircles = [];
          Z.State.allNotifications = [];
          Z.State.allConnections = [];
          Z.State.allStatuses = [];
          try { localStorage.setItem('zynix_last_view','public-home'); localStorage.removeItem('zynix_last_param'); } catch(e){}
          Z.renderHeaderAuth();
          Z.updateHeader();
          Z.showView('public-home');
          return;
        }
      }
    } catch(e){}

    await Z.refreshSession();

    if(!Z.State.currentUser){
      try { localStorage.setItem('zynix_last_view','public-home'); localStorage.removeItem('zynix_last_param'); } catch(e){}
      Z.showView('public-home');
      return;
    }

    Z.migrateLocalCirclesOnce();

    try {
      await Z.reloadData();
      /* Refresh the DOM from the freshly loaded data. Without this,
         the snapshot (up to 24h old) would stay on screen until the
         user navigates or pulls-to-refresh. */
      if(Z.State.currentView === 'home'){ try { Z.softRefresh(); } catch(e){} }
      Z.setupRealtime();
    } catch(e){
      Z.setupRealtime();
    }
  })();

  try { Z.loadBuildTimeline(); } catch(e){}

  Z.State.bootCompleted = true;
  _authBootDone = true;
  hookAuthChanges();
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

})();

<script>
(function(){
'use strict';
var Z = window.Z;
if(!Z) return;

var LOUNGE_KEY_PREFIX = 'zynix_lounge_rows_';

Z._loungeKey = function(){
  var me = Z.State.currentUser;
  return me ? (LOUNGE_KEY_PREFIX + me.id) : '';
};

Z._getLoungeRows = function(){
  var key = Z._loungeKey();
  if(!key) return ['status', 'circles'];
  try {
    var raw = localStorage.getItem(key);
    if(!raw) return ['status', 'circles'];
    var arr = JSON.parse(raw);
    if(!Array.isArray(arr)) return ['status', 'circles'];
    return arr;
  } catch(e){ return ['status', 'circles']; }
};

Z._setLoungeRows = function(rows){
  var key = Z._loungeKey();
  if(!key) return;
  try { localStorage.setItem(key, JSON.stringify(rows)); } catch(e){}
};

Z.LOUNGE_AVAILABLE_ROWS = [
  { id: 'status',    label: 'Status',           icon: 'fa-solid fa-circle-notch' },
  { id: 'circles',   label: 'Circles',          icon: 'fa-solid fa-circle-nodes' },
  { id: 'tiles',     label: 'Quick Tiles',      icon: 'fa-solid fa-grip' },
  { id: 'featured',  label: 'Featured Studio',  icon: 'fa-solid fa-star' },
  { id: 'shops',     label: 'Shops',            icon: 'fa-solid fa-store' },
  { id: 'people',    label: 'Discover People',  icon: 'fa-solid fa-users' },
  { id: 'sparks',    label: 'Sparks',           icon: 'fa-solid fa-bolt' },
  { id: 'wallet',    label: 'Wallet',           icon: 'fa-solid fa-wallet' },

Z.renderLounge = function(){
  var me = Z.State.currentUser;
  if(!me){

      icon: 'fa-solid fa-couch',

  var rows = Z._getLoungeRows();

  var html = '<div style="display:flex;flex-direction:column;gap:14px;">';

};

Z._renderLoungeRow = function(rowId){
  var meta = Z.LOUNGE_AVAILABLE_ROWS.filter(function(r){ return r.id === rowId; })[0];

};

Z._wireLoungeRows = function(){
  var rows = Z._getLoungeRows();
  rows.forEach(function(rowId){

    Z._loadLoungeRow(rowId);
  });
};

Z._loadLoungeRow = async function(rowId){

    body.innerHTML = Z._renderQuickTiles();
    return;

    body.innerHTML = await Z._renderLoungeCircles();
    return;
  }
  if(rowId === 'people'){
    body.innerHTML = await Z._renderLoungePeople();
    return;
  }
  if(rowId === 'featured'){
    body.innerHTML = Z._renderLoungeFeatured();
    return;
  }
  if(rowId === 'shops'){
    body.innerHTML = await Z._renderLoungeShops();
    return;
  }
  if(rowId === 'sparks'){
    body.innerHTML = Z._renderLoungeSparks();
    return;
  }
  if(rowId === 'wallet'){
    body.innerHTML = Z._renderLoungeWalletTile();
    return;

async function syncDriverStats(){

  try {
    var prof = await c.rpc('get_driver_public_profile', { p_user_id: u.id });
    var data = prof && prof.data ? prof.data : null;
    if(data){
      var payload = { total_rides: data.total_rides||0, rating_avg: Number(data.rating_avg)||5, rating_count: Number(data.rating_count)||0 };
      try { await c.from('drive_drivers').update(payload).eq('user_id',u.id); } catch(e){}

    var rides = rr.data || [];
    var gross = rides.reduce(function(s,r){ return s + (Number(r.agreed_fare)||Number(r.rider_offered_fare)||0) + (Number(r.tip_amount)||0); },0);
    var comm = Number(S.driver.commission_rate) || 10;
    var wu = S.driver.commission_waived_until ? new Date(S.driver.commission_waived_until) : null;
    var waived = wu && wu > new Date();
    var totalEarnings = waived ? gross : gross * (1-comm/100);
    try { await c.from('drive_drivers').update({ total_earnings: totalEarnings }).eq('user_id',u.id); } catch(e){}
    S.driver.total_earnings = totalEarnings;

      rides.forEach(function(r){ var t = new Date(r.completed_at || r.created_at).getTime(); if(t >= start && t < end) sum += ((Number(r.agreed_fare)||Number(r.rider_offered_fare)||0) + (Number(r.tip_amount)||0)) * (waived?1:(1-comm/100)); });

async function computeDemand(){
  var c = db(); if(!c) return;
  try { var five = new Date(Date.now() - 5*60*1000).toISOString();
    var r = await c.from('drive_rides').select('id',{count:'exact',head:true}).eq('status','requested').gte('created_at', five);
    S.demandLevel = (r && r.count) || 0;
  } catch(e){ S.demandLevel = 0; }
}
async function computeShareBadge(){
  var u = me(); if(!u) return; var c = db(); if(!c) return;
  try {
    var jr = await c.from('drive_shared_journeys').select('id').eq('driver_id', u.id).eq('is_active', true);
    var ids = (jr.data||[]).map(function(x){ return x.id; });
    if(!ids.length){ S.shareBadge = 0; S.historyBadge = 0; return; }
    var br = await c.from('drive_shared_bookings').select('id',{count:'exact',head:true}).in('journey_id', ids).eq('status','pending');
    S.shareBadge = (br && br.count) || 0;
    S.historyBadge = S.shareBadge;
  } catch(e){ S.shareBadge = 0; S.historyBadge = 0; }
}

/* ================== POLLING ================== */
function ensureRidePoll(){
  var active = (S.activeRide && ['requested','bidding','accepted','driver_arriving','in_progress'].indexOf(S.activeRide.status)!==-1) || S.activeDriverRide;
  if(active && !S.pollTimer) startRidePoll();
  if(!active && S.pollTimer) stopRidePoll();
}
function startRidePoll(){
  stopRidePoll();
  S.pollTimer = setInterval(async function(){
    if(document.hidden) return;
    var c = db(); if(!c) return; var u = me(); if(!u) return;
    if(S.activeRide && S.activeRide.id){
      try { var r = await c.from('drive_rides').select('*').eq('id', S.activeRide.id).maybeSingle();
        if(r.data){ var prev = S.activeRide.status + '|' + S.activeRide.id; var next = r.data.status + '|' + r.data.id; S.activeRide = r.data;
          if(prev !== next || r.data.status === 'driver_arriving') renderTab(); } } catch(e){}
    }
    if(S.activeDriverRide && S.activeDriverRide.id){
      try { var d = await c.from('drive_rides').select('*').eq('id', S.activeDriverRide.id).maybeSingle();
        if(d.data){ var pd = S.activeDriverRide.status + '|' + S.activeDriverRide.id; var nd = d.data.status + '|' + d.data.id; S.activeDriverRide = d.data; if(pd !== nd) renderTab(); } } catch(e){}
    }
    computeShareBadge().then(function(){ updateBadges(); });
  }, 4000);
}
function stopRidePoll(){ if(S.pollTimer){ clearInterval(S.pollTimer); S.pollTimer = null; } }
function startPeriodicSync(){
  if(S.syncTimer) return;
  S.syncTimer = setInterval(async function(){
    if(document.hidden) return; if(Z.State.currentView !== 'drive' && Z.State.currentView !== 'drive-profile') return;
    var before = JSON.stringify([S.traveller, S.driver, S.streakWeek]);
    await refreshSideProfiles();
    var after = JSON.stringify([S.traveller, S.driver, S.streakWeek]);
    if(before !== after && (S.tab === 'profile' || (S.tab === 'home' && !S.activeRide))) renderTab();
    if(S.tab === 'home' && S.mode === 'driver') computeDemand().then(function(){ renderTab(); });
    if(S.tab === 'share-ride' || S.tab === 'history') computeShareBadge().then(updateBadges);
  }, 30000);
}
function stopPeriodicSync(){ if(S.syncTimer){ clearInterval(S.syncTimer); S.syncTimer = null; } }
function updateBadges(){
  var b = document.getElementById('zy-share-tab');
  if(b){
    var ex = b.querySelector('.zy-badge');
    if(S.shareBadge > 0){ if(!ex){ var sp = document.createElement('span'); sp.className='zy-badge'; sp.style.cssText='position:absolute;top:2px;right:4px;background:#ef4444;color:#fff;font-size:8px;font-weight:900;min-width:14px;height:14px;border-radius:7px;padding:0 4px;display:flex;align-items:center;justify-content:center;'; sp.textContent = S.shareBadge>9?'9+':S.shareBadge; b.appendChild(sp); } else { ex.textContent = S.shareBadge>9?'9+':S.shareBadge; } }
    else if(ex) ex.remove();
  }
  var h = document.getElementById('zy-history-tab');
  if(h){
    var ex2 = h.querySelector('.zy-badge');
    if(S.historyBadge > 0){ if(!ex2){ var sp2 = document.createElement('span'); sp2.className='zy-badge'; sp2.style.cssText='position:absolute;top:2px;right:4px;background:#ef4444;color:#fff;font-size:8px;font-weight:900;min-width:14px;height:14px;border-radius:7px;padding:0 4px;display:flex;align-items:center;justify-content:center;'; sp2.textContent = S.historyBadge>9?'9+':S.historyBadge; h.appendChild(sp2); } else { ex2.textContent = S.historyBadge>9?'9+':S.historyBadge; } }
    else if(ex2) ex2.remove();
  }
}

/* ================== INIT ================== */
async function init(container){
  container = container || document.getElementById('zy-drive-mount'); if(!container) return;
  var u = me(); if(!u){ container.innerHTML = '<div style="padding:40px;text-align:center;color:#94a3b8;">Please sign in to use ZYNIX Drive.</div>'; return; }
  var c = db(); if(!c){ container.innerHTML = '<div style="padding:20px;color:#f87171;">Not connected.</div>'; return; }
  container.innerHTML = '<div style="padding:30px;text-align:center;color:#64748b;"><i class="fa-solid fa-circle-notch fa-spin" style="font-size:26px;color:#10b981;"></i></div>';
  S.favDrivers = loadFavs();
  var lsCur = null; try { lsCur = localStorage.getItem('zynix_drive_currency'); } catch(e){}
  if(lsCur && CUR_MAP[lsCur]) S.currency = lsCur;
  S.tab = loadTab();
  S.historySub = loadHistorySub();
  try {
    var [dR,tR,rR] = await Promise.all([
      c.from('drive_drivers').select('*').eq('user_id',u.id).maybeSingle(),
      c.from('drive_travellers').select('*').eq('user_id',u.id).maybeSingle(),
      c.from('drive_ratings').select('ride_id').eq('rater_id',u.id)
    ]);
    S.driver = dR && dR.data ? dR.data : null;
    S.traveller = tR && tR.data ? tR.data : null;
    if(!lsCur){
      if(S.driver && S.driver.currency && CUR_MAP[S.driver.currency]) S.currency = S.driver.currency;
      else if(S.traveller && S.traveller.currency && CUR_MAP[S.traveller.currency]) S.currency = S.traveller.currency;
    }
    S.myRated = {};
    (rR.data||[]).forEach(function(x){ S.myRated[x.ride_id] = true; });
    if(!S.traveller){ try { await c.from('drive_travellers').upsert({user_id:u.id, currency: getCurrency()},{onConflict:'user_id'}); } catch(e){} S.traveller = {user_id:u.id, rating_avg:5, rating_count:0, total_rides:0}; }
    await syncTravellerStats();
    if(S.driver) await syncDriverStats();
    var rr = await c.from('drive_rides').select('*').eq('traveller_id',u.id).in('status',['requested','bidding','accepted','driver_arriving','in_progress']).order('created_at',{ascending:false}).limit(1);
    S.activeRide = rr.data && rr.data[0] ? rr.data[0] : null;
    if(S.activeRide && (S.activeRide.status === 'bidding' || S.activeRide.status === 'requested')) await loadRideBids(S.activeRide.id);
    if(S.driver){
      var dr = await c.from('drive_rides').select('*').eq('driver_id',u.id).in('status',['accepted','driver_arriving','in_progress']).order('created_at',{ascending:false}).limit(1);
      S.activeDriverRide = dr.data && dr.data[0] ? dr.data[0] : null;
    }
    await computeDemand();
    await computeShareBadge();
  } catch(e){ console.warn('[Drive init]',e); }
  S.mode = (S.driver && S.activeDriverRide) ? 'driver' : 'rider';
  S.lastRideFingerprint = '';
  renderShell(container);
  bcInit(); rt_start(); startPeriodicSync(); ensureRidePoll();
}

  h += '</div></div>';

  h += '<div style="display:flex;gap:6px;padding:0 12px 12px;">';
  [['home','Home','fa-solid fa-house',null],['share-ride','Share','fa-solid fa-route','zy-share-tab'],['history','History','fa-solid fa-clock-rotate-left','zy-history-tab'],['discover','Discover','fa-solid fa-compass',null],['profile','My Drive','fa-solid fa-id-card',null]].forEach(function(t){
    var a = S.tab===t[0];
    h += '<button data-tab="'+t[0]+'" '+(t[3]?('id="'+t[3]+'"'):'')+' style="flex:1;position:relative;padding:9px 4px;border-radius:10px;border:1px solid '+(a?'rgba(16,185,129,.5)':'#1e293b')+';background:'+(a?'rgba(16,185,129,.12)':'rgba(255,255,255,0.03)')+';color:'+(a?'#10b981':'#94a3b8')+';font-weight:800;font-size:10px;cursor:pointer;"><i class="'+t[2]+'"></i><br>'+t[1]+'</button>';
  });
  h += '</div><div id="zy-content" style="padding:0 12px;"></div></div>';
  container.innerHTML = h;
  document.querySelectorAll('#zy-drive-root [data-tab]').forEach(function(b){ b.addEventListener('click',function(){ S.tab = this.getAttribute('data-tab'); saveTab(S.tab); S.lastRideFingerprint = ''; renderShell(container); }); });
  var mt = document.getElementById('zy-mode-toggle'); if(mt) mt.addEventListener('click',function(){ S.mode = S.mode==='rider'?'driver':'rider'; S.lastRideFingerprint = ''; renderShell(container); });
  var bd = document.getElementById('zy-become-driver'); if(bd) bd.addEventListener('click', openDriverOnboard);
  var cb = document.getElementById('zy-cur-btn'); if(cb) cb.addEventListener('click', openCurrencyPicker);
  renderTab();
  updateBadges();
}
function renderTab(){
  var c = document.getElementById('zy-content'); if(!c) return;
  if(S.tab==='home'){ if(S.mode==='rider'){ if(S.activeRide) renderActiveRider(c); else renderRiderHome(c); } else { if(!S.driver) renderNoDriver(c); else if(S.activeDriverRide) renderActiveDriver(c); else renderDriverHome(c); } }
  else if(S.tab==='share-ride'){ if(typeof Z.renderShareRide === 'function') Z.renderShareRide(c); else c.innerHTML = '<div style="text-align:center;padding:40px;color:#94a3b8;">Share Ride is loading…</div>'; }
  else if(S.tab==='history') renderHistory(c);
  else if(S.tab==='discover') renderDiscover(c);
  else if(S.tab==='profile') renderProfileTab(c);
}

async function findDrivers(){
  var list = document.getElementById('zy-r-drivers'); var cnt = document.getElementById('zy-r-count'); if(!list) return;
  var pickup = (document.getElementById('zy-r-pickup')||{}).value||'';
  var dest = (document.getElementById('zy-r-dest')||{}).value||'';
  if(!pickup.trim() || !dest.trim()){ toast('Enter pickup and destination'); return; }
  S.draft.pickup = pickup; S.draft.dest = dest;
  list.innerHTML = '<div style="text-align:center;padding:20px;color:#64748b;"><i class="fa-solid fa-circle-notch fa-spin"></i></div>';
  var c = db(); if(!c) return;
  var p; try { p = await geo(); S.pos = p; } catch(e){ list.innerHTML = '<div style="text-align:center;padding:20px;color:#f87171;font-size:12px;">Enable location to find drivers.</div>'; return; }
  try {
    var r = await c.rpc('find_nearby_drivers',{p_lat:p.lat,p_lng:p.lng,p_radius_km:10,p_limit:30});
    if(r.error) throw r.error;
    S.nearby = r.data||[];
    if(cnt) cnt.textContent = S.nearby.length + ' nearby';
    paintNearby();
  } catch(e){ list.innerHTML = '<div style="text-align:center;padding:20px;color:#f87171;font-size:12px;">Failed: ' + esc(e.message) + '</div>'; }

function paintNearby(){

  var q = (S.nearbySearch||'').trim().toLowerCase();
  var arr = (S.nearby||[]).slice();
  arr.sort(function(a,b){ var af = favSet[a.driver_user_id]?1:0, bf = favSet[b.driver_user_id]?1:0; if(af !== bf) return bf - af; return (Number(b.rating_avg)||0) - (Number(a.rating_avg)||0); });

async function requestRide(driverId){
  var u = me(); if(!u) return; var c = db(); if(!c) return;
  var pickup = (document.getElementById('zy-r-pickup')||{}).value||''; var dest = (document.getElementById('zy-r-dest')||{}).value||'';
  var fare = parseFloat((document.getElementById('zy-r-fare')||{}).value||'0')||0;
  if(!pickup.trim() || !dest.trim()){ toast('Enter pickup and destination'); return; }
  if(fare <= 0){ toast('Enter a fare'); return; }
  var loc = S.pos; if(!loc){ try { loc = await geo(); S.pos = loc; } catch(e){} }
  var payload = { traveller_id:u.id, target_driver_id:driverId, driver_id:null, pickup_address:pickup, dest_address:dest, rider_offered_fare:fare, fare_currency: getCurrency(), status:'requested' };
  if(loc) payload.pickup_location = pointStr(loc);
  try {
    var r = await c.from('drive_rides').insert(payload).select();
    if(r.error) throw r.error;
    if(!r.data || !r.data.length) throw new Error('Insert returned no row');
    S.activeRide = r.data[0];
    var arr = loadSavedRoutes(); var label = (dest||'').slice(0,20);
    var dup = arr.findIndex(function(x){ return x.pickup === pickup && x.dest === dest; });
    var entry = { pickup: pickup, dest: dest, fare: String(fare), label: label };
    if(dup >= 0) arr.splice(dup,1); arr.unshift(entry); saveSavedRoutes(arr); clearDraft();
       toast('Ride requested'); bcSend('ride', S.activeRide);
    /* v9.1: bell notify the driver */
    if(window.Z && Z.driveNotify) Z.driveNotify(driverId, 'New ride request — ' + pickup + ' → ' + dest + ' · ' + money(fare, getCurrency()), 'drive_ride_request');
    renderTab(); ensureRidePoll();
  } catch(e){ toast('Failed: ' + e.message); }
}

    if(pt && pt.data && pt.data[0]){ lat = Number(pt.data[0].lat); lng = Number(pt.data[0].lng); }
    if(!lat || !lng){ var dd = await c.from('drive_drivers').select('last_location').eq('user_id',driverId).maybeSingle(); var p = parsePoint(dd.data && dd.data.last_location); if(p){ lat = p.lat; lng = p.lng; } }
    if(!lat || !lng){ body.innerHTML = '<div style="text-align:center;padding:60px 0;color:#64748b;font-size:11px;">Location not available yet</div>'; return; }
    var bbox = [lng-0.008, lat-0.006, lng+0.008, lat+0.006].join(',');
    var url = 'https://www.openstreetmap.org/export/embed.html?bbox=' + bbox + '&layer=mapnik&marker=' + lat + ',' + lng;
    body.innerHTML = '<iframe src="'+url+'" style="width:100%;height:100%;border:0;border-radius:10px;" loading="lazy"></iframe>';
    if(upd) upd.textContent = 'Updated ' + new Date().toLocaleTimeString();
    if(gm){ var dest = ''; if(ride && ride.pickup_location){ var pp = parsePoint(ride.pickup_location); if(pp) dest = pp.lat+','+pp.lng; } gm.href = 'https://www.google.com/maps/dir/?api=1&origin='+lat+','+lng+(dest?('&destination='+dest):''); }
  } catch(e){ body.innerHTML = '<div style="text-align:center;padding:60px 0;color:#f87171;font-size:11px;">Map error</div>'; }
}
function parsePoint(p){
  if(!p) return null;
  if(typeof p === 'object' && p.coordinates) return {lng:p.coordinates[0], lat:p.coordinates[1]};
  if(typeof p === 'string'){
    var m = p.match(/POINT\(([-\d.]+)\s+([-\d.]+)\)/); if(m) return {lng:parseFloat(m[1]), lat:parseFloat(m[2])};
    if(/^[0-9a-f]{40,}$/i.test(p)){ try { var bytes = p.match(/.{2}/g).map(function(h){ return parseInt(h,16); }); var dv = new DataView(new Uint8Array(bytes).buffer); return {lng: dv.getFloat64(9, true), lat: dv.getFloat64(17, true)}; } catch(e){} }
  }
  return null;
}

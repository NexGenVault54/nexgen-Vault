<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZYNIX - Complete Social Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        zynix: {
                            bg: "#090d16",
                            card: "#111827",
                            cardHover: "#1f2937",
                            border: "#1e293b",
                            emerald: "#10b981",
                            blue: "#3b82f6",
                            pink: "#ec4899",
                            purple: "#8b5cf6",
                            amber: "#f59e0b",
                            red: "#ef4444",
                            rose: "#f43f5e",
                            orange: "#f97316",
                            teal: "#14b8a6"
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #090d16; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
        
        /* ===== ANIMATIONS ===== */
        @keyframes flyToWallet {
            0% { transform: scale(0.6) translateX(0) rotate(0deg); opacity: 0; }
            20% { transform: scale(1.2) translateX(-20px) rotate(-10deg); opacity: 1; }
            80% { transform: scale(0.9) translateY(-160px) translateX(90px) rotate(20deg); opacity: 1; }
            100% { transform: scale(0.3) translateY(-250px) translateX(160px) rotate(45deg); opacity: 0; }
        }
        .dollar-note {
            animation: flyToWallet 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            background: transparent !important;
            box-shadow: none !important;
            border: none !important;
        }
        
        @keyframes pulseWallet {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); box-shadow: 0 0 25px rgba(16, 185, 129, 0.7); }
            100% { transform: scale(1); }
        }
        .wallet-pulse { animation: pulseWallet 0.5s ease-in-out; }
        
        /* ===== STATUS VIEWER ===== */
        [data-status-stage] {
            contain: layout paint !important;
            min-height: 360px !important;
            max-height: 620px !important;
            height: clamp(360px, 58vh, 620px) !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            background: #020617 !important;
            overflow: hidden !important;
            position: relative !important;
        }
        [data-status-stage] video,
        [data-status-stage] img {
            width: 100% !important;
            height: 100% !important;
            max-width: 100% !important;
            max-height: 100% !important;
            object-fit: contain !important;
        }
        [data-status-stage] .text-status {
            width: 100% !important;
            height: 100% !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            padding: 24px !important;
            background: #111827 !important;
            color: #f8fafc !important;
            font-size: clamp(1.2rem, 3vw, 2.2rem) !important;
            font-weight: 700 !important;
            text-align: center !important;
            line-height: 1.6 !important;
            overflow-y: auto !important;
            word-break: break-word !important;
        }
        [data-status-controls] {
            position: relative !important;
            z-index: 100 !important;
            width: 100% !important;
            height: 72px !important;
            min-height: 72px !important;
            max-height: 72px !important;
            flex: 0 0 72px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            padding: 10px 14px !important;
            background: #111827 !important;
            border-top: 1px solid rgba(51,65,85,0.65) !important;
            box-sizing: border-box !important;
        }
        [data-status-controls] button {
            position: relative !important;
            z-index: 110 !important;
            flex: 0 0 auto !important;
            height: 42px !important;
            min-height: 42px !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            transform: none !important;
            margin-top: 0 !important;
            margin-bottom: 0 !important;
            align-self: center !important;
        }
        @media (max-width: 640px) {
            [data-status-stage] {
                min-height: 320px !important;
                max-height: 500px !important;
                height: clamp(320px, 52vh, 500px) !important;
            }
        }
        
        /* ===== STATUS ROW ===== */
        #status-row {
            display: flex !important;
            flex-wrap: nowrap !important;
            overflow-x: auto !important;
            overflow-y: hidden !important;
            -webkit-overflow-scrolling: touch !important;
            scrollbar-width: none !important;
            touch-action: pan-x !important;
            padding: 8px 0 !important;
        }
        #status-row::-webkit-scrollbar { display: none !important; }
        #status-row > * { flex: 0 0 auto !important; }
        
        /* ===== STATUS RING ===== */
        .status-ring-unseen {
            background: linear-gradient(135deg, #10b981, #3b82f6, #8b5cf6);
            padding: 3px;
            border-radius: 50%;
        }
        .status-ring-seen {
            background: #1e293b;
            padding: 3px;
            border-radius: 50%;
        }
        .status-ring-inner {
            border: 2px solid #090d16;
            border-radius: 50%;
            overflow: hidden;
        }
        
        /* ===== CHAT ===== */
        .msg-sent {
            background: #10b981 !important;
            color: white !important;
            border-radius: 18px 18px 4px 18px !important;
            padding: 10px 16px !important;
            max-width: 80% !important;
            align-self: flex-end !important;
            margin: 4px 0 !important;
        }
        .msg-received {
            background: #1f2937 !important;
            color: #f8fafc !important;
            border-radius: 18px 18px 18px 4px !important;
            padding: 10px 16px !important;
            max-width: 80% !important;
            align-self: flex-start !important;
            margin: 4px 0 !important;
        }
        
        /* ===== BADGES ===== */
        .badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #ef4444;
            color: white;
            font-size: 9px;
            font-weight: 700;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* ===== SHARE MODAL ===== */
        .share-app {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            background: #1e293b;
            border: 1px solid #334155;
            transition: all 0.2s;
            cursor: pointer;
            font-size: 10px;
            color: #94a3b8;
        }
        .share-app:hover {
            transform: scale(1.05);
            border-color: #10b981;
            background: #111827;
        }
        .share-app i { font-size: 22px; }
        .share-app-whatsapp i { color: #25D366; }
        .share-app-facebook i { color: #1877F2; }
        .share-app-instagram i { color: #E4405F; }
        .share-app-tiktok i { color: #000000; }
        .share-app-twitter i { color: #000000; }
        .share-app-youtube i { color: #FF0000; }
        .share-app-google i { color: #4285F4; }
        .share-app-copy i { color: #10b981; }
        
        /* ===== CIRCLE SHOP ===== */
        .shop-card {
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 16px;
            background: #111827;
            transition: all 0.3s;
        }
        .shop-card:hover {
            border-color: #10b981;
            transform: translateY(-2px);
        }
        .shop-badge {
            font-size: 9px;
            padding: 2px 10px;
            border-radius: 20px;
            font-weight: 600;
        }
        .shop-badge-services { background: #3b82f6/20; color: #3b82f6; }
        .shop-badge-goods { background: #8b5cf6/20; color: #8b5cf6; }
        .shop-badge-social { background: #10b981/20; color: #10b981; }
        .shop-badge-office { background: #f59e0b/20; color: #f59e0b; }
        
        /* ===== BODY ===== */
        body {
            background-color: #090d16;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        
        /* ===== REACTION BUTTONS ===== */
        .react-btn {
            transition: all 0.2s;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 13px;
            background: transparent;
            border: 1px solid transparent;
        }
        .react-btn:hover {
            transform: scale(1.15);
            background: #1e293b;
        }
        .react-btn-active {
            background: #10b981/20 !important;
            border-color: #10b981/30 !important;
        }
        .react-count {
            font-size: 10px;
            color: #64748b;
            margin-left: 2px;
        }
    </style>
</head>
<body class="min-h-screen pb-28 selection:bg-emerald-500 selection:text-black">
    <!-- ===== HEADER ===== -->
    <header class="sticky top-0 z-40 bg-[#090d16]/90 backdrop-blur-md border-b border-slate-800 px-4 py-2.5 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <button type="button" onclick="Z.showView('home')" class="flex items-center space-x-2 text-left focus:outline-none group">
                <div class="w-7 h-7 rounded-full bg-gradient-to-tr from-emerald-400 to-blue-500 flex items-center justify-center font-black text-black text-xs shadow-md">Z</div>
                <span class="text-xl font-black tracking-wider bg-gradient-to-r from-emerald-400 via-blue-500 to-indigo-500 bg-clip-text text-transparent group-hover:opacity-90">ZYNIX</span>
            </button>
        </div>
        <div class="flex items-center space-x-2.5">
            <button type="button" onclick="Z.toggleTheme()" class="text-slate-400 hover:text-white transition">
                <i class="fa-solid fa-moon" id="theme-icon"></i>
            </button>
            <button type="button" onclick="Z.showView('notifications')" class="relative text-slate-400 hover:text-white transition">
                <i class="fa-solid fa-bell text-lg"></i>
                <span id="notification-count" class="hidden badge">0</span>
            </button>
            <button type="button" onclick="Z.showView('wallet')" class="bg-slate-900/90 border border-slate-800 hover:border-slate-700 px-3 py-1 rounded-full text-xs flex items-center space-x-2 shadow-inner transition">
                <div class="flex items-center space-x-1"><i class="fa-solid fa-wallet text-emerald-400 text-[10px]"></i><span id="header-cash" class="text-emerald-400 font-bold">$0.00</span></div>
                <span class="text-slate-700">|</span>
                <div class="flex items-center space-x-1"><i class="fa-solid fa-gift text-blue-400 text-[10px]"></i><span id="header-bounty" class="text-blue-400 font-bold">$0.00</span></div>
            </button>
            <div id="header-auth-container"></div>
        </div>
    </header>

    <!-- ===== MAIN ===== -->
    <main id="app-container" class="max-w-xl mx-auto px-3 py-3 min-h-[calc(100vh-120px)] relative"></main>

    <!-- ===== BOTTOM NAV ===== -->
    <nav class="fixed bottom-0 left-0 right-0 z-40 bg-[#090d16]/95 backdrop-blur-lg border-t border-slate-800 px-2 py-2 max-w-xl mx-auto flex items-center justify-between shadow-2xl">
        <button type="button" onclick="Z.showView('home')" id="nav-btn-home" class="flex flex-col items-center justify-center text-slate-400 hover:text-emerald-400 transition w-1/6 py-1">
            <i class="fa-solid fa-house text-base"></i><span class="text-[9px] font-medium mt-0.5">Home</span>
        </button>
        <button type="button" onclick="Z.showView('spark')" id="nav-btn-spark" class="flex flex-col items-center justify-center text-slate-400 hover:text-emerald-400 transition w-1/6 py-1">
            <i class="fa-solid fa-bolt text-base"></i><span class="text-[9px] font-medium mt-0.5">Spark</span>
        </button>
        <button type="button" onclick="Z.openCreateModal()" class="flex items-center justify-center w-10 h-10 bg-gradient-to-tr from-emerald-500 to-blue-600 rounded-full text-black hover:scale-105 transition shadow-lg shadow-emerald-500/20 -mt-2">
            <i class="fa-solid fa-plus text-sm font-black"></i>
        </button>
        <button type="button" onclick="Z.showView('circles')" id="nav-btn-circles" class="flex flex-col items-center justify-center text-slate-400 hover:text-emerald-400 transition w-1/6 py-1">
            <i class="fa-solid fa-circle-nodes text-base"></i><span class="text-[9px] font-medium mt-0.5">Circles</span>
        </button>
        <button type="button" onclick="Z.showView('people')" id="nav-btn-people" class="flex flex-col items-center justify-center text-slate-400 hover:text-emerald-400 transition w-1/6 py-1">
            <i class="fa-solid fa-users text-base"></i><span class="text-[9px] font-medium mt-0.5">People</span>
        </button>
        <button type="button" onclick="Z.showView('profile')" id="nav-btn-profile" class="flex flex-col items-center justify-center text-slate-400 hover:text-emerald-400 transition w-1/6 py-1">
            <i class="fa-solid fa-user text-base"></i><span class="text-[9px] font-medium mt-0.5">Profile</span>
        </button>
    </nav>

    <!-- ===== TOAST ===== -->
    <div id="toast-container" class="fixed bottom-24 left-4 right-4 z-50 flex flex-col items-center space-y-2 pointer-events-none"></div>

    <!-- ===== MODALS ===== -->
    <div id="modal-container"></div>

    <!-- ============================================================ -->
    <!-- ZYNIX APPLICATION - COMPLETE PLATFORM                       -->
    <!-- ============================================================ -->
    <script>
    (function() {
        'use strict';
        
        window.Z = {};
        const Z = window.Z;
        
        // ============================================================
        // 6 REACTION SYSTEM - FIXED (User cannot change)
        // ============================================================
        Z.Reactions = {
            'love': { symbol: '❤️', label: 'Love', reward: 0.05, order: 1 },
            'flower': { symbol: '🌹', label: 'Flower', reward: 0.04, order: 2 },
            'spark': { symbol: '🔥', label: 'Spark', reward: 0.03, order: 3 },
            'clap': { symbol: '👏', label: 'Clap', reward: 0.02, order: 4 },
            'star': { symbol: '⭐', label: 'Star', reward: 0.01, order: 5 },
            'dislike': { symbol: '👎', label: 'Dislike', reward: 0.00, order: 6 }
        };
        
        // ============================================================
        // PACKAGES
        // ============================================================
        Z.Packages = {
            'Free': { name: 'Free', price: 0, dailyLimit: 0, canEarn: false },
            'Starter $3': { name: 'Starter $3', price: 3, dailyLimit: 10, canEarn: true },
            'Growth $10': { name: 'Growth $10', price: 10, dailyLimit: 25, canEarn: true },
            'Creator $20': { name: 'Creator $20', price: 20, dailyLimit: 50, canEarn: true },
            'Pro $40': { name: 'Pro $40', price: 40, dailyLimit: 100, canEarn: true },
            'Enterprise $100': { name: 'Enterprise $100', price: 100, dailyLimit: 500, canEarn: true }
        };
        
        // ============================================================
        // REWARD ENGINE
        // ============================================================
        Z.RewardEngine = {
            split: function(amount) {
                return {
                    cash: Number((amount * 0.60).toFixed(4)),
                    bounty: Number((amount * 0.40).toFixed(4))
                };
            },
            checkDaily: function(user) {
                var today = new Date().toISOString().split('T')[0];
                if (!user.dailyTracker || user.dailyTracker.date !== today) {
                    user.dailyTracker = { date: today, count: 0 };
                }
                var pkg = Z.Packages[user.package || 'Free'] || Z.Packages['Free'];
                return {
                    allowed: user.dailyTracker.count < pkg.dailyLimit,
                    current: user.dailyTracker.count,
                    limit: pkg.dailyLimit
                };
            },
            credit: function(user, amount, reason) {
                if (!user) return false;
                var s = this.split(amount);
                if (!user.wallet) user.wallet = { cash: 0, bounty: 0, total: 0 };
                if (!user.walletTx) user.walletTx = [];
                user.wallet.cash += s.cash;
                user.wallet.bounty += s.bounty;
                user.wallet.total += amount;
                user.walletTx.unshift({
                    id: 'tx_' + Date.now(),
                    date: new Date().toISOString(),
                    type: reason,
                    amount: amount,
                    cash: s.cash,
                    bounty: s.bounty,
                    status: 'Completed'
                });
                Z.DB.saveUsers();
                Z.updateHeader();
                Z.animateReward(amount);
                Z.toast('+$' + amount.toFixed(2) + ' ($' + s.cash.toFixed(3) + ' Cash, $' + s.bounty.toFixed(3) + ' Bounty)');
                return true;
            },
            process: function(ownerId, type, targetId, reactionType) {
                if (!Z.State.currentUser) {
                    Z.openAuthModal('login');
                    Z.toast('Please login first.');
                    return false;
                }
                var actor = Z.DB.getUserById(Z.State.currentUser.id);
                var pkg = Z.Packages[actor.package || 'Free'] || Z.Packages['Free'];
                if (!pkg.canEarn) {
                    Z.toast('Free users cannot earn rewards. Upgrade!');
                    return false;
                }
                var limit = this.checkDaily(actor);
                if (!limit.allowed) {
                    Z.toast('Daily limit reached (' + limit.limit + '/' + limit.limit + ').');
                    return false;
                }
                var owner = Z.DB.getUserById(ownerId);
                if (!owner || owner.id === actor.id) {
                    Z.toast('Invalid action.');
                    return false;
                }
                if (!actor.history) actor.history = {};
                var key = type + '_' + (targetId || ownerId) + '_' + (reactionType || '');
                if (actor.history[key]) {
                    Z.toast('Already rewarded for this action.');
                    return false;
                }
                
                // Get reward amount
                var amount = 0.01;
                if (reactionType && Z.Reactions[reactionType]) {
                    amount = Z.Reactions[reactionType].reward;
                } else {
                    var settings = owner.bountySettings || {};
                    amount = settings[type] || 0.01;
                }
                amount = Math.min(0.05, Math.max(0, amount));
                
                if (!owner.wallet) owner.wallet = { cash: 0, bounty: 0, total: 0 };
                if (owner.wallet.bounty < amount) {
                    Z.toast('Creator bounty insufficient.');
                    return false;
                }
                owner.wallet.bounty -= amount;
                if (!owner.bountySpent) owner.bountySpent = [];
                owner.bountySpent.unshift({
                    id: 'bs_' + Date.now(),
                    date: new Date().toISOString(),
                    recipient: actor.name,
                    action: type + (reactionType ? ' (' + reactionType + ')' : ''),
                    amount: amount
                });
                
                // Update counters
                if (type === 'reaction' || type === 'like') {
                    var post = Z.DB.getPosts().find(function(p) { return p.id === targetId; });
                    if (post) {
                        if (!post.reactions) post.reactions = {};
                        post.reactions[reactionType || 'like'] = (post.reactions[reactionType || 'like'] || 0) + 1;
                        if (!post._reactionUsers) post._reactionUsers = {};
                        post._reactionUsers[actor.id] = reactionType || 'like';
                        Z.DB.savePosts();
                    }
                } else if (type === 'share') {
                    var post2 = Z.DB.getPosts().find(function(p) { return p.id === targetId; });
                    if (post2) {
                        post2.shares = (post2.shares || 0) + 1;
                        Z.DB.savePosts();
                    }
                } else if (type === 'spark_like') {
                    var spark = Z.DB.getSparks().find(function(s) { return s.id === targetId; });
                    if (spark) {
                        spark.likes = (spark.likes || 0) + 1;
                        Z.DB.saveSparks();
                    }
                } else if (type === 'connect') {
                    owner.connections = (owner.connections || 0) + 1;
                    if (!actor.connected) actor.connected = [];
                    if (!actor.connected.includes(owner.id)) actor.connected.push(owner.id);
                } else if (type === 'circleJoin') {
                    var circles = Z.DB.getCircles();
                    var circle = circles.find(function(c) { return c.id === targetId; });
                    if (circle) {
                        circle.members = (circle.members || 0) + 1;
                        Z.DB.saveCircles(circles);
                    }
                } else if (type === 'comment') {
                    // Comment handled separately
                }
                
                actor.history[key] = new Date().toISOString();
                actor.dailyTracker.count++;
                Z.DB.saveUsers();
                this.credit(actor, amount, (type + (reactionType ? ' ' + reactionType : '')).toUpperCase());
                if (['home', 'spark', 'people', 'circles'].includes(Z.State.currentView)) {
                    Z.showView(Z.State.currentView);
                }
                return true;
            }
        };
        
        // ============================================================
        // UI HELPERS
        // ============================================================
        Z.escape = function(str) {
            if (!str) return '';
            return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        };
        Z.safe = Z.escape;
        
        Z.animateReward = function(amount) {
            var el = document.querySelector('header');
            if (el) { el.classList.add('wallet-pulse'); setTimeout(function() { el.classList.remove('wallet-pulse'); }, 500); }
            var note = document.createElement('div');
            note.className = 'fixed z-50 text-emerald-400 font-black text-2xl dollar-note pointer-events-none flex items-center space-x-1';
            note.style.right = '50px';
            note.style.top = '70px';
            note.innerHTML = '<i class="fa-solid fa-money-bill-wave text-emerald-400 drop-shadow-[0_4px_12px_rgba(16,185,129,0.8)]"></i><span class="text-xs font-bold text-emerald-300 drop-shadow">+$' + amount.toFixed(2) + '</span>';
            document.body.appendChild(note);
            setTimeout(function() { note.remove(); }, 1200);
        };
        
        Z.toast = function(msg) {
            var container = document.getElementById('toast-container');
            if (!container) return;
            var toast = document.createElement('div');
            toast.className = 'bg-slate-900/95 border border-emerald-500/40 text-slate-100 px-4 py-2.5 rounded-xl text-xs shadow-2xl flex items-center space-x-2.5 pointer-events-auto transition transform translate-y-4 opacity-0 max-w-md w-full backdrop-blur-md';
            toast.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-400 text-sm shrink-0"></i><span class="font-medium">' + Z.escape(msg) + '</span>';
            container.appendChild(toast);
            setTimeout(function() { toast.classList.remove('translate-y-4', 'opacity-0'); }, 10);
            setTimeout(function() {
                toast.classList.add('opacity-0', 'transition', 'duration-300');
                setTimeout(function() { toast.remove(); }, 300);
            }, 3500);
        };
        
        Z.closeModal = function() {
            document.getElementById('modal-container').innerHTML = '';
        };
        
        Z.updateHeader = function() {
            var user = Z.State.currentUser;
            var cashEl = document.getElementById('header-cash');
            var bountyEl = document.getElementById('header-bounty');
            if (cashEl) cashEl.innerText = '$' + (user && user.wallet ? user.wallet.cash.toFixed(2) : '0.00');
            if (bountyEl) bountyEl.innerText = '$' + (user && user.wallet ? user.wallet.bounty.toFixed(2) : '0.00');
        };
        
        Z.toggleTheme = function() {
            var html = document.documentElement;

        Z.submitSpark = function() {
            var caption = document.getElementById('spark-caption').value.trim();
            var tagsRaw = document.getElementById('spark-tags').value.trim();
            var fileInput = document.getElementById('spark-video-file');
            var url = document.getElementById('spark-video-url').value.trim();

            var tags = tagsRaw ? tagsRaw.split(',').map(function(t) { return t.trim().replace(/^#/, ''); }) : ['zynix'];
            var videoUrl = url || 'https://assets.mixkit.co/videos/preview/mixkit-digital-animation-of-screens-and-code-31910-large.mp4';
            if (fileInput && fileInput.files && fileInput.files[0]) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    var sparks = Z.DB.getSparks();
                    sparks.unshift({
                        id: 'spark_' + Date.now(),
                        authorId: Z.State.currentUser.id,
                        caption: caption,
                        videoUrl: e.target.result,
                        likes: 0,
                        tags: tags,
                        comments: [],
                        shares: 0
                    });
                    Z.DB.saveSparks(sparks);
                    Z.closeModal();
                    Z.toast('Spark published!');
                    Z.showView('spark');
                };
                reader.readAsDataURL(fileInput.files[0]);
            } else {
                var sparks2 = Z.DB.getSparks();
                sparks2.unshift({
                    id: 'spark_' + Date.now(),

        // ============================================================
        // STATUS SYSTEM - WhatsApp Style
        // ============================================================
        var MEDIA_DB = 'ZYNIX_STATUS_MEDIA_V2';
        var MEDIA_STORE = 'media';
        
        function openMediaDB() {
            return new Promise(function(resolve, reject) {
                if (!window.indexedDB) { reject(new Error('IndexedDB unavailable')); return; }
                var req = indexedDB.open(MEDIA_DB, 1);
                req.onupgradeneeded = function(e) {
                    var db = e.target.result;
                    if (!db.objectStoreNames.contains(MEDIA_STORE)) {
                        db.createObjectStore(MEDIA_STORE, { keyPath: 'id' });
                    }
                };
                req.onsuccess = function() { resolve(req.result); };
                req.onerror = function() { reject(req.error); };
            });
        }
        
        Z.storeMedia = async function(file) {
            var db = await openMediaDB();
            return new Promise(function(resolve, reject) {
                var id = 'media_' + Date.now() + '_' + Math.random().toString(36).slice(2);
                var tx = db.transaction(MEDIA_STORE, 'readwrite');
                tx.objectStore(MEDIA_STORE).put({ id: id, blob: file, type: file.type || '', name: file.name || '' });
                tx.oncomplete = function() { db.close(); resolve('idb:' + id); };
                tx.onerror = function() { db.close(); reject(tx.error); };
            });
        };
        
        Z.loadMedia = async function(ref) {
            if (!ref || String(ref).indexOf('idb:') !== 0) return ref || '';
            var id = String(ref).replace(/^idb:/, '');
            try {
                var db = await openMediaDB();
                return await new Promise(function(resolve) {
                    var tx = db.transaction(MEDIA_STORE, 'readonly');
                    var req = tx.objectStore(MEDIA_STORE).get(id);
                    req.onsuccess = function() {
                        var item = req.result;
                        if (!item || !item.blob) { db.close(); resolve(''); return; }
                        var url = URL.createObjectURL(item.blob);
                        db.close();
                        resolve(url);
                    };
                    req.onerror = function() { db.close(); resolve(''); };
                });
            } catch (e) { return ''; }
        };
        
        function _getUsers() { try { return Z.DB.getUsers(); } catch(e) { return []; } }
        function _getStatuses() { try { return Z.DB.getStatuses(); } catch(e) { return []; } }
        function _saveStatuses(arr) { try { Z.DB.saveStatuses(arr); } catch(e) {} }
        function _userById(id) {
            var users = _getUsers();
            for (var i = 0; i < users.length; i++) {
                if (String(users[i].id) === String(id)) return users[i];
            }
            return null;
        }
        function _userName(u) { return u ? (u.name || u.username || 'User') : 'User'; }
        function _userAvatar(u) {
            return u && u.avatar ? u.avatar : 'https://ui-avatars.com/api/?name=' + encodeURIComponent(_userName(u)) + '&background=111827&color=34d399';
        }
        function _currentUser() { return Z.State.currentUser || Z.DB.getCurrentUser() || null; }
        
        function _liveStatuses() {
            var now = Date.now();
            var all = _getStatuses();
            var result = [];
            for (var i = 0; i < all.length; i++) {
                var s = all[i];
                if (!s) continue;
                var expires = Number(s.expiresAt || 0);
                if (expires && expires <= now) continue;
                var created = Number(s.timestamp || 0);
                if (created && now - created > 24 * 60 * 60 * 1000) continue;
                result.push(s);
            }
            result.sort(function(a, b) { return Number(b.timestamp || 0) - Number(a.timestamp || 0); });
            return result;
        }
        
        Z.getStatusContacts = function() {
            var me = _currentUser();
            var users = _getUsers();
            if (!me) return [];
            var ids = Array.isArray(me.connected) ? me.connected.map(String) : [];
            if (!ids.length) {
                var result = [];
                for (var j = 0; j < users.length; j++) {
                    if (String(users[j].id) !== String(me.id)) result.push(users[j]);
                }
                return result;
            }
            var filtered = [];
            for (var k = 0; k < users.length; k++) {
                if (ids.indexOf(String(users[k].id)) !== -1 && String(users[k].id) !== String(me.id)) {
                    filtered.push(users[k]);
                }
            }
            return filtered;
        };
        
        Z.getActiveStatuses = function() {
            var all = _liveStatuses();
            var contacts = Z.getStatusContacts();
            var me = _currentUser();
            var allowed = {};
            for (var i = 0; i < contacts.length; i++) { allowed[String(contacts[i].id)] = true; }
            if (me) allowed[String(me.id)] = true;
            var result = [];
            for (var j = 0; j < all.length; j++) {
                if (allowed[String(all[j].authorId)]) result.push(all[j]);
            }
            return result;
        };

        Z.submitStatus = async function() {
            var textEl = document.getElementById('status-text');
            var text = textEl ? textEl.value.trim() : '';
            var file = _pendingStatusFile;
            if (!text && !file) { Z.toast('Add text or media.'); return; }
            var me = _currentUser();
            if (!me) return;
            var media = '';
            var mediaType = '';
            if (file) {
                try {
                    media = await Z.storeMedia(file);
                    mediaType = file.type.indexOf('video/') === 0 ? 'video' : 'image';
                } catch (e) {
                    try {
                        media = await new Promise(function(resolve, reject) {
                            var reader = new FileReader();
                            reader.onload = function() { resolve(String(reader.result || '')); };
                            reader.onerror = reject;
                            reader.readAsDataURL(file);
                        });
                        mediaType = file.type.indexOf('video/') === 0 ? 'video' : 'image';
                    } catch (err) { Z.toast('Could not read media.'); return; }
                }
            }
            var now = Date.now();
            var current = _liveStatuses();
            var newStatus = {
                id: 'st_' + now + '_' + Math.random().toString(36).slice(2),
                type: 'status',
                authorId: me.id,
                content: text || '',
                media: media || '',
                mediaType: mediaType || '',
                timestamp: now,
                createdAt: new Date(now).toISOString(),
                expiresAt: now + 24 * 60 * 60 * 1000,
                viewedBy: []
            };
            current.unshift(newStatus);
            _saveStatuses(current);
            _pendingStatusFile = null;
            Z.closeModal();
            Z.toast('Status published for 24 hours.');
            Z.showView('home');

        // ============================================================
        // STATUS VIEWER
        // ============================================================
        var _viewerAuthorId = '';
        var _viewerIndex = 0;
        var _viewerStatuses = [];
        var _viewerTimer = null;
        
        Z.openStatusViewer = function(authorId, index) {
            var all = Z.getActiveStatuses();
            _viewerStatuses = all.filter(function(s) { return String(s.authorId) === String(authorId); });
            _viewerStatuses.sort(function(a, b) { return Number(b.timestamp || 0) - Number(a.timestamp || 0); });
            if (!_viewerStatuses.length) { Z.toast('No active statuses.'); return; }
            var me = _currentUser();
            if (me) {
                for (var i = 0; i < _viewerStatuses.length; i++) {
                    if (!_viewerStatuses[i].viewedBy) _viewerStatuses[i].viewedBy = [];
                    if (_viewerStatuses[i].viewedBy.indexOf(me.id) === -1) {
                        _viewerStatuses[i].viewedBy.push(me.id);
                    }
                }
                _saveStatuses(_getStatuses());
            }
            _viewerAuthorId = String(authorId);
            _viewerIndex = Math.max(0, Math.min(Number(index || 0), _viewerStatuses.length - 1));
            Z.showStatusViewer();
        };
        
        Z.showStatusViewer = function() {
            var status = _viewerStatuses[_viewerIndex];

            var author = _userById(status.authorId);
            if (!author) { Z.showView('home'); return; }
            var app = document.getElementById('app-container');
            if (!app) return;
            
            var mediaContent = '';
            if (status.media) {
                mediaContent = '<div id="viewer-media-loader" class="w-full h-full flex items-center justify-center bg-black"><div class="text-slate-500 text-xs">Loading...</div></div>';
            }
            
            var allContacts = Z.getActiveStatuses();
            var contactMap = {};
            for (var i = 0; i < allContacts.length; i++) {
                var s = allContacts[i];
                var id = String(s.authorId);
                if (!contactMap[id]) contactMap[id] = [];
                contactMap[id].push(s);
            }
            var contactKeys = Object.keys(contactMap);
            var otherHTML = '';
            for (var j = 0; j < contactKeys.length; j++) {
                var key = contactKeys[j];
                var u = _userById(key);
                if (u && key !== String(_viewerAuthorId)) {
                    otherHTML += '<button type="button" onclick="Z.openStatusViewer(\'' + Z.escape(key) + '\', 0)" class="text-center"><div class="w-12 h-12 mx-auto rounded-full bg-slate-800 p-[2px]"><img src="' + Z.escape(_userAvatar(u)) + '" class="w-full h-full rounded-full object-cover"></div><div class="mt-1 text-[9px] text-slate-400 truncate">' + Z.escape(_userName(u)) + '</div></button>';
                }
            }
            
            var total = _viewerStatuses.length;
            var current = _viewerIndex + 1;
            
            var contentHTML = '';
            if (status.media) {
                contentHTML = '<div data-status-stage id="viewer-stage"><div id="viewer-media-content" class="w-full h-full flex items-center justify-center bg-black"><div class="text-slate-500 text-xs">Loading media...</div></div></div>';
                if (status.content) {
                    contentHTML += '<div class="w-full px-5 py-4 text-center flex items-center justify-center bg-[#111827]"><div class="text-white text-base sm:text-xl font-semibold leading-relaxed whitespace-pre-wrap break-words max-w-2xl">' + Z.escape(status.content) + '</div></div>';
                }
            } else {
                contentHTML = '<div data-status-stage><div class="text-status">' + Z.escape(status.content || 'No content') + '</div></div>';
            }
            
            app.innerHTML = '<div id="status-viewer-page" class="fixed inset-0 z-[200] bg-black/95 text-white flex flex-col">' +
                '<div class="flex items-center justify-between px-4 py-3 border-b border-slate-800/50">' +
                    '<button type="button" onclick="Z.closeStatusViewer()" class="text-white/70 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>' +
                    '<div class="flex items-center gap-3"><img src="' + Z.escape(_userAvatar(author)) + '" class="w-8 h-8 rounded-full object-cover"><div><div class="font-bold text-sm">' + Z.escape(_userName(author)) + '</div><div class="text-[10px] text-white/50">' + current + ' / ' + total + '</div></div></div>' +
                    '<div></div>' +
                '</div>' +
                '<div class="flex-1 flex items-center justify-center relative">' + contentHTML +
                    '<button type="button" onclick="Z.statusPrev()" class="absolute left-2 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-black/50 flex items-center justify-center hover:bg-white/20 transition"><i class="fa-solid fa-chevron-left"></i></button>' +
                    '<button type="button" onclick="Z.statusNext()" class="absolute right-2 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-black/50 flex items-center justify-center hover:bg-white/20 transition"><i class="fa-solid fa-chevron-right"></i></button>' +
                '</div>' +
                '<div class="px-4 py-3 border-t border-slate-800/50"><div class="flex items-center gap-3 overflow-x-auto" style="scrollbar-width:none;">' +
                    '<span class="text-[10px] text-white/50 shrink-0">Contacts</span>' + otherHTML +
                '</div></div>' +
                '<div class="px-4 py-2 text-center text-[9px] text-white/30">Tap to pause • Swipe to navigate</div>' +
            '</div>';
            
            if (status.media) { Z.loadStatusMedia(status); }
            if (status.mediaType !== 'video') { Z.startStatusTimer(); }
            Z.setupStatusTouch();

        Z.loadStatusMedia = async function(status) {
            var container = document.getElementById('viewer-media-content');
            if (!container) return;
            if (!status.media) { container.innerHTML = '<div class="text-slate-500 text-xs">No media</div>'; return; }
            var url = await Z.loadMedia(status.media);
            if (!url) { container.innerHTML = '<div class="text-slate-500 text-xs">Media unavailable</div>'; return; }
            if (status.mediaType === 'video') {
                container.innerHTML = '<video src="' + Z.escape(url) + '" controls autoplay playsinline class="w-full h-full object-contain bg-black"></video>';
                var video = container.querySelector('video');
                if (video) { video.addEventListener('ended', function() { Z.statusNext(); }); }
                Z.clearStatusTimer();
            } else {
                container.innerHTML = '<img src="' + Z.escape(url) + '" class="w-full h-full object-contain bg-black" alt="Status">';
            }
        };
        
        Z.startStatusTimer = function() {
            Z.clearStatusTimer();
            _viewerTimer = setTimeout(function() { Z.statusNext(); }, 7000);
        };
        
        Z.clearStatusTimer = function() {
            if (_viewerTimer) { clearTimeout(_viewerTimer); _viewerTimer = null; }
        };
        
        Z.setupStatusTouch = function() {
            var stage = document.getElementById('viewer-stage');
            if (!stage) return;
            var paused = false;
            stage.addEventListener('pointerdown', function(e) {
                if (e.target.closest('button') || e.target.closest('video')) return;
                paused = true;
                Z.clearStatusTimer();
                Z.toast('Paused');
            });
            stage.addEventListener('pointerup', function(e) {
                if (!paused) return;
                paused = false;
                var status = _viewerStatuses[_viewerIndex];
                if (status && status.mediaType !== 'video') { Z.startStatusTimer(); }
                Z.toast('Resumed');
            });
            stage.addEventListener('pointerleave', function(e) {
                if (!paused) return;
                paused = false;
                var status = _viewerStatuses[_viewerIndex];
                if (status && status.mediaType !== 'video') { Z.startStatusTimer(); }
            });
            var touchX = 0;
            stage.addEventListener('touchstart', function(e) { touchX = e.touches[0].clientX; }, { passive: true });
            stage.addEventListener('touchend', function(e) {
                var diff = touchX - e.changedTouches[0].clientX;
                if (Math.abs(diff) > 50) {
                    if (diff > 0) { Z.advanceToNextContact(); }
                    else { Z.advanceToPrevContact(); }
                }
            }, { passive: true });
        };
        
        Z.advanceToNextContact = function() {
            var all = Z.getActiveStatuses();
            var map = {};
            for (var i = 0; i < all.length; i++) {
                var id = String(all[i].authorId);
                if (!map[id]) map[id] = [];
                map[id].push(all[i]);
            }
            var keys = Object.keys(map);
            if (keys.length <= 1) { Z.toast('No more contacts.'); return; }
            var idx = keys.indexOf(String(_viewerAuthorId));
            var next = (idx + 1) % keys.length;
            Z.openStatusViewer(keys[next], 0);
        };
        
        Z.advanceToPrevContact = function() {
            var all = Z.getActiveStatuses();
            var map = {};
            for (var i = 0; i < all.length; i++) {
                var id = String(all[i].authorId);
                if (!map[id]) map[id] = [];
                map[id].push(all[i]);
            }
            var keys = Object.keys(map);
            if (keys.length <= 1) { Z.toast('No more contacts.'); return; }
            var idx = keys.indexOf(String(_viewerAuthorId));
            var prev = (idx - 1 + keys.length) % keys.length;
            Z.openStatusViewer(keys[prev], 0);
        };
        
        Z.statusPrev = function() {
            Z.clearStatusTimer();
            if (_viewerIndex > 0) { _viewerIndex--; Z.showStatusViewer(); }
            else { Z.advanceToPrevContact(); }
        };
        
        Z.statusNext = function() {
            Z.clearStatusTimer();
            if (_viewerIndex < _viewerStatuses.length - 1) { _viewerIndex++; Z.showStatusViewer(); }
            else { Z.advanceToNextContact(); }
        };
        
        Z.closeStatusViewer = function() {
            Z.clearStatusTimer();
            var viewer = document.getElementById('status-viewer-page');
            if (viewer) viewer.remove();
            Z.showView('home');
        };
        
        // ============================================================
        // HELPERS
        // ============================================================
        function _getAuthor(id) {
            var users = _getUsers();
            for (var i = 0; i < users.length; i++) {

            setTimeout(function() { var el = document.getElementById('inline-post-content'); if (el) el.focus(); }, 0);

        Z.previewInlineFile = function(input) {
            var f = input && input.files && input.files[0];
            if (!f) return;
            if (f.size > 15 * 1024 * 1024) { Z.toast('Media under 15 MB.'); input.value = ''; return; }
            var n = document.getElementById('inline-post-file-name');
            if (n) n.textContent = f.name;
        };
        
        Z.submitInlinePost = function() {
            var u = _currentUser();
            if (!u) { Z.openAuthModal('login'); return; }
            var c = (document.getElementById('inline-post-content')?.value || '').trim();
            var file = document.getElementById('inline-post-file')?.files?.[0];
            var link = (document.getElementById('inline-post-link')?.value || '').trim();
            if (!c && !file && !link) { Z.toast('Write something or attach media.'); return; }
            var finish = function(media) {
                var ps = Z.DB.getPosts();
                ps.unshift({
                    id: 'post_' + Date.now(),
                    authorId: u.id,
                    content: c || '',
                    media: media || '',
                    createdAt: new Date().toISOString(),
                    reactions: {},
                    _reactionUsers: {},
                    comments: [],
                    shares: 0
                });
                Z.DB.savePosts(ps);
                Z.toast('Post published!');
                Z.showView('home');
            };
            if (file) {
                var reader = new FileReader();
                reader.onload = function(e) { finish(e.target.result); };
                reader.readAsDataURL(file);
            } else { finish(link); }
        };
        
        // ============================================================
        // REACTIONS
        // ============================================================
        Z.reactToPost = function(postId, reactionType) {
            var actor = _currentUser();
            if (!actor) { Z.openAuthModal('login'); return; }
            var ps = Z.DB.getPosts();
            var p = null;
            for (var i = 0; i < ps.length; i++) {
                if (ps[i] && ps[i].id === postId) { p = ps[i]; break; }
            }
            if (!p) return;
            p.reactions = p.reactions || {};
            p._reactionUsers = p._reactionUsers || {};
            
            // Remove old reaction if exists
            var oldReact = p._reactionUsers[actor.id];
            if (oldReact && p.reactions[oldReact]) {
                p.reactions[oldReact] = Math.max(0, Number(p.reactions[oldReact] || 0) - 1);
                delete p._reactionUsers[actor.id];
            }
            
            // Add new reaction (if not dislike or if dislike, just remove)
            if (reactionType !== 'dislike') {
                p.reactions[reactionType] = Number(p.reactions[reactionType] || 0) + 1;
                p._reactionUsers[actor.id] = reactionType;
            }
            Z.DB.savePosts(ps);
            
            // Process reward
            var reward = Z.Reactions[reactionType];
            if (reward && reward.reward > 0) {
                Z.RewardEngine.process(p.authorId, 'reaction', p.id, reactionType);
            } else {
                Z.toast('Reaction added!');
                Z.showView('home');
            }
        };
        
        Z.toggleComments = function(postId) {
            var el = document.getElementById('comments-' + postId);
            if (el) el.classList.toggle('hidden');
        };
        
        Z.togglePostOptions = function(postId) {
            var el = document.getElementById('post-options-' + postId);
            if (el) el.classList.toggle('hidden');
        };
        
        Z.addComment = function(postId) {
            var u = _currentUser();
            if (!u) { Z.openAuthModal('login'); return; }
            var el = document.getElementById('comment-input-' + postId);
            var text = (el?.value || '').trim();
            if (!text) return;
            var ps = Z.DB.getPosts();
            var p = null;
            for (var i = 0; i < ps.length; i++) {
                if (ps[i] && ps[i].id === postId) { p = ps[i]; break; }
            }
            if (!p) return;
            p.comments = Array.isArray(p.comments) ? p.comments : [];
            p.comments.push({ id: 'c_' + Date.now(), authorId: u.id, author: u.name, text: text, time: new Date().toISOString() });
            Z.DB.savePosts(ps);
            Z.RewardEngine.process(p.authorId, 'comment', p.id);
            Z.showView('home');
        };
        
        // ============================================================
        // SHARE - COMPLETE SOCIAL MEDIA
        // ============================================================
        Z.sharePost = function(postId) {
            var ps = Z.DB.getPosts();
            var p = null;
            for (var i = 0; i < ps.length; i++) {
                if (ps[i] && ps[i].id === postId) { p = ps[i]; break; }
            }
            if (!p) return;
            var url = location.href.split('#')[0] + '#post-' + encodeURIComponent(postId);
            var title = 'Check this post on ZYNIX!';
            
            var modal = document.getElementById('modal-container');
            if (!modal) return;
            modal.innerHTML = '<div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4"><div class="bg-[#111827] border border-slate-800 rounded-2xl w-full max-w-md p-6 space-y-4 shadow-2xl"><div class="flex justify-between items-center border-b border-slate-800 pb-3"><h3 class="font-bold text-base text-white">Share</h3><button type="button" onclick="Z.closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button></div><div class="grid grid-cols-4 gap-3"><button onclick="Z.shareTo(\'whatsapp\',\'' + Z.escape(url) + '\',\'' + Z.escape(title) + '\',\'' + Z.escape(postId) + '\')" class="share-app share-app-whatsapp"><i class="fa-brands fa-whatsapp text-2xl"></i><span>WhatsApp</span></button><button onclick="Z.shareTo(\'facebook\',\'' + Z.escape(url) + '\',\'' + Z.escape(title) + '\',\'' + Z.escape(postId) + '\')" class="share-app share-app-facebook"><i class="fa-brands fa-facebook text-2xl"></i><span>Facebook</span></button><button onclick="Z.shareTo(\'instagram\',\'' + Z.escape(url) + '\',\'' + Z.escape(title) + '\',\'' + Z.escape(postId) + '\')" class="share-app share-app-instagram"><i class="fa-brands fa-instagram text-2xl"></i><span>Instagram</span></button><button onclick="Z.shareTo(\'tiktok\',\'' + Z.escape(url) + '\',\'' + Z.escape(title) + '\',\'' + Z.escape(postId) + '\')" class="share-app share-app-tiktok"><i class="fa-brands fa-tiktok text-2xl"></i><span>TikTok</span></button><button onclick="Z.shareTo(\'twitter\',\'' + Z.escape(url) + '\',\'' + Z.escape(title) + '\',\'' + Z.escape(postId) + '\')" class="share-app share-app-twitter"><i class="fa-brands fa-x-twitter text-2xl"></i><span>Twitter/X</span></button><button onclick="Z.shareTo(\'youtube\',\'' + Z.escape(url) + '\',\'' + Z.escape(title) + '\',\'' + Z.escape(postId) + '\')" class="share-app share-app-youtube"><i class="fa-brands fa-youtube text-2xl"></i><span>YouTube</span></button><button onclick="Z.shareTo(\'google\',\'' + Z.escape(url) + '\',\'' + Z.escape(title) + '\',\'' + Z.escape(postId) + '\')" class="share-app share-app-google"><i class="fa-brands fa-google-drive text-2xl"></i><span>Drive</span></button><button onclick="Z.shareTo(\'copy\',\'' + Z.escape(url) + '\',\'' + Z.escape(title) + '\',\'' + Z.escape(postId) + '\')" class="share-app share-app-copy"><i class="fa-solid fa-copy text-2xl"></i><span>Copy Link</span></button></div><div class="pt-2 border-t border-slate-800"><label class="block text-[10px] text-slate-400 mb-1">Share as:</label><div class="flex gap-2"><button class="bg-emerald-500/20 text-emerald-400 px-3 py-1 rounded-full text-[10px] font-bold">Public</button><button class="bg-slate-800 text-slate-300 px-3 py-1 rounded-full text-[10px]">Connections</button><button class="bg-slate-800 text-slate-300 px-3 py-1 rounded-full text-[10px]">Private</button></div></div></div></div>';
        };
        
        Z.shareTo = function(platform, url, title, postId) {
            Z.closeModal();
            var shareUrl = url;
            switch(platform) {
                case 'whatsapp': shareUrl = 'https://wa.me/?text=' + encodeURIComponent(title + ' ' + url); break;
                case 'facebook': shareUrl = 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(url); break;
                case 'instagram': Z.toast('Copy link and share on Instagram!'); break;
                case 'tiktok': Z.toast('Copy link and share on TikTok!'); break;
                case 'twitter': shareUrl = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(title) + '&url=' + encodeURIComponent(url); break;
                case 'youtube': Z.toast('Copy link and share on YouTube!'); break;
                case 'google': Z.toast('Save to Google Drive!'); break;
                case 'copy':
                    navigator.clipboard.writeText(url).then(function() {
                        Z.toast('Link copied to clipboard!');
                    });
                    break;
            }
            if (shareUrl && platform !== 'copy') {
                window.open(shareUrl, '_blank');
            }
            // Update share count
            var ps = Z.DB.getPosts();
            var p = null;
            for (var i = 0; i < ps.length; i++) {
                if (ps[i] && ps[i].id === postId) { p = ps[i]; break; }
            }
            if (p) {
                p.shares = Number(p.shares || 0) + 1;
                Z.DB.savePosts(ps);
                if (p.authorId) Z.RewardEngine.process(p.authorId, 'share', p.id);
            }
        };

        // ============================================================
        // SPARK VIEW
        // ============================================================
        Z.renderSpark = function() {
            var sparks = Z.DB.getSparks();
            var tagFilter = (Z.State.sparkTagFilter || '').toLowerCase();
            var filtered = [];
            for (var i = 0; i < sparks.length; i++) {
                var s = sparks[i];
                if (!tagFilter) { filtered.push(s); continue; }
                var match = false;
                if (s.tags) {
                    for (var t = 0; t < s.tags.length; t++) {
                        if (s.tags[t].toLowerCase().indexOf(tagFilter) !== -1) { match = true; break; }
                    }
                }
                if (match) filtered.push(s);
            }
            var html = '';
            for (var j = 0; j < filtered.length; j++) {
                var spark = filtered[j];
                var a = _getAuthor(spark.authorId);
                var isFullVideo = spark.type === 'fullvideo';
                var titleHtml = isFullVideo ? '<div class="font-bold text-sm text-white">' + Z.escape(spark.title || '') + '</div>' : '';
                var descHtml = isFullVideo && spark.description ? '<p class="text-[10px] text-slate-400">' + Z.escape(spark.description) + '</p>' : '';
                var tagsHtml = '';
                if (spark.tags) {
                    for (var k = 0; k < spark.tags.length; k++) {
                        tagsHtml += '<button type="button" onclick="Z.State.sparkTagFilter=\'' + Z.escape(spark.tags[k]) + '\'; Z.showView(\'spark\');" class="text-emerald-400 font-semibold hover:underline mr-1">#' + Z.escape(spark.tags[k]) + '</button>';

        // ============================================================
        // PEOPLE VIEW - Connect
        // ============================================================

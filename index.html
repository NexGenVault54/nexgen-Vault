<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ZYNIX - Complete Social Platform</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#090d16;color:#f8fafc;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding-bottom:80px;overflow-x:hidden}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:#090d16}
::-webkit-scrollbar-thumb{background:#1e293b;border-radius:4px}

.zynix-header{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(9,13,22,.92);backdrop-filter:blur(12px);border-bottom:1px solid #1e293b;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;min-height:56px}
.header-logo{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#10b981,#3b82f6);display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;font-size:14px}
.header-title{font-size:18px;font-weight:900;background:linear-gradient(90deg,#10b981,#3b82f6,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
.header-btn{background:transparent;border:none;color:#94a3b8;cursor:pointer;padding:6px}
.header-btn:hover{color:#fff}
.wallet-pill{background:rgba(15,23,42,.9);border:1px solid #1e293b;border-radius:20px;padding:4px 10px;font-size:10px;display:flex;align-items:center;gap:6px;transition:box-shadow .3s}
.wallet-pill.pulse{box-shadow:0 0 24px rgba(16,185,129,.6)}

.zynix-footer{position:fixed;bottom:0;left:0;right:0;z-index:1000;background:rgba(9,13,22,.95);backdrop-filter:blur(12px);border-top:1px solid #1e293b;padding:8px 0;display:flex;align-items:center;justify-content:space-around;max-width:600px;margin:0 auto}
.zynix-footer button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 0;color:#64748b;transition:color .2s;background:transparent;border:none;font-size:9px;cursor:pointer;font-weight:500}
.zynix-footer button i{font-size:18px;margin-bottom:2px}
.zynix-footer button:hover,.zynix-footer button.active{color:#10b981}
.zynix-footer .create-btn{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#10b981,#3b82f6);color:#000;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:-16px;box-shadow:0 4px 20px rgba(16,185,129,.3);flex:none}
.zynix-footer .create-btn i{font-size:20px;margin:0}

#app-container{max-width:600px;margin:0 auto;padding:76px 14px 20px;min-height:calc(100vh - 80px)}

.status-row-wrap{background:#111827;border:1px solid #1e293b;border-radius:16px;padding:12px;margin-bottom:14px}
.status-scroll{display:flex;gap:10px;overflow-x:auto;padding:4px 0;scrollbar-width:none;-ms-overflow-style:none}
.status-scroll::-webkit-scrollbar{display:none}
.status-item{flex-shrink:0;width:68px;text-align:center;background:transparent;border:none;cursor:pointer;padding:0}
.status-ring-unseen{background:linear-gradient(135deg,#10b981,#3b82f6,#8b5cf6);padding:3px;border-radius:50%;width:58px;height:58px;margin:0 auto}
.status-ring-seen{background:#1e293b;padding:3px;border-radius:50%;width:58px;height:58px;margin:0 auto}
.status-ring-inner{width:100%;height:100%;border-radius:50%;background:#090d16;padding:2px}
.status-ring-inner img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.status-label{font-size:9px;font-weight:600;color:#94a3b8;display:block;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}

.status-home-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:8px 0}
.status-home-card{text-align:center;background:transparent;border:none;cursor:pointer;padding:8px 4px;border-radius:12px}
.status-home-card:hover{background:#111827}
.status-home-ring-unseen{background:linear-gradient(135deg,#10b981,#3b82f6,#8b5cf6);padding:4px;border-radius:50%;width:88px;height:88px;margin:0 auto}
.status-home-ring-seen{background:#1e293b;padding:4px;border-radius:50%;width:88px;height:88px;margin:0 auto}
.status-home-ring-inner{width:100%;height:100%;border-radius:50%;background:#090d16;padding:3px}
.status-home-ring-inner img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.status-home-name{font-size:11px;font-weight:600;color:#e2e8f0;display:block;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status-home-count{font-size:9px;color:#64748b;display:block;margin-top:2px}

.status-bg-deep-blue{background:linear-gradient(135deg,#1e3a8a,#312e81);color:#fff}
.status-bg-navy{background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff}
.status-bg-purple{background:linear-gradient(135deg,#4c1d95,#5b21b6);color:#fff}
.status-bg-teal{background:linear-gradient(135deg,#0d9488,#0f766e);color:#fff}
.status-bg-green{background:linear-gradient(135deg,#065f46,#047857);color:#fff}
.status-bg-burgundy{background:linear-gradient(135deg,#7f1d1d,#991b1b);color:#fff}
.status-bg-rose{background:linear-gradient(135deg,#9f1239,#be123c);color:#fff}
.status-bg-plum{background:linear-gradient(135deg,#581c87,#701a75);color:#fff}
.status-bg-slate{background:linear-gradient(135deg,#334155,#475569);color:#fff}

.status-viewer-overlay{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.98);display:flex;flex-direction:column;color:#fff}
.status-viewer-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.05);flex-shrink:0}
.status-viewer-body{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0;overflow:hidden;touch-action:none}
.status-stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#000;height:clamp(320px,58vh,620px);position:relative;border-radius:12px;overflow:hidden}
.status-stage img,.status-stage video{width:100%;height:100%;object-fit:contain;max-width:100%;max-height:100%}
.status-nav-btn{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1);color:#fff;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;z-index:10}
.status-nav-btn.left{left:10px}
.status-nav-btn.right{right:10px}
.status-viewer-footer{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid rgba(255,255,255,.05);flex-shrink:0;height:68px}
.status-viewer-footer button{padding:8px 20px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#fff;font-size:12px;cursor:pointer;font-weight:600}
.status-progress-bar{position:absolute;top:0;left:0;height:3px;background:#10b981;z-index:20;transition:width .1s linear}
.status-progress-track{position:absolute;top:0;left:0;right:0;height:3px;background:rgba(255,255,255,.1);z-index:19}

.circle-x-btn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.colored-back-btn{background:#10b981;color:#000;border:none;padding:8px 16px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}

.post-card{background:#111827;border:1px solid #1e293b;border-radius:16px;padding:14px;margin-bottom:12px}
.post-author{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.post-author img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:1px solid #1e293b}
.post-author .pname{font-weight:700;font-size:13px;color:#fff}
.post-author .phandle{font-size:10px;color:#64748b}
.post-content{font-size:13px;color:#e2e8f0;line-height:1.6;margin-bottom:10px;white-space:pre-wrap;word-break:break-word}
.post-media{border-radius:12px;overflow:hidden;margin-bottom:10px;background:#000}
.post-media img{width:100%;max-height:400px;object-fit:cover;display:block}
.post-media video{width:100%;max-height:400px;object-fit:contain;display:block;background:#000}
.post-reactions{display:flex;flex-wrap:wrap;gap:4px;padding:8px 0;border-top:1px solid #1e293b;align-items:center}
.react-btn{padding:4px 8px;border-radius:14px;font-size:14px;background:transparent;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:3px;color:#fff;transition:all .15s}
.react-btn:hover{background:#1e293b}
.react-btn.active{background:rgba(16,185,129,.15);border-color:rgba(16,185,129,.3);cursor:not-allowed}
.react-btn .count{font-size:10px;color:#64748b;font-weight:700;line-height:1}
.react-btn.active .count{color:#10b981}
.react-btn .bounty{font-size:9px;color:#10b981;font-weight:700;line-height:1;margin-left:1px}
.react-btn.disabled{cursor:not-allowed;opacity:.85}
.react-star{filter:drop-shadow(0 0 6px rgba(96,165,250,.9)) drop-shadow(0 0 12px rgba(147,197,253,.5))}
.post-actions{display:flex;gap:16px;padding-top:8px;border-top:1px solid #1e293b;font-size:12px;color:#64748b}
.post-actions button{background:transparent;border:none;color:#64748b;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:4px;padding:4px 0}
.post-actions button:hover{color:#e2e8f0}
.post-actions button.saved{color:#f59e0b}

/* Silver shiny lock — post reactions end + Spark column top */
.silver-lock{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#e5e7eb,#9ca3af,#f3f4f6,#6b7280);box-shadow:0 0 6px rgba(255,255,255,.5),inset 0 1px 2px rgba(255,255,255,.8);flex-shrink:0;margin-left:auto;cursor:pointer;border:1px solid rgba(255,255,255,.4)}
.silver-lock i{color:#1f2937;font-size:11px;text-shadow:0 1px 0 rgba(255,255,255,.6)}
.silver-lock.unlocked{background:linear-gradient(135deg,#fef3c7,#f59e0b,#fbbf24,#d97706)}
.silver-lock.unlocked i{color:#7c2d12}
.silver-lock-lg{width:32px;height:32px}
.silver-lock-lg i{font-size:14px}

.post-comments{margin-top:10px;padding-top:10px;border-top:1px solid #1e293b;display:none}
.post-comments.open{display:block}
.comment-item{padding:10px 12px;border-radius:12px;margin-bottom:6px;font-size:12px;word-break:break-word;position:relative}
.comment-item.light-green{background:#dcfce7;color:#052e16}
.comment-item.light-blue{background:#dbeafe;color:#172554}
.comment-item.light-yellow{background:#fef3c7;color:#451a03}
.comment-item.light-pink{background:#fce7f3;color:#500724}
.comment-item.light-purple{background:#ede9fe;color:#2e1065}
.comment-item.hidden-comment{opacity:.5;font-style:italic}
.comment-item .cname{font-weight:700;margin-right:6px;opacity:.9}
.comment-item .ctext{white-space:pre-wrap}
.comment-reactions{display:flex;flex-wrap:wrap;gap:2px;margin-top:6px;align-items:center}
.comment-react{background:rgba(0,0,0,.06);border:none;padding:2px 6px;border-radius:10px;font-size:11px;cursor:pointer;display:inline-flex;align-items:center;gap:2px;color:inherit;opacity:.75}
.comment-react:hover{opacity:1}
.comment-react.active{background:rgba(16,185,129,.25);opacity:1;font-weight:700;cursor:not-allowed}
.comment-react .cb{font-size:8px;color:#059669;font-weight:700}
.comment-actions{display:flex;gap:12px;margin-top:4px;font-size:10px;opacity:.75;align-items:center;flex-wrap:wrap}
.comment-actions button{background:transparent;border:none;color:inherit;cursor:pointer;font-size:10px;padding:0;font-weight:600;text-decoration:underline;opacity:.85}
.comment-actions button:hover{opacity:1}
.comment-replies{margin-top:6px;padding-left:10px;border-left:2px solid rgba(0,0,0,.15)}
.comment-replies .comment-item{padding:8px 10px;font-size:11px;margin-bottom:6px}
.comment-color-picker{display:flex;gap:6px;margin-top:6px;margin-bottom:4px}
.comment-color-dot{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.comment-color-dot.selected{border-color:#10b981}
.comment-color-dot.c-green{background:#dcfce7}
.comment-color-dot.c-blue{background:#dbeafe}
.comment-color-dot.c-yellow{background:#fef3c7}
.comment-color-dot.c-pink{background:#fce7f3}
.comment-color-dot.c-purple{background:#ede9fe}
.comment-input-wrap{display:flex;gap:8px;margin-top:8px;align-items:flex-end}
.comment-input-wrap textarea{flex:1;background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:10px 12px;font-size:12px;color:#fff;outline:none;resize:none;max-height:150px;font-family:inherit;min-height:38px}
.comment-input-wrap textarea:focus{border-color:#10b981}
.comment-input-wrap button{background:#10b981;border:none;color:#000;font-weight:700;padding:8px 16px;border-radius:8px;font-size:11px;cursor:pointer;height:38px}

/* Inline reply editor */
.reply-editor{margin-top:6px;display:flex;gap:6px;align-items:flex-end}
.reply-editor textarea{flex:1;background:rgba(15,23,42,.9);border:1px solid #1e293b;border-radius:8px;padding:8px 10px;font-size:11px;color:#fff;outline:none;resize:none;max-height:100px;font-family:inherit;min-height:34px}
.reply-editor textarea:focus{border-color:#10b981}
.reply-editor button{padding:8px 12px;border-radius:8px;border:none;font-size:11px;font-weight:700;cursor:pointer;height:34px}
.reply-editor .save{background:#10b981;color:#000}
.reply-editor .cancel{background:transparent;color:#64748b}

.modal-overlay{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:#111827;border:1px solid #1e293b;border-radius:16px;max-width:440px;width:100%;max-height:90vh;overflow-y:auto;padding:20px}
.modal-header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1e293b;padding-bottom:12px;margin-bottom:16px}
.modal-header h3{font-size:16px;font-weight:700;color:#fff}
.modal-close{width:36px;height:36px;border-radius:50%;background:#1e293b;border:none;color:#94a3b8;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.form-label{display:block;font-size:11px;font-weight:600;color:#64748b;margin-bottom:4px}
.form-input,.form-select,.form-textarea{width:100%;background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:10px 12px;font-size:12px;color:#fff;outline:none;margin-bottom:12px;font-family:inherit}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:#10b981}
.form-textarea{min-height:90px;resize:vertical}
.btn-primary{width:100%;background:#10b981;border:none;color:#000;font-weight:700;padding:12px;border-radius:10px;font-size:13px;cursor:pointer}
.btn-secondary{width:100%;background:#1e293b;border:none;color:#fff;font-weight:600;padding:10px;border-radius:8px;font-size:12px;cursor:pointer;margin-top:8px}

.media-preview-box{margin-top:8px;border-radius:10px;overflow:hidden;border:1px solid #1e293b;background:#0f172a;position:relative;display:none}
.media-preview-box.show{display:block}
.media-preview-box img,.media-preview-box video{width:100%;max-height:240px;object-fit:contain;display:block;background:#000}
.media-preview-remove{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.85);color:#fff;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.15)}

.share-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.share-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:10px;background:#0f172a;border:1px solid #1e293b;cursor:pointer;font-size:9px;color:#94a3b8}
.share-item:hover{border-color:#10b981;background:#111827}
.share-item i{font-size:20px}
.share-item.wa i{color:#25D366}
.share-item.fb i{color:#1877F2}
.share-item.ig i{color:#E4405F}
.share-item.tt i{color:#fff}
.share-item.tw i{color:#fff}
.share-item.yt i{color:#FF0000}
.share-item.gd i{color:#4285F4}
.share-item.cp i{color:#10b981}

.spark-feed-container{position:fixed;top:56px;left:0;right:0;bottom:80px;max-width:600px;margin:0 auto;overflow-y:scroll;overflow-x:hidden;scroll-snap-type:y mandatory;scrollbar-width:none;-ms-overflow-style:none;background:#000;touch-action:pan-y;z-index:50}
.spark-feed-container::-webkit-scrollbar{display:none}
.spark-slide{position:relative;width:100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}
.spark-slide video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.spark-top-gradient{position:absolute;top:0;left:0;right:0;height:100px;background:linear-gradient(to bottom,rgba(0,0,0,.7),transparent);pointer-events:none;z-index:2}
.spark-bottom-gradient{position:absolute;bottom:0;left:0;right:0;height:200px;background:linear-gradient(to top,rgba(0,0,0,.85),transparent);pointer-events:none;z-index:2}
.spark-info{position:absolute;bottom:16px;left:12px;right:100px;z-index:3;color:#fff}
.spark-info-author{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.spark-info-author img{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid #fff}
.spark-info-author .sname{font-weight:700;font-size:13px}
.spark-info-author .shandle{font-size:10px;color:#cbd5e1}
.spark-info-caption{font-size:12px;line-height:1.4;color:#f1f5f9;margin-bottom:6px;max-height:80px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.spark-info-tags{font-size:10px;color:#10b981;font-weight:600}
.spark-info-tags button{background:transparent;border:none;color:#10b981;font-weight:600;font-size:10px;cursor:pointer;margin-right:4px}
.spark-actions-stack{position:absolute;right:8px;bottom:16px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:3}
.spark-action-btn{display:flex;flex-direction:column;align-items:center;gap:2px;background:transparent;border:none;cursor:pointer;color:#fff;font-size:10px;padding:4px}
.spark-action-icon{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;font-size:20px;border:1px solid rgba(255,255,255,.15)}
.spark-action-count{font-size:10px;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.spark-action-reactions{display:flex;flex-direction:column;gap:5px;padding:5px;background:rgba(0,0,0,.4);backdrop-filter:blur(8px);border-radius:24px;border:1px solid rgba(255,255,255,.1)}
.spark-reaction-icon{width:38px;height:38px;border-radius:50%;background:transparent;border:none;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;position:relative;color:#fff;font-weight:700}
.spark-reaction-icon.active{background:rgba(16,185,129,.3);cursor:not-allowed}
.spark-reaction-icon .rcount{font-size:9px;color:#10b981;font-weight:700;margin-left:1px}
.spark-reaction-icon .bounty-label{font-size:7px;color:#10b981;font-weight:700;position:absolute;bottom:-4px;right:-6px;background:rgba(0,0,0,.75);border-radius:6px;padding:1px 3px}

.bottom-sheet{position:fixed;left:0;right:0;bottom:0;z-index:10001;background:#111827;border-top-left-radius:20px;border-top-right-radius:20px;border-top:1px solid #1e293b;max-height:70vh;display:flex;flex-direction:column;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:40px;height:4px;background:#334155;border-radius:2px;margin:8px auto 0}
.sheet-header{padding:12px 16px;border-bottom:1px solid #1e293b;display:flex;align-items:center;justify-content:space-between}
.sheet-body{padding:12px 16px;overflow-y:auto;flex:1}
.sheet-footer{padding:12px 16px;border-top:1px solid #1e293b;display:flex;gap:8px}

.circle-card{background:#111827;border:1px solid #1e293b;border-radius:16px;padding:14px;margin-bottom:10px}
.circle-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.circle-head-left{display:flex;align-items:center;gap:10px}
.circle-head-left img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:1px solid #1e293b}
.circle-name{font-weight:700;font-size:13px;color:#fff}
.circle-meta{font-size:10px;color:#64748b}
.circle-type-badge{font-size:9px;font-weight:600;padding:2px 8px;border-radius:12px}
.type-social{background:rgba(16,185,129,.15);color:#10b981}
.type-services{background:rgba(59,130,246,.15);color:#3b82f6}
.type-goods{background:rgba(139,92,246,.15);color:#8b5cf6}

// MEDIA — Upload to Supabase Storage
// ============================================================
var MEDIA_DB = 'zynix_media_v1';
var MEDIA_STORE = 'media';
var _dbPromise = null;
function openMediaDB(){
  if(_dbPromise) return _dbPromise;
  _dbPromise = new Promise(function(resolve,reject){
    if(!window.indexedDB){ reject(new Error('No IDB')); return; }
    var req = indexedDB.open(MEDIA_DB,1);
    req.onupgradeneeded = function(e){
      var db = e.target.result;
      if(!db.objectStoreNames.contains(MEDIA_STORE)){
        db.createObjectStore(MEDIA_STORE,{keyPath:'id'});
      }
    };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  });
  return _dbPromise;
}

Z.storeMedia = async function(file){
  try {
    var c = sb();
    var me = Z.State.currentUser;
    if(c && me && file){
      var ext = 'bin';
      if(file.name && file.name.indexOf('.') > -1) ext = file.name.split('.').pop().toLowerCase();
      else if(file.type){
        var mm = { 'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif',
                   'video/mp4':'mp4','video/webm':'webm','video/quicktime':'mov','video/3gpp':'3gp' };
        ext = mm[file.type] || 'bin';
      }
      var path = me.id + '/upload/' + Date.now() + '_' + Math.random().toString(36).slice(2,8) + '.' + ext;
      var up = await c.storage.from('media').upload(path, file, {
        cacheControl: '31536000', upsert: false,
        contentType: file.type || 'application/octet-stream'
      });
      if(!up.error){
        var pub = c.storage.from('media').getPublicUrl(path);
        var url = (pub && pub.data && pub.data.publicUrl) || null;
        if(url) return url;
      }
    }
  } catch(e){ console.warn('storeMedia storage error', e); }

  try {
    var db = await openMediaDB();
    var id = 'm_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
    return new Promise(function(resolve,reject){
      var tx = db.transaction(MEDIA_STORE,'readwrite');
      tx.objectStore(MEDIA_STORE).put({id:id, blob:file, type:file.type||'', name:file.name||'', ts:Date.now()});
      tx.oncomplete = function(){ resolve('idb:'+id); };
      tx.onerror = function(){ reject(tx.error); };
    });
  } catch(e){
    return new Promise(function(resolve,reject){
      var r = new FileReader();
      r.onload = function(){ resolve(String(r.result||'')); };
      r.onerror = reject;
      r.readAsDataURL(file);
    });
  }
};

Z.loadMedia = async function(ref){
  if(!ref) return '';
  ref = String(ref);
  if(ref.indexOf('idb:') !== 0) return ref;
  var id = ref.slice(4);
  try {
    var db = await openMediaDB();
    return new Promise(function(resolve){
      var tx = db.transaction(MEDIA_STORE,'readonly');
      var req = tx.objectStore(MEDIA_STORE).get(id);
      req.onsuccess = function(){
        var item = req.result;
        if(!item||!item.blob){ resolve(''); return; }
        resolve(URL.createObjectURL(item.blob));
      };
      req.onerror = function(){ resolve(''); };
    });
  } catch(e){ return ''; }
};

Z.handleAuth = async function(mode){
  var email = ((document.getElementById('auth-email')||{}).value || '').trim();

  if(btn){ btn.disabled = true; btn.textContent = 'Please wait...'; }
  var c = sb();
  if(!c){ if(btn){ btn.disabled = false; btn.textContent = mode==='login'?'Login':'Sign Up'; } Z.toast('Supabase not ready.'); return; }
  try {
    if(mode === 'login'){
      var r = await c.auth.signInWithPassword({email: email, password: pass});
      if(r.error) throw r.error;
      Z.toast('Logged in!');
    } else {
      var name = ((document.getElementById('auth-name')||{}).value || 'New User').trim() || 'New User';
      var ref = ((document.getElementById('auth-refcode')||{}).value || '').trim();
      var refId = null;
      if(ref){
        var pr = await c.from('profiles').select('id').eq('referral_code', ref.toUpperCase()).maybeSingle();
        if(pr.data) refId = pr.data.id;
      }
      var sr = await c.auth.signUp({email: email, password: pass, options:{data:{name: name, referred_by: refId}}});
      if(sr.error) throw sr.error;
      Z.toast('Account created!');
    }
    Z.closeModal();
    await Z.refreshSession();
    await Z.reloadData();
    Z.showView('home');
  } catch(e){
    console.warn('auth error', e);
    Z.toast(e.message || 'Authentication failed.');
  } finally {
    if(btn){ btn.disabled = false; btn.textContent = mode==='login'?'Login':'Sign Up'; }
  }
};

<script>
(function(){
'use strict';
var Z = window.Z;
if(!Z){ console.error('Z missing'); return; }

function _cu(){ return Z.State.currentUser; }
function _p(id){ return Z.getProfileById(id); }

function _timeAgo(ts){
  var d = Date.now() - (ts||0);
  var m = Math.floor(d/60000);
  if(m < 1) return 'just now';
  if(m < 60) return m+'m ago';
  var h = Math.floor(m/60);
  if(h < 24) return h+'h ago';
  return Math.floor(h/24)+'d ago';
}

function RK(){ return ['love','flower','spark','clap','star','dislike']; }

// ============================================================
// SOFT REFRESH
// ============================================================
Z.softRefresh = function(){
  var container = document.getElementById('app-container');
  if(!container) return;
  var savedY = window.scrollY;
  var view = Z.State.currentView;
  // preserve open comment panels
  var openComments = {};
  document.querySelectorAll('.post-comments.open').forEach(function(el){
    if(el.id) openComments[el.id] = true;
  });
  try { container.innerHTML = Z.renderView(view); } catch(e){ console.error('softRefresh', e); }
  if(view === 'home'){
    Z.renderStatusRow();
    setTimeout(function(){ Z.setupFeedVideoAutoplay(); }, 80);
  }
  // restore open comment panels
  Object.keys(openComments).forEach(function(id){
    var el = document.getElementById(id);
    if(el) el.classList.add('open');
  });
  requestAnimationFrame(function(){
    requestAnimationFrame(function(){ window.scrollTo(0, savedY); });
  });
  Z.updateHeader();
};

Z.pauseAllBackgroundVideos = function(){
  document.querySelectorAll('video').forEach(function(v){ try { v.pause(); } catch(e){} });
};

// ============================================================
// PHASE 1 — CONNECTION STATE MACHINE (unchanged)
// ============================================================
Z.getConnectionState = function(otherId){
  var me = _cu();
  if(!me) return 'guest';
  if(!otherId || me.id === otherId) return 'self';
  var list = Z.State.allConnections || [];
  for(var i=0;i<list.length;i++){
    var c = list[i];
    var pairOk = (c.requester_id === me.id && c.recipient_id === otherId)
              || (c.requester_id === otherId && c.recipient_id === me.id);
    if(!pairOk) continue;
    if(c.status === 'accepted') return 'connected';
    if(c.status === 'pending'){ return c.requester_id === me.id ? 'connecting_out' : 'connecting_in'; }
  }
  return 'none';
};

Z.getConnectBounty = function(profile){
  if(!profile) return 0;
  var bs = profile.bounty_settings || {};
  var v = bs.connect;
  if(v == null) return 0;
  return Number(v) || 0;
};

Z.renderConnectButton = function(otherId){
  var other = _p(otherId);
  if(!other) return '';
  var state = Z.getConnectionState(otherId);
  var bounty = Z.getConnectBounty(other);
  var bountyTag = '<span class="bounty-tag">$' + bounty.toFixed(2) + '</span>';
  if(state === 'guest') return '<button class="connect-btn" onclick="Z.openAuthModal(\'login\')">Connect ' + bountyTag + '</button>';
  if(state === 'self') return '<span style="font-size:10px;color:#64748b;padding:4px 12px;background:#0f172a;border-radius:8px;">You</span>';
  if(state === 'connected') return '<button class="connect-btn connected">Connected ' + bountyTag + '</button>';
  if(state === 'connecting_out') return '<button class="connect-btn connecting">Connecting ' + bountyTag + '</button>';
  if(state === 'connecting_in'){
    var req = null;
    var me = _cu();
    (Z.State.allConnections||[]).forEach(function(c){
      if(c.requester_id === otherId && c.recipient_id === me.id && c.status === 'pending') req = c;
    });
    if(!req) return '<button class="connect-btn" onclick="Z.sendConnectRequest(\'' + Z.escape(otherId) + '\')">Connect ' + bountyTag + '</button>';
    return '<div class="connect-actions">' +
      '<button class="approve" onclick="Z.acceptConnection(\'' + Z.escape(req.id) + '\')">Accept</button>' +
      '<button class="reject" onclick="Z.rejectConnection(\'' + Z.escape(req.id) + '\')">Reject</button></div>';
  }
  return '<button class="connect-btn" onclick="Z.sendConnectRequest(\'' + Z.escape(otherId) + '\')">Connect ' + bountyTag + '</button>';
};

Z.sendConnectRequest = async function(userId){
  var me = _cu(); if(!me){ Z.openAuthModal('login'); return; }
  if(me.id === userId){ Z.toast('Cannot connect to yourself.'); return; }
  try {
    await Z.DB.sendConnectRequest(userId);
    Z.toast('Connection request sent.');
    await Z.reloadData(); Z.softRefresh();
  } catch(e){
    var msg = e && e.message ? e.message : 'Could not send request.';
    if(msg.indexOf('Already connected') !== -1) Z.toast('Already connected.');
    else if(msg.indexOf('pending') !== -1) Z.toast('Request already pending.');
    else if(msg.indexOf('yourself') !== -1) Z.toast('Cannot connect to yourself.');
    else Z.toast(msg);
  }
};

Z.acceptConnection = async function(requestId){
  try {
    await Z.DB.acceptConnectionRequest(requestId);
    Z.toast('Connected!');
    await Z.reloadData(); Z.softRefresh();
  } catch(e){ Z.toast(e && e.message ? e.message : 'Could not accept.'); }
};

Z.rejectConnection = async function(requestId){
  try {
    await Z.DB.rejectConnectionRequest(requestId);
    Z.toast('Request rejected.');
    await Z.reloadData(); Z.softRefresh();
  } catch(e){ Z.toast(e && e.message ? e.message : 'Could not reject.'); }
};

Z.connectTo = function(userId){ Z.sendConnectRequest(userId); };

// ============================================================
// PHASE 2 — Reaction helpers
// Reactions are PERMANENT: once given, cannot be removed/changed.
// User can give MULTIPLE different reactions to the same content.
// ============================================================
Z.renderReactionButton = function(contentType, contentId, reactionKey, myReactions, counts, isOwnContent, ownerLocked){
  var r = Z.Reactions[reactionKey];
  var cnt = (counts && counts[reactionKey]) || 0;
  var act = !!(myReactions && myReactions[reactionKey]);
  var cssClass = r.cssClass ? ' class="' + r.cssClass + '"' : '';
  var onclick = act ? '' : (contentType === 'post' ? 'Z.reactToPost(\'' + contentId + '\',\'' + reactionKey + '\')'
              : contentType === 'spark' ? 'Z.sparkReact(\'' + contentId + '\',\'' + reactionKey + '\')'
              : 'Z.reactToComment(\'' + contentId + '\',\'' + reactionKey + '\')');
  var locked = ownerLocked || isOwnContent;
  return '<button class="react-btn ' + (act?'active':'') + (locked?' disabled':'') + '"' +
    (onclick ? ' onclick="' + onclick + '"' : '') +
    ' title="' + r.label + ' $' + r.reward.toFixed(2) + (act ? ' (already given)' : '') + '">' +
    '<span' + cssClass + '>' + r.symbol + '</span>' +
    '<span class="count">' + cnt + '</span>' +
    '<span class="bounty">$' + r.reward.toFixed(2) + '</span>' +
    '</button>';
};

Z.renderLockIcon = function(isLocked, size, onclickFn){
  var cls = 'silver-lock' + (size === 'lg' ? ' silver-lock-lg' : '') + (isLocked ? '' : ' unlocked');
  var icon = isLocked ? 'fa-lock' : 'fa-lock-open';
  var onclick = onclickFn ? ' onclick="' + onclickFn + '"' : '';
  var title = isLocked ? 'Earning locked' : 'Earning unlocked';
  return '<button class="' + cls + '" title="' + title + '"' + onclick + '><i class="fa-solid ' + icon + '"></i></button>';
};

function _liveStatuses(){
  var now = Date.now();
  return (Z.State.allStatuses||[]).filter(function(s){
    if(!s) return false;
    var exp = new Date(s.expires_at||0).getTime();
    return !(exp && exp <= now);
  }).sort(function(a,b){ return new Date(b.created_at||0) - new Date(a.created_at||0); });
}
Z.getStatusContacts = function(){
  var me = _cu(); if(!me) return [];
  return (Z.State.allProfiles||[]).filter(function(p){ return p.id !== me.id; });
};
Z.getActiveStatuses = function(){
  var live = _liveStatuses();
  var contacts = Z.getStatusContacts().map(function(p){ return p.id; });
  var me = _cu();
  var allowed = {};
  contacts.forEach(function(id){ allowed[id] = true; });
  if(me) allowed[me.id] = true;
  return live.filter(function(s){ return allowed[s.author_id]; });
};
Z.getStatusContactList = function(){
  var all = Z.getActiveStatuses();
  var grouped = {};
  all.forEach(function(s){ if(!grouped[s.author_id]) grouped[s.author_id]=[]; grouped[s.author_id].push(s); });
  var me = _cu();
  var entries = [];
  if(me && grouped[me.id]) entries.push({user: _p(me.id), statuses: grouped[me.id], isSelf: true});
  Object.keys(grouped).forEach(function(uid){
    if(me && uid === me.id) return;
    var u = _p(uid);
    if(u) entries.push({user: u, statuses: grouped[uid], isSelf: false});
  });
  entries.sort(function(a,b){
    if(a.isSelf) return -1;
    if(b.isSelf) return 1;
    return new Date(b.statuses[0].created_at||0) - new Date(a.statuses[0].created_at||0);
  });
  return entries;
};

Z.selectStatusBg = function(bg){
  Z.State.statusBg = bg;
  var w = document.getElementById('status-preview-wrap');
  if(w){ Z.STATUS_BGS.forEach(function(b){ w.classList.remove(b); }); w.classList.add(bg); }
  document.querySelectorAll('.status-bg-swatch').forEach(function(s){
    s.style.borderColor = s.getAttribute('data-bg') === bg ? '#10b981' : 'transparent';
  });
};

Z.previewStatusFile = function(input){
  var f = input && input.files && input.files[0]; if(!f) return;
  if(f.size > 100*1024*1024){ Z.toast('Media under 100 MB.'); input.value=''; return; }
  var box = document.getElementById('status-preview'); if(!box) return;
  var url = URL.createObjectURL(f);
  box.innerHTML = (f.type.indexOf('video/')===0
    ? '<video src="' + url + '" controls muted style="width:100%;max-height:220px;object-fit:contain;background:#000;"></video>'
    : '<img src="' + url + '" style="width:100%;max-height:220px;object-fit:contain;background:#000;">') +
    '<button class="media-preview-remove" onclick="Z.removePendingStatusFile()"><i class="fa-solid fa-xmark"></i></button>';
  box.classList.add('show');
};

Z.removePendingStatusFile = function(){
  var i = document.getElementById('status-file'); if(i) i.value='';
  var p = document.getElementById('status-preview'); if(p){ p.innerHTML=''; p.classList.remove('show'); }
};

Z.submitStatus = async function(){
  var me = _cu(); if(!me) return;
  var text = ((document.getElementById('status-text')||{}).value||'').trim();
  var fi = document.getElementById('status-file');
  var hasFile = fi && fi.files && fi.files[0];
  if(!text && !hasFile){ Z.toast('Add text or media.'); return; }
  var mr = '', mt = '';
  if(hasFile){
    Z.toast('Uploading...');
    mr = await Z.storeMedia(fi.files[0]);
    mt = fi.files[0].type.indexOf('video/')===0 ? 'video' : 'image';
  }
  var now = new Date();
  var exp = new Date(now.getTime() + 24*60*60*1000);
  var row = await Z.DB.createStatus({
    author_id: me.id, content: text, media_url: mr||null, media_type: mt||null,
    background: Z.State.statusBg || 'status-bg-deep-blue', expires_at: exp.toISOString()
  });
  if(!row){ Z.toast('Save failed.'); return; }
  Z.closeModal();
  Z.toast('Status published for 24 hours.');
  Z.showView('home');
};

Z.openStatusViewer = async function(authorId, index){
  var ex = document.getElementById('status-viewer'); if(ex) ex.remove();
  Z.pauseAllBackgroundVideos();
  var all = Z.getActiveStatuses();
  Z.State.viewerStatuses = all.filter(function(s){ return s.author_id === authorId; });
  Z.State.viewerStatuses.sort(function(a,b){ return new Date(b.created_at||0) - new Date(a.created_at||0); });
  if(!Z.State.viewerStatuses.length){ Z.toast('No statuses.'); return; }
  var me = _cu();
  if(me){
    for(var i=0;i<Z.State.viewerStatuses.length;i++){
      var s = Z.State.viewerStatuses[i];
      s._viewedByMe = true;
      Z.DB.markStatusViewed(s.id, me.id).catch(function(){});
    }
  }
  Z.State.viewerAuthorId = String(authorId);
  Z.State.viewerIndex = Math.max(0, Math.min(Number(index||0), Z.State.viewerStatuses.length-1));
  Z.showStatusViewer();
};

Z.showStatusViewer = function(){
  var old = document.getElementById('status-viewer'); if(old) old.remove();
  var status = Z.State.viewerStatuses[Z.State.viewerIndex];
  if(!status){ Z.closeStatusViewer(); return; }
  var author = _p(status.author_id);
  if(!author){ Z.closeStatusViewer(); return; }
  var isVid = status.media_type === 'video';
  var stage = '';
  if(status.media_url){
    stage = '<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:#000;color:#64748b;font-size:12px;">Loading...</div>';
  } else {
    var bg = status.background || 'status-bg-deep-blue';
    stage = '<div class="' + bg + '" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:32px;">' +
      '<div style="font-size:clamp(1.4rem,5vw,2.4rem);font-weight:700;text-align:center;line-height:1.6;overflow-y:auto;max-height:100%;width:100%;word-break:break-word;">' + Z.escape(status.content||'') + '</div></div>';
  }
  var total = Z.State.viewerStatuses.length;
  var cur = Z.State.viewerIndex + 1;
  document.body.insertAdjacentHTML('beforeend',
    '<div class="status-viewer-overlay" id="status-viewer">' +
    '<div class="status-progress-track"><div class="status-progress-bar" id="status-progress" style="width:0%;"></div></div>' +
    '<div class="status-viewer-header">' +
    '<button class="circle-x-btn" onclick="event.stopPropagation();Z.closeStatusViewer();return false;"><i class="fa-solid fa-xmark"></i></button>' +
    '<div style="display:flex;align-items:center;gap:8px;">' +
    '<img src="' + Z.escape(Z.displayAvatar(author)) + '" style="width:34px;height:34px;border-radius:50%;object-fit:cover;">' +
    '<div><div style="font-weight:700;font-size:13px;">' + Z.escape(Z.displayName(author)) + '</div>' +
    '<div style="font-size:10px;color:#94a3b8;">' + cur + ' / ' + total + ' • ' + _timeAgo(new Date(status.created_at).getTime()) + '</div></div></div>' +
    '<div style="width:38px;"></div></div>' +
    '<div class="status-viewer-body" id="status-viewer-body">' +
    '<div class="status-stage" id="status-stage">' + stage + '</div>' +
    '<button onclick="event.stopPropagation();Z.statusPrev();return false;" class="status-nav-btn left"><i class="fa-solid fa-chevron-left"></i></button>' +
    '<button onclick="event.stopPropagation();Z.statusNext();return false;" class="status-nav-btn right"><i class="fa-solid fa-chevron-right"></i></button></div>' +
    '<div class="status-viewer-footer">' +
    '<button onclick="event.stopPropagation();Z.statusPrev();return false;">‹ Prev</button>' +
    '<span style="font-size:10px;color:#64748b;">24h Status</span>' +
    '<button onclick="event.stopPropagation();Z.statusNext();return false;">Next ›</button></div></div>'
  );
  if(status.media_url){
    var st = document.getElementById('status-stage');
    Z.loadMedia(status.media_url).then(function(url){
      if(!url){ st.innerHTML = '<div style="color:#64748b;font-size:12px;padding:20px;">Media unavailable</div>'; return; }
      if(isVid){
        st.innerHTML = '<video src="' + Z.escape(url) + '" controls autoplay playsinline style="width:100%;height:100%;object-fit:contain;background:#000;"></video>';
        var v = st.querySelector('video');
        if(v){
          Z.clearStatusTimer();
          v.addEventListener('timeupdate', function(){
            if(v.duration){ var b = document.getElementById('status-progress'); if(b) b.style.width = ((v.currentTime/v.duration)*100)+'%'; }
          });
          v.addEventListener('ended', function(){ Z.statusNext(); });
        }
      } else {
        st.innerHTML = '<img src="' + Z.escape(url) + '" style="width:100%;height:100%;object-fit:contain;background:#000;" alt="Status">';
      }
    });
  }
  if(!isVid) Z.startStatusTimer();
  Z.setupViewerGesture();
};

Z.startStatusTimer = function(){
  Z.clearStatusTimer();
  Z.State.viewerPaused = false; Z.State.viewerDuration = 7000;
  Z.State.viewerElapsed = 0; Z.State.viewerStartTime = Date.now();
  Z.State.viewerTimer = setTimeout(function(){ Z.statusNext(); }, Z.State.viewerDuration);
  Z.State.viewerProgressInterval = setInterval(function(){
    if(Z.State.viewerPaused) return;
    Z.State.viewerElapsed = Date.now() - Z.State.viewerStartTime;
    var pct = Math.min(100, (Z.State.viewerElapsed/Z.State.viewerDuration)*100);
    var b = document.getElementById('status-progress'); if(b) b.style.width = pct + '%';
  }, 100);
};
Z.pauseStatusTimer = function(){
  if(Z.State.viewerPaused) return;
  Z.State.viewerPaused = true;
  if(Z.State.viewerTimer){ clearTimeout(Z.State.viewerTimer); Z.State.viewerTimer = null; }
  if(Z.State.viewerProgressInterval){ clearInterval(Z.State.viewerProgressInterval); Z.State.viewerProgressInterval = null; }
};
Z.resumeStatusTimer = function(){
  if(!Z.State.viewerPaused) return;
  var st = Z.State.viewerStatuses[Z.State.viewerIndex];
  if(st && st.media_type === 'video') return;
  Z.State.viewerPaused = false;
  var rem = Z.State.viewerDuration - Z.State.viewerElapsed;
  Z.State.viewerStartTime = Date.now() - Z.State.viewerElapsed;
  Z.State.viewerTimer = setTimeout(function(){ Z.statusNext(); }, Math.max(100, rem));
  Z.State.viewerProgressInterval = setInterval(function(){
    if(Z.State.viewerPaused) return;
    Z.State.viewerElapsed = Date.now() - Z.State.viewerStartTime;
    var pct = Math.min(100, (Z.State.viewerElapsed/Z.State.viewerDuration)*100);
    var b = document.getElementById('status-progress'); if(b) b.style.width = pct + '%';
  }, 100);
};
Z.clearStatusTimer = function(){
  if(Z.State.viewerTimer){ clearTimeout(Z.State.viewerTimer); Z.State.viewerTimer = null; }
  if(Z.State.viewerProgressInterval){ clearInterval(Z.State.viewerProgressInterval); Z.State.viewerProgressInterval = null; }
};
Z.setupViewerGesture = function(){
  var body = document.getElementById('status-viewer-body'); if(!body) return;
  var sx=0, sy=0, st=0, moved=false, holding=false, holdTimer=null;
  var SWIPE=55, TAP=14, TAPTIME=350, HOLDMS=250;
  function _start(x,y){
    sx=x; sy=y; st=Date.now(); moved=false; holding=false;
    if(holdTimer){ clearTimeout(holdTimer); holdTimer=null; }
    holdTimer = setTimeout(function(){ holding = true; Z.pauseStatusTimer(); }, HOLDMS);
  }
  function _move(x,y){ if(Math.abs(x-sx)>TAP || Math.abs(y-sy)>TAP){ moved = true; if(holdTimer){ clearTimeout(holdTimer); holdTimer=null; } } }
  function _end(x,y){
    if(holdTimer){ clearTimeout(holdTimer); holdTimer=null; }
    var dx=x-sx, dy=y-sy, el=Date.now()-st, ax=Math.abs(dx), ay=Math.abs(dy);
    if(holding){ holding=false; Z.resumeStatusTimer(); return; }
    if(ax>SWIPE && ax>ay*1.15){ if(dx<0) Z.statusNext(); else Z.statusPrev(); return; }
    if(ay>SWIPE && ay>ax*1.15){ if(dy<0) Z.advanceToNextContact(); else Z.advanceToPrevContact(); return; }
    if(!moved && el<TAPTIME){ Z.statusNext(); return; }
    Z.resumeStatusTimer();
  }
  body.addEventListener('touchstart', function(ev){
    if(ev.touches.length!==1) return;
    if(ev.target.closest('button')||ev.target.closest('video')) return;
    _start(ev.touches[0].clientX, ev.touches[0].clientY);
  }, {passive:true});
  body.addEventListener('touchmove', function(ev){
    if(ev.touches.length!==1) return;
    _move(ev.touches[0].clientX, ev.touches[0].clientY);
  }, {passive:true});
  body.addEventListener('touchend', function(ev){
    if(!ev.changedTouches.length) return;
    if(ev.target.closest('button')||ev.target.closest('video')) return;
    _end(ev.changedTouches[0].clientX, ev.changedTouches[0].clientY);
  }, {passive:true});
  var dn=false;
  body.addEventListener('mousedown', function(ev){
    if(ev.target.closest('button') || ev.target.closest('video')) return;
    dn=true; _start(ev.clientX, ev.clientY);
  });
  body.addEventListener('mousemove', function(ev){ if(!dn) return; _move(ev.clientX, ev.clientY); });
  body.addEventListener('mouseup', function(ev){
    if(!dn) return; dn=false;
    if(ev.target.closest('button') || ev.target.closest('video')) return;
    _end(ev.clientX, ev.clientY);
  });
  body.addEventListener('mouseleave', function(){ if(dn){ dn=false; Z.resumeStatusTimer(); } });
};

Z._sparkAudioUnlocked = false;

Z.setupSparkFeed = function(sparks){
  var feed = document.getElementById('spark-feed'); if(!feed) return;
  var slides = feed.querySelectorAll('.spark-slide'); if(!slides.length) return;
  if(!Z._sparkUnmuteHooked){
    Z._sparkUnmuteHooked = true;
    var unlockAudio = function(){
      Z._sparkAudioUnlocked = true;
      var feedEl = document.getElementById('spark-feed'); if(!feedEl) return;
      feedEl.querySelectorAll('video').forEach(function(v){
        if(!v.paused){ try { v.muted = false; v.volume = 1; } catch(e){} }
      });
    };
    document.addEventListener('touchstart', unlockAudio, {passive:true});
    document.addEventListener('click', unlockAudio, true);
    document.addEventListener('keydown', unlockAudio, true);
  }
  if(Z.State.sparkObserver) Z.State.sparkObserver.disconnect();
  Z.State.sparkObserver = new IntersectionObserver(function(){
    var vids = feed.querySelectorAll('video');
    var vh = window.innerHeight, best = null, bestRatio = 0;
    vids.forEach(function(v){
      var r = v.getBoundingClientRect();
      var visible = Math.max(0, Math.min(vh, r.bottom) - Math.max(0, r.top));
      var ratio = r.height > 0 ? visible / r.height : 0;
      if(ratio > bestRatio){ bestRatio = ratio; best = v; }
    });
    vids.forEach(function(v){
      if(v === best && bestRatio >= 0.75){
        if(Z._sparkAudioUnlocked){ v.muted = false; v.volume = 1; }
        var pr = v.play();
        if(pr && pr.catch) pr.catch(function(){ v.muted = true; v.play().catch(function(){}); });
        var sid = v.getAttribute('data-spark-id');
        if(sid) Z.recordSparkView(sid);
      } else { if(!v.paused){ try { v.pause(); } catch(e){} } }
    });
  }, {threshold:[0, 0.25, 0.5, 0.75, 0.9, 1.0]});
  slides.forEach(function(sl){ Z.State.sparkObserver.observe(sl); });
  var sY = 0;
  feed.addEventListener('touchstart', function(e){ sY = e.touches[0].clientY; }, {passive:true});
  feed.addEventListener('touchend', function(e){
    var dy = sY - e.changedTouches[0].clientY;
    if(Math.abs(dy) > 80){
      var allSlides = feed.querySelectorAll('.spark-slide');
      var idx = 0, mx = 0, h = feed.clientHeight;
      allSlides.forEach(function(s, i){
        var r = s.getBoundingClientRect();
        var vis = Math.max(0, Math.min(r.bottom, window.innerHeight) - Math.max(r.top, 56));
        var ratio = vis / h;
        if(ratio > mx){ mx = ratio; idx = i; }
      });
      if(dy > 0 && idx < allSlides.length-1) allSlides[idx+1].scrollIntoView({behavior:'smooth', block:'start'});
      else if(dy < 0 && idx > 0) allSlides[idx-1].scrollIntoView({behavior:'smooth', block:'start'});
    }
  }, {passive:true});
};

Z.recordSparkView = function(sparkId){
  var arr = Z.State.allSparks || [];
  for(var i=0;i<arr.length;i++){

      var me = _cu();
      var vid = me ? me.id : 'anon_' + (sessionStorage.getItem('anon_id')||(function(){var x='a_'+Date.now(); sessionStorage.setItem('anon_id',x); return x;})());

        Z.DB.updateSpark(sparkId, {views: arr[i].views}).catch(function(){});

      break;
    }
  }
};

Z.sparkReact = async function(sparkId, reactionType){
  var me = _cu(); if(!me){ Z.openAuthModal('login'); return; }
  var c = Z.sb(); if(!c) return;
  var spark = (Z.State.allSparks||[]).find(function(x){ return x.id === sparkId; });
  if(!spark) return;
  if(spark.author_id === me.id){ Z.toast('Cannot react to your own Spark.'); return; }
  if(!spark._myReactions) spark._myReactions = {};
  if(spark._myReactions[reactionType]){ Z.toast('Already reacted.'); return; }

  // Insert (unique constraint will reject if duplicate)
  var ins = await c.from('spark_reactions').insert({spark_id: sparkId, user_id: me.id, reaction: reactionType});
  if(ins.error){
    if(ins.error.code === '23505'){ Z.toast('Already reacted.'); }
    else { Z.toast('Failed.'); }
    return;
  }

  spark._myReactions[reactionType] = true;
  spark._reactions = spark._reactions || {};
  spark._reactions[reactionType] = (spark._reactions[reactionType]||0) + 1;
  Z.softRefresh();
  setTimeout(function(){ Z.setupSparkFeed(Z.State.allSparks); }, 50);

  var reward = await Z.DB.awardReactionBounty('spark', sparkId, reactionType);
  if(reward > 0){
    Z.animateDollar(reward);
    await Z.refreshSession();
    Z.updateHeader();
  }
};

Z.renderComment = function(cm, post, profiles, isReply){
  profiles = profiles || Z.State.allProfiles || [];
  var me = _cu();
  var ca = profiles.find(function(x){ return x.id === cm.author_id; }) || {name:'User'};
  var isMyComment = me && me.id === cm.author_id;
  var isMyPost = me && post && me.id === post.author_id;
  var counts = cm._reactionCounts || {};
  var myR = cm._myReactions || {};
  var ownerLocked = !!(ca.reactions_locked);

  var rr = '';
  RK().forEach(function(k){
    var r = Z.Reactions[k];
    var cnt = counts[k] || 0;
    var act = !!myR[k];
    var cssClass = r.cssClass ? ' class="' + r.cssClass + '"' : '';
    var onclick = act ? '' : ' onclick="Z.reactToComment(\'' + Z.escape(cm.id) + '\',\'' + k + '\')"';
    rr += '<button class="comment-react ' + (act?'active':'') + '"' + onclick + ' title="' + r.label + '">' +
      '<span' + cssClass + '>' + r.symbol + '</span>' +
      (cnt > 0 ? '<span>' + cnt + '</span>' : '') +
      '<span class="cb">$' + r.reward.toFixed(2) + '</span></button>';
  });

  var actions = '<div class="comment-actions">';
  actions += '<button onclick="Z.openInlineReply(\'' + Z.escape(post.id) + '\',\'' + Z.escape(cm.id) + '\')">Reply</button>';
  if(isMyComment){
    actions += '<button onclick="Z.deleteComment(\'' + Z.escape(cm.id) + '\',\'' + Z.escape(post.id) + '\')">Delete</button>';
  } else if(isMyPost){
    actions += '<button onclick="Z.hideComment(\'' + Z.escape(cm.id) + '\',\'' + Z.escape(post.id) + '\')">Hide</button>';
  }
  actions += '</div>';

  var replies = cm._replies || [];
  var repliesHtml = '';
  if(!isReply && replies.length){
    repliesHtml = '<div class="comment-replies">';
    replies.forEach(function(rep){ repliesHtml += Z.renderComment(rep, post, profiles, true); });

Z.reactToPost = async function(postId, reactionType){
  var me = _cu(); if(!me){ Z.openAuthModal('login'); return; }
  var c = Z.sb(); if(!c) return;
  var post = (Z.State.allPosts||[]).find(function(x){ return x.id === postId; }); if(!post) return;
  if(post.author_id === me.id){ Z.toast('Cannot react to your own post.'); return; }
  if(!post._myReactions) post._myReactions = {};
  if(post._myReactions[reactionType]){ Z.toast('Already reacted.'); return; }

  var ins = await c.from('post_reactions').insert({post_id: postId, user_id: me.id, reaction: reactionType});
  if(ins.error){
    if(ins.error.code === '23505'){ Z.toast('Already reacted.'); }
    else Z.toast('Failed.');
    return;
  }
  post._myReactions[reactionType] = true;
  if(!post.reactions) post.reactions = {};
  post.reactions[reactionType] = (post.reactions[reactionType]||0) + 1;
  Z.softRefresh();

  var reward = await Z.DB.awardReactionBounty('post', postId, reactionType);
  if(reward > 0){
    Z.animateDollar(reward);
    await Z.refreshSession();
    Z.updateHeader();
  }
};

Z.submitReply = async function(postId, parentId){
  var me = _cu(); if(!me) return;
  var el = document.getElementById('reply-input-' + parentId);
  var t = el ? el.value.trim() : ''; if(!t) return;
  var c = Z.sb(); if(!c) return;
  var newId = Z.uuid();
  var color = Z.State.commentColor||'light-green';
  var r = await c.from('comments').insert({
    id:newId, post_id:postId, parent_id:parentId, author_id:me.id, text:t, color:color
  });
  if(r.error){ Z.toast('Failed.'); return; }
  // update local state
  var post = (Z.State.allPosts||[]).find(function(x){ return x.id === postId; });
  function findRec(arr){
    for(var i=0;i<arr.length;i++){
      if(arr[i].id === parentId) return arr[i];
      if(arr[i]._replies && arr[i]._replies.length){
        var rr = findRec(arr[i]._replies); if(rr) return rr;
      }
    }
    return null;
  }
  if(post && post._comments){
    var target = findRec(post._comments);
    if(target){
      if(!target._replies) target._replies = [];
      target._replies.push({id:newId, post_id:postId, parent_id:parentId, author_id:me.id, text:t, color:color, _reactionCounts:{}, _myReactions:{}, _replies:[]});
    }
  }
  var host = document.getElementById('reply-editor-' + parentId); if(host) host.innerHTML = '';
  Z.softRefresh();
  var ce = document.getElementById('comments-' + postId); if(ce) ce.classList.add('open');
};

Z.deleteComment = async function(commentId, postId){
  if(!confirm('Delete this comment?')) return;
  var c = Z.sb(); if(!c) return;
  var r = await c.from('comments').delete().eq('id', commentId);
  if(r.error){ Z.toast('Delete failed.'); return; }
  Z.toast('Deleted.');
  // optimistic local removal
  var post = (Z.State.allPosts||[]).find(function(x){ return x.id === postId; });
  function removeRec(arr){
    for(var i=0;i<arr.length;i++){
      if(arr[i].id === commentId){ arr.splice(i,1); return true; }
      if(arr[i]._replies && removeRec(arr[i]._replies)) return true;
    }
    return false;
  }
  if(post && post._comments) removeRec(post._comments);
  Z.softRefresh();
  var ce = document.getElementById('comments-' + postId); if(ce) ce.classList.add('open');
};

Z.hideComment = async function(commentId, postId){
  if(!confirm('Hide this comment?')) return;
  var c = Z.sb(); if(!c) return;
  var r = await c.from('comments').update({hidden: true}).eq('id', commentId);
  if(r.error){ Z.toast('Failed.'); return; }
  Z.toast('Hidden.');
  var post = (Z.State.allPosts||[]).find(function(x){ return x.id === postId; });
  function findRec(arr){
    for(var i=0;i<arr.length;i++){
      if(arr[i].id === commentId) return arr[i];
      if(arr[i]._replies){ var rr = findRec(arr[i]._replies); if(rr) return rr; }
    }
    return null;
  }
  if(post && post._comments){
    var t = findRec(post._comments);
    if(t) t.hidden = true;
  }
  Z.softRefresh();
  var ce = document.getElementById('comments-' + postId); if(ce) ce.classList.add('open');
};

// ============================================================
Z._feedVideoObserver = null;
Z.recomputeFeedVideoPlayback = function(){
  var vids = document.querySelectorAll('#app-container video:not([data-spark-id])');
  if(!vids.length) return;
  var vh = window.innerHeight, best = null, bestRatio = 0;
  vids.forEach(function(v){
    var r = v.getBoundingClientRect();
    var visible = Math.max(0, Math.min(vh, r.bottom) - Math.max(0, r.top));
    var ratio = r.height > 0 ? visible / r.height : 0;
    if(ratio > bestRatio){ bestRatio = ratio; best = v; }
  });
  vids.forEach(function(v){
    if(v === best && bestRatio >= 0.75){
      v.muted = false; v.volume = 1;
      var pr = v.play();
      if(pr && pr.catch) pr.catch(function(){ v.muted = true; v.play().catch(function(){}); });
    } else { if(!v.paused){ try { v.pause(); } catch(e){} } }
  });
};
Z.setupFeedVideoAutoplay = function(){
  if(Z._feedVideoObserver) Z._feedVideoObserver.disconnect();
  var vids = document.querySelectorAll('#app-container video:not([data-spark-id])');
  if(!vids.length) return;
  Z._feedVideoObserver = new IntersectionObserver(function(){ Z.recomputeFeedVideoPlayback(); }, {threshold:[0, 0.25, 0.5, 0.75, 0.9, 1.0]});
  vids.forEach(function(v){ v.setAttribute('playsinline',''); v.setAttribute('loop',''); Z._feedVideoObserver.observe(v); });
  if(!Z._feedScrollHooked){
    Z._feedScrollHooked = true;
    var t = null;
    window.addEventListener('scroll', function(){
      if(t) return;
      t = setTimeout(function(){ t = null; if(Z.State.currentView === 'home') Z.recomputeFeedVideoPlayback(); }, 150);
    }, {passive:true});
  }
};

Z.previewEditImage = function(input, type){

  Z._editImages[type] = f;

Z.saveProfile = async function(){
  var me = _cu(); if(!me) return;
  var patch = {};
  var nm = ((document.getElementById('edit-name')||{}).value||'').trim();
  var un = ((document.getElementById('edit-username')||{}).value||'').trim();
  var pr = ((document.getElementById('edit-profession')||{}).value||'').trim();
  var bi = ((document.getElementById('edit-bio')||{}).value||'').trim();
  if(nm) patch.name = nm;
  if(un) patch.username = un;
  if(pr) patch.profession = pr;
  patch.bio = bi;
  if(Z._editImages.avatar){
    Z.toast('Uploading avatar...');
    var au = await Z.storeMedia(Z._editImages.avatar);
    if(!au){ Z.toast('Avatar upload failed.'); return; }
    patch.avatar = au;
  }
  if(Z._editImages.cover){
    Z.toast('Uploading cover...');
    var cu = await Z.storeMedia(Z._editImages.cover);
    if(!cu){ Z.toast('Cover upload failed.'); return; }
    patch.cover = cu;
  }
  var result = await Z.DB.updateProfile(me.id, patch);
  if(!result){ Z.toast('Save failed.'); return; }
  Z._editImages = {avatar: null, cover: null};
  Z.closeModal();
  Z.toast('Profile updated!');
  await Z.refreshSession();
  await Z.reloadData();
  Z.showView('profile');
};

// ============================================================
Z.reloadData = async function(){
  await Z.DB.loadAllProfiles();
  await Z.DB.loadHomeFeed();
  await Z.DB.loadConnections();
  await Z.DB.loadNotifications();
  await Z.DB.loadStatuses();
  await Z.DB.loadSparks();
  var me = _cu();
  if(me){
    me._walletTx = await Z.DB.loadWalletTx(me.id);
    var views = await Z.DB.loadStatusViews();
    (Z.State.allStatuses||[]).forEach(function(s){
      if(s.author_id === me.id) return;
      var seen = views.find(function(v){ return v.status_id === s.id && v.viewer_id === me.id; });
      if(seen) s._viewedByMe = true;
    });
    var c = Z.sb();
    if(c){
      // Post reactions — mine (multi) + counts
      var pr = await c.from('post_reactions').select('*').eq('user_id', me.id);
      var myPostReactions = {};
      (pr.data||[]).forEach(function(r){
        if(!myPostReactions[r.post_id]) myPostReactions[r.post_id] = {};
        myPostReactions[r.post_id][r.reaction] = true;
      });
      (Z.State.allPosts||[]).forEach(function(p){
        p._myReactions = myPostReactions[p.id] || {};
      });
      var pids = (Z.State.allPosts||[]).map(function(p){ return p.id; });
      if(pids.length){
        var pc = await c.from('post_reactions').select('post_id, reaction').in('post_id', pids);
        var postMap = {};
        (pc.data||[]).forEach(function(r){
          postMap[r.post_id] = postMap[r.post_id] || {};
          postMap[r.post_id][r.reaction] = (postMap[r.post_id][r.reaction]||0)+1;
        });
        (Z.State.allPosts||[]).forEach(function(p){ p.reactions = postMap[p.id] || {}; });
      }
      // Spark reactions — mine (multi) + counts
      var sr = await c.from('spark_reactions').select('*');
      var allSparkR = sr.data || [];
      var mySparkR = {};
      var sparkCounts = {};
      allSparkR.forEach(function(r){
        sparkCounts[r.spark_id] = sparkCounts[r.spark_id] || {};
        sparkCounts[r.spark_id][r.reaction] = (sparkCounts[r.spark_id][r.reaction]||0)+1;
        if(r.user_id === me.id){
          if(!mySparkR[r.spark_id]) mySparkR[r.spark_id] = {};
          mySparkR[r.spark_id][r.reaction] = true;
        }
      });
      (Z.State.allSparks||[]).forEach(function(sp){
        sp._myReactions = mySparkR[sp.id] || {};
        sp._reactions = sparkCounts[sp.id] || {};
      });
      for(var i=0;i<(Z.State.allSparks||[]).length;i++){
        var sp2 = Z.State.allSparks[i];
        var cm = await c.from('comments').select('id').eq('spark_id', sp2.id);
        sp2._commentsCount = (cm.data||[]).length;
      }
      // Post comments: roots + replies + reactions
      for(var j=0;j<(Z.State.allPosts||[]).length;j++){
        var pp = Z.State.allPosts[j];
        var cmr = await c.from('comments').select('*').eq('post_id', pp.id).order('created_at',{ascending:true});
        var allCm = cmr.data || [];
        // attach reactions + my reactions on comments
        var cIds = allCm.map(function(x){ return x.id; });
        var crMap = {};
        var myCrMap = {};
        if(cIds.length){
          var cr = await c.from('comment_reactions').select('*').in('comment_id', cIds);
          (cr.data||[]).forEach(function(r){
            crMap[r.comment_id] = crMap[r.comment_id] || {};
            crMap[r.comment_id][r.reaction] = (crMap[r.comment_id][r.reaction]||0)+1;
            if(r.user_id === me.id){
              myCrMap[r.comment_id] = myCrMap[r.comment_id] || {};
              myCrMap[r.comment_id][r.reaction] = true;
            }
          });
        }
        allCm.forEach(function(cm){
          cm._reactionCounts = crMap[cm.id] || {};
          cm._myReactions = myCrMap[cm.id] || {};
          cm._replies = [];
        });
        // Build tree
        var roots = allCm.filter(function(x){ return !x.parent_id; });
        var byId = {};
        allCm.forEach(function(x){ byId[x.id] = x; });
        allCm.forEach(function(x){
          if(x.parent_id && byId[x.parent_id]){
            byId[x.parent_id]._replies.push(x);
          }
        });
        pp._comments = roots;
      }
    }
  }
  Z.updateNotifBadge();
};

// ============================================================
// Realtime subscription (comments for visible posts)
// ============================================================
Z._realtimeChannel = null;
Z.setupRealtime = function(){
  var c = Z.sb(); if(!c) return;
  if(Z._realtimeChannel){ try { c.removeChannel(Z._realtimeChannel); } catch(e){} }
  try {
    Z._realtimeChannel = c.channel('zynix-comments')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'comments' }, function(payload){
        var cm = payload.new;
        if(!cm || !cm.post_id) return;
        var post = (Z.State.allPosts||[]).find(function(x){ return x.id === cm.post_id; });
        if(!post){ return; }
        if(!post._comments) post._comments = [];
        // check if already present
        var exists = false;
        function scan(arr){ for(var i=0;i<arr.length;i++){ if(arr[i].id === cm.id){ exists=true; return; } if(arr[i]._replies) scan(arr[i]._replies); } }
        scan(post._comments);
        if(exists) return;
        cm._reactionCounts = {}; cm._myReactions = {}; cm._replies = [];
        if(cm.parent_id){
          function findRec(arr){
            for(var i=0;i<arr.length;i++){
              if(arr[i].id === cm.parent_id) return arr[i];
              if(arr[i]._replies){ var r = findRec(arr[i]._replies); if(r) return r; }
            }
            return null;
          }
          var target = findRec(post._comments);
          if(target){ if(!target._replies) target._replies = []; target._replies.push(cm); }
          else post._comments.push(cm);
        } else {
          post._comments.push(cm);
        }
        Z.softRefresh();
        var ce = document.getElementById('comments-' + cm.post_id); if(ce) ce.classList.add('open');
      })
      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'comments' }, function(payload){
        var cm = payload.old;
        if(!cm || !cm.id) return;
        var post = (Z.State.allPosts||[]).find(function(x){ return (x._comments||[]).some(function(y){ return y.id === cm.id; }) || (x._comments||[]).some(function(y){ return (y._replies||[]).some(function(z){ return z.id === cm.id; }); }); });
        if(!post) return;
        function removeRec(arr){
          for(var i=0;i<arr.length;i++){
            if(arr[i].id === cm.id){ arr.splice(i,1); return true; }
            if(arr[i]._replies && removeRec(arr[i]._replies)) return true;
          }
          return false;
        }
        removeRec(post._comments);
        Z.softRefresh();
      })
      .subscribe();
  } catch(e){ console.warn('realtime setup', e); }
};

// ============================================================
// ROUTER
// ============================================================
Z.renderView = function(view, param){
  switch(view){
    case 'home': return Z.renderHome();
    case 'spark': return Z.renderSpark();
    case 'people': return Z.renderPeople();
    case 'profile': return Z.renderProfile();
    case 'wallet': return Z.renderWallet();
    case 'bounty': return Z.renderBounty();
    case 'packages': return Z.renderPackages();
    case 'referrals': return Z.renderReferrals();
    case 'circles': return Z.renderCircles();
    case 'notifications': return Z.renderNotifications();
    case 'public-profile': return Z.renderPublicProfile(param);
    case 'status-home': return Z.renderStatusHome();
    default: return Z.renderHome();
  }
};

Z.showView = async function(view, param){
  Z.State.currentView = view;
  window.scrollTo(0,0);
  document.querySelectorAll('#bottom-nav button:not(.create-btn)').forEach(function(b){ b.classList.remove('active'); });
  var map = {home:'nav-home', spark:'nav-spark', circles:'nav-circles', people:'nav-people', profile:'nav-profile'};
  if(map[view]){ var b = document.getElementById(map[view]); if(b) b.classList.add('active'); }
  var container = document.getElementById('app-container');
  if(!container) return;
  try { container.innerHTML = Z.renderView(view, param); }
  catch(e){
    console.error('render err', e);
    container.innerHTML = '<div class="empty-state"><p>Something went wrong.</p><button onclick="Z.showView(\'home\')" style="background:#10b981;border:none;color:#000;font-weight:700;padding:8px 20px;border-radius:8px;margin-top:12px;cursor:pointer;">Home</button></div>';
  }
  if(view === 'home'){
    setTimeout(function(){ Z.renderStatusRow(); }, 80);
    setTimeout(function(){ Z.setupFeedVideoAutoplay(); }, 150);
  }
  if(view === 'spark'){
    setTimeout(function(){ Z.setupSparkFeed(Z.State.allSparks); }, 150);
  }
  Z.updateHeader();
};

// ============================================================
// BOOT
// ============================================================
async function boot(){
  if(!localStorage.getItem('zynix_circles')) Z.DB.saveCircles(Z.SeedData.circles);
  await Z.refreshSession();
  await Z.reloadData();
  Z.showView('home');
  Z.setupRealtime();
  var c = Z.sb();
  if(c){
    c.auth.onAuthStateChange(async function(event){
      if(event === 'SIGNED_IN' || event === 'SIGNED_OUT' || event === 'TOKEN_REFRESHED'){
        await Z.refreshSession();
        await Z.reloadData();
        Z.showView(Z.State.currentView || 'home');
        Z.setupRealtime();
      }
    });
  }
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
} else { boot(); }

})();
</script>

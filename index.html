<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZYNIX - Creator & Social Ecosystem</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        zynix: {
                            bg: "#090d16",
                            card: "#111827",
                            border: "#1e293b",
                            emerald: "#10b981",
                            blue: "#3b82f6",
                            pink: "#ec4899",
                            purple: "#8b5cf6"
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #090d16; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
        
        @keyframes floatReward {
            0% { transform: translateY(0) scale(0.8); opacity: 0; }
            50% { transform: translateY(-30px) scale(1.1); opacity: 1; }
            100% { transform: translateY(-70px) scale(0.4); opacity: 0; }
        }
        .float-reward { animation: floatReward 1.2s ease-out forwards; }
        body { background-color: #090d16; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="min-h-screen pb-28 selection:bg-emerald-500 selection:text-black">

    <!-- Top Navigation Header -->
    <header class="sticky top-0 z-40 bg-[#090d16]/95 backdrop-blur-md border-b border-slate-800 px-4 py-2.5 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <button type="button" onclick="Z.showView('home')" class="flex items-center space-x-2 text-left focus:outline-none">
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-emerald-400 via-blue-500 to-indigo-500 flex items-center justify-center font-black text-black text-xs shadow-md shadow-emerald-500/20">
                    Z
                </div>
                <span class="text-xl font-black tracking-wider bg-gradient-to-r from-emerald-400 via-blue-400 to-indigo-400 bg-clip-text text-transparent">
                    ZYNIX
                </span>
            </button>
        </div>

        <div class="flex items-center space-x-2">
            <!-- Wallet Balances Pill -->
            <button type="button" onclick="Z.showView('profile'); Z.setProfileTab('wallet')" class="bg-slate-900 border border-slate-800 hover:border-slate-700 px-3 py-1 rounded-full text-xs flex items-center space-x-2 shadow-inner transition">
                <div class="flex items-center space-x-1" title="Cash Balance (60%)">
                    <i class="fa-solid fa-wallet text-emerald-400 text-[10px]"></i>
                    <span id="header-cash" class="text-emerald-400 font-bold">$0.00</span>
                </div>
                <span class="text-slate-700">|</span>
                <div class="flex items-center space-x-1" title="Bounty Pool (40%)">
                    <i class="fa-solid fa-gift text-blue-400 text-[10px]"></i>
                    <span id="header-bounty" class="text-blue-400 font-bold">$0.00</span>
                </div>
            </button>

            <!-- Reset Data Button (Emergency Repair) -->
            <button type="button" onclick="Z.resetSystemData()" class="w-7 h-7 rounded-full bg-slate-900 hover:bg-amber-500/20 text-slate-400 hover:text-amber-400 flex items-center justify-center transition border border-slate-800" title="Reset & Fix Feeds Data">
                <i class="fa-solid fa-rotate-right text-xs"></i>
            </button>

            <div id="header-auth-container"></div>
        </div>
    </header>

    <!-- App Container -->
    <main id="app-container" class="max-w-xl mx-auto px-3 py-3 min-h-[calc(100vh-120px)]">
        <!-- View Content Injected via JS -->
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 z-40 bg-[#090d16]/95 backdrop-blur-lg border-t border-slate-800 px-2 py-2 max-w-xl mx-auto flex items-center justify-between shadow-2xl">
        <button type="button" onclick="Z.showView('home')" id="nav-btn-home" class="flex flex-col items-center justify-center text-emerald-400 transition w-1/5 py-1">
            <i class="fa-solid fa-house text-base"></i>
            <span class="text-[9px] font-medium mt-0.5">Home</span>
        </button>
        <button type="button" onclick="Z.showView('spark')" id="nav-btn-spark" class="flex flex-col items-center justify-center text-slate-400 hover:text-emerald-400 transition w-1/5 py-1">
            <i class="fa-solid fa-bolt text-base"></i>
            <span class="text-[9px] font-medium mt-0.5">Sparks</span>
        </button>
        <button type="button" onclick="Z.openCreateModal()" class="flex items-center justify-center w-11 h-11 bg-gradient-to-tr from-emerald-400 to-blue-500 rounded-full text-black hover:scale-105 transition shadow-lg shadow-emerald-500/20 -mt-3">
            <i class="fa-solid fa-plus text-base font-black"></i>
        </button>
        <button type="button" onclick="Z.showView('circles')" id="nav-btn-circles" class="flex flex-col items-center justify-center text-slate-400 hover:text-emerald-400 transition w-1/5 py-1">
            <i class="fa-solid fa-circle-nodes text-base"></i>
            <span class="text-[9px] font-medium mt-0.5">Circles</span>
        </button>
        <button type="button" onclick="Z.showView('profile')" id="nav-btn-profile" class="flex flex-col items-center justify-center text-slate-400 hover:text-emerald-400 transition w-1/5 py-1">
            <i class="fa-solid fa-user text-base"></i>
            <span class="text-[9px] font-medium mt-0.5">Profile</span>
        </button>
    </nav>

    <!-- Modal Container -->
    <div id="modal-container"></div>

    <!-- JavaScript Application Engine -->

                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")

                }
            ],

                {

            ],
            statuses: [

                { id: 'st_2', authorId: 'usr_2', content: 'Designing 300 DPI Canva templates ☕', timestamp: Date.now() - 3600000 }

                }
            ]
        };

        // Storage Engine with Auto-Repair / Fail-Safe Checks
        Z.DB = {
            getUsers: function() {
                const data = localStorage.getItem('zynix_users');
                if (!data) {
                    localStorage.setItem('zynix_users', JSON.stringify(Z.Seed.users));
                    return Z.Seed.users;
                }
                return JSON.parse(data);
            },
            saveUsers: function(users) {
                localStorage.setItem('zynix_users', JSON.stringify(users));
                if (Z.State.currentUser) {
                    const fresh = users.find(u => u.id === Z.State.currentUser.id);
                    if (fresh) Z.State.currentUser = fresh;
                }
            },
            getUserById: function(id) {
                return this.getUsers().find(u => u.id === id) || null;
            },
            getPosts: function() {
                const data = localStorage.getItem('zynix_posts');
                let posts = data ? JSON.parse(data) : null;
                if (!posts || posts.length === 0) {
                    localStorage.setItem('zynix_posts', JSON.stringify(Z.Seed.posts));
                    return Z.Seed.posts;
                }
                return posts;
            },
            savePosts: function(posts) {
                localStorage.setItem('zynix_posts', JSON.stringify(posts));
            },
            getSparks: function() {
                const data = localStorage.getItem('zynix_sparks');
                let sparks = data ? JSON.parse(data) : null;
                if (!sparks || sparks.length === 0) {
                    localStorage.setItem('zynix_sparks', JSON.stringify(Z.Seed.sparks));
                    return Z.Seed.sparks;
                }
                return sparks;
            },
            saveSparks: function(sparks) {
                localStorage.setItem('zynix_sparks', JSON.stringify(sparks));
            },
            getStatuses: function() {
                const data = localStorage.getItem('zynix_statuses');
                let list = data ? JSON.parse(data) : Z.Seed.statuses;
                const now = Date.now();
                return list.filter(s => (now - s.timestamp) < 86400000);
            },
            saveStatuses: function(statuses) {
                localStorage.setItem('zynix_statuses', JSON.stringify(statuses));
            },
            getCircles: function() {
                const data = localStorage.getItem('zynix_circles');
                let list = data ? JSON.parse(data) : null;
                if (!list || list.length === 0) {
                    localStorage.setItem('zynix_circles', JSON.stringify(Z.Seed.circles));
                    return Z.Seed.circles;
                }
                return list;
            },
            saveCircles: function(circles) {
                localStorage.setItem('zynix_circles', JSON.stringify(circles));
            }
        };

        Z.resetSystemData = function() {
            localStorage.clear();
            localStorage.setItem('zynix_users', JSON.stringify(Z.Seed.users));
            localStorage.setItem('zynix_posts', JSON.stringify(Z.Seed.posts));
            localStorage.setItem('zynix_sparks', JSON.stringify(Z.Seed.sparks));
            localStorage.setItem('zynix_statuses', JSON.stringify(Z.Seed.statuses));
            localStorage.setItem('zynix_circles', JSON.stringify(Z.Seed.circles));
            Z.State.currentUser = Z.Seed.users[0];
            localStorage.setItem('zynix_user_id', Z.State.currentUser.id);
            Z.renderHeaderAuth();
            Z.updateHeaderBalances();
            Z.showToast('System data reset & feed repaired!');
            Z.showView(Z.State.currentView);
        };

        // Central Interaction & Reward Engine
        Z.RewardEngine = {
            processAction: function(targetOwnerId, actionType, targetId) {
                if (!Z.State.currentUser) {
                    Z.openAuthModal('login');
                    Z.showToast('Please login to engage & earn rewards!');
                    return;
                }

                const user = Z.DB.getUserById(Z.State.currentUser.id);
                const pkg = Z.Packages[user.package || 'Free'] || Z.Packages['Free'];

                if (!pkg.canEarn) {
                    Z.showToast('Free package cannot earn action rewards. Upgrade package!');
                    return;
                }

                if (targetOwnerId === user.id) {
                    Z.showToast('You cannot earn rewards on your own content.');
                    return;
                }

                const actionKey = `${actionType}_${targetId || targetOwnerId}`;
                if (!user.interactionHistory) user.interactionHistory = {};
                if (user.interactionHistory[actionKey]) {
                    Z.showToast(`Reward already claimed for this ${actionType}!`);
                    return;
                }

                const owner = Z.DB.getUserById(targetOwnerId);
                if (!owner) return;

                const bountyRates = owner.bountySettings || { like: 0.01, share: 0.02, follow: 0.03, circleJoin: 0.02 };
                let rewardAmount = bountyRates[actionType] || 0.01;

                if (!owner.wallet || owner.wallet.bounty < rewardAmount) {
                    Z.showToast('Creator bounty pool has insufficient funds.');
                    return;
                }

                // Deduct from Creator Bounty, Credit to Engager (60% Cash, 40% Bounty)
                owner.wallet.bounty -= rewardAmount;
                const cashPortion = Number((rewardAmount * 0.60).toFixed(4));
                const bountyPortion = Number((rewardAmount * 0.40).toFixed(4));

                user.wallet.cash += cashPortion;
                user.wallet.bounty += bountyPortion;
                user.wallet.totalEarned += rewardAmount;

                user.interactionHistory[actionKey] = new Date().toISOString();

                if (!user.walletTransactions) user.walletTransactions = [];
                user.walletTransactions.unshift({
                    id: 'tx_' + Date.now(),
                    date: new Date().toISOString().split('T')[0],
                    type: `${actionType.toUpperCase()} Engagement Reward`,
                    amount: rewardAmount,
                    cash: cashPortion,
                    bounty: bountyPortion,
                    status: 'Completed'
                });

                // Update Feed Data Counters
                if (actionType === 'like') {
                    const posts = Z.DB.getPosts();
                    const p = posts.find(item => item.id === targetId);
                    if (p) {
                        if (!p.reactions) p.reactions = { heart: 0 };
                        p.reactions.heart = (p.reactions.heart || 0) + 1;
                        Z.DB.savePosts(posts);
                    }
                } else if (actionType === 'share') {
                    const posts = Z.DB.getPosts();
                    const p = posts.find(item => item.id === targetId);
                    if (p) {
                        p.shares = (p.shares || 0) + 1;
                        Z.DB.savePosts(posts);
                    }
                } else if (actionType === 'spark_like') {
                    const sparks = Z.DB.getSparks();
                    const s = sparks.find(item => item.id === targetId);
                    if (s) {
                        s.likes = (s.likes || 0) + 1;
                        Z.DB.saveSparks(sparks);
                    }
                } else if (actionType === 'follow') {
                    owner.followers = (owner.followers || 0) + 1;
                }

                const users = Z.DB.getUsers();
                const uIdx = users.findIndex(u => u.id === user.id);
                if (uIdx !== -1) users[uIdx] = user;
                const oIdx = users.findIndex(u => u.id === owner.id);
                if (oIdx !== -1) users[oIdx] = owner;
                Z.DB.saveUsers(users);

                Z.updateHeaderBalances();
                Z.showRewardFloat(rewardAmount);
                Z.showToast(`+$${rewardAmount.toFixed(2)} Earned! (+$${cashPortion.toFixed(3)} Cash, +$${bountyPortion.toFixed(3)} Bounty)`);
                Z.showView(Z.State.currentView);
            }
        };

        Z.showRewardFloat = function(amount) {
            const floatEl = document.createElement('div');
            floatEl.className = 'fixed z-50 top-16 right-10 text-emerald-400 font-black text-xl float-reward flex items-center space-x-1 pointer-events-none';
            floatEl.innerHTML = `<i class="fa-solid fa-coins"></i><span>+$${amount.toFixed(2)}</span>`;
            document.body.appendChild(floatEl);
            setTimeout(() => floatEl.remove(), 1200);
        };

        Z.showToast = function(msg) {
            const c = document.getElementById('toast-container');
            if (!c) return;
            const t = document.createElement('div');
            t.className = 'bg-slate-900/95 border border-emerald-500/40 text-slate-100 px-4 py-2.5 rounded-xl text-xs shadow-2xl flex items-center space-x-2 pointer-events-auto backdrop-blur-md';
            t.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400"></i><span>${Z.escape(msg)}</span>`;
            c.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        };

        // Application Lifecyle
        document.addEventListener('DOMContentLoaded', function() {
            Z.DB.getUsers();
            Z.DB.getPosts();
            Z.DB.getSparks();
            Z.DB.getCircles();

            const savedId = localStorage.getItem('zynix_user_id') || 'usr_1';
            Z.State.currentUser = Z.DB.getUserById(savedId) || Z.DB.getUsers()[0];
            
            Z.renderHeaderAuth();
            Z.updateHeaderBalances();
            Z.showView('home');
        });

        Z.renderHeaderAuth = function() {
            const c = document.getElementById('header-auth-container');
            if (!c) return;
            const u = Z.State.currentUser;
            if (u) {
                c.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <button type="button" onclick="Z.showView('profile')" class="flex items-center space-x-1.5 focus:outline-none">
                            <img src="${Z.escape(u.avatar)}" class="w-7 h-7 rounded-full object-cover border border-emerald-500">
                        </button>
                        <button type="button" onclick="Z.logout()" class="w-7 h-7 rounded-full bg-slate-900 hover:bg-rose-500/20 text-slate-400 hover:text-rose-400 flex items-center justify-center transition border border-slate-800" title="Logout">
                            <i class="fa-solid fa-power-off text-xs"></i>
                        </button>
                    </div>
                `;
            } else {
                c.innerHTML = `
                    <button type="button" onclick="Z.openAuthModal('login')" class="bg-emerald-500 hover:bg-emerald-400 text-black font-bold text-xs px-3 py-1.5 rounded-full transition shadow">
                        Login
                    </button>
                `;
            }
        };

        Z.updateHeaderBalances = function() {
            const u = Z.State.currentUser;
            const cash = document.getElementById('header-cash');
            const bounty = document.getElementById('header-bounty');
            if (cash) cash.innerText = '$' + (u && u.wallet ? u.wallet.cash.toFixed(2) : '0.00');
            if (bounty) bounty.innerText = '$' + (u && u.wallet ? u.wallet.bounty.toFixed(2) : '0.00');
        };

        // Navigation Controller
        Z.showView = function(view) {
            Z.State.currentView = view;
            const container = document.getElementById('app-container');
            if (!container) return;

            ['home', 'spark', 'circles', 'profile'].forEach(n => {
                const btn = document.getElementById(`nav-btn-${n}`);
                if (btn) {
                    btn.className = (n === view) 
                        ? "flex flex-col items-center justify-center text-emerald-400 transition w-1/5 py-1"
                        : "flex flex-col items-center justify-center text-slate-400 hover:text-emerald-400 transition w-1/5 py-1";
                }
            });

            if (view === 'home') Z.renderHomeView(container);
            else if (view === 'spark') Z.renderSparkView(container);
            else if (view === 'circles') Z.renderCirclesView(container);
            else if (view === 'profile') Z.renderProfileView(container);
        };

        // HOME VIEW RENDERER
        Z.renderHomeView = function(container) {
            const statuses = Z.DB.getStatuses();
            const posts = Z.DB.getPosts();

            let html = `

                        </div>
                        <div>
                            <label class="block text-[11px] text-slate-300 mb-1">Bio</label>
                            <textarea id="edit-bio" rows="2" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white">${Z.escape(u.bio)}</textarea>
                        </div>
                        <div>
                            <label class="block text-[11px] text-slate-300 mb-1">Avatar Image URL</label>
                            <input type="text" id="edit-avatar" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white" value="${Z.escape(u.avatar)}">
                        </div>
                        <div>
                            <label class="block text-[11px] text-slate-300 mb-1">Cover Image URL</label>
                            <input type="text" id="edit-cover" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white" value="${Z.escape(u.cover)}">
                        </div>
                        <button type="button" onclick="Z.saveProfileDetails()" class="w-full bg-emerald-500 text-black font-bold py-2.5 rounded-xl text-xs transition">Save Profile</button>
                    </div>
                `;
            }

            html += `</div>`;
            container.innerHTML = html;
        };

        Z.setProfileTab = function(tab) {
            Z.State.profileActiveTab = tab;
            Z.showView('profile');
        };

        Z.saveBountySettings = function() {
            const u = Z.State.currentUser;
            if (!u) return;
            u.bountySettings = {
                like: parseFloat(document.getElementById('bounty-like').value) || 0.01,
                share: parseFloat(document.getElementById('bounty-share').value) || 0.02,
                follow: parseFloat(document.getElementById('bounty-follow').value) || 0.03,
                circleJoin: parseFloat(document.getElementById('bounty-circle').value) || 0.02
            };
            Z.DB.saveUsers();
            Z.showToast('Bounty rates updated successfully!');
        };

        Z.saveProfileDetails = function() {
            const u = Z.State.currentUser;
            if (!u) return;
            u.name = document.getElementById('edit-name').value.trim() || u.name;
            u.profession = document.getElementById('edit-profession').value.trim() || u.profession;
            u.bio = document.getElementById('edit-bio').value.trim() || u.bio;
            u.avatar = document.getElementById('edit-avatar').value.trim() || u.avatar;
            u.cover = document.getElementById('edit-cover').value.trim() || u.cover;

            Z.DB.saveUsers();
            Z.renderHeaderAuth();
            Z.showToast('Profile updated!');
            Z.setProfileTab('posts');
        };

        Z.upgradePackage = function(pkgName) {
            if (!Z.State.currentUser) return;
            Z.State.currentUser.package = pkgName;
            Z.DB.saveUsers();
            Z.showToast(`Switched to ${pkgName} plan!`);
            Z.showView('profile');
        };

        // Modals Logic
        Z.openCreateModal = function() {
            if (!Z.State.currentUser) return Z.openAuthModal('login');
            const c = document.getElementById('modal-container');
            c.innerHTML = `
                <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                    <div class="bg-[#111827] border border-slate-800 rounded-2xl w-full max-w-md p-5 space-y-4">
                        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                            <h3 class="font-bold text-sm text-white">Create New Post</h3>
                            <button onclick="Z.closeModal()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <textarea id="post-text" rows="4" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-emerald-500" placeholder="Write post text..."></textarea>
                        <input type="text" id="post-img" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white focus:outline-none" placeholder="Image URL (optional)">
                        <button onclick="Z.submitPost()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-black font-bold py-2.5 rounded-xl text-xs transition">Publish</button>
                    </div>
                </div>
            `;
        };

        Z.submitPost = function() {
            const txt = document.getElementById('post-text').value.trim();
            const img = document.getElementById('post-img').value.trim();
            if (!txt) return Z.showToast('Please enter post content');

            const posts = Z.DB.getPosts();
            posts.unshift({
                id: 'post_' + Date.now(),
                authorId: Z.State.currentUser.id,
                content: txt,
                media: img,
                createdAt: 'Just now',
                reactions: { heart: 0 },
                comments: [],
                shares: 0
            });
            Z.DB.savePosts(posts);
            Z.closeModal();
            Z.showToast('Post published!');
            Z.showView('home');
        };

        Z.openStatusModal = function() {
            if (!Z.State.currentUser) return Z.openAuthModal('login');
            const c = document.getElementById('modal-container');
            c.innerHTML = `
                <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                    <div class="bg-[#111827] border border-slate-800 rounded-2xl w-full max-w-md p-5 space-y-4">
                        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                            <h3 class="font-bold text-sm text-white">Add 24H Story</h3>
                            <button onclick="Z.closeModal()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <input type="text" id="status-txt" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white" placeholder="Quick status note...">
                        <button onclick="Z.submitStatus()" class="w-full bg-emerald-500 text-black font-bold py-2.5 rounded-xl text-xs">Post Story</button>
                    </div>
                </div>
            `;
        };

        Z.submitStatus = function() {
            const txt = document.getElementById('status-txt').value.trim();
            if (!txt) return;
            const list = Z.DB.getStatuses();
            list.unshift({ id: 'st_' + Date.now(), authorId: Z.State.currentUser.id, content: txt, timestamp: Date.now() });
            Z.DB.saveStatuses(list);
            Z.closeModal();
            Z.showToast('Story added!');
            Z.showView('home');
        };

        Z.openDepositModal = function() {
            const c = document.getElementById('modal-container');
            c.innerHTML = `
                <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                    <div class="bg-[#111827] border border-slate-800 rounded-2xl w-full max-w-md p-5 space-y-4">
                        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                            <h3 class="font-bold text-sm text-white">Top Up Creator Bounty Pool</h3>
                            <button onclick="Z.closeModal()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <input type="number" id="dep-amount" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white" placeholder="Amount ($ USD)" value="10">
                        <button onclick="Z.processDeposit()" class="w-full bg-emerald-500 text-black font-bold py-2.5 rounded-xl text-xs">Add Bounty Balance</button>
                    </div>
                </div>
            `;
        };

        Z.processDeposit = function() {
            const amt = parseFloat(document.getElementById('dep-amount').value) || 0;
            if (amt <= 0) return;
            const u = Z.State.currentUser;
            if (!u.wallet) u.wallet = { cash: 0, bounty: 0, totalEarned: 0 };
            u.wallet.bounty += amt;
            if (!u.walletTransactions) u.walletTransactions = [];
            u.walletTransactions.unshift({
                id: 'tx_' + Date.now(),
                date: new Date().toISOString().split('T')[0],
                type: 'Bounty Pool Top Up',
                amount: amt,
                cash: 0,
                bounty: amt,
                status: 'Completed'
            });
            Z.DB.saveUsers();
            Z.updateHeaderBalances();
            Z.closeModal();
            Z.showToast(`+$${amt.toFixed(2)} added to Bounty Pool!`);
            Z.showView('profile');
        };

        Z.openWithdrawModal = function() {
            const c = document.getElementById('modal-container');
            c.innerHTML = `
                <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                    <div class="bg-[#111827] border border-slate-800 rounded-2xl w-full max-w-md p-5 space-y-4">
                        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                            <h3 class="font-bold text-sm text-white">Withdraw Earnings</h3>
                            <button onclick="Z.closeModal()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <select id="wd-method" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white">
                            <option value="Payoneer">Payoneer</option>
                            <option value="JazzCash">JazzCash</option>
                            <option value="EasyPaisa">EasyPaisa</option>
                            <option value="Crypto USDT">Crypto (USDT TRC20)</option>
                        </select>
                        <input type="number" id="wd-amount" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white" placeholder="Amount ($ USD)">
                        <button onclick="Z.processWithdrawal()" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded-xl text-xs">Request Withdrawal</button>
                    </div>
                </div>
            `;
        };

        Z.processWithdrawal = function() {
            const amt = parseFloat(document.getElementById('wd-amount').value) || 0;
            const u = Z.State.currentUser;
            if (amt <= 0 || amt > u.wallet.cash) {
                return Z.showToast('Invalid amount or insufficient cash balance.');
            }
            u.wallet.cash -= amt;
            u.walletTransactions.unshift({
                id: 'tx_' + Date.now(),
                date: new Date().toISOString().split('T')[0],
                type: `Withdrawal (${document.getElementById('wd-method').value})`,
                amount: amt,
                cash: -amt,
                bounty: 0,
                status: 'Pending'
            });
            Z.DB.saveUsers();
            Z.updateHeaderBalances();
            Z.closeModal();
            Z.showToast('Withdrawal request submitted!');
            Z.showView('profile');
        };

        Z.openCommentModal = function(postId) {
            const c = document.getElementById('modal-container');
            c.innerHTML = `
                <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                    <div class="bg-[#111827] border border-slate-800 rounded-2xl w-full max-w-md p-5 space-y-3">
                        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                            <h3 class="font-bold text-sm text-white">Add Comment</h3>
                            <button onclick="Z.closeModal()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <input type="text" id="cmt-text" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-white" placeholder="Type comment...">
                        <button onclick="Z.submitComment('${postId}')" class="w-full bg-blue-600 text-white font-bold py-2 rounded-xl text-xs">Post Comment</button>
                    </div>
                </div>
            `;
        };

        Z.submitComment = function(postId) {
            const txt = document.getElementById('cmt-text').value.trim();
            if (!txt) return;
            const posts = Z.DB.getPosts();
            const p = posts.find(i => i.id === postId);
            if (p) {
                if (!p.comments) p.comments = [];
                p.comments.push({ id: 'c_' + Date.now(), author: Z.State.currentUser ? Z.State.currentUser.name : 'User', text: txt, time: 'Just now' });
                Z.DB.savePosts(posts);
            }
            Z.closeModal();
            Z.showToast('Comment added!');
            Z.showView('home');
        };

        Z.openAuthModal = function(mode) {
            const c = document.getElementById('modal-container');
            c.innerHTML = `
                <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                    <div class="bg-[#111827] border border-slate-800 rounded-2xl w-full max-w-sm p-5 space-y-4">
                        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                            <h3 class="font-bold text-sm text-white">Login Account</h3>
                            <button onclick="Z.closeModal()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <p class="text-xs text-slate-300">Quick login as default demo account:</p>
                        <button onclick="Z.quickLogin('usr_1')" class="w-full bg-emerald-500 text-black font-bold py-2.5 rounded-xl text-xs">Login as Abdullah Abbas</button>
                        <button onclick="Z.quickLogin('usr_2')" class="w-full bg-slate-800 text-white font-bold py-2.5 rounded-xl text-xs border border-slate-700">Login as Sarah Khan</button>
                    </div>
                </div>
            `;
        };

        Z.quickLogin = function(id) {
            const u = Z.DB.getUserById(id);
            if (u) {
                Z.State.currentUser = u;
                localStorage.setItem('zynix_user_id', u.id);
                Z.renderHeaderAuth();
                Z.updateHeaderBalances();
                Z.closeModal();
                Z.showToast(`Logged in as ${u.name}`);
                Z.showView('home');
            }
        };

        Z.logout = function() {
            Z.State.currentUser = null;
            localStorage.removeItem('zynix_user_id');
            Z.renderHeaderAuth();
            Z.updateHeaderBalances();
            Z.showToast('Logged out');
            Z.showView('home');
        };

        Z.closeModal = function() {
            document.getElementById('modal-container').innerHTML = '';
        };

    </script>
</body>
</html>

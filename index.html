<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zynix - Social Earn & Creator Hub</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS Client CDN (v2) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#090d16] text-slate-100 font-sans antialiased">

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900 border border-slate-700 text-slate-200 text-xs px-4 py-2.5 rounded-full shadow-2xl z-50 transition-all duration-300 opacity-0 pointer-events-none">
        <span id="toast-msg">Notification</span>
    </div>

    <!-- Top Navigation -->
    <header class="border-b border-slate-800 bg-[#090d16]/90 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <span class="text-xl font-black bg-gradient-to-r from-emerald-400 to-blue-500 bg-clip-text text-transparent">ZYNIX</span>
            <div class="flex items-center space-x-3">
                <div class="bg-slate-900 border border-slate-800 px-3 py-1 rounded-full text-xs">
                    Wallet: <span id="wallet-balance" class="text-emerald-400 font-bold">$0.00</span>
                </div>
                <button onclick="openAuthModal()" id="nav-btn" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded-xl border border-slate-700 transition">
                    Login / Join
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-xl mx-auto px-4 py-6 space-y-5">
        <div class="bg-[#111827] border border-slate-800 rounded-2xl p-5 text-center space-y-3 shadow-xl">
            <h1 class="text-base font-bold text-white">Supabase Cloud Authentication Hub</h1>
            <p class="text-xs text-slate-400">Test your direct database login and signup securely.</p>
            <button onclick="openAuthModal()" class="bg-emerald-600 hover:bg-emerald-500 text-black font-bold text-xs px-4 py-2 rounded-xl transition">
                Open Account Portal
            </button>
        </div>
    </main>

    <!-- Auth Modal -->
    <div id="auth-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center z-50 px-4">
        <div class="bg-[#111827] border border-slate-800 w-full max-w-sm rounded-3xl p-6 space-y-4 shadow-2xl relative">
            <div class="flex justify-between items-center">
                <h3 class="text-sm font-bold text-white">Zynix Secure Auth</h3>
                <button onclick="closeAuthModal()" class="text-slate-400 hover:text-white text-xs">✕</button>
            </div>
            
            <div id="form-view" class="space-y-3">
                <input type="email" id="email" placeholder="Email address" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500">
                <input type="password" id="password" placeholder="Password" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500">
                <div class="flex space-x-2 pt-2">
                    <button onclick="handleLogin()" class="w-1/2 bg-slate-800 hover:bg-slate-700 text-white font-bold py-2.5 rounded-xl text-xs border border-slate-700">Log In</button>
                    <button onclick="handleSignup()" class="w-1/2 bg-emerald-600 hover:bg-emerald-500 text-black font-bold py-2.5 rounded-xl text-xs">Sign Up</button>
                </div>
            </div>

            <div id="logged-view" class="hidden space-y-3 text-xs">
                <div class="bg-slate-900 p-3 rounded-xl border border-slate-800">
                    <p class="text-slate-400">Logged in as:</p>
                    <p id="user-email-display" class="text-emerald-400 font-bold truncate"></p>
                </div>
                <button onclick="handleLogout()" class="w-full bg-red-600/20 text-red-400 border border-red-500/30 font-bold py-2 rounded-xl text-xs">Log Out</button>
            </div>
        </div>
    </div>

    <!-- Core Script -->
    <script>
        // آپ کی مصدقہ ویلیوز
        const supabaseUrl = 'https://tqgjjjkvwfrpxnlyezns.supabase.co';
        const supabaseKey = 'sb_publishable_VCD8NpnZSu_4L3MLy5ZmiQ_f7_8TVQz';

        // انتہائی صاف ستھرا انیشی‌یالائزیشن بغیر کسی پیچیدہ پیرامیٹر کے
        const { createClient } = supabase;
        const _supabase = createClient(supabaseUrl, supabaseKey);

        // پیج لوڈ ہوتے ہی سیشن چیک کریں
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const { data: { session } } = await _supabase.auth.getSession();
                if (session && session.user) {
                    showLoggedUser(session.user.email);
                }
            } catch (err) {
                console.error("Session error:", err);
            }
        });

        async function handleSignup() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!email || !password) {
                showToast('Email aur password likھein!');
                return;
            }

            showToast('Signing up...');
            const { data, error } = await _supabase.auth.signUp({ email, password });
            
            if (error) {
                alert("Error: " + error.message);
                showToast('Signup failed');
            } else {
                showToast('Account ban gaya! 🎉');
                if (data.user) showLoggedUser(data.user.email);
            }
        }

        async function handleLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!email || !password) {
                showToast('Email aur password likھein!');
                return;
            }

            showToast('Logging in...');
            const { data, error } = await _supabase.auth.signInWithPassword({ email, password });
            
            if (error) {
                alert("Error: " + error.message);
                showToast('Login failed');
            } else {
                showToast('Login successful! 🚀');
                if (data.user) showLoggedUser(data.user.email);
            }
        }

        async function handleLogout() {
            await _supabase.auth.signOut();
            location.reload();
        }

        function showLoggedUser(email) {
            document.getElementById('user-email-display').innerText = email;
            document.getElementById('form-view').classList.add('hidden');
            document.getElementById('logged-view').classList.remove('hidden');
            document.getElementById('nav-btn').innerText = email.split('@')[0];
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            t.classList.remove('opacity-0', 'pointer-events-none');
            t.classList.add('opacity-100');
            setTimeout(() => {
                t.classList.remove('opacity-100');
                t.classList.add('opacity-0', 'pointer-events-none');
            }, 3000);
        }

        function openAuthModal() {
            document.getElementById('auth-modal').classList.remove('hidden');
            document.getElementById('auth-modal').classList.add('flex');
        }
        function closeAuthModal() {
            document.getElementById('auth-modal').classList.remove('flex');
            document.getElementById('auth-modal').classList.add('hidden');
        }
    </script>
</body>
</html>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        zynix: {
                            bg: "#090d16",
                            card: "#111827",
                            cardHover: "#1f2937",
                            border: "#1e293b",
                            emerald: "#10b981",
                            blue: "#3b82f6",

                        }

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }

        ::-webkit-scrollbar-track {
            background: #090d16;
        }

        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }

        .scrollbar-none::-webkit-scrollbar {
            display: none;
        }

        .scrollbar-none {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @keyframes flyToWallet {
            0% {
                transform: scale(.5) translateX(0) rotate(0deg);
                opacity: 0;
            }
            20% {
                transform: scale(1.15) translateX(-15px) rotate(-5deg);
                opacity: 1;
            }
            80% {
                transform: scale(.8) translateY(-140px) translateX(80px) rotate(15deg);
                opacity: 1;
            }
            100% {
                transform: scale(.2) translateY(-220px) translateX(140px) rotate(30deg);
                opacity: 0;
            }
        }

        .dollar-bill-anim {
            animation: flyToWallet 1.2s cubic-bezier(.25,1,.5,1) forwards;
        }

        @keyframes pulseWallet {
            0% { transform: scale(1); }
            50% {
                transform: scale(1.08);
                box-shadow: 0 0 25px rgba(16,185,129,.7);
            }
            100% { transform: scale(1); }
        }

        .wallet-pulse {
            animation: pulseWallet .5s ease-in-out;
        }

        body {
            background: #090d16;
            color: #f8fafc;
            font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
        }

        button {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>

Z.escape = function(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
};

Z.getUserById = function(id) {
    return Z.DB.getUsers().find(u => u.id === id) || null;
};

Z.ensureWallet = function(user) {
    if (!user.wallet) {
        user.wallet = {
            cash: 0,
            bounty: 0,
            totalEarned: 0
        };
    }

    if (!Array.isArray(user.walletTransactions)) {
        user.walletTransactions = [];
    }

    if (!Array.isArray(user.bountySpentHistory)) {
        user.bountySpentHistory = [];
    }
};

Z.showToast = function(message) {
    const container = document.getElementById("toast-container");
    if (!container) return;

    const toast = document.createElement("div");

    toast.className =
        "bg-slate-900/95 border border-emerald-500/40 text-slate-100 px-4 py-2.5 rounded-xl text-xs shadow-2xl flex items-center space-x-2.5 pointer-events-auto max-w-md w-full";

    const icon = document.createElement("i");
    icon.className = "fa-solid fa-circle-check text-emerald-400 text-sm shrink-0";

    const text = document.createElement("span");
    text.className = "font-medium";
    text.textContent = message;

    toast.appendChild(icon);
    toast.appendChild(text);
    container.appendChild(toast);

    setTimeout(function() {
        toast.remove();
    }, 3500);
};

Z.triggerRewardAnimation = function(amount) {

    const header = document.querySelector("header");

    if (header) {
        header.classList.add("wallet-pulse");

        setTimeout(function() {
            header.classList.remove("wallet-pulse");
        }, 500);
    }

    const note = document.createElement("div");

    note.className =
        "fixed z-50 bg-gradient-to-r from-emerald-600 via-emerald-500 to-teal-500 text-white font-black px-3.5 py-2 rounded-xl text-xs shadow-2xl dollar-bill-anim border border-emerald-300 flex items-center space-x-1.5 pointer-events-none";

    note.style.right = "40px";
    note.style.top = "60px";

    const icon = document.createElement("i");
    icon.className = "fa-solid fa-money-bill-wave text-emerald-200 text-sm";

    const span = document.createElement("span");
    span.textContent = "+$" + Number(amount).toFixed(2) + " Note";

    note.appendChild(icon);
    note.appendChild(span);

    document.body.appendChild(note);

    setTimeout(function() {
        note.remove();
    }, 1300);
};

Z.RewardEngine = {

    calculateSplit: function(grossAmount) {
        const gross = Number(grossAmount) || 0;

        return {
            gross: gross,
            cash: Number((gross * 0.60).toFixed(4)),
            bounty: Number((gross * 0.40).toFixed(4))
        };
    },

    creditReward: function(user, grossAmount, reason) {

        if (!user) return false;

        Z.ensureWallet(user);

        const split = this.calculateSplit(grossAmount);

        user.wallet.cash += split.cash;
        user.wallet.bounty += split.bounty;
        user.wallet.totalEarned += split.gross;

        user.walletTransactions.unshift({
            id: "tx_" + Date.now(),
            date: new Date().toISOString(),
            type: reason,
            amount: split.gross,
            cash: split.cash,
            bounty: split.bounty,
            status: "Completed"
        });

        const users = Z.DB.getUsers();
        const index = users.findIndex(u => u.id === user.id);

        if (index !== -1) {
            users[index] = user;
            Z.DB.saveUsers(users);
        }

        Z.State.currentUser = user;

        Z.updateHeaderWallet();
        Z.triggerRewardAnimation(split.gross);

        Z.showToast(
            "Reward received: +$" +
            split.gross.toFixed(2) +
            " | Cash +$" +
            split.cash.toFixed(3) +
            " | Bounty +$" +
            split.bounty.toFixed(3)
        );

        return true;
    },

    processInteraction: function(contentOwnerId, interactionType, post) {

        if (!Z.State.currentUser) {
            Z.openAuthModal("login");
            Z.showToast("Please login to interact and earn rewards.");
            return false;
        }

        const actor = Z.State.currentUser;
        const users = Z.DB.getUsers();
        const owner = users.find(u => u.id === contentOwnerId);

        if (!owner) return false;

        if (owner.id === actor.id) {
            Z.showToast("You cannot earn rewards from your own content.");
            return false;
        }

        const actionKey =
            "zynix_action_" +
            actor.id +
            "_" +
            interactionType +
            "_" +
            (post && post.id ? post.id : owner.id);

        if (localStorage.getItem(actionKey)) {
            Z.showToast("You already completed this action.");
            return false;
        }

        const packageRules = Z.getPackageRules(actor.package);

        let rewardAmount = 0;

        if (interactionType === "like") {
            rewardAmount = packageRules.likeReward;
        } else {
            const bounty = owner.bountySettings || {};

            if (interactionType === "share") {
                rewardAmount = Number(bounty.share || 0.03);
            }

            if (interactionType === "follow") {
                rewardAmount = Number(bounty.follow || 0.03);
            }

            if (interactionType === "subscribe") {
                rewardAmount = Number(
                    bounty.subscribe ||
                    0.02
                );
            }

            if (interactionType === "circleJoin") {
                rewardAmount = Number(
                    bounty.circleJoin ||
                    0.03
                );
            }
        }

        if (rewardAmount <= 0) {
            localStorage.setItem(actionKey, "1");
            return true;
        }

        if (interactionType !== "like") {

            Z.ensureWallet(owner);

            if (owner.wallet.bounty < rewardAmount) {
                Z.showToast(
                    "Creator bounty balance is insufficient for this reward."
                );
                return false;
            }

            owner.wallet.bounty =
                Number(owner.wallet.bounty) -
                rewardAmount;

            owner.bountySpentHistory.unshift({
                id: "bspend_" + Date.now(),
                date: new Date().toISOString(),
                recipient: actor.name,
                action: interactionType,
                amount: rewardAmount,
                postId: post ? post.id : null
            });

            const ownerIndex =
                users.findIndex(u => u.id === owner.id);

            if (ownerIndex !== -1) {
                users[ownerIndex] = owner;
            }

            Z.DB.saveUsers(users);
        }

        localStorage.setItem(actionKey, "1");

        return this.creditReward(
            actor,
            rewardAmount,
            interactionType.toUpperCase() + " Reward"
        );
    }
};

Z.getPackageRules = function(pkg) {

    const rules = {
        Free: {
            likeReward: 0,
            dailyLimit: 1,
            referrals: 0
        },

        "$3": {
            likeReward: 0.01,
            dailyLimit: 3,
            referrals: 2
        },

        "$10": {
            likeReward: 0.01,
            dailyLimit: 5,
            referrals: 2
        },

        "$20": {
            likeReward: 0.01,
            dailyLimit: 10,
            referrals: 2
        },

        "$40": {
            likeReward: 0.01,
            dailyLimit: 20,
            referrals: 2
        },

        "$100": {
            likeReward: 0.02,
            dailyLimit: 999999,
            referrals: 3
        }
    };

    return rules[pkg] || rules.Free;
};

Z.getTodayKey = function() {
    const d = new Date();

    return (
        d.getFullYear() +
        "-" +
        String(d.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(d.getDate()).padStart(2, "0")
    );
};

Z.getDailyRewardCount = function() {

    if (!Z.State.currentUser) return 0;

    return Number(
        localStorage.getItem(
            "zynix_daily_rewards_" +
            Z.State.currentUser.id +
            "_" +
            Z.getTodayKey()
        ) || 0
    );
};

Z.incrementDailyReward = function() {

    if (!Z.State.currentUser) return;

    const key =
        "zynix_daily_rewards_" +
        Z.State.currentUser.id +
        "_" +
        Z.getTodayKey();

    const count = Z.getDailyRewardCount() + 1;

    localStorage.setItem(key, String(count));
};

Z.checkDailyLimit = function() {

    if (!Z.State.currentUser) return false;

    const rules =
        Z.getPackageRules(
            Z.State.currentUser.package
        );

    const count =
        Z.getDailyRewardCount();

    if (count >= rules.dailyLimit) {

        Z.showToast(
            "Daily reward interaction limit reached for your current package."
        );

        return false;
    }

    return true;
};

const originalProcessInteraction =
    Z.RewardEngine.processInteraction;

Z.RewardEngine.processInteraction =
    function(ownerId, type, post) {

        if (!Z.State.currentUser) {
            return originalProcessInteraction.call(
                Z.RewardEngine,
                ownerId,
                type,
                post
            );
        }

        if (!Z.checkDailyLimit()) {
            return false;
        }

        const result =
            originalProcessInteraction.call(
                Z.RewardEngine,
                ownerId,
                type,
                post
            );

        if (result) {
            Z.incrementDailyReward();
        }

        return result;
    };

Z.updateHeaderWallet = function() {

    const user = Z.State.currentUser;

    const cash =
        document.getElementById("header-cash");

    const bounty =
        document.getElementById("header-bounty");

    if (!user || !user.wallet) {

        if (cash) cash.textContent = "$0.00";
        if (bounty) bounty.textContent = "$0.00";

        return;
    }

    if (cash) {
        cash.textContent =
            "$" +
            Number(user.wallet.cash || 0).toFixed(2);
    }

    if (bounty) {
        bounty.textContent =
            "$" +
            Number(user.wallet.bounty || 0).toFixed(2);
    }
};

Z.handleAuthSubmit = function(mode) {

    const email =
        document.getElementById("auth-email")?.value.trim();

    const password =
        document.getElementById("auth-password")?.value.trim();

    if (!email || !password) {
        Z.showToast("Please fill in all required fields.");
        return;
    }

    let users = Z.DB.getUsers();

    if (mode === "login") {

        const user =
            users.find(
                u =>
                    u.email === email ||
                    u.username === email
            );

        if (!user) {
            Z.showToast(
                "User not found. Please check your login details."
            );
            return;
        }

        if (user.password && user.password !== password) {
            Z.showToast("Incorrect password.");
            return;
        }

        Z.DB.setCurrentUser(user);
        Z.closeModal();
        Z.showToast("Welcome back, " + user.name + "!");
        Z.showView("profile");

        return;
    }

    const name =
        document.getElementById("auth-name")?.value.trim() ||
        "New User";

    if (
        users.some(
            u =>
                u.email === email ||
                u.username === email
        )
    ) {
        Z.showToast(
            "An account with this email/username already exists."
        );
        return;
    }

    const newUser = {

        id: "usr_" + Date.now(),

        name: name,

        username:
            email
                .split("@")[0]
                .replace(/[^a-zA-Z0-9_]/g, ""),

        profession: "Creator",

        bio: "Joined ZYNIX ecosystem.",

        role: "Viewer",

        avatar:
            "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80",

        cover:
            "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=800&q=80",

        followers: 0,

        following: 0,

        package: "Free",

        bountySettings: {
            view: 0,
            like: 0.01,
            share: 0.03,
            follow: 0.03,
            subscribe: 0.02,
            circleJoin: 0.03
        },

        monthlySubscription: false,

        wallet: {
            cash: 0,
            bounty: 0,
            totalEarned: 0
        },

        walletTransactions: [],

        bountySpentHistory: [],

        referrals: {
            code: "ZYNIX-" + Date.now(),
            earnings: 0
        },

        referralNetwork: {
            level1: 0,
            level2: 0,
            level3: 0
        },

        email: email,

        password: password
    };

    users.push(newUser);

    Z.DB.saveUsers(users);
    Z.DB.setCurrentUser(newUser);

    Z.closeModal();

    Z.showToast(
        "Account created successfully. Welcome to ZYNIX!"
    );

    Z.showView("profile");
};

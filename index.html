     ::-webkit-scrollbar { width: 5px; height: 5px; }
     ::-webkit-scrollbar-track { background: #090d16; }
     ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
     ::-webkit-scrollbar-thumb:hover { background: #334155; }

    @keyframes flyToWalletPure {
     0% { transform: scale(0.6) translateX(0) rotate(0deg); opacity: 0; }
     20% { transform: scale(1.2) translateX(-20px) rotate(-10deg); opacity: 1; }

         80% { transform: scale(0.9) translateY(-160px) translateX(90px) rotate(20deg); opacity:
1; }
        100% { transform: scale(0.3) translateY(-250px) translateX(160px) rotate(45deg);
opacity: 0; }
     }
     .dollar-note-pure {
        animation: flyToWalletPure 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        background: transparent !important;
        box-shadow: none !important;
        border: none !important;
     }
     @keyframes pulseWallet {
        0% { transform: scale(1); }
        50% { transform: scale(1.15); box-shadow: 0 0 25px rgba(16, 185, 129, 0.7); }
        100% { transform: scale(1); }
     }
     .wallet-pulse {
        animation: pulseWallet 0.5s ease-in-out;
     }
     body { background-color: #090d16; color: #f8fafc; font-family: system-ui, -apple-system,
BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }

     // Central Reward & Bounty Engine Layer (Range $0.00 to $0.05 max per bounty)
     Z.RewardEngine = {
        calculateSplit: function(grossAmount) {
           const cash = Number((grossAmount * 0.60).toFixed(4));
           const bounty = Number((grossAmount * 0.40).toFixed(4));
           return { cash, bounty, gross: grossAmount };
        },
        creditReward: function(user, grossAmount, reason) {
           if (!user) return false;
           const split = this.calculateSplit(grossAmount);

          if (!user.wallet) {
              user.wallet = { cash: 0.00, bounty: 0.00, totalEarned: 0.00 };
          }
          if (!user.walletTransactions) user.walletTransactions = [];

          user.wallet.cash += split.cash;
          user.wallet.bounty += split.bounty;
          user.wallet.totalEarned += grossAmount;

          user.walletTransactions.unshift({
              id: 'tx_' + Date.now(),
              date: new Date().toISOString(),
              type: reason,
              amount: grossAmount,
              cash: split.cash,
              bounty: split.bounty,
              status: 'Completed'
          });

           Z.DB.saveUsers();
           Z.updateHeaderWallet();
           Z.triggerRewardAnimation(grossAmount);
           Z.showToast(`Reward received: +$${grossAmount.toFixed(2)} (+$${split.cash.toFixed(3)} Cash, +$${split.bounty.toFixed(3)} Bounty)`);
           return true;
       },
       processInteraction: function(contentOwnerId, interactionType, post) {
           if (!Z.State.currentUser) {
               Z.openAuthModal('login');
               Z.showToast('Please log in or sign up to earn rewards.');
               return false;
           }
           const users = Z.DB.getUsers();

          const contentOwner = users.find(u => u.id === contentOwnerId);
          if (!contentOwner) return false;

          if (contentOwner.id === Z.State.currentUser.id) {
              Z.showToast('You cannot earn rewards from your own content.');
              return false;
          }

          // Default bounds within $0.00 - $0.05
          const bountySettings = contentOwner.bountySettings || { like: 0.01, share: 0.03, follow:
0.03, subscribe: 0.02, circleJoin: 0.03 };
          let rewardAmount = bountySettings[interactionType] || 0.01;
          if (rewardAmount > 0.05) rewardAmount = 0.05; // Enforce max $0.05 limit

          if (!contentOwner.wallet) contentOwner.wallet = { cash: 5.00, bounty: 5.00,
totalEarned: 10.00 };
          if (contentOwner.wallet.bounty < rewardAmount) {
              Z.showToast('Creator bounty balance is insufficient for this reward.');
              return false;
          }

          contentOwner.wallet.bounty -= rewardAmount;
          if (!contentOwner.bountySpentHistory) contentOwner.bountySpentHistory = [];
          contentOwner.bountySpentHistory.unshift({
              id: 'bspend_' + Date.now(),
              date: new Date().toISOString(),
              recipient: Z.State.currentUser.name,
              action: interactionType,
              amount: rewardAmount
          });

           this.creditReward(Z.State.currentUser, rewardAmount,
`${interactionType.toUpperCase()} Reward`);
           Z.DB.saveUsers();
           return true;
         }
      };

     Z.triggerRewardAnimation = function(amount) {
        const walletEl = document.querySelector('header');
        if (!walletEl) return;

        const note = document.createElement('div');
        note.className = 'dollar-note-pure fixed text-3xl font-black text-emerald-400 z-[99999]
pointer-events-none';
        note.innerText = '$' + amount.toFixed(2);
        note.style.left = (window.innerWidth / 2 - 30) + 'px';
        note.style.top = (window.innerHeight / 2) + 'px';
        document.body.appendChild(note);

        walletEl.classList.remove('wallet-pulse');
        void walletEl.offsetWidth;
        walletEl.classList.add('wallet-pulse');

        setTimeout(() => note.remove(), 1300);
     };

     Z.showToast = function(message) {
        const container = document.getElementById('toast-container');
        if (!container) return;
        const el = document.createElement('div');
        el.className = 'bg-slate-800 border border-slate-700 text-white text-xs px-4 py-2.5 rounded-full
shadow-2xl';
        el.innerText = message;
        container.appendChild(el);
        setTimeout(() => el.remove(), 3200);
     };

        getCurrentUser: function() {

           if (!id) return null;
           return this.getUsers().find(u => u.id === id) || null;
        },
        setCurrentUser: function(user) {
           if (user) {

           } else {
              localStorage.removeItem('zynix_current_user');
              Z.State.currentUser = null;
           }
           Z.renderHeaderAuth();
           Z.updateHeaderWallet();
        }
     };

      Z.renderHeaderAuth = function() {
         const container = document.getElementById('header-auth-container');
         if (!container) return;
         const user = Z.State.currentUser;
         if (user) {
             container.innerHTML = `                 <div class="flex items-center space-x-2">                   <button type="button" onclick="Z.showView('profile')" class="flex items-center space-x-1.5 focus:outline-none">                      <img src="${user.avatar}" alt="${user.name}" class="w-7 h-7 rounded-full object-cover border border-emerald-500/50">                   </button>                   <button type="button" onclick="Z.logout()" class="w-7 h-7 rounded-full bg-slate-800 hover:bg-rose-500/20 text-slate-400 hover:text-rose-400 flex items-center justify-center transition" aria-label="Logout" title="Logout">                      <i class="fa-solid fa-power-off text-xs"></i>                   </button>                 </div>              `;

             container.innerHTML = `                 <button type="button" onclick="Z.openAuthModal('login')" class="bg-emerald-600 hover:bg-emerald-500 text-black font-bold text-xs px-3 py-1.5 rounded-full transition shadow-md">                       Login                    </button>               `;
          }
     };

     Z.updateHeaderWallet = function() {
        const user = Z.State.currentUser || Z.DB.getUsers()[0];
        const cashEl = document.getElementById('header-cash');
        const bountyEl = document.getElementById('header-bounty');
        if (cashEl && user && user.wallet) cashEl.innerText = '$' + user.wallet.cash.toFixed(2);
        if (bountyEl && user && user.wallet) bountyEl.innerText = '$' +
user.wallet.bounty.toFixed(2);
     };

    const users=Z.DB.getUsers(), owner=users.find(u=>u.id===ownerId);

    contentId=contentId || ownerId;
    const key=Z.actionKey(type,ownerId,contentId), logs=Z.getActionLog();
    if(logs[key]){ Z.showToast('You already completed this action.'); return false; }

    const pk=Z.packageKey(actor.package), rule=Z.packageRules[pk] || Z.packageRules['0'];
          let reward=Number((owner.bountySettings && owner.bountySettings[type]) || 0);
    if(type==='like' && owner.bountySettings && owner.bountySettings.like==null) reward=rule.likeReward;
    reward=Math.min(.05,Math.max(0,Number(reward)||0));

    // Apply the social action first, once only.
    let changed=false;
    if(type==='like'){
      const posts=Z.DB.getPosts(), p=posts.find(x=>x.id===contentId);
      if(p){ p.reactions=p.reactions||{}; p.reactions.heart=Number(p.reactions.heart||0)+1; Z.DB.savePosts(posts); changed=true; }
      else {

        if(s){ s.likes=Number(s.likes||0)+1; Z.DB.saveSparks(sparks); changed=true; }
      }
    } else if(type==='share'){
      const posts=Z.DB.getPosts(), p=posts.find(x=>x.id===contentId);
      if(p){ p.shares=Number(p.shares||0)+1; Z.DB.savePosts(posts); changed=true; }
      else { const sparks=Z.DB.getSparks(), s=sparks.find(x=>x.id===contentId); if(s){ s.shares=Number(s.shares||0)+1; Z.DB.saveSparks(sparks); changed=true; } }
    } else if(type==='follow'){
      actor.following=Array.isArray(actor.following)?actor.following:[];
      if(!actor.following.includes(owner.id)){ actor.following.push(owner.id); owner.followers=Number(owner.followers||0)+1; changed=true; }
      else { Z.showToast('You already follow this creator.'); return false; }
      Z.DB.saveUsers(users);
    } else if(type==='circleJoin'){
      const circles=Z.DB.getCircles(), c=circles.find(x=>x.id===contentId);

        else { Z.showToast('You already joined this circle.'); return false; }
      }
    }
    if(!changed && (type==='like'||type==='share')){ Z.showToast('Content could not be updated.'); return false; }

    let rewarded=false;
    if(pk==='0'){
      Z.markAction(key,type,ownerId,contentId,false);
      Z.showToast(type==='like' ? 'Like added. Free accounts do not earn like rewards.' : 'Action completed. Upgrade to earn rewards.');
      Z.refreshCurrentView(); return true;
    }
    if(rule.daily>0 && Z.dailyRewardCount(actor)>=rule.daily){
      Z.markAction(key,type,ownerId,contentId,false);
      Z.showToast('Daily earning limit reached for your package.'); Z.refreshCurrentView(); return true;
    }
    if(reward>0 && Number(owner.wallet?.bounty||0)>=reward){

      owner.bountySpentHistory=owner.bountySpentHistory||[];

  Z.submitNewSpark=function(){ const cap=document.getElementById('spark-caption')?.value.trim(), url=document.getElementById('spark-video')?.value.trim(), tags=(document.getElementById('spark-tags')?.value||'').split(',').map(x=>x.trim()).filter(Boolean), file=document.getElementById('spark-file')?.files?.[0]; if(!cap || (!url&&!file)){Z.showToast('Add a caption and choose a video URL or file.');return;} const finish=video=>{const s=Z.DB.getSparks();s.unshift({id:'spark_'+Date.now(),authorId:Z.State.currentUser.id,caption:cap,tags,videoUrl:video,likes:0,commentsCount:0,shares:0,createdAt:new Date().toISOString()});Z.DB.saveSparks(s);Z.closeModal();Z.showToast('Spark published successfully!');Z.showView('spark');}; if(file){const r=new FileReader();r.onload=()=>finish(r.result);r.readAsDataURL(file);}else finish(url); };

  Z.openCreateStatusModal=function(){ if(!Z.State.currentUser){Z.openAuthModal('login');return;} const m=document.getElementById('modal-container'); m.innerHTML=`<div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4"><div class="bg-[#111827] border border-slate-800 rounded-2xl w-full max-w-md p-6 space-y-4 shadow-2xl"><div class="flex justify-between items-center border-b border-slate-800 pb-3"><h3 class="font-bold text-base text-white">Create Status (24h)</h3><button type="button" onclick="Z.closeModal()" class="text-slate-400"><i class="fa-solid fa-xmark text-lg"></i></button></div><textarea id="status-content" rows="7" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white" placeholder="What's happening right now?"></textarea><button type="button" onclick="document.getElementById('status-file').click()" class="w-full bg-slate-900 border border-slate-800 text-slate-300 font-bold py-2.5 rounded-xl text-xs"><i class="fa-solid fa-image mr-1"></i> Add Picture / Video</button><input id="status-file" type="file" accept="image/*,video/*" class="hidden" onchange="Z.previewStatusFile(this)"><p id="status-file-name" class="text-[10px] text-slate-500"></p><button type="button" onclick="Z.submitNewStatus()" class="w-full bg-emerald-600 text-black font-bold py-2.5 rounded-xl text-xs">Publish Status</button></div></div>`; setTimeout(()=>document.getElementById('status-content')?.focus(),50); };

  Z.submitNewStatus=function(){ const content=document.getElementById('status-content')?.value.trim(), file=document.getElementById('status-file')?.files?.[0]; if(!content&&!file){Z.showToast('Please enter status text or add media.');return;} const save=media=>{const sts=Z.DB.getStatuses().filter(s=>!s.expiresAt||s.expiresAt>Date.now());sts.unshift({id:'st_'+Date.now(),authorId:Z.State.currentUser.id,content:content||'',media:media||'',createdAt:new Date().toISOString(),expiresAt:Date.now()+24*60*60*1000});Z.DB.saveStatuses(sts);Z.closeModal();Z.showToast('Status published for 24 hours.');Z.showView('home');}; if(file){const r=new FileReader();r.onload=()=>save(r.result);r.readAsDataURL(file);}else save(''); };

  // ---------- Packages / calculator / analytics / withdrawal ----------
  Z.upgradePackage=function(key){ const u=Z.State.currentUser; if(!u){Z.openAuthModal('login');return;} const rule=Z.packageRules[key]; if(!rule)return; const current=Z.packageRules[Z.packageKey(u.package)]; if(rule.price<=current.price){Z.showToast('You already have this package or a higher tier.');return;} if(rule.price>0 && Number(u.wallet.cash||0)+Number(u.wallet.bounty||0)<rule.price){Z.showToast('Insufficient earnings for this upgrade.');return;} let remaining=rule.price; const fromB=Math.min(Number(u.wallet.bounty||0),remaining);u.wallet.bounty-=fromB;remaining-=fromB;u.wallet.cash-=Math.max(0,remaining);u.package=rule.name;Z.DB.saveUsers();Z.showToast(rule.name+' activated.');Z.showView('packages'); };
  Z.renderPackagesPatched=function(){ const u=Z.State.currentUser, cur=Z.packageRules[Z.packageKey(u?.package)]; return `<div class="space-y-4"><div class="flex items-center space-x-2 px-1"><button type="button" onclick="Z.showView('profile')" class="text-slate-400"><i class="fa-solid fa-arrow-left"></i></button><h2 class="font-black text-sm text-white">ZYNIX Membership Packages</h2></div>${Object.entries(Z.packageRules).map(([k,r])=>{const active=cur&&r.price===cur.price;return `<div class="bg-[#111827] border ${active?'border-emerald-500/50':'border-slate-800'} p-4 rounded-2xl space-y-2"><div class="flex justify-between"><h3 class="font-bold text-sm text-white">${r.name}</h3><span class="text-xs text-emerald-400">$${r.price}</span></div><p class="text-xs text-slate-300">${k==='0'?'Browse, post and interact. No reward earning from likes.':`Earn up to ${r.daily>1000?'high/unlimited':r.daily} rewarded interactions/day. Like reward tier up to $${r.likeReward.toFixed(2)}.`}</p><button type="button" ${active?'disabled':''} onclick="Z.upgradePackage('${k}')" class="w-full ${active?'bg-slate-800 text-slate-400':'bg-emerald-600 text-black'} font-bold py-2 rounded-xl text-xs">${active?'Current Plan':'Upgrade to '+r.name}</button></div>`}).join('')}</div>`; };
  Z.calculateEstimate=function(){ const input=document.getElementById('calc-interactions'); const out=document.getElementById('calc-output'); if(!input||!out)return; const n=Math.max(0,Number(input.value)||0), u=Z.State.currentUser, r=Z.packageRules[Z.packageKey(u?.package)]||Z.packageRules['0']; const eligible=Math.min(n,r.daily); const gross=eligible*r.likeReward, split=Z.RewardEngine.calculateSplit(gross); out.innerHTML=`<span class="text-[10px] text-slate-400 block">Estimated Gross Return: <strong class="text-emerald-400">$${gross.toFixed(2)} / day</strong></span><span class="text-[10px] text-slate-500 block">${eligible} eligible interactions • Split: $${split.cash.toFixed(3)} Cash | $${split.bounty.toFixed(3)} Bounty</span>`; };
  Z.renderCalculatorPatched=function(){return `<div class="bg-[#111827] border border-slate-800 rounded-2xl p-4 space-y-4 shadow-2xl"><div class="flex items-center space-x-2 border-b border-slate-800 pb-3"><button type="button" onclick="Z.showView('profile')" class="text-slate-400"><i class="fa-solid fa-arrow-left"></i></button><h3 class="font-bold text-sm text-white">Reward & Earnings Calculator</h3></div><p class="text-xs text-slate-400">Estimate rewards using your current package and daily limit.</p><input type="number" min="0" id="calc-interactions" value="10" oninput="Z.calculateEstimate()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"><div id="calc-output" class="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-1"></div></div>`;};
  Z.renderAnalyticsPatched=function(){const u=Z.State.currentUser;if(!u)return `<div class="text-center text-xs text-slate-500">Login required.</div>`;const posts=Z.DB.getPosts().filter(p=>p.authorId===u.id),sparks=Z.DB.getSparks().filter(s=>s.authorId===u.id);const likes=posts.reduce((n,p)=>n+Number(p.reactions?.heart||0),0)+sparks.reduce((n,s)=>n+Number(s.likes||0),0);const spent=(u.bountySpentHistory||[]).reduce((n,x)=>n+Number(x.amount||0),0);return `<div class="bg-[#111827] border border-slate-800 rounded-2xl p-4 space-y-4 shadow-2xl"><div class="flex items-center space-x-2 border-b border-slate-800 pb-3"><button type="button" onclick="Z.showView('profile')" class="text-slate-400"><i class="fa-solid fa-arrow-left"></i></button><h3 class="font-bold text-sm text-white">Creator Analytics</h3></div><div class="grid grid-cols-2 gap-3"><div class="bg-slate-950 p-3 rounded-xl border border-slate-800"><span class="text-[10px] text-slate-400 block">Posts</span><span class="text-base font-black text-white">${posts.length}</span></div><div class="bg-slate-950 p-3 rounded-xl border border-slate-800"><span class="text-[10px] text-slate-400 block">Likes</span><span class="text-base font-black text-emerald-400">${likes}</span></div><div class="bg-slate-950 p-3 rounded-xl border border-slate-800"><span class="text-[10px] text-slate-400 block">Sparks</span><span class="text-base font-black text-blue-400">${sparks.length}</span></div><div class="bg-slate-950 p-3 rounded-xl border border-slate-800"><span class="text-[10px] text-slate-400 block">Bounty Spent</span><span class="text-base font-black text-purple-400">$${spent.toFixed(2)}</span></div></div></div>`;};
  Z.requestWithdrawal=function(){const u=Z.State.currentUser;if(!u)return;const amount=Number(u.wallet?.cash||0);if(amount<=0){Z.showToast('No withdrawable cash balance available.');return;}u.withdrawalRequests=u.withdrawalRequests||[];u.withdrawalRequests.unshift({id:'wd_'+Date.now(),amount,date:new Date().toISOString(),status:'Pending'});u.wallet.cash=0;Z.DB.saveUsers();Z.showToast('Cash withdrawal request submitted. Status: Pending.');Z.showView('wallet');};
  const oldWallet=Z.Views.renderWallet; Z.Views.renderWallet=function(){const html=oldWallet.call(Z.Views); return html.replace("onclick=\"Z.showToast('Withdrawal request submitted successfully.')\"","onclick=\"Z.requestWithdrawal()\"");};

  // ---------- Preserve original view routing, only swap patched views ----------
  const originalShow=Z.showView;
  Z.showView=function(viewName){
    if(viewName==='home'){Z.State.currentView='home';window.scrollTo({top:0,behavior:'smooth'});document.querySelectorAll('[id^="nav-btn-"]').forEach(b=>b.classList.remove('text-emerald-400'));document.getElementById('nav-btn-home')?.classList.add('text-emerald-400');document.getElementById('app-container').innerHTML=Z.renderHomePatched();return;}
    if(viewName==='spark'){Z.State.currentView='spark';window.scrollTo({top:0,behavior:'smooth'});document.querySelectorAll('[id^="nav-btn-"]').forEach(b=>b.classList.remove('text-emerald-400'));document.getElementById('nav-btn-spark')?.classList.add('text-emerald-400');document.getElementById('app-container').innerHTML=Z.renderSparkStreamPatched();return;}
    if(viewName==='people'){Z.State.currentView='people';window.scrollTo({top:0,behavior:'smooth'});document.querySelectorAll('[id^="nav-btn-"]').forEach(b=>b.classList.remove('text-emerald-400'));document.getElementById('nav-btn-people')?.classList.add('text-emerald-400');document.getElementById('app-container').innerHTML=Z.renderPeoplePatched();return;}
    if(viewName==='packages'){document.getElementById('app-container').innerHTML=Z.renderPackagesPatched();Z.State.currentView='packages';return;}
    if(viewName==='calculator'){document.getElementById('app-container').innerHTML=Z.renderCalculatorPatched();Z.State.currentView='calculator';Z.calculateEstimate();return;}

    originalShow.call(Z,viewName);

        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
        
        @keyframes flyToWalletPure {
            0% { transform: scale(0.6) translateX(0) rotate(0deg); opacity: 0; }
            20% { transform: scale(1.2) translateX(-20px) rotate(-10deg); opacity: 1; }
            80% { transform: scale(0.9) translateY(-160px) translateX(90px) rotate(20deg); opacity: 1; }
            100% { transform: scale(0.3) translateY(-250px) translateX(160px) rotate(45deg); opacity: 0; }
        }
        .dollar-note-pure {
            animation: flyToWalletPure 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            background: transparent !important;
            box-shadow: none !important;
            border: none !important;
        }
        @keyframes pulseWallet {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); box-shadow: 0 0 25px rgba(16, 185, 129, 0.7); }
            100% { transform: scale(1); }
        }
        .wallet-pulse {
            animation: pulseWallet 0.5s ease-in-out;
        }
        body { background-color: #090d16; color: #f8fafc; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }

    <script>
        window.Z = {};

        // XSS Sanitization Helper (BUG #33 FIX)
        Z.escapeHtml = function(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        };

        Z.State = {
            currentUser: null, // Default set strictly to null (BUG #25 FIX)
            currentView: 'home',
            circleSearchQuery: '',
            sparkTagFilter: ''
        };

        // Package Rule System Specification (BUG #3 & #17 & #19 FIX)
        Z.Packages = {
            'Free': { name: 'Free', price: 0, dailyLimit: 0, canEarn: false, likeRewardRate: 0 },
            'Starter $3': { name: 'Starter $3', price: 3, dailyLimit: 10, canEarn: true, likeRewardRate: 0.01 },
            'Growth $10': { name: 'Growth $10', price: 10, dailyLimit: 25, canEarn: true, likeRewardRate: 0.015 },
            'Creator $20': { name: 'Creator $20', price: 20, dailyLimit: 50, canEarn: true, likeRewardRate: 0.02 },
            'Pro $40': { name: 'Pro $40', price: 40, dailyLimit: 100, canEarn: true, likeRewardRate: 0.02 },
            'Enterprise $100': { name: 'Enterprise $100', price: 100, dailyLimit: 500, canEarn: true, likeRewardRate: 0.025 }
        };

        // Central Reward & Bounty Engine
        Z.RewardEngine = {
            calculateSplit: function(grossAmount) {
                const cash = Number((grossAmount * 0.60).toFixed(4));
                const bounty = Number((grossAmount * 0.40).toFixed(4));
                return { cash, bounty, gross: grossAmount };
            },
            
            // Check Daily Limits (BUG #19 FIX)
            checkDailyLimit: function(user) {
                const today = new Date().toISOString().split('T')[0];
                if (!user.dailyTracker || user.dailyTracker.date !== today) {
                    user.dailyTracker = { date: today, count: 0 };
                }
                const pkg = Z.Packages[user.package || 'Free'] || Z.Packages['Free'];
                return {
                    allowed: user.dailyTracker.count < pkg.dailyLimit,
                    current: user.dailyTracker.count,
                    limit: pkg.dailyLimit
                };
            },

            creditReward: function(user, grossAmount, reason) {
                if (!user) return false;
                const split = this.calculateSplit(grossAmount);
                
                if (!user.wallet) user.wallet = { cash: 0.00, bounty: 0.00, totalEarned: 0.00 };
                if (!user.walletTransactions) user.walletTransactions = [];
                
                user.wallet.cash += split.cash;
                user.wallet.bounty += split.bounty;
                user.wallet.totalEarned += grossAmount;
                
                user.walletTransactions.unshift({
                    id: 'tx_' + Date.now(),
                    date: new Date().toISOString(),
                    type: reason,
                    amount: grossAmount,
                    cash: split.cash,
                    bounty: split.bounty,
                    status: 'Completed'
                });
                
                Z.DB.saveUsers();
                Z.updateHeaderWallet();
                Z.triggerRewardAnimation(grossAmount);
                Z.showToast(`Reward: +$${grossAmount.toFixed(2)} (+$${split.cash.toFixed(3)} Cash, +$${split.bounty.toFixed(3)} Bounty)`);
                return true;
            },

            processInteraction: function(contentOwnerId, interactionType, targetId) {
                // Check Authentication
                if (!Z.State.currentUser) {
                    Z.openAuthModal('login');
                    Z.showToast('Please log in to participate and earn rewards.');
                    return false;
                }

                const currentUser = Z.DB.getUserById(Z.State.currentUser.id);
                const pkg = Z.Packages[currentUser.package || 'Free'] || Z.Packages['Free'];

                // Package Eligibility Check (BUG #3 FIX)
                if (!pkg.canEarn) {
                    Z.showToast('Free Package users cannot earn interaction rewards. Please upgrade package!');
                    return false;
                }

                // Daily Limit Check (BUG #19 FIX)
                const limitStatus = this.checkDailyLimit(currentUser);
                if (!limitStatus.allowed) {
                    Z.showToast(`Daily limit reached (${limitStatus.limit}/${limitStatus.limit}). Upgrade package for more!`);
                    return false;
                }

                const contentOwner = Z.DB.getUserById(contentOwnerId);
                if (!contentOwner) return false;

                if (contentOwner.id === currentUser.id) {
                    Z.showToast('You cannot earn rewards from your own content or profile.');
                    return false;
                }

                // Anti-Duplicate Protection (BUG #4, #5, #6, #7, #8 FIX)
                if (!currentUser.interactionHistory) currentUser.interactionHistory = {};
                const actionKey = `${interactionType}_${targetId || contentOwnerId}`;
                if (currentUser.interactionHistory[actionKey]) {
                    Z.showToast(`You have already received a reward for this ${interactionType}.`);
                    return false;
                }

                // Creator Bounty Calculation & Bounds ($0.00 to $0.05)
                const bountySettings = contentOwner.bountySettings || { like: 0.01, share: 0.03, follow: 0.03, subscribe: 0.02, circleJoin: 0.03 };
                let rewardAmount = bountySettings[interactionType] || 0.01;
                if (rewardAmount > 0.05) rewardAmount = 0.05;

                if (!contentOwner.wallet) contentOwner.wallet = { cash: 0.00, bounty: 0.00, totalEarned: 0.00 };
                if (contentOwner.wallet.bounty < rewardAmount) {
                    Z.showToast('Creator bounty balance is insufficient for this reward.');
                    return false;
                }

                // Deduct Creator Bounty
                contentOwner.wallet.bounty -= rewardAmount;
                if (!contentOwner.bountySpentHistory) contentOwner.bountySpentHistory = [];
                contentOwner.bountySpentHistory.unshift({
                    id: 'bspend_' + Date.now(),
                    date: new Date().toISOString(),
                    recipient: currentUser.name,
                    action: interactionType,
                    amount: rewardAmount
                });

                // Update Interaction Real Data Counters (BUG #4, #5, #6, #8 FIX)
                if (interactionType === 'like') {
                    const post = Z.DB.getPosts().find(p => p.id === targetId);
                    if (post) {
                        if (!post.reactions) post.reactions = { heart: 0 };
                        post.reactions.heart++;
                        Z.DB.savePosts();
                    }
                } else if (interactionType === 'share') {
                    const post = Z.DB.getPosts().find(p => p.id === targetId);
                    if (post) {
                        post.shares = (post.shares || 0) + 1;
                        Z.DB.savePosts();
                    }
                } else if (interactionType === 'spark_like') {
                    const spark = Z.DB.getSparks().find(s => s.id === targetId);
                    if (spark) {
                        spark.likes = (spark.likes || 0) + 1;
                        Z.DB.saveSparks();
                    }
                } else if (interactionType === 'follow') {
                    contentOwner.followers = (contentOwner.followers || 0) + 1;
                    if (!currentUser.following) currentUser.following = [];
                    if (!currentUser.following.includes(contentOwner.id)) currentUser.following.push(contentOwner.id);
                }

                // Record Interaction Key & Increment Daily Limit Counter
                currentUser.interactionHistory[actionKey] = new Date().toISOString();
                currentUser.dailyTracker.count++;

                Z.DB.saveUsers();
                this.creditReward(currentUser, rewardAmount, `${interactionType.toUpperCase()} Reward`);
                
                // Refresh View if active
                if (['home', 'spark', 'people', 'circles'].includes(Z.State.currentView)) {
                    Z.showView(Z.State.currentView);
                }
                return true;
            }
        };

        Z.triggerRewardAnimation = function(amount) {
            const walletEl = document.querySelector('header');
            if (walletEl) {
                walletEl.classList.add('wallet-pulse');
                setTimeout(() => walletEl.classList.remove('wallet-pulse'), 500);
            }
            const floatingNote = document.createElement('div');
            floatingNote.className = 'fixed z-50 text-emerald-400 font-black text-2xl dollar-note-pure pointer-events-none flex items-center space-x-1';
            floatingNote.style.right = '50px';
            floatingNote.style.top = '70px';
            floatingNote.innerHTML = `<i class="fa-solid fa-money-bill-wave text-emerald-400 drop-shadow-[0_4px_12px_rgba(16,185,129,0.8)]"></i><span class="text-xs font-bold text-emerald-300 drop-shadow">+$${amount.toFixed(2)}</span>`;
            document.body.appendChild(floatingNote);
            setTimeout(() => floatingNote.remove(), 1200);
        };

        Z.showToast = function(message) {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = 'bg-slate-900/95 border border-emerald-500/40 text-slate-100 px-4 py-2.5 rounded-xl text-xs shadow-2xl flex items-center space-x-2.5 pointer-events-auto transition transform translate-y-4 opacity-0 max-w-md w-full backdrop-blur-md';
            toast.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400 text-sm shrink-0"></i><span class="font-medium">${Z.escapeHtml(message)}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-4', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'transition', 'duration-300');
                setTimeout(() => toast.remove(), 300);
            }, 3200);
        };

        // Unified Data Layer (BUG #24 & Single Source of Truth FIX)
        Z.DB = {
            getUsers: function() {
                const data = localStorage.getItem('zynix_users');
                if (!data) return Z.SeedData.users;
                return JSON.parse(data);
            },
            getUserById: function(id) {
                const users = this.getUsers();
                return users.find(u => u.id === id) || null;
            },
            saveUsers: function(usersArray) {
                if (usersArray) {
                    localStorage.setItem('zynix_users', JSON.stringify(usersArray));
                } else {
                    // Update state if current user exists in array
                    const currentUsers = this.getUsers();
                    if (Z.State.currentUser) {
                        const idx = currentUsers.findIndex(u => u.id === Z.State.currentUser.id);
                        if (idx !== -1) {
                            currentUsers[idx] = Z.State.currentUser;
                        }
                    }
                    localStorage.setItem('zynix_users', JSON.stringify(currentUsers));
                }
                // Sync current state
                if (Z.State.currentUser) {
                    const fresh = this.getUserById(Z.State.currentUser.id);
                    if (fresh) Z.State.currentUser = fresh;
                }
            },
            getCurrentUser: function() {
                const id = localStorage.getItem('zynix_current_user_id');
                if (!id) return null; // No default forced login (BUG #25 FIX)
                return this.getUserById(id);
            },
            setCurrentUser: function(user) {
                if (user) {
                    localStorage.setItem('zynix_current_user_id', user.id);
                    Z.State.currentUser = user;
                } else {
                    localStorage.removeItem('zynix_current_user_id');
                    Z.State.currentUser = null;
                }
                Z.renderHeaderAuth();
                Z.updateHeaderWallet();
            },
            getPosts: function() {
                const data = localStorage.getItem('zynix_posts');
                if (!data) return Z.SeedData.posts;
                return JSON.parse(data);
            },
            savePosts: function(posts) {
                localStorage.setItem('zynix_posts', JSON.stringify(posts));
            },
            getSparks: function() {
                const data = localStorage.getItem('zynix_sparks');
                if (!data) return Z.SeedData.sparks;
                return JSON.parse(data);
            },
            saveSparks: function(sparks) {
                localStorage.setItem('zynix_sparks', JSON.stringify(sparks));
            },
            getStatuses: function() {
                const data = localStorage.getItem('zynix_statuses');
                let list = data ? JSON.parse(data) : Z.SeedData.statuses;
                // 24-Hour Expiry Logic Filter (BUG #10 FIX)
                const now = Date.now();
                return list.filter(st => !st.timestamp || (now - st.timestamp < 86400000));
            },
            saveStatuses: function(statuses) {
                localStorage.setItem('zynix_statuses', JSON.stringify(statuses));
            },
            getCircles: function() {
                const data = localStorage.getItem('zynix_circles');
                if (!data) return Z.SeedData.circles;
                return JSON.parse(data);
            },
            saveCircles: function(circles) {
                localStorage.setItem('zynix_circles', JSON.stringify(circles));
            }
        };

        Z.handleAuthSubmit = function(mode) {
            const emailInput = document.getElementById('auth-email').value.trim();
            const passInput = document.getElementById('auth-password').value.trim();
            
            if (!emailInput || !passInput) {
                Z.showToast('Please fill in all required fields.');
                return;
            }

            let users = Z.DB.getUsers();

            if (mode === 'login') {
                // Strict Password Checking (BUG #1 FIX)
                const found = users.find(u => 
                    (u.email.toLowerCase() === emailInput.toLowerCase() || u.username.toLowerCase() === emailInput.toLowerCase()) && 
                    u.password === passInput
                );

                if (found) {
                    Z.DB.setCurrentUser(found);
                    Z.closeModal();
                    Z.showToast(`Welcome back, ${found.name}!`);
                    Z.showView('profile');
                } else {
                    Z.showToast('Invalid email/username or password.');
                }
            } else {
                // Check existing username/email
                if (users.some(u => u.email.toLowerCase() === emailInput.toLowerCase())) {
                    Z.showToast('Account with this email already exists.');
                    return;
                }

                const nameInput = document.getElementById('auth-name').value.trim() || 'New Creator';
                const refCodeInput = document.getElementById('auth-refcode') ? document.getElementById('auth-refcode').value.trim() : '';
                
                // Find Referrer User
                let referrerId = null;
                if (refCodeInput) {
                    const refUser = users.find(u => u.referrals && u.referrals.code.toUpperCase() === refCodeInput.toUpperCase());
                    if (refUser) referrerId = refUser.id;
                }

                const uniqueCode = 'ZYNIX-' + Math.random().toString(36).substring(2, 8).toUpperCase();
                
                // Signup Free User Wallet Initialized to $0.00 (BUG #2 FIX)
                const newUser = {
                    id: 'usr_' + Date.now(),
                    name: nameInput,
                    username: emailInput.split('@')[0],
                    profession: 'Creator',
                    bio: 'Joined ZYNIX ecosystem.',
                    role: 'Viewer',
                    avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80',
                    cover: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=800&q=80',
                    followers: 0,
                    package: 'Free',
                    bountySettings: { like: 0.01, share: 0.03, follow: 0.03, subscribe: 0.02, circleJoin: 0.03 },
                    wallet: { cash: 0.00, bounty: 0.00, totalEarned: 0.00 },
                    walletTransactions: [],
                    bountySpentHistory: [],
                    referrals: { code: uniqueCode, earnings: 0.00, referredBy: referrerId },
                    email: emailInput,
                    password: passInput,
                    interactionHistory: {}

                Z.DB.setCurrentUser(newUser);

                Z.showToast(`Account created successfully on Free Package!`);
                Z.showView('profile');

        Z.submitNewSpark = function() {
            const caption = document.getElementById('spark-caption').value.trim();
            const tagsRaw = document.getElementById('spark-tags').value.trim();
            const videoUrlInput = document.getElementById('spark-video-url').value.trim();
            const videoFileInput = document.getElementById('spark-video-file');

            if (!caption) {
                Z.showToast('Please write a caption for your Spark.');
                return;
            }

            const tags = tagsRaw ? tagsRaw.split(',').map(t => t.trim().replace(/^#/, '')) : ['zynix'];

            const processSave = (finalVideoUrl) => {
                const sparks = Z.DB.getSparks();
                sparks.unshift({
                    id: 'spark_' + Date.now(),
                    authorId: Z.State.currentUser.id,
                    caption: caption,
                    videoUrl: finalVideoUrl || 'https://assets.mixkit.co/videos/preview/mixkit-digital-animation-of-screens-and-code-31910-large.mp4',
                    likes: 0,
                    tags: tags,
                    comments: [],
                    shares: 0
                });
                Z.DB.saveSparks(sparks);
                Z.closeModal();
                Z.showToast('Spark published successfully!');
                Z.showView('spark');
            };

            if (videoFileInput && videoFileInput.files && videoFileInput.files[0]) {
                const file = videoFileInput.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    processSave(e.target.result);
                };
                reader.readAsDataURL(file);
            } else if (videoUrlInput) {
                processSave(videoUrlInput);
            } else {
                Z.showToast('Please provide a Video URL or upload a video file.');
            }
        };

            const text = document.getElementById('comment-input').value.trim();
            if (!text) return;

            if (type === 'post') {
                const posts = Z.DB.getPosts();
                const post = posts.find(p => p.id === itemId);
                if (post) {
                    if (!post.comments) post.comments = [];
                    post.comments.push({ id: 'c_' + Date.now(), author: Z.State.currentUser.name, text: text, time: 'Just now' });
                    Z.DB.savePosts(posts);
                }
            } else if (type === 'spark') {
                const sparks = Z.DB.getSparks();
                const spark = sparks.find(s => s.id === itemId);
                if (spark) {
                    if (!spark.comments) spark.comments = [];
                    spark.comments.push({ id: 'sc_' + Date.now(), author: Z.State.currentUser.name, text: text });
                    Z.DB.saveSparks(sparks);
                }

        Z.submitWithdrawal = function() {
            const user = Z.DB.getUserById(Z.State.currentUser.id);
            const amount = parseFloat(document.getElementById('withdraw-amount').value) || 0;
            const method = document.getElementById('withdraw-method').value;
            const details = document.getElementById('withdraw-details').value.trim();

            if (amount < 10) {
                Z.showToast('Minimum withdrawal amount is $10.00');
                return;
            }
            if (user.wallet.cash < amount) {
                Z.showToast('Insufficient Cash Balance for this withdrawal.');
                return;
            }
            if (!details) {
                Z.showToast('Please enter account or wallet details.');
                return;
            }

            user.wallet.cash -= amount;
            if (!user.walletTransactions) user.walletTransactions = [];
            user.walletTransactions.unshift({
                id: 'wd_' + Date.now(),
                date: new Date().toISOString(),
                type: `Withdrawal Request (${method})`,
                amount: -amount,
                cash: -amount,
                bounty: 0,
                status: 'Pending Admin Audit'
            });

            Z.DB.saveUsers();
            Z.closeModal();
            Z.showToast(`Withdrawal request for $${amount.toFixed(2)} submitted to Admin!`);
            Z.showView('wallet');
        };

            // Real Package Upgrade & Multi-Level Referral Commissions Engine
            upgradePackage: function(pkgName, price) {
                if (!Z.State.currentUser) { Z.openAuthModal('login'); return; }
                const user = Z.DB.getUserById(Z.State.currentUser.id);

                if (user.wallet.cash < price) {
                    Z.showToast(`Insufficient Cash Balance ($${user.wallet.cash.toFixed(2)}). Please add funds to upgrade.`);
                    return;
                }

                // Deduct cash balance & change package
                user.wallet.cash -= price;
                user.package = pkgName;

                if (!user.walletTransactions) user.walletTransactions = [];
                user.walletTransactions.unshift({
                    id: 'pkg_' + Date.now(),
                    date: new Date().toISOString(),
                    type: `Package Upgrade to ${pkgName}`,
                    amount: -price,
                    cash: -price,
                    bounty: 0,
                    status: 'Completed'
                });

                // Multi-Level Referral Commission Payout System (BUG #20 FIX)
                const users = Z.DB.getUsers();
                if (user.referrals && user.referrals.referredBy) {
                    // Level 1 Referrer (30% commission)
                    const refL1 = users.find(u => u.id === user.referrals.referredBy);
                    if (refL1) {
                        const commL1 = Number((price * 0.30).toFixed(2));
                        if (!refL1.wallet) refL1.wallet = { cash: 0, bounty: 0, totalEarned: 0 };
                        refL1.wallet.cash += commL1;
                        if (!refL1.referrals) refL1.referrals = { earnings: 0 };
                        refL1.referrals.earnings += commL1;

                        // Level 2 Referrer (15% commission)
                        if (refL1.referrals.referredBy) {
                            const refL2 = users.find(u => u.id === refL1.referrals.referredBy);
                            if (refL2) {
                                const commL2 = Number((price * 0.15).toFixed(2));
                                if (!refL2.wallet) refL2.wallet = { cash: 0, bounty: 0, totalEarned: 0 };
                                refL2.wallet.cash += commL2;
                                refL2.referrals.earnings += commL2;

                                // Level 3 Referrer (7.5% commission)
                                if (refL2.referrals.referredBy) {
                                    const refL3 = users.find(u => u.id === refL2.referrals.referredBy);
                                    if (refL3) {
                                        const commL3 = Number((price * 0.075).toFixed(2));
                                        if (!refL3.wallet) refL3.wallet = { cash: 0, bounty: 0, totalEarned: 0 };
                                        refL3.wallet.cash += commL3;
                                        refL3.referrals.earnings += commL3;
                                    }
                                }
                            }
                        }
                    }
                }

                Z.DB.saveUsers(users);
                Z.showToast(`Package upgraded to ${pkgName} successfully! Referral commissions distributed.`);
                Z.showView('profile');
            },

                                        `<span class="text-emerald-400 font-bold text-xs"><i class="fa-solid fa-check mr-1"></i> Joined</span>` :
                                        `<button type="button" onclick="Z.joinCircle('${c.id}', '${c.creatorId}')" class="bg-emerald-600 hover:bg-emerald-500 text-black font-bold px-3.5 py-1.5 rounded-xl transition">Join Circle ($0.03)</button>`
                                    }
                                </div>
                            </div>
                        `;
                    });
                } else {
                    listHtml = `<p class="text-xs text-slate-500 text-center py-8">No circles found matching "${Z.escapeHtml(Z.State.circleSearchQuery)}".</p>`;

                return `

                            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-500 text-xs"></i>
                            <input type="text" id="circle-search-input" value="${Z.escapeHtml(Z.State.circleSearchQuery || '')}" oninput="Z.State.circleSearchQuery = this.value; Z.showView('circles');" placeholder="Search circles..." class="w-full bg-[#111827] border border-slate-800 rounded-xl pl-9 pr-4 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500 shadow-inner">

                        <div class="space-y-3">

            },

            // Admin Pinned Introductory Video Feed (BUG #27 & #28 & #29 FIX)
            renderAdminWall: function() {
                return `
                    <div class="space-y-4">
                        <div class="bg-gradient-to-r from-indigo-900/60 to-purple-900/60 border border-indigo-500/40 rounded-2xl p-4 shadow-2xl space-y-2">

                        <!-- Pinned Introductory Admin Video -->

                                <h3 class="font-bold text-xs text-white">Welcome to ZYNIX Independent Ecosystem</h3>
                            </div>
                            <div class="rounded-xl overflow-hidden bg-black h-52 border border-slate-800">

        Z.joinCircle = function(circleId, creatorId) {
            if (!Z.State.currentUser) { Z.openAuthModal('login'); return; }
            const user = Z.DB.getUserById(Z.State.currentUser.id);
            if (!user.joinedCircles) user.joinedCircles = [];

            if (user.joinedCircles.includes(circleId)) {
                Z.showToast('You have already joined this circle.');
                return;
            }

            const circles = Z.DB.getCircles();
            const circle = circles.find(c => c.id === circleId);
            if (circle) {
                circle.membersCount++;
                Z.DB.saveCircles(circles);
            }

            user.joinedCircles.push(circleId);
            Z.DB.saveUsers();

            Z.RewardEngine.processInteraction(creatorId, 'circleJoin', circleId);
            Z.showView('circles');
        };

    <!-- ZYNIX CONTROLLED UPGRADE V2: fixes + requested UX through current review. Additive; existing source remains intact. -->
<style>
@keyframes zynixMoneyFly{0%{transform:translateY(8px) scale(.7);opacity:0}20%{opacity:1}100%{transform:translateY(-44px) translateX(24px) scale(1.05);opacity:0}}
.zynix-money-fly{position:fixed;z-index:9999;pointer-events:none;animation:zynixMoneyFly 900ms ease-out forwards;font-weight:900}
.zynix-inline-panel{animation:zynixInlineIn 180ms ease-out}
@keyframes zynixInlineIn{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
</style>
<script>
(function(){
  const Z=window.Z; if(!Z||!Z.DB) return;
  const safe=v=>typeof Z.safe==='function'?Z.safe(v==null?'':String(v)):String(v==null?'':v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const arr=(v)=>Array.isArray(v)?v:[];
  const users=()=>arr(Z.DB.getUsers());
  const posts=()=>arr(Z.DB.getPosts());
  const statuses=()=>arr(Z.DB.getStatuses());
  const sparks=()=>arr(Z.DB.getSparks());
  const current=()=>Z.State.currentUser||Z.DB.getCurrentUser()||users()[0]||null;
  const authorFor=id=>users().find(u=>u&&u.id===id)||{id:'unknown',name:'ZYNIX Creator',username:'creator',role:'Creator',avatar:'' ,bountySettings:{like:.01,share:.03,follow:.03,comment:0}};
  const mediaHtml=(media)=>{
    if(!media) return '';
    const m=String(media);
    if(m.indexOf('data:video/')===0 || /\.(mp4|webm|ogg)(\?|$)/i.test(m)) return '<div class="rounded-xl overflow-hidden border border-slate-800 bg-black"><video src="'+safe(m)+'" controls playsinline class="w-full max-h-80 object-cover"></video></div>';
    if(m.indexOf('data:image/')===0 || /\.(png|jpe?g|gif|webp|avif)(\?|$)/i.test(m)) return '<div class="rounded-xl overflow-hidden border border-slate-800 bg-slate-950"><img src="'+safe(m)+'" class="w-full max-h-80 object-cover" alt="Post media"></div>';
    return '<a href="'+safe(m)+'" target="_blank" rel="noopener" class="block bg-slate-950 border border-slate-800 rounded-xl px-3 py-3 text-[10px] text-emerald-400 break-all">Open attached link</a>';
  };

  Z._zynixRenderError=function(view,err){
    console.error('ZYNIX render error',view,err);
    return '<div class="bg-[#111827] border border-rose-500/30 rounded-2xl p-4 text-xs text-rose-300"><b>Section temporarily unavailable.</b><p class="mt-1 text-slate-400">Your existing ZYNIX data was not changed. Please try Home again.</p><button type="button" onclick="Z.showView(\'home\')" class="mt-3 bg-emerald-600 text-black font-bold px-3 py-2 rounded-xl">Back to Home</button></div>';
  };
  Z._renderSafe=function(view,fn){try{return fn()}catch(e){return Z._zynixRenderError(view,e)}};

  Z.renderZynixWall=function(){
    const us=users();
    const feed=arr(Z.DB.getPosts()).filter(p=>p && p.authorId && p.authorId!=='admin').slice(0,20);
    const official=arr(Z.DB.getPosts()).filter(p=>p && (p.isPinned||p.authorId==='admin')).slice(0,3);
    const pinned=official[0]||null;
    const random=feed.length?feed:arr(Z.DB.getPosts()).slice(0,20);
    const cards=random.map(p=>{
      const a=authorFor(p.authorId);
      return '<article class="bg-[#111827] border border-slate-800 rounded-2xl overflow-hidden shadow-xl">'+
        '<div class="p-3 flex items-center gap-3"><img src="'+safe(a.avatar)+'" class="w-9 h-9 rounded-full object-cover border border-slate-700"><div><div class="font-bold text-xs text-white">'+safe(a.name)+'</div><div class="text-[10px] text-slate-500">@'+safe(a.username||'creator')+'</div></div></div>'+
        '<div class="px-3 pb-3 text-xs text-slate-200 whitespace-pre-wrap">'+safe(p.content||'')+'</div>'+mediaHtml(p.media||'')+
        '<div class="px-3 py-3 text-[10px] text-slate-500">Public ZYNIX feed • '+safe(p.createdAt||'')+'</div></article>';
    }).join('');
    return '<div class="space-y-4">'+
      '<div class="flex items-center gap-2"><button type="button" onclick="Z.showView(\'home\')" class="bg-slate-900 border border-slate-800 text-slate-300 font-bold text-xs px-3 py-2 rounded-xl"><i class="fa-solid fa-arrow-left mr-1"></i> Back to Home</button><h2 class="font-black text-sm text-white">ZYNIX Wall</h2></div>'+
      '<section class="bg-[#111827] border border-emerald-500/30 rounded-2xl overflow-hidden shadow-2xl">'+
        '<div class="p-4 border-b border-slate-800"><span class="text-[10px] uppercase tracking-wider font-black text-emerald-400">Official / Pinned</span><h1 class="text-lg font-black text-white mt-1">ZYNIX</h1><p class="text-[10px] text-slate-400 mt-1">Admin-controlled featured content will appear here. This is the reserved pinned area.</p></div>'+
        (pinned ? '<div class="p-4">'+mediaHtml(pinned.media||'')+'<p class="text-xs text-slate-200 whitespace-pre-wrap mt-3">'+safe(pinned.content||'')+'</p></div>' : '<div class="p-5 text-xs text-slate-500">No pinned official content yet. The admin can pin a post or long-form video here later.</div>')+
      '</section>'+
      '<div class="flex items-center justify-between"><h3 class="font-black text-sm text-white">Community Videos & Posts</h3><span class="text-[10px] text-slate-500">Long-form feed • Sparks stay separate</span></div>'+
      '<div class="space-y-4">'+(cards||'<p class="text-center text-xs text-slate-500 py-8">No public content yet.</p>')+'</div>'+
    '</div>';
  };

  Z.openInlineStatusEditor=function(){
    const u=current(); if(!u){Z.openAuthModal('login');return;}
    const host=document.getElementById('zynix-status-editor'); if(!host)return;
    host.innerHTML='<div class="zynix-inline-panel bg-[#111827] border border-emerald-500/30 rounded-2xl p-3 space-y-2">'+
      '<textarea id="inline-status-content" rows="8" class="w-full min-h-[190px] max-h-72 overflow-y-auto resize-y bg-slate-950 border border-slate-800 rounded-xl px-3 py-3 text-xs text-white focus:outline-none focus:border-emerald-500" placeholder="What\'s on your mind? Share a temporary status…"></textarea>'+
      '<div class="flex flex-wrap items-center gap-2"><button type="button" onclick="document.getElementById(\'inline-status-file\').click()" class="bg-emerald-600 text-black font-bold text-[10px] px-3 py-2 rounded-xl"><i class="fa-solid fa-photo-film mr-1"></i> Browse Media</button><span id="inline-status-file-name" class="text-[10px] text-slate-500 truncate max-w-[170px]"></span><input id="inline-status-file" type="file" accept="image/*,video/*" class="hidden" onchange="Z.previewInlineStatusFile(this)"></div>'+ 
      '<div class="flex justify-end gap-2"><button type="button" onclick="Z.closeInlineStatusEditor()" class="bg-slate-900 border border-slate-800 text-slate-400 font-bold text-[10px] px-3 py-2 rounded-xl">Cancel</button><button type="button" onclick="Z.submitInlineStatus()" class="bg-emerald-600 text-black font-bold text-[10px] px-3 py-2 rounded-xl">Publish 24h Status</button></div></div>';
    setTimeout(()=>document.getElementById('inline-status-content')?.focus(),0);
  };
  Z.closeInlineStatusEditor=function(){const h=document.getElementById('zynix-status-editor');if(h)h.innerHTML='';};
  Z.previewInlineStatusFile=function(input){const f=input&&input.files&&input.files[0];if(!f)return;if(f.size>15*1024*1024){Z.showToast('For this front-end demo, keep media under 15 MB.');input.value='';return;}const n=document.getElementById('inline-status-file-name');if(n)n.textContent=f.name;};
  Z.submitInlineStatus=function(){
    const u=current(); if(!u){Z.openAuthModal('login');return;}
    const text=(document.getElementById('inline-status-content')?.value||'').trim();
    const file=document.getElementById('inline-status-file')?.files?.[0];
    if(!text&&!file){Z.showToast('Add text or media to your status.');return;}
    const save=media=>{const live=statuses().filter(s=>!s.expiresAt||Number(s.expiresAt)>Date.now());live.unshift({id:'st_'+Date.now(),authorId:u.id,content:text,media:media||'',createdAt:new Date().toISOString(),expiresAt:Date.now()+86400000});Z.DB.saveStatuses(live);Z.showToast('Status published for 24 hours.');Z.closeInlineStatusEditor();Z.showView('home');};
    if(file)Z._readFileAsDataUrl(file,save);else save('');
  };

  Z.expandInlineComposer=function(btn){
    const u=current(); if(!u){Z.openAuthModal('login');return;}
    let host=document.getElementById('zynix-inline-composer');
    if(!host && btn) host=btn.closest('.bg-\\[#111827\\]')||btn.parentElement;
    if(!host)return;
    host.innerHTML='<div class="flex items-start gap-3"><img src="'+safe(u.avatar)+'" class="w-9 h-9 rounded-full object-cover shrink-0"><div class="flex-1 space-y-2">'+
      '<textarea id="inline-post-content" rows="8" class="w-full min-h-[190px] max-h-72 overflow-y-auto resize-y bg-slate-950 border border-slate-800 text-white text-xs rounded-xl px-3 py-3 focus:outline-none focus:border-emerald-500" placeholder="What do you think?"></textarea>'+ 
      '<div class="flex flex-wrap items-center gap-2"><button type="button" onclick="document.getElementById(\'inline-post-file\').click()" class="bg-emerald-600 text-black font-bold text-[10px] px-3 py-2 rounded-xl"><i class="fa-solid fa-photo-film mr-1"></i> Browse Photo/Video</button><button type="button" onclick="document.getElementById(\'inline-post-link\').classList.toggle(\'hidden\')" class="bg-slate-900 border border-slate-800 text-slate-300 font-bold text-[10px] px-3 py-2 rounded-xl"><i class="fa-solid fa-link mr-1"></i> Add Link</button><span id="inline-post-file-name" class="text-[10px] text-slate-500 truncate max-w-[160px]"></span><input id="inline-post-file" type="file" accept="image/*,video/*" class="hidden" onchange="Z.previewInlinePostFile(this)"></div>'+ 
      '<input id="inline-post-link" type="url" class="hidden w-full bg-slate-950 border border-slate-800 text-white text-[10px] rounded-lg px-3 py-2" placeholder="https://…">'+
      '<div class="flex justify-end gap-2"><button type="button" onclick="Z.showView(\'home\')" class="bg-slate-900 border border-slate-800 text-slate-400 font-bold text-[10px] px-3 py-2 rounded-xl">Cancel</button><button type="button" onclick="Z.submitInlinePost()" class="bg-emerald-600 text-black font-bold text-[10px] px-4 py-2 rounded-xl">Publish Post</button></div></div></div>';
    setTimeout(()=>document.getElementById('inline-post-content')?.focus(),0);
  };
  Z.previewInlinePostFile=function(input){const f=input&&input.files&&input.files[0];if(!f)return;if(f.size>15*1024*1024){Z.showToast('For this front-end demo, keep media under 15 MB.');input.value='';return;}const n=document.getElementById('inline-post-file-name');if(n)n.textContent=f.name;};
  Z.submitInlinePost=function(){
    const u=current(); if(!u){Z.openAuthModal('login');return;}
    const c=(document.getElementById('inline-post-content')?.value||'').trim(); const file=document.getElementById('inline-post-file')?.files?.[0]; const link=(document.getElementById('inline-post-link')?.value||'').trim();
    if(!c&&!file&&!link){Z.showToast('Write something or attach media first.');return;}
    const finish=media=>{const ps=posts();ps.unshift({id:'post_'+Date.now(),authorId:u.id,content:c||'',media:media||'',createdAt:new Date().toISOString(),reactions:{heart:0,dollar:0,flower:0,fire:0,star:0,clap:0,spark:0},comments:[],shares:0});Z.DB.savePosts(ps);Z.showToast('Post published successfully!');Z.showView('home');};
    if(file)Z._readFileAsDataUrl(file,finish);else finish(link);
  };
  Z.openCreatePostModal=function(){const u=current();if(!u){Z.openAuthModal('login');return;}Z.showView('home');setTimeout(()=>document.getElementById('zynix-inline-composer-trigger')?.click(),30);};
  Z.openCreateSelectionModal=Z.openCreatePostModal;

  const reactionDefs=[['dollar','💵','Dollar'],['flower','🌹','Rose'],['fire','🔥','Spark/Fire'],['star','⭐','Star'],['clap','👏','Clap'],['heart','❤️','Heart']];
  Z.toggleReactionBar=function(postId){const el=document.getElementById('reaction-bar-'+postId);if(el)el.classList.toggle('hidden');};
  Z._flyDollar=function(){const el=document.createElement('div');el.className='zynix-money-fly';el.textContent='💵 +$0.01';document.body.appendChild(el);setTimeout(()=>el.remove(),1000);};
  Z._postLikedBy=function(p,u){return !!(p&&u&&p._reactionUsers&&p._reactionUsers[u.id]==='dollar');};
  Z.toggleDollarLike=function(postId){
    const u=current();if(!u){Z.openAuthModal('login');return;}
    const ps=posts(),p=ps.find(x=>x&&x.id===postId);if(!p)return;
    p.reactions=p.reactions||{};p._reactionUsers=p._reactionUsers||{};
    if(Z._postLikedBy(p,u)){
      p.reactions.dollar=Math.max(0,Number(p.reactions.dollar||0)-1);p._reactionUsers[u.id]=null;delete p._reactionUsers[u.id];Z.DB.savePosts(ps);Z.showToast('Like removed.');Z.showView('home');return;
    }
    p.reactions.dollar=Number(p.reactions.dollar||0)+1;p._reactionUsers[u.id]='dollar';Z.DB.savePosts(ps);Z._flyDollar();
    if(typeof Z.RewardEngine.processInteraction==='function')Z.RewardEngine.processInteraction(p.authorId,'like',p.id); else Z.showToast('Like added.');
  };
  Z.reactToPost=function(postId,reaction){
    if(reaction==='dollar')return Z.toggleDollarLike(postId);
    const u=current();if(!u){Z.openAuthModal('login');return;}
    const ps=posts(),p=ps.find(x=>x&&x.id===postId);if(!p)return;p.reactions=p.reactions||{};p.reactions[reaction]=Number(p.reactions[reaction]||0)+1;Z.DB.savePosts(ps);Z.showToast('Reaction added.');Z.showView('home');
  };
  Z.togglePrimaryReaction=Z.toggleDollarLike;

  Z.openInlineShare=function(postId){
    const old=document.getElementById('share-panel-'+postId);if(old){old.classList.toggle('hidden');return;}
    const host=document.getElementById('post-actions-'+postId);if(!host)return;
    const p=posts().find(x=>x&&x.id===postId);const a=p?authorFor(p.authorId):authorFor('');const bounty=Number((a.bountySettings||{}).share||0).toFixed(2);
    const url=location.href.split('#')[0]+'#post-'+encodeURIComponent(postId);
    const panel=document.createElement('div');panel.id='share-panel-'+postId;panel.className='zynix-inline-panel bg-slate-950 border border-slate-800 rounded-xl p-2 mt-2';

<script>
(function () {
  'use strict';

  window.Z = window.Z || {};

  /* ---------------------------------------------------------
     1. SAFE DATA NORMALIZATION
     Prevent old/corrupted mobile localStorage from breaking
     Home, Spark, People, Circles and other sections.
     --------------------------------------------------------- */

  function safeArray(value, fallback) {
    return Array.isArray(value) ? value : (fallback || []);
  }

  function safeObject(value, fallback) {
    return value && typeof value === 'object' && !Array.isArray(value)
      ? value
      : (fallback || {});
  }

  function readArray(key, fallback) {
    try {
      const raw = localStorage.getItem(key);
      if (!raw) return safeArray(fallback, []);
      const parsed = JSON.parse(raw);
      return safeArray(parsed, fallback);
    } catch (e) {
      console.warn('[ZYNIX] Recovered invalid local data:', key, e);
      return safeArray(fallback, []);
    }
  }

  /* Preserve original DB behavior but make reads mobile-safe. */
  if (Z.DB) {

    const originalGetUsers = Z.DB.getUsers;
    const originalGetPosts = Z.DB.getPosts;
    const originalGetSparks = Z.DB.getSparks;
    const originalGetStatuses = Z.DB.getStatuses;
    const originalGetCircles = Z.DB.getCircles;

    Z.DB.getUsers = function () {
      try {
        const result = originalGetUsers.call(this);
        return Array.isArray(result) ? result : safeArray(Z.SeedData?.users, []);
      } catch (e) {
        console.warn('[ZYNIX] Users recovered:', e);
        return safeArray(Z.SeedData?.users, []);
      }
    };

    Z.DB.getPosts = function () {
      try {
        const result = originalGetPosts.call(this);
        return Array.isArray(result) ? result : safeArray(Z.SeedData?.posts, []);
      } catch (e) {
        console.warn('[ZYNIX] Posts recovered:', e);
        return safeArray(Z.SeedData?.posts, []);
      }
    };

    Z.DB.getSparks = function () {
      try {
        const result = originalGetSparks.call(this);
        return Array.isArray(result) ? result : safeArray(Z.SeedData?.sparks, []);
      } catch (e) {
        console.warn('[ZYNIX] Sparks recovered:', e);
        return safeArray(Z.SeedData?.sparks, []);
      }
    };

    Z.DB.getStatuses = function () {
      try {
        const result = originalGetStatuses.call(this);
        return Array.isArray(result) ? result : safeArray(Z.SeedData?.statuses, []);
      } catch (e) {
        console.warn('[ZYNIX] Statuses recovered:', e);
        return safeArray(Z.SeedData?.statuses, []);
      }
    };

    Z.DB.getCircles = function () {
      try {
        const result = originalGetCircles.call(this);
        return Array.isArray(result) ? result : safeArray(Z.SeedData?.circles, []);
      } catch (e) {
        console.warn('[ZYNIX] Circles recovered:', e);
        return safeArray(Z.SeedData?.circles, []);
      }
    };
  }

  /* ---------------------------------------------------------
     2. SAFE USER SESSION
     --------------------------------------------------------- */

  try {
    if (Z.DB && typeof Z.DB.getCurrentUser === 'function') {
      const current = Z.DB.getCurrentUser();
      Z.State = Z.State || {};
      Z.State.currentUser = current || null;
    }
  } catch (e) {
    console.warn('[ZYNIX] Session recovery:', e);
    Z.State = Z.State || {};
    Z.State.currentUser = null;
  }

  /* ---------------------------------------------------------
     3. SAFE ARRAY CLEANING
     Invalid individual records should not kill the entire
     Home/Spark renderer.
     --------------------------------------------------------- */

  function cleanUsers() {
    return safeArray(Z.DB?.getUsers?.(), []).filter(function (u) {
      return u && typeof u === 'object';
    });
  }

  function cleanPosts() {
    return safeArray(Z.DB?.getPosts?.(), []).filter(function (p) {
      return p && typeof p === 'object';
    });
  }

  function cleanSparks() {
    return safeArray(Z.DB?.getSparks?.(), []).filter(function (s) {
      return s && typeof s === 'object';
    });
  }

  /* ---------------------------------------------------------
     4. MOBILE-SAFE HOME
     Keep the existing Home renderer/content.
     Only protect it from runtime exceptions.
     --------------------------------------------------------- */

  const originalStableHome =
    typeof Z.renderHomePatched === 'function'
      ? Z.renderHomePatched
      : null;

  if (originalStableHome) {
    Z.renderHomePatched = function () {
      try {
        cleanUsers();
        cleanPosts();

        const html = originalStableHome.call(Z);

        if (typeof html === 'string' && html.trim()) {
          return html;
        }

        throw new Error('Home renderer returned empty content');
      } catch (error) {
        console.warn('[ZYNIX] Home renderer recovered:', error);

        const users = cleanUsers();
        const posts = cleanPosts();
        const user = Z.State?.currentUser || users[0] || {};

        let postHtml = '';

        posts.forEach(function (p) {
          try {
            const author =
              users.find(function (u) {
                return u.id === p.authorId;
              }) || user || {};

            postHtml += `
              <article class="bg-[#111827] border border-slate-800 rounded-2xl p-4 space-y-3 shadow-lg">
                <div class="flex items-center gap-3">
                  <img
                    src="${Z.safe ? Z.safe(author.avatar || '') : (author.avatar || '')}"
                    class="w-10 h-10 rounded-full object-cover border border-slate-700"
                    onerror="this.style.display='none'"
                  >
                  <div class="min-w-0">
                    <h3 class="font-bold text-xs text-white truncate">
                      ${Z.safe ? Z.safe(author.name || 'ZYNIX User') : (author.name || 'ZYNIX User')}
                    </h3>
                    <p class="text-[10px] text-slate-500">
                      @${Z.safe ? Z.safe(author.username || 'user') : (author.username || 'user')}
                    </p>
                  </div>
                </div>

                <p class="text-sm text-slate-200 leading-relaxed">
                  ${Z.safe ? Z.safe(p.content || '') : (p.content || '')}
                </p>

                ${
                  p.media
                    ? `<img
                         src="${Z.safe ? Z.safe(p.media) : p.media}"
                         class="w-full rounded-xl max-h-[420px] object-cover"
                         loading="lazy"
                         onerror="this.style.display='none'"
                       >`
                    : ''
                }

                <div class="flex items-center justify-between pt-2 border-t border-slate-800">
                  <span class="text-[10px] text-slate-500">
                    ${Number(p.shares || 0)} Shares
                  </span>
                  <button
                    type="button"
                    onclick="Z.showToast && Z.showToast('Post loaded successfully.')"
                    class="text-xs text-emerald-400 font-bold"
                  >
                    View
                  </button>
                </div>
              </article>
            `;
          } catch (itemError) {
            console.warn('[ZYNIX] Skipped invalid post:', itemError);
          }
        });

        return `
          <div class="space-y-4">

            <div class="bg-[#111827] border border-slate-800 rounded-2xl p-4">
              <div class="flex items-center gap-3">
                <img
                  src="${Z.safe ? Z.safe(user.avatar || '') : (user.avatar || '')}"
                  class="w-11 h-11 rounded-full object-cover border border-slate-700"
                  onerror="this.style.display='none'"
                >
                <div>
                  <h2 class="font-black text-base text-white">
                    Welcome to ZYNIX
                  </h2>
                  <p class="text-[10px] text-slate-400">
                    Independent social & creator ecosystem
                  </p>
                </div>
              </div>
            </div>

            <div class="bg-[#111827] border border-slate-800 rounded-2xl p-3">
              <button
                type="button"
                onclick="Z.expandInlineComposer ? Z.expandInlineComposer(this) : Z.openCreatePostModal && Z.openCreatePostModal()"
                class="w-full bg-slate-950 border border-slate-800 text-slate-400 text-xs text-left px-3.5 py-3 rounded-xl"
              >
                What's on your mind?
              </button>
            </div>

            <div class="space-y-4">
              ${
                postHtml ||
                '<p class="text-center text-xs text-slate-500 py-10">No posts yet.</p>'
              }
            </div>

          </div>
        `;
      }
    };
  }

  /* ---------------------------------------------------------
     5. MOBILE-SAFE SPARK
     --------------------------------------------------------- */

  const originalStableSpark =
    typeof Z.renderSparkStreamPatched === 'function'
      ? Z.renderSparkStreamPatched
      : null;

  if (originalStableSpark) {
    Z.renderSparkStreamPatched = function () {
      try {
        cleanUsers();
        cleanSparks();

        const html = originalStableSpark.call(Z);

        if (typeof html === 'string' && html.trim()) {
          return html;
        }

        throw new Error('Spark renderer returned empty content');
      } catch (error) {
        console.warn('[ZYNIX] Spark renderer recovered:', error);

        const users = cleanUsers();
        const sparks = cleanSparks();

        let html = '';

        sparks.forEach(function (s) {
          try {
            const author =
              users.find(function (u) {
                return u.id === s.authorId;
              }) || users[0] || {};

            const video = s.videoUrl || s.video || '';

            html += `
              <article class="bg-[#111827] border border-slate-800 rounded-2xl overflow-hidden shadow-xl">

                <div class="relative bg-black w-full aspect-[9/16] max-h-[620px]">
                  ${
                    video
                      ? `<video
                           src="${Z.safe ? Z.safe(video) : video}"
                           controls
                           playsinline
                           preload="metadata"
                           class="w-full h-full object-contain bg-black"
                         ></video>`
                      : `
                        <div class="w-full h-full flex items-center justify-center text-slate-500 text-xs">
                          Spark video unavailable
                        </div>
                      `
                  }
                </div>

                <div class="p-4 space-y-3">

                  <div class="flex items-center gap-3">
                    <img
                      src="${Z.safe ? Z.safe(author.avatar || '') : (author.avatar || '')}"
                      class="w-9 h-9 rounded-full object-cover border border-slate-700"
                      onerror="this.style.display='none'"
                    >
                    <div>
                      <h3 class="font-bold text-xs text-white">
                        ${Z.safe ? Z.safe(author.name || 'ZYNIX Creator') : (author.name || 'ZYNIX Creator')}
                      </h3>
                      <p class="text-[10px] text-slate-500">
                        @${Z.safe ? Z.safe(author.username || 'creator') : (author.username || 'creator')}
                      </p>
                    </div>
                  </div>

                  <p class="text-sm text-slate-200">
                    ${Z.safe ? Z.safe(s.caption || '') : (s.caption || '')}
                  </p>

                  <div class="flex items-center justify-between border-t border-slate-800 pt-3">
                    <span class="text-[10px] text-slate-500">
                      ${Number(s.likes || 0)} Likes
                    </span>
                    <span class="text-[10px] text-slate-500">
                      ${Number(s.shares || 0)} Shares
                    </span>
                  </div>

                </div>
              </article>
            `;
          } catch (itemError) {
            console.warn('[ZYNIX] Skipped invalid Spark:', itemError);
          }
        });

        return `
          <div class="space-y-4">

            <div class="flex items-center justify-between px-1">
              <h2 class="font-black text-sm text-white flex items-center">
                <i class="fa-solid fa-bolt text-emerald-400 mr-2"></i>
                ZYNIX Spark
              </h2>

              <button
                type="button"
                onclick="Z.openCreateSparkModal && Z.openCreateSparkModal()"
                class="bg-emerald-600 hover:bg-emerald-500 text-black font-bold text-xs px-3 py-2 rounded-xl"
              >
                Create Spark
              </button>
            </div>

            ${
              html ||
              '<p class="text-center text-xs text-slate-500 py-10">No Sparks yet.</p>'
            }

          </div>
        `;
      }
    };
  }

  /* ---------------------------------------------------------
     6. UNIVERSAL SAFE VIEW SWITCHER
     This is the main mobile navigation protection.
     --------------------------------------------------------- */

  const previousShowView = Z.showView;

  Z.showView = function (viewName) {

    const container = document.getElementById('app-container');

    if (!container) {
      console.warn('[ZYNIX] app-container not found.');
      return;
    }

    Z.State = Z.State || {};
    Z.State.currentView = viewName;

    try {
      window.scrollTo({
        top: 0,
        behavior: 'smooth'
      });
    } catch (e) {
      window.scrollTo(0, 0);
    }

    /* Active bottom navigation */
    try {
      document
        .querySelectorAll('[id^="nav-btn-"]')
        .forEach(function (button) {
          button.classList.remove('text-emerald-400');
        });

      const activeButton =
        document.getElementById('nav-btn-' + viewName);

      if (activeButton) {
        activeButton.classList.add('text-emerald-400');
      }
    } catch (e) {}

    try {

      if (viewName === 'home' && typeof Z.renderHomePatched === 'function') {
        container.innerHTML = Z.renderHomePatched();
        return;
      }

      if (viewName === 'spark' && typeof Z.renderSparkStreamPatched === 'function') {
        container.innerHTML = Z.renderSparkStreamPatched();
        return;
      }

      if (viewName === 'people' && typeof Z.renderPeoplePatched === 'function') {
        container.innerHTML = Z.renderPeoplePatched();
        return;
      }

      if (viewName === 'packages' && typeof Z.renderPackagesPatched === 'function') {
        container.innerHTML = Z.renderPackagesPatched();
        return;
      }

      if (viewName === 'calculator' && typeof Z.renderCalculatorPatched === 'function') {
        container.innerHTML = Z.renderCalculatorPatched();
        if (typeof Z.calculateEstimate === 'function') {
          try { Z.calculateEstimate(); } catch (e) {}
        }
        return;
      }

      if (viewName === 'analytics' && typeof Z.renderAnalyticsPatched === 'function') {
        container.innerHTML = Z.renderAnalyticsPatched();
        return;
      }

      /* Fall back to the original ZYNIX routing for all other
         existing sections. */
      if (typeof previousShowView === 'function') {
        previousShowView.call(Z, viewName);
        return;
      }

    } catch (error) {

      console.error('[ZYNIX] View recovery:', viewName, error);

      /* Last-resort recovery: never leave mobile on a broken
         blank section. Automatically return to Home. */

      if (viewName !== 'home') {
        try {
          Z.State.currentView = 'home';

          if (typeof Z.renderHomePatched === 'function') {
            container.innerHTML = Z.renderHomePatched();
            return;

        } catch (homeError) {
          console.error('[ZYNIX] Home recovery failed:', homeError);
        }
      }

      container.innerHTML = `
        <div class="bg-[#111827] border border-slate-800 rounded-2xl p-5 text-center space-y-3">
          <div class="text-emerald-400 text-2xl">✓</div>
          <h3 class="font-black text-white text-sm">
            ZYNIX is ready
          </h3>
          <p class="text-xs text-slate-400 leading-relaxed">
            The section is being refreshed safely.
          </p>
          <button
            type="button"
            onclick="Z.showView('home')"
            class="bg-emerald-600 text-black font-bold text-xs px-4 py-2.5 rounded-xl"
          >
            Back to Home
          </button>
        </div>
      `;
    }
  };

  /* ---------------------------------------------------------
     7. MOBILE RESIZE / VISIBILITY RECOVERY
     Some mobile browsers restore the page from cache after
     navigation. Re-render only the currently active view.
     --------------------------------------------------------- */

  let resizeTimer = null;

  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);

    resizeTimer = setTimeout(function () {
      try {
        const view = Z.State?.currentView;

        if (!view) return;

        const container = document.getElementById('app-container');

        if (!container) return;

        if (!container.innerHTML.trim()) {
          Z.showView(view);
        }
      } catch (e) {}
    }, 180);
  });

  window.addEventListener('pageshow', function () {
    setTimeout(function () {
      try {
        const view = Z.State?.currentView || 'home';
        const container = document.getElementById('app-container');

        if (container && !container.innerHTML.trim()) {
          Z.showView(view);
        }
      } catch (e) {}
    }, 80);
  });

  /* ---------------------------------------------------------
     8. FINAL BOOT SAFETY
     --------------------------------------------------------- */

  function zynixMobileBoot() {
    try {
      Z.State = Z.State || {};

      if (!Z.State.currentView) {
        Z.State.currentView = 'home';
      }

      const container = document.getElementById('app-container');

      if (
        container &&
        (!container.innerHTML || !container.innerHTML.trim())
      ) {
        Z.showView(Z.State.currentView || 'home');
      }

    } catch (error) {
      console.warn('[ZYNIX] Mobile boot recovery:', error);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () {
      setTimeout(zynixMobileBoot, 120);
    });
  } else {
    setTimeout(zynixMobileBoot, 120);
  }

})();
</script>
</body>
</html>

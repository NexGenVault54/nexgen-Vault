<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZYNIX - Independent Social & Creator Ecosystem</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        zynix: {
                            bg: "#090d16",
                            card: "#111827",
                            cardHover: "#1f2937",
                            border: "#1e293b",
                            emerald: "#10b981",
                            blue: "#3b82f6",
                            pink: "#ec4899",
                            purple: "#8b5cf6",
                            amber: "#f59e0b"
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #090d16; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
        
        @keyframes flyToWalletPure {
            0% { transform: scale(0.6) translateX(0) rotate(0deg); opacity: 0; }
            20% { transform: scale(1.2) translateX(-20px) rotate(-10deg); opacity: 1; }
            80% { transform: scale(0.9) translateY(-160px) translateX(90px) rotate(20deg); opacity: 1; }
            100% { transform: scale(0.3) translateY(-250px) translateX(160px) rotate(45deg); opacity: 0; }
        }
        .dollar-note-pure {
            animation: flyToWalletPure 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            background: transparent !important;
            box-shadow: none !important;
            border: none !important;
        }
        @keyframes pulseWallet {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); box-shadow: 0 0 25px rgba(16, 185, 129, 0.7); }
            100% { transform: scale(1); }
        }
        .wallet-pulse {
            animation: pulseWallet 0.5s ease-in-out;
        }
        body { background-color: #090d16; color: #f8fafc; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
    </style>
</head>
<body class="min-h-screen pb-28 selection:bg-emerald-500 selection:text-black">

    <!-- Top Sticky Header -->
    <header class="sticky top-0 z-40 bg-[#090d16]/90 backdrop-blur-md border-b border-slate-800 px-4 py-2.5 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <button type="button" onclick="Z.showView('admin-wall')" class="flex items-center space-x-2 text-left focus:outline-none group" title="Open Official Admin Wall">
                <span class="text-xl font-black tracking-wider bg-gradient-to-r from-emerald-400 via-blue-500 to-indigo-500 bg-clip-text text-transparent group-hover:opacity-90">
                    ZYNIX
                </span>
                <span class="text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-1.5 py-0.5 rounded font-bold uppercase tracking-widest hidden sm:inline-block">Ecosystem</span>
            </button>
        </div>

        <div class="flex items-center space-x-2.5">
            <button type="button" onclick="Z.showView('wallet')" class="bg-slate-900/90 border border-slate-800 hover:border-slate-700 px-3 py-1 rounded-full text-xs flex items-center space-x-2 shadow-inner transition">
                <div class="flex items-center space-x-1" title="Cash Balance">
                    <i class="fa-solid fa-wallet text-emerald-400 text-[10px]"></i>
                    <span id="header-cash" class="text-emerald-400 font-bold">$0.00</span>
                </div>
                <span class="text-slate-700">|</span>
                <div class="flex items-center space-x-1" title="Bounty Balance">
                    <i class="fa-solid fa-gift text-blue-400 text-[10px]"></i>
                    <span id="header-bounty" class="text-blue-400 font-bold">$0.00</span>
                </div>
            </button>

            <div id="header-auth-container">
                <!-- Dynamic Auth Render -->
            </div>
        </div>
    </header>

    <!-- Main Container App -->
    <main id="app-container" class="max-w-xl mx-auto px-3 py-3 min-h-[calc(100vh-120px)] relative">
        <!-- Views will be injected dynamically here -->
    </main>

    <!-- Fixed Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 z-40 bg-[#090d16]/95 backdrop-blur-lg border-t border-slate-800 px-2 py-2 max-w-xl mx-auto flex items-center justify-between shadow-2xl">
        <button type="button" onclick="Z.showView('home')" id="nav-btn-home" class="flex flex-col items-center justify-center text-slate-400 hover:text-emerald-400 transition w-1/6 py-1">
            <i class="fa-solid fa-house text-base"></i>
            <span class="text-[9px] font-medium mt-0.5">Home</span>
        </button>
        <button type="button" onclick="Z.showView('spark')" id="nav-btn-spark" class="flex flex-col items-center justify-center text-slate-400 hover:text-emerald-400 transition w-1/6 py-1">
            <i class="fa-solid fa-bolt text-base"></i>
            <span class="text-[9px] font-medium mt-0.5">Spark</span>
        </button>
        <button type="button" onclick="Z.openCreateSelectionModal()" class="flex items-center justify-center w-10 h-10 bg-gradient-to-tr from-emerald-500 to-blue-600 rounded-full text-black hover:scale-105 transition shadow-lg shadow-emerald-500/20 -mt-2" title="Create">
            <i class="fa-solid fa-plus text-sm font-black"></i>
        </button>
        <button type="button" onclick="Z.showView('circles')" id="nav-btn-circles" class="flex flex-col items-center justify-center text-slate-400 hover:text-emerald-400 transition w-1/6 py-1">
            <i class="fa-solid fa-circle-nodes text-base"></i>
            <span class="text-[9px] font-medium mt-0.5">Circles</span>
        </button>
        <button type="button" onclick="Z.showView('people')" id="nav-btn-people" class="flex flex-col items-center justify-center text-slate-400 hover:text-emerald-400 transition w-1/6 py-1">
            <i class="fa-solid fa-users text-base"></i>
            <span class="text-[9px] font-medium mt-0.5">People</span>
        </button>
        <button type="button" onclick="Z.showView('profile')" id="nav-btn-profile" class="flex flex-col items-center justify-center text-slate-400 hover:text-emerald-400 transition w-1/6 py-1">
            <i class="fa-solid fa-user text-base"></i>
            <span class="text-[9px] font-medium mt-0.5">Profile</span>
        </button>
    </nav>

    <!-- Floating AI Assistant Button (Bottom Right) -->
    <div class="fixed bottom-20 right-4 z-40">
        <button type="button" onclick="Z.openAiModal()" class="w-12 h-12 bg-slate-900 border border-slate-700 hover:border-emerald-500 rounded-full text-emerald-400 shadow-2xl flex items-center justify-center transition hover:scale-110" title="ZYNIX AI Guide">
            <i class="fa-solid fa-wand-magic-sparkles text-lg"></i>
        </button>
    </div>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-24 left-4 right-4 z-50 flex flex-col items-center space-y-2 pointer-events-none"></div>

    <!-- Modals Container -->
    <div id="modal-container"></div>

    <!-- Application JavaScript Engine Layer -->
    <script>
        window.Z = {};

        // Initialize Supabase Client with your credentials
        const SUPABASE_URL = 'https://ipypwqajsfxrdzlxfnlr.supabase.co/rest/v1/';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlweXB3cWFqc2Z4cmR6bHhmbmxyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2OTEzODUsImV4cCI6MjEwNDI2NzM4NX0.QW6tzaMxlNg9EYuRq0tCOlGipBlrjBuiV6lZuSr1Jj4';
        const supabaseClient = supabase.createClient('https://ipypwqajsfxrdzlxfnlr.supabase.co', SUPABASE_ANON_KEY);

        Z.State = {
            currentUser: null,
            currentView: 'home',
            circleSearchQuery: '',
            joinedCircles: ['cir_1']
        };

        // Central Reward & Bounty Engine Layer
        Z.RewardEngine = {
            calculateSplit: function(grossAmount) {
                const cash = Number((grossAmount * 0.60).toFixed(4));
                const bounty = Number((grossAmount * 0.40).toFixed(4));
                return { cash, bounty, gross: grossAmount };
            },
            creditReward: async function(user, grossAmount, reason) {
                if (!user) return false;
                const split = this.calculateSplit(grossAmount);
                
                const newCash = (user.cash_balance ?? user.wallet?.cash ?? 0) + split.cash;
                const newBounty = (user.bounty_balance ?? user.wallet?.bounty ?? 0) + split.bounty;
                const newTotal = (user.total_earned ?? user.wallet?.totalEarned ?? 0) + grossAmount;

                // Update Profile Balances in Supabase
                await supabaseClient.from('profiles').update({ 
                    cash_balance: newCash, 
                    bounty_balance: newBounty, 
                    total_earned: newTotal 
                }).eq('id', user.id);

                // Record Transaction in Supabase
                await supabaseClient.from('wallet_transactions').insert({ 
                    user_id: user.id, 
                    type: reason, 
                    amount: grossAmount, 
                    cash_split: split.cash, 
                    bounty_split: split.bounty 
                });

                user.cash_balance = newCash;
                user.bounty_balance = newBounty;
                user.total_earned = newTotal;
                if(user.wallet) {
                    user.wallet.cash = newCash;
                    user.wallet.bounty = newBounty;
                    user.wallet.totalEarned = newTotal;
                }

                Z.updateHeaderWallet();
                Z.triggerRewardAnimation(grossAmount);
                Z.showToast(`Reward received: +$${grossAmount.toFixed(2)} (+$${split.cash.toFixed(3)} Cash, +$${split.bounty.toFixed(3)} Bounty)`);
                return true;
            },
            processInteraction: async function(contentOwnerId, interactionType, post) {
                if (!Z.State.currentUser) {
                    Z.openAuthModal('login');
                    Z.showToast('Please log in or sign up to earn rewards.');
                    return false;
                }
                const users = await Z.DB.getUsers();
                const contentOwner = users.find(u => u.id === contentOwnerId);
                if (!contentOwner) return false;

                if (contentOwner.id === Z.State.currentUser.id) {
                    Z.showToast('You cannot earn rewards from your own content.');
                    return false;
                }

                const bountySettings = contentOwner.bountySettings || { like: 0.01, share: 0.03, follow: 0.03, subscribe: 0.02, circleJoin: 0.03 };
                let rewardAmount = bountySettings[interactionType] || 0.01;
                if (rewardAmount > 0.05) rewardAmount = 0.05;

                const ownerBounty = contentOwner.bounty_balance ?? contentOwner.wallet?.bounty ?? 5.00;
                if (ownerBounty < rewardAmount) {
                    Z.showToast('Creator bounty balance is insufficient for this reward.');
                    return false;
                }

                const updatedOwnerBounty = ownerBounty - rewardAmount;
                await supabaseClient.from('profiles').update({ bounty_balance: updatedOwnerBounty }).eq('id', contentOwner.id);
                contentOwner.bounty_balance = updatedOwnerBounty;

                this.creditReward(Z.State.currentUser, rewardAmount, `${interactionType.toUpperCase()} Reward`);
                return true;
            }
        };

        Z.triggerRewardAnimation = function(amount) {
            const walletEl = document.querySelector('header');
            if (walletEl) {
                walletEl.classList.add('wallet-pulse');
                setTimeout(() => walletEl.classList.remove('wallet-pulse'), 500);
            }
            const floatingNote = document.createElement('div');
            floatingNote.className = 'fixed z-50 text-emerald-400 font-black text-2xl dollar-note-pure pointer-events-none flex items-center space-x-1';
            floatingNote.style.right = '50px';
            floatingNote.style.top = '70px';
            floatingNote.innerHTML = `<i class="fa-solid fa-money-bill-wave text-emerald-400 drop-shadow-[0_4px_12px_rgba(16,185,129,0.8)]"></i><span class="text-xs font-bold text-emerald-300 drop-shadow">+$${amount.toFixed(2)}</span>`;
            document.body.appendChild(floatingNote);
            setTimeout(() => floatingNote.remove(), 1200);
        };

        Z.showToast = function(message) {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = 'bg-slate-900/95 border border-emerald-500/40 text-slate-100 px-4 py-2.5 rounded-xl text-xs shadow-2xl flex items-center space-x-2.5 pointer-events-auto transition transform translate-y-4 opacity-0 max-w-md w-full backdrop-blur-md';
            toast.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400 text-sm shrink-0"></i><span class="font-medium">${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-4', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'transition', 'duration-300');
                setTimeout(() => toast.remove(), 300);
            }, 3200);
        };

        // Supabase-Powered Data Management Layer
        Z.DB = {
            getUsers: async function() {
                const { data, error } = await supabaseClient.from('profiles').select('*');
                if (error || !data || data.length === 0) return [];
                return data;
            },
            getCurrentUser: async function() {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (!session) return null;
                const { data: profile } = await supabaseClient
                    .from('profiles')
                    .select('*')
                    .eq('id', session.user.id)
                    .single();
                return profile || null;
            },
            setCurrentUser: async function(user) {
                Z.State.currentUser = user;
                Z.renderHeaderAuth();
                Z.updateHeaderWallet();
            },
            getPosts: async function() {
                const { data, error } = await supabaseClient
                    .from('posts')
                    .select('*, profiles(name, username, avatar, role)')
                    .order('created_at', { ascending: false });
                return data || [];
            },
            getSparks: async function() {
                const { data, error } = await supabaseClient
                    .from('sparks')
                    .select('*, profiles(name, username, avatar)')
                    .order('created_at', { ascending: false });
                return data || [];
            },
            getStatuses: async function() {
                // Falls back or returns empty if status table isn't created, keeping app robust
                return [
                    {
                        id: 'st_1',
                        authorId: Z.State.currentUser?.id || 'usr_1',
                        content: 'Building the future of independent creator rewards!',
                        media: '',
                        createdAt: '1 hour ago'
                    }
                ];
            },
            getCircles: async function() {
                const { data, error } = await supabaseClient
                    .from('circles')
                    .select('*')
                    .order('members_count', { ascending: false });
                return data || [];
            }
        };

        document.addEventListener('DOMContentLoaded', async function() {
            let current = await Z.DB.getCurrentUser();
            if (!current) {
                const users = await Z.DB.getUsers();
                current = users[0] || null;
            }
            Z.State.currentUser = current;

            Z.renderHeaderAuth();
            Z.updateHeaderWallet();
            Z.showView('home');
        });

        Z.renderHeaderAuth = function() {
            const container = document.getElementById('header-auth-container');
            if (!container) return;
            const user = Z.State.currentUser;
            if (user) {
                container.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <button type="button" onclick="Z.showView('profile')" class="flex items-center space-x-1.5 focus:outline-none">
                            <img src="${user.avatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80'}" alt="${user.name}" class="w-7 h-7 rounded-full object-cover border border-emerald-500/50">
                        </button>
                        <button type="button" onclick="Z.logout()" class="w-7 h-7 rounded-full bg-slate-800 hover:bg-rose-500/20 text-slate-400 hover:text-rose-400 flex items-center justify-center transition" aria-label="Logout" title="Logout">
                            <i class="fa-solid fa-power-off text-xs"></i>
                        </button>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <button type="button" onclick="Z.openAuthModal('login')" class="bg-emerald-600 hover:bg-emerald-500 text-black font-bold text-xs px-3 py-1.5 rounded-full transition shadow-md">
                        Login
                    </button>
                `;
            }
        };

        Z.updateHeaderWallet = function() {
            const user = Z.State.currentUser;
            const cashEl = document.getElementById('header-cash');
            const bountyEl = document.getElementById('header-bounty');
            const cashVal = user ? (user.cash_balance ?? user.wallet?.cash ?? 0.00) : 0.00;
            const bountyVal = user ? (user.bounty_balance ?? user.wallet?.bounty ?? 0.00) : 0.00;
            if (cashEl) cashEl.innerText = '$' + cashVal.toFixed(2);
            if (bountyEl) bountyEl.innerText = '$' + bountyVal.toFixed(2);
        };

        // Authentication & Modals
        Z.openAuthModal = function(mode) {
            const modalContainer = document.getElementById('modal-container');
            if (!modalContainer) return;
            const isLogin = mode === 'login';
            modalContainer.innerHTML = `
                <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                    <div class="bg-[#111827] border border-slate-800 rounded-2xl w-full max-w-md p-6 space-y-4 shadow-2xl relative animate-in fade-in zoom-in duration-200">
                        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                            <h3 class="font-bold text-base text-white">${isLogin ? 'Login to ZYNIX' : 'Create ZYNIX Account'}</h3>
                            <button type="button" onclick="Z.closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <div class="space-y-3">
                            ${!isLogin ? `
                                <div>
                                    <label class="block text-xs font-medium text-slate-400 mb-1">Full Name</label>
                                    <input type="text" id="auth-name" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500" placeholder="Abdullah Abbas">
                                </div>
                                <div>
                                    <label class="block text-xs font-medium text-slate-400 mb-1">Username</label>
                                    <input type="text" id="auth-username" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500" placeholder="abdullah_abbas">
                                </div>
                            ` : ''}
                            <div>
                                <label class="block text-xs font-medium text-slate-400 mb-1">Email</label>
                                <input type="email" id="auth-email" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500" placeholder="abdullah@zynix.io">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-400 mb-1">Password</label>
                                <input type="password" id="auth-password" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500" placeholder="••••••••">
                            </div>
                            <button type="button" onclick="Z.handleAuthSubmit('${mode}')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-black font-bold py-2.5 rounded-xl text-xs transition shadow-lg shadow-emerald-600/20">
                                ${isLogin ? 'Login Account' : 'Sign Up Now'}
                            </button>
                            <div class="text-center pt-2">
                                <button type="button" onclick="Z.openAuthModal('${isLogin ? 'signup' : 'login'})" class="text-xs text-indigo-400 hover:underline">
                                    ${isLogin ? "Don't have an account? Sign Up" : "Already have an account? Login"}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        };

        Z.closeModal = function() {
            const modalContainer = document.getElementById('modal-container');
            if (modalContainer) modalContainer.innerHTML = '';
        };

        Z.handleAuthSubmit = async function(mode) {
            const emailInput = document.getElementById('auth-email').value.trim();
            const passInput = document.getElementById('auth-password').value.trim();
            if (!emailInput || !passInput) {
                Z.showToast('Please fill in all required fields.');
                return;
            }

            if (mode === 'login') {
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: emailInput,
                    password: passInput
                });
                if (error) {
                    Z.showToast('Login failed: ' + error.message);
                    return;
                }
                const profile = await Z.DB.getCurrentUser();
                Z.DB.setCurrentUser(profile);
                Z.closeModal();
                Z.showToast(`Welcome back, ${profile?.name || 'Creator'}!`);
                Z.showView('profile');
            } else {
                const nameInput = document.getElementById('auth-name').value.trim() || 'New User';
                const usernameInput = document.getElementById('auth-username').value.trim() || emailInput.split('@')[0];
                const uniqueCode = 'ZYNIX-' + Math.random().toString(36).substring(2, 8).toUpperCase();

                const { data: authData, error: authError } = await supabaseClient.auth.signUp({
                    email: emailInput,
                    password: passInput
                });
                if (authError) {
                    Z.showToast('Signup failed: ' + authError.message);
                    return;
                }

                const userId = authData.user?.id;
                if (userId) {
                    await supabaseClient.from('profiles').insert({
                        id: userId,
                        name: nameInput,
                        username: usernameInput,
                        profession: 'Creator',
                        bio: 'Joined ZYNIX ecosystem.',
                        role: 'Creator',
                        avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80',
                        cover: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=800&q=80',
                        followers: 1,
                        package: 'Free',
                        cash_balance: 1.0000,
                        bounty_balance: 1.0000,
                        total_earned: 2.0000,
                        referral_code: uniqueCode
                    });
                }

                const profile = await Z.DB.getCurrentUser();
                Z.DB.setCurrentUser(profile);
                Z.closeModal();
                Z.showToast('Account created successfully via Supabase!');
                Z.showView('profile');
            }
        };

        Z.logout = async function() {
            await supabaseClient.auth.signOut();
            Z.DB.setCurrentUser(null);
            Z.showToast('Logged out successfully.');
            Z.showView('home');
        };

        // Create Selection Modal (+)
        Z.openCreateSelectionModal = function() {
            if (!Z.State.currentUser) {
                Z.openAuthModal('login');
                Z.showToast('Please login to create content.');
                return;
            }
            const modalContainer = document.getElementById('modal-container');
            if (!modalContainer) return;

            modalContainer.innerHTML = `
                <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                    <div class="bg-[#111827] border border-slate-800 rounded-2xl w-full max-w-sm p-5 space-y-3 shadow-2xl relative">
                        <div class="flex justify-between items-center border-b border-slate-800 pb-2.5">
                            <h3 class="font-bold text-sm text-white">Create on ZYNIX</h3>
                            <button type="button" onclick="Z.closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <div class="grid grid-cols-1 gap-2.5 pt-1">
                            <button type="button" onclick="Z.closeModal(); Z.openCreatePostModal();" class="bg-slate-900 hover:bg-slate-800 border border-slate-800 p-3 rounded-xl flex items-center space-x-3 text-left transition">
                                <div class="w-9 h-9 rounded-lg bg-emerald-500/10 text-emerald-400 flex items-center justify-center"><i class="fa-solid fa-pen-to-square"></i></div>

                const btn = document.getElementById(`nav-btn-${v}`);
                if (btn) {
                    if (v === viewName) btn.classList.add('text-emerald-400');
                    else btn.classList.remove('text-emerald-400');
                }
            });

            const container = document.getElementById('app-container');
            if (!container) return;

            if (viewName === 'home') container.innerHTML = await Z.Views.renderHome();
            else if (viewName === 'spark') container.innerHTML = await Z.Views.renderSparkStream();
            else if (viewName === 'profile') container.innerHTML = await Z.Views.renderProfileDashboard();
            else if (viewName === 'wallet') container.innerHTML = await Z.Views.renderWallet();
            else if (viewName === 'bounty-settings') container.innerHTML = await Z.Views.renderBountySettings();

            else if (viewName === 'referrals') container.innerHTML = Z.Views.renderReferrals();
            else if (viewName === 'analytics') container.innerHTML = Z.Views.renderAnalytics();
            else if (viewName === 'people') container.innerHTML = await Z.Views.renderPeople();

            renderBountySettings: function() {

            saveBountySettings: async function() {
                const user = Z.State.currentUser;
                if (!user) return;
                user.bountySettings = {
                    like: Math.min(0.05, Math.max(0, parseFloat(document.getElementById('bounty-like').value) || 0.01)),
                    share: Math.min(0.05, Math.max(0, parseFloat(document.getElementById('bounty-share').value) || 0.03)),
                    follow: Math.min(0.05, Math.max(0, parseFloat(document.getElementById('bounty-follow').value) || 0.03)),
                    circleJoin: 0.03
                };
                Z.showToast('Bounty settings updated successfully!');
                Z.showView('profile');
            },

                        <div class="grid grid-cols-2 gap-3">

            renderPeople: async function() {
                const users = await Z.DB.getUsers();
                let listHtml = '';
                users.forEach(u => {
                    const isSelf = Z.State.currentUser && Z.State.currentUser.id === u.id;
                    listHtml += `
                        <div class="bg-[#111827] border border-slate-800 p-3.5 rounded-2xl flex items-center justify-between shadow-lg">
                            <div class="flex items-center space-x-3">
                                <img src="${u.avatar || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80'}" class="w-10 h-10 rounded-full object-cover border border-slate-700">
                                <div>
                                    <h4 class="font-bold text-xs text-white">${u.name}</h4>
                                    <p class="text-[10px] text-slate-400">@${u.username} • ${u.profession || 'Creator'}</p>
                                </div>
                            </div>
                            ${!isSelf ? `
                                <button type="button" onclick="Z.RewardEngine.processInteraction('${u.id}', 'follow')" class="bg-emerald-600/20 border border-emerald-500/40 text-emerald-400 hover:bg-emerald-600 hover:text-black font-bold text-xs px-3 py-1.5 rounded-xl transition">
                                    Follow ($0.03)
                                </button>
                            ` : `<span class="text-[10px] text-slate-500 font-bold px-2 py-1 bg-slate-900 rounded-lg">You</span>`}

                });
                return `
                    <div class="space-y-3">
                        <div class="flex justify-between items-center px-1">
                            <h3 class="font-black text-sm text-white flex items-center"><i class="fa-solid fa-users text-emerald-400 mr-2"></i> People Directory (Supabase)</h3>
                            <span class="text-[10px] bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded font-bold">Earn Bounties</span>
                        </div>
                        <div class="space-y-3">${listHtml || '<p class="text-xs text-slate-500 text-center py-6">No users found.</p>'}</div>
                    </div>
                `;
            },

            renderCirclesPage: async function() {
                const circles = await Z.DB.getCircles();
                const query = (Z.State.circleSearchQuery || '').toLowerCase();

                let joinedRowHtml = '';
                Z.State.joinedCircles.forEach(cid => {
                    const c = circles.find(item => item.id === cid);
                    if (c) {
                        joinedRowHtml += `
                            <div class="flex flex-col items-center shrink-0 space-y-1 cursor-pointer group" onclick="Z.visitCircle('${c.id}')">
                                <div class="w-14 h-14 rounded-full p-0.5 bg-gradient-to-tr from-emerald-400 to-indigo-500 group-hover:scale-105 transition">
                                    <img src="${c.avatar || 'https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=150&q=80'}" class="w-full h-full rounded-full object-cover border-2 border-[#090d16]">
                                </div>
                                <span class="text-[10px] text-slate-300 font-medium truncate w-14 text-center">${c.name.split(' ')[0]}</span>
                            </div>
                        `;
                    }
                });

                let filteredCircles = circles.filter(c => 
                    c.name.toLowerCase().includes(query) || 
                    (c.description && c.description.toLowerCase().includes(query)) ||
                    (c.category && c.category.toLowerCase().includes(query))
                );

                let listHtml = '';
                if (filteredCircles.length > 0) {
                    filteredCircles.forEach(c => {
                        listHtml += `
                            <div class="bg-[#111827] border border-slate-800 p-4 rounded-2xl space-y-2 shadow-xl">
                                <div class="flex items-center space-x-3">
                                    <img src="${c.avatar || 'https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=150&q=80'}" class="w-10 h-10 rounded-full object-cover border border-slate-700">
                                    <div>
                                        <h4 class="font-bold text-sm text-white">${c.name}</h4>
                                        <p class="text-[10px] text-slate-400">${c.members_count || 1} Members • <span class="text-emerald-400">${c.category || 'Community'}</span></p>
                                    </div>
                                </div>
                                <p class="text-xs text-slate-300 leading-relaxed">${c.description || ''}</p>
                                <div class="flex justify-between items-center pt-2 border-t border-slate-800 text-xs">
                                    <button type="button" onclick="Z.visitCircle('${c.id}')" class="text-indigo-400 font-bold hover:underline">View Discussions</button>
                                    <button type="button" onclick="Z.joinCircle('${c.id}', '${c.creator_id}')" class="bg-emerald-600 hover:bg-emerald-500 text-black font-bold px-3.5 py-1.5 rounded-xl transition">Join Circle ($0.03)</button>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    listHtml = `<p class="text-xs text-slate-500 text-center py-8">No circles found matching "${Z.State.circleSearchQuery}".</p>`;
                }

                return `
                    <div class="space-y-4">
                        <div class="flex items-center justify-between px-1">
                            <h2 class="font-black text-sm text-white flex items-center"><i class="fa-solid fa-circle-nodes text-emerald-400 mr-2"></i> Professional Circles</h2>
                            <span class="text-[10px] bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-2 py-0.5 rounded font-bold">Supabase</span>
                        </div>

                        <div class="relative">
                            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-500 text-xs"></i>
                            <input type="text" id="circle-search-input" value="${Z.State.circleSearchQuery || ''}" oninput="Z.handleCircleSearch(this.value)" placeholder="Search circles..." class="w-full bg-[#111827] border border-slate-800 rounded-xl pl-9 pr-4 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500 shadow-inner">
                        </div>

                        <div class="space-y-1.5">
                            <span class="text-[10px] uppercase tracking-wider text-slate-400 font-bold px-1">Your Joined & Recent Circles</span>
                            <div class="flex items-center space-x-3 overflow-x-auto pb-2 scrollbar-none bg-[#111827]/50 p-3 rounded-2xl border border-slate-800">
                                ${joinedRowHtml}
                            </div>
                        </div>

                        <div class="space-y-3">
                            <span class="text-[10px] uppercase tracking-wider text-slate-400 font-bold px-1">Discover All Circles</span>
                            ${listHtml}
                        </div>
                    </div>
                `;
            },

            renderAdminWall: function() {
                return `
                    <div class="space-y-4">
                        <div class="bg-gradient-to-r from-indigo-900/60 to-purple-900/60 border border-indigo-500/40 rounded-2xl p-4 shadow-2xl space-y-2">
                            <span class="text-[10px] bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded font-bold uppercase tracking-wider">Official ZYNIX Admin Wall</span>
                            <h2 class="font-black text-base text-white">Platform Announcements & Updates</h2>
                            <p class="text-xs text-slate-300 leading-relaxed">
                                Welcome to the official ZYNIX administration feed powered by Supabase Cloud.
                            </p>
                        </div>
                        <button type="button" onclick="Z.showView('home')" class="w-full bg-slate-800 hover:bg-slate-700 text-white font-bold py-2.5 rounded-xl text-xs transition">
                            Return to Public Social Feed
                        </button>
                    </div>
                `;
            }
        };

        Z.handleCircleSearch = async function(val) {
            Z.State.circleSearchQuery = val;
            const container = document.getElementById('app-container');
            if (container && Z.State.currentView === 'circles') {
                container.innerHTML = await Z.Views.renderCirclesPage();
                const input = document.getElementById('circle-search-input');
                if (input) {
                    input.focus();
                    input.setSelectionRange(input.value.length, input.value.length);
                }
            }
        };

        Z.joinCircle = function(circleId, creatorId) {
            if (!Z.State.joinedCircles.includes(circleId)) {
                Z.State.joinedCircles.unshift(circleId);
            }
            if (creatorId) {
                Z.RewardEngine.processInteraction(creatorId, 'circleJoin');
            } else {
                Z.showToast('Successfully joined circle!');
            }
            Z.showView('circles');
        };

        Z.visitCircle = async function(circleId) {
            Z.State.joinedCircles = [circleId, ...Z.State.joinedCircles.filter(id => id !== circleId)];
            const circles = await Z.DB.getCircles();
            const c = circles.find(item => item.id === circleId);
            Z.showToast(`Opened circle: ${c ? c.name : 'Community'}`);
            Z.showView('circles');
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ZYNIX - Complete Social Platform</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  background: #090d16; color: #f8fafc;
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  padding-bottom: 80px; overflow-x: hidden;
}
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: #090d16; }
::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #334155; }

/* ===== HEADER ===== */
.zynix-header {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  background: rgba(9,13,22,0.92); backdrop-filter: blur(12px);
  border-bottom: 1px solid #1e293b; padding: 10px 16px;
  display: flex; align-items: center; justify-content: space-between;
  min-height: 56px;
}
.header-logo {
  width: 30px; height: 30px; border-radius: 50%;
  background: linear-gradient(135deg, #10b981, #3b82f6);
  display: flex; align-items: center; justify-content: center;
  font-weight: 900; color: #000; font-size: 14px;
}
.header-title {
  font-size: 18px; font-weight: 900;
  background: linear-gradient(90deg, #10b981, #3b82f6, #8b5cf6);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.header-btn { background: transparent; border: none; color: #94a3b8; cursor: pointer; padding: 6px; transition: color 0.2s; }
.header-btn:hover { color: #fff; }
.wallet-pill {
  background: rgba(15,23,42,0.9); border: 1px solid #1e293b;
  border-radius: 20px; padding: 4px 10px; font-size: 10px;
  display: flex; align-items: center; gap: 6px;
}
.wallet-pill .sep { color: #334155; }

/* ===== FOOTER ===== */
.zynix-footer {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 1000;
  background: rgba(9,13,22,0.95); backdrop-filter: blur(12px);
  border-top: 1px solid #1e293b; padding: 8px 0;
  display: flex; align-items: center; justify-content: space-around;
  max-width: 600px; margin: 0 auto;
}
.zynix-footer button {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  justify-content: center; padding: 4px 0; color: #64748b;
  transition: color 0.2s; background: transparent; border: none;
  font-size: 9px; cursor: pointer; font-weight: 500;
}
.zynix-footer button i { font-size: 18px; margin-bottom: 2px; }
.zynix-footer button:hover, .zynix-footer button.active { color: #10b981; }
.zynix-footer .create-btn {
  width: 48px; height: 48px; border-radius: 50%;
  background: linear-gradient(135deg, #10b981, #3b82f6);
  color: #000; font-size: 20px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
  margin-top: -16px; box-shadow: 0 4px 20px rgba(16,185,129,0.3);
  transition: transform 0.2s; flex: none;
}
.zynix-footer .create-btn:hover { transform: scale(1.08); }
.zynix-footer .create-btn i { font-size: 20px; margin: 0; }

/* ===== MAIN ===== */
#app-container {
  max-width: 600px; margin: 0 auto;
  padding: 76px 14px 20px;
  min-height: calc(100vh - 80px);
}

/* ===== STATUS ROW ===== */
.status-row-wrap {
  background: #111827; border: 1px solid #1e293b;
  border-radius: 16px; padding: 12px; margin-bottom: 14px;
}
.status-scroll {
  display: flex; gap: 10px; overflow-x: auto;
  padding: 4px 0; scrollbar-width: none; -ms-overflow-style: none;
  scroll-behavior: smooth;
}
.status-scroll::-webkit-scrollbar { display: none; }
.status-item {
  flex-shrink: 0; width: 68px; text-align: center;
  background: transparent; border: none; cursor: pointer;
  padding: 0;
}
.status-ring-unseen {
  background: linear-gradient(135deg, #10b981, #3b82f6, #8b5cf6);
  padding: 3px; border-radius: 50%; width: 58px; height: 58px;
  margin: 0 auto;
}
.status-ring-seen {
  background: #1e293b; padding: 3px; border-radius: 50%;
  width: 58px; height: 58px; margin: 0 auto;
}
.status-ring-inner {
  width: 100%; height: 100%; border-radius: 50%;
  background: #090d16; padding: 2px;
}
.status-ring-inner img {
  width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
}
.status-label {
  font-size: 9px; font-weight: 600; color: #94a3b8;
  display: block; margin-top: 4px; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap; padding: 0 4px;
}

/* ===== STATUS VIEWER ===== */
.status-viewer-overlay {
  position: fixed; inset: 0; z-index: 9999;
  background: rgba(0,0,0,0.98);
  display: flex; flex-direction: column; color: #fff;
  animation: fadeIn 0.2s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.status-viewer-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.05);
  flex-shrink: 0;
}
.status-viewer-body {
  flex: 1; display: flex; align-items: center; justify-content: center;
  position: relative; min-height: 0; overflow: hidden;
}
.status-stage {
  width: 100%; height: 100%; display: flex; align-items: center;
  justify-content: center; background: #000;
  height: clamp(320px, 58vh, 620px); position: relative;
}
.status-stage img, .status-stage video {
  width: 100%; height: 100%; object-fit: contain;
  max-width: 100%; max-height: 100%;
}
.status-stage .text-status {
  padding: 24px; font-size: clamp(1.2rem, 4vw, 2.2rem);
  font-weight: 700; text-align: center; line-height: 1.6;
  color: #fff; overflow-y: auto; max-height: 100%; width: 100%;
  word-break: break-word;
}
.status-nav-btn {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 44px; height: 44px; border-radius: 50%;
  background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
  color: #fff; cursor: pointer; font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s; z-index: 10;
}
.status-nav-btn:hover { background: rgba(255,255,255,0.15); }
.status-nav-btn.left { left: 10px; }
.status-nav-btn.right { right: 10px; }
.status-viewer-footer {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; border-top: 1px solid rgba(255,255,255,0.05);
  flex-shrink: 0; height: 68px;
}
.status-viewer-footer button {
  padding: 8px 20px; border-radius: 10px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  color: #fff; font-size: 12px; cursor: pointer;
  transition: background 0.2s; font-weight: 600;
}
.status-viewer-footer button:hover { background: rgba(255,255,255,0.12); }
.progress-bar {
  position: absolute; top: 0; left: 0; height: 2px;
  background: #10b981; z-index: 20;
  transition: width linear;
}
.status-progress-track {
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: rgba(255,255,255,0.1); z-index: 20;
}

/* ===== POST ===== */
.post-card {
  background: #111827; border: 1px solid #1e293b;
  border-radius: 16px; padding: 14px; margin-bottom: 12px;
}
.post-author {
  display: flex; align-items: center; gap: 10px; margin-bottom: 10px;
}
.post-author img {
  width: 38px; height: 38px; border-radius: 50%; object-fit: cover;
  border: 1px solid #1e293b;
}
.post-author .pname { font-weight: 700; font-size: 13px; color: #fff; }
.post-author .phandle { font-size: 10px; color: #64748b; }
.post-content {
  font-size: 13px; color: #e2e8f0; line-height: 1.6;
  margin-bottom: 10px; white-space: pre-wrap; word-break: break-word;
}
.post-media {
  border-radius: 12px; overflow: hidden; margin-bottom: 10px;
  background: #000;
}
.post-media img, .post-media video {
  width: 100%; max-height: 400px; object-fit: cover; display: block;
}
.post-reactions {
  display: flex; flex-wrap: wrap; gap: 4px; padding: 8px 0;
  border-top: 1px solid #1e293b;
}
.react-btn {
  padding: 5px 10px; border-radius: 20px; font-size: 15px;
  background: transparent; border: 1px solid transparent;
  cursor: pointer; transition: all 0.15s;
  display: inline-flex; align-items: center; gap: 3px;
  color: #fff;
}
.react-btn:hover { transform: scale(1.15); background: #1e293b; }
.react-btn.active {
  background: rgba(16,185,129,0.15);
  border-color: rgba(16,185,129,0.3);
}
.react-btn .count { font-size: 10px; color: #64748b; }
.post-actions {
  display: flex; gap: 16px; padding-top: 8px;
  border-top: 1px solid #1e293b; font-size: 12px; color: #64748b;
}
.post-actions button {
  background: transparent; border: none; color: #64748b;
  cursor: pointer; transition: color 0.2s;
  font-size: 12px; display: flex; align-items: center; gap: 4px;
  padding: 4px 0;
}
.post-actions button:hover { color: #e2e8f0; }
.post-actions button.saved { color: #f59e0b; }
.post-comments {
  margin-top: 10px; padding-top: 10px;
  border-top: 1px solid #1e293b;
  display: none;
}
.post-comments.open { display: block; }
.comment-item {
  background: #0f172a; padding: 8px 12px; border-radius: 8px;
  margin-bottom: 6px; font-size: 12px;
}
.comment-item .cname { font-weight: 600; color: #10b981; margin-right: 4px; }
.comment-item .ctext { color: #cbd5e1; }
.comment-input-wrap { display: flex; gap: 8px; margin-top: 8px; }
.comment-input-wrap input {
  flex: 1; background: #0f172a; border: 1px solid #1e293b;
  border-radius: 8px; padding: 8px 12px; font-size: 12px;
  color: #fff; outline: none;
}
.comment-input-wrap input:focus { border-color: #10b981; }
.comment-input-wrap button {
  background: #10b981; border: none; color: #000;
  font-weight: 700; padding: 8px 16px; border-radius: 8px;
  font-size: 11px; cursor: pointer;
}
.post-options-menu {
  display: none; margin-top: 8px; padding: 8px;
  background: #0f172a; border-radius: 8px;
  gap: 4px; flex-wrap: wrap;
}
.post-options-menu.open { display: flex; }
.post-options-menu button {
  background: transparent; border: none;
  font-size: 10px; cursor: pointer; padding: 6px 10px;
  border-radius: 6px; transition: background 0.2s;
}
.post-options-menu button:hover { background: #1e293b; }
.post-options-menu .opt-default { color: #94a3b8; }
.post-options-menu .opt-danger { color: #ef4444; }
.post-options-menu .opt-warn { color: #f59e0b; }

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed; inset: 0; z-index: 10000;
  background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  padding: 16px; animation: fadeIn 0.15s ease;
}
.modal-box {
  background: #111827; border: 1px solid #1e293b;
  border-radius: 16px; max-width: 440px; width: 100%;
  max-height: 90vh; overflow-y: auto; padding: 20px;
}
.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid #1e293b; padding-bottom: 12px;
  margin-bottom: 16px;
}
.modal-header h3 { font-size: 16px; font-weight: 700; color: #fff; }
.modal-close {
  background: transparent; border: none; color: #64748b;
  font-size: 22px; cursor: pointer; padding: 0 4px; line-height: 1;
}
.modal-close:hover { color: #fff; }
.form-label {
  display: block; font-size: 11px; font-weight: 600;
  color: #64748b; margin-bottom: 4px;
}
.form-input, .form-select, .form-textarea {
  width: 100%; background: #0f172a; border: 1px solid #1e293b;
  border-radius: 8px; padding: 10px 12px; font-size: 12px;
  color: #fff; outline: none; margin-bottom: 12px;
  font-family: inherit;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  border-color: #10b981;
}
.form-textarea { min-height: 90px; resize: vertical; }
.btn-primary {
  width: 100%; background: #10b981; border: none; color: #000;
  font-weight: 700; padding: 12px; border-radius: 10px;
  font-size: 13px; cursor: pointer; transition: opacity 0.2s;
}
.btn-primary:hover { opacity: 0.9; }
.btn-secondary {
  width: 100%; background: #1e293b; border: none; color: #fff;
  font-weight: 600; padding: 10px; border-radius: 8px;
  font-size: 12px; cursor: pointer; transition: opacity 0.2s;
  margin-top: 8px;
}
.btn-secondary:hover { opacity: 0.85; }

/* ===== MEDIA PREVIEW ===== */
.media-preview-box {
  margin-top: 8px; border-radius: 10px; overflow: hidden;
  border: 1px solid #1e293b; background: #0f172a;
  position: relative; display: none;
}
.media-preview-box.show { display: block; }
.media-preview-box img, .media-preview-box video {
  width: 100%; max-height: 240px; object-fit: contain;
  display: block; background: #000;
}
.media-preview-remove {
  position: absolute; top: 8px; right: 8px;
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.15);
  color: #fff; cursor: pointer; font-size: 12px;
  display: flex; align-items: center; justify-content: center;
}

/* ===== SHARE ===== */
.share-grid {
  display: grid; grid-template-columns: repeat(4, 1fr);
  gap: 10px; margin: 12px 0;
}
.share-item {
  display: flex; flex-direction: column; align-items: center;
  gap: 4px; padding: 10px 4px; border-radius: 10px;
  background: #0f172a; border: 1px solid #1e293b;
  cursor: pointer; transition: all 0.2s;
  font-size: 9px; color: #94a3b8;
}
.share-item:hover {
  border-color: #10b981; transform: scale(1.03);
  background: #111827;
}
.share-item i { font-size: 20px; }
.share-item.wa i { color: #25D366; }
.share-item.fb i { color: #1877F2; }
.share-item.ig i { color: #E4405F; }
.share-item.tt i { color: #000; }
.share-item.tw i { color: #000; }
.share-item.yt i { color: #FF0000; }
.share-item.gd i { color: #4285F4; }
.share-item.cp i { color: #10b981; }
.share-privacy {
  margin-top: 12px; padding-top: 12px;
  border-top: 1px solid #1e293b;
}
.privacy-pill {
  display: inline-block; padding: 4px 14px; border-radius: 20px;
  font-size: 10px; font-weight: 600; cursor: pointer;
  background: #1e293b; color: #94a3b8; border: none;
  margin-right: 6px; transition: all 0.2s;
}
.privacy-pill.active {
  background: rgba(16,185,129,0.15); color: #10b981;
  border: 1px solid rgba(16,185,129,0.3);
}

/* ===== SPARK ===== */
.spark-card {
  background: #111827; border: 1px solid #1e293b;
  border-radius: 16px; overflow: hidden;
  margin-bottom: 14px;
}
.spark-video-wrap {
  background: #000; display: flex; align-items: center;
  justify-content: center; position: relative; height: 400px;
}
.spark-video-wrap video {
  width: 100%; height: 100%; object-fit: cover;
}
.spark-badge {
  position: absolute; top: 8px; right: 8px;
  color: #fff; font-size: 8px; font-weight: 700;
  padding: 3px 10px; border-radius: 12px;
}
.spark-badge.spark { background: #3b82f6; }
.spark-badge.full { background: #ec4899; }
.spark-body { padding: 12px; }
.spark-author {
  display: flex; align-items: center; gap: 8px; margin-bottom: 6px;
}
.spark-author img {
  width: 30px; height: 30px; border-radius: 50%; object-fit: cover;
}
.spark-author .sname { font-weight: 700; font-size: 12px; color: #fff; }
.spark-author .shandle { font-size: 10px; color: #64748b; }
.spark-caption { font-size: 12px; color: #e2e8f0; margin-bottom: 6px; }
.spark-tags { font-size: 11px; margin-bottom: 6px; }
.spark-tags button {
  background: transparent; border: none; color: #10b981;
  cursor: pointer; font-weight: 600; margin-right: 4px;
  font-size: 11px;
}
.spark-actions {
  display: flex; gap: 14px; padding-top: 8px;
  border-top: 1px solid #1e293b; font-size: 11px; color: #64748b;
}
.spark-actions button {
  background: transparent; border: none; color: #64748b;
  cursor: pointer; display: flex; align-items: center;
  gap: 4px; font-size: 11px;
}
.spark-actions button.liked { color: #10b981; }

/* ===== CIRCLE ===== */
.circle-card {
  background: #111827; border: 1px solid #1e293b;
  border-radius: 16px; padding: 14px; margin-bottom: 10px;
  transition: border-color 0.2s;
}
.circle-card:hover { border-color: #334155; }
.circle-head {
  display: flex; justify-content: space-between;
  align-items: center; margin-bottom: 6px;
}
.circle-head-left {
  display: flex; align-items: center; gap: 10px;
}
.circle-head-left img {
  width: 42px; height: 42px; border-radius: 50%; object-fit: cover;
  border: 1px solid #1e293b;
}
.circle-name { font-weight: 700; font-size: 13px; color: #fff; }
.circle-meta { font-size: 10px; color: #64748b; }
.circle-type-badge {
  font-size: 9px; font-weight: 600; padding: 2px 8px;
  border-radius: 12px;
}
.type-social { background: rgba(16,185,129,0.15); color: #10b981; }
.type-services { background: rgba(59,130,246,0.15); color: #3b82f6; }
.type-goods { background: rgba(139,92,246,0.15); color: #8b5cf6; }
.circle-desc { font-size: 11px; color: #94a3b8; margin-bottom: 8px; }
.circle-join-btn {
  background: #10b981; border: none; color: #000;
  font-weight: 700; padding: 5px 14px; border-radius: 8px;
  font-size: 10px; cursor: pointer; white-space: nowrap;
}
.circle-joined {
  font-size: 10px; color: #10b981; font-weight: 600;
}
.shop-item {
  background: #0f172a; border: 1px solid #1e293b;
  border-radius: 8px; padding: 8px 10px;
}
.shop-item .siname { font-weight: 600; font-size: 11px; color: #fff; }
.shop-item .siprice { font-size: 10px; color: #10b981; margin-top: 2px; }

/* ===== PROFILE CARD ===== */
.profile-card {
  background: #111827; border: 1px solid #1e293b;
  border-radius: 16px; overflow: hidden;
}
.profile-cover { height: 110px; background: #0f172a; overflow: hidden; }
.profile-cover img { width: 100%; height: 100%; object-fit: cover; }
.profile-body { padding: 16px; margin-top: -34px; position: relative; }
.profile-avatar {
  width: 68px; height: 68px; border-radius: 50%;
  object-fit: cover; border: 4px solid #111827;
}
.profile-name { font-weight: 700; font-size: 16px; color: #fff; }
.profile-handle { font-size: 11px; color: #64748b; }
.profile-bio { font-size: 12px; color: #94a3b8; margin-top: 6px; }
.profile-stats {
  display: flex; gap: 16px; padding-top: 10px;
  border-top: 1px solid #1e293b; margin-top: 10px;
  font-size: 11px; color: #64748b;
}
.profile-stats strong { color: #fff; }

/* ===== STAT CARD ===== */
.stat-card {
  background: #0f172a; border: 1px solid #1e293b;
  border-radius: 12px; padding: 14px; text-align: center;
}
.stat-label { font-size: 9px; color: #64748b; font-weight: 600;
  text-transform: uppercase; letter-spacing: 0.05em; }
.stat-value { font-weight: 900; font-size: 18px; margin-top: 2px; }

/* ===== TOAST ===== */
#toast-container {
  position: fixed; bottom: 90px; left: 50%;
  transform: translateX(-50%); z-index: 99999;
  width: 90%; max-width: 380px; pointer-events: none;
}
.toast {
  background: rgba(17,24,39,0.95);
  border: 1px solid rgba(16,185,129,0.3);
  color: #f8fafc; padding: 10px 14px; border-radius: 12px;
  font-size: 12px; margin-bottom: 6px;
  backdrop-filter: blur(8px);
  display: flex; align-items: center; gap: 8px;
  opacity: 0; transform: translateY(10px);
  transition: all 0.3s ease; pointer-events: auto;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast i { color: #10b981; font-size: 16px; flex-shrink: 0; }

/* ===== UTILITY ===== */
.view-header {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 12px;
}
.view-back {
  background: transparent; border: none; color: #64748b;
  cursor: pointer; font-size: 16px; padding: 4px 8px;
}
.view-back:hover { color: #fff; }
.view-title {
  font-weight: 900; font-size: 16px; color: #fff;
}
.section-title {
  font-size: 10px; color: #64748b;
  text-transform: uppercase; font-weight: 700;
  letter-spacing: 0.05em; margin: 8px 0 6px;
  padding-left: 2px;
}
.empty-state {
  text-align: center; padding: 40px 20px; color: #64748b;
}
.empty-state i {
  font-size: 32px; display: block; margin-bottom: 12px;
  color: #334155;
}
.empty-state p { font-size: 12px; }
.media-grid-2 {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  margin-top: 8px;
}

@media (max-width: 640px) {
  .header-title { font-size: 16px; }

};

  var notifs = Z.DB.getNotifications();
  notifs.unshift({
    id: 'n_' + Date.now() + '_' + Math.random().toString(36).slice(2,6),
    userId: userId,
    type: type,
    message: message,
    meta: meta || {},
    read: false,
    timestamp: Date.now()
  });
  if (notifs.length > 100) notifs = notifs.slice(0, 100);
  Z.DB.saveNotifications(notifs);
  Z.updateNotifBadge();
};

Z.updateNotifBadge = function() {
  var u = Z.State.currentUser;

  var notifs = Z.DB.getNotifications().filter(function(n) { return n.userId === u.id && !n.read; });

  if (notifs.length > 0) {
    badge.textContent = notifs.length > 9 ? '9+' : notifs.length;
    badge.style.display = 'flex';
  } else {
    badge.style.display = 'none';
  }
};

// ============================================================
// REWARD ENGINE
// ============================================================
Z.RewardEngine = {
  split: function(a) {
    return { cash: Number((a * 0.60).toFixed(4)), bounty: Number((a * 0.40).toFixed(4)) };
  },
  checkDaily: function(user) {
    var today = new Date().toISOString().split('T')[0];
    if (!user.dailyTracker || user.dailyTracker.date !== today) {
      user.dailyTracker = { date: today, count: 0 };
    }
    var pkg = Z.Packages[user.package || 'Free'] || Z.Packages['Free'];
    return { allowed: user.dailyTracker.count < pkg.dailyLimit, current: user.dailyTracker.count, limit: pkg.dailyLimit };
  },
  credit: function(user, amount, reason) {
    if (!user) return false;
    var s = this.split(amount);
    if (!user.wallet) user.wallet = { cash: 0, bounty: 0, total: 0 };
    if (!user.walletTx) user.walletTx = [];
    user.wallet.cash += s.cash;
    user.wallet.bounty += s.bounty;
    user.wallet.total += amount;
    user.walletTx.unshift({
      id: 'tx_' + Date.now(), date: new Date().toISOString(),
      type: reason, amount: amount, cash: s.cash, bounty: s.bounty, status: 'Completed'
    });
    Z.DB.saveUsers();
    Z.updateHeader();
    Z.animateReward(amount);
    Z.toast('+$' + amount.toFixed(2) + ' ($' + s.cash.toFixed(3) + ' Cash, $' + s.bounty.toFixed(3) + ' Bounty)');
    return true;
  },
  process: function(ownerId, type, targetId, reactionType) {
    if (!Z.State.currentUser) { Z.openAuthModal('login'); Z.toast('Login required.'); return false; }
    var actor = Z.DB.getUserById(Z.State.currentUser.id);
    var pkg = Z.Packages[actor.package || 'Free'] || Z.Packages['Free'];
    if (!pkg.canEarn) { Z.toast('Free users cannot earn rewards. Upgrade!'); return false; }
    var limit = this.checkDaily(actor);
    if (!limit.allowed) { Z.toast('Daily limit reached.'); return false; }
    var owner = Z.DB.getUserById(ownerId);
    if (!owner || owner.id === actor.id) { Z.toast('Invalid action.'); return false; }
    if (!actor.history) actor.history = {};
    var key = type + '_' + (targetId || ownerId) + '_' + (reactionType || '');
    if (actor.history[key]) { Z.toast('Already rewarded.'); return false; }

    var amount = 0.01;
    if (reactionType && Z.Reactions[reactionType]) {
      amount = Z.Reactions[reactionType].reward;
    } else {
      var settings = owner.bountySettings || {};
      amount = settings[type] || 0.01;
    }
    amount = Math.min(0.05, Math.max(0, amount));

    if (!owner.wallet) owner.wallet = { cash: 0, bounty: 0, total: 0 };
    if (owner.wallet.bounty < amount) { Z.toast('Creator bounty insufficient.'); return false; }
    owner.wallet.bounty -= amount;
    if (!owner.bountySpent) owner.bountySpent = [];
    owner.bountySpent.unshift({
      id: 'bs_' + Date.now(), date: new Date().toISOString(),
      recipient: actor.name, action: type + (reactionType ? ' (' + reactionType + ')' : ''),
      amount: amount
    });

    // Update counters
    if (type === 'reaction' || type === 'like') {
      var post = Z.DB.getPosts().find(function(p) { return p.id === targetId; });
      if (post) {
        if (!post.reactions) post.reactions = {};
        post.reactions[reactionType || 'like'] = (post.reactions[reactionType || 'like'] || 0) + 1;
        if (!post._reactionUsers) post._reactionUsers = {};
        post._reactionUsers[actor.id] = reactionType || 'like';
        Z.DB.savePosts();
      }
    } else if (type === 'share') {
      var p2 = Z.DB.getPosts().find(function(p) { return p.id === targetId; });
      if (p2) { p2.shares = (p2.shares || 0) + 1; Z.DB.savePosts(); }
    } else if (type === 'spark_like') {
      var spark = Z.DB.getSparks().find(function(s) { return s.id === targetId; });
      if (spark) { spark.likes = (spark.likes || 0) + 1; Z.DB.saveSparks(); }
    } else if (type === 'connect') {
      owner.connections = (owner.connections || 0) + 1;
      if (!actor.connected) actor.connected = [];
      if (actor.connected.indexOf(owner.id) === -1) actor.connected.push(owner.id);
      // Notify owner
      Z.addNotification(ownerId, 'connect', actor.name + ' connected with you', { from: actor.id });
    } else if (type === 'circleJoin') {
      var circles = Z.DB.getCircles();
      var circle = circles.find(function(c) { return c.id === targetId; });
      if (circle) { circle.members = (circle.members || 0) + 1; Z.DB.saveCircles(circles); }
    } else if (type === 'comment') {
      Z.addNotification(ownerId, 'comment', actor.name + ' commented on your post', { from: actor.id, postId: targetId });
    }

    actor.history[key] = new Date().toISOString();
    actor.dailyTracker.count++;
    Z.DB.saveUsers();
    this.credit(actor, amount, (type + (reactionType ? ' ' + reactionType : '')).toUpperCase());
    if (['home', 'spark', 'people', 'circles'].indexOf(Z.State.currentView) !== -1) {
      Z.showView(Z.State.currentView);
    }
    return true;
  }
};

Z.animateReward = function(amount) {
  var el = document.querySelector('.zynix-header');
  if (el) {
    el.style.transition = 'box-shadow 0.3s';
    el.style.boxShadow = '0 0 30px rgba(16,185,129,0.5)';
    setTimeout(function() { el.style.boxShadow = 'none'; }, 500);
  }
  var note = document.createElement('div');
  note.style.cssText = 'position:fixed;z-index:99999;pointer-events:none;top:70px;right:20px;font-size:22px;font-weight:900;color:#10b981;opacity:0;transform:translateY(10px);transition:all 0.6s ease;';
  note.textContent = '💵 +$' + amount.toFixed(2);
  document.body.appendChild(note);
  requestAnimationFrame(function() {
    note.style.opacity = '1';
    note.style.transform = 'translateY(0)';
  });
  setTimeout(function() {
    note.style.opacity = '0';
    note.style.transform = 'translateY(-30px)';
    setTimeout(function() { note.remove(); }, 600);
  }, 1200);
};

Z.updateHeader = function() {
  var u = Z.State.currentUser;
  var c = document.getElementById('header-cash');
  var b = document.getElementById('header-bounty');
  if (c) c.innerText = '$' + (u && u.wallet ? u.wallet.cash.toFixed(2) : '0.00');
  if (b) b.innerText = '$' + (u && u.wallet ? u.wallet.bounty.toFixed(2) : '0.00');
  Z.updateNotifBadge();
};

Z.toggleTheme = function() {
  var html = document.documentElement;
  var icon = document.getElementById('theme-icon');
  if (html.classList.contains('dark')) {
    html.classList.remove('dark'); html.classList.add('light');
    if (icon) icon.className = 'fa-solid fa-sun';
  } else {
    html.classList.remove('light'); html.classList.add('dark');
    if (icon) icon.className = 'fa-solid fa-moon';
  }
};

Z.openAuthModal = function(mode) {

      wallet: { cash: 0, bounty: 0, total: 0 }, walletTx: [], bountySpent: [], saved: [],

      email: email, password: pass, history: {},
      dailyTracker: { date: new Date().toISOString().split('T')[0], count: 0 },

// STATUS (WhatsApp style)
// ============================================================
function _getUsers() { try { return Z.DB.getUsers(); } catch (e) { return []; } }
function _getStatuses() { try { return Z.DB.getStatuses(); } catch (e) { return []; } }
function _saveStatuses(arr) { try { Z.DB.saveStatuses(arr); } catch (e) {} }
function _userById(id) {
  var users = _getUsers();
  for (var i = 0; i < users.length; i++) {
    if (String(users[i].id) === String(id)) return users[i];
  }
  return null;
}
function _userName(u) { return u ? (u.name || u.username || 'User') : 'User'; }
function _userAvatar(u) {
  return u && u.avatar ? u.avatar : 'https://ui-avatars.com/api/?name=' + encodeURIComponent(_userName(u)) + '&background=111827&color=34d399';
}
function _currentUser() { return Z.State.currentUser || Z.DB.getCurrentUser() || null; }

function _liveStatuses() {
  var now = Date.now();
  var all = _getStatuses();
  var result = [];
  for (var i = 0; i < all.length; i++) {
    var s = all[i];
    if (!s) continue;
    var expires = Number(s.expiresAt || 0);
    if (expires && expires <= now) continue;
    var created = Number(s.timestamp || 0);
    if (created && now - created > 24 * 60 * 60 * 1000) continue;
    result.push(s);
  }
  result.sort(function(a, b) { return Number(b.timestamp || 0) - Number(a.timestamp || 0); });
  return result;
}

Z.getStatusContacts = function() {
  var me = _currentUser();
  var users = _getUsers();
  if (!me) return [];
  var ids = Array.isArray(me.connected) ? me.connected.map(String) : [];
  if (!ids.length) {
    var result = [];
    for (var j = 0; j < users.length; j++) {
      if (String(users[j].id) !== String(me.id)) result.push(users[j]);
    }
    return result;
  }
  var filtered = [];
  for (var k = 0; k < users.length; k++) {
    if (ids.indexOf(String(users[k].id)) !== -1 && String(users[k].id) !== String(me.id)) {
      filtered.push(users[k]);
    }
  }
  return filtered;
};

Z.getActiveStatuses = function() {
  var all = _liveStatuses();
  var contacts = Z.getStatusContacts();
  var me = _currentUser();
  var allowed = {};
  for (var i = 0; i < contacts.length; i++) { allowed[String(contacts[i].id)] = true; }
  if (me) allowed[String(me.id)] = true;
  var result = [];
  for (var j = 0; j < all.length; j++) {
    if (allowed[String(all[j].authorId)]) result.push(all[j]);
  }
  return result;
};

Z.openCreateStatusModal = function() {
  if (!_currentUser()) { Z.openAuthModal('login'); return; }
  var html = '<div class="modal-overlay" onclick="if(event.target===this)Z.closeModal()"><div class="modal-box">' +
    '<div class="modal-header"><h3>Add Status <span style="font-size:10px;color:#10b981;">24h</span></h3><button class="modal-close" onclick="Z.closeModal()">×</button></div>' +
    '<label class="form-label">What\'s happening?</label><textarea id="status-text" class="form-textarea" placeholder="Type something..."></textarea>' +
    '<label class="form-label">Photo / Video</label><input type="file" id="status-file" accept="image/*,video/*" class="form-input" onchange="Z.previewStatusFile(this)">' +
    '<div id="status-preview" class="media-preview-box"></div>' +
    '<button class="btn-primary" onclick="Z.submitStatus()">Publish Status</button>' +
    '</div></div>';
  Z.openModal(html);

Z.previewStatusFile = function(input) {
  var f = input && input.files && input.files[0];
  if (!f) return;
  if (f.size > 100 * 1024 * 1024) { Z.toast('Media under 100 MB.'); input.value = ''; return; }
  var box = document.getElementById('status-preview');
  if (!box) return;
  var url = URL.createObjectURL(f);
  if (f.type.indexOf('video/') === 0) {
    box.innerHTML = '<video src="' + url + '" controls muted style="width:100%;max-height:200px;object-fit:contain;background:#000;"></video>';
  } else {
    box.innerHTML = '<img src="' + url + '" style="width:100%;max-height:200px;object-fit:contain;background:#000;">';
  }
  box.classList.add('show');
};

Z.submitStatus = async function() {
  var text = document.getElementById('status-text').value.trim();
  var file = document.getElementById('status-file');
  var me = _currentUser();
  if (!text && (!file || !file.files || !file.files[0])) { Z.toast('Add text or media.'); return; }
  if (!me) return;

  var media = '', mediaType = '';
  if (file && file.files && file.files[0]) {
    try {
      var reader = new FileReader();
      media = await new Promise(function(resolve) {
        reader.onload = function(e) { resolve(e.target.result); };
        reader.readAsDataURL(file.files[0]);
      });
      mediaType = file.files[0].type.indexOf('video/') === 0 ? 'video' : 'image';
    } catch (e) { Z.toast('Could not read.'); return; }
  }

  var now = Date.now();
  var current = _liveStatuses();
  current.unshift({
    id: 'st_' + now + '_' + Math.random().toString(36).slice(2),
    type: 'status', authorId: me.id,
    content: text || '', media: media || '', mediaType: mediaType || '',
    timestamp: now, expiresAt: now + 24 * 60 * 60 * 1000, viewedBy: []
  });
  _saveStatuses(current);
  Z.closeModal();
  Z.toast('Status published for 24 hours.');
  Z.showView('home');
};

Z.renderStatusRow = function() {
  var existing = document.getElementById('status-row');
  if (existing) existing.remove();
  var home = document.getElementById('app-container');
  if (!home) return;
  var me = _currentUser();
  if (!me) return;

  var all = Z.getActiveStatuses();
  var grouped = {};
  for (var i = 0; i < all.length; i++) {
    var id = String(all[i].authorId);
    if (!grouped[id]) grouped[id] = [];
    grouped[id].push(all[i]);
  }
  var keys = Object.keys(grouped);
  var entries = [];
  for (var j = 0; j < keys.length; j++) {
    var arr = grouped[keys[j]];
    arr.sort(function(a, b) { return Number(b.timestamp || 0) - Number(a.timestamp || 0); });
    var user = _userById(keys[j]);
    if (user) entries.push({ user: user, statuses: arr });
  }
  entries.sort(function(a, b) {
    return Number(b.statuses[0]?.timestamp || 0) - Number(a.statuses[0]?.timestamp || 0);
  });

  var html = '<div id="status-row" class="status-row-wrap"><div class="status-scroll">';
  html += '<button onclick="Z.openCreateStatusModal()" class="status-item">' +
    '<div style="width:58px;height:58px;border-radius:50%;background:#0f172a;border:2px dashed #10b981;display:flex;align-items:center;justify-content:center;margin:0 auto;">' +
    '<i class="fa-solid fa-plus" style="color:#10b981;font-size:18px;"></i></div>' +
    '<span class="status-label" style="font-weight:700;color:#cbd5e1;">Add Status</span></button>';

  for (var k = 0; k < entries.length; k++) {
    var entry = entries[k];
    var u = entry.user;
    var hasViewed = entry.statuses.some(function(s) { return s.viewedBy && s.viewedBy.indexOf(me.id) !== -1; });
    var ringClass = hasViewed ? 'status-ring-seen' : 'status-ring-unseen';
    html += '<button onclick="Z.openStatusViewer(\'' + Z.escape(u.id) + '\',0)" class="status-item">' +
      '<div class="' + ringClass + '">' +
      '<div class="status-ring-inner">' +
      '<img src="' + Z.escape(_userAvatar(u)) + '">' +
      '</div></div>' +
      '<span class="status-label">' + Z.escape(_userName(u)) + '</span></button>';
  }

  html += '</div></div>';
  var first = home.querySelector('div');
  if (first) first.insertAdjacentHTML('afterbegin', html);
  else home.insertAdjacentHTML('afterbegin', html);
};

Z.openStatusViewer = function(authorId, index) {
  // REMOVE any existing viewer first - FIXES STACKING BUG
  var existing = document.getElementById('status-viewer');
  if (existing) existing.remove();

  var all = Z.getActiveStatuses();
  Z.State.viewerStatuses = all.filter(function(s) { return String(s.authorId) === String(authorId); });
  Z.State.viewerStatuses.sort(function(a, b) { return Number(b.timestamp || 0) - Number(a.timestamp || 0); });
  if (!Z.State.viewerStatuses.length) { Z.toast('No statuses.'); return; }

  var me = _currentUser();
  if (me) {
    for (var i = 0; i < Z.State.viewerStatuses.length; i++) {
      if (!Z.State.viewerStatuses[i].viewedBy) Z.State.viewerStatuses[i].viewedBy = [];
      if (Z.State.viewerStatuses[i].viewedBy.indexOf(me.id) === -1) {
        Z.State.viewerStatuses[i].viewedBy.push(me.id);
      }
    }
    _saveStatuses(_getStatuses());
  }
  Z.State.viewerAuthorId = String(authorId);
  Z.State.viewerIndex = Math.max(0, Math.min(Number(index || 0), Z.State.viewerStatuses.length - 1));
  Z.showStatusViewer();
};

Z.showStatusViewer = function() {
  // Remove existing viewer first
  var old = document.getElementById('status-viewer');
  if (old) old.remove();

  var status = Z.State.viewerStatuses[Z.State.viewerIndex];
  if (!status) { Z.showView('home'); return; }
  var author = _userById(status.authorId);
  if (!author) { Z.showView('home'); return; }

  var stageContent = '';
  if (status.media) {
    if (status.mediaType === 'video') {
      stageContent = '<video src="' + Z.escape(status.media) + '" controls autoplay playsinline></video>';
    } else {
      stageContent = '<img src="' + Z.escape(status.media) + '" alt="Status">';
    }
  } else {
    stageContent = '<div class="text-status">' + Z.escape(status.content || '') + '</div>';
  }

  var total = Z.State.viewerStatuses.length;
  var current = Z.State.viewerIndex + 1;

  var html = '<div class="status-viewer-overlay" id="status-viewer">' +
    '<div class="status-progress-track"></div>' +
    '<div class="status-viewer-header">' +
    '<button onclick="Z.closeStatusViewer()" style="background:transparent;border:none;color:#fff;font-size:22px;cursor:pointer;line-height:1;">×</button>' +
    '<div style="display:flex;align-items:center;gap:8px;">' +
    '<img src="' + Z.escape(_userAvatar(author)) + '" style="width:32px;height:32px;border-radius:50%;object-fit:cover;">' +
    '<div><div style="font-weight:700;font-size:13px;">' + Z.escape(_userName(author)) + '</div>' +
    '<div style="font-size:10px;color:#94a3b8;">' + current + ' / ' + total + '</div></div>' +
    '</div>' +
    '<div style="width:32px;"></div>' +
    '</div>' +
    '<div class="status-viewer-body" id="status-viewer-body">' +
    '<div class="status-stage">' + stageContent + '</div>' +
    '<button onclick="Z.statusPrev()" class="status-nav-btn left"><i class="fa-solid fa-chevron-left"></i></button>' +
    '<button onclick="Z.statusNext()" class="status-nav-btn right"><i class="fa-solid fa-chevron-right"></i></button>' +
    '</div>' +
    '<div class="status-viewer-footer">' +
    '<button onclick="Z.statusPrev()">‹ Prev</button>' +
    '<span style="font-size:10px;color:#64748b;">24h Status</span>' +
    '<button onclick="Z.statusNext()">Next ›</button>' +
    '</div>' +
    '</div>';

  document.body.insertAdjacentHTML('beforeend', html);

  if (status.mediaType !== 'video') Z.startStatusTimer();
  Z.setupStatusTouch();
};

Z.startStatusTimer = function() {
  Z.clearStatusTimer();
  Z.State.viewerTimer = setTimeout(function() { Z.statusNext(); }, 7000);
};

Z.clearStatusTimer = function() {
  if (Z.State.viewerTimer) { clearTimeout(Z.State.viewerTimer); Z.State.viewerTimer = null; }
};

Z.setupStatusTouch = function() {
  var body = document.getElementById('status-viewer-body');
  if (!body) return;
  var paused = false;
  var startX = 0, startY = 0;

  body.addEventListener('touchstart', function(e) {
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    paused = true;
    Z.clearStatusTimer();
  }, { passive: true });

  body.addEventListener('touchend', function(e) {
    if (!paused) return;
    paused = false;
    var diffX = startX - e.changedTouches[0].clientX;
    var diffY = startY - e.changedTouches[0].clientY;
    if (Math.abs(diffX) > 50 && Math.abs(diffX) > Math.abs(diffY)) {
      if (diffX > 0) Z.advanceToNextContact();
      else Z.advanceToPrevContact();
    } else {
      var status = Z.State.viewerStatuses[Z.State.viewerIndex];
      if (status && status.mediaType !== 'video') Z.startStatusTimer();
    }
  }, { passive: true });

  body.addEventListener('mousedown', function(e) {
    if (e.target.closest('button')) return;
    paused = true;
    Z.clearStatusTimer();
  });
  body.addEventListener('mouseup', function() {
    if (!paused) return;
    paused = false;
    var status = Z.State.viewerStatuses[Z.State.viewerIndex];
    if (status && status.mediaType !== 'video') Z.startStatusTimer();
  });
};

Z.advanceToNextContact = function() {
  var all = Z.getActiveStatuses();
  var map = {};
  for (var i = 0; i < all.length; i++) {
    var id = String(all[i].authorId);
    if (!map[id]) map[id] = [];
    map[id].push(all[i]);
  }
  var keys = Object.keys(map);
  if (keys.length <= 1) { Z.closeStatusViewer(); return; }
  var idx = keys.indexOf(String(Z.State.viewerAuthorId));
  var next = (idx + 1) % keys.length;
  Z.openStatusViewer(keys[next], 0);
};

Z.advanceToPrevContact = function() {
  var all = Z.getActiveStatuses();
  var map = {};
  for (var i = 0; i < all.length; i++) {
    var id = String(all[i].authorId);
    if (!map[id]) map[id] = [];
    map[id].push(all[i]);
  }
  var keys = Object.keys(map);
  if (keys.length <= 1) { Z.closeStatusViewer(); return; }
  var idx = keys.indexOf(String(Z.State.viewerAuthorId));
  var prev = (idx - 1 + keys.length) % keys.length;
  Z.openStatusViewer(keys[prev], 0);
};

Z.statusPrev = function() {
  Z.clearStatusTimer();
  if (Z.State.viewerIndex > 0) { Z.State.viewerIndex--; Z.showStatusViewer(); }
  else Z.advanceToPrevContact();
};

Z.statusNext = function() {
  Z.clearStatusTimer();
  if (Z.State.viewerIndex < Z.State.viewerStatuses.length - 1) { Z.State.viewerIndex++; Z.showStatusViewer(); }
  else Z.advanceToNextContact();
};

Z.closeStatusViewer = function() {
  Z.clearStatusTimer();
  var viewer = document.getElementById('status-viewer');
  if (viewer) viewer.remove();
  Z.showView('home');
};

// ============================================================
// HELPERS
// ============================================================
function _getAuthor(id) {
  var users = _getUsers();
  for (var i = 0; i < users.length; i++) {
    if (users[i].id === id) return users[i];
  }
  return { id: 'unknown', name: 'User', username: 'user', role: 'Creator', avatar: '', bountySettings: {} };
}

function _mediaHtml(media) {
  if (!media) return '';
  var m = String(media);
  if (m.indexOf('data:video/') === 0 || /\.(mp4|webm|ogg)(\?|$)/i.test(m)) {
    return '<div class="post-media"><video src="' + Z.escape(m) + '" controls playsinline></video></div>';
  }
  if (m.indexOf('data:image/') === 0 || /\.(png|jpe?g|gif|webp|avif)(\?|$)/i.test(m)) {
    return '<div class="post-media"><img src="' + Z.escape(m) + '" alt="Post"></div>';
  }
  return '<a href="' + Z.escape(m) + '" target="_blank" style="display:block;background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:8px 12px;font-size:11px;color:#10b981;text-decoration:none;margin-bottom:10px;word-break:break-all;">Open link</a>';
}

function _hasReacted(p, u, r) {
  return !!(p && u && p._reactionUsers && p._reactionUsers[u.id] === r);
}

function _timeAgo(ts) {
  var diff = Date.now() - (ts || 0);
  var min = Math.floor(diff / 60000);
  if (min < 1) return 'just now';
  if (min < 60) return min + 'm ago';
  var hr = Math.floor(min / 60);
  if (hr < 24) return hr + 'h ago';
  var day = Math.floor(hr / 24);
  return day + 'd ago';
}

// ============================================================
// POST REACTIONS
// ============================================================
Z.reactToPost = function(postId, reactionType) {
  var actor = _currentUser();
  if (!actor) { Z.openAuthModal('login'); return; }
  var ps = Z.DB.getPosts();
  var p = null;
  for (var i = 0; i < ps.length; i++) {
    if (ps[i] && ps[i].id === postId) { p = ps[i]; break; }
  }
  if (!p) return;

  p.reactions = p.reactions || {};
  p._reactionUsers = p._reactionUsers || {};

  var old = p._reactionUsers[actor.id];
  if (old && p.reactions[old]) {
    p.reactions[old] = Math.max(0, Number(p.reactions[old] || 0) - 1);
    delete p._reactionUsers[actor.id];
  }

  if (reactionType !== 'dislike') {
    p.reactions[reactionType] = Number(p.reactions[reactionType] || 0) + 1;
    p._reactionUsers[actor.id] = reactionType;
  }
  Z.DB.savePosts(ps);

  var reward = Z.Reactions[reactionType];
  if (reward && reward.reward > 0) {
    Z.RewardEngine.process(p.authorId, 'reaction', p.id, reactionType);
  } else {
    Z.toast('Reaction added!');
    Z.showView('home');
  }
};

  var text = el ? el.value.trim() : '';

  for (var i = 0; i < ps.length; i++) {
    if (ps[i] && ps[i].id === postId) { p = ps[i]; break; }

  if (!p) return;

  p.comments.push({ id: 'c_' + Date.now(), authorId: u.id, text: text, time: Date.now() });

Z.deletePost = function(postId) {
  var u = _currentUser();
  if (!u) { Z.openAuthModal('login'); return; }
  var ps = Z.DB.getPosts();
  var p = null;
  for (var i = 0; i < ps.length; i++) {
    if (ps[i] && ps[i].id === postId) { p = ps[i]; break; }
  }
  if (!p) return;
  // OWNERSHIP CHECK - FIXED
  if (p.authorId !== u.id && u.role !== 'Admin') {
    Z.toast('You can only delete your own posts.');
    return;
  }
  if (!confirm('Delete this post permanently?')) return;
  for (var j = 0; j < ps.length; j++) {
    if (ps[j].id === postId) { ps.splice(j, 1); break; }
  }
  Z.DB.savePosts(ps);
  Z.toast('Post deleted.');
  Z.showView(Z.State.currentView);
};

Z.reportPost = function(postId) {

  notifs.unshift({
    id: 'report_' + Date.now(),
    userId: 'admin',
    type: 'report',
    message: u.name + ' reported post ' + postId + ': ' + reason,
    meta: { postId: postId, from: u.id, reason: reason },
    read: false,
    timestamp: Date.now()
  });

  Z.toast('Report submitted. Thank you!');
};

Z.toggleSavePost = function(postId) {
  var u = _currentUser();
  if (!u) { Z.openAuthModal('login'); return; }

};

Z.shareTo = function(platform, url, postId) {
  Z.closeModal();
  switch (platform) {
    case 'whatsapp':
      window.open('https://wa.me/?text=' + encodeURIComponent('Check this on ZYNIX: ' + url), '_blank');
      break;
    case 'facebook':
      window.open('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(url), '_blank');
      break;
    case 'twitter':
      window.open('https://twitter.com/intent/tweet?text=' + encodeURIComponent('Check this on ZYNIX!') + '&url=' + encodeURIComponent(url), '_blank');
      break;
    case 'instagram':
    case 'tiktok':
    case 'youtube':
    case 'google':
      navigator.clipboard.writeText(url).then(function() {
        Z.toast('Link copied! Share on ' + platform.charAt(0).toUpperCase() + platform.slice(1));
      });
      break;
    case 'copy':
      navigator.clipboard.writeText(url).then(function() { Z.toast('Link copied!'); });
      break;
  }
  var ps = Z.DB.getPosts();
  for (var i = 0; i < ps.length; i++) {
    if (ps[i].id === postId) {
      ps[i].shares = Number(ps[i].shares || 0) + 1;
      Z.DB.savePosts(ps);
      if (ps[i].authorId) Z.RewardEngine.process(ps[i].authorId, 'share', ps[i].id);
      break;
    }
  }
};

Z.previewComposerFile = function(input) {
  var f = input && input.files && input.files[0];
  if (!f) return;
  if (f.size > 20 * 1024 * 1024) { Z.toast('Media under 20 MB.'); input.value = ''; return; }
  var box = document.getElementById('composer-preview');
  if (!box) return;
  var url = URL.createObjectURL(f);
  if (f.type.indexOf('video/') === 0) {
    box.innerHTML = '<video src="' + url + '" controls muted style="width:100%;max-height:220px;object-fit:contain;background:#000;"></video>';
  } else {
    box.innerHTML = '<img src="' + url + '" style="width:100%;max-height:220px;object-fit:contain;background:#000;">';
  }
  box.classList.add('show');
};

Z.submitComposer = function() {
  var u = _currentUser();
  if (!u) { Z.openAuthModal('login'); return; }
  var text = document.getElementById('composer-text').value.trim();
  var file = document.getElementById('composer-file');
  if (!text && (!file || !file.files || !file.files[0])) { Z.toast('Write something or attach media.'); return; }

  var finish = function(media) {
    var ps = Z.DB.getPosts();
    ps.unshift({
      id: 'post_' + Date.now(), authorId: u.id,
      content: text || '', media: media || '',
      createdAt: Date.now(), reactions: {}, _reactionUsers: {},
      comments: [], shares: 0
    });
    Z.DB.savePosts(ps);
    Z.cancelComposer();
    Z.toast('Post published!');
    Z.showView('home');
  };

  if (file && file.files && file.files[0]) {
    var reader = new FileReader();
    reader.onload = function(e) { finish(e.target.result); };
    reader.readAsDataURL(file.files[0]);
  } else {
    finish('');

Z.renderSpark = function() {
  var sparks = Z.DB.getSparks();
  var filter = (Z.State.sparkFilter || '').toLowerCase();
  var filtered = [];
  for (var i = 0; i < sparks.length; i++) {
    var s = sparks[i];
    if (!filter) { filtered.push(s); continue; }
    var match = false;
    if (s.tags) {
      for (var t = 0; t < s.tags.length; t++) {
        if (s.tags[t].toLowerCase().indexOf(filter) !== -1) { match = true; break; }
      }
    }
    if (match) filtered.push(s);
  }

  var html = '<div style="display:flex;flex-direction:column;gap:14px;">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;"><h2 class="view-title"><i class="fa-solid fa-bolt" style="color:#10b981;margin-right:8px;"></i>ZYNIX Spark</h2>' +
    '<button onclick="Z.openCreateModal()" style="background:#10b981;border:none;color:#000;font-weight:700;padding:6px 14px;border-radius:8px;font-size:11px;cursor:pointer;">Create</button></div>';

  if (filter) {
    html += '<div style="display:flex;justify-content:space-between;align-items:center;background:#0f172a;border:1px solid #1e293b;padding:8px 12px;border-radius:8px;font-size:11px;">' +
      '<span style="color:#94a3b8;">Filter: <strong style="color:#10b981;">#' + Z.escape(filter) + '</strong></span>' +
      '<button onclick="Z.State.sparkFilter=\'\';Z.showView(\'spark\');" style="background:transparent;border:none;color:#ef4444;cursor:pointer;font-size:11px;">Clear</button></div>';
  }

  for (var j = 0; j < filtered.length; j++) {
    var spark = filtered[j];
    var a = _getAuthor(spark.authorId);
    var isFull = spark.type === 'fullvideo';
    var isLiked = spark._likedBy && Z.State.currentUser && spark._likedBy.indexOf(Z.State.currentUser.id) !== -1;

    var tagsHtml = '';
    if (spark.tags && spark.tags.length) {
      for (var k = 0; k < spark.tags.length; k++) {
        tagsHtml += '<button onclick="Z.State.sparkFilter=\'' + Z.escape(spark.tags[k]) + '\';Z.showView(\'spark\');">#' + Z.escape(spark.tags[k]) + '</button>';
      }
    }

    html += '<div class="spark-card">' +
      '<div class="spark-video-wrap">' +
      '<video src="' + Z.escape(spark.videoUrl) + '" controls playsinline preload="metadata"></video>' +
      '<span class="spark-badge ' + (isFull ? 'full' : 'spark') + '">' + (isFull ? 'Full Video' : 'Spark') + '</span>' +
      '</div>' +
      '<div class="spark-body">' +
      (isFull && spark.title ? '<div style="font-weight:700;font-size:14px;color:#fff;margin-bottom:4px;">' + Z.escape(spark.title) + '</div>' : '') +
      (isFull && spark.description ? '<div style="font-size:11px;color:#64748b;margin-bottom:6px;">' + Z.escape(spark.description) + '</div>' : '') +
      '<div class="spark-author">' +
      '<img src="' + Z.escape(a.avatar) + '">' +
      '<div><div class="sname">' + Z.escape(a.name) + '</div><div class="shandle">@' + Z.escape(a.username) + '</div></div>' +
      '</div>' +
      '<div class="spark-caption">' + Z.escape(spark.caption || '') + '</div>' +
      (tagsHtml ? '<div class="spark-tags">' + tagsHtml + '</div>' : '') +
      '<div class="spark-actions">' +
      '<button class="' + (isLiked ? 'liked' : '') + '" onclick="Z.likeSpark(\'' + Z.escape(spark.id) + '\',\'' + Z.escape(a.id) + '\')"><i class="fa-' + (isLiked ? 'solid' : 'regular') + ' fa-heart"></i> ' + (spark.likes || 0) + '</button>' +
      '<button onclick="Z.sharePost(\'' + Z.escape(spark.id) + '\')"><i class="fa-solid fa-share-nodes"></i> ' + (spark.shares || 0) + '</button>' +
      '<span style="display:flex;align-items:center;gap:4px;"><i class="fa-regular fa-eye"></i> ' + (spark.views || 0) + '</span>' +
      '</div>' +
      '</div></div>';
  }

  if (!filtered.length) {
    html += '<div class="empty-state"><i class="fa-solid fa-bolt"></i><p>No Sparks yet.</p></div>';
  }

  html += '</div>';
  return html;
};

Z.likeSpark = function(sparkId, authorId) {
  var u = _currentUser();
  if (!u) { Z.openAuthModal('login'); return; }
  var sparks = Z.DB.getSparks();
  for (var i = 0; i < sparks.length; i++) {
    if (sparks[i].id === sparkId) {
      if (!sparks[i]._likedBy) sparks[i]._likedBy = [];
      var idx = sparks[i]._likedBy.indexOf(u.id);
      if (idx === -1) {
        sparks[i]._likedBy.push(u.id);
        sparks[i].likes = (sparks[i].likes || 0) + 1;
        Z.DB.saveSparks(sparks);
        Z.RewardEngine.process(authorId, 'spark_like', sparkId);
      } else {
        sparks[i]._likedBy.splice(idx, 1);
        sparks[i].likes = Math.max(0, (sparks[i].likes || 0) - 1);
        Z.DB.saveSparks(sparks);
        Z.showView('spark');
      }
      break;
    }
  }
};

Z.submitWithdraw = function() {
  var u = _currentUser();
  if (!u) return;
  var amount = parseFloat(document.getElementById('wd-amount').value) || 0;
  var method = document.getElementById('wd-method').value;
  var details = document.getElementById('wd-details').value.trim();
  if (amount < 10) { Z.toast('Minimum $10.'); return; }
  if (Number(u.wallet.cash) < amount) { Z.toast('Insufficient balance.'); return; }
  if (!details) { Z.toast('Enter details.'); return; }
  u.wallet.cash -= amount;
  if (!u.walletTx) u.walletTx = [];
  u.walletTx.unshift({
    id: 'wd_' + Date.now(), date: new Date().toISOString(),
    type: 'Withdrawal: ' + method, amount: -amount, cash: -amount,
    bounty: 0, status: 'Pending'
  });

  Z.closeModal();
  Z.toast('Withdrawal submitted!');
  Z.showView('wallet');
};

    { name: 'Pro $40', price: 40, desc: '$0.02/like, 100 daily.' },
    { name: 'Enterprise $100', price: 100, desc: '$0.025/like, 500 daily.' }
  ];

  var html = '<div style="display:flex;flex-direction:column;gap:12px;">' +
    '<div class="view-header"><button class="view-back" onclick="Z.showView(\'profile\')">←</button><h2 class="view-title">Packages</h2></div>';

  for (var i = 0; i < list.length; i++) {
    var p = list[i];
    var isCur = cur === p.name;
    html += '<div style="background:#111827;border:1px solid ' + (isCur ? '#10b981' : '#1e293b') + ';border-radius:16px;padding:16px;">' +
      '<div style="display:flex;justify-content:space-between;align-items:center;">' +
      '<span style="font-weight:700;font-size:14px;' + (isCur ? 'color:#10b981;' : 'color:#fff;') + '">' + Z.escape(p.name) + '</span>' +
      '<span style="font-weight:900;color:#10b981;">$' + p.price + '</span></div>' +
      '<p style="font-size:11px;color:#94a3b8;margin:4px 0 10px;">' + Z.escape(p.desc) + '</p>' +
      (isCur ?
        '<button disabled style="width:100%;background:#1e293b;border:none;color:#10b981;font-weight:700;padding:10px;border-radius:8px;font-size:11px;">✓ Current Plan</button>' :
        '<button onclick="Z.upgradePackage(\'' + Z.escape(p.name) + '\',' + p.price + ')" style="width:100%;background:#10b981;border:none;color:#000;font-weight:700;padding:10px;border-radius:8px;font-size:11px;cursor:pointer;">Upgrade for $' + p.price + '</button>') +
      '</div>';
  }

  html += '</div>';
  return html;
};

Z.upgradePackage = function(name, price) {
  if (!_currentUser()) { Z.openAuthModal('login'); return; }
  var u = Z.DB.getUserById(_currentUser().id);
  if (!u) return;
  var totalAvailable = Number(u.wallet.cash) + Number(u.wallet.bounty);
  if (totalAvailable < price) { Z.toast('Insufficient balance. Need $' + price.toFixed(2)); return; }
  // Deduct from cash first
  var remaining = price;
  var fromCash = Math.min(Number(u.wallet.cash), remaining);
  u.wallet.cash -= fromCash;
  remaining -= fromCash;
  if (remaining > 0) { u.wallet.bounty -= remaining; }
  u.package = name;
  if (!u.walletTx) u.walletTx = [];
  u.walletTx.unshift({
    id: 'pkg_' + Date.now(), date: new Date().toISOString(),
    type: 'Package: ' + name, amount: -price,
    cash: -fromCash, bounty: -remaining, status: 'Completed'
  });
  Z.DB.saveUsers();
  Z.toast('Upgraded to ' + name + '!');
  Z.showView('profile');
};

    '<label class="form-label">Package</label>' +

    '<option value="Pro $40">Pro $40 ($0.02/like)</option>' +
    '<option value="Enterprise $100" selected>Enterprise $100 ($0.025/like)</option>' +
    '</select>' +
    '<label class="form-label">Daily Interactions</label>' +
    '<input type="number" id="calc-interactions" class="form-input" value="50" oninput="Z.updateCalc()">' +

    '<div style="font-size:12px;color:#94a3b8;">Daily Gross: <strong id="calc-gross" style="color:#10b981;">$1.25</strong></div>' +

    '</div></div></div>';
};

Z.updateCalc = function() {
  var pkgName = document.getElementById('calc-package').value;
  var count = parseFloat(document.getElementById('calc-interactions').value) || 0;
  var pkg = Z.Packages[pkgName] || Z.Packages['Starter $3'];
  var rate = 0.01;
  if (pkgName === 'Enterprise $100') rate = 0.025;
  else if (pkgName === 'Creator $20' || pkgName === 'Pro $40') rate = 0.02;
  else if (pkgName === 'Growth $10') rate = 0.015;
  var gross = count * rate;
  document.getElementById('calc-gross').innerText = '$' + gross.toFixed(2);
  document.getElementById('calc-cash').innerText = '$' + (gross * 0.60).toFixed(2);
  document.getElementById('calc-bounty').innerText = '$' + (gross * 0.40).toFixed(2);
};

// ============================================================
Z.renderAnalytics = function() {
  var u = _currentUser() || _getUsers()[0];
  var posts = Z.DB.getPosts();
  var userPosts = posts.filter(function(p) { return p.authorId === u.id; });
  var totalReactions = 0;
  for (var i = 0; i < userPosts.length; i++) {
    if (userPosts[i].reactions) {
      var vals = Object.values(userPosts[i].reactions);
      for (var j = 0; j < vals.length; j++) totalReactions += vals[j];
    }
  }
  var totalBounty = 0;
  var history = u.bountySpent || [];
  for (var k = 0; k < history.length; k++) totalBounty += history[k].amount;

  return '<div style="display:flex;flex-direction:column;gap:12px;">' +
    '<div class="view-header"><button class="view-back" onclick="Z.showView(\'profile\')">←</button><h2 class="view-title">Analytics</h2></div>' +
    '<div style="background:#111827;border:1px solid #1e293b;border-radius:16px;padding:16px;">' +
    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">' +
    '<div class="stat-card"><div class="stat-label">Connections</div><div class="stat-value" style="color:#fff;">' + (u.connections || 0) + '</div></div>' +
    '<div class="stat-card"><div class="stat-label">Reactions</div><div class="stat-value" style="color:#10b981;">' + totalReactions + '</div></div>' +
    '<div class="stat-card"><div class="stat-label">Cash Earned</div><div class="stat-value" style="color:#3b82f6;">$' + Number(u.wallet ? u.wallet.cash : 0).toFixed(2) + '</div></div>' +
    '<div class="stat-card"><div class="stat-label">Bounty Spent</div><div class="stat-value" style="color:#8b5cf6;">$' + totalBounty.toFixed(2) + '</div></div>' +
    '</div></div></div>';
};

// ============================================================
// CIRCLES
// ============================================================
Z.renderCircles = function() {
  var circles = Z.DB.getCircles();
  var q = (Z.State.circleSearch || '').toLowerCase();
  var u = _currentUser();
  var joined = u && u.joinedCircles ? u.joinedCircles : [];

  var filtered = [];
  for (var i = 0; i < circles.length; i++) {
    var c = circles[i];
    if (c.name.toLowerCase().indexOf(q) !== -1 || c.description.toLowerCase().indexOf(q) !== -1) filtered.push(c);
  }

  var myCircles = [];
  var otherCircles = [];
  for (var j = 0; j < filtered.length; j++) {
    if (joined.indexOf(filtered[j].id) !== -1) myCircles.push(filtered[j]);
    else otherCircles.push(filtered[j]);
  }

  var html = '<div style="display:flex;flex-direction:column;gap:12px;">' +
    '<div class="view-header"><h2 class="view-title"><i class="fa-solid fa-circle-nodes" style="color:#10b981;margin-right:8px;"></i>Circles</h2></div>' +
    '<input type="text" placeholder="Search circles..." value="' + Z.escape(q) + '" oninput="Z.State.circleSearch=this.value;Z.showView(\'circles\');" style="width:100%;background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:10px 14px;font-size:12px;color:#fff;outline:none;">';

  if (myCircles.length) {
    html += '<div class="section-title">My Circles</div>';
    for (var m = 0; m < myCircles.length; m++) html += Z.renderCircleCard(myCircles[m], true);
  }
  if (otherCircles.length) {
    html += '<div class="section-title">Discover Circles</div>';
    for (var n = 0; n < otherCircles.length; n++) html += Z.renderCircleCard(otherCircles[n], false);
  }
  if (!filtered.length) {
    html += '<div class="empty-state"><i class="fa-solid fa-circle-nodes"></i><p>No circles found.</p></div>';
  }

  html += '<button onclick="Z.openCreateCircleModal()" style="width:100%;background:#10b981;border:none;color:#000;font-weight:700;padding:12px;border-radius:12px;font-size:12px;cursor:pointer;">+ Create Circle</button></div>';
  return html;
};

Z.renderCircleCard = function(c, isJoined) {
  var labels = { social: 'Social', services: 'Services', goods: 'Goods', office: 'Office', education: 'Education', events: 'Events' };
  var label = labels[c.type] || 'Social';
  var typeClass = 'type-social';
  if (c.type === 'services') typeClass = 'type-services';
  else if (c.type === 'goods') typeClass = 'type-goods';
  else if (c.type === 'office') typeClass = 'type-services';
  else if (c.type === 'education') typeClass = 'type-goods';
  else if (c.type === 'events') typeClass = 'type-social';

  var shopHtml = '';
  if (c.shopItems && c.shopItems.length) {
    shopHtml = '<div class="media-grid-2">';
    for (var i = 0; i < Math.min(c.shopItems.length, 4); i++) {
      var item = c.shopItems[i];
      shopHtml += '<div class="shop-item"><div class="siname">' + Z.escape(item.name) + '</div><div class="siprice">$' + item.price + '</div></div>';
    }
    shopHtml += '</div>';
  }

  return '<div class="circle-card">' +
    '<div class="circle-head">' +
    '<div class="circle-head-left">' +
    '<img src="' + Z.escape(c.avatar) + '">' +
    '<div><div class="circle-name">' + Z.escape(c.name) + '</div>' +
    '<div class="circle-meta">' + (c.members || 0) + ' members • <span class="circle-type-badge ' + typeClass + '">' + label + '</span></div></div>' +
    '</div>' +
    (isJoined ? '<span class="circle-joined"><i class="fa-solid fa-check"></i> Joined</span>' :
      '<button class="circle-join-btn" onclick="Z.RewardEngine.process(\'' + Z.escape(c.creatorId) + '\',\'circleJoin\',\'' + Z.escape(c.id) + '\')">Join ($0.02)</button>') +
    '</div>' +
    '<div class="circle-desc">' + Z.escape(c.description) + '</div>' +
    shopHtml +
    '</div>';
};

Z.renderNotifications = function() {
  var u = _currentUser();
  var notifs = Z.DB.getNotifications().filter(function(n) { return n.userId === u ? u.id : true; });
  if (u) {
    notifs = Z.DB.getNotifications().filter(function(n) { return n.userId === u.id || n.userId === 'admin'; });
  }

  var html = '<div style="display:flex;flex-direction:column;gap:12px;">' +
    '<div class="view-header"><button class="view-back" onclick="Z.showView(\'home\')">←</button><h2 class="view-title">Notifications</h2>' +
    (notifs.length ? '<button onclick="Z.markAllRead()" style="margin-left:auto;background:transparent;border:none;color:#10b981;font-size:11px;cursor:pointer;">Mark all read</button>' : '') +
    '</div>';

  if (notifs.length) {
    for (var i = 0; i < notifs.length; i++) {
      var n = notifs[i];
      html += '<div style="background:#111827;border:1px solid ' + (n.read ? '#1e293b' : 'rgba(16,185,129,0.3)') + ';border-radius:12px;padding:12px;display:flex;align-items:flex-start;gap:10px;">' +
        '<div style="width:8px;height:8px;border-radius:50%;margin-top:6px;background:' + (n.read ? '#334155' : '#10b981') + ';flex-shrink:0;"></div>' +
        '<div style="flex:1;"><div style="font-size:12px;color:#e2e8f0;">' + Z.escape(n.message) + '</div>' +
        '<div style="font-size:9px;color:#64748b;margin-top:2px;">' + new Date(n.timestamp).toLocaleString() + '</div></div>' +
        '</div>';
    }
  } else {
    html += '<div class="empty-state"><i class="fa-regular fa-bell"></i><p>No notifications yet.</p></div>';
  }

  html += '</div>';
  return html;
};

Z.markAllRead = function() {
  var u = _currentUser();
  if (!u) return;
  var notifs = Z.DB.getNotifications();
  for (var i = 0; i < notifs.length; i++) {
    if (notifs[i].userId === u.id) notifs[i].read = true;
  }
  Z.DB.saveNotifications(notifs);
  Z.updateNotifBadge();
  Z.showView('notifications');
};

// ============================================================
// RENDER ROUTER
// ============================================================
Z.renderView = function(view, param) {
  switch (view) {
    case 'home': return Z.renderHome();
    case 'spark': return Z.renderSpark();
    case 'people': return Z.renderPeople();
    case 'profile': return Z.renderProfile();
    case 'wallet': return Z.renderWallet();
    case 'bounty': return Z.renderBounty();
    case 'packages': return Z.renderPackages();
    case 'calculator': return Z.renderCalculator();
    case 'referrals': return Z.renderReferrals();
    case 'analytics': return Z.renderAnalytics();
    case 'circles': return Z.renderCircles();
    case 'admin-wall': return Z.renderAdminWall();
    case 'public-profile': return Z.renderPublicProfile(param);
    case 'notifications': return Z.renderNotifications();
    default: return Z.renderHome();
  }
};

Z.showView = function(view, param) {
  Z.State.currentView = view;
  window.scrollTo(0, 0);

  var btns = document.querySelectorAll('#bottom-nav button:not(.create-btn)');
  for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
  var map = { home: 'nav-home', spark: 'nav-spark', circles: 'nav-circles', people: 'nav-people', profile: 'nav-profile' };
  var activeId = map[view];
  if (activeId) {
    var btn = document.getElementById(activeId);
    if (btn) btn.classList.add('active');
  }

  var container = document.getElementById('app-container');
  if (!container) return;

  try {
    container.innerHTML = Z.renderView(view, param);
  } catch (e) {
    console.error('Render error:', e);
    container.innerHTML = '<div class="empty-state"><i class="fa-solid fa-triangle-exclamation" style="color:#f59e0b;"></i><p>Something went wrong.</p><button onclick="Z.showView(\'home\')" style="background:#10b981;border:none;color:#000;font-weight:700;padding:8px 20px;border-radius:8px;margin-top:12px;cursor:pointer;">Go Home</button></div>';
  }

  if (view === 'home') {
    setTimeout(function() { Z.renderStatusRow(); }, 60);
  }

  Z.updateHeader();
};

  return '<div style="display:flex;flex-direction:column;gap:14px;">' +

    '<div style="background:#000;"><video src="https://assets.mixkit.co/videos/preview/mixkit-digital-animation-of-screens-and-code-31910-large.mp4" controls style="width:100%;max-height:280px;object-fit:cover;"></video></div>' +

// ============================================================
// BOOT
// ============================================================
function boot() {
  try {
    if (!localStorage.getItem('zynix_users')) Z.DB.saveUsers(Z.SeedData.users);
    if (!localStorage.getItem('zynix_posts')) Z.DB.savePosts(Z.SeedData.posts);
    if (!localStorage.getItem('zynix_sparks')) Z.DB.saveSparks(Z.SeedData.sparks);
    if (!localStorage.getItem('zynix_statuses')) Z.DB.saveStatuses(Z.SeedData.statuses);
    if (!localStorage.getItem('zynix_circles')) Z.DB.saveCircles(Z.SeedData.circles);

    Z.State.currentUser = Z.DB.getCurrentUser();
    Z.renderHeaderAuth();
    Z.updateHeader();
    Z.showView('home');
  } catch (e) {
    console.error('Boot error:', e);
    var container = document.getElementById('app-container');
    if (container) {
      container.innerHTML = '<div class="empty-state"><i class="fa-solid fa-triangle-exclamation" style="color:#f59e0b;"></i><p>Failed to load. Please refresh.</p><button onclick="location.reload()" style="background:#10b981;border:none;color:#000;font-weight:700;padding:8px 20px;border-radius:8px;margin-top:12px;cursor:pointer;">Refresh</button></div>';
    }
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

})();
</script>

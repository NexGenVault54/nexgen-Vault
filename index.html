                    '<div style="background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:12px;text-align:center;">' +
                    '<div style="font-size:12px;color:#94a3b8;">Daily Gross: <strong id="calc-gross" style="color:#10b981;">$1.25</strong></div>' +
                    '<div style="font-size:11px;color:#64748b;">Cash: <span id="calc-cash" style="color:#10b981;font-weight:600;">$0.75</span> | Bounty: <span id="calc-bounty" style="color:#3b82f6;font-weight:600;">$0.50</span></div>' +
                    '</div></div></div>';
            };

            Z.updateCalc = function() {
                var pkgName = document.getElementById('calc-package').value;
                var count = parseFloat(document.getElementById('calc-interactions').value) || 0;
                var pkg = Z.Packages[pkgName] || Z.Packages['Starter $3'];
                var gross = count * (pkg.likeRewardRate || 0.01);
                var cash = gross * 0.60;
                var bounty = gross * 0.40;
                document.getElementById('calc-gross').innerText = '$' + gross.toFixed(2);
                document.getElementById('calc-cash').innerText = '$' + cash.toFixed(2);
                document.getElementById('calc-bounty').innerText = '$' + bounty.toFixed(2);
            };

            // ==========================================================
            // REFERRALS
            // ==========================================================
            Z.renderReferrals = function() {
                var u = _currentUser() || _getUsers()[0];
                var code = u.referrals ? u.referrals.code : 'ZYNIX-REF2026';
                var link = location.origin + location.pathname + '?ref=' + code;

                return '<div style="display:flex;flex-direction:column;gap:12px;"><div style="display:flex;align-items:center;gap:8px;"><button onclick="Z.showView(\'profile\')" style="background:transparent;border:none;color:#64748b;cursor:pointer;font-size:16px;">←</button><h2 style="font-weight:900;font-size:16px;color:#fff;">Referrals</h2></div>' +
                    '<div style="background:#111827;border:1px solid #1e293b;border-radius:16px;padding:16px;">' +
                    '<div style="background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:12px;"><span style="font-size:9px;color:#64748b;text-transform:uppercase;font-weight:600;">Your Code</span><div style="display:flex;justify-content:space-between;align-items:center;margin-top:2px;"><span style="font-size:11px;color:#10b981;font-family:monospace;">' +
                    Z.escape(link) +
                    '</span><button onclick="navigator.clipboard.writeText(\'' + Z.escape(link) +
                    '\');Z.toast(\'Copied!\')" style="background:#10b981;border:none;color:#000;font-weight:700;padding:2px 12px;border-radius:6px;font-size:10px;cursor:pointer;">Copy</button></div></div>' +
                    '<div style="display:flex;justify-content:space-between;background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:12px;margin-top:8px;"><span style="font-size:11px;color:#94a3b8;">Total Earnings</span><span style="font-weight:900;color:#10b981;">$' +
                    Number(u.referrals ? u.referrals.earnings || 0 : 0).toFixed(2) + '</span></div>' +
                    '</div></div>';
            };

            // ==========================================================
            // ANALYTICS
            // ==========================================================
            Z.renderAnalytics = function() {
                var u = _currentUser() || _getUsers()[0];
                var posts = Z.DB.getPosts();
                var userPosts = [];
                for (var i = 0; i < posts.length; i++) {
                    if (posts[i].authorId === u.id) userPosts.push(posts[i]);
                }
                var totalReactions = 0;
                for (var j = 0; j < userPosts.length; j++) {
                    var p = userPosts[j];
                    if (p.reactions) {
                        var vals = Object.values(p.reactions);
                        for (var k = 0; k < vals.length; k++) { totalReactions += vals[k]; }
                    }
                }
                var totalBounty = 0;
                var history = u.bountySpent || [];
                for (var m = 0; m < history.length; m++) { totalBounty += history[m].amount; }

                return '<div style="display:flex;flex-direction:column;gap:12px;"><div style="display:flex;align-items:center;gap:8px;"><button onclick="Z.showView(\'profile\')" style="background:transparent;border:none;color:#64748b;cursor:pointer;font-size:16px;">←</button><h2 style="font-weight:900;font-size:16px;color:#fff;">Analytics</h2></div>' +
                    '<div style="background:#111827;border:1px solid #1e293b;border-radius:16px;padding:16px;">' +
                    '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">' +
                    '<div style="background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:12px;text-align:center;"><span style="font-size:9px;color:#64748b;">Connections</span><div style="font-weight:900;font-size:16px;color:#fff;">' +
                    (u.connections || 0) + '</div></div>' +
                    '<div style="background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:12px;text-align:center;"><span style="font-size:9px;color:#64748b;">Reactions</span><div style="font-weight:900;font-size:16px;color:#10b981;">' +
                    totalReactions + '</div></div>' +
                    '<div style="background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:12px;text-align:center;"><span style="font-size:9px;color:#64748b;">Cash Earned</span><div style="font-weight:900;font-size:16px;color:#3b82f6;">$' +
                    Number(u.wallet ? u.wallet.cash || 0 : 0).toFixed(2) + '</div></div>' +
                    '<div style="background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:12px;text-align:center;"><span style="font-size:9px;color:#64748b;">Bounty Spent</span><div style="font-weight:900;font-size:16px;color:#8b5cf6;">$' +
                    totalBounty.toFixed(2) + '</div></div>' +
                    '</div></div></div>';
            };

            // ==========================================================
            // CIRCLES
            // ==========================================================
            Z.renderCircles = function() {
                var circles = Z.DB.getCircles();
                var query = (Z.State.circleSearch || '').toLowerCase();
                var u = _currentUser();
                var joined = u && u.joinedCircles ? u.joinedCircles : [];

                var filtered = [];
                for (var i = 0; i < circles.length; i++) {
                    var c = circles[i];
                    if (c.name.toLowerCase().indexOf(query) !== -1 || c.description.toLowerCase().indexOf(query) !==
                        -1) {
                        filtered.push(c);
                    }
                }

                var typeLabels = { social: 'Social', services: 'Services', goods: 'Goods' };
                var typeColors = { social: '#10b981', services: '#3b82f6', goods: '#8b5cf6' };

                var html =
                    '<div style="display:flex;flex-direction:column;gap:12px;"><div style="display:flex;justify-content:space-between;align-items:center;"><h2 style="font-weight:900;font-size:16px;color:#fff;"><i class="fa-solid fa-circle-nodes" style="color:#10b981;margin-right:8px;"></i>Circles</h2></div>' +
                    '<input type="text" id="circle-search" placeholder="Search circles..." value="' + Z.escape(query) +
                    '" oninput="Z.State.circleSearch=this.value;Z.showView(\'circles\');" style="width:100%;background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:8px 14px;font-size:12px;color:#fff;outline:none;">';

                var myCircles = [];
                var otherCircles = [];
                for (var j = 0; j < filtered.length; j++) {
                    var c2 = filtered[j];
                    if (joined.indexOf(c2.id) !== -1) {
                        myCircles.push(c2);
                    } else {
                        otherCircles.push(c2);
                    }
                }

                if (myCircles.length) {
                    html += '<div style="margin-top:4px;"><span style="font-size:9px;color:#64748b;text-transform:uppercase;font-weight:600;">My Circles</span>';
                    for (var m = 0; m < myCircles.length; m++) {
                        html += Z.renderCircleCard(myCircles[m], true);
                    }
                    html += '</div>';
                }

                if (otherCircles.length) {
                    html += '<div style="margin-top:4px;"><span style="font-size:9px;color:#64748b;text-transform:uppercase;font-weight:600;">All Circles</span>';
                    for (var n = 0; n < otherCircles.length; n++) {
                        html += Z.renderCircleCard(otherCircles[n], false);
                    }
                    html += '</div>';
                }

                if (!filtered.length) {
                    html +=
                        '<div style="text-align:center;padding:20px;color:#64748b;font-size:12px;">No circles found.</div>';
                }

                html += '<button onclick="Z.openCreateCircleModal()" style="width:100%;background:#10b981;border:none;color:#000;font-weight:700;padding:10px;border-radius:12px;font-size:12px;cursor:pointer;">+ Create Circle</button>';
                html += '</div>';
                return html;
            };

            Z.renderCircleCard = function(circle, isJoined) {
                var typeLabels = { social: 'Social', services: 'Services', goods: 'Goods' };
                var typeColors = { social: '#10b981', services: '#3b82f6', goods: '#8b5cf6' };
                var label = typeLabels[circle.type] || 'Social';
                var color = typeColors[circle.type] || '#10b981';

                var shopItems = '';
                if (circle.shopItems && circle.shopItems.length) {
                    shopItems = '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px;">';
                    for (var i = 0; i < Math.min(circle.shopItems.length, 4); i++) {
                        var item = circle.shopItems[i];
                        shopItems += '<div style="background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:6px 10px;"><div style="font-weight:600;font-size:11px;color:#fff;">' +
                            Z.escape(item.name) + '</div><div style="font-size:10px;color:#10b981;">$' + item
                            .price + '</div></div>';
                    }
                    shopItems += '</div>';
                }

                return '<div style="background:#111827;border:1px solid #1e293b;border-radius:16px;padding:12px;margin-bottom:8px;">' +
                    '<div style="display:flex;justify-content:space-between;align-items:center;">' +
                    '<div style="display:flex;align-items:center;gap:10px;"><img src="' + Z.escape(circle
                        .avatar) +
                        '" style="width:40px;height:40px;border-radius:50%;object-fit:cover;border:1px solid #1e293b;"><div><div style="font-weight:700;font-size:13px;color:#fff;">' +
                        Z.escape(circle.name) +
                        '</div><div style="font-size:10px;color:#64748b;">' + (circle.members || 0) +
                        ' members • <span style="color:' + color + ';font-weight:600;">' + label +
                        '</span></div></div></div>' +
                    (isJoined ?
                        '<span style="font-size:9px;color:#10b981;font-weight:600;"><i class="fa-solid fa-check"></i> Joined</span>' :
                        '<button onclick="Z.RewardEngine.process(\'' + Z.escape(circle.creatorId) +
                        '\',\'circleJoin\',\'' + Z.escape(circle.id) +
                        '\')" style="background:#10b981;border:none;color:#000;font-weight:700;padding:2px 12px;border-radius:6px;font-size:10px;cursor:pointer;">Join ($0.02)</button>'
                        ) +
                    '</div>' +
                    '<div style="font-size:11px;color:#94a3b8;margin-top:4px;">' + Z.escape(circle.description) +
                    '</div>' +
                    shopItems +
                    '</div>';
            };

            // ==========================================================
            // NOTIFICATIONS
            // ==========================================================
            Z.renderNotifications = function() {
                var notifs = Z.DB.getNotifications() || [];
                var html =
                    '<div style="display:flex;flex-direction:column;gap:12px;"><div style="display:flex;align-items:center;gap:8px;"><button onclick="Z.showView(\'home\')" style="background:transparent;border:none;color:#64748b;cursor:pointer;font-size:16px;">←</button><h2 style="font-weight:900;font-size:16px;color:#fff;">Notifications</h2></div>';

                if (notifs.length) {
                    for (var i = 0; i < notifs.length; i++) {
                        var n = notifs[i];
                        html += '<div style="background:#111827;border:1px solid #1e293b;border-radius:12px;padding:12px;display:flex;align-items:flex-start;gap:10px;">' +
                            '<div style="width:6px;height:6px;border-radius:50%;margin-top:6px;background:' + (n
                                .read ? '#1e293b' : '#10b981') + ';"></div>' +
                            '<div><div style="font-size:12px;color:#e2e8f0;">' + Z.escape(n.message) +
                            '</div><div style="font-size:9px;color:#64748b;">' + new Date(n.timestamp)
                            .toLocaleString() + '</div></div></div>';
                    }
                } else {
                    html +=
                        '<div style="text-align:center;padding:40px;color:#64748b;font-size:12px;">No notifications.</div>';
                }

                html += '</div>';
                return html;
            };

            // ==========================================================
            // MESSAGES
            // ==========================================================
            Z.renderMessages = function() {
                var msgs = Z.DB.getMessages() || [];
                var html =
                    '<div style="display:flex;flex-direction:column;gap:12px;"><div style="display:flex;align-items:center;gap:8px;"><button onclick="Z.showView(\'home\')" style="background:transparent;border:none;color:#64748b;cursor:pointer;font-size:16px;">←</button><h2 style="font-weight:900;font-size:16px;color:#fff;">Messages</h2></div>';

                if (msgs.length) {
                    for (var i = 0; i < msgs.length; i++) {
                        var msg = msgs[i];
                        var sender = _userById(msg.senderId);
                        html += '<div style="background:#111827;border:1px solid #1e293b;border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px;">' +
                            '<img src="' + Z.escape(sender ? sender.avatar : '') +
                            '" style="width:36px;height:36px;border-radius:50%;object-fit:cover;">' +
                            '<div><div style="font-weight:600;font-size:12px;color:#fff;">' + Z.escape(sender ?
                                sender.name : 'Unknown') +
                            '</div><div style="font-size:10px;color:#64748b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px;">' +
                            Z.escape(msg.text || '') + '</div></div></div>';
                    }
                } else {
                    html +=
                        '<div style="text-align:center;padding:40px;color:#64748b;font-size:12px;">No messages.</div>';
                }

                html += '</div>';
                return html;
            };

            // ==========================================================
            // ADMIN WALL
            // ==========================================================
            Z.renderAdminWall = function() {
                return '<div style="display:flex;flex-direction:column;gap:12px;"><div style="background:linear-gradient(135deg,#1e1b4b,#3b0764);border:1px solid #4c1d95;border-radius:16px;padding:16px;"><span style="font-size:9px;background:rgba(99,102,241,0.2);color:#818cf8;padding:2px 10px;border-radius:12px;font-weight:600;">Admin Wall</span><h2 style="font-weight:900;font-size:16px;color:#fff;margin-top:4px;">ZYNIX Announcements</h2></div>' +
                    '<div style="background:#111827;border:1px solid #1e293b;border-radius:16px;overflow:hidden;">' +
                    '<div style="padding:12px;border-bottom:1px solid #1e293b;"><span style="font-size:9px;background:rgba(244,63,94,0.2);color:#f43f5e;padding:2px 10px;border-radius:12px;font-weight:600;">Pinned</span><h3 style="font-weight:700;font-size:13px;color:#fff;margin-top:4px;">Welcome to ZYNIX</h3></div>' +
                    '<div style="background:#000;height:200px;display:flex;align-items:center;justify-content:center;"><video src="https://assets.mixkit.co/videos/preview/mixkit-digital-animation-of-screens-and-code-31910-large.mp4" controls style="width:100%;height:100%;object-fit:cover;"></video></div>' +
                    '<div style="padding:12px;font-size:11px;color:#94a3b8;">Reward distribution and creator settings overview.</div>' +
                    '</div></div>';
            };

            // ==========================================================
            // BOOT
            // ==========================================================
            function boot() {
                // Seed data
                if (!localStorage.getItem('zynix_users')) Z.DB.saveUsers(Z.SeedData.users);
                if (!localStorage.getItem('zynix_posts')) Z.DB.savePosts(Z.SeedData.posts);
                if (!localStorage.getItem('zynix_sparks')) Z.DB.saveSparks(Z.SeedData.sparks);
                if (!localStorage.getItem('zynix_statuses')) Z.DB.saveStatuses(Z.SeedData.statuses);
                if (!localStorage.getItem('zynix_circles')) Z.DB.saveCircles(Z.SeedData.circles);

                // Theme
                var savedTheme = localStorage.getItem('zynix_theme');
                if (savedTheme === 'light') {
                    document.documentElement.classList.remove('dark');
                    document.documentElement.classList.add('light');
                    var icon = document.getElementById('theme-icon');
                    if (icon) icon.className = 'fa-solid fa-sun';
                }

                // Set user
                Z.State.currentUser = Z.DB.getCurrentUser();
                Z.renderHeaderAuth();
                Z.updateHeader();

                // Show home
                setTimeout(function() {
                    Z.showView('home');
                }, 50);
            }

            // Run boot
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', boot);
            } else {
                boot();
            }

        })();
    </script>
</body>
</html>

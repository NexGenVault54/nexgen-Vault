  }

  html += '<div class="section-title">Recent</div>';
  if(all.length){
    all.forEach(function(n){
      var fromId = (n.metadata && n.metadata.from_user) ? n.metadata.from_user : null;
      var fromUser = fromId ? Z.getProfileById(fromId) : null;
      var avatar = fromUser ? Z.displayAvatar(fromUser)
                            : 'https://ui-avatars.com/api/?name=Z&background=111827&color=34d399';
      var click = fromId ? ' onclick="Z.showView(\'public-profile\',\'' + Z.escape(fromId) + '\')" style="cursor:pointer;"' : '';
      var reversedClass = (n.kind === 'dislike_reversed') ? ' notif-reversed' : '';
      html += '<div class="notif-item' + (n.read?'':' unread') + reversedClass + '"' + click + '>' +
        '<img src="' + Z.escape(avatar) + '">' +
        '<div class="n-info">' +
          '<div class="n-msg">' + Z.escape(n.message) + '</div>' +
          '<div class="n-time">' + Z.fmtDate(n.created_at) + '</div>' +
        '</div>' +
      '</div>';
    });
    var c = Z.sb();
    if(c){
      c.from('notifications').update({read:true}).eq('user_id', u.id).eq('read', false).then(function(){});
    }
    all.forEach(function(n){ n.read = true; });
    Z.updateNotifBadge();
  } else if(!incoming.length){
    html += Z.emptyState({
      icon: 'fa-regular fa-bell',
      title: 'No notifications yet.',
      cta: { label: 'Back to Home', onclick: "Z.showView('home')", soft: true }
    });
  }
  html += '</div>';
  return html;
};

})();
</script>

<script>
(function(){
'use strict';
var Z = window.Z;
if(!Z) return;

var ALL_REACTIONS = Z.ALL_REACTIONS;

var _pendingReactionRefetch = null;
function scheduleReactionRefetch(){
  if(_pendingReactionRefetch) return;
  _pendingReactionRefetch = setTimeout(async function(){
    _pendingReactionRefetch = null;
    var c = Z.sb && Z.sb();
    if(!c) return;
    var posts = (Z.State.allPosts || []).filter(function(p){ return !p._optimistic; }).slice(0, 30);
    var sparks = (Z.State.allSparks || []).filter(function(s){ return !s._optimistic; }).slice(0, 15);
    try {
      if(posts.length){
        var pids = posts.map(function(p){ return p.id; });
        var r1 = await c.from('post_reactions').select('post_id, reaction').in('post_id', pids);
        var pm = {};
        (r1.data||[]).forEach(function(x){
          pm[x.post_id] = pm[x.post_id] || {};
          pm[x.post_id][x.reaction] = (pm[x.post_id][x.reaction]||0)+1;
        });
        posts.forEach(function(p){
          var newCounts = pm[p.id] || {};
          var changed = false;
          ALL_REACTIONS.forEach(function(k){
            var nv = newCounts[k] || 0;
            if((p.reactions||{})[k] !== nv) changed = true;
          });
          if(changed){
            var merged = {};
            ALL_REACTIONS.forEach(function(k){ merged[k] = newCounts[k] || 0; });
            p.reactions = merged;
            Z.updatePostReactionUI(p.id);
          }
        });
      }
      if(sparks.length){
        var sids = sparks.map(function(s){ return s.id; });
        var r2 = await c.from('spark_reactions').select('spark_id, reaction').in('spark_id', sids);
        var sm = {};
        (r2.data||[]).forEach(function(x){
          sm[x.spark_id] = sm[x.spark_id] || {};
          sm[x.spark_id][x.reaction] = (sm[x.spark_id][x.reaction]||0)+1;
        });
        sparks.forEach(function(s){
          var newCounts = sm[s.id] || {};
          var changed = false;
          ALL_REACTIONS.forEach(function(k){
            var nv = newCounts[k] || 0;
            if((s._reactions||{})[k] !== nv) changed = true;
          });
          if(changed){
            var merged2 = {};
            ALL_REACTIONS.forEach(function(k){ merged2[k] = newCounts[k] || 0; });
            s._reactions = merged2;
            Z.updateSparkReactionsUI(s.id);
          }
        });
      }
    } catch(e){}
  }, 400);
}

Z.setupRealtime = function(){
  var c = Z.sb();
  if(!c) return;
  var me = Z.State.currentUser;
  if(!me) return;

  try {
    if(c.getChannels){
      c.getChannels().forEach(function(ch){
        var nm = ch && (ch.topic || ch.name || '');
        if(typeof nm === 'string' && nm.indexOf('zynix-') === 0){
          try { c.removeChannel(ch); } catch(e){}
        }
      });
    }
  } catch(e){}
  Z.State.realtimeChannels.forEach(function(ch){ try { c.removeChannel(ch); } catch(e){} });
  Z.State.realtimeChannels = [];

  try {
    var ch1 = c.channel('zynix-comments').on('postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'comments' },
      function(payload){
        var cm = payload.new;
        if(!cm) return;
        var meNow = Z.State.currentUser;
        if(meNow && cm.author_id === meNow.id) return;

        if(cm.spark_id){
          var sp = (Z.State.allSparks||[]).find(function(x){ return x.id === cm.spark_id; });
          if(sp){
            sp._commentsCount = (sp._commentsCount||0)+1;
            Z.refreshSparkCommentCount(cm.spark_id);
          }
          if(Z._openSparkCommentsId === cm.spark_id && sp){
            cm._reactionCounts = {}; cm._myReactions = {}; cm._replies = [];
            if(!sp._comments) sp._comments = [];
            if(cm.parent_id){
              (function walk(arr){
                for(var i=0;i<arr.length;i++){
                  if(arr[i].id === cm.parent_id){ if(!arr[i]._replies) arr[i]._replies = []; arr[i]._replies.push(cm); return true; }
                  if(arr[i]._replies && walk(arr[i]._replies)) return true;
                }
                return false;
              })(sp._comments) || sp._comments.push(cm);
            } else {
              sp._comments.push(cm);
            }
            Z.rerenderSparkCommentsBody(cm.spark_id);
          }
          return;
        }

        if(!cm.post_id) return;
        var post = Z.findPostInState(cm.post_id);
        if(!post) return;
        var exists = false;
        (function scan(arr){
          for(var i=0;i<arr.length;i++){
            if(arr[i].id === cm.id){ exists = true; return; }
            if(arr[i]._replies) scan(arr[i]._replies);
          }
        })(post._comments || []);
        if(exists) return;
        cm._reactionCounts = {}; cm._myReactions = {}; cm._replies = [];
        if(!post._comments) post._comments = [];
        if(cm.parent_id){
          var parent = Z.findCommentInState(cm.parent_id);
          if(parent){ if(!parent._replies) parent._replies = []; parent._replies.push(cm); }
          else post._comments.push(cm);
        } else {
          post._comments.push(cm);
        }
        var container = document.getElementById('comments-' + cm.post_id);
        if(container){
          try {
            var temp = document.createElement('div');
            temp.innerHTML = Z.renderComment(cm, post, Z.State.allProfiles);
            var newEl = temp.firstChild;
            if(cm.parent_id){
              var parentEl = container.querySelector('[data-comment-id="' + cm.parent_id + '"]');
              if(parentEl){
                var rc = parentEl.querySelector('.comment-replies');
                if(!rc){ rc = document.createElement('div'); rc.className = 'comment-replies'; parentEl.appendChild(rc); }
                rc.appendChild(newEl);
              } else container.appendChild(newEl);
            } else {
              var cp = container.querySelector('.comment-color-picker');
              if(cp && cp.parentNode === container) container.insertBefore(newEl, cp);
              else container.appendChild(newEl);
            }
          } catch(err){}
        }
        var card = document.querySelector('.post-card[data-post-id="' + cm.post_id + '"]');
        if(card && post){
          var btn = card.querySelector('.post-actions button');
          if(btn) btn.innerHTML = '<i class="fa-regular fa-comment"></i> Comment ' + Z.countAllComments(post._comments || []);
        }
      }).subscribe();
    Z.State.realtimeChannels.push(ch1);
  } catch(e){}

  try {
    var ch2 = c.channel('zynix-reactions')
      .on('postgres_changes', { event:'INSERT', schema:'public', table:'post_reactions' }, function(payload){
        var r = payload.new;
        if(!r) return;
        var meNow = Z.State.currentUser;
        if(meNow && r.user_id === meNow.id) return;
        if(Z._isRecentSelfReaction && Z._isRecentSelfReaction(r.post_id, r.reaction)) return;
        var post = Z.findPostInState(r.post_id);
        if(!post) return;
        if(!post.reactions) post.reactions = {};
        post.reactions[r.reaction] = (post.reactions[r.reaction]||0) + 1;
        Z.updatePostReactionUI(r.post_id);
      })
      .on('postgres_changes', { event:'INSERT', schema:'public', table:'spark_reactions' }, function(payload){
        var r = payload.new;
        if(!r) return;
        var meNow = Z.State.currentUser;
        if(meNow && r.user_id === meNow.id) return;
        if(Z._isRecentSelfReaction && Z._isRecentSelfReaction(r.spark_id, r.reaction)) return;
        var sp = (Z.State.allSparks||[]).find(function(x){ return x.id === r.spark_id; });
        if(!sp) return;
        if(!sp._reactions) sp._reactions = {};
        sp._reactions[r.reaction] = (sp._reactions[r.reaction]||0) + 1;
        Z.updateSparkReactionsUI(r.spark_id);
      })
      .on('postgres_changes', { event:'INSERT', schema:'public', table:'comment_reactions' }, function(payload){
        var r = payload.new;
        if(!r) return;
        var meNow = Z.State.currentUser;
        if(meNow && r.user_id === meNow.id) return;
        if(Z._isRecentSelfReaction && Z._isRecentSelfReaction(r.comment_id, r.reaction)) return;
        var cm = Z.findCommentInState(r.comment_id);
        if(cm){
          if(!cm._reactionCounts) cm._reactionCounts = {};
          cm._reactionCounts[r.reaction] = (cm._reactionCounts[r.reaction]||0)+1;
          Z.updateCommentReactionUI(r.comment_id);
        }
        var sc = Z.findSparkCommentInState ? Z.findSparkCommentInState(r.comment_id) : null;
        if(sc && sc.cm){
          if(!sc.cm._reactionCounts) sc.cm._reactionCounts = {};
          sc.cm._reactionCounts[r.reaction] = (sc.cm._reactionCounts[r.reaction]||0)+1;
          Z.updateSparkCommentReactionUI(r.comment_id, sc.cm);
        }
      })
      .on('postgres_changes', { event:'DELETE', schema:'public', table:'post_reactions' }, function(payload){
        var old = payload.old;
        if(!old) return;
        var meNow = Z.State.currentUser;
        if(meNow && old.user_id === meNow.id) return;
        if(old.post_id && old.reaction){
          var post = Z.findPostInState(old.post_id);
          if(post && post.reactions && post.reactions[old.reaction]){
            post.reactions[old.reaction] = Math.max(0, post.reactions[old.reaction] - 1);
            Z.updatePostReactionUI(old.post_id);
            return;
          }
        }
        scheduleReactionRefetch();
      })
      .on('postgres_changes', { event:'DELETE', schema:'public', table:'spark_reactions' }, function(payload){
        var old = payload.old;
        if(!old) return;
        var meNow = Z.State.currentUser;
        if(meNow && old.user_id === meNow.id) return;
        if(old.spark_id && old.reaction){
          var sp = (Z.State.allSparks||[]).find(function(x){ return x.id === old.spark_id; });
          if(sp && sp._reactions && sp._reactions[old.reaction]){
            sp._reactions[old.reaction] = Math.max(0, sp._reactions[old.reaction] - 1);
            Z.updateSparkReactionsUI(old.spark_id);
            return;
          }
        }
        scheduleReactionRefetch();
      })
      .on('postgres_changes', { event:'DELETE', schema:'public', table:'comment_reactions' }, function(payload){
        var old = payload.old;
        if(!old) return;
        var meNow = Z.State.currentUser;
        if(meNow && old.user_id === meNow.id) return;
        if(old.comment_id && old.reaction){
          var cm = Z.findCommentInState ? Z.findCommentInState(old.comment_id) : null;
          if(cm && cm._reactionCounts && cm._reactionCounts[old.reaction]){
            cm._reactionCounts[old.reaction] = Math.max(0, cm._reactionCounts[old.reaction] - 1);
            Z.updateCommentReactionUI(old.comment_id);
            return;
          }
          var sc = Z.findSparkCommentInState ? Z.findSparkCommentInState(old.comment_id) : null;
          if(sc && sc.cm && sc.cm._reactionCounts && sc.cm._reactionCounts[old.reaction]){
            sc.cm._reactionCounts[old.reaction] = Math.max(0, sc.cm._reactionCounts[old.reaction] - 1);
            Z.updateSparkCommentReactionUI(old.comment_id, sc.cm);
            return;
          }
        }
      })
      .subscribe();
    Z.State.realtimeChannels.push(ch2);
  } catch(e){}

  try {
    var walletFilter = 'user_id=eq.' + me.id;
    var ch3 = c.channel('zynix-wallet-' + me.id).on('postgres_changes',
      { event:'INSERT', schema:'public', table:'wallet_transactions', filter: walletFilter },
      function(payload){
        var tx = payload.new;
        if(!tx) return;
        var meNow = Z.State.currentUser;
        if(!meNow) return;
        var amt = Number(tx.amount) || 0;
        if(amt > 0) Z.animateDollar(amt);
        meNow.wallet_cash  = Number(meNow.wallet_cash||0)  + amt;
        meNow.wallet_total = Number(meNow.wallet_total||0) + amt;
        meNow._walletTx = meNow._walletTx || [];
        meNow._walletTx.unshift(tx);
        Z.updateHeader();
        Z.incWalletBadge(1);
        if(Z.State.currentView === 'wallet'){
          var cont = document.getElementById('app-container');
          if(cont) cont.innerHTML = Z.renderView('wallet');
        }
      }).subscribe();
    Z.State.realtimeChannels.push(ch3);
  } catch(e){}

  try {
    var notifFilter = 'user_id=eq.' + me.id;
    var ch4 = c.channel('zynix-notifications-' + me.id).on('postgres_changes',
      { event:'INSERT', schema:'public', table:'notifications', filter: notifFilter },
      function(payload){
        var n = payload.new;
        if(!n) return;
        var meNow = Z.State.currentUser;
        if(!meNow || n.user_id !== meNow.id) return;
        if(n.deliver_at){
          var due = new Date(n.deliver_at).getTime();
          if(due > Date.now()) return;
        }
        Z.State.allNotifications.unshift(n);
        Z.updateNotifBadge();
        if(Z.State.currentView === 'notifications'){ Z.softRefresh(); }
      }).subscribe();
    Z.State.realtimeChannels.push(ch4);
  } catch(e){}

  try {
    var ch5 = c.channel('zynix-posts-stream')
      .on('postgres_changes', { event:'INSERT', schema:'public', table:'posts' }, function(payload){
        var p = payload.new;
        if(!p) return;
        var meNow = Z.State.currentUser;
        if(meNow && p.author_id === meNow.id) return;
        var exists = (Z.State.allPosts||[]).some(function(x){ return x.id === p.id; });
        if(exists) return;
        p.reactions = {}; p._myReactions = {}; p._comments = [];
        Z.State.allPosts = [p].concat(Z.State.allPosts || []);
        if(Z.State.currentView === 'home'){ Z.softRefresh(); }
      })
      .on('postgres_changes', { event:'UPDATE', schema:'public', table:'posts' }, function(payload){
        var nw = payload.new;
        if(!nw) return;
        var post = Z.findPostInState(nw.id);
        if(!post) return;
        var changed = false;
        if(post.shares !== nw.shares){ post.shares = nw.shares; changed = true; }
        if(post.views  !== nw.views) { post.views  = nw.views;  changed = true; }
        if(!changed) return;
        var card = document.querySelector('.post-card[data-post-id="' + nw.id + '"]');
        if(!card) return;
        card.querySelectorAll('.post-actions button').forEach(function(b){
          if(b.innerHTML.indexOf('fa-share-nodes') >= 0){
            b.innerHTML = '<i class="fa-solid fa-share-nodes"></i> Share ' + (nw.shares||0);
          }
          if(b.innerHTML.indexOf('fa-eye') >= 0){
            b.innerHTML = '<i class="fa-regular fa-eye"></i> Views ' + (nw.views||0);
          }
        });
      })
      .subscribe();
    Z.State.realtimeChannels.push(ch5);
  } catch(e){}

  try {
    var ch6 = c.channel('zynix-statuses-stream').on('postgres_changes',
      { event:'INSERT', schema:'public', table:'statuses' },
      function(payload){
        var s = payload.new;
        if(!s) return;
        var meNow = Z.State.currentUser;
        if(meNow && s.author_id === meNow.id) return;
        var exists = (Z.State.allStatuses||[]).some(function(x){ return x.id === s.id; });
        if(exists) return;
        Z.State.allStatuses = [s].concat(Z.State.allStatuses || []);
        if(Z.State.currentView === 'home') Z.renderStatusRow();
        if(Z.State.currentView === 'status-home') Z.softRefresh();
      }).subscribe();
    Z.State.realtimeChannels.push(ch6);
  } catch(e){}

  try {
    var ch7 = c.channel('zynix-sparks-stream')
      .on('postgres_changes', { event:'INSERT', schema:'public', table:'sparks' }, function(payload){
        var s = payload.new;
        if(!s) return;
        var meNow = Z.State.currentUser;
        if(meNow && s.author_id === meNow.id) return;
        var exists = (Z.State.allSparks||[]).some(function(x){ return x.id === s.id; });
        if(exists) return;
        s._reactions = {}; s._myReactions = {}; s._comments = []; s._commentsCount = 0;
        Z.State.allSparks = [s].concat(Z.State.allSparks || []);
        if(Z.State.currentView === 'spark'){ Z.showView('spark'); }
      })
      .on('postgres_changes', { event:'UPDATE', schema:'public', table:'sparks' }, function(payload){
        var nw = payload.new;
        if(!nw) return;
        var sp = (Z.State.allSparks||[]).find(function(x){ return x.id === nw.id; });
        if(!sp) return;
        if(sp.shares === nw.shares && sp.views === nw.views) return;
        sp.shares = nw.shares;
        sp.views  = nw.views;
        var vid = document.querySelector('video[data-spark-id="' + nw.id + '"]');
        if(!vid) return;
        var slide = vid.closest('.spark-slide');
        if(!slide) return;
        slide.querySelectorAll('.spark-action-btn').forEach(function(b){
          if(b.innerHTML.indexOf('fa-share-nodes') >= 0){
            var cEl = b.querySelector('.spark-action-count');
            if(cEl) cEl.textContent = nw.shares || 0;
          }
        });
        var badgeSpan = slide.querySelector('.spark-view-badge span');
        if(badgeSpan) badgeSpan.textContent = nw.views || 0;
      })
      .subscribe();
    Z.State.realtimeChannels.push(ch7);
  } catch(e){}

  try {
    var ch8 = c.channel('zynix-circles-stream').on('postgres_changes',
      { event:'INSERT', schema:'public', table:'circles' },
      function(payload){
        var cir = payload.new;
        if(!cir) return;
        var meNow = Z.State.currentUser;
        if(meNow && cir.creator_id === meNow.id) return;
        var exists = (Z.State.allCircles||[]).some(function(x){ return x.id === cir.id; });
        if(exists) return;
        Z.State.allCircles = [cir].concat(Z.State.allCircles || []);
        if(Z.State.currentView === 'circles'){ Z.refreshCirclesList(); }
      }).subscribe();
    Z.State.realtimeChannels.push(ch8);
  } catch(e){}

  if(!Z._selfReactionCleanupHooked){
    Z._selfReactionCleanupHooked = true;
    setInterval(function(){
      try {
        var keys = Object.keys(Z._selfReaction || {});
        if(!keys.length) return;
        var now = Date.now();
        keys.forEach(function(k){
          if(now - Z._selfReaction[k] > 6000) delete Z._selfReaction[k];
        });
      } catch(e){}
    }, 3000);
  }
};

Z.reloadData = async function(){
  var c = Z.sb();
  var me = Z.State.currentUser;

  var topLevel = [
    Z.DB.loadAllProfiles(),
    Z.DB.loadHomeFeed(),
    Z.DB.loadConnections(),
    Z.DB.loadNotifications(),
    Z.DB.loadStatuses(),
    Z.DB.loadSparks(),
    Z.DB.loadCirclesFromDB()
  ];
  if(me && c){
    topLevel.push(Z.DB.loadWalletTx(me.id).then(function(tx){ me._walletTx = tx || []; return tx; }));
    topLevel.push(Z.DB.loadStatusViews());
  }
  var results = await Promise.all(topLevel);
  var statusViews = (me && c) ? (results[results.length - 1] || []) : [];
  if(me){
    (Z.State.allStatuses||[]).forEach(function(s){
      if(s.author_id === me.id) return;
      var seen = statusViews.find(function(v){ return v.status_id === s.id && v.viewer_id === me.id; });
      if(seen) s._viewedByMe = true;
    });
  }

  Z.loadUnfrozen();
  Z.loadSavedSparks();
  if(me) Z.State.savedPosts = Z.getSavedPosts();
  Z._backfillAllMedia();

  if(me && c){
    var posts = Z.State.allPosts || [];
    var sparks = Z.State.allSparks || [];
    var postIds  = posts.map(function(p){ return p.id; });
    var sparkIds = sparks.map(function(s){ return s.id; });

    var jobs = [];

    jobs.push((async function(){
      var r = await c.from('post_reactions').select('post_id, reaction').eq('user_id', me.id);
      var myPostR = {};
      (r.data||[]).forEach(function(x){
        if(!myPostR[x.post_id]) myPostR[x.post_id] = {};
        myPostR[x.post_id][x.reaction] = true;
      });
      posts.forEach(function(p){ p._myReactions = myPostR[p.id] || {}; });
    })());

    if(postIds.length){
      jobs.push((async function(){
        var r = await c.from('post_reactions').select('post_id, reaction').in('post_id', postIds);
        var pm = {};
        (r.data||[]).forEach(function(x){
          pm[x.post_id] = pm[x.post_id] || {};
          pm[x.post_id][x.reaction] = (pm[x.post_id][x.reaction]||0)+1;
        });
        posts.forEach(function(p){ p.reactions = pm[p.id] || {}; });
      })());
    }

    if(sparkIds.length){
      jobs.push((async function(){
        var r = await c.from('spark_reactions').select('spark_id, reaction, user_id').in('spark_id', sparkIds);
        var sc = {}, mySR = {};
        (r.data||[]).forEach(function(x){
          sc[x.spark_id] = sc[x.spark_id] || {};
          sc[x.spark_id][x.reaction] = (sc[x.spark_id][x.reaction]||0)+1;
          if(x.user_id === me.id){
            if(!mySR[x.spark_id]) mySR[x.spark_id] = {};
            mySR[x.spark_id][x.reaction] = true;
          }
        });
        sparks.forEach(function(s){ s._reactions = sc[s.id] || {}; s._myReactions = mySR[s.id] || {}; });
      })());
    }

    if(sparkIds.length){
      jobs.push((async function(){
        var r = await c.from('comments').select('spark_id').in('spark_id', sparkIds);
        var counts = {};
        (r.data||[]).forEach(function(x){ counts[x.spark_id] = (counts[x.spark_id]||0)+1; });
        sparks.forEach(function(s){ s._commentsCount = counts[s.id] || 0; });
      })());
    }

    if(postIds.length){
      jobs.push((async function(){
        var r = await c.from('comments').select('*').in('post_id', postIds).order('created_at', {ascending:true});
        var cmts = r.data || [];
        var cIds = cmts.map(function(x){ return x.id; });
        var crMap = {}, myCrMap = {};
        if(cIds.length){
          var cr = await c.from('comment_reactions').select('comment_id, reaction, user_id').in('comment_id', cIds);
          (cr.data||[]).forEach(function(x){
            crMap[x.comment_id] = crMap[x.comment_id] || {};
            crMap[x.comment_id][x.reaction] = (crMap[x.comment_id][x.reaction]||0)+1;
            if(x.user_id === me.id){
              myCrMap[x.comment_id] = myCrMap[x.comment_id] || {};
              myCrMap[x.comment_id][x.reaction] = true;
            }
          });
        }
        var byPost = {};
        cmts.forEach(function(cm){ if(!byPost[cm.post_id]) byPost[cm.post_id] = []; byPost[cm.post_id].push(cm); });
        posts.forEach(function(p){
          var list = byPost[p.id] || [];
          list.forEach(function(cm){
            cm._reactionCounts = crMap[cm.id] || {};
            cm._myReactions = myCrMap[cm.id] || {};
            cm._replies = [];
          });
          var byId = {};
          list.forEach(function(x){ byId[x.id] = x; });
          list.forEach(function(x){ if(x.parent_id && byId[x.parent_id]) byId[x.parent_id]._replies.push(x); });
          p._comments = list.filter(function(x){ return !x.parent_id; });
        });
      })());
    }

    await Promise.all(jobs);
  }

  Z.loadWalletBadge();
  Z.updateNotifBadge();
  Z.saveSnapshot();
};

})();
</script>

<!-- ============================================================
     SECTION 14 — BOOT
     Cache-first paint · welcome hides instantly · background sync
     ============================================================ -->
<script>
(function(){
'use strict';
var Z = window.Z;
if(!Z) return;

function readCachedUserIdSync(){
  try {
    if(!window.localStorage) return null;
    var projRef = null;
    try {
      var u = Z.SUPABASE_URL || '';
      var m = u.match(/^https:\/\/([^.]+)\.supabase\.co/);
      if(m && m[1]) projRef = m[1];
    } catch(e){}
    if(!projRef) return null;
    var key = 'sb-' + projRef + '-auth-token';
    var raw = localStorage.getItem(key);
    if(!raw) return null;
    var parsed = JSON.parse(raw);
    if(!parsed) return null;
    var user = null;
    if(parsed.user && parsed.user.id) user = parsed.user;
    else if(parsed.currentSession && parsed.currentSession.user && parsed.currentSession.user.id) user = parsed.currentSession.user;
    else if(parsed.session && parsed.session.user && parsed.session.user.id) user = parsed.session.user;
    if(!user || !user.id) return null;
    return {
      id: user.id,
      email: user.email || null,
      user_metadata: user.user_metadata || {}
    };
  } catch(e){ return null; }
}

var _authBootDone = false;
function hookAuthChanges(){
  try {
    var c = Z.sb();
    if(!c) return;
    c.auth.onAuthStateChange(async function(event){
      if(event === 'TOKEN_REFRESHED' || event === 'INITIAL_SESSION' || event === 'USER_UPDATED'){
        if(event === 'TOKEN_REFRESHED') await Z.refreshSession();
        return;
      }
      if(!_authBootDone) return;
      if(event === 'SIGNED_OUT'){
        Z.State.currentUser = null;
        Z.renderHeaderAuth();
        Z.updateHeader();
        Z.State.navStack = [];
        Z.showView('public-home');
        return;
      }
      if(event === 'SIGNED_IN'){
        if(Z.State.manualAuthInProgress) return;
        if(Date.now() - (Z.State._manualAuthCompletedAt || 0) < 5000) return;

        var fresh = Z.State.currentUser;
        if(fresh && fresh.id){
          return;
        }

        await Z.refreshSession();
        await Z.reloadData();
        Z.State.navStack = [];
        Z.showView('home');
        Z.setupRealtime();
      }
    });
  } catch(e){}
}

async function boot(){
  Z.checkAdminParam();
  Z.showWelcome(Z.getWelcomeGreeting('home'));

  var cached = readCachedUserIdSync();

  if(!cached || !cached.id){
    Z.State.currentUser = null;
    Z.renderHeaderAuth();
    Z.updateHeader();
    Z.showView('public-home');
    setTimeout(function(){ Z.hideWelcome(); }, 350);

    (async function(){
      try {
        var cc = Z.sb();
        if(!cc) return;
        var sres = await cc.auth.getSession();
        var sessionUser = sres && sres.data && sres.data.session ? sres.data.session.user : null;
        if(!sessionUser) return;
        await Z.refreshSession();
        Z.loadSnapshot();
        var restored0 = Z.restoreView();
        Z.showView(restored0.view || 'home', restored0.param);
        Z.hideWelcome();
        try { await Z.reloadData(); } catch(e){}
        Z.setupRealtime();
      } catch(e){}
    })();

    try { Z.loadBuildTimeline(); } catch(e){}

    Z.State.bootCompleted = true;
    _authBootDone = true;
    hookAuthChanges();
    return;
  }

  Z.State.currentUser = {
    id: cached.id,
    email: cached.email,
    name: (cached.user_metadata && cached.user_metadata.name) || 'You',
    wallet_cash: 0,
    wallet_bounty: 0
  };
  Z.renderHeaderAuth();
  Z.updateHeader();

  var hadSnapshot = Z.loadSnapshot();
  var restored = Z.restoreView();

  Z.showView(restored.view, restored.param);
  if(hadSnapshot){
    Z.hideWelcome();
  } else {
    setTimeout(function(){ Z.hideWelcome(); }, 350);
  }

  (async function(){
    try {
      var cc2 = Z.sb();
      if(cc2){
        var sres2 = await cc2.auth.getSession();
        var sessionUser2 = sres2 && sres2.data && sres2.data.session ? sres2.data.session.user : null;
        if(!sessionUser2){
          Z.State.currentUser = null;
          Z.State.allPosts = [];
          Z.State.allSparks = [];
          Z.State.allProfiles = [];
          Z.State.allCircles = [];
          Z.State.allNotifications = [];
          Z.State.allConnections = [];
          Z.State.allStatuses = [];
          Z.State.snapshotLoaded = false;
          try { localStorage.setItem('zynix_last_view','public-home'); localStorage.removeItem('zynix_last_param'); } catch(e){}
          Z.renderHeaderAuth();
          Z.updateHeader();
          Z.showView('public-home');
          return;
        }
      }
    } catch(e){}

    await Z.refreshSession();

    if(!Z.State.currentUser){
      try { localStorage.setItem('zynix_last_view','public-home'); localStorage.removeItem('zynix_last_param'); } catch(e){}
      Z.showView('public-home');
      return;
    }

    Z.migrateLocalCirclesOnce();

    try {
      await Z.reloadData();
      Z.setupRealtime();
    } catch(e){
      Z.setupRealtime();
    }
  })();

  try { Z.loadBuildTimeline(); } catch(e){}

  Z.State.bootCompleted = true;
  _authBootDone = true;
  hookAuthChanges();
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

})();
</script>

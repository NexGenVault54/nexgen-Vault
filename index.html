<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ZYNIX - Independent Social & Creator Ecosystem</title>
<!-- Tailwind CSS & FontAwesome -->
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-track { background: #090d16; }
::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: #334155; }

/* Pure Dollar Flying Animation without dark box or background border */
@keyframes flyToWalletPure {
  0% { transform: scale(0.8) translateY(0) rotate(0deg); opacity: 1; }
  50% { transform: scale(1.1) translateY(-90px) translateX(-40px) rotate(-15deg); opacity: 1; }
  100% { transform: scale(0.3) translateY(-220px) translateX(120px) rotate(25deg); opacity: 0; }
}

.dollar-note-pure {
  animation: flyToWalletPure 1.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  background: transparent !important;
  box-shadow: none !important;
  border: none !important;
}

@keyframes pulseWallet {
  0% { transform: scale(1); }
  50% { transform: scale(1.15); box-shadow: 0 0 20px rgba(16, 185, 129, 0.6); }
  100% { transform: scale(1); }
}
.wallet-pulse { animation: pulseWallet 0.4s ease-in-out; }

body { background-color: #090d16; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
</style>
</head>
<body class="min-h-screen pb-28 selection:bg-emerald-500 selection:text-black">

<!-- Top Header -->
<header class="sticky top-0 z-40 bg-[#090d16]/90 backdrop-blur-md border-b border-slate-800 px-4 py-2.5 flex items-center justify-between">
  <div class="flex items-center space-x-2">
    <!-- Back Button for Sub-Views -->
    <button type="button" id="header-back-btn" onclick="Z.goBack()" class="hidden text-slate-300 hover:text-emerald-400 text-xs px-2.5 py-1 rounded-lg bg-slate-800/80 border border-slate-700/60 items-center space-x-1 mr-1">
      <i class="fa-solid fa-arrow-left"></i> <span>Back</span>
    </button>
    <button type="button" onclick="Z.showView('home')" class="flex items-center space-x-2 text-left group">
      <div class="w-7 h-7 rounded-full bg-gradient-to-tr from-emerald-400 to-blue-500 flex items-center justify-center font-black text-black text-xs shadow-md">Z</div>
      <span class="text-xl font-black tracking-wider bg-gradient-to-r from-emerald-400 via-blue-500 to-indigo-500 bg-clip-text text-transparent">ZYNIX</span>
    </button>
  </div>
  <div class="flex items-center space-x-2">
    <button type="button" onclick="Z.showView('wallet')" class="bg-slate-900/90 border border-slate-800 hover:border-slate-700 px-3 py-1 rounded-full text-xs flex items-center space-x-2 shadow-inner">
      <div class="flex items-center space-x-1" title="Cash Balance (Withdrawable)">
        <i class="fa-solid fa-wallet text-emerald-400 text-[10px]"></i>
        <span id="header-cash" class="text-emerald-400 font-bold">$0.00</span>
      </div>
      <span class="text-slate-700">|</span>
      <div class="flex items-center space-x-1" title="Bounty Balance (Internal Rewards)">
        <i class="fa-solid fa-gift text-blue-400 text-[10px]"></i>
        <span id="header-bounty" class="text-blue-400 font-bold">$0.00</span>
      </div>
    </button>
    <div id="header-auth-container"></div>
  </div>
</header>

<!-- Main View Container -->
<main id="app-container" class="max-w-xl mx-auto px-3 py-3 min-h-[calc(100vh-120px)] relative"></main>

<!-- Fixed Bottom Navigation -->
<nav class="fixed bottom-0 left-0 right-0 z-40 bg-[#090d16]/95 backdrop-blur-lg border-t border-slate-800 px-2 py-2 max-w-xl mx-auto flex items-center justify-between shadow-2xl">
  <button type="button" onclick="Z.showView('home')" id="nav-btn-home" class="flex flex-col items-center justify-center text-slate-400 hover:text-emerald-400 transition w-1/5 py-1">
    <i class="fa-solid fa-house text-base"></i>
    <span class="text-[9px] font-medium mt-0.5">Home</span>
  </button>
  <button type="button" onclick="Z.showView('spark')" id="nav-btn-spark" class="flex flex-col items-center justify-center text-slate-400 hover:text-emerald-400 transition w-1/5 py-1">
    <i class="fa-solid fa-bolt text-base"></i>
    <span class="text-[9px] font-medium mt-0.5">Spark</span>
  </button>
  <!-- Plus Button Direct Trigger for Home Composer -->
  <button type="button" onclick="Z.triggerCreateAction()" class="flex items-center justify-center w-10 h-10 bg-gradient-to-tr from-emerald-500 to-blue-600 rounded-full text-black hover:scale-105 transition shadow-lg shadow-emerald-500/20 -mt-2" title="Create Post">
    <i class="fa-solid fa-plus text-sm font-black"></i>
  </button>
  <button type="button" onclick="Z.showView('circles')" id="nav-btn-circles" class="flex flex-col items-center justify-center text-slate-400 hover:text-emerald-400 transition w-1/5 py-1">
    <i class="fa-solid fa-circle-nodes text-base"></i>
    <span class="text-[9px] font-medium mt-0.5">Circles</span>
  </button>
  <button type="button" onclick="Z.showView('people')" id="nav-btn-people" class="flex flex-col items-center justify-center text-slate-400 hover:text-emerald-400 transition w-1/5 py-1">
    <i class="fa-solid fa-users text-base"></i>
    <span class="text-[9px] font-medium mt-0.5">People</span>
  </button>
  <button type="button" onclick="Z.showView('profile')" id="nav-btn-profile" class="flex flex-col items-center justify-center text-slate-400 hover:text-emerald-400 transition w-1/5 py-1">
    <i class="fa-solid fa-user text-base"></i>
    <span class="text-[9px] font-medium mt-0.5">Profile</span>
  </button>
</nav>

<!-- AI Floating Assistant -->
<div class="fixed bottom-20 right-4 z-40">
  <button type="button" onclick="Z.toggleAiGuide()" class="w-11 h-11 bg-slate-900 border border-slate-700 hover:border-emerald-500 rounded-full text-emerald-400 shadow-2xl flex items-center justify-center transition hover:scale-105">
    <i class="fa-solid fa-wand-magic-sparkles text-sm"></i>
  </button>
</div>

<!-- Floating Containers -->
<div id="toast-container" class="fixed bottom-24 left-4 right-4 z-50 flex flex-col items-center space-y-2 pointer-events-none"></div>
<div id="modal-container"></div>

<script>
window.Z = {};

// Helper: Safe HTML Escaping
Z.escapeHtml = function(str) {
  if (!str) return '';
  return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
};

// Global Application State
Z.State = {

  currentView: 'home',
  viewHistory: ['home'],
  recentlyVisitedCircles: ['cir_1'],

  inlineLinkOpen: false,
  selectedMediaUrl: '',
  selectedMediaType: ''
};

};

      likes: 42,

// Database Layer
Z.DB = {
  getUsers: function() { return JSON.parse(localStorage.getItem('zynix_users') || JSON.stringify(Z.SeedData.users)); },
  getUserById: function(id) { return this.getUsers().find(u => u.id === id) || null; },
  saveUsers: function(usersArray) {
    const list = usersArray || this.getUsers();
    if (Z.State.currentUser) {
      const idx = list.findIndex(u => u.id === Z.State.currentUser.id);
      if (idx !== -1) list[idx] = Z.State.currentUser;
    }
    localStorage.setItem('zynix_users', JSON.stringify(list));
  },
  getCurrentUser: function() {
    const id = localStorage.getItem('zynix_current_user_id');
    return id ? this.getUserById(id) : null;
  },
  setCurrentUser: function(user) {
    if (user) {
      localStorage.setItem('zynix_current_user_id', user.id);
      Z.State.currentUser = user;
    } else {
      localStorage.removeItem('zynix_current_user_id');
      Z.State.currentUser = null;
    }
    Z.renderHeaderAuth();
    Z.updateHeaderWallet();
  },
  getPosts: function() { return JSON.parse(localStorage.getItem('zynix_posts') || JSON.stringify(Z.SeedData.posts)); },
  savePosts: function(posts) { localStorage.setItem('zynix_posts', JSON.stringify(posts)); },
  getSparks: function() { return JSON.parse(localStorage.getItem('zynix_sparks') || JSON.stringify(Z.SeedData.sparks)); },
  saveSparks: function(sparks) { localStorage.setItem('zynix_sparks', JSON.stringify(sparks)); },
  getStatuses: function() {
    const list = JSON.parse(localStorage.getItem('zynix_statuses') || JSON.stringify(Z.SeedData.statuses));
    return list.filter(st => !st.timestamp || (Date.now() - st.timestamp < 86400000));
  },
  saveStatuses: function(statuses) { localStorage.setItem('zynix_statuses', JSON.stringify(statuses)); },
  getCircles: function() { return JSON.parse(localStorage.getItem('zynix_circles') || JSON.stringify(Z.SeedData.circles)); },
  saveCircles: function(circles) { localStorage.setItem('zynix_circles', JSON.stringify(circles)); }
};

// Consolidated Reward Engine
Z.RewardEngine = {
  calculateSplit: function(grossAmount) {
    return { cash: Number((grossAmount * 0.60).toFixed(4)), bounty: Number((grossAmount * 0.40).toFixed(4)), gross: grossAmount };
  },
  creditReward: function(user, grossAmount, reason) {
    if (!user) return false;
    const split = this.calculateSplit(grossAmount);
    if (!user.wallet) user.wallet = { cash: 0.00, bounty: 0.00, totalEarned: 0.00 };
    user.wallet.cash += split.cash;
    user.wallet.bounty += split.bounty;
    user.wallet.totalEarned += grossAmount;
    Z.DB.saveUsers();
    Z.updateHeaderWallet();
    Z.triggerRewardAnimation(grossAmount);
    Z.showToast(`Earned +$${grossAmount.toFixed(2)} ($${split.cash.toFixed(3)} Cash, $${split.bounty.toFixed(3)} Bounty)`);
    return true;
  },
  processInteraction: function(contentOwnerId, interactionType, targetId, btnEl, isToggleOff) {
    if (!Z.State.currentUser) {
      Z.openAuthModal('login');
      Z.showToast('Please log in to participate.');
      return false;
    }
    const currentUser = Z.DB.getUserById(Z.State.currentUser.id);

    // Rule: Self-interactions are completely FREE (no bounty check, no reward, count increments)
    if (currentUser.id === contentOwnerId) {
      Z.showToast('Updated on your own content (Free action)');
      return true;
    }

    // Unliking/Toggle off does not reward or penalize bounty
    if (isToggleOff) return true;

    const pkg = Z.Packages[currentUser.package || 'Free'] || Z.Packages['Free'];
    if (interactionType === 'like' && !pkg.canEarnLike) {
      Z.showToast('Free package cannot earn from likes. Upgrade to $1 Monthly Package!');
      return false;
    }

    if (!currentUser.interactionHistory) currentUser.interactionHistory = {};
    const actionKey = `${interactionType}_${targetId || contentOwnerId}`;
    if (currentUser.interactionHistory[actionKey]) {
      Z.showToast(`You have already received a reward for this action.`);
      return false;
    }

    const contentOwner = Z.DB.getUserById(contentOwnerId) || currentUser;
    const bountySettings = contentOwner.bountySettings || { like: 0.01, share: 0.03, follow: 0.03, comment: 0.01, subscribe: 0.02, circleJoin: 0.03 };
    let rewardAmount = bountySettings[interactionType] || 0.01;
    if (rewardAmount > 0.05) rewardAmount = 0.05;

    if (!contentOwner.wallet) contentOwner.wallet = { cash: 0.00, bounty: 0.00, totalEarned: 0.00 };
    if (contentOwner.wallet.bounty < rewardAmount) {
      Z.showToast('Creator bounty balance is insufficient for this reward.');
      return false;
    }

    // Deduct Creator Bounty & Log
    contentOwner.wallet.bounty -= rewardAmount;
    currentUser.interactionHistory[actionKey] = new Date().toISOString();
    Z.DB.saveUsers();

    this.creditReward(currentUser, rewardAmount, interactionType.toUpperCase());
    return true;
  }
};

// Pure Transparent Dollar Animation
Z.triggerRewardAnimation = function(amount) {
  const walletEl = document.getElementById('header-cash');
  if (walletEl) {
    walletEl.classList.add('wallet-pulse');
    setTimeout(() => walletEl.classList.remove('wallet-pulse'), 500);
  }
  const floatingNote = document.createElement('div');
  floatingNote.className = 'fixed z-50 text-emerald-400 font-black dollar-note-pure pointer-events-none flex items-center space-x-1';
  floatingNote.style.right = '40px';
  floatingNote.style.top = '60px';
  floatingNote.innerHTML = `<i class="fa-solid fa-money-bill-wave text-emerald-400 text-xl drop-shadow-[0_2px_10px_rgba(16,185,129,0.9)]"></i><span class="text-xs font-bold text-emerald-300">+$${amount.toFixed(2)}</span>`;
  document.body.appendChild(floatingNote);
  setTimeout(() => floatingNote.remove(), 1100);
};

// Toast Notifications
Z.showToast = function(message) {
  const container = document.getElementById('toast-container');
  if (!container) return;
  const toast = document.createElement('div');
  toast.className = 'bg-slate-900/95 border border-emerald-500/40 text-slate-100 px-4 py-2 rounded-xl text-xs shadow-2xl flex items-center space-x-2 pointer-events-auto backdrop-blur-md transition-all duration-300';
  toast.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400 shrink-0"></i><span>${Z.escapeHtml(message)}</span>`;
  container.appendChild(toast);
  setTimeout(() => { toast.style.opacity = '0'; setTimeout(() => toast.remove(), 300); }, 2800);
};

// Initialization
document.addEventListener('DOMContentLoaded', function() {
  if (!localStorage.getItem('zynix_users')) Z.DB.saveUsers(Z.SeedData.users);
  if (!localStorage.getItem('zynix_posts')) Z.DB.savePosts(Z.SeedData.posts);
  if (!localStorage.getItem('zynix_sparks')) Z.DB.saveSparks(Z.SeedData.sparks);
  if (!localStorage.getItem('zynix_circles')) Z.DB.saveCircles(Z.SeedData.circles);

  Z.State.currentUser = Z.DB.getCurrentUser();
  Z.renderHeaderAuth();
  Z.updateHeaderWallet();
  Z.showView('home');
});

// Navigation & View Routing
Z.goBack = function() {
  if (Z.State.viewHistory.length > 1) {
    Z.State.viewHistory.pop();
    const prev = Z.State.viewHistory[Z.State.viewHistory.length - 1];
    Z.showView(prev, null, true);
  } else {
    Z.showView('home', null, true);
  }
};

Z.showView = function(viewName, param, isBackAction) {
  if (!isBackAction && Z.State.currentView !== viewName) {
    Z.State.viewHistory.push(viewName);
  }
  Z.State.currentView = viewName;

  // Header Back Button visibility toggle
  const backBtn = document.getElementById('header-back-btn');
  if (backBtn) {
    if (viewName === 'home') backBtn.classList.add('hidden');
    else { backBtn.classList.remove('hidden'); backBtn.classList.add('flex'); }
  }

  // Active Bottom Nav Styling
  ['home', 'spark', 'circles', 'people', 'profile'].forEach(nav => {
    const btn = document.getElementById(`nav-btn-${nav}`);
    if (btn) {
      if (nav === viewName) {
        btn.classList.add('text-emerald-400'); btn.classList.remove('text-slate-400');
      } else {
        btn.classList.remove('text-emerald-400'); btn.classList.add('text-slate-400');
      }
    }
  });

  const container = document.getElementById('app-container');
  if (!container) return;

  if (viewName === 'home') container.innerHTML = Z.Views.renderHome();
  else if (viewName === 'spark') container.innerHTML = Z.Views.renderSparkStream();
  else if (viewName === 'profile') container.innerHTML = Z.Views.renderProfileDashboard();
  else if (viewName === 'bounty-settings') container.innerHTML = Z.Views.renderBountySettings();
  else if (viewName === 'packages') container.innerHTML = Z.Views.renderPackages();
  else if (viewName === 'wallet') container.innerHTML = Z.Views.renderWallet();
  else if (viewName === 'people') container.innerHTML = Z.Views.renderPeople();
  else if (viewName === 'circles') container.innerHTML = Z.Views.renderCirclesPage();
  else container.innerHTML = Z.Views.renderHome();

  window.scrollTo({ top: 0, behavior: 'smooth' });
};

// Header Actions
Z.renderHeaderAuth = function() {
  const container = document.getElementById('header-auth-container');
  if (!container) return;
  const user = Z.State.currentUser;
  if (user) {
    container.innerHTML = `
      <div class="flex items-center space-x-1.5">
        <button type="button" onclick="Z.showView('profile')" class="focus:outline-none">
          <img src="${Z.escapeHtml(user.avatar)}" class="w-7 h-7 rounded-full object-cover border border-emerald-500/50">
        </button>
        <button type="button" onclick="Z.logout()" class="w-7 h-7 rounded-full bg-slate-800 text-slate-400 hover:text-rose-400 flex items-center justify-center transition" title="Logout">
          <i class="fa-solid fa-power-off text-xs"></i>
        </button>
      </div>`;
  } else {
    container.innerHTML = `<button type="button" onclick="Z.openAuthModal('login')" class="bg-emerald-600 hover:bg-emerald-500 text-black font-bold text-xs px-3 py-1.5 rounded-full transition">Login</button>`;
  }
};

Z.updateHeaderWallet = function() {
  const user = Z.State.currentUser;
  const cashEl = document.getElementById('header-cash');
  const bountyEl = document.getElementById('header-bounty');
  if (cashEl) cashEl.innerText = '$' + (user && user.wallet ? user.wallet.cash.toFixed(2) : '0.00');
  if (bountyEl) bountyEl.innerText = '$' + (user && user.wallet ? user.wallet.bounty.toFixed(2) : '0.00');
};

// Clean Authentication Modal with Inline Error Placement
Z.openAuthModal = function(mode) {
  const modalContainer = document.getElementById('modal-container');
  const isLogin = mode === 'login';
  modalContainer.innerHTML = `
    <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
      <div class="bg-[#111827] border border-slate-800 rounded-2xl w-full max-w-md p-5 space-y-4 relative shadow-2xl">
        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
          <h3 class="font-bold text-sm text-white">${isLogin ? 'Login to ZYNIX' : 'Create ZYNIX Account'}</h3>
          <button type="button" onclick="Z.closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark"></i></button>
        </div>
        
        <div class="space-y-3 text-xs">
          ${!isLogin ? `
            <div>
              <label class="block text-slate-400 mb-1">Full Name</label>
              <input type="text" id="auth-name" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:border-emerald-500 focus:outline-none" placeholder="e.g. Abdullah Abbas">
            </div>` : ''}
          <div>
            <label class="block text-slate-400 mb-1">Email or Username</label>
            <input type="text" id="auth-email" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:border-emerald-500 focus:outline-none" placeholder="email@example.com">
          </div>
          <div>
            <label class="block text-slate-400 mb-1">Password</label>
            <input type="password" id="auth-password" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:border-emerald-500 focus:outline-none" placeholder="••••••••">
          </div>

          <!-- Inline Error Message Display -->
          <div id="auth-inline-error" class="hidden text-rose-400 text-[11px] font-medium bg-rose-500/10 border border-rose-500/20 p-2 rounded-xl"></div>
        </div>

          ${isLogin ? 'Sign In' : 'Register Free Account'}
        </button>

          <button type="button" onclick="Z.openAuthModal('${isLogin ? 'signup' : 'login'}')" class="text-[11px] text-slate-400 hover:text-emerald-400">
            ${isLogin ? "Don't have an account? Sign Up" : "Already have an account? Log In"}

Z.handleAuthSubmit = function(mode) {
  const errContainer = document.getElementById('auth-inline-error');
  errContainer.classList.add('hidden'); errContainer.innerText = '';

  const emailInput = document.getElementById('auth-email').value.trim();
  const passInput = document.getElementById('auth-password').value.trim();

  if (!emailInput || !passInput) {
    errContainer.innerText = 'Please enter both email/username and password.';
    errContainer.classList.remove('hidden');
    return;
  }

  const users = Z.DB.getUsers();

  if (mode === 'login') {
    const found = users.find(u => (u.email.toLowerCase() === emailInput.toLowerCase() || u.username.toLowerCase() === emailInput.toLowerCase()) && u.password === passInput);
    if (found) {
      Z.DB.setCurrentUser(found);
      Z.closeModal();
      Z.showToast(`Welcome back, ${found.name}!`);
      Z.showView('home');
    } else {
      errContainer.innerText = 'Incorrect email/username or password.';
      errContainer.classList.remove('hidden');
    }
  } else {
    // Signup Logic
    const nameInput = document.getElementById('auth-name').value.trim() || 'New Member';
    const existing = users.find(u => u.email.toLowerCase() === emailInput.toLowerCase());
    if (existing) {
      errContainer.innerText = 'This email is already registered. Please login.';
      errContainer.classList.remove('hidden');
      return;
    }

    // Initialize Genuine Free User Account
    const newUser = {
      id: 'usr_' + Date.now(),
      zynixId: 'ZYNIX-' + Math.random().toString(36).substr(2, 5).toUpperCase(),
      name: nameInput,
      username: nameInput.toLowerCase().replace(/\s+/g, '_'),
      profession: 'Member',
      bio: 'New ZYNIX ecosystem member.',
      avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80',
      cover: '',
      package: 'Free',
      bountySettings: { like: 0.01, share: 0.03, follow: 0.03, comment: 0.01, subscribe: 0.02, circleJoin: 0.03 },
      wallet: { cash: 0.00, bounty: 0.00, totalEarned: 0.00 },
      email: emailInput,
      password: passInput,
      followers: []
    };

    users.push(newUser);
    Z.DB.saveUsers(users);
    Z.DB.setCurrentUser(newUser);
    Z.closeModal();
    Z.showToast('Account registered successfully!');
    Z.showView('home');
  }
};

// Media File Input Handler for Inline Post Composer
Z.handleMediaUpload = function(event) {
  const file = event.target.files[0];
  if (!file) return;
  // Use Object URL for lightweight client preview without giant base64 strings
  const objectUrl = URL.createObjectURL(file);
  Z.State.selectedMediaUrl = objectUrl;
  Z.State.selectedMediaType = file.type.startsWith('video') ? 'video' : 'image';

  const preview = document.getElementById('composer-media-preview');
  if (preview) {
    preview.innerHTML = `
      <div class="relative rounded-xl overflow-hidden border border-slate-800 mt-2 max-h-48 bg-black flex items-center justify-center">
        ${Z.State.selectedMediaType === 'video' ? `<video src="${objectUrl}" controls class="max-h-48 w-full object-contain"></video>` : `<img src="${objectUrl}" class="max-h-48 w-full object-cover">`}
        <button type="button" onclick="Z.clearComposerMedia()" class="absolute top-2 right-2 bg-black/80 text-white w-6 h-6 rounded-full text-xs flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>

// Optimistic Post Diamond Toggle (Like / Unlike)
Z.toggleDiamondLike = function(postId, btnEl) {
  const posts = Z.DB.getPosts();
  const post = posts.find(p => p.id === postId);
  if (!post) return;

  const currentUserId = Z.State.currentUser ? Z.State.currentUser.id : 'usr_1';
  if (!post.userReactions) post.userReactions = {};
  const isLiked = post.userReactions[currentUserId] === 'diamond';

  if (isLiked) {
    // Unlike
    delete post.userReactions[currentUserId];
    post.reactions.diamond = Math.max(0, (post.reactions.diamond || 1) - 1);
    Z.DB.savePosts(posts);
    btnEl.innerHTML = `◇ <span class="count-val">${post.reactions.diamond}</span>`;
    btnEl.classList.remove('text-emerald-400', 'font-bold'); btnEl.classList.add('text-slate-400');
    Z.showToast('Unliked');
  } else {
    // Like with Reward Validation
    const success = Z.RewardEngine.processInteraction(post.authorId, 'like', post.id, btnEl, false);
    if (success) {
      post.userReactions[currentUserId] = 'diamond';
      post.reactions.diamond = (post.reactions.diamond || 0) + 1;
      Z.DB.savePosts(posts);
      btnEl.innerHTML = `◆ <span class="count-val">${post.reactions.diamond}</span>`;
      btnEl.classList.add('text-emerald-400', 'font-bold'); btnEl.classList.remove('text-slate-400');
    }
  }
};

Z.applyEmojiReaction = function(postId, emojiType) {
  const posts = Z.DB.getPosts();

  if (!post.reactions) post.reactions = {};
  post.reactions[emojiType] = (post.reactions[emojiType] || 0) + 1;
  Z.DB.savePosts(posts);

  const picker = document.getElementById(`reaction-picker-${postId}`);
  if (picker) picker.classList.add('hidden');

  Z.showToast(`Reacted with ${emojiType === 'flower' ? '🌹' : '❤️'}`);
  Z.showView('home');
};

  const success = Z.RewardEngine.processInteraction(authorId, 'share', postId, null, false);
  if (navigator.share) {

};

Z.submitInlineComment = function(postId) {
  const input = document.getElementById(`comment-input-${postId}`);
  if (!input) return;
  const text = input.value.trim();
  if (!text) return;

  const posts = Z.DB.getPosts();
  const post = posts.find(p => p.id === postId);
  if (post) {
    if (!post.comments) post.comments = [];
    const authorName = Z.State.currentUser ? Z.State.currentUser.name : 'Anonymous';
    post.comments.push({ id: 'c_' + Date.now(), author: authorName, text: text });
    Z.DB.savePosts(posts);

    Z.showView('home');
  }
};

  renderBountySettings: function() {

            <label class="block text-slate-400 mb-1">Follow Bounty Reward ($)</label>

  renderPackages: function() {
    return `
      <div class="space-y-3">
        <div class="bg-[#111827] border border-slate-800 p-4 rounded-2xl text-xs space-y-2 shadow-xl">
          <div class="flex justify-between items-center">
            <h4 class="font-bold text-emerald-400 text-sm">Free Package ($0/mo)</h4>
            <span class="bg-slate-800 text-slate-300 text-[10px] px-2 py-0.5 rounded-full">Active Default</span>
          </div>
          <p class="text-slate-300 leading-relaxed">• Earn from Share, Follow & Circle Join bounties.<br>• Like earning disabled.<br>• 0 Referral monthly commissions.</p>
        </div>

          <div class="flex justify-between items-center">
            <h4 class="font-bold text-emerald-400 text-sm">$1 Monthly Subscription</h4>

          <button type="button" onclick="Z.upgradeToDollarOne()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-black font-bold py-2 rounded-xl transition">Subscribe $1/Month</button>

  },

  renderWallet: function() {
    const u = Z.State.currentUser || Z.DB.getUsers()[0];
    return `
      <div class="bg-[#111827] border border-slate-800 p-4 rounded-2xl text-center space-y-3 shadow-xl">
        <h3 class="font-bold text-sm text-white border-b border-slate-800 pb-2">ZYNIX Financial Ledger</h3>

            <span class="block text-[10px] text-slate-400">Cash Balance</span>

          </div>
          <div class="bg-slate-950 p-3 rounded-xl border border-slate-800">
            <span class="block text-[10px] text-slate-400">Bounty Balance</span>
            <span class="text-blue-400 text-base font-black">$${u.wallet ? u.wallet.bounty.toFixed(2) : '0.00'}</span>
          </div>
        </div>
        <button type="button" onclick="Z.showToast('Withdrawal request submitted for review!')" class="w-full bg-emerald-600 text-black font-bold py-2 rounded-xl text-xs transition">Request Withdrawal</button>
      </div>`;

};

// People Search Filter
Z.filterPeopleList = function() {
  const query = document.getElementById('people-search-input').value.toLowerCase().trim();
  const items = document.querySelectorAll('.user-card-item');
  items.forEach(item => {
    const name = item.getAttribute('data-name');
    const username = item.getAttribute('data-username');
    const zynixid = item.getAttribute('data-zynixid');
    if (name.includes(query) || username.includes(query) || zynixid.includes(query)) {
      item.classList.remove('hidden');
    } else {
      item.classList.add('hidden');
    }
  });
};

// Package Upgrade Logic
Z.upgradeToDollarOne = function() {
  if (!Z.State.currentUser) { Z.openAuthModal('login'); return; }
  Z.State.currentUser.package = '$1 Monthly';
  Z.DB.saveUsers();
  Z.showToast('Successfully subscribed to $1 Monthly Package!');
  Z.showView('profile');
};
</script>

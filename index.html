@keyframes flyToWalletPure {

  20% { transform: scale(1.2) translateX(-20px) rotate(-10deg); opacity: 1; }

// XSS Sanitization
Z.escapeHtml = function(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
};

// Central Reward Engine
Z.RewardEngine = {
  calculateSplit: function(grossAmount) {
    const cash = Number((grossAmount * 0.60).toFixed(4));
    const bounty = Number((grossAmount * 0.40).toFixed(4));
    return { cash, bounty, gross: grossAmount };
  },

  checkDailyLimit: function(user) {
    const today = new Date().toISOString().split('T')[0];
    if (!user.dailyTracker || user.dailyTracker.date !== today) {
      user.dailyTracker = { date: today, count: 0 };
    }
    const pkg = Z.Packages[user.package || 'Free'] || Z.Packages['Free'];
    return {
      allowed: user.dailyTracker.count < pkg.dailyLimit,
      current: user.dailyTracker.count,
      limit: pkg.dailyLimit
    };
  },

  creditReward: function(user, grossAmount, reason) {
    if (!user || grossAmount <= 0) return false;
    const split = this.calculateSplit(grossAmount);
    if (!user.wallet) user.wallet = { cash: 0.00, bounty: 0.00, totalEarned: 0.00 };
    if (!user.walletTransactions) user.walletTransactions = [];
    
    user.wallet.cash += split.cash;
    user.wallet.bounty += split.bounty;
    user.wallet.totalEarned += grossAmount;
    
    user.walletTransactions.unshift({
      id: 'tx_' + Date.now(),
      date: new Date().toISOString(),
      type: reason,
      amount: grossAmount,
      cash: split.cash,
      bounty: split.bounty,
      status: 'Completed'
    });
    
    Z.DB.saveUsers();
    Z.updateHeaderWallet();
    Z.triggerRewardAnimation(grossAmount);
    Z.showToast(`Reward: +$${grossAmount.toFixed(2)} (+$${split.cash.toFixed(3)} Cash, +$${split.bounty.toFixed(3)} Bounty)`);
    return true;
  },

  processInteraction: function(contentOwnerId, interactionType, targetId, reactionType) {
    if (!Z.State.currentUser) {
      Z.showToast('Please log in to participate and earn rewards.');
      return false;
    }

    const currentUser = Z.DB.getUserById(Z.State.currentUser.id);
    const pkg = Z.Packages[currentUser.package || 'Free'] || Z.Packages['Free'];
    
    // Package Rule Checks
    if (interactionType === 'like' && pkg.likeRewardRate === 0) {
      // Toggle reaction state visually, but do not grant money on Free plan
      this.toggleLikeState(currentUser, targetId, contentOwnerId, false, reactionType);
      Z.showToast('Free accounts can react, but require $1/mo package for Like Cash Rewards!');
      return true;
    }

    const limitStatus = this.checkDailyLimit(currentUser);
    if (!limitStatus.allowed) {
      Z.showToast(`Daily interaction limit reached (${limitStatus.limit}/${limitStatus.limit}). Upgrade package!`);
      return false;
    }

    const contentOwner = Z.DB.getUserById(contentOwnerId);
    if (!contentOwner) return false;

    if (contentOwner.id === currentUser.id && interactionType !== 'unlike') {
      Z.showToast('You cannot earn rewards from your own content or profile.');
      return false;
    }

    // Toggle unlike state
    if (!currentUser.interactionHistory) currentUser.interactionHistory = {};
    const actionKey = `${interactionType}_${targetId || contentOwnerId}`;

    if (interactionType === 'like' && currentUser.interactionHistory[actionKey]) {
      // User is unliking content
      this.toggleLikeState(currentUser, targetId, contentOwnerId, true, reactionType);
      delete currentUser.interactionHistory[actionKey];
      Z.DB.saveUsers();
      Z.showToast('Reaction removed.');
      Z.showView(Z.State.currentView);
      return true;
    }

    if (currentUser.interactionHistory[actionKey]) {
      Z.showToast(`You have already claimed reward for this ${interactionType}.`);
      return false;
    }

    // Bounty calculation
    const bountySettings = contentOwner.bountySettings || { like: 0.01, share: 0.03, follow: 0.03, subscribe: 0.02, circleJoin: 0.03 };
    let rewardAmount = bountySettings[interactionType === 'spark_like' ? 'like' : interactionType] || 0.01;
    if (rewardAmount > 0.05) rewardAmount = 0.05;

    if (!contentOwner.wallet) contentOwner.wallet = { cash: 0.00, bounty: 0.00, totalEarned: 0.00 };
    if (contentOwner.wallet.bounty < rewardAmount) {
      Z.showToast('Creator bounty balance is insufficient for this reward.');
      return false;
    }

    // Deduct Creator Bounty & Record
    contentOwner.wallet.bounty -= rewardAmount;
    if (!contentOwner.bountySpentHistory) contentOwner.bountySpentHistory = [];
    contentOwner.bountySpentHistory.unshift({
      id: 'bspend_' + Date.now(),
      date: new Date().toISOString(),
      recipient: currentUser.name,
      action: interactionType,
      amount: rewardAmount
    });

    // Handle like vs follow vs share
    if (interactionType === 'like') {
      this.toggleLikeState(currentUser, targetId, contentOwnerId, false, reactionType);
    } else if (interactionType === 'share') {
      const posts = Z.DB.getPosts();
      const post = posts.find(p => p.id === targetId);
      if (post) { post.shares = (post.shares || 0) + 1; Z.DB.savePosts(posts); }
    } else if (interactionType === 'spark_like') {
      const sparks = Z.DB.getSparks();
      const spark = sparks.find(s => s.id === targetId);
      if (spark) { spark.likes = (spark.likes || 0) + 1; Z.DB.saveSparks(sparks); }
    } else if (interactionType === 'follow') {
      contentOwner.followers = (contentOwner.followers || 0) + 1;
      if (!currentUser.following) currentUser.following = [];
      if (!currentUser.following.includes(contentOwner.id)) currentUser.following.push(contentOwner.id);
    }

    currentUser.interactionHistory[actionKey] = new Date().toISOString();
    currentUser.dailyTracker.count++;
    Z.DB.saveUsers();

    this.creditReward(currentUser, rewardAmount, `${interactionType.toUpperCase()} Reward`);
    Z.showView(Z.State.currentView);
    return true;
  },

  toggleLikeState: function(currentUser, postId, authorId, isUnliking, reactionType) {
    const posts = Z.DB.getPosts();
    const post = posts.find(p => p.id === postId);
    if (!post) return;
    if (!post.reactions) post.reactions = { heart: 0, flower: 0, fire: 0, star: 0, clap: 0, spark: 0, diamond: 0 };
    if (!post.userReactions) post.userReactions = {};

    const key = reactionType || 'diamond';
    if (isUnliking) {
      if (post.reactions[key] > 0) post.reactions[key]--;
      delete post.userReactions[currentUser.id];
    } else {
      post.reactions[key] = (post.reactions[key] || 0) + 1;
      post.userReactions[currentUser.id] = key;
    }
    Z.DB.savePosts(posts);
  }
};

Z.triggerRewardAnimation = function(amount) {
  const walletEl = document.querySelector('header');
  if (walletEl) {
    walletEl.classList.add('wallet-pulse');
    setTimeout(() => walletEl.classList.remove('wallet-pulse'), 500);
  }

  const floatingNote = document.createElement('div');
  floatingNote.className = 'fixed z-50 text-emerald-400 font-black text-2xl dollar-note-pure pointer-events-none flex items-center space-x-1';
  floatingNote.style.right = '50px';
  floatingNote.style.top = '70px';
  floatingNote.innerHTML = `<i class="fa-solid fa-money-bill-wave text-emerald-400 drop-shadow-[0_4px_12px_rgba(16,185,129,0.8)]"></i><span class="text-xs font-bold text-emerald-300 drop-shadow">+$${amount.toFixed(2)}</span>`;
  document.body.appendChild(floatingNote);
  setTimeout(() => floatingNote.remove(), 1200);
};

Z.showToast = function(message) {
  const container = document.getElementById('toast-container');
  if (!container) return;
  const toast = document.createElement('div');
  toast.className = 'bg-slate-900/95 border border-emerald-500/40 text-slate-100 px-4 py-2.5 rounded-xl text-xs shadow-2xl flex items-center space-x-2.5 pointer-events-auto transition transform translate-y-4 opacity-0 max-w-md w-full backdrop-blur-md';
  toast.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400 text-sm shrink-0"></i><span class="font-medium">${Z.escapeHtml(message)}</span>`;
  container.appendChild(toast);
  setTimeout(() => toast.classList.remove('translate-y-4', 'opacity-0'), 10);
  setTimeout(() => {
    toast.classList.add('opacity-0', 'transition', 'duration-300');
    setTimeout(() => toast.remove(), 300);
  }, 3200);
};

// Unified Data Layer
Z.DB = {
  getUsers: function() {
    const data = localStorage.getItem('zynix_users');
    if (!data) return Z.SeedData.users;
    return JSON.parse(data);
  },
  getUserById: function(id) {
    const users = this.getUsers();
    return users.find(u => u.id === id) || null;
  },
  saveUsers: function(usersArray) {
    if (usersArray) {
      localStorage.setItem('zynix_users', JSON.stringify(usersArray));
    } else {
      const currentUsers = this.getUsers();
      if (Z.State.currentUser) {
        const idx = currentUsers.findIndex(u => u.id === Z.State.currentUser.id);
        if (idx !== -1) currentUsers[idx] = Z.State.currentUser;
      }
      localStorage.setItem('zynix_users', JSON.stringify(currentUsers));
    }
    if (Z.State.currentUser) {
      const fresh = this.getUserById(Z.State.currentUser.id);
      if (fresh) Z.State.currentUser = fresh;
    }
  },
  getCurrentUser: function() {
    const id = localStorage.getItem('zynix_current_user_id');
    if (!id) return null;
    return this.getUserById(id);
  },
  setCurrentUser: function(user) {
    if (user) {
      localStorage.setItem('zynix_current_user_id', user.id);
      Z.State.currentUser = user;
    } else {
      localStorage.removeItem('zynix_current_user_id');
      Z.State.currentUser = null;
    }
    Z.renderHeaderAuth();
    Z.updateHeaderWallet();
  },
  getPosts: function() {
    const data = localStorage.getItem('zynix_posts');
    if (!data) return Z.SeedData.posts;
    return JSON.parse(data);
  },
  savePosts: function(posts) {
    localStorage.setItem('zynix_posts', JSON.stringify(posts));
  },
  getSparks: function() {
    const data = localStorage.getItem('zynix_sparks');
    if (!data) return Z.SeedData.sparks;
    return JSON.parse(data);
  },
  saveSparks: function(sparks) {
    localStorage.setItem('zynix_sparks', JSON.stringify(sparks));
  },
  getStatuses: function() {
    const data = localStorage.getItem('zynix_statuses');
    let list = data ? JSON.parse(data) : Z.SeedData.statuses;
    const now = Date.now();
    return list.filter(st => !st.timestamp || (now - st.timestamp < 86400000));
  },
  saveStatuses: function(statuses) {
    localStorage.setItem('zynix_statuses', JSON.stringify(statuses));
  },
  getCircles: function() {
    const data = localStorage.getItem('zynix_circles');
    if (!data) return Z.SeedData.circles;
    return JSON.parse(data);
  },
  saveCircles: function(circles) {
    localStorage.setItem('zynix_circles', JSON.stringify(circles));
  }
};

Z.handleAuthSubmit = function(mode) {
  const emailInput = document.getElementById('auth-email').value.trim();
  const passInput = document.getElementById('auth-password').value.trim();
  const errContainer = document.getElementById('auth-inline-error');
  
  if (errContainer) errContainer.classList.add('hidden');

  const showInlineError = (msg) => {
    if (errContainer) {
      errContainer.innerText = msg;
      errContainer.classList.remove('hidden');
    } else {
      Z.showToast(msg);
    }
  };

  if (!emailInput || !passInput) {
    showInlineError('Please fill in all required fields.');
    return;
  }

  let users = Z.DB.getUsers();

  if (mode === 'login') {
    const found = users.find(u => 
      (u.email.toLowerCase() === emailInput.toLowerCase() || 
       u.username.toLowerCase() === emailInput.toLowerCase()) && 
      u.password === passInput
    );

    if (found) {
      Z.DB.setCurrentUser(found);
      Z.closeModal();
      Z.showToast(`Welcome back, ${found.name}!`);
      Z.showView('profile');
    } else {
      showInlineError('Incorrect email or password.');
    }
  } else {
    if (users.some(u => u.email.toLowerCase() === emailInput.toLowerCase())) {
      showInlineError('This email is already registered. Try Login.');
      return;
    }

    if (passInput.length < 6) {
      showInlineError('Password does not meet the required rules (min 6 characters).');
      return;
    }

    const nameInput = document.getElementById('auth-name') ? document.getElementById('auth-name').value.trim() : 'New Creator';
    const refCodeInput = document.getElementById('auth-refcode') ? document.getElementById('auth-refcode').value.trim() : '';

    let referrerId = null;
    if (refCodeInput) {
      const refUser = users.find(u => u.referrals && u.referrals.code.toUpperCase() === refCodeInput.toUpperCase());
      if (refUser) referrerId = refUser.id;
    }

    const uniqueCode = 'ZYNIX-' + Math.random().toString(36).substring(2, 8).toUpperCase();
    const uniqueZynixId = 'ZYNIX-' + Math.floor(1000 + Math.random() * 9000);

    const newUser = {
      id: 'usr_' + Date.now(),
      zynixId: uniqueZynixId,
      name: nameInput || 'New Creator',
      username: emailInput.split('@')[0],
      profession: 'Creator',
      bio: 'Joined ZYNIX ecosystem.',
      role: 'Creator',
      avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80',
      cover: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=800&q=80',
      followers: 0,
      package: 'Free',
      bountySettings: { like: 0.01, share: 0.03, follow: 0.03, subscribe: 0.02, circleJoin: 0.03 },
      monthlySubscription: false,
      wallet: { cash: 0.00, bounty: 0.00, totalEarned: 0.00 },
      walletTransactions: [],
      bountySpentHistory: [],
      referrals: { code: uniqueCode, earnings: 0.00, referredBy: referrerId },
      email: emailInput,
      password: passInput,
      interactionHistory: {}
    };

    users.push(newUser);
    Z.DB.saveUsers(users);
    Z.DB.setCurrentUser(newUser);
    Z.closeModal();
    Z.showToast('Account created successfully on Free Package!');
    Z.showView('profile');
  }
};

// Post Handling from Inline Composer
Z.handlePostMediaUpload = function(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    Z.State.attachedPostMediaUrl = e.target.result;
    Z.showToast('Media file attached successfully!');
    const badge = document.getElementById('attached-media-indicator');
    if (badge) badge.classList.remove('hidden');
  };
  reader.readAsDataURL(file);
};

Z.submitInlinePost = function() {
  if (!Z.State.currentUser) {
    Z.openAuthModal('login');
    return;
  }
  const contentEl = document.getElementById('inline-composer-textarea');
  const linkEl = document.getElementById('inline-link-input');
  
  const content = contentEl ? contentEl.value.trim() : '';
  const linkMedia = linkEl ? linkEl.value.trim() : '';
  const finalMedia = Z.State.attachedPostMediaUrl || linkMedia || '';

  if (!content) {
    Z.showToast('Please write what you think before publishing.');
    return;
  }

  const posts = Z.DB.getPosts();
  const newPost = {
    id: 'post_' + Date.now(),
    authorId: Z.State.currentUser.id,
    content: content,
    media: finalMedia,
    createdAt: 'Just now',
    reactions: { diamond: 0, flower: 0, fire: 0, star: 0, clap: 0, spark: 0 },
    comments: [],
    shares: 0
  };

  posts.unshift(newPost);
  Z.DB.savePosts(posts);
  
  // Reset composer state
  Z.State.attachedPostMediaUrl = '';
  Z.State.showLinkInputPost = false;
  Z.showToast('Post published successfully!');
  Z.showView('home');
};

Z.submitWithdrawal = function() {
  const user = Z.DB.getUserById(Z.State.currentUser.id);
  const amount = parseFloat(document.getElementById('withdraw-amount').value) || 0;
  const method = document.getElementById('withdraw-method').value;
  const details = document.getElementById('withdraw-details').value.trim();

  if (amount < 10) { Z.showToast('Minimum withdrawal amount is $10.00'); return; }
  if (user.wallet.cash < amount) { Z.showToast('Insufficient Cash Balance.'); return; }
  if (!details) { Z.showToast('Please enter account details.'); return; }

  user.wallet.cash -= amount;
  if (!user.walletTransactions) user.walletTransactions = [];
  user.walletTransactions.unshift({
    id: 'wd_' + Date.now(),
    date: new Date().toISOString(),
    type: `Withdrawal Request (${method})`,
    amount: -amount,
    cash: -amount,
    bounty: 0,
    status: 'Pending Admin Audit'
  });

  Z.DB.saveUsers();
  Z.closeModal();
  Z.showToast(`Withdrawal request for $${amount.toFixed(2)} submitted!`);
  Z.showView('wallet');
};

  renderSparkStream: function() {
    const sparks = Z.DB.getSparks();
    const users = Z.DB.getUsers();
    const tagFilter = (Z.State.sparkTagFilter || '').toLowerCase();

    let filteredSparks = sparks.filter(s => {
      if (!tagFilter) return true;
      return s.tags && s.tags.some(t => t.toLowerCase().includes(tagFilter));
    });

    let sparksHtml = '';
    filteredSparks.forEach(spark => {
      const author = users.find(u => u.id === spark.authorId) || users[0];
      const bs = author.bountySettings || { like: 0.01 };
      const tagsHtml = (spark.tags || []).map(t => `<button type="button" onclick="Z.State.sparkTagFilter='${t}'; Z.showView('spark');" class="text-emerald-400 font-semibold hover:underline mr-1">#${Z.escapeHtml(t)}</button>`).join(' ');

      sparksHtml += `
        <div class="bg-[#111827] border border-slate-800 rounded-2xl overflow-hidden shadow-2xl relative">
          <div class="relative bg-black h-96 flex items-center justify-center">
            <video src="${Z.escapeHtml(spark.videoUrl)}" controls class="w-full h-full object-cover"></video>
          </div>
          <div class="p-4 space-y-2">
            <div class="flex items-center justify-between">
              <button type="button" onclick="Z.showView('public-profile', '${author.id}')" class="flex items-center space-x-2.5 text-left">

                <div>
                  <h4 class="font-bold text-xs text-white hover:underline">${Z.escapeHtml(author.name)}</h4>
                  <p class="text-[10px] text-slate-400">@${Z.escapeHtml(author.username)}</p>
                </div>
              </button>
            </div>
            <p class="text-xs text-slate-200">${Z.escapeHtml(spark.caption)}</p>
            <div class="text-[11px]">${tagsHtml}</div>
            <div class="flex items-center justify-between pt-2 text-xs text-slate-400 border-t border-slate-800">
              <button type="button" onclick="Z.RewardEngine.processInteraction('${author.id}', 'spark_like', '${spark.id}')" class="flex items-center space-x-1 text-emerald-400 font-bold hover:underline">

    });

    return `

        <div class="space-y-4">${sparksHtml}</div>
      </div>
    `;

  renderPeople: function() {
    const users = Z.DB.getUsers();
    const query = (Z.State.peopleSearchQuery || '').toLowerCase();
    const currentUser = Z.State.currentUser;

    let filtered = users.filter(u => {
      if (!query) return true;
      const nameMatch = u.name && u.name.toLowerCase().includes(query);
      const usernameMatch = u.username && u.username.toLowerCase().includes(query);
      const idMatch = (u.zynixId && u.zynixId.toLowerCase().includes(query)) || (u.id && u.id.toLowerCase().includes(query));
      return nameMatch || usernameMatch || idMatch; // Email strictly excluded from search
    });

    let peopleCardsHtml = '';
    filtered.forEach(u => {
      const isFollowing = currentUser && currentUser.following && currentUser.following.includes(u.id);
      const bs = u.bountySettings || { follow: 0.03 };

      peopleCardsHtml += `
        <div class="bg-[#111827] border border-slate-800 rounded-2xl p-4 flex items-center justify-between shadow-lg">
          <button type="button" onclick="Z.showView('public-profile', '${u.id}')" class="flex items-center space-x-3 text-left">
            <img src="${Z.escapeHtml(u.avatar)}" class="w-12 h-12 rounded-full object-cover border border-slate-700">
            <div>
              <h4 class="font-bold text-xs text-white hover:underline flex items-center">${Z.escapeHtml(u.name)} <span class="ml-1 text-[9px] text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 px-1 rounded">${Z.escapeHtml(u.zynixId || u.id)}</span></h4>
              <p class="text-[10px] text-slate-400">@${Z.escapeHtml(u.username)} • ${Z.escapeHtml(u.profession || 'Creator')}</p>
              <p class="text-[10px] text-indigo-400 font-medium">${u.followers || 0} Followers</p>
            </div>
          </button>

          ${currentUser && currentUser.id === u.id ? `
            <span class="text-xs text-slate-500 font-semibold">You</span>
          ` : `
            <button type="button" onclick="Z.RewardEngine.processInteraction('${u.id}', 'follow')" class="text-xs font-bold px-3 py-1.5 rounded-xl border transition ${isFollowing ? 'bg-slate-800 text-slate-300 border-slate-700' : 'bg-emerald-600 hover:bg-emerald-500 text-black border-emerald-500'}">
              ${isFollowing ? 'Following' : `Follow ($${bs.follow.toFixed(2)})`}
            </button>
          `}
        </div>
      `;
    });

    return `

        <div class="space-y-2">
          <h2 class="font-black text-sm text-white flex items-center"><i class="fa-solid fa-users text-emerald-400 mr-2"></i> Search People & ZYNIX IDs</h2>
          <div class="relative">
            <input type="text" id="people-search-input" value="${Z.escapeHtml(Z.State.peopleSearchQuery)}" 
                   oninput="Z.State.peopleSearchQuery = this.value; Z.showView('people');"
                   placeholder="Search ZYNIX ID, username, or name..." 
                   class="w-full bg-[#111827] border border-slate-800 rounded-2xl px-4 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500 pl-9">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-500 text-xs"></i>
          </div>
        </div>

        <div class="space-y-3">${peopleCardsHtml || '<p class="text-xs text-slate-500 text-center py-6">No users found matching your query.</p>'}</div>
      </div>

          </div>
          <div class="px-4 pb-4 relative pt-10">
            <img src="${Z.escapeHtml(user.avatar)}" class="w-20 h-20 rounded-full object-cover border-4 border-[#111827] absolute -top-10 left-4 shadow-lg">
            
            <div class="flex justify-between items-start">
              <div>
                <h3 class="font-bold text-sm text-white flex items-center">${Z.escapeHtml(user.name)}</h3>
                <p class="text-[10px] text-slate-400">@${Z.escapeHtml(user.username)}</p>
                <p class="text-[10px] text-indigo-400 font-semibold">ID: ${Z.escapeHtml(user.zynixId || user.id)}</p>
              </div>

              ${currentUser && currentUser.id === user.id ? '' : `
                <button type="button" onclick="Z.RewardEngine.processInteraction('${user.id}', 'follow')" class="text-xs font-bold px-4 py-2 rounded-xl transition ${isFollowing ? 'bg-slate-800 text-slate-300' : 'bg-emerald-600 hover:bg-emerald-500 text-black'}">
                  ${isFollowing ? 'Following' : `Follow ($${bs.follow.toFixed(2)})`}
                </button>
              `}
            </div>

            <p class="text-xs text-slate-300 mt-3 leading-relaxed">${Z.escapeHtml(user.bio)}</p>
          </div>
        </div>
      </div>
    `;
  },

  renderWallet: function() {
    const user = Z.State.currentUser;
    if (!user) return '<p class="text-xs text-slate-400 text-center py-6">Please log in to view wallet.</p>';

    const txs = user.walletTransactions || [];
    let txsHtml = '';
    txs.forEach(t => {
      txsHtml += `
        <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800 flex justify-between items-center text-xs">
          <div>
            <p class="font-bold text-white">${Z.escapeHtml(t.type)}</p>
            <p class="text-[9px] text-slate-500">${new Date(t.date).toLocaleString()}</p>
          </div>
          <span class="font-bold ${t.amount >= 0 ? 'text-emerald-400' : 'text-rose-400'}">${t.amount >= 0 ? '+' : ''}$${t.amount.toFixed(2)}</span>
        </div>
      `;
    });

    return `
      <div class="space-y-4">
        <div class="bg-[#111827] border border-slate-800 rounded-2xl p-5 space-y-4 shadow-xl">
          <h3 class="font-bold text-sm text-white border-b border-slate-800 pb-2">ZYNIX Dual Wallet Balance</h3>
          
          <div class="grid grid-cols-2 gap-3">
            <div class="bg-slate-950 p-3 rounded-xl border border-emerald-500/30">
              <span class="text-[10px] text-slate-400 block">Cash Balance (Withdrawable)</span>
              <span class="text-lg font-black text-emerald-400">$${(user.wallet ? user.wallet.cash : 0).toFixed(2)}</span>
            </div>
            <div class="bg-slate-950 p-3 rounded-xl border border-blue-500/30">
              <span class="text-[10px] text-slate-400 block">Bounty Balance (Rewards)</span>
              <span class="text-lg font-black text-blue-400">$${(user.wallet ? user.wallet.bounty : 0).toFixed(2)}</span>
            </div>
          </div>

          <button type="button" onclick="Z.openWithdrawModal()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-black font-bold py-2.5 rounded-xl text-xs transition shadow-lg shadow-emerald-600/20">
            Request Cash Withdrawal ($10 Min)
          </button>
        </div>

        <div class="bg-[#111827] border border-slate-800 rounded-2xl p-4 space-y-3">
          <h4 class="font-bold text-xs text-white">Recent Ledger Transactions</h4>
          <div class="space-y-2 max-h-60 overflow-y-auto pr-1">${txsHtml || '<p class="text-xs text-slate-500 text-center py-3">No transactions recorded.</p>'}</div>
        </div>
      </div>
    `;
  },

  renderBountySettings: function() {
    const user = Z.State.currentUser;
    if (!user) return '';
    const bs = user.bountySettings || { like: 0.01, share: 0.03, follow: 0.03, subscribe: 0.02, circleJoin: 0.03 };

    return `
      <div class="bg-[#111827] border border-slate-800 rounded-2xl p-5 space-y-4 shadow-xl">
        <h3 class="font-bold text-sm text-white border-b border-slate-800 pb-2">Creator Bounty Rate Configuration ($0.00 - $0.05)</h3>
        
        <div class="space-y-3">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Like Bounty ($)</label>
            <input type="number" step="0.01" max="0.05" min="0" value="${bs.like}" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Share Bounty ($)</label>
            <input type="number" step="0.01" max="0.05" min="0" value="${bs.share}" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Follow Bounty ($)</label>
            <input type="number" step="0.01" max="0.05" min="0" value="${bs.follow}" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
          </div>
          <button type="button" onclick="Z.showToast('Bounty rates saved!'); Z.showView('profile');" class="w-full bg-emerald-600 hover:bg-emerald-500 text-black font-bold py-2 rounded-xl text-xs transition">
            Save Rates
          </button>
        </div>
      </div>
    `;
  },

  renderPackages: function() {
    return `
      <div class="space-y-4">
        <h3 class="font-bold text-sm text-white">ZYNIX Ecosystem Subscription Tiers</h3>
        
        <div class="space-y-3">
          <div class="bg-[#111827] border border-slate-800 p-4 rounded-2xl space-y-2">
            <div class="flex justify-between items-center">
              <h4 class="font-bold text-xs text-slate-300">Free Package</h4>
              <span class="text-xs font-black text-slate-400">$0 / mo</span>
            </div>
            <p class="text-[10px] text-slate-400">• Earns on Shares, Follows, Circles & Subscribes. Likes non-rewardable.</p>
          </div>

          <div class="bg-[#111827] border-2 border-emerald-500 p-4 rounded-2xl space-y-2 relative">
            <span class="absolute -top-2.5 right-4 bg-emerald-500 text-black font-black text-[9px] px-2 py-0.5 rounded-full uppercase">Most Popular</span>
            <div class="flex justify-between items-center">
              <h4 class="font-bold text-xs text-emerald-400">$1 Monthly Package</h4>
              <span class="text-xs font-black text-emerald-400">$1.00 / mo</span>
            </div>
            <p class="text-[10px] text-slate-300">• Unlocks Cash Rewards for Likes, Shares, Follows & Circles.</p>
            <p class="text-[10px] text-indigo-400">• Unlocks 2-Tier Monthly Referral Commission ($0.25 L1 / $0.25 L2).</p>
            <button type="button" onclick="Z.showToast('Subscribed to $1 Monthly Package!');" class="w-full bg-emerald-600 hover:bg-emerald-500 text-black font-bold py-2 rounded-xl text-xs transition mt-2">
              Activate $1 Subscription
            </button>
          </div>
        </div>
      </div>
    `;
  },

  renderReferrals: function() {
    const user = Z.State.currentUser;
    if (!user) return '';

    return `
      <div class="bg-[#111827] border border-slate-800 rounded-2xl p-5 space-y-4 shadow-xl">
        <h3 class="font-bold text-sm text-white border-b border-slate-800 pb-2">2-Tier Monthly Referral Ecosystem</h3>
        
        <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-1">
          <span class="text-[10px] text-slate-400 block">Your Referral Code</span>
          <span class="text-sm font-black text-indigo-400 tracking-wider">${Z.escapeHtml(user.referrals ? user.referrals.code : 'ZYNIX-REF')}</span>
        </div>

        <div class="space-y-2 text-xs text-slate-300">
          <p class="font-bold text-emerald-400">Monthly Commission Breakdown ($1 Subscription):</p>
          <ul class="space-y-1 text-[11px] list-disc list-inside text-slate-400">
            <li>Level 1 Direct Referral: <strong class="text-white">$0.25 / month</strong></li>
            <li>Level 2 Indirect Referral: <strong class="text-white">$0.25 / month</strong></li>
            <li>Company Retention: <strong class="text-white">$0.50 / month</strong></li>
          </ul>
        </div>
      </div>
    `;
  },

  renderAnalytics: function() {
    return `<div class="bg-[#111827] border border-slate-800 p-5 rounded-2xl text-xs text-slate-300">Dynamic Creator Analytics & Performance Stream Operational.</div>`;
  },

  renderCalculator: function() {
    return `<div class="bg-[#111827] border border-slate-800 p-5 rounded-2xl text-xs text-slate-300">Creator Earnings Estimator & ROI Calculator.</div>`;
  },

  renderAdminWall: function() {
    return `
      <div class="bg-[#111827] border border-slate-800 p-5 rounded-2xl space-y-3">
        <h3 class="font-bold text-sm text-white flex items-center"><i class="fa-solid fa-shield-halved text-emerald-400 mr-2"></i> Official ZYNIX Admin Wall</h3>
        <p class="text-xs text-slate-300 leading-relaxed">Official system updates, system ledger integrity checks, anti-duplicate validation, and ecosystem announcements.</p>
      </div>
    `;
  }
};
</script>
</body>
</html>

                    list.push(u);
                }
            }
            var me = _currentUser();
            var html = '';
            for (var j = 0; j < list.length; j++) {
                var u = list[j];
                var isConnected = me && me.connected && me.connected.indexOf(u.id) !== -1;
                var isSelf = me && me.id === u.id;
                var bs = u.bountySettings || { connect: 0.03 };
                var bountyText = '$' + Number(bs.connect || 0).toFixed(2);
                html += '<div class="bg-[#111827] border border-slate-800 p-3.5 rounded-2xl flex items-center justify-between shadow-lg"><button type="button" onclick="Z.showView(\'public-profile\',\'' + Z.escape(u.id) + '\')" class="flex items-center space-x-3 text-left"><img src="' + Z.escape(u.avatar) + '" class="w-10 h-10 rounded-full object-cover border border-slate-700"><div><h4 class="font-bold text-xs text-white">' + Z.escape(u.name) + '</h4><p class="text-[10px] text-slate-400">@' + Z.escape(u.username) + ' • ' + Z.escape(u.profession || 'Creator') + ' • ' + (u.connections || 0) + ' connections</p></div></div>' + (isSelf ? '<span class="text-[10px] text-slate-500 font-bold px-2 py-1 bg-slate-900 rounded-lg">You</span>' : (isConnected ? '<span class="text-emerald-400 font-bold text-xs"><i class="fa-solid fa-check-circle mr-1"></i> Connected</span>' : '<button type="button" onclick="Z.RewardEngine.process(\'' + Z.escape(u.id) + '\', \'connect\')" class="bg-emerald-600 hover:bg-emerald-500 text-black font-bold text-xs px-3 py-1.5 rounded-xl transition">Connect (' + bountyText + ')</button>')) + '</div>';
            }
            return '<div class="space-y-3"><div class="flex justify-between items-center px-1"><h3 class="font-black text-sm text-white flex items-center"><i class="fa-solid fa-users text-emerald-400 mr-2"></i> People</h3></div><input id="people-search" value="' + Z.escape(Z.State.peopleSearchQuery || '') + '" oninput="Z.State.peopleSearchQuery=this.value; Z.showView(\'people\');" class="w-full bg-[#111827] border border-slate-800 rounded-xl px-3 py-2.5 text-xs text-white" placeholder="Search people..."><div class="space-y-3">' + (html || '<p class="text-center text-xs text-slate-500 py-8">No people found.</p>') + '</div></div>';
        };
        
        // ============================================================
        // PROFILE VIEW
        // ============================================================
        Z.renderProfile = function() {
            var user = _currentUser();
            if (!user) {
                return '<div class="bg-[#111827] border border-slate-800 rounded-2xl p-6 text-center"><p class="text-xs text-slate-300">Please log in.</p><button type="button" onclick="Z.openAuthModal(\'login\')" class="bg-emerald-600 text-black font-bold text-xs px-4 py-2 rounded-xl mt-3">Login</button></div>';
            }
            return '<div class="space-y-4"><div class="bg-[#111827] border border-slate-800 rounded-2xl overflow-hidden shadow-2xl"><div class="h-28 bg-slate-800 relative"><img src="' + Z.escape(user.cover) + '" class="w-full h-full object-cover"></div><div class="px-4 pb-4 relative pt-10"><img src="' + Z.escape(user.avatar) + '" class="w-20 h-20 rounded-full object-cover border-4 border-[#111827] absolute -top-10 left-4 shadow-lg"><div class="flex justify-between items-start"><div><h3 class="font-bold text-sm text-white">' + Z.escape(user.name) + ' <i class="fa-solid fa-circle-check text-emerald-400 ml-1.5 text-xs"></i></h3><p class="text-xs text-slate-400">@' + Z.escape(user.username) + ' • ' + Z.escape(user.profession) + ' • ' + (user.connections || 0) + ' connections</p></div><button type="button" onclick="Z.showView(\'bounty\')" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs px-3 py-2 rounded-xl"><i class="fa-solid fa-gear"></i> Settings</button></div><p class="text-xs text-slate-300 mt-3">' + Z.escape(user.bio) + '</p><div class="flex items-center space-x-4 pt-3 text-xs text-slate-400 border-t border-slate-800 mt-3"><span><strong class="text-white">' + (user.connections || 0) + '</strong> Connections</span><span><strong class="text-white">Package:</strong> ' + Z.escape(user.package || 'Free') + '</span><span><strong class="text-white">Role:</strong> ' + Z.escape(user.role || 'Viewer') + '</span></div></div></div><div class="grid grid-cols-2 gap-3"><button type="button" onclick="Z.showView(\'wallet\')" class="bg-[#111827] border border-slate-800 p-4 rounded-2xl text-left hover:border-emerald-500 transition"><i class="fa-solid fa-wallet text-emerald-400 text-base mb-1"></i><h4 class="font-bold text-xs text-white">Wallet</h4></button><button type="button" onclick="Z.showView(\'packages\')" class="bg-[#111827] border border-slate-800 p-4 rounded-2xl text-left hover:border-emerald-500 transition"><i class="fa-solid fa-box text-blue-400 text-base mb-1"></i><h4 class="font-bold text-xs text-white">Packages</h4></button><button type="button" onclick="Z.showView(\'calculator\')" class="bg-[#111827] border border-slate-800 p-4 rounded-2xl text-left hover:border-emerald-500 transition"><i class="fa-solid fa-calculator text-amber-400 text-base mb-1"></i><h4 class="font-bold text-xs text-white">Calculator</h4></button><button type="button" onclick="Z.showView(\'referrals\')" class="bg-[#111827] border border-slate-800 p-4 rounded-2xl text-left hover:border-emerald-500 transition"><i class="fa-solid fa-users-rays text-purple-400 text-base mb-1"></i><h4 class="font-bold text-xs text-white">Referrals</h4></button><button type="button" onclick="Z.showView(\'analytics\')" class="bg-[#111827] border border-slate-800 p-4 rounded-2xl text-left hover:border-emerald-500 transition"><i class="fa-solid fa-chart-line text-teal-400 text-base mb-1"></i><h4 class="font-bold text-xs text-white">Analytics</h4></button><button type="button" onclick="Z.showView(\'people\')" class="bg-[#111827] border border-slate-800 p-4 rounded-2xl text-left hover:border-emerald-500 transition"><i class="fa-solid fa-users text-indigo-400 text-base mb-1"></i><h4 class="font-bold text-xs text-white">People</h4></button></div></div>';
        };
        
        // ============================================================
        // PUBLIC PROFILE
        // ============================================================
        Z.renderPublicProfile = function(userId) {
            var target = _userById(userId);
            if (!target) return '<div class="p-4 text-center text-xs text-slate-400">User not found.</div>';
            var bs = target.bountySettings || { connect: 0.03 };
            var me = _currentUser();
            var isConnected = me && me.connected && me.connected.indexOf(target.id) !== -1;
            return '<div class="space-y-4"><div class="flex items-center space-x-2 px-1"><button type="button" onclick="Z.showView(\'people\')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-arrow-left"></i></button><h2 class="font-black text-sm text-white">Profile</h2></div><div class="bg-[#111827] border border-slate-800 rounded-2xl overflow-hidden shadow-2xl"><div class="h-28 bg-slate-800 relative"><img src="' + Z.escape(target.cover) + '" class="w-full h-full object-cover"></div><div class="px-4 pb-4 relative pt-10"><img src="' + Z.escape(target.avatar) + '" class="w-20 h-20 rounded-full object-cover border-4 border-[#111827] absolute -top-10 left-4 shadow-lg"><div class="flex justify-between items-start"><div><h3 class="font-bold text-sm text-white">' + Z.escape(target.name) + ' <i class="fa-solid fa-circle-check text-emerald-400 ml-1.5 text-xs"></i></h3><p class="text-xs text-slate-400">@' + Z.escape(target.username) + ' • ' + Z.escape(target.profession) + ' • ' + (target.connections || 0) + ' connections</p></div>' + (isConnected ? '<span class="text-emerald-400 font-bold text-xs px-3 py-2 rounded-xl border border-emerald-500/30"><i class="fa-solid fa-check-circle mr-1"></i> Connected</span>' : '<button type="button" onclick="Z.RewardEngine.process(\'' + Z.escape(target.id) + '\', \'connect\')" class="bg-emerald-600 hover:bg-emerald-500 text-black font-bold text-xs px-4 py-2 rounded-xl">Connect ($' + Number(bs.connect || 0).toFixed(2) + ')</button>') + '</div><p class="text-xs text-slate-300 mt-3">' + Z.escape(target.bio) + '</p><div class="flex items-center space-x-4 pt-3 text-xs text-slate-400 border-t border-slate-800 mt-3"><span><strong class="text-white">' + (target.connections || 0) + '</strong> Connections</span><span><strong class="text-white">Package:</strong> ' + Z.escape(target.package || 'Free') + '</span><span><strong class="text-white">Role:</strong> ' + Z.escape(target.role || 'Creator') + '</span></div></div></div></div>';
        };
        
        // ============================================================
        // BOUNTY SETTINGS
        // ============================================================
        Z.renderBounty = function() {
            var user = _currentUser() ? Z.DB.getUserById(_currentUser().id) : _getUsers()[0];
            var bs = user.bountySettings || {};
            
            var settings = [
                { id: 'connect', label: '🤝 Connect', default: 0.03 },
                { id: 'subscribe', label: '🔔 Subscribe', default: 0.05 },
                { id: 'comment', label: '📝 Comment', default: 0.03 },
                { id: 'share', label: '🔄 Share', default: 0.04 },
                { id: 'circleJoin', label: '🌀 Join Circle', default: 0.02 }
            ];
            
            var options = [
                { value: 0.05, label: '$0.05 (Premium)' },
                { value: 0.04, label: '$0.04 (High)' },
                { value: 0.03, label: '$0.03 (Medium)' },
                { value: 0.02, label: '$0.02 (Low)' },
                { value: 0.01, label: '$0.01 (Minimal)' },
                { value: 0.00, label: '$0.00 (Disabled)' }
            ];
            
            var inputs = '';
            for (var i = 0; i < settings.length; i++) {
                var s = settings[i];
                var currentVal = bs[s.id] !== undefined ? bs[s.id] : s.default;
                inputs += '<div class="bg-slate-950/60 border border-slate-800/80 p-3 rounded-xl"><label class="block text-xs font-bold text-slate-200 mb-1.5">' + s.label + '</label><select id="bounty-' + s.id + '" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs text-white font-mono">';
                for (var j = 0; j < options.length; j++) {
                    var opt = options[j];
                    var selected = (Math.abs(opt.value - currentVal) < 0.0001) ? 'selected' : '';
                    inputs += '<option value="' + opt.value + '" ' + selected + '>' + opt.label + '</option>';
                }
                inputs += '</select></div>';
            }
            
            return '<div class="bg-[#111827] border border-slate-800 rounded-2xl p-4 space-y-4 shadow-2xl"><div class="flex items-center justify-between border-b border-slate-800 pb-3"><div class="flex items-center space-x-2"><button type="button" onclick="Z.showView(\'profile\')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-arrow-left"></i></button><h3 class="font-bold text-sm text-white">Bounty Settings</h3></div><span class="text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded font-bold">$0.00 - $0.05</span></div><p class="text-xs text-slate-400 leading-relaxed">Set rewards for interactions on YOUR content. (Reactions are fixed: ❤️ $0.05, 🌹 $0.04, 🔥 $0.03, 👏 $0.02, ⭐ $0.01)</p><div class="space-y-3 max-h-96 overflow-y-auto">' + inputs + '</div><button type="button" onclick="Z.saveBounty()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-black font-bold py-3 rounded-xl text-xs transition">Save Settings</button></div>';
        };
        
        Z.saveBounty = function() {
            if (!_currentUser()) return;
            var user = Z.DB.getUserById(_currentUser().id);
            if (!user) return;
            if (!user.bountySettings) user.bountySettings = {};
            var keys = ['connect', 'subscribe', 'comment', 'share', 'circleJoin'];
            for (var i = 0; i < keys.length; i++) {
                var el = document.getElementById('bounty-' + keys[i]);
                if (el) { user.bountySettings[keys[i]] = parseFloat(el.value) || 0; }
            }
            Z.DB.saveUsers();
            Z.toast('Bounty settings saved!');
            Z.showView('profile');
        };
        
        // ============================================================
        // CIRCLES VIEW
        // ============================================================
        Z.renderCircles = function() {
            var circles = Z.DB.getCircles();
            var query = (Z.State.circleSearchQuery || '').toLowerCase();
            var user = _currentUser();
            var joinedIds = user && user.joinedCircles ? user.joinedCircles : [];
            
            var filtered = circles.filter(function(c) {
                return c.name.toLowerCase().indexOf(query) !== -1 || c.description.toLowerCase().indexOf(query) !== -1;
            });
            
            var html = '<div class="space-y-4"><div class="flex items-center justify-between px-1"><h2 class="font-black text-sm text-white flex items-center"><i class="fa-solid fa-circle-nodes text-emerald-400 mr-2"></i> Circles</h2></div><div class="relative"><i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-500 text-xs"></i><input type="text" id="circle-search" value="' + Z.escape(Z.State.circleSearchQuery || '') + '" oninput="Z.State.circleSearchQuery=this.value; Z.showView(\'circles\');" placeholder="Search circles..." class="w-full bg-[#111827] border border-slate-800 rounded-xl pl-9 pr-4 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500"></div>';
            
            var myCircles = filtered.filter(function(c) { return joinedIds.indexOf(c.id) !== -1; });
            if (myCircles.length) {
                html += '<div class="space-y-1.5"><span class="text-[10px] uppercase tracking-wider text-slate-400 font-bold px-1">My Circles</span>';
                for (var i = 0; i < myCircles.length; i++) { html += Z.renderCircleCard(myCircles[i], true); }
                html += '</div>';
            }
            
            var otherCircles = filtered.filter(function(c) { return joinedIds.indexOf(c.id) === -1; });
            if (otherCircles.length) {
                html += '<div class="space-y-1.5"><span class="text-[10px] uppercase tracking-wider text-slate-400 font-bold px-1">All Circles</span>';
                for (var j = 0; j < otherCircles.length; j++) { html += Z.renderCircleCard(otherCircles[j], false); }
                html += '</div>';
            }
            
            if (!filtered.length) { html += '<p class="text-xs text-slate-500 text-center py-8">No circles found.</p>'; }
            html += '<button type="button" onclick="Z.openCreateCircleModal()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-black font-bold py-3 rounded-xl text-xs transition">+ Create Circle</button></div>';
            return html;
        };
        
        Z.renderCircleCard = function(circle, isJoined) {
            var typeLabels = { social: 'Social', services: 'Services', goods: 'Goods' };
            var typeColors = { social: 'shop-badge-social', services: 'shop-badge-services', goods: 'shop-badge-goods' };
            var label = typeLabels[circle.type] || 'Social';
            var color = typeColors[circle.type] || 'shop-badge-social';
            var shopItems = '';
            if (circle.shopItems && circle.shopItems.length) {
                shopItems = '<div class="grid grid-cols-2 gap-2 mt-2">';
                for (var i = 0; i < Math.min(circle.shopItems.length, 4); i++) {
                    var item = circle.shopItems[i];
                    shopItems += '<div class="bg-slate-950 p-2 rounded-lg border border-slate-800"><div class="font-bold text-xs text-white">' + Z.escape(item.name) + '</div><div class="text-[10px] text-emerald-400">$' + item.price + '</div></div>';
                }
                shopItems += '</div>';
            }
            return '<div class="bg-[#111827] border border-slate-800 p-4 rounded-2xl space-y-2 shadow-xl"><div class="flex items-center justify-between"><div class="flex items-center space-x-3"><img src="' + Z.escape(circle.avatar) + '" class="w-10 h-10 rounded-full object-cover border border-slate-700"><div><h4 class="font-bold text-sm text-white">' + Z.escape(circle.name) + '</h4><p class="text-[10px] text-slate-400">' + (circle.members || 0) + ' members • <span class="' + color + ' shop-badge">' + label + '</span></p></div></div>' + (isJoined ? '<span class="text-emerald-400 font-bold text-xs"><i class="fa-solid fa-check mr-1"></i> Joined</span>' : '<button type="button" onclick="Z.RewardEngine.process(\'' + Z.escape(circle.creatorId) + '\', \'circleJoin\', \'' + Z.escape(circle.id) + '\')" class="bg-emerald-600 hover:bg-emerald-500 text-black font-bold px-3.5 py-1.5 rounded-xl text-xs">Join ($0.02)</button>') + '</div><p class="text-xs text-slate-300">' + Z.escape(circle.description) + '</p>' + shopItems + '</div>';
        };
        
        Z.openCreateCircleModal = function() {
            if (!Z.State.currentUser) { Z.openAuthModal('login'); return; }
            var modal = document.getElementById('modal-container');
            if (!modal) return;
            modal.innerHTML = '<div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4"><div class="bg-[#111827] border border-slate-800 rounded-2xl w-full max-w-md p-6 space-y-4 shadow-2xl"><div class="flex justify-between items-center border-b border-slate-800 pb-3"><h3 class="font-bold text-base text-white">Create Circle</h3><button type="button" onclick="Z.closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button></div><div class="space-y-3"><div><label class="block text-xs font-medium text-slate-400 mb-1">Name</label><input type="text" id="circle-name" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white" placeholder="My Circle"></div><div><label class="block text-xs font-medium text-slate-400 mb-1">Description</label><textarea id="circle-desc" rows="2" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white" placeholder="What is this circle about?"></textarea></div><div><label class="block text-xs font-medium text-slate-400 mb-1">Type</label><select id="circle-type" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"><option value="social">Social Purpose</option><option value="services">Services</option><option value="goods">Physical Goods</option></select></div><div><label class="block text-xs font-medium text-slate-400 mb-1">Avatar URL</label><input type="text" id="circle-avatar" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white" placeholder="https://..."></div><button type="button" onclick="Z.submitCircle()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-black font-bold py-2.5 rounded-xl text-xs transition">Create</button></div></div></div>';
        };
        
        Z.submitCircle = function() {
            var name = document.getElementById('circle-name').value.trim();
            var desc = document.getElementById('circle-desc').value.trim();
            var type = document.getElementById('circle-type').value;
            var avatar = document.getElementById('circle-avatar').value.trim() || 'https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=150&q=80';
            if (!name) { Z.toast('Enter a name.'); return; }
            var circles = Z.DB.getCircles();
            var newCircle = {
                id: 'cir_' + Date.now(),
                name: name,
                description: desc || 'A new ZYNIX circle.',
                members: 1,
                creatorId: Z.State.currentUser.id,
                avatar: avatar,
                type: type,
                shopItems: []
            };
            circles.unshift(newCircle);
            Z.DB.saveCircles(circles);
            if (!Z.State.currentUser.joinedCircles) Z.State.currentUser.joinedCircles = [];
            Z.State.currentUser.joinedCircles.push(newCircle.id);
            Z.DB.saveUsers();
            Z.closeModal();
            Z.toast('Circle created!');
            Z.showView('circles');
        };
        
        // ============================================================
        // WALLET
        // ============================================================
        Z.renderWallet = function() {
            var user = _currentUser() ? Z.DB.getUserById(_currentUser().id) : null;
            var txHtml = '';
            if (user && user.walletTx && user.walletTx.length > 0) {
                for (var i = 0; i < user.walletTx.length; i++) {
                    var tx = user.walletTx[i];
                    var isMinus = tx.amount < 0;
                    txHtml += '<div class="flex items-center justify-between bg-slate-950/60 border border-slate-800 p-2.5 rounded-xl text-xs"><div><span class="font-bold text-white">' + Z.escape(tx.type) + '</span><span class="text-[10px] text-slate-400">' + new Date(tx.date).toLocaleTimeString() + '</span></div><div class="text-right"><span class="font-black ' + (isMinus ? 'text-rose-400' : 'text-emerald-400') + '">' + (isMinus ? '' : '+') + '$' + Number(tx.amount || 0).toFixed(2) + '</span></div></div>';
                }
            } else { txHtml = '<p class="text-xs text-slate-500 text-center py-4">No transactions.</p>'; }
            return '<div class="space-y-4"><div class="bg-[#111827] border border-slate-800 rounded-2xl p-4 space-y-4 shadow-2xl"><div class="flex justify-between items-center border-b border-slate-800 pb-3"><div class="flex items-center space-x-2"><button type="button" onclick="Z.showView(\'profile\')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-arrow-left"></i></button><h3 class="font-bold text-sm text-white">Wallet</h3></div></div><div class="grid grid-cols-2 gap-3"><div class="bg-slate-950/80 border border-slate-800 p-3.5 rounded-xl"><span class="text-[10px] text-slate-400 uppercase font-semibold">Cash</span><span class="text-xl font-black text-emerald-400">$' + (user ? Number(user.wallet.cash || 0).toFixed(2) : '0.00') + '</span></div><div class="bg-slate-950/80 border border-slate-800 p-3.5 rounded-xl"><span class="text-[10px] text-slate-400 uppercase font-semibold">Bounty</span><span class="text-xl font-black text-blue-400">$' + (user ? Number(user.wallet.bounty || 0).toFixed(2) : '0.00') + '</span></div></div><button type="button" onclick="Z.openWithdraw()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-black font-bold py-2.5 rounded-xl text-xs">Withdraw Cash</button><div class="space-y-2 pt-2"><h4 class="font-bold text-xs text-slate-300 uppercase tracking-wider">History</h4><div class="space-y-2 max-h-72 overflow-y-auto">' + txHtml + '</div></div></div></div>';
        };
        
        Z.openWithdraw = function() {
            if (!_currentUser()) { Z.openAuthModal('login'); return; }
            var user = _currentUser();
            var modal = document.getElementById('modal-container');
            if (!modal) return;
            modal.innerHTML = '<div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4"><div class="bg-[#111827] border border-slate-800 rounded-2xl w-full max-w-md p-6 space-y-4 shadow-2xl"><div class="flex justify-between items-center border-b border-slate-800 pb-3"><h3 class="font-bold text-base text-white">Withdraw</h3><button type="button" onclick="Z.closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button></div><div class="space-y-3"><div class="bg-slate-950 p-3 rounded-xl border border-slate-800 flex justify-between"><span class="text-xs text-slate-400">Available:</span><span class="text-base font-black text-emerald-400">$' + Number(user.wallet.cash || 0).toFixed(2) + '</span></div><div><label class="block text-xs font-medium text-slate-400 mb-1">Amount ($)</label><input type="number" step="1" min="10" id="withdraw-amount" value="10" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"><span class="text-[10px] text-slate-500">Min: $10.00</span></div><div><label class="block text-xs font-medium text-slate-400 mb-1">Method</label><select id="withdraw-method" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"><option value="Payoneer">Payoneer</option><option value="Crypto USDT">Crypto USDT</option><option value="Bank">Bank Transfer</option></select></div><div><label class="block text-xs font-medium text-slate-400 mb-1">Details</label><input type="text" id="withdraw-details" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white" placeholder="Email or wallet address"></div><button type="button" onclick="Z.submitWithdraw()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-black font-bold py-2.5 rounded-xl text-xs">Confirm</button></div></div></div>';
        };
        
        Z.submitWithdraw = function() {
            var user = _currentUser();
            if (!user) return;
            var amount = parseFloat(document.getElementById('withdraw-amount')?.value) || 0;
            var method = document.getElementById('withdraw-method')?.value || 'Payoneer';
            var details = document.getElementById('withdraw-details')?.value.trim() || '';
            if (amount < 10) { Z.toast('Min: $10.00'); return; }
            if (Number(user.wallet.cash || 0) < amount) { Z.toast('Insufficient balance.'); return; }
            if (!details) { Z.toast('Enter details.'); return; }
            user.wallet.cash -= amount;
            if (!user.walletTx) user.walletTx = [];
            user.walletTx.unshift({
                id: 'wd_' + Date.now(),
                date: new Date().toISOString(),
                type: 'Withdrawal: ' + method,
                amount: -amount,
                cash: -amount,
                bounty: 0,
                status: 'Pending'
            });
            Z.DB.saveUsers();
            Z.closeModal();
            Z.toast('Withdrawal submitted!');
            Z.showView('wallet');
        };
        
        // ============================================================
        // PACKAGES
        // ============================================================
        Z.renderPackages = function() {
            var user = _currentUser();
            var currentPkg = user ? user.package : 'Free';
            var list = [
                { name: 'Free', price: 0, desc: 'Browse only. No rewards.' },
                { name: 'Starter $3', price: 3, desc: '$0.01/like, 10 daily.' },
                { name: 'Growth $10', price: 10, desc: '$0.015/like, 25 daily.' },
                { name: 'Creator $20', price: 20, desc: '$0.02/like, 50 daily.' },
                { name: 'Pro $40', price: 40, desc: '$0.02/like, 100 daily.' },
                { name: 'Enterprise $100', price: 100, desc: '$0.025/like, 500 daily.' }
            ];
            var html = '';
            for (var i = 0; i < list.length; i++) {
                var p = list[i];
                var isCurrent = currentPkg === p.name;
                html += '<div class="bg-[#111827] border ' + (isCurrent ? 'border-emerald-500' : 'border-slate-800') + ' p-4 rounded-2xl shadow-xl"><div class="flex justify-between"><h3 class="font-bold text-sm ' + (isCurrent ? 'text-emerald-400' : 'text-white') + '">' + Z.escape(p.name) + '</h3><span class="text-xs font-black text-emerald-400">$' + p.price + '</span></div><p class="text-xs text-slate-300">' + Z.escape(p.desc) + '</p>' + (isCurrent ? '<button disabled class="w-full bg-slate-800 text-emerald-400 font-bold py-2 rounded-xl text-xs">✓ Current</button>' : '<button type="button" onclick="Z.upgradePackage(\'' + Z.escape(p.name) + '\', ' + p.price + ')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-black font-bold py-2 rounded-xl text-xs">Upgrade $' + p.price + '</button>') + '</div>';
            }
            return '<div class="space-y-4"><div class="flex items-center space-x-2 px-1"><button type="button" onclick="Z.showView(\'profile\')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-arrow-left"></i></button><h2 class="font-black text-sm text-white">Packages</h2></div><div class="grid grid-cols-1 gap-3">' + html + '</div></div>';
        };
        
        Z.upgradePackage = function(name, price) {
            if (!_currentUser()) { Z.openAuthModal('login'); return; }
            var user = Z.DB.getUserById(_currentUser().id);
            if (!user) return;
            if (user.wallet.cash < price) { Z.toast('Need $' + price.toFixed(2)); return; }
            user.wallet.cash -= price;
            user.package = name;
            if (!user.walletTx) user.walletTx = [];
            user.walletTx.unshift({
                id: 'pkg_' + Date.now(),
                date: new Date().toISOString(),
                type: 'Package: ' + name,
                amount: -price,
                cash: -price,
                bounty: 0,
                status: 'Completed'
            });
            Z.DB.saveUsers();
            Z.toast('Upgraded to ' + name + '!');
            Z.showView('profile');
        };
        
        // ============================================================
        // CALCULATOR
        // ============================================================
        Z.renderCalculator = function() {
            return '<div class="bg-[#111827] border border-slate-800 rounded-2xl p-4 space-y-4"><div class="flex items-center space-x-2 border-b border-slate-800 pb-3"><button type="button" onclick="Z.showView(\'profile\')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-arrow-left"></i></button><h3 class="font-bold text-sm text-white">Calculator</h3></div><div class="space-y-3"><div><label class="block text-xs font-medium text-slate-400 mb-1">Package</label><select id="calc-package" onchange="Z.updateCalc()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"><option value="Starter $3">Starter $3 ($0.01)</option><option value="Growth $10">Growth $10 ($0.015)</option><option value="Creator $20">Creator $20 ($0.02)</option><option value="Pro $40">Pro $40 ($0.02)</option><option value="Enterprise $100" selected>Enterprise $100 ($0.025)</option></select></div><div><label class="block text-xs font-medium text-slate-400 mb-1">Daily Interactions</label><input type="number" id="calc-interactions" value="50" oninput="Z.updateCalc()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"></div><div class="bg-slate-950 p-3 rounded-xl border border-slate-800"><span class="text-[10px] text-slate-400">Daily Gross: <strong id="calc-gross" class="text-emerald-400">$1.25</strong></span><br><span class="text-[10px] text-slate-500">Cash: <span id="calc-cash" class="text-emerald-400 font-bold">$0.75</span> | Bounty: <span id="calc-bounty" class="text-blue-400 font-bold">$0.50</span></span></div></div></div>';
        };
        
        Z.updateCalc = function() {
            var pkgName = document.getElementById('calc-package')?.value || 'Enterprise $100';
            var count = parseFloat(document.getElementById('calc-interactions')?.value) || 0;
            var pkg = Z.Packages[pkgName] || Z.Packages['Starter $3'];
            var gross = count * (pkg.likeRewardRate || 0.01);
            var cash = gross * 0.60;
            var bounty = gross * 0.40;
            var grossEl = document.getElementById('calc-gross');
            var cashEl = document.getElementById('calc-cash');
            var bountyEl = document.getElementById('calc-bounty');
            if (grossEl) grossEl.innerText = '$' + gross.toFixed(2);
            if (cashEl) cashEl.innerText = '$' + cash.toFixed(2);
            if (bountyEl) bountyEl.innerText = '$' + bounty.toFixed(2);
        };
        
        // ============================================================
        // REFERRALS
        // ============================================================
        Z.renderReferrals = function() {
            var user = _currentUser() || _getUsers()[0];
            var refCode = user.referrals ? user.referrals.code : 'ZYNIX-REF2026';
            var refLink = location.origin + location.pathname + '?ref=' + refCode;
            return '<div class="bg-[#111827] border border-slate-800 rounded-2xl p-4 space-y-4"><div class="flex items-center space-x-2 border-b border-slate-800 pb-3"><button type="button" onclick="Z.showView(\'profile\')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-arrow-left"></i></button><h3 class="font-bold text-sm text-white">Referrals</h3></div><div class="bg-slate-950 p-3.5 rounded-xl border border-slate-800"><span class="text-[10px] text-slate-400 block uppercase font-semibold">Your Code</span><div class="flex items-center justify-between bg-slate-900 border border-slate-800 px-3 py-2 rounded-lg"><span class="font-mono text-[11px] text-emerald-400 truncate mr-2">' + Z.escape(refLink) + '</span><button type="button" onclick="navigator.clipboard.writeText(\'' + Z.escape(refLink) + '\'); Z.toast(\'Copied!\')" class="text-xs bg-emerald-600 text-black px-3 py-1 rounded font-bold">Copy</button></div></div><div class="bg-slate-950/60 border border-slate-800 p-3 rounded-xl flex justify-between"><span class="text-xs text-slate-300">Earnings</span><span class="font-black text-emerald-400">$' + Number(user.referrals ? user.referrals.earnings || 0 : 0).toFixed(2) + '</span></div></div>';
        };
        
        // ============================================================
        // ANALYTICS
        // ============================================================
        Z.renderAnalytics = function() {
            var user = _currentUser() || _getUsers()[0];
            var posts = Z.DB.getPosts();
            var userPosts = posts.filter(function(p) { return p.authorId === user.id; });
            var totalReactions = 0;
            for (var i = 0; i < userPosts.length; i++) {
                var p = userPosts[i];
                if (p.reactions) {
                    var vals = Object.values(p.reactions);
                    for (var j = 0; j < vals.length; j++) { totalReactions += vals[j]; }
                }
            }
            var totalBounty = 0;
            var history = user.bountySpent || [];
            for (var k = 0; k < history.length; k++) { totalBounty += history[k].amount; }
            return '<div class="bg-[#111827] border border-slate-800 rounded-2xl p-4 space-y-4"><div class="flex items-center space-x-2 border-b border-slate-800 pb-3"><button type="button" onclick="Z.showView(\'profile\')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-arrow-left"></i></button><h3 class="font-bold text-sm text-white">Analytics</h3></div><div class="grid grid-cols-2 gap-3"><div class="bg-slate-950 p-3 rounded-xl border border-slate-800"><span class="text-[10px] text-slate-400">Connections</span><span class="text-base font-black text-white">' + (user.connections || 0) + '</span></div><div class="bg-slate-950 p-3 rounded-xl border border-slate-800"><span class="text-[10px] text-slate-400">Reactions</span><span class="text-base font-black text-emerald-400">' + totalReactions + '</span></div><div class="bg-slate-950 p-3 rounded-xl border border-slate-800"><span class="text-[10px] text-slate-400">Cash Earned</span><span class="text-base font-black text-blue-400">$' + Number(user.wallet ? user.wallet.cash || 0 : 0).toFixed(2) + '</span></div><div class="bg-slate-950 p-3 rounded-xl border border-slate-800"><span class="text-[10px] text-slate-400">Bounty Spent</span><span class="text-base font-black text-purple-400">$' + totalBounty.toFixed(2) + '</span></div></div></div>';
        };
        
        // ============================================================
        // NOTIFICATIONS
        // ============================================================
        Z.renderNotifications = function() {
            var notifs = Z.DB.getNotifications() || [];
            var html = '<div class="space-y-4"><div class="flex items-center space-x-2 px-1"><button type="button" onclick="Z.showView(\'home\')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-arrow-left"></i></button><h2 class="font-black text-sm text-white">Notifications</h2></div>';
            if (notifs.length) {
                for (var i = 0; i < notifs.length; i++) {
                    var n = notifs[i];
                    html += '<div class="bg-[#111827] border border-slate-800 p-3 rounded-xl flex items-start gap-3"><div class="w-2 h-2 rounded-full ' + (n.read ? 'bg-slate-600' : 'bg-emerald-400') + ' mt-2"></div><div><div class="text-xs text-slate-200">' + Z.escape(n.message) + '</div><div class="text-[10px] text-slate-500">' + new Date(n.timestamp).toLocaleString() + '</div></div></div>';
                }
            } else { html += '<p class="text-xs text-slate-500 text-center py-8">No notifications.</p>'; }
            html += '</div>';
            return html;
        };
        
        // ============================================================
        // MESSAGES
        // ============================================================
        Z.renderMessages = function() {
            var msgs = Z.DB.getMessages() || [];
            var html = '<div class="space-y-4"><div class="flex items-center space-x-2 px-1"><button type="button" onclick="Z.showView(\'home\')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-arrow-left"></i></button><h2 class="font-black text-sm text-white">Messages</h2></div>';
            if (msgs.length) {
                for (var i = 0; i < msgs.length; i++) {
                    var msg = msgs[i];
                    var sender = _userById(msg.senderId);
                    html += '<div class="bg-[#111827] border border-slate-800 p-3 rounded-xl flex items-center gap-3"><img src="' + Z.escape(sender ? sender.avatar : '') + '" class="w-10 h-10 rounded-full object-cover"><div><div class="font-bold text-xs text-white">' + Z.escape(sender ? sender.name : 'Unknown') + '</div><div class="text-[10px] text-slate-400 truncate">' + Z.escape(msg.text || '') + '</div></div></div>';
                }
            } else { html += '<p class="text-xs text-slate-500 text-center py-8">No messages.</p>'; }
            html += '</div>';
            return html;
        };
        
        // ============================================================
        // ADMIN WALL
        // ============================================================
        Z.renderAdminWall = function() {
            return '<div class="space-y-4"><div class="bg-gradient-to-r from-indigo-900/60 to-purple-900/60 border border-indigo-500/40 rounded-2xl p-4"><span class="text-[10px] bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded font-bold">Admin Wall</span><h2 class="font-black text-base text-white">ZYNIX Announcements</h2></div><div class="bg-[#111827] border border-slate-800 rounded-2xl p-4 space-y-3"><div class="flex items-center space-x-2"><span class="bg-rose-500/20 text-rose-400 border border-rose-500/30 text-[9px] font-bold px-2 py-0.5 rounded">Pinned</span><h3 class="font-bold text-xs text-white">Welcome to ZYNIX</h3></div><div class="rounded-xl overflow-hidden bg-black h-52 border border-slate-800"><video src="https://assets.mixkit.co/videos/preview/mixkit-digital-animation-of-screens-and-code-31910-large.mp4" controls class="w-full h-full object-cover"></video></div><p class="text-xs text-slate-300">Reward distribution and creator settings overview.</p></div></div>';
        };
        
        // ============================================================
        // BOOT
        // ============================================================
        function boot() {
            if (!localStorage.getItem('zynix_users')) Z.DB.saveUsers(Z.SeedData.users);
            if (!localStorage.getItem('zynix_posts')) Z.DB.savePosts(Z.SeedData.posts);
            if (!localStorage.getItem('zynix_sparks')) Z.DB.saveSparks(Z.SeedData.sparks);
            if (!localStorage.getItem('zynix_statuses')) Z.DB.saveStatuses(Z.SeedData.statuses);
            if (!localStorage.getItem('zynix_circles')) Z.DB.saveCircles(Z.SeedData.circles);
            
            var savedTheme = localStorage.getItem('zynix_theme');
            if (savedTheme === 'light') {
                document.documentElement.classList.remove('dark');
                document.documentElement.classList.add('light');
                var icon = document.getElementById('theme-icon');
                if (icon) icon.className = 'fa-solid fa-sun';
            }
            
            Z.State.currentUser = Z.DB.getCurrentUser();
            Z.renderHeaderAuth();
            Z.updateHeader();
            Z.showView('home');
        }
        
        document.addEventListener('DOMContentLoaded', boot);
        
    })();
    </script>
</body>
</html>

        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
        
        @keyframes flyToWalletPure {
            0% { transform: scale(0.6) translateX(0) rotate(0deg); opacity: 0; }
            20% { transform: scale(1.2) translateX(-20px) rotate(-10deg); opacity: 1; }
            80% { transform: scale(0.9) translateY(-160px) translateX(90px) rotate(20deg); opacity: 1; }
            100% { transform: scale(0.3) translateY(-250px) translateX(160px) rotate(45deg); opacity: 0; }
        }
        .dollar-note-pure {
            animation: flyToWalletPure 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            background: transparent !important;
            box-shadow: none !important;
            border: none !important;
        }
        @keyframes pulseWallet {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); box-shadow: 0 0 25px rgba(16, 185, 129, 0.7); }
            100% { transform: scale(1); }
        }
        .wallet-pulse {
            animation: pulseWallet 0.5s ease-in-out;
        }
        body { background-color: #090d16; color: #f8fafc; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }

    <script>
        window.Z = {};

        // XSS Sanitization Helper (BUG #33 FIX)
        Z.escapeHtml = function(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        };

        Z.State = {
            currentUser: null, // Default set strictly to null (BUG #25 FIX)
            currentView: 'home',
            circleSearchQuery: '',
            sparkTagFilter: ''
        };

        // Package Rule System Specification (BUG #3 & #17 & #19 FIX)
        Z.Packages = {
            'Free': { name: 'Free', price: 0, dailyLimit: 0, canEarn: false, likeRewardRate: 0 },
            'Starter $3': { name: 'Starter $3', price: 3, dailyLimit: 10, canEarn: true, likeRewardRate: 0.01 },
            'Growth $10': { name: 'Growth $10', price: 10, dailyLimit: 25, canEarn: true, likeRewardRate: 0.015 },
            'Creator $20': { name: 'Creator $20', price: 20, dailyLimit: 50, canEarn: true, likeRewardRate: 0.02 },
            'Pro $40': { name: 'Pro $40', price: 40, dailyLimit: 100, canEarn: true, likeRewardRate: 0.02 },
            'Enterprise $100': { name: 'Enterprise $100', price: 100, dailyLimit: 500, canEarn: true, likeRewardRate: 0.025 }
        };

        // Central Reward & Bounty Engine
        Z.RewardEngine = {
            calculateSplit: function(grossAmount) {
                const cash = Number((grossAmount * 0.60).toFixed(4));
                const bounty = Number((grossAmount * 0.40).toFixed(4));
                return { cash, bounty, gross: grossAmount };
            },
            
            // Check Daily Limits (BUG #19 FIX)
            checkDailyLimit: function(user) {
                const today = new Date().toISOString().split('T')[0];
                if (!user.dailyTracker || user.dailyTracker.date !== today) {
                    user.dailyTracker = { date: today, count: 0 };
                }
                const pkg = Z.Packages[user.package || 'Free'] || Z.Packages['Free'];
                return {
                    allowed: user.dailyTracker.count < pkg.dailyLimit,
                    current: user.dailyTracker.count,
                    limit: pkg.dailyLimit
                };
            },

            creditReward: function(user, grossAmount, reason) {
                if (!user) return false;
                const split = this.calculateSplit(grossAmount);
                
                if (!user.wallet) user.wallet = { cash: 0.00, bounty: 0.00, totalEarned: 0.00 };
                if (!user.walletTransactions) user.walletTransactions = [];
                
                user.wallet.cash += split.cash;
                user.wallet.bounty += split.bounty;
                user.wallet.totalEarned += grossAmount;
                
                user.walletTransactions.unshift({
                    id: 'tx_' + Date.now(),
                    date: new Date().toISOString(),
                    type: reason,
                    amount: grossAmount,
                    cash: split.cash,
                    bounty: split.bounty,
                    status: 'Completed'
                });
                
                Z.DB.saveUsers();
                Z.updateHeaderWallet();
                Z.triggerRewardAnimation(grossAmount);
                Z.showToast(`Reward: +$${grossAmount.toFixed(2)} (+$${split.cash.toFixed(3)} Cash, +$${split.bounty.toFixed(3)} Bounty)`);
                return true;
            },

            processInteraction: function(contentOwnerId, interactionType, targetId) {
                // Check Authentication
                if (!Z.State.currentUser) {
                    Z.openAuthModal('login');
                    Z.showToast('Please log in to participate and earn rewards.');
                    return false;
                }

                const currentUser = Z.DB.getUserById(Z.State.currentUser.id);
                const pkg = Z.Packages[currentUser.package || 'Free'] || Z.Packages['Free'];

                // Package Eligibility Check (BUG #3 FIX)
                if (!pkg.canEarn) {
                    Z.showToast('Free Package users cannot earn interaction rewards. Please upgrade package!');
                    return false;
                }

                // Daily Limit Check (BUG #19 FIX)
                const limitStatus = this.checkDailyLimit(currentUser);
                if (!limitStatus.allowed) {
                    Z.showToast(`Daily limit reached (${limitStatus.limit}/${limitStatus.limit}). Upgrade package for more!`);
                    return false;
                }

                const contentOwner = Z.DB.getUserById(contentOwnerId);
                if (!contentOwner) return false;

                if (contentOwner.id === currentUser.id) {
                    Z.showToast('You cannot earn rewards from your own content or profile.');
                    return false;
                }

                // Anti-Duplicate Protection (BUG #4, #5, #6, #7, #8 FIX)
                if (!currentUser.interactionHistory) currentUser.interactionHistory = {};
                const actionKey = `${interactionType}_${targetId || contentOwnerId}`;
                if (currentUser.interactionHistory[actionKey]) {
                    Z.showToast(`You have already received a reward for this ${interactionType}.`);
                    return false;
                }

                // Creator Bounty Calculation & Bounds ($0.00 to $0.05)
                const bountySettings = contentOwner.bountySettings || { like: 0.01, share: 0.03, follow: 0.03, subscribe: 0.02, circleJoin: 0.03 };
                let rewardAmount = bountySettings[interactionType] || 0.01;
                if (rewardAmount > 0.05) rewardAmount = 0.05;

                if (!contentOwner.wallet) contentOwner.wallet = { cash: 0.00, bounty: 0.00, totalEarned: 0.00 };
                if (contentOwner.wallet.bounty < rewardAmount) {
                    Z.showToast('Creator bounty balance is insufficient for this reward.');
                    return false;
                }

                // Deduct Creator Bounty
                contentOwner.wallet.bounty -= rewardAmount;
                if (!contentOwner.bountySpentHistory) contentOwner.bountySpentHistory = [];
                contentOwner.bountySpentHistory.unshift({
                    id: 'bspend_' + Date.now(),
                    date: new Date().toISOString(),
                    recipient: currentUser.name,
                    action: interactionType,
                    amount: rewardAmount
                });

                // Update Interaction Real Data Counters (BUG #4, #5, #6, #8 FIX)
                if (interactionType === 'like') {
                    const post = Z.DB.getPosts().find(p => p.id === targetId);
                    if (post) {
                        if (!post.reactions) post.reactions = { heart: 0 };
                        post.reactions.heart++;
                        Z.DB.savePosts();
                    }
                } else if (interactionType === 'share') {
                    const post = Z.DB.getPosts().find(p => p.id === targetId);
                    if (post) {
                        post.shares = (post.shares || 0) + 1;
                        Z.DB.savePosts();
                    }
                } else if (interactionType === 'spark_like') {
                    const spark = Z.DB.getSparks().find(s => s.id === targetId);
                    if (spark) {
                        spark.likes = (spark.likes || 0) + 1;
                        Z.DB.saveSparks();
                    }
                } else if (interactionType === 'follow') {
                    contentOwner.followers = (contentOwner.followers || 0) + 1;
                    if (!currentUser.following) currentUser.following = [];
                    if (!currentUser.following.includes(contentOwner.id)) currentUser.following.push(contentOwner.id);
                }

                // Record Interaction Key & Increment Daily Limit Counter
                currentUser.interactionHistory[actionKey] = new Date().toISOString();
                currentUser.dailyTracker.count++;

                Z.DB.saveUsers();
                this.creditReward(currentUser, rewardAmount, `${interactionType.toUpperCase()} Reward`);
                
                // Refresh View if active
                if (['home', 'spark', 'people', 'circles'].includes(Z.State.currentView)) {
                    Z.showView(Z.State.currentView);
                }
                return true;
            }
        };

        Z.triggerRewardAnimation = function(amount) {
            const walletEl = document.querySelector('header');
            if (walletEl) {
                walletEl.classList.add('wallet-pulse');
                setTimeout(() => walletEl.classList.remove('wallet-pulse'), 500);
            }
            const floatingNote = document.createElement('div');
            floatingNote.className = 'fixed z-50 text-emerald-400 font-black text-2xl dollar-note-pure pointer-events-none flex items-center space-x-1';
            floatingNote.style.right = '50px';
            floatingNote.style.top = '70px';
            floatingNote.innerHTML = `<i class="fa-solid fa-money-bill-wave text-emerald-400 drop-shadow-[0_4px_12px_rgba(16,185,129,0.8)]"></i><span class="text-xs font-bold text-emerald-300 drop-shadow">+$${amount.toFixed(2)}</span>`;
            document.body.appendChild(floatingNote);
            setTimeout(() => floatingNote.remove(), 1200);
        };

        Z.showToast = function(message) {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = 'bg-slate-900/95 border border-emerald-500/40 text-slate-100 px-4 py-2.5 rounded-xl text-xs shadow-2xl flex items-center space-x-2.5 pointer-events-auto transition transform translate-y-4 opacity-0 max-w-md w-full backdrop-blur-md';
            toast.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400 text-sm shrink-0"></i><span class="font-medium">${Z.escapeHtml(message)}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-4', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'transition', 'duration-300');
                setTimeout(() => toast.remove(), 300);
            }, 3200);
        };

        // Unified Data Layer (BUG #24 & Single Source of Truth FIX)
        Z.DB = {
            getUsers: function() {
                const data = localStorage.getItem('zynix_users');
                if (!data) return Z.SeedData.users;
                return JSON.parse(data);
            },
            getUserById: function(id) {
                const users = this.getUsers();
                return users.find(u => u.id === id) || null;
            },
            saveUsers: function(usersArray) {
                if (usersArray) {
                    localStorage.setItem('zynix_users', JSON.stringify(usersArray));
                } else {
                    // Update state if current user exists in array
                    const currentUsers = this.getUsers();
                    if (Z.State.currentUser) {
                        const idx = currentUsers.findIndex(u => u.id === Z.State.currentUser.id);
                        if (idx !== -1) {
                            currentUsers[idx] = Z.State.currentUser;
                        }
                    }
                    localStorage.setItem('zynix_users', JSON.stringify(currentUsers));
                }
                // Sync current state
                if (Z.State.currentUser) {
                    const fresh = this.getUserById(Z.State.currentUser.id);
                    if (fresh) Z.State.currentUser = fresh;
                }
            },
            getCurrentUser: function() {
                const id = localStorage.getItem('zynix_current_user_id');
                if (!id) return null; // No default forced login (BUG #25 FIX)
                return this.getUserById(id);
            },
            setCurrentUser: function(user) {
                if (user) {
                    localStorage.setItem('zynix_current_user_id', user.id);
                    Z.State.currentUser = user;
                } else {
                    localStorage.removeItem('zynix_current_user_id');
                    Z.State.currentUser = null;
                }
                Z.renderHeaderAuth();
                Z.updateHeaderWallet();
            },
            getPosts: function() {
                const data = localStorage.getItem('zynix_posts');
                if (!data) return Z.SeedData.posts;
                return JSON.parse(data);
            },
            savePosts: function(posts) {
                localStorage.setItem('zynix_posts', JSON.stringify(posts));
            },
            getSparks: function() {
                const data = localStorage.getItem('zynix_sparks');
                if (!data) return Z.SeedData.sparks;
                return JSON.parse(data);
            },
            saveSparks: function(sparks) {
                localStorage.setItem('zynix_sparks', JSON.stringify(sparks));
            },
            getStatuses: function() {
                const data = localStorage.getItem('zynix_statuses');
                let list = data ? JSON.parse(data) : Z.SeedData.statuses;
                // 24-Hour Expiry Logic Filter (BUG #10 FIX)
                const now = Date.now();
                return list.filter(st => !st.timestamp || (now - st.timestamp < 86400000));
            },
            saveStatuses: function(statuses) {
                localStorage.setItem('zynix_statuses', JSON.stringify(statuses));
            },
            getCircles: function() {
                const data = localStorage.getItem('zynix_circles');
                if (!data) return Z.SeedData.circles;
                return JSON.parse(data);
            },
            saveCircles: function(circles) {
                localStorage.setItem('zynix_circles', JSON.stringify(circles));
            }
        };

        Z.handleAuthSubmit = function(mode) {
            const emailInput = document.getElementById('auth-email');
            const passInput = document.getElementById('auth-password');
            if (!emailInput || !passInput) return;

            const email = emailInput.value.trim();
            const pass = passInput.value.trim();

            if (!email || !pass) {
                Z.showToast('Please enter required details.');
                return;
            }

            const users = Z.DB.getUsers();

            if (mode === 'login') {
                const found = users.find(u => (u.email === email || u.username === email) && u.password === pass);
                if (found) {
                    Z.DB.setCurrentUser(found);
                    Z.closeModal();
                    Z.showToast(`Welcome back, ${found.name}!`);
                    Z.showView(Z.State.currentView);
                } else {
                    Z.showToast('Invalid credentials. Try quick demo login!');
                }
            } else {
                const nameInput = document.getElementById('auth-name');
                const name = nameInput ? nameInput.value.trim() : 'New Creator';
                const newUser = {
                    id: 'usr_' + Date.now(),
                    name: name,
                    username: email.split('@')[0] || 'user_' + Date.now(),
                    profession: 'Creator',
                    bio: 'Passionate ZYNIX ecosystem member.',
                    role: 'Creator',
                    avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80',
                    cover: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=800&q=80',
                    followers: 0,
                    package: 'Free',
                    bountySettings: { like: 0.01, share: 0.02, follow: 0.02, subscribe: 0.01, circleJoin: 0.02 },
                    wallet: { cash: 0.00, bounty: 0.00, totalEarned: 0.00 },
                    walletTransactions: [],
                    bountySpentHistory: [],
                    referrals: { code: 'ZYNIX-' + Math.random().toString(36).substring(2, 7).toUpperCase(), earnings: 0, referredBy: null },
                    email: email,
                    password: pass,
                    interactionHistory: {}
                };
                users.push(newUser);
                Z.DB.saveUsers(users);
                Z.DB.setCurrentUser(newUser);
                Z.closeModal();
                Z.showToast(`Account created! Welcome ${newUser.name}.`);
                Z.showView(Z.State.currentView);
            }
        };

        Z.quickDemoLogin = function(userId) {
            const user = Z.DB.getUserById(userId);
            if (user) {
                Z.DB.setCurrentUser(user);
                Z.closeModal();
                Z.showToast(`Logged in as ${user.name}`);
                Z.showView(Z.State.currentView);

            Z.DB.setCurrentUser(null);

        };

        Z.closeModal = function() {
            const container = document.getElementById('modal-container');
            if (container) container.innerHTML = '';
        };

        Z.showView = function(viewName) {
            Z.State.currentView = viewName;
            const container = document.getElementById('app-container');
            if (!container) return;

            ['home', 'spark', 'circles', 'people', 'profile'].forEach(nav => {
                const btn = document.getElementById(`nav-btn-${nav}`);
                if (btn) {
                    if (nav === viewName) {
                        btn.className = 'flex flex-col items-center justify-center text-emerald-400 font-bold transition w-1/6 py-1';
                    } else {
                        btn.className = 'flex flex-col items-center justify-center text-slate-400 hover:text-emerald-400 transition w-1/6 py-1';
                    }
                }
            });

            switch(viewName) {
                case 'home': Z.renderHomeView(container); break;
                case 'spark': Z.renderSparkView(container); break;
                case 'circles': Z.renderCirclesView(container); break;
                case 'people': Z.renderPeopleView(container); break;
                case 'profile': Z.renderProfileView(container); break;
                case 'wallet': Z.renderWalletView(container); break;
                case 'admin-wall': Z.renderAdminWallView(container); break;
                default: Z.renderHomeView(container);
            }
        };

            const user = Z.State.currentUser;
            if (!user) {
                container.innerHTML = `<div class="text-center py-12 text-slate-400 text-xs">Please login to access your Wallet.</div>`;
                return;
            }

            const wallet = user.wallet || { cash: 0, bounty: 0, totalEarned: 0 };
            container.innerHTML = `
                <div class="space-y-4">
                    <h2 class="text-base font-bold text-white">ZYNIX Wallet & Rewards</h2>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-[#111827] border border-emerald-500/30 rounded-2xl p-4 shadow-lg">
                            <span class="text-[10px] text-slate-400 uppercase tracking-wider block font-bold">Cash Balance</span>
                            <span class="text-xl font-black text-emerald-400">$${wallet.cash.toFixed(2)}</span>
                        </div>
                        <div class="bg-[#111827] border border-blue-500/30 rounded-2xl p-4 shadow-lg">
                            <span class="text-[10px] text-slate-400 uppercase tracking-wider block font-bold">Bounty Balance</span>
                            <span class="text-xl font-black text-blue-400">$${wallet.bounty.toFixed(2)}</span>
                        </div>
                    </div>

                    <div class="bg-[#111827] border border-slate-800 rounded-2xl p-4 flex justify-between items-center shadow-lg">
                        <div>
                            <span class="text-xs font-bold text-white block">Active Package: ${Z.escapeHtml(user.package || 'Free')}</span>
                            <span class="text-[10px] text-slate-400">Total Earned: $${wallet.totalEarned.toFixed(2)}</span>
                        </div>
                        <button onclick="Z.openUpgradePackageModal()" class="bg-gradient-to-r from-emerald-500 to-blue-600 text-black font-bold text-xs px-3.5 py-2 rounded-xl">
                            Upgrade
                        </button>
                    </div>

                    <div class="bg-[#111827] border border-slate-800 rounded-2xl p-4 space-y-2 shadow-lg">
                        <h4 class="text-xs font-bold text-white mb-2">Recent Transactions</h4>
                        ${(user.walletTransactions || []).length === 0 ? `<p class="text-[11px] text-slate-500">No transactions recorded yet.</p>` : 
                            (user.walletTransactions || []).map(tx => `
                                <div class="flex justify-between items-center text-xs py-1.5 border-b border-slate-800/60">
                                    <div>
                                        <span class="text-slate-200 font-semibold block">${Z.escapeHtml(tx.type)}</span>
                                        <span class="text-[9px] text-slate-500">${new Date(tx.date).toLocaleString()}</span>
                                    </div>
                                    <span class="text-emerald-400 font-bold">+$${tx.amount.toFixed(3)}</span>
                                </div>
                            `).join('')
                        }
                    </div>
                </div>
            `;
        };

        Z.renderAdminWallView = function(container) {
            container.innerHTML = `
                <div class="space-y-4">
                    <div class="bg-gradient-to-r from-emerald-900/40 via-blue-900/40 to-purple-900/40 border border-emerald-500/30 rounded-2xl p-5 shadow-2xl space-y-2">

                            <i class="fa-solid fa-shield-halved text-emerald-400"></i>
                            <span>ZYNIX Ecosystem Wall</span>
                        </h2>
                        <p class="text-xs text-slate-300 leading-relaxed">Official platform status, system rules verification, and real-time network transparency dashboard.</p>
                    </div>

                    <div class="grid grid-cols-3 gap-2 text-center">
                        <div class="bg-[#111827] border border-slate-800 p-3 rounded-xl">
                            <span class="text-lg font-bold text-emerald-400 block">60%</span>
                            <span class="text-[9px] text-slate-400 font-medium">Cash Split</span>
                        </div>
                        <div class="bg-[#111827] border border-slate-800 p-3 rounded-xl">
                            <span class="text-lg font-bold text-blue-400 block">40%</span>
                            <span class="text-[9px] text-slate-400 font-medium">Bounty Split</span>
                        </div>
                        <div class="bg-[#111827] border border-slate-800 p-3 rounded-xl">
                            <span class="text-lg font-bold text-amber-400 block">$0.05</span>

                    </div>

            `;
        };

        // --- CREATION MODALS & ACTIONS --- //

        Z.openCreateSelectionModal = function() {
            if (!Z.State.currentUser) { Z.openAuthModal('login'); return; }
            const modal = document.getElementById('modal-container');
            modal.innerHTML = `
                <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                    <div class="bg-[#111827] border border-slate-800 rounded-2xl w-full max-w-sm p-5 space-y-3 shadow-2xl">
                        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                            <h3 class="font-bold text-sm text-white">Create Content</h3>
                            <button onclick="Z.closeModal()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <button onclick="Z.openCreatePostModal()" class="w-full bg-slate-900 border border-slate-800 hover:border-emerald-500 p-3 rounded-xl text-left flex items-center space-x-3 transition">
                            <i class="fa-solid fa-pen-to-square text-emerald-400 text-base"></i>
                            <div>
                                <span class="text-xs font-bold text-white block">Create Post</span>
                                <span class="text-[10px] text-slate-400">Share text or images</span>
                            </div>
                        </button>
                        <button onclick="Z.openCreateSparkModal()" class="w-full bg-slate-900 border border-slate-800 hover:border-amber-500 p-3 rounded-xl text-left flex items-center space-x-3 transition">
                            <i class="fa-solid fa-bolt text-amber-400 text-base"></i>
                            <div>
                                <span class="text-xs font-bold text-white block">Post Spark</span>
                                <span class="text-[10px] text-slate-400">Short video clip</span>
                            </div>
                        </button>
                    </div>
                </div>
            `;
        };

        Z.openCreatePostModal = function() {
            const modal = document.getElementById('modal-container');
            modal.innerHTML = `
                <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                    <div class="bg-[#111827] border border-slate-800 rounded-2xl w-full max-w-md p-5 space-y-4 shadow-2xl">
                        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                            <h3 class="font-bold text-sm text-white">New Post</h3>
                            <button onclick="Z.closeModal()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <textarea id="post-text" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-emerald-500" placeholder="What is on your mind?"></textarea>
                        <input type="text" id="post-media" placeholder="Image URL (optional)" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
                        <button onclick="Z.submitPost()" class="w-full bg-emerald-600 font-bold text-black text-xs py-2.5 rounded-xl">Publish Post</button>
                    </div>
                </div>
            `;
        };

        Z.submitPost = function() {
            const text = document.getElementById('post-text').value.trim();
            const media = document.getElementById('post-media').value.trim();
            if (!text) { Z.showToast('Post content cannot be empty.'); return; }
            const posts = Z.DB.getPosts();
            posts.unshift({
                id: 'post_' + Date.now(),
                authorId: Z.State.currentUser.id,
                content: text,
                media: media,
                createdAt: 'Just now',
                reactions: { heart: 0, like: 0 },
                comments: [],
                shares: 0
            });
            Z.DB.savePosts(posts);
            Z.closeModal();
            Z.showToast('Post published successfully!');
            Z.showView('home');
        };

        Z.openCreateSparkModal = function() {
            const modal = document.getElementById('modal-container');
            modal.innerHTML = `
                <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                    <div class="bg-[#111827] border border-slate-800 rounded-2xl w-full max-w-md p-5 space-y-4 shadow-2xl">
                        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                            <h3 class="font-bold text-sm text-white">New Spark Video</h3>
                            <button onclick="Z.closeModal()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <input type="text" id="spark-caption" placeholder="Caption & Hashtags" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
                        <input type="text" id="spark-video" placeholder="Video MP4 URL" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
                        <button onclick="Z.submitSpark()" class="w-full bg-amber-500 font-bold text-black text-xs py-2.5 rounded-xl">Publish Spark</button>
                    </div>
                </div>
            `;
        };

        Z.submitSpark = function() {
            const caption = document.getElementById('spark-caption').value.trim();
            const videoUrl = document.getElementById('spark-video').value.trim();
            if (!videoUrl) { Z.showToast('Please enter a valid video URL.'); return; }
            const sparks = Z.DB.getSparks();
            sparks.unshift({
                id: 'spark_' + Date.now(),
                authorId: Z.State.currentUser.id,
                caption: caption,
                videoUrl: videoUrl,
                likes: 0,
                tags: ['zynix'],
                comments: [],
                shares: 0
            });
            Z.DB.saveSparks(sparks);
            Z.closeModal();
            Z.showToast('Spark video published!');
            Z.showView('spark');
        };

        Z.openCreateStatusModal = function() {
            const modal = document.getElementById('modal-container');
            modal.innerHTML = `
                <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                    <div class="bg-[#111827] border border-slate-800 rounded-2xl w-full max-w-sm p-5 space-y-3 shadow-2xl">
                        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                            <h3 class="font-bold text-sm text-white">Add Status (24h)</h3>
                            <button onclick="Z.closeModal()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <input type="text" id="status-text" placeholder="Short status note..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
                        <button onclick="Z.submitStatus()" class="w-full bg-emerald-600 font-bold text-black text-xs py-2 rounded-xl">Add Status</button>
                    </div>
                </div>
            `;
        };

        Z.submitStatus = function() {
            const text = document.getElementById('status-text').value.trim();
            if (!text) return;
            const statuses = Z.DB.getStatuses();
            statuses.unshift({
                id: 'st_' + Date.now(),
                authorId: Z.State.currentUser.id,
                content: text,
                timestamp: Date.now(),
                createdAt: 'Just now'
            });
            Z.DB.saveStatuses(statuses);
            Z.closeModal();
            Z.showToast('Status posted!');
            Z.showView('home');
        };

        Z.openCreateCircleModal = function() {
            const modal = document.getElementById('modal-container');
            modal.innerHTML = `
                <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                    <div class="bg-[#111827] border border-slate-800 rounded-2xl w-full max-w-md p-5 space-y-3 shadow-2xl">
                        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                            <h3 class="font-bold text-sm text-white">Create Circle</h3>
                            <button onclick="Z.closeModal()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <input type="text" id="circle-name" placeholder="Circle Name" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
                        <input type="text" id="circle-desc" placeholder="Circle Description" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
                        <button onclick="Z.submitCircle()" class="w-full bg-emerald-600 font-bold text-black text-xs py-2 rounded-xl">Launch Circle</button>
                    </div>
                </div>
            `;
        };

        Z.submitCircle = function() {
            const name = document.getElementById('circle-name').value.trim();
            const desc = document.getElementById('circle-desc').value.trim();
            if (!name) return;
            const circles = Z.DB.getCircles();
            circles.unshift({
                id: 'cir_' + Date.now(),
                name: name,
                description: desc,
                membersCount: 1,
                creatorId: Z.State.currentUser.id,
                avatar: 'https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=150',
                category: 'General'
            });
            Z.DB.saveCircles(circles);
            Z.closeModal();
            Z.showToast('Circle created!');
            Z.showView('circles');
        };

        Z.openUpgradePackageModal = function() {
            const modal = document.getElementById('modal-container');
            modal.innerHTML = `
                <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                    <div class="bg-[#111827] border border-slate-800 rounded-2xl w-full max-w-md p-5 space-y-4 shadow-2xl max-h-[85vh] overflow-y-auto">
                        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                            <h3 class="font-bold text-sm text-white">Upgrade Package Tiers</h3>
                            <button onclick="Z.closeModal()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <div class="space-y-2">
                            ${Object.keys(Z.Packages).map(pName => {
                                const pkg = Z.Packages[pName];
                                return `
                                    <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 flex justify-between items-center">
                                        <div>
                                            <span class="text-xs font-bold text-white block">${pkg.name}</span>
                                            <span class="text-[10px] text-slate-400">Limit: ${pkg.dailyLimit}/day</span>
                                        </div>
                                        <button onclick="Z.submitPackageUpgrade('${pkg.name}')" class="bg-emerald-600 hover:bg-emerald-500 text-black font-bold text-xs px-3 py-1.5 rounded-lg">
                                            Select
                                        </button>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        };

        Z.submitPackageUpgrade = function(pkgName) {
            const user = Z.State.currentUser;
            if (!user) return;
            user.package = pkgName;
            Z.DB.saveUsers();
            Z.closeModal();
            Z.showToast(`Package upgraded to ${pkgName}!`);
            Z.showView('wallet');
        };

        Z.openAiModal = function() {
            const modal = document.getElementById('modal-container');
            modal.innerHTML = `
                <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                    <div class="bg-[#111827] border border-slate-800 rounded-2xl w-full max-w-md p-5 space-y-4 shadow-2xl">
                        <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                            <h3 class="font-bold text-sm text-emerald-400 flex items-center space-x-2">
                                <i class="fa-solid fa-wand-magic-sparkles"></i>
                                <span>ZYNIX AI Ecosystem Guide</span>
                            </h3>
                            <button onclick="Z.closeModal()" class="text-slate-400"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                        <div class="space-y-2 text-xs text-slate-300 leading-relaxed">
                            <p>• <strong>60/40 Split Rule:</strong> Every reward earned is split automatically into 60% Cash Balance & 40% Bounty Balance.</p>
                            <p>• <strong>Package Rules:</strong> Upgrade your package from Wallet to increase your daily interaction limit.</p>
                            <p>• <strong>Bounty Caps:</strong> Creators can offer up to $0.05 per like/share from their bounty pool.</p>
                        </div>
                        <button onclick="Z.closeModal()" class="w-full bg-slate-800 text-white font-bold text-xs py-2 rounded-xl">Got it!</button>
                    </div>
                </div>
            `;
        };
    </script>

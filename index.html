<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ZYNIX - Complete Social Platform</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#090d16;color:#f8fafc;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding-bottom:80px;overflow-x:hidden}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:#090d16}
::-webkit-scrollbar-thumb{background:#1e293b;border-radius:4px}
.zynix-header{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(9,13,22,.92);backdrop-filter:blur(12px);border-bottom:1px solid #1e293b;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;min-height:56px}
.header-logo{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#10b981,#3b82f6);display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;font-size:14px}
.header-title{font-size:18px;font-weight:900;background:linear-gradient(90deg,#10b981,#3b82f6,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
.header-btn{background:transparent;border:none;color:#3b82f6;cursor:pointer;padding:6px;position:relative;transition:color .2s}
.header-btn.active{color:#10b981}
.header-btn:hover{color:#10b981}
.wallet-pill{background:rgba(15,23,42,.9);border:1px solid #1e293b;border-radius:20px;padding:4px 10px;font-size:10px;display:flex;align-items:center;gap:6px;transition:box-shadow .3s, border-color .2s;position:relative;cursor:pointer}
.wallet-pill.active{border-color:#10b981;color:#10b981}
.wallet-pill.pulse{box-shadow:0 0 24px rgba(16,185,129,.6)}
.wallet-pill .wallet-badge{position:absolute;top:-6px;right:-6px;background:#3b82f6;color:#fff;font-size:9px;font-weight:900;min-width:16px;height:16px;border-radius:8px;padding:0 4px;display:none;align-items:center;justify-content:center;box-shadow:0 0 8px rgba(59,130,246,.6);z-index:2}
.zynix-footer{position:fixed;bottom:0;left:0;right:0;z-index:1000;background:rgba(9,13,22,.95);backdrop-filter:blur(12px);border-top:1px solid #1e293b;padding:8px 0;display:flex;align-items:center;justify-content:space-around;max-width:600px;margin:0 auto}
.zynix-footer button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 0;color:#64748b;transition:color .2s;background:transparent;border:none;font-size:9px;cursor:pointer;font-weight:500}
.zynix-footer button i{font-size:18px;margin-bottom:2px}
.zynix-footer button:hover,.zynix-footer button.active{color:#10b981}
.zynix-footer .create-btn{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#10b981,#3b82f6);color:#000;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:-16px;box-shadow:0 4px 20px rgba(16,185,129,.3);flex:none}
.zynix-footer .create-btn i{font-size:20px;margin:0}
#app-container{max-width:600px;margin:0 auto;padding:76px 14px 20px;min-height:calc(100vh - 80px)}
.status-row-wrap{background:#111827;border:1px solid #1e293b;border-radius:16px;padding:12px;margin-bottom:14px}
.status-scroll{display:flex;gap:10px;overflow-x:auto;padding:4px 0;scrollbar-width:none;-ms-overflow-style:none}
.status-scroll::-webkit-scrollbar{display:none}
.status-item{flex-shrink:0;width:68px;text-align:center;background:transparent;border:none;cursor:pointer;padding:0}
.status-ring-unseen{background:linear-gradient(135deg,#10b981,#3b82f6,#8b5cf6);padding:3px;border-radius:50%;width:58px;height:58px;margin:0 auto}
.status-ring-seen{background:#1e293b;padding:3px;border-radius:50%;width:58px;height:58px;margin:0 auto}
.status-ring-inner{width:100%;height:100%;border-radius:50%;background:#090d16;padding:2px}
.status-ring-inner img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.status-label{font-size:9px;font-weight:600;color:#94a3b8;display:block;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.status-home-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:8px 0}
.status-home-card{text-align:center;background:transparent;border:none;cursor:pointer;padding:8px 4px;border-radius:12px}
.status-home-card:hover{background:#111827}
.status-home-ring-unseen{background:linear-gradient(135deg,#10b981,#3b82f6,#8b5cf6);padding:4px;border-radius:50%;width:88px;height:88px;margin:0 auto}
.status-home-ring-seen{background:#1e293b;padding:4px;border-radius:50%;width:88px;height:88px;margin:0 auto}
.status-home-ring-inner{width:100%;height:100%;border-radius:50%;background:#090d16;padding:3px}
.status-home-ring-inner img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.status-home-name{font-size:11px;font-weight:600;color:#e2e8f0;display:block;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status-home-count{font-size:9px;color:#64748b;display:block;margin-top:2px}
.status-bg-deep-blue{background:linear-gradient(135deg,#1e3a8a,#312e81);color:#fff}
.status-bg-navy{background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff}
.status-bg-purple{background:linear-gradient(135deg,#4c1d95,#5b21b6);color:#fff}
.status-bg-teal{background:linear-gradient(135deg,#0d9488,#0f766e);color:#fff}
.status-bg-green{background:linear-gradient(135deg,#065f46,#047857);color:#fff}
.status-bg-burgundy{background:linear-gradient(135deg,#7f1d1d,#991b1b);color:#fff}
.status-bg-rose{background:linear-gradient(135deg,#9f1239,#be123c);color:#fff}
.status-bg-plum{background:linear-gradient(135deg,#581c87,#701a75);color:#fff}
.status-bg-slate{background:linear-gradient(135deg,#334155,#475569);color:#fff}
.status-viewer-overlay{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.98);display:flex;flex-direction:column;color:#fff}
.status-viewer-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.05);flex-shrink:0}
.status-viewer-body{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0;overflow:hidden;touch-action:none}
.status-stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#000;height:clamp(320px,58vh,620px);position:relative;border-radius:12px;overflow:hidden}
.status-stage img,.status-stage video{width:100%;height:100%;object-fit:contain;max-width:100%;max-height:100%}
.status-nav-btn{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1);color:#fff;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;z-index:10}
.status-nav-btn.left{left:10px}
.status-nav-btn.right{right:10px}
.status-viewer-footer{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid rgba(255,255,255,.05);flex-shrink:0;height:68px}
.status-viewer-footer button{padding:8px 20px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#fff;font-size:12px;cursor:pointer;font-weight:600}
.status-progress-bar{position:absolute;top:0;left:0;height:3px;background:#10b981;z-index:20;transition:width .1s linear}
.status-progress-track{position:absolute;top:0;left:0;right:0;height:3px;background:rgba(255,255,255,.1);z-index:19}
.circle-x-btn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.circle-x-btn:hover{background:rgba(239,68,68,.25);border-color:rgba(239,68,68,.5);color:#fca5a5}
.colored-back-btn{background:#10b981;color:#000;border:none;padding:8px 16px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.post-card{background:#111827;border:1px solid #1e293b;border-radius:16px;padding:14px;margin-bottom:12px;position:relative}
.post-author{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.post-author img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:1px solid #1e293b}
.post-author .pname{font-weight:700;font-size:13px;color:#fff}
.post-author .phandle{font-size:10px;color:#64748b}
.post-content{font-size:13px;color:#e2e8f0;line-height:1.6;margin-bottom:10px;white-space:pre-wrap;word-break:break-word}
.post-media{border-radius:12px;overflow:hidden;margin-bottom:10px;background:#000}
.post-media img{width:100%;max-height:400px;object-fit:cover;display:block}
.post-media video{width:100%;max-height:400px;object-fit:contain;display:block;background:#000}
.post-reactions{display:flex;flex-wrap:wrap;gap:4px;padding:8px 0;border-top:1px solid #1e293b;align-items:center;min-height:44px}
.react-btn{padding:4px 8px;border-radius:14px;font-size:14px;background:transparent;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:3px;color:#fff;transition:all .15s}
.react-btn:hover{background:#1e293b}
.react-btn.active{background:rgba(16,185,129,.15);border-color:rgba(16,185,129,.3);cursor:default}
.react-btn.active:hover{background:rgba(16,185,129,.15)}
.react-btn.disabled-reaction{opacity:.35;cursor:not-allowed}
.react-btn.disabled-reaction:hover{background:transparent}
.react-btn.frozen-reaction{cursor:pointer;opacity:.55}
.react-btn.frozen-reaction:hover{background:#1e293b;opacity:.85}
.react-btn .count{font-size:10px;color:#64748b;font-weight:700;line-height:1}
.react-btn.active .count{color:#10b981}
.react-btn .bounty{font-size:9px;color:#10b981;font-weight:700;line-height:1;margin-left:1px}
.react-star{filter:drop-shadow(0 0 6px rgba(96,165,250,.9)) drop-shadow(0 0 12px rgba(147,197,253,.5))}
.post-actions{display:flex;gap:16px;padding-top:8px;border-top:1px solid #1e293b;font-size:12px;color:#64748b}
.post-actions button{background:transparent;border:none;color:#64748b;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:4px;padding:4px 0}
.post-actions button:hover{color:#e2e8f0}
.post-actions button.saved{color:#f59e0b}
.post-menu-wrap{position:relative;margin-left:auto}
.post-menu-btn{background:transparent;border:none;color:#94a3b8;font-size:18px;cursor:pointer;padding:4px 8px;border-radius:6px;line-height:1}
.post-menu-btn:hover{background:#1e293b;color:#fff}
.post-menu{position:absolute;top:100%;right:0;background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:6px;min-width:210px;z-index:60;box-shadow:0 8px 32px rgba(0,0,0,.7);display:none}
.post-menu.open{display:block}
.post-menu button{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:none;color:#e2e8f0;padding:10px 12px;border-radius:8px;font-size:12px;cursor:pointer;text-align:left}
.post-menu button:hover{background:#1e293b}
.post-menu button.danger{color:#fca5a5}
.post-menu button i{width:14px;text-align:center;font-size:12px}
.post-menu .divider{height:1px;background:#1e293b;margin:4px 0}
.freeze-dot{position:relative;width:18px;height:18px;border-radius:50%;flex-shrink:0;margin-left:auto;cursor:pointer;padding:0;transition:all .2s ease;border:1.5px solid rgba(255,255,255,.25);background:#3b82f6;box-shadow:0 0 8px rgba(59,130,246,.55)}
.freeze-dot.unfrozen{background:#10b981;box-shadow:0 0 8px rgba(16,185,129,.65);border-color:rgba(16,185,129,.55)}
.freeze-dot:hover{transform:scale(1.2)}
.freeze-dot:active{transform:scale(.9)}
.freeze-dot.lg{width:24px;height:24px;margin-left:0}
.freeze-dot.readonly{cursor:default;opacity:.9}
.freeze-dot.readonly:hover{transform:none}
.freeze-dot.blink{animation:freezeBlink .35s ease 3}
@keyframes freezeBlink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(1.35)}}
.freeze-dot::after{content:attr(data-tip);position:absolute;right:calc(100% + 8px);top:50%;transform:translateY(-50%);background:rgba(15,23,42,.96);color:#f8fafc;font-size:10px;font-weight:700;padding:4px 8px;border-radius:6px;white-space:nowrap;border:1px solid #1e293b;opacity:0;pointer-events:none;transition:opacity .15s;z-index:100}
.freeze-dot:hover::after{opacity:1}
.freeze-tooltip-top{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:rgba(15,23,42,.98);color:#fca5a5;font-size:10px;font-weight:700;padding:5px 10px;border-radius:8px;white-space:nowrap;border:1px solid rgba(239,68,68,.5);box-shadow:0 4px 14px rgba(0,0,0,.6);z-index:200;pointer-events:none;animation:freezeTipFade 2s ease forwards}
.freeze-tooltip-top::after{content:'';position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:rgba(15,23,42,.98)}
@keyframes freezeTipFade{0%{opacity:0;transform:translateX(-50%) translateY(4px)}15%{opacity:1;transform:translateX(-50%) translateY(0)}85%{opacity:1;transform:translateX(-50%) translateY(0)}100%{opacity:0;transform:translateX(-50%) translateY(-4px)}}
.post-comments{margin-top:10px;padding-top:10px;border-top:1px solid #1e293b;display:none}
.post-comments.open{display:block}
.comment-item{padding:10px 12px;border-radius:12px;margin-bottom:6px;font-size:12px;word-break:break-word;position:relative}
.comment-item.light-green{background:#dcfce7;color:#052e16}
.comment-item.light-blue{background:#dbeafe;color:#172554}
.comment-item.light-yellow{background:#fef3c7;color:#451a03}
.comment-item.light-pink{background:#fce7f3;color:#500724}
.comment-item.light-purple{background:#ede9fe;color:#2e1065}
.comment-item.hidden-comment{opacity:.55;font-style:italic;border:1px dashed rgba(0,0,0,.2)}
.comment-item .cname{font-weight:700;margin-right:6px;opacity:.9}
.comment-item .ctext{white-space:pre-wrap}
.comment-reactions{display:flex;flex-wrap:wrap;gap:2px;margin-top:6px;align-items:center}
.comment-react{background:rgba(0,0,0,.06);border:none;padding:2px 6px;border-radius:10px;font-size:11px;cursor:pointer;display:inline-flex;align-items:center;gap:2px;color:inherit;opacity:.75}
.comment-react:hover{opacity:1}
.comment-react.active{background:rgba(16,185,129,.25);opacity:1;font-weight:700;cursor:default}
.comment-react.disabled-reaction{opacity:.35;cursor:not-allowed}
.comment-react.frozen-reaction{cursor:pointer;opacity:.55}
.comment-react .cb{font-size:8px;color:#059669;font-weight:700}
.comment-actions{display:flex;gap:12px;margin-top:4px;font-size:10px;opacity:.75;align-items:center;flex-wrap:wrap}
.comment-actions button{background:transparent;border:none;color:inherit;cursor:pointer;font-size:10px;padding:0;font-weight:600;text-decoration:underline;opacity:.85}
.comment-actions button:hover{opacity:1}
.comment-replies{margin-top:6px;padding-left:10px;border-left:2px solid rgba(0,0,0,.15)}
.comment-replies .comment-item{padding:8px 10px;font-size:11px;margin-bottom:6px}
.comment-replies .comment-replies{padding-left:8px}
.comment-color-picker{display:flex;gap:6px;margin-top:6px;margin-bottom:4px}
.comment-color-dot{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.comment-color-dot.selected{border-color:#10b981}
.comment-color-dot.c-green{background:#dcfce7}
.comment-color-dot.c-blue{background:#dbeafe}
.comment-color-dot.c-yellow{background:#fef3c7}
.comment-color-dot.c-pink{background:#fce7f3}
.comment-color-dot.c-purple{background:#ede9fe}
.comment-input-wrap{display:flex;gap:8px;margin-top:8px;align-items:flex-end}
.comment-input-wrap textarea{flex:1;background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:10px 12px;font-size:12px;color:#fff;outline:none;resize:none;max-height:150px;font-family:inherit;min-height:38px}
.comment-input-wrap textarea:focus{border-color:#10b981}
.comment-input-wrap button{background:#10b981;border:none;color:#000;font-weight:700;padding:8px 16px;border-radius:8px;font-size:11px;cursor:pointer;height:38px}
.reply-editor{margin-top:6px;display:flex;gap:6px;align-items:flex-end}
.reply-editor textarea{flex:1;background:rgba(15,23,42,.9);border:1px solid #1e293b;border-radius:8px;padding:8px 10px;font-size:11px;color:#fff;outline:none;resize:none;max-height:100px;font-family:inherit;min-height:34px}
.reply-editor textarea:focus{border-color:#10b981}
.reply-editor button{padding:8px 12px;border-radius:8px;border:none;font-size:11px;font-weight:700;cursor:pointer;height:34px}
.reply-editor .save{background:#10b981;color:#000}
.reply-editor .cancel{background:transparent;color:#64748b}
.modal-overlay{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:#111827;border:1px solid #1e293b;border-radius:16px;max-width:440px;width:100%;max-height:90vh;overflow-y:auto;padding:20px}
.modal-header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1e293b;padding-bottom:12px;margin-bottom:16px}
.modal-header h3{font-size:16px;font-weight:700;color:#fff}
.modal-close{width:36px;height:36px;border-radius:50%;background:#1e293b;border:none;color:#94a3b8;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.form-label{display:block;font-size:11px;font-weight:600;color:#64748b;margin-bottom:4px}
.form-input,.form-select,.form-textarea{width:100%;background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:10px 12px;font-size:12px;color:#fff;outline:none;margin-bottom:12px;font-family:inherit}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:#10b981}
.form-textarea{min-height:90px;resize:vertical}
.btn-primary{width:100%;background:#10b981;border:none;color:#000;font-weight:700;padding:12px;border-radius:10px;font-size:13px;cursor:pointer}
.btn-secondary{width:100%;background:#1e293b;border:none;color:#fff;font-weight:600;padding:10px;border-radius:8px;font-size:12px;cursor:pointer;margin-top:8px}
.media-preview-box{margin-top:8px;border-radius:10px;overflow:hidden;border:1px solid #1e293b;background:#0f172a;position:relative;display:none}
.media-preview-box.show{display:block}
.media-preview-box img,.media-preview-box video{width:100%;max-height:240px;object-fit:contain;display:block;background:#000}
.media-preview-remove{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.85);color:#fff;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.15)}
.share-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.share-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:10px;background:#0f172a;border:1px solid #1e293b;cursor:pointer;font-size:9px;color:#94a3b8}
.share-item:hover{border-color:#10b981;background:#111827}
.share-item i{font-size:20px}
.share-item.wa i{color:#25D366}
.share-item.fb i{color:#1877F2}
.share-item.ig i{color:#E4405F}
.share-item.tt i{color:#fff}
.share-item.tw i{color:#fff}
.share-item.yt i{color:#FF0000}
.share-item.gd i{color:#4285F4}
.share-item.cp i{color:#10b981}
.spark-feed-container{position:fixed;top:56px;left:0;right:0;bottom:80px;max-width:600px;margin:0 auto;overflow-y:scroll;overflow-x:hidden;scroll-snap-type:y mandatory;scrollbar-width:none;-ms-overflow-style:none;background:#000;touch-action:pan-y;z-index:50}
.spark-feed-container::-webkit-scrollbar{display:none}
.spark-slide{position:relative;width:100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}
.spark-slide video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.spark-top-gradient{position:absolute;top:0;left:0;right:0;height:100px;background:linear-gradient(to bottom,rgba(0,0,0,.7),transparent);pointer-events:none;z-index:2}
.spark-bottom-gradient{position:absolute;bottom:0;left:0;right:0;height:200px;background:linear-gradient(to top,rgba(0,0,0,.85),transparent);pointer-events:none;z-index:2}
.spark-view-badge{position:absolute;top:12px;left:12px;z-index:6;background:rgba(0,0,0,.55);backdrop-filter:blur(8px);border-radius:20px;padding:5px 10px;display:flex;align-items:center;gap:5px;font-size:11px;font-weight:700;color:#fff;border:1px solid rgba(255,255,255,.18);pointer-events:none}

  }} catch(e){ console.warn('storeMedia', e); }
  try { var db = await openMediaDB(); var id = 'm_'+Date.now()+'_'+Math.random().toString(36).slice(2,8); return new Promise(function(resolve,reject){ var tx = db.transaction(MEDIA_STORE,'readwrite'); tx.objectStore(MEDIA_STORE).put({id:id, blob:file, type:file.type||'', name:file.name||'', ts:Date.now()}); tx.oncomplete = function(){ resolve('idb:'+id); }; tx.onerror = function(){ reject(tx.error); }; }); }

Z.loadMedia = async function(ref){

    var db = await openMediaDB();

        if(!item || !item.blob){ resolve(''); return; }

      };
      req.onerror = function(){ resolve(''); };
    });
  } catch(e){ return ''; }
};

// ============================================================
// AUTO-FREEZE ON SCROLL — IntersectionObserver based
// ============================================================
Z._autoFreezeDelays = {};
Z._freezeObserver = null;
Z._freezeObserved = new WeakSet();
Z.initFreezeObserver = function(){
  if(Z._freezeObserver) return;
  if(typeof IntersectionObserver === 'undefined') return;
  Z._freezeObserver = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      var dot = entry.target;
      var contentId = dot.getAttribute('data-freeze-id');
      if(!contentId) return;
      if(!Z.isUnfrozen(contentId)){
        // Already frozen — clear any pending action
        if(Z._autoFreezeDelays[contentId]){ clearTimeout(Z._autoFreezeDelays[contentId]); delete Z._autoFreezeDelays[contentId]; }
        return;
      }
      if(entry.isIntersecting){
        // Visible — cancel pending auto-freeze
        if(Z._autoFreezeDelays[contentId]){ clearTimeout(Z._autoFreezeDelays[contentId]); delete Z._autoFreezeDelays[contentId]; }
      } else {
        // Out of view — schedule auto-freeze after grace period (1.5s)
        if(Z._autoFreezeDelays[contentId]) clearTimeout(Z._autoFreezeDelays[contentId]);
        Z._autoFreezeDelays[contentId] = setTimeout(function(){
          delete Z._autoFreezeDelays[contentId];
          if(!Z.isUnfrozen(contentId)) return;
          Z.setUnfrozen(contentId, false);
          document.querySelectorAll('[data-freeze-id="' + contentId + '"]').forEach(function(el){
            el.classList.remove('unfrozen');
            el.setAttribute('data-tip','Frozen');
          });
          if(Z.State.currentView === 'home') Z.updatePostReactionUI(contentId);
          if(Z.State.currentView === 'spark') Z.updateSparkReactionsUI(contentId);
        }, 1500);
      }
    });
  }, {threshold: [0, 0.01], rootMargin: '0px'});
};
Z.observeFreezeDots = function(){
  Z.initFreezeObserver();
  if(!Z._freezeObserver) return;
  document.querySelectorAll('.freeze-dot[data-freeze-id]').forEach(function(dot){
    if(Z._freezeObserved.has(dot)) return;
    Z._freezeObserved.add(dot);
    try { Z._freezeObserver.observe(dot); } catch(e){}
  });
};

<script>
(function(){
'use strict';
var Z = window.Z;
if(!Z){ console.error('Z missing'); return; }

function _cu(){ return Z.State.currentUser; }
function _p(id){ return Z.getProfileById(id); }
function RK(){ return ['love','flower','spark','clap','star','dislike']; }
function isDislike(k){ return k === 'dislike'; }
function BOUNTY_REACTIONS(){ return ['love','flower','spark','clap','star']; }

function _timeAgo(ts){
  var d = Date.now() - (ts||0);
  var m = Math.floor(d/60000);
  if(m < 1) return 'just now';
  if(m < 60) return m+'m ago';
  var h = Math.floor(m/60);
  if(h < 24) return h+'h ago';
  return Math.floor(h/24)+'d ago';
}
function _fmtDate(ts){ try { return new Date(ts).toLocaleString(); } catch(e){ return ''; } }

// Video MIME detection fallback (used when media_type missing)
function _isVideoUrl(url){
  if(!url) return false;
  var s = String(url).toLowerCase().split('?')[0].split('#')[0];
  return /\.(mp4|webm|mov|m4v|3gp|avi|mkv|ogv|ogg)$/.test(s);
}

// ============================================================
// SOFT REFRESH — full DOM replacement of current view
// ============================================================
Z.softRefresh = function(){
  var container = document.getElementById('app-container'); if(!container) return;
  var savedY = window.scrollY || document.documentElement.scrollTop || 0;
  var view = Z.State.currentView, param = Z.State.currentParam;
  var openComments = {};
  document.querySelectorAll('.post-comments.open').forEach(function(el){ if(el.id) openComments[el.id] = true; });
  try { container.innerHTML = Z.renderView(view, param); } catch(e){ console.error('softRefresh', e); }
  if(view === 'home'){ Z.renderStatusRow(); setTimeout(function(){ Z.setupFeedVideoAutoplay(); }, 60); }
  Object.keys(openComments).forEach(function(id){ var el = document.getElementById(id); if(el) el.classList.add('open'); });
  window.scrollTo(0, savedY);
  requestAnimationFrame(function(){ window.scrollTo(0, savedY); });
  setTimeout(function(){ window.scrollTo(0, savedY); }, 20);
  Z.updateHeader();
  // Attach freeze-dot auto-freeze observer to new DOM
  if(typeof Z.observeFreezeDots === 'function') Z.observeFreezeDots();
};

// ============================================================
// SAVES / INTERESTS
// ============================================================
Z.getSavedPosts = function(){ var me = _cu(); if(!me) return []; try { var d = localStorage.getItem('zynix_saves_' + me.id); if(!d) return []; var p = JSON.parse(d); return Array.isArray(p) ? p : []; } catch(e){ return []; } };
Z.setSavedPosts = function(arr){ var me = _cu(); if(!me) return; try { localStorage.setItem('zynix_saves_' + me.id, JSON.stringify(arr || [])); } catch(e){} };
Z.isPostSaved = function(id){ return (Z.State.savedPosts || []).indexOf(id) !== -1; };
Z.getInterests = function(){ var me = _cu(); if(!me) return {}; try { var d = localStorage.getItem('zynix_interests_' + me.id); if(!d) return {}; var p = JSON.parse(d); return (p && typeof p === 'object') ? p : {}; } catch(e){ return {}; } };
Z.setInterests = function(obj){ var me = _cu(); if(!me) return; try { localStorage.setItem('zynix_interests_' + me.id, JSON.stringify(obj || {})); } catch(e){} };
Z.getInterestFor = function(postId){ var i = Z.getInterests(); return i['post:' + postId] || ''; };

// ============================================================
// CONNECTION
// ============================================================
Z.getConnectionState = function(otherId){
  var me = _cu(); if(!me) return 'guest';
  if(!otherId || me.id === otherId) return 'self';
  var list = Z.State.allConnections || [];
  for(var i=0;i<list.length;i++){
    var c = list[i];
    var pairOk = (c.requester_id === me.id && c.recipient_id === otherId) || (c.requester_id === otherId && c.recipient_id === me.id);
    if(!pairOk) continue;
    if(c.status === 'accepted') return 'connected';
    if(c.status === 'pending') return c.requester_id === me.id ? 'connecting_out' : 'connecting_in';
  }
  return 'none';
};
Z.getConnectBounty = function(p){ if(!p) return 0; var bs = p.bounty_settings || {}; var v = bs.connect; if(v == null) return 0; return Number(v) || 0; };
Z.renderConnectButton = function(otherId){
  var other = _p(otherId); if(!other) return '';
  var state = Z.getConnectionState(otherId);
  var bounty = Z.getConnectBounty(other);
  var tag = '<span class="bounty-tag">$' + bounty.toFixed(2) + '</span>';
  if(state === 'guest') return '<button class="connect-btn" onclick="Z.openAuthModal(\'login\')">Connect ' + tag + '</button>';
  if(state === 'self') return '<span style="font-size:10px;color:#64748b;padding:4px 12px;background:#0f172a;border-radius:8px;">You</span>';
  if(state === 'connected') return '<button class="connect-btn connected">Connected ' + tag + '</button>';
  if(state === 'connecting_out') return '<button class="connect-btn connecting">Connecting ' + tag + '</button>';
  if(state === 'connecting_in'){
    var req = null; var me = _cu();
    (Z.State.allConnections||[]).forEach(function(c){ if(c.requester_id === otherId && c.recipient_id === me.id && c.status === 'pending') req = c; });
    if(!req) return '<button class="connect-btn" onclick="Z.sendConnectRequest(\'' + Z.escape(otherId) + '\')">Connect ' + tag + '</button>';
    return '<div class="connect-actions"><button class="approve" onclick="Z.acceptConnection(\'' + Z.escape(req.id) + '\')">Accept</button><button class="reject" onclick="Z.rejectConnection(\'' + Z.escape(req.id) + '\')">Reject</button></div>';
  }
  return '<button class="connect-btn" onclick="Z.sendConnectRequest(\'' + Z.escape(otherId) + '\')">Connect ' + tag + '</button>';
};
Z.sendConnectRequest = async function(userId){
  var me = _cu(); if(!me){ Z.openAuthModal('login'); return; }
  if(me.id === userId){ Z.toast('Cannot connect to yourself.'); return; }
  try { await Z.DB.sendConnectRequest(userId); Z.toast('Connection request sent.'); await Z.reloadData(); Z.softRefresh(); }
  catch(e){ var msg = e && e.message ? e.message : 'Could not send request.'; if(msg.indexOf('Already connected') !== -1) Z.toast('Already connected.'); else if(msg.indexOf('pending') !== -1) Z.toast('Request already pending.'); else Z.toast(msg); }
};
// Accept connection — with insufficient balance warning
Z.acceptConnection = async function(requestId){
  try {
    await Z.DB.acceptConnectionRequest(requestId);
    var bountyWarn = false;
    try {
      var c = Z.sb();
      if(c){
        var r = await c.from('connection_requests').select('bounty_status').eq('id', requestId).maybeSingle();
        if(r.data && r.data.bounty_status === 'insufficient') bountyWarn = true;
      }
    } catch(e){}
    if(bountyWarn) Z.toast('Connected — but bounty could not be paid (insufficient balance).');
    else Z.toast('Connected!');
    await Z.reloadData();
    Z.softRefresh();
  } catch(e){ Z.toast(e && e.message ? e.message : 'Could not accept.'); }
};
Z.rejectConnection = async function(requestId){ try { await Z.DB.rejectConnectionRequest(requestId); Z.toast('Request rejected.'); await Z.reloadData(); Z.softRefresh(); } catch(e){ Z.toast(e && e.message ? e.message : 'Could not reject.'); } };
Z.connectTo = function(userId){ Z.sendConnectRequest(userId); };

// ============================================================
// REACTION ROW RENDERERS
// FIX: frozen reactions are NOT disabled — clicking shows tooltip
// ============================================================
Z.renderReactionRowForPost = function(post){
  var me = _cu();
  var counts = post.reactions || {};
  var myR = post._myReactions || {};
  var isMine = me && me.id === post.author_id;
  var unfrozen = Z.isUnfrozen(post.id);
  var hasBounty = Z.hasBountyReactionGiven(myR);
  var html = '';
  RK().forEach(function(k){
    var r = Z.Reactions[k];
    var cnt = counts[k] || 0;
    var act = !!myR[k];
    var cssClass = r.cssClass ? ' class="' + r.cssClass + '"' : '';
    var dis = isDislike(k);
    var disabled = false;
    var cls = 'react-btn';
    if(act) cls += ' active';
    if(dis){
      // Dislike always clickable (toggle or remove). Only disabled if a bounty reaction already taken and dislike not active.
      if(hasBounty && !act) disabled = true;
    } else if(isMine){
      disabled = true; // can't react to own post
    } else if(!unfrozen){
      // Frozen: still clickable — handler shows tooltip + blinks freeze dot
      cls += ' frozen-reaction';
    }
    var onclick = disabled ? '' : ' onclick="Z.reactToPost(\'' + Z.escape(post.id) + '\',\'' + k + '\')"';
    var bountyHtml = dis ? '<span class="bounty" style="color:#64748b;">—</span>' : '<span class="bounty">$' + r.reward.toFixed(2) + '</span>';
    html += '<button class="' + cls + '"' + onclick + ' title="' + r.label + (dis?' (toggle)':' $' + r.reward.toFixed(2)) + '">' +
      '<span' + cssClass + '>' + r.symbol + '</span><span class="count">' + cnt + '</span>' + bountyHtml + '</button>';
  });
  var tip = unfrozen ? 'Unfrozen' : 'Frozen';
  html += '<button type="button" class="freeze-dot' + (unfrozen ? ' unfrozen' : '') + '" data-freeze-id="' + Z.escape(post.id) + '" data-tip="' + tip + '" onclick="Z.toggleFreeze(\'' + Z.escape(post.id) + '\', event)" title="Click to ' + (unfrozen?'freeze':'unfreeze') + ' reactions"></button>';
  return html;
};
Z.renderSparkReactionButtons = function(spark){
  var me = _cu();
  var author = _p(spark.author_id);
  var isOwn = me && author && me.id === author.id;
  var counts = spark._reactions || {};
  var myR = spark._myReactions || {};
  var unfrozen = Z.isUnfrozen(spark.id);
  var hasBounty = Z.hasBountyReactionGiven(myR);
  var html = '';
  RK().forEach(function(k){
    var r = Z.Reactions[k];
    var act = !!myR[k];
    var cnt = counts[k] || 0;
    var dis = isDislike(k);
    var disabled = false;
    if(dis){ if(hasBounty && !act) disabled = true; }
    else if(isOwn) disabled = true;
    else if(!unfrozen) { /* frozen — keep clickable, show tooltip */ }
    var onclick = disabled ? '' : ' onclick="event.stopPropagation();Z.sparkReact(\'' + Z.escape(spark.id) + '\',\'' + k + '\')"';
    var cls = 'spark-reaction-icon';
    if(act) cls += ' active';
    if(dis && hasBounty && !act) cls += ' disabled-reaction';
    else if(!unfrozen && !dis) cls += ' frozen-reaction';
    var price = dis ? '—' : '$' + r.reward.toFixed(2);
    html += '<button class="' + cls + '"' + onclick + ' title="' + r.label + ' ' + price + '">' +
      '<span class="emoji">' + r.symbol + '</span>' +
      '<span class="rcount">' + (cnt > 0 ? cnt : '&nbsp;') + '</span>' +
      '<span class="rprice">' + price + '</span></button>';
  });
  return html;
};

// ============================================================
// STATUS
// ============================================================
function _liveStatuses(){ var now = Date.now(); return (Z.State.allStatuses||[]).filter(function(s){ if(!s) return false; var exp = new Date(s.expires_at||0).getTime(); return !(exp && exp <= now); }).sort(function(a,b){ return new Date(b.created_at||0) - new Date(a.created_at||0); }); }
Z.getStatusContacts = function(){ var me=_cu(); if(!me) return []; return (Z.State.allProfiles||[]).filter(function(p){ return p.id !== me.id; }); };
Z.getActiveStatuses = function(){ var live = _liveStatuses(); var contacts = Z.getStatusContacts().map(function(p){ return p.id; }); var me = _cu(); var allowed = {}; contacts.forEach(function(id){ allowed[id] = true; }); if(me) allowed[me.id] = true; return live.filter(function(s){ return allowed[s.author_id]; }); };

  var all = Z.getActiveStatuses(); var grouped = {};
  all.forEach(function(s){ if(!grouped[s.author_id]) grouped[s.author_id]=[]; grouped[s.author_id].push(s); });
  var me = _cu(); var entries = [];
  if(me && grouped[me.id]) entries.push({user: _p(me.id), statuses: grouped[me.id], isSelf: true});
  Object.keys(grouped).forEach(function(uid){ if(me && uid === me.id) return; var u = _p(uid); if(u) entries.push({user: u, statuses: grouped[uid], isSelf: false}); });
  entries.sort(function(a,b){ if(a.isSelf) return -1; if(b.isSelf) return 1; return new Date(b.statuses[0].created_at||0) - new Date(a.statuses[0].created_at||0); });
  return entries;

Z.STATUS_BGS = ['status-bg-deep-blue','status-bg-navy','status-bg-purple','status-bg-teal','status-bg-green','status-bg-burgundy','status-bg-rose','status-bg-plum','status-bg-slate'];

Z.startStatusTimer = function(){ Z.clearStatusTimer(); Z.State.viewerPaused = false; Z.State.viewerDuration = 7000; Z.State.viewerElapsed = 0; Z.State.viewerStartTime = Date.now(); Z.State.viewerTimer = setTimeout(function(){ Z.statusNext(); }, Z.State.viewerDuration); Z.State.viewerProgressInterval = setInterval(function(){ if(Z.State.viewerPaused) return; Z.State.viewerElapsed = Date.now() - Z.State.viewerStartTime; var pct = Math.min(100, (Z.State.viewerElapsed/Z.State.viewerDuration)*100); var b = document.getElementById('status-progress'); if(b) b.style.width = pct + '%'; }, 100); };
Z.pauseStatusTimer = function(){ if(Z.State.viewerPaused) return; Z.State.viewerPaused = true; if(Z.State.viewerTimer){ clearTimeout(Z.State.viewerTimer); Z.State.viewerTimer = null; } if(Z.State.viewerProgressInterval){ clearInterval(Z.State.viewerProgressInterval); Z.State.viewerProgressInterval = null; } };
Z.resumeStatusTimer = function(){ if(!Z.State.viewerPaused) return; var st = Z.State.viewerStatuses[Z.State.viewerIndex]; if(st && (st.media_type === 'video' || (st.media_type == null && _isVideoUrl(st.media_url)))) return; Z.State.viewerPaused = false; var rem = Z.State.viewerDuration - Z.State.viewerElapsed; Z.State.viewerStartTime = Date.now() - Z.State.viewerElapsed; Z.State.viewerTimer = setTimeout(function(){ Z.statusNext(); }, Math.max(100, rem)); Z.State.viewerProgressInterval = setInterval(function(){ if(Z.State.viewerPaused) return; Z.State.viewerElapsed = Date.now() - Z.State.viewerStartTime; var pct = Math.min(100, (Z.State.viewerElapsed/Z.State.viewerDuration)*100); var b = document.getElementById('status-progress'); if(b) b.style.width = pct + '%'; }, 100); };
Z.clearStatusTimer = function(){ if(Z.State.viewerTimer){ clearTimeout(Z.State.viewerTimer); Z.State.viewerTimer = null; } if(Z.State.viewerProgressInterval){ clearInterval(Z.State.viewerProgressInterval); Z.State.viewerProgressInterval = null; } };
Z.setupViewerGesture = function(){
  var body = document.getElementById('status-viewer-body'); if(!body) return;
  var sx=0, sy=0, st=0, moved=false, holding=false, holdTimer=null;
  var SWIPE=55, TAP=14, TAPTIME=350, HOLDMS=250;
  function _start(x,y){ sx=x; sy=y; st=Date.now(); moved=false; holding=false; if(holdTimer){ clearTimeout(holdTimer); holdTimer=null; } holdTimer = setTimeout(function(){ holding = true; Z.pauseStatusTimer(); }, HOLDMS); }
  function _move(x,y){ if(Math.abs(x-sx)>TAP || Math.abs(y-sy)>TAP){ moved=true; if(holdTimer){ clearTimeout(holdTimer); holdTimer=null; } } }
  function _end(x,y){
    if(holdTimer){ clearTimeout(holdTimer); holdTimer=null; }
    var dx=x-sx, dy=y-sy, el=Date.now()-st, ax=Math.abs(dx), ay=Math.abs(dy);
    if(holding){ holding=false; Z.resumeStatusTimer(); return; }
    if(ax>SWIPE && ax>ay*1.15){ if(dx<0) Z.statusNext(); else Z.statusPrev(); return; }
    if(ay>SWIPE && ay>ax*1.15){ if(dy<0) Z.advanceToNextContact(); else Z.advanceToPrevContact(); return; }
    if(!moved && el<TAPTIME){ Z.statusNext(); return; }
    Z.resumeStatusTimer();
  }
  body.addEventListener('touchstart', function(ev){ if(ev.touches.length!==1) return; if(ev.target.closest('button')||ev.target.closest('video')) return; _start(ev.touches[0].clientX, ev.touches[0].clientY); }, {passive:true});
  body.addEventListener('touchmove', function(ev){ if(ev.touches.length!==1) return; _move(ev.touches[0].clientX, ev.touches[0].clientY); }, {passive:true});
  body.addEventListener('touchend', function(ev){ if(!ev.changedTouches.length) return; if(ev.target.closest('button')||ev.target.closest('video')) return; _end(ev.changedTouches[0].clientX, ev.changedTouches[0].clientY); }, {passive:true});
  var dn=false;
  body.addEventListener('mousedown', function(ev){ if(ev.target.closest('button')||ev.target.closest('video')) return; dn=true; _start(ev.clientX, ev.clientY); });
  body.addEventListener('mousemove', function(ev){ if(!dn) return; _move(ev.clientX, ev.clientY); });
  body.addEventListener('mouseup', function(ev){ if(!dn) return; dn=false; if(ev.target.closest('button')||ev.target.closest('video')) return; _end(ev.clientX, ev.clientY); });
  body.addEventListener('mouseleave', function(){ if(dn){ dn=false; Z.resumeStatusTimer(); } });
};
Z.advanceToNextContact = function(){ var all = Z.getActiveStatuses(); var map = {}; all.forEach(function(s){ if(!map[s.author_id]) map[s.author_id]=[]; map[s.author_id].push(s); }); var keys = Object.keys(map); if(keys.length <= 1){ Z.closeStatusViewer(); return; } var idx = keys.indexOf(Z.State.viewerAuthorId); Z.openStatusViewer(keys[(idx+1)%keys.length], 0); };
Z.advanceToPrevContact = function(){ var all = Z.getActiveStatuses(); var map = {}; all.forEach(function(s){ if(!map[s.author_id]) map[s.author_id]=[]; map[s.author_id].push(s); }); var keys = Object.keys(map); if(keys.length <= 1){ Z.closeStatusViewer(); return; } var idx = keys.indexOf(Z.State.viewerAuthorId); Z.openStatusViewer(keys[(idx-1+keys.length)%keys.length], 0); };
Z.statusPrev = function(){ Z.clearStatusTimer(); if(Z.State.viewerIndex > 0){ Z.State.viewerIndex--; Z.showStatusViewer(); } else Z.advanceToPrevContact(); };
Z.statusNext = function(){ Z.clearStatusTimer(); if(Z.State.viewerIndex < Z.State.viewerStatuses.length - 1){ Z.State.viewerIndex++; Z.showStatusViewer(); } else Z.advanceToNextContact(); };
Z.closeStatusViewer = function(){ Z.clearStatusTimer(); Z.State.viewerPaused = false; var v = document.getElementById('status-viewer'); if(v){ v.querySelectorAll('video').forEach(function(vv){ try{vv.pause(); vv.src='';}catch(e){} }); v.remove(); } Z.showView('status-home'); setTimeout(function(){ Z.setupFeedVideoAutoplay(); }, 250); };

Z.setupSparkFeed = function(sparks){
  var feed = document.getElementById('spark-feed'); if(!feed) return;
  var slides = feed.querySelectorAll('.spark-slide'); if(!slides.length) return;
  if(!Z._sparkUnmuteHooked){
    Z._sparkUnmuteHooked = true;
    var unlockAudio = function(){
      Z._sparkAudioUnlocked = true;
      var feedEl = document.getElementById('spark-feed'); if(!feedEl) return;
      feedEl.querySelectorAll('video').forEach(function(v){ if(!v.paused){ try { v.muted = false; v.volume = 1; } catch(e){} } });
    };
    document.addEventListener('touchstart', unlockAudio, {passive:true});
    document.addEventListener('click', unlockAudio, true);
    document.addEventListener('keydown', unlockAudio, true);
  }
  if(Z.State.sparkObserver){ try { Z.State.sparkObserver.disconnect(); } catch(e){} }
  Z.State.sparkObserver = new IntersectionObserver(function(){
    var vids = feed.querySelectorAll('video'); var vh = window.innerHeight, best = null, bestRatio = 0;
    vids.forEach(function(v){
      var r = v.getBoundingClientRect();
      var visible = Math.max(0, Math.min(vh, r.bottom) - Math.max(0, r.top));
      var ratio = r.height > 0 ? visible / r.height : 0;
      if(ratio > bestRatio){ bestRatio = ratio; best = v; }
    });
    vids.forEach(function(v){
      if(v === best && bestRatio >= 0.75){
        if(Z._sparkAudioUnlocked){ v.muted = false; v.volume = 1; }
        Z.playExclusive(v);
      } else {
        if(!v.paused){ try { v.pause(); } catch(e){} }
      }
    });
  }, {threshold:[0, 0.25, 0.5, 0.75, 0.9, 1.0]});
  slides.forEach(function(sl){
    Z.State.sparkObserver.observe(sl);
    var vid = sl.querySelector('video');
    if(vid && !vid._viewHooked){
      vid._viewHooked = true;
      var sid = vid.getAttribute('data-spark-id');
      vid.addEventListener('timeupdate', function(){ Z.recordSparkViewOnProgress(vid, sid); });
      vid.addEventListener('ended', function(){ Z._viewedThisSession[sid] = false; });
      vid.addEventListener('seeking', function(){ if(vid.currentTime < 0.5) Z._viewedThisSession[sid] = false; });
    }
  });
  var sY = 0;
  feed.addEventListener('touchstart', function(e){ sY = e.touches[0].clientY; }, {passive:true});
  feed.addEventListener('touchend', function(e){
    var dy = sY - e.changedTouches[0].clientY;
    if(Math.abs(dy) > 80){
      var allSlides = feed.querySelectorAll('.spark-slide'); var idx = 0, mx = 0, h = feed.clientHeight;
      allSlides.forEach(function(s, i){ var r = s.getBoundingClientRect(); var vis = Math.max(0, Math.min(r.bottom, window.innerHeight) - Math.max(r.top, 56)); var ratio = vis / h; if(ratio > mx){ mx = ratio; idx = i; } });
      if(dy > 0 && idx < allSlides.length-1) allSlides[idx+1].scrollIntoView({behavior:'smooth', block:'start'});
      else if(dy < 0 && idx > 0) allSlides[idx-1].scrollIntoView({behavior:'smooth', block:'start'});
    }
  }, {passive:true});
};

// ============================================================
// REALTIME — FIXED postgres_changes syntax + no softRefresh for comments
// ============================================================
Z.setupRealtime = function(){
  var c = Z.sb(); if(!c) return;
  var me = _cu(); if(!me) return;
  Z.State.realtimeChannels.forEach(function(ch){ try { c.removeChannel(ch); } catch(e){} });
  Z.State.realtimeChannels = [];
  // ---- Channel 1: Comments (INSERT) — in-place DOM update ----
  try {
    var ch1 = c.channel('zynix-comments').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'comments' }, function(payload){
      var cm = payload.new; if(!cm) return;
      if(cm.author_id === me.id) return;
      if(cm.spark_id){
        var sp = (Z.State.allSparks||[]).find(function(x){ return x.id === cm.spark_id; });
        if(sp){ sp._commentsCount = (sp._commentsCount||0)+1; }
        return;
      }
      if(!cm.post_id) return;
      var post = (Z.State.allPosts||[]).find(function(x){ return x.id === cm.post_id; }); if(!post) return;
      var exists = false;
      function scan(arr){ for(var i=0;i<arr.length;i++){ if(arr[i].id === cm.id){ exists=true; return; } if(arr[i]._replies) scan(arr[i]._replies); } }
      if(post._comments) scan(post._comments);
      if(exists) return;
      cm._reactionCounts = {}; cm._myReactions = {}; cm._replies = [];
      if(!post._comments) post._comments = [];
      if(cm.parent_id){ var parent = Z.findCommentInState(cm.parent_id); if(parent){ if(!parent._replies) parent._replies = []; parent._replies.push(cm); } else post._comments.push(cm); }
      else post._comments.push(cm);
      // FIX: in-place DOM insert — no more softRefresh (prevents screen shiver)
      var container = document.getElementById('comments-' + cm.post_id);
      if(container){
        try {
          var temp = document.createElement('div');
          temp.innerHTML = Z.renderComment(cm, post, Z.State.allProfiles);
          var newEl = temp.firstChild;
          if(cm.parent_id){
            var parentEl = container.querySelector('[data-comment-id="' + cm.parent_id + '"]');
            if(parentEl){
              var rc = parentEl.querySelector('.comment-replies');
              if(!rc){ rc = document.createElement('div'); rc.className = 'comment-replies'; parentEl.appendChild(rc); }
              rc.appendChild(newEl);
            } else { container.appendChild(newEl); }
          } else {
            var cp = container.querySelector('.comment-color-picker');
            if(cp && cp.parentNode === container) container.insertBefore(newEl, cp);
            else container.appendChild(newEl);
          }
        } catch(err){ console.warn('comment insert', err); }
      }
      // Update comment count on card
      var card = document.querySelector('.post-card[data-post-id="' + cm.post_id + '"]');
      if(card && post){
        var btn = card.querySelector('.post-actions button');
        if(btn) btn.innerHTML = '<i class="fa-regular fa-comment"></i> Comment ' + countAllComments(post._comments || []);
      }
    }).subscribe();
    Z.State.realtimeChannels.push(ch1);
  } catch(e){ console.warn('ch1', e); }
  // ---- Channel 2: Reactions (post + spark + comment) — FIXED syntax ----
  try {
    var ch2 = c.channel('zynix-reactions')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'post_reactions' }, function(payload){
        var r = payload.new; if(!r) return; if(r.user_id === me.id) return;
        var post = (Z.State.allPosts||[]).find(function(x){ return x.id === r.post_id; }); if(!post) return;
        if(!post.reactions) post.reactions = {};
        post.reactions[r.reaction] = (post.reactions[r.reaction]||0) + 1;
        Z.updatePostReactionUI(r.post_id);
      })
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'spark_reactions' }, function(payload){
        var r = payload.new; if(!r) return; if(r.user_id === me.id) return;
        var sp = (Z.State.allSparks||[]).find(function(x){ return x.id === r.spark_id; }); if(!sp) return;
        if(!sp._reactions) sp._reactions = {};
        sp._reactions[r.reaction] = (sp._reactions[r.reaction]||0) + 1;
        Z.updateSparkReactionsUI(r.spark_id);
      })
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'comment_reactions' }, function(payload){
        var r = payload.new; if(!r) return; if(r.user_id === me.id) return;
        var cm = Z.findCommentInState(r.comment_id); if(!cm) return;
        if(!cm._reactionCounts) cm._reactionCounts = {};
        cm._reactionCounts[r.reaction] = (cm._reactionCounts[r.reaction]||0)+1;
        Z.updateCommentReactionUI(r.comment_id);
      })
      .subscribe();
    Z.State.realtimeChannels.push(ch2);
  } catch(e){ console.warn('ch2', e); }
  // ---- Channel 3: Wallet ----
  try {
    var ch3 = c.channel('zynix-wallet-' + me.id).on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'wallet_transactions', filter: 'user_id=eq.' + me.id }, function(payload){
      var tx = payload.new; if(!tx) return;
      var amt = Number(tx.amount) || 0;
      if(amt > 0) Z.animateDollar(amt);
      me.wallet_cash = Number(me.wallet_cash||0) + amt;
      me.wallet_total = Number(me.wallet_total||0) + amt;
      me._walletTx = me._walletTx || [];
      me._walletTx.unshift(tx);
      Z.updateHeader();
      Z.incWalletBadge(1);
      if(Z.State.currentView === 'wallet'){ var cont = document.getElementById('app-container'); if(cont) cont.innerHTML = Z.renderView('wallet'); }
    }).subscribe();
    Z.State.realtimeChannels.push(ch3);
  } catch(e){ console.warn('ch3', e); }
  // ---- Channel 4: Notifications ----
  try {
    var ch4 = c.channel('zynix-notifications-' + me.id).on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'notifications', filter: 'user_id=eq.' + me.id }, function(payload){
      var n = payload.new; if(!n) return;
      Z.State.allNotifications.unshift(n);
      Z.updateNotifBadge();
      if(Z.State.currentView === 'notifications'){ Z.softRefresh(); }
    }).subscribe();
    Z.State.realtimeChannels.push(ch4);
  } catch(e){ console.warn('ch4', e); }
};

// ============================================================
// ROUTER
// ============================================================
Z.renderView = function(view, param){
  switch(view){
    case 'home': return Z.renderHome();
    case 'spark': return Z.renderSpark();
    case 'people': return Z.renderPeople();
    case 'profile': return Z.renderProfile();
    case 'wallet': return Z.renderWallet();
    case 'bounty': return Z.renderBounty();
    case 'packages': return Z.renderPackages();
    case 'referrals': return Z.renderReferrals();
    case 'circles': return Z.renderCircles();
    case 'notifications': return Z.renderNotifications();
    case 'public-profile': return Z.renderPublicProfile(param);
    case 'status-home': return Z.renderStatusHome();
    default: return Z.renderHome();
  }
};
Z.showView = async function(view, param){
  var prevView = Z.State.currentView;
  if(prevView === 'home' && view !== 'home'){ Z.saveScroll(window.scrollY); }
  // FIX: pause all videos when view changes + revoke pending object URLs (audio leak fix)
  if(prevView && prevView !== view){
    try { Z.pauseAllBackgroundVideos(); } catch(e){}
    try { Z._revokeAllObjUrls(); } catch(e){}
  }
  Z.State.currentView = view;
  Z.State.currentParam = param || null;
  if(view !== 'notifications' && view !== 'wallet') Z.saveCurrentView(view, param);
  window.scrollTo(0,0);
  document.querySelectorAll('#bottom-nav button:not(.create-btn)').forEach(function(b){ b.classList.remove('active'); });
  var map = {home:'nav-home', spark:'nav-spark', circles:'nav-circles', people:'nav-people', profile:'nav-profile'};
  if(map[view]){ var b = document.getElementById(map[view]); if(b) b.classList.add('active'); }
  var container = document.getElementById('app-container');
  if(!container) return;
  try { container.innerHTML = Z.renderView(view, param); }
  catch(e){ console.error('render err', e); container.innerHTML = '<div class="empty-state"><p>Something went wrong.</p><button onclick="Z.showView(\'home\')" style="background:#10b981;border:none;color:#000;font-weight:700;padding:8px 20px;border-radius:8px;margin-top:12px;cursor:pointer;">Home</button></div>'; }
  if(view === 'home'){
    setTimeout(function(){ Z.renderStatusRow(); }, 80);
    setTimeout(function(){ Z.setupFeedVideoAutoplay(); Z.observeFreezeDots(); }, 150);
    var y = Z.restoreScroll();
    if(y > 0){ setTimeout(function(){ window.scrollTo(0, y); }, 60); setTimeout(function(){ window.scrollTo(0, y); }, 200); }
  }
  if(view === 'spark'){ setTimeout(function(){ Z.setupSparkFeed(Z.State.allSparks); Z.observeFreezeDots(); }, 150); }
  updateBellColor();
  updateWalletPillState();
  Z.updateHeader();
};
function updateBellColor(){
  var b = document.getElementById('bell-btn'); if(!b) return;
  if(Z.State.currentView === 'notifications') b.classList.add('active'); else b.classList.remove('active');
}
function updateWalletPillState(){
  var w = document.getElementById('wallet-pill'); if(!w) return;
  if(Z.State.currentView === 'wallet') w.classList.add('active'); else w.classList.remove('active');
}

// ============================================================
// BOOT
// ============================================================
var _authBootDone = false;
async function boot(){
  if(!localStorage.getItem('zynix_circles')) Z.DB.saveCircles(Z.SeedData.circles);
  var restored = Z.restoreView();
  Z.State.currentView = restored.view;
  Z.State.currentParam = restored.param;
  var container = document.getElementById('app-container');
  if(container) container.innerHTML = '<div class="empty-state"><i class="fa-solid fa-circle-notch fa-spin"></i><p>Loading...</p></div>';
  document.querySelectorAll('#bottom-nav button:not(.create-btn)').forEach(function(b){ b.classList.remove('active'); });
  var map = {home:'nav-home', spark:'nav-spark', circles:'nav-circles', people:'nav-people', profile:'nav-profile'};
  if(map[restored.view]){ var b = document.getElementById(map[restored.view]); if(b) b.classList.add('active'); }
  await Z.refreshSession();
  await Z.reloadData();
  Z.showView(restored.view, restored.param);
  Z.setupRealtime();
  Z.State.bootCompleted = true;
  _authBootDone = true;
  try { var c = Z.sb(); if(c){
    c.auth.onAuthStateChange(async function(event){
      if(event === 'TOKEN_REFRESHED' || event === 'INITIAL_SESSION' || event === 'USER_UPDATED'){
        if(event === 'TOKEN_REFRESHED') await Z.refreshSession();
        return;
      }
      if(!_authBootDone) return;
      if(event === 'SIGNED_OUT'){
        Z.State.currentUser = null;
        Z.renderHeaderAuth();
        Z.updateHeader();
        Z.showView('home');
        return;
      }
      if(event === 'SIGNED_IN'){
        var curView = Z.State.currentView;
        var curParam = Z.State.currentParam;
        var prevScroll = window.scrollY;
        await Z.refreshSession();
        await Z.reloadData();
        if(curView === 'wallet'){
          var pw = Z.State.prevViewBeforeWallet || {view:'home', param:null};
          Z.showView(pw.view, pw.param);
        } else if(curView === 'notifications'){
          var pn = Z.State.prevViewBeforeNotifications || {view:'home', param:null};
          Z.showView(pn.view, pn.param);
        } else {
          Z.showView(curView, curParam);
          setTimeout(function(){ window.scrollTo(0, prevScroll); }, 200);
        }
        Z.setupRealtime();
      }
    });
  }} catch(e){}
}
if(document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', boot); } else { boot(); }

})();
</script>

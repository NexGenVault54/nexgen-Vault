<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZYNIX - Complete Social Platform</title>
    <script src="https://cdn.tailwindcss.com">
    </script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        zynix: {
                            bg: "#090d16",
                            card: "#111827",
                            cardHover: "#1f2937",
                            border: "#1e293b",
                            emerald: "#10b981",
                            blue: "#3b82f6",
                            pink: "#ec4899",
                            purple: "#8b5cf6",
                            amber: "#f59e0b",
                            red: "#ef4444"
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #090d16;
            color: #f8fafc;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            padding-bottom: 80px;
            overflow-x: hidden;
        }
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #090d16;
        }
        ::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }

        /* ===== HEADER ===== */
        .zynix-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(9, 13, 22, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #1e293b;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            min-height: 56px;
        }

        /* ===== FOOTER NAV ===== */
        .zynix-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(9, 13, 22, 0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid #1e293b;
            padding: 8px 0;
            display: flex;
            align-items: center;
            justify-content: space-around;
            max-width: 600px;
            margin: 0 auto;
        }
        .zynix-footer button {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4px 0;
            color: #64748b;
            transition: color 0.2s;
            background: transparent;
            border: none;
            font-size: 10px;
            cursor: pointer;
        }
        .zynix-footer button i {
            font-size: 18px;
            margin-bottom: 2px;
        }
        .zynix-footer button:hover {
            color: #10b981;
        }
        .zynix-footer button.active {
            color: #10b981;
        }
        .zynix-footer .create-btn {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, #10b981, #3b82f6);
            color: #000;
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: -16px;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3);
            transition: transform 0.2s;
        }
        .zynix-footer .create-btn:hover {
            transform: scale(1.05);
        }

        /* ===== MAIN CONTENT ===== */
        #app-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 76px 16px 20px;
            min-height: calc(100vh - 80px);
        }

        /* ===== STATUS RING ===== */
        .status-ring-unseen {
            background: linear-gradient(135deg, #10b981, #3b82f6, #8b5cf6);
            padding: 3px;
            border-radius: 50%;
        }
        .status-ring-seen {
            background: #1e293b;
            padding: 3px;
            border-radius: 50%;
        }
        .status-ring-inner {
            border: 2px solid #090d16;
            border-radius: 50%;
            overflow: hidden;
        }

        /* ===== STATUS VIEWER ===== */
        .status-viewer-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            color: #fff;
        }
        .status-viewer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
        }
        .status-viewer-body {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            min-height: 0;
            overflow: hidden;
        }
        .status-viewer-body .stage {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            min-height: 320px;
            max-height: 620px;
            height: clamp(320px, 58vh, 620px);
        }
        .status-viewer-body .stage img,
        .status-viewer-body .stage video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            max-width: 100%;
            max-height: 100%;
        }
        .status-viewer-body .stage .text-status {
            padding: 24px;
            font-size: clamp(1.2rem, 4vw, 2.2rem);
            font-weight: 700;
            text-align: center;
            line-height: 1.6;
            color: #fff;
            overflow-y: auto;
            max-height: 100%;
            width: 100%;
        }
        .status-viewer-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
            height: 64px;
        }
        .status-viewer-footer button {
            padding: 8px 16px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .status-viewer-footer button:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* ===== POST ===== */
        .post-card {
            background: #111827;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .post-card .author {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
        }
        .post-card .author img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
        }
        .post-card .author .name {
            font-weight: 700;
            font-size: 13px;
            color: #fff;
        }
        .post-card .author .handle {
            font-size: 10px;
            color: #64748b;
        }
        .post-card .content {
            font-size: 13px;
            color: #e2e8f0;
            line-height: 1.6;
            margin-bottom: 10px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .post-card .media {
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 10px;
            background: #000;
        }
        .post-card .media img,
        .post-card .media video {
            width: 100%;
            max-height: 400px;
            object-fit: cover;
        }
        .post-card .reactions {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            padding: 8px 0;
            border-top: 1px solid #1e293b;
        }
        .post-card .reactions button {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 14px;
            background: transparent;
            border: 1px solid transparent;
            cursor: pointer;
            transition: all 0.15s;
        }
        .post-card .reactions button:hover {
            transform: scale(1.1);
            background: #1e293b;
        }
        .post-card .reactions button.active {
            background: rgba(16, 185, 129, 0.15);
            border-color: rgba(16, 185, 129, 0.25);
        }
        .post-card .reactions .count {
            font-size: 10px;
            color: #64748b;
            margin-left: 2px;
        }
        .post-card .actions {
            display: flex;
            gap: 16px;
            padding-top: 8px;
            border-top: 1px solid #1e293b;
            font-size: 12px;
            color: #64748b;
        }
        .post-card .actions button {
            background: transparent;
            border: none;
            color: #64748b;
            cursor: pointer;
            transition: color 0.2s;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .post-card .actions button:hover {
            color: #e2e8f0;
        }
        .post-card .comments {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #1e293b;
        }
        .post-card .comments .comment {
            background: #0f172a;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 6px;
            font-size: 12px;
        }
        .post-card .comments .comment .cname {
            font-weight: 600;
            color: #10b981;
        }
        .post-card .comments .comment .ctext {
            color: #cbd5e1;
        }
        .post-card .comments .comment-input {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .post-card .comments .comment-input input {
            flex: 1;
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 12px;
            color: #fff;
            outline: none;
        }
        .post-card .comments .comment-input input:focus {
            border-color: #10b981;
        }
        .post-card .comments .comment-input button {
            background: #10b981;
            border: none;
            color: #000;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 11px;
            cursor: pointer;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 10000;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-box {
            background: #111827;
            border: 1px solid #1e293b;
            border-radius: 16px;
            max-width: 420px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 20px;
        }
        .modal-box .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 12px;
            margin-bottom: 16px;
        }
        .modal-box .modal-header h3 {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
        }
        .modal-box .modal-header button {
            background: transparent;
            border: none;
            color: #64748b;
            font-size: 20px;
            cursor: pointer;
        }
        .modal-box .modal-header button:hover {
            color: #fff;
        }
        .modal-box label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 4px;
        }
        .modal-box input,
        .modal-box textarea,
        .modal-box select {
            width: 100%;
            background: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 12px;
            color: #fff;
            outline: none;
            margin-bottom: 12px;
        }
        .modal-box input:focus,
        .modal-box textarea:focus,
        .modal-box select:focus {
            border-color: #10b981;
        }
        .modal-box textarea {
            min-height: 80px;
            resize: vertical;
        }
        .modal-box .btn-primary {
            width: 100%;
            background: #10b981;
            border: none;
            color: #000;
            font-weight: 700;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .modal-box .btn-primary:hover {
            opacity: 0.85;
        }
        .modal-box .btn-secondary {
            width: 100%;
            background: #1e293b;
            border: none;
            color: #fff;
            font-weight: 600;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-top: 8px;
        }
        .modal-box .btn-secondary:hover {
            opacity: 0.85;
        }

        /* ===== SHARE MODAL ===== */
        .share-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 12px 0;
        }
        .share-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 10px;
            border-radius: 12px;
            background: #0f172a;
            border: 1px solid #1e293b;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 9px;
            color: #94a3b8;
        }
        .share-item:hover {
            border-color: #10b981;
            transform: scale(1.02);
        }
        .share-item i {
            font-size: 22px;
        }
        .share-item .wa i {
            color: #25D366;
        }
        .share-item .fb i {
            color: #1877F2;
        }
        .share-item .ig i {
            color: #E4405F;
        }
        .share-item .tt i {
            color: #000;
        }
        .share-item .tw i {
            color: #000;
        }
        .share-item .yt i {
            color: #FF0000;
        }
        .share-item .gd i {
            color: #4285F4;
        }
        .share-item .cp i {
            color: #10b981;
        }

        /* ===== TOAST ===== */
        #toast-container {
            position: fixed;
            bottom: 90px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            width: 90%;
            max-width: 400px;
            pointer-events: none;
        }
        .toast {
            background: rgba(17, 24, 39, 0.95);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #f8fafc;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 12px;
            margin-bottom: 6px;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 8px;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.3s ease;
            pointer-events: auto;
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
        .toast i {
            color: #10b981;
            font-size: 16px;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 640px) {
            .zynix-header .logo-text {
                font-size: 16px;
            }
            .zynix-footer button {
                font-size: 8px;
            }
            .zynix-footer button i {
                font-size: 16px;
            }
            .zynix-footer .create-btn {
                width: 42px;
                height: 42px;
                font-size: 18px;
                margin-top: -14px;
            }
            #app-container {
                padding: 72px 12px 16px;
            }
            .post-card {
                padding: 12px;
            }
            .status-viewer-body .stage {
                min-height: 280px;
                max-height: 440px;
                height: clamp(280px, 50vh, 440px);
            }
            .share-grid {
                grid-template-columns: repeat(4, 1fr);
                gap: 6px;
            }
            .share-item {
                padding: 6px;
                font-size: 8px;
            }
            .share-item i {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="zynix-header">
        <div class="flex items-center gap-2">
            <button onclick="Z.showView('home')" class="flex items-center gap-2 bg-transparent border-none cursor-pointer">
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-emerald-400 to-blue-500 flex items-center justify-center font-black text-black text-sm shadow-md">Z</div>
                <span class="logo-text text-xl font-black bg-gradient-to-r from-emerald-400 via-blue-500 to-indigo-500 bg-clip-text text-transparent">ZYNIX</span>
            </button>
        </div>
        <div class="flex items-center gap-2">
            <button onclick="Z.toggleTheme()" class="text-slate-400 hover:text-white transition text-sm bg-transparent border-none cursor-pointer">
                <i class="fa-solid fa-moon" id="theme-icon"></i>
            </button>
            <button onclick="Z.showView('notifications')" class="relative text-slate-400 hover:text-white transition text-sm bg-transparent border-none cursor-pointer">
                <i class="fa-solid fa-bell"></i>
                <span id="notification-count" class="absolute -top-1 -right-1 bg-red-500 text-white text-[8px] font-bold w-4 h-4 rounded-full flex items-center justify-center hidden">0</span>
            </button>
            <button onclick="Z.showView('wallet')" class="bg-slate-900/90 border border-slate-800 hover:border-slate-700 px-2.5 py-1 rounded-full text-[10px] flex items-center gap-2 transition bg-transparent cursor-pointer">
                <span class="flex items-center gap-1"><i class="fa-solid fa-wallet text-emerald-400"></i><span id="header-cash" class="text-emerald-400 font-bold">$0.00</span></span>
                <span class="text-slate-700">|</span>
                <span class="flex items-center gap-1"><i class="fa-solid fa-gift text-blue-400"></i><span id="header-bounty" class="text-blue-400 font-bold">$0.00</span></span>
            </button>
            <div id="header-auth-container"></div>
        </div>
    </header>

    <!-- ===== MAIN ===== -->
    <main id="app-container"></main>

    <!-- ===== FOOTER ===== -->
    <nav class="zynix-footer" id="bottom-nav">
        <button onclick="Z.showView('home')" id="nav-home" class="active">
            <i class="fa-solid fa-house"></i>
            <span>Home</span>
        </button>
        <button onclick="Z.showView('spark')" id="nav-spark">
            <i class="fa-solid fa-bolt"></i>
            <span>Spark</span>
        </button>
        <button onclick="Z.openCreateModal()" class="create-btn">
            <i class="fa-solid fa-plus"></i>
        </button>
        <button onclick="Z.showView('circles')" id="nav-circles">
            <i class="fa-solid fa-circle-nodes"></i>
            <span>Circles</span>
        </button>
        <button onclick="Z.showView('people')" id="nav-people">
            <i class="fa-solid fa-users"></i>
            <span>People</span>
        </button>
        <button onclick="Z.showView('profile')" id="nav-profile">
            <i class="fa-solid fa-user"></i>
            <span>Profile</span>
        </button>
    </nav>

    <!-- ===== TOAST ===== -->
    <div id="toast-container"></div>

    <!-- ===== MODAL ===== -->
    <div id="modal-container"></div>

    <!-- ========================================================== -->
    <!-- ZYNIX APPLICATION - COMPLETE                               -->
    <!-- ========================================================== -->
    <script>
        (function() {
            'use strict';

            // ==========================================================
            // ZYNIX NAMESPACE
            // ==========================================================
            window.Z = {};
            var Z = window.Z;

            // ==========================================================
            // STATE
            // ==========================================================
            Z.State = {
                currentUser: null,
                currentView: 'home',
                circleSearch: '',
                sparkFilter: '',
                peopleSearch: '',
                viewerAuthorId: '',
                viewerIndex: 0,
                viewerStatuses: [],
                theme: 'dark'
            };

            // ==========================================================
            // 6 REACTIONS - FIXED
            // ==========================================================
            Z.Reactions = {
                love: { symbol: '❤️', label: 'Love', reward: 0.05 },
                flower: { symbol: '🌹', label: 'Flower', reward: 0.04 },
                spark: { symbol: '🔥', label: 'Spark', reward: 0.03 },
                clap: { symbol: '👏', label: 'Clap', reward: 0.02 },
                star: { symbol: '⭐', label: 'Star', reward: 0.01 },
                dislike: { symbol: '👎', label: 'Dislike', reward: 0.00 }
            };
            var REACTION_KEYS = ['love', 'flower', 'spark', 'clap', 'star', 'dislike'];

            // ==========================================================
            // PACKAGES
            // ==========================================================
            Z.Packages = {
                'Free': { name: 'Free', price: 0, dailyLimit: 0, canEarn: false },
                'Starter $3': { name: 'Starter $3', price: 3, dailyLimit: 10, canEarn: true },
                'Growth $10': { name: 'Growth $10', price: 10, dailyLimit: 25, canEarn: true },
                'Creator $20': { name: 'Creator $20', price: 20, dailyLimit: 50, canEarn: true },
                'Pro $40': { name: 'Pro $40', price: 40, dailyLimit: 100, canEarn: true },
                'Enterprise $100': { name: 'Enterprise $100', price: 100, dailyLimit: 500, canEarn: true }
            };

            // ==========================================================
            // SECURITY
            // ==========================================================
            Z.escape = function(str) {
                if (!str) return '';
                return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g,
                    '&quot;').replace(/'/g, '&#039;');
            };

            // ==========================================================
            // TOAST
            // ==========================================================
            Z.toast = function(msg) {
                var container = document.getElementById('toast-container');
                if (!container) return;
                var toast = document.createElement('div');
                toast.className = 'toast';
                toast.innerHTML = '<i class="fa-solid fa-circle-check"></i> ' + Z.escape(msg);
                container.appendChild(toast);
                requestAnimationFrame(function() {
                    toast.classList.add('show');
                });
                setTimeout(function() {
                    toast.classList.remove('show');
                    setTimeout(function() { toast.remove(); }, 300);
                }, 3000);
            };

            // ==========================================================
            // MODAL HELPERS
            // ==========================================================
            Z.closeModal = function() {
                var container = document.getElementById('modal-container');
                if (container) container.innerHTML = '';
            };

            Z.openModal = function(html) {
                var container = document.getElementById('modal-container');
                if (!container) return;
                container.innerHTML = html;
            };

            // ==========================================================
            // DATA LAYER
            // ==========================================================
            Z.DB = {
                getUsers: function() {
                    try {
                        var data = localStorage.getItem('zynix_users');
                        if (!data) return Z.SeedData.users;
                        var parsed = JSON.parse(data);
                        return Array.isArray(parsed) ? parsed : Z.SeedData.users;
                    } catch (e) {
                        return Z.SeedData.users;
                    }
                },
                getUserById: function(id) {
                    var users = this.getUsers();
                    for (var i = 0; i < users.length; i++) {
                        if (users[i].id === id) return users[i];
                    }
                    return null;
                },
                saveUsers: function(arr) {

            // ==========================================================
            // REWARD ENGINE
            // ==========================================================
            Z.RewardEngine = {
                split: function(amount) {
                    return { cash: Number((amount * 0.60).toFixed(4)), bounty: Number((amount * 0.40).toFixed(4)) };
                },
                checkDaily: function(user) {
                    var today = new Date().toISOString().split('T')[0];
                    if (!user.dailyTracker || user.dailyTracker.date !== today) {
                        user.dailyTracker = { date: today, count: 0 };
                    }
                    var pkg = Z.Packages[user.package || 'Free'] || Z.Packages['Free'];
                    return {
                        allowed: user.dailyTracker.count < pkg.dailyLimit,
                        current: user.dailyTracker.count,
                        limit: pkg.dailyLimit
                    };
                },
                credit: function(user, amount, reason) {
                    if (!user) return false;
                    var s = this.split(amount);
                    if (!user.wallet) user.wallet = { cash: 0, bounty: 0, total: 0 };
                    if (!user.walletTx) user.walletTx = [];
                    user.wallet.cash += s.cash;
                    user.wallet.bounty += s.bounty;
                    user.wallet.total += amount;
                    user.walletTx.unshift({
                        id: 'tx_' + Date.now(),
                        date: new Date().toISOString(),
                        type: reason,
                        amount: amount,
                        cash: s.cash,
                        bounty: s.bounty,
                        status: 'Completed'
                    });
                    Z.DB.saveUsers();
                    Z.updateHeader();
                    Z.animateReward(amount);
                    Z.toast('+$' + amount.toFixed(2) + ' ($' + s.cash.toFixed(3) + ' Cash, $' + s.bounty.toFixed(3) +
                        ' Bounty)');
                    return true;
                },
                process: function(ownerId, type, targetId, reactionType) {
                    if (!Z.State.currentUser) {
                        Z.openAuthModal('login');
                        Z.toast('Please login first.');
                        return false;
                    }
                    var actor = Z.DB.getUserById(Z.State.currentUser.id);
                    var pkg = Z.Packages[actor.package || 'Free'] || Z.Packages['Free'];
                    if (!pkg.canEarn) {
                        Z.toast('Free users cannot earn rewards. Upgrade!');
                        return false;
                    }
                    var limit = this.checkDaily(actor);
                    if (!limit.allowed) {
                        Z.toast('Daily limit reached (' + limit.limit + '/' + limit.limit + ').');
                        return false;
                    }
                    var owner = Z.DB.getUserById(ownerId);
                    if (!owner || owner.id === actor.id) {
                        Z.toast('Invalid action.');
                        return false;
                    }
                    if (!actor.history) actor.history = {};
                    var key = type + '_' + (targetId || ownerId) + '_' + (reactionType || '');
                    if (actor.history[key]) {
                        Z.toast('Already rewarded for this action.');
                        return false;
                    }

                    var amount = 0.01;
                    if (reactionType && Z.Reactions[reactionType]) {
                        amount = Z.Reactions[reactionType].reward;
                    } else {
                        var settings = owner.bountySettings || {};
                        amount = settings[type] || 0.01;
                    }
                    amount = Math.min(0.05, Math.max(0, amount));

                    if (!owner.wallet) owner.wallet = { cash: 0, bounty: 0, total: 0 };
                    if (owner.wallet.bounty < amount) {
                        Z.toast('Creator bounty insufficient.');
                        return false;
                    }
                    owner.wallet.bounty -= amount;
                    if (!owner.bountySpent) owner.bountySpent = [];
                    owner.bountySpent.unshift({
                        id: 'bs_' + Date.now(),
                        date: new Date().toISOString(),
                        recipient: actor.name,
                        action: type + (reactionType ? ' (' + reactionType + ')' : ''),
                        amount: amount
                    });

                    if (type === 'reaction' || type === 'like') {
                        var post = Z.DB.getPosts().find(function(p) { return p.id === targetId; });
                        if (post) {
                            if (!post.reactions) post.reactions = {};
                            post.reactions[reactionType || 'like'] = (post.reactions[reactionType || 'like'] || 0) +
                            1;
                            if (!post._reactionUsers) post._reactionUsers = {};
                            post._reactionUsers[actor.id] = reactionType || 'like';
                            Z.DB.savePosts();
                        }
                    } else if (type === 'share') {
                        var p2 = Z.DB.getPosts().find(function(p) { return p.id === targetId; });
                        if (p2) {
                            p2.shares = (p2.shares || 0) + 1;
                            Z.DB.savePosts();
                        }
                    } else if (type === 'spark_like') {
                        var spark = Z.DB.getSparks().find(function(s) { return s.id === targetId; });
                        if (spark) {
                            spark.likes = (spark.likes || 0) + 1;
                            Z.DB.saveSparks();
                        }
                    } else if (type === 'connect') {
                        owner.connections = (owner.connections || 0) + 1;
                        if (!actor.connected) actor.connected = [];
                        if (actor.connected.indexOf(owner.id) === -1) actor.connected.push(owner.id);
                    } else if (type === 'circleJoin') {
                        var circles = Z.DB.getCircles();
                        var circle = circles.find(function(c) { return c.id === targetId; });
                        if (circle) {
                            circle.members = (circle.members || 0) + 1;
                            Z.DB.saveCircles(circles);
                        }
                    }

                    actor.history[key] = new Date().toISOString();
                    actor.dailyTracker.count++;
                    Z.DB.saveUsers();
                    this.credit(actor, amount, (type + (reactionType ? ' ' + reactionType : '')).toUpperCase());
                    if (['home', 'spark', 'people', 'circles'].indexOf(Z.State.currentView) !== -1) {
                        Z.showView(Z.State.currentView);
                    }
                    return true;
                }
            };

            Z.animateReward = function(amount) {

                    el.style.boxShadow = '0 0 30px rgba(16,185,129,0.5)';

                        el.style.boxShadow = 'none';

                var note = document.createElement('div');
                note.style.cssText =
                    'position:fixed;z-index:99999;pointer-events:none;top:70px;right:20px;font-size:24px;font-weight:900;color:#10b981;display:flex;align-items:center;gap:6px;opacity:0;transform:translateY(10px);transition:all 0.6s ease;';
                note.innerHTML = '💵 +$' + amount.toFixed(2);
                document.body.appendChild(note);
                requestAnimationFrame(function() {
                    note.style.opacity = '1';
                    note.style.transform = 'translateY(0)';
                });
                setTimeout(function() {
                    note.style.opacity = '0';
                    note.style.transform = 'translateY(-30px)';
                    setTimeout(function() { note.remove(); }, 600);
                }, 1200);
            };

            // STATUS - WhatsApp Style
            // ==========================================================
            function _getUsers() { try { return Z.DB.getUsers(); } catch (e) { return []; } }

            function _getStatuses() { try { return Z.DB.getStatuses(); } catch (e) { return []; } }

            function _saveStatuses(arr) { try { Z.DB.saveStatuses(arr); } catch (e) {} }

            function _userById(id) {
                var users = _getUsers();
                for (var i = 0; i < users.length; i++) {
                    if (String(users[i].id) === String(id)) return users[i];
                }
                return null;
            }

            function _userName(u) { return u ? (u.name || u.username || 'User') : 'User'; }

            function _userAvatar(u) {
                return u && u.avatar ? u.avatar :
                    'https://ui-avatars.com/api/?name=' + encodeURIComponent(_userName(u)) + '&background=111827&color=34d399';
            }

            function _currentUser() { return Z.State.currentUser || Z.DB.getCurrentUser() || null; }

            function _liveStatuses() {
                var now = Date.now();
                var all = _getStatuses();
                var result = [];
                for (var i = 0; i < all.length; i++) {
                    var s = all[i];
                    if (!s) continue;
                    var expires = Number(s.expiresAt || 0);
                    if (expires && expires <= now) continue;
                    var created = Number(s.timestamp || 0);
                    if (created && now - created > 24 * 60 * 60 * 1000) continue;
                    result.push(s);
                }
                result.sort(function(a, b) { return Number(b.timestamp || 0) - Number(a.timestamp || 0); });
                return result;
            }

            Z.getStatusContacts = function() {
                var me = _currentUser();
                var users = _getUsers();
                if (!me) return [];
                var ids = Array.isArray(me.connected) ? me.connected.map(String) : [];
                if (!ids.length) {
                    var result = [];
                    for (var j = 0; j < users.length; j++) {
                        if (String(users[j].id) !== String(me.id)) result.push(users[j]);
                    }
                    return result;
                }
                var filtered = [];
                for (var k = 0; k < users.length; k++) {
                    if (ids.indexOf(String(users[k].id)) !== -1 && String(users[k].id) !== String(me.id)) {
                        filtered.push(users[k]);
                    }
                }
                return filtered;
            };

            Z.getActiveStatuses = function() {
                var all = _liveStatuses();
                var contacts = Z.getStatusContacts();
                var me = _currentUser();
                var allowed = {};
                for (var i = 0; i < contacts.length; i++) { allowed[String(contacts[i].id)] = true; }
                if (me) allowed[String(me.id)] = true;
                var result = [];
                for (var j = 0; j < all.length; j++) {
                    if (allowed[String(all[j].authorId)]) result.push(all[j]);
                }
                return result;
            };

            Z.openCreateStatusModal = function() {
                if (!_currentUser()) { Z.openAuthModal('login'); return; }
                var html = '<div class="modal-overlay"><div class="modal-box"><div class="modal-header"><h3>Add Status <span style="font-size:10px;color:#10b981;">24h</span></h3><button onclick="Z.closeModal()">&times;</button></div>' +
                    '<label>What\'s happening?</label><textarea id="status-text" rows="4" placeholder="Type something..."></textarea>' +
                    '<label>Photo / Video</label><input type="file" id="status-file" accept="image/*,video/*">' +
                    '<button class="btn-primary" onclick="Z.submitStatus()">Publish Status</button>' +
                    '</div></div>';
                Z.openModal(html);
            };

            Z.submitStatus = async function() {
                var text = document.getElementById('status-text').value.trim();
                var file = document.getElementById('status-file');
                var me = _currentUser();
                if (!text && (!file || !file.files || !file.files[0])) { Z.toast('Add text or media.'); return; }
                if (!me) return;

                var media = '';
                var mediaType = '';
                if (file && file.files && file.files[0]) {
                    try {
                        var reader = new FileReader();
                        var data = await new Promise(function(resolve) {
                            reader.onload = function(e) { resolve(e.target.result); };
                            reader.readAsDataURL(file.files[0]);
                        });
                        media = data;
                        mediaType = file.files[0].type.indexOf('video/') === 0 ? 'video' : 'image';
                    } catch (e) { Z.toast('Could not read media.'); return; }
                }

                var now = Date.now();
                var current = _liveStatuses();
                var newStatus = {
                    id: 'st_' + now + '_' + Math.random().toString(36).slice(2),
                    type: 'status',
                    authorId: me.id,
                    content: text || '',
                    media: media || '',
                    mediaType: mediaType || '',
                    timestamp: now,
                    expiresAt: now + 24 * 60 * 60 * 1000,
                    viewedBy: []
                };
                current.unshift(newStatus);
                _saveStatuses(current);
                Z.closeModal();
                Z.toast('Status published for 24 hours.');
                Z.showView('home');
            };

            // ==========================================================
            // STATUS VIEWER
            // ==========================================================
            var _viewerAuthorId = '';
            var _viewerIndex = 0;
            var _viewerStatuses = [];
            var _viewerTimer = null;

            Z.openStatusViewer = function(authorId, index) {
                var all = Z.getActiveStatuses();
                _viewerStatuses = all.filter(function(s) { return String(s.authorId) === String(authorId); });
                _viewerStatuses.sort(function(a, b) { return Number(b.timestamp || 0) - Number(a.timestamp || 0); });
                if (!_viewerStatuses.length) { Z.toast('No active statuses.'); return; }

                var me = _currentUser();
                if (me) {
                    for (var i = 0; i < _viewerStatuses.length; i++) {
                        if (!_viewerStatuses[i].viewedBy) _viewerStatuses[i].viewedBy = [];
                        if (_viewerStatuses[i].viewedBy.indexOf(me.id) === -1) {
                            _viewerStatuses[i].viewedBy.push(me.id);
                        }
                    }
                    _saveStatuses(_getStatuses());
                }

                _viewerAuthorId = String(authorId);
                _viewerIndex = Math.max(0, Math.min(Number(index || 0), _viewerStatuses.length - 1));
                Z.showStatusViewer();
            };

            Z.showStatusViewer = function() {
                var status = _viewerStatuses[_viewerIndex];
                if (!status) { Z.showView('home'); return; }
                var author = _userById(status.authorId);
                if (!author) { Z.showView('home'); return; }

                var stageContent = '';
                if (status.media) {
                    if (status.mediaType === 'video') {
                        stageContent = '<video src="' + Z.escape(status.media) +
                        '" controls autoplay playsinline style="width:100%;height:100%;object-fit:contain;"></video>';
                    } else {
                        stageContent = '<img src="' + Z.escape(status.media) +
                            '" style="width:100%;height:100%;object-fit:contain;" alt="Status">';
                    }
                } else {
                    stageContent = '<div class="text-status">' + Z.escape(status.content || 'No content') + '</div>';
                }

                var total = _viewerStatuses.length;
                var current = _viewerIndex + 1;

                var html = '<div class="status-viewer-overlay" id="status-viewer">' +
                    '<div class="status-viewer-header">' +
                    '<button onclick="Z.closeStatusViewer()" style="background:transparent;border:none;color:#fff;font-size:20px;cursor:pointer;">&times;</button>' +
                    '<div style="display:flex;align-items:center;gap:8px;">' +
                    '<img src="' + Z.escape(_userAvatar(author)) +
                    '" style="width:32px;height:32px;border-radius:50%;object-fit:cover;">' +
                    '<div><div style="font-weight:700;font-size:14px;">' + Z.escape(_userName(author)) +
                    '</div><div style="font-size:10px;color:#94a3b8;">' + current + ' / ' + total + '</div></div>' +
                    '</div>' +
                    '<div style="width:32px;"></div>' +
                    '</div>' +
                    '<div class="status-viewer-body" id="status-viewer-body">' +
                    '<div class="stage" id="status-stage">' + stageContent + '</div>' +
                    '<button onclick="Z.statusPrev()" style="position:absolute;left:8px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.1);color:#fff;font-size:16px;cursor:pointer;">‹</button>' +
                    '<button onclick="Z.statusNext()" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:rgba(0,0,0,0.5);border:1px solid rgba(255,255,255,0.1);color:#fff;font-size:16px;cursor:pointer;">›</button>' +
                    '</div>' +
                    '<div class="status-viewer-footer">' +
                    '<button onclick="Z.statusPrev()">‹ Previous</button>' +
                    '<span style="font-size:10px;color:#64748b;">24h Status</span>' +
                    '<button onclick="Z.statusNext()">Next ›</button>' +
                    '</div>' +
                    '</div>';

                document.body.insertAdjacentHTML('beforeend', html);

                if (status.mediaType !== 'video') {
                    Z.startStatusTimer();
                }

                Z.setupStatusTouch();
            };

            Z.startStatusTimer = function() {
                Z.clearStatusTimer();
                _viewerTimer = setTimeout(function() { Z.statusNext(); }, 7000);
            };

            Z.clearStatusTimer = function() {
                if (_viewerTimer) { clearTimeout(_viewerTimer);
                    _viewerTimer = null; }
            };

            Z.setupStatusTouch = function() {
                var body = document.getElementById('status-viewer-body');
                if (!body) return;
                var paused = false;

                body.addEventListener('pointerdown', function(e) {
                    if (e.target.closest('button') || e.target.closest('video')) return;
                    paused = true;
                    Z.clearStatusTimer();
                });

                body.addEventListener('pointerup', function(e) {
                    if (!paused) return;
                    paused = false;
                    var status = _viewerStatuses[_viewerIndex];
                    if (status && status.mediaType !== 'video') { Z.startStatusTimer(); }
                });

                body.addEventListener('pointerleave', function() {
                    if (!paused) return;
                    paused = false;
                    var status = _viewerStatuses[_viewerIndex];
                    if (status && status.mediaType !== 'video') { Z.startStatusTimer(); }
                });

                var touchX = 0;
                body.addEventListener('touchstart', function(e) {
                    touchX = e.touches[0].clientX;
                }, { passive: true });

                body.addEventListener('touchend', function(e) {
                    var diff = touchX - e.changedTouches[0].clientX;
                    if (Math.abs(diff) > 50) {
                        if (diff > 0) { Z.advanceToNextContact(); } else { Z.advanceToPrevContact(); }
                    }
                }, { passive: true });
            };

            Z.advanceToNextContact = function() {
                var all = Z.getActiveStatuses();
                var map = {};
                for (var i = 0; i < all.length; i++) {
                    var id = String(all[i].authorId);
                    if (!map[id]) map[id] = [];
                    map[id].push(all[i]);
                }
                var keys = Object.keys(map);
                if (keys.length <= 1) { Z.toast('No more contacts.'); return; }
                var idx = keys.indexOf(String(_viewerAuthorId));
                var next = (idx + 1) % keys.length;
                Z.openStatusViewer(keys[next], 0);
            };

            Z.advanceToPrevContact = function() {
                var all = Z.getActiveStatuses();
                var map = {};
                for (var i = 0; i < all.length; i++) {
                    var id = String(all[i].authorId);
                    if (!map[id]) map[id] = [];
                    map[id].push(all[i]);
                }
                var keys = Object.keys(map);
                if (keys.length <= 1) { Z.toast('No more contacts.'); return; }
                var idx = keys.indexOf(String(_viewerAuthorId));
                var prev = (idx - 1 + keys.length) % keys.length;
                Z.openStatusViewer(keys[prev], 0);
            };

            Z.statusPrev = function() {
                Z.clearStatusTimer();
                if (_viewerIndex > 0) { _viewerIndex--;
                    Z.showStatusViewer(); } else { Z.advanceToPrevContact(); }
            };

            Z.statusNext = function() {
                Z.clearStatusTimer();
                if (_viewerIndex < _viewerStatuses.length - 1) { _viewerIndex++;
                    Z.showStatusViewer(); } else { Z.advanceToNextContact(); }
            };

            Z.closeStatusViewer = function() {
                Z.clearStatusTimer();
                var viewer = document.getElementById('status-viewer');
                if (viewer) viewer.remove();
                Z.showView('home');
            };

                for (var i = 0; i < users.length; i++) {

                }
                return { id: 'unknown', name: 'User', username: 'user', role: 'Creator', avatar: '',
                bountySettings: {} };

            function _mediaHtml(media) {
                if (!media) return '';
                var m = String(media);
                if (m.indexOf('data:video/') === 0 || /\.(mp4|webm|ogg)(\?|$)/i.test(m)) {
                    return '<div style="border-radius:12px;overflow:hidden;background:#000;margin-bottom:10px;"><video src="' +

                }

                    return '<div style="border-radius:12px;overflow:hidden;background:#000;margin-bottom:10px;"><img src="' +

            }

            function _hasReacted(p, u, r) {
                return !!(p && u && p._reactionUsers && p._reactionUsers[u.id] === r);
            }

            // ==========================================================
            // POST REACTIONS
            // ==========================================================
            Z.reactToPost = function(postId, reactionType) {
                var actor = _currentUser();
                if (!actor) { Z.openAuthModal('login'); return; }
                var ps = Z.DB.getPosts();
                var p = null;
                for (var i = 0; i < ps.length; i++) {
                    if (ps[i] && ps[i].id === postId) { p = ps[i]; break; }
                }
                if (!p) return;
                p.reactions = p.reactions || {};
                p._reactionUsers = p._reactionUsers || {};

                var oldReact = p._reactionUsers[actor.id];
                if (oldReact && p.reactions[oldReact]) {
                    p.reactions[oldReact] = Math.max(0, Number(p.reactions[oldReact] || 0) - 1);
                    delete p._reactionUsers[actor.id];
                }

                if (reactionType !== 'dislike') {
                    p.reactions[reactionType] = Number(p.reactions[reactionType] || 0) + 1;
                    p._reactionUsers[actor.id] = reactionType;
                }
                Z.DB.savePosts(ps);

                var reward = Z.Reactions[reactionType];
                if (reward && reward.reward > 0) {
                    Z.RewardEngine.process(p.authorId, 'reaction', p.id, reactionType);
                } else {
                    Z.toast('Reaction added!');
                    Z.showView('home');
                }
            };

            // ==========================================================
            // COMMENTS
            // ==========================================================
            Z.toggleComments = function(postId) {
                var el = document.getElementById('comments-' + postId);
                if (el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
            };

            Z.addComment = function(postId) {
                var u = _currentUser();
                if (!u) { Z.openAuthModal('login'); return; }
                var el = document.getElementById('comment-input-' + postId);
                var text = el ? el.value.trim() : '';
                if (!text) return;
                var ps = Z.DB.getPosts();
                var p = null;
                for (var i = 0; i < ps.length; i++) {
                    if (ps[i] && ps[i].id === postId) { p = ps[i]; break; }
                }
                if (!p) return;
                if (!p.comments) p.comments = [];
                p.comments.push({ id: 'c_' + Date.now(), authorId: u.id, author: u.name, text: text, time: new Date()
                        .toISOString() });
                Z.DB.savePosts(ps);
                if (el) el.value = '';
                Z.RewardEngine.process(p.authorId, 'comment', p.id);
                Z.showView('home');
            };

            // ==========================================================
            // SHARE
            // ==========================================================
            Z.sharePost = function(postId) {
                var ps = Z.DB.getPosts();
                var p = null;
                for (var i = 0; i < ps.length; i++) {
                    if (ps[i] && ps[i].id === postId) { p = ps[i]; break; }
                }
                if (!p) return;
                var url = location.href.split('#')[0] + '#post-' + encodeURIComponent(postId);
                var title = 'Check this post on ZYNIX!';

            Z.shareTo = function(platform, url, postId) {
                Z.closeModal();
                var shareUrl = url;
                switch (platform) {
                    case 'whatsapp':
                        shareUrl = 'https://wa.me/?text=' + encodeURIComponent('Check this on ZYNIX: ' + url);
                        break;
                    case 'facebook':
                        shareUrl = 'https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(url);
                        break;
                    case 'twitter':
                        shareUrl = 'https://twitter.com/intent/tweet?text=Check%20this%20on%20ZYNIX!&url=' + encodeURIComponent(
                            url);
                        break;
                    case 'instagram':
                    case 'tiktok':
                    case 'youtube':
                    case 'google':
                        Z.toast('Link copied! Share on ' + platform.charAt(0).toUpperCase() + platform.slice(1));
                        navigator.clipboard.writeText(url);
                        break;
                    case 'copy':
                        navigator.clipboard.writeText(url).then(function() { Z.toast('Link copied!'); });
                        break;
                }
                if (shareUrl !== url && platform !== 'copy' && platform !== 'instagram' && platform !== 'tiktok' &&
                    platform !== 'youtube' && platform !== 'google') {
                    window.open(shareUrl, '_blank');
                }
                var ps = Z.DB.getPosts();
                var p = null;
                for (var i = 0; i < ps.length; i++) {
                    if (ps[i] && ps[i].id === postId) { p = ps[i]; break; }
                }
                if (p) {
                    p.shares = Number(p.shares || 0) + 1;
                    Z.DB.savePosts(ps);
                    if (p.authorId) Z.RewardEngine.process(p.authorId, 'share', p.id);
                }
            };

            // ==========================================================
            // NAVIGATION
            // ==========================================================
            Z.showView = function(view, param) {
                Z.State.currentView = view;
                window.scrollTo(0, 0);

                var btns = document.querySelectorAll('#bottom-nav button:not(.create-btn)');
                for (var i = 0; i < btns.length; i++) {
                    btns[i].classList.remove('active');

                var navMap = { home: 'nav-home', spark: 'nav-spark', circles: 'nav-circles', people: 'nav-people',

                var activeId = navMap[view];
                if (activeId) {

                    setTimeout(function() { Z.renderStatusRow(); }, 100);

                    var el = document.getElementById('composer-text');

            Z.previewComposerFile = function(input) {
                var f = input && input.files && input.files[0];
                if (!f) return;
                var nameEl = document.getElementById('composer-file-name');
                if (nameEl) nameEl.textContent = f.name;
            };

            Z.submitComposer = function() {
                var u = _currentUser();
                if (!u) { Z.openAuthModal('login'); return; }
                var text = document.getElementById('composer-text').value.trim();
                var file = document.getElementById('composer-file');
                if (!text && (!file || !file.files || !file.files[0])) { Z.toast('Write something or attach media.'); return; }

                var finish = function(media) {
                    var ps = Z.DB.getPosts();
                    ps.unshift({
                        id: 'post_' + Date.now(),
                        authorId: u.id,
                        content: text || '',
                        media: media || '',
                        createdAt: 'Just now',
                        reactions: {},
                        _reactionUsers: {},
                        comments: [],
                        shares: 0
                    });
                    Z.DB.savePosts(ps);
                    Z.cancelComposer();
                    Z.toast('Post published!');
                    Z.showView('home');
                };

                if (file && file.files && file.files[0]) {
                    var reader = new FileReader();
                    reader.onload = function(e) { finish(e.target.result); };
                    reader.readAsDataURL(file.files[0]);
                } else {
                    finish('');
                }
            };

            Z.cancelComposer = function() {
                var container = document.getElementById('composer-expanded');
                if (container) container.innerHTML = '';
                var input = document.getElementById('composer-input');
                if (input) input.value = '';
            };

            Z.togglePostOptions = function(postId) {
                var el = document.getElementById('post-options-' + postId);
                if (el) {
                    el.style.display = el.style.display === 'none' ? 'flex' : 'none';
                }
            };

            Z.deletePost = function(postId) {
                if (!confirm('Delete this post?')) return;
                var ps = Z.DB.getPosts();
                var idx = -1;
                for (var i = 0; i < ps.length; i++) {
                    if (ps[i].id === postId) { idx = i; break; }
                }
                if (idx > -1) {
                    ps.splice(idx, 1);
                    Z.DB.savePosts(ps);
                    Z.toast('Post deleted.');
                    Z.showView('home');
                }
            };

            // ==========================================================
            // SPARK RENDER
            // ==========================================================
            Z.renderSpark = function() {
                var sparks = Z.DB.getSparks();
                var filter = (Z.State.sparkFilter || '').toLowerCase();
                var filtered = [];
                for (var i = 0; i < sparks.length; i++) {
                    var s = sparks[i];
                    if (!filter) { filtered.push(s); continue; }
                    var match = false;
                    if (s.tags) {
                        for (var t = 0; t < s.tags.length; t++) {
                            if (s.tags[t].toLowerCase().indexOf(filter) !== -1) { match = true; break; }
                        }
                    }
                    if (match) filtered.push(s);
                }

                    '<div style="display:flex;justify-content:space-between;align-items:center;"><h2 style="font-weight:900;font-size:16px;color:#fff;"><i class="fa-solid fa-bolt" style="color:#10b981;margin-right:8px;"></i>ZYNIX Spark</h2><button onclick="Z.openCreateModal()" style="background:#10b981;border:none;color:#000;font-weight:700;padding:6px 14px;border-radius:8px;font-size:11px;cursor:pointer;">Create</button></div>';

                }

                        'display:flex;align-items:center;justify-content:center;position:relative;">' +

                            .title || '') + '</div>' : '') +

                                .description) + '</div>' : '') +

                    var u = users[i];

                        list.push(u);
                    }
                }
                var me = _currentUser();

                var html =
                    '<div style="display:flex;flex-direction:column;gap:12px;"><div style="display:flex;justify-content:space-between;align-items:center;"><h2 style="font-weight:900;font-size:16px;color:#fff;"><i class="fa-solid fa-users" style="color:#10b981;margin-right:8px;"></i>People</h2></div>' +
                    '<input type="text" id="people-search" placeholder="Search people..." value="' + Z.escape(q) +

                for (var j = 0; j < list.length; j++) {
                    var u = list[j];

                    var isSelf = me && me.id === u.id;
                    var bs = u.bountySettings || { connect: 0.03 };

            Z.submitWithdraw = function() {

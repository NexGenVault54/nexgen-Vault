<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ZYNIX - Complete Social Platform</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#090d16;color:#f8fafc;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding-bottom:80px;overflow-x:hidden}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:#090d16}
::-webkit-scrollbar-thumb{background:#1e293b;border-radius:4px}

.zynix-header{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(9,13,22,.92);backdrop-filter:blur(12px);border-bottom:1px solid #1e293b;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;min-height:56px}
.header-logo{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#10b981,#3b82f6);display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;font-size:14px}
.header-title{font-size:18px;font-weight:900;background:linear-gradient(90deg,#10b981,#3b82f6,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
.header-btn{background:transparent;border:none;color:#94a3b8;cursor:pointer;padding:6px}
.header-btn:hover{color:#fff}
.wallet-pill{background:rgba(15,23,42,.9);border:1px solid #1e293b;border-radius:20px;padding:4px 10px;font-size:10px;display:flex;align-items:center;gap:6px;transition:box-shadow .3s}
.wallet-pill.pulse{box-shadow:0 0 24px rgba(16,185,129,.6)}

.zynix-footer{position:fixed;bottom:0;left:0;right:0;z-index:1000;background:rgba(9,13,22,.95);backdrop-filter:blur(12px);border-top:1px solid #1e293b;padding:8px 0;display:flex;align-items:center;justify-content:space-around;max-width:600px;margin:0 auto}
.zynix-footer button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 0;color:#64748b;transition:color .2s;background:transparent;border:none;font-size:9px;cursor:pointer;font-weight:500}
.zynix-footer button i{font-size:18px;margin-bottom:2px}
.zynix-footer button:hover,.zynix-footer button.active{color:#10b981}
.zynix-footer .create-btn{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#10b981,#3b82f6);color:#000;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:-16px;box-shadow:0 4px 20px rgba(16,185,129,.3);flex:none}
.zynix-footer .create-btn i{font-size:20px;margin:0}

#app-container{max-width:600px;margin:0 auto;padding:76px 14px 20px;min-height:calc(100vh - 80px)}

.status-row-wrap{background:#111827;border:1px solid #1e293b;border-radius:16px;padding:12px;margin-bottom:14px}
.status-scroll{display:flex;gap:10px;overflow-x:auto;padding:4px 0;scrollbar-width:none;-ms-overflow-style:none}
.status-scroll::-webkit-scrollbar{display:none}
.status-item{flex-shrink:0;width:68px;text-align:center;background:transparent;border:none;cursor:pointer;padding:0}
.status-ring-unseen{background:linear-gradient(135deg,#10b981,#3b82f6,#8b5cf6);padding:3px;border-radius:50%;width:58px;height:58px;margin:0 auto}
.status-ring-seen{background:#1e293b;padding:3px;border-radius:50%;width:58px;height:58px;margin:0 auto}
.status-ring-inner{width:100%;height:100%;border-radius:50%;background:#090d16;padding:2px}
.status-ring-inner img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.status-label{font-size:9px;font-weight:600;color:#94a3b8;display:block;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}

.status-home-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding:8px 0}
.status-home-card{text-align:center;background:transparent;border:none;cursor:pointer;padding:8px 4px;border-radius:12px}
.status-home-card:hover{background:#111827}
.status-home-ring-unseen{background:linear-gradient(135deg,#10b981,#3b82f6,#8b5cf6);padding:4px;border-radius:50%;width:88px;height:88px;margin:0 auto}
.status-home-ring-seen{background:#1e293b;padding:4px;border-radius:50%;width:88px;height:88px;margin:0 auto}
.status-home-ring-inner{width:100%;height:100%;border-radius:50%;background:#090d16;padding:3px}
.status-home-ring-inner img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.status-home-name{font-size:11px;font-weight:600;color:#e2e8f0;display:block;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status-home-count{font-size:9px;color:#64748b;display:block;margin-top:2px}

.status-bg-deep-blue{background:linear-gradient(135deg,#1e3a8a,#312e81);color:#fff}
.status-bg-navy{background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff}
.status-bg-purple{background:linear-gradient(135deg,#4c1d95,#5b21b6);color:#fff}
.status-bg-teal{background:linear-gradient(135deg,#0d9488,#0f766e);color:#fff}
.status-bg-green{background:linear-gradient(135deg,#065f46,#047857);color:#fff}
.status-bg-burgundy{background:linear-gradient(135deg,#7f1d1d,#991b1b);color:#fff}
.status-bg-rose{background:linear-gradient(135deg,#9f1239,#be123c);color:#fff}
.status-bg-plum{background:linear-gradient(135deg,#581c87,#701a75);color:#fff}
.status-bg-slate{background:linear-gradient(135deg,#334155,#475569);color:#fff}

.status-viewer-overlay{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.98);display:flex;flex-direction:column;color:#fff}
.status-viewer-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.05);flex-shrink:0}
.status-viewer-body{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0;overflow:hidden;touch-action:none}
.status-stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#000;height:clamp(320px,58vh,620px);position:relative;border-radius:12px;overflow:hidden}
.status-stage img,.status-stage video{width:100%;height:100%;object-fit:contain;max-width:100%;max-height:100%}
.status-nav-btn{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1);color:#fff;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;z-index:10}
.status-nav-btn.left{left:10px}
.status-nav-btn.right{right:10px}
.status-viewer-footer{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid rgba(255,255,255,.05);flex-shrink:0;height:68px}
.status-viewer-footer button{padding:8px 20px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#fff;font-size:12px;cursor:pointer;font-weight:600}
.status-progress-bar{position:absolute;top:0;left:0;height:3px;background:#10b981;z-index:20;transition:width .1s linear}
.status-progress-track{position:absolute;top:0;left:0;right:0;height:3px;background:rgba(255,255,255,.1);z-index:19}

.circle-x-btn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.colored-back-btn{background:#10b981;color:#000;border:none;padding:8px 16px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}

.post-card{background:#111827;border:1px solid #1e293b;border-radius:16px;padding:14px;margin-bottom:12px;position:relative}
.post-author{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.post-author img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:1px solid #1e293b}
.post-author .pname{font-weight:700;font-size:13px;color:#fff}
.post-author .phandle{font-size:10px;color:#64748b}
.post-content{font-size:13px;color:#e2e8f0;line-height:1.6;margin-bottom:10px;white-space:pre-wrap;word-break:break-word}
.post-media{border-radius:12px;overflow:hidden;margin-bottom:10px;background:#000}
.post-media img,.post-media video{width:100%;max-height:400px;object-fit:cover;display:block}

.post-reactions{display:flex;flex-wrap:wrap;gap:4px;padding:8px 0;border-top:1px solid #1e293b}
.react-btn{padding:5px 8px;border-radius:14px;font-size:14px;background:transparent;border:1px solid transparent;cursor:pointer;display:inline-flex;flex-direction:column;align-items:center;gap:1px;color:#fff;transition:all .15s;min-width:44px}
.react-btn:hover{background:#1e293b}
.react-btn.active{background:rgba(16,185,129,.15);border-color:rgba(16,185,129,.3)}
.react-btn .count{font-size:10px;color:#64748b;font-weight:700;line-height:1}
.react-btn .bounty{font-size:8px;color:#10b981;font-weight:700;line-height:1}
.react-btn.active .count{color:#10b981}
.react-star{filter:drop-shadow(0 0 6px rgba(96,165,250,.9)) drop-shadow(0 0 12px rgba(147,197,253,.5))}

.clap-premium{display:inline-block;position:relative;filter:drop-shadow(0 0 4px rgba(251,191,36,.85)) drop-shadow(0 0 8px rgba(245,158,11,.5));animation:clapPulse 2s ease-in-out infinite}
.clap-premium::before,.clap-premium::after{content:'';position:absolute;width:3px;height:3px;border-radius:50%;background:#fbbf24;opacity:.9;box-shadow:0 0 6px rgba(251,191,36,.9)}
.clap-premium::before{top:-2px;left:2px;animation:clapSpark1 2s ease-in-out infinite}
.clap-premium::after{bottom:-2px;right:2px;animation:clapSpark2 2s ease-in-out infinite}
@keyframes clapPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
@keyframes clapSpark1{0%,100%{opacity:0;transform:translate(0,0) scale(.5)}50%{opacity:1;transform:translate(-3px,-4px) scale(1)}}
@keyframes clapSpark2{0%,100%{opacity:0;transform:translate(0,0) scale(.5)}50%{opacity:1;transform:translate(3px,3px) scale(1)}}

.post-actions{display:flex;gap:14px;padding-top:8px;border-top:1px solid #1e293b;font-size:12px;color:#64748b}
.post-actions button{background:transparent;border:none;color:#64748b;cursor:pointer;font-size:12px;display:flex;align-items:center;gap:4px;padding:4px 0}
.post-actions button:hover{color:#e2e8f0}

.post-menu-wrap{position:relative}
.post-menu{position:absolute;top:100%;right:0;background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:6px;min-width:180px;z-index:50;box-shadow:0 8px 32px rgba(0,0,0,.6)}
.post-menu button{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:none;color:#e2e8f0;padding:10px 12px;border-radius:8px;font-size:12px;cursor:pointer;text-align:left}
.post-menu button:hover{background:#1e293b}
.post-menu button.danger{color:#fca5a5}
.post-menu button i{width:14px;text-align:center;font-size:12px}

.post-comments{margin-top:10px;padding-top:10px;border-top:1px solid #1e293b;display:none}
.post-comments.open{display:block}
.comment-item{padding:10px 12px;border-radius:12px;margin-bottom:6px;font-size:12px;word-break:break-word}
.comment-item .cname{font-weight:700;margin-right:6px;opacity:.9}
.comment-item .ctext{white-space:pre-wrap}
.comment-item.light-green{background:#dcfce7;color:#052e16}
.comment-item.light-blue{background:#dbeafe;color:#172554}
.comment-item.light-yellow{background:#fef3c7;color:#451a03}
.comment-item.light-pink{background:#fce7f3;color:#500724}
.comment-item.light-purple{background:#ede9fe;color:#2e1065}
.comment-item.hidden-comment{opacity:.5;font-style:italic}
.comment-reactions{display:flex;flex-wrap:wrap;gap:2px;margin-top:6px}
.comment-react{background:rgba(0,0,0,.06);border:none;padding:2px 6px;border-radius:10px;font-size:11px;cursor:pointer;display:inline-flex;align-items:center;gap:2px;color:inherit;opacity:.75}
.comment-react:hover{opacity:1}
.comment-react.active{background:rgba(16,185,129,.25);opacity:1;font-weight:700}
.comment-react .cb{font-size:8px;color:#059669;font-weight:700}
.comment-actions{display:flex;gap:12px;margin-top:4px;font-size:10px;opacity:.7}
.comment-actions button{background:transparent;border:none;color:inherit;cursor:pointer;font-size:10px;padding:0;font-weight:600;text-decoration:underline;opacity:.8}
.comment-actions button:hover{opacity:1}
.comment-color-picker{display:flex;gap:6px;margin-top:6px;margin-bottom:4px}
.comment-color-dot{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.comment-color-dot.selected{border-color:#10b981}
.comment-color-dot.c-green{background:#dcfce7}
.comment-color-dot.c-blue{background:#dbeafe}
.comment-color-dot.c-yellow{background:#fef3c7}
.comment-color-dot.c-pink{background:#fce7f3}
.comment-color-dot.c-purple{background:#ede9fe}
.comment-input-wrap{display:flex;gap:8px;margin-top:8px;align-items:flex-end}
.comment-input-wrap textarea{flex:1;background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:10px 12px;font-size:12px;color:#fff;outline:none;resize:none;max-height:150px;font-family:inherit;min-height:38px}
.comment-input-wrap textarea:focus{border-color:#10b981}
.comment-input-wrap button{background:#10b981;border:none;color:#000;font-weight:700;padding:8px 16px;border-radius:8px;font-size:11px;cursor:pointer;height:38px}

.modal-overlay{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:#111827;border:1px solid #1e293b;border-radius:16px;max-width:440px;width:100%;max-height:90vh;overflow-y:auto;padding:20px}
.modal-header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1e293b;padding-bottom:12px;margin-bottom:16px}
.modal-header h3{font-size:16px;font-weight:700;color:#fff}
.modal-close{width:36px;height:36px;border-radius:50%;background:#1e293b;border:none;color:#94a3b8;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.form-label{display:block;font-size:11px;font-weight:600;color:#64748b;margin-bottom:4px}
.form-input,.form-select,.form-textarea{width:100%;background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:10px 12px;font-size:12px;color:#fff;outline:none;margin-bottom:12px;font-family:inherit}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:#10b981}
.form-textarea{min-height:90px;resize:vertical}
.btn-primary{width:100%;background:#10b981;border:none;color:#000;font-weight:700;padding:12px;border-radius:10px;font-size:13px;cursor:pointer}
.btn-secondary{width:100%;background:#1e293b;border:none;color:#fff;font-weight:600;padding:10px;border-radius:8px;font-size:12px;cursor:pointer;margin-top:8px}
.forgot-link{text-align:right;font-size:11px;color:#10b981;cursor:pointer;margin-bottom:12px;text-decoration:underline}

.media-preview-box{margin-top:8px;border-radius:10px;overflow:hidden;border:1px solid #1e293b;background:#0f172a;position:relative;display:none}
.media-preview-box.show{display:block}
.media-preview-box img,.media-preview-box video{width:100%;max-height:240px;object-fit:contain;display:block;background:#000}
.media-preview-remove{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.85);color:#fff;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.15)}

.share-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.share-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:10px;background:#0f172a;border:1px solid #1e293b;cursor:pointer;font-size:9px;color:#94a3b8}
.share-item:hover{border-color:#10b981;background:#111827}
.share-item i{font-size:20px}
.share-item.wa i{color:#25D366}
.share-item.fb i{color:#1877F2}
.share-item.ig i{color:#E4405F}
.share-item.tt i{color:#fff}
.share-item.tw i{color:#fff}
.share-item.yt i{color:#FF0000}
.share-item.gd i{color:#4285F4}
.share-item.cp i{color:#10b981}

.spark-feed-container{position:fixed;top:56px;left:0;right:0;bottom:80px;max-width:600px;margin:0 auto;overflow-y:scroll;overflow-x:hidden;scroll-snap-type:y mandatory;scrollbar-width:none;-ms-overflow-style:none;background:#000;touch-action:pan-y;z-index:50}
.spark-feed-container::-webkit-scrollbar{display:none}
.spark-slide{position:relative;width:100%;height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}
.spark-slide video{width:100%;height:100%;object-fit:contain;background:#000;display:block}
.spark-top-gradient{position:absolute;top:0;left:0;right:0;height:100px;background:linear-gradient(to bottom,rgba(0,0,0,.7),transparent);pointer-events:none;z-index:2}
.spark-bottom-gradient{position:absolute;bottom:0;left:0;right:0;height:200px;background:linear-gradient(to top,rgba(0,0,0,.85),transparent);pointer-events:none;z-index:2}
.spark-info{position:absolute;bottom:16px;left:12px;right:100px;z-index:3;color:#fff}
.spark-info-author{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.spark-info-author img{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid #fff}
.spark-info-author .sname{font-weight:700;font-size:13px}
.spark-info-author .shandle{font-size:10px;color:#cbd5e1}
.spark-info-caption{font-size:12px;line-height:1.4;color:#f1f5f9;margin-bottom:6px;max-height:80px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.spark-info-tags{font-size:10px;color:#10b981;font-weight:600}
.spark-info-tags button{background:transparent;border:none;color:#10b981;font-weight:600;font-size:10px;cursor:pointer;margin-right:4px}
.spark-actions-stack{position:absolute;right:8px;bottom:16px;display:flex;flex-direction:column;align-items:center;gap:10px;z-index:3}
.spark-action-btn{display:flex;flex-direction:column;align-items:center;gap:2px;background:transparent;border:none;cursor:pointer;color:#fff;font-size:10px;padding:4px}
.spark-action-icon{width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.35);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;font-size:20px;border:1px solid rgba(255,255,255,.15)}
.spark-action-count{font-size:10px;font-weight:600;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.spark-action-reactions{display:flex;flex-direction:column;gap:6px;padding:6px;background:rgba(0,0,0,.4);backdrop-filter:blur(8px);border-radius:24px;border:1px solid rgba(255,255,255,.1)}
.spark-reaction-icon{width:38px;height:38px;border-radius:50%;background:transparent;border:none;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;position:relative}
.spark-reaction-icon.active{background:rgba(16,185,129,.3)}
.spark-reaction-label{font-size:8px;color:#10b981;font-weight:700;position:absolute;bottom:-4px;right:-6px;background:rgba(0,0,0,.75);border-radius:6px;padding:1px 4px}
.spark-menu{position:absolute;top:64px;right:8px;background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:6px;min-width:170px;z-index:20;box-shadow:0 8px 32px rgba(0,0,0,.6)}
.spark-menu button{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border:none;color:#e2e8f0;padding:10px 12px;border-radius:8px;font-size:12px;cursor:pointer;text-align:left}
.spark-menu button:hover{background:#1e293b}
.spark-menu button.danger{color:#fca5a5}

.bottom-sheet{position:fixed;left:0;right:0;bottom:0;z-index:10001;background:#111827;border-top-left-radius:20px;border-top-right-radius:20px;border-top:1px solid #1e293b;max-height:70vh;display:flex;flex-direction:column;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:40px;height:4px;background:#334155;border-radius:2px;margin:8px auto 0}
.sheet-header{padding:12px 16px;border-bottom:1px solid #1e293b;display:flex;align-items:center;justify-content:space-between}
.sheet-body{padding:12px 16px;overflow-y:auto;flex:1}
.sheet-footer{padding:12px 16px;border-top:1px solid #1e293b;display:flex;gap:8px}

.circle-card{background:#111827;border:1px solid #1e293b;border-radius:16px;padding:14px;margin-bottom:10px}
.circle-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.circle-head-left{display:flex;align-items:center;gap:10px}
.circle-head-left img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:1px solid #1e293b}
.circle-name{font-weight:700;font-size:13px;color:#fff}
.circle-meta{font-size:10px;color:#64748b}

Z.uploadToStorage = async function(file, folder){
  var c = sb(); if(!c) return null;
  var me = Z.State.currentUser; if(!me) return null;
  try {
    var ext = 'bin';
    if(file.name && file.name.indexOf('.') > -1) ext = file.name.split('.').pop().toLowerCase();
    else if(file.type){
      var m = { 'image/jpeg':'jpg','image/png':'png','image/webp':'webp','image/gif':'gif',
                'video/mp4':'mp4','video/webm':'webm','video/quicktime':'mov' };
      ext = m[file.type] || 'bin';
    }
    var path = me.id + '/' + (folder||'misc') + '/' + Date.now() + '_' + Math.random().toString(36).slice(2,8) + '.' + ext;
    var r = await c.storage.from('media').upload(path, file, {
      cacheControl: '31536000',
      upsert: false,
      contentType: file.type || 'application/octet-stream'
    });
    if(r.error){ console.warn('upload', r.error); return null; }
    var pub = c.storage.from('media').getPublicUrl(path);
    return (pub && pub.data && pub.data.publicUrl) || null;
  } catch(e){ console.warn('uploadToStorage', e); return null; }
};

var MEDIA_DB='zynix_media_v1', MEDIA_STORE='media', _dbPromise=null;
function openMediaDB(){
  if(_dbPromise) return _dbPromise;
  _dbPromise = new Promise(function(resolve,reject){
    if(!window.indexedDB){ reject(new Error('No IDB')); return; }
    var req = indexedDB.open(MEDIA_DB,1);
    req.onupgradeneeded = function(e){
      var db = e.target.result;
      if(!db.objectStoreNames.contains(MEDIA_STORE)) db.createObjectStore(MEDIA_STORE,{keyPath:'id'});
    };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  });
  return _dbPromise;
}
Z.loadMedia = async function(ref){
  if(!ref) return '';
  ref = String(ref);
  if(ref.indexOf('idb:') !== 0) return ref;
  var id = ref.slice(4);
  try {
    var db = await openMediaDB();
    return new Promise(function(resolve){
      var tx = db.transaction(MEDIA_STORE,'readonly');
      var req = tx.objectStore(MEDIA_STORE).get(id);
      req.onsuccess = function(){
        var item = req.result;
        if(!item||!item.blob){ resolve(''); return; }
        resolve(URL.createObjectURL(item.blob));
      };
      req.onerror = function(){ resolve(''); };
    });
  } catch(e){ return ''; }
};

Z.toggleTheme = function(){

};

Z.animateDollar = function(amount){

  setTimeout(function(){ wrap.remove(); }, 1700);
};

Z.RewardEngine = {
  async awardReaction(reactorId, ownerId, contentId, reactionType){
    var r = Z.Reactions[reactionType];
    if(!r || r.reward <= 0) return false;
    if(reactorId === ownerId) return false;
    await Z.DB.creditReward(ownerId, r.reward, 'REACTION_'+reactionType.toUpperCase());
    return true;
  }
};

Z.renderHeaderAuth = function(){
  var c = document.getElementById('header-auth-container'); if(!c) return;
  var u = Z.State.currentUser;
  if(u){
    c.innerHTML = '<div style="display:flex;align-items:center;gap:6px;"><button onclick="Z.showView(\'profile\')" style="background:transparent;border:none;cursor:pointer;padding:0;"><img src="' + Z.escape(Z.displayAvatar(u)) + '" style="width:28px;height:28px;border-radius:50%;object-fit:cover;border:1px solid rgba(16,185,129,.5);"></button><button onclick="Z.logout()" style="background:#1e293b;border:none;color:#94a3b8;cursor:pointer;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;"><i class="fa-solid fa-power-off" style="font-size:10px;"></i></button></div>';
  } else {
    c.innerHTML = '<button onclick="Z.openAuthModal(\'login\')" style="background:#10b981;border:none;color:#000;font-weight:700;font-size:11px;padding:6px 14px;border-radius:20px;cursor:pointer;">Login</button>';
  }
};

// ============================================================
// AUTH
// ============================================================
Z.openAuthModal = function(mode){
  var isLogin = mode === 'login';
  Z.openModal(
    '<div class="modal-overlay" onclick="if(event.target===this)Z.closeModal()"><div class="modal-box">' +
    '<div class="modal-header"><h3>' + (isLogin ? 'Login' : 'Create Account') + '</h3><button class="modal-close" onclick="Z.closeModal()"><i class="fa-solid fa-xmark"></i></button></div>' +
    (!isLogin ? '<label class="form-label">Full Name</label><input type="text" id="auth-name" class="form-input" placeholder="Your name">' : '') +
    '<label class="form-label">Email</label><input type="email" id="auth-email" class="form-input" placeholder="email@example.com" autocomplete="email">' +
    '<label class="form-label">Password</label><input type="password" id="auth-password" class="form-input" placeholder="••••••••" autocomplete="' + (isLogin?'current-password':'new-password') + '">' +
    (!isLogin ? '<label class="form-label">Referral Code (Optional)</label><input type="text" id="auth-refcode" class="form-input" placeholder="ZYNIX-XXXXXX">' : '') +
    '<button class="btn-primary" id="auth-submit" onclick="Z.handleAuth(\'' + mode + '\')">' + (isLogin?'Login':'Sign Up') + '</button>' +
    (isLogin ? '<div class="forgot-link" onclick="Z.forgotPassword()">Forgot password?</div>' : '') +
    '<button class="btn-secondary" onclick="Z.openAuthModal(\'' + (isLogin?'signup':'login') + '\')">' + (isLogin?"Don't have account? Sign Up":"Have account? Login") + '</button>' +
    '</div></div>'
  );
};

Z.handleAuth = async function(mode){
  var email = ((document.getElementById('auth-email')||{}).value || '').trim();
  var pass = (document.getElementById('auth-password')||{}).value || '';
  if(!email || !pass){ Z.toast('Please enter email and password.'); return; }
  var btn = document.getElementById('auth-submit');
  if(btn){ btn.disabled = true; btn.textContent = 'Please wait...'; }
  var c = sb();
  if(!c){ if(btn){ btn.disabled=false; btn.textContent = mode==='login'?'Login':'Sign Up'; } Z.toast('Supabase not ready.'); return; }
  try {
    if(mode === 'login'){
      var r = await c.auth.signInWithPassword({email: email, password: pass});
      if(r.error) throw r.error;
      Z.toast('Logged in!');
    } else {
      var name = ((document.getElementById('auth-name')||{}).value || 'New User').trim() || 'New User';
      var ref = ((document.getElementById('auth-refcode')||{}).value || '').trim();
      var refId = null;
      if(ref){
        var pr = await c.from('profiles').select('id').eq('referral_code', ref.toUpperCase()).maybeSingle();
        if(pr.data) refId = pr.data.id;
      }
      var sr = await c.auth.signUp({email: email, password: pass, options:{data:{name: name, referred_by: refId}}});
      if(sr.error) throw sr.error;
      Z.toast('Account created!');
    }
    Z.closeModal();
    await Z.refreshSession();
    await Z.reloadData();
    Z.showView('home');
  } catch(e){
    console.warn('auth error', e);
    Z.toast(e.message || 'Authentication failed.');
  } finally {
    if(btn){ btn.disabled = false; btn.textContent = mode==='login'?'Login':'Sign Up'; }
  }
};

Z.forgotPassword = async function(){
  var email = ((document.getElementById('auth-email')||{}).value || '').trim();
  if(!email){ email = prompt('Enter your email for password reset:'); }
  if(!email) return;
  var c = sb(); if(!c) return;
  try {
    var r = await c.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
    if(r.error) throw r.error;
    Z.toast('Password reset link sent. Check your email.');
  } catch(e){ Z.toast(e.message || 'Could not send reset email.'); }
};

Z.openResetPasswordModal = function(){
  Z.openModal(
    '<div class="modal-overlay"><div class="modal-box">' +
    '<div class="modal-header"><h3>Set New Password</h3></div>' +
    '<label class="form-label">New Password</label><input type="password" id="reset-pass" class="form-input" placeholder="••••••••">' +
    '<label class="form-label">Confirm Password</label><input type="password" id="reset-pass2" class="form-input" placeholder="••••••••">' +
    '<button class="btn-primary" onclick="Z.submitResetPassword()">Update Password</button>' +
    '</div></div>'
  );
};

Z.submitResetPassword = async function(){
  var p1 = (document.getElementById('reset-pass')||{}).value || '';
  var p2 = (document.getElementById('reset-pass2')||{}).value || '';
  if(!p1 || p1 !== p2){ Z.toast('Passwords do not match.'); return; }
  var c = sb();
  try {
    var r = await c.auth.updateUser({password: p1});
    if(r.error) throw r.error;
    Z.toast('Password updated!');
    Z.closeModal();
    window.history.replaceState({}, document.title, location.pathname);
    await Z.refreshSession();
    Z.showView('home');
  } catch(e){ Z.toast(e.message || 'Failed.'); }
};

Z.logout = async function(){
  var c = sb(); if(c) await c.auth.signOut();
  Z.State.currentUser = null;
  Z.State.allProfiles = [];
  Z.State.allConnections = [];
  Z.State.myInterests = {};
  Z.State.savedPosts = [];
  Z.State.savedSparks = [];
  Z.renderHeaderAuth();
  Z.updateHeader();
  Z.toast('Logged out.');
  Z.showView('home');
};

Z.refreshSession = async function(){
  var c = sb(); if(!c){ Z.renderHeaderAuth(); return; }
  try {
    var s = await c.auth.getSession();
    var user = s.data && s.data.session ? s.data.session.user : null;
    if(!user){ Z.State.currentUser = null; Z.renderHeaderAuth(); Z.updateHeader(); return; }
    var pr = await c.from('profiles').select('*').eq('id', user.id).maybeSingle();
    var profile = pr.data || {
      id: user.id,
      name: (user.user_metadata && user.user_metadata.name) || 'New User',
      email: user.email,
      referral_code: '',
      wallet_cash: 0, wallet_bounty: 0, wallet_total: 0
    };
    Z.State.currentUser = profile;
    Z.renderHeaderAuth();
    Z.updateHeader();
  } catch(e){ console.warn('refreshSession', e); }
};

Z.getProfileById = function(id){
  var arr = Z.State.allProfiles || [];
  for(var i=0;i<arr.length;i++) if(arr[i].id === id) return arr[i];
  return null;
};
Z.displayName = function(p){ return p ? (p.name || p.username || 'User') : 'User'; };
Z.displayAvatar = function(p){ return (p && p.avatar) ? p.avatar : 'https://ui-avatars.com/api/?name='+encodeURIComponent(p? (p.name||'U') : 'U')+'&background=111827&color=34d399'; };

// ============================================================
// CONNECTIONS
// ============================================================
Z.getConnectionState = function(otherId){
  var me = Z.State.currentUser;
  if(!me) return {state:'guest'};
  if(!otherId || me.id === otherId) return {state:'self'};
  var conns = Z.State.allConnections || [];
  for(var i=0;i<conns.length;i++){
    var c = conns[i];
    var mine = (c.requester_id === me.id && c.receiver_id === otherId);
    var theirs = (c.requester_id === otherId && c.receiver_id === me.id);
    if(!mine && !theirs) continue;
    if(c.status === 'accepted') return {state:'accepted', record:c, direction: mine?'out':'in'};
    if(c.status === 'pending') return {state:'pending', record:c, direction: mine?'out':'in'};
    if(c.status === 'rejected') return {state:'rejected', record:c, direction: mine?'out':'in'};
    if(c.status === 'cancelled') return {state:'cancelled', record:c, direction: mine?'out':'in'};
  }
  return {state:'none'};
};

Z.getConnectBounty = function(profile){
  if(!profile) return 0;
  var bs = profile.bounty_settings || {};
  var v = bs.connect;
  if(v == null) return 0.03;
  return Number(v) || 0;
};

Z.connectTo = async function(userId){
  var me = Z.State.currentUser; if(!me){ Z.openAuthModal('login'); return; }
  if(me.id === userId){ Z.toast('Cannot connect to yourself.'); return; }
  var c = sb(); if(!c) return;
  var st = Z.getConnectionState(userId);
  if(st.state === 'accepted'){ Z.toast('Already connected.'); return; }
  if(st.state === 'pending'){
    if(st.direction === 'out'){ Z.toast('Request already sent.'); return; }
    Z.toast('They already sent you a request. Approve it.'); return;
  }
  var r = await c.from('connections').insert({ requester_id: me.id, receiver_id: userId, status: 'pending' });
  if(r.error){ Z.toast('Could not send request.'); console.warn(r.error); return; }
  Z.addNotification(userId, 'connection_request', (me.name||'Someone') + ' sent you a connection request.');
  Z.toast('Connection request sent.');
  await Z.reloadData(); Z.showView(Z.State.currentView || 'people');
};

Z.approveConnection = async function(connId){
  var c = sb(); if(!c) return;
  var r = await c.from('connections').update({ status:'accepted' }).eq('id', connId).select().maybeSingle();
  if(r.error){ Z.toast('Failed.'); return; }
  var me = Z.State.currentUser;
  if(r.data && r.data.requester_id !== me.id){
    Z.addNotification(r.data.requester_id, 'connection_accepted', (me.name||'Someone') + ' accepted your connection.');
  }
  Z.toast('Connected!');
  await Z.reloadData(); Z.showView(Z.State.currentView || 'home');
};

Z.rejectConnection = async function(connId){
  var c = sb(); if(!c) return;
  var r = await c.from('connections').update({ status:'rejected' }).eq('id', connId);
  if(r.error){ Z.toast('Failed.'); return; }
  Z.toast('Request rejected.');
  await Z.reloadData(); Z.showView(Z.State.currentView || 'home');
};

Z.cancelConnection = async function(connId){
  var c = sb(); if(!c) return;
  var r = await c.from('connections').delete().eq('id', connId);
  if(r.error){ Z.toast('Failed.'); return; }
  Z.toast('Request cancelled.');
  await Z.reloadData(); Z.showView(Z.State.currentView || 'people');
};

Z.renderConnectButton = function(otherId){
  var other = Z.getProfileById(otherId);
  var st = Z.getConnectionState(otherId);
  var bounty = Z.getConnectBounty(other);
  var tag = '<span class="bounty-tag">$' + bounty.toFixed(2) + '</span>';

  if(st.state === 'guest'){
    return '<button class="connect-btn" onclick="Z.openAuthModal(\'login\')">Connect ' + tag + '</button>';
  }
  if(st.state === 'self') return '<span style="font-size:10px;color:#64748b;padding:4px 12px;background:#0f172a;border-radius:8px;">You</span>';
  if(st.state === 'accepted'){
    return '<button class="connect-btn connected">Connected ' + tag + '</button>';
  }
  if(st.state === 'pending'){
    if(st.direction === 'out'){
      return '<button class="connect-btn connecting" onclick="Z.cancelConnection(\'' + Z.escape(st.record.id) + '\')">Connecting ' + tag + '</button>';
    } else {
      return '<div class="connect-actions">' +
        '<button class="approve" onclick="Z.approveConnection(\'' + Z.escape(st.record.id) + '\')">Approve</button>' +
        '<button class="reject" onclick="Z.rejectConnection(\'' + Z.escape(st.record.id) + '\')">Reject</button></div>';
    }
  }
  return '<button class="connect-btn" onclick="Z.connectTo(\'' + Z.escape(otherId) + '\')">Connect ' + tag + '</button>';
};

window.Z = Z;
})();
</script>
<script>
(function(){
'use strict';
var Z = window.Z;
if(!Z){ console.error('Z missing'); return; }

function _cu(){ return Z.State.currentUser; }
function _p(id){ return Z.getProfileById(id); }
function RK(){ return Z.REACTION_KEYS(); }

function _timeAgo(ts){
  var d = Date.now() - (ts||0);
  var m = Math.floor(d/60000);
  if(m < 1) return 'just now';
  if(m < 60) return m+'m ago';
  var h = Math.floor(m/60);
  if(h < 24) return h+'h ago';
  return Math.floor(h/24)+'d ago';
}

Z._timeAgo = _timeAgo;

// ============================================================
// HOME FEED — only own + connected users
// ============================================================
Z.getConnectedIds = function(){
  var me = _cu(); var out = {};
  if(!me) return out;
  (Z.State.allConnections||[]).forEach(function(c){
    if(c.status !== 'accepted') return;
    if(c.requester_id === me.id) out[c.receiver_id] = true;
    if(c.receiver_id === me.id) out[c.requester_id] = true;
  });
  return out;
};

Z.getFeedPosts = function(){
  var me = _cu();
  var posts = (Z.State.allPosts || []).slice();
  if(!me) return posts;
  var conn = Z.getConnectedIds();
  var interests = Z.State.myInterests || {};
  return posts.filter(function(p){
    if(interests['post:'+p.id] === 'not_interested') return false;
    if(p.author_id === me.id) return true;
    if(conn[p.author_id]) return true;
    return false;
  }).sort(function(a,b){
    var ai = interests['post:'+a.id] === 'interested' ? 1 : 0;
    var bi = interests['post:'+b.id] === 'interested' ? 1 : 0;
    if(ai !== bi) return bi - ai;
    return new Date(b.created_at) - new Date(a.created_at);
  });
};

Z.renderHome = function(){
  var me = _cu();
  var posts = Z.getFeedPosts();
  var profiles = Z.State.allProfiles || [];

  var html = '<div style="display:flex;flex-direction:column;gap:14px;">';
  html += '<div id="home-status-host"></div>';

  if(me){
    html += '<div style="background:#111827;border:1px solid #1e293b;border-radius:16px;padding:12px;display:flex;align-items:center;gap:10px;"><img src="' + Z.escape(Z.displayAvatar(me)) + '" style="width:36px;height:36px;border-radius:50%;object-fit:cover;"><input type="text" id="composer-input" placeholder="What do you think?" style="flex:1;background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:9px 14px;font-size:12px;color:#fff;outline:none;" onfocus="Z.expandComposer()"></div>';
  } else {
    html += '<div style="background:#111827;border:1px solid #1e293b;border-radius:16px;padding:12px;text-align:center;"><button onclick="Z.openAuthModal(\'login\')" style="background:#10b981;border:none;color:#000;font-weight:700;padding:8px 20px;border-radius:10px;font-size:12px;cursor:pointer;">Login to post</button></div>';
  }
  html += '<div id="composer-expanded"></div>';

  if(posts.length){
    posts.forEach(function(p){ html += Z.renderPost(p, profiles); });
  } else {
    html += '<div class="empty-state"><i class="fa-regular fa-newspaper"></i><p>No posts yet. Connect with people to see their posts here.</p></div>';
  }
  html += '</div>';
  return html;
};

Z.renderPost = function(p, profiles){
  profiles = profiles || Z.State.allProfiles || [];
  var me = _cu();
  var a = profiles.find(function(x){ return x.id === p.author_id; }) || {id:p.author_id, name:'User', avatar:''};
  var isMine = me && me.id === p.author_id;
  var isSaved = Z.State.savedPosts.indexOf(p.id) !== -1;
  var interest = (Z.State.myInterests||{})['post:'+p.id] || '';

  var rb = '';
  RK().forEach(function(k){
    var r = Z.Reactions[k];
    var cnt = (p.reactions && p.reactions[k]) || 0;
    var act = p._myReaction === k;
    var cssClass = r.cssClass ? ' class="' + r.cssClass + '"' : '';
    rb += '<button class="react-btn ' + (act?'active':'') + '" onclick="Z.reactToPost(\'' + Z.escape(p.id) + '\',\'' + k + '\')" title="' + r.label + '">' +
      '<span' + cssClass + '>' + r.symbol + '</span>' +
      '<span class="count">' + cnt + '</span>' +
      '<span class="bounty">$' + r.reward.toFixed(2) + '</span></button>';
  });

  var comments = (p._comments || []);
  var cHtml = comments.map(function(cm){ return Z.renderComment(cm, p, profiles); }).join('');

  var mHtml = '';
  if(p.media_url){
    if(p.media_type === 'video') mHtml = '<div class="post-media"><video src="' + Z.escape(p.media_url) + '" controls playsinline preload="metadata"></video></div>';
    else mHtml = '<div class="post-media"><img src="' + Z.escape(p.media_url) + '" alt="Post" loading="lazy"></div>';
  }

  var cp = '<div class="comment-color-picker">' +
    ['light-green','light-blue','light-yellow','light-pink','light-purple'].map(function(c){
      var s = c.replace('light-','');
      return '<div class="comment-color-dot c-' + s + ' ' + (Z.State.commentColor===c?'selected':'') + '" data-color="' + c + '" onclick="Z.setCommentColor(\'' + c + '\')"></div>';
    }).join('') + '</div>';

  return '<div class="post-card" id="post-' + Z.escape(p.id) + '">' +
    '<div class="post-author"><img src="' + Z.escape(Z.displayAvatar(a)) + '" onclick="Z.showView(\'public-profile\',\'' + Z.escape(a.id) + '\')" style="cursor:pointer;">' +
    '<div style="flex:1;min-width:0;"><div class="pname">' + Z.escape(Z.displayName(a)) + '</div>' +
    '<div class="phandle">@' + Z.escape(a.username || 'user') + ' • ' + _timeAgo(new Date(p.created_at).getTime()) + '</div></div>' +
    '<div class="post-menu-wrap"><button onclick="Z.togglePostMenu(\'' + Z.escape(p.id) + '\')" style="background:transparent;border:none;color:#94a3b8;font-size:16px;cursor:pointer;padding:6px;"><i class="fa-solid fa-ellipsis-vertical"></i></button>' +
    '<div class="post-menu" id="post-menu-' + Z.escape(p.id) + '" style="display:none;">' +
    (isMine ? '<button class="danger" onclick="Z.deletePost(\'' + Z.escape(p.id) + '\')"><i class="fa-solid fa-trash"></i> Delete</button>' : '') +
    '<button onclick="Z.toggleSavePost(\'' + Z.escape(p.id) + '\')"><i class="fa-' + (isSaved?'solid':'regular') + ' fa-bookmark"></i> ' + (isSaved?'Unsave':'Save') + '</button>' +
    '<button onclick="Z.markInterest(\'' + Z.escape(p.id) + '\',\'interested\')"><i class="fa-solid fa-thumbs-up"></i> Interested' + (interest==='interested'?' ✓':'') + '</button>' +
    '<button onclick="Z.markInterest(\'' + Z.escape(p.id) + '\',\'not_interested\')"><i class="fa-solid fa-thumbs-down"></i> Not Interested' + (interest==='not_interested'?' ✓':'') + '</button>' +
    '</div></div></div>' +
    (p.content ? '<div class="post-content">' + Z.escape(p.content) + '</div>' : '') + mHtml +
    '<div class="post-reactions">' + rb + '</div>' +
    '<div class="post-actions">' +
    '<button onclick="Z.toggleComments(\'' + Z.escape(p.id) + '\')"><i class="fa-regular fa-comment"></i> Comment ' + comments.length + '</button>' +
    '<button onclick="Z.sharePost(\'' + Z.escape(p.id) + '\')"><i class="fa-solid fa-share-nodes"></i> Share ' + (p.shares||0) + '</button>' +
    '<button style="cursor:default;"><i class="fa-regular fa-eye"></i> Views ' + (p.views||0) + '</button>' +
    '</div>' +
    '<div class="post-comments" id="comments-' + Z.escape(p.id) + '">' + cHtml + cp +
    '<div class="comment-input-wrap"><textarea id="comment-input-' + Z.escape(p.id) + '" rows="1" placeholder="Write a comment..." oninput="Z.autoGrow(this)"></textarea><button onclick="Z.addComment(\'' + Z.escape(p.id) + '\')">Send</button></div></div></div>';
};

Z.renderComment = function(cm, post, profiles){
  profiles = profiles || Z.State.allProfiles || [];
  var me = _cu();
  var ca = profiles.find(function(x){ return x.id === cm.author_id; }) || {name:'User'};
  var isMyComment = me && me.id === cm.author_id;
  var isMyPost = me && post && me.id === post.author_id;
  var reactions = cm._reactions || {};
  var rr = '';
  RK().forEach(function(k){
    var r = Z.Reactions[k];
    var cnt = reactions[k] || 0;
    var act = cm._myReaction === k;
    var cssClass = r.cssClass ? ' class="' + r.cssClass + '"' : '';
    rr += '<button class="comment-react ' + (act?'active':'') + '" onclick="Z.reactToComment(\'' + Z.escape(cm.id) + '\',\'' + k + '\')" title="' + r.label + '">' +
      '<span' + cssClass + '>' + r.symbol + '</span>' + (cnt ? '<span>' + cnt + '</span>' : '') + '<span class="cb">$' + r.reward.toFixed(2) + '</span></button>';
  });
  var actions = '';
  if(isMyComment){
    actions = '<div class="comment-actions"><button onclick="Z.deleteComment(\'' + Z.escape(cm.id) + '\',\'' + Z.escape(post.id) + '\')">Delete</button>' +
      '<button onclick="Z.openReplyBox(\'' + Z.escape(post.id) + '\',\'' + Z.escape(cm.id) + '\')">Reply</button></div>';
  } else {
    actions = '<div class="comment-actions"><button onclick="Z.openReplyBox(\'' + Z.escape(post.id) + '\',\'' + Z.escape(cm.id) + '\')">Reply</button>' +
      (isMyPost ? '<button onclick="Z.hideComment(\'' + Z.escape(cm.id) + '\',\'' + Z.escape(post.id) + '\')">Hide</button>' : '') + '</div>';
  }
  var replies = cm._replies || [];
  var repliesHtml = replies.length ? '<div style="margin-top:6px;padding-left:10px;border-left:2px solid rgba(0,0,0,.15);">' +
    replies.map(function(rep){
      var ra = profiles.find(function(x){ return x.id === rep.author_id; }) || {name:'User'};
      return '<div class="comment-item ' + (rep.color||'light-green') + '" style="margin-top:6px;"><span class="cname">' + Z.escape(ra.name) + '</span>' + Z.escape(rep.text) + '</div>';
    }).join('') + '</div>' : '';
  return '<div class="comment-item ' + (cm.color||'light-green') + (cm.hidden?' hidden-comment':'') + '"><span class="cname">' + Z.escape(ca.name) + '</span><span class="ctext">' + Z.escape(cm.text) + '</span>' +
    (cm.hidden ? '<div style="font-size:10px;margin-top:4px;opacity:.7;"><i class="fa-solid fa-eye-slash"></i> Hidden</div>' : '') +
    '<div class="comment-reactions">' + rr + '</div>' + actions + repliesHtml + '</div>';
};

Z.reactToPost = async function(postId, reactionType){
  var me = _cu(); if(!me){ Z.openAuthModal('login'); return; }
  var c = sb(); if(!c) return;
  var post = (Z.State.allPosts||[]).find(function(x){ return x.id === postId; }); if(!post) return;
  if(post.author_id === me.id){ Z.toast('Cannot react to your own post.'); return; }
  var ex = await c.from('post_reactions').select('*').eq('post_id', postId).eq('user_id', me.id).maybeSingle();
  if(ex.data && ex.data.reaction === reactionType){
    await c.from('post_reactions').delete().eq('id', ex.data.id);
    await Z.reloadData(); Z.showView('home'); return;
  }
  var prevReaction = ex.data ? ex.data.reaction : null;
  if(ex.data) await c.from('post_reactions').update({reaction: reactionType}).eq('id', ex.data.id);
  else {
    var ins = await c.from('post_reactions').insert({post_id: postId, user_id: me.id, reaction: reactionType});
    if(ins.error){ Z.toast('Failed.'); return; }
  }
  if(!prevReaction){
    var r = Z.Reactions[reactionType];
    if(r && r.reward > 0){
      await Z.RewardEngine.awardReaction(me.id, post.author_id, postId, reactionType);
      Z.animateDollar(r.reward);
      await Z.refreshSession();
    }
  }
  await Z.reloadData(); Z.showView('home');
};

  else if(kind==='youtube'){ navigator.clipboard.writeText(url); Z.toast('Link copied. Opening YouTube Studio...'); setTimeout(function(){window.open('https://studio.youtube.com/','_blank');},500); }
};

Z.renderNotifications = function(){
  var me = _cu();
  if(!me) return '<div class="empty-state"><p>Login first.</p></div>';
  var conns = (Z.State.allConnections||[]).filter(function(c){
    return c.receiver_id === me.id && c.status === 'pending';
  });
  var list = Z.DB.getNotifications().filter(function(n){ return n.userId === me.id; });
  var html = '<div style="display:flex;flex-direction:column;gap:12px;"><div class="view-header"><button class="colored-back-btn" onclick="Z.showView(\'home\')"><i class="fa-solid fa-arrow-left"></i> Back</button><h2 class="view-title" style="margin-left:4px;">Notifications</h2></div>';

  if(conns.length){
    html += '<div class="section-title">Connection Requests (' + conns.length + ')</div>';
    conns.forEach(function(c){
      var requester = Z.getProfileById(c.requester_id) || {name:'User'};
      var bounty = Z.getConnectBounty(requester);
      html += '<div class="conn-request-card"><div class="row"><img src="' + Z.escape(Z.displayAvatar(requester)) + '">' +
        '<div style="flex:1;"><div style="font-weight:700;font-size:13px;color:#fff;">' + Z.escape(Z.displayName(requester)) + '</div>' +
        '<div style="font-size:10px;color:#10b981;font-weight:700;">Bounty: $' + bounty.toFixed(2) + '</div></div></div>' +
        '<div class="connect-actions"><button class="approve" onclick="Z.approveConnection(\'' + Z.escape(c.id) + '\')">Approve</button>' +
        '<button class="reject" onclick="Z.rejectConnection(\'' + Z.escape(c.id) + '\')">Reject</button></div></div>';
    });
  }

  html += '<div class="section-title">Recent</div>';
  if(list.length){
    list.forEach(function(n){
      html += '<div style="background:#111827;border:1px solid ' + (n.read?'#1e293b':'rgba(16,185,129,.3)') + ';border-radius:12px;padding:12px;"><div style="font-size:12px;color:#e2e8f0;">' + Z.escape(n.message) + '</div><div style="font-size:9px;color:#64748b;margin-top:2px;">' + new Date(n.timestamp).toLocaleString() + '</div></div>';
    });
    Z.DB.saveNotifications(Z.DB.getNotifications().map(function(n){ if(n.userId===me.id) n.read=true; return n; }));
  } else if(!conns.length){
    html += '<div class="empty-state"><i class="fa-regular fa-bell"></i><p>No notifications.</p></div>';
  }
  html += '</div>';
  return html;
};
})();

Z.setupSparkFeed = function(sparks){
  var feed = document.getElementById('spark-feed'); if(!feed) return;
  var videos = feed.querySelectorAll('video'); if(!videos.length) return;

  videos.forEach(function(v){
    v.muted = false;
    v.volume = 1;
    var pr = v.play();
    if(pr && pr.catch){ pr.catch(function(){ v.muted = true; v.play().catch(function(){}); }); }
  });

  if(Z.State.sparkObserver) Z.State.sparkObserver.disconnect();
  Z.State.sparkObserver = new IntersectionObserver(function(entries){
    entries.forEach(function(entry){
      var v = entry.target.querySelector('video'); if(!v) return;
      if(entry.isIntersecting && entry.intersectionRatio > 0.6){
        v.play().catch(function(){});
        var sid = v.getAttribute('data-spark-id');
        if(sid) Z.recordSparkView(sid);
      } else { v.pause(); }
    });
  }, {threshold:[0, 0.6, 1.0]});
  feed.querySelectorAll('.spark-slide').forEach(function(sl){ Z.State.sparkObserver.observe(sl); });
};

Z.recordSparkView = function(sparkId){
  var arr = Z.State.allSparks || [];
  for(var i=0;i<arr.length;i++){
    if(arr[i].id === sparkId){
      if(!arr[i]._viewers) arr[i]._viewers = [];
      var me = _cu();
      var vid = me ? me.id : 'anon_' + (sessionStorage.getItem('anon_id')||(function(){var x='a_'+Date.now(); sessionStorage.setItem('anon_id',x); return x;})());
      if(arr[i]._viewers.indexOf(vid) === -1){
        arr[i]._viewers.push(vid);
        arr[i].views = (arr[i].views||0) + 1;
        Z.DB.updateSpark(sparkId, {views: arr[i].views}).catch(function(){});
      }
      break;
    }
  }
};

Z.sparkReact = async function(sparkId, reactionType, authorId){
  var me = _cu(); if(!me){ Z.openAuthModal('login'); return; }
  if(me.id === authorId){ Z.toast('Cannot react to your own content.'); return; }
  var c = Z.sb(); if(!c) return;
  var ex = await c.from('spark_reactions').select('*').eq('spark_id', sparkId).eq('user_id', me.id).maybeSingle();
  if(ex.data && ex.data.reaction === reactionType){
    await c.from('spark_reactions').delete().eq('id', ex.data.id);
    Z.toast('Removed.');
    await Z.reloadData(); Z.showView('spark'); return;
  }
  var prev = ex.data ? ex.data.reaction : null;
  if(ex.data) await c.from('spark_reactions').update({reaction: reactionType}).eq('id', ex.data.id);
  else {
    var ins = await c.from('spark_reactions').insert({spark_id: sparkId, user_id: me.id, reaction: reactionType});
    if(ins.error){ Z.toast('Failed.'); return; }
  }
  if(!prev){
    var r = Z.Reactions[reactionType];
    if(r && r.reward > 0){
      await Z.RewardEngine.awardReaction(me.id, authorId, sparkId, reactionType);
      Z.animateDollar(r.reward);
      await Z.refreshSession();
    }
  }
  await Z.reloadData(); Z.showView('spark');
};

function _liveStatuses(){
  var now = Date.now();
  return (Z.State.allStatuses||[]).filter(function(s){
    if(!s) return false;
    var exp = new Date(s.expires_at||0).getTime();
    return !(exp && exp <= now);
  }).sort(function(a,b){ return new Date(b.created_at||0) - new Date(a.created_at||0); });
}

Z.getStatusContacts = function(){
  var me = _cu(); if(!me) return [];
  return (Z.State.allProfiles||[]).filter(function(p){ return p.id !== me.id; });
};

Z.getActiveStatuses = function(){
  var live = _liveStatuses();
  var contacts = Z.getStatusContacts().map(function(p){ return p.id; });
  var me = _cu();
  var allowed = {};
  contacts.forEach(function(id){ allowed[id] = true; });
  if(me) allowed[me.id] = true;
  return live.filter(function(s){ return allowed[s.author_id]; });
};

Z.getStatusContactList = function(){
  var all = Z.getActiveStatuses();
  var grouped = {};
  all.forEach(function(s){ if(!grouped[s.author_id]) grouped[s.author_id]=[]; grouped[s.author_id].push(s); });
  var me = _cu();
  var entries = [];
  if(me && grouped[me.id]) entries.push({user: _p(me.id), statuses: grouped[me.id], isSelf: true});
  Object.keys(grouped).forEach(function(uid){
    if(me && uid === me.id) return;
    var u = _p(uid);
    if(u) entries.push({user: u, statuses: grouped[uid], isSelf: false});
  });
  entries.sort(function(a,b){
    if(a.isSelf) return -1;
    if(b.isSelf) return 1;
    return new Date(b.statuses[0].created_at||0) - new Date(a.statuses[0].created_at||0);
  });
  return entries;
};

    mr = await Z.uploadToStorage(f, 'status');

    mt = f.type.indexOf('video/')===0 ? 'video' : 'image';

  var now = new Date();
  var exp = new Date(now.getTime() + 24*60*60*1000);

    author_id: me.id, content: text,
    media_url: mr, media_type: mt,
    background: Z.State.statusBg || 'status-bg-deep-blue',

Z.openStatusViewer = async function(authorId, index){
  var ex = document.getElementById('status-viewer'); if(ex) ex.remove();
  var all = Z.getActiveStatuses();
  Z.State.viewerStatuses = all.filter(function(s){ return s.author_id === authorId; });
  Z.State.viewerStatuses.sort(function(a,b){ return new Date(b.created_at||0) - new Date(a.created_at||0); });
  if(!Z.State.viewerStatuses.length){ Z.toast('No statuses.'); return; }
  var me = _cu();
  if(me){
    for(var i=0;i<Z.State.viewerStatuses.length;i++){
      var s = Z.State.viewerStatuses[i];
      s._viewedByMe = true;
      Z.DB.markStatusViewed(s.id, me.id).catch(function(){});
    }
  }
  Z.State.viewerAuthorId = String(authorId);
  Z.State.viewerIndex = Math.max(0, Math.min(Number(index||0), Z.State.viewerStatuses.length-1));
  Z.showStatusViewer();
};

Z.showStatusViewer = function(){
  var old = document.getElementById('status-viewer'); if(old) old.remove();

  var author = _p(status.author_id);
  if(!author){ Z.closeStatusViewer(); return; }
  var isVid = status.media_type === 'video';
  var stage = '';
  if(status.media_url){
    stage = '<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:#000;color:#64748b;font-size:12px;">Loading...</div>';
  } else {
    var bg = status.background || 'status-bg-deep-blue';
    stage = '<div class="' + bg + '" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:32px;">' +
      '<div style="font-size:clamp(1.4rem,5vw,2.4rem);font-weight:700;text-align:center;line-height:1.6;overflow-y:auto;max-height:100%;width:100%;word-break:break-word;">' + Z.escape(status.content||'') + '</div></div>';
  }
  var total = Z.State.viewerStatuses.length;
  var cur = Z.State.viewerIndex + 1;

  document.body.insertAdjacentHTML('beforeend',
    '<div class="status-viewer-overlay" id="status-viewer">' +
    '<div class="status-progress-track"><div class="status-progress-bar" id="status-progress" style="width:0%;"></div></div>' +
    '<div class="status-viewer-header">' +
    '<button class="circle-x-btn" onclick="Z.closeStatusViewer()"><i class="fa-solid fa-xmark"></i></button>' +
    '<div style="display:flex;align-items:center;gap:8px;">' +
    '<img src="' + Z.escape(Z.displayAvatar(author)) + '" style="width:34px;height:34px;border-radius:50%;object-fit:cover;">' +
    '<div><div style="font-weight:700;font-size:13px;">' + Z.escape(Z.displayName(author)) + '</div>' +
    '<div style="font-size:10px;color:#94a3b8;">' + cur + ' / ' + total + ' • ' + Z._timeAgo(new Date(status.created_at).getTime()) + '</div></div></div>' +
    '<div style="width:38px;"></div></div>' +
    '<div class="status-viewer-body" id="status-viewer-body">' +
    '<div class="status-stage" id="status-stage">' + stage + '</div>' +
    '<button onclick="event.stopPropagation();Z.statusPrev()" class="status-nav-btn left"><i class="fa-solid fa-chevron-left"></i></button>' +
    '<button onclick="event.stopPropagation();Z.statusNext()" class="status-nav-btn right"><i class="fa-solid fa-chevron-right"></i></button></div>' +
    '<div class="status-viewer-footer"><button onclick="event.stopPropagation();Z.statusPrev()">‹ Prev</button>' +
    '<span style="font-size:10px;color:#64748b;">24h Status</span>' +
    '<button onclick="event.stopPropagation();Z.statusNext()">Next ›</button></div></div>'
  );

  if(status.media_url){
    var st = document.getElementById('status-stage');
    Z.loadMedia(status.media_url).then(function(url){
      if(!url){ st.innerHTML = '<div style="color:#64748b;font-size:12px;padding:20px;">Media unavailable</div>'; return; }
      if(isVid){
        st.innerHTML = '<video src="' + Z.escape(url) + '" controls autoplay playsinline style="width:100%;height:100%;object-fit:contain;background:#000;"></video>';
        var v = st.querySelector('video');
        if(v){
          Z.clearStatusTimer();
          v.addEventListener('timeupdate', function(){
            if(v.duration){ var b = document.getElementById('status-progress'); if(b) b.style.width = ((v.currentTime/v.duration)*100)+'%'; }
          });
          v.addEventListener('ended', function(){ Z.statusNext(); });
        }
      } else {
        st.innerHTML = '<img src="' + Z.escape(url) + '" style="width:100%;height:100%;object-fit:contain;background:#000;" alt="Status">';
      }
    });
  }
  if(!isVid) Z.startStatusTimer();
  Z.setupViewerGesture();
};

Z.startStatusTimer = function(){
  Z.clearStatusTimer();
  Z.State.viewerPaused = false;
  Z.State.viewerDuration = 7000;
  Z.State.viewerElapsed = 0;
  Z.State.viewerStartTime = Date.now();
  Z.State.viewerTimer = setTimeout(function(){ Z.statusNext(); }, Z.State.viewerDuration);
  Z.State.viewerProgressInterval = setInterval(function(){
    if(Z.State.viewerPaused) return;
    Z.State.viewerElapsed = Date.now() - Z.State.viewerStartTime;
    var pct = Math.min(100, (Z.State.viewerElapsed/Z.State.viewerDuration)*100);
    var b = document.getElementById('status-progress'); if(b) b.style.width = pct + '%';
  }, 100);
};

Z.pauseStatusTimer = function(){
  if(Z.State.viewerPaused) return;
  Z.State.viewerPaused = true;
  if(Z.State.viewerTimer){ clearTimeout(Z.State.viewerTimer); Z.State.viewerTimer = null; }
  if(Z.State.viewerProgressInterval){ clearInterval(Z.State.viewerProgressInterval); Z.State.viewerProgressInterval = null; }
};

Z.resumeStatusTimer = function(){
  if(!Z.State.viewerPaused) return;
  var st = Z.State.viewerStatuses[Z.State.viewerIndex];
  if(st && st.media_type === 'video') return;
  Z.State.viewerPaused = false;
  var rem = Z.State.viewerDuration - Z.State.viewerElapsed;
  Z.State.viewerStartTime = Date.now() - Z.State.viewerElapsed;
  Z.State.viewerTimer = setTimeout(function(){ Z.statusNext(); }, Math.max(100, rem));
  Z.State.viewerProgressInterval = setInterval(function(){
    if(Z.State.viewerPaused) return;
    Z.State.viewerElapsed = Date.now() - Z.State.viewerStartTime;
    var pct = Math.min(100, (Z.State.viewerElapsed/Z.State.viewerDuration)*100);
    var b = document.getElementById('status-progress'); if(b) b.style.width = pct + '%';
  }, 100);
};

Z.clearStatusTimer = function(){
  if(Z.State.viewerTimer){ clearTimeout(Z.State.viewerTimer); Z.State.viewerTimer = null; }
  if(Z.State.viewerProgressInterval){ clearInterval(Z.State.viewerProgressInterval); Z.State.viewerProgressInterval = null; }
};

Z.setupViewerGesture = function(){
  var body = document.getElementById('status-viewer-body'); if(!body) return;
  var sx=0, sy=0, st=0, moved=false;
  var SW=50, TAP=12, TAPT=400;
  function s(x,y){ sx=x; sy=y; st=Date.now(); moved=false; Z.pauseStatusTimer(); }
  function m(x,y){ if(Math.abs(x-sx)>TAP || Math.abs(y-sy)>TAP) moved=true; }
  function e(x,y){
    var dx=x-sx, dy=y-sy, el=Date.now()-st;
    var ax=Math.abs(dx), ay=Math.abs(dy);
    if(ax>SW && ax>ay*1.2){ if(dx<0) Z.statusNext(); else Z.statusPrev(); return; }
    if(ay>SW && ay>ax*1.2){ if(dy<0) Z.advanceToNextContact(); else Z.advanceToPrevContact(); return; }
    if(!moved && el<TAPT){ Z.statusNext(); return; }
    Z.resumeStatusTimer();
  }
  body.addEventListener('touchstart', function(ev){ if(ev.touches.length!==1) return; s(ev.touches[0].clientX, ev.touches[0].clientY); }, {passive:true});
  body.addEventListener('touchmove', function(ev){ if(ev.touches.length!==1) return; m(ev.touches[0].clientX, ev.touches[0].clientY); }, {passive:true});
  body.addEventListener('touchend', function(ev){ if(!ev.changedTouches.length) return; e(ev.changedTouches[0].clientX, ev.changedTouches[0].clientY); }, {passive:true});
  var dn=false;
  body.addEventListener('mousedown', function(ev){ if(ev.target.closest('button')||ev.target.closest('video')) return; dn=true; s(ev.clientX, ev.clientY); });
  body.addEventListener('mousemove', function(ev){ if(!dn) return; m(ev.clientX, ev.clientY); });
  body.addEventListener('mouseup', function(ev){ if(!dn) return; dn=false; e(ev.clientX, ev.clientY); });
  body.addEventListener('mouseleave', function(){ if(dn){ dn=false; Z.resumeStatusTimer(); } });
};

Z.advanceToNextContact = function(){
  var all = Z.getActiveStatuses();
  var map = {};
  all.forEach(function(s){ if(!map[s.author_id]) map[s.author_id]=[]; map[s.author_id].push(s); });
  var keys = Object.keys(map);
  if(keys.length <= 1){ Z.closeStatusViewer(); return; }
  var idx = keys.indexOf(Z.State.viewerAuthorId);
  Z.openStatusViewer(keys[(idx+1)%keys.length], 0);
};

Z.advanceToPrevContact = function(){
  var all = Z.getActiveStatuses();
  var map = {};
  all.forEach(function(s){ if(!map[s.author_id]) map[s.author_id]=[]; map[s.author_id].push(s); });
  var keys = Object.keys(map);
  if(keys.length <= 1){ Z.closeStatusViewer(); return; }
  var idx = keys.indexOf(Z.State.viewerAuthorId);
  Z.openStatusViewer(keys[(idx-1+keys.length)%keys.length], 0);
};

Z.statusPrev = function(){
  Z.clearStatusTimer();
  if(Z.State.viewerIndex > 0){ Z.State.viewerIndex--; Z.showStatusViewer(); }
  else Z.advanceToPrevContact();
};

Z.statusNext = function(){
  Z.clearStatusTimer();
  if(Z.State.viewerIndex < Z.State.viewerStatuses.length - 1){ Z.State.viewerIndex++; Z.showStatusViewer(); }
  else Z.advanceToNextContact();
};

Z.closeStatusViewer = function(){
  Z.clearStatusTimer();
  Z.State.viewerPaused = false;
  var v = document.getElementById('status-viewer');
  if(v){ v.querySelectorAll('video').forEach(function(vv){ try{vv.pause(); vv.src='';}catch(e){} }); v.remove(); }
  Z.showView('status-home');
};

Z.saveProfile = async function(){

    var au = await Z.uploadToStorage(Z._editImages.avatar, 'avatars');
    if(!au){ Z.toast('Avatar upload failed.'); return; }
    patch.avatar = au;
  }

    var cu = await Z.uploadToStorage(Z._editImages.cover, 'covers');

    ['4','5','6','-'].map(function(k){ return '<button class="calc-btn' + (k==='-'?' op':'') + '" onclick="Z.calcPress(\'' + k + '\')">' + k + '</button>'; }).join('') +
    ['1','2','3','+'].map(function(k){ return '<button class="calc-btn' + (k==='+'?' op':'') + '" onclick="Z.calcPress(\'' + k + '\')">' + k + '</button>'; }).join('') +
    '<button class="calc-btn" style="grid-column:span 2;" onclick="Z.calcPress(\'0\')">0</button>' +
    '<button class="calc-btn" onclick="Z.calcPress(\'.\')">.</button>' +
    '<button class="calc-btn eq" onclick="Z.calcPress(\'=\')">=</button>' +
    '</div></div></div>'
  );
};
Z.calcPress = function(k){
  var s = Z._calcState;
  if(k === 'C') s.expr = '';
  else if(k === '←') s.expr = s.expr.slice(0, -1);
  else if(k === '='){
    try {
      var clean = s.expr.replace(/[^0-9+\-*/.%()]/g, '');
      if(!clean) return;
      var v = Function('"use strict"; return (' + clean + ')')();
      s.expr = String(v);
    } catch(e){ s.expr = 'Error'; }
  } else {
    s.expr += k;
  }
  var d = document.getElementById('calc-display');
  if(d) d.textContent = s.expr || '0';
};

    '<input type="text" id="circle-search-input" placeholder="Search circles..." value="' + Z.escape(Z.State.circleSearch||'') + '" oninput="Z.onCircleSearch(this.value)" style="width:100%;background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:10px 14px;font-size:12px;color:#fff;outline:none;">' +
    '<div id="circles-list-container">' + Z.renderCirclesList(filtered) + '</div>' +
    '<button onclick="Z.openCreateCircleModal()" style="width:100%;background:#10b981;border:none;color:#000;font-weight:700;padding:12px;border-radius:12px;font-size:12px;cursor:pointer;">+ Create Circle</button></div>';
  return html;
};

Z.renderCirclesList = function(filtered){
  var html = '';
  filtered.forEach(function(c){
    var labels = {social:'Social', services:'Services', goods:'Goods', office:'Office', education:'Education', events:'Events'};
    var label = labels[c.type] || 'Social';
    var cls = c.type==='services'?'type-services':c.type==='goods'?'type-goods':'type-social';
    var bounty = Number(c.bounty || 0);
    html += '<div class="circle-card"><div class="circle-head"><div class="circle-head-left"><img src="' + Z.escape(c.avatar) + '"><div><div class="circle-name">' + Z.escape(c.name) + '</div><div class="circle-meta">' + (c.members||0) + ' • <span class="circle-type-badge ' + cls + '">' + label + '</span></div></div></div>' +
      '<button class="circle-join-btn" onclick="Z.toast(\'Joined!\')">Join' + (bounty>0 ? ' <span style="font-size:9px;opacity:.8;">$' + bounty.toFixed(2) + '</span>' : '') + '</button></div>' +
      '<div class="circle-desc">' + Z.escape(c.description||'') + '</div></div>';
  });
  if(!filtered.length) html = '<div class="empty-state"><p>No circles.</p></div>';
  return html;
};

Z.onCircleSearch = function(v){
  Z.State.circleSearch = v;
  var c = document.getElementById('circles-list-container'); if(!c) return;
  var qq = v.toLowerCase();
  var filtered = Z.DB.getCircles().filter(function(cc){ return cc.name.toLowerCase().indexOf(qq)!==-1 || (cc.description||'').toLowerCase().indexOf(qq)!==-1; });
  c.innerHTML = Z.renderCirclesList(filtered);
};

// ============================================================
// RELOAD DATA
// ============================================================
Z.reloadData = async function(){
  await Z.DB.loadAllProfiles();
  await Z.DB.loadPosts();
  await Z.DB.loadConnections();
  await Z.DB.loadStatuses();
  await Z.DB.loadSparks();
  var me = _cu();
  if(me){
    await Z.DB.loadSaves();
    await Z.DB.loadInterests();
    me._walletTx = await Z.DB.loadWalletTx(me.id);
    var views = await Z.DB.loadStatusViews();
    (Z.State.allStatuses||[]).forEach(function(s){
      if(s.author_id === me.id) return;
      var seen = views.find(function(v){ return v.status_id === s.id && v.viewer_id === me.id; });
      if(seen) s._viewedByMe = true;
    });
    var c = Z.sb();
    if(c){
      var pr = await c.from('post_reactions').select('*').eq('user_id', me.id);
      (pr.data||[]).forEach(function(r){
        var post = (Z.State.allPosts||[]).find(function(p){ return p.id === r.post_id; });
        if(post) post._myReaction = r.reaction;
      });
      var pc = await c.from('post_reactions').select('post_id, reaction');
      var postMap = {};
      (pc.data||[]).forEach(function(r){
        postMap[r.post_id] = postMap[r.post_id] || {};
        postMap[r.post_id][r.reaction] = (postMap[r.post_id][r.reaction]||0)+1;
      });
      (Z.State.allPosts||[]).forEach(function(p){ p.reactions = postMap[p.id] || {}; });
      var sr = await c.from('spark_reactions').select('*').eq('user_id', me.id);
      (sr.data||[]).forEach(function(r){
        var sp = (Z.State.allSparks||[]).find(function(s){ return s.id === r.spark_id; });
        if(sp) sp._myReaction = r.reaction;
      });
      for(var i=0;i<(Z.State.allSparks||[]).length;i++){
        var sp2 = Z.State.allSparks[i];
        var cm = await c.from('comments').select('id').eq('spark_id', sp2.id);
        sp2._commentsCount = (cm.data||[]).length;
      }
      for(var j=0;j<(Z.State.allPosts||[]).length;j++){
        var pp = Z.State.allPosts[j];
        var cmr = await c.from('comments').select('*').eq('post_id', pp.id).order('created_at',{ascending:true});
        var allCm = cmr.data || [];
        var roots = allCm.filter(function(x){ return !x.parent_id; });
        roots.forEach(function(root){
          root._replies = allCm.filter(function(x){ return x.parent_id === root.id; });
        });
        pp._comments = roots;
        if(roots.length){
          var ids = roots.map(function(x){ return x.id; });
          var cr = await c.from('comment_reactions').select('*').in('comment_id', ids);
          var crMap = {};
          (cr.data||[]).forEach(function(r){
            crMap[r.comment_id] = crMap[r.comment_id] || {counts:{}, mine:null};
            crMap[r.comment_id].counts[r.reaction] = (crMap[r.comment_id].counts[r.reaction]||0)+1;
            if(r.user_id === me.id) crMap[r.comment_id].mine = r.reaction;
          });
          roots.forEach(function(root){
            var m = crMap[root.id];
            root._reactions = m ? m.counts : {};
            root._myReaction = m ? m.mine : null;
          });
        }
      }
    }
  }
};

// ROUTER
Z.renderView = function(view, param){
  switch(view){
    case 'home': return Z.renderHome();
    case 'spark': return Z.renderSpark();
    case 'people': return Z.renderPeople();
    case 'profile': return Z.renderProfile();
    case 'wallet': return Z.renderWallet();
    case 'bounty': return Z.renderBounty();
    case 'packages': return Z.renderPackages();
    case 'referrals': return Z.renderReferrals();
    case 'saved': return Z.renderSaved();
    case 'circles': return Z.renderCircles();
    case 'notifications': return Z.renderNotifications();
    case 'public-profile': return Z.renderPublicProfile(param);
    case 'status-home': return Z.renderStatusHome();
    default: return Z.renderHome();
  }
};

Z.showView = async function(view, param){
  Z.State.currentView = view;
  window.scrollTo(0,0);
  document.querySelectorAll('#bottom-nav button:not(.create-btn)').forEach(function(b){ b.classList.remove('active'); });
  var map = {home:'nav-home', spark:'nav-spark', circles:'nav-circles', people:'nav-people', profile:'nav-profile'};
  if(map[view]){ var b = document.getElementById(map[view]); if(b) b.classList.add('active'); }
  var container = document.getElementById('app-container');
  if(!container) return;
  try { container.innerHTML = Z.renderView(view, param); }
  catch(e){
    console.error('render err', e);
    container.innerHTML = '<div class="empty-state"><p>Something went wrong.</p><button onclick="Z.showView(\'home\')" style="background:#10b981;border:none;color:#000;font-weight:700;padding:8px 20px;border-radius:8px;margin-top:12px;cursor:pointer;">Home</button></div>';
  }
  if(view === 'home'){ setTimeout(function(){ Z.renderStatusRow(); }, 80); }
  Z.updateHeader();
};

async function boot(){
  if(!localStorage.getItem('zynix_circles')) Z.DB.saveCircles(Z.SeedData.circles);

  if(location.hash && location.hash.indexOf('type=recovery') !== -1){
    setTimeout(function(){ Z.openResetPasswordModal(); }, 400);
  }
  if(location.search && location.search.indexOf('type=recovery') !== -1){
    setTimeout(function(){ Z.openResetPasswordModal(); }, 400);
  }

  await Z.refreshSession();
  await Z.reloadData();
  Z.showView('home');
  var c = Z.sb();
  if(c){
    c.auth.onAuthStateChange(async function(event){
      if(event === 'PASSWORD_RECOVERY'){
        Z.openResetPasswordModal();
        return;
      }
      if(event === 'SIGNED_IN' || event === 'SIGNED_OUT' || event === 'TOKEN_REFRESHED'){
        await Z.refreshSession();
        await Z.reloadData();
        Z.showView(Z.State.currentView || 'home');
      }
    });
  }
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
} else { boot(); }

})();
</script>

<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZYNIX - Creator & Social Ecosystem</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        zynix: {
                            bg: "#090d16",
                            card: "#111827",
                            cardHover: "#1f2937",
                            border: "#1e293b",
                            emerald: "#10b981",
                            blue: "#3b82f6",
                            pink: "#ec4899",
                            purple: "#8b5cf6",
                            amber: "#f59e0b"
                        }
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #090d16; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
        
        @keyframes flyToWallet {
            0% { transform: scale(0.5) translateX(0) rotate(0deg); opacity: 0; }
            20% { transform: scale(1.15) translateX(-15px) rotate(-5deg); opacity: 1; }
            80% { transform: scale(0.8) translateY(-140px) translateX(80px) rotate(15deg); opacity: 1; }
            100% { transform: scale(0.2) translateY(-220px) translateX(140px) rotate(30deg); opacity: 0; }
        }
        .dollar-bill-anim {
            animation: flyToWallet 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }
        @keyframes pulseWallet {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); box-shadow: 0 0 25px rgba(16, 185, 129, 0.7); }
            100% { transform: scale(1); }
        }
        .wallet-pulse {
            animation: pulseWallet 0.5s ease-in-out;
        }
        body { background-color: #090d16; color: #f8fafc; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
    </style>
</head>
<body class="min-h-screen pb-20 selection:bg-emerald-500 selection:text-black">

    <!-- Top Sticky Header -->
    <header class="sticky top-0 z-40 bg-[#090d16]/90 backdrop-blur-md border-b border-slate-800 px-4 py-2.5 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <button type="button" onclick="Z.showView('home')" class="flex items-center space-x-2 text-left focus:outline-none group">
                <span class="text-xl font-black tracking-wider bg-gradient-to-r from-emerald-400 via-blue-500 to-indigo-500 bg-clip-text text-transparent group-hover:opacity-90">
                    ZYNIX
                </span>
                <span class="text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-1.5 py-0.5 rounded font-bold uppercase tracking-widest hidden sm:inline-block">Ecosystem</span>
            </button>
        </div>

        <div class="flex items-center space-x-2.5">
            <button type="button" onclick="Z.showView('wallet')" class="bg-slate-900/90 border border-slate-800 hover:border-slate-700 px-3 py-1 rounded-full text-xs flex items-center space-x-2 shadow-inner transition">
                <div class="flex items-center space-x-1" title="Cash Balance">
                    <i class="fa-solid fa-wallet text-emerald-400 text-[10px]"></i>
                    <span id="header-cash" class="text-emerald-400 font-bold">$0.00</span>
                </div>
                <span class="text-slate-700">|</span>
                <div class="flex items-center space-x-1" title="Bounty Balance">
                    <i class="fa-solid fa-gift text-blue-400 text-[10px]"></i>
                    <span id="header-bounty" class="text-blue-400 font-bold">$0.00</span>
                </div>
            </button>

            <div id="header-auth-container">
                <!-- Dynamic Auth Render -->
            </div>
        </div>
    </header>

    <!-- Main Container App -->
    <main id="app-container" class="max-w-xl mx-auto px-3 py-3 min-h-[calc(100vh-120px)] relative">
        <!-- Views will be injected dynamically here -->
    </main>

    <!-- Fixed Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 z-40 bg-[#090d16]/95 backdrop-blur-lg border-t border-slate-800 px-4 py-2 max-w-xl mx-auto flex items-center justify-between shadow-2xl">
        <button type="button" onclick="Z.showView('home')" id="nav-btn-home" class="flex flex-col items-center justify-center text-slate-400 hover:text-emerald-400 transition w-1/5 py-1">
            <i class="fa-solid fa-house text-lg"></i>
            <span class="text-[10px] font-medium mt-0.5">Home</span>
        </button>
        <button type="button" onclick="Z.showView('spark')" id="nav-btn-spark" class="flex flex-col items-center justify-center text-slate-400 hover:text-emerald-400 transition w-1/5 py-1">
            <i class="fa-solid fa-bolt text-lg"></i>
            <span class="text-[10px] font-medium mt-0.5">Spark</span>
        </button>
        <button type="button" onclick="Z.openCreateModal()" class="flex items-center justify-center w-11 h-11 bg-gradient-to-tr from-emerald-500 to-blue-600 rounded-full text-black hover:scale-105 transition shadow-lg shadow-emerald-500/20 -mt-3">
            <i class="fa-solid fa-plus text-base font-black"></i>
        </button>
        <button type="button" onclick="Z.showView('people')" id="nav-btn-people" class="flex flex-col items-center justify-center text-slate-400 hover:text-emerald-400 transition w-1/5 py-1">
            <i class="fa-solid fa-users text-lg"></i>
            <span class="text-[10px] font-medium mt-0.5">People</span>
        </button>
        <button type="button" onclick="Z.showView('profile')" id="nav-btn-profile" class="flex flex-col items-center justify-center text-slate-400 hover:text-emerald-400 transition w-1/5 py-1">
            <i class="fa-solid fa-user text-lg"></i>
            <span class="text-[10px] font-medium mt-0.5">Profile</span>
        </button>
    </nav>

    <!-- Toast Notification Container (Bottom Stacked) -->
    <div id="toast-container" class="fixed bottom-20 left-4 right-4 z-50 flex flex-col items-center space-y-2 pointer-events-none"></div>

    <!-- Modals Container -->
    <div id="modal-container"></div>

    <!-- Application JavaScript Engine -->
    <script>
        window.Z = {};

        Z.State = {
            currentUser: null,
            currentView: 'home'
        };

        Z.RewardEngine = {
            calculateSplit: function(grossAmount) {
                const cash = Number((grossAmount * 0.60).toFixed(4));
                const bounty = Number((grossAmount * 0.40).toFixed(4));
                return { cash, bounty, gross: grossAmount };
            },
            creditReward: function(user, grossAmount, reason) {
                if (!user) return false;
                const split = this.calculateSplit(grossAmount);
                
                if (!user.wallet) {
                    user.wallet = { cash: 0.00, bounty: 0.00, totalEarned: 0.00 };
                }
                if (!user.walletTransactions) user.walletTransactions = [];

                user.wallet.cash += split.cash;
                user.wallet.bounty += split.bounty;
                user.wallet.totalEarned += grossAmount;

                user.walletTransactions.unshift({
                    id: 'tx_' + Date.now(),
                    date: new Date().toISOString(),
                    type: reason,
                    amount: grossAmount,
                    cash: split.cash,
                    bounty: split.bounty,
                    status: 'Completed'
                });

                Z.DB.saveUsers();
                Z.updateHeaderWallet();
                Z.triggerRewardAnimation(grossAmount);
                Z.showToast(`Reward received: +$${grossAmount.toFixed(2)} (+$${split.cash.toFixed(3)} Cash, +$${split.bounty.toFixed(3)} Bounty)`);
                return true;
            },
            processInteraction: function(contentOwnerId, interactionType, post) {
                if (!Z.State.currentUser) {
                    Z.openAuthModal('login');
                    Z.showToast('Please log in or sign up to earn rewards.');
                    return false;
                }
                const users = Z.DB.getUsers();
                const contentOwner = users.find(u => u.id === contentOwnerId);
                if (!contentOwner) return false;

                if (contentOwner.id === Z.State.currentUser.id) {
                    Z.showToast('You cannot earn rewards from your own content.');
                    return false;
                }

                const bountySettings = contentOwner.bountySettings || { view: 0.00, like: 0.01, share: 0.03, follow: 0.03, subscribe: 0.02 };
                let rewardAmount = bountySettings[interactionType] || 0.00;
                
                if (interactionType === 'like') {
                    rewardAmount = bountySettings.like !== undefined ? bountySettings.like : 0.01;
                } else if (interactionType === 'share') {
                    rewardAmount = bountySettings.share || 0.03;
                } else if (interactionType === 'follow' || interactionType === 'subscribe') {
                    rewardAmount = contentOwner.monthlySubscription ? (bountySettings.subscribe || 0.02) : (bountySettings.follow || 0.03);
                }

                if (rewardAmount <= 0) return true;

                if (!contentOwner.wallet) contentOwner.wallet = { cash: 5.00, bounty: 5.00, totalEarned: 10.00 };
                if (contentOwner.wallet.bounty < rewardAmount) {
                    Z.showToast('Creator bounty balance is insufficient for this reward.');
                    return false;
                }

                contentOwner.wallet.bounty -= rewardAmount;
                if (!contentOwner.bountySpentHistory) contentOwner.bountySpentHistory = [];
                contentOwner.bountySpentHistory.unshift({
                    id: 'bspend_' + Date.now(),
                    date: new Date().toISOString(),
                    recipient: Z.State.currentUser.name,
                    action: interactionType,
                    amount: rewardAmount,
                    postId: post ? post.id : null
                });

                this.creditReward(Z.State.currentUser, rewardAmount, `${interactionType.toUpperCase()} Reward`);
                Z.DB.saveUsers();
                return true;
            }
        };

        Z.triggerRewardAnimation = function(amount) {
            const walletEl = document.querySelector('header');
            if (walletEl) {
                walletEl.classList.add('wallet-pulse');
                setTimeout(() => walletEl.classList.remove('wallet-pulse'), 500);
            }
            const floatingNote = document.createElement('div');
            floatingNote.className = 'fixed z-50 bg-gradient-to-r from-emerald-600 via-emerald-500 to-teal-500 text-white font-black px-3.5 py-2 rounded-xl text-xs shadow-2xl dollar-bill-anim border border-emerald-300 flex items-center space-x-1.5 pointer-events-none';
            floatingNote.style.right = '40px';
            floatingNote.style.top = '60px';
            floatingNote.innerHTML = `<i class="fa-solid fa-money-bill-wave text-emerald-200 text-sm"></i><span>+$${amount.toFixed(2)} Note</span>`;
            document.body.appendChild(floatingNote);
            setTimeout(() => floatingNote.remove(), 1200);
        };

        Z.showToast = function(message) {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = 'bg-slate-900/95 border border-emerald-500/40 text-slate-100 px-4 py-2.5 rounded-xl text-xs shadow-2xl flex items-center space-x-2.5 pointer-events-auto transition transform translate-y-4 opacity-0 max-w-md w-full backdrop-blur-md';
            toast.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-400 text-sm shrink-0"></i><span class="font-medium">${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-y-4', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'transition', 'duration-300');
                setTimeout(() => toast.remove(), 300);
            }, 3200);
        };

        Z.DB = {
            getUsers: function() {
                const data = localStorage.getItem('zynix_users');
                if (!data) return Z.SeedData.users;
                return JSON.parse(data);
            },
            saveUsers: function(users) {
                if (users) localStorage.setItem('zynix_users', JSON.stringify(users));
                else {
                    const current = this.getUsers();
                    localStorage.setItem('zynix_users', JSON.stringify(current));
                }
            },
            getCurrentUser: function() {
                const id = localStorage.getItem('zynix_current_user_id');
                if (!id) return null;
                const users = this.getUsers();
                return users.find(u => u.id === id) || null;
            },
            setCurrentUser: function(user) {
                if (user) {
                    localStorage.setItem('zynix_current_user_id', user.id);
                } else {
                    localStorage.removeItem('zynix_current_user_id');
                }
                Z.State.currentUser = user;
                Z.renderHeaderAuth();
                Z.updateHeaderWallet();
            },
            getPosts: function() {
                const data = localStorage.getItem('zynix_posts');
                if (!data) return Z.SeedData.posts;
                return JSON.parse(data);
            },
            savePosts: function(posts) {
                localStorage.setItem('zynix_posts', JSON.stringify(posts));
            }
        };

        Z.SeedData = {
            users: [
                {
                    id: 'usr_1',
                    name: 'Abdullah Abbas',
                    username: 'abdullah_abbas',
                    profession: 'Creator & Medical Student',
                    dob: '2006-05-12',
                    bio: 'Building ZYNIX ecosystem, exploring organic chemistry, design assets, and digital growth.',
                    role: 'Creator',
                    avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80',
                    cover: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=800&q=80',
                    followers: 1420,
                    package: '$100',
                    bountySettings: { view: 0.00, like: 0.01, share: 0.03, follow: 0.03, subscribe: 0.02 },
                    monthlySubscription: true,
                    wallet: { cash: 45.50, bounty: 28.20, totalEarned: 120.50 },
                    walletTransactions: [],
                    bountySpentHistory: [],
                    referrals: { code: 'ZYNIX-ABD2026', earnings: 184.00 },
                    email: 'abdullah@zynix.io',
                    password: 'password123'
                }
            ],
            posts: [
                {
                    id: 'post_1',
                    authorId: 'usr_1',
                    content: 'Welcome to the upgraded ZYNIX ecosystem! Bottom toast notification updates, floating currency bills, and complete bounty control for creators. 🔥',
                    media: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=800&q=80',
                    createdAt: '2 hours ago',
                    reactions: { heart: 45 },
                    comments: [],
                    shares: 14
                }
            ]
        };

        document.addEventListener('DOMContentLoaded', function() {
            if (!localStorage.getItem('zynix_users')) Z.DB.saveUsers(Z.SeedData.users);
            if (!localStorage.getItem('zynix_posts')) Z.DB.savePosts(Z.SeedData.posts);

            // Fixed Session Persistence check (respecting logout)
            let current = Z.DB.getCurrentUser();
            if (current) {
                Z.State.currentUser = current;
            } else {
                // If no user is logged in, keep currentUser null instead of forcefully overriding logout
                Z.State.currentUser = null;
            }

            Z.renderHeaderAuth();
            Z.updateHeaderWallet();
            Z.showView('home');
        });

        Z.renderHeaderAuth = function() {
            const container = document.getElementById('header-auth-container');
            if (!container) return;
            const user = Z.State.currentUser;
            if (user) {
                container.innerHTML = `
                    <div class="flex items-center space-x-2">
                        <button type="button" onclick="Z.showView('profile')" class="flex items-center space-x-1.5 focus:outline-none">
                            <img src="${user.avatar}" alt="${user.name}" class="w-7 h-7 rounded-full object-cover border border-emerald-500/50">
                        </button>
                        <button type="button" onclick="Z.logout()" class="w-7 h-7 rounded-full bg-slate-800 hover:bg-rose-500/20 text-slate-400 hover:text-rose-400 flex items-center justify-center transition" title="Logout">
                            <i class="fa-solid fa-power-off text-xs"></i>
                        </button>
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <button type="button" onclick="Z.openAuthModal('login')" class="bg-emerald-600 hover:bg-emerald-500 text-black font-bold text-xs px-3 py-1.5 rounded-full transition shadow-md">
                        Login
                    </button>
                `;
            }
        };

        Z.updateHeaderWallet = function() {
            const user = Z.State.currentUser || Z.DB.getUsers()[0];
            const cashEl = document.getElementById('header-cash');
            const bountyEl = document.getElementById('header-bounty');
            if (cashEl && user && user.wallet) cashEl.innerText = '$' + user.wallet.cash.toFixed(2);
            if (bountyEl && user && user.wallet) bountyEl.innerText = '$' + user.wallet.bounty.toFixed(2);
        };

        Z.openAuthModal = function(mode) {
            const modalContainer = document.getElementById('modal-container');
            if (!modalContainer) return;
            
            const isLogin = mode === 'login';
            modalContainer.innerHTML = `
                <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                    <div class="bg-[#111827] border border-slate-800 rounded-2xl w-full max-w-md p-6 space-y-4 shadow-2xl relative animate-in fade-in zoom-in duration-200">
                        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                            <h3 class="font-bold text-base text-white">${isLogin ? 'Login to ZYNIX' : 'Create ZYNIX Account'}</h3>
                            <button onclick="Z.closeAuthModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <div class="space-y-3">
                            ${!isLogin ? `
                                <div>
                                    <label class="block text-xs font-medium text-slate-400 mb-1">Full Name</label>
                                    <input type="text" id="auth-name" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500" placeholder="Abdullah Abbas">
                                </div>
                            ` : ''}
                            <div>
                                <label class="block text-xs font-medium text-slate-400 mb-1">Email / Username</label>
                                <input type="text" id="auth-email" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500" placeholder="abdullah@zynix.io">
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-400 mb-1">Password</label>
                                <input type="password" id="auth-password" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500" placeholder="••••••••">
                            </div>
                            <button type="button" onclick="Z.handleAuthSubmit('${mode}')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-black font-bold py-2.5 rounded-xl text-xs transition shadow-lg shadow-emerald-600/20">
                                ${isLogin ? 'Login Account' : 'Sign Up Now'}
                            </button>
                            <div class="text-center pt-2">
                                <button type="button" onclick="Z.openAuthModal('${isLogin ? 'signup' : 'login'})" class="text-xs text-indigo-400 hover:underline">
                                    ${isLogin ? "Don't have an account? Sign Up" : "Already have an account? Login"}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        };

        Z.closeAuthModal = function() {
            const modalContainer = document.getElementById('modal-container');
            if (modalContainer) modalContainer.innerHTML = '';
        };

        Z.handleAuthSubmit = function(mode) {
            const emailInput = document.getElementById('auth-email').value.trim();
            const passInput = document.getElementById('auth-password').value.trim();
            if (!emailInput || !passInput) {
                Z.showToast('Please fill in all required fields.');
                return;
            }

            let users = Z.DB.getUsers();
            if (mode === 'login') {
                const found = users.find(u => u.email === emailInput || u.username === emailInput);
                if (found) {
                    Z.DB.setCurrentUser(found);
                    Z.closeAuthModal();
                    Z.showToast(`Welcome back, ${found.name}!`);
                    Z.showView('profile');
                } else {
                    Z.showToast('User not found. Please check credentials or sign up.');
                }
            } else {
                const nameInput = document.getElementById('auth-name').value.trim() || 'New User';
                const newUser = {
                    id: 'usr_' + Date.now(),
                    name: nameInput,
                    username: emailInput.split('@')[0],
                    profession: 'Creator',
                    bio: 'Joined ZYNIX ecosystem.',
                    role: 'Creator',
                    avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80',
                    cover: 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=800&q=80',
                    followers: 1,
                    bountySettings: { view: 0.00, like: 0.01, share: 0.03, follow: 0.03, subscribe: 0.02 },
                    monthlySubscription: true,
                    wallet: { cash: 1.00, bounty: 1.00, totalEarned: 2.00 },
                    walletTransactions: [],
                    bountySpentHistory: [],
                    email: emailInput,
                    password: passInput
                };
                users.push(newUser);
                Z.DB.saveUsers(users);
                Z.DB.setCurrentUser(newUser);
                Z.closeAuthModal();
                Z.showToast(`Account created successfully! Welcome, ${newUser.name}.`);
                Z.showView('profile');
            }
        };

        Z.logout = function() {
            Z.DB.setCurrentUser(null);
            Z.showToast('Logged out successfully.');
            Z.showView('home');
        };

        Z.openCreateModal = function() {
            if (!Z.State.currentUser) {
                Z.openAuthModal('login');
                Z.showToast('Please login to create posts.');
                return;
            }
            const modalContainer = document.getElementById('modal-container');
            if (!modalContainer) return;

            modalContainer.innerHTML = `
                <div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                    <div class="bg-[#111827] border border-slate-800 rounded-2xl w-full max-w-md p-6 space-y-4 shadow-2xl relative">
                        <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                            <h3 class="font-bold text-base text-white">Create New Post</h3>
                            <button onclick="Z.closeAuthModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
                        </div>
                        <div class="space-y-3">
                            <div>
                                <label class="block text-xs font-medium text-slate-400 mb-1">What's on your mind?</label>
                                <textarea id="new-post-content" rows="3" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500" placeholder="Share your update..."></textarea>
                            </div>
                            <div>
                                <label class="block text-xs font-medium text-slate-400 mb-1">Media / Image URL (Optional)</label>
                                <input type="text" id="new-post-media" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500" placeholder="https://images.unsplash.com/...">
                            </div>
                            <button type="button" onclick="Z.submitNewPost()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-black font-bold py-2.5 rounded-xl text-xs transition shadow-lg shadow-emerald-600/20">
                                Publish Post
                            </button>
                        </div>
                    </div>
                </div>
            `;
        };

        Z.submitNewPost = function() {
            const content = document.getElementById('new-post-content').value.trim();
            const media = document.getElementById('new-post-media').value.trim();
            if (!content) {
                Z.showToast('Please write something for your post.');
                return;
            }
            const posts = Z.DB.getPosts();
            const newPost = {
                id: 'post_' + Date.now(),
                authorId: Z.State.currentUser.id,
                content: content,
                media: media || '',
                createdAt: 'Just now',
                reactions: { heart: 0 },
                comments: [],
                shares: 0
            };
            posts.unshift(newPost);
            Z.DB.savePosts(posts);
            Z.closeAuthModal();
            Z.showToast('Post published successfully!');
            Z.showView('home');
        };

        Z.showView = function(viewName, param) {
            Z.State.currentView = viewName;
            window.scrollTo({ top: 0, behavior: 'smooth' });

            ['home', 'spark', 'people', 'profile'].forEach(v => {
                const btn = document.getElementById(`nav-btn-${v}`);
                if (btn) {
                    if (v === viewName) btn.classList.add('text-emerald-400');
                    else btn.classList.remove('text-emerald-400');
                }
            });

            const container = document.getElementById('app-container');
            if (!container) return;

            if (viewName === 'home') container.innerHTML = Z.Views.renderHome();
            else if (viewName === 'profile') container.innerHTML = Z.Views.renderProfileDashboard();
            else if (viewName === 'wallet') container.innerHTML = Z.Views.renderWallet();
            else if (viewName === 'bounty-settings') container.innerHTML = Z.Views.renderBountySettings();
            else if (viewName === 'people') container.innerHTML = Z.Views.renderPeople();
            else container.innerHTML = Z.Views.renderHome();
        };

        Z.Views = {
            renderHome: function() {
                const posts = Z.DB.getPosts();
                const users = Z.DB.getUsers();

                let postsHtml = '';
                posts.forEach(post => {
                    const author = users.find(u => u.id === post.authorId) || users[0];
                    postsHtml += `
                        <div class="bg-[#111827] border border-slate-800/80 rounded-2xl p-4 space-y-3 shadow-xl">
                            <div class="flex items-center justify-between">
                                <div class="flex items-center space-x-2.5">
                                    <img src="${author.avatar}" class="w-9 h-9 rounded-full object-cover border border-slate-700">
                                    <div>
                                        <h4 class="font-bold text-xs text-white">${author.name}</h4>
                                        <p class="text-[10px] text-slate-400">${post.createdAt}</p>
                                    </div>
                                </div>
                                <span class="text-[10px] bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-2 py-0.5 rounded-full font-semibold">Feed</span>
                            </div>
                            <p class="text-xs text-slate-200 leading-relaxed">${post.content}</p>
                            ${post.media ? `<div class="rounded-xl overflow-hidden border border-slate-800 bg-slate-950 max-h-72"><img src="${post.media}" class="w-full h-full object-cover"></div>` : ''}
                            <div class="flex items-center justify-between pt-2 border-t border-slate-800/60 text-xs text-slate-400">
                                <button type="button" onclick="Z.RewardEngine.processInteraction('${author.id}', 'like')" class="text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-3 py-1.5 rounded-lg font-bold hover:bg-emerald-500/20 transition flex items-center space-x-1">
                                    <i class="fa-solid fa-heart mr-1"></i> <span>Like ($0.01 Auto)</span>
                                </button>
                                <button type="button" onclick="Z.RewardEngine.processInteraction('${author.id}', 'share')" class="text-[10px] bg-blue-500/10 text-blue-400 border border-blue-500/30 px-3 py-1.5 rounded-lg font-bold hover:bg-blue-500/20 transition flex items-center space-x-1">
                                    <i class="fa-solid fa-share mr-1"></i> <span>Share ($0.03)</span>
                                </button>
                                <button type="button" onclick="Z.RewardEngine.processInteraction('${author.id}', 'subscribe')" class="text-[10px] bg-purple-500/10 text-purple-400 border border-purple-500/30 px-3 py-1.5 rounded-lg font-bold hover:bg-purple-500/20 transition flex items-center space-x-1">
                                    <i class="fa-solid fa-bell mr-1"></i> <span>Subscribe</span>
                                </button>
                            </div>
                        </div>
                    `;
                });
                return `
                    <div class="space-y-4">
                        <div class="bg-gradient-to-r from-emerald-900/40 via-blue-900/40 to-indigo-900/40 border border-emerald-500/30 rounded-2xl p-4 shadow-xl">
                            <h2 class="text-sm font-black text-white flex items-center"><i class="fa-solid fa-bolt text-emerald-400 mr-2"></i> ZYNIX Ecosystem Live Feed</h2>
                            <p class="text-xs text-slate-300 mt-1">Interact with posts to test live rewards, bottom notifications, and floating dollar bills!</p>
                        </div>
                        <div class="space-y-4">${postsHtml}</div>
                    </div>
                `;
            },

            renderProfileDashboard: function() {
                const user = Z.State.currentUser;
                if (!user) {
                    return `
                        <div class="bg-[#111827] border border-slate-800 rounded-2xl p-6 text-center space-y-4">
                            <p class="text-xs text-slate-300">Please log in or sign up to view your profile and manage settings.</p>
                            <button onclick="Z.openAuthModal('login')" class="bg-emerald-600 text-black font-bold text-xs px-4 py-2 rounded-xl">Login Now</button>
                        </div>
                    `;
                }
                return `
                    <div class="space-y-4">
                        <div class="bg-[#111827] border border-slate-800 rounded-2xl overflow-hidden shadow-2xl">
                            <div class="h-28 bg-slate-800 relative">
                                <img src="${user.cover}" class="w-full h-full object-cover">
                            </div>
                            <div class="px-4 pb-4 relative pt-10">
                                <img src="${user.avatar}" class="w-20 h-20 rounded-full object-cover border-4 border-[#111827] absolute -top-10 left-4 shadow-lg">
                                <div class="flex justify-between items-start">
                                    <div>
                                        <h3 class="font-bold text-sm text-white flex items-center">${user.name} <i class="fa-solid fa-circle-check text-emerald-400 ml-1.5 text-xs"></i></h3>
                                        <p class="text-xs text-slate-400">@${user.username} • ${user.profession}</p>
                                    </div>
                                    <button type="button" onclick="Z.showView('bounty-settings')" class="bg-indigo-600/90 hover:bg-indigo-500 text-white font-bold text-xs px-3 py-2 rounded-xl transition shadow-md flex items-center space-x-1.5">
                                        <i class="fa-solid fa-gear"></i><span>Bounty Settings</span>
                                    </button>
                                </div>
                                <p class="text-xs text-slate-300 mt-3 leading-relaxed">${user.bio}</p>
                            </div>
                        </div>

                        <!-- Wallet Quick Card -->
                        <div class="bg-[#111827] border border-slate-800 rounded-2xl p-4 space-y-3 shadow-xl">
                            <div class="flex justify-between items-center">
                                <h4 class="font-bold text-xs text-white uppercase tracking-wider">Wallet Overview</h4>
                                <button onclick="Z.showView('wallet')" class="text-xs text-emerald-400 font-semibold hover:underline">View History</button>
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div class="bg-slate-950/70 border border-slate-800 p-3 rounded-xl">
                                    <span class="text-[10px] text-slate-400 block">Cash Balance</span>
                                    <span class="text-base font-black text-emerald-400">$${user.wallet.cash.toFixed(2)}</span>
                                </div>
                                <div class="bg-slate-950/70 border border-slate-800 p-3 rounded-xl">
                                    <span class="text-[10px] text-slate-400 block">Bounty Balance</span>
                                    <span class="text-base font-black text-blue-400">$${user.wallet.bounty.toFixed(2)}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            },

            renderBountySettings: function() {
                const user = Z.State.currentUser || Z.DB.getUsers()[0];
                const bs = user.bountySettings || { like: 0.01, share: 0.03, follow: 0.03, subscribe: 0.02 };
                return `
                    <div class="bg-[#111827] border border-slate-800 rounded-2xl p-4 space-y-4 shadow-2xl">
                        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                            <div class="flex items-center space-x-2">
                                <button onclick="Z.showView('profile')" class="text-slate-400 hover:text-white mr-1"><i class="fa-solid fa-arrow-left"></i></button>
                                <h3 class="font-bold text-sm text-white">Creator Bounty Settings</h3>
                            </div>
                            <span class="text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded font-bold">Active</span>
                        </div>

                        <p class="text-xs text-slate-400 leading-relaxed">
                            Configure how much bounty reward users earn when they interact with your content (Like, Share, and Subscribe/Follow).
                        </p>

                        <div class="space-y-3.5">
                            <!-- Like Setting (Auto/Default) -->
                            <div class="bg-slate-950/60 border border-slate-800/80 p-3 rounded-xl space-y-1">
                                <div class="flex items-center justify-between">
                                    <label class="block text-xs font-bold text-slate-200">Like Reward (Auto / Default)</label>
                                    <span class="text-[10px] bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded font-mono font-bold">Default</span>
                                </div>
                                <input type="number" step="0.01" id="bounty-like" value="${bs.like !== undefined ? bs.like : 0.01}" readonly class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-400 cursor-not-allowed font-mono">
                                <span class="text-[10px] text-slate-500 block">Automatic default reward assigned when any user likes your post.</span>
                            </div>

                            <!-- Share Setting -->
                            <div class="bg-slate-950/60 border border-slate-800/80 p-3 rounded-xl space-y-1">
                                <label class="block text-xs font-bold text-slate-200">Share Bounty ($)</label>
                                <input type="number" step="0.01" id="bounty-share" value="${bs.share || 0.03}" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs text-white focus:border-emerald-500 focus:outline-none font-mono">
                                <span class="text-[10px] text-slate-500 block">Reward distributed when someone shares your post.</span>
                            </div>

                            <!-- Subscribe / Follow Setting -->
                            <div class="bg-slate-950/60 border border-slate-800/80 p-3 rounded-xl space-y-1">
                                <label class="block text-xs font-bold text-slate-200">Subscribe / Follow Bounty ($)</label>
                                <input type="number" step="0.01" id="bounty-follow" value="${bs.follow || 0.03}" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs text-white focus:border-emerald-500 focus:outline-none font-mono">
                                <span class="text-[10px] text-slate-500 block">Reward distributed when a user follows or subscribes to your profile.</span>
                            </div>

                            <!-- Monthly Subscription Tier Option -->
                            <div class="flex items-center space-x-2.5 pt-2">
                                <input type="checkbox" id="monthly-sub" ${user.monthlySubscription ? 'checked' : ''} class="rounded bg-slate-900 border-slate-700 text-emerald-500 focus:ring-0 w-4 h-4">
                                <label class="text-xs text-slate-300 font-medium">Enable Monthly Subscription Tier Split ($0.02)</label>
                            </div>

                            <button type="button" onclick="Z.Views.saveBountySettings()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-black font-bold py-3 rounded-xl text-xs transition shadow-lg shadow-emerald-600/20 mt-2">
                                Save Bounty Settings
                            </button>
                        </div>
                    </div>
                `;
            },
            saveBountySettings: function() {
                const user = Z.State.currentUser || Z.DB.getUsers()[0];
                if (!user.bountySettings) user.bountySettings = {};
                user.bountySettings.share = parseFloat(document.getElementById('bounty-share').value) || 0.03;
                user.bountySettings.follow = parseFloat(document.getElementById('bounty-follow').value) || 0.03;
                user.monthlySubscription = document.getElementById('monthly-sub').checked;
                user.bountySettings.subscribe = user.monthlySubscription ? 0.02 : 0.01;
                
                Z.DB.saveUsers();
                Z.showToast('Bounty settings updated successfully!');
                Z.showView('profile');
            },

            renderWallet: function() {
                const user = Z.State.currentUser || Z.DB.getUsers()[0];
                let txHtml = '';
                if (user && user.walletTransactions && user.walletTransactions.length > 0) {
                    user.walletTransactions.forEach(tx => {
                        txHtml += `
                            <div class="flex items-center justify-between bg-slate-950/60 border border-slate-800 p-2.5 rounded-xl text-xs">
                                <div>
                                    <span class="font-bold text-white block">${tx.type}</span>
                                    <span class="text-[10px] text-slate-400">${new Date(tx.date).toLocaleTimeString()}</span>
                                </div>
                                <div class="text-right">
                                    <span class="font-black text-emerald-400 block">+$${tx.amount.toFixed(2)}</span>
                                    <span class="text-[9px] text-slate-500">Cash: +$${tx.cash.toFixed(3)} | Bounty: +$${tx.bounty.toFixed(3)}</span>
                                </div>
                            </div>
                        `;
                    });
                } else {
                    txHtml = `<p class="text-xs text-slate-500 text-center py-4">No recent wallet transactions found.</p>`;
                }

                return `
                    <div class="space-y-4">
                        <div class="bg-[#111827] border border-slate-800 rounded-2xl p-4 space-y-4 shadow-2xl">
                            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                                <div class="flex items-center space-x-2">
                                    <button onclick="Z.showView('profile')" class="text-slate-400 hover:text-white mr-1"><i class="fa-solid fa-arrow-left"></i></button>
                                    <h3 class="font-bold text-sm text-white">Wallet & Earnings</h3>
                                </div>
                                <button onclick="Z.RewardEngine.creditReward(Z.State.currentUser || Z.DB.getUsers()[0], 0.05, 'Test Reward')" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-[10px] px-2.5 py-1.5 rounded-lg transition">
                                    <i class="fa-solid fa-plus mr-1"></i> Test Note Animation
                                </button>
                            </div>

                            <div class="grid grid-cols-2 gap-3">
                                <div class="bg-slate-950/80 border border-slate-800 p-3.5 rounded-xl">
                                    <span class="text-[10px] text-slate-400 uppercase font-semibold">Cash Balance</span>
                                    <span class="text-xl font-black text-emerald-400 block mt-1">$${user ? user.wallet.cash.toFixed(2) : '0.00'}</span>
                                </div>
                                <div class="bg-slate-950/80 border border-slate-800 p-3.5 rounded-xl">
                                    <span class="text-[10px] text-slate-400 uppercase font-semibold">Bounty Balance</span>
                                    <span class="text-xl font-black text-blue-400 block mt-1">$${user ? user.wallet.bounty.toFixed(2) : '0.00'}</span>
                                </div>
                            </div>

                            <div class="space-y-2 pt-2">
                                <h4 class="font-bold text-xs text-slate-300 uppercase tracking-wider">Transaction History</h4>
                                <div class="space-y-2 max-h-72 overflow-y-auto">${txHtml}</div>
                            </div>
                        </div>
                    </div>
                `;
            },

            renderPeople: function() {
                const users = Z.DB.getUsers();
                let listHtml = '';
                users.forEach(u => {
                    listHtml += `
                        <div class="bg-[#111827] border border-slate-800 p-3.5 rounded-2xl flex items-center justify-between">
                            <div class="flex items-center space-x-3">
                                <img src="${u.avatar}" class="w-10 h-10 rounded-full object-cover border border-slate-700">
                                <div>
                                    <h4 class="font-bold text-xs text-white">${u.name}</h4>
                                    <p class="text-[10px] text-slate-400">@${u.username} • ${u.profession || 'Creator'}</p>
                                </div>
                            </div>
                            <button type="button" onclick="Z.RewardEngine.processInteraction('${u.id}', 'follow')" class="bg-emerald-600/20 border border-emerald-500/40 text-emerald-400 hover:bg-emerald-600 hover:text-black font-bold text-xs px-3 py-1.5 rounded-xl transition">
                                Follow ($0.03)
                            </button>
                        </div>
                    `;
                });
                return `
                    <div class="space-y-3">
                        <h3 class="font-bold text-sm text-white px-1">Discover Creators & Earn Rewards</h3>
                        <div class="space-y-3">${listHtml}</div>
                    </div>
                `;
            }
        };
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ZYNIX - Complete Social Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        zynix: {
                            bg: "#090d16",
                            card: "#111827",
                            cardHover: "#1f2937",
                            border: "#1e293b",
                            emerald: "#10b981",
                            blue: "#3b82f6",
                            pink: "#ec4899",
                            purple: "#8b5cf6",
                            amber: "#f59e0b",
                            red: "#ef4444",
                            rose: "#f43f5e"
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #090d16; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #334155; }
        
        /* ===== ANIMATIONS ===== */
        @keyframes flyToWalletPure {
            0% { transform: scale(0.6) translateX(0) rotate(0deg); opacity: 0; }
            20% { transform: scale(1.2) translateX(-20px) rotate(-10deg); opacity: 1; }
            80% { transform: scale(0.9) translateY(-160px) translateX(90px) rotate(20deg); opacity: 1; }
            100% { transform: scale(0.3) translateY(-250px) translateX(160px) rotate(45deg); opacity: 0; }
        }
        .dollar-note-pure {
            animation: flyToWalletPure 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
            background: transparent !important;
            box-shadow: none !important;
            border: none !important;
        }
        
        @keyframes pulseWallet {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); box-shadow: 0 0 25px rgba(16, 185, 129, 0.7); }
            100% { transform: scale(1); }
        }
        .wallet-pulse { animation: pulseWallet 0.5s ease-in-out; }
        
        /* ===== WHATSAPP STATUS ===== */
        .status-ring {
            background: linear-gradient(135deg, #10b981, #3b82f6, #8b5cf6);
            padding: 3px;
            border-radius: 50%;
        }
        .status-ring-inner {
            border: 2px solid #090d16;
            border-radius: 50%;
            overflow: hidden;
        }
        .status-ring-viewed {
            background: #1e293b;
            padding: 3px;
            border-radius: 50%;
        }
        
        /* ===== STATUS VIEWER ===== */
        [data-status-media-stage] {
            contain: layout paint !important;
            min-height: 360px !important;
            max-height: 620px !important;
            height: clamp(360px, 58vh, 620px) !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            background: #020617 !important;
            overflow: hidden !important;
            position: relative !important;
        }
        
        [data-status-media-stage] video,
        [data-status-media-stage] img {
            width: 100% !important;
            height: 100% !important;
            max-width: 100% !important;
            max-height: 100% !important;
            object-fit: contain !important;
        }
        
        [data-status-media-stage] .text-status-content {
            width: 100% !important;
            height: 100% !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            padding: 24px !important;
            background: #111827 !important;
            color: #f8fafc !important;
            font-size: clamp(1.2rem, 3vw, 2.2rem) !important;
            font-weight: 700 !important;
            text-align: center !important;
            line-height: 1.6 !important;
            overflow-y: auto !important;
            word-break: break-word !important;
        }
        
        [data-zynix-status-controls] {
            position: relative !important;
            z-index: 100 !important;
            width: 100% !important;
            height: 72px !important;
            min-height: 72px !important;
            max-height: 72px !important;
            flex: 0 0 72px !important;
            display: flex !important;
            align-items: center !important;
            justify-content: space-between !important;
            padding: 10px 14px !important;
            background: #111827 !important;
            border-top: 1px solid rgba(51, 65, 85, 0.65) !important;
            box-sizing: border-box !important;
        }
        
        [data-zynix-status-controls] button {
            position: relative !important;
            z-index: 110 !important;
            flex: 0 0 auto !important;
            height: 42px !important;
            min-height: 42px !important;
            display: inline-flex !important;
            align-items: center !important;
            justify-content: center !important;
            transform: none !important;
            margin-top: 0 !important;
            margin-bottom: 0 !important;
            align-self: center !important;
        }
        
        @media (max-width: 640px) {
            [data-status-media-stage] {
                min-height: 320px !important;
                max-height: 500px !important;
                height: clamp(320px, 52vh, 500px) !important;
            }
        }
        
        /* ===== STATUS ROW ===== */
        #zynix-status-row {
            display: flex !important;
            flex-wrap: nowrap !important;
            overflow-x: auto !important;
            overflow-y: hidden !important;
            -webkit-overflow-scrolling: touch !important;
            scrollbar-width: none !important;
            touch-action: pan-x !important;
            padding: 8px 0 !important;
        }
        #zynix-status-row::-webkit-scrollbar { display: none !important; }
        #zynix-status-row > * { flex: 0 0 auto !important; }
        
        /* ===== CHAT ===== */
        .chat-message-sent {
            background: #10b981 !important;
            color: white !important;
            border-radius: 18px 18px 4px 18px !important;
            padding: 10px 16px !important;
            max-width: 80% !important;
            align-self: flex-end !important;
            margin: 4px 0 !important;
        }
        .chat-message-received {
            background: #1f2937 !important;
            color: #f8fafc !important;
            border-radius: 18px 18px 18px 4px !important;
            padding: 10px 16px !important;
            max-width: 80% !important;
            align-self: flex-start !important;
            margin: 4px 0 !important;
        }
        
        /* ===== NOTIFICATION BADGE ===== */
        .notification-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background: #ef4444;
            color: white;
            font-size: 9px;
            font-weight: 700;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* ===== CIRCLE SHOP ===== */
        .circle-shop-card {
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 16px;
            background: #111827;
            transition: all 0.3s;
        }
        .circle-shop-card:hover {
            border-color: #10b981;
            transform: translateY(-2px);
        }
        .shop-badge {
            font-size: 9px;
            padding: 2px 8px;
            border-radius: 20px;
            font-weight: 600;
        }
        .shop-badge-services { background: #3b82f6/20; color: #3b82f6; }
        .shop-badge-goods { background: #8b5cf6/20; color: #8b5cf6; }
        .shop-badge-social { background: #10b981/20; color: #10b981; }
        
        /* ===== BODY ===== */
        body {
            background-color: #090d16;
            color: #f8fafc;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
    </style>
</head>
<body class="min-h-screen pb-28 selection:bg-emerald-500 selection:text-black">
    <!-- ===== HEADER ===== -->
    <header class="sticky top-0 z-40 bg-[#090d16]/90 backdrop-blur-md border-b border-slate-800 px-4 py-2.5 flex items-center justify-between">
        <div class="flex items-center space-x-3">
            <button type="button" onclick="Z.showView('home')" class="flex items-center space-x-2 text-left focus:outline-none group">
                <div class="w-7 h-7 rounded-full bg-gradient-to-tr from-emerald-400 to-blue-500 flex items-center justify-center font-black text-black text-xs shadow-md">Z</div>
                <span class="text-xl font-black tracking-wider bg-gradient-to-r from-emerald-400 via-blue-500 to-indigo-500 bg-clip-text text-transparent group-hover:opacity-90">ZYNIX</span>
            </button>
        </div>
        <div class="flex items-center space-x-2.5">
            <button type="button" onclick="Z.toggleTheme()" class="text-slate-400 hover:text-white transition">
                <i class="fa-solid fa-moon" id="theme-icon"></i>
            </button>
            <button type="button" onclick="Z.showView('notifications')" class="relative text-slate-400 hover:text-white transition">
                <i class="fa-solid fa-bell text-lg"></i>
                <span id="notification-count" class="hidden notification-badge">0</span>
            </button>
            <button type="button" onclick="Z.showView('wallet')" class="bg-slate-900/90 border border-slate-800 hover:border-slate-700 px-3 py-1 rounded-full text-xs flex items-center space-x-2 shadow-inner transition">
                <div class="flex items-center space-x-1"><i class="fa-solid fa-wallet text-emerald-400 text-[10px]"></i><span id="header-cash" class="text-emerald-400 font-bold">$0.00</span></div>
                <span class="text-slate-700">|</span>
                <div class="flex items-center space-x-1"><i class="fa-solid fa-gift text-blue-400 text-[10px]"></i><span id="header-bounty" class="text-blue-400 font-bold">$0.00</span></div>
            </button>
            <div id="header-auth-container"></div>
        </div>
    </header>

    <!-- ===== MAIN ===== -->
    <main id="app-container" class="max-w-xl mx-auto px-3 py-3 min-h-[calc(100vh-120px)] relative"></main>

    <!-- ===== BOTTOM NAV ===== -->
    <nav class="fixed bottom-0 left-0 right-0 z-40 bg-[#090d16]/95 backdrop-blur-lg border-t border-slate-800 px-2 py-2 max-w-xl mx-auto flex items-center justify-between shadow-2xl">
        <button type="button" onclick="Z.showView('home')" id="nav-btn-home" class="flex flex-col items-center justify-center text-slate-400 hover:text-emerald-400 transition w-1/6 py-1">
            <i class="fa-solid fa-house text-base"></i><span class="text-[9px] font-medium mt-0.5">Home</span>
        </button>
        <button type="button" onclick="Z.showView('spark')" id="nav-btn-spark" class="flex flex-col items-center justify-center text-slate-400 hover:text-emerald-400 transition w-1/6 py-1">
            <i class="fa-solid fa-bolt text-base"></i><span class="text-[9px] font-medium mt-0.5">Spark</span>
        </button>
        <button type="button" onclick="Z.openCreateSelectionModal()" class="flex items-center justify-center w-10 h-10 bg-gradient-to-tr from-emerald-500 to-blue-600 rounded-full text-black hover:scale-105 transition shadow-lg shadow-emerald-500/20 -mt-2">
            <i class="fa-solid fa-plus text-sm font-black"></i>
        </button>
        <button type="button" onclick="Z.showView('circles')" id="nav-btn-circles" class="flex flex-col items-center justify-center text-slate-400 hover:text-emerald-400 transition w-1/6 py-1">
            <i class="fa-solid fa-circle-nodes text-base"></i><span class="text-[9px] font-medium mt-0.5">Circles</span>
        </button>
        <button type="button" onclick="Z.showView('people')" id="nav-btn-people" class="flex flex-col items-center justify-center text-slate-400 hover:text-emerald-400 transition w-1/6 py-1">
            <i class="fa-solid fa-users text-base"></i><span class="text-[9px] font-medium mt-0.5">People</span>
        </button>
        <button type="button" onclick="Z.showView('profile')" id="nav-btn-profile" class="flex flex-col items-center justify-center text-slate-400 hover:text-emerald-400 transition w-1/6 py-1">
            <i class="fa-solid fa-user text-base"></i><span class="text-[9px] font-medium mt-0.5">Profile</span>
        </button>
    </nav>

    <!-- ===== TOAST ===== -->
    <div id="toast-container" class="fixed bottom-24 left-4 right-4 z-50 flex flex-col items-center space-y-2 pointer-events-none"></div>

    <!-- ===== MODALS ===== -->
    <div id="modal-container"></div>

    <!-- ============================================================ -->
    <!-- ZYNIX APPLICATION ENGINE - COMPLETE PLATFORM                 -->
    <!-- ============================================================ -->
    <script>
    (function() {
        'use strict';
        
        window.Z = {};
        const Z = window.Z;
        
        // ============================================================
        // SECURITY HELPERS
        // ============================================================
        Z.escapeHtml = function(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        };
        Z.safe = Z.escapeHtml;
        
        // ============================================================
        // STATE
        // ============================================================
        Z.State = {
            currentUser: null,
            currentView: 'home',
            circleSearchQuery: '',
            sparkTagFilter: '',
            peopleSearchQuery: '',
            viewerAuthorId: '',
            viewerIndex: 0,
            viewerStatuses: [],
            theme: 'dark',
            notifications: [],
            unreadNotifications: 0,
            messages: [],
            selectedChat: null,
            chatMessages: [],
            feedPage: 0,
            isLoadingFeed: false,
            hasMoreFeed: true
        };
        
        // ============================================================
        // REACTION REWARDS - 5-LEVEL SYSTEM
        // ============================================================
        Z.ReactionRewards = {
            'love': { symbol: '❤️', label: 'Love', reward: 0.05, emoji: '❤️' },
            'fire': { symbol: '🔥', label: 'Fire', reward: 0.04, emoji: '🔥' },
            'star': { symbol: '⭐', label: 'Star', reward: 0.03, emoji: '⭐' },
            'like': { symbol: '👍', label: 'Like', reward: 0.02, emoji: '👍' },
            'insight': { symbol: '💡', label: 'Insight', reward: 0.01, emoji: '💡' },
            'dislike': { symbol: '👎', label: 'Dislike', reward: 0.00, emoji: '👎' }
        };
        
        // ============================================================
        // PACKAGES
        // ============================================================
        Z.Packages = {
            'Free': { name: 'Free', price: 0, dailyLimit: 0, canEarn: false, likeRewardRate: 0 },
            'Starter $3': { name: 'Starter $3', price: 3, dailyLimit: 10, canEarn: true, likeRewardRate: 0.01 },
            'Growth $10': { name: 'Growth $10', price: 10, dailyLimit: 25, canEarn: true, likeRewardRate: 0.015 },
            'Creator $20': { name: 'Creator $20', price: 20, dailyLimit: 50, canEarn: true, likeRewardRate: 0.02 },
            'Pro $40': { name: 'Pro $40', price: 40, dailyLimit: 100, canEarn: true, likeRewardRate: 0.02 },
            'Enterprise $100': { name: 'Enterprise $100', price: 100, dailyLimit: 500, canEarn: true, likeRewardRate: 0.025 }
        };
        
        // ============================================================
        // REWARD ENGINE
        // ============================================================
        Z.RewardEngine = {
            calculateSplit: function(grossAmount) {
                return {
                    cash: Number((grossAmount * 0.60).toFixed(4)),
                    bounty: Number((grossAmount * 0.40).toFixed(4)),
                    gross: grossAmount
                };
            },
            checkDailyLimit: function(user) {
                var today = new Date().toISOString().split('T')[0];
                if (!user.dailyTracker || user.dailyTracker.date !== today) {
                    user.dailyTracker = { date: today, count: 0 };
                }
                var pkg = Z.Packages[user.package || 'Free'] || Z.Packages['Free'];
                return {
                    allowed: user.dailyTracker.count < pkg.dailyLimit,
                    current: user.dailyTracker.count,
                    limit: pkg.dailyLimit
                };
            },
            creditReward: function(user, grossAmount, reason) {
                if (!user) return false;
                var split = this.calculateSplit(grossAmount);
                if (!user.wallet) user.wallet = { cash: 0, bounty: 0, totalEarned: 0 };
                if (!user.walletTransactions) user.walletTransactions = [];
                user.wallet.cash += split.cash;
                user.wallet.bounty += split.bounty;
                user.wallet.totalEarned += grossAmount;
                user.walletTransactions.unshift({
                    id: 'tx_' + Date.now(),
                    date: new Date().toISOString(),
                    type: reason,
                    amount: grossAmount,
                    cash: split.cash,
                    bounty: split.bounty,
                    status: 'Completed'
                });
                Z.DB.saveUsers();
                Z.updateHeaderWallet();
                Z.triggerRewardAnimation(grossAmount);
                Z.showToast('Reward: +$' + grossAmount.toFixed(2) + ' (+$' + split.cash.toFixed(3) + ' Cash, +$' + split.bounty.toFixed(3) + ' Bounty)');
                return true;
            },
            processInteraction: function(contentOwnerId, interactionType, targetId, reactionType) {
                if (!Z.State.currentUser) {
                    Z.openAuthModal('login');
                    Z.showToast('Please log in.');
                    return false;
                }
                var currentUser = Z.DB.getUserById(Z.State.currentUser.id);
                var pkg = Z.Packages[currentUser.package || 'Free'] || Z.Packages['Free'];
                if (!pkg.canEarn) {
                    Z.showToast('Free users cannot earn rewards. Upgrade!');
                    return false;
                }
                var limitStatus = this.checkDailyLimit(currentUser);
                if (!limitStatus.allowed) {
                    Z.showToast('Daily limit reached.');
                    return false;
                }
                var contentOwner = Z.DB.getUserById(contentOwnerId);
                if (!contentOwner || contentOwner.id === currentUser.id) {
                    Z.showToast('Invalid action.');
                    return false;
                }
                if (!currentUser.interactionHistory) currentUser.interactionHistory = {};
                var actionKey = interactionType + '_' + (targetId || contentOwnerId) + '_' + (reactionType || '');
                if (currentUser.interactionHistory[actionKey]) {
                    Z.showToast('Already rewarded for this action.');
                    return false;
                }
                
                // Get reward based on reaction type
                var rewardAmount = 0.01;
                if (reactionType && Z.ReactionRewards[reactionType]) {
                    rewardAmount = Z.ReactionRewards[reactionType].reward;
                } else {
                    var bountySettings = contentOwner.bountySettings || {};
                    rewardAmount = bountySettings[interactionType] || 0.01;
                }
                rewardAmount = Math.min(0.05, Math.max(0, rewardAmount));
                
                if (!contentOwner.wallet) contentOwner.wallet = { cash: 0, bounty: 0, totalEarned: 0 };
                if (contentOwner.wallet.bounty < rewardAmount) {
                    Z.showToast('Creator bounty insufficient.');
                    return false;
                }
                contentOwner.wallet.bounty -= rewardAmount;
                if (!contentOwner.bountySpentHistory) contentOwner.bountySpentHistory = [];
                contentOwner.bountySpentHistory.unshift({
                    id: 'bspend_' + Date.now(),
                    date: new Date().toISOString(),
                    recipient: currentUser.name,
                    action: interactionType + (reactionType ? ' (' + reactionType + ')' : ''),
                    amount: rewardAmount
                });
                
                // Update counters
                if (interactionType === 'like' || interactionType === 'reaction') {
                    var post = Z.DB.getPosts().find(function(p) { return p.id === targetId; });
                    if (post) {
                        if (!post.reactions) post.reactions = {};
                        var reactKey = reactionType || 'like';
                        post.reactions[reactKey] = (post.reactions[reactKey] || 0) + 1;
                        Z.DB.savePosts();
                    }
                } else if (interactionType === 'share') {
                    var post2 = Z.DB.getPosts().find(function(p) { return p.id === targetId; });
                    if (post2) {
                        post2.shares = (post2.shares || 0) + 1;
                        Z.DB.savePosts();
                    }
                } else if (interactionType === 'spark_like') {
                    var spark = Z.DB.getSparks().find(function(s) { return s.id === targetId; });
                    if (spark) {
                        spark.likes = (spark.likes || 0) + 1;
                        Z.DB.saveSparks();
                    }
                } else if (interactionType === 'connect') {
                    contentOwner.connections = (contentOwner.connections || 0) + 1;
                    if (!currentUser.connected) currentUser.connected = [];
                    if (!currentUser.connected.includes(contentOwner.id)) currentUser.connected.push(contentOwner.id);
                } else if (interactionType === 'circleJoin') {
                    var circles = Z.DB.getCircles();
                    var circle = circles.find(function(c) { return c.id === targetId; });
                    if (circle) {
                        circle.membersCount = (circle.membersCount || 0) + 1;
                        Z.DB.saveCircles(circles);
                    }
                } else if (interactionType === 'comment') {
                    // Comment reward handled separately
                }
                
                currentUser.interactionHistory[actionKey] = new Date().toISOString();
                currentUser.dailyTracker.count++;
                Z.DB.saveUsers();
                this.creditReward(currentUser, rewardAmount, (interactionType + (reactionType ? ' ' + reactionType : '')).toUpperCase() + ' Reward');
                if (['home', 'spark', 'people', 'circles'].indexOf(Z.State.currentView) !== -1) {
                    Z.showView(Z.State.currentView);
                }
                return true;
            }
        };
        
        // ============================================================
        // UI HELPERS
        // ============================================================
        Z.triggerRewardAnimation = function(amount) {
            var walletEl = document.querySelector('header');
            if (walletEl) {
                walletEl.classList.add('wallet-pulse');
                setTimeout(function() { walletEl.classList.remove('wallet-pulse'); }, 500);
            }
            var note = document.createElement('div');
            note.className = 'fixed z-50 text-emerald-400 font-black text-2xl dollar-note-pure pointer-events-none flex items-center space-x-1';
            note.style.right = '50px';
            note.style.top = '70px';
            note.innerHTML = '<i class="fa-solid fa-money-bill-wave text-emerald-400 drop-shadow-[0_4px_12px_rgba(16,185,129,0.8)]"></i><span class="text-xs font-bold text-emerald-300 drop-shadow">+$' + amount.toFixed(2) + '</span>';
            document.body.appendChild(note);
            setTimeout(function() { note.remove(); }, 1200);
        };
        
        Z.showToast = function(message) {
            var container = document.getElementById('toast-container');
            if (!container) return;
            var toast = document.createElement('div');
            toast.className = 'bg-slate-900/95 border border-emerald-500/40 text-slate-100 px-4 py-2.5 rounded-xl text-xs shadow-2xl flex items-center space-x-2.5 pointer-events-auto transition transform translate-y-4 opacity-0 max-w-md w-full backdrop-blur-md';
            toast.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-400 text-sm shrink-0"></i><span class="font-medium">' + Z.escapeHtml(message) + '</span>';
            container.appendChild(toast);
            setTimeout(function() { toast.classList.remove('translate-y-4', 'opacity-0'); }, 10);
            setTimeout(function() {
                toast.classList.add('opacity-0', 'transition', 'duration-300');
                setTimeout(function() { toast.remove(); }, 300);
            }, 3200);
        };
        
        Z.closeModal = function() {
            document.getElementById('modal-container').innerHTML = '';
        };
        
        Z.updateHeaderWallet = function() {
            var user = Z.State.currentUser;
            var cashEl = document.getElementById('header-cash');
            var bountyEl = document.getElementById('header-bounty');
            if (cashEl) cashEl.innerText = '$' + (user && user.wallet ? user.wallet.cash.toFixed(2) : '0.00');
            if (bountyEl) bountyEl.innerText = '$' + (user && user.wallet ? user.wallet.bounty.toFixed(2) : '0.00');
        };
        
        Z.toggleTheme = function() {
            var html = document.documentElement;
            var icon = document.getElementById('theme-icon');
            if (html.classList.contains('dark')) {
                html.classList.remove('dark');
                html.classList.add('light');
                icon.className = 'fa-solid fa-sun';
                Z.State.theme = 'light';
            } else {
                html.classList.remove('light');
                html.classList.add('dark');
                icon.className = 'fa-solid fa-moon';

        Z.handleAuthSubmit = function(mode) {
            var email = document.getElementById('auth-email').value.trim();
            var pass = document.getElementById('auth-password').value.trim();
            if (!email || !pass) { Z.showToast('Please fill all fields.'); return; }
            var users = Z.DB.getUsers();
            if (mode === 'login') {
                var found = null;
                for (var i = 0; i < users.length; i++) {
                    if ((users[i].email.toLowerCase() === email.toLowerCase() || users[i].username.toLowerCase() === email.toLowerCase()) && users[i].password === pass) {
                        found = users[i]; break;
                    }
                }
                if (found) { Z.DB.setCurrentUser(found); Z.closeModal(); Z.showToast('Welcome back!'); Z.showView('profile'); }
                else { Z.showToast('Invalid credentials.'); }
            } else {
                for (var j = 0; j < users.length; j++) {
                    if (users[j].email.toLowerCase() === email.toLowerCase()) { Z.showToast('Email already exists.'); return; }
                }
                var name = document.getElementById('auth-name').value.trim() || 'New Creator';
                var ref = document.getElementById('auth-refcode') ? document.getElementById('auth-refcode').value.trim() : '';
                var refId = null;
                for (var k = 0; k < users.length; k++) {
                    if (users[k].referrals && users[k].referrals.code.toUpperCase() === ref.toUpperCase()) { refId = users[k].id; break; }

        // ============================================================
        
        var MEDIA_DB = 'ZYNIX_STATUS_MEDIA_V2';
        var MEDIA_STORE = 'media';
        
        function openMediaDB() {
            return new Promise(function(resolve, reject) {
                if (!window.indexedDB) { reject(new Error('IndexedDB unavailable')); return; }
                var request = indexedDB.open(MEDIA_DB, 1);
                request.onupgradeneeded = function(e) {
                    var db = e.target.result;
                    if (!db.objectStoreNames.contains(MEDIA_STORE)) {
                        db.createObjectStore(MEDIA_STORE, { keyPath: 'id' });
                    }
                };
                request.onsuccess = function() { resolve(request.result); };
                request.onerror = function() { reject(request.error); };
            });
        }
        
        Z._storeStatusMedia = async function(file) {
            var db = await openMediaDB();
            return new Promise(function(resolve, reject) {
                var id = 'media_' + Date.now() + '_' + Math.random().toString(36).slice(2);
                var tx = db.transaction(MEDIA_STORE, 'readwrite');
                tx.objectStore(MEDIA_STORE).put({ id: id, blob: file, type: file.type || '', name: file.name || '' });
                tx.oncomplete = function() { db.close(); resolve('idb:' + id); };
                tx.onerror = function() { db.close(); reject(tx.error); };
            });
        };
        
        Z._loadStatusMedia = async function(ref) {
            if (!ref || String(ref).indexOf('idb:') !== 0) return ref || '';
            var id = String(ref).replace(/^idb:/, '');
            try {
                var db = await openMediaDB();
                return await new Promise(function(resolve) {
                    var tx = db.transaction(MEDIA_STORE, 'readonly');
                    var req = tx.objectStore(MEDIA_STORE).get(id);
                    req.onsuccess = function() {
                        var item = req.result;
                        if (!item || !item.blob) { db.close(); resolve(''); return; }
                        var url = URL.createObjectURL(item.blob);
                        db.close();
                        resolve(url);
                    };
                    req.onerror = function() { db.close(); resolve(''); };
                });
            } catch (e) { return ''; }
        };
        
        function _getUsers() { try { return Z.DB.getUsers(); } catch(e) { return []; } }
        function _getStatuses() { try { return Z.DB.getStatuses(); } catch(e) { return []; } }
        function _saveStatuses(arr) { try { Z.DB.saveStatuses(arr); } catch(e) {} }
        function _userById(id) {
            var users = _getUsers();
            for (var i = 0; i < users.length; i++) {
                if (String(users[i].id) === String(id)) return users[i];
            }
            return null;
        }
        function _userName(u) { return u ? (u.name || u.username || 'ZYNIX User') : 'ZYNIX User'; }
        function _userAvatar(u) {
            return u && u.avatar ? u.avatar : 'https://ui-avatars.com/api/?name=' + encodeURIComponent(_userName(u)) + '&background=111827&color=34d399';
        }
        function _currentUser() { return Z.State.currentUser || Z.DB.getCurrentUser() || null; }
        
        function _liveStatuses() {
            var now = Date.now();
            var all = _getStatuses();
            var result = [];
            for (var i = 0; i < all.length; i++) {
                var s = all[i];
                if (!s) continue;
                var created = Number(s.timestamp || 0);
                var expires = Number(s.expiresAt || 0);
                if (expires && expires <= now) continue;
                if (created && now - created > 24 * 60 * 60 * 1000) continue;
                result.push(s);
            }
            result.sort(function(a, b) { return Number(b.timestamp || 0) - Number(a.timestamp || 0); });
            return result;
        }
        
        Z.getZynixStatusContacts = function() {
            var me = _currentUser();
            var users = _getUsers();
            if (!me) return [];
            
            var ids = [];
            if (Array.isArray(me.connected)) ids = me.connected.map(String);
            
            if (!ids.length) {
                var result = [];
                for (var j = 0; j < users.length; j++) {
                    if (String(users[j].id) !== String(me.id)) result.push(users[j]);
                }
                return result;
            }
            
            var filtered = [];
            for (var k = 0; k < users.length; k++) {
                if (ids.indexOf(String(users[k].id)) !== -1 && String(users[k].id) !== String(me.id)) {
                    filtered.push(users[k]);
                }
            }
            return filtered;
        };
        
        Z.getActiveZynixStatuses = function() {
            var all = _liveStatuses();
            var contacts = Z.getZynixStatusContacts();
            var me = _currentUser();
            var allowed = {};
            for (var i = 0; i < contacts.length; i++) { allowed[String(contacts[i].id)] = true; }
            if (me) allowed[String(me.id)] = true;
            var result = [];
            for (var j = 0; j < all.length; j++) {
                if (allowed[String(all[j].authorId)]) result.push(all[j]);
            }
            return result;
        };
        
        var _pendingStatusFile = null;
        
        Z.openCreateStatusModal = function() {
            if (!_currentUser()) { Z.openAuthModal('login'); return; }
            var modal = document.getElementById('modal-container');
            if (!modal) return;
            _pendingStatusFile = null;
            
            modal.innerHTML = '<div class="fixed inset-0 z-[100] bg-black/85 backdrop-blur-sm flex items-center justify-center p-4"><div class="bg-[#111827] border border-slate-800 rounded-2xl w-full max-w-md p-5 shadow-2xl relative"><div class="flex items-center justify-between border-b border-slate-800 pb-3 mb-4"><h3 class="font-black text-base text-white">Add Status <span class="text-emerald-400 text-xs ml-1">24h</span></h3><button type="button" onclick="Z.closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button></div><div class="space-y-3"><textarea id="zynix-status-text" rows="5" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-3 text-sm text-white placeholder-slate-600 outline-none focus:border-emerald-500" placeholder="What\'s happening right now?"></textarea><input id="zynix-status-file" type="file" accept="image/*,video/*" class="hidden" onchange="Z._previewPendingStatusMedia(this)"><button type="button" onclick="document.getElementById(\'zynix-status-file\').click()" class="w-full bg-slate-900 border border-slate-800 text-slate-300 hover:text-white rounded-xl py-3 text-xs font-bold"><i class="fa-solid fa-image mr-2 text-emerald-400"></i> Add Photo / Video</button><div id="zynix-status-preview"></div><button type="button" onclick="Z._submitStatusFinal()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-black font-black rounded-xl py-3 text-xs">Publish Status</button><p class="text-[10px] text-slate-500 text-center">Text, photo, or video</p></div></div></div>';
            setTimeout(function() { var el = document.getElementById('zynix-status-text'); if (el) el.focus(); }, 80);
        };
        
        Z._previewPendingStatusMedia = function(input) {
            var file = input && input.files && input.files[0];
            if (!file) return;
            if (file.size > 100 * 1024 * 1024) { Z.showToast('Media under 100 MB.'); input.value = ''; _pendingStatusFile = null; return; }
            _pendingStatusFile = file;
            var box = document.getElementById('zynix-status-preview');
            if (!box) return;
            var url = URL.createObjectURL(file);
            if (file.type.indexOf('video/') === 0) {
                box.innerHTML = '<div class="relative rounded-xl overflow-hidden border border-slate-800 bg-black"><video src="' + url + '" controls playsinline class="w-full max-h-64 object-contain bg-black"></video><button type="button" onclick="Z._removePendingStatusMedia()" class="absolute top-2 right-2 w-7 h-7 rounded-full bg-black/80 text-white"><i class="fa-solid fa-xmark"></i></button><div class="px-3 py-2 text-[10px] text-slate-400">' + Z.escapeHtml(file.name) + '</div></div>';
            } else {
                box.innerHTML = '<div class="relative rounded-xl overflow-hidden border border-slate-800 bg-black"><img src="' + url + '" class="w-full max-h-64 object-contain"><button type="button" onclick="Z._removePendingStatusMedia()" class="absolute top-2 right-2 w-7 h-7 rounded-full bg-black/80 text-white"><i class="fa-solid fa-xmark"></i></button><div class="px-3 py-2 text-[10px] text-slate-400">' + Z.escapeHtml(file.name) + '</div></div>';
            }
        };
        
        Z._removePendingStatusMedia = function() {
            _pendingStatusFile = null;
            var input = document.getElementById('zynix-status-file');
            var preview = document.getElementById('zynix-status-preview');
            if (input) input.value = '';
            if (preview) preview.innerHTML = '';
        };
        
        Z._submitStatusFinal = async function() {
            var textEl = document.getElementById('zynix-status-text');
            var text = textEl ? textEl.value.trim() : '';
            var file = _pendingStatusFile;
            
            if (!text && !file) { Z.showToast('Add text or media.'); return; }
            
            var me = _currentUser();
            if (!me) return;
            
            var media = '';
            var mediaType = '';
            
            if (file) {
                try {
                    media = await Z._storeStatusMedia(file);
                    mediaType = file.type.indexOf('video/') === 0 ? 'video' : 'image';
                } catch (e) {
                    try {
                        media = await new Promise(function(resolve, reject) {
                            var reader = new FileReader();
                            reader.onload = function() { resolve(String(reader.result || '')); };
                            reader.onerror = reject;
                            reader.readAsDataURL(file);
                        });
                        mediaType = file.type.indexOf('video/') === 0 ? 'video' : 'image';
                    } catch (err) { Z.showToast('Could not read media.'); return; }
                }
            }
            
            var now = Date.now();
            var current = _liveStatuses();
            var newStatus = {
                id: 'st_' + now + '_' + Math.random().toString(36).slice(2),
                type: 'status',
                authorId: me.id,
                content: text || '',
                media: media || '',
                mediaType: mediaType || '',
                timestamp: now,
                createdAt: new Date(now).toISOString(),
                expiresAt: now + 24 * 60 * 60 * 1000,
                viewedBy: []
            };
            
            current.unshift(newStatus);
            _saveStatuses(current);
            _pendingStatusFile = null;
            Z.closeModal();
            Z.showToast('Status published for 24 hours.');
            Z.showView('home');
        };

        Z.renderStatusRow = function() {
            var existing = document.getElementById('zynix-status-row');
            if (existing) existing.remove();
            
            var home = document.getElementById('app-container');
            if (!home) return;
            
            var me = _currentUser();

            var all = Z.getActiveZynixStatuses();

            for (var i = 0; i < all.length; i++) {
                var s = all[i];
                var id = String(s.authorId);
                if (!grouped[id]) grouped[id] = [];
                grouped[id].push(s);
            }

            for (var j = 0; j < keys.length; j++) {

                html += '<button type="button" class="shrink-0 w-[72px] text-center" onclick="Z.openStatusViewer(\'' + Z.escapeHtml(u.id) + '\', 0)"><div class="' + ringClass + ' w-14 h-14 mx-auto"><div class="w-full h-full rounded-full bg-slate-950 p-[2px]"><img src="' + Z.escapeHtml(_userAvatar(u)) + '" class="w-full h-full rounded-full object-cover"></div></div><span class="block mt-1 text-[10px] font-semibold text-slate-300 truncate">' + Z.escapeHtml(_userName(u)) + '</span></button>';

        // ============================================================
        // STATUS VIEWER - Full Screen
        // ============================================================
        var _viewerAuthorId = '';
        var _viewerIndex = 0;
        var _viewerStatuses = [];
        var _viewerTimer = null;
        
        Z.openStatusViewer = function(authorId, index) {
            var all = Z.getActiveZynixStatuses();
            _viewerStatuses = all.filter(function(s) { return String(s.authorId) === String(authorId); });
            _viewerStatuses.sort(function(a, b) { return Number(b.timestamp || 0) - Number(a.timestamp || 0); });
            
            if (!_viewerStatuses.length) {
                Z.showToast('No active statuses.');
                return;
            }
            
            // Mark as viewed
            var me = _currentUser();
            if (me) {
                for (var i = 0; i < _viewerStatuses.length; i++) {
                    if (!_viewerStatuses[i].viewedBy) _viewerStatuses[i].viewedBy = [];
                    if (_viewerStatuses[i].viewedBy.indexOf(me.id) === -1) {
                        _viewerStatuses[i].viewedBy.push(me.id);
                    }
                }
                _saveStatuses(_getStatuses());
            }
            
            _viewerAuthorId = String(authorId);
            _viewerIndex = Math.max(0, Math.min(Number(index || 0), _viewerStatuses.length - 1));
            Z._showStatusViewer();
        };
        
        Z._showStatusViewer = function() {
            var status = _viewerStatuses[_viewerIndex];
            if (!status) { Z.showView('home'); return; }
            
            var author = _userById(status.authorId);
            if (!author) { Z.showView('home'); return; }
            
            var app = document.getElementById('app-container');
            if (!app) return;
            
            // Load media
            var mediaContent = '';
            if (status.media) {
                mediaContent = '<div id="status-viewer-media-loader" class="w-full h-full flex items-center justify-center bg-black"><div class="text-slate-500 text-xs">Loading...</div></div>';
            }
            
            // Get all contacts for navigation
            var allContacts = Z.getActiveZynixStatuses();
            var contactMap = {};
            for (var i = 0; i < allContacts.length; i++) {
                var s = allContacts[i];
                var id = String(s.authorId);
                if (!contactMap[id]) contactMap[id] = [];
                contactMap[id].push(s);
            }
            
            var contactKeys = Object.keys(contactMap);
            var otherHTML = '';
            for (var j = 0; j < contactKeys.length; j++) {
                var key = contactKeys[j];
                var u = _userById(key);
                if (u && key !== String(_viewerAuthorId)) {
                    otherHTML += '<button type="button" onclick="Z.openStatusViewer(\'' + Z.escapeHtml(key) + '\', 0)" class="text-center"><div class="w-12 h-12 mx-auto rounded-full bg-slate-800 p-[2px]"><img src="' + Z.escapeHtml(_userAvatar(u)) + '" class="w-full h-full rounded-full object-cover"></div><div class="mt-1 text-[9px] text-slate-400 truncate">' + Z.escapeHtml(_userName(u)) + '</div></button>';
                }
            }
            
            var totalStatuses = _viewerStatuses.length;
            var currentIndex = _viewerIndex + 1;
            
            var contentHTML = '';
            if (status.media) {
                contentHTML = '<div data-status-media-stage id="status-viewer-stage"><div id="status-viewer-media-content" class="w-full h-full flex items-center justify-center bg-black"><div class="text-slate-500 text-xs">Loading media...</div></div></div>';
                if (status.content) {
                    contentHTML += '<div class="w-full px-5 py-4 text-center flex items-center justify-center bg-[#111827]"><div class="text-white text-base sm:text-xl font-semibold leading-relaxed whitespace-pre-wrap break-words max-w-2xl">' + Z.escapeHtml(status.content) + '</div></div>';
                }
            } else {
                contentHTML = '<div data-status-media-stage><div class="text-status-content">' + Z.escapeHtml(status.content || 'No content') + '</div></div>';
            }
            
            app.innerHTML = '<div id="zynix-status-viewer-page" class="fixed inset-0 z-[200] bg-black/95 text-white flex flex-col">' +
                '<div class="flex items-center justify-between px-4 py-3 border-b border-slate-800/50">' +
                    '<button type="button" onclick="Z.closeStatusViewer()" class="text-white/70 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>' +
                    '<div class="flex items-center gap-3">' +
                        '<img src="' + Z.escapeHtml(_userAvatar(author)) + '" class="w-8 h-8 rounded-full object-cover">' +
                        '<div><div class="font-bold text-sm">' + Z.escapeHtml(_userName(author)) + '</div><div class="text-[10px] text-white/50">' + currentIndex + ' / ' + totalStatuses + '</div></div>' +
                    '</div>' +
                    '<div></div>' +
                '</div>' +
                '<div class="flex-1 flex items-center justify-center relative">' +
                    contentHTML +
                    '<button type="button" onclick="Z.statusViewerPrevious()" class="absolute left-2 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-black/50 flex items-center justify-center hover:bg-white/20 transition"><i class="fa-solid fa-chevron-left"></i></button>' +
                    '<button type="button" onclick="Z.statusViewerNext()" class="absolute right-2 top-1/2 -translate-y-1/2 w-10 h-10 rounded-full bg-black/50 flex items-center justify-center hover:bg-white/20 transition"><i class="fa-solid fa-chevron-right"></i></button>' +
                '</div>' +
                '<div class="px-4 py-3 border-t border-slate-800/50">' +
                    '<div class="flex items-center gap-3 overflow-x-auto" style="scrollbar-width:none;">' +
                        '<span class="text-[10px] text-white/50 shrink-0">Contacts</span>' +
                        otherHTML +
                    '</div>' +
                '</div>' +
                '<div class="px-4 py-2 text-center text-[9px] text-white/30">Tap to pause/resume • Swipe to navigate</div>' +
                '</div>';
            
            // Load media
            if (status.media) {
                Z._loadStatusMediaIntoViewer(status);
            }
            
            // Start timer
            if (status.mediaType !== 'video') {
                Z._startStatusTimer();
            }
            
            // Setup touch handlers
            Z._setupViewerTouchHandlers();
        };
        
        Z._loadStatusMediaIntoViewer = async function(status) {
            var container = document.getElementById('status-viewer-media-content');
            if (!container) return;
            
            if (!status.media) {
                container.innerHTML = '<div class="text-slate-500 text-xs">No media</div>';
                return;
            }
            
            var mediaUrl = await Z._loadStatusMedia(status.media);
            if (!mediaUrl) {
                container.innerHTML = '<div class="text-slate-500 text-xs">Media unavailable</div>';
                return;
            }
            
            if (status.mediaType === 'video') {
                container.innerHTML = '<video src="' + Z.escapeHtml(mediaUrl) + '" controls autoplay playsinline class="w-full h-full object-contain bg-black"></video>';
                var video = container.querySelector('video');
                if (video) {
                    video.addEventListener('ended', function() {
                        Z.statusViewerNext();
                    });
                }
                Z._clearStatusTimer();
            } else {
                container.innerHTML = '<img src="' + Z.escapeHtml(mediaUrl) + '" class="w-full h-full object-contain bg-black" alt="Status">';
            }
        };
        
        Z._startStatusTimer = function() {
            Z._clearStatusTimer();
            _viewerTimer = setTimeout(function() {
                Z.statusViewerNext();
            }, 7000);
        };
        
        Z._clearStatusTimer = function() {
            if (_viewerTimer) {
                clearTimeout(_viewerTimer);
                _viewerTimer = null;
            }
        };
        
        Z._setupViewerTouchHandlers = function() {
            var stage = document.getElementById('status-viewer-stage');
            if (!stage) return;
            
            var isPaused = false;
            
            var onPointerDown = function(e) {
                if (e.target.closest('button') || e.target.closest('video')) return;
                isPaused = true;
                Z._clearStatusTimer();
                Z.showToast('Paused');
            };
            
            var onPointerUp = function(e) {
                if (!isPaused) return;
                isPaused = false;
                var status = _viewerStatuses[_viewerIndex];
                if (status && status.mediaType !== 'video') {
                    Z._startStatusTimer();
                }
                Z.showToast('Resumed');
            };
            
            stage.addEventListener('pointerdown', onPointerDown);
            stage.addEventListener('pointerup', onPointerUp);
            stage.addEventListener('pointerleave', onPointerUp);
            
            // Swipe
            var touchStartX = 0;
            stage.addEventListener('touchstart', function(e) {
                touchStartX = e.touches[0].clientX;
            }, { passive: true });
            
            stage.addEventListener('touchend', function(e) {
                var diffX = touchStartX - e.changedTouches[0].clientX;
                if (Math.abs(diffX) > 50) {
                    if (diffX > 0) {
                        Z._advanceToNextContact();
                    } else {
                        Z._advanceToPreviousContact();
                    }
                }
            }, { passive: true });
        };
        
        Z._advanceToNextContact = function() {
            var all = Z.getActiveZynixStatuses();
            var contactMap = {};
            for (var i = 0; i < all.length; i++) {
                var id = String(all[i].authorId);
                if (!contactMap[id]) contactMap[id] = [];
                contactMap[id].push(all[i]);
            }
            var keys = Object.keys(contactMap);
            if (keys.length <= 1) { Z.showToast('No more contacts.'); return; }
            var currentIdx = keys.indexOf(String(_viewerAuthorId));
            var nextIdx = (currentIdx + 1) % keys.length;
            Z.openStatusViewer(keys[nextIdx], 0);
        };
        
        Z._advanceToPreviousContact = function() {
            var all = Z.getActiveZynixStatuses();
            var contactMap = {};
            for (var i = 0; i < all.length; i++) {
                var id = String(all[i].authorId);
                if (!contactMap[id]) contactMap[id] = [];
                contactMap[id].push(all[i]);
            }
            var keys = Object.keys(contactMap);
            if (keys.length <= 1) { Z.showToast('No more contacts.'); return; }
            var currentIdx = keys.indexOf(String(_viewerAuthorId));
            var prevIdx = (currentIdx - 1 + keys.length) % keys.length;
            Z.openStatusViewer(keys[prevIdx], 0);
        };
        
        Z.statusViewerPrevious = function() {
            Z._clearStatusTimer();
            if (_viewerIndex > 0) {
                _viewerIndex--;
                Z._showStatusViewer();
            } else {
                Z._advanceToPreviousContact();
            }
        };
        
        Z.statusViewerNext = function() {
            Z._clearStatusTimer();
            if (_viewerIndex < _viewerStatuses.length - 1) {
                _viewerIndex++;
                Z._showStatusViewer();

        // ============================================================
        // VIEW RENDERERS
        // ============================================================
        function _getAuthor(id) {
            var users = _getUsers();
            for (var i = 0; i < users.length; i++) {
                if (users[i].id === id) return users[i];
            }
            return { id: 'unknown', name: 'ZYNIX Creator', username: 'creator', role: 'Creator', avatar: '', bountySettings: {} };
        }
        
        function _mediaHtml(media) {
            if (!media) return '';
            var m = String(media);
            if (m.indexOf('data:video/') === 0 || /\.(mp4|webm|ogg)(\?|$)/i.test(m)) {
                return '<div class="rounded-xl overflow-hidden border border-slate-800 bg-black"><video src="' + Z.escapeHtml(m) + '" controls playsinline class="w-full max-h-80 object-cover"></video></div>';
            }
            if (m.indexOf('data:image/') === 0 || /\.(png|jpe?g|gif|webp|avif)(\?|$)/i.test(m)) {
                return '<div class="rounded-xl overflow-hidden border border-slate-800 bg-slate-950"><img src="' + Z.escapeHtml(m) + '" class="w-full max-h-80 object-cover"></div>';
            }
            return '<a href="' + Z.escapeHtml(m) + '" target="_blank" class="block bg-slate-950 border border-slate-800 rounded-xl px-3 py-3 text-[10px] text-emerald-400 break-all">Open link</a>';
        }
        
        function _postLikedBy(p, u, reaction) {
            return !!(p && u && p._reactionUsers && p._reactionUsers[u.id] === reaction);
        }
        
        // ============================================================
        // HOME VIEW
        // ============================================================
        Z.renderHome = function() {
            var users = _getUsers();
            var posts = Z.DB.getPosts();
            var u = _currentUser();

            if (live.length !== _getStatuses().length) _saveStatuses(live);
            
            var postCards = '';
            for (var j = 0; j < posts.length; j++) {
                var p = posts[j];
                var a = _getAuthor(p.authorId);

                var comments = Array.isArray(p.comments) ? p.comments : [];
                
                // Reaction buttons with 5-level rewards
                var reactionBtns = '';
                var rList = [
                    ['love', '❤️', 'Love', 0.05],
                    ['fire', '🔥', 'Fire', 0.04],
                    ['star', '⭐', 'Star', 0.03],

                    var isLiked = _postLikedBy(p, u, reaction[0]);
                    reactionBtns += '<button type="button" onclick="Z._reactToPost(\'' + Z.escapeHtml(p.id) + '\',\'' + reaction[0] + '\')" class="px-2.5 py-1.5 rounded-lg hover:bg-slate-800 transition flex items-center gap-1 text-sm ' + (isLiked ? 'bg-emerald-500/20 border border-emerald-500/30' : '') + '">' + reaction[1] + ' <span class="text-[10px] text-slate-400">' + count + '</span></button>';
                }
                
                // Comments
                var commentHtml = '';
                for (var c = 0; c < comments.length; c++) {
                    var cm = comments[c];
                    commentHtml += '<div class="bg-slate-950 rounded-lg p-2.5 text-[10px] border border-slate-900"><div><b class="text-white">' + Z.escapeHtml(cm.author || _getAuthor(cm.authorId).name) + '</b> <span class="text-slate-300">' + Z.escapeHtml(cm.text || '') + '</span></div></div>';
                }
                
                postCards += '<article class="bg-[#111827] border border-slate-800/80 rounded-2xl p-4 space-y-3 shadow-xl">' +
                    '<div class="flex items-center justify-between"><div class="flex items-center gap-2.5"><button type="button" onclick="Z._openPublicProfile(\'' + Z.escapeHtml(a.id) + '\')"><img src="' + Z.escapeHtml(a.avatar) + '" class="w-9 h-9 rounded-full object-cover border border-slate-700"></button><div><button type="button" onclick="Z._openPublicProfile(\'' + Z.escapeHtml(a.id) + '\')" class="font-bold text-xs text-white">' + Z.escapeHtml(a.name) + '</button><p class="text-[10px] text-slate-400">@' + Z.escapeHtml(a.username || 'creator') + ' • <span class="text-emerald-400">' + Z.escapeHtml(a.role || 'Creator') + '</span></p></div></div><span class="text-[9px] bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 px-2 py-0.5 rounded-full font-semibold">Feed</span></div>' +
                    '<p class="text-xs text-slate-200 leading-relaxed whitespace-pre-wrap">' + Z.escapeHtml(p.content || '') + '</p>' +
                    _mediaHtml(p.media || '') +
                    '<div class="text-[9px] text-slate-500">❤️ $0.05 • 🔥 $0.04 • ⭐ $0.03 • 👍 $0.02 • 💡 $0.01</div>' +
                    '<div class="flex flex-wrap items-center gap-2 pt-2 border-t border-slate-800/60">' + reactionBtns + '</div>' +
                    '<div class="flex items-center gap-4 text-xs text-slate-400"><button type="button" onclick="Z._toggleComments(\'' + Z.escapeHtml(p.id) + '\')" class="hover:text-white">💬 ' + comments.length + '</button><button type="button" onclick="Z._openInlineShare(\'' + Z.escapeHtml(p.id) + '\')" class="hover:text-white">🔄 ' + Number(p.shares || 0) + '</button></div>' +
                    '<div id="comments-' + Z.escapeHtml(p.id) + '" class="hidden space-y-2 mt-2">' + commentHtml + '<div class="flex gap-2"><input id="comment-input-' + Z.escapeHtml(p.id) + '" type="text" class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-2 py-2 text-[10px] text-white" placeholder="Write a comment…"><button type="button" onclick="Z._addComment(\'' + Z.escapeHtml(p.id) + '\')" class="bg-emerald-600 text-black font-bold px-3 rounded-lg text-[10px]">Send</button></div></div>' +
                    '</article>';
            }
            
            return '<div class="space-y-4"><div id="zynix-status-system"></div><div class="bg-[#111827] border border-slate-800 rounded-2xl p-3"><div class="flex items-center gap-3"><img src="' + Z.escapeHtml(u?.avatar || users[0]?.avatar || '') + '" class="w-9 h-9 rounded-full object-cover"><button type="button" onclick="Z._expandInlineComposer()" class="w-full bg-slate-950 border border-slate-800 text-slate-400 text-xs text-left px-3.5 py-2.5 rounded-xl">What do you think?</button></div></div><div id="zynix-inline-composer"></div><div class="space-y-4">' + (postCards || '<p class="text-center text-xs text-slate-500 py-8">No posts yet.</p>') + '</div></div>';
        };
        
        // ============================================================
        // INLINE COMPOSER
        // ============================================================
        Z._expandInlineComposer = function() {
            var u = _currentUser();
            if (!u) { Z.openAuthModal('login'); return; }
            var host = document.getElementById('zynix-inline-composer');
            if (!host) return;
            host.innerHTML = '<div class="flex items-start gap-3"><img src="' + Z.escapeHtml(u.avatar) + '" class="w-9 h-9 rounded-full object-cover shrink-0"><div class="flex-1 space-y-2"><textarea id="inline-post-content" rows="8" class="w-full min-h-[190px] max-h-72 overflow-y-auto resize-y bg-slate-950 border border-slate-800 text-white text-xs rounded-xl px-3 py-3 focus:outline-none focus:border-emerald-500" placeholder="What do you think?"></textarea><div class="flex flex-wrap items-center gap-2"><button type="button" onclick="document.getElementById(\'inline-post-file\').click()" class="bg-emerald-600 text-black font-bold text-[10px] px-3 py-2 rounded-xl"><i class="fa-solid fa-photo-film mr-1"></i> Browse</button><button type="button" onclick="document.getElementById(\'inline-post-link\').classList.toggle(\'hidden\')" class="bg-slate-900 border border-slate-800 text-slate-300 font-bold text-[10px] px-3 py-2 rounded-xl"><i class="fa-solid fa-link mr-1"></i> Link</button><span id="inline-post-file-name" class="text-[10px] text-slate-500 truncate max-w-[160px]"></span><input id="inline-post-file" type="file" accept="image/*,video/*" class="hidden" onchange="Z._previewInlinePostFile(this)"></div><input id="inline-post-link" type="url" class="hidden w-full bg-slate-950 border border-slate-800 text-white text-[10px] rounded-lg px-3 py-2"><div class="flex justify-end gap-2"><button type="button" onclick="Z.showView(\'home\')" class="bg-slate-900 border border-slate-800 text-slate-400 font-bold text-[10px] px-3 py-2 rounded-xl">Cancel</button><button type="button" onclick="Z._submitInlinePost()" class="bg-emerald-600 text-black font-bold text-[10px] px-4 py-2 rounded-xl">Publish</button></div></div></div>';
            setTimeout(function() { var el = document.getElementById('inline-post-content'); if (el) el.focus(); }, 0);
        };
        
        Z._previewInlinePostFile = function(input) {
            var f = input && input.files && input.files[0];
            if (!f) return;
            if (f.size > 15 * 1024 * 1024) { Z.showToast('Media under 15 MB.'); input.value = ''; return; }
            var n = document.getElementById('inline-post-file-name');
            if (n) n.textContent = f.name;
        };
        
        Z._submitInlinePost = function() {
            var u = _currentUser();
            if (!u) { Z.openAuthModal('login'); return; }
            var c = (document.getElementById('inline-post-content')?.value || '').trim();
            var file = document.getElementById('inline-post-file')?.files?.[0];
            var link = (document.getElementById('inline-post-link')?.value || '').trim();
            if (!c && !file && !link) { Z.showToast('Write something or attach media.'); return; }
            var finish = function(media) {
                var ps = Z.DB.getPosts();
                ps.unshift({
                    id: 'post_' + Date.now(),
                    authorId: u.id,
                    content: c || '',
                    media: media || '',
                    createdAt: new Date().toISOString(),
                    reactions: { love: 0, fire: 0, star: 0, like: 0, insight: 0 },
                    comments: [],
                    shares: 0,
                    _reactionUsers: {}
                });
                Z.DB.savePosts(ps);
                Z.showToast('Post published!');
                Z.showView('home');
            };
            if (file) {
                var reader = new FileReader();
                reader.onload = function(e) { finish(e.target.result); };
                reader.readAsDataURL(file);
            } else {
                finish(link);
            }
        };
        
        // ============================================================
        // POST INTERACTIONS - 5-Level Reactions
        // ============================================================
        Z._reactToPost = function(postId, reactionType) {
            var actor = _currentUser();
            if (!actor) { Z.openAuthModal('login'); return; }
            var ps = Z.DB.getPosts();
            var p = null;
            for (var i = 0; i < ps.length; i++) { if (ps[i] && ps[i].id === postId) { p = ps[i]; break; } }
            if (!p) return;
            p.reactions = p.reactions || {};
            p._reactionUsers = p._reactionUsers || {};
            
            // Check if already reacted with same reaction
            if (p._reactionUsers[actor.id] === reactionType) {
                p.reactions[reactionType] = Math.max(0, Number(p.reactions[reactionType] || 0) - 1);
                delete p._reactionUsers[actor.id];
                Z.DB.savePosts(ps);
                Z.showToast('Reaction removed.');
                Z.showView('home');
                return;
            }
            
            // Remove old reaction if exists
            var oldReaction = p._reactionUsers[actor.id];
            if (oldReaction && p.reactions[oldReaction]) {
                p.reactions[oldReaction] = Math.max(0, Number(p.reactions[oldReaction] || 0) - 1);
                delete p._reactionUsers[actor.id];
            }
            
            // Add new reaction
            p.reactions[reactionType] = Number(p.reactions[reactionType] || 0) + 1;
            p._reactionUsers[actor.id] = reactionType;
            Z.DB.savePosts(ps);
            
            // Process reward
            var reward = Z.ReactionRewards[reactionType];
            if (reward && reward.reward > 0) {
                Z.RewardEngine.processInteraction(p.authorId, 'reaction', p.id, reactionType);
            } else {
                Z.showToast('Reaction added!');
                Z.showView('home');
            }
        };
        
        Z._toggleComments = function(postId) {
            var el = document.getElementById('comments-' + postId);
            if (el) el.classList.toggle('hidden');
        };
        
        Z._addComment = function(postId) {
            var u = _currentUser();
            if (!u) { Z.openAuthModal('login'); return; }
            var el = document.getElementById('comment-input-' + postId);
            var text = (el?.value || '').trim();
            if (!text) return;
            var ps = Z.DB.getPosts();
            var p = null;
            for (var i = 0; i < ps.length; i++) { if (ps[i] && ps[i].id === postId) { p = ps[i]; break; } }
            if (!p) return;
            p.comments = Array.isArray(p.comments) ? p.comments : [];
            p.comments.push({ id: 'c_' + Date.now(), authorId: u.id, author: u.name, text: text, time: new Date().toISOString(), likes: 0, dislikes: 0 });
            Z.DB.savePosts(ps);
            
            // Comment reward
            Z.RewardEngine.processInteraction(p.authorId, 'comment', p.id);
            Z.showView('home');
        };
        
        Z._openInlineShare = function(postId) {
            var ps = Z.DB.getPosts();
            var p = null;
            for (var i = 0; i < ps.length; i++) { if (ps[i] && ps[i].id === postId) { p = ps[i]; break; } }
            if (!p) return;
            var url = location.href.split('#')[0] + '#post-' + encodeURIComponent(postId);
            if (navigator.share) {
                navigator.share({ title: 'ZYNIX Post', url: url }).catch(function() {});
            } else {
                navigator.clipboard.writeText(url).then(function() {
                    Z.showToast('Link copied to clipboard!');
                });
            }
            p.shares = Number(p.shares || 0) + 1;
            Z.DB.savePosts(ps);
            if (p.authorId) Z.RewardEngine.processInteraction(p.authorId, 'share', p.id);
        };
        
        Z._openPublicProfile = function(userId) { Z.showView('public-profile', userId); };
        
        // ============================================================
        // VIEW ROUTER
        // ============================================================

                case 'referrals': return Z.renderReferrals();

                case 'messages': return Z.renderMessages();

        // ============================================================
        // SPARK VIEW
        // ============================================================
        Z.renderSpark = function() {
            var sparks = Z.DB.getSparks();
            var tagFilter = (Z.State.sparkTagFilter || '').toLowerCase();
            
            var filtered = [];

                if (match) filtered.push(s);
            }

></div>';

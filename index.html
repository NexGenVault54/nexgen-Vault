        // ============================================================
        // BOUNTY SETTINGS - Dropdown Based
        // ============================================================
        Z.renderBountySettings = function() {
            var user = _currentUser() ? Z.DB.getUserById(_currentUser().id) : _getUsers()[0];
            var bs = user.bountySettings || {};
            
            var rewardOptions = [
                { value: 0.05, label: '$0.05 (Premium)' },
                { value: 0.04, label: '$0.04 (High)' },
                { value: 0.03, label: '$0.03 (Medium)' },
                { value: 0.02, label: '$0.02 (Low)' },
                { value: 0.01, label: '$0.01 (Minimal)' },
                { value: 0.00, label: '$0.00 (Disabled)' }
            ];
            
            var settings = [
                { id: 'love', label: '❤️ Love Reaction', default: 0.05 },
                { id: 'fire', label: '🔥 Fire Reaction', default: 0.04 },
                { id: 'star', label: '⭐ Star Reaction', default: 0.03 },
                { id: 'like', label: '👍 Like Reaction', default: 0.02 },
                { id: 'insight', label: '💡 Insight Reaction', default: 0.01 },
                { id: 'comment', label: '📝 Comment', default: 0.03 },
                { id: 'share', label: '🔄 Share', default: 0.04 },
                { id: 'connect', label: '🤝 Connect', default: 0.03 },
                { id: 'subscribe', label: '🔔 Subscribe', default: 0.05 },
                { id: 'circleJoin', label: '🌀 Join Circle', default: 0.02 }
            ];
            
            var inputs = '';
            for (var i = 0; i < settings.length; i++) {
                var s = settings[i];
                var currentVal = bs[s.id] !== undefined ? bs[s.id] : s.default;
                inputs += '<div class="bg-slate-950/60 border border-slate-800/80 p-3 rounded-xl"><label class="block text-xs font-bold text-slate-200 mb-1.5">' + s.label + '</label><select id="bounty-' + s.id + '" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs text-white font-mono">';
                for (var j = 0; j < rewardOptions.length; j++) {
                    var opt = rewardOptions[j];
                    var selected = (Math.abs(opt.value - currentVal) < 0.0001) ? 'selected' : '';
                    inputs += '<option value="' + opt.value + '" ' + selected + '>' + opt.label + '</option>';
                }
                inputs += '</select></div>';
            }
            
            return '<div class="bg-[#111827] border border-slate-800 rounded-2xl p-4 space-y-4 shadow-2xl"><div class="flex items-center justify-between border-b border-slate-800 pb-3"><div class="flex items-center space-x-2"><button type="button" onclick="Z.showView(\'profile\')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-arrow-left"></i></button><h3 class="font-bold text-sm text-white">Bounty Settings</h3></div><span class="text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded font-bold">$0.00 - $0.05</span></div><p class="text-xs text-slate-400 leading-relaxed">Set rewards for interactions. Higher rewards encourage more engagement.</p><div class="space-y-3 max-h-96 overflow-y-auto">' + inputs + '</div><button type="button" onclick="Z._saveBountySettings()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-black font-bold py-3 rounded-xl text-xs transition">Save Settings</button></div>';
        };
        
        Z._saveBountySettings = function() {
            if (!_currentUser()) return;
            var user = Z.DB.getUserById(_currentUser().id);
            if (!user) return;
            if (!user.bountySettings) user.bountySettings = {};
            
            var settings = ['love', 'fire', 'star', 'like', 'insight', 'comment', 'share', 'connect', 'subscribe', 'circleJoin'];
            for (var i = 0; i < settings.length; i++) {
                var key = settings[i];
                var el = document.getElementById('bounty-' + key);
                if (el) {
                    user.bountySettings[key] = parseFloat(el.value) || 0;
                }
            }
            Z.DB.saveUsers();
            Z.showToast('Bounty settings saved!');
            Z.showView('profile');
        };
        
        // ============================================================
        // CIRCLES VIEW - Group/Shop Hybrid
        // ============================================================
        Z.renderCircles = function() {
            var circles = Z.DB.getCircles();
            var query = (Z.State.circleSearchQuery || '').toLowerCase();
            var user = _currentUser();
            var joinedIds = user && user.joinedCircles ? user.joinedCircles : [];
            
            // Filter circles
            var filtered = circles.filter(function(c) {
                return c.name.toLowerCase().indexOf(query) !== -1 || c.description.toLowerCase().indexOf(query) !== -1;
            });
            
            var html = '<div class="space-y-4"><div class="flex items-center justify-between px-1"><h2 class="font-black text-sm text-white flex items-center"><i class="fa-solid fa-circle-nodes text-emerald-400 mr-2"></i> Circles</h2></div><div class="relative"><i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-500 text-xs"></i><input type="text" id="circle-search-input" value="' + Z.escapeHtml(Z.State.circleSearchQuery || '') + '" oninput="Z.State.circleSearchQuery=this.value; Z.showView(\'circles\');" placeholder="Search circles..." class="w-full bg-[#111827] border border-slate-800 rounded-xl pl-9 pr-4 py-2.5 text-xs text-white focus:outline-none focus:border-emerald-500"></div>';
            
            // My Circles
            var myCircles = filtered.filter(function(c) { return joinedIds.indexOf(c.id) !== -1; });
            if (myCircles.length) {
                html += '<div class="space-y-1.5"><span class="text-[10px] uppercase tracking-wider text-slate-400 font-bold px-1">My Circles</span>';
                for (var i = 0; i < myCircles.length; i++) {
                    html += Z._renderCircleCard(myCircles[i], true);
                }
                html += '</div>';
            }
            
            // All Circles
            var otherCircles = filtered.filter(function(c) { return joinedIds.indexOf(c.id) === -1; });
            if (otherCircles.length) {
                html += '<div class="space-y-1.5"><span class="text-[10px] uppercase tracking-wider text-slate-400 font-bold px-1">All Circles</span>';
                for (var j = 0; j < otherCircles.length; j++) {
                    html += Z._renderCircleCard(otherCircles[j], false);
                }
                html += '</div>';
            }
            
            if (!filtered.length) {
                html += '<p class="text-xs text-slate-500 text-center py-8">No circles found. Create one!</p>';
            }
            
            html += '<button type="button" onclick="Z.openCreateCircleModal()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-black font-bold py-3 rounded-xl text-xs transition">+ Create New Circle</button></div>';
            return html;
        };
        
        Z._renderCircleCard = function(circle, isJoined) {
            var shopBadges = {
                'services': 'shop-badge-services',
                'goods': 'shop-badge-goods',
                'social': 'shop-badge-social'
            };
            var shopLabels = {
                'services': 'Services',
                'goods': 'Physical Goods',
                'social': 'Social Purpose'
            };
            var badgeClass = shopBadges[circle.shopType] || 'shop-badge-social';
            var badgeLabel = shopLabels[circle.shopType] || 'Social Purpose';
            
            var shopItemsHtml = '';
            if (circle.shopItems && circle.shopItems.length) {
                shopItemsHtml = '<div class="grid grid-cols-2 gap-2 mt-2">';
                for (var i = 0; i < Math.min(circle.shopItems.length, 4); i++) {
                    var item = circle.shopItems[i];
                    shopItemsHtml += '<div class="bg-slate-950 p-2 rounded-lg border border-slate-800"><div class="font-bold text-xs text-white">' + Z.escapeHtml(item.name) + '</div><div class="text-[10px] text-slate-400">$' + item.price + '</div></div>';
                }
                shopItemsHtml += '</div>';
            }
            
            return '<div class="bg-[#111827] border border-slate-800 p-4 rounded-2xl space-y-2 shadow-xl"><div class="flex items-center justify-between"><div class="flex items-center space-x-3"><img src="' + Z.escapeHtml(circle.avatar) + '" class="w-10 h-10 rounded-full object-cover border border-slate-700"><div><h4 class="font-bold text-sm text-white">' + Z.escapeHtml(circle.name) + '</h4><p class="text-[10px] text-slate-400">' + circle.membersCount + ' members • <span class="' + badgeClass + '">' + badgeLabel + '</span></p></div></div>' + (isJoined ? '<span class="text-emerald-400 font-bold text-xs"><i class="fa-solid fa-check mr-1"></i> Joined</span>' : '<button type="button" onclick="Z.RewardEngine.processInteraction(\'' + Z.escapeHtml(circle.creatorId) + '\', \'circleJoin\', \'' + Z.escapeHtml(circle.id) + '\')" class="bg-emerald-600 hover:bg-emerald-500 text-black font-bold px-3.5 py-1.5 rounded-xl text-xs">Join ($0.02)</button>') + '</div><p class="text-xs text-slate-300">' + Z.escapeHtml(circle.description) + '</p>' + shopItemsHtml + '</div>';
        };
        
        Z.openCreateCircleModal = function() {
            if (!Z.State.currentUser) { Z.openAuthModal('login'); return; }
            var modal = document.getElementById('modal-container');
            if (!modal) return;
            modal.innerHTML = '<div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4"><div class="bg-[#111827] border border-slate-800 rounded-2xl w-full max-w-md p-6 space-y-4 shadow-2xl"><div class="flex justify-between items-center border-b border-slate-800 pb-3"><h3 class="font-bold text-base text-white">Create Circle</h3><button type="button" onclick="Z.closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button></div><div class="space-y-3"><div><label class="block text-xs font-medium text-slate-400 mb-1">Circle Name</label><input type="text" id="circle-name" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500" placeholder="My Circle"></div><div><label class="block text-xs font-medium text-slate-400 mb-1">Description</label><textarea id="circle-desc" rows="2" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500" placeholder="What is this circle about?"></textarea></div><div><label class="block text-xs font-medium text-slate-400 mb-1">Circle Type</label><select id="circle-type" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"><option value="social">Social Purpose</option><option value="services">Services</option><option value="goods">Physical Goods</option></select></div><div><label class="block text-xs font-medium text-slate-400 mb-1">Avatar URL</label><input type="text" id="circle-avatar" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white" placeholder="https://..."></div><button type="button" onclick="Z._submitCircle()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-black font-bold py-2.5 rounded-xl text-xs transition">Create Circle</button></div></div></div>';
        };
        
        Z._submitCircle = function() {
            var name = document.getElementById('circle-name').value.trim();
            var desc = document.getElementById('circle-desc').value.trim();
            var type = document.getElementById('circle-type').value;
            var avatar = document.getElementById('circle-avatar').value.trim() || 'https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=150&q=80';
            if (!name) { Z.showToast('Please enter a circle name.'); return; }
            var circles = Z.DB.getCircles();
            var newCircle = {
                id: 'cir_' + Date.now(),
                name: name,
                description: desc || 'A new ZYNIX circle.',
                membersCount: 1,
                creatorId: Z.State.currentUser.id,
                avatar: avatar,
                category: type.charAt(0).toUpperCase() + type.slice(1),
                shopType: type,
                shopItems: [],
                posts: []
            };
            circles.unshift(newCircle);
            Z.DB.saveCircles(circles);
            if (!Z.State.currentUser.joinedCircles) Z.State.currentUser.joinedCircles = [];
            Z.State.currentUser.joinedCircles.push(newCircle.id);
            Z.DB.saveUsers();
            Z.closeModal();
            Z.showToast('Circle created!');
            Z.showView('circles');
        };
        
        // ============================================================
        // WALLET VIEW
        // ============================================================
        Z.renderWallet = function() {
            var user = _currentUser() ? Z.DB.getUserById(_currentUser().id) : null;
            var txHtml = '';
            if (user && user.walletTransactions && user.walletTransactions.length > 0) {
                for (var i = 0; i < user.walletTransactions.length; i++) {
                    var tx = user.walletTransactions[i];

                }
            } else {
                txHtml = '<p class="text-xs text-slate-500 text-center py-4">No transactions.</p>';
            }
            return '<div class="space-y-4"><div class="bg-[#111827] border border-slate-800 rounded-2xl p-4 space-y-4 shadow-2xl"><div class="flex justify-between items-center border-b border-slate-800 pb-3"><div class="flex items-center space-x-2"><button type="button" onclick="Z.showView(\'profile\')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-arrow-left"></i></button><h3 class="font-bold text-sm text-white">Wallet</h3></div></div><div class="grid grid-cols-2 gap-3"><div class="bg-slate-950/80 border border-slate-800 p-3.5 rounded-xl"><span class="text-[10px] text-slate-400 uppercase font-semibold">Cash</span><span class="text-xl font-black text-emerald-400">$' + (user ? Number(user.wallet.cash || 0).toFixed(2) : '0.00') + '</span></div><div class="bg-slate-950/80 border border-slate-800 p-3.5 rounded-xl"><span class="text-[10px] text-slate-400 uppercase font-semibold">Bounty</span><span class="text-xl font-black text-blue-400">$' + (user ? Number(user.wallet.bounty || 0).toFixed(2) : '0.00') + '</span></div></div><button type="button" onclick="Z.openWithdrawModal()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-black font-bold py-2.5 rounded-xl text-xs">Withdraw Cash</button><div class="space-y-2 pt-2"><h4 class="font-bold text-xs text-slate-300 uppercase tracking-wider">History</h4><div class="space-y-2 max-h-72 overflow-y-auto">' + txHtml + '</div></div></div></div>';
        };
        
        // ============================================================
        // PACKAGES VIEW
        // ============================================================
        Z.renderPackages = function() {
            var user = _currentUser();
            var currentPkg = user ? user.package : 'Free';
            var list = [
                { name: 'Free', price: 0, desc: 'Browse, post. No rewards.', bg: 'border-slate-800' },
                { name: 'Starter $3', price: 3, desc: '$0.01/like, 10 daily.', bg: 'border-emerald-500/30' },
                { name: 'Growth $10', price: 10, desc: '$0.015/like, 25 daily.', bg: 'border-blue-500/30' },
                { name: 'Creator $20', price: 20, desc: '$0.02/like, 50 daily.', bg: 'border-purple-500/30' },
                { name: 'Pro $40', price: 40, desc: '$0.02/like, 100 daily.', bg: 'border-amber-500/30' },
                { name: 'Enterprise $100', price: 100, desc: '$0.025/like, 500 daily.', bg: 'border-rose-500/30' }
            ];
            var html = '';
            for (var i = 0; i < list.length; i++) {
                var p = list[i];
                var isCurrent = currentPkg === p.name;
                html += '<div class="bg-[#111827] border ' + (isCurrent ? 'border-emerald-500' : p.bg) + ' p-4 rounded-2xl shadow-xl"><div class="flex justify-between"><h3 class="font-bold text-sm ' + (isCurrent ? 'text-emerald-400' : 'text-white') + '">' + Z.escapeHtml(p.name) + '</h3><span class="text-xs font-black text-emerald-400">$' + p.price + '</span></div><p class="text-xs text-slate-300">' + Z.escapeHtml(p.desc) + '</p>' + (isCurrent ? '<button disabled class="w-full bg-slate-800 text-emerald-400 font-bold py-2 rounded-xl text-xs cursor-default">✓ Current</button>' : '<button type="button" onclick="Z._upgradePackage(\'' + Z.escapeHtml(p.name) + '\', ' + p.price + ')" class="w-full bg-emerald-600 hover:bg-emerald-500 text-black font-bold py-2 rounded-xl text-xs transition">Upgrade $' + p.price + '</button>') + '</div>';

        };
        
        Z._upgradePackage = function(pkgName, price) {
            if (!_currentUser()) { Z.openAuthModal('login'); return; }
            var user = Z.DB.getUserById(_currentUser().id);
            if (!user) return;
            if (user.wallet.cash < price) {
                Z.showToast('Insufficient cash. Need $' + price.toFixed(2));
                return;
            }
            user.wallet.cash -= price;
            user.package = pkgName;
            if (!user.walletTransactions) user.walletTransactions = [];
            user.walletTransactions.unshift({
                id: 'pkg_' + Date.now(),
                date: new Date().toISOString(),
                type: 'Package: ' + pkgName,
                amount: -price,
                cash: -price,
                bounty: 0,
                status: 'Completed'
            });
            Z.DB.saveUsers();
            Z.showToast('Upgraded to ' + pkgName + '!');
            Z.showView('profile');
        };
        
        // ============================================================
        // CALCULATOR VIEW
        // ============================================================
        Z.renderCalculator = function() {
            return '<div class="bg-[#111827] border border-slate-800 rounded-2xl p-4 space-y-4"><div class="flex items-center space-x-2 border-b border-slate-800 pb-3"><button type="button" onclick="Z.showView(\'profile\')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-arrow-left"></i></button><h3 class="font-bold text-sm text-white">Calculator</h3></div><div class="space-y-3"><div><label class="block text-xs font-medium text-slate-400 mb-1">Package</label><select id="calc-package" onchange="Z._updateCalc()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"><option value="Starter $3">Starter $3 ($0.01)</option><option value="Growth $10">Growth $10 ($0.015)</option><option value="Creator $20">Creator $20 ($0.02)</option><option value="Pro $40">Pro $40 ($0.02)</option><option value="Enterprise $100" selected>Enterprise $100 ($0.025)</option></select></div><div><label class="block text-xs font-medium text-slate-400 mb-1">Daily Interactions</label><input type="number" id="calc-interactions" value="50" oninput="Z._updateCalc()" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"></div><div class="bg-slate-950 p-3 rounded-xl border border-slate-800"><span class="text-[10px] text-slate-400">Daily Gross: <strong id="calc-gross" class="text-emerald-400">$1.25</strong></span><br><span class="text-[10px] text-slate-500">Cash: <span id="calc-cash" class="text-emerald-400 font-bold">$0.75</span> | Bounty: <span id="calc-bounty" class="text-blue-400 font-bold">$0.50</span></span></div></div></div>';
        };
        
        Z._updateCalc = function() {
            var pkgName = document.getElementById('calc-package')?.value || 'Enterprise $100';
            var count = parseFloat(document.getElementById('calc-interactions')?.value) || 0;
            var pkg = Z.Packages[pkgName] || Z.Packages['Starter $3'];
            var gross = count * pkg.likeRewardRate;
            var cash = gross * 0.60;
            var bounty = gross * 0.40;
            var grossEl = document.getElementById('calc-gross');
            var cashEl = document.getElementById('calc-cash');
            var bountyEl = document.getElementById('calc-bounty');
            if (grossEl) grossEl.innerText = '$' + gross.toFixed(2);
            if (cashEl) cashEl.innerText = '$' + cash.toFixed(2);
            if (bountyEl) bountyEl.innerText = '$' + bounty.toFixed(2);
        };
        
        // ============================================================
        // REFERRALS VIEW
        // ============================================================
        Z.renderReferrals = function() {
            var user = _currentUser() || _getUsers()[0];
            var refCode = user.referrals ? user.referrals.code : 'ZYNIX-REF2026';
            var refLink = location.origin + location.pathname + '?ref=' + refCode;
            return '<div class="bg-[#111827] border border-slate-800 rounded-2xl p-4 space-y-4"><div class="flex items-center space-x-2 border-b border-slate-800 pb-3"><button type="button" onclick="Z.showView(\'profile\')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-arrow-left"></i></button><h3 class="font-bold text-sm text-white">Referrals</h3></div><div class="bg-slate-950 p-3.5 rounded-xl border border-slate-800"><span class="text-[10px] text-slate-400 block uppercase font-semibold">Your Code</span><div class="flex items-center justify-between bg-slate-900 border border-slate-800 px-3 py-2 rounded-lg"><span class="font-mono text-[11px] text-emerald-400 truncate mr-2">' + Z.escapeHtml(refLink) + '</span><button type="button" onclick="navigator.clipboard.writeText(\'' + Z.escapeHtml(refLink) + '\'); Z.showToast(\'Copied!\')" class="text-xs bg-emerald-600 text-black px-3 py-1 rounded font-bold">Copy</button></div></div><div class="bg-slate-950/60 border border-slate-800 p-3 rounded-xl flex justify-between"><span class="text-xs text-slate-300">Total Earnings</span><span class="font-black text-emerald-400">$' + Number(user.referrals ? user.referrals.earnings || 0 : 0).toFixed(2) + '</span></div></div>';
        };
        
        // ============================================================
        // ANALYTICS VIEW
        // ============================================================
        Z.renderAnalytics = function() {
            var user = _currentUser() || _getUsers()[0];
            var posts = Z.DB.getPosts();
            var userPosts = posts.filter(function(p) { return p.authorId === user.id; });
            var totalReactions = 0;
            for (var i = 0; i < userPosts.length; i++) {
                var p = userPosts[i];
                if (p.reactions) {
                    var vals = Object.values(p.reactions);
                    for (var j = 0; j < vals.length; j++) { totalReactions += vals[j]; }
                }
            }
            var totalBountySpent = 0;
            var history = user.bountySpentHistory || [];
            for (var k = 0; k < history.length; k++) { totalBountySpent += history[k].amount; }
            return '<div class="bg-[#111827] border border-slate-800 rounded-2xl p-4 space-y-4"><div class="flex items-center space-x-2 border-b border-slate-800 pb-3"><button type="button" onclick="Z.showView(\'profile\')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-arrow-left"></i></button><h3 class="font-bold text-sm text-white">Analytics</h3></div><div class="grid grid-cols-2 gap-3"><div class="bg-slate-950 p-3 rounded-xl border border-slate-800"><span class="text-[10px] text-slate-400">Connections</span><span class="text-base font-black text-white">' + (user.connections || 0) + '</span></div><div class="bg-slate-950 p-3 rounded-xl border border-slate-800"><span class="text-[10px] text-slate-400">Reactions</span><span class="text-base font-black text-emerald-400">' + totalReactions + '</span></div><div class="bg-slate-950 p-3 rounded-xl border border-slate-800"><span class="text-[10px] text-slate-400">Cash Earned</span><span class="text-base font-black text-blue-400">$' + Number(user.wallet ? user.wallet.cash || 0 : 0).toFixed(2) + '</span></div><div class="bg-slate-950 p-3 rounded-xl border border-slate-800"><span class="text-[10px] text-slate-400">Bounty Spent</span><span class="text-base font-black text-purple-400">$' + totalBountySpent.toFixed(2) + '</span></div></div></div>';
        };
        
        // ============================================================
        // NOTIFICATIONS VIEW
        // ============================================================
        Z.renderNotifications = function() {
            var notifications = Z.DB.getNotifications() || [];
            var html = '<div class="space-y-4"><div class="flex items-center space-x-2 px-1"><button type="button" onclick="Z.showView(\'home\')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-arrow-left"></i></button><h2 class="font-black text-sm text-white">Notifications</h2></div>';
            if (notifications.length) {
                for (var i = 0; i < notifications.length; i++) {
                    var n = notifications[i];
                    html += '<div class="bg-[#111827] border border-slate-800 p-3 rounded-xl flex items-start gap-3"><div class="w-2 h-2 rounded-full ' + (n.read ? 'bg-slate-600' : 'bg-emerald-400') + ' mt-2"></div><div><div class="text-xs text-slate-200">' + Z.escapeHtml(n.message) + '</div><div class="text-[10px] text-slate-500">' + new Date(n.timestamp).toLocaleString() + '</div></div></div>';
                }
            } else {
                html += '<p class="text-xs text-slate-500 text-center py-8">No notifications yet.</p>';
            }
            html += '</div>';
            return html;
        };
        
        // ============================================================
        // MESSAGES VIEW
        // ============================================================
        Z.renderMessages = function() {
            var messages = Z.DB.getMessages() || [];
            var html = '<div class="space-y-4"><div class="flex items-center space-x-2 px-1"><button type="button" onclick="Z.showView(\'home\')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-arrow-left"></i></button><h2 class="font-black text-sm text-white">Messages</h2></div>';
            if (messages.length) {
                for (var i = 0; i < messages.length; i++) {
                    var msg = messages[i];
                    var sender = _userById(msg.senderId);
                    html += '<div class="bg-[#111827] border border-slate-800 p-3 rounded-xl flex items-center gap-3"><img src="' + Z.escapeHtml(sender ? sender.avatar : '') + '" class="w-10 h-10 rounded-full object-cover"><div><div class="font-bold text-xs text-white">' + Z.escapeHtml(sender ? sender.name : 'Unknown') + '</div><div class="text-[10px] text-slate-400 truncate">' + Z.escapeHtml(msg.text || '') + '</div></div></div>';
                }
            } else {
                html += '<p class="text-xs text-slate-500 text-center py-8">No messages yet.</p>';
            }
            html += '</div>';
            return html;
        };
        
        // ============================================================
        // ADMIN WALL
        // ============================================================
        Z.renderAdminWall = function() {
            return '<div class="space-y-4"><div class="bg-gradient-to-r from-indigo-900/60 to-purple-900/60 border border-indigo-500/40 rounded-2xl p-4"><span class="text-[10px] bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded font-bold">Admin Wall</span><h2 class="font-black text-base text-white mt-1">ZYNIX Announcements</h2></div><div class="bg-[#111827] border border-slate-800 rounded-2xl p-4 space-y-3"><div class="flex items-center space-x-2"><span class="bg-rose-500/20 text-rose-400 border border-rose-500/30 text-[9px] font-bold px-2 py-0.5 rounded">Pinned</span><h3 class="font-bold text-xs text-white">Welcome to ZYNIX</h3></div><div class="rounded-xl overflow-hidden bg-black h-52 border border-slate-800"><video src="https://assets.mixkit.co/videos/preview/mixkit-digital-animation-of-screens-and-code-31910-large.mp4" controls class="w-full h-full object-cover"></video></div><p class="text-xs text-slate-300">Reward distribution and creator settings overview.</p></div></div>';
        };
        
        // ============================================================
        // WITHDRAWAL MODAL
        // ============================================================
        Z.openWithdrawModal = function() {
            if (!_currentUser()) { Z.openAuthModal('login'); return; }
            var user = _currentUser();
            var modal = document.getElementById('modal-container');
            if (!modal) return;
            modal.innerHTML = '<div class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4"><div class="bg-[#111827] border border-slate-800 rounded-2xl w-full max-w-md p-6 space-y-4 shadow-2xl"><div class="flex justify-between items-center border-b border-slate-800 pb-3"><h3 class="font-bold text-base text-white">Withdraw</h3><button type="button" onclick="Z.closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button></div><div class="space-y-3"><div class="bg-slate-950 p-3 rounded-xl border border-slate-800 flex justify-between"><span class="text-xs text-slate-400">Available Cash:</span><span class="text-base font-black text-emerald-400">$' + Number(user.wallet.cash || 0).toFixed(2) + '</span></div><div><label class="block text-xs font-medium text-slate-400 mb-1">Amount ($)</label><input type="number" step="1" min="10" id="withdraw-amount" value="10" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500"><span class="text-[10px] text-slate-500">Min: $10.00</span></div><div><label class="block text-xs font-medium text-slate-400 mb-1">Method</label><select id="withdraw-method" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white"><option value="Payoneer">Payoneer</option><option value="Crypto USDT">Crypto USDT</option><option value="Bank Transfer">Bank Transfer</option></select></div><div><label class="block text-xs font-medium text-slate-400 mb-1">Account Details</label><input type="text" id="withdraw-details" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white" placeholder="Email or wallet address"></div><button type="button" onclick="Z._submitWithdrawal()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-black font-bold py-2.5 rounded-xl text-xs">Confirm</button></div></div></div>';
        };
        
        Z._submitWithdrawal = function() {
            var user = _currentUser();
            if (!user) return;
            var amount = parseFloat(document.getElementById('withdraw-amount')?.value) || 0;
            var method = document.getElementById('withdraw-method')?.value || 'Payoneer';
            var details = document.getElementById('withdraw-details')?.value.trim() || '';
            if (amount < 10) { Z.showToast('Min: $10.00'); return; }
            if (Number(user.wallet.cash || 0) < amount) { Z.showToast('Insufficient balance.'); return; }
            if (!details) { Z.showToast('Enter account details.'); return; }
            user.wallet.cash -= amount;
            if (!user.walletTransactions) user.walletTransactions = [];
            user.walletTransactions.unshift({
                id: 'wd_' + Date.now(),
                date: new Date().toISOString(),
                type: 'Withdrawal: ' + method,
                amount: -amount,
                cash: -amount,
                bounty: 0,
                status: 'Pending'
            });
            Z.DB.saveUsers();
            Z.closeModal();
            Z.showToast('Withdrawal request submitted!');
            Z.showView('wallet');
        };
        
        // ============================================================
        // BOOT
        // ============================================================
        function boot() {
            if (!localStorage.getItem('zynix_users')) Z.DB.saveUsers(Z.SeedData.users);
            if (!localStorage.getItem('zynix_posts')) Z.DB.savePosts(Z.SeedData.posts);
            if (!localStorage.getItem('zynix_sparks')) Z.DB.saveSparks(Z.SeedData.sparks);
            if (!localStorage.getItem('zynix_statuses')) Z.DB.saveStatuses(Z.SeedData.statuses);
            if (!localStorage.getItem('zynix_circles')) Z.DB.saveCircles(Z.SeedData.circles);
            
            // Theme
            var savedTheme = localStorage.getItem('zynix_theme');
            if (savedTheme === 'light') {
                document.documentElement.classList.remove('dark');
                document.documentElement.classList.add('light');
                var icon = document.getElementById('theme-icon');
                if (icon) icon.className = 'fa-solid fa-sun';
                Z.State.theme = 'light';
            }
            
            Z.State.currentUser = Z.DB.getCurrentUser();
            Z.renderHeaderAuth();
            Z.updateHeaderWallet();
            Z.showView('home');
        }
        
        document.addEventListener('DOMContentLoaded', boot);
        
    })();
    </script>
</body>
</html>

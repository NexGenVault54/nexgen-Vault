/* v9: audio fix — video/webm mime + auto-upload on stop + retry button */
function pickRecorderMime(){
  var candidates = ['video/webm;codecs=opus','video/webm','video/mp4'];
  for(var i=0;i<candidates.length;i++){
    try { if(MediaRecorder.isTypeSupported(candidates[i])) return candidates[i]; } catch(e){}
  }
  return '';
}
function startVoiceRecording(autoFromBeep){
  if(S.voiceRecorder && S.voiceRecorder.state === 'recording'){ try { S.voiceRecorder.stop(); } catch(e){} return; }
  if(!S.chatRideId){ toast('Open chat first'); return; }
  if(!navigator.mediaDevices || !window.MediaRecorder){ toast('Voice not supported on this device'); return; }

  navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream){
    S.voiceChunks = []; S.voiceSeconds = 0;
    var mime = pickRecorderMime();
    var rec;
    try { rec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream); }
    catch(e){ toast('Recorder start failed'); try { stream.getTracks().forEach(function(t){ t.stop(); }); } catch(e2){} return; }
    S.voiceRecorder = rec;

    rec.ondataavailable = function(e){ if(e.data && e.data.size > 0) S.voiceChunks.push(e.data); };

    rec.onstop = async function(){
      try { stream.getTracks().forEach(function(t){ t.stop(); }); } catch(e){}
      var secs = S.voiceSeconds;
      var chunks = S.voiceChunks.slice();
      var usedMime = rec.mimeType || mime || 'video/webm';
      S.voiceRecorder = null;
      S.voiceChunks = [];
      if(S.voiceTimer){ clearInterval(S.voiceTimer); S.voiceTimer = null; }
      var btn = document.getElementById('zy-chat-voice');
      if(btn){ btn.style.background = 'linear-gradient(135deg,#10b981,#3b82f6)'; btn.innerHTML = '<i class="fa-solid fa-microphone"></i>'; }
      if(!chunks.length){ toast('No audio captured — try again'); return; }
      var blobType = usedMime.indexOf('audio/') === 0 ? 'video/webm' : usedMime;
      var blob = new Blob(chunks, { type: blobType });
      if(blob.size < 400){ toast('Recording was empty — try again'); return; }
      S.voiceLastBlob = { blob: blob, secs: secs, mime: blobType };
      await sendVoiceBlob(blob, secs, blobType);
    };

    rec.start();
    var btn2 = document.getElementById('zy-chat-voice');
    if(btn2){ btn2.style.background = 'linear-gradient(135deg,#ef4444,#f59e0b)'; btn2.innerHTML = '<i class="fa-solid fa-stop"></i> 0s'; }
    toast(autoFromBeep ? 'Recording — tap ⏹ to send, 30s max' : 'Recording — tap ⏹ to send, 30s max');
    S.voiceTimer = setInterval(function(){
      S.voiceSeconds++;
      var b = document.getElementById('zy-chat-voice');
      if(b) b.innerHTML = '<i class="fa-solid fa-stop"></i> ' + S.voiceSeconds + 's';
      if(S.voiceSeconds >= 30){ clearInterval(S.voiceTimer); S.voiceTimer = null; try { rec.stop(); } catch(e){} }
    }, 1000);
  }).catch(function(){ toast('Microphone permission denied'); });
}
async function sendVoiceBlob(blob, secs, mime){
  toast('Sending voice…');
  try {
    var ext = mime.indexOf('mp4') !== -1 ? 'mp4' : 'webm';
    /* v9.1: strip codec suffix — server allowlist only accepts video/webm not video/webm;codecs=opus */
    var cleanMime = (mime || 'video/webm').split(';')[0].trim();
    if(cleanMime === 'audio/webm') cleanMime = 'video/webm';
    var file = new File([blob], 'voice_' + Date.now() + '.' + ext, { type: cleanMime });
    var url = await Z.storeMedia(file);
    var c = db(); if(!c) throw new Error('no db');
    var u = me(); if(!u) throw new Error('no user');
    var r = await c.from('drive_chat').insert({ ride_id: S.chatRideId, sender_id: u.id, message: '🎤 Voice note (' + secs + 's)', kind: 'voice', audio_url: url, audio_seconds: secs }).select();
    if(r.error) throw r.error;
    if(r.data && r.data[0]){ S.chatMessages.push(r.data[0]); renderChatBody(); bcSend('chat', r.data[0]); toast('Voice sent'); S.voiceLastBlob = null; }
  } catch(e){
    toast('Voice send failed: ' + e.message, 'error');
    /* v9: show retry banner in chat */
    var body = document.getElementById('zy-chat-body');
    if(body && S.voiceLastBlob){
      var id = 'zy-voice-retry-' + Date.now();
      body.insertAdjacentHTML('beforeend', '<div id="'+id+'" style="margin:8px 0;padding:10px 12px;border-radius:10px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.35);color:#fca5a5;font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;"><span>Voice send failed. Retry?</span><button onclick="(function(){var b=document.getElementById(\''+id+'\');if(b)b.remove();})()" style="background:#10b981;color:#000;border:none;padding:6px 12px;border-radius:6px;font-weight:800;cursor:pointer;font-size:11px;" id="'+id+'-btn">Retry</button></div>');
      var btn = document.getElementById(id + '-btn');
      if(btn) btn.onclick = async function(){
        btn.disabled = true; btn.textContent = 'Retrying…';
        await sendVoiceBlob(S.voiceLastBlob.blob, S.voiceLastBlob.secs, S.voiceLastBlob.mime);
        var el = document.getElementById(id); if(el) el.remove();
      };
    }
  }
}

async function acceptRequest(rideId){
  var u = me(); if(!u) return; var c = db(); if(!c) return;
  var rr = await c.from('drive_rides').select('*').eq('id',rideId).limit(1);
  if(rr.error || !rr.data || !rr.data.length){ toast('Ride not found'); return; }
  var ride = rr.data[0];
  if(ride.driver_id && ride.driver_id !== u.id){ toast('Already taken by another driver'); loadRequests(); return; }
  if(ride.driver_id === u.id){ S.activeDriverRide = ride; renderTab(); return; }
  if(ride.target_driver_id && ride.target_driver_id !== u.id){ toast('This ride is not available to you'); loadRequests(); return; }

  var updateData = { driver_id: u.id, agreed_fare: ride.rider_offered_fare, status:'accepted', accepted_at: new Date().toISOString(), updated_at: new Date().toISOString(), payment_status:'escrow_held' };
  var upd = await c.from('drive_rides').update(updateData).eq('id', rideId).is('driver_id', null).select();
  if(upd.error || !upd.data || !upd.data.length){
    var chk = await c.from('drive_rides').select('*').eq('id',rideId).limit(1);
    if(chk.data && chk.data[0] && chk.data[0].driver_id === u.id){ S.activeDriverRide = chk.data[0]; toast('Ride accepted'); bcSend('ride', chk.data[0]); ensureRidePoll(); renderTab(); return; }
    if(chk.data && chk.data[0] && chk.data[0].driver_id){ toast('Already taken by another driver'); loadRequests(); return; }
    var retry = await c.from('drive_rides').update(updateData).eq('id',rideId).select();
    if(retry.error || !retry.data || !retry.data.length){ toast('Could not accept — ' + ((retry.error && retry.error.message) || (upd.error && upd.error.message) || 'ride no longer available')); loadRequests(); return; }
    upd = retry;
  }
  var accepted = upd.data[0];
  try { await c.from('drive_escrow').insert({ride_id:rideId,traveller_id:ride.traveller_id,driver_id:u.id,amount:ride.rider_offered_fare,currency:ride.fare_currency||getCurrency(),status:'held'}); } catch(e){}
   S.activeDriverRide = accepted;
  /* v9.1: mark unavailable while on duty so no new requests come here */
  try { await c.from('drive_drivers').update({ is_available: false }).eq('user_id', u.id); } catch(e){}
  if(S.driver) S.driver.is_available = false;
  toast('Ride accepted'); bcSend('ride', accepted);
  /* bell: notify rider */
  if(window.Z && Z.driveNotify) Z.driveNotify(ride.traveller_id, 'Your driver accepted — they are on the way', 'drive_accepted');
  ensureRidePoll(); renderTab();
}

async function toggleAvailability(){

    + '<div style="display:flex;gap:8px;"><button id="zy-rm-skip" style="flex:1;padding:12px;border-radius:8px;border:1px solid #1e293b;background:transparent;color:#cbd5e1;font-weight:800;cursor:pointer;">Skip</button>'
    + '<button id="zy-rm-submit" style="flex:1;padding:12px;border-radius:8px;border:none;background:linear-gradient(135deg,#10b981,#3b82f6);color:#000;font-weight:900;cursor:pointer;">Submit</button></div></div></div>';
  document.body.insertAdjacentHTML('beforeend',html);
  var score = 0, picked = {};
  document.querySelectorAll('#zy-rm-scale span').forEach(function(el){ el.onclick = function(){ score = parseInt(this.getAttribute('data-v')); document.querySelectorAll('#zy-rm-scale span').forEach(function(s){ var v = parseInt(s.getAttribute('data-v')); s.style.background = v <= score ? 'linear-gradient(135deg,#10b981,#3b82f6)' : 'rgba(255,255,255,0.07)'; s.style.color = v <= score ? '#000' : '#fff'; }); }; });

/* ================== REALTIME ================== */
function rt_start(){
  rt_stop(); var c = db(); if(!c) return; var u = me(); if(!u) return;
  try {
    S.rt.push(c.channel('zy-drive-rides-'+u.id).on('postgres_changes',{event:'*',schema:'public',table:'drive_rides'},function(payload){
      var row = payload.new || payload.old; if(!row) return;
      if(payload.eventType === 'DELETE'){ if(S.activeRide && S.activeRide.id === row.id) S.activeRide = null; if(S.activeDriverRide && S.activeDriverRide.id === row.id) S.activeDriverRide = null; if(S.tab === 'home') renderTab(); return; }
      handleRideRow(payload.new);
      if(!row.driver_id && payload.eventType === 'INSERT'){ if(S.tab === 'home' && S.mode === 'driver' && S.driver && S.driver.is_available) loadRequests(); }
    }).subscribe());
    S.rt.push(c.channel('zy-drive-promos').on('postgres_changes',{event:'*',schema:'public',table:'drive_promos'},function(){ if(S.tab === 'discover') paintDiscover(); }).subscribe());
    S.rt.push(c.channel('zy-drive-ratings-'+u.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'drive_ratings'},function(){ refreshSideProfiles().then(function(){ if(S.tab === 'profile' || S.tab === 'history') renderTab(); }); }).subscribe());
    S.rt.push(c.channel('zy-drive-bids-'+u.id).on('postgres_changes',{event:'*',schema:'public',table:'drive_bids'},function(payload){ var row = payload.new || payload.old; if(!row || !row.ride_id) return; if(S.activeRide && S.activeRide.id === row.ride_id){ loadRideBids(row.ride_id).then(function(){ if(S.tab === 'home' && S.mode === 'rider') renderTab(); }); } }).subscribe());
    S.rt.push(c.channel('zy-drive-traveller-'+u.id).on('postgres_changes',{event:'*',schema:'public',table:'drive_travellers',filter:'user_id=eq.'+u.id},function(payload){ if(payload.new) S.traveller = Object.assign({}, S.traveller||{}, payload.new); if(S.tab === 'home' && S.mode === 'rider' && !S.activeRide) renderTab(); if(S.tab === 'profile') renderTab(); }).subscribe());
    S.rt.push(c.channel('zy-drive-driver-'+u.id).on('postgres_changes',{event:'*',schema:'public',table:'drive_drivers',filter:'user_id=eq.'+u.id},function(payload){ if(payload.new) S.driver = Object.assign({}, S.driver||{}, payload.new); if(S.tab === 'home' || S.tab === 'profile') renderTab(); }).subscribe());
    S.rt.push(c.channel('zy-drive-chat-'+u.id).on('postgres_changes',{event:'INSERT',schema:'public',table:'drive_chat'},function(payload){ var row = payload.new; if(!row) return; if(S.chatRideId === row.ride_id) loadChat(row.ride_id); }).subscribe());
    S.rt.push(c.channel('zy-drive-share-'+u.id).on('postgres_changes',{event:'*',schema:'public',table:'drive_shared_bookings'},function(){ computeShareBadge().then(updateBadges); }).subscribe());
    S.rt.push(c.channel('zy-drive-share-j-'+u.id).on('postgres_changes',{event:'*',schema:'public',table:'drive_shared_journeys'},function(){ computeShareBadge().then(updateBadges); }).subscribe());
  } catch(e){}
}

var _origShowView = Z.showView;
Z.showView = async function(view, param){
  var prevView = Z.State.currentView;
  var prevParam = Z.State.currentParam;
  if(view !== 'drive' && view !== 'drive-profile'){ stopPeriodicSync(); stopRidePoll(); if(S.mapRefreshTimer){ clearInterval(S.mapRefreshTimer); S.mapRefreshTimer = null; } }
   if(view === 'drive-profile'){
    /* v9.1: push current view so back returns here */
    if(prevView && prevView !== 'drive-profile'){
      Z.State.navStack = Z.State.navStack || [];
      Z.State.navStack.push({ view: prevView, param: prevParam });
      if(Z.State.navStack.length > 40) Z.State.navStack.shift();
      var _out = [];
      for(var _i = 0; _i < Z.State.navStack.length; _i++){
        var _top = _out[_out.length - 1];
        if(!_top || _top.view !== Z.State.navStack[_i].view || _top.param !== Z.State.navStack[_i].param){
          _out.push(Z.State.navStack[_i]);
        }
      }
      Z.State.navStack = _out;
    }
    Z.State.currentView = 'drive-profile';
    Z.State.currentParam = param;
    try { localStorage.setItem('zynix_last_view','drive-profile'); localStorage.setItem('zynix_last_param', param||''); } catch(e){}
    window.scrollTo(0,0);
    document.querySelectorAll('#bottom-nav button:not(.create-btn)').forEach(function(b){ b.classList.remove('active'); });
    var navG = document.getElementById('nav-galleria'); if(navG) navG.classList.add('active');
    startPeriodicSync();
    await renderDriveProfilePage(param);
    return;
  }
  if(view === 'drive'){
    var app = document.getElementById('app-container'); if(!app) return;
    app.innerHTML = '<div style="display:flex;flex-direction:column;gap:14px;"><div class="view-header"><button class="colored-back-btn" onclick="Z.showView(\'galleria\')"><i class="fa-solid fa-arrow-left"></i> Back</button><h2 class="view-title" style="margin-left:6px;"><i class="fa-solid fa-car-side" style="color:#10b981;margin-right:8px;"></i>ZYNIX Drive</h2></div><div id="zy-drive-mount"></div></div>';
    document.querySelectorAll('#bottom-nav button:not(.create-btn)').forEach(function(b){ b.classList.remove('active'); });
    var navG = document.getElementById('nav-galleria'); if(navG) navG.classList.add('active');
    Z.State.currentView = 'drive'; Z.State.currentParam = null;
    try { localStorage.setItem('zynix_last_view','drive'); localStorage.removeItem('zynix_last_param'); } catch(e){}
    window.scrollTo(0,0);
    setTimeout(function(){ var m = document.getElementById('zy-drive-mount'); if(m) init(m); }, 60);
    return;
  }
  return _origShowView.call(this, view, param);
};

    + '<div style="background:linear-gradient(135deg,#10b981,#3b82f6);border-radius:16px;padding:18px;"><div style="font-size:20px;font-weight:900;color:#000;">Bookings</div><div style="font-size:12px;color:rgba(0,0,0,.75);margin-top:4px;line-height:1.5;">Reserve rides, tables, rooms, tickets, and services. ZYNIX Ride & Share Ride are live.</div></div>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">';
  BOOKINGS.forEach(function(c){
    var oc = c.active ? (c.title === 'Share Ride' ? 'Z.showView(\'drive\');setTimeout(function(){var b=document.querySelector(\'[data-tab="share-ride"]\');if(b)b.click();},300)' : 'Z.showView(\'drive\')') : "Z.toast('"+c.title+" coming soon')";
    h += '<button onclick="'+oc+'" style="background:#111827;border:1px solid '+(c.active?'rgba(16,185,129,.4)':'#1e293b')+';border-radius:16px;padding:14px;text-align:left;cursor:pointer;position:relative;overflow:hidden;">';
    h += c.active ? '<div style="position:absolute;top:8px;right:8px;background:#10b981;color:#000;font-size:8px;font-weight:900;padding:2px 7px;border-radius:20px;">LIVE</div>' : '<div style="position:absolute;top:8px;right:8px;background:rgba(148,163,184,.18);color:#94a3b8;font-size:8px;font-weight:800;padding:2px 6px;border-radius:20px;">SOON</div>';
    h += '<div style="width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:center;font-size:16px;margin-bottom:10px;"><i class="'+c.icon+'" style="color:'+c.color+';"></i></div>'
      + '<div style="font-size:13px;font-weight:700;color:#fff;margin-bottom:2px;">'+c.title+'</div><div style="font-size:10px;color:#94a3b8;line-height:1.5;">'+c.sub+'</div></button>';
  });
  h += '</div></div>';
  app.innerHTML = h;
  document.querySelectorAll('#bottom-nav button:not(.create-btn)').forEach(function(b){ b.classList.remove('active'); });

  Z.State.currentView = 'galleria'; try { localStorage.setItem('zynix_last_view','galleria'); } catch(e){}
  window.scrollTo(0,0);
};

   <!-- ============================================================ -->
<!-- ZYNIX DRIVE — SECTION 17b v3: SHARE RIDE                     -->
<!-- Log book · clickable profiles · ratings · auto badges        -->
<!-- ============================================================ -->
<script>
(function(){
'use strict';
var Z = window.Z; if(!Z) return;
if(Z.__ZynixShareRideV3) return; Z.__ZynixShareRideV3 = true;

function me(){ return (Z.State && Z.State.currentUser) || null; }
function db(){ try { return Z.sb ? Z.sb() : null; } catch(e){ return null; } }
function toast(m,t){ if(Z.toast) Z.toast(m,t); else console.log('[Share]',m); }
function esc(s){ if(s==null) return ''; return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function ago(ts){ if(!ts) return ''; var s=Math.floor((Date.now()-new Date(ts).getTime())/1000); if(s<60) return s+'s ago'; if(s<3600) return Math.floor(s/60)+'m ago'; if(s<86400) return Math.floor(s/3600)+'h ago'; return Math.floor(s/86400)+'d ago'; }
function money(n, cur){ var map = {GBP:'£',USD:'$',EUR:'€',PKR:'₨',INR:'₹',AED:'د.إ',SAR:'﷼',JPY:'¥',CNY:'¥',AUD:'A$',CAD:'C$',TRY:'₺'}; var cc = cur || (Z.driveCurrency ? Z.driveCurrency() : 'GBP'); var sym = map[cc] || (cc+' '); return sym + (Number(n)||0).toFixed(2); }
function cur(){ return Z.driveCurrency ? Z.driveCurrency() : 'GBP'; }
function ratingFlagMini(avg, count, uid){
  if(!count || count < 1) return '<span style="font-size:10px;color:#64748b;margin-left:6px;">New</span>';
  var good = (Number(avg)||0) >= 6;
  var color = good ? '#10b981' : '#ef4444';
  var click = uid ? (' onclick="event.stopPropagation();Z.showView(\'drive-profile\',\''+esc(uid)+'\')"') : '';
  return '<span'+click+' style="cursor:pointer;display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:900;color:'+color+';padding:1px 6px;border-radius:6px;background:'+(good?'rgba(16,185,129,.12)':'rgba(239,68,68,.12)')+';border:1px solid '+(good?'rgba(16,185,129,.35)':'rgba(239,68,68,.35)')+';margin-left:6px;"><i class="fa-solid fa-flag" style="font-size:8px;"></i> '+(Number(avg)||5).toFixed(1)+'</span>';
}
function avatarFor(p, size){
  size = size || 34;
  if(p && p.avatar) return '<img src="'+esc(p.avatar)+'" style="width:'+size+'px;height:'+size+'px;border-radius:50%;object-fit:cover;flex-shrink:0;">';
  var initial = ((p && (p.username||'U')) || 'U').charAt(0).toUpperCase();
  return '<div style="width:'+size+'px;height:'+size+'px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#8b5cf6);display:flex;align-items:center;justify-content:center;color:#fff;font-size:'+Math.round(size*0.42)+'px;font-weight:900;flex-shrink:0;">'+initial+'</div>';
}

var SR = { journeys:[], bookings:{}, tab:'public', rtCh:[], profileCache:{}, ratingCache:{} };

/* ================== PROFILE / RATING CACHE ================== */
async function fetchProfile(userId){
  if(!userId) return null;
  if(SR.profileCache[userId]) return SR.profileCache[userId];
  var c = db(); if(!c) return null;
  try {
    var r = await c.from('profiles').select('id,username,avatar').eq('id',userId).maybeSingle();
    if(r.data) SR.profileCache[userId] = r.data;
    return r.data || { id:userId, username:'User' };
  } catch(e){ return { id:userId, username:'User' }; }
}
async function fetchDriverRating(uid){
  if(!uid) return null;
  if(SR.ratingCache[uid]) return SR.ratingCache[uid];
  var c = db(); if(!c) return null;
  try {
    var r = await c.from('drive_drivers').select('rating_avg,total_rides').eq('user_id',uid).maybeSingle();
    if(r.data) SR.ratingCache[uid] = r.data;
    return r.data;
  } catch(e){ return null; }
}
async function fetchRiderRating(uid){
  if(!uid) return null;
  var key = 'r_'+uid;
  if(SR.ratingCache[key]) return SR.ratingCache[key];
  var c = db(); if(!c) return null;
  try {
    var r = await c.from('drive_travellers').select('rating_avg,total_rides').eq('user_id',uid).maybeSingle();
    if(r.data) SR.ratingCache[key] = r.data;
    return r.data;
  } catch(e){ return null; }
}

/* ================== RENDER ================== */
Z.renderShareRide = function(c){
  var h = '<div style="display:flex;flex-direction:column;gap:12px;">';
  h += '<div style="display:flex;gap:6px;padding:4px 0 8px;">';
  [['public','Public rides','fa-solid fa-globe'],['mine','My rides','fa-solid fa-car'],['bookings','My bookings','fa-solid fa-ticket'],['log','Log book','fa-solid fa-book']].forEach(function(t){
    var a = SR.tab === t[0];
    h += '<button data-srtab="'+t[0]+'" style="flex:1;padding:10px 4px;border-radius:10px;border:1px solid '+(a?'rgba(16,185,129,.5)':'#1e293b')+';background:'+(a?'rgba(16,185,129,.12)':'rgba(255,255,255,0.03)')+';color:'+(a?'#10b981':'#94a3b8')+';font-weight:800;font-size:10px;cursor:pointer;"><i class="'+t[2]+'"></i><br>'+t[1]+'</button>';
  });
  h += '</div>';
  h += '<button id="zy-sr-create" style="width:100%;padding:14px;border-radius:12px;border:none;background:linear-gradient(135deg,#10b981,#3b82f6);color:#000;font-weight:900;font-size:13px;cursor:pointer;"><i class="fa-solid fa-plus"></i> Offer a journey</button>';
  h += '<div id="zy-sr-list"><div style="text-align:center;padding:30px;color:#64748b;"><i class="fa-solid fa-circle-notch fa-spin"></i></div></div>';
  h += '</div>';
  c.innerHTML = h;
  c.querySelectorAll('[data-srtab]').forEach(function(b){ b.addEventListener('click', function(){ SR.tab = this.getAttribute('data-srtab'); SR.profileCache = {}; SR.ratingCache = {}; Z.renderShareRide(c); }); });
  var cr = document.getElementById('zy-sr-create'); if(cr) cr.addEventListener('click', function(){ openCreateJourney(c); });
  loadList();
};

async function loadList(){
  var host = document.getElementById('zy-sr-list'); if(!host) return;
  var c = db(); if(!c) return; var u = me(); if(!u) return;
  host.innerHTML = '<div style="text-align:center;padding:30px;color:#64748b;"><i class="fa-solid fa-circle-notch fa-spin"></i></div>';
  try {
    if(SR.tab === 'public'){
      var r = await c.from('drive_shared_journeys').select('*').eq('is_active',true).eq('is_public',true).gte('departure_time', new Date(Date.now()-60*60*1000).toISOString()).order('departure_time',{ascending:true}).limit(40);
      if(r.error) throw r.error;
      SR.journeys = r.data || [];
      await hydrateCounts();
      await hydrateMyBookings();
      await hydrateJourneyProfiles();
    } else if(SR.tab === 'mine'){
      var rm = await c.from('drive_shared_journeys').select('*').eq('driver_id', u.id).order('departure_time',{ascending:false}).limit(40);
      if(rm.error) throw rm.error;
      SR.journeys = rm.data || [];
      await hydrateCounts();
    } else if(SR.tab === 'bookings'){
      var rb = await c.from('drive_shared_bookings').select('*').eq('rider_id', u.id).order('created_at',{ascending:false}).limit(40);
      var ids = (rb.data||[]).map(function(x){ return x.journey_id; });
      var jr = ids.length ? await c.from('drive_shared_journeys').select('*').in('id', ids) : {data:[]};
      var jmap = {}; (jr.data||[]).forEach(function(j){ jmap[j.id]=j; });
      SR.journeys = (rb.data||[]).map(function(b){ return Object.assign({}, jmap[b.journey_id]||{}, {_booking: b}); });
      await hydrateCounts();
      await hydrateJourneyProfiles();
    } else if(SR.tab === 'log'){
      /* Full activity feed: bookings on my journeys + my bookings */
      var rmj = await c.from('drive_shared_journeys').select('id,start_name,end_name,departure_time,fare,currency').eq('driver_id', u.id);
      var mineJourneys = rmj.data || [];
      var mineIds = mineJourneys.map(function(j){ return j.id; });
      var incoming = [];
      if(mineIds.length){
        var rlog = await c.from('drive_shared_bookings').select('*').in('journey_id', mineIds).order('created_at',{ascending:false}).limit(100);
        var jmap2 = {}; mineJourneys.forEach(function(j){ jmap2[j.id] = j; });
        incoming = (rlog.data||[]).map(function(b){ return Object.assign({}, b, {_journey: jmap2[b.journey_id]||{}, _kind:'incoming'}); });
      }
      var myOut = await c.from('drive_shared_bookings').select('*').eq('rider_id', u.id).order('created_at',{ascending:false}).limit(100);
      var outIds = (myOut.data||[]).map(function(b){ return b.journey_id; });
      var jmap3 = {};
      if(outIds.length){
        var jr3 = await c.from('drive_shared_journeys').select('id,start_name,end_name,departure_time,fare,currency,driver_id').in('id', outIds);
        (jr3.data||[]).forEach(function(j){ jmap3[j.id] = j; });
      }
      var outgoing = (myOut.data||[]).map(function(b){ return Object.assign({}, b, {_journey: jmap3[b.journey_id]||{}, _kind:'outgoing'}); });

      /* Preload every profile and rating we need */
      var allRiderIds = incoming.map(function(b){ return b.rider_id; });
      var allDriverIds = outgoing.map(function(b){ return b._journey.driver_id; }).filter(Boolean);
      var allProfileIds = allRiderIds.concat(allDriverIds);
      var uniq = allProfileIds.filter(function(v,i,a){ return a.indexOf(v) === i; });
      if(uniq.length){
        var pr = await c.from('profiles').select('id,username,avatar').in('id', uniq);
        (pr.data||[]).forEach(function(p){ SR.profileCache[p.id] = p; });
      }
      if(allRiderIds.length){
        var rrs = await c.from('drive_travellers').select('user_id,rating_avg,total_rides').in('user_id', allRiderIds);
        (rrs.data||[]).forEach(function(x){ SR.ratingCache['r_'+x.user_id] = x; });
      }
      if(allDriverIds.length){
        var rds = await c.from('drive_drivers').select('user_id,rating_avg,total_rides').in('user_id', allDriverIds);
        (rds.data||[]).forEach(function(x){ SR.ratingCache[x.user_id] = x; });
      }

      SR.journeys = [{_log: true, incoming: incoming, outgoing: outgoing}];
    }
    renderList();
  } catch(e){ host.innerHTML = '<div style="text-align:center;padding:20px;color:#f87171;font-size:12px;">Failed: ' + esc(e.message) + '</div>'; }
}

async function hydrateJourneyProfiles(){
  var c = db(); if(!c) return;
  var driverIds = SR.journeys.map(function(j){ return j.driver_id; }).filter(Boolean);
  var uniq = driverIds.filter(function(v,i,a){ return a.indexOf(v) === i; });
  if(!uniq.length) return;
  try {
    var pr = await c.from('profiles').select('id,username,avatar').in('id', uniq);
    (pr.data||[]).forEach(function(p){ SR.profileCache[p.id] = p; });
    var rd = await c.from('drive_drivers').select('user_id,rating_avg,total_rides').in('user_id', uniq);
    (rd.data||[]).forEach(function(x){ SR.ratingCache[x.user_id] = x; });
  } catch(e){}
}

async function hydrateCounts(){
  if(!SR.journeys.length){ SR.bookings = {}; return; }
  var c = db(); if(!c) return;
  var jids = SR.journeys.map(function(j){ return j.id; });
  /* Try RPC first (bypasses RLS), fallback to direct query */
  try {
    var r = await c.rpc('drive_shared_counts', { p_journey_ids: jids });
    if(r.error) throw r.error;
    var map = {};
    (r.data||[]).forEach(function(x){
      map[x.journey_id] = { accepted: Number(x.accepted_seats)||0, pending: Number(x.pending_count)||0, riders: x.rider_ids||[] };
    });
    SR.bookings = map;
    return;
  } catch(e){}
  try {
    var br = await c.from('drive_shared_bookings').select('journey_id,status,seats,rider_id').in('journey_id', jids).in('status',['pending','accepted']);
    var map2 = {};
    (br.data||[]).forEach(function(b){
      if(!map2[b.journey_id]) map2[b.journey_id] = { accepted:0, pending:0, riders:[] };
      if(b.status === 'accepted') map2[b.journey_id].accepted += (b.seats||1);
      else map2[b.journey_id].pending++;
      if(map2[b.journey_id].riders.indexOf(b.rider_id) === -1) map2[b.journey_id].riders.push(b.rider_id);
    });
    SR.bookings = map2;
  } catch(e2){ SR.bookings = {}; }
}

async function hydrateMyBookings(){
  var u = me(); if(!u) return; var c = db(); if(!c) return;
  var jids = SR.journeys.map(function(j){ return j.id; });
  if(!jids.length) return;
  try {
    var r = await c.from('drive_shared_bookings').select('journey_id,status,seats,rider_id').in('journey_id', jids).eq('rider_id', u.id);
    var m = {};
    (r.data||[]).forEach(function(x){ m[x.journey_id] = x; });
    SR.journeys.forEach(function(j){ if(m[j.id]) j._booking = m[j.id]; });
  } catch(e){}
}

function renderList(){
  var host = document.getElementById('zy-sr-list'); if(!host) return;
  var u = me();

  /* ============ LOG BOOK VIEW ============ */
  if(SR.tab === 'log' && SR.journeys[0] && SR.journeys[0]._log){
    var e = SR.journeys[0];
    var incoming = e.incoming || [];
    var outgoing = e.outgoing || [];
    if(!incoming.length && !outgoing.length){
      host.innerHTML = '<div style="text-align:center;padding:40px 20px;color:#94a3b8;font-size:12px;"><i class="fa-solid fa-book" style="font-size:44px;color:#334155;display:block;margin-bottom:12px;"></i>No activity yet.</div>';
      return;
    }
    var h = '';
    if(incoming.length){
      h += '<div style="font-size:11px;font-weight:900;color:#e2e8f0;margin:0 0 8px 0;"><i class="fa-solid fa-inbox" style="color:#10b981;margin-right:6px;"></i>INCOMING REQUESTS ON MY JOURNEYS</div>';
      incoming.forEach(function(b){
        var p = SR.profileCache[b.rider_id] || { username:'Rider', id:b.rider_id };
        var rr = SR.ratingCache['r_'+b.rider_id];
        var stColor = b.status === 'accepted' ? '#10b981' : (b.status === 'pending' ? '#fbbf24' : '#ef4444');
        var stLabel = b.status === 'pending' ? 'PENDING' : b.status.toUpperCase();
        h += '<div style="padding:12px;border-radius:12px;background:#111827;border:1px solid #1e293b;margin-bottom:8px;">'
          + '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px;">'
          + '<div style="display:flex;gap:10px;align-items:center;flex:1;min-width:0;cursor:pointer;" onclick="Z.showView(\'drive-profile\',\''+esc(b.rider_id)+'\')">'
          + avatarFor(p, 38)
          + '<div style="min-width:0;flex:1;"><div style="font-size:13px;font-weight:800;color:#fff;display:flex;align-items:center;flex-wrap:wrap;">'+esc(p.username||'Rider')+ratingFlagMini(rr && rr.rating_avg, rr && rr.total_rides, b.rider_id)+'</div>'
          + '<div style="font-size:10px;color:#94a3b8;margin-top:2px;">'+esc(b._journey.start_name||'')+' → '+esc(b._journey.end_name||'')+'</div></div></div>'
          + '<div style="text-align:right;flex-shrink:0;"><div style="font-size:10px;font-weight:900;color:'+stColor+';">'+stLabel+'</div>'
          + '<div style="font-size:9px;color:#64748b;margin-top:2px;">'+ago(b.created_at)+'</div></div></div>'
          + '<div style="display:flex;gap:8px;margin-top:8px;">'
          + '<div style="flex:1;padding:8px 10px;border-radius:8px;background:rgba(0,0,0,0.25);"><div style="font-size:9px;color:#94a3b8;font-weight:800;">SEATS</div><div style="font-size:14px;font-weight:900;color:#fff;">'+b.seats+'</div></div>'
          + '<div style="flex:1;padding:8px 10px;border-radius:8px;background:rgba(0,0,0,0.25);"><div style="font-size:9px;color:#94a3b8;font-weight:800;">FARE</div><div style="font-size:14px;font-weight:900;color:#10b981;">'+money(b._journey.fare, b._journey.currency)+'</div></div>'
          + '</div>'
          + (b.message ? '<div style="font-size:11px;color:#cbd5e1;margin-top:8px;padding:6px 10px;border-radius:8px;background:rgba(0,0,0,0.2);font-style:italic;">"'+esc(b.message)+'"</div>' : '')

    + '<label style="font-size:11px;color:#94a3b8;font-weight:800;">AMOUNT (' + esc(cur()) + ')</label>'
    + '<input id="zy-exp-amt" type="number" min="0.01" step="0.5" placeholder="0.00" style="width:100%;padding:11px;margin:4px 0 10px 0;border-radius:10px;border:1px solid #1e293b;background:#0f172a;color:#fff;font-size:15px;box-sizing:border-box;outline:none;" />'
    + '<label style="font-size:11px;color:#94a3b8;font-weight:800;">CATEGORY</label>'
    + '<select id="zy-exp-cat" style="width:100%;padding:11px;margin:4px 0 10px 0;border-radius:10px;border:1px solid #1e293b;background:#0f172a;color:#fff;font-size:13px;box-sizing:border-box;">'
    + ['fuel','maintenance','tyres','insurance','cleaning','wash','parking','tolls','food','other'].map(function(x){ return '<option value="' + x + '">' + x.charAt(0).toUpperCase() + x.slice(1) + '</option>'; }).join('')
    + '</select>'
    + '<label style="font-size:11px;color:#94a3b8;font-weight:800;">NOTE (optional)</label>'
    + '<input id="zy-exp-note" placeholder="e.g. Petrol at Shell" style="width:100%;padding:11px;margin:4px 0 14px 0;border-radius:10px;border:1px solid #1e293b;background:#0f172a;color:#fff;font-size:13px;box-sizing:border-box;outline:none;" />'
    + '<div style="display:flex;gap:8px;"><button id="zy-exp-x" style="flex:1;padding:12px;border-radius:8px;border:1px solid #1e293b;background:transparent;color:#cbd5e1;font-weight:800;cursor:pointer;">Cancel</button><button id="zy-exp-s" style="flex:1;padding:12px;border-radius:8px;border:none;background:linear-gradient(135deg,#10b981,#3b82f6);color:#000;font-weight:900;cursor:pointer;">Save</button></div></div></div>';
  document.body.insertAdjacentHTML('beforeend', html);
  document.getElementById('zy-exp-x').onclick = function(){ document.getElementById('zy-exp-modal').remove(); };
  document.getElementById('zy-exp-s').onclick = async function(){
    var u = me(); if(!u) return; var c = db(); if(!c) return;
    var amt = parseFloat(document.getElementById('zy-exp-amt').value)||0;
    if(amt <= 0){ toast('Enter an amount'); return; }
    var cat = document.getElementById('zy-exp-cat').value;
    var note = (document.getElementById('zy-exp-note').value||'').trim() || null;
    try {
      await c.from('drive_driver_expenses').insert({ driver_id: u.id, amount: amt, category: cat, note: note });
      document.getElementById('zy-exp-modal').remove();
      toast('Expense saved');
      loadLedger();
    } catch(e){ toast('Failed: ' + e.message); }
  };
}

/* ================== RIDER ANALYTICS ================== */
Z.drvOpenRiderAnalytics = async function(){
  var u = me(); if(!u){ toast('Login first'); return; }
  var c = db(); if(!c) return;
  var html = '<div id="zy-ran-modal" style="position:fixed;inset:0;z-index:99999;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto;"><div style="background:#111827;border:1px solid #1e293b;border-radius:14px;padding:20px;width:100%;max-width:460px;max-height:92vh;overflow-y:auto;">'
    + '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;"><h3 style="margin:0;font-size:16px;color:#fff;"><i class="fa-solid fa-chart-line" style="color:#3b82f6;margin-right:8px;"></i>My Analytics</h3><button id="zy-ran-x" style="background:transparent;border:none;color:#94a3b8;font-size:22px;cursor:pointer;">&times;</button></div>'
    + '<div id="zy-ran-body"><div style="text-align:center;padding:30px;"><i class="fa-solid fa-circle-notch fa-spin" style="color:#10b981;font-size:20px;"></i></div></div>'
    + '</div></div>';
  document.body.insertAdjacentHTML('beforeend', html);
  document.getElementById('zy-ran-x').onclick = function(){ document.getElementById('zy-ran-modal').remove(); };

  try {
    var ridesRes = await c.from('drive_rides').select('id,agreed_fare,rider_offered_fare,tip_amount,fare_currency,completed_at,created_at')
      .eq('traveller_id', u.id).eq('status','completed').order('created_at',{ascending:false}).limit(500);
    var rides = ridesRes.data || [];

    /* Offers used: promos by others where rider is a participant — placeholder for now */
    var promosRes = await c.from('drive_promos').select('id,title,discount_pct,badge,created_at').eq('user_id', u.id).limit(20);
    var myPromos = promosRes.data || [];

    var total = rides.length;
    var totalPaid = rides.reduce(function(s,r){ return s + (Number(r.agreed_fare)||Number(r.rider_offered_fare)||0); }, 0);
    var totalTips = rides.reduce(function(s,r){ return s + (Number(r.tip_amount)||0); }, 0);
    var totalOut = totalPaid + totalTips;
    var avgFare = total ? (totalPaid/total) : 0;

    /* Week / month breakdown */
    var now = Date.now();
    var weekAgo = now - 7*24*60*60*1000;
    var monthAgo = now - 30*24*60*60*1000;
    var weekRides = rides.filter(function(r){ return new Date(r.created_at).getTime() >= weekAgo; });
    var monthRides = rides.filter(function(r){ return new Date(r.created_at).getTime() >= monthAgo; });
    var weekPaid = weekRides.reduce(function(s,r){ return s + (Number(r.agreed_fare)||Number(r.rider_offered_fare)||0); }, 0);
    var monthPaid = monthRides.reduce(function(s,r){ return s + (Number(r.agreed_fare)||Number(r.rider_offered_fare)||0); }, 0);

    /* 6-month bar chart */
    var months = [];
    for(var i = 5; i >= 0; i--){
      var d = new Date(); d.setDate(1); d.setHours(0,0,0,0); d.setMonth(d.getMonth() - i);
      var start = d.getTime();
      var next = new Date(d); next.setMonth(next.getMonth() + 1);
      var end = next.getTime();
      var sum = 0, count = 0;
      rides.forEach(function(r){ var t = new Date(r.created_at).getTime(); if(t >= start && t < end){ sum += (Number(r.agreed_fare)||Number(r.rider_offered_fare)||0); count++; } });
      months.push({ label: d.toLocaleString('en',{month:'short'}), amount: sum, count: count });
    }
    var maxBar = Math.max.apply(null, months.map(function(m){ return m.amount; }).concat([1]));

    var h = '';
    h += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;">'
      + '<div style="padding:12px;border-radius:12px;background:linear-gradient(135deg,rgba(16,185,129,.1),rgba(59,130,246,.06));border:1px solid rgba(16,185,129,.28);"><div style="font-size:10px;color:#94a3b8;font-weight:800;">TOTAL RIDES</div><div style="font-size:24px;font-weight:900;color:#fff;margin-top:2px;">' + total + '</div></div>'
      + '<div style="padding:12px;border-radius:12px;background:rgba(251,191,36,.06);border:1px solid rgba(251,191,36,.28);"><div style="font-size:10px;color:#94a3b8;font-weight:800;">AVG FARE</div><div style="font-size:24px;font-weight:900;color:#fbbf24;margin-top:2px;">' + money(avgFare, cur()) + '</div></div>'
      + '</div>';

    h += '<div style="padding:14px;border-radius:12px;background:rgba(59,130,246,.06);border:1px solid rgba(59,130,246,.28);margin-bottom:12px;">'
      + '<div style="font-size:10px;color:#94a3b8;font-weight:800;">TOTAL SPENT ON ZYNIX</div>'
      + '<div style="font-size:26px;font-weight:900;color:#fff;margin-top:2px;">' + money(totalOut, cur()) + '</div>'
      + '<div style="display:flex;gap:14px;margin-top:8px;font-size:11px;color:#cbd5e1;flex-wrap:wrap;">'
      + '<span>Fares: <b style="color:#60a5fa;">' + money(totalPaid, cur()) + '</b></span>'
      + '<span>Tips: <b style="color:#fbbf24;">' + money(totalTips, cur()) + '</b></span>'
      + '</div></div>';

    h += '<div style="display:flex;gap:8px;margin-bottom:12px;">'
      + '<div style="flex:1;padding:10px;border-radius:10px;background:rgba(0,0,0,0.25);text-align:center;"><div style="font-size:9px;color:#94a3b8;font-weight:800;">THIS WEEK</div><div style="font-size:15px;font-weight:900;color:#10b981;margin-top:2px;">' + money(weekPaid, cur()) + '</div><div style="font-size:9px;color:#64748b;">' + weekRides.length + ' rides</div></div>'
      + '<div style="flex:1;padding:10px;border-radius:10px;background:rgba(0,0,0,0.25);text-align:center;"><div style="font-size:9px;color:#94a3b8;font-weight:800;">THIS MONTH</div><div style="font-size:15px;font-weight:900;color:#10b981;margin-top:2px;">' + money(monthPaid, cur()) + '</div><div style="font-size:9px;color:#64748b;">' + monthRides.length + ' rides</div></div>'
      + '</div>';

    /* Bar chart */
    h += '<div style="padding:14px;border-radius:12px;background:#0f172a;border:1px solid #1e293b;margin-bottom:12px;">'
      + '<div style="font-size:10px;color:#94a3b8;font-weight:800;margin-bottom:10px;">LAST 6 MONTHS</div>'
      + '<div style="display:flex;align-items:flex-end;gap:6px;height:80px;">';
    months.forEach(function(m){
      var hp = maxBar > 0 ? (m.amount / maxBar) * 100 : 0;
      h += '<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;">'
        + '<div style="font-size:8px;color:#64748b;">' + (m.amount > 0 ? Math.round(m.amount) : '') + '</div>'
        + '<div style="width:100%;height:' + Math.max(4, hp) + '%;background:linear-gradient(180deg,#10b981,#3b82f6);border-radius:4px;min-height:4px;"></div>'
        + '<div style="font-size:9px;color:#94a3b8;font-weight:800;">' + m.label + '</div></div>';
    });
    h += '</div></div>';

    /* Promos created by this rider */
    if(myPromos.length){
      h += '<div style="padding:12px;border-radius:12px;background:rgba(139,92,246,.06);border:1px solid rgba(139,92,246,.28);">'
        + '<div style="font-size:10px;color:#94a3b8;font-weight:800;margin-bottom:8px;">MY OFFERS ON ZYNIX (' + myPromos.length + ')</div>';
      myPromos.slice(0,5).forEach(function(p){
        h += '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;background:rgba(0,0,0,0.25);margin-bottom:6px;">'
          + '<div style="font-size:12px;color:#fff;font-weight:700;">' + esc(p.title) + '</div>'
          + (p.discount_pct ? '<span style="font-size:10px;padding:2px 6px;border-radius:6px;background:rgba(16,185,129,.18);color:#10b981;font-weight:900;">-' + p.discount_pct + '%</span>' : '')
          + '</div>';
      });
      h += '</div>';
    }

    document.getElementById('zy-ran-body').innerHTML = h;
  } catch(e){
    document.getElementById('zy-ran-body').innerHTML = '<div style="text-align:center;padding:20px;color:#f87171;font-size:12px;">Failed: ' + esc(e.message) + '</div>';
  }
};

console.log('[ZYNIX Drive v9c] ready — notifications · ledger · analytics');
})();
</script>
</body>
</html>

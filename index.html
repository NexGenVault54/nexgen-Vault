<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ZYNIX - Complete Social Platform</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:#090d16;color:#f8fafc;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding-bottom:80px;overflow-x:hidden}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:#090d16}
::-webkit-scrollbar-thumb{background:#1e293b;border-radius:4px}

.zynix-header{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(9,13,22,.92);backdrop-filter:blur(12px);border-bottom:1px solid #1e293b;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;min-height:56px}
.header-logo{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#10b981,#3b82f6);display:flex;align-items:center;justify-content:center;font-weight:900;color:#000;font-size:14px}
.header-title{font-size:18px;font-weight:900;background:linear-gradient(90deg,#10b981,#3b82f6,#8b5cf6);-webkit-background-clip:text;background-clip:text;color:transparent}
.header-btn{background:transparent;border:none;color:#94a3b8;cursor:pointer;padding:6px;transition:color .2s}
.header-btn:hover{color:#fff}
.wallet-pill{background:rgba(15,23,42,.9);border:1px solid #1e293b;border-radius:20px;padding:4px 10px;font-size:10px;display:flex;align-items:center;gap:6px}

.zynix-footer{position:fixed;bottom:0;left:0;right:0;z-index:1000;background:rgba(9,13,22,.95);backdrop-filter:blur(12px);border-top:1px solid #1e293b;padding:8px 0;display:flex;align-items:center;justify-content:space-around;max-width:600px;margin:0 auto}
.zynix-footer button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 0;color:#64748b;transition:color .2s;background:transparent;border:none;font-size:9px;cursor:pointer;font-weight:500}
.zynix-footer button i{font-size:18px;margin-bottom:2px}
.zynix-footer button:hover,.zynix-footer button.active{color:#10b981}
.zynix-footer .create-btn{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#10b981,#3b82f6);color:#000;font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:-16px;box-shadow:0 4px 20px rgba(16,185,129,.3);transition:transform .2s;flex:none}
.zynix-footer .create-btn:hover{transform:scale(1.08)}
.zynix-footer .create-btn i{font-size:20px;margin:0}

#app-container{max-width:600px;margin:0 auto;padding:76px 14px 20px;min-height:calc(100vh - 80px)}

/* STATUS ROW */
.status-row-wrap{background:#111827;border:1px solid #1e293b;border-radius:16px;padding:12px;margin-bottom:14px}
.status-scroll{display:flex;gap:10px;overflow-x:auto;padding:4px 0;scrollbar-width:none;-ms-overflow-style:none}
.status-scroll::-webkit-scrollbar{display:none}
.status-item{flex-shrink:0;width:68px;text-align:center;background:transparent;border:none;cursor:pointer;padding:0}
.status-ring-unseen{background:linear-gradient(135deg,#10b981,#3b82f6,#8b5cf6);padding:3px;border-radius:50%;width:58px;height:58px;margin:0 auto}
.status-ring-seen{background:#1e293b;padding:3px;border-radius:50%;width:58px;height:58px;margin:0 auto}
.status-ring-inner{width:100%;height:100%;border-radius:50%;background:#090d16;padding:2px}
.status-ring-inner img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.status-label{font-size:9px;font-weight:600;color:#94a3b8;display:block;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}

/* STATUS VIEWER */
.status-viewer-overlay{position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.98);display:flex;flex-direction:column;color:#fff;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.status-viewer-header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.05);flex-shrink:0}
.status-viewer-body{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0;overflow:hidden;touch-action:pan-y}
.status-stage{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#000;height:clamp(320px,58vh,620px);position:relative}
.status-stage img,.status-stage video{width:100%;height:100%;object-fit:contain;max-width:100%;max-height:100%}
.status-stage .text-status{padding:24px;font-size:clamp(1.2rem,4vw,2.2rem);font-weight:700;text-align:center;line-height:1.6;color:#fff;overflow-y:auto;max-height:100%;width:100%;word-break:break-word}
.status-nav-btn{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1);color:#fff;cursor:pointer;font-size:18px;display:flex;align-items:center;justify-content:center;transition:background .2s;z-index:10}
.status-nav-btn:hover{background:rgba(255,255,255,.15)}
.status-nav-btn.left{left:10px}
.status-nav-btn.right{right:10px}
.status-viewer-footer{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-top:1px solid rgba(255,255,255,.05);flex-shrink:0;height:68px}
.status-viewer-footer button{padding:8px 20px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#fff;font-size:12px;cursor:pointer;transition:background .2s;font-weight:600}
.status-viewer-footer button:hover{background:rgba(255,255,255,.12)}

/* CIRCLE X BUTTON */
.circle-x-btn{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:background .2s;flex-shrink:0}
.circle-x-btn:hover{background:rgba(255,255,255,.2)}

/* COLORED BACK BUTTON */
.colored-back-btn{background:#10b981;color:#000;border:none;padding:8px 16px;border-radius:10px;font-size:12px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:opacity .2s}
.colored-back-btn:hover{opacity:.9}
.colored-back-btn i{font-size:13px}

/* POST */
.post-card{background:#111827;border:1px solid #1e293b;border-radius:16px;padding:14px;margin-bottom:12px}
.post-author{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.post-author img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:1px solid #1e293b}
.post-author .pname{font-weight:700;font-size:13px;color:#fff}
.post-author .phandle{font-size:10px;color:#64748b}
.post-content{font-size:13px;color:#e2e8f0;line-height:1.6;margin-bottom:10px;white-space:pre-wrap;word-break:break-word}
.post-media{border-radius:12px;overflow:hidden;margin-bottom:10px;background:#000}
.post-media img,.post-media video{width:100%;max-height:400px;object-fit:cover;display:block}
.post-reactions{display:flex;flex-wrap:wrap;gap:4px;padding:8px 0;border-top:1px solid #1e293b}
.react-btn{padding:5px 10px;border-radius:20px;font-size:15px;background:transparent;border:1px solid transparent;cursor:pointer;transition:all .15s;display:inline-flex;align-items:center;gap:3px;color:#fff}
.react-btn:hover{transform:scale(1.15);background:#1e293b}
.react-btn.active{background:rgba(16,185,129,.15);border-color:rgba(16,185,129,.3)}
.react-btn .count{font-size:10px;color:#64748b}
.post-actions{display:flex;gap:16px;padding-top:8px;border-top:1px solid #1e293b;font-size:12px;color:#64748b}
.post-actions button{background:transparent;border:none;color:#64748b;cursor:pointer;transition:color .2s;font-size:12px;display:flex;align-items:center;gap:4px;padding:4px 0}
.post-actions button:hover{color:#e2e8f0}
.post-actions button.saved{color:#f59e0b}

/* COMMENTS - LIGHT COLOR */
.post-comments{margin-top:10px;padding-top:10px;border-top:1px solid #1e293b;display:none}
.post-comments.open{display:block}
.comment-item{padding:10px 14px;border-radius:12px;margin-bottom:6px;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.comment-item.light-green{background:#dcfce7;color:#052e16}
.comment-item.light-blue{background:#dbeafe;color:#172554}
.comment-item.light-yellow{background:#fef3c7;color:#451a03}
.comment-item.light-pink{background:#fce7f3;color:#500724}
.comment-item.light-purple{background:#ede9fe;color:#2e1065}
.comment-item .cname{font-weight:700;margin-right:6px;opacity:.9}
.comment-item .ctext{opacity:.85}
.comment-color-picker{display:flex;gap:6px;margin-top:6px;margin-bottom:4px}
.comment-color-dot{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform .15s}
.comment-color-dot:hover{transform:scale(1.15)}
.comment-color-dot.selected{border-color:#10b981;transform:scale(1.15)}
.comment-color-dot.c-green{background:#dcfce7}
.comment-color-dot.c-blue{background:#dbeafe}
.comment-color-dot.c-yellow{background:#fef3c7}
.comment-color-dot.c-pink{background:#fce7f3}
.comment-color-dot.c-purple{background:#ede9fe}
.comment-input-wrap{display:flex;gap:8px;margin-top:8px}
.comment-input-wrap input{flex:1;background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:8px 12px;font-size:12px;color:#fff;outline:none}
.comment-input-wrap input:focus{border-color:#10b981}
.comment-input-wrap button{background:#10b981;border:none;color:#000;font-weight:700;padding:8px 16px;border-radius:8px;font-size:11px;cursor:pointer}

.post-options-menu{display:none;margin-top:8px;padding:8px;background:#0f172a;border-radius:8px;gap:4px;flex-wrap:wrap}
.post-options-menu.open{display:flex}
.post-options-menu button{background:transparent;border:none;font-size:10px;cursor:pointer;padding:6px 10px;border-radius:6px;transition:background .2s}
.post-options-menu button:hover{background:#1e293b}
.post-options-menu .opt-default{color:#94a3b8}
.post-options-menu .opt-danger{color:#ef4444}
.post-options-menu .opt-warn{color:#f59e0b}

/* MODAL */
.modal-overlay{position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .15s ease}
.modal-box{background:#111827;border:1px solid #1e293b;border-radius:16px;max-width:440px;width:100%;max-height:90vh;overflow-y:auto;padding:20px}
.modal-header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #1e293b;padding-bottom:12px;margin-bottom:16px}
.modal-header h3{font-size:16px;font-weight:700;color:#fff}
.modal-close{width:36px;height:36px;border-radius:50%;background:#1e293b;border:none;color:#94a3b8;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s}
.modal-close:hover{background:#334155;color:#fff}
.form-label{display:block;font-size:11px;font-weight:600;color:#64748b;margin-bottom:4px}
.form-input,.form-select,.form-textarea{width:100%;background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:10px 12px;font-size:12px;color:#fff;outline:none;margin-bottom:12px;font-family:inherit}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:#10b981}
.form-textarea{min-height:90px;resize:vertical}
.btn-primary{width:100%;background:#10b981;border:none;color:#000;font-weight:700;padding:12px;border-radius:10px;font-size:13px;cursor:pointer;transition:opacity .2s}
.btn-primary:hover{opacity:.9}
.btn-secondary{width:100%;background:#1e293b;border:none;color:#fff;font-weight:600;padding:10px;border-radius:8px;font-size:12px;cursor:pointer;transition:opacity .2s;margin-top:8px}
.btn-secondary:hover{opacity:.85}

/* MEDIA PREVIEW */
.media-preview-box{margin-top:8px;border-radius:10px;overflow:hidden;border:1px solid #1e293b;background:#0f172a;position:relative;display:none}
.media-preview-box.show{display:block}
.media-preview-box img,.media-preview-box video{width:100%;max-height:240px;object-fit:contain;display:block;background:#000}
.media-preview-remove{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.85);border:1px solid rgba(255,255,255,.15);color:#fff;cursor:pointer;font-size:13px;display:flex;align-items:center;justify-content:center}

/* SHARE */
.share-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.share-item{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border-radius:10px;background:#0f172a;border:1px solid #1e293b;cursor:pointer;transition:all .2s;font-size:9px;color:#94a3b8}
.share-item:hover{border-color:#10b981;transform:scale(1.03);background:#111827}
.share-item i{font-size:20px}
.share-item.wa i{color:#25D366}
.share-item.fb i{color:#1877F2}
.share-item.ig i{color:#E4405F}
.share-item.tt i{color:#000}
.share-item.tw i{color:#000}
.share-item.yt i{color:#FF0000}
.share-item.gd i{color:#4285F4}
.share-item.cp i{color:#10b981}
.share-privacy{margin-top:12px;padding-top:12px;border-top:1px solid #1e293b}
.privacy-pill{display:inline-block;padding:4px 14px;border-radius:20px;font-size:10px;font-weight:600;cursor:pointer;background:#1e293b;color:#94a3b8;border:none;margin-right:6px;transition:all .2s}
.privacy-pill.active{background:rgba(16,185,129,.15);color:#10b981;border:1px solid rgba(16,185,129,.3)}

/* SPARK */
.spark-card{background:#111827;border:1px solid #1e293b;border-radius:16px;overflow:hidden;margin-bottom:14px}
.spark-video-wrap{background:#000;display:flex;align-items:center;justify-content:center;position:relative;height:400px}
.spark-video-wrap video{width:100%;height:100%;object-fit:contain}
.spark-badge{position:absolute;top:8px;right:8px;color:#fff;font-size:8px;font-weight:700;padding:3px 10px;border-radius:12px}
.spark-badge.spark{background:#3b82f6}
.spark-badge.full{background:#ec4899}
.spark-body{padding:12px}
.spark-author{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.spark-author img{width:30px;height:30px;border-radius:50%;object-fit:cover}
.spark-author .sname{font-weight:700;font-size:12px;color:#fff}
.spark-author .shandle{font-size:10px;color:#64748b}
.spark-caption{font-size:12px;color:#e2e8f0;margin-bottom:6px}
.spark-tags{font-size:11px;margin-bottom:6px}
.spark-tags button{background:transparent;border:none;color:#10b981;cursor:pointer;font-weight:600;margin-right:4px;font-size:11px}
.spark-actions{display:flex;gap:14px;padding-top:8px;border-top:1px solid #1e293b;font-size:11px;color:#64748b}
.spark-actions button{background:transparent;border:none;color:#64748b;cursor:pointer;display:flex;align-items:center;gap:4px;font-size:11px}
.spark-actions button.liked{color:#10b981}

/* CIRCLE */
.circle-card{background:#111827;border:1px solid #1e293b;border-radius:16px;padding:14px;margin-bottom:10px;transition:border-color .2s}
.circle-card:hover{border-color:#334155}
.circle-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.circle-head-left{display:flex;align-items:center;gap:10px}
.circle-head-left img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:1px solid #1e293b}
.circle-name{font-weight:700;font-size:13px;color:#fff}
.circle-meta{font-size:10px;color:#64748b}
.circle-type-badge{font-size:9px;font-weight:600;padding:2px 8px;border-radius:12px}
.type-social{background:rgba(16,185,129,.15);color:#10b981}
.type-services{background:rgba(59,130,246,.15);color:#3b82f6}
.type-goods{background:rgba(139,92,246,.15);color:#8b5cf6}
.circle-desc{font-size:11px;color:#94a3b8;margin-bottom:8px}
.circle-join-btn{background:#10b981;border:none;color:#000;font-weight:700;padding:5px 14px;border-radius:8px;font-size:10px;cursor:pointer;white-space:nowrap}
.circle-joined{font-size:10px;color:#10b981;font-weight:600}
.shop-item{background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:8px 10px}
.shop-item .siname{font-weight:600;font-size:11px;color:#fff}
.shop-item .siprice{font-size:10px;color:#10b981;margin-top:2px}

/* PROFILE */
.profile-card{background:#111827;border:1px solid #1e293b;border-radius:16px;overflow:hidden}
.profile-cover{height:110px;background:#0f172a;overflow:hidden}
.profile-cover img{width:100%;height:100%;object-fit:cover}
.profile-body{padding:16px;margin-top:-34px;position:relative}
.profile-avatar{width:68px;height:68px;border-radius:50%;object-fit:cover;border:4px solid #111827}
.profile-name{font-weight:700;font-size:16px;color:#fff}
.profile-handle{font-size:11px;color:#64748b}
.profile-bio{font-size:12px;color:#94a3b8;margin-top:6px}
.profile-stats{display:flex;gap:16px;padding-top:10px;border-top:1px solid #1e293b;margin-top:10px;font-size:11px;color:#64748b}
.profile-stats strong{color:#fff}

.stat-card{background:#0f172a;border:1px solid #1e293b;border-radius:12px;padding:14px;text-align:center}
.stat-label{font-size:9px;color:#64748b;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.stat-value{font-weight:900;font-size:18px;margin-top:2px}

#toast-container{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:99999;width:90%;max-width:380px;pointer-events:none}
.toast{background:rgba(17,24,39,.95);border:1px solid rgba(16,185,129,.3);color:#f8fafc;padding:10px 14px;border-radius:12px;font-size:12px;margin-bottom:6px;backdrop-filter:blur(8px);display:flex;align-items:center;gap:8px;opacity:0;transform:translateY(10px);transition:all .3s ease;pointer-events:auto;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translateY(0)}
.toast i{color:#10b981;font-size:16px;flex-shrink:0}

.view-header{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.view-title{font-weight:900;font-size:16px;color:#fff}
.section-title{font-size:10px;color:#64748b;text-transform:uppercase;font-weight:700;letter-spacing:.05em;margin:8px 0 6px;padding-left:2px}
.empty-state{text-align:center;padding:40px 20px;color:#64748b}
.empty-state i{font-size:32px;display:block;margin-bottom:12px;color:#334155}
.empty-state p{font-size:12px}
.media-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}

@media(max-width:640px){
  .header-title{font-size:16px}
  .status-stage{min-height:280px;height:clamp(280px,52vh,460px)}
  .spark-video-wrap{height:340px}
  #app-container{padding:72px 12px 16px}
  .share-grid{grid-template-columns:repeat(4,1fr);gap:6px}
  .share-item{padding:8px 2px;font-size:8px}
  .share-item i{font-size:18px}
}
</style>
</head>
<body>

<header class="zynix-header">
  <button onclick="Z.showView('home')" style="display:flex;align-items:center;gap:8px;background:transparent;border:none;cursor:pointer;">
    <div class="header-logo">Z</div>
    <span class="header-title">ZYNIX</span>
  </button>
  <div style="display:flex;align-items:center;gap:10px;">
    <button class="header-btn" onclick="Z.toggleTheme()"><i class="fa-solid fa-moon" id="theme-icon"></i></button>
    <button class="header-btn" onclick="Z.showView('notifications')" style="position:relative;">
      <i class="fa-solid fa-bell"></i>
      <span id="notif-badge" style="position:absolute;top:-2px;right:-4px;background:#ef4444;color:#fff;font-size:8px;font-weight:700;width:14px;height:14px;border-radius:50%;display:none;align-items:center;justify-content:center;">0</span>
    </button>
    <button class="wallet-pill" onclick="Z.showView('wallet')" style="background:transparent;cursor:pointer;border:1px solid #1e293b;">
      <span style="display:flex;align-items:center;gap:4px;"><i class="fa-solid fa-wallet" style="color:#10b981;"></i><span id="header-cash" style="color:#10b981;font-weight:700;">$0.00</span></span>
      <span style="color:#334155;">|</span>
      <span style="display:flex;align-items:center;gap:4px;"><i class="fa-solid fa-gift" style="color:#3b82f6;"></i><span id="header-bounty" style="color:#3b82f6;font-weight:700;">$0.00</span></span>
    </button>
    <div id="header-auth-container"></div>
  </div>
</header>

<main id="app-container"></main>

<nav class="zynix-footer" id="bottom-nav">
  <button onclick="Z.showView('home')" id="nav-home" class="active"><i class="fa-solid fa-house"></i><span>Home</span></button>
  <button onclick="Z.showView('spark')" id="nav-spark"><i class="fa-solid fa-bolt"></i><span>Spark</span></button>
  <button onclick="Z.openCreateModal()" class="create-btn"><i class="fa-solid fa-plus"></i></button>
  <button onclick="Z.showView('circles')" id="nav-circles"><i class="fa-solid fa-circle-nodes"></i><span>Circles</span></button>
  <button onclick="Z.showView('people')" id="nav-people"><i class="fa-solid fa-users"></i><span>People</span></button>

// ============================================================
// INDEXEDDB MEDIA STORAGE (for Status, Posts, Sparks)
// ============================================================
var MEDIA_DB = 'zynix_media_v1';
var MEDIA_STORE = 'media';
var _dbPromise = null;

function openMediaDB(){
  if(_dbPromise) return _dbPromise;
  _dbPromise = new Promise(function(resolve, reject){
    if(!window.indexedDB){ reject(new Error('IndexedDB not available')); return; }
    var req = indexedDB.open(MEDIA_DB, 1);
    req.onupgradeneeded = function(e){
      var db = e.target.result;
      if(!db.objectStoreNames.contains(MEDIA_STORE)){
        db.createObjectStore(MEDIA_STORE, { keyPath: 'id' });
      }
    };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  });
  return _dbPromise;
}

Z.storeMedia = async function(file){
  try {
    var db = await openMediaDB();
    var id = 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
    return new Promise(function(resolve, reject){
      var tx = db.transaction(MEDIA_STORE, 'readwrite');
      tx.objectStore(MEDIA_STORE).put({ id: id, blob: file, type: file.type || '', name: file.name || '', timestamp: Date.now() });
      tx.oncomplete = function(){ resolve('idb:' + id); };
      tx.onerror = function(){ reject(tx.error); };
    });
  } catch(e){
    // Fallback to DataURL if IndexedDB fails
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(String(reader.result || '')); };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }
};

Z.loadMedia = async function(ref){
  if(!ref) return '';
  ref = String(ref);
  if(ref.indexOf('idb:') !== 0) return ref; // Already a URL or data URL
  var id = ref.slice(4);
  try {
    var db = await openMediaDB();
    return new Promise(function(resolve){
      var tx = db.transaction(MEDIA_STORE, 'readonly');
      var req = tx.objectStore(MEDIA_STORE).get(id);
      req.onsuccess = function(){
        var item = req.result;
        if(!item || !item.blob){ resolve(''); return; }
        resolve(URL.createObjectURL(item.blob));
      };
      req.onerror = function(){ resolve(''); };
    });
  } catch(e){ return ''; }
};

// Load media into an <img> or <video> by reference
Z.loadMediaInto = async function(el, ref, type){
  if(!el) return;
  var url = await Z.loadMedia(ref);
  if(!url){ el.innerHTML = '<div style="color:#64748b;font-size:12px;padding:20px;text-align:center;">Media unavailable</div>'; return; }
  if(type === 'video'){
    el.innerHTML = '<video src="' + Z.escape(url) + '" controls autoplay playsinline style="width:100%;height:100%;object-fit:contain;background:#000;"></video>';
    var v = el.querySelector('video');
    if(v){
      v.addEventListener('loadedmetadata', function(){
        // Video plays with its own duration
      });
    }
  } else {
    el.innerHTML = '<img src="' + Z.escape(url) + '" style="width:100%;height:100%;object-fit:contain;background:#000;" alt="Status">';
  }
};

// ============================================================
Z.RewardEngine = {
  split: function(a){ return { cash: Number((a*0.60).toFixed(4)), bounty: Number((a*0.40).toFixed(4)) }; },
  checkDaily: function(user){
    var today = new Date().toISOString().split('T')[0];
    if(!user.dailyTracker || user.dailyTracker.date !== today){
      user.dailyTracker = { date:today, count:0 };
    }
    var pkg = Z.Packages[user.package||'Free'] || Z.Packages['Free'];
    return { allowed: user.dailyTracker.count < pkg.dailyLimit, current: user.dailyTracker.count, limit: pkg.dailyLimit };
  },
  credit: function(user, amount, reason){
    if(!user) return false;
    var s = this.split(amount);
    if(!user.wallet) user.wallet = {cash:0,bounty:0,total:0};
    if(!user.walletTx) user.walletTx = [];
    user.wallet.cash += s.cash;
    user.wallet.bounty += s.bounty;
    user.wallet.total += amount;
    user.walletTx.unshift({
      id:'tx_'+Date.now(), date:new Date().toISOString(),
      type:reason, amount:amount, cash:s.cash, bounty:s.bounty, status:'Completed'
    });
    Z.DB.saveUsers();
    Z.updateHeader();
    Z.animateReward(amount);
    Z.toast('+$'+amount.toFixed(2)+' ($'+s.cash.toFixed(3)+' Cash, $'+s.bounty.toFixed(3)+' Bounty)');
    return true;
  },
  process: function(ownerId, type, targetId, reactionType){
    if(!Z.State.currentUser){ Z.openAuthModal('login'); Z.toast('Login required.'); return false; }
    var actor = Z.DB.getUserById(Z.State.currentUser.id);
    var pkg = Z.Packages[actor.package||'Free'] || Z.Packages['Free'];
    if(!pkg.canEarn){ Z.toast('Free users cannot earn rewards. Upgrade!'); return false; }
    var limit = this.checkDaily(actor);
    if(!limit.allowed){ Z.toast('Daily limit reached.'); return false; }
    var owner = Z.DB.getUserById(ownerId);
    if(!owner || owner.id === actor.id){ Z.toast('Invalid action.'); return false; }
    if(!actor.history) actor.history = {};
    var key = type+'_'+(targetId||ownerId)+'_'+(reactionType||'');
    if(actor.history[key]){ Z.toast('Already rewarded.'); return false; }

    var amount = 0.01;
    if(reactionType && Z.Reactions[reactionType]) amount = Z.Reactions[reactionType].reward;
    else { var settings = owner.bountySettings || {}; amount = settings[type] || 0.01; }
    amount = Math.min(0.05, Math.max(0, amount));

    if(!owner.wallet) owner.wallet = {cash:0,bounty:0,total:0};
    if(owner.wallet.bounty < amount){ Z.toast('Creator bounty insufficient.'); return false; }
    owner.wallet.bounty -= amount;
    if(!owner.bountySpent) owner.bountySpent = [];
    owner.bountySpent.unshift({
      id:'bs_'+Date.now(), date:new Date().toISOString(),
      recipient:actor.name, action:type+(reactionType?' ('+reactionType+')':''), amount:amount
    });

    if(type === 'reaction' || type === 'like'){
      var post = Z.DB.getPosts().find(function(p){ return p.id === targetId; });
      if(post){
        if(!post.reactions) post.reactions = {};
        post.reactions[reactionType||'like'] = (post.reactions[reactionType||'like']||0) + 1;
        if(!post._reactionUsers) post._reactionUsers = {};
        post._reactionUsers[actor.id] = reactionType||'like';
        Z.DB.savePosts();
      }
    } else if(type === 'share'){
      var p2 = Z.DB.getPosts().find(function(p){ return p.id === targetId; });
      if(p2){ p2.shares = (p2.shares||0) + 1; Z.DB.savePosts(); }
    } else if(type === 'spark_like'){
      var spark = Z.DB.getSparks().find(function(s){ return s.id === targetId; });
      if(spark){ spark.likes = (spark.likes||0) + 1; Z.DB.saveSparks(); }
    } else if(type === 'connect'){
      owner.connections = (owner.connections||0) + 1;
      if(!actor.connected) actor.connected = [];
      if(actor.connected.indexOf(owner.id) === -1) actor.connected.push(owner.id);
      Z.addNotification(ownerId, 'connect', actor.name+' connected with you', {from:actor.id});
    } else if(type === 'circleJoin'){
      var circles = Z.DB.getCircles();
      var circle = circles.find(function(c){ return c.id === targetId; });
      if(circle){ circle.members = (circle.members||0) + 1; Z.DB.saveCircles(circles); }
    } else if(type === 'comment'){
      Z.addNotification(ownerId, 'comment', actor.name+' commented on your post', {from:actor.id, postId:targetId});
    }

    actor.history[key] = new Date().toISOString();
    actor.dailyTracker.count++;
    Z.DB.saveUsers();
    this.credit(actor, amount, (type+(reactionType?' '+reactionType:'')).toUpperCase());
    if(['home','spark','people','circles'].indexOf(Z.State.currentView) !== -1){
      Z.showView(Z.State.currentView);
    }
    return true;
  }
};

};

Z.handleAuth = function(mode){
  var email = document.getElementById('auth-email').value.trim();
  var pass = document.getElementById('auth-password').value.trim();
  if(!email || !pass){ Z.toast('Fill all fields.'); return; }
  var users = Z.DB.getUsers();

  if(mode === 'login'){
    var found = null;
    for(var i=0;i<users.length;i++){
      if((users[i].email.toLowerCase() === email.toLowerCase() || users[i].username === email) && users[i].password === pass){
        found = users[i]; break;
      }
    }
    if(found){ Z.DB.setCurrentUser(found); Z.closeModal(); Z.toast('Welcome back!'); Z.showView('profile'); }
    else Z.toast('Invalid credentials.');
  } else {
    for(var j=0;j<users.length;j++){
      if(users[j].email.toLowerCase() === email.toLowerCase()){ Z.toast('Email exists.'); return; }
    }
    var name = document.getElementById('auth-name').value.trim() || 'New Creator';
    var ref = document.getElementById('auth-refcode') ? document.getElementById('auth-refcode').value.trim() : '';
    var refId = null;
    for(var k=0;k<users.length;k++){
      if(users[k].referrals && users[k].referrals.code.toUpperCase() === ref.toUpperCase()){ refId = users[k].id; break; }
    }
    var newUser = {
      id:'usr_'+Date.now(), name:name, username:email.split('@')[0],
      profession:'Creator', bio:'Joined ZYNIX.', role:'Viewer',
      avatar:'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80',
      cover:'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=800&q=80',
      connections:0, connected:[], package:'Free',
      bountySettings:{connect:0.03,subscribe:0.05,comment:0.03,share:0.04,circleJoin:0.02},
      wallet:{cash:0,bounty:0,total:0}, walletTx:[], bountySpent:[], saved:[],
      referrals:{code:'ZYNIX-'+Math.random().toString(36).substring(2,8).toUpperCase(),earnings:0,referredBy:refId},
      email:email, password:pass, history:{},
      dailyTracker:{date:new Date().toISOString().split('T')[0],count:0},
      joinedCircles:[], createdCircles:[]
    };
    users.push(newUser);
    Z.DB.saveUsers(users);
    Z.DB.setCurrentUser(newUser);
    Z.closeModal();
    Z.toast('Account created!');
    Z.showView('profile');
  }
};

Z.submitSpark = async function(){

  var tagsRaw = document.getElementById('spark-tags').value.trim();
  var fileInput = document.getElementById('spark-file');
  var url = document.getElementById('spark-url').value.trim();
  if(!caption){ Z.toast('Please write a caption.'); return; }
  var tags = tagsRaw ? tagsRaw.split(',').map(function(t){ return t.trim().replace(/^#/,''); }) : ['zynix'];

  var videoRef = '';
  if(fileInput && fileInput.files && fileInput.files[0]){
    var f = fileInput.files[0];
    if(f.size > 100*1024*1024){ Z.toast('Video under 100 MB.'); return; }
    Z.toast('Uploading video...');
    try { videoRef = await Z.storeMedia(f); }
    catch(e){ Z.toast('Upload failed.'); return; }
  } else if(url){
    videoRef = url;
  } else {
    videoRef = 'https://assets.mixkit.co/videos/preview/mixkit-digital-animation-of-screens-and-code-31910-large.mp4';
  }

  var sparks = Z.DB.getSparks();
  sparks.unshift({
    id:'spark_'+Date.now(), authorId:Z.State.currentUser.id,
    caption:caption, videoUrl:videoRef, likes:0, tags:tags,
    comments:[], shares:0, type:'spark', _likedBy:[]
  });
  Z.DB.saveSparks(sparks);
  Z.closeModal();
  Z.toast('Spark published!');
  Z.showView('spark');
};

// ============================================================
// STATUS SYSTEM - WhatsApp Style
// ============================================================
function _getUsers(){ try{ return Z.DB.getUsers(); }catch(e){ return []; } }
function _getStatuses(){ try{ return Z.DB.getStatuses(); }catch(e){ return []; } }
function _saveStatuses(a){ try{ Z.DB.saveStatuses(a); }catch(e){} }
function _userById(id){ var u = _getUsers(); for(var i=0;i<u.length;i++) if(String(u[i].id)===String(id)) return u[i]; return null; }
function _userName(u){ return u ? (u.name || u.username || 'User') : 'User'; }
function _userAvatar(u){ return u && u.avatar ? u.avatar : 'https://ui-avatars.com/api/?name='+encodeURIComponent(_userName(u))+'&background=111827&color=34d399'; }
function _currentUser(){ return Z.State.currentUser || Z.DB.getCurrentUser() || null; }

function _liveStatuses(){
  var now = Date.now();
  var all = _getStatuses();
  var result = [];
  for(var i=0;i<all.length;i++){
    var s = all[i];
    if(!s) continue;
    var expires = Number(s.expiresAt || 0);
    if(expires && expires <= now) continue;
    var created = Number(s.timestamp || 0);
    if(created && now - created > 24*60*60*1000) continue;
    result.push(s);
  }
  result.sort(function(a,b){ return Number(b.timestamp||0) - Number(a.timestamp||0); });
  return result;
}

Z.getStatusContacts = function(){
  var me = _currentUser();
  var users = _getUsers();
  if(!me) return [];
  var ids = Array.isArray(me.connected) ? me.connected.map(String) : [];
  if(!ids.length){
    var r = [];
    for(var j=0;j<users.length;j++) if(String(users[j].id) !== String(me.id)) r.push(users[j]);
    return r;
  }
  var f = [];
  for(var k=0;k<users.length;k++){
    if(ids.indexOf(String(users[k].id)) !== -1 && String(users[k].id) !== String(me.id)) f.push(users[k]);
  }
  return f;
};

Z.getActiveStatuses = function(){
  var all = _liveStatuses();
  var contacts = Z.getStatusContacts();
  var me = _currentUser();
  var allowed = {};
  for(var i=0;i<contacts.length;i++) allowed[String(contacts[i].id)] = true;
  if(me) allowed[String(me.id)] = true;
  var r = [];
  for(var j=0;j<all.length;j++){
    if(allowed[String(all[j].authorId)]) r.push(all[j]);
  }
  return r;
};

Z.previewStatusFile = function(input){

Z.submitStatus = async function(){
  var textEl = document.getElementById('status-text');
  var text = textEl ? textEl.value.trim() : '';
  var fileInput = document.getElementById('status-file');
  var me = _currentUser();
  if(!me) return;

  var hasFile = fileInput && fileInput.files && fileInput.files[0];
  if(!text && !hasFile){ Z.toast('Add text or media.'); return; }

  var mediaRef = '';
  var mediaType = '';
  if(hasFile){
    var f = fileInput.files[0];
    Z.toast('Uploading...');
    try {
      mediaRef = await Z.storeMedia(f);
      mediaType = f.type.indexOf('video/') === 0 ? 'video' : 'image';
    } catch(e){
      Z.toast('Could not upload media.');
      return;
    }
  }

  var now = Date.now();
  var current = _liveStatuses();
  current.unshift({
    id:'st_'+now+'_'+Math.random().toString(36).slice(2),
    type:'status', authorId:me.id,
    content:text || '', media:mediaRef || '', mediaType:mediaType || '',
    timestamp:now, expiresAt: now + 24*60*60*1000, viewedBy:[]
  });
  _saveStatuses(current);
  Z.closeModal();
  Z.toast('Status published for 24 hours.');
  Z.showView('home');
};

// HOME STATUS ROW
// ============================================================
Z.renderStatusRow = function(){
  var existing = document.getElementById('status-row');
  if(existing) existing.remove();
  var home = document.getElementById('app-container');
  if(!home) return;
  var me = _currentUser();
  if(!me) return;

  var all = Z.getActiveStatuses();
  var grouped = {};
  for(var i=0;i<all.length;i++){
    var id = String(all[i].authorId);
    if(!grouped[id]) grouped[id] = [];
    grouped[id].push(all[i]);
  }
  var keys = Object.keys(grouped);
  var entries = [];
  for(var j=0;j<keys.length;j++){
    var arr = grouped[keys[j]];
    arr.sort(function(a,b){ return Number(b.timestamp||0) - Number(a.timestamp||0); });
    var user = _userById(keys[j]);
    if(user) entries.push({ user:user, statuses:arr });
  }
  entries.sort(function(a,b){ return Number(b.statuses[0]?.timestamp||0) - Number(a.statuses[0]?.timestamp||0); });

  var html = '<div id="status-row" class="status-row-wrap"><div class="status-scroll">';
  html += '<button onclick="Z.openCreateStatusModal()" class="status-item">' +
    '<div style="width:58px;height:58px;border-radius:50%;background:#0f172a;border:2px dashed #10b981;display:flex;align-items:center;justify-content:center;margin:0 auto;">' +
    '<i class="fa-solid fa-plus" style="color:#10b981;font-size:18px;"></i></div>' +
    '<span class="status-label" style="font-weight:700;color:#cbd5e1;">Add Status</span></button>';

  for(var k=0;k<entries.length;k++){
    var entry = entries[k];
    var u = entry.user;
    var hasViewed = entry.statuses.some(function(s){ return s.viewedBy && s.viewedBy.indexOf(me.id) !== -1; });
    var ringClass = hasViewed ? 'status-ring-seen' : 'status-ring-unseen';
    html += '<button onclick="Z.openStatusViewer(\'' + Z.escape(u.id) + '\',0)" class="status-item">' +
      '<div class="' + ringClass + '">' +
      '<div class="status-ring-inner"><img src="' + Z.escape(_userAvatar(u)) + '"></div>' +
      '</div>' +
      '<span class="status-label">' + Z.escape(_userName(u)) + '</span></button>';
  }

  html += '</div></div>';
  var first = home.querySelector('div');
  if(first) first.insertAdjacentHTML('afterbegin', html);
  else home.insertAdjacentHTML('afterbegin', html);
};

Z.openStatusViewer = function(authorId, index){
  var existing = document.getElementById('status-viewer');
  if(existing) existing.remove();

  var all = Z.getActiveStatuses();
  Z.State.viewerStatuses = all.filter(function(s){ return String(s.authorId) === String(authorId); });
  Z.State.viewerStatuses.sort(function(a,b){ return Number(b.timestamp||0) - Number(a.timestamp||0); });
  if(!Z.State.viewerStatuses.length){ Z.toast('No statuses.'); return; }

  var me = _currentUser();
  if(me){
    for(var i=0;i<Z.State.viewerStatuses.length;i++){
      if(!Z.State.viewerStatuses[i].viewedBy) Z.State.viewerStatuses[i].viewedBy = [];
      if(Z.State.viewerStatuses[i].viewedBy.indexOf(me.id) === -1){
        Z.State.viewerStatuses[i].viewedBy.push(me.id);
      }
    }
    _saveStatuses(_getStatuses());
  }
  Z.State.viewerAuthorId = String(authorId);
  Z.State.viewerIndex = Math.max(0, Math.min(Number(index||0), Z.State.viewerStatuses.length-1));
  Z.showStatusViewer();
};

Z.showStatusViewer = function(){
  var old = document.getElementById('status-viewer');
  if(old) old.remove();

  var status = Z.State.viewerStatuses[Z.State.viewerIndex];
  if(!status){ Z.showView('home'); return; }
  var author = _userById(status.authorId);
  if(!author){ Z.showView('home'); return; }

  var isVideo = status.mediaType === 'video';
  var stageContent = '';
  if(status.media){
    if(isVideo){
      stageContent = '<div id="viewer-media-loading" style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:#000;color:#64748b;font-size:12px;">Loading video...</div>';
    } else {
      stageContent = '<div id="viewer-media-loading" style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:#000;color:#64748b;font-size:12px;">Loading image...</div>';
    }
  } else {
    stageContent = '<div class="text-status">' + Z.escape(status.content || '') + '</div>';
  }

  var total = Z.State.viewerStatuses.length;
  var current = Z.State.viewerIndex + 1;

  var html = '<div class="status-viewer-overlay" id="status-viewer">' +
    '<div class="status-viewer-header">' +
    '<button class="circle-x-btn" onclick="Z.closeStatusViewer()"><i class="fa-solid fa-xmark"></i></button>' +
    '<div style="display:flex;align-items:center;gap:8px;">' +
    '<img src="' + Z.escape(_userAvatar(author)) + '" style="width:34px;height:34px;border-radius:50%;object-fit:cover;">' +
    '<div><div style="font-weight:700;font-size:13px;">' + Z.escape(_userName(author)) + '</div>' +
    '<div style="font-size:10px;color:#94a3b8;">' + current + ' / ' + total + '</div></div>' +
    '</div>' +
    '<div style="width:38px;"></div>' +
    '</div>' +
    '<div class="status-viewer-body" id="status-viewer-body">' +
    '<div class="status-stage" id="status-stage">' + stageContent + '</div>' +
    '<button onclick="Z.statusPrev()" class="status-nav-btn left"><i class="fa-solid fa-chevron-left"></i></button>' +
    '<button onclick="Z.statusNext()" class="status-nav-btn right"><i class="fa-solid fa-chevron-right"></i></button>' +
    '</div>' +
    '<div class="status-viewer-footer">' +
    '<button onclick="Z.statusPrev()">‹ Prev</button>' +
    '<span style="font-size:10px;color:#64748b;">24h Status</span>' +
    '<button onclick="Z.statusNext()">Next ›</button>' +
    '</div>' +
    '</div>';

  document.body.insertAdjacentHTML('beforeend', html);

  // Load media async
  if(status.media){
    var stage = document.getElementById('status-stage');
    if(stage){
      Z.loadMediaInto(stage, status.media, status.mediaType).then(function(){
        if(isVideo){
          var v = stage.querySelector('video');
          if(v){
            // Pause timer for video
            Z.clearStatusTimer();
            v.addEventListener('ended', function(){ Z.statusNext(); });
          }
        }
      });
    }
  }

  // Timer for text/image only
  if(!isVideo) Z.startStatusTimer();

  // Setup gestures
  Z.setupViewerGesture();
};

Z.startStatusTimer = function(){
  Z.clearStatusTimer();
  Z.State.viewerPaused = false;
  Z.State.viewerTimer = setTimeout(function(){ Z.statusNext(); }, 7000);
};

Z.clearStatusTimer = function(){
  if(Z.State.viewerTimer){ clearTimeout(Z.State.viewerTimer); Z.State.viewerTimer = null; }
};

// ============================================================
// VIEWER GESTURES - FIXED SWIPE WITH FINGER
// ============================================================
Z.setupViewerGesture = function(){
  var body = document.getElementById('status-viewer-body');
  if(!body) return;

  var startX = 0, startY = 0, startTime = 0;
  var moved = false;
  var SWIPE_THRESHOLD = 50;
  var TAP_MOVE_THRESHOLD = 12;
  var TAP_TIME_THRESHOLD = 400;

  var onStart = function(x, y){
    startX = x;
    startY = y;
    startTime = Date.now();
    moved = false;
    // Pause timer on press
    Z.clearStatusTimer();
    Z.State.viewerPaused = true;
  };

  var onMove = function(x, y){
    var dx = Math.abs(x - startX);
    var dy = Math.abs(y - startY);
    if(dx > TAP_MOVE_THRESHOLD || dy > TAP_MOVE_THRESHOLD) moved = true;
  };

  var onEnd = function(x, y){
    var dx = x - startX;
    var dy = y - startY;
    var elapsed = Date.now() - startTime;
    var absDx = Math.abs(dx);
    var absDy = Math.abs(dy);

    // Horizontal swipe (finger)
    if(absDx > SWIPE_THRESHOLD && absDx > absDy * 1.2){
      if(dx > 0) Z.advanceToNextContact(); // Swipe right → next person
      else Z.advanceToPrevContact();       // Swipe left → previous person
      return;
    }

    // Tap (light touch, quick, no movement)
    if(!moved && elapsed < TAP_TIME_THRESHOLD){
      Z.statusNext(); // Tap → next status of same person
      return;
    }

    // Otherwise (long press or vertical scroll) - resume timer
    Z.State.viewerPaused = false;
    var status = Z.State.viewerStatuses[Z.State.viewerIndex];
    if(status && status.mediaType !== 'video'){
      Z.startStatusTimer();
    }
  };

  // Touch events (mobile - finger)
  body.addEventListener('touchstart', function(e){
    if(e.touches.length !== 1) return;
    onStart(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  body.addEventListener('touchmove', function(e){
    if(e.touches.length !== 1) return;
    onMove(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });

  body.addEventListener('touchend', function(e){
    if(!e.changedTouches.length) return;
    onEnd(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
  }, { passive: true });

  // Mouse events (desktop)
  var mouseDown = false;
  body.addEventListener('mousedown', function(e){
    if(e.target.closest('button') || e.target.closest('video')) return;
    mouseDown = true;
    onStart(e.clientX, e.clientY);
  });
  body.addEventListener('mousemove', function(e){
    if(!mouseDown) return;
    onMove(e.clientX, e.clientY);
  });
  body.addEventListener('mouseup', function(e){
    if(!mouseDown) return;
    mouseDown = false;
    onEnd(e.clientX, e.clientY);
  });
  body.addEventListener('mouseleave', function(){
    if(mouseDown){
      mouseDown = false;
      Z.State.viewerPaused = false;
      var status = Z.State.viewerStatuses[Z.State.viewerIndex];
      if(status && status.mediaType !== 'video') Z.startStatusTimer();
    }
  });
};

Z.advanceToNextContact = function(){
  var all = Z.getActiveStatuses();
  var map = {};
  for(var i=0;i<all.length;i++){
    var id = String(all[i].authorId);
    if(!map[id]) map[id] = [];
    map[id].push(all[i]);
  }
  var keys = Object.keys(map);
  if(keys.length <= 1){ Z.closeStatusViewer(); return; }
  var idx = keys.indexOf(String(Z.State.viewerAuthorId));
  var next = (idx + 1) % keys.length;
  Z.openStatusViewer(keys[next], 0);
};

Z.advanceToPrevContact = function(){
  var all = Z.getActiveStatuses();
  var map = {};
  for(var i=0;i<all.length;i++){
    var id = String(all[i].authorId);
    if(!map[id]) map[id] = [];
    map[id].push(all[i]);
  }
  var keys = Object.keys(map);
  if(keys.length <= 1){ Z.closeStatusViewer(); return; }
  var idx = keys.indexOf(String(Z.State.viewerAuthorId));
  var prev = (idx - 1 + keys.length) % keys.length;
  Z.openStatusViewer(keys[prev], 0);
};

Z.statusPrev = function(){
  Z.clearStatusTimer();
  if(Z.State.viewerIndex > 0){
    Z.State.viewerIndex--;
    Z.showStatusViewer();
  } else {
    Z.advanceToPrevContact();
  }
};

Z.statusNext = function(){
  Z.clearStatusTimer();
  if(Z.State.viewerIndex < Z.State.viewerStatuses.length - 1){
    Z.State.viewerIndex++;
    Z.showStatusViewer();
  } else {
    Z.advanceToNextContact();
  }
};

Z.closeStatusViewer = function(){
  Z.clearStatusTimer();
  Z.State.viewerPaused = false;
  // Stop any playing video
  var viewer = document.getElementById('status-viewer');
  if(viewer){
    var vids = viewer.querySelectorAll('video');
    for(var i=0;i<vids.length;i++){
      try { vids[i].pause(); vids[i].src = ''; } catch(e){}
    }
    viewer.remove();
  }
  Z.showView('home');
};

function _getAuthor(id){
  var u = _getUsers();
  for(var i=0;i<u.length;i++) if(u[i].id === id) return u[i];
  return { id:'unknown', name:'User', username:'user', role:'Creator', avatar:'', bountySettings:{} };
}

function _mediaHtml(media){
  if(!media) return '';
  var m = String(media);
  // Data URL image
  if(m.indexOf('data:image/') === 0){
    return '<div class="post-media"><img src="' + Z.escape(m) + '" alt="Post"></div>';
  }
  if(m.indexOf('data:video/') === 0){
    return '<div class="post-media"><video src="' + Z.escape(m) + '" controls playsinline></video></div>';
  }
  // IndexedDB ref
  if(m.indexOf('idb:') === 0){
    return '<div class="post-media" data-idb-ref="' + Z.escape(m) + '"><div style="padding:20px;text-align:center;color:#64748b;font-size:12px;">Loading...</div></div>';
  }
  // URL
  if(/\.(mp4|webm|ogg)(\?|$)/i.test(m)){
    return '<div class="post-media"><video src="' + Z.escape(m) + '" controls playsinline></video></div>';
  }
  if(/\.(png|jpe?g|gif|webp|avif)(\?|$)/i.test(m)){
    return '<div class="post-media"><img src="' + Z.escape(m) + '" alt="Post"></div>';
  }
  return '<a href="' + Z.escape(m) + '" target="_blank" style="display:block;background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:8px 12px;font-size:11px;color:#10b981;text-decoration:none;margin-bottom:10px;word-break:break-all;">Open link</a>';
}

// After render, resolve IndexedDB refs
Z.resolveMediaRefs = async function(){
  var els = document.querySelectorAll('[data-idb-ref]');
  for(var i=0;i<els.length;i++){
    var el = els[i];
    var ref = el.getAttribute('data-idb-ref');
    var url = await Z.loadMedia(ref);
    if(url){
      var isVideo = false;
      try { isVideo = await new Promise(function(resolve){
        var db = null;
        // Quick type check: fetch headers via blob
        fetch(url).then(function(r){ resolve(r.headers.get('content-type') || ''); }).catch(function(){ resolve(''); });
      }); } catch(e){}
      if(String(isVideo).indexOf('video') !== -1){
        el.innerHTML = '<video src="' + Z.escape(url) + '" controls playsinline style="width:100%;max-height:400px;object-fit:cover;"></video>';
      } else {
        el.innerHTML = '<img src="' + Z.escape(url) + '" style="width:100%;max-height:400px;object-fit:cover;" alt="Post">';
      }
    }
  }
};

function _hasReacted(p, u, r){
  return !!(p && u && p._reactionUsers && p._reactionUsers[u.id] === r);
}

function _timeAgo(ts){
  var diff = Date.now() - (ts||0);
  var min = Math.floor(diff/60000);
  if(min < 1) return 'just now';
  if(min < 60) return min + 'm ago';
  var hr = Math.floor(min/60);
  if(hr < 24) return hr + 'h ago';
  var day = Math.floor(hr/24);
  return day + 'd ago';
}

// ============================================================
Z.reactToPost = function(postId, reactionType){
  var actor = _currentUser();
  if(!actor){ Z.openAuthModal('login'); return; }
  var ps = Z.DB.getPosts();
  var p = null;
  for(var i=0;i<ps.length;i++) if(ps[i] && ps[i].id === postId){ p = ps[i]; break; }
  if(!p) return;

  p.reactions = p.reactions || {};
  p._reactionUsers = p._reactionUsers || {};

  var old = p._reactionUsers[actor.id];
  if(old && p.reactions[old]){
    p.reactions[old] = Math.max(0, Number(p.reactions[old]||0) - 1);
    delete p._reactionUsers[actor.id];
  }

  if(reactionType !== 'dislike'){
    p.reactions[reactionType] = Number(p.reactions[reactionType]||0) + 1;
    p._reactionUsers[actor.id] = reactionType;
  }
  Z.DB.savePosts(ps);

  var reward = Z.Reactions[reactionType];
  if(reward && reward.reward > 0){
    Z.RewardEngine.process(p.authorId, 'reaction', p.id, reactionType);
  } else {
    Z.toast('Reaction added!');
    Z.showView('home');
  }
};

Z.shareTo = function(platform, url, postId){

  switch(platform){
    case 'whatsapp':
      window.open('https://wa.me/?text=' + encodeURIComponent(text + ' ' + url), '_blank');

      break;

      break;
    case 'google':

      window.open('https://drive.google.com/', '_blank');
      break;
    case 'instagram':
      navigator.clipboard.writeText(url);

      break;

Z.expandComposer = function(){

  if(container.innerHTML) return;

    '<textarea id="composer-text" class="form-textarea" placeholder="What\'s on your mind?"></textarea>' +
    '<div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center;">' +
    '<button onclick="document.getElementById(\'composer-file\').click()" style="background:#1e293b;border:none;color:#94a3b8;padding:6px 12px;border-radius:8px;font-size:11px;cursor:pointer;"><i class="fa-solid fa-image"></i> Media</button>' +
    '<input type="file" id="composer-file" accept="image/*,video/*" style="display:none;" onchange="Z.previewComposerFile(this)">' +
    '</div>' +
    '<div id="composer-preview" class="media-preview-box"></div>' +
    '<div style="display:flex;gap:8px;margin-top:10px;">' +
    '<button onclick="Z.submitComposer()" style="background:#10b981;border:none;color:#000;font-weight:700;padding:8px 20px;border-radius:8px;font-size:12px;cursor:pointer;">Publish</button>' +
    '<button onclick="Z.cancelComposer()" style="background:transparent;border:none;color:#64748b;padding:8px 12px;border-radius:8px;font-size:12px;cursor:pointer;">Cancel</button>' +
    '</div></div>';
  setTimeout(function(){ var el = document.getElementById('composer-text'); if(el) el.focus(); }, 50);
};

Z.previewComposerFile = function(input){
  var f = input && input.files && input.files[0];
  if(!f) return;
  if(f.size > 20*1024*1024){ Z.toast('Media under 20 MB.'); input.value = ''; return; }
  var box = document.getElementById('composer-preview');
  if(!box) return;
  var url = URL.createObjectURL(f);
  if(f.type.indexOf('video/') === 0){
    box.innerHTML = '<video src="' + url + '" controls muted style="width:100%;max-height:220px;object-fit:contain;background:#000;"></video>' +
      '<button class="media-preview-remove" onclick="Z.removeComposerFile()"><i class="fa-solid fa-xmark"></i></button>';
  } else {
    box.innerHTML = '<img src="' + url + '" style="width:100%;max-height:220px;object-fit:contain;background:#000;">' +
      '<button class="media-preview-remove" onclick="Z.removeComposerFile()"><i class="fa-solid fa-xmark"></i></button>';
  }
  box.classList.add('show');
};

Z.removeComposerFile = function(){
  var f = document.getElementById('composer-file');
  if(f) f.value = '';
  var p = document.getElementById('composer-preview');
  if(p){ p.innerHTML = ''; p.classList.remove('show'); }
};

Z.submitComposer = async function(){
  var u = _currentUser();
  if(!u){ Z.openAuthModal('login'); return; }
  var text = document.getElementById('composer-text').value.trim();
  var fileInput = document.getElementById('composer-file');
  var hasFile = fileInput && fileInput.files && fileInput.files[0];
  if(!text && !hasFile){ Z.toast('Write something or attach media.'); return; }

  var mediaRef = '';
  if(hasFile){
    Z.toast('Uploading...');
    try { mediaRef = await Z.storeMedia(fileInput.files[0]); }
    catch(e){ Z.toast('Upload failed.'); return; }
  }

  var ps = Z.DB.getPosts();
  ps.unshift({
    id:'post_'+Date.now(), authorId:u.id,
    content: text || '', media: mediaRef || '',
    createdAt: Date.now(), reactions:{}, _reactionUsers:{},
    comments: [], shares: 0
  });
  Z.DB.savePosts(ps);
  Z.cancelComposer();
  Z.toast('Post published!');
  Z.showView('home');
};

Z.cancelComposer = function(){
  var c = document.getElementById('composer-expanded');
  if(c) c.innerHTML = '';
  var i = document.getElementById('composer-input');
  if(i) i.value = '';
};

// ============================================================
Z.renderSpark = function(){
  var sparks = Z.DB.getSparks();
  var filter = (Z.State.sparkFilter || '').toLowerCase();
  var filtered = [];
  for(var i=0;i<sparks.length;i++){
    var s = sparks[i];
    if(!filter){ filtered.push(s); continue; }
    var match = false;
    if(s.tags){
      for(var t=0;t<s.tags.length;t++){
        if(s.tags[t].toLowerCase().indexOf(filter) !== -1){ match = true; break; }
      }
    }
    if(match) filtered.push(s);
  }

  var html = '<div style="display:flex;flex-direction:column;gap:14px;">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;"><h2 class="view-title"><i class="fa-solid fa-bolt" style="color:#10b981;margin-right:8px;"></i>ZYNIX Spark</h2>' +
    '<button onclick="Z.openCreateModal()" style="background:#10b981;border:none;color:#000;font-weight:700;padding:6px 14px;border-radius:8px;font-size:11px;cursor:pointer;">Create</button></div>';

  if(filter){
    html += '<div style="display:flex;justify-content:space-between;align-items:center;background:#0f172a;border:1px solid #1e293b;padding:8px 12px;border-radius:8px;font-size:11px;">' +
      '<span style="color:#94a3b8;">Filter: <strong style="color:#10b981;">#' + Z.escape(filter) + '</strong></span>' +
      '<button onclick="Z.State.sparkFilter=\'\';Z.showView(\'spark\');" style="background:transparent;border:none;color:#ef4444;cursor:pointer;font-size:11px;">Clear</button></div>';
  }

  for(var j=0;j<filtered.length;j++){
    var spark = filtered[j];
    var a = _getAuthor(spark.authorId);
    var isFull = spark.type === 'fullvideo';
    var isLiked = spark._likedBy && Z.State.currentUser && spark._likedBy.indexOf(Z.State.currentUser.id) !== -1;

    var tagsHtml = '';
    if(spark.tags && spark.tags.length){
      for(var k=0;k<spark.tags.length;k++){
        tagsHtml += '<button onclick="Z.State.sparkFilter=\'' + Z.escape(spark.tags[k]) + '\';Z.showView(\'spark\');">#' + Z.escape(spark.tags[k]) + '</button>';
      }
    }

    // Handle media - can be URL, data URL, or IndexedDB ref
    var videoEl = '';
    if(spark.videoUrl && String(spark.videoUrl).indexOf('idb:') === 0){
      videoEl = '<div data-idb-ref="' + Z.escape(spark.videoUrl) + '" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#64748b;font-size:12px;">Loading video...</div>';
    } else {
      videoEl = '<video src="' + Z.escape(spark.videoUrl) + '" controls playsinline preload="metadata" style="width:100%;height:100%;object-fit:contain;"></video>';
    }

    html += '<div class="spark-card">' +
      '<div class="spark-video-wrap">' + videoEl +
      '<span class="spark-badge ' + (isFull?'full':'spark') + '">' + (isFull?'Full Video':'Spark') + '</span>' +
      '</div>' +
      '<div class="spark-body">' +
      (isFull && spark.title ? '<div style="font-weight:700;font-size:14px;color:#fff;margin-bottom:4px;">' + Z.escape(spark.title) + '</div>' : '') +
      (isFull && spark.description ? '<div style="font-size:11px;color:#64748b;margin-bottom:6px;">' + Z.escape(spark.description) + '</div>' : '') +
      '<div class="spark-author">' +
      '<img src="' + Z.escape(a.avatar) + '">' +
      '<div><div class="sname">' + Z.escape(a.name) + '</div><div class="shandle">@' + Z.escape(a.username) + '</div></div>' +
      '</div>' +
      '<div class="spark-caption">' + Z.escape(spark.caption || '') + '</div>' +
      (tagsHtml ? '<div class="spark-tags">' + tagsHtml + '</div>' : '') +
      '<div class="spark-actions">' +
      '<button class="' + (isLiked?'liked':'') + '" onclick="Z.likeSpark(\'' + Z.escape(spark.id) + '\',\'' + Z.escape(a.id) + '\')"><i class="fa-' + (isLiked?'solid':'regular') + ' fa-heart"></i> ' + (spark.likes || 0) + '</button>' +
      '<button onclick="Z.sharePost(\'' + Z.escape(spark.id) + '\')"><i class="fa-solid fa-share-nodes"></i> ' + (spark.shares || 0) + '</button>' +
      '<span style="display:flex;align-items:center;gap:4px;"><i class="fa-regular fa-eye"></i> ' + (spark.views || 0) + '</span>' +
      '</div>' +
      '</div></div>';
  }

  if(!filtered.length) html += '<div class="empty-state"><i class="fa-solid fa-bolt"></i><p>No Sparks yet.</p></div>';
  html += '</div>';
  return html;
};

Z.likeSpark = function(sparkId, authorId){
  var u = _currentUser();
  if(!u){ Z.openAuthModal('login'); return; }
  var sparks = Z.DB.getSparks();
  for(var i=0;i<sparks.length;i++){
    if(sparks[i].id === sparkId){
      if(!sparks[i]._likedBy) sparks[i]._likedBy = [];
      var idx = sparks[i]._likedBy.indexOf(u.id);
      if(idx === -1){
        sparks[i]._likedBy.push(u.id);
        sparks[i].likes = (sparks[i].likes || 0) + 1;
        Z.DB.saveSparks(sparks);
        Z.RewardEngine.process(authorId, 'spark_like', sparkId);
      } else {
        sparks[i]._likedBy.splice(idx, 1);
        sparks[i].likes = Math.max(0, (sparks[i].likes || 0) - 1);
        Z.DB.saveSparks(sparks);
        Z.showView('spark');
      }
      break;
    }
  }
};

      '<div style="font-size:10px;color:#64748b;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">@' + Z.escape(u.username) + ' • ' + (u.connections||0) + ' connections</div></div>' +
      '</button>';

    if(isSelf){
      html += '<span style="font-size:10px;color:#64748b;padding:4px 12px;background:#0f172a;border-radius:8px;flex-shrink:0;">You</span>';
    } else if(isConnected){
      html += '<span style="font-size:10px;color:#10b981;font-weight:600;flex-shrink:0;"><i class="fa-solid fa-check-circle"></i> Connected</span>';
    } else {
      html += '<button onclick="Z.RewardEngine.process(\'' + Z.escape(u.id) + '\',\'connect\')" style="background:#10b981;border:none;color:#000;font-weight:700;padding:6px 14px;border-radius:8px;font-size:11px;cursor:pointer;white-space:nowrap;flex-shrink:0;">Connect ($' + Number(bs.connect||0).toFixed(2) + ')</button>';
    }
    html += '</div>';
  }
  if(!list.length) html = '<div class="empty-state"><i class="fa-solid fa-users"></i><p>No people found.</p></div>';
  return html;
};

Z.upgradePackage = function(name, price){
  if(!_currentUser()){ Z.openAuthModal('login'); return; }
  var u = Z.DB.getUserById(_currentUser().id);
  if(!u) return;
  var total = Number(u.wallet.cash) + Number(u.wallet.bounty);
  if(total < price){ Z.toast('Insufficient balance. Need $' + price.toFixed(2)); return; }
  var remaining = price;
  var fromCash = Math.min(Number(u.wallet.cash), remaining);
  u.wallet.cash -= fromCash;
  remaining -= fromCash;
  if(remaining > 0) u.wallet.bounty -= remaining;
  u.package = name;
  if(!u.walletTx) u.walletTx = [];
  u.walletTx.unshift({
    id:'pkg_'+Date.now(), date:new Date().toISOString(),
    type:'Package: '+name, amount:-price, cash:-fromCash, bounty:-remaining, status:'Completed'
  });
  Z.DB.saveUsers();
  Z.toast('Upgraded to ' + name + '!');
  Z.showView('profile');
};

Z.renderCirclesList = function(){
  var circles = Z.DB.getCircles();
  var q = (Z.State.circleSearch || '').toLowerCase();
  var u = _currentUser();
  var joined = u && u.joinedCircles ? u.joinedCircles : [];

  var filtered = [];
  for(var i=0;i<circles.length;i++){
    var c = circles[i];
    if(c.name.toLowerCase().indexOf(q) !== -1 || c.description.toLowerCase().indexOf(q) !== -1) filtered.push(c);
  }

  var myCircles = [];
  var otherCircles = [];
  for(var j=0;j<filtered.length;j++){
    if(joined.indexOf(filtered[j].id) !== -1) myCircles.push(filtered[j]);
    else otherCircles.push(filtered[j]);
  }

  var html = '';
  if(myCircles.length){
    html += '<div class="section-title">My Circles</div>';
    for(var m=0;m<myCircles.length;m++) html += Z.renderCircleCard(myCircles[m], true);
  }
  if(otherCircles.length){
    html += '<div class="section-title">Discover Circles</div>';
    for(var n=0;n<otherCircles.length;n++) html += Z.renderCircleCard(otherCircles[n], false);
  }
  if(!filtered.length) html = '<div class="empty-state"><i class="fa-solid fa-circle-nodes"></i><p>No circles found.</p></div>';
  return html;
};

Z.onCircleSearchInput = function(value){
  Z.State.circleSearch = value;
  var list = document.getElementById('circles-list-container');
  if(list) list.innerHTML = Z.renderCirclesList();

Z.renderCircleCard = function(c, isJoined){

  var typeClass = 'type-social';
  if(c.type === 'services') typeClass = 'type-services';
  else if(c.type === 'goods') typeClass = 'type-goods';
  else if(c.type === 'office') typeClass = 'type-services';
  else if(c.type === 'education') typeClass = 'type-goods';

  var shopHtml = '';
  if(c.shopItems && c.shopItems.length){
    shopHtml = '<div class="media-grid-2">';
    for(var i=0;i<Math.min(c.shopItems.length, 4);i++){
      var item = c.shopItems[i];
      shopHtml += '<div class="shop-item"><div class="siname">' + Z.escape(item.name) + '</div><div class="siprice">$' + item.price + '</div></div>';
    }
    shopHtml += '</div>';
  }

  return '<div class="circle-card">' +
    '<div class="circle-head">' +
    '<div class="circle-head-left">' +
    '<img src="' + Z.escape(c.avatar) + '">' +

    (isJoined ? '<span class="circle-joined"><i class="fa-solid fa-check"></i> Joined</span>' :
      '<button class="circle-join-btn" onclick="Z.RewardEngine.process(\'' + Z.escape(c.creatorId) + '\',\'circleJoin\',\'' + Z.escape(c.id) + '\')">Join ($0.02)</button>') +

Z.renderView = function(view, param){
  switch(view){
    case 'home': return Z.renderHome();
    case 'spark': return Z.renderSpark();
    case 'people': return Z.renderPeople();
    case 'profile': return Z.renderProfile();
    case 'wallet': return Z.renderWallet();
    case 'bounty': return Z.renderBounty();
    case 'packages': return Z.renderPackages();
    case 'calculator': return Z.renderCalculator();
    case 'referrals': return Z.renderReferrals();
    case 'analytics': return Z.renderAnalytics();
    case 'circles': return Z.renderCircles();
    case 'admin-wall': return Z.renderAdminWall();
    case 'public-profile': return Z.renderPublicProfile(param);
    case 'notifications': return Z.renderNotifications();
    default: return Z.renderHome();
  }
};

Z.showView = function(view, param){
  Z.State.currentView = view;
  window.scrollTo(0, 0);
  var btns = document.querySelectorAll('#bottom-nav button:not(.create-btn)');
  for(var i=0;i<btns.length;i++) btns[i].classList.remove('active');
  var map = { home:'nav-home', spark:'nav-spark', circles:'nav-circles', people:'nav-people', profile:'nav-profile' };
  var activeId = map[view];
  if(activeId){ var btn = document.getElementById(activeId); if(btn) btn.classList.add('active'); }

  var container = document.getElementById('app-container');
  if(!container) return;

  try {
    container.innerHTML = Z.renderView(view, param);
  } catch(e){
    console.error('Render error:', e);
    container.innerHTML = '<div class="empty-state"><i class="fa-solid fa-triangle-exclamation" style="color:#f59e0b;"></i><p>Something went wrong.</p>' +
      '<button onclick="Z.showView(\'home\')" style="background:#10b981;border:none;color:#000;font-weight:700;padding:8px 20px;border-radius:8px;margin-top:12px;cursor:pointer;">Go Home</button></div>';
  }

  if(view === 'home'){
    setTimeout(function(){ Z.renderStatusRow(); }, 60);
  }

  // Resolve IndexedDB media refs after render
  setTimeout(function(){ Z.resolveMediaRefs(); }, 80);

  Z.updateHeader();
};

// ============================================================
// BOOT
// ============================================================
function boot(){
  try {
    if(!localStorage.getItem('zynix_users')) Z.DB.saveUsers(Z.SeedData.users);
    if(!localStorage.getItem('zynix_posts')) Z.DB.savePosts(Z.SeedData.posts);
    if(!localStorage.getItem('zynix_sparks')) Z.DB.saveSparks(Z.SeedData.sparks);
    if(!localStorage.getItem('zynix_statuses')) Z.DB.saveStatuses(Z.SeedData.statuses);
    if(!localStorage.getItem('zynix_circles')) Z.DB.saveCircles(Z.SeedData.circles);

    Z.State.currentUser = Z.DB.getCurrentUser();
    Z.renderHeaderAuth();
    Z.updateHeader();
    Z.showView('home');
  } catch(e){
    console.error('Boot error:', e);
    var container = document.getElementById('app-container');
    if(container){
      container.innerHTML = '<div class="empty-state"><i class="fa-solid fa-triangle-exclamation" style="color:#f59e0b;"></i><p>Failed to load. Please refresh.</p>' +
        '<button onclick="location.reload()" style="background:#10b981;border:none;color:#000;font-weight:700;padding:8px 20px;border-radius:8px;margin-top:12px;cursor:pointer;">Refresh</button></div>';
    }
  }
}

if(document.readyState === 'loading'){
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

})();
</script>
</body>
</html>

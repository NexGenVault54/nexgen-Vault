}

function _startAdAutoAdvance(){
  _stopAdAutoAdvance();
  var adStart = Date.now(), pauseStarted = null, accumPaused = 0, DURATION = 20000;
  Z._adTVTimer = setInterval(function(){
    var video = document.querySelector('#zn-ad-stage video');
    if(video){
      if(video.paused){ if(!pauseStarted) pauseStarted = Date.now(); }
      else { if(pauseStarted){ accumPaused += Date.now() - pauseStarted; pauseStarted = null; } }
    }
    var elapsed = Date.now() - adStart - accumPaused;
    var bar = document.getElementById('zn-ad-progress');
    if(bar) bar.style.width = Math.min(100, (elapsed / DURATION) * 100) + '%';
    if(elapsed >= DURATION){ _stopAdAutoAdvance(); Z.nextAdInTV(); }
  }, 120);
}

Z.nextAdInTV = function(){
  var ads = Z.State.adminAds || [];
  if(ads.length <= 1) return;

  _renderCurrentAd(true);
};

function _wireAdStage(){
  var stage = document.getElementById('zn-ad-stage');
  if(!stage) return;
  _stopAdAutoAdvance();
  var video = stage.querySelector('video');
  if(video){
    video.addEventListener('playing', function(){ _startAdAutoAdvance(); }, {once:true});
    video.addEventListener('ended', function(){ Z.nextAdInTV(); });
    setTimeout(function(){ if(!video.paused && !Z._adTVTimer){ _startAdAutoAdvance(); } }, 600);
    try {
      var p = video.play();
      if(p && p.catch){
        p.catch(function(){
          video.muted = true;
          video.play().catch(function(){});
        });
      }
    } catch(e){}
  } else {
    _startAdAutoAdvance();
  }
}

            '<input type="text" id="banner-subtitle" class="inp" maxlength="80" value="' + Z.escape(d.subtitle || '') + '" oninput="Z._bannerSetField(\'subtitle\', this.value)">' +
          '</div>' +
          '<div class="field"><label class="lbl">Call to action (optional)</label>' +
            '<input type="text" id="banner-cta" class="inp" maxlength="20" value="' + Z.escape(d.cta || '') + '" oninput="Z._bannerSetField(\'cta\', this.value)">' +
          '</div>' +
          '<div class="field"><label class="lbl">Background colour</label>' +
            '<div class="bg-row">' + bgSwatches + '</div>' +
          '</div>' +
          '<div class="field"><label class="lbl">Or wallpaper</label>' +
            '<div class="wall-grid">' + wallTiles + '</div>' +
          '</div>' +
          '<div class="field"><label class="lbl">Font</label>' +
            '<div class="font-row">' + fontBtns + '</div>' +
          '</div>' +
          '<div class="field"><label class="lbl">Media (optional — overrides colour/wallpaper)</label>' +
            '<input type="file" id="banner-media" accept="image/*,video/*" style="display:none;" onchange="Z._bannerPickMedia(this)">' +
            '<button class="btn-ghost" onclick="document.getElementById(\'banner-media\').click()">' +
              '<i class="fa-solid fa-cloud-arrow-up"></i> ' + (hasMedia ? 'Replace media' : 'Choose media') +
            '</button>' +
            (hasMedia ? '<button class="btn-ghost" onclick="Z._bannerClearMedia()" style="color:#fca5a5;border-color:rgba(239,68,68,.35);">Remove media</button>' : '') +
          '</div>' +

Z._bannerSetField = function(k, v){ if(!Z.State.bannerDraft) Z.State.bannerDraft = {}; Z.State.bannerDraft[k] = v; };
Z._bannerSetBg = function(id){ if(!Z.State.bannerDraft) return; Z.State.bannerDraft.bgId = id; Z.State.bannerDraft.wpId = null; _renderBannerEditor(); };
Z._bannerSetWallpaper = function(id){ if(!Z.State.bannerDraft) return; Z.State.bannerDraft.wpId = id; Z.State.bannerDraft.bgId = null; _renderBannerEditor(); };
Z._bannerSetFont = function(id){ if(!Z.State.bannerDraft) return; Z.State.bannerDraft.fontId = id; _renderBannerEditor(); };

Z._bannerPickMedia = async function(input){
  var f = input && input.files && input.files[0];
  if(!f) return;
  if(f.size > 100*1024*1024){ Z.toast('Media under 100 MB.', 'error'); return; }
  var isVid = (f.type && f.type.indexOf('video/') === 0);
  Z.toast('Uploading media...');
  try {
    var url = await Z.storeMedia(f);
    if(!url){ Z.toast('Upload failed.', 'error'); return; }
    if(!Z.State.bannerDraft) Z.State.bannerDraft = {};
    Z.State.bannerDraft.mediaType = isVid ? 'video' : 'image';
    Z.State.bannerDraft.mediaUrl = url;
    _renderBannerEditor();
    Z.toast('Media ready.');
  } catch(e){
    Z.toast('Upload failed: ' + (e && e.message ? e.message : 'unknown'), 'error');
  }
};

Z._bannerClearMedia = function(){
  if(!Z.State.bannerDraft) return;
  Z.State.bannerDraft.mediaType = null;
  Z.State.bannerDraft.mediaUrl = null;
  _renderBannerEditor();
};

Z.saveBannerDraft = async function(){
  var d = Z.State.bannerDraft;
  var me = Z.State.currentUser;
  if(!d || !me){ Z.toast('Nothing to save.', 'error'); return; }
  if(!d.heading && !d.subtitle && !d.mediaUrl){
    Z.toast('Add a heading, subtitle, or media.', 'error');
    return;
  }
  var c = Z.sb();
  if(!c){ Z.toast('Not connected.', 'error'); return; }
  var path = Z._pathFromUrl(d.mediaUrl);
  var payload = {
    owner_id: me.id,
    heading: d.heading || '',
    subtitle: d.subtitle || '',
    cta: d.cta || '',
    bg_id: d.bgId || 'deep-blue',
    wp_id: d.wpId || null,
    font_id: d.fontId || 'display',
    media_type: d.mediaType || null,
    media_url: d.mediaUrl || null,
    media_path: path || null,
    is_active: true
  };
  var r = await c.from('ads').insert(payload).select().maybeSingle();
  if(r.error){ Z.toast('Save failed: ' + r.error.message, 'error'); return; }
  Z.State.adminAds = [r.data].concat(Z.State.adminAds || []);
  Z.State.adTVIndex = 0;
  Z.toast('Ad added. Now playing.');
  Z.closeBannerEditor();
  if(Z.State.currentView === 'public-home'){
    var host = document.querySelector('.zn-public-wrap');
    if(host){
      var wrapper = document.createElement('div');
      wrapper.innerHTML = Z.renderAdTV();
      var newAdTV = wrapper.firstChild;
      var oldAdTV = host.querySelector('.zn-ad-tv');
      if(oldAdTV && oldAdTV.parentNode) oldAdTV.parentNode.replaceChild(newAdTV, oldAdTV);
      _renderCurrentAd(true);
    }
  }
};

Z.closeBannerEditor = function(){ Z.State.bannerDraft = null; Z.closeModal(); };

})();
</script>
<!-- ============================================================
     SECTION 5 — POST REACTIONS + POST COMMENTS
     Dislike exclusivity both directions · self-reaction tracker
     · comment colors · replies
     ============================================================ -->
<script>
(function(){
'use strict';
var Z = window.Z;
if(!Z) return;

Z._selfReaction = {};
Z._markSelfReaction = function(id, r){
  Z._selfReaction[id + '|' + r] = Date.now();
};
Z._isRecentSelfReaction = function(id, r){
  var t = Z._selfReaction[id + '|' + r];
  if(!t) return false;
  if(Date.now() - t > 12000){ delete Z._selfReaction[id + '|' + r]; return false; }
  return true;
};

Z.renderReactionRowForPost = function(post){
  var me = Z.State.currentUser;
  var counts = post.reactions || {};
  var myR = post._myReactions || {};
  var isMine = me && me.id === post.author_id;
  var unfrozen = Z.isUnfrozen(post.id);
  var hasBounty = Z.hasBountyReactionGiven(myR);
  var hasDislike = !!myR['dislike'];
  var html = '';
  Z.ALL_REACTIONS.forEach(function(k){
    var r = Z.Reactions[k];
    var cnt = counts[k] || 0;
    var act = !!myR[k];
    var cssClass = r.cssClass ? ' class="' + r.cssClass + '"' : '';
    var dis = (k === 'dislike');
    var cls = Z._reactionClassFor('react-btn', {
      active: act,
      isDislike: dis,
      hasBounty: hasBounty,
      hasDislike: hasDislike,
      isOwner: isMine,
      frozenApplies: true,
      unfrozen: unfrozen
    });
    var onclick = ' onclick="Z.reactToPost(\'' + Z.escape(post.id) + '\',\'' + k + '\')"';
    var bountyHtml = dis
      ? '<span class="bounty" style="color:#64748b;">—</span>'
      : '<span class="bounty">$' + r.reward.toFixed(2) + '</span>';
    html +=
      '<button class="' + cls + '"' + onclick + ' title="' + r.label + '">' +
        '<span' + cssClass + '>' + r.symbol + '</span>' +
        '<span class="count">' + cnt + '</span>' +
        bountyHtml +
      '</button>';
  });
  var tip = unfrozen ? 'Unfrozen' : 'Frozen';
  html +=
    '<button type="button" class="freeze-dot' + (unfrozen ? ' unfrozen' : '') +
    '" data-freeze-id="' + Z.escape(post.id) + '" data-tip="' + tip +
    '" onclick="Z.toggleFreeze(\'' + Z.escape(post.id) + '\', event)" title="Click to ' +
    (unfrozen?'freeze':'unfreeze') + ' reactions"></button>';
  return html;
};

Z.updatePostReactionUI = function(postId){
  var post = Z.findPostInState(postId);
  if(!post) return;
  var card = document.querySelector('.post-card[data-post-id="' + postId + '"]');
  if(!card) return;
  var row = card.querySelector('.post-reactions');
  if(!row) return;
  row.innerHTML = Z.renderReactionRowForPost(post);
  Z.observeFreezeDots();
};

Z.reactToPost = async function(postId, reactionType){
  var me = Z.State.currentUser;
  if(!me){ Z.openAuthModal('login'); return; }
  var post = Z.findPostInState(postId);
  if(!post) return;
  if(post.author_id === me.id){ Z.toast('Cannot react to your own post.'); return; }
  if(!Z.isUnfrozen(postId)){ Z.showFreezeTooltip(postId); return; }
  var c = Z.sb();
  if(!c) return;
  if(!post._myReactions) post._myReactions = {};
  if(!post.reactions)   post.reactions = {};

  if(reactionType === 'dislike'){
    if(post._myReactions['dislike']){
      delete post._myReactions['dislike'];
      post.reactions['dislike'] = Math.max(0, (post.reactions['dislike']||0) - 1);
      Z.updatePostReactionUI(postId);
      await c.from('post_reactions').delete()
        .eq('post_id', postId).eq('user_id', me.id).eq('reaction', 'dislike');
      Z.toast('Dislike removed.');
      return;
    }
    if(Z.hasBountyReactionGiven(post._myReactions)){
      Z.toast('Cannot dislike after a bounty reaction.');
      return;
    }
    post._myReactions['dislike'] = true;
    post.reactions['dislike'] = (post.reactions['dislike']||0) + 1;
    Z._markSelfReaction(postId, 'dislike');
    Z.updatePostReactionUI(postId);
    Z.haptic(8);
    var insD = await c.from('post_reactions').insert({post_id: postId, user_id: me.id, reaction: 'dislike'});
    if(insD.error && insD.error.code !== '23505'){
      delete post._myReactions['dislike'];
      post.reactions['dislike'] = Math.max(0, (post.reactions['dislike']||0) - 1);
      Z.updatePostReactionUI(postId);
      Z.toast('Failed.');
    }
    return;
  }

  if(post._myReactions['dislike']){ Z.toast('Remove dislike first.'); return; }
  if(post._myReactions[reactionType]){ Z.toast('Already reacted.'); return; }

  post._myReactions[reactionType] = true;
  post.reactions[reactionType] = (post.reactions[reactionType]||0) + 1;
  Z._markSelfReaction(postId, reactionType);
  Z.updatePostReactionUI(postId);
  Z.haptic(10);

  var ins = await c.from('post_reactions').insert({
    post_id: postId, user_id: me.id, reaction: reactionType
  });
  if(ins.error){
    if(ins.error.code !== '23505'){
      delete post._myReactions[reactionType];
      post.reactions[reactionType] = Math.max(0, (post.reactions[reactionType]||0) - 1);
      Z.updatePostReactionUI(postId);
      Z.toast('Failed.');
    }
    return;
  }
  await Z.DB.awardReactionBounty('post', postId, reactionType);
};

Z.setCommentColor = function(color){
  Z.State.commentColor = color;
  document.querySelectorAll('.comment-color-dot').forEach(function(d){
    d.classList.toggle('selected', d.getAttribute('data-color') === color);
  });
};

Z.findCommentInState = function(commentId){
  var found = null;
  function scan(arr){
    for(var i=0;i<arr.length;i++){
      if(arr[i].id === commentId){ found = arr[i]; return; }
      if(arr[i]._replies){ scan(arr[i]._replies); if(found) return; }
    }
  }
  (Z.State.allPosts||[]).forEach(function(p){ if(!found && p._comments) scan(p._comments); });
  if(!found && Z.State.spacePosts){
    Z.State.spacePosts.forEach(function(p){ if(!found && p._comments) scan(p._comments); });
  }
  return found;
};

Z.renderComment = function(cm, post, profiles, isReply){
  profiles = profiles || Z.State.allProfiles || [];
  var me = Z.State.currentUser;
  var ca = profiles.find(function(x){ return x.id === cm.author_id; }) ||
           { name:'User', id:cm.author_id };
  var isMyComment = me && me.id === cm.author_id;
  var isMyPost = me && post && me.id === post.author_id;
  var counts = cm._reactionCounts || {};
  var myR    = cm._myReactions || {};
  var hasBounty = Z.hasBountyReactionGiven(myR);
  var hasDislike = !!myR['dislike'];
  var rr = '';
  Z.ALL_REACTIONS.forEach(function(k){
    var r = Z.Reactions[k];
    var cnt = counts[k] || 0;
    var act = !!myR[k];
    var cssClass = r.cssClass ? ' class="' + r.cssClass + '"' : '';
    var dis = (k === 'dislike');
    var cls = Z._reactionClassFor('comment-react', {
      active: act,
      isDislike: dis,
      hasBounty: hasBounty,
      hasDislike: hasDislike,
      isOwner: isMyComment,
      frozenApplies: false,
      unfrozen: true
    });
    var onclick = ' onclick="Z.reactToComment(\'' + Z.escape(cm.id) + '\',\'' + k + '\')"';
    rr += '<button class="' + cls + '"' + onclick + ' title="' + r.label + '">' +
      '<span' + cssClass + '>' + r.symbol + '</span>' +
      (cnt > 0 ? '<span>' + cnt + '</span>' : '') +
      '<span class="cb">' + (dis?'—':'$' + r.reward.toFixed(2)) + '</span>' +
    '</button>';
  });

  var actions = '<div class="comment-actions">' +
    '<button onclick="Z.openInlineReply(\'' + Z.escape(post.id) + '\',\'' + Z.escape(cm.id) + '\')">Reply</button>';
  if(isMyComment){
    actions += '<button onclick="Z.deleteComment(\'' + Z.escape(cm.id) + '\',\'' + Z.escape(post.id) + '\')">Delete</button>';
  } else if(isMyPost){
    actions += cm.hidden
      ? '<button onclick="Z.unhideComment(\'' + Z.escape(cm.id) + '\',\'' + Z.escape(post.id) + '\')">Unhide</button>'
      : '<button onclick="Z.hideComment(\'' + Z.escape(cm.id) + '\',\'' + Z.escape(post.id) + '\')">Hide</button>';
  }
  actions += '</div>';

  var replies = cm._replies || [];
  var repliesHtml = '';
  if(replies.length){
    repliesHtml = '<div class="comment-replies">';
    replies.forEach(function(rep){ repliesHtml += Z.renderComment(rep, post, profiles, true); });
    repliesHtml += '</div>';
  }

  var editorHtml = '<div id="reply-editor-' + Z.escape(cm.id) + '"></div>';

  var bubble =
    '<div class="comment-item ' + (cm.color||'light-green') + (cm.hidden?' hidden-comment':'') +
      '" data-comment-id="' + Z.escape(cm.id) + '" style="margin-bottom:0;flex:1;min-width:0;">' +
      '<span class="cname" onclick="Z.showView(\'public-profile\',\'' + Z.escape(cm.author_id) + '\')" ' +
        'style="cursor:pointer;text-decoration:underline;text-decoration-color:rgba(0,0,0,.2);text-underline-offset:2px;">' +
        Z.escape(ca.name || 'User') +
      '</span>' +
      '<span class="ctext">' + Z.escape(cm.text) + '</span>' +
      (cm.hidden ? '<div style="font-size:10px;margin-top:4px;opacity:.7;"><i class="fa-solid fa-eye-slash"></i> Hidden</div>' : '') +
      '<div class="comment-reactions">' + rr + '</div>' +
      actions + editorHtml + repliesHtml +
    '</div>';

  var av = isReply ? 24 : 30;
  return '<div style="display:flex;gap:8px;margin-bottom:6px;">' +
    '<img src="' + Z.escape(Z.displayAvatar(ca)) +
      '" onclick="Z.showView(\'public-profile\',\'' + Z.escape(cm.author_id) + '\')" ' +
      'style="width:' + av + 'px;height:' + av + 'px;border-radius:50%;object-fit:cover;flex-shrink:0;cursor:pointer;margin-top:2px;">' +
    bubble +
  '</div>';
};

Z.addComment = async function(postId){
  var me = Z.State.currentUser;
  if(!me){ Z.openAuthModal('login'); return; }
  var el = document.getElementById('comment-input-' + postId);
  var t = el ? el.value.trim() : '';
  if(!t) return;
  if(el) el.value = '';
  var c = Z.sb();
  if(!c) return;
  var newId = Z.uuid();
  var color = Z.State.commentColor || 'light-green';
  var post = Z.findPostInState(postId);
  var optimistic = {
    id:newId, post_id:postId, author_id:me.id, text:t, color:color,
    _reactionCounts:{}, _myReactions:{}, _replies:[]
  };
  if(post){
    if(!post._comments) post._comments = [];
    post._comments.push(optimistic);
  }
  var container = document.getElementById('comments-' + postId);
  if(container){
    var cp = container.querySelector('.comment-color-picker');
    var temp = document.createElement('div');
    temp.innerHTML = Z.renderComment(optimistic, post, Z.State.allProfiles);
    var newEl = temp.firstChild;
    if(cp && cp.parentNode === container) container.insertBefore(newEl, cp);
    else container.insertBefore(newEl, container.firstChild);
    var card = document.querySelector('.post-card[data-post-id="' + postId + '"]');
    if(card && post){
      var b = card.querySelector('.post-actions button');
      if(b) b.innerHTML = '<i class="fa-regular fa-comment"></i> Comment ' + Z.countAllComments(post._comments || []);
    }
  }
  Z.haptic(8);
  var r = await c.from('comments').insert({id:newId, post_id:postId, author_id:me.id, text:t, color:color});
  if(r.error){
    if(post && post._comments){
      post._comments = post._comments.filter(function(x){ return x.id !== newId; });
    }
    var domEl = document.querySelector('[data-comment-id="' + newId + '"]');
    if(domEl && domEl.parentNode) domEl.parentNode.remove();
    var card2 = document.querySelector('.post-card[data-post-id="' + postId + '"]');
    if(card2 && post){
      var b2 = card2.querySelector('.post-actions button');
      if(b2) b2.innerHTML = '<i class="fa-regular fa-comment"></i> Comment ' + Z.countAllComments(post._comments || []);
    }
    Z.toast('Failed.', 'error');
  }
};

Z.openInlineReply = function(postId, parentId){
  var me = Z.State.currentUser;
  if(!me){ Z.openAuthModal('login'); return; }
  var host = document.getElementById('reply-editor-' + parentId);
  if(!host) return;
  var wasOpen = host.innerHTML.trim() !== '';
  document.querySelectorAll('.reply-editor').forEach(function(e){
    if(e.parentElement){ try { e.parentElement.innerHTML = ''; } catch(err){} }
  });
  if(wasOpen) return;
  host.innerHTML =
    '<div class="reply-editor">' +
      '<textarea id="reply-input-' + parentId + '" rows="1" placeholder="Write a reply..." oninput="Z.autoGrow(this)"></textarea>' +
      '<button class="save" onclick="Z.submitReply(\'' + Z.escape(postId) + '\',\'' + Z.escape(parentId) + '\')">Send</button>' +
      '<button class="cancel" onclick="document.getElementById(\'reply-editor-' + parentId + '\').innerHTML=\'\'">×</button>' +
    '</div>';
  setTimeout(function(){ var i = document.getElementById('reply-input-' + parentId); if(i) i.focus(); }, 50);
};

Z.submitReply = async function(postId, parentId){
  var me = Z.State.currentUser;
  if(!me) return;
  var el = document.getElementById('reply-input-' + parentId);
  var t = el ? el.value.trim() : '';
  if(!t) return;
  var c = Z.sb();
  if(!c) return;
  var newId = Z.uuid();
  var color = Z.State.commentColor || 'light-green';
  var r = await c.from('comments').insert({
    id:newId, post_id:postId, parent_id:parentId, author_id:me.id, text:t, color:color
  });
  if(r.error){ Z.toast('Failed.', 'error'); return; }
  var post = Z.findPostInState(postId);
  var parentComment = Z.findCommentInState(parentId);
  var newRep = {
    id:newId, post_id:postId, parent_id:parentId, author_id:me.id,
    text:t, color:color, _reactionCounts:{}, _myReactions:{}, _replies:[]
  };
  if(parentComment){
    if(!parentComment._replies) parentComment._replies = [];
    parentComment._replies.push(newRep);
  }
  var parentEl = document.querySelector('[data-comment-id="' + parentId + '"]');
  if(parentEl){
    var rc = parentEl.querySelector('.comment-replies');
    if(!rc){
      rc = document.createElement('div');
      rc.className = 'comment-replies';
      var editorHost = parentEl.querySelector('[id^="reply-editor-"]');
      if(editorHost && editorHost.parentNode === parentEl) editorHost.parentNode.insertBefore(rc, editorHost.nextSibling);
      else parentEl.appendChild(rc);
    }
    var temp = document.createElement('div');
    temp.innerHTML = Z.renderComment(newRep, post, Z.State.allProfiles, true);
    rc.appendChild(temp.firstChild);
  }
  var host = document.getElementById('reply-editor-' + parentId);
  if(host) host.innerHTML = '';
  if(post){
    var card = document.querySelector('.post-card[data-post-id="' + postId + '"]');
    if(card){
      var b = card.querySelector('.post-actions button');
      if(b) b.innerHTML = '<i class="fa-regular fa-comment"></i> Comment ' + Z.countAllComments(post._comments || []);
    }
  }
};

Z.deleteComment = async function(commentId, postId){
  if(!confirm('Delete this comment?')) return;
  var c = Z.sb();
  if(!c) return;
  var r = await c.from('comments').delete().eq('id', commentId);
  if(r.error){ Z.toast('Delete failed.'); return; }
  var post = Z.findPostInState(postId);
  function removeRec(arr){
    for(var i=0;i<arr.length;i++){
      if(arr[i].id === commentId){ arr.splice(i,1); return true; }
      if(arr[i]._replies && removeRec(arr[i]._replies)) return true;
    }
    return false;
  }
  if(post && post._comments) removeRec(post._comments);
  var el = document.querySelector('[data-comment-id="' + commentId + '"]');
  if(el && el.parentNode) el.parentNode.remove();
  if(post){
    var card = document.querySelector('.post-card[data-post-id="' + postId + '"]');
    if(card){
      var b = card.querySelector('.post-actions button');
      if(b) b.innerHTML = '<i class="fa-regular fa-comment"></i> Comment ' + Z.countAllComments(post._comments || []);
    }
  }
  Z.toast('Deleted.');
};

Z.hideComment = async function(commentId, postId){
  if(!confirm('Hide this comment?')) return;
  var c = Z.sb();
  if(!c) return;
  var r = await c.from('comments').update({hidden:true}).eq('id', commentId);
  if(r.error){ Z.toast('Failed.'); return; }
  var cm = Z.findCommentInState(commentId);
  if(cm) cm.hidden = true;
  var post = Z.findPostInState(postId);
  if(cm && post){
    var el = document.querySelector('[data-comment-id="' + commentId + '"]');
    if(el){
      var isReply = !!el.closest('.comment-replies');
      var wrapper = el.parentNode;
      var temp = document.createElement('div');
      temp.innerHTML = Z.renderComment(cm, post, Z.State.allProfiles, isReply);
      wrapper.parentNode.replaceChild(temp.firstChild, wrapper);
    }
  }
  Z.toast('Hidden.');
};

Z.unhideComment = async function(commentId, postId){
  var c = Z.sb();
  if(!c) return;
  var r = await c.from('comments').update({hidden:false}).eq('id', commentId);
  if(r.error){ Z.toast('Failed.'); return; }
  var cm = Z.findCommentInState(commentId);
  if(cm) cm.hidden = false;
  var post = Z.findPostInState(postId);
  if(cm && post){
    var el = document.querySelector('[data-comment-id="' + commentId + '"]');
    if(el){
      var isReply = !!el.closest('.comment-replies');
      var wrapper = el.parentNode;
      var temp = document.createElement('div');
      temp.innerHTML = Z.renderComment(cm, post, Z.State.allProfiles, isReply);
      wrapper.parentNode.replaceChild(temp.firstChild, wrapper);
    }
  }
  Z.toast('Unhidden.');
};

Z.reactToComment = async function(commentId, reactionType){
  var me = Z.State.currentUser;
  if(!me){ Z.openAuthModal('login'); return; }
  var cm = Z.findCommentInState(commentId);
  if(!cm){ Z.toast('Comment not found.'); return; }
  var c = Z.sb();
  if(!c) return;
  if(!cm._myReactions)   cm._myReactions = {};
  if(!cm._reactionCounts) cm._reactionCounts = {};

  if(reactionType === 'dislike'){
    if(cm._myReactions['dislike']){
      delete cm._myReactions['dislike'];
      cm._reactionCounts['dislike'] = Math.max(0, (cm._reactionCounts['dislike']||0) - 1);
      Z.updateCommentReactionUI(commentId);
      await c.from('comment_reactions').delete()
        .eq('comment_id', commentId).eq('user_id', me.id).eq('reaction', 'dislike');
      Z.toast('Dislike removed.');
      return;
    }
    if(Z.hasBountyReactionGiven(cm._myReactions)){
      Z.toast('Cannot dislike after a bounty reaction.');
      return;
    }
    cm._myReactions['dislike'] = true;
    cm._reactionCounts['dislike'] = (cm._reactionCounts['dislike']||0) + 1;
    Z._markSelfReaction(commentId, 'dislike');
    Z.updateCommentReactionUI(commentId);
    Z.haptic(8);
    var insD = await c.from('comment_reactions').insert({
      comment_id: commentId, user_id: me.id, reaction: 'dislike'
    });
    if(insD.error && insD.error.code !== '23505'){ Z.toast('Failed.'); }
    return;
  }

  if(cm._myReactions['dislike']){ Z.toast('Remove dislike first.'); return; }
  if(cm._myReactions[reactionType]){ Z.toast('Already reacted.'); return; }

  cm._myReactions[reactionType] = true;
  cm._reactionCounts[reactionType] = (cm._reactionCounts[reactionType]||0) + 1;
  Z._markSelfReaction(commentId, reactionType);
  Z.updateCommentReactionUI(commentId);
  Z.haptic(10);
  var ins = await c.from('comment_reactions').insert({
    comment_id: commentId, user_id: me.id, reaction: reactionType
  });
  if(ins.error){
    if(ins.error.code !== '23505'){ Z.toast('Failed.'); }
    return;
  }
  await Z.DB.awardReactionBounty('comment', commentId, reactionType);
};

Z.updateCommentReactionUI = function(commentId){
  var el = document.querySelector('.comment-item[data-comment-id="' + commentId + '"]');
  if(!el) return;
  var row = el.querySelector('.comment-reactions');
  if(!row) return;
  var cm = Z.findCommentInState(commentId);
  if(!cm) return;
  var counts = cm._reactionCounts || {}, myR = cm._myReactions || {};
  var me = Z.State.currentUser;
  var isMyComment = me && me.id === cm.author_id;
  var hasBounty = Z.hasBountyReactionGiven(myR);
  var hasDislike = !!myR['dislike'];
  var html = '';
  Z.ALL_REACTIONS.forEach(function(k){
    var r = Z.Reactions[k];
    var cnt = counts[k]||0;
    var act = !!myR[k];
    var dis = (k === 'dislike');
    var cssClass = r.cssClass ? ' class="' + r.cssClass + '"' : '';
    var cls = Z._reactionClassFor('comment-react', {
      active: act,
      isDislike: dis,
      hasBounty: hasBounty,
      hasDislike: hasDislike,
      isOwner: isMyComment,
      frozenApplies: false,
      unfrozen: true
    });
    var onclick = ' onclick="Z.reactToComment(\'' + Z.escape(cm.id) + '\',\'' + k + '\')"';
    html += '<button class="' + cls + '"' + onclick + ' title="' + r.label + '">' +
      '<span' + cssClass + '>' + r.symbol + '</span>' +
      (cnt>0 ? '<span>' + cnt + '</span>' : '') +
      '<span class="cb">' + (dis?'—':'$' + r.reward.toFixed(2)) + '</span>' +
    '</button>';
  });
  row.innerHTML = html;
};

<script>
(function(){
'use strict';
var Z = window.Z;
if(!Z) return;

/* Small CSS injection — pointer-events on stack wrapper only.
   Video controls sit under the stack's empty area on some laptops;
   making the wrapper transparent to pointers (but keeping child
   buttons interactive) fixes the "speaker icon disappears" issue. */
(function(){
  try {
    if(document.getElementById('zynix-spark-pointer-fix')) return;
    var st = document.createElement('style');
    st.id = 'zynix-spark-pointer-fix';
    st.textContent =
      '.spark-actions-stack{pointer-events:none;}' +
      '.spark-actions-stack > *{pointer-events:auto;}' +
      '.spark-actions-stack .spark-action-reactions{pointer-events:none;}' +
      '.spark-actions-stack .spark-action-reactions > *{pointer-events:auto;}';
    document.head.appendChild(st);
  } catch(e){}
})();

Z._sparkAudioUnlocked = false;
Z._viewedThisSession = {};

Z.renderSpark = function(){
  var sparks = (Z.State.allSparks || []).slice();
  if(!sparks.length){
    return Z.emptyState({
      icon: 'fa-solid fa-bolt',
      title: 'No Sparks yet. Be the first to light one up.',
      cta: { label: 'Create First Spark', onclick: "Z.openCreateModal()" }
    });
  }
  var html = '<div class="spark-feed-container" id="spark-feed">';
  sparks.forEach(function(sp, i){ html += Z.renderSparkSlide(sp, i); });
  html += '</div>';
  setTimeout(function(){
    Z.setupSparkFeed(sparks);
    Z.observeFreezeDots();
    Z.resolveIdbRefs(document.getElementById('spark-feed'));
  }, 100);
  return html;
};

Z.renderSparkSlide = function(spark, index){
  var a = Z.getProfileById(spark.author_id) || {id:spark.author_id, name:'User', avatar:''};
  var isFull = spark.type === 'long_video';
  var me = Z.State.currentUser;
  var isOwn = me && me.id === a.id;
  var unfrozen = Z.isUnfrozen(spark.id);
  var freezeTip = unfrozen ? 'Unfrozen' : 'Frozen';
  var isSaved = (Z.State.savedSparks || []).indexOf(spark.id) !== -1;

  var videoEl = '<video src="' + Z.escape(spark.video_url) + '" playsinline controls preload="metadata" loop data-spark-id="' + Z.escape(spark.id) + '" style="width:100%;height:100%;object-fit:contain;background:#000;display:block;"></video>';

  var tags = '';
  if(spark.tags && spark.tags.length){
    tags = spark.tags.map(function(t){ return '<button onclick="event.stopPropagation()">#' + Z.escape(t) + '</button>'; }).join(' ');
  }

  var viewBadge = '<div class="spark-view-badge"><i class="fa-solid fa-eye"></i><span>' + (spark.views||0) + '</span></div>';

  var menuHtml = '<div class="spark-menu-wrap">' +
    '<button class="spark-menu-btn" onclick="Z.toggleSparkMenu(\'' + Z.escape(spark.id) + '\', event)" type="button"><i class="fa-solid fa-ellipsis-vertical"></i></button>' +
    '<div class="spark-menu" id="spark-menu-' + Z.escape(spark.id) + '">' +
      (isOwn ? '<button class="danger" onclick="Z.deleteSpark(\'' + Z.escape(spark.id) + '\')"><i class="fa-solid fa-trash"></i> Delete</button><div style="height:1px;background:#1e293b;margin:4px 0;"></div>' : '') +
      '<button onclick="Z.toggleSaveSpark(\'' + Z.escape(spark.id) + '\')"><i class="fa-' + (isSaved?'solid':'regular') + ' fa-bookmark"></i> ' + (isSaved?'Unsave':'Save') + '</button>' +
      '<button onclick="Z.markSparkNotInterested(\'' + Z.escape(spark.id) + '\')"><i class="fa-solid fa-thumbs-down"></i> Not Interested</button>' +
    '</div>' +
  '</div>';

  var stack = '<div class="spark-actions-stack" data-spark-actions="' + Z.escape(spark.id) + '">';
  stack += '<button type="button" class="freeze-dot' + (unfrozen ? ' unfrozen' : '') + ' lg" data-freeze-id="' + Z.escape(spark.id) + '" data-tip="' + freezeTip + '" onclick="event.stopPropagation();Z.toggleFreeze(\'' + Z.escape(spark.id) + '\', event)" title="Click to ' + (unfrozen?'freeze':'unfreeze') + ' reactions"></button>';
  stack += '<div class="spark-action-reactions">';
  stack += Z.renderSparkReactionButtons(spark);
  stack += '</div>';
  stack += '<button class="spark-action-btn" data-spark-comments-btn="' + Z.escape(spark.id) + '" onclick="event.stopPropagation();Z.openSparkComments(\'' + Z.escape(spark.id) + '\')"><div class="spark-action-icon"><i class="fa-regular fa-comment"></i></div><div class="spark-action-count">' + ((spark._commentsCount)||0) + '</div></button>';
  stack += '<button class="spark-action-btn" onclick="event.stopPropagation();Z.openSparkShare(\'' + Z.escape(spark.id) + '\')"><div class="spark-action-icon"><i class="fa-solid fa-share-nodes"></i></div><div class="spark-action-count">' + (spark.shares||0) + '</div></button>';
  stack += '</div>';

  var captionHtml = '';
  if(spark.caption){
    captionHtml = '<div class="spark-info-caption" onclick="Z.toggleCaptionEl(event, this)">' +
      '<div class="sc-text">' + Z.escape(spark.caption) + '</div>' +
      '<button class="sc-see-more" type="button" aria-label="Unfold caption" onclick="Z.toggleCaptionEl(event, this.parentElement)">' + Z.UNFOLD_LABEL + '</button>' +
    '</div>';
  }

  return '<div class="spark-slide" data-spark-index="' + index + '">' +
    videoEl +
    '<div class="spark-top-gradient"></div><div class="spark-bottom-gradient"></div>' +
    viewBadge + menuHtml +
    '<div class="spark-info">' +
      '<div class="spark-info-author">' +
        '<img src="' + Z.escape(Z.displayAvatar(a)) + '" onclick="event.stopPropagation();Z.showView(\'public-profile\',\'' + Z.escape(a.id) + '\')" style="cursor:pointer;">' +
        '<div onclick="event.stopPropagation();Z.showView(\'public-profile\',\'' + Z.escape(a.id) + '\')" style="cursor:pointer;">' +
          '<div class="sname">' + Z.escape(Z.displayName(a)) + '</div>' +
          '<div class="shandle">@' + Z.escape(a.username || 'user') + ' · ' + Z.timeAgo(new Date(spark.created_at).getTime()) + '</div>' +
        '</div>' +
      '</div>' +
      (isFull && spark.title ? '<div style="font-weight:700;font-size:14px;margin-bottom:4px;">' + Z.escape(spark.title) + '</div>' : '') +
      captionHtml +
      (tags ? '<div class="spark-info-tags">' + tags + '</div>' : '') +
    '</div>' +
    stack +
  '</div>';
};

Z.renderSparkReactionButtons = function(spark){
  var me = Z.State.currentUser;
  var author = Z.getProfileById(spark.author_id);
  var isOwn = me && author && me.id === author.id;
  var counts = spark._reactions || {};
  var myR = spark._myReactions || {};
  var unfrozen = Z.isUnfrozen(spark.id);
  var hasBounty = Z.hasBountyReactionGiven(myR);
  var hasDislike = !!myR['dislike'];
  var html = '';
  Z.ALL_REACTIONS.forEach(function(k){
    var r = Z.Reactions[k];
    var act = !!myR[k];
    var cnt = counts[k] || 0;
    var dis = (k === 'dislike');
    var cls = Z._reactionClassFor('spark-reaction-icon', {
      active: act,
      isDislike: dis,
      hasBounty: hasBounty,
      hasDislike: hasDislike,
      isOwner: isOwn,
      frozenApplies: true,
      unfrozen: unfrozen
    });
    var onclick = ' onclick="event.stopPropagation();Z.sparkReact(\'' + Z.escape(spark.id) + '\',\'' + k + '\')"';
    var price = dis ? '—' : '$' + r.reward.toFixed(2);
    html += '<button class="' + cls + '"' + onclick + ' title="' + r.label + ' ' + price + '">' +
      '<span class="emoji">' + r.symbol + '</span>' +
      '<span class="rcount">' + (cnt > 0 ? cnt : '&nbsp;') + '</span>' +
      '<span class="rprice">' + price + '</span>' +
    '</button>';
  });
  return html;
};

Z.updateSparkReactionsUI = function(sparkId){
  var spark = (Z.State.allSparks||[]).find(function(x){ return x.id === sparkId; });
  if(!spark && Z.State.spaceSparks) spark = Z.State.spaceSparks.find(function(x){ return x.id === sparkId; });
  if(!spark) return;
  var stack = document.querySelector('[data-spark-actions="' + sparkId + '"]');
  if(!stack) return;
  var wrap = stack.querySelector('.spark-action-reactions');
  if(wrap) wrap.innerHTML = Z.renderSparkReactionButtons(spark);
  var dot = stack.querySelector('.freeze-dot');
  if(dot){
    var unfrozen = Z.isUnfrozen(sparkId);
    if(unfrozen){ dot.classList.add('unfrozen'); dot.setAttribute('data-tip','Unfrozen'); }
    else { dot.classList.remove('unfrozen'); dot.setAttribute('data-tip','Frozen'); }
  }
  Z.observeFreezeDots();
};

Z.refreshSparkCommentCount = function(sparkId){
  try {
    var btn = document.querySelector('[data-spark-comments-btn="' + sparkId + '"] .spark-action-count');
    if(!btn) return;
    var spark = (Z.State.allSparks||[]).find(function(x){ return x.id === sparkId; });
    if(!spark) return;
    btn.textContent = spark._commentsCount || 0;
  } catch(e){}
};

Z.toggleSparkMenu = function(sparkId, ev){
  if(ev) ev.stopPropagation();
  var menu = document.getElementById('spark-menu-' + sparkId);
  if(!menu) return;
  var wasOpen = menu.classList.contains('open');
  document.querySelectorAll('.spark-menu.open').forEach(function(m){ m.classList.remove('open'); });
  if(!wasOpen) menu.classList.add('open');
};

/* Close menu on pointerdown outside — fires before native video
   controls intercept the event, so tapping near the seek bar or
   speaker icon also closes an open menu. */
document.addEventListener('pointerdown', function(e){
  if(!e.target.closest('.spark-menu-wrap')){
    document.querySelectorAll('.spark-menu.open').forEach(function(m){ m.classList.remove('open'); });

Z.setupSparkFeed = function(sparks){
  var feed = document.getElementById('spark-feed');
  if(!feed) return;
  var slides = feed.querySelectorAll('.spark-slide');
  if(!slides.length) return;

  if(!Z._sparkUnmuteHooked){
    Z._sparkUnmuteHooked = true;
    var unlockAudio = function(){
      Z._sparkAudioUnlocked = true;
      var feedEl = document.getElementById('spark-feed');
      if(!feedEl) return;
      feedEl.querySelectorAll('video').forEach(function(v){
        if(!v.paused){ try { v.muted = false; v.volume = 1; } catch(e){} }
      });
    };
    document.addEventListener('touchstart', unlockAudio, {passive:true});
    document.addEventListener('click', unlockAudio, true);
    document.addEventListener('keydown', unlockAudio, true);
  }

  if(Z.State.sparkObserver){ try { Z.State.sparkObserver.disconnect(); } catch(e){} }
  Z.State.sparkObserver = new IntersectionObserver(function(){
    var vids = feed.querySelectorAll('video');
    var vh = window.innerHeight, best = null, bestRatio = 0;
    vids.forEach(function(v){
      var r = v.getBoundingClientRect();
      var visible = Math.max(0, Math.min(vh, r.bottom) - Math.max(0, r.top));
      var ratio = r.height > 0 ? visible / r.height : 0;
      if(ratio > bestRatio){ bestRatio = ratio; best = v; }
    });
    vids.forEach(function(v){
      if(v === best && bestRatio >= 0.75){
        if(Z._sparkAudioUnlocked){ v.muted = false; v.volume = 1; }
        Z.playExclusive(v);
      } else {
        if(!v.paused){ try { v.pause(); } catch(e){} }
      }
    });
  }, {threshold:[0, 0.25, 0.5, 0.75, 0.9, 1.0]});

  slides.forEach(function(sl){
    Z.State.sparkObserver.observe(sl);
    var vid = sl.querySelector('video');
    if(vid && !vid._viewHooked){
      vid._viewHooked = true;
      var sid = vid.getAttribute('data-spark-id');
      vid.addEventListener('timeupdate', function(){ Z.recordSparkViewOnProgress(vid, sid); });
    }
  });

  if(!feed._scrollHooked){
    feed._scrollHooked = true;
    feed.addEventListener('scroll', function(){
      Z.saveSparkSlideIndex();
      Z.updateScrollTopBtn(true);
      Z.closeSparkCaptionOverlay();
    }, {passive:true});
  }
};

Z.recordSparkViewOnProgress = function(videoEl, sparkId){
  if(!sparkId || !videoEl) return;
  if(Z._viewedThisSession[sparkId]) return;
  if(!videoEl.duration || videoEl.duration < 0.5) return;
  var progress = videoEl.currentTime / videoEl.duration;
  if(progress >= 0.20){
    Z._viewedThisSession[sparkId] = true;
    Z.recordSparkView(sparkId);
  }
};

Z.sparkReact = async function(sparkId, reactionType){
  var me = Z.State.currentUser;
  if(!me){ Z.openAuthModal('login'); return; }
  var c = Z.sb();
  if(!c) return;
  var spark = (Z.State.allSparks||[]).find(function(x){ return x.id === sparkId; });
  if(!spark) return;
  if(spark.author_id === me.id){ Z.toast('Cannot react to your own Spark.'); return; }
  if(!Z.isUnfrozen(sparkId)){ Z.showFreezeTooltip(sparkId); return; }
  if(!spark._myReactions) spark._myReactions = {};
  if(!spark._reactions)   spark._reactions = {};

  if(reactionType === 'dislike'){
    if(spark._myReactions['dislike']){
      delete spark._myReactions['dislike'];
      spark._reactions['dislike'] = Math.max(0, (spark._reactions['dislike']||0) - 1);
      Z.updateSparkReactionsUI(sparkId);
      await c.from('spark_reactions').delete()
        .eq('spark_id', sparkId).eq('user_id', me.id).eq('reaction', 'dislike');
      Z.toast('Dislike removed.');
      return;
    }
    if(Z.hasBountyReactionGiven(spark._myReactions)){
      Z.toast('Cannot dislike after a bounty reaction.');
      return;
    }
    spark._myReactions['dislike'] = true;
    spark._reactions['dislike'] = (spark._reactions['dislike']||0) + 1;
    Z._markSelfReaction(sparkId, 'dislike');
    Z.updateSparkReactionsUI(sparkId);
    Z.haptic(8);
    var insD = await c.from('spark_reactions').insert({
      spark_id: sparkId, user_id: me.id, reaction: 'dislike'
    });
    if(insD.error && insD.error.code !== '23505'){
      delete spark._myReactions['dislike'];
      spark._reactions['dislike'] = Math.max(0, (spark._reactions['dislike']||0) - 1);
      Z.updateSparkReactionsUI(sparkId);
      Z.toast('Failed.');
    }
    return;
  }

  if(spark._myReactions['dislike']){ Z.toast('Remove dislike first.'); return; }
  if(spark._myReactions[reactionType]){ Z.toast('Already reacted.'); return; }

  spark._myReactions[reactionType] = true;
  spark._reactions[reactionType] = (spark._reactions[reactionType]||0) + 1;
  Z._markSelfReaction(sparkId, reactionType);
  Z.updateSparkReactionsUI(sparkId);
  Z.haptic(10);
  var ins = await c.from('spark_reactions').insert({
    spark_id: sparkId, user_id: me.id, reaction: reactionType
  });
  if(ins.error){
    if(ins.error.code === '23505'){ Z.toast('Already reacted.'); }
    else {
      delete spark._myReactions[reactionType];
      spark._reactions[reactionType] = Math.max(0, (spark._reactions[reactionType]||0) - 1);
      Z.updateSparkReactionsUI(sparkId);
      Z.toast('Failed.');
    }
    return;
  }
  await Z.DB.awardReactionBounty('spark', sparkId, reactionType);
};

Z.findSparkCommentInState = function(commentId){

  (Z.State.allSparks||[]).forEach(function(sp){

      if(found) return;
      if(c.id === commentId){ found = {cm:c, spark:sp}; return; }

  });

};

    '<div class="spark-comments-overlay" onclick="if(event.target===this)Z.closeSheet()">' +
      '<div class="bottom-sheet" onclick="event.stopPropagation()">' +
        '<div class="sheet-handle"></div>' +
        '<div class="sheet-header"><h3 style="font-size:14px;font-weight:700;">Comments (' + cmts.length + ')</h3>' +
          '<button onclick="Z.closeSheet()" style="background:transparent;border:none;color:#94a3b8;font-size:20px;cursor:pointer;"><i class="fa-solid fa-xmark"></i></button>' +
        '</div>' +

        '<div class="sheet-footer">' + input + '</div>' +

    (function walk(arr){
      for(var i=0;i<arr.length;i++){

};

};

Z.deleteSparkComment = async function(commentId, sparkId){
  if(!confirm('Delete this comment?')) return;
  var c = Z.sb();
  if(!c) return;

  if(r.error){ Z.toast('Failed.'); return; }
  var spark = (Z.State.allSparks||[]).find(function(x){ return x.id === sparkId; });
  if(spark && spark._comments){
    (function removeRec(arr){
      for(var i=0;i<arr.length;i++){
        if(arr[i].id === commentId){ arr.splice(i,1); return true; }
        if(arr[i]._replies && removeRec(arr[i]._replies)) return true;
      }
      return false;
    })(spark._comments);
  }
  if(spark) spark._commentsCount = Math.max(0, (spark._commentsCount||1) - 1);
  Z.rerenderSparkCommentsBody(sparkId);
  Z.toast('Deleted.');
};

Z.postSparkToWall = async function(sparkId){
  var me = Z.State.currentUser;
  if(!me){ Z.openAuthModal('login'); return; }
  var s = (Z.State.allSparks || []).find(function(x){ return x.id === sparkId; });
  if(!s){ Z.toast('Not found.'); return; }
  if(s.author_id === me.id){ Z.toast('Cannot share your own Spark.'); return; }
  var c = Z.sb();
  if(!c) return;

  var srcAuthor = Z.getProfileById(s.author_id);
  var creditLine = '@' + ((srcAuthor && srcAuthor.username) || 'user');
  var baseText = s.caption || s.title || '';
  var newContent = baseText ? (baseText + '\n\n— spark from ' + creditLine) : ('Spark from ' + creditLine);

  var payload = {
    author_id: me.id,
    content: newContent,
    media_url: s.video_url || null,
    media_type: 'video',
    share_bounty: 0,
    shared_from_id: s.id,
    shared_from_type: 'spark'
  };

  var r = await c.from('posts').insert(payload).select().maybeSingle();
  if(r.error || !r.data){ Z.toast('Share failed.', 'error'); return; }

  var row = Object.assign({}, r.data, {reactions:{}, _myReactions:{}, _comments:[]});
  Z.State.allPosts = [row].concat(Z.State.allPosts || []);

  try {
    var amt = 0;
    var ownerProf = Z.getProfileById(s.author_id);
    if(ownerProf && ownerProf.bounty_settings && typeof ownerProf.bounty_settings.share === 'number'){
      amt = ownerProf.bounty_settings.share;
    }
    if(amt > 0){
      Z.animateDollar(amt);
      setTimeout(async function(){ await Z.refreshSession(); Z.updateHeader(); }, 500);
    }
  } catch(e){}

  Z.closeSheet();
  Z.toast('Spark shared to your wall.');
  Z.haptic(12);
  if(Z.State.currentView === 'home') Z.softRefresh();

  var refetch = Z._refetchSharesForContent;
  if(refetch){
    setTimeout(function(){ refetch('sparks', sparkId, 'spark'); }, 500);
    setTimeout(function(){ refetch('sparks', sparkId, 'spark'); }, 1800);
  }
};

Z.submitSparkImpl = async function(forceNoCaption){
  var me = Z.State.currentUser;
  if(!me) return;
  var caption = ((document.getElementById('spark-caption')||{}).value || '').trim();
  var tagsRaw = ((document.getElementById('spark-tags')||{}).value || '').trim();
  var fi = document.getElementById('spark-file');
  var url = ((document.getElementById('spark-url')||{}).value || '').trim();
  var shareBounty = parseFloat((document.getElementById('spark-share-bounty')||{}).value || '0') || 0;

  var cached = Z._mediaCache.spark;
  var hasFile = !!(cached && cached.blob) || !!(fi && fi.files && fi.files[0]);
  if(!hasFile && !url){ Z.toast('Provide video.'); return; }
  if(!caption && !forceNoCaption){ Z.confirmNoCaption('Z.submitSparkImpl(true)'); return; }

  var tags = tagsRaw
    ? tagsRaw.split(',').map(function(t){ return t.trim().replace(/^#/,''); }).filter(Boolean)
    : ['zynix'];

  var fileObj = cached && cached.blob ? cached.blob : (fi && fi.files && fi.files[0] ? fi.files[0] : null);
  if(fileObj && fileObj.size > 100*1024*1024){ Z.toast('Video under 100 MB.'); return; }

  var localUrl = fileObj ? URL.createObjectURL(fileObj) : url;
  var tempId = 'temp_' + Z.uuid();
  var optimistic = {
    id: tempId, author_id: me.id, caption: caption, video_url: localUrl,
    tags: tags, type: 'spark', share_bounty: shareBounty,
    created_at: new Date().toISOString(), views: 0, shares: 0,
    _reactions: {}, _myReactions: {}, _comments: [], _commentsCount: 0,
    _optimistic: true
  };
  Z.State.allSparks = [optimistic].concat(Z.State.allSparks || []);
  Z.closeModal();
  Z.toast('Spark published!');
  Z.haptic(12);
  Z.showView('spark');

  (async function(){
    var vu = '';
    try {
      if(fileObj) vu = await Z.storeMedia(fileObj);
      else if(url) vu = url;
    } catch(err){
      Z.State.allSparks = (Z.State.allSparks || []).filter(function(x){ return x.id !== tempId; });
      if(localUrl && localUrl.indexOf('blob:') === 0){ try { URL.revokeObjectURL(localUrl); } catch(e){} }
      Z.toast('Upload failed — Spark not published.', 'error');
      if(Z.State.currentView === 'spark') Z.showView('spark');
      return;
    }
    var sp = await Z.DB.createSpark({
      author_id: me.id, caption: caption, video_url: vu,
      tags: tags, type: 'spark', share_bounty: shareBounty
    });
    var arr = Z.State.allSparks || [];
    var idx = -1;
    for(var i=0;i<arr.length;i++){ if(arr[i].id === tempId){ idx = i; break; } }
    if(sp){
      if(idx >= 0){
        var real = Object.assign({}, sp, {_reactions:{}, _myReactions:{}, _comments:[], _commentsCount:0});
        arr[idx] = real;
      }
      if(localUrl && localUrl.indexOf('blob:') === 0){ try { URL.revokeObjectURL(localUrl); } catch(e){} }
      Z._mediaCache.spark = null;
      try { Z.saveSnapshot(); } catch(e){}
      if(Z.State.currentView === 'spark') Z.showView('spark');
    } else {
      Z.State.allSparks = arr.filter(function(x){ return x.id !== tempId; });
      if(localUrl && localUrl.indexOf('blob:') === 0){ try { URL.revokeObjectURL(localUrl); } catch(e){} }
      Z._cleanupOrphanUpload(vu);
      Z.toast('Publish failed. Try again.', 'error');
      if(Z.State.currentView === 'spark') Z.showView('spark');
    }
  })();
};

      if(localUrl && localUrl.indexOf('blob:') === 0){ try { URL.revokeObjectURL(localUrl); } catch(e){} }
      Z.toast('Upload failed — video not uploaded.', 'error');

    for(var i=0;i<arr.length;i++){ if(arr[i].id === tempId){ idx = i; break; } }
    if(sp){
      if(idx >= 0){
        var real = Object.assign({}, sp, {_reactions:{}, _myReactions:{}, _comments:[], _commentsCount:0});
        arr[idx] = real;
      }
      if(localUrl && localUrl.indexOf('blob:') === 0){ try { URL.revokeObjectURL(localUrl); } catch(e){} }
      Z._mediaCache.fv = null;
      try { Z.saveSnapshot(); } catch(e){}
      Z.toast('Video uploaded!');
      if(Z.State.currentView === 'spark') Z.showView('spark');
    } else {
      Z.State.allSparks = arr.filter(function(x){ return x.id !== tempId; });
      if(localUrl && localUrl.indexOf('blob:') === 0){ try { URL.revokeObjectURL(localUrl); } catch(e){} }
      Z._cleanupOrphanUpload(vu);
      Z.toast('Save failed. Try again.', 'error');

<script>
(function(){
'use strict';
var Z = window.Z;
if(!Z) return;

Z.STATUS_BGS = ['status-bg-deep-blue','status-bg-navy','status-bg-purple','status-bg-teal','status-bg-green','status-bg-burgundy','status-bg-rose','status-bg-plum','status-bg-slate'];

function _liveStatuses(){
  var now = Date.now();
  return (Z.State.allStatuses||[]).filter(function(s){
    if(!s) return false;
    var exp = new Date(s.expires_at||0).getTime();
    return !(exp && exp <= now);
  }).sort(function(a,b){ return new Date(b.created_at||0) - new Date(a.created_at||0); });
}
Z.getStatusContacts = function(){
  var me = Z.State.currentUser;
  if(!me) return [];
  return (Z.State.allProfiles||[]).filter(function(p){ return p.id !== me.id; });
};
Z.getActiveStatuses = function(){
  var live = _liveStatuses();
  var contacts = Z.getStatusContacts().map(function(p){ return p.id; });
  var me = Z.State.currentUser;
  var allowed = {};
  contacts.forEach(function(id){ allowed[id] = true; });
  if(me) allowed[me.id] = true;
  return live.filter(function(s){ return allowed[s.author_id]; });
};
Z.getStatusContactList = function(){
  var all = Z.getActiveStatuses();
  var grouped = {};
  all.forEach(function(s){
    if(!grouped[s.author_id]) grouped[s.author_id] = [];
    grouped[s.author_id].push(s);
  });
  var me = Z.State.currentUser;
  var entries = [];
  if(me && grouped[me.id]) entries.push({user: Z.getProfileById(me.id), statuses: grouped[me.id], isSelf: true});
  Object.keys(grouped).forEach(function(uid){
    if(me && uid === me.id) return;
    var u = Z.getProfileById(uid);
    if(u) entries.push({user: u, statuses: grouped[uid], isSelf: false});
  });
  entries.sort(function(a,b){
    if(a.isSelf) return -1;
    if(b.isSelf) return 1;
    return new Date(b.statuses[0].created_at||0) - new Date(a.statuses[0].created_at||0);
  });
  return entries;
};

  if(!Z.State.currentUser){ Z.openAuthModal('login'); return; }

        '<button class="btn-primary" style="margin-top:10px;" onclick="Z.submitStatus()">Publish Status</button>' +

Z.submitStatus = async function(forceNoCaption){
  var me = Z.State.currentUser;
  if(!me) return;
  var text = ((document.getElementById('status-text')||{}).value||'').trim();
  var fileObj = Z._getStatusFile();
  var hasFile = !!fileObj;
  if(!text && !hasFile){ Z.toast('Add text or media.'); return; }
  if(!text && hasFile && !forceNoCaption){
    Z.confirmNoCaption('Z.submitStatus(true)');
    return;
  }
  var bg = Z.State.statusBg || 'status-bg-deep-blue';
  var tempId = 'temp_' + Z.uuid();
  var localUrl = fileObj ? URL.createObjectURL(fileObj) : null;
  var mt = fileObj
    ? ((fileObj.type && fileObj.type.indexOf('video/')===0) || Z.isVideoUrl(fileObj.name) ? 'video' : 'image')
    : null;
  var now = new Date();
  var exp = new Date(now.getTime() + 24*60*60*1000);
  var optimistic = {
    id: tempId, author_id: me.id, content: text, media_url: localUrl,
    media_type: mt, background: bg,
    created_at: now.toISOString(), expires_at: exp.toISOString(),
    _optimistic: true
  };
  Z.State.allStatuses = [optimistic].concat(Z.State.allStatuses || []);
  Z.closeModal();
  Z.toast('Status published.');
  Z.haptic(12);
  Z.showView('home');
  Z.saveSnapshot();

  (async function(){
    var mr = '';
    try {
      if(fileObj) mr = await Z.storeMedia(fileObj);
    } catch(err){
      Z.State.allStatuses = (Z.State.allStatuses || []).filter(function(x){ return x.id !== tempId; });
      if(localUrl && localUrl.indexOf('blob:') === 0){ try { URL.revokeObjectURL(localUrl); } catch(e){} }
      Z.toast('Upload failed — Status not published.', 'error');
      if(Z.State.currentView === 'home'){ Z.renderStatusRow(); }
      return;
    }
    var row = await Z.DB.createStatus({
      author_id: me.id, content: text, media_url: mr||null,
      media_type: mt||null, background: bg,
      expires_at: exp.toISOString()
    });
    var arr = Z.State.allStatuses || [];
    var idx = -1;
    for(var i=0;i<arr.length;i++){ if(arr[i].id === tempId){ idx = i; break; } }
    if(row){
      if(idx >= 0) arr[idx] = row;
      if(localUrl && localUrl.indexOf('blob:') === 0){ try { URL.revokeObjectURL(localUrl); } catch(e){} }
      Z._mediaCache.status = null;
      Z.saveSnapshot();
    } else {
      Z.State.allStatuses = arr.filter(function(x){ return x.id !== tempId; });
      if(localUrl && localUrl.indexOf('blob:') === 0){ try { URL.revokeObjectURL(localUrl); } catch(e){} }
      Z._cleanupOrphanUpload(mr);
      Z.toast('Status publish failed.', 'error');
      if(Z.State.currentView === 'home'){ Z.renderStatusRow(); }
    }
  })();
};

Z.openStatusViewer = async function(authorId, index){
  var ex = document.getElementById('status-viewer'); if(ex) ex.remove();
  Z.pauseAllBackgroundVideos();
  var all = Z.getActiveStatuses();
  Z.State.viewerStatuses = all.filter(function(s){ return s.author_id === authorId; });
  Z.State.viewerStatuses.sort(function(a,b){ return new Date(b.created_at||0) - new Date(a.created_at||0); });
  if(!Z.State.viewerStatuses.length){ Z.toast('No statuses.'); return; }
  var me = Z.State.currentUser;
  if(me){
    for(var i=0;i<Z.State.viewerStatuses.length;i++){
      var s = Z.State.viewerStatuses[i];
      s._viewedByMe = true;
      Z.DB.markStatusViewed(s.id, me.id).catch(function(){});
    }
  }
  Z.State.viewerAuthorId = String(authorId);
  Z.State.viewerIndex = Math.max(0, Math.min(Number(index||0), Z.State.viewerStatuses.length-1));
  Z.showStatusViewer();
};

Z.showStatusViewer = function(){
  var old = document.getElementById('status-viewer'); if(old) old.remove();
  var status = Z.State.viewerStatuses[Z.State.viewerIndex];
  if(!status){ Z.closeStatusViewer(); return; }
  var author = Z.getProfileById(status.author_id);
  if(!author){ Z.closeStatusViewer(); return; }
  var isVid = status.media_type === 'video' || (status.media_type == null && Z.isVideoUrl(status.media_url));

  var stage = '';
  if(status.media_url){
    stage = '<div style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:#000;color:#64748b;font-size:12px;">Loading...</div>';
  } else {
    var bg = status.background || 'status-bg-deep-blue';
    stage = '<div class="' + bg + '" style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:32px;">' +
      '<div style="font-size:clamp(1.4rem,5vw,2.4rem);font-weight:700;text-align:center;line-height:1.6;overflow-y:auto;max-height:100%;width:100%;word-break:break-word;">' +
        Z.escape(status.content||'') +
      '</div></div>';
  }

  var total = Z.State.viewerStatuses.length, cur = Z.State.viewerIndex + 1;
  var captionOverlay = '';
  if(status.media_url && status.content){
    captionOverlay =
      '<div class="status-caption-overlay" onclick="Z.toggleCaptionEl(event, this)">' +
        '<div class="sc-inner">' +
          '<div class="sc-text">' + Z.escape(status.content) + '</div>' +
          '<button class="sc-see-more" type="button" aria-label="Unfold caption" onclick="Z.toggleCaptionEl(event, this.parentElement.parentElement)">' + Z.UNFOLD_LABEL + '</button>' +
        '</div>' +
      '</div>';
  }

  document.body.insertAdjacentHTML('beforeend',
    '<div class="status-viewer-overlay" id="status-viewer">' +
      '<div class="status-progress-track"><div class="status-progress-bar" id="status-progress" style="width:0%;"></div></div>' +
      '<div class="status-viewer-header">' +
        '<button class="circle-x-btn" onclick="event.stopPropagation();Z.closeStatusViewer();return false;"><i class="fa-solid fa-xmark"></i></button>' +
        '<div style="display:flex;align-items:center;gap:8px;">' +
          '<img src="' + Z.escape(Z.displayAvatar(author)) + '" style="width:34px;height:34px;border-radius:50%;object-fit:cover;cursor:pointer;" onclick="event.stopPropagation();Z.closeStatusViewer();Z.showView(\'public-profile\',\'' + Z.escape(author.id) + '\')">' +
          '<div>' +
            '<div style="font-weight:700;font-size:13px;">' + Z.escape(Z.displayName(author)) + '</div>' +
            '<div style="font-size:10px;color:#94a3b8;">' + cur + ' / ' + total + ' · ' + Z.timeAgo(new Date(status.created_at).getTime()) + '</div>' +
          '</div>' +
        '</div>' +
        '<div style="width:38px;"></div>' +
      '</div>' +
      '<div class="status-viewer-body" id="status-viewer-body">' +
        '<div class="status-stage" id="status-stage">' + stage + captionOverlay + '</div>' +
        '<button onclick="event.stopPropagation();Z.statusPrev();return false;" class="status-nav-btn left"><i class="fa-solid fa-chevron-left"></i></button>' +
        '<button onclick="event.stopPropagation();Z.statusNext();return false;" class="status-nav-btn right"><i class="fa-solid fa-chevron-right"></i></button>' +
      '</div>' +
      '<div class="status-viewer-footer">' +
        '<button onclick="event.stopPropagation();Z.statusPrev();return false;">‹ Prev</button>' +
        '<span style="font-size:10px;color:#64748b;">24h Status</span>' +
        '<button onclick="event.stopPropagation();Z.statusNext();return false;">Next ›</button>' +
      '</div>' +
    '</div>'
  );

  if(status.media_url){
    var st = document.getElementById('status-stage');
    Z.loadMedia(status.media_url).then(function(url){
      if(!url){
        var mediaLoader = st.querySelector('div');
        if(mediaLoader) mediaLoader.innerHTML = '<div style="color:#64748b;font-size:12px;padding:20px;">Media unavailable</div>';
        return;
      }
      var overlayEl = st.querySelector('.status-caption-overlay');
      var mediaWrap = document.createElement('div');
      mediaWrap.style.width = '100%'; mediaWrap.style.height = '100%';
      if(isVid) mediaWrap.innerHTML = '<video playsinline preload="metadata" style="width:100%;height:100%;object-fit:contain;background:#000;"></video>';
      else      mediaWrap.innerHTML = '<img src="' + Z.escape(url) + '" style="width:100%;height:100%;object-fit:contain;background:#000;" alt="Status">';
      var loader = st.querySelector('div');
      if(loader && loader !== overlayEl) loader.remove();
      if(overlayEl) st.insertBefore(mediaWrap, overlayEl);
      else st.appendChild(mediaWrap);

      var v = st.querySelector('video');
      if(v){
        Z.clearStatusTimer();
        v.setAttribute('src', url);
        v.muted = false;
        var attempt = v.play();
        if(attempt && attempt.catch){
          attempt.catch(function(){
            v.muted = true;
            var p2 = v.play();
            if(p2 && p2.catch) p2.catch(function(){});
            var tryUnmute = function(){ try { v.muted = false; v.volume = 1; } catch(e){} v.removeEventListener('playing', tryUnmute); };
            v.addEventListener('playing', tryUnmute, {once:true});
          });
        }
        v.setAttribute('controls','');
        v.addEventListener('timeupdate', function(){
          if(v.duration){
            var b = document.getElementById('status-progress');
            if(b) b.style.width = ((v.currentTime/v.duration)*100)+'%';
          }
        });
        v.addEventListener('ended', function(){ Z.statusNext(); });
      }
    });
  }

  if(!isVid) Z.startStatusTimer();
  Z.setupViewerGesture();
  setTimeout(function(){
    Z.detectCaptionOverflow();
    Z.resolveIdbRefs(document.getElementById('status-stage'));
  }, 60);
};

Z.startStatusTimer = function(){
  Z.clearStatusTimer();
  Z.State.viewerPaused = false;
  Z.State.viewerDuration = 7000;
  Z.State.viewerElapsed = 0;
  Z.State.viewerStartTime = Date.now();
  Z.State.viewerTimer = setTimeout(function(){ Z.statusNext(); }, Z.State.viewerDuration);
  Z.State.viewerProgressInterval = setInterval(function(){
    if(Z.State.viewerPaused) return;
    Z.State.viewerElapsed = Date.now() - Z.State.viewerStartTime;
    var pct = Math.min(100, (Z.State.viewerElapsed/Z.State.viewerDuration)*100);
    var b = document.getElementById('status-progress');
    if(b) b.style.width = pct + '%';
  }, 100);
};
Z.pauseStatusTimer = function(){
  if(Z.State.viewerPaused) return;
  Z.State.viewerPaused = true;
  if(Z.State.viewerTimer){ clearTimeout(Z.State.viewerTimer); Z.State.viewerTimer = null; }
  if(Z.State.viewerProgressInterval){ clearInterval(Z.State.viewerProgressInterval); Z.State.viewerProgressInterval = null; }
};
Z.resumeStatusTimer = function(){
  if(!Z.State.viewerPaused) return;
  var st = Z.State.viewerStatuses[Z.State.viewerIndex];
  if(st && (st.media_type === 'video' || (st.media_type == null && Z.isVideoUrl(st.media_url)))) return;
  Z.State.viewerPaused = false;
  var rem = Z.State.viewerDuration - Z.State.viewerElapsed;
  Z.State.viewerStartTime = Date.now() - Z.State.viewerElapsed;
  Z.State.viewerTimer = setTimeout(function(){ Z.statusNext(); }, Math.max(100, rem));
  Z.State.viewerProgressInterval = setInterval(function(){
    if(Z.State.viewerPaused) return;
    Z.State.viewerElapsed = Date.now() - Z.State.viewerStartTime;
    var pct = Math.min(100, (Z.State.viewerElapsed/Z.State.viewerDuration)*100);
    var b = document.getElementById('status-progress');
    if(b) b.style.width = pct + '%';
  }, 100);
};
Z.clearStatusTimer = function(){
  if(Z.State.viewerTimer){ clearTimeout(Z.State.viewerTimer); Z.State.viewerTimer = null; }
  if(Z.State.viewerProgressInterval){ clearInterval(Z.State.viewerProgressInterval); Z.State.viewerProgressInterval = null; }
};

Z.setupViewerGesture = function(){
  var body = document.getElementById('status-viewer-body');
  if(!body) return;
  var sx=0, sy=0, st=0, moved=false, holding=false, holdTimer=null;
  var SWIPE=55, TAP=14, TAPTIME=350, HOLDMS=250;
  function _start(x,y){
    sx=x; sy=y; st=Date.now(); moved=false; holding=false;
    if(holdTimer){ clearTimeout(holdTimer); holdTimer=null; }
    holdTimer = setTimeout(function(){ holding = true; Z.pauseStatusTimer(); }, HOLDMS);
  }
  function _move(x,y){
    if(Math.abs(x-sx)>TAP || Math.abs(y-sy)>TAP){
      moved=true;
      if(holdTimer){ clearTimeout(holdTimer); holdTimer=null; }
    }
  }
  function _end(x,y){
    if(holdTimer){ clearTimeout(holdTimer); holdTimer=null; }
    var dx=x-sx, dy=y-sy, el=Date.now()-st, ax=Math.abs(dx), ay=Math.abs(dy);
    if(holding){ holding=false; Z.resumeStatusTimer(); return; }
    if(ax>SWIPE && ax>ay*1.15){ if(dx<0) Z.statusNext(); else Z.statusPrev(); return; }
    if(ay>SWIPE && ay>ax*1.15){ if(dy<0) Z.advanceToNextContact(); else Z.advanceToPrevContact(); return; }
    if(!moved && el<TAPTIME){ Z.statusNext(); return; }
    Z.resumeStatusTimer();
  }
  body.addEventListener('touchstart', function(ev){
    if(ev.touches.length!==1) return;
    if(ev.target.closest('button')||ev.target.closest('video')||ev.target.closest('.status-caption-overlay')) return;
    _start(ev.touches[0].clientX, ev.touches[0].clientY);
  }, {passive:true});
  body.addEventListener('touchmove', function(ev){
    if(ev.touches.length!==1) return;
    _move(ev.touches[0].clientX, ev.touches[0].clientY);
  }, {passive:true});
  body.addEventListener('touchend', function(ev){
    if(!ev.changedTouches.length) return;
    if(ev.target.closest('button')||ev.target.closest('video')||ev.target.closest('.status-caption-overlay')) return;
    _end(ev.changedTouches[0].clientX, ev.changedTouches[0].clientY);
  }, {passive:true});
  var dn=false;
  body.addEventListener('mousedown', function(ev){
    if(ev.target.closest('button')||ev.target.closest('video')||ev.target.closest('.status-caption-overlay')) return;
    dn=true; _start(ev.clientX, ev.clientY);
  });
  body.addEventListener('mousemove', function(ev){ if(!dn) return; _move(ev.clientX, ev.clientY); });
  body.addEventListener('mouseup', function(ev){
    if(!dn) return;
    dn=false;
    if(ev.target.closest('button')||ev.target.closest('video')||ev.target.closest('.status-caption-overlay')) return;
    _end(ev.clientX, ev.clientY);
  });
  body.addEventListener('mouseleave', function(){ if(dn){ dn=false; Z.resumeStatusTimer(); } });
};

Z.advanceToNextContact = function(){
  var all = Z.getActiveStatuses();
  var map = {};
  all.forEach(function(s){ if(!map[s.author_id]) map[s.author_id]=[]; map[s.author_id].push(s); });
  var keys = Object.keys(map);
  if(keys.length <= 1){ Z.closeStatusViewer(); return; }
  var idx = keys.indexOf(Z.State.viewerAuthorId);
  Z.openStatusViewer(keys[(idx+1)%keys.length], 0);
};
Z.advanceToPrevContact = function(){
  var all = Z.getActiveStatuses();
  var map = {};
  all.forEach(function(s){ if(!map[s.author_id]) map[s.author_id]=[]; map[s.author_id].push(s); });
  var keys = Object.keys(map);
  if(keys.length <= 1){ Z.closeStatusViewer(); return; }
  var idx = keys.indexOf(Z.State.viewerAuthorId);
  Z.openStatusViewer(keys[(idx-1+keys.length)%keys.length], 0);
};
Z.statusPrev = function(){
  Z.clearStatusTimer();
  if(Z.State.viewerIndex > 0){ Z.State.viewerIndex--; Z.showStatusViewer(); }
  else Z.advanceToPrevContact();
};
Z.statusNext = function(){
  Z.clearStatusTimer();
  if(Z.State.viewerIndex < Z.State.viewerStatuses.length - 1){ Z.State.viewerIndex++; Z.showStatusViewer(); }
  else Z.advanceToNextContact();
};
Z.closeStatusViewer = function(){
  Z.clearStatusTimer();
  Z.State.viewerPaused = false;
  Z.State.captionWasPaused = false;
  var v = document.getElementById('status-viewer');
  if(v){
    v.querySelectorAll('video').forEach(function(vv){ try { vv.pause(); vv.src=''; } catch(e){} });
    v.remove();
  }
  Z.showView('status-home');
  setTimeout(function(){ Z.setupFeedVideoAutoplay(); }, 250);
};

})();
</script>

<script>
(function(){
'use strict';
var Z = window.Z;
if(!Z) return;

function trustTier(avg, reviewCount){
  if(!reviewCount || reviewCount < 3) return {cls:'tier-none', label:'No rating'};
  if(avg < 4)  return {cls:'tier-low',   label:'Low'};
  if(avg < 7)  return {cls:'tier-amber', label:'Fair'};
  if(avg < 9)  return {cls:'tier-green', label:'Good'};
  return {cls:'tier-blue', label:'Excellent'};
}
Z.trustTier = trustTier;

Z.goMySpace = function(){
  var me = Z.State.currentUser;
  if(!me){ Z.openAuthModal('login'); return; }
  Z.showView('public-profile', me.id);
};

Z.renderPublicProfile = function(userId){
  if(!userId){
    return Z.emptyState({ icon: 'fa-solid fa-user-slash', title: 'User not specified.' });
  }
  var shell =
    '<div id="space-root" style="display:flex;flex-direction:column;gap:14px;">' +
      '<div class="view-header">' +
        '<button class="colored-back-btn" onclick="Z.spaceBack()"><i class="fa-solid fa-arrow-left"></i> Back</button>' +
      '</div>' +
      '<div id="space-identity">' + Z._renderSpaceSkeleton() + '</div>' +
      '<div id="space-about-block"></div>' +
      '<div id="space-offer-block"></div>' +
      '<div id="space-posts-band"></div>' +
      '<div id="space-sparks-band"></div>' +
      '<div id="space-videos-band"></div>' +
    '</div>';
  setTimeout(function(){ Z._loadSpace(userId); }, 30);
  return shell;
};

Z._renderSpaceSkeleton = function(){
  return '<div style="background:#111827;border:1px solid #1e293b;border-radius:16px;padding:28px 20px;text-align:center;color:#64748b;">' +
    '<i class="fa-solid fa-circle-notch fa-spin" style="font-size:22px;color:#3b82f6;"></i>' +
    '<p style="font-size:12px;margin-top:10px;">Loading SPACE...</p>' +
  '</div>';
};

Z._loadSpace = async function(userId){
  var container = document.getElementById('space-identity');
  if(!container) return;
  Z.State.spaceUserId = userId;
  var me = Z.State.currentUser;
  var c = (Z.sb && Z.sb()) || null;
  var data = null;
  try {
    if(c){
      var r = await c.rpc('get_public_space', { p_user_id: userId });
      if(r.error) throw r.error;
      if(Array.isArray(r.data) && r.data.length) data = r.data[0];
    }
  } catch(e){}
  if(!data){
    var local = Z.getProfileById(userId);
    if(local){
      data = {
        id: local.id, name: local.name, username: local.username, avatar: local.avatar,
        cover: local.cover, profession: local.profession, bio: local.bio, package: local.package,
        space_data: local.space_data || {},
        connection_count: 0, posts_count: 0, sparks_count: 0, videos_count: 0,
        circles_count: 0, avg_rating: 0, rating_count: 0
      };
    }
  }
  if(!data){
    container.innerHTML = Z.emptyState({ icon: 'fa-solid fa-user-slash', title: 'User not found.' });
    return;
  }
  var arr = Z.State.allProfiles || [];
  if(!arr.some(function(x){ return x && x.id === data.id; })){
    Z.State.allProfiles = arr.concat([{
      id: data.id, name: data.name, username: data.username, avatar: data.avatar,
      cover: data.cover, profession: data.profession, bio: data.bio, package: data.package,
      space_data: data.space_data || {}
    }]);
  }
  container.innerHTML = Z._renderSpaceIdentity(data, me);

  var aboutEl = document.getElementById('space-about-block');
  if(aboutEl) aboutEl.innerHTML = Z._renderSpaceAboutBlock(data, me);
  var offerEl = document.getElementById('space-offer-block');
  if(offerEl) offerEl.innerHTML = Z._renderSpaceOfferBlock(data, me);

  await Z._loadSpaceContent(userId);
};

Z._loadSpaceContent = async function(userId){
  var c = (Z.sb && Z.sb()) || null;
  if(!c) return;
  var me = Z.State.currentUser;

  var postsBand = document.getElementById('space-posts-band');
  try {
    var rp = await c.from('posts').select('*').eq('author_id', userId).order('created_at', {ascending:false}).limit(20);
    Z.State.spacePosts = rp.data || [];
    Z.State.spacePosts.forEach(function(p){ p.reactions = p.reactions || {}; p._myReactions = p._myReactions || {}; p._comments = p._comments || []; Z._backfillItem(p, false); });
    if(Z.State.spacePosts.length){
      var ids = Z.State.spacePosts.map(function(p){ return p.id; });
      var rPr = await c.from('post_reactions').select('post_id, reaction, user_id').in('post_id', ids);
      (rPr.data||[]).forEach(function(x){
        var p = Z.State.spacePosts.find(function(pp){ return pp.id === x.post_id; });
        if(!p) return;
        if(!p.reactions) p.reactions = {};
        p.reactions[x.reaction] = (p.reactions[x.reaction]||0)+1;
        if(me && x.user_id === me.id){ if(!p._myReactions) p._myReactions = {}; p._myReactions[x.reaction] = true; }
      });
      var rC = await c.from('comments').select('*').in('post_id', ids).order('created_at', {ascending:true});
      var cmts = rC.data || [];
      var byPost = {};
      cmts.forEach(function(cm){ if(!byPost[cm.post_id]) byPost[cm.post_id] = []; byPost[cm.post_id].push(cm); });
      Z.State.spacePosts.forEach(function(p){
        var list = byPost[p.id] || [];
        var byId = {};
        list.forEach(function(x){ byId[x.id] = x; x._replies = []; x._reactionCounts = {}; x._myReactions = {}; });
        list.forEach(function(x){ if(x.parent_id && byId[x.parent_id]) byId[x.parent_id]._replies.push(x); });
        p._comments = list.filter(function(x){ return !x.parent_id; });
      });
    }
  } catch(e){ Z.State.spacePosts = []; }
  if(postsBand) postsBand.innerHTML = Z._renderSpacePostsBand();

  try {
    var rs = await c.from('sparks').select('*').eq('author_id', userId).eq('type', 'spark').order('created_at', {ascending:false}).limit(20);
    Z.State.spaceSparks = rs.data || [];
    Z.State.spaceSparks.forEach(function(s){ Z._backfillItem(s, true); });
  } catch(e){ Z.State.spaceSparks = []; }
  var sparksBand = document.getElementById('space-sparks-band');
  if(sparksBand) sparksBand.innerHTML = Z._renderSpaceSparksBand();

  try {
    var rv = await c.from('sparks').select('*').eq('author_id', userId).eq('type', 'long_video').order('created_at', {ascending:false}).limit(20);
    Z.State.spaceVideos = rv.data || [];
    Z.State.spaceVideos.forEach(function(v){ Z._backfillItem(v, true); });
  } catch(e){ Z.State.spaceVideos = []; }
  var videosBand = document.getElementById('space-videos-band');
  if(videosBand) videosBand.innerHTML = Z._renderSpaceVideosBand();

  Z._tagMediaContainers();
};

Z._renderSpacePostsBand = function(){
  var posts = (Z.State.spacePosts || []).slice(0, 5);
  var total = (Z.State.spacePosts || []).length;
  var html = '<div style="background:#111827;border:1px solid #1e293b;border-radius:16px;padding:16px;">';
  html += '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">';
  html += '<div style="font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.06em;"><i class="fa-regular fa-newspaper" style="color:#10b981;margin-right:6px;"></i>Posts</div>';
  html += '<div style="font-size:10px;color:#64748b;">' + total + ' total</div>';
  html += '</div>';
  if(!posts.length){
    html += '<div style="padding:20px;text-align:center;color:#64748b;font-size:11px;">No posts yet.</div>';
  } else {
    var me = Z.State.currentUser;
    posts.forEach(function(p){ html += Z.renderPostCard(p, Z.State.allProfiles, me); });
    if(total > 5){
      html += '<button onclick="Z.showView(\'space-posts-all\',\'' + Z.escape(Z.State.spaceUserId) + '\')" style="width:100%;background:transparent;border:1px solid #1e293b;color:#10b981;font-weight:700;padding:10px;border-radius:10px;font-size:12px;cursor:pointer;margin-top:4px;">View All Posts</button>';
    }
  }
  html += '</div>';
  return html;
};

  }

};

Z._renderSpaceVideosBand = function(){
  var videos = (Z.State.spaceVideos || []);

  html += '<div style="font-size:11px;font-weight:700;color:#94a3b8;text-transform:uppercase;letter-spacing:.06em;"><i class="fa-solid fa-film" style="color:#10b981;margin-right:6px;"></i>Full Videos</div>';

        '<div style="height:180px;background:#000;">' +
          '<video src="' + Z.escape(v.video_url) + '" preload="metadata" playsinline controls data-space-spark="1" style="width:100%;height:100%;object-fit:cover;background:#000;"></video>' +

        (v.title ? '<div style="padding:8px 10px;font-size:11px;font-weight:700;color:#fff;background:#0f172a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">' + Z.escape(v.title) + '</div>' : '') +
